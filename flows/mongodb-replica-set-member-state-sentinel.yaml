id: mongodb-replica-set-member-state-sentinel
namespace: company.team

inputs:
  - id: mongo_uri
    type: STRING
    defaults: "{{ secret('MONGO_URI') }}"

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: fetch_replica_set_status
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    commands:
      - |
        mongosh --quiet --uri '{{ inputs.mongo_uri }}' \
          --eval 'JSON.stringify(rs.status().members.map(m=>({name:m.name,state:m.stateStr,health:m.health,lastHeartbeatMessage:m.lastHeartbeatMessage||""})))' \
          > /tmp/rs_status.json
        cat /tmp/rs_status.json
        UNHEALTHY=$(jq '[.[] | select(.state == "RECOVERING" or .state == "ROLLBACK" or .health != 1)] | length' /tmp/rs_status.json)
        echo "unhealthy_count=$UNHEALTHY" >> /tmp/rs_vars.env
        DETAILS=$(jq '[.[] | select(.state == "RECOVERING" or .state == "ROLLBACK" or .health != 1) | "\(.name): state=\(.state), health=\(.health), msg=\(.lastHeartbeatMessage)"] | join("\n")' /tmp/rs_status.json)
        echo "unhealthy_details=$DETAILS" >> /tmp/rs_vars.env
    outputFiles:
      - /tmp/rs_status.json
      - /tmp/rs_vars.env

  - id: evaluate_replica_set_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.fetch_replica_set_status.vars.unhealthy_count | default(0) | int > 0 }}"
    then:
      - id: alert_replica_set_degraded
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret(\"SLACK_WEBHOOK\") }}"
        payload: |
          {
            "text": ":rotating_light: *MongoDB Replica Set Health Alert*\n*Unhealthy Members:* {{ outputs.fetch_replica_set_status.vars.unhealthy_count }}\n*Details:*\n{{ outputs.fetch_replica_set_status.vars.unhealthy_details | default('See Kestra logs for full rs.status() output') }}\nMembers in RECOVERING or ROLLBACK state or health != 1 require immediate attention."
          }
    else:
      - id: log_replica_set_healthy
        type: io.kestra.plugin.core.log.Log
        message: "MongoDB replica set is healthy. All members are in PRIMARY or SECONDARY state with health=1."

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret(\"SLACK_WEBHOOK\") }}"
    payload: |
      {
        "text": ":x: *MongoDB Replica Set Sentinel Failed*\n*Flow:* {{ flow.id }}\n*Execution:* {{ execution.id }}\n*Error:* {{ execution.error.message | default('Unknown error') }}\nCheck Kestra UI for details."
      }

extend:
  title: MongoDB Replica Set Member State and Health Sentinel
  shortDescription: Monitor all MongoDB replica set members for non-healthy states (RECOVERING, ROLLBACK, health != 1) using mongosh and alert Slack on degradation.
  metaTitle: MongoDB Replica Set Member State Sentinel — Kestra Blueprint
  metaDescription: Detect MongoDB replica set members in RECOVERING or ROLLBACK state or with health != 1 using mongosh rs.status(). Alert your team via Slack before the degradation impacts application writes.
  description: |
    A MongoDB replica set is only as resilient as its weakest member. When a secondary enters RECOVERING state — due to lagging replication, an oplog gap, or a network partition — the effective read capacity of the replica set shrinks. A ROLLBACK state indicates a former primary is reconciling writes that diverged after a failover, which can result in data loss if not caught early. This sentinel checks the health of every replica set member on every run and surfaces degraded members before they affect application availability.

    ## How it works

    1. The `fetch_replica_set_status` task (`io.kestra.plugin.scripts.shell.Commands`) runs `mongosh --quiet` against `inputs.mongo_uri` (backed by the `MONGO_URI` secret) and evaluates `rs.status().members` to produce a JSON array with each member's name, `stateStr`, `health`, and `lastHeartbeatMessage`.
    2. The same script pipes the JSON through `jq` to count and format members whose state is `RECOVERING` or `ROLLBACK`, or whose `health` field is not `1`.
    3. The `evaluate_replica_set_health` task (`io.kestra.plugin.core.flow.If`) branches on whether any unhealthy members were found. A non-zero count triggers an `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` alert listing each affected member's name, state, health value, and last heartbeat message.
    4. The top-level `errors` block fires a separate Slack notification if the sentinel pipeline itself fails.

    ## What you get

    - Complete per-member replica set status extracted directly from `rs.status()` using the official MongoDB shell.
    - A Slack alert that names each degraded member with its state, health value, and heartbeat message so on-call engineers can begin triage immediately.
    - Automatic detection of `ROLLBACK` state, which many monitoring tools omit despite its high data-loss risk.

    ## Who it's for

    - Database administrators and SRE teams managing MongoDB replica sets in production.
    - Application teams whose services write to a MongoDB primary and need guaranteed read-from-secondary fallback.
    - Platform engineers who need automated health checks without deploying MongoDB Ops Manager or Atlas.

    ## Why orchestrate this with Kestra

    MongoDB Atlas provides built-in alerting, but self-managed replica sets have no equivalent without Ops Manager. Prometheus with the mongodb_exporter covers metrics but requires an additional agent on each host. Kestra runs the same `mongosh` command that a DBA would run manually, applies the health logic declaratively, and delivers the result to Slack — all from a single YAML file with a complete execution audit trail.

    ## Prerequisites

    - `mongosh` installed and on the PATH of the Kestra worker host.
    - `jq` installed on the Kestra worker host.
    - A Kestra secret named `MONGO_URI` containing the MongoDB connection URI (including credentials and replica set name, e.g., `mongodb://user:pass@host1:27017,host2:27017/?replicaSet=rs0`).
    - A Kestra secret named `SLACK_WEBHOOK` containing the Slack incoming webhook URL.

    ## Quick start

    1. Store your MongoDB replica set URI in a Kestra secret named `MONGO_URI`.
    2. Store your Slack webhook URL in a Kestra secret named `SLACK_WEBHOOK`.
    3. Enable the schedule trigger (runs every 15 minutes by default).
    4. Trigger a manual execution and inspect `/tmp/rs_status.json` in the task outputs to verify the replica set member list.

    ## How to extend

    - Add a replication lag check by comparing `optimeDate` across members in the `rs.status()` output and alerting when lag exceeds a configurable threshold.
    - Combine with the MongoDB oplog window sentinel to correlate replication lag with oplog exhaustion risk.
    - Write the member state snapshot to S3 or a time-series store for historical trending and MTTR analysis.
    - Add a remediation step that calls `rs.freeze(0)` on RECOVERING secondaries to accelerate re-sync via `mongosh --eval`.

    ## Links

    - [MongoDB rs.status() Reference](https://www.mongodb.com/docs/manual/reference/method/rs.status/)
    - [MongoDB Replica Set Member States](https://www.mongodb.com/docs/manual/reference/replica-states/)
    - [Kestra Shell Commands plugin](https://kestra.io/plugins/plugin-script-shell)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  ee: false
  demo: false
