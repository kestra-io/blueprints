id: mongodb-replica-set-member-state-sentinel
namespace: company.team

inputs:
  - id: mongo_uri
    type: STRING
    defaults: "{{ secret('MONGO_URI') }}"

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: fetch_replica_set_status
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    dependencies:
      - pymongo==4.15.3
      - kestra==2.0.0
    script: |
      from pymongo import MongoClient
      import sys
      from kestra import Kestra

      mongo_uri = "{{ inputs.mongo_uri }}"
      try:
          client = MongoClient(mongo_uri, serverSelectionTimeoutMS=5000)
          rs_status = client.admin.command("replSetGetStatus")
          members = rs_status.get("members", [])

          unhealthy_members = []
          for m in members:
              name = m.get("name", "")
              state = m.get("stateStr", "")
              health = m.get("health", 1)
              msg = m.get("lastHeartbeatMessage", "")
              if state in ["RECOVERING", "ROLLBACK"] or health != 1:
                  unhealthy_members.append(f"{name}: state={state}, health={health}, msg={msg}")

          unhealthy_count = len(unhealthy_members)
          unhealthy_details = "\n".join(unhealthy_members) if unhealthy_members else "All members healthy"

          print(f"Total members: {len(members)}, Unhealthy count: {unhealthy_count}")

          Kestra.outputs({
              "unhealthy_count": unhealthy_count,
              "unhealthy_details": unhealthy_details,
              "total_members": len(members)
          })
      except Exception as e:
          print(f"Error querying MongoDB replica set status: {e}", file=sys.stderr)
          sys.exit(1)

  - id: evaluate_replica_set_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.fetch_replica_set_status.vars.unhealthy_count | int > 0 }}"
    then:
      - id: alert_replica_set_degraded
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":rotating_light: *MongoDB Replica Set Health Alert*\n*Unhealthy Members:* {{ outputs.fetch_replica_set_status.vars.unhealthy_count }}\n*Details:*\n{{ outputs.fetch_replica_set_status.vars.unhealthy_details }}\nMembers in RECOVERING or ROLLBACK state or health != 1 require immediate attention."
          }
    else:
      - id: log_replica_set_healthy
        type: io.kestra.plugin.core.log.Log
        message: "MongoDB replica set is healthy. All members are in PRIMARY or SECONDARY state with health=1."

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":x: *MongoDB Replica Set Sentinel Failed*\n*Flow:* {{ flow.id }}\n*Execution:* {{ execution.id }}\n*Error:* Check Kestra UI for details."
      }

outputs:
  - id: unhealthy_count
    type: INT
    value: "{{ outputs.fetch_replica_set_status.vars.unhealthy_count }}"
  - id: unhealthy_details
    type: STRING
    value: "{{ outputs.fetch_replica_set_status.vars.unhealthy_details }}"
  - id: total_members
    type: INT
    value: "{{ outputs.fetch_replica_set_status.vars.total_members }}"

extend:
  title: MongoDB Replica Set Member State and Health Sentinel
  shortDescription: Monitor all MongoDB replica set members for non-healthy states (RECOVERING, ROLLBACK, health != 1) using PyMongo and alert Slack on degradation.
  metaTitle: MongoDB Replica Set Member State Sentinel, Kestra Blueprint
  metaDescription: Detect MongoDB replica set members in RECOVERING or ROLLBACK state or with health != 1 using PyMongo replSetGetStatus. Alert your team via Slack before the degradation impacts application writes.
  description: |
    A MongoDB replica set is only as resilient as its weakest member. When a secondary enters RECOVERING state, due to lagging replication, an oplog gap, or a network partition, the effective read capacity of the replica set shrinks. A ROLLBACK state indicates a former primary is reconciling writes that diverged after a failover, which can result in data loss if not caught early. This sentinel checks the health of every replica set member on every run and surfaces degraded members before they affect application availability.

    ## How it works

    1. The `fetch_replica_set_status` task (`io.kestra.plugin.scripts.python.Script`) runs inside a Docker container against `inputs.mongo_uri` and evaluates `replSetGetStatus` to produce health telemetry for each member.
    2. Any member whose state is `RECOVERING` or `ROLLBACK`, or whose `health` field is not `1`, is flagged as unhealthy.
    3. The `evaluate_replica_set_health` task (`io.kestra.plugin.core.flow.If`) branches on whether any unhealthy members were found. A non-zero count triggers an `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` alert listing each affected member's name, state, health value, and last heartbeat message.
    4. The top-level `errors` block fires a separate Slack notification if the sentinel pipeline itself fails.

    ## What you get

    - Complete per-member replica set status extracted directly from `replSetGetStatus` using official PyMongo driver.
    - A Slack alert that names each degraded member with its state, health value, and heartbeat message so on-call engineers can begin triage immediately.
    - Automatic detection of `ROLLBACK` state, which many monitoring tools omit despite its high data-loss risk.

    ## Who it's for

    - Database administrators and SRE teams managing MongoDB replica sets in production.
    - Application teams whose services write to a MongoDB primary and need guaranteed read-from-secondary fallback.
    - Platform engineers who need automated health checks without deploying MongoDB Ops Manager or Atlas.

    ## Why orchestrate this with Kestra

    MongoDB Atlas provides built-in alerting, but self-managed replica sets have no equivalent without Ops Manager. Prometheus with the mongodb_exporter covers metrics but requires an additional agent on each host. Kestra runs clean Python checks inside Docker, applies the health logic declaratively, and delivers the result to Slack, all from a single YAML file with a complete execution audit trail.

    ## Prerequisites

    - A Kestra secret named `MONGO_URI` containing the MongoDB connection URI (including credentials and replica set name, e.g., `mongodb://user:pass@host1:27017,host2:27017/?replicaSet=rs0`).
    - A Kestra secret named `SLACK_WEBHOOK` containing the Slack incoming webhook URL.

    ## Quick start

    1. Store your MongoDB replica set URI in a Kestra secret named `MONGO_URI`.
    2. Store your Slack webhook URL in a Kestra secret named `SLACK_WEBHOOK`.
    3. Enable the schedule trigger (runs every 15 minutes by default).
    4. Trigger a manual execution and inspect task outputs to verify the replica set member list.

    ## Links

    - [MongoDB replSetGetStatus Reference](https://www.mongodb.com/docs/manual/reference/command/replSetGetStatus/)
    - [MongoDB Replica Set Member States](https://www.mongodb.com/docs/manual/reference/replica-states/)
    - [Kestra Python plugin](https://kestra.io/plugins/plugin-script-python)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
