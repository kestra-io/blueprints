id: postgres-hot-standby-conflict-and-query-cancellation-sentinel
namespace: company.database

inputs:
  - id: standby_host
    type: STRING
    displayName: Standby PostgreSQL Host
    description: Hostname or IP address of the read replica instance under surveillance.
    defaults: "localhost"

  - id: standby_port
    type: INT
    displayName: Standby Port
    description: TCP port for the PostgreSQL standby service (standard default 5432).
    defaults: 5432

  - id: database_name
    type: STRING
    displayName: Database Name
    description: Target PostgreSQL database catalog to audit for recovery conflicts.
    defaults: "postgres"

  - id: db_username
    type: STRING
    displayName: Database Username
    description: Database user with SELECT permissions on pg_stat_database_conflicts and pg_stat_activity.
    defaults: "postgres"

  - id: long_query_threshold_seconds
    type: INT
    displayName: Long Query Age Threshold (Seconds)
    description: Query duration threshold in seconds on the standby before raising a replication stall warning.
    defaults: 25

  - id: max_lag_bytes_threshold
    type: INT
    displayName: Maximum Replication Lag (Bytes)
    description: Byte delay threshold between received and replayed WAL positions before flagging a replication stall.
    defaults: 67108864

triggers:
  - id: standby_conflict_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Recurring audit running every 15 minutes to evaluate recovery conflicts and replication lag on the standby replica.
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_standby_metrics
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Query pg_stat_database_conflicts and pg_stat_activity to extract conflict counts, active long queries, and WAL replay lag.
    url: "jdbc:postgresql://{{ inputs.standby_host }}:{{ inputs.standby_port }}/{{ inputs.database_name }}"
    username: "{{ inputs.db_username }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH_ONE
    allowFailure: true
    sql: |
      SELECT
          pg_is_in_recovery() AS is_standby,
          COALESCE(pg_wal_lsn_diff(pg_last_wal_receive_lsn(), pg_last_wal_replay_lsn()), 0) AS replication_lag_bytes,
          COALESCE(c.confl_tablespace, 0) AS confl_tablespace,
          COALESCE(c.confl_lock, 0) AS confl_lock,
          COALESCE(c.confl_snapshot, 0) AS confl_snapshot,
          COALESCE(c.confl_bufferpin, 0) AS confl_bufferpin,
          COALESCE(c.confl_deadlock, 0) AS confl_deadlock,
          (COALESCE(c.confl_tablespace, 0) + COALESCE(c.confl_lock, 0) + COALESCE(c.confl_snapshot, 0) + COALESCE(c.confl_bufferpin, 0) + COALESCE(c.confl_deadlock, 0)) AS total_conflicts,
          (SELECT count(*) FROM pg_stat_activity WHERE backend_type = 'client backend' AND state = 'active' AND pid <> pg_backend_pid() AND (clock_timestamp() - query_start) > (INTERVAL '1 second' * {{ inputs.long_query_threshold_seconds }})) AS active_long_queries_count,
          (SELECT COALESCE(max(ROUND(EXTRACT(EPOCH FROM (clock_timestamp() - query_start)))), 0) FROM pg_stat_activity WHERE backend_type = 'client backend' AND state = 'active' AND pid <> pg_backend_pid()) AS oldest_query_runtime_seconds
      FROM pg_stat_database_conflicts c
      WHERE c.datname = current_database();

  - id: get_previous_baseline
    type: io.kestra.plugin.core.kv.Get
    description: Retrieve the previous total conflicts baseline recorded in Kestra namespace KV storage.
    key: "postgres_standby_conflicts_{{ inputs.standby_host }}_{{ inputs.database_name }}"
    errorOnMissing: false

  - id: classify_conflict_status
    type: io.kestra.plugin.core.debug.Return
    description: Classify standby health by evaluating new recovery cancellations, replication lag, and active query age against SLA baselines.
    format: |
      {{
        (outputs.probe_standby_metrics.row is not defined or outputs.probe_standby_metrics.row is null) ? 'UNREACHABLE' :
        (outputs.probe_standby_metrics.row.is_standby == false) ? 'NOT_A_STANDBY' :
        ((outputs.probe_standby_metrics.row.total_conflicts - (outputs.get_previous_baseline.value ?? outputs.probe_standby_metrics.row.total_conflicts)) > 0) ? 'CANCELLATION_STORM' :
        (outputs.probe_standby_metrics.row.replication_lag_bytes > inputs.max_lag_bytes_threshold or (outputs.probe_standby_metrics.row.active_long_queries_count > 0 and outputs.probe_standby_metrics.row.oldest_query_runtime_seconds > inputs.long_query_threshold_seconds)) ? 'REPLICATION_STALL_RISK' :
        'HEALTHY'
      }}

  - id: route_by_conflict_status
    type: io.kestra.plugin.core.flow.Switch
    description: Route incident notifications and operational confirmations based on evaluated standby recovery conflict state.
    value: "{{ outputs.classify_conflict_status.value }}"
    cases:
      HEALTHY:
        - id: log_healthy_status
          type: io.kestra.plugin.core.log.Log
          description: Log confirmation that standby replication is synchronized with zero new query recovery cancellations.
          message: "HEALTHY: PostgreSQL standby '{{ inputs.standby_host }}:{{ inputs.standby_port }}' synchronized. Zero new recovery cancellations (Lifetime conflicts: {{ outputs.probe_standby_metrics.row.total_conflicts }}, Replay lag: {{ outputs.probe_standby_metrics.row.replication_lag_bytes }} bytes, Long queries: {{ outputs.probe_standby_metrics.row.active_long_queries_count }})."

      CANCELLATION_STORM:
        - id: alert_cancellation_storm
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Dispatch urgent Slack incident alert when active client queries are terminated by PostgreSQL recovery conflict resolution.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": ":rotating_light: *CRITICAL: PostgreSQL Standby Recovery Conflict Cancellations Detected*\n*Host:* `{{ inputs.standby_host }}:{{ inputs.standby_port }}` | *Database:* `{{ inputs.database_name }}`\n*New Cancellations:* `{{ outputs.probe_standby_metrics.row.total_conflicts - (outputs.get_previous_baseline.value ?? outputs.probe_standby_metrics.row.total_conflicts) }}` in last evaluation interval (Lifetime: `{{ outputs.probe_standby_metrics.row.total_conflicts }}`)\n*Breakdown:* Snapshot conflicts: `{{ outputs.probe_standby_metrics.row.confl_snapshot }}` | Lock conflicts: `{{ outputs.probe_standby_metrics.row.confl_lock }}` | Deadlock conflicts: `{{ outputs.probe_standby_metrics.row.confl_deadlock }}`\n*Replication Lag:* `{{ outputs.probe_standby_metrics.row.replication_lag_bytes }}` bytes\n*Mitigation:* Check long-running queries on standby; consider tuning `max_standby_streaming_delay` or scheduling analytical batches off-peak."
            }

      REPLICATION_STALL_RISK:
        - id: alert_replication_stall
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Dispatch warning alert when long-running standby queries pin WAL replay and risk triggering cancellation timeouts.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": ":warning: *PostgreSQL Standby Replication Stall Warning*\n*Host:* `{{ inputs.standby_host }}:{{ inputs.standby_port }}` | *Database:* `{{ inputs.database_name }}`\n*Active Long Queries:* `{{ outputs.probe_standby_metrics.row.active_long_queries_count }}` query(ies) exceeding `{{ inputs.long_query_threshold_seconds }}`s (Oldest: `{{ outputs.probe_standby_metrics.row.oldest_query_runtime_seconds }}`s)\n*Current Lag:* `{{ outputs.probe_standby_metrics.row.replication_lag_bytes }}` bytes (Threshold: `{{ inputs.max_lag_bytes_threshold }}` bytes)\n*Risk:* Standby WAL replay is delayed waiting for client queries; queries approaching `max_standby_streaming_delay` face imminent cancellation."
            }

      NOT_A_STANDBY:
        - id: alert_not_a_standby
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Dispatch configuration advisory alert when target database instance is operating as a primary rather than a standby replica.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": ":information_source: *PostgreSQL Configuration Advisory: Host is Primary*\n*Host:* `{{ inputs.standby_host }}:{{ inputs.standby_port }}`\n*Status:* `pg_is_in_recovery()` returned `false`. This instance is a primary read/write node, not a standby replica. Update `standby_host` to target an active read replica."
            }

      UNREACHABLE:
        - id: alert_unreachable_standby
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Dispatch urgent Slack alert when standby PostgreSQL server cannot be contacted over JDBC.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": ":satellite_antenna: *PostgreSQL Standby Unreachable*\n*Host:* `{{ inputs.standby_host }}:{{ inputs.standby_port }}`\n*Status:* Unable to establish JDBC connection to query recovery statistics. Verify PostgreSQL replica container availability and network connectivity."
            }

  - id: update_conflict_baseline
    type: io.kestra.plugin.core.kv.Set
    description: Record current total conflict count in Kestra namespace KV storage to establish baseline for subsequent interval delta calculation.
    key: "postgres_standby_conflicts_{{ inputs.standby_host }}_{{ inputs.database_name }}"
    value: "{{ outputs.probe_standby_metrics.row.total_conflicts ?? 0 }}"

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Record immutable audit trail of standby conflict verification and replication metrics for operational compliance.
    message: |
      [AUDIT] PostgreSQL Hot Standby Conflict Sentinel completed.
      Host: {{ inputs.standby_host }}:{{ inputs.standby_port }} | Database: {{ inputs.database_name }}
      Classification: {{ outputs.classify_conflict_status.value }}
      Is Standby: {{ outputs.probe_standby_metrics.row.is_standby ?? false }}
      Total Conflicts: {{ outputs.probe_standby_metrics.row.total_conflicts ?? 0 }}
      New Conflicts Delta: {{ (outputs.probe_standby_metrics.row.total_conflicts ?? 0) - (outputs.get_previous_baseline.value ?? (outputs.probe_standby_metrics.row.total_conflicts ?? 0)) }}
      Snapshot Conflicts: {{ outputs.probe_standby_metrics.row.confl_snapshot ?? 0 }} | Lock Conflicts: {{ outputs.probe_standby_metrics.row.confl_lock ?? 0 }}
      Replication Lag Bytes: {{ outputs.probe_standby_metrics.row.replication_lag_bytes ?? 0 }}
      Active Long Queries: {{ outputs.probe_standby_metrics.row.active_long_queries_count ?? 0 }} (Oldest: {{ outputs.probe_standby_metrics.row.oldest_query_runtime_seconds ?? 0 }}s)
      Execution ID: {{ execution.id }}

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack if the PostgreSQL standby sentinel flow encounters an unhandled runtime error.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": ":rotating_light: *PostgreSQL Standby Sentinel Flow Error*\nFlow `{{ flow.id }}` failed unexpectedly during execution `{{ execution.id }}`. Standby monitoring is interrupted; inspect task execution logs."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.classify_conflict_status.value }}"
  - id: total_conflicts
    type: INT
    value: "{{ outputs.probe_standby_metrics.row.total_conflicts ?? 0 }}"
  - id: replication_lag_bytes
    type: INT
    value: "{{ outputs.probe_standby_metrics.row.replication_lag_bytes ?? 0 }}"

extend:
  title: PostgreSQL Hot Standby Conflict and Query Cancellation Sentinel
  metaTitle: PostgreSQL Hot Standby Conflict Sentinel | Kestra
  shortDescription: Periodically audit PostgreSQL read replicas for recovery conflicts, track query cancellations from primary vacuum operations, and alert Slack on replication stalls.
  metaDescription: Audit PostgreSQL read replica recovery conflicts with Kestra, detect query cancellations from WAL replay, and alert Slack on replication delay.
  description: |
    PostgreSQL read replicas running streaming replication frequently encounter hot standby recovery conflicts when WAL replay from the primary (such as vacuum cleanup or table locks) clashes with long-running analytical queries executing on the standby. When the replication delay threshold (`max_standby_streaming_delay`) is exceeded, PostgreSQL abruptly terminates client queries with recovery conflict errors, causing sudden analytical pipeline failures and dashboard outages. This blueprint connects directly to PostgreSQL read replicas on a recurring schedule, queries `pg_stat_database_conflicts` alongside active query runtimes, tracks conflict delta baselines in Kestra KV storage, detects query cancellation storms, and alerts Slack with actionable diagnostics.

    ## How it works

    1. `probe_standby_metrics` (`io.kestra.plugin.jdbc.postgresql.Query`) connects to the standby database instance and executes an analytical query against `pg_stat_database_conflicts`, `pg_stat_activity`, and PostgreSQL WAL functions. It captures recovery state (`pg_is_in_recovery()`), calculates byte replication lag (`pg_wal_lsn_diff`), extracts granular conflict metrics (`confl_snapshot`, `confl_lock`, `confl_deadlock`, `confl_bufferpin`), and counts active queries exceeding `long_query_threshold_seconds`. `allowFailure: true` ensures network connection failures are caught gracefully.
    2. `get_previous_baseline` (`io.kestra.plugin.core.kv.Get`) retrieves the total conflicts counter recorded during the prior run from Kestra namespace KV storage.
    3. `classify_conflict_status` (`io.kestra.plugin.core.debug.Return`) evaluates operational state using declarative Pebble expressions:
       - `UNREACHABLE`: The standby endpoint could not be contacted over JDBC.
       - `NOT_A_STANDBY`: The target host is a primary read/write node rather than a standby replica.
       - `CANCELLATION_STORM`: New recovery conflicts occurred since the prior run (delta > 0), indicating active client queries were cancelled.
       - `REPLICATION_STALL_RISK`: No cancellations yet, but replication lag exceeds `max_lag_bytes_threshold` or long-running queries are actively pinning recovery.
       - `HEALTHY`: Standby replication is synchronized with zero new cancellations.
    4. `route_by_conflict_status` (`io.kestra.plugin.core.flow.Switch`) branches on the evaluated status:
       - `HEALTHY`: Emits an informational log confirming nominal replication position.
       - `CANCELLATION_STORM`: Dispatches an incident alert to Slack containing exact conflict category breakdowns, replication delay, and tuning advice.
       - `REPLICATION_STALL_RISK`: Alerts database operators to impending cancellation risks from active analytical queries.
       - `NOT_A_STANDBY`: Advises operators of target configuration mismatch.
       - `UNREACHABLE`: Dispatches an urgent endpoint offline alert to on-call teams.
    5. `update_conflict_baseline` (`io.kestra.plugin.core.kv.Set`) saves the current conflict count to namespace KV storage to establish the baseline for the next interval.
    6. `log_audit_summary` (`io.kestra.plugin.core.log.Log`) writes an immutable summary log entry across all executions for auditability.
    7. The top-level `errors` handler dispatches a Slack webhook alert if any unexpected task error occurs, preventing silent monitoring blackouts.
    8. `standby_conflict_schedule` triggers the sentinel recurringly every 15 minutes (configured with `disabled: true` for safe onboarding).

    ## What you get

    - Proactive visibility into PostgreSQL read replica query cancellations before users report broken dashboards.
    - Differential tracking using Kestra KV store to alert on fresh cancellation spikes rather than cumulative lifetime totals.
    - Granular conflict root-cause attribution distinguishing vacuum snapshot conflicts from DDL table lock conflicts.
    - Early warning alerting when long-running queries pin WAL replay and cause replica replication lag to spike.
    - Continuous audit trail in Kestra execution history for database reliability trend analysis.

    ## Who it's for

    - Database Reliability Engineers (DBREs) and Platform Engineers maintaining PostgreSQL replication topologies.
    - Analytics Engineers and Data Engineers running heavy BI queries and data extraction jobs on read replicas.
    - Site Reliability Engineers (SREs) monitoring database high-availability and query failure rates.

    ## Why orchestrate this with Kestra

    Ad-hoc monitoring scripts and metric scrapers lack stateful differential tracking across runs and require maintaining separate cron daemons and unencrypted credentials. Kestra orchestrates the monitoring lifecycle declaratively with encrypted secret management, built-in key-value persistence for delta calculations, visual execution timelines, and seamless integration into automated escalation workflows.

    ## Prerequisites

    - A running PostgreSQL standby replica (accessible locally via Docker `postgres:16` or over the network).
    - A database user account with `SELECT` privileges on `pg_stat_database_conflicts` and `pg_stat_activity`.
    - A Slack Incoming Webhook URL for receiving incident notifications.

    ### Secrets

    - `POSTGRES_PASSWORD`: Database user password for connecting to the PostgreSQL standby replica (required).
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used for dispatching alert messages (required).

    ## Quick start

    1. Configure the `POSTGRES_PASSWORD` and `SLACK_WEBHOOK_URL` secrets in your Kestra namespace.
    2. Import this blueprint into your Kestra instance and adjust `standby_host` and `standby_port` to point to your PostgreSQL read replica.
    3. Click **Execute** to run a manual verification pass.
    4. Verify execution logs and check that `status` outputs `HEALTHY`.
    5. Enable the `standby_conflict_schedule` trigger to begin automated recurring standby health monitoring.

    ## How to extend

    - Add automated query cancellation: In the `REPLICATION_STALL_RISK` branch, integrate a task invoking `pg_cancel_backend(pid)` to gracefully terminate offending analytical queries before replication lag breaches SLA limits.
    - Add multi-channel escalation: Route `CANCELLATION_STORM` alerts to PagerDuty or Opsgenie using Kestra notification plugins for immediate off-hours paging.
    - Export metrics: Append a DuckDB or Prometheus push task to graph recovery conflict frequency and replication lag trends over time.

    ## Links

    - [Kestra PostgreSQL Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-postgres)
    - [Kestra Slack Notifications Plugin](https://kestra.io/plugins/plugin-notifications)
    - [PostgreSQL Hot Standby Conflict Documentation](https://www.postgresql.org/docs/current/hot-standby.html)
    - [PostgreSQL pg_stat_database_conflicts Documentation](https://www.postgresql.org/docs/current/monitoring-stats.html#MONITORING-PG-STAT-DATABASE-CONFLICTS-VIEW)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
