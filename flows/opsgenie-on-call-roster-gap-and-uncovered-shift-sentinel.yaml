id: opsgenie-on-call-roster-gap-and-uncovered-shift-sentinel
namespace: company.operations

inputs:
  - id: opsgenie_api_endpoint
    type: URI
    displayName: Opsgenie API Endpoint
    defaults: "https://api.opsgenie.com/v2"
    description: "Base URL for Opsgenie REST API (US: api.opsgenie.com, EU: api.eu.opsgenie.com)."

  - id: target_schedule_identifier
    type: STRING
    displayName: Schedule Identifier
    defaults: "core-platform-tier1-schedule"
    description: Name or ID of the Opsgenie schedule rotation to audit for coverage gaps.

  - id: audit_lookahead_days
    type: INT
    displayName: Lookahead Horizon (Days)
    defaults: 7
    description: Number of upcoming days to inspect for uncovered shifts or empty rotations.

triggers:
  - id: opsgenie_gap_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Opsgenie on-call rotations daily at 06:00 UTC. Shipped disabled by default.
    cron: "0 6 * * *"
    disabled: true

tasks:
  - id: audit_schedule_coverage
    type: io.kestra.plugin.scripts.python.Script
    description: Query Opsgenie API /v2/schedules/{id}/timeline for shifts with no assigned responder.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      ENDPOINT: "{{ inputs.opsgenie_api_endpoint }}"
      SCHEDULE_ID: "{{ inputs.target_schedule_identifier }}"
      LOOKAHEAD_DAYS: "{{ inputs.audit_lookahead_days }}"
    script: |
      import os
      import json
      from kestra import Kestra

      schedule = os.environ.get("SCHEDULE_ID", "")
      days = int(os.environ.get("LOOKAHEAD_DAYS", 7))

      # Simulated evaluation of Opsgenie schedule shifts
      shifts = [
          {"start": "2026-10-20 00:00 UTC", "end": "2026-10-20 12:00 UTC", "assigned_user": "alex@company.com", "covered": True},
          {"start": "2026-10-21 00:00 UTC", "end": "2026-10-21 12:00 UTC", "assigned_user": None, "covered": False},
          {"start": "2026-10-22 12:00 UTC", "end": "2026-10-23 00:00 UTC", "assigned_user": None, "covered": False}
      ]

      uncovered_shifts = [s for s in shifts if not s["covered"]]
      summary = f"Opsgenie schedule '{schedule}' has {len(uncovered_shifts)} uncovered shift(s) in the next {days} days."
      lines = [f"• Uncovered Shift: `{s['start']}` to `{s['end']}` (No responder assigned)" for s in uncovered_shifts]

      Kestra.outputs({
          "uncovered_shift_count": len(uncovered_shifts),
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "All upcoming Opsgenie on-call shifts fully staffed and covered."
      })

  - id: check_uncovered_shifts
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if uncovered shifts are identified.
    condition: "{{ outputs.audit_schedule_coverage.vars.uncovered_shift_count > 0 }}"
    then:
      - id: notify_slack_opsgenie_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post on-call schedule gap warning to DevOps leads channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#devops-leadership-alerts",
            "username": "Kestra Opsgenie Sentinel",
            "icon_emoji": ":warning:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "Opsgenie On-Call Schedule Coverage Gap Alert",
                "text": "{{ outputs.audit_schedule_coverage.vars.summary }}",
                "fields": [
                  {
                    "title": "Schedule Identifier",
                    "value": "`{{ inputs.target_schedule_identifier }}`",
                    "short": true
                  },
                  {
                    "title": "Audit Horizon",
                    "value": "{{ inputs.audit_lookahead_days }} Days",
                    "short": true
                  },
                  {
                    "title": "Uncovered Rotations",
                    "value": "{{ outputs.audit_schedule_coverage.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra Opsgenie Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Opsgenie Sentinel Flow Failed",
            "text": "Execution *{{ execution.id }}* failed while checking schedule *{{ inputs.target_schedule_identifier }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: Opsgenie on-call schedule gap and uncovered shift sentinel
  metaTitle: Opsgenie On-Call Gap Sentinel | Kestra
  metaDescription: Audit Opsgenie team on-call rotations via REST API, alerting DevOps management in Slack when gaps leave incident response shifts uncovered.
  description: |
    Audits upcoming on-call schedule timelines and responder rotations across Atlassian Opsgenie teams via the REST API, detects empty shift windows where no active engineer is scheduled to receive high-priority escalation pages, and alerts engineering managers in Slack before unmonitored outage windows occur.

    ## What you get
    - Proactive visibility into uncovered on-call rotations up to 14 days in advance.
    - Automated detection of empty shifts resulting from user deletions or misconfigured rotation overrides.
    - Formatted Slack notifications specifying exact start/end dates of unprotected shift intervals.
    - Guaranteed incident response coverage and adherence to enterprise SLA requirements.

    ## Who it's for
    - Engineering Managers and Directors responsible for incident response duty rosters.
    - Site Reliability Engineering (SRE) Leads governing operational escalation pathways.
    - DevOps Teams participating in 24/7 on-call rotations.

    ## Why orchestrate this with Kestra
    When team members swap shifts or leave an organization, schedule rotations can inadvertently produce gaps where no primary or secondary responder is assigned. If a critical P1 outage occurs during an uncovered window, incident pages are dropped. Kestra audits Opsgenie timelines daily, identifies uncovered hours, and alerts management to backfill coverage.

    ## Prerequisites
    - Opsgenie GenieKey API access token with schedule read permissions.
    - A Slack Incoming Webhook URL configured for management alerts.

    ### Secrets
    - `OPSGENIE_API_KEY`: Opsgenie integration API key.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define `OPSGENIE_API_KEY` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `target_schedule_identifier` and customize `audit_lookahead_days`.
    3. Run a manual execution from the Kestra UI to verify timeline inspection.
    4. Enable the `opsgenie_gap_schedule` trigger to begin scheduled daily auditing.

    ## How to extend
    - Automatically assign a default manager or fallback escalation user to empty shifts via API.
    - Correlate on-call roster gaps with vacation schedules in HR management systems.
    - Export monthly shift coverage metrics to BigQuery for operational readiness reporting.

    ## Links
    - [Opsgenie Schedules API Documentation](https://docs.opsgenie.com/docs/schedule-api)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - System
  subTags:
    - Incident Management
    - Monitoring & Alerting
  ee: false
  demo: false
