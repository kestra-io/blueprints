id: dbt-slim-ci-state-deferral
namespace: company.team

inputs:
  - id: repository_url
    type: STRING
    displayName: dbt project repository
    defaults: https://github.com/dbt-labs/jaffle_shop_duckdb.git

  - id: branch
    type: STRING
    displayName: Branch to check
    description: The pull request branch in CI mode, the default branch in PROMOTE mode.
    defaults: duckdb

  - id: mode
    type: SELECT
    displayName: Mode
    description: >
      PULL_REQUEST builds only what the branch changed plus everything downstream, reading
      unchanged models from production. PROMOTE runs the full build on the default branch and
      saves its manifest as the new production state.
    values:
      - PULL_REQUEST
      - PROMOTE
    defaults: PULL_REQUEST

  - id: simulated_change
    type: SELECT
    displayName: Simulated change (demo)
    description: Edit the cloned project the way a pull request would. NONE leaves it as it is.
    values:
      - NONE
      - ADD_COLUMN
      - BREAK_UNIQUENESS
    defaults: ADD_COLUMN

variables:
  state_dir: dbt/jaffle_shop/prod_state

triggers:
  - id: on_pull_request
    type: io.kestra.plugin.core.trigger.Webhook
    description: >
      Call from CI with {"branch": "...", "mode": "PULL_REQUEST"}, or "PROMOTE" after a merge.
      Replace the key with a long random value first.
    key: replace-with-a-long-random-key

tasks:
  - id: ci
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One checkout for the clone, the dbt run and the artifacts.
    tasks:
      - id: clone
        type: io.kestra.plugin.git.Clone
        url: "{{ inputs.repository_url }}"
        branch: "{{ trigger.body.branch ?? inputs.branch }}"
        depth: 1

      - id: build
        type: io.kestra.plugin.dbt.cli.DbtCLI
        description: >
          With no production state yet, or in PROMOTE mode, run the full build against prod.
          Otherwise list the modified nodes and build state:modified+ with --defer, so
          unchanged parents are read from the prod schema instead of being rebuilt.
        containerImage: ghcr.io/kestra-io/dbt-duckdb:latest
        namespaceFiles:
          enabled: true
          include:
            - "{{ vars.state_dir }}/**"
        env:
          MODE: "{{ trigger.body.mode ?? inputs.mode }}"
          CHANGE: "{{ inputs.simulated_change }}"
          STATE_DIR: "{{ vars.state_dir }}"
        beforeCommands:
          - |
            # Two targets in one DuckDB file: prod in schema main, CI in its own schema.
            cat > profiles.yml <<'YAML'
            jaffle_shop:
              target: ci
              outputs:
                prod:
                  type: duckdb
                  path: warehouse.duckdb
                  schema: main
                ci:
                  type: duckdb
                  path: warehouse.duckdb
                  schema: pr_ci
            YAML
            if [ -f "$STATE_DIR/warehouse.duckdb" ]; then cp "$STATE_DIR/warehouse.duckdb" warehouse.duckdb; fi
            # The simulated change is a pull request edit, so it never touches a full build.
            [ "$MODE" = "PROMOTE" ] || [ ! -f "$STATE_DIR/manifest.json" ] && CHANGE=NONE
            case "$CHANGE" in
              ADD_COLUMN) sed -i 's/^select \* from final/select *, amount > 20 as is_large_order from final/' models/orders.sql ;;
              BREAK_UNIQUENESS) sed -i 's/^select \* from renamed$/select * from renamed\nunion all\nselect * from renamed where order_id = 1/' models/staging/stg_orders.sql ;;
            esac
        commands:
          - |
            if [ "$MODE" = "PROMOTE" ] || [ ! -f "$STATE_DIR/manifest.json" ]; then
              run_kind=FULL_BUILD
              selector=""
              dbt build --profiles-dir . --target prod || true
            else
              run_kind=SLIM_CI
              dbt ls --quiet --profiles-dir . --target ci --select state:modified --state "$STATE_DIR" --resource-type model --output name > modified.txt 2>/dev/null || true
              dbt build --profiles-dir . --select state:modified+ --defer --state "$STATE_DIR" --target ci || true
            fi
            # dbt ls rewrites target/manifest.json, so it must use the same target as the build.
            [ "$run_kind" = "FULL_BUILD" ] && tgt=prod || tgt=ci
            total=$(dbt ls --quiet --profiles-dir . --target "$tgt" --resource-type model --resource-type seed --resource-type test --output name 2>/dev/null | grep -c . || true)
            python3 - "$run_kind" "$total" <<'PY'
            import json, os, sys
            kind, total = sys.argv[1], int(sys.argv[2] or 0)
            res = json.load(open("target/run_results.json"))["results"]
            failed = [r["unique_id"].split(".")[2] + ": " + (r.get("message") or r["status"])[:120]
                      for r in res if r["status"] in ("error", "fail")]
            modified = [l.strip() for l in open("modified.txt")] if os.path.exists("modified.txt") else []
            out = {"run_kind": kind, "built": len(res), "total_nodes": total, "failed_count": len(failed),
                   "failed": "; ".join(failed), "modified_models": ", ".join(m for m in modified if m) or "none"}
            print("::" + json.dumps({"outputs": out}) + "::")
            PY
        outputFiles:
          - target/manifest.json
          - warehouse.duckdb

  - id: report
    type: io.kestra.plugin.core.log.Log
    message: >-
      {{ outputs.build.vars.run_kind }} on {{ trigger.body.branch ?? inputs.branch }}:
      built {{ outputs.build.vars.built }} of {{ outputs.build.vars.total_nodes }} nodes
      (modified models: {{ outputs.build.vars.modified_models }}), {{ outputs.build.vars.failed_count }} failed.
      {% if outputs.build.vars.failed_count > 0 %}Failures: {{ outputs.build.vars.failed }}{% endif %}

  - id: gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.build.vars.failed_count == 0 }}"
    then:
      - id: save_state_if_full_build
        type: io.kestra.plugin.core.flow.If
        description: A green full build becomes the production state that later pull requests are compared with and defer to.
        condition: "{{ outputs.build.vars.run_kind == 'FULL_BUILD' }}"
        then:
          - id: save_prod_state
            type: io.kestra.plugin.core.namespace.UploadFiles
            namespace: "{{ flow.namespace }}"
            filesMap:
              "{{ vars.state_dir }}/manifest.json": "{{ outputs.build.outputFiles['target/manifest.json'] }}"
              "{{ vars.state_dir }}/warehouse.duckdb": "{{ outputs.build.outputFiles['warehouse.duckdb'] }}"
          - id: log_state_saved
            type: io.kestra.plugin.core.log.Log
            message: Production state saved. The next pull request builds only what it changes.
        else:
          - id: log_ci_passed
            type: io.kestra.plugin.core.log.Log
            message: "Slim CI passed: {{ outputs.build.vars.built }} of {{ outputs.build.vars.total_nodes }} nodes built and tested, the rest read from production."
    else:
      - id: block_merge
        type: io.kestra.plugin.core.execution.Fail
        description: End the run as FAILED, so the pull request check goes red. Production state is not touched.
        errorMessage: "{{ outputs.build.vars.failed_count }} dbt node(s) failed on {{ trigger.body.branch ?? inputs.branch }}: {{ outputs.build.vars.failed }}"

extend:
  title: dbt Slim CI that builds only what a pull request changed
  metaTitle: dbt Slim CI with state:modified+ and --defer in Kestra
  shortDescription: Keep the production dbt manifest as state, then build and test only the models a pull request changed plus everything downstream, reading unchanged parents from production.
  metaDescription: Run dbt Slim CI in Kestra. Build only state:modified+ with --defer against a saved production manifest, then block the merge on any failed test.
  description: |
    Running `dbt build` on every pull request rebuilds the whole project, which is slow and expensive on a real warehouse. **Slim CI** fixes that: dbt compares the branch with the production manifest, builds only the models the pull request changed plus everything downstream (`state:modified+`), and reads unchanged parents straight from production (`--defer`). This flow runs that pattern end to end and keeps the production state itself:
    - A green full build on the default branch saves its `manifest.json` (and, for the DuckDB demo, the warehouse file) as the production state.
    - Each pull request builds only its slice in a separate `pr_ci` schema and blocks the merge on any failed model or test.

    It runs with no secrets on the public `jaffle_shop_duckdb` project. A `simulated_change` input edits the clone the way a pull request would, so the demo shows both a passing and a failing pull request.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## How it works

    1. `ci` (`io.kestra.plugin.core.flow.WorkingDirectory`) keeps one checkout. `clone` (`io.kestra.plugin.git.Clone`) checks out `branch`.
    2. `build` (`io.kestra.plugin.dbt.cli.DbtCLI`, `ghcr.io/kestra-io/dbt-duckdb`) loads the production state from namespace files and writes a `profiles.yml` with a `prod` target (schema `main`) and a `ci` target (schema `pr_ci`).
       - No state yet, or `mode: PROMOTE`: `dbt build --target prod`.
       - Otherwise: `dbt ls --select state:modified` records the changed models, then `dbt build --select state:modified+ --defer --state <prod_state> --target ci`.
       - It parses `run_results.json` and outputs `run_kind`, `built`, `total_nodes`, `failed_count`, `failed` and `modified_models`.
    3. `report` logs how many nodes were built out of the whole project.
    4. `gate` (`io.kestra.plugin.core.flow.If`):
       - Green full build: `save_prod_state` (`io.kestra.plugin.core.namespace.UploadFiles`) stores the new production state.
       - Green slim run: log only.
       - Anything red: `block_merge` (`io.kestra.plugin.core.execution.Fail`) names the failing node, so the pull request check fails. The production state is not touched.
    5. `on_pull_request` (`io.kestra.plugin.core.trigger.Webhook`) takes `{"branch": "...", "mode": "PULL_REQUEST"}` from CI.

    ## Inputs

    - `repository_url` (STRING) and `branch` (STRING, default `duckdb`, the demo project's default branch).
    - `mode` (SELECT `PULL_REQUEST` or `PROMOTE`, default `PULL_REQUEST`).
    - `simulated_change` (SELECT `NONE`, `ADD_COLUMN` or `BREAK_UNIQUENESS`, default `ADD_COLUMN`): demo only, ignored on full builds.

    ## Quick start

    | Run | Input | Result |
    |---|---|---|
    | 1 | defaults (no state yet) | Full build: 28 of 28 nodes, production state saved |
    | 2 | defaults (`ADD_COLUMN` on `orders`) | Slim CI: 11 of 28 nodes built, passed |
    | 3 | `simulated_change: BREAK_UNIQUENESS` on `stg_orders` | Slim CI: 18 of 28 nodes, `unique_stg_orders_order_id` failed, merge blocked |
    | 4 | `simulated_change: NONE` | Slim CI: 0 of 28 nodes, nothing to test |
    | 5 | `mode: PROMOTE` | Full build, production state refreshed |

    ## Things to know

    - `dbt ls` rewrites `target/manifest.json`, so every dbt command in the run uses the same target as the build. My first version ran `dbt ls` on the default target after the production build, and the saved state pointed at the CI schema. Deferral then failed with `Table with name stg_orders does not exist`.
    - On a real warehouse you only keep `manifest.json` as state, because production relations already live in the warehouse. The DuckDB demo also saves `warehouse.duckdb`, since the warehouse is a file.

    ## Using it with your warehouse

    - Use the matching image, for example `ghcr.io/kestra-io/dbt-snowflake` or `dbt-bigquery`, and put credentials in `profiles.yml` through `{{ secret('NAME') }}` env vars.
    - Give each pull request its own CI schema, for example `pr_{{ trigger.body.number }}`, and drop it after the merge.
    - Drop `warehouse.duckdb` from the state files.

    ## Links

    - dbt state selection: https://docs.getdbt.com/reference/node-selection/methods#state
    - dbt defer: https://docs.getdbt.com/reference/node-selection/defer
    - dbt plugin: https://kestra.io/plugins/plugin-dbt
  tags:
    - Data
  subTags:
    - dbt Transformations
    - CI/CD & Deployment
  ee: false
  demo: false
