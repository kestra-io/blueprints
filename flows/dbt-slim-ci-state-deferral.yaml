id: dbt-slim-ci-state-deferral
namespace: company.team

inputs:
  - id: repository_url
    type: STRING
    displayName: dbt project repository
    defaults: https://github.com/dbt-labs/jaffle_shop_duckdb.git

  - id: branch
    type: STRING
    displayName: Branch to check
    description: The pull request branch in CI mode, the default branch in PROMOTE mode.
    defaults: duckdb

  - id: mode
    type: SELECT
    displayName: Mode
    description: >
      PULL_REQUEST builds only what the branch changed plus everything downstream, reading
      unchanged models from production. PROMOTE runs the full build on the default branch and
      saves its manifest as the new production state.
    values:
      - PULL_REQUEST
      - PROMOTE
    defaults: PULL_REQUEST

  - id: simulated_change
    type: SELECT
    displayName: Simulated change (demo)
    description: Edit the cloned project the way a pull request would. NONE leaves it as it is.
    values:
      - NONE
      - ADD_COLUMN
      - BREAK_UNIQUENESS
    defaults: ADD_COLUMN

variables:
  state_dir: dbt/jaffle_shop/prod_state

triggers:
  - id: on_pull_request
    type: io.kestra.plugin.core.trigger.Webhook
    description: >
      Call from CI with {"branch": "...", "mode": "PULL_REQUEST"}, or "PROMOTE" after a merge.
    key: dbt-slim-ci-webhook-trigger

tasks:
  - id: ci
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One checkout for the clone, the dbt run and the artifacts.
    tasks:
      - id: clone
        type: io.kestra.plugin.git.Clone
        url: "{{ inputs.repository_url }}"
        branch: "{{ trigger.body.branch ?? inputs.branch }}"
        depth: 1

      - id: build
        type: io.kestra.plugin.dbt.cli.DbtCLI
        description: >
          With no production state yet, or in PROMOTE mode, run the full build against prod.
          Otherwise list the modified nodes and build state:modified+ with --defer.
        containerImage: ghcr.io/kestra-io/dbt-duckdb:latest
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        namespaceFiles:
          enabled: true
          include:
            - "{{ vars.state_dir }}/**"
        env:
          MODE: "{{ trigger.body.mode ?? inputs.mode }}"
          CHANGE: "{{ inputs.simulated_change }}"
          STATE_DIR: "{{ vars.state_dir }}"
        beforeCommands:
          - |
            cat > profiles.yml <<'YAML'
            jaffle_shop:
              target: ci
              outputs:
                prod:
                  type: duckdb
                  path: warehouse.duckdb
                  schema: main
                ci:
                  type: duckdb
                  path: warehouse.duckdb
                  schema: pr_ci
            YAML
            if [ -f "$STATE_DIR/warehouse.duckdb" ]; then cp "$STATE_DIR/warehouse.duckdb" warehouse.duckdb; fi
            [ "$MODE" = "PROMOTE" ] || [ ! -f "$STATE_DIR/manifest.json" ] && CHANGE=NONE
            case "$CHANGE" in
              ADD_COLUMN) sed -i 's/^select \* from final/select *, amount > 20 as is_large_order from final/' models/orders.sql ;;
              BREAK_UNIQUENESS) sed -i 's/^select \* from renamed$/select * from renamed\nunion all\nselect * from renamed where order_id = 1/' models/staging/stg_orders.sql ;;
            esac
        commands:
          - |
            if [ "$MODE" = "PROMOTE" ] || [ ! -f "$STATE_DIR/manifest.json" ]; then
              run_kind=FULL_BUILD
              dbt build --profiles-dir . --target prod || true
            else
              run_kind=SLIM_CI
              dbt ls --quiet --profiles-dir . --target ci --select state:modified --state "$STATE_DIR" --resource-type model --output name > modified.txt 2>/dev/null || true
              dbt build --profiles-dir . --select state:modified+ --defer --state "$STATE_DIR" --target ci || true
            fi
            [ "$run_kind" = "FULL_BUILD" ] && tgt=prod || tgt=ci
            total=$(dbt ls --quiet --profiles-dir . --target "$tgt" --resource-type model --resource-type seed --resource-type test --output name 2>/dev/null | grep -c . || true)
            python3 - "$run_kind" "$total" <<'PY'
            import json, os, sys
            from kestra import Kestra
            kind, total = sys.argv[1], int(sys.argv[2] or 0)
            res = json.load(open("target/run_results.json"))["results"]
            failed = [r["unique_id"].split(".")[2] + ": " + (r.get("message") or r["status"])[:120]
                      for r in res if r["status"] in ("error", "fail")]
            modified = [l.strip() for l in open("modified.txt")] if os.path.exists("modified.txt") else []
            out = {
                "run_kind": kind,
                "built": len(res),
                "total_nodes": total,
                "failed_count": len(failed),
                "failed": "; ".join(failed),
                "modified_models": ", ".join(m for m in modified if m) or "none"
            }
            Kestra.outputs(out)
            PY
        outputFiles:
          - target/manifest.json
          - warehouse.duckdb

  - id: report
    type: io.kestra.plugin.core.log.Log
    message: >-
      {{ outputs.build.vars.run_kind }} on {{ trigger.body.branch ?? inputs.branch }}:
      built {{ outputs.build.vars.built }} of {{ outputs.build.vars.total_nodes }} nodes
      (modified models: {{ outputs.build.vars.modified_models }}), {{ outputs.build.vars.failed_count }} failed.

  - id: gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.build.vars.failed_count == 0 }}"
    then:
      - id: save_state_if_full_build
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.build.vars.run_kind == 'FULL_BUILD' }}"
        then:
          - id: save_prod_state
            type: io.kestra.plugin.core.namespace.UploadFiles
            namespace: "{{ flow.namespace }}"
            filesMap:
              "{{ vars.state_dir }}/manifest.json": "{{ outputs.build.outputFiles['target/manifest.json'] }}"
              "{{ vars.state_dir }}/warehouse.duckdb": "{{ outputs.build.outputFiles['warehouse.duckdb'] }}"
          - id: log_state_saved
            type: io.kestra.plugin.core.log.Log
            message: Production state saved.
        else:
          - id: log_ci_passed
            type: io.kestra.plugin.core.log.Log
            message: "Slim CI passed: {{ outputs.build.vars.built }} nodes built, the rest read from production."
    else:
      - id: block_merge
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "{{ outputs.build.vars.failed_count }} dbt node(s) failed on {{ trigger.body.branch ?? inputs.branch }}: {{ outputs.build.vars.failed }}"

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "CRITICAL: dbt Slim CI pipeline failed on branch {{ trigger.body.branch ?? inputs.branch }}. Execution ID: {{ execution.id }}."
      }

extend:
  title: dbt Slim CI that builds only what a pull request changed
  metaTitle: dbt Slim CI with state:modified+ and --defer in Kestra
  shortDescription: Keep the production dbt manifest as state, then build and test only modified models.
  metaDescription: Run dbt Slim CI in Kestra. Build only state:modified+ with --defer against a saved production manifest.
  description: |
    ## How it works
    Running `dbt build` on every pull request rebuilds the entire project, which is slow and expensive. Slim CI compares the pull request branch against the production manifest, rebuilds only modified nodes and downstream dependencies (`state:modified+`), and defers upstream parents to production tables.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[on_pull_request Webhook] --> B[clone Git Repository]
      B --> C[build dbt CLI]
      C --> D{Build Succeeded?}
      D -- Yes --> E[save_prod_state UploadFiles]
      D -- No --> F[block_merge Fail]
    ```

    ## Prerequisites
    - dbt project repository accessible via Git.
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure `repository_url` and `branch`.
    3. Trigger via pull request webhook.

    ## Links
    - [dbt Slim CI Documentation](https://docs.getdbt.com/docs/deploy/ci-jobs#slim-ci)
    - [Kestra dbt Plugin Documentation](https://kestra.io/plugins/plugin-dbt)
  tags:
    - Data
  subTags:
    - dbt Transformations
    - Testing & Quality
  ee: false
  demo: false
