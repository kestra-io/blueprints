id: postgresql-idle-in-transaction-terminator
namespace: company.team

description: |
  Detect PostgreSQL connections that have been idle-in-transaction for longer than the
  configured threshold, terminate them with pg_terminate_backend, re-query to confirm
  they are gone, and notify Slack with the count terminated.

inputs:
  - id: pg_host
    type: STRING
    displayName: PostgreSQL Host
    defaults: "localhost"

  - id: pg_port
    type: INT
    displayName: PostgreSQL Port
    defaults: 5432

  - id: pg_database
    type: STRING
    displayName: Database Name
    defaults: "postgres"

  - id: pg_user
    type: STRING
    displayName: Superuser Login
    description: Must have the pg_signal_backend privilege to call pg_terminate_backend.
    defaults: "postgres"

  - id: idle_threshold_minutes
    type: INT
    displayName: Idle-in-Transaction Threshold (minutes)
    description: Connections idle-in-transaction longer than this value are candidates for termination.
    defaults: 5
    min: 1
    max: 60

  - id: dry_run
    type: BOOL
    displayName: Dry Run
    description: When true, logs candidates without terminating them.
    defaults: true

variables:
  slack_webhook: "{{ secret('SLACK_WEBHOOK_URL') }}"
  pg_password: "{{ secret('PG_SUPERUSER_PASSWORD') }}"

tasks:
  - id: detect_idle_transactions
    type: io.kestra.plugin.scripts.shell.Commands
    description: Query pg_stat_activity for connections idle-in-transaction beyond the threshold.
    env:
      PGPASSWORD: "{{ vars.pg_password }}"
    commands:
      - |
        set -e
        PIDS=$(psql \
          -h "{{ inputs.pg_host }}" \
          -p "{{ inputs.pg_port }}" \
          -U "{{ inputs.pg_user }}" \
          -d "{{ inputs.pg_database }}" \
          -tAX \
          -c "SELECT pid FROM pg_stat_activity
              WHERE state = 'idle in transaction'
                AND state_change < NOW() - INTERVAL '{{ inputs.idle_threshold_minutes }} minutes'
                AND pid <> pg_backend_pid();")
        COUNT=$(echo "${PIDS}" | grep -c '[0-9]' || echo "0")
        echo "::{ \"outputs\": { \"idle_pid_count\": ${COUNT}, \"idle_pids\": \"$(echo ${PIDS} | tr '\n' ',')\" } }::"
        echo "Detected ${COUNT} idle-in-transaction connection(s) older than {{ inputs.idle_threshold_minutes }} minutes."

  - id: check_action_needed
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.detect_idle_transactions.vars.idle_pid_count | int > 0 }}"
    then:
      - id: terminate_or_report
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.dry_run == false }}"
        then:
          - id: terminate_connections
            type: io.kestra.plugin.scripts.shell.Commands
            description: Terminate every idle-in-transaction connection identified in the detection step.
            env:
              PGPASSWORD: "{{ vars.pg_password }}"
            commands:
              - |
                set -e
                TERMINATED=$(psql \
                  -h "{{ inputs.pg_host }}" \
                  -p "{{ inputs.pg_port }}" \
                  -U "{{ inputs.pg_user }}" \
                  -d "{{ inputs.pg_database }}" \
                  -tAX \
                  -c "SELECT COUNT(*) FROM (
                        SELECT pg_terminate_backend(pid)
                        FROM pg_stat_activity
                        WHERE state = 'idle in transaction'
                          AND state_change < NOW() - INTERVAL '{{ inputs.idle_threshold_minutes }} minutes'
                          AND pid <> pg_backend_pid()
                      ) t WHERE pg_terminate_backend IS TRUE;")
                echo "::{ \"outputs\": { \"terminated_count\": ${TERMINATED:-0} } }::"
                echo "Terminated ${TERMINATED:-0} idle-in-transaction connection(s)."

          - id: verify_termination
            type: io.kestra.plugin.scripts.shell.Commands
            description: Re-query pg_stat_activity to confirm all targeted connections are gone.
            env:
              PGPASSWORD: "{{ vars.pg_password }}"
            commands:
              - |
                set -e
                REMAINING=$(psql \
                  -h "{{ inputs.pg_host }}" \
                  -p "{{ inputs.pg_port }}" \
                  -U "{{ inputs.pg_user }}" \
                  -d "{{ inputs.pg_database }}" \
                  -tAX \
                  -c "SELECT COUNT(*) FROM pg_stat_activity
                      WHERE state = 'idle in transaction'
                        AND state_change < NOW() - INTERVAL '{{ inputs.idle_threshold_minutes }} minutes'
                        AND pid <> pg_backend_pid();")
                echo "::{ \"outputs\": { \"remaining_idle_count\": ${REMAINING:-0} } }::"
                echo "Remaining idle-in-transaction connections: ${REMAINING:-0}."

          - id: notify_termination_result
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.verify_termination.vars.remaining_idle_count | int == 0 }}"
            then:
              - id: notify_success
                type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
                url: "{{ vars.slack_webhook }}"
                payload: |
                  {"text": "✅ *PostgreSQL idle-in-transaction cleanup succeeded* — terminated `{{ outputs.terminate_connections.vars.terminated_count }}` connection(s) on `{{ inputs.pg_host }}:{{ inputs.pg_port }}/{{ inputs.pg_database }}`. No stale transactions remain."}
            else:
              - id: notify_escalation
                type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
                url: "{{ vars.slack_webhook }}"
                payload: |
                  {"text": "🔴 *PostgreSQL escalation required* — `{{ outputs.verify_termination.vars.remaining_idle_count }}` idle-in-transaction connection(s) persist on `{{ inputs.pg_host }}:{{ inputs.pg_port }}/{{ inputs.pg_database }}` after termination attempt. Manual inspection required."}
        else:
          - id: notify_dry_run
            type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
            url: "{{ vars.slack_webhook }}"
            payload: |
              {"text": "⚠️ *PostgreSQL idle-in-transaction detected (dry run)* — `{{ outputs.detect_idle_transactions.vars.idle_pid_count }}` connection(s) on `{{ inputs.pg_host }}:{{ inputs.pg_port }}/{{ inputs.pg_database }}` idle-in-transaction beyond {{ inputs.idle_threshold_minutes }} minutes. Set `dry_run=false` to terminate."}
    else:
      - id: notify_healthy
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ vars.slack_webhook }}"
        payload: |
          {"text": "✅ *PostgreSQL transaction health OK* — no idle-in-transaction connections older than {{ inputs.idle_threshold_minutes }} minutes on `{{ inputs.pg_host }}:{{ inputs.pg_port }}/{{ inputs.pg_database }}`."}

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    url: "{{ vars.slack_webhook }}"
    payload: |
      {"text": "🔴 *PostgreSQL idle-in-transaction terminator flow failed* — execution `{{ execution.id }}` on `{{ inputs.pg_host }}` encountered an unexpected error. Check Kestra logs."}

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    disabled: true

extend:
  title: "PostgreSQL Idle-in-Transaction Connection Terminator"
  description: |
    Automatically finds PostgreSQL connections that have been idle-in-transaction longer
    than a configurable threshold, terminates them, re-queries to confirm they are gone,
    and notifies Slack with the outcome.

    ## How it works

    1. `detect_idle_transactions` queries `pg_stat_activity` for sessions in
       `'idle in transaction'` state with a `state_change` older than
       `idle_threshold_minutes` minutes.
    2. `check_action_needed` branches on the detected count.
       - **Count > 0** and `dry_run=false`: `terminate_connections` calls
         `pg_terminate_backend(pid)` for every candidate in a single SQL statement,
         then `verify_termination` re-queries the same predicate to confirm zero remain.
       - **Count > 0** and `dry_run=true`: `notify_dry_run` posts a Slack warning with
         the count without touching any connection.
       - **Count == 0**: `notify_healthy` posts a clean-pass message.
    3. `notify_termination_result` branches on the post-termination count:
       - Zero remaining: `notify_success` posts how many were terminated.
       - Still > 0: `notify_escalation` posts for manual inspection.
    4. The `errors` block catches unexpected flow failures with a separate Slack alert.
    5. `schedule` fires every 10 minutes; ship disabled and enable once verified.

    ## What you get

    - Automatic reclamation of transaction slots blocked by abandoned client sessions,
      preventing table bloat, lock queue pile-up, and autovacuum disruption.
    - A dry-run mode so the flow can be audited against a production database before
      any connection is terminated.
    - A post-remediation verification step that distinguishes a fully clean database
      from one that still needs a human.

    ## Prerequisites

    - PostgreSQL 9.6+ (for `state_change` column in `pg_stat_activity`).
    - `psql` installed and on `PATH` on the Kestra worker.
    - The login supplied via `pg_user` must hold the `pg_signal_backend` privilege (or
      be a superuser) to call `pg_terminate_backend`.
    - A Slack incoming webhook stored as `SLACK_WEBHOOK_URL`.

    ## Secrets required

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL.
    - `PG_SUPERUSER_PASSWORD`: Password for the PostgreSQL superuser login.

    ## Troubleshooting

    - If `psql` exits with "FATAL: password authentication failed", confirm the
      `PG_SUPERUSER_PASSWORD` secret matches the `pg_user` account.
    - If `pg_terminate_backend` returns `false` for some PIDs, those sessions may have
      already ended between detection and termination, which is safe to ignore.
    - In Kestra OSS, supply secrets as environment variables prefixed `SECRET_` and
      base64-encoded.

    ## References

    - [pg_stat_activity reference](https://www.postgresql.org/docs/current/monitoring-stats.html#MONITORING-PG-STAT-ACTIVITY-VIEW)
    - [pg_terminate_backend](https://www.postgresql.org/docs/current/functions-admin.html#FUNCTIONS-ADMIN-SIGNAL)
    - [Kestra Shell Commands plugin](https://kestra.io/plugins/plugin-script-shell)

  tags:
    - PostgreSQL
    - Database
  subTags:
    - Self-Healing
    - Monitoring & Alerting
  ee: false
  demo: false
