id: gdelt-news-mention-spike-monitor
namespace: company.team

description: |
  Watch global online news for sudden spikes in mentions of your brands, products or
  competitors with the free GDELT DOC 2.0 API. Every hour the flow pulls a 15-minute
  mention timeline per term, scores the last complete hour against a volume-adjusted
  rolling baseline in DuckDB, and for each new spike fetches the most relevant articles
  and the tone distribution of that hour so the Slack alert carries evidence, not just a
  number. A Parquet history in the KV store makes sure the same spike is reported once.

inputs:
  - id: terms
    type: JSON
    displayName: Tracked terms
    description: |
      JSON array. A plain string is searched as is (multi-word names are quoted as a phrase).
      An object `{"name": ..., "query": ...}` passes a raw GDELT query, for ambiguous names
      (OR-ed terms must be in parentheses). The defaults mix high-volume names, an ambiguous
      brand with a custom query and a niche name that is usually LOW_VOLUME.
    defaults: |
      [
        "Boeing",
        "Nvidia",
        "OpenAI",
        "Federal Reserve",
        {"name": "Apple", "query": "(\"Apple Inc\" OR iPhone OR \"Tim Cook\")"},
        "Kestra"
      ]

  - id: query_filter
    type: STRING
    defaults: ""
    description: Optional GDELT operators appended to every query, for example `sourcelang:english` or `sourcecountry:US`.

  - id: baseline_hours
    type: INT
    defaults: 48
    min: 12
    max: 60
    description: Hours before the evaluated hour used as the baseline. The flow always fetches 72 hours, the longest window GDELT returns at 15-minute resolution, which leaves room for catch-up hours and GDELT's publishing lag.

  - id: catch_up_hours
    type: INT
    defaults: 3
    min: 1
    max: 6
    description: How many hours back a run re-evaluates when earlier runs were missed or the hour was not yet published.

  - id: z_threshold
    type: FLOAT
    defaults: 3.0
    description: Minimum z-score of the hour's mentions against the volume-adjusted baseline.

  - id: min_ratio
    type: FLOAT
    defaults: 2.0
    description: Minimum ratio of mentions to the expected mentions for the hour.

  - id: min_mentions
    type: INT
    defaults: 5
    description: Minimum number of articles in the hour, so a jump from 0 to 2 articles on a niche term does not page anyone.

  - id: cooldown_hours
    type: INT
    defaults: 6
    description: After an alert, the same term alerts again inside this window only if the hourly count at least doubles the alerted peak.

  - id: max_articles
    type: INT
    defaults: 5
    min: 1
    max: 20
    description: Distinct articles listed per spike in the alert (syndicated copies of the same story are folded together).

  - id: request_pause
    type: DURATION
    defaults: PT6S
    description: Pause after every GDELT request. GDELT asks for at most one request every 5 seconds per IP.

  - id: state_key
    type: STRING
    defaults: gdelt_mention_spike_history
    description: KV key holding the URI of the Parquet history. Use a different key per term list.

triggers:
  - id: hourly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "20 * * * *"
    description: Twenty minutes past the hour. GDELT's lag varies from under an hour to a few hours; each run evaluates the newest hour GDELT has fully published.

tasks:
  - id: window
    type: io.kestra.plugin.core.debug.Return
    description: |
      Fixed 72-hour UTC window ending at the top of the scheduled hour (or the start hour for manual runs). Explicit
      start and end datetimes instead of a relative timespan make backfills reproducible.
    format: >-
      {% set end = trigger.date ?? execution.startDate %}{"start": "{{ end | dateAdd(-72, 'HOURS') | date('yyyyMMddHH', timeZone='UTC') }}0000", "end": "{{ end | date('yyyyMMddHH', timeZone='UTC') }}0000"}

  - id: previous_history
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false
    description: URI of the Parquet history written by the last run; missing on the first run.

  - id: bootstrap
    type: io.kestra.plugin.core.flow.If
    description: First run only. Writes an empty history with the right schema so later tasks have one code path.
    condition: "{{ outputs.previous_history.value is not defined or outputs.previous_history.value is empty }}"
    then:
      - id: empty_history
        type: io.kestra.plugin.jdbc.duckdb.Queries
        url: "jdbc:duckdb:"
        fetchType: NONE
        outputFiles:
          - history_parquet
        sql: |
          CREATE TABLE history (
            term VARCHAR, hour TIMESTAMP, mentions BIGINT, monitored BIGINT, expected DOUBLE,
            z DOUBLE, ratio DOUBLE, status VARCHAR, alerted BOOLEAN, evaluated_at TIMESTAMP
          );
          COPY history TO '{{ outputFiles.history_parquet }}' (FORMAT PARQUET);

  - id: fetch_timelines
    type: io.kestra.plugin.core.flow.Loop
    description: |
      One GDELT request per term, strictly one at a time (`concurrencyLimit: 1`) with a pause after each, to stay
      inside GDELT's one-request-per-5-seconds limit. Each iteration exposes the raw response so a rejected or
      throttled query becomes a status row instead of failing the whole run.
    values: "{{ inputs.terms | toJson }}"
    concurrencyLimit: 1
    outputs:
      - id: record
        type: STRING
        value: "{{ {'term': fromJson(outputs.term.value).name, 'query': fromJson(outputs.term.value).query, 'code': outputs.timeline.code ?? 0, 'attempts': outputs.until_served.iterationCount ?? 1, 'body': outputs.timeline.body ?? ''} | toJson }}"
    tasks:
      - id: term
        type: io.kestra.plugin.core.debug.Return
        description: Normalises a string or an object entry into a display name and a GDELT query; single words stay bare, phrases get quotes, raw queries pass through.
        format: >-
          {% set raw = item.value | trim %}{% set obj = (raw | slice(0, 1)) == '{' ? fromJson(raw) : {'name': raw} %}{% set name = obj.name ?? obj.query %}{% set q = obj.query ?? ((name contains ' ') ? '"' ~ name ~ '"' : name) %}{{ {'name': name, 'query': (inputs.query_filter is empty) ? q : q ~ ' ' ~ inputs.query_filter} | toJson }}

      - id: until_served
        type: io.kestra.plugin.core.flow.LoopUntil
        description: GDELT answers HTTP 429 when the IP exceeds its rate limit. The request is repeated every 15 seconds, up to 6 times, until GDELT serves it; the last status code is kept and classified downstream.
        condition: "{{ (outputs.timeline.code ?? 0) != 429 }}"
        checkFrequency:
          interval: PT15S
          maxIterations: 6
        tasks:
          - id: timeline
            type: io.kestra.plugin.core.http.Request
            description: |
              `TimelineVolRaw` returns, per 15-minute slice, the number of matching articles (`value`) and the number of
              articles GDELT monitored in that slice (`norm`). `allowFailed` keeps 4xx answers as data; `Connection: close`
              avoids reusing the socket GDELT closes after a 429.
            uri: https://api.gdeltproject.org/api/v2/doc/doc
            params:
              query: "{{ fromJson(outputs.term.value).query }}"
              mode: TimelineVolRaw
              format: json
              startdatetime: "{{ fromJson(outputs.window.value).start }}"
              enddatetime: "{{ fromJson(outputs.window.value).end }}"
            headers:
              User-Agent: kestra-gdelt-news-mention-spike-monitor/1.0 (+https://kestra.io/blueprints)
              Accept: application/json
              Connection: close
            options:
              allowFailed: true
              timeout:
                readIdleTimeout: PT1M
            allowFailure: true
            retry:
              type: constant
              interval: PT20S
              maxAttempts: 3

      - id: pace
        type: io.kestra.plugin.core.flow.Sleep
        duration: "{{ inputs.request_pause }}"

  - id: timelines_file
    type: io.kestra.plugin.core.storage.Write
    description: Collects the per-term records from the loop into one JSON array for DuckDB.
    content: "{{ loopOutputs(outputs.fetch_timelines.outputs, 'record') | toJson }}"
    extension: .json

  - id: score
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Classifies each response (OK, NO_COVERAGE, QUERY_ERROR, RATE_LIMITED, FETCH_FAILED), rolls the 15-minute slices
      up to hours, and scores each evaluated hour against the baseline hours before it. The expected count is the
      hour's monitored volume times the baseline mention rate, so GDELT ingest dips and the day/night news cycle do
      not look like spikes; sigma has a Poisson floor so low-volume terms are not hypersensitive. Slices GDELT did not
      publish are left out of the baseline rather than counted as zero. Spikes are deduplicated against the history
      (same hour already alerted, or inside the cooldown without doubling) and the history is merged and pruned to 30 days.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      timelines.json: "{{ outputs.timelines_file.uri }}"
      history.parquet: "{{ outputs.previous_history.value ?? outputs.empty_history.outputFiles.history_parquet }}"
    outputFiles:
      - status_csv
      - history_parquet
    parameters:
      window_start: "{{ fromJson(outputs.window.value).start }}"
      window_end: "{{ fromJson(outputs.window.value).end }}"
      baseline_hours: "{{ inputs.baseline_hours }}"
      catch_up_hours: "{{ inputs.catch_up_hours }}"
      z_threshold: "{{ inputs.z_threshold }}"
      min_ratio: "{{ inputs.min_ratio }}"
      min_mentions: "{{ inputs.min_mentions }}"
      cooldown_hours: "{{ inputs.cooldown_hours }}"
      run_started: "{{ execution.startDate | date('yyyy-MM-dd HH:mm:ss', timeZone='UTC') }}"
    sql: |
      CREATE TABLE params AS
      SELECT strptime(:window_start, '%Y%m%d%H%M%S') AS window_start,
             strptime(:window_end, '%Y%m%d%H%M%S') AS window_end,
             CAST(:baseline_hours AS INTEGER) AS baseline_hours,
             CAST(:catch_up_hours AS INTEGER) AS catch_up_hours,
             CAST(:z_threshold AS DOUBLE) AS z_threshold,
             CAST(:min_ratio AS DOUBLE) AS min_ratio,
             CAST(:min_mentions AS INTEGER) AS min_mentions,
             CAST(:cooldown_hours AS INTEGER) AS cooldown_hours,
             CAST(:run_started AS TIMESTAMP) AS run_started,
             greatest(CAST(:baseline_hours AS INTEGER) / 2, 12) AS min_baseline_hours;

      CREATE TABLE raw AS
      SELECT ord, CAST(rec AS JSON) AS r
      FROM (SELECT unnest(arr) AS rec, unnest(range(1, len(arr) + 1)) AS ord
            FROM (SELECT from_json(content, '["VARCHAR"]') AS arr FROM read_text('timelines.json')));

      CREATE TABLE parsed AS
      SELECT ord, r->>'$.term' AS term, r->>'$.query' AS query, CAST(r->>'$.code' AS INTEGER) AS http_code, r->>'$.body' AS body,
             CASE WHEN CAST(r->>'$.code' AS INTEGER) BETWEEN 200 AND 299 AND json_valid(r->>'$.body') THEN CAST(r->>'$.body' AS JSON) END AS j
      FROM raw;

      CREATE TABLE fetched AS
      SELECT ord, term, query, http_code,
             CASE WHEN http_code = 429 THEN 'RATE_LIMITED'
                  WHEN http_code NOT BETWEEN 200 AND 299 THEN 'FETCH_FAILED'
                  WHEN j IS NULL THEN 'QUERY_ERROR'
                  WHEN coalesce(json_array_length(j, '$.timeline[0].data'), 0) = 0 THEN 'NO_COVERAGE'
                  ELSE 'OK' END AS fetch_state,
             j->>'$.query_details.date_resolution' AS resolution,
             CASE WHEN j IS NULL THEN left(split_part(regexp_replace(trim(coalesce(body, '')), '\s+', ' ', 'g'), '. ', 1), 160) END AS api_message
      FROM parsed;

      CREATE TABLE slices AS
      SELECT p.term, strptime(s->>'$.date', '%Y%m%dT%H%M%SZ') AS ts, CAST(s->>'$.value' AS BIGINT) AS mentions, CAST(s->>'$.norm' AS BIGINT) AS monitored
      FROM parsed p JOIN fetched f USING (ord), unnest(from_json(json_extract(p.j, '$.timeline[0].data'), '["JSON"]')) AS t(s)
      WHERE f.fetch_state = 'OK' AND f.resolution = '15m';

      -- GDELT publishes with a variable lag; the newest slice across all terms says how far the data goes.
      -- The evaluated hour is the last hour that ended before it, so a partly published hour is never scored.
      CREATE TABLE cfg AS
      SELECT p.*, d.data_through,
             coalesce(date_trunc('hour', d.data_through) - INTERVAL 1 HOUR, p.window_end - INTERVAL 1 HOUR) AS eval_hour
      FROM params p, (SELECT max(ts) + INTERVAL 15 MINUTE AS data_through FROM slices) d;

      CREATE TABLE hourly AS
      SELECT term, date_trunc('hour', ts) AS hour, sum(mentions) AS mentions, sum(monitored) AS monitored, count(*) AS slices
      FROM slices, cfg
      WHERE ts >= cfg.window_start AND ts < cfg.eval_hour + INTERVAL 1 HOUR AND monitored > 0
      GROUP BY ALL;

      CREATE TABLE history AS SELECT * FROM read_parquet('history.parquet');

      CREATE TABLE eval_hours AS
      SELECT f.term, h.hour
      FROM fetched f
      CROSS JOIN cfg
      CROSS JOIN (SELECT unnest(generate_series(eval_hour - to_hours(catch_up_hours - 1), eval_hour, INTERVAL 1 HOUR)) AS hour FROM cfg) h
      LEFT JOIN (SELECT term, max(hour) AS last_hour FROM history GROUP BY term) l ON l.term = f.term
      WHERE h.hour = cfg.eval_hour OR (l.last_hour IS NOT NULL AND h.hour > l.last_hour);

      CREATE TABLE base AS
      SELECT e.term, e.hour, count(x.hour) AS baseline_hours,
             sum(x.mentions) / nullif(sum(x.monitored), 0) AS rate,
             avg(x.mentions) AS mean_mentions, max(x.mentions) AS max_mentions
      FROM eval_hours e CROSS JOIN cfg
      LEFT JOIN hourly x ON x.term = e.term AND x.hour < e.hour AND x.hour >= e.hour - to_hours(cfg.baseline_hours)
      GROUP BY e.term, e.hour;

      CREATE TABLE resid AS
      SELECT b.term, b.hour, stddev_samp(x.mentions - x.monitored * b.rate) AS resid_sd
      FROM base b CROSS JOIN cfg
      JOIN hourly x ON x.term = b.term AND x.hour < b.hour AND x.hour >= b.hour - to_hours(cfg.baseline_hours)
      GROUP BY b.term, b.hour;

      CREATE TABLE scored AS
      SELECT f.ord, f.term, f.query, f.fetch_state, f.api_message, e.hour,
             t.mentions, t.monitored, t.slices,
             b.baseline_hours, round(b.mean_mentions, 2) AS baseline_mean, b.max_mentions AS baseline_max,
             t.monitored * b.rate AS expected,
             (t.mentions - t.monitored * b.rate) / greatest(coalesce(r.resid_sd, 0), sqrt(t.monitored * b.rate), 1.0) AS z,
             t.mentions / greatest(t.monitored * b.rate, 0.5) AS ratio
      FROM eval_hours e
      JOIN fetched f ON f.term = e.term
      LEFT JOIN hourly t ON t.term = e.term AND t.hour = e.hour
      LEFT JOIN base b ON b.term = e.term AND b.hour = e.hour
      LEFT JOIN resid r ON r.term = e.term AND r.hour = e.hour;

      CREATE TABLE classified AS
      SELECT s.*,
             CASE WHEN s.fetch_state <> 'OK' THEN s.fetch_state
                  WHEN s.slices IS NULL THEN 'HOUR_NOT_PUBLISHED'
                  WHEN s.baseline_hours < cfg.min_baseline_hours THEN 'INSUFFICIENT_BASELINE'
                  WHEN s.mentions >= cfg.min_mentions AND s.z >= cfg.z_threshold AND s.ratio >= cfg.min_ratio THEN 'SPIKE'
                  WHEN s.mentions > 0 AND (s.z >= cfg.z_threshold OR (s.ratio >= cfg.min_ratio AND s.mentions >= cfg.min_mentions)) THEN 'ELEVATED'
                  WHEN s.baseline_mean < 1 THEN 'LOW_VOLUME'
                  ELSE 'NORMAL' END AS status
      FROM scored s, cfg;

      CREATE TABLE checked AS
      SELECT c.*,
             p.last_alert_hour, p.last_alert_mentions,
             CASE WHEN c.status <> 'SPIKE' THEN NULL
                  WHEN p.last_alert_hour = c.hour THEN 'ALREADY_ALERTED'
                  WHEN p.last_alert_hour IS NOT NULL AND c.mentions < 2 * p.last_alert_mentions THEN 'COOLDOWN'
                  ELSE 'CANDIDATE' END AS pre_state
      FROM classified c CROSS JOIN cfg
      LEFT JOIN LATERAL (
        SELECT max(h.hour) AS last_alert_hour, arg_max(h.mentions, h.hour) AS last_alert_mentions
        FROM history h
        WHERE h.term = c.term AND h.alerted AND h.hour <= c.hour AND h.hour > c.hour - to_hours(cfg.cooldown_hours)
      ) p ON true;

      -- Several spiking catch-up hours of one term are one event: alert its peak hour, fold the others.
      CREATE TABLE deduped AS
      SELECT * EXCLUDE (pre_state),
             CASE WHEN pre_state = 'CANDIDATE'
                  THEN CASE WHEN row_number() OVER (PARTITION BY term, pre_state ORDER BY z DESC, hour DESC) = 1 THEN 'NEW' ELSE 'FOLDED' END
                  ELSE pre_state END AS alert_state,
             count(*) FILTER (WHERE status = 'SPIKE') OVER (PARTITION BY term) AS spiking_hours
      FROM checked;

      COPY (
        SELECT term, query, strftime(hour, '%Y-%m-%d %H') || chr(58) || '00' AS hour_utc, status, alert_state, mentions, round(expected, 2) AS expected,
               round(ratio, 2) AS ratio, round(z, 2) AS z, baseline_mean, baseline_max, baseline_hours, slices, monitored, api_message
        FROM deduped ORDER BY ord, hour DESC
      ) TO '{{ outputFiles.status_csv }}' (HEADER, DELIMITER ',');

      CREATE TABLE history_new AS
      WITH fresh AS (
        SELECT term, hour, mentions, monitored, expected, z, ratio, status, coalesce(alert_state = 'NEW', false) AS alerted, cfg.run_started AS evaluated_at
        FROM deduped, cfg
        WHERE fetch_state = 'OK' AND slices IS NOT NULL
      )
      SELECT f.term, f.hour, f.mentions, f.monitored, f.expected, f.z, f.ratio, f.status, f.alerted OR coalesce(h.alerted, false) AS alerted, f.evaluated_at
      FROM fresh f LEFT JOIN history h ON h.term = f.term AND h.hour = f.hour
      UNION ALL
      SELECT h.* FROM history h, cfg
      WHERE h.hour >= cfg.window_end - INTERVAL 30 DAY
        AND NOT EXISTS (SELECT 1 FROM fresh f WHERE f.term = h.term AND f.hour = h.hour);

      COPY history_new TO '{{ outputFiles.history_parquet }}' (FORMAT PARQUET);

      SELECT
        (SELECT strftime(eval_hour, '%Y-%m-%d %H') || chr(58) || '00' FROM cfg) AS evaluated_hour_utc,
        (SELECT coalesce(strftime(data_through, '%Y-%m-%d %H') || chr(58) || strftime(data_through, '%M'), 'n/a') FROM cfg) AS data_through_utc,
        (SELECT CAST(date_diff('minute', data_through, run_started) AS INTEGER) FROM cfg) AS lag_minutes,
        (SELECT count(*) FROM fetched) AS terms,
        (SELECT count(*) FILTER (WHERE fetch_state = 'OK') FROM fetched) AS fetched_ok,
        (SELECT count(*) FROM history) = 0 AS is_first_run,
        (SELECT count(*) FROM deduped) AS hours_scored,
        (SELECT count(*) FILTER (WHERE status = 'SPIKE') FROM deduped) AS spikes,
        (SELECT count(*) FILTER (WHERE alert_state = 'NEW') FROM deduped) AS new_alerts,
        (SELECT count(*) FILTER (WHERE alert_state IN ('ALREADY_ALERTED', 'COOLDOWN', 'FOLDED')) FROM deduped) AS suppressed,
        (SELECT count(*) FILTER (WHERE status = 'ELEVATED') FROM deduped) AS elevated,
        (SELECT count(*) FILTER (WHERE fetch_state IN ('QUERY_ERROR', 'RATE_LIMITED', 'FETCH_FAILED')) FROM fetched) AS failed_terms,
        (SELECT coalesce(string_agg(term || ' (' || fetch_state || coalesce(': ' || api_message, '') || ')', '; ' ORDER BY ord), '') FROM fetched WHERE fetch_state IN ('QUERY_ERROR', 'RATE_LIMITED', 'FETCH_FAILED')) AS failed_list,
        (SELECT count(*) FROM history_new) AS history_rows,
        (SELECT string_agg(term || ': ' || status || coalesce(' ' || mentions || ' vs ' || round(expected, 1) || ' expected, z ' || round(z, 1), '') || coalesce(' [' || alert_state || ']', ''), '; ' ORDER BY ord)
           FROM deduped, cfg WHERE hour = cfg.eval_hour) AS latest_hour,
        (SELECT coalesce(CAST(json_group_array(json_object(
                  'term', term, 'query', query, 'hour', strftime(hour, '%Y-%m-%d %H') || chr(58) || '00',
                  'start', strftime(hour, '%Y%m%d%H%M%S'), 'end', strftime(hour + INTERVAL 1 HOUR, '%Y%m%d%H%M%S'),
                  'mentions', mentions, 'expected', round(expected, 1), 'ratio', round(ratio, 1), 'z', round(z, 1),
                  'baseline_mean', baseline_mean, 'baseline_max', baseline_max, 'spiking_hours', spiking_hours)) AS VARCHAR), '[]')
           FROM (SELECT * FROM deduped WHERE alert_state = 'NEW' ORDER BY z DESC LIMIT 10)) AS alerts;

  - id: alert_new_spikes
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.score.outputs[0].row.new_alerts > 0 }}"
    then:
      - id: fetch_evidence
        type: io.kestra.plugin.core.flow.Loop
        description: |
          For each new spike (at most 10 per run), the hour's most relevant articles (`ArtList`, `sort=HybridRel`) and
          its tone histogram (`ToneChart`), both limited to the spike hour, with the same 429 handling and pacing as the timelines.
        values: "{{ outputs.score.outputs[0].row.alerts }}"
        concurrencyLimit: 1
        outputs:
          - id: record
            type: STRING
            value: "{{ {'term': fromJson(item.value).term, 'articles_code': outputs.articles.code ?? 0, 'articles': outputs.articles.body ?? '', 'tone_code': outputs.tone.code ?? 0, 'tone': outputs.tone.body ?? ''} | toJson }}"
        tasks:
          - id: articles_served
            type: io.kestra.plugin.core.flow.LoopUntil
            description: Asks for 4x the listed articles so syndicated copies can be folded and still leave enough distinct stories.
            condition: "{{ (outputs.articles.code ?? 0) != 429 }}"
            checkFrequency:
              interval: PT15S
              maxIterations: 6
            tasks:
              - id: articles
                type: io.kestra.plugin.core.http.Request
                uri: https://api.gdeltproject.org/api/v2/doc/doc
                params:
                  query: "{{ fromJson(item.value).query }}"
                  mode: ArtList
                  format: json
                  sort: HybridRel
                  maxrecords: "{{ inputs.max_articles * 4 }}"
                  startdatetime: "{{ fromJson(item.value).start }}"
                  enddatetime: "{{ fromJson(item.value).end }}"
                headers:
                  User-Agent: kestra-gdelt-news-mention-spike-monitor/1.0 (+https://kestra.io/blueprints)
                  Accept: application/json
                  Connection: close
                options:
                  allowFailed: true
                allowFailure: true
                retry:
                  type: constant
                  interval: PT20S
                  maxAttempts: 3

          - id: pace_articles
            type: io.kestra.plugin.core.flow.Sleep
            duration: "{{ inputs.request_pause }}"

          - id: tone_served
            type: io.kestra.plugin.core.flow.LoopUntil
            condition: "{{ (outputs.tone.code ?? 0) != 429 }}"
            checkFrequency:
              interval: PT15S
              maxIterations: 6
            tasks:
              - id: tone
                type: io.kestra.plugin.core.http.Request
                uri: https://api.gdeltproject.org/api/v2/doc/doc
                params:
                  query: "{{ fromJson(item.value).query }}"
                  mode: ToneChart
                  format: json
                  startdatetime: "{{ fromJson(item.value).start }}"
                  enddatetime: "{{ fromJson(item.value).end }}"
                headers:
                  User-Agent: kestra-gdelt-news-mention-spike-monitor/1.0 (+https://kestra.io/blueprints)
                  Accept: application/json
                  Connection: close
                options:
                  allowFailed: true
                allowFailure: true
                retry:
                  type: constant
                  interval: PT20S
                  maxAttempts: 3

          - id: pace_tone
            type: io.kestra.plugin.core.flow.Sleep
            duration: "{{ inputs.request_pause }}"

      - id: evidence_file
        type: io.kestra.plugin.core.storage.Write
        content: "{{ loopOutputs(outputs.fetch_evidence.outputs, 'record') | toJson }}"
        extension: .json

      - id: build_alert
        type: io.kestra.plugin.jdbc.duckdb.Queries
        description: |
          Folds syndicated copies (same normalised title on several sites) into one story with a copy count, keeps the
          top stories in GDELT relevance order, computes the article-weighted average tone and the share of negative
          coverage from the tone histogram, and writes the Slack message and an evidence CSV.
        url: "jdbc:duckdb:"
        fetchType: FETCH_ONE
        inputFiles:
          alerts.json: "{{ outputs.score.outputs[0].row.alerts }}"
          evidence.json: "{{ outputs.evidence_file.uri }}"
        outputFiles:
          - evidence_csv
        parameters:
          max_articles: "{{ inputs.max_articles }}"
        sql: |
          CREATE TABLE alerts AS
          SELECT a->>'$.term' AS term, a->>'$.hour' AS hour, CAST(a->>'$.mentions' AS BIGINT) AS mentions,
                 CAST(a->>'$.expected' AS DOUBLE) AS expected, CAST(a->>'$.ratio' AS DOUBLE) AS ratio, CAST(a->>'$.z' AS DOUBLE) AS z,
                 CAST(a->>'$.baseline_mean' AS DOUBLE) AS baseline_mean, CAST(a->>'$.baseline_max' AS BIGINT) AS baseline_max,
                 CAST(a->>'$.spiking_hours' AS INTEGER) AS spiking_hours, ord
          FROM (SELECT unnest(arr) AS a, unnest(range(1, len(arr) + 1)) AS ord
                FROM (SELECT from_json(content, '["JSON"]') AS arr FROM read_text('alerts.json')));

          CREATE TABLE ev AS
          SELECT r->>'$.term' AS term,
                 CASE WHEN json_valid(r->>'$.articles') THEN CAST(r->>'$.articles' AS JSON) END AS aj,
                 CASE WHEN json_valid(r->>'$.tone') THEN CAST(r->>'$.tone' AS JSON) END AS tj
          FROM (SELECT CAST(unnest(from_json(content, '["VARCHAR"]')) AS JSON) AS r FROM read_text('evidence.json'));

          CREATE TABLE articles AS
          SELECT term, rnk, regexp_replace(regexp_replace(regexp_replace(trim(art->>'$.title'), '\s+', ' ', 'g'), '(\d) \. (\d)', '\1.\2', 'g'), ' ([.,;:!?%])', '\1', 'g') AS title, art->>'$.url' AS url, art->>'$.domain' AS domain,
                 art->>'$.sourcecountry' AS country, art->>'$.language' AS language,
                 trim(regexp_replace(lower(art->>'$.title'), '[^\p{L}\p{N}]+', ' ', 'g')) AS title_key
          FROM (SELECT term, unnest(arr) AS art, unnest(range(1, len(arr) + 1)) AS rnk
                FROM (SELECT term, from_json(json_extract(aj, '$.articles'), '["JSON"]') AS arr FROM ev WHERE aj IS NOT NULL));

          CREATE TABLE stories AS
          SELECT term, title_key, min(rnk) AS best_rank, arg_min(title, rnk) AS title, arg_min(url, rnk) AS url,
                 arg_min(domain, rnk) AS domain, arg_min(country, rnk) AS country, count(*) AS copies,
                 string_agg(DISTINCT domain, ', ') AS domains
          FROM articles WHERE title_key <> '' GROUP BY term, title_key;

          CREATE TABLE top_stories AS
          SELECT * FROM (SELECT *, row_number() OVER (PARTITION BY term ORDER BY best_rank) AS pos FROM stories)
          WHERE pos <= CAST(:max_articles AS INTEGER);

          CREATE TABLE tone AS
          SELECT term, sum(cnt) AS toned_articles, round(sum(bin * cnt) / nullif(sum(cnt), 0), 2) AS avg_tone,
                 CAST(round(100.0 * sum(cnt) FILTER (WHERE bin < 0) / nullif(sum(cnt), 0)) AS INTEGER) AS pct_negative
          FROM (SELECT term, CAST(b->>'$.bin' AS DOUBLE) AS bin, CAST(b->>'$.count' AS BIGINT) AS cnt
                FROM ev, unnest(from_json(json_extract(tj, '$.tonechart'), '["JSON"]')) AS t(b) WHERE tj IS NOT NULL)
          GROUP BY term;

          CREATE TABLE coverage AS
          SELECT a.term, count(DISTINCT a.domain) AS domains, count(DISTINCT a.title_key) AS distinct_stories,
                 (SELECT string_agg(country || ' ' || n, ', ' ORDER BY n DESC, country)
                  FROM (SELECT country, count(*) AS n FROM articles x WHERE x.term = a.term AND coalesce(country, '') <> ''
                        GROUP BY country ORDER BY n DESC, country LIMIT 5)) AS countries
          FROM articles a GROUP BY a.term;

          COPY (
            SELECT s.term, a.hour AS hour_utc, s.pos, s.title, s.url, s.domain, s.country, s.copies, s.domains
            FROM top_stories s JOIN alerts a USING (term) ORDER BY a.ord, s.pos
          ) TO '{{ outputFiles.evidence_csv }}' (HEADER, DELIMITER ',');

          CREATE TABLE blocks AS
          SELECT a.ord,
                 '*' || a.term || '*: ' || a.mentions || ' articles in ' || a.hour || ' UTC, ' || a.ratio || 'x the expected ' || a.expected
                 || ' (z ' || a.z || '; baseline mean ' || a.baseline_mean || '/h, max ' || a.baseline_max || ')'
                 || CASE WHEN a.spiking_hours > 1 THEN chr(10) || 'Peak of ' || a.spiking_hours || ' spiking hours in this run' ELSE '' END
                 || coalesce(chr(10) || 'Tone ' || t.avg_tone || ' avg, ' || t.pct_negative || '% negative over ' || t.toned_articles || ' articles', '')
                 || coalesce(chr(10) || c.distinct_stories || ' distinct stories from ' || c.domains || ' sites' || coalesce(' (' || c.countries || ')', ''), '')
                 || coalesce(chr(10) || (SELECT string_agg('  ' || s.pos || '. <' || s.url || '|' || replace(replace(replace(s.title, '|', '/'), '<', ''), '>', '') || '> ' || s.domain
                                                           || CASE WHEN s.copies > 1 THEN ' +' || (s.copies - 1) || ' copies' ELSE '' END, chr(10) ORDER BY s.pos)
                                         FROM top_stories s WHERE s.term = a.term), chr(10) || '  (no articles returned)') AS block
          FROM alerts a
          LEFT JOIN tone t USING (term)
          LEFT JOIN coverage c USING (term);

          SELECT
            (SELECT count(*) FROM alerts) AS alerts,
            (SELECT count(*) FROM top_stories) AS stories_listed,
            (SELECT count(*) FROM articles) AS articles_fetched,
            (SELECT count(*) FROM ev WHERE aj IS NULL) AS evidence_failures,
            '*GDELT news mention spike' || CASE WHEN (SELECT count(*) FROM alerts) > 1 THEN 's' ELSE '' END || '*' || chr(10) ||
              (SELECT string_agg(block, chr(10) || chr(10) ORDER BY ord) FROM blocks) AS slack_text;

      - id: notify
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: allowFailure keeps the run usable when the webhook secret is not configured; the alert is still in the logs, the evidence CSV and the history.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: "{{ {'text': ':newspaper: ' ~ outputs.build_alert.outputs[0].row.slack_text ~ '\n<' ~ (kestra.url ?? '') ~ '/ui/main/executions/' ~ flow.namespace ~ '/' ~ flow.id ~ '/' ~ execution.id ~ '|Kestra execution>'} | toJson }}"

      - id: log_alert
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "{{ outputs.build_alert.outputs[0].row.slack_text }}"
    else:
      - id: nothing_new
        type: io.kestra.plugin.core.log.Log
        message: "No new spikes for {{ outputs.score.outputs[0].row.evaluated_hour_utc }} UTC ({{ outputs.score.outputs[0].row.spikes }} spiking hours, {{ outputs.score.outputs[0].row.suppressed }} suppressed as already alerted or in cooldown, {{ outputs.score.outputs[0].row.elevated }} elevated)."

  - id: save_history
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.score.outputFiles.history_parquet }}"
    description: Saved after the alert branch, so a run that fails while fetching evidence leaves the spike un-alerted and the next run retries it.

  - id: warn_failed_terms
    type: io.kestra.plugin.core.log.Log
    runIf: "{{ outputs.score.outputs[0].row.failed_terms > 0 }}"
    level: WARN
    message: "GDELT did not return a timeline for: {{ outputs.score.outputs[0].row.failed_list }}. Rejected queries need fixing; rate-limited terms are retried by the catch-up window on the next run."

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      GDELT data through {{ outputs.score.outputs[0].row.data_through_utc }} UTC ({{ outputs.score.outputs[0].row.lag_minutes ?? '?' }} min behind); evaluated hour {{ outputs.score.outputs[0].row.evaluated_hour_utc }} UTC for {{ outputs.score.outputs[0].row.terms }} terms ({{ outputs.score.outputs[0].row.fetched_ok }} timelines fetched){{ outputs.score.outputs[0].row.is_first_run ? ', FIRST RUN (no alert history yet)' : '' }}.
      {{ outputs.score.outputs[0].row.hours_scored }} term-hours scored: {{ outputs.score.outputs[0].row.spikes }} spiking, {{ outputs.score.outputs[0].row.new_alerts }} new alerts, {{ outputs.score.outputs[0].row.suppressed }} suppressed, {{ outputs.score.outputs[0].row.elevated }} elevated, {{ outputs.score.outputs[0].row.failed_terms }} failed terms.
      Latest hour: {{ outputs.score.outputs[0].row.latest_hour }}
      History rows: {{ outputs.score.outputs[0].row.history_rows }}. Status report: {{ outputs.score.outputFiles.status_csv }}

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.score.outputs[0].row }}"
  - id: status_csv
    type: FILE
    value: "{{ outputs.score.outputFiles.status_csv }}"
  - id: evidence_csv
    type: FILE
    required: false
    value: "{{ outputs.build_alert.outputFiles.evidence_csv ?? null }}"
  - id: history_parquet
    type: FILE
    value: "{{ outputs.score.outputFiles.history_parquet }}"

extend:
  title: Detect News Mention Spikes for Brands and Competitors with GDELT, DuckDB and Slack
  metaTitle: GDELT News Mention Spike Monitor with DuckDB and Slack | Kestra
  shortDescription: Every hour, pull GDELT DOC 2.0 mention timelines for a list of brands, products or competitors, score the last complete hour against a volume-adjusted rolling baseline in DuckDB, and send each new spike to Slack once with the most relevant articles, the sites and countries covering it and the tone of coverage.
  metaDescription: Hourly GDELT news mention spike detection per brand or competitor, scored in DuckDB, deduplicated in a Parquet history, with articles and tone in Slack.
  description: |
    A product recall, an outage, an acquisition rumour or a competitor's launch shows up in online news hours before it reaches a dashboard. The GDELT Project monitors news sites worldwide in more than 65 languages and publishes, every 15 minutes, how many of the articles it saw match a query and how many it saw in total. This flow turns that feed into an hourly spike monitor: one paced request per tracked term, a DuckDB pass that compares the last complete hour with what the term's share of coverage predicts, and, for each new spike, a Slack alert with the stories behind it and their tone. A Parquet history in the KV store makes sure each spike is reported once.

    ## How it works

    1. A `Schedule` trigger runs at 20 minutes past every hour. `window` (Return) derives a fixed 72-hour UTC window (the longest GDELT serves at 15-minute resolution) ending at the scheduled hour, so backfills fetch the right data.
    2. `previous_history` (KV Get) reads the URI of the Parquet history; on the first run `bootstrap` (If) writes an empty one.
    3. `fetch_timelines` (Loop, `concurrencyLimit: 1`) handles one term at a time. `term` turns a plain name into a GDELT query (phrases are quoted) or passes an object's raw `query` through, plus the optional `query_filter`. `until_served` (LoopUntil) repeats the `TimelineVolRaw` request every 15 seconds, up to 6 times, while GDELT answers HTTP 429. `pace` (Sleep) waits `request_pause` before the next term, as GDELT allows one request every 5 seconds.
    4. `score` (DuckDB Queries) classifies every response as OK, NO_COVERAGE, QUERY_ERROR (GDELT answers some bad queries with HTTP 200 and a plain-text message), RATE_LIMITED or FETCH_FAILED. GDELT publishes with a lag that ranges from under an hour to a few hours, so the evaluated hour is the newest hour that ended before GDELT's latest slice; a partly published hour is never scored. The 15-minute slices are rolled up to hours, and slices GDELT never published are left out instead of counted as zero. Each evaluated hour gets an expected count (the hour's monitored volume times the term's baseline mention rate), a z-score with a Poisson floor and a ratio; it is a `SPIKE` when it clears `min_mentions`, `z_threshold` and `min_ratio`. Hours missed since the term's last evaluation are re-checked, up to `catch_up_hours`.
    5. Spikes are deduplicated against the history: the same hour never alerts twice, within `cooldown_hours` a term alerts again only if its hourly count at least doubles, and several spiking catch-up hours of one term fold into a single alert for the peak hour.
    6. `alert_new_spikes` (If) runs `fetch_evidence` (Loop) for each new spike: `ArtList` with `sort=HybridRel` and `ToneChart`, both limited to the spike hour and with the same 429 handling. `build_alert` (DuckDB) folds syndicated copies of the same title into one story, keeps the stories in relevance order, computes the article-weighted tone and the share of negative coverage, and writes an evidence CSV and the Slack text. `notify` posts it (`allowFailure`) and `log_alert` logs it.
    7. `save_history` (KV Set) runs after the alert branch, so a run that fails while fetching evidence is retried. `warn_failed_terms` names terms GDELT rejected or throttled, and `summary` logs the counts.

    ## What you get

    - One Slack alert per spike: articles in the hour vs expected, ratio, z-score, baseline mean and max, tone, distinct stories and sites, top source countries and links to the most relevant stories.
    - A status CSV per run with every term and evaluated hour: status, alert state, mentions, expected, ratio, z, baseline size and GDELT's message for rejected queries.
    - A 30-day Parquet history of hourly scores per term, for charts or threshold tuning.
    - Rejected queries, throttled requests and unpublished hours reported as statuses instead of failed runs.
    - No API key, no database, no container.

    ## Who it's for

    - Communications, PR and brand teams who need to know within the hour when coverage of the company jumps.
    - Product marketing and competitive intelligence teams tracking competitors' launches, outages and deals.
    - Risk, trust and safety and investor relations teams watching suppliers, executives or tickers in the news.

    ## Why orchestrate this with Kestra

    - `Loop` with `concurrencyLimit: 1`, `LoopUntil` and `Sleep` respect GDELT's rate limit declaratively, without a hand-written client.
    - DuckDB `inputFiles` and `outputFiles` move raw JSON, the Parquet history and CSV reports between tasks.
    - The KV store keeps the history between runs, and the schedule date makes backfills deterministic.
    - `If` skips the evidence calls when nothing spiked, and `allowFailure` keeps a missing webhook from failing the run.

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB plugin and the Slack plugin (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).
    - Outbound HTTPS to `api.gdeltproject.org`; the DOC 2.0 API is free and keyless.
    - GDELT limits each IP to one request every 5 seconds. A run makes one request per term plus two per new spike; on a shared egress IP, raise `request_pause`.
    - Single words shorter than 3 letters (`AI`) are rejected by GDELT; use them inside a longer phrase or an object with a custom `query`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for spike alerts (optional; without it `notify` warns and the alert stays in the logs and the evidence CSV).

    ## Quick start

    1. Import the flow and click **Execute** with the defaults: six terms, from high-volume names to an ambiguous brand with a custom query and a niche name that is usually `LOW_VOLUME`. The first run has no alert history, so any spike already in the evaluated hour alerts.
    2. Execute again in the same hour: the hour is re-scored and spikes show as `ALREADY_ALERTED`.
    3. Add `"AI"` to `terms` and run: it comes back as `QUERY_ERROR` with GDELT's message and `warn_failed_terms` names it.
    4. To see a full alert on a quiet news day, run with `z_threshold: 0.5`, `min_ratio: 1.1`, `min_mentions: 3` and a separate `state_key`.
    5. Replace the terms with your own, add `SLACK_WEBHOOK_URL` and leave the hourly schedule on.

    ## How to extend

    - Restrict coverage with `query_filter`, for example `sourcelang:english`, `sourcecountry:US` or `domain:reuters.com`.
    - Read the term list from a namespace file so communications teams edit it without touching the flow.
    - Classify the top headlines of each spike with an AI task (recall, outage, lawsuit, earnings) before alerting.
    - Load the history Parquet into a warehouse to chart share of voice against competitors.

    ## Links

    - [Loop](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop), [LoopUntil](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loopuntil), [Sleep](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.sleep) and [If](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if)
    - [HTTP Request](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.request)
    - [KV Get](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.get) and [KV Set](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.set)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [GDELT DOC 2.0 API](https://blog.gdeltproject.org/gdelt-doc-2-0-api-debuts/)
    - [GDELT Project](https://www.gdeltproject.org/)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - Realtime & Streaming
  ee: false
  demo: false
