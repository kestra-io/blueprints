id: chaos-mesh-experiment-pause-timeout-sentinel
namespace: company.team

description: |
  Audits Chaos Mesh controller telemetry to detect experiment pause reconciliation timeouts, chaos cleanup stalls, and lingering synthetic faults.

concurrency:
  limit: 1

inputs:
  - id: chaos_mesh_metrics_url
    type: STRING
    displayName: "Chaos Mesh Metrics URL"
    defaults: "http://chaos-controller-manager.chaos-mesh.svc.cluster.local:10080"
    description: "Internal HTTP endpoint exposing Prometheus metrics for the Chaos Mesh controller manager service."

  - id: experiment_chaos_kind
    type: STRING
    displayName: "Experiment Chaos Kind"
    defaults: "NetworkChaos"
    description: "Target Chaos Mesh custom resource kind monitored for pause reconciliation and recovery latency."

  - id: max_reconciliation_duration_seconds
    type: INT
    displayName: "Max Reconciliation Duration (Seconds)"
    defaults: 180
    description: "Maximum allowable seconds for an experiment pause action to fully revert injected synthetic faults."

  - id: max_failed_recoveries_threshold
    type: INT
    displayName: "Max Failed Recoveries Threshold"
    defaults: 1
    description: "Maximum allowable failed chaos recovery attempts observed during the controller reconciliation cycle."

  - id: alert_on_lingering_chaos
    type: BOOL
    displayName: "Alert on Lingering Chaos"
    defaults: true
    description: "Toggle whether active chaos experiments exceeding scheduled window triggers an immediate incident alert."

tasks:
  - id: scan_chaos_mesh_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Chaos Mesh Prometheus metrics to audit experiment pause reconciliation times, recovery failure totals, and active injected faults.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.chaos_mesh_metrics_url }}"
      CHAOS_KIND: "{{ inputs.experiment_chaos_kind }}"
      MAX_DURATION: "{{ inputs.max_reconciliation_duration_seconds }}"
      MAX_FAILS: "{{ inputs.max_failed_recoveries_threshold }}"
      ALERT_LINGERING: "{{ inputs.alert_on_lingering_chaos }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METRICS_URL", "").rstrip("/")
      chaos_kind = os.environ.get("CHAOS_KIND", "NetworkChaos")
      max_duration = int(os.environ.get("MAX_DURATION", "180"))
      max_fails = int(os.environ.get("MAX_FAILS", "1"))
      alert_lingering = os.environ.get("ALERT_LINGERING", "true").lower() == "true"

      pause_duration_sec = 0
      failed_recoveries_total = 0
      active_experiments = 0
      reconcile_errors_count = 0
      degraded_experiments = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "chaos_mesh_reconciliation_duration_seconds" in line and chaos_kind in line:
                  pause_duration_sec = max(pause_duration_sec, int(val))
                  if pause_duration_sec > max_duration:
                      degraded_experiments.append(f"{chaos_kind}-pause-stall")
              elif "chaos_mesh_failed_reconciliation_total" in line:
                  failed_recoveries_total += int(val)
              elif "chaos_mesh_active_experiments_count" in line:
                  active_experiments = max(active_experiments, int(val))
              elif "chaos_mesh_reconcile_errors_total" in line:
                  reconcile_errors_count += int(val)
      except Exception as err:
          sys.stderr.write(f"Failed to scrape Chaos Mesh metrics from {base_url}/metrics: {err}\n")
          sys.exit(1)

      is_breached = bool(
          (pause_duration_sec > max_duration) or
          (failed_recoveries_total > max_fails) or
          (alert_lingering and reconcile_errors_count > 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"Chaos Mesh '{chaos_kind}' audit: {pause_duration_sec}s pause duration, "
          f"{failed_recoveries_total} failed recoveries, {active_experiments} active experiments, "
          f"{reconcile_errors_count} reconcile errors."
      )
      print(f"Chaos Mesh Complete: {summary}")

      Kestra.outputs({
          "pause_duration_seconds": pause_duration_sec,
          "failed_recoveries_total": failed_recoveries_total,
          "active_experiments_count": active_experiments,
          "reconcile_errors_count": reconcile_errors_count,
          "degraded_experiments": list(set(degraded_experiments)),
          "is_alerting": is_breached,
          "chaos_kind": chaos_kind,
          "audit_timestamp": now_iso
      })

  - id: evaluate_chaos_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed Chaos Mesh pause durations, recovery failures, or reconcile errors breach thresholds.
    condition: "{{ outputs.scan_chaos_mesh_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_resilience_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to SRE Resilience Slack channel detailing lingering synthetic chaos faults.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#resilience-engineering-alerts",
            "text": "CRITICAL: Chaos Mesh Experiment Pause Timeout for Kind `{{ inputs.experiment_chaos_kind }}`. Pause Duration: `{{ outputs.scan_chaos_mesh_telemetry.vars.pause_duration_seconds }}`s (max allowable: `{{ inputs.max_reconciliation_duration_seconds }}`s). Failed Recoveries: `{{ outputs.scan_chaos_mesh_telemetry.vars.failed_recoveries_total }}` (threshold: `{{ inputs.max_failed_recoveries_threshold }}`). Active Experiments: `{{ outputs.scan_chaos_mesh_telemetry.vars.active_experiments_count }}`. Reconcile Errors: `{{ outputs.scan_chaos_mesh_telemetry.vars.reconcile_errors_count }}`. Audit Timestamp: `{{ outputs.scan_chaos_mesh_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_chaos_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Chaos Mesh controller executes and reverts experiments within expected safety parameters.
        message: "Chaos Mesh operating nominally: {{ outputs.scan_chaos_mesh_telemetry.vars.active_experiments_count }} experiments active, pause latency {{ outputs.scan_chaos_mesh_telemetry.vars.pause_duration_seconds }}s, zero failed recoveries."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured JSON audit manifest for chaos engineering governance and cluster safety compliance records.
    format: |
      {
        "sentinel_id": "chaos-mesh-experiment-pause-timeout-sentinel",
        "chaos_kind": "{{ outputs.scan_chaos_mesh_telemetry.vars.chaos_kind }}",
        "pause_duration_seconds": {{ outputs.scan_chaos_mesh_telemetry.vars.pause_duration_seconds }},
        "failed_recoveries": {{ outputs.scan_chaos_mesh_telemetry.vars.failed_recoveries_total }},
        "active_experiments": {{ outputs.scan_chaos_mesh_telemetry.vars.active_experiments_count }},
        "reconcile_errors": {{ outputs.scan_chaos_mesh_telemetry.vars.reconcile_errors_count }},
        "degraded_experiments": {{ outputs.scan_chaos_mesh_telemetry.vars.degraded_experiments | toJson }},
        "breach_detected": {{ outputs.scan_chaos_mesh_telemetry.vars.is_alerting }},
        "execution_timestamp": "{{ outputs.scan_chaos_mesh_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_chaos_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#resilience-engineering-alerts",
        "text": ":warning: *Chaos Mesh Sentinel Execution Failure*: Failed to query Chaos Mesh controller metrics at `{{ inputs.chaos_mesh_metrics_url }}`."
      }

extend:
  title: Chaos Mesh Experiment Pause Timeout Sentinel
  metaTitle: Chaos Mesh Experiment Pause Timeout Sentinel
  shortDescription: Monitors Chaos Mesh experiments to detect pause reconciliation timeouts and chaos injection stalls.
  metaDescription: Scrapes Chaos Mesh controller metrics to detect experiment pause reconciliation timeouts, injected faults, and chaos stalls.
  description: |
    Automates continuous safety surveillance for Chaos Mesh experiments across enterprise Kubernetes clusters. The workflow audits Chaos Mesh controller Prometheus metrics to detect lingering synthetic faults, pause reconciliation timeouts, and chaos daemon cleanup failures before experimental disruptions impact production availability.

    ## How it works
    1. A schedule trigger executes the Chaos Mesh safety audit workflow every 15 minutes.
    2. The Python task queries the Chaos Mesh controller manager Prometheus endpoint on port 10080.
    3. The script extracts pause reconciliation durations, failed cleanup attempts, and active chaos experiment counts.
    4. An evaluation gate determines whether pause reconciliation times or recovery failure counts exceed bounds.
    5. When lingering synthetic faults or cleanup stalls are detected, a high-priority Slack incident alert is dispatched.
    6. When chaos experiments pause and clean up injected faults smoothly, nominal telemetry is recorded in logs.
    7. A structured JSON audit manifest is emitted for resilience governance and compliance tracking systems.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Chaos Mesh Metrics]
        ScanMetrics --> EvalBreach{Pause > 180s OR Fails > 1 OR Errors > 0?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Resilience Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Chaos State]
        SlackAlert --> EmitManifest[Debug Return: Chaos Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes Chaos Mesh Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether pause reconciliation latencies or recovery failures exceed limits.
    - **Notification Task**: Dispatches structured Slack alerts with affected chaos kinds and duration metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing chaos safety metrics and timestamps.

    ## Key capabilities
    - Continuous surveillance of Chaos Mesh controllers, chaos-daemon agents, and custom resource definitions.
    - Early warning detection for failed iptables, tc netem, or cgroup cleanup during experiment pause.
    - Automated tracking of lingering network packet loss, latency injection, or pod kill operations.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into chaos engineering safety bounds and experiment lifecycle health.
    - Proactive alerts preventing synthetic chaos from inadvertently turning into production outages.
    - Standardized audit manifests containing exact pause times, recovery failures, and active faults.
    - Zero-overhead deployment compatible with Chaos Mesh on any certified Kubernetes environment.

    ## Who it's for
    - Resilience and Chaos Engineering teams conducting game days and automated fault injection drills.
    - Site Reliability Engineers ensuring synthetic chaos tests strictly respect blast radius and duration limits.
    - Platform architects establishing automated guardrails around chaos testing in staging and production.
    - DevOps engineers diagnosing chaos-daemon agent permission errors and Linux kernel tc queue stalls.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages chaos engineering surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical chaos recovery metrics in searchable Kestra execution logs.

    ## Use cases
    - **Lingering Network Latency**: Catches experiments where injected netem delay is not flushed from pod interfaces.
    - **Daemon Communication Loss**: Detects controller inability to reach node-level chaos-daemon pods for cleanup.
    - **Blast Radius Escalation**: Alerts operators when an experiment continues injecting faults beyond scheduled windows.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `chaos_mesh_metrics_url` | STRING | `http://chaos-controller-manager.chaos-mesh.svc.cluster.local:10080` | Internal HTTP URL exposing Prometheus metrics for Chaos Mesh. |
    | `experiment_chaos_kind` | STRING | `NetworkChaos` | Target Chaos Mesh custom resource kind monitored. |
    | `max_reconciliation_duration_seconds` | INT | `180` | Maximum allowable seconds for an experiment pause action before alerting. |
    | `max_failed_recoveries_threshold` | INT | `1` | Maximum allowable failed chaos recoveries before alerting. |
    | `alert_on_lingering_chaos` | BOOL | `true` | Toggle whether controller reconcile errors trigger an alert. |

    ## Expected outputs
    - `{{ outputs.scan_chaos_mesh_telemetry.vars.pause_duration_seconds }}`: Maximum observed pause reconciliation duration.
    - `{{ outputs.scan_chaos_mesh_telemetry.vars.failed_recoveries_total }}`: Total count of failed chaos recovery attempts.
    - `{{ outputs.scan_chaos_mesh_telemetry.vars.active_experiments_count }}`: Count of active Chaos Mesh experiments running.
    - `{{ outputs.scan_chaos_mesh_telemetry.vars.is_alerting }}`: Boolean flag indicating if chaos bounds are breached.
    - `{{ outputs.scan_chaos_mesh_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the Chaos Mesh audit run.

    ## Prerequisites
    - Chaos Mesh installed in the Kubernetes cluster with controller metrics enabled on port 10080.
    - Network connectivity from the Kestra worker to the Chaos Mesh controller manager service.
    - Configured Slack incoming webhook URL with permissions to post in resilience alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing chaos alerts to the Resilience Slack channel.

    ## Quick start
    1. Verify that Chaos Mesh controller manager exposes Prometheus metrics on HTTP port 10080.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your target chaos resource in `experiment_chaos_kind`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_chaos_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **Privileged Daemon Permissions**: `chaos-daemon` requires root capabilities to manipulate container network namespaces.
    - **Target Pod Termination**: Deleting a target pod while chaos is injected leaves orphan CRD status conditions.
    - **Container Runtime Socket Mismatch**: If containerd socket path differs from default, daemon fails to inject faults.
    - **Webhook Certificate Expiry**: Expired validating/mutating webhook certificates prevent chaos CRD reconciliation.

    ## How to extend
    - **Automated Emergency Abort**: Execute a Kestra Kubernetes CLI task to delete lingering Chaos CRDs if pause hangs.
    - **PagerDuty Escalation**: Escalate to on-call resilience engineers if recovery failures persist beyond 10 minutes.
    - **Multi-Kind Fleet Audit**: Expand script parameters to monitor `IOChaos`, `TimeChaos`, and `StressChaos` CRDs.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Chaos Mesh Official Documentation](https://chaos-mesh.org/docs/)
    - [Chaos Mesh Architecture and Controller Manager Guide](https://chaos-mesh.org/docs/architecture/)
    - [Chaos Mesh Metrics and Observability Reference](https://chaos-mesh.org/docs/chaos-mesh-metrics/)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
