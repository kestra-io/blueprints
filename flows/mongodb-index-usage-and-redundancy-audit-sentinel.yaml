id: mongodb-index-usage-and-redundancy-audit-sentinel
namespace: company.data

inputs:
  - id: mongo_uri
    type: STRING
    defaults: "mongodb://mongodb.internal:27017"
    description: MongoDB connection string URI.
  - id: target_database
    type: STRING
    defaults: "production"
    description: Target database name to audit for unused indexes.
  - id: unused_ops_threshold
    type: INT
    defaults: 0
    description: Maximum acceptable index accesses count before classifying index as unused.

tasks:
  - id: audit_index_stats
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    dependencies:
      - pymongo==4.15.3
      - kestra==2.0.0
    script: |
      from pymongo import MongoClient
      import sys
      from kestra import Kestra

      mongo_uri = "{{ inputs.mongo_uri }}"
      target_db_name = "{{ inputs.target_database }}"
      threshold = int("{{ inputs.unused_ops_threshold }}")

      try:
          client = MongoClient(mongo_uri, serverSelectionTimeoutMS=5000)
          target_db = client[target_db_name]
          collections = target_db.list_collection_names()
          unused_indexes = []

          for coll in collections:
              if coll.startswith("system."):
                  continue
              try:
                  stats = list(target_db[coll].aggregate([{"$indexStats": {}}]))
                  for idx in stats:
                      name = idx.get("name", "")
                      accesses = idx.get("accesses", {})
                      ops = accesses.get("ops", 0)
                      if name != "_id_" and ops <= threshold:
                          unused_indexes.append({
                              "collection": coll,
                              "name": name,
                              "ops": ops
                          })
              except Exception as e:
                  print(f"Skipping collection {coll} due to error: {e}")

          unused_count = len(unused_indexes)
          print(f"Audited database '{target_db_name}': {unused_count} unused indexes found.")

          Kestra.outputs({
              "unused_count": unused_count
          })
      except Exception as e:
          print(f"Error querying MongoDB index stats: {e}", file=sys.stderr)
          sys.exit(1)

  - id: evaluate_index_sprawl
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_index_stats.vars.unused_count | int > 0 }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#mongodb-alerts",
            "attachments": [
              {
                "color": "warning",
                "title": "⚠️ MongoDB Unused Index Sprawl Detected",
                "text": "Database `{{ inputs.target_database }}` on `{{ inputs.mongo_uri }}` has *{{ outputs.audit_index_stats.vars.unused_count }}* unused indexes! Impact: Unused indexes consume valuable WiredTiger RAM cache and incur heavy write amplification on document inserts, updates, and deletes.",
                "footer": "Kestra Database Sentinel • MongoDB"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#mongodb-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ MongoDB Unused and Redundant Index Sprawl Sentinel Pipeline Failure",
            "text": "Failed to audit MongoDB $indexStats. Please check database URI and permissions.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

outputs:
  - id: unused_count
    type: INT
    value: "{{ outputs.audit_index_stats.vars.unused_count }}"

extend:
  metaDescription: "Audits MongoDB collection index statistics using $indexStats to detect unused indexes and reclaim RAM/write I/O."
  metaTitle: MongoDB Unused and Redundant Index Sprawl Sentinel with Kestra
  title: MongoDB Unused and Redundant Index Sprawl Sentinel
  shortDescription: Audits MongoDB collection index statistics using $indexStats to detect unused indexes and reclaim RAM/write I/O.
  description: |
    ## How it works
    This workflow executes an `$indexStats` aggregation pipeline across all non-system collections in the specified database via a containerized Python script. MongoDB maintains index access counters since the last mongod restart. Indexes with zero operations (`accesses.ops == 0`) burden memory and write throughput without accelerating any read queries. When unused indexes are detected, an audit report is dispatched to Slack.

    ## What you get
    - Automated detection of dead and redundant MongoDB indexes.
    - Frees WiredTiger cache memory and eliminates write amplification.
    - Precise identification of collection and index names.

    ## Who it's for
    - Database Administrators (DBAs) optimizing MongoDB database performance.
    - Application developers refactoring legacy database schemas.

    ## Why orchestrate this with Kestra
    - **Zero Agent Requirement**: Inspects database catalogs directly using PyMongo in Docker.
    - **Continuous Index Hygiene**: Run weekly audits without manual query analysis.
    - **Proactive Tuning**: Keep database memory lean for active working datasets.

    ## Prerequisites
    - MongoDB cluster with standard client access.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Configure `mongo_uri` and `target_database`.
    3. Run the workflow to discover unused indexes.

    ## How to extend
    - Automatically generate `dropIndex()` remediation scripts for verified stale indexes.
    - Include index size calculations from `collStats`.

    ## Links
    - [MongoDB $indexStats Aggregation](https://www.mongodb.com/docs/manual/reference/operator/aggregation/indexStats/)
    - [Kestra Python Plugin](https://kestra.io/plugins/plugin-script-python)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Policy & Compliance
    - ELT & Data Landing
  ee: false
  demo: false
