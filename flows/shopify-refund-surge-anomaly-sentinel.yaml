id: shopify-refund-surge-anomaly-sentinel
namespace: company.ecommerce

inputs:
  - id: shopify_shop_name
    type: STRING
    displayName: Shopify Shop Name
    defaults: "my-ecommerce-store"
    description: Shopify store domain slug (e.g. 'my-ecommerce-store' for my-ecommerce-store.myshopify.com).

  - id: api_version
    type: STRING
    displayName: Shopify Admin API Version
    defaults: "2024-07"
    description: Supported Shopify GraphQL Admin API version string (e.g. '2024-07' or '2024-10').

  - id: max_refund_count_threshold
    type: INT
    displayName: Refund Count Anomaly Threshold
    defaults: 5
    description: Maximum tolerable refunded orders in the audit window before triggering an anomaly incident alert.

  - id: orders_batch_limit
    type: INT
    displayName: Orders Evaluation Limit
    defaults: 25
    description: Maximum number of recent refunded orders to evaluate per execution.

triggers:
  - id: daily_refund_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Daily audit sweep at 18:00 UTC to evaluate refund volumes and alert on return anomalies. Shipped disabled by default.
    cron: "0 18 * * *"
    disabled: true

tasks:
  - id: fetch_refunded_orders
    type: io.kestra.plugin.graphql.Request
    description: Query Shopify Admin GraphQL API for orders with refunded or partially refunded financial status.
    uri: "https://{{ inputs.shopify_shop_name }}.myshopify.com/admin/api/{{ inputs.api_version }}/graphql.json"
    headers:
      X-Shopify-Access-Token: "{{ secret('SHOPIFY_ACCESS_TOKEN') }}"
      Content-Type: "application/json"
      User-Agent: "Kestra-Shopify-Refund-Sentinel/1.0"
    failOnGraphQLErrors: false
    allowFailed: true
    query: |
      query GetRefundedOrders {
        orders(first: {{ inputs.orders_batch_limit }}, query: "financial_status:refunded OR financial_status:partially_refunded") {
          edges {
            node {
              id
              name
              createdAt
              totalPriceSet {
                shopMoney {
                  amount
                  currencyCode
                }
              }
              totalRefundedSet {
                shopMoney {
                  amount
                  currencyCode
                }
              }
              customer {
                displayName
                email
              }
            }
          }
        }
      }

  - id: evaluate_refund_volume
    type: io.kestra.plugin.core.flow.If
    description: Check whether discovered refunded orders breach the anomaly threshold.
    condition: "{{ outputs.fetch_refunded_orders.body is defined and outputs.fetch_refunded_orders.body.orders is defined and ((outputs.fetch_refunded_orders.body.orders.edges | length) > inputs.max_refund_count_threshold) }}"
    then:
      - id: alert_refund_surge
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch high-priority Slack incident alert to Merchant Operations and Finance detailing the refund spike.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🚨 *SHOPIFY REVENUE ALERT: Order Refund & Return Surge Detected* 🚨\n\n*Store:* `{{ inputs.shopify_shop_name }}`\n*Refunded Orders Count:* {{ outputs.fetch_refunded_orders.body.orders.edges | length }}\n*Threshold:* > {{ inputs.max_refund_count_threshold }}\n\n*Flagged Orders:*\n{{ outputs.fetch_refunded_orders.body.orders.edges | jq('[.[].node | \"• Order *\" + .name + \"*: Refunded \" + .totalRefundedSet.shopMoney.amount + \" \" + .totalRefundedSet.shopMoney.currencyCode + \" of \" + .totalPriceSet.shopMoney.amount + \" \" + .totalPriceSet.shopMoney.currencyCode + \" - Customer: \" + (.customer.displayName // \"Guest\") + \" (\" + (.customer.email // \"no email\") + \")\"] | join(\"\\n\")') | first }}\n\n*Execution ID:* {{ execution.id }}\n*Action Required:* Merchant operations please investigate product quality, fulfillment issues, or batch sizing discrepancies."
          }
    else:
      - id: log_refunds_normal
        type: io.kestra.plugin.core.log.Log
        description: Log clean operational status when refund volumes remain within standard thresholds.
        message: "HEALTHY: Refunded order volume is within normal limits on store {{ inputs.shopify_shop_name }}."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Record final audit metrics for financial reconciliation.
    message: "Shopify refund audit finished for {{ inputs.shopify_shop_name }}. Total evaluated refunds: {{ outputs.fetch_refunded_orders.body is defined and outputs.fetch_refunded_orders.body.orders is defined ? (outputs.fetch_refunded_orders.body.orders.edges | length) : 0 }}."

errors:
  - id: alert_on_shopify_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert E-Commerce Operations if Shopify Admin GraphQL API request encounters failure.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *Shopify Refund Sentinel Error*: Execution `{{ execution.id }}` failed to query store `{{ inputs.shopify_shop_name }}`. Check SHOPIFY_ACCESS_TOKEN permissions."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.fetch_refunded_orders.body is defined and outputs.fetch_refunded_orders.body.orders is defined and ((outputs.fetch_refunded_orders.body.orders.edges | length) > inputs.max_refund_count_threshold) ? 'REFUND_SURGE_DETECTED' : 'HEALTHY' }}"
  - id: refunded_orders_count
    type: INT
    value: "{{ outputs.fetch_refunded_orders.body is defined and outputs.fetch_refunded_orders.body.orders is defined ? (outputs.fetch_refunded_orders.body.orders.edges | length) : 0 }}"

extend:
  title: Shopify refund surge and return rate anomaly sentinel
  metaTitle: Shopify Refund Surge Anomaly Sentinel | Kestra
  shortDescription: E-commerce sentinel that queries Shopify Admin GraphQL API for refund surges, alerting merchant operations to batch product flaws and shipping issues.
  metaDescription: Audit Shopify refunded orders via GraphQL Admin API to detect return rate spikes and dispatch incident alerts to merchant operations and finance teams.
  description: |
    Protect e-commerce store margins and detect product quality defects or fulfillment errors early by monitoring order refund surges. In high-volume e-commerce storefronts, sudden clusters of customer refunds and return requests often point directly to underlying operational issues: a defective manufacturing batch, broken size charts, corrupted third-party payment gateways, or packages damaged by logistics carriers. When refunds spike, merchant support and finance teams need immediate visibility to halt marketing spend or quarantine defective inventory. This blueprint runs a daily audit via the Shopify Admin GraphQL API (`io.kestra.plugin.graphql.Request`), evaluates refunded and partially refunded order volumes, and delivers an itemized Slack alert with order numbers, customer identities, and monetary refund amounts.

    ## How it works
    1. A `Schedule` trigger executes an audit daily at 18:00 UTC (shipped disabled by default).
    2. Task `fetch_refunded_orders` queries the Shopify Admin GraphQL API endpoint (`https://<shop>.myshopify.com/admin/api/<version>/graphql.json`) authenticated via `X-Shopify-Access-Token`. It fetches orders matching `financial_status:refunded OR financial_status:partially_refunded` with total prices, refunded amounts, currency codes, and customer emails.
    3. Task `evaluate_refund_volume` (`io.kestra.plugin.core.flow.If`) compares discovered refund counts against `inputs.max_refund_count_threshold`:
       - If refunds exceed threshold: Task `alert_refund_surge` posts an itemized Slack alert itemizing order IDs, customer contacts, and monetary amounts.
       - If refund rates are normal: Task `log_refunds_normal` logs clean operational status.
    4. Task `log_audit_summary` records total evaluated refund metrics.
    5. Top-level `errors` handler catches API authentication or network connection errors.

    ## What you get
    - Proactive early warning of customer return spikes and refund anomalies.
    - Faster root-cause isolation of product manufacturing flaws and shipping damages.
    - Clickable Slack digests displaying exact refunded sums and customer contacts.
    - Observability and audit lineage for e-commerce revenue reconciliation.

    ## Who it's for
    - E-Commerce Store Managers and Merchant Operations Directors.
    - Quality Assurance (QA) and Product Development teams monitoring customer feedback.
    - FinOps and Accounting Specialists reconciling daily payment processor refunds.

    ## Why orchestrate this with Kestra
    Manual reviews of Shopify refund dashboards at the end of the month come too late to prevent customer churn or pull defective products from warehouse shelves. Kestra provides scheduled, version-controlled automation that queries Shopify's GraphQL API directly, evaluates refund thresholds in memory with jq expressions, and alerts operational Slack channels within minutes of an anomaly.

    ## Prerequisites
    - A Shopify store with access to the Shopify Admin API.
    - API scopes including `read_orders` enabled on the access token.
    - A Slack Incoming Webhook URL.

    ### Secrets
    - `SHOPIFY_ACCESS_TOKEN`: Shopify Admin API access token passed in the `X-Shopify-Access-Token` header.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to post refund anomaly alerts.

    ## Quick start
    1. Create a Custom App in Shopify Admin under **Settings > Apps and sales channels > Develop apps** with `read_orders` scope.
    2. Store your access token and Slack webhook in Kestra Secrets (`SHOPIFY_ACCESS_TOKEN` and `SLACK_WEBHOOK_URL`).
    3. Configure `shopify_shop_name` with your store domain slug (e.g. `brand-store`).
    4. Execute the flow manually in Kestra to confirm successful GraphQL connection.
    5. Enable the `daily_refund_sweep` schedule to activate daily refund monitoring.

    ## How to extend
    - Query individual order line items to identify which specific SKU has the highest return concentration.
    - Automatically apply a `"Quarantined Review"` tag to products experiencing abnormal return rates.
    - Sync refund sums into Stripe or QuickBooks to automate accounting journal entries.

    ## Links
    - [Shopify GraphQL Admin API: Orders](https://shopify.dev/docs/api/admin-graphql/latest/queries/orders)
    - [Kestra GraphQL Plugin](https://kestra.io/plugins/plugin-graphql)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Business
    - Infrastructure
  subTags:
    - Incident Response
    - Monitoring & Alerting
  ee: false
  demo: false
