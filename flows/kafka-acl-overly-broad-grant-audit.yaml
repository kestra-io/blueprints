id: kafka-acl-overly-broad-grant-audit
namespace: company.team

description: |
  Audit Kafka ACLs for grants that are broader than any service needs: ALLOW for every principal
  (User:*), ALLOW on every topic or group (name *), cluster-wide ALL or ALTER, operation ALL on
  a topic or group, and ACLs for principals that are not a known service account. Alert Slack,
  and optionally delete the high-severity ACLs one by one with AclDelete, then list the ACLs
  again to prove they are gone. Medium findings are reported, never deleted.

inputs:
  - id: bootstrap_servers
    type: STRING
    displayName: Kafka bootstrap servers
    defaults: "localhost:9092"

  - id: known_principals
    type: ARRAY
    itemType: STRING
    displayName: Known principals
    description: Service accounts expected to have ACLs. ACLs for any other principal are reported as unknown.
    defaults:
      - "User:orders-svc"
      - "User:billing"
      - "User:analytics"

  - id: admin_principals
    type: ARRAY
    itemType: STRING
    displayName: Admin principals
    description: Principals allowed to hold broad grants (operation ALL, cluster rights, wildcard resources).
    defaults:
      - "User:kafka-admin"

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    description: Delete the ACLs behind high-severity findings. Medium findings are only reported.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, for AclDelete to run.
    defaults: true

tasks:
  - id: list_acls
    type: io.kestra.plugin.kafka.AclList
    description: Read-only. Every ACL binding on the cluster.
    properties:
      bootstrap.servers: "{{ inputs.bootstrap_servers }}"

  - id: findings
    type: io.kestra.plugin.core.output.OutputValues
    description: One finding per ACL, with the most severe rule it breaks.
    values:
      items: >-
        {{ {'acls': outputs.list_acls.acls ?? [], 'known': inputs.known_principals, 'admins': inputs.admin_principals} | jq('
           .known as $known | .admins as $admins
           | [.acls[] | select(.permissionType == "ALLOW") | . as $a
              | ($admins | index($a.principal) != null) as $admin
              | [ (if .principal == "User:*" then {code: "WILDCARD_PRINCIPAL", severity: "HIGH", why: "any authenticated or anonymous client"} else empty end),
                  (if (.resourceName == "*" and .patternType == "LITERAL") and ($admin | not) then {code: "WILDCARD_RESOURCE", severity: "HIGH", why: "every \(.resourceType | ascii_downcase)"} else empty end),
                  (if .resourceType == "CLUSTER" and (.operation == "ALL" or .operation == "ALTER") and ($admin | not) then {code: "CLUSTER_ADMIN_RIGHTS", severity: "HIGH", why: "can alter the cluster, ACLs included"} else empty end),
                  (if .operation == "ALL" and .resourceType != "CLUSTER" and ($admin | not) then {code: "OPERATION_ALL", severity: "MEDIUM", why: "includes DELETE and ALTER"} else empty end),
                  (if .principal != "User:*" and ($known | index($a.principal) == null) and ($admin | not) then {code: "UNKNOWN_PRINCIPAL", severity: "MEDIUM", why: "not a known service account"} else empty end) ]
              | select(length > 0) | (sort_by(.severity) | first) + {acl: $a, codes: (map(.code) | join("+"))}]') | first | toJson }}

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      Kafka ACL audit on {{ inputs.bootstrap_servers }}: {{ outputs.list_acls.acls | length }} ACLs, {{ fromJson(outputs.findings.values.items) | length }} findings.
      {{ fromJson(outputs.findings.values.items) | jq('map("\(.severity) \(.codes) \(.acl.principal) \(.acl.operation) on \(.acl.resourceType) \(.acl.resourceName) (\(.acl.patternType)): \(.why)") | join("; ")') | first }}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(outputs.findings.values.items) | length > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'Kafka ACL audit on ' ~ inputs.bootstrap_servers ~ ': ' ~ (fromJson(outputs.findings.values.items) | jq('map("\(.severity) \(.codes): \(.acl.principal) \(.acl.operation) on \(.acl.resourceType) \(.acl.resourceName)") | join("; ")') | first) ~ '.' ~ (inputs.auto_remediate and not inputs.dry_run ? ' Deleting the high-severity ACLs now.' : ' No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run and fromJson(outputs.findings.values.items) | jq('map(select(.severity == \"HIGH\")) | length') | first > 0 }}"
        then:
          - id: remediate
            type: io.kestra.plugin.core.flow.Loop
            description: One AclDelete per high-severity ACL, matching every field so no other binding is removed.
            values: "{{ fromJson(outputs.findings.values.items) | jq('[.[] | select(.severity == \"HIGH\") | .acl]') | first | toJson }}"
            tasks:
              - id: delete
                type: io.kestra.plugin.kafka.AclDelete
                properties:
                  bootstrap.servers: "{{ inputs.bootstrap_servers }}"
                resourceType: "{{ fromJson(item.value).resourceType }}"
                resourceName: "{{ fromJson(item.value).resourceName }}"
                patternType: "{{ fromJson(item.value).patternType }}"
                principal: "{{ fromJson(item.value).principal }}"
                host: "{{ fromJson(item.value).host }}"
                operation: "{{ fromJson(item.value).operation }}"
                permissionType: "{{ fromJson(item.value).permissionType }}"

          - id: relist
            type: io.kestra.plugin.kafka.AclList
            properties:
              bootstrap.servers: "{{ inputs.bootstrap_servers }}"

          - id: verify_result
            type: io.kestra.plugin.core.flow.If
            description: Every deleted ACL must be absent, and every other ACL must still be there.
            condition: >-
              {{ {'f': fromJson(outputs.findings.values.items), 'before': outputs.list_acls.acls, 'after': outputs.relist.acls ?? []} | jq('
                 ([.f[] | select(.severity == "HIGH") | .acl | tojson]) as $del | ([.after[] | tojson]) as $now
                 | ([$del[] | select(. as $x | $now | index($x))] | length) + ([.before[] | tojson | select(. as $x | ($del | index($x) | not) and ($now | index($x) | not))] | length)') | first > 0 }}
            then:
              - id: remediation_failed
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: "AclDelete ran, but the ACL list after it does not match the plan: a high-severity ACL is still there, or another ACL disappeared."
            else:
              - id: remediated
                type: io.kestra.plugin.core.log.Log
                message: >-
                  Deleted and verified {{ fromJson(outputs.findings.values.items) | jq('map(select(.severity == "HIGH")) | length') | first }} ACLs,
                  {{ outputs.relist.acls | length }} ACLs left. Medium findings left for review:
                  {{ fromJson(outputs.findings.values.items) | jq('map(select(.severity == "MEDIUM") | "\(.acl.principal) \(.acl.operation) \(.acl.resourceName)") | join(", ")') | first }}.
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "No overly broad or unknown ACL."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Kafka ACL audit failed on ' ~ inputs.bootstrap_servers ~ ' (execution ' ~ execution.id ~ '). Treat the ACLs as unaudited.'} | toJson }}

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled, and always in safe mode.
    cron: "0 7 * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: Kafka ACL Overly Broad Grant Audit
  shortDescription: Find Kafka ACLs that grant too much (User:*, wildcard topics, cluster ALL, operation ALL) or belong to unknown principals, alert Slack, and optionally delete the high-severity ones and verify.
  metaTitle: Kafka ACL Overly Broad Grant Audit with Kestra
  metaDescription: Audit Kafka ACLs for wildcard principals, wildcard resources, cluster admin rights and unknown principals, alert Slack, delete with AclDelete and verify.
  description: |
    Kafka ACLs grow by accretion. A `User:*` ALLOW added to unblock a migration and never removed. A legacy ETL account still holding `ALL` on the cluster, which lets it rewrite every ACL. A test principal reading a production topic. Each of these turns one leaked credential, or no credential at all, into access to every topic.

    This blueprint lists every ACL with the Kafka AdminClient and flags the grants that are broader than any service needs. It alerts Slack, and can delete the high-severity ACLs one by one with `AclDelete`. It then lists the ACLs again to prove the bad ones are gone and nothing else was touched.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Findings

    | Finding | Severity | Rule | Deleted by remediation |
    |---|---|---|---|
    | `WILDCARD_PRINCIPAL` | High | ALLOW for `User:*` | Yes |
    | `WILDCARD_RESOURCE` | High | ALLOW on every topic, group or transactional ID (`*`, literal), outside the admin principals | Yes |
    | `CLUSTER_ADMIN_RIGHTS` | High | `ALL` or `ALTER` on the cluster, outside the admin principals | Yes |
    | `OPERATION_ALL` | Medium | `ALL` on a topic or group, which includes `DELETE` and `ALTER` | No, report only |
    | `UNKNOWN_PRINCIPAL` | Medium | ACL for a principal that is not in `known_principals` | No, report only |

    Each ACL is reported once, with every rule it breaks and the most severe one first. `DENY` ACLs are never flagged.

    ## How it works

    1. `list_acls` (`io.kestra.plugin.kafka.AclList`, read-only) returns every ACL binding.
    2. `findings` applies the rules in one jq expression. `summary` logs every finding.
    3. `route` (`io.kestra.plugin.core.flow.If`):
       - **clean:** logs it.
       - **findings:** `alert` posts to Slack.
         - `remediate_gate` runs only when `auto_remediate` is true, `dry_run` is false, and there is a high-severity finding.
         - `remediate` (`io.kestra.plugin.core.flow.Loop` over `io.kestra.plugin.kafka.AclDelete`) deletes each high-severity ACL, matching all seven fields so no other binding matches the filter.
         - `relist` and `verify_result` check that every deleted ACL is gone and every other ACL is still there.
    4. `errors` alerts Slack when the audit cannot run.

    ## What you get

    - A daily review of every ACL on the cluster, with the reason each finding matters.
    - Deletion limited to the high-severity grants, each matched exactly, behind two gates.
    - A verification that compares the ACL list before and after, so an over-broad delete filter would fail the run.

    ## Who it's for

    - Platform and security teams that run a shared Kafka cluster with ACLs enabled.
    - Teams preparing for an audit that asks who can read which topic.
    - Teams evaluating the Kafka plugin who want an example of `AclList` and `AclDelete` with gates around them.

    ## Why orchestrate this with Kestra

    `kafka-acls.sh --list` prints the ACLs, but nobody reads it every day. Kestra runs the review on a schedule, keeps the list of known and admin principals next to the flow, turns findings into a Slack alert, deletes only behind `auto_remediate` and `dry_run`, and keeps a history of every run as evidence that broad grants were found and removed.

    ## Tested end to end

    On Kestra 2.0.5 OSS against Apache Kafka 3.9.1 (KRaft, `StandardAuthorizer`), with a local HTTP sink standing in for Slack. The 9 seeded ACLs include:
    - legitimate grants for `orders-svc`, `billing` and `analytics`;
    - `User:*` with `ALL` on every topic, and `legacy-etl` with `ALL` on the cluster;
    - `billing` with `ALL` on a group, and an unknown `intern-test` reading `orders`.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | defaults | 4 findings: 2 high (`User:*` on every topic, `legacy-etl` on the cluster), 2 medium. Legitimate ACLs not flagged. Alert sent |
    | 2 | `auto_remediate: true`, `dry_run: true` | Same report. `kafka-acls.sh --list` still shows 9 ACLs |
    | 3 | `auto_remediate: true`, `dry_run: false` | 2 `AclDelete` calls, verified. `kafka-acls.sh` shows 7 ACLs, no `User:*`, no `legacy-etl` |
    | 4 | same again | Only the 2 medium findings left. Nothing deleted |
    | 5 | `kafka-admin` granted `ALL` on the cluster and on every topic | Not flagged: it is an admin principal |
    | 6 | unreachable broker | `errors` alert sent |

    ## Prerequisites

    - A Kafka cluster with an authorizer enabled, reachable from the Kestra worker, and a principal allowed to describe and, for remediation, alter ACLs (cluster `ALTER`).
    - Local testing: run `apache/kafka:3.9.1` with:
      - `KAFKA_AUTHORIZER_CLASS_NAME=org.apache.kafka.metadata.authorizer.StandardAuthorizer`;
      - `KAFKA_SUPER_USERS=User:ANONYMOUS`.

      Then add ACLs with `kafka-acls.sh --add`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: used by `alert` and the `errors` block. In Kestra OSS, provide it as the base64-encoded environment variable `SECRET_SLACK_WEBHOOK_URL`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `bootstrap_servers` | `localhost:9092` | Brokers |
    | `known_principals` | 3 example services | Expected service accounts |
    | `admin_principals` | `[User:kafka-admin]` | Allowed broad grants |
    | `auto_remediate` | `false` | Allow `AclDelete` |
    | `dry_run` | `true` | Must be `false` for a delete to run |

    ## Quick start

    1. Add the `SLACK_WEBHOOK_URL` secret.
    2. Import the flow and set `bootstrap_servers`, `known_principals` and `admin_principals`.
    3. Run it once and read the findings.
    4. Before deleting a `User:*` grant, check which clients rely on it. Then run with `auto_remediate: true` and `dry_run: false`.
    5. Enable the `daily` trigger, which always runs in safe mode.

    ## How to extend

    - Load the known principals from your identity provider or a namespace file reviewed in Git.
    - Add a rule for prefixed patterns that are too short, such as a prefix of one character.
    - Create the narrow replacement ACLs before deleting a broad one, from a declared map of service to topics.
    - Open a ticket for each medium finding, assigned to the owner of the principal.

    ## Links

    - Kafka authorization and ACLs: https://kafka.apache.org/documentation/#security_authz
    - Kafka plugin: https://kestra.io/plugins/plugin-kafka
  tags:
    - Data
    - Infrastructure
  subTags:
    - Policy & Compliance
    - Day 2 Operations
  ee: false
  demo: false
