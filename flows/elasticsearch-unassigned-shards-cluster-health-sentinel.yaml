id: elasticsearch-unassigned-shards-cluster-health-sentinel
namespace: company.sre

description: |
  Audits Elasticsearch cluster health state and unassigned primary or replica shards to prevent index corruption and query failures.

concurrency:
  limit: 1

inputs:
  - id: es_host
    type: STRING
    displayName: "Elasticsearch Host"
    defaults: "elasticsearch.internal"
    description: "Hostname for Elasticsearch cluster endpoint."
  - id: es_user
    type: STRING
    displayName: "Elasticsearch User"
    defaults: "elastic"
    description: "Elasticsearch HTTP basic auth user."

triggers:
  - id: scheduled_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: curlimages/curl:latest
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      ES_HOST: "{{ inputs.es_host }}"
      ES_USER: "{{ inputs.es_user }}"
      ES_PASS: "{{ secret('ES_PASSWORD') }}"
    commands:
      - |
        HEALTH=$(curl -s -u "$ES_USER:$ES_PASS" "http://$ES_HOST:9200/_cluster/health" 2>/dev/null)
        if [ -z "$HEALTH" ]; then echo "Elasticsearch health check failed" >&2; exit 1; fi
        echo "$HEALTH" | jq '{status: .status, unassigned_shards: .unassigned_shards, relocating_shards: .relocating_shards, is_alert: (.status == "red" or .unassigned_shards > 0)}' > output.json
    outputFiles:
      - output.json

  - id: evaluate_threshold
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.probe_metrics.outputFiles['output.json'])).is_alert }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#infrastructure-alerts",
            "text": "🚨 *Elasticsearch Cluster Health Alert: `{{ inputs.es_host }}`*\n- *Status*: `{{ json(read(outputs.probe_metrics.outputFiles['output.json'])).status }}`\n- *Unassigned Shards*: `{{ json(read(outputs.probe_metrics.outputFiles['output.json'])).unassigned_shards }}`"
          }

errors:
  - id: notify_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#infrastructure-alerts",
        "text": "❌ *Sentinel probe execution failed for elasticsearch-unassigned-shards-cluster-health-sentinel*"
      }

extend:
  title: Elasticsearch unassigned shards and cluster status sentinel
  shortDescription: Audits Elasticsearch cluster health state and unassigned primary or replica shards to prevent index corruption and query failures.
  description: |
    Audits Elasticsearch cluster health state and unassigned primary or replica shards to prevent index corruption and query failures.

    ## How it works
    1. A schedule trigger or manual execution connects to the target infrastructure service endpoint.
    2. Runs diagnostic status queries inside an isolated container runner to extract health telemetry.
    3. Evaluates health metrics against defined thresholds to flag operational anomalies.
    4. Dispatches actionable alerts to Slack with resource metrics and remediation guidance.

    ## What you get
    - Proactive infrastructure monitoring without managing external monitoring agents.
    - Automated detection of system degradation before outages impact production services.
    - Actionable Slack notifications equipped with diagnostic metrics.

    ## Who it's for
    - Site Reliability Engineers (SREs) and DevOps engineers maintaining high availability.
    - Platform Engineers and Database Administrators operating distributed infrastructure.
    - Operations teams requiring automated incident alerting.

    ## Why orchestrate this with Kestra
    - Runs declarative probes directly with native plugins and container tasks.
    - Securely stores sensitive connection credentials in Kestra namespace secrets.
    - Maintains a complete historical audit log of every health check execution.

    ## Prerequisites
    - Network connectivity to the target service from Kestra worker pods.
    - Service credentials and `SLACK_WEBHOOK` secret configured in the Kestra namespace.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Configure the required namespace secrets.
    3. Run a manual execution to test connectivity.
    4. Enable the schedule trigger for continuous background monitoring.

    ## How to extend
    - Add automated remediation tasks (e.g. restart service, failover replica, purge queues).
    - Route critical alerts to PagerDuty or OpsGenie.
    - Forward historical telemetry to long-term data warehouses.

    ## Links
    - [Kestra Documentation](https://kestra.io/docs)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Search Engines
  ee: false
  demo: false
