id: elasticsearch-unassigned-shards-cluster-health-sentinel
namespace: company.search

description: |
  Audits Elasticsearch cluster health and shard allocation catalogs to detect unassigned replica shards, yellow or red cluster states, and allocation failures.

inputs:
  - id: elasticsearch_url
    type: STRING
    displayName: Elasticsearch Endpoint URL
    defaults: "http://elasticsearch.internal:9200"
    description: Base HTTP or HTTPS URL exposing the target Elasticsearch cluster API.

  - id: alert_on_yellow_status
    type: BOOL
    displayName: Alert On Yellow Status
    defaults: true
    description: Trigger an operational warning if cluster status is YELLOW (unassigned replica shards).

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#search-alerts"
    description: Destination Slack channel for search cluster health alerts and reroute runbooks.

triggers:
  - id: recurring_health_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */2 * * *"
    disabled: true
    description: Automated schedule trigger to audit cluster health every two hours.

tasks:
  - id: query_cluster_health
    type: io.kestra.plugin.elasticsearch.Request
    description: Queries Elasticsearch /_cluster/health API to inspect cluster status, unassigned shards, and active data nodes.
    connection:
      hosts:
        - "{{ inputs.elasticsearch_url }}"
      basicAuth:
        username: "{{ secret('ELASTICSEARCH_USERNAME') }}"
        password: "{{ secret('ELASTICSEARCH_PASSWORD') }}"
    method: GET
    endpoint: "/_cluster/health"

  - id: evaluate_cluster_status
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether cluster status is degraded (RED or YELLOW) or contains unassigned shards.
    condition: "{{ outputs.query_cluster_health.response.status != 'green' or outputs.query_cluster_health.response.unassigned_shards > 0 }}"
    then:
      - id: alert_cluster_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches actionable operational alert to Slack detailing degraded Elasticsearch cluster state.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "attachments": [
              {
                "color": "{{ outputs.query_cluster_health.response.status == 'red' ? '#D32F2F' : '#FF9800' }}",
                "title": "🚨 Elasticsearch Cluster Health Alert: {{ outputs.query_cluster_health.response.status | upper }} State",
                "text": "The Kestra Elasticsearch Sentinel detected cluster degradation on `{{ inputs.elasticsearch_url }}` with unassigned shard allocation issues.",
                "fields": [
                  {
                    "title": "Cluster Status",
                    "value": "*{{ outputs.query_cluster_health.response.status | upper }}*",
                    "short": true
                  },
                  {
                    "title": "Unassigned Shards",
                    "value": "*{{ outputs.query_cluster_health.response.unassigned_shards }}*",
                    "short": true
                  },
                  {
                    "title": "Active Data Nodes",
                    "value": "{{ outputs.query_cluster_health.response.number_of_data_nodes }} of {{ outputs.query_cluster_health.response.number_of_nodes }} nodes",
                    "short": true
                  },
                  {
                    "title": "Relocating / Initializing",
                    "value": "{{ outputs.query_cluster_health.response.relocating_shards }} relocating / {{ outputs.query_cluster_health.response.initializing_shards }} initializing",
                    "short": true
                  },
                  {
                    "title": "Diagnostic Runbook",
                    "value": "`GET /_cluster/allocation/explain` or retry allocation: `POST /_cluster/reroute?retry_failed=true`",
                    "short": false
                  }
                ],
                "footer": "Kestra Elasticsearch Sentinel • Execution ID: {{ execution.id }}"
              }
            ]
          }

      - id: log_degradation_details
        type: io.kestra.plugin.core.log.Log
        description: Emits diagnostic log message for search reliability engineers.
        message: "Elasticsearch Degradation Alert: Cluster status is {{ outputs.query_cluster_health.response.status }}. Unassigned shards: {{ outputs.query_cluster_health.response.unassigned_shards }}. Active data nodes: {{ outputs.query_cluster_health.response.number_of_data_nodes }}."

    else:
      - id: log_nominal_state
        type: io.kestra.plugin.core.log.Log
        description: Emits confirmation that the Elasticsearch cluster is GREEN with zero unassigned shards.
        message: "Elasticsearch cluster health nominal. Status is GREEN, 0 unassigned shards across {{ outputs.query_cluster_health.response.number_of_data_nodes }} data nodes."

  - id: emit_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Records audit completion telemetry for compliance and infrastructure tracking.
    message: "Elasticsearch health audit finished for '{{ inputs.elasticsearch_url }}'. Cluster status: {{ outputs.query_cluster_health.response.status }}. Active primary shards: {{ outputs.query_cluster_health.response.active_primary_shards }}."

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatches high-urgency Slack alert if the sentinel execution fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "❌ *Elasticsearch Sentinel Execution Failed*: Execution `{{ execution.id }}` crashed during health audit for endpoint `{{ inputs.elasticsearch_url }}`."
      }

extend:
  title: Audit Elasticsearch Cluster Health and Unassigned Shards
  metaTitle: Elasticsearch Health Sentinel | Automated Shard Surveillance | Kestra
  shortDescription: Proactively detect Elasticsearch yellow or red cluster health states, unassigned shards, and allocation failures.
  metaDescription: Audit Elasticsearch cluster health to detect unassigned shards, yellow or red status degradation, and node allocation failures with Slack alerts.
  description: |
    ## How it works
    This sentinel workflow automates Day 2 operational observability for distributed Elasticsearch clusters:
    1. **Scheduled Audit Trigger**: Periodically executes on a configurable cron schedule (`0 */2 * * *`, shipped disabled for safe onboarding) to inspect cluster status.
    2. **Cluster Health API Probe**: Uses native `io.kestra.plugin.elasticsearch.Request` to query `GET /_cluster/health`, capturing cluster status (`green`, `yellow`, `red`), unassigned shard counts, and active data nodes.
    3. **Threshold & Status Evaluation**: Evaluates cluster telemetry using Kestra's native `io.kestra.plugin.core.flow.If` task. If status is `red` (primary shards unassigned) or `yellow` (replica shards unassigned), the flow triggers the alert branch.
    4. **Actionable Slack Alerting**: Dispatches a color-coded Slack alert card detailing status severity, unassigned shard numbers, active nodes, and direct diagnostic runbook commands (`/_cluster/allocation/explain`).
    5. **Failure Resilience**: A top-level `errors` handler catches connection drops, SSL verification issues, or credential expirations and alerts engineers immediately.

    ## What you get
    - Real-time visibility into Elasticsearch cluster degradation before search indexing stops.
    - Early warning when data node dropouts leave replica shards unassigned.
    - Full cluster health response metrics preserved in Kestra audit execution lineage.
    - Instant Slack alerts with exact curl commands for shard allocation diagnostics.

    ## Who it's for
    - **Search Platform Engineers**: Maintaining high-availability Elasticsearch or OpenSearch clusters.
    - **Site Reliability Engineers (SREs)**: Automating proactive cluster health guardrails across logging and analytics stacks.
    - **DevOps Engineers**: Ensuring search query latency and indexing throughput remain within strict SLA limits.

    ## Why orchestrate this with Kestra
    - **Native Elasticsearch Plugin**: Leverage `io.kestra.plugin.elasticsearch.Request` with connection pooling, basic auth, and SSL configuration without writing custom wrapper daemons.
    - **Secure Credential Isolation**: Mask administrative passwords and webhook tokens using Kestra's encrypted secrets manager (`{{ secret('...') }}`).
    - **Automated Remediation Chaining**: Easily extend the workflow to trigger an automated `POST /_cluster/reroute?retry_failed=true` when transient disk watermarks clear.
    - **Visual Observability**: Inspect structured HTTP response payloads, task runtimes, and status outputs directly in the Kestra web interface.

    ## Prerequisites
    - An accessible Elasticsearch cluster (7.x / 8.x) with HTTP API access from the Kestra worker.
    - An administrative or monitoring user with cluster `monitor` privileges.
    - A Slack Incoming Webhook URL.

    ### Secrets
    Configure the following secrets in your Kestra namespace or instance settings:
    - `ELASTICSEARCH_USERNAME`: Username for authenticating with the Elasticsearch cluster.
    - `ELASTICSEARCH_PASSWORD`: Password for the Elasticsearch user.
    - `SLACK_WEBHOOK_URL`: The incoming webhook URL for your designated search alerts channel.

    ## Quick start
    1. Click **Use Blueprint** to install this flow in your Kestra instance.
    2. Add `ELASTICSEARCH_USERNAME`, `ELASTICSEARCH_PASSWORD`, and `SLACK_WEBHOOK_URL` to your Kestra secrets store.
    3. Adjust `elasticsearch_url` to match your cluster endpoint.
    4. Execute a manual test run to verify connectivity, then enable the schedule trigger.

    ## How to extend
    - **Shard Allocation Explainer**: If unassigned shards exist, automatically invoke `GET /_cluster/allocation/explain` and embed the specific unassigned reason in the Slack payload.
    - **Index-Level Grain**: Chain with `GET /_cat/shards` to report the exact index names suffering from unassigned shards.
    - **PagerDuty Escalation**: Route alerts to PagerDuty if cluster status degrades to `red`.

    ## Links
    - [Elasticsearch Cluster Health API](https://www.elastic.co/guide/en/elasticsearch/reference/current/cluster-health.html)
    - [Elasticsearch Cluster Allocation Explain API](https://www.elastic.co/guide/en/elasticsearch/reference/current/cluster-allocation-explain.html)
    - [Kestra Elasticsearch Plugin Documentation](https://kestra.io/plugins/plugin-elasticsearch)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
