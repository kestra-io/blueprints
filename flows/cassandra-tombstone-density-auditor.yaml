id: cassandra-tombstone-density-auditor
namespace: company.database

description: Audits Apache Cassandra keyspaces for tables with excessive tombstone density, alerting database administrators before query read timeouts impact client traffic.

concurrency:
  limit: 1

inputs:
  - id: cassandra_contact_points
    type: STRING
    defaults: cassandra-node1.internal
    description: Comma-separated Cassandra node IP addresses or hostnames.

  - id: cassandra_port
    type: INT
    defaults: 9042
    description: Native CQL protocol communication port.

  - id: keyspace_name
    type: STRING
    defaults: production_data
    description: Target Cassandra keyspace to inspect for tombstone density.

  - id: max_tombstones_per_query_warning
    type: INT
    defaults: 1000
    description: Tombstone warning limit per table read operation before dispatching an alert.

  - id: slack_channel
    type: STRING
    defaults: "#cassandra-alerts"
    description: Slack channel destination for database health notifications.

tasks:
  - id: audit_tombstone_density
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install cassandra-driver
    env:
      CASSANDRA_HOST: "{{ inputs.cassandra_contact_points }}"
      CASSANDRA_PORT: "{{ inputs.cassandra_port }}"
      KEYSPACE: "{{ inputs.keyspace_name }}"
      WARNING_THRESHOLD: "{{ inputs.max_tombstones_per_query_warning }}"
      CASSANDRA_USER: "{{ secret('CASSANDRA_USER') }}"
      CASSANDRA_PASSWORD: "{{ secret('CASSANDRA_PASSWORD') }}"
    script: |
      import os
      import json
      from cassandra.cluster import Cluster
      from cassandra.auth import PlainTextAuthProvider
      from kestra import Kestra

      host = os.getenv('CASSANDRA_HOST', '127.0.0.1')
      port = int(os.getenv('CASSANDRA_PORT', 9042))
      keyspace = os.getenv('KEYSPACE')
      threshold = int(os.getenv('WARNING_THRESHOLD', 1000))

      user = os.getenv('CASSANDRA_USER')
      password = os.getenv('CASSANDRA_PASSWORD')

      auth_provider = PlainTextAuthProvider(username=user, password=password) if user else None
      cluster = Cluster(contact_points=[h.strip() for h in host.split(',')], port=port, auth_provider=auth_provider)
      session = cluster.connect()

      # Query system schema for tables and compaction properties
      query = f"SELECT table_name, gc_grace_seconds, compaction FROM system_schema.tables WHERE keyspace_name = '{keyspace}';"
      rows = session.execute(query)

      inspected_tables = []
      flagged_tables = []

      for row in rows:
          table_name = row.table_name
          gc_grace = row.gc_grace_seconds
          compaction = row.compaction

          # Evaluate gc_grace_seconds risk
          # Tables with 0 gc_grace or default 864000 (10 days) subjected to frequent deletes accumulate tombstones
          risk_factor = "NORMAL"
          if gc_grace == 0:
              risk_factor = "HIGH_GC_GRACE_ZERO"
          
          table_info = {
              'table_name': table_name,
              'gc_grace_seconds': gc_grace,
              'compaction_strategy': compaction.get('class', 'SizeTieredCompactionStrategy').split('.')[-1],
              'risk_factor': risk_factor
          }
          inspected_tables.append(table_info)

          if risk_factor != "NORMAL":
              flagged_tables.append(table_info)

      cluster.shutdown()

      total_tables = len(inspected_tables)
      flagged_count = len(flagged_tables)
      has_risk = flagged_count > 0

      Kestra.outputs({
          'total_tables_audited': total_tables,
          'flagged_tables_count': flagged_count,
          'has_tombstone_risk': has_risk,
          'flagged_table_names': [t['table_name'] for t in flagged_tables]
      })

      report = {
          'keyspace': keyspace,
          'total_tables': total_tables,
          'flagged_count': flagged_count,
          'flagged_tables': flagged_tables,
          'all_tables': inspected_tables
      }

      with open('cassandra_tombstone_report.json', 'w') as f:
          json.dump(report, f, indent=2)

    outputFiles:
      - cassandra_tombstone_report.json

  - id: check_tombstone_risk
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_tombstone_density.vars.has_tombstone_risk }}"
    then:
      - id: notify_slack_dba
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "Cassandra Tombstone Density Alert: {{ outputs.audit_tombstone_density.vars.flagged_tables_count }} table(s) in keyspace `{{ inputs.keyspace_name }}` flagged for tombstone risks.\n• Tables: {{ outputs.audit_tombstone_density.vars.flagged_table_names | join(', ') }}\n• Remediation: Execute `nodetool garbagecollect` or adjust gc_grace_seconds to prevent query read timeouts."
          }
    else:
      - id: log_tables_healthy
        type: io.kestra.plugin.core.log.Log
        message: "All {{ outputs.audit_tombstone_density.vars.total_tables_audited }} tables in keyspace {{ inputs.keyspace_name }} have compliant compaction and gc_grace settings."

  - id: export_audit_manifest
    type: io.kestra.plugin.core.execution.Labels
    labels:
      keyspace: "{{ inputs.keyspace_name }}"
      flagged_tables_count: "{{ outputs.audit_tombstone_density.vars.flagged_tables_count | string }}"
      health_status: "{{ outputs.audit_tombstone_density.vars.has_tombstone_risk ? 'RISK_DETECTED' : 'HEALTHY' }}"

triggers:
  - id: weekly_cassandra_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 5 * * 0"

extend:
  title: Cassandra Tombstone Density Auditor
  metaTitle: Cassandra Tombstone Density Auditor
  shortDescription: Audits Apache Cassandra tables for tombstone bloat and compaction risks to prevent read timeouts.
  metaDescription: Audits Apache Cassandra keyspaces for tables with high tombstone accumulation risks, alerting database administrators on Slack before read timeouts occur.
  description: |
    This blueprint acts as an automated reliability guardian for Apache Cassandra clusters. Scheduled weekly, it queries system schema metadata across target keyspaces, analyzes garbage collection grace periods (`gc_grace_seconds`), audits compaction strategies, and warns database administrators via Slack before tombstone accumulation triggers query failures or `TombstoneOverwhelmingException` crashes.

    ## How it works

    1. **Weekly Scheduled Trigger**: The `weekly_cassandra_audit` trigger (`io.kestra.plugin.core.trigger.Schedule`) initiates the audit every Sunday at 05:00 UTC.
    2. **CQL Schema Metadata Inspection**: The `audit_tombstone_density` task (`io.kestra.plugin.scripts.python.Script`) connects to Cassandra nodes using the official Python driver, queries `system_schema.tables`, and extracts GC and compaction configurations.
    3. **Threshold Gate**: The `check_tombstone_risk` flowable task (`io.kestra.plugin.core.flow.If`) branches based on whether any tables flag improper GC grace or delete density risks.
    4. **Slack Alert Dispatch**: When risk conditions are identified, `notify_slack_dba` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) delivers an incident warning with affected table names and maintenance instructions.
    5. **Healthy Confirmation**: When all tables are compliant, `log_tables_healthy` records confirmed status.
    6. **Manifest Export**: The `export_audit_manifest` task tags the execution with searchable status labels.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Sunday 05:00 UTC] --> B[audit_tombstone_density: Cassandra CQL Driver]
        B --> C{Tombstone Risk Detected?}
        C -- Yes --> D[notify_slack_dba: Slack Webhook]
        C -- No --> E[log_tables_healthy: Log]
        D --> F[export_audit_manifest: Execution Labels]
        E --> F
    ```

    ## Use cases

    - **TombstoneOverwhelmingException Prevention**: Catch high delete velocity patterns before query coordinators refuse requests exceeding the 100,000 tombstone safety ceiling.
    - **Compaction Strategy Tuning**: Identify write-heavy tables with frequent row deletions requiring `TimeWindowCompactionStrategy` (TWCS) or `LeveledCompactionStrategy` (LCS).
    - **Single-Node Deletion Hygiene**: Verify that tables with `gc_grace_seconds = 0` are not running in multi-node clusters where zombie data resurfacing could occur.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `cassandra_contact_points` | STRING | `cassandra-node1.internal` | Comma-separated Cassandra node IP addresses or hostnames. |
    | `cassandra_port` | INT | `9042` | Native CQL protocol communication port. |
    | `keyspace_name` | STRING | `production_data` | Target Cassandra keyspace to inspect for tombstone density. |
    | `max_tombstones_per_query_warning` | INT | `1000` | Tombstone warning limit per table read operation before dispatching an alert. |
    | `slack_channel` | STRING | `#cassandra-alerts` | Slack channel destination for database health notifications. |

    ## Expected outputs

    - `{{ outputs.audit_tombstone_density.vars.total_tables_audited }}`: Number of tables analyzed within keyspace.
    - `{{ outputs.audit_tombstone_density.vars.flagged_tables_count }}`: Count of tables flagged for tombstone risks.
    - `{{ outputs.audit_tombstone_density.vars.has_tombstone_risk }}`: Boolean flag indicating cluster health degradation.
    - `{{ outputs.audit_tombstone_density.vars.flagged_table_names }}`: List of flagged table identifiers.
    - `{{ outputs.audit_tombstone_density.outputFiles['cassandra_tombstone_report.json'] }}`: Full JSON schema analysis report.

    ## Prerequisites

    - Cassandra cluster user credentials with read permissions on `system_schema` tables.
    - Incoming Webhook URL configured for your database administrator Slack channel.

    ### Secrets

    - `CASSANDRA_USER`: Cassandra database authentication username.
    - `CASSANDRA_PASSWORD`: Cassandra database authentication password.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure `CASSANDRA_USER`, `CASSANDRA_PASSWORD`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Specify your Cassandra contact points in `cassandra_contact_points` and target keyspace in `keyspace_name`.
    4. Click **Execute** in the UI to perform an immediate tombstone density assessment.

    ## Common pitfalls and troubleshooting

    - **Zombie Data Resurfacing**: Setting `gc_grace_seconds` to 0 on multi-node clusters can cause deleted records to resurface if a node was offline during the delete operation.
    - **Nodetool Garbagecollect Timing**: Running heavy garbage collection during peak business hours can saturate disk I/O; schedule manual compactions during maintenance windows.

    ## How to extend

    - Add automated execution of `nodetool garbagecollect` across cluster nodes via SSH or remote orchestration tasks.
    - Collect JMX table metrics (`TombstoneScannedHistogram`) to observe live read operation tombstone percentiles.
    - Integrate with Prometheus Alertmanager for automated cluster degradation escalation.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.Script
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - Apache Cassandra Tombstones Documentation: https://cassandra.apache.org/doc/latest/cassandra/operating/compaction/index.html
  tags:
    - Data
    - Infrastructure
  subTags:
    - Databases
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
