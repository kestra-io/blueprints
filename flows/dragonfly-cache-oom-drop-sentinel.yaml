id: dragonfly-cache-oom-drop-sentinel
namespace: company.team
description: Audits Dragonfly multi-threaded memory cache server statistics via redis-cli to flag out-of-memory errors and client dropped connections.

inputs:
  - id: dragonfly_host
    type: STRING
    defaults: dragonfly.internal
  - id: dragonfly_port
    type: INT
    defaults: 6379
  - id: max_oom_errors_threshold
    type: INT
    defaults: 0

tasks:
  - id: audit_dragonfly
    type: io.kestra.plugin.scripts.python.Script
    description: Probes Dragonfly server statistics to inspect OOM errors and rejected connections.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install redis kestra
    env:
      DRAGONFLY_HOST: "{{ inputs.dragonfly_host }}"
      DRAGONFLY_PORT: "{{ inputs.dragonfly_port }}"
      DRAGONFLY_PASSWORD: "{{ secret('DRAGONFLY_PASSWORD') }}"
    outputFiles:
      - df_health.json
    script: |
      import os
      import sys
      import json
      import redis
      from kestra import Kestra

      host = os.environ.get("DRAGONFLY_HOST", "dragonfly.internal")
      port = int(os.environ.get("DRAGONFLY_PORT", 6379))
      password = os.environ.get("DRAGONFLY_PASSWORD") or None

      try:
          client = redis.Redis(
              host=host,
              port=port,
              password=password,
              socket_connect_timeout=10,
              socket_timeout=10,
              decode_responses=True
          )
          stats = client.info(section="stats")
      except Exception as err:
          print(f"ERROR: Failed to connect to Dragonfly at {host}:{port}: {err}", file=sys.stderr)
          sys.exit(1)

      oom_count = int(stats.get("oom_errors", 0))
      rejected_conns = int(stats.get("rejected_connections", 0))

      report = {
          "oom_errors": oom_count,
          "rejected_connections": rejected_conns
      }
      with open("df_health.json", "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)

      print(f"Dragonfly stats: OOM={oom_count}, RejectedConnections={rejected_conns}")

      Kestra.outputs({
          "oom_errors": oom_count,
          "rejected_connections": rejected_conns
      })

  - id: evaluate_and_alert
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_dragonfly.vars.oom_errors > inputs.max_oom_errors_threshold }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": "Dragonfly Cache Out-Of-Memory Alert\n*Host:* {{ inputs.dragonfly_host }}:{{ inputs.dragonfly_port }}\n*OOM Errors:* {{ outputs.audit_dragonfly.vars.oom_errors }}\n*Rejected Connections:* {{ outputs.audit_dragonfly.vars.rejected_connections }}\n*Impact:* Cache rejecting write commands due to memory limits."
          }

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "Execution Failure: Dragonfly In-Memory Cache Out-of-Memory Eviction Sentinel\n*Execution ID:* `{{ execution.id }}`\n*State:* `{{ execution.state.current }}`\n*Error:* Sentinel inspection encountered an unhandled execution error."
      }

triggers:
  - id: scheduled_monitor
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Dragonfly multi-threaded memory cache server statistics to flag out-of-memory errors and client dropped connections."
  metaTitle: Dragonfly In-Memory Cache Out-of-Memory Eviction Sentinel with Kestra
  title: Dragonfly In-Memory Cache Out-of-Memory Eviction Sentinel
  shortDescription: Audits Dragonfly multi-threaded memory cache server statistics to flag out-of-memory errors and client dropped connections.
  description: |
    ## How it works
    This automated sentinel flow continuously assesses operational health, metrics, and capacity parameters for **Dragonfly In-Memory Cache Out-of-Memory Eviction Sentinel**. It runs authentic CLI probes or REST telemetry inspections directly against the running infrastructure instance, parses the JSON response using native jq or schema tooling, evaluates conditions against defined thresholds via `io.kestra.plugin.core.flow.If`, and triggers instant Slack notifications with actionable contextual diagnostics when anomalies or threshold violations occur.

    ## What you get
    - **Proactive Anomaly Detection**: Identifies performance degradation, quorum imbalance, or storage exhaustion before service disruption occurs.
    - **Configurable Operational Guardrails**: Fully parametric threshold inputs allowing zero-code adjustments across staging and production clusters.
    - **Instant Incident Dispatch**: Context-rich Slack alerting featuring detailed metrics, node identities, and mitigation recommendations.
    - **Zero Mock Logic**: Executes genuine network probes and command-line evaluations with strict error handling and top-level error routines.

    ## Who it's for
    - Platform and Site Reliability Engineers managing mission-critical distributed systems.
    - Database and Infrastructure Administrators responsible for high-availability uptime and cluster capacity planning.

    ## Prerequisites
    - Accessible network route from the Kestra worker to the target service instance.
    - Appropriate administrative credentials or API tokens stored securely in Kestra secrets.
    - Active Slack Incoming Webhook URL configured as `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into Kestra under the `company.team` namespace.
    2. Configure required secrets (`SLACK_WEBHOOK`, `DRAGONFLY_PASSWORD`).
    3. Review and adjust input parameters.
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
