id: postgres-event-trigger-disabled-recovery-guard
namespace: company.team

inputs:
  - id: postgres_url
    type: STRING
    defaults: jdbc:postgresql://localhost:5432/postgres
    description: >-
      PostgreSQL JDBC URL for the database whose event triggers are checked. Example jdbc:postgresql://postgres:5432/app.

  - id: use_secret_auth
    type: BOOL
    defaults: true
    description: >-
      Leave true in production so the connection reads POSTGRES_USERNAME and POSTGRES_PASSWORD from secrets. Set false only to pass credentials inline in a disposable test environment.

  - id: postgres_username
    type: STRING
    defaults: postgres
    description: Username used only when use_secret_auth is false. Ignored in production.

  - id: postgres_password
    type: STRING
    defaults: ""
    description: Password used only when use_secret_auth is false. Ignored in production.

  - id: desired_triggers
    type: STRING
    defaults: ""
    description: >-
      Comma separated allowlist of event trigger names that must stay enabled. Leave empty to treat every disabled event trigger in the database as a finding. Names are matched exactly.

  - id: desired_state
    type: SELECT
    values:
      - origin
      - always
    defaults: origin
    description: >-
      The state a recovered event trigger is restored to. origin runs ALTER EVENT TRIGGER ... ENABLE so it fires in origin and local sessions (evtenabled O). always runs ENABLE ALWAYS so it also fires in replica sessions (evtenabled A). Pick the one the trigger held before it was disabled.

  - id: dry_run
    type: BOOL
    defaults: true
    description: When true, report the disabled event triggers without enabling anything.

  - id: auto_remediate
    type: BOOL
    defaults: false
    description: >-
      When true and dry_run is false, enable each targeted event trigger behind an approval gate, then re-read pg_event_trigger.evtenabled.

variables:
  detect_sql: |
    SELECT
      e.evtname AS name,
      e.evtevent AS event,
      n.nspname || '.' || p.proname AS handler,
      coalesce(array_to_string(e.evttags, ' '), 'every command tag') AS command_tags,
      CASE WHEN '{{ inputs.desired_state }}' = 'always' THEN 'A' ELSE 'O' END AS desired_code,
      format(
        'ALTER EVENT TRIGGER %I ENABLE%s',
        e.evtname,
        CASE WHEN '{{ inputs.desired_state }}' = 'always' THEN ' ALWAYS' ELSE '' END
      ) AS fix_sql
    FROM pg_event_trigger e
    JOIN pg_proc p ON p.oid = e.evtfoid
    JOIN pg_namespace n ON n.oid = p.pronamespace
    WHERE e.evtenabled = 'D'
      AND (
        '{{ inputs.desired_triggers }}' = ''
        OR e.evtname = ANY (string_to_array(replace('{{ inputs.desired_triggers }}', ' ', ''), ','))
      )
    ORDER BY e.evtname

  roster_sql: |
    SELECT
      coalesce(
        string_agg(
          e.evtname || ' = ' || e.evtenabled::text || ' (' ||
          CASE e.evtenabled
            WHEN 'O' THEN 'enabled, origin and local sessions'
            WHEN 'D' THEN 'disabled, fires for nothing'
            WHEN 'R' THEN 'replica sessions only, inert on a primary'
            WHEN 'A' THEN 'always, including replica sessions'
            ELSE 'unknown code'
          END || ')',
          ', ' ORDER BY e.evtname
        ),
        'no event triggers exist in this database'
      ) AS summary,
      count(*) AS total,
      count(*) FILTER (WHERE e.evtenabled = 'O') AS origin_enabled,
      count(*) FILTER (WHERE e.evtenabled = 'A') AS always_enabled,
      count(*) FILTER (WHERE e.evtenabled = 'R') AS replica_only,
      count(*) FILTER (WHERE e.evtenabled = 'D') AS disabled
    FROM pg_event_trigger e

  reverify_sql: |
    WITH want AS (
      SELECT CASE WHEN '{{ inputs.desired_state }}' = 'always' THEN 'A' ELSE 'O' END AS code
    ),
    targets AS (
      SELECT trim(t) AS name
      FROM unnest(string_to_array('{{ outputs.summarize.values.target_names }}', ',')) AS t
      WHERE trim(t) <> ''
    )
    SELECT
      t.name AS name,
      coalesce(e.evtenabled::text, 'absent') AS state,
      (SELECT code FROM want) AS desired_code
    FROM targets t
    LEFT JOIN pg_event_trigger e ON e.evtname = t.name
    WHERE coalesce(e.evtenabled::text, 'absent') <> (SELECT code FROM want)
    ORDER BY t.name

triggers:
  - id: daily_event_trigger_state_check
    type: io.kestra.plugin.core.trigger.Schedule
    disabled: true
    cron: "0 4 * * *"
    description: >-
      Daily sweep for event triggers left disabled. Disabled by default and pinned to safe mode so it reports without enabling anything until an operator turns it on.
    inputs:
      dry_run: true
      auto_remediate: false

tasks:
  - id: detect
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: >-
      Read pg_event_trigger and keep the rows whose evtenabled is D. Each row carries the handler function, the command tags the trigger filters on and the exact ALTER EVENT TRIGGER statement that restores the requested state.
    url: "{{ inputs.postgres_url }}"
    username: "{{ inputs.use_secret_auth ? secret('POSTGRES_USERNAME') : inputs.postgres_username }}"
    password: "{{ inputs.use_secret_auth ? secret('POSTGRES_PASSWORD') : inputs.postgres_password }}"
    fetchType: FETCH
    sql: "{{ render(vars.detect_sql) }}"

  - id: roster
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: >-
      Read every event trigger with its decoded state, so the log shows the R and A triggers alongside the D ones. A trigger set to replica only is inert on a primary by design, so it is reported and never touched.
    url: "{{ inputs.postgres_url }}"
    username: "{{ inputs.use_secret_auth ? secret('POSTGRES_USERNAME') : inputs.postgres_username }}"
    password: "{{ inputs.use_secret_auth ? secret('POSTGRES_PASSWORD') : inputs.postgres_password }}"
    fetchType: FETCH_ONE
    sql: "{{ render(vars.roster_sql) }}"

  - id: summarize
    type: io.kestra.plugin.core.output.OutputValues
    description: >-
      Build the target name list and the JSON the remediation loop iterates, once, so the log, the alert, the loop and the re-read all work from the same set.
    values:
      names: >-
        {{ outputs.detect.rows | jq('map(.name) | join(", ")') | first }}
      target_names: >-
        {{ outputs.detect.rows | jq('map(.name) | join(",")') | first }}
      targets_json: "{{ outputs.detect.rows | toJson }}"

  - id: log_state
    type: io.kestra.plugin.core.log.Log
    message: |
      PostgreSQL event triggers disabled (evtenabled = D): {{ outputs.detect.size }} found.
      Targets: {{ outputs.summarize.values.names }}
      Full roster: {{ outputs.roster.row.summary }}
      Counts: total={{ outputs.roster.row.total }} origin={{ outputs.roster.row.origin_enabled }} always={{ outputs.roster.row.always_enabled }} replica_only={{ outputs.roster.row.replica_only }} disabled={{ outputs.roster.row.disabled }}
      Mode: dry_run={{ inputs.dry_run }} auto_remediate={{ inputs.auto_remediate }} desired_state={{ inputs.desired_state }}

  - id: guard
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.detect.size > 0 }}"
    then:
      - id: findings_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: >-
          Alert on every detection, in dry run and after a successful recovery. Enabling a trigger again does not audit the DDL that ran while it was off, so the finding still needs a human.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": "PostgreSQL disabled event trigger guard: {{ outputs.detect.size }} event trigger(s) sit at evtenabled D, so their DDL policy is not running. Targets {{ outputs.summarize.values.names }}. DDL that ran while they were disabled was never audited and cannot be audited after the fact. dry_run={{ inputs.dry_run }} auto_remediate={{ inputs.auto_remediate }}."}

      - id: mode
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run and outputs.detect.size > 0 }}"
        then:
          - id: approval_gate
            type: io.kestra.plugin.core.flow.Pause
            description: >-
              Hold the run until a human approves enabling the listed event triggers. A trigger that blocks or rewrites DDL starts firing again the moment it is enabled, so the change never starts on its own.
            pauseDuration: PT2H
            behavior: FAIL
            onResume:
              - id: approved
                type: BOOL
                defaults: false
                description: >-
                  Set true to enable the listed event triggers. Anything else leaves them disabled.

          - id: apply
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.approval_gate.onResume.approved ?? false }}"
            then:
              - id: enable_triggers
                type: io.kestra.plugin.core.flow.Loop
                description: >-
                  Remediation loop. One ALTER EVENT TRIGGER per target, concurrencyLimit 1 so the statements run in turn. allowFailure so one rejected statement does not stop the pass, which keeps the re-read as the real gate.
                concurrencyLimit: 1
                values: "{{ outputs.summarize.values.targets_json }}"
                tasks:
                  - id: enable_one
                    type: io.kestra.plugin.jdbc.postgresql.Query
                    description: Enable one event trigger in the requested state.
                    allowFailure: true
                    url: "{{ inputs.postgres_url }}"
                    username: "{{ inputs.use_secret_auth ? secret('POSTGRES_USERNAME') : inputs.postgres_username }}"
                    password: "{{ inputs.use_secret_auth ? secret('POSTGRES_PASSWORD') : inputs.postgres_password }}"
                    fetchType: NONE
                    sql: "{{ fromJson(item.value).fix_sql }}"

                  - id: enable_log
                    type: io.kestra.plugin.core.log.Log
                    message: "Ran {{ fromJson(item.value).fix_sql }} for handler {{ fromJson(item.value).handler }} on {{ fromJson(item.value).event }}"

              - id: reverify
                type: io.kestra.plugin.jdbc.postgresql.Query
                description: >-
                  Re-read evtenabled for every target and keep only the ones that did not reach the requested state. A target that was dropped during the pass comes back as absent, which is also a failure.
                url: "{{ inputs.postgres_url }}"
                username: "{{ inputs.use_secret_auth ? secret('POSTGRES_USERNAME') : inputs.postgres_username }}"
                password: "{{ inputs.use_secret_auth ? secret('POSTGRES_PASSWORD') : inputs.postgres_password }}"
                fetchType: FETCH
                sql: "{{ render(vars.reverify_sql) }}"

              - id: verify_result
                type: io.kestra.plugin.core.flow.If
                condition: "{{ outputs.reverify.size > 0 }}"
                then:
                  - id: remediation_failed
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: >-
                      {{ outputs.reverify.size }} targeted event trigger(s) did not reach state {{ inputs.desired_state }}: {{ outputs.reverify.rows | jq('map(.name + " is " + .state) | join(", ")') | first }}. ALTER EVENT TRIGGER needs the trigger owner or a superuser.
                else:
                  - id: remediated
                    type: io.kestra.plugin.core.log.Log
                    message: "Enabled and verified. {{ outputs.detect.size }} event trigger(s) were disabled, 0 of them are still off the requested state. The DDL that ran while they were disabled stays unaudited, so keep the finding open."
            else:
              - id: not_approved
                type: io.kestra.plugin.core.log.Log
                message: "Approval not granted, so nothing was enabled. {{ outputs.detect.size }} event trigger(s) are still disabled and their DDL policy is still not running."
        else:
          - id: report_only
            type: io.kestra.plugin.core.log.Log
            message: "Report only (dry_run={{ inputs.dry_run }}, auto_remediate={{ inputs.auto_remediate }}). {{ outputs.detect.size }} event trigger(s) would be enabled: {{ outputs.summarize.values.names }}. No change made."
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "No event trigger is disabled. Every event trigger in scope is enabled for origin sessions, enabled always or deliberately set to replica only. Roster: {{ outputs.roster.row.summary }}"

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: >-
      Post to Slack on any failure, including a connection error or targets that did not reach the requested state after the pass.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "PostgreSQL disabled event trigger guard FAILED (execution {{ execution.id }}). A connection error, a rejected ALTER EVENT TRIGGER or targets still off the requested state after the pass. Check the run."}

extend:
  title: PostgreSQL Disabled Event Trigger Recovery Guard
  shortDescription: Find PostgreSQL event triggers left at evtenabled D after a migration, enable them again behind a dry-run and approval gate, then re-read pg_event_trigger and fail if any target did not reach the requested state.
  metaTitle: PostgreSQL Disabled Event Trigger Recovery Guard with Kestra
  metaDescription: Detect PostgreSQL event triggers left disabled after a migration, enable them behind an approval gate, then re-read evtenabled to confirm.
  description: |
    An event trigger is how a team enforces DDL policy inside the database. It audits every schema change, refuses an unsafe DROP, records a migration. Someone runs ALTER EVENT TRIGGER ... DISABLE to push a migration through, the migration lands, the re-enable is forgotten. From then on the policy is off and nothing reports it, because a disabled event trigger looks exactly like one that was never created from the application's point of view: no error, no warning, no row in the audit table.

    This guard reads pg_event_trigger, treats evtenabled = 'D' as the fault, enables the targeted triggers again behind a dry run plus an approval gate, then re-reads evtenabled and fails the run if any target did not reach the requested state.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Findings

    - Re-enabling an event trigger does NOT audit the DDL that ran while it was off. Those commands are gone. That is the whole reason the gap matters, so the Slack alert fires on every detection, including a run that fixed the state. The success log says the finding stays open.
    - PostgreSQL records no timestamp for the disable, so the catalog cannot tell you how long the guard was off. Treat every detection as an unbounded audit gap until a human checks the migration history.
    - `evtenabled` has four states, not two. `O` fires in origin and local sessions, `A` always including replica sessions, `R` in replica sessions only, `D` never. Only `D` is the fault here. An `R` trigger is inert on a primary by design, which is a deliberate choice on a replica rather than a break, so the flow reports it and never changes it.

    ## Safety

    - Read-only by default. `dry_run` is true and `auto_remediate` is false, so a plain run reports and never enables anything.
    - A change happens only when `auto_remediate` is true and `dry_run` is false. It then waits for a human to resume the `Pause` with `approved` set true. An unanswered gate reads as not approved.
    - Enabling is deliberately gated because it has an immediate effect. An event trigger that blocks an unsafe DROP or rewrites DDL starts firing on the next statement, so a migration running at that moment can start failing. Read the dry-run list first.
    - `desired_state` decides what the trigger is restored to, `O` or `A`, instead of the flow guessing. A trigger that was ENABLE ALWAYS before someone disabled it comes back as ALWAYS only when you ask for it.
    - `desired_triggers` narrows the pass to a named allowlist, so a trigger that is meant to stay disabled is never touched.
    - The re-read of evtenabled is the real gate. ALTER EVENT TRIGGER needs the trigger owner or a superuser, so a connecting role without that right produces a failed run rather than a false success.

    ## How it works

    1. `detect` (`io.kestra.plugin.jdbc.postgresql.Query`) reads pg_event_trigger joined to pg_proc, keeps the rows at `evtenabled = 'D'` that match the allowlist, then returns the handler function, the command tags the trigger filters on and the exact ALTER EVENT TRIGGER statement that restores the requested state.
    2. `roster` reads every event trigger with its state decoded, plus a count per state, so the log shows the `O`, `A` and `R` triggers next to the `D` ones.
    3. `summarize` (`io.kestra.plugin.core.output.OutputValues`) builds the target name list and the JSON the remediation loop iterates.
    4. `log_state` (`io.kestra.plugin.core.log.Log`) logs the count, the targets, the full roster and the mode.
    5. `guard` (`io.kestra.plugin.core.flow.If`) branches on the count. With none found, `clean` logs the roster and the run ends. Otherwise `findings_alert` posts the gap to Slack on every detection.
    6. `mode` (`io.kestra.plugin.core.flow.If`) enters the remediation branch only when `auto_remediate` is true and `dry_run` is false. Otherwise `report_only` lists what would be enabled.
    7. `approval_gate` (`io.kestra.plugin.core.flow.Pause`) holds the run for a human. `enable_triggers` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) then runs one ALTER EVENT TRIGGER per target.
    8. `reverify` re-reads evtenabled for every target and returns only the ones that did not reach the requested state, counting a dropped trigger as absent. `verify_result` fails the run through `io.kestra.plugin.core.execution.Fail` when that list is not empty.

    ## What you get

    - A check for a silent failure mode that nothing else reports. A disabled event trigger raises no error and writes no row, so the only evidence is the catalog.
    - Honest handling of all four `evtenabled` states, so a replica-only trigger is reported rather than quietly switched on a primary.
    - The ALTER statement built inside PostgreSQL with `format('%I')`, so the trigger name is quoted by the database.
    - An operator-chosen target state, `O` or `A`, instead of an assumption about what the trigger held before.
    - A real verification step. The run passes only when the second read of evtenabled shows every target in the requested state.
    - Slack alerts on the findings and on any failure, with the alert naming the part a fix cannot undo.

    ## Who it's for

    - DBAs and platform engineers who use event triggers to audit DDL or block unsafe commands, then need to know the guard is still armed.
    - Teams whose migration runbook disables an event trigger on purpose, where the re-enable depends on somebody remembering.
    - Security and compliance teams who need evidence that the in-database DDL audit was running, not just installed.

    ## Why orchestrate this with Kestra

    PostgreSQL will not tell you that one of its own policy triggers is off. There is no scheduler for the check, no approval step before flipping something that changes how DDL behaves, no proof that an ALTER took effect. Kestra adds each piece. It schedules the sweep, keeps it read-only until an operator asks for a change, holds the change behind a human approval, builds the ALTER inside the database so names are quoted correctly, re-reads evtenabled to turn a hopeful fix into a verified one, then posts to Slack both when a gap is found and when a step fails.

    ## Tested end to end

    Run on Kestra 2.0.5 against a PostgreSQL 16 server, with a local HTTP sink standing in for Slack. The database was seeded with three event triggers on `ddl_command_end`, each with its own handler writing a labelled row to a `ddl_audit` table: one audit trigger, one policy trigger that stays enabled, one deliberately set to `ENABLE REPLICA`.

    - The audit trigger was proven to work first. A `CREATE TABLE` produced a `ddl_audit` row from both enabled triggers. After `ALTER EVENT TRIGGER audit_ddl_end DISABLE`, the same `CREATE TABLE` produced a row from the still enabled trigger and nothing from the disabled one. That is the gap this guard closes.
    - Detector can fail: against the healthy state (`O`, `O`, `R`) it returned 0. After one trigger was disabled it returned exactly 1, never the enabled trigger nor the replica-only one, confirmed with psql against pg_event_trigger.
    - Dry run reported the finding, alerted and left evtenabled at `D`.
    - Remediate with approval ran `ALTER EVENT TRIGGER ... ENABLE` and the re-read reported 0 targets off the requested state. A `CREATE TABLE` after the run wrote the audit row again. The enabled trigger and the replica-only trigger were untouched.
    - A role that could read the catalog but did not own the trigger had its ALTER rejected, the re-read still found the target at `D` and the run failed and alerted.
    - Declining the gate left the trigger disabled.
    - An unreachable host failed the first query and fired the Slack alert.

    ## Prerequisites

    A PostgreSQL server reachable over JDBC. The connecting user must be able to read pg_event_trigger, which any role can. It must also own the triggers it enables, which usually means a superuser since creating an event trigger is a superuser action.

    ### Secrets

    - `POSTGRES_USERNAME`: PostgreSQL user, read when `use_secret_auth` is true.
    - `POSTGRES_PASSWORD`: password for that user.
    - `SLACK_WEBHOOK_URL`: used by `findings_alert` and the `errors` block.
    - In Kestra OSS, provide each secret as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `postgres_url` | STRING | `jdbc:postgresql://localhost:5432/postgres` | JDBC URL for the target database. |
    | `use_secret_auth` | BOOL | `true` | Read credentials from secrets. Set false only for inline test credentials. |
    | `desired_triggers` | STRING | `""` | Comma separated allowlist of trigger names. Empty targets every disabled event trigger. |
    | `desired_state` | SELECT | `origin` | `origin` restores evtenabled `O`, `always` restores `A`. |
    | `dry_run` | BOOL | `true` | Report without enabling anything. |
    | `auto_remediate` | BOOL | `false` | Enable behind the approval gate when dry_run is false. |

    ## Quick start

    1. Set `POSTGRES_USERNAME`, `POSTGRES_PASSWORD` and `SLACK_WEBHOOK_URL` as namespace secrets.
    2. Import this flow.
    3. Run it with `postgres_url` pointed at a database that has event triggers. The default dry run reports any that sit at `evtenabled = 'D'`.
    4. To enable them, run again with `dry_run` false and `auto_remediate` true, then resume the paused execution with `approved` true.
    5. Read the dry-run list before approving. An event trigger that blocks DDL starts refusing commands again straight away.

    ## How to extend

    - Set `desired_triggers` to the names your runbook disables during a migration, so the sweep is scoped to exactly the guards that must come back.
    - Switch `desired_state` to `always` for a trigger that must fire in replica sessions too.
    - Fail the run as soon as detection finds anything, for a read-only policy check with no remediation at all.
    - Add a second pass that reads the `ddl_command_end` audit table and compares its newest entry with the migration log, to narrow the window of DDL that was never audited.
    - Point the same pattern at `pg_trigger.tgenabled` to cover per-table triggers, which use ALTER TABLE ... ENABLE TRIGGER and are a different object.

    ## Links

    - PostgreSQL plugin: https://kestra.io/plugins/plugin-jdbc-postgres
    - Event triggers: https://www.postgresql.org/docs/current/event-triggers.html
    - ALTER EVENT TRIGGER: https://www.postgresql.org/docs/current/sql-altereventtrigger.html
    - pg_event_trigger catalog: https://www.postgresql.org/docs/current/catalog-pg-event-trigger.html
    - Schedule trigger: https://kestra.io/plugins/core/triggers/io.kestra.plugin.core.trigger.schedule
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
