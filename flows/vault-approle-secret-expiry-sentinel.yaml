id: vault-approle-secret-expiry-sentinel
namespace: company.security

inputs:
  - id: vault_addr
    type: STRING
    defaults: http://vault.internal:8200
    description: Base URL of the HashiCorp Vault server.
  - id: approle_name
    type: STRING
    defaults: kestra-worker
    description: Name of the AppRole to inspect.
  - id: secret_id_accessor
    type: STRING
    defaults: default-accessor
    description: Accessor ID of the secret-id to audit.
  - id: warning_threshold_days
    type: INT
    defaults: 7
    description: Minimum remaining days before expiration to trigger a rotation alert.

outputs:
  - id: remaining_days
    type: FLOAT
    value: "{{ outputs.lookup_secret_id_accessor.vars.remaining_days }}"
  - id: remaining_ttl_seconds
    type: INT
    value: "{{ outputs.lookup_secret_id_accessor.vars.remaining_ttl_seconds }}"
  - id: alert_triggered
    type: BOOLEAN
    value: "{{ outputs.lookup_secret_id_accessor.vars.alert_triggered }}"
  - id: expiration_time
    type: STRING
    value: "{{ outputs.lookup_secret_id_accessor.vars.expiration_time }}"


tasks:
  - id: lookup_secret_id_accessor
    type: io.kestra.plugin.scripts.python.Script
    description: Inspects HashiCorp Vault AppRole secret-id accessor TTL via REST API.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      VAULT_ADDR: "{{ inputs.vault_addr }}"
      VAULT_TOKEN: "{{ secret('VAULT_TOKEN') }}"
      APPROLE_NAME: "{{ inputs.approle_name }}"
      SECRET_ID_ACCESSOR: "{{ inputs.secret_id_accessor }}"
      WARNING_THRESHOLD_DAYS: "{{ inputs.warning_threshold_days }}"
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      vault_addr = os.environ.get("VAULT_ADDR", "").rstrip("/")
      vault_token = os.environ.get("VAULT_TOKEN", "")
      approle = os.environ.get("APPROLE_NAME", "")
      accessor = os.environ.get("SECRET_ID_ACCESSOR", "")
      threshold_days = float(os.environ.get("WARNING_THRESHOLD_DAYS", "7"))

      url = f"{vault_addr}/v1/auth/approle/role/{approle}/secret-id-accessor/lookup"
      headers = {"X-Vault-Token": vault_token}
      payload = {"secret_id_accessor": accessor}

      try:
          resp = requests.post(url, headers=headers, json=payload, timeout=15)
          resp.raise_for_status()
          data = resp.json().get("data", {})
      except Exception as e:
          print(f"Error querying Vault AppRole accessor: {e}", file=sys.stderr)
          sys.exit(1)

      ttl_seconds = int(data.get("secret_id_ttl", 0))
      remaining_days = round(ttl_seconds / 86400.0, 1)
      alert_needed = (remaining_days <= threshold_days) and (ttl_seconds > 0)
      expiration_time = data.get("expiration_time", "")

      summary = {
          "approle": approle,
          "remaining_ttl_seconds": ttl_seconds,
          "remaining_days": remaining_days,
          "expiration_time": expiration_time,
          "alert_triggered": alert_needed
      }
      print("Vault AppRole audit:", summary)

      with open("vault_summary.json", "w") as out:
          json.dump(summary, out)

      Kestra.outputs({
          "remaining_ttl_seconds": ttl_seconds,
          "remaining_days": remaining_days,
          "alert_triggered": alert_needed,
          "expiration_time": expiration_time,
          "approle": approle
      })
    outputFiles:
      - vault_summary.json

  - id: evaluate_secret_rotation
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.lookup_secret_id_accessor.outputFiles['vault_summary.json'])).alert_triggered }}"
    then:
      - id: alert_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":key: *Vault Credential Expiration Alert*: AppRole `{{ inputs.approle_name }}` secret-id accessor will expire in {{ fromJson(read(outputs.lookup_secret_id_accessor.outputFiles['vault_summary.json'])).remaining_days }} days. Timely credential rotation required."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Vault Sentinel Execution Failure*: Unable to look up AppRole secret-id on {{ inputs.vault_addr }}."
      }

triggers:
  - id: daily_secret_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * *"
    disabled: true

extend:
  metaDescription: "Audits HashiCorp Vault AppRole secret-id leases and alerts security teams before credential expirations disrupt service authentication."
  metaTitle: HashiCorp Vault AppRole Secret-ID Expiration and Rotation Sentinel with Kestra
  title: HashiCorp Vault AppRole Secret-ID Expiration and Rotation Sentinel
  shortDescription: Audits HashiCorp Vault AppRole secret-id leases and alerts security teams before credential expirations disrupt service authentication.
  description: |
    ## How it works
    This sentinel contacts HashiCorp Vault using administrative accessor lookup endpoints. It evaluates the exact time-to-live (`secret_id_ttl`) on issued AppRole credentials without exposing the raw secret-id value itself, converting remaining lifespan to days and comparing against security rotation thresholds.

    ## What you get
    - Non-intrusive metadata-only auditing of HashiCorp Vault application authentication tokens.
    - Zero unexpected outages caused by silent expiration of automated service credentials.
    - Actionable Slack notifications directing platform engineers to generate and distribute fresh secret-ids.

    ## Who it's for
    - Security operations (SecOps) teams and infrastructure engineers managing Vault secrets engines.
    - Platform teams ensuring high reliability for automated CI/CD and worker identity pipelines.

    ## Why orchestrate this with Kestra
    Kestra excels at managing secure, automated enterprise workflows. Orchestrating secret lifecycle monitors directly inside Kestra bridges identity governance with operational workflows cleanly.

    ## Prerequisites
    - HashiCorp Vault server access with AppRole authentication engine mounted.
    - A Vault token with `read` permissions on `/auth/approle/role/+/secret-id-accessor/lookup`.
    - Secrets `VAULT_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Provide your Vault URL, AppRole name, and accessor ID.
    3. Run the workflow manually to inspect remaining TTL.

    ## How to extend
    - Automate zero-downtime rotation by generating a new `secret-id` and updating Kubernetes secrets.
    - Track dynamic database credentials leases alongside static AppRole accessors.
    - Broadcast rotation audits to compliance log archives in S3.

    ## Links
    - [HashiCorp Vault AppRole API](https://developer.hashicorp.com/vault/api-docs/auth/approle)
    - [Kestra Security Best Practices](https://kestra.io/docs/administrator-guide/security)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Policy & Compliance
  ee: false
  demo: false
