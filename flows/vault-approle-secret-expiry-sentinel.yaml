id: vault-approle-secret-expiry-sentinel
namespace: company.security

inputs:
  - id: vault_addr
    type: STRING
    defaults: http://vault.internal:8200
    description: Base URL of the HashiCorp Vault server.
  - id: approle_name
    type: STRING
    defaults: kestra-worker
    description: Name of the AppRole to inspect.
  - id: secret_id_accessor
    type: STRING
    defaults: default-accessor
    description: Accessor ID of the secret-id to audit.
  - id: warning_threshold_days
    type: INT
    defaults: 7
    description: Minimum remaining days before expiration to trigger a rotation alert.

tasks:
  - id: lookup_secret_id_accessor
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - |
        curl -s --header "X-Vault-Token: {{ secret('VAULT_TOKEN') }}"           --request POST           --data "{"secret_id_accessor": "{{ inputs.secret_id_accessor }}"}"           "{{ inputs.vault_addr }}/v1/auth/approle/role/{{ inputs.approle_name }}/secret-id-accessor/lookup" > accessor_info.json
        python3 -c "
        import json
        with open('accessor_info.json') as f:
            data = json.load(f).get('data', {})
        ttl_seconds = data.get('secret_id_ttl', 0)
        remaining_days = round(ttl_seconds / 86400.0, 1)
        alert_needed = (remaining_days <= {{ inputs.warning_threshold_days }}) and (ttl_seconds > 0)
        result = {
            'approle': '{{ inputs.approle_name }}',
            'remaining_ttl_seconds': ttl_seconds,
            'remaining_days': remaining_days,
            'expiration_time': data.get('expiration_time'),
            'alert_triggered': alert_needed
        }
        with open('vault_summary.json', 'w') as out:
            json.dump(result, out)
        print('Vault AppRole audit:', result)
        "
    outputFiles:
      - vault_summary.json

  - id: evaluate_secret_rotation
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.lookup_secret_id_accessor.outputFiles['vault_summary.json'])).alert_triggered }}"
    then:
      - id: alert_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":key: *Vault Credential Expiration Alert*: AppRole `{{ inputs.approle_name }}` secret-id accessor will expire in {{ json(read(outputs.lookup_secret_id_accessor.outputFiles['vault_summary.json'])).remaining_days }} days. Timely credential rotation required."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Vault Sentinel Execution Failure*: Unable to look up AppRole secret-id on {{ inputs.vault_addr }}."
      }

triggers:
  - id: daily_secret_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * *"
    disabled: true

extend:
  title: HashiCorp Vault AppRole Secret-ID Expiration and Rotation Sentinel
  shortDescription: Audits HashiCorp Vault AppRole secret-id leases and alerts security teams before credential expirations disrupt service authentication.
  description: |
    ## How it works
    This sentinel contacts HashiCorp Vault using administrative accessor lookup endpoints. It evaluates the exact time-to-live (`secret_id_ttl`) on issued AppRole credentials without exposing the raw secret-id value itself, converting remaining lifespan to days and comparing against security rotation thresholds.

    ## What you get
    - Non-intrusive metadata-only auditing of HashiCorp Vault application authentication tokens.
    - Zero unexpected outages caused by silent expiration of automated service credentials.
    - Actionable Slack notifications directing platform engineers to generate and distribute fresh secret-ids.

    ## Who it's for
    - Security operations (SecOps) teams and infrastructure engineers managing Vault secrets engines.
    - Platform teams ensuring high reliability for automated CI/CD and worker identity pipelines.

    ## Why orchestrate this with Kestra
    Kestra excels at managing secure, automated enterprise workflows. Orchestrating secret lifecycle monitors directly inside Kestra bridges identity governance with operational workflows cleanly.

    ## Prerequisites
    - HashiCorp Vault server access with AppRole authentication engine mounted.
    - A Vault token with `read` permissions on `/auth/approle/role/+/secret-id-accessor/lookup`.
    - Secrets `VAULT_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Provide your Vault URL, AppRole name, and accessor ID.
    3. Run the workflow manually to inspect remaining TTL.

    ## How to extend
    - Automate zero-downtime rotation by generating a new `secret-id` and updating Kubernetes secrets.
    - Track dynamic database credentials leases alongside static AppRole accessors.
    - Broadcast rotation audits to compliance log archives in S3.

    ## Links
    - [HashiCorp Vault AppRole API](https://developer.hashicorp.com/vault/api-docs/auth/approle)
    - [Kestra Security Best Practices](https://kestra.io/docs/administrator-guide/security)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Governance & Compliance
  ee: false
  demo: false
