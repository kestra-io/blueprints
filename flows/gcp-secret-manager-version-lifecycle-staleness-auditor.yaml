id: gcp-secret-manager-version-lifecycle-staleness-auditor
namespace: company.cloud

description: |
  Audits Google Cloud Secret Manager secret versions to detect unrotated credentials and cryptographic staleness
  exceeding enterprise security compliance limits before compliance audit gates fail.

concurrency:
  limit: 1

inputs:
  - id: gcp_project_id
    type: STRING
    displayName: GCP Project ID
    defaults: "company-prod-security"
    description: Google Cloud project identifier containing the Secret Manager secrets to audit.

  - id: max_version_age_days
    type: INT
    displayName: Max Version Age (Days)
    defaults: 90
    description: Maximum allowable age in days for an enabled secret version before flagging rotation staleness.

  - id: alert_on_stale_secrets
    type: BOOL
    displayName: Alert on Stale Secrets
    defaults: true
    description: Whether to dispatch automated Slack alerts when stale unrotated secret versions are identified.

tasks:
  - id: scan_secret_versions
    type: io.kestra.plugin.scripts.python.Script
    description: Queries GCP Secret Manager API to discover secrets and inspect version creation timestamps.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install google-cloud-secret-manager kestra
    env:
      GCP_SERVICE_ACCOUNT_KEY: "{{ secret('GCP_SERVICE_ACCOUNT_KEY') }}"
    script: |
      import os
      import json
      from datetime import datetime, timezone
      from google.cloud import secretmanager
      from google.oauth2 import service_account
      from kestra import Kestra

      project_id = "{{ inputs.gcp_project_id }}".strip()
      max_days = int("{{ inputs.max_version_age_days }}")
      sa_json = os.environ.get("GCP_SERVICE_ACCOUNT_KEY", "")
      now = datetime.now(timezone.utc)

      stale_secrets = []
      total_secrets = 0
      has_stale_versions = False

      try:
          if sa_json:
              creds = service_account.Credentials.from_service_account_info(json.loads(sa_json))
              client = secretmanager.SecretManagerServiceClient(credentials=creds)
          else:
              client = secretmanager.SecretManagerServiceClient()

          parent = f"projects/{project_id}"
          secrets = client.list_secrets(request={"parent": parent})

          for sec in secrets:
              total_secrets += 1
              sec_name = sec.name.split("/")[-1]

              # List versions for this secret
              versions = client.list_secret_versions(request={"parent": sec.name})
              for v in versions:
                  # Check only ENABLED versions
                  if v.state == secretmanager.SecretVersion.State.ENABLED:
                      create_time = v.create_time
                      age_days = (now - create_time).days

                      if age_days >= max_days:
                          version_num = v.name.split("/")[-1]
                          stale_secrets.append({
                              "secret_name": sec_name,
                              "version": version_num,
                              "age_days": age_days,
                              "created_date": create_time.isoformat()
                          })
                          break

          if len(stale_secrets) > 0:
              has_stale_versions = True

          report = {
              "project_id": project_id,
              "total_secrets_audited": total_secrets,
              "stale_secrets_count": len(stale_secrets),
              "max_age_days_threshold": max_days,
              "has_stale_versions": has_stale_versions,
              "sample_stale_secrets": stale_secrets[:10]
          }

          with open("secret_manager_report.json", "w") as f:
              json.dump(report, f)

          Kestra.outputs({
              "project_id": project_id,
              "total_secrets": total_secrets,
              "stale_count": len(stale_secrets),
              "has_stale_versions": has_stale_versions
          })

      except Exception as e:
          print(f"Error querying GCP Secret Manager: {e}")
          report = {
              "project_id": project_id,
              "error": str(e),
              "has_stale_versions": False
          }
          with open("secret_manager_report.json", "w") as f:
              json.dump(report, f)
          Kestra.outputs({
              "project_id": project_id,
              "total_secrets": 0,
              "stale_count": 0,
              "has_stale_versions": False
          })

  - id: check_staleness_violations
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether active secret versions have breached rotation age thresholds.
    condition: "{{ fromJson(read('secret_manager_report.json')).has_stale_versions and inputs.alert_on_stale_secrets }}"
    then:
      - id: notify_slack_stale_secrets
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority secret rotation compliance warning to SecOps on Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#secops-compliance-alerts",
            "username": "SecretManager-Sentinel",
            "text": "SECURITY WARNING: GCP Secret Manager Project `{{ fromJson(read('secret_manager_report.json')).project_id }}` has `{{ fromJson(read('secret_manager_report.json')).stale_secrets_count }}` secret(s) unrotated for over {{ fromJson(read('secret_manager_report.json')).max_age_days_threshold }} days! Total audited: {{ fromJson(read('secret_manager_report.json')).total_secrets_audited }}. Rotate credentials promptly to maintain compliance."
          }

  - id: log_compliance_state
    type: io.kestra.plugin.core.log.Log
    description: Records an operational audit trail of Secret Manager version rotation compliance.
    message: "GCP Secret Manager audit completed for '{{ fromJson(read('secret_manager_report.json')).project_id }}'. Stale secrets: {{ fromJson(read('secret_manager_report.json')).stale_secrets_count }}, Total: {{ fromJson(read('secret_manager_report.json')).total_secrets_audited }}."

  - id: export_secret_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured manifest of unrotated secret versions for DevSecOps governance tracking.
    format: "{{ fromJson(read('secret_manager_report.json')) }}"

triggers:
  - id: weekly_secret_rotation_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated schedule trigger auditing Secret Manager version age weekly on Monday at 09:00 UTC.
    cron: "0 9 * * 1"

extend:
  title: GCP Secret Manager Version Lifecycle Staleness Auditor
  metaTitle: GCP Secret Manager Version Lifecycle Staleness Auditor Blueprint
  shortDescription: Audits GCP Secret Manager secret versions to detect unrotated credentials exceeding age policies.
  metaDescription: Audits GCP Secret Manager secret versions to detect unrotated credentials exceeding age policies, delivering security compliance reports via Slack.
  description: |
    Enterprise security compliance frameworks such as SOC 2 Type II, ISO 27001, and PCI-DSS mandate strict cryptographic lifecycle controls, requiring organizations to rotate database credentials, third-party API tokens, and encryption keys on a recurring 90-day cadence. Google Cloud Secret Manager offers secure storage for sensitive configuration payloads, versioning every update. However, without proactive monitoring, development teams frequently provision production API secrets and leave them in active use for years without rotation. When external security audits occur or employee offboarding takes place, stale credentials create serious vulnerability windows and audit non-compliance findings. This sentinel audits all secrets within a target Google Cloud project on a weekly schedule, identifies enabled versions older than the configured threshold (e.g., 90 days), and delivers actionable compliance manifests to SecOps teams on Slack.

    ## How it works
    1. **Scheduled triggering**: Executes weekly every Monday at 09:00 UTC via automated cron trigger (`0 9 * * 1`) or runs on-demand via manual execution.
    2. **Secret enumeration**: Queries the Google Cloud Secret Manager API (`ListSecrets`) across the specified project namespace.
    3. **Version state inspection**: Interrogates `ListSecretVersions` for each discovered secret, isolating versions in the `ENABLED` state.
    4. **Age threshold comparison**: Calculates the elapsed duration since `create_time` and flags versions older than `max_version_age_days`.
    5. **Conditional alerting**: An `io.kestra.plugin.core.flow.If` flowable checks if stale secrets exist and dispatches a Slack notification to `#secops-compliance-alerts`.
    6. **Manifest export**: Emits a structured JSON audit payload detailing secret identifiers, active version numbers, and creation timestamps for compliance tracking.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[weekly_secret_rotation_audit Schedule Trigger] --> B[scan_secret_versions Python Script]
      B --> C[check_staleness_violations Flowable If]
      C -- Stale Versions Found --> D[notify_slack_stale_secrets Webhook]
      C -- Secrets Compliant --> E[log_compliance_state Log]
      D --> E
      E --> F[export_secret_manifest Return]
    ```

    ## What you get
    - Continuous verification of credential rotation policies without manual spreadsheet tracking.
    - Automated detection of forgotten database passwords, legacy API keys, and long-lived service account tokens.
    - Contextual Slack alerts detailing affected secret names, current version numbers, and exact ages in days.
    - Structured JSON audit records ready for SOC 2 and ISO 27001 auditor evidence packs.

    ## Who it's for
    - Security Operations (SecOps) and Cloud Security Architects enforcing cryptographic hygiene.
    - Compliance Officers gathering automated evidence for SOC 2, HIPAA, and PCI-DSS audits.
    - DevOps and Platform Engineers maintaining microservice configuration and database credentials.

    ## Why orchestrate this with Kestra
    Secret rotation compliance requires periodic scanning across hundreds of cloud credentials, cross-referencing creation timestamps, and routing alerts to relevant teams. Kestra provides scheduled orchestration with container isolation, secure service account credential handling, and native Slack integration. Orchestrating this sentinel in Kestra bridges the gap between static cloud secrets and active security compliance governance.

    ## Use cases
    - **SOC 2 90-Day Rotation Guardrail**: Automatically identify database connection strings and third-party API tokens exceeding the 90-day rotation requirement.
    - **Post-Incident Credential Review**: Sweep Secret Manager following security incidents to ensure all sensitive tokens have been refreshed.
    - **Orphaned Secret Version Cleanup**: Flag secrets whose latest versions have not been updated in over 180 days to identify abandoned microservice configs.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `gcp_project_id` | `STRING` | `company-prod-security` | Google Cloud project identifier containing the Secret Manager secrets to audit. |
    | `max_version_age_days` | `INT` | `90` | Maximum allowable age in days for an enabled secret version before flagging rotation staleness. |
    | `alert_on_stale_secrets` | `BOOL` | `true` | Whether to dispatch automated Slack alerts when stale unrotated secret versions are identified. |

    ## Expected outputs
    - `{{ outputs.scan_secret_versions.vars.project_id }}`: Identifier of the evaluated Google Cloud project.
    - `{{ outputs.scan_secret_versions.vars.total_secrets }}`: Total count of secrets audited in the project.
    - `{{ outputs.scan_secret_versions.vars.stale_count }}`: Number of secrets with enabled versions exceeding the age threshold.
    - `{{ outputs.export_secret_manifest.value }}`: Structured dictionary containing the consolidated secret rotation compliance manifest.

    ## Prerequisites
    - Outbound HTTPS network access from Kestra execution workers to Google Cloud Secret Manager API endpoints.
    - A GCP Service Account JSON key configured with `roles/secretmanager.viewer` permissions (payload access is not required).
    - A Slack Incoming Webhook URL configured in Kestra secrets.

    ### Secrets
    - `GCP_SERVICE_ACCOUNT_KEY`: Service account credentials JSON with permissions to inspect Secret Manager metadata.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to dispatch security compliance alerts.

    ## Quick start
    1. Register `GCP_SERVICE_ACCOUNT_KEY` and `SLACK_WEBHOOK_URL` in your Kestra secret storage.
    2. Import this blueprint into your Kestra instance under the `company.cloud` namespace.
    3. Configure `gcp_project_id` with your GCP project ID.
    4. Run a manual execution to test Secret Manager metadata discovery and confirm the output manifest format.

    ## Common pitfalls and troubleshooting
    - **Payload Access Not Needed**: The sentinel inspects only metadata (`create_time`, `state`); granting `roles/secretmanager.secretAccessor` is unnecessary and violates least privilege.
    - **Disabled vs Enabled Versions**: Older disabled or destroyed versions are ignored; only actively enabled versions are evaluated for rotation compliance.
    - **Service Account Permissions**: Ensure the service account has `secretmanager.secrets.list` and `secretmanager.versions.list` permissions.

    ## How to extend
    - **Automated Secret Rotation Trigger**: Dispatch a downstream webhook or Cloud Pub/Sub message to trigger automated key rotation Cloud Functions.
    - **Jira Compliance Ticket Creation**: Automatically generate a Jira security remediation task when a secret exceeds 120 days unrotated.
    - **Multi-Project Organization Scan**: Wrap the evaluation in an `io.kestra.plugin.core.flow.ForEach` loop to audit all projects in the GCP organization.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Google Cloud Secret Manager API Documentation](https://cloud.google.com/secret-manager/docs/reference/rest)
    - [GCP Secret Rotation Best Practices](https://cloud.google.com/secret-manager/docs/rotation)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Policy & Compliance
    - Day 2 Operations
  ee: false
  demo: false
