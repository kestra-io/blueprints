id: s3-aborted-multipart-upload-sweeper
namespace: company.finops

inputs:
  - id: bucket
    type: STRING
    displayName: S3 Bucket
    description: Target Amazon S3 bucket to inspect for abandoned and incomplete multipart uploads.
    defaults: company-data-lake

  - id: retention_days
    type: INT
    displayName: Stale Threshold (Days)
    description: Multipart uploads initiated older than this threshold will be classified as abandoned and purged.
    defaults: 7

  - id: dry_run
    type: BOOL
    displayName: Dry Run Mode
    description: When enabled, scans and reports stale uploads without executing the abort API calls.
    defaults: false

  - id: notify_slack
    type: BOOL
    displayName: Notify Slack
    description: Send a FinOps cost recovery summary card to Slack. Requires SLACK_WEBHOOK_URL secret.
    defaults: true

concurrency:
  limit: 1

triggers:
  - id: weekly_sweeper_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run weekly sweep for incomplete S3 multipart uploads every Sunday at 03:00 UTC.
    cron: "0 3 * * 0"

tasks:
  - id: list_multipart_uploads
    type: io.kestra.plugin.scripts.shell.Commands
    description: Query Amazon S3 API for all in-progress multipart uploads across the target bucket.
    containerImage: amazon/aws-cli:latest
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
      AWS_DEFAULT_REGION: "{{ secret('AWS_DEFAULT_REGION') }}"
    outputFiles:
      - multipart_uploads.json
    commands:
      - |
        set -euo pipefail
        BUCKET="{{ inputs.bucket }}"
        echo "Listing active multipart uploads for bucket: ${BUCKET}"
        aws s3api list-multipart-uploads --bucket "${BUCKET}" --output json > multipart_uploads.json
        COUNT=$(jq '.Uploads | length // 0' multipart_uploads.json)
        echo "Found ${COUNT} active multipart upload session(s)."

  - id: analyze_stale_uploads
    type: io.kestra.plugin.scripts.python.Script
    description: Parse upload metadata, calculate age relative to retention threshold, and identify abandoned uploads for purging.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    inputFiles:
      multipart_uploads.json: "{{ outputs.list_multipart_uploads.outputFiles['multipart_uploads.json'] }}"
    beforeCommands:
      - pip install --no-cache-dir kestra
    outputFiles:
      - targets.json
    script: |
      import json
      from datetime import datetime, timezone
      from kestra import Kestra

      with open("multipart_uploads.json", "r") as f:
          data = json.load(f)

      uploads = data.get("Uploads") or []
      now = datetime.now(timezone.utc)
      retention_days = int("{{ inputs.retention_days }}")

      stale_targets = []
      summary_rows = []

      for item in uploads:
          key = item.get("Key")
          upload_id = item.get("UploadId")
          initiated_str = item.get("Initiated")

          # Parse ISO 8601 timestamp (e.g. 2026-09-20T14:30:00.000Z)
          initiated_dt = datetime.fromisoformat(initiated_str.replace("Z", "+00:00"))
          age_days = (now - initiated_dt).total_seconds() / 86400.0

          if age_days >= retention_days:
              stale_targets.append({
                  "key": key,
                  "upload_id": upload_id,
                  "initiated": initiated_str,
                  "age_days": round(age_days, 1)
              })
              summary_rows.append(f"• `{key}` (Age: {round(age_days, 1)} days, ID: `{upload_id[:12]}...`)")

      # Save targets to JSON file for subsequent abort step
      with open("targets.json", "w") as f_out:
          json.dump(stale_targets, f_out, indent=2)

      summary_text = "\n".join(summary_rows[:10])
      if len(summary_rows) > 10:
          summary_text += f"\n... and {len(summary_rows) - 10} more stale uploads."

      print(f"Total uploads: {len(uploads)}, Stale uploads (>= {retention_days}d): {len(stale_targets)}")

      Kestra.outputs({
          "total_uploads": len(uploads),
          "stale_count": len(stale_targets),
          "summary_text": summary_text or "No stale uploads found."
      })

  - id: evaluate_findings
    type: io.kestra.plugin.core.flow.If
    description: Branch based on whether any stale multipart uploads were discovered.
    condition: "{{ (outputs.analyze_stale_uploads.vars.stale_count | number) > 0 }}"
    then:
      - id: purge_stale_uploads
        type: io.kestra.plugin.scripts.shell.Commands
        description: Abort identified stale multipart uploads via the AWS S3 API (or simulate in dry-run mode).
        containerImage: amazon/aws-cli:latest
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        inputFiles:
          targets.json: "{{ outputs.analyze_stale_uploads.outputFiles['targets.json'] }}"
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ secret('AWS_DEFAULT_REGION') }}"
        commands:
          - |
            set -euo pipefail
            BUCKET="{{ inputs.bucket }}"
            DRY_RUN="{{ inputs.dry_run }}"

            ABORTED_COUNT=0
            while read -r entry; do
              KEY=$(echo "$entry" | jq -r '.key')
              UPLOAD_ID=$(echo "$entry" | jq -r '.upload_id')

              if [ "$DRY_RUN" = "true" ]; then
                echo "[DRY-RUN] Would abort: s3://${BUCKET}/${KEY} (UploadId: ${UPLOAD_ID})"
                ABORTED_COUNT=$((ABORTED_COUNT + 1))
              else
                echo "Aborting stale upload: s3://${BUCKET}/${KEY} (UploadId: ${UPLOAD_ID})"
                aws s3api abort-multipart-upload --bucket "${BUCKET}" --key "${KEY}" --upload-id "${UPLOAD_ID}"
                ABORTED_COUNT=$((ABORTED_COUNT + 1))
              fi
            done < <(jq -c '.[]' targets.json)

            echo "Purge finished. Processed ${ABORTED_COUNT} upload session(s)."
            echo "::{\"outputs\":{\"processed_count\":${ABORTED_COUNT}}}::"

      - id: notify_slack_report
        type: io.kestra.plugin.core.flow.If
        description: Post cost recovery digest to Slack if notifications are enabled.
        condition: "{{ inputs.notify_slack }}"
        then:
          - id: slack_finops_alert
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Send structured FinOps cost savings report card to Slack.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": "AWS S3 FinOps Cleanup: Incomplete Multipart Uploads Purged\n• Bucket: `{{ inputs.bucket }}`\n• Stale Uploads Found: {{ outputs.analyze_stale_uploads.vars.stale_count }}\n• Retention Threshold: {{ inputs.retention_days }} days\n• Dry Run Mode: `{{ inputs.dry_run }}`\n\nPurged Targets:\n{{ outputs.analyze_stale_uploads.vars.summary_text }}\n\nExecution: {{ execution.id }}"
              }
    else:
      - id: log_clean_bucket
        type: io.kestra.plugin.core.log.Log
        description: Record compliant bucket status when no stale multipart uploads are found.
        message: >-
          S3 multipart upload audit PASSED for bucket '{{ inputs.bucket }}'.
          Total active sessions: {{ outputs.analyze_stale_uploads.vars.total_uploads }}.
          Zero sessions older than {{ inputs.retention_days }} days. Storage is clean.

errors:
  - id: on_sweeper_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert the infrastructure team if S3 permissions or connectivity issues occur.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "S3 multipart sweeper failed in flow `{{ flow.id }}` for bucket `{{ inputs.bucket }}`. Check IAM permissions (`s3:ListBucketMultipartUploads`, `s3:AbortMultipartUpload`) and AWS credentials. Execution: {{ execution.id }}."
      }

outputs:
  - id: target_bucket
    type: STRING
    description: Target S3 bucket name that was audited.
    value: "{{ inputs.bucket }}"
  - id: total_uploads_found
    type: INT
    description: Total number of active in-progress multipart uploads in the bucket.
    value: "{{ outputs.analyze_stale_uploads.vars.total_uploads }}"
  - id: stale_uploads_purged
    type: INT
    description: Number of abandoned multipart uploads older than threshold that were purged.
    value: "{{ outputs.analyze_stale_uploads.vars.stale_count }}"
  - id: dry_run
    type: BOOL
    description: Indicates whether this execution was run in dry-run simulation mode.
    value: "{{ inputs.dry_run }}"

extend:
  title: AWS S3 Incomplete & Aborted Multipart Upload FinOps Sweeper
  shortDescription: Discover and abort abandoned S3 multipart uploads older than a retention threshold to eliminate hidden cloud storage bills.
  metaTitle: AWS S3 Aborted Multipart Upload Sweeper with Kestra
  metaDescription: Audit AWS S3 buckets for incomplete multipart uploads, abort stale parts older than a retention threshold, and send FinOps cost-savings reports to Slack.
  description: |
    When uploading large datasets, logs, or backups (>100MB) to Amazon S3 using the **Multipart Upload API**, transfers can be interrupted mid-flight by spot terminations, network timeouts, or unhandled exceptions.

    Unless explicitly aborted, the uploaded binary chunks remain in an invisible state inside S3:
    - They do **not** appear in standard `aws s3 ls` listings or standard AWS Console folder views.
    - They cannot be downloaded as objects.
    - They **silently incur standard S3 per-GB storage fees every month**, quietly costing data and engineering teams hundreds to thousands of dollars in wasted cloud spend.

    This blueprint provides an automated FinOps sweeper for Amazon S3:
    - Periodically lists all active in-progress multipart upload sessions.
    - Calculates the age of each upload session against a configurable `retention_days` threshold (default: 7 days).
    - Aborts abandoned sessions via `aws s3api abort-multipart-upload` to permanently stop recurring storage charges.
    - Features a **Dry-Run mode** to audit and preview stale parts without destructive actions.
    - Sends an executive FinOps cost-reclamation report to Slack.

    ## How it works

    1. `weekly_sweeper_schedule` runs every Sunday at 03:00 UTC (or triggers on demand via manual execution).
    2. `list_multipart_uploads` runs `amazon/aws-cli:latest` on Docker to execute `aws s3api list-multipart-uploads --bucket <bucket>` and outputs `multipart_uploads.json`.
    3. `analyze_stale_uploads` runs a Python script to calculate the age of each upload session, compares against `inputs.retention_days`, and writes stale targets to `targets.json`.
    4. `evaluate_findings` (`io.kestra.plugin.core.flow.If`) branches:
       - If stale uploads exist: `purge_stale_uploads` calls `abort-multipart-upload` for each target (skipped if `dry_run: true`), and `notify_slack_report` sends a savings digest to Slack.
       - If clean: `log_clean_bucket` confirms compliance in the execution logs.
    5. An `errors` block catches AWS IAM permission failures (`AccessDenied`) or connection drops.

    ## What you get

    - **Instant FinOps Savings**: Reclaim unneeded cloud storage and eliminate hidden recurring charges.
    - **Safe Dry-Run Testing**: Validate what would be removed before committing deletions.
    - **Zero Secret Exposure**: AWS credentials and Slack tokens are managed via Kestra secrets.
    - **Executive Visibility**: Slack digest highlights purged keys, ages, and bucket metrics.

    ## Prerequisites

    - An AWS IAM user or role with permissions:
      - `s3:ListBucketMultipartUploads`
      - `s3:AbortMultipartUpload`
    - Docker daemon access configured on the Kestra worker.
    - An incoming Slack webhook URL for notifications.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS IAM access key ID.
    - `AWS_SECRET_ACCESS_KEY`: AWS IAM secret access key.
    - `AWS_DEFAULT_REGION`: AWS region (e.g. `us-east-1`).
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL.

    ## Quick start

    1. Configure AWS credentials and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Set `bucket` to your target Amazon S3 bucket name.
    3. Run a test execution with `dry_run: true` to inspect existing abandoned multipart uploads safely.
    4. Set `dry_run: false` and leave the `weekly_sweeper_schedule` active for automated Sunday morning maintenance.

    ## How to extend

    - **Multi-Bucket Fleet Sweep**: Wrap the audit tasks inside an `io.kestra.plugin.core.flow.Loop` over a list of S3 buckets to audit an entire AWS account.
    - **S3 Lifecycle Verification**: Cross-reference findings against the bucket's lifecycle configuration to ensure `AbortIncompleteMultipartUpload` policies are configured.
    - **CloudWatch Cost Anomaly**: Publish reclaimed gigabyte counts to AWS CloudWatch custom metrics.

    ## Links

    - [Amazon S3 Multipart Upload API Overview](https://docs.aws.amazon.com/AmazonS3/latest/userguide/mpuoverview.html)
    - [AWS CLI s3api abort-multipart-upload Reference](https://awscli.amazonaws.com/v2/documentation/api/latest/reference/s3api/abort-multipart-upload.html)
    - [Kestra Docker Task Runner](https://kestra.io/plugins/plugin-scripts-docker)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)

    - This blueprint has been created by [community-contributor](https://github.com/kestra-io/blueprints)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - AWS Services
    - FinOps & Cost Management
  ee: false
  demo: false
