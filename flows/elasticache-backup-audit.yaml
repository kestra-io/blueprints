id: elasticache-backup-audit
namespace: company.dba

description: |
  Audits ElastiCache backup posture across regions. SnapshotRetentionLimit=0
  means NO automated backups on Redis/Valkey clusters (the default), and manual
  snapshots pile up silently at ~$0.02/GB-month. Reports both problems with a
  two-section Slack message; changes nothing.

inputs:
  - id: aws_regions
    "type": ARRAY
    "itemType": STRING
    defaults: ["us-east-1"]
    description: AWS regions to audit for ElastiCache backup posture.
  - id: max_manual_snapshots
    "type": INT
    defaults: 10
    description: Clusters holding more manual snapshots than this count as snapshot sprawl.

tasks:
  - id: check_regions
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit ElastiCache backup posture region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: Check snapshot retention per cluster and count manual snapshots.
        region: "{{ taskrun.value }}"
        accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
        commands:
          - |
            REGION="{{ taskrun.value }}"
            MAXSNAP={{ inputs.max_manual_snapshots }}
            echo "Auditing ElastiCache backup posture in $REGION (sprawl threshold: $MAXSNAP manual snapshots)"
            CLUSTERS=$(aws elasticache describe-cache-clusters --show-cache-node-info \
              --query 'CacheClusters[].[CacheClusterId,Engine,SnapshotRetentionLimit]' \
              --output text)
            RISK_LIST=""; RISK_COUNT=0
            SPRAWL_LIST=""; SPRAWL_COUNT=0; TOTAL_MANUAL=0
            while IFS=$'\t' read -r ID ENGINE RET; do
              case "$ID" in ''|'None') continue;; esac
              case "$RET" in ''|'None') RET=0;; esac
              case "$ENGINE" in redis*|valkey*)
                if [ "$RET" -eq 0 ]; then
                  RISK_LIST="${RISK_LIST}${ID} (${ENGINE}), "
                  RISK_COUNT=$((RISK_COUNT + 1))
                fi
              ;; esac
              MANUAL=$(aws elasticache describe-snapshots --cache-cluster-id "$ID" \
                --query "length(Snapshots[?SnapshotSource=='manual'])" --output text 2>/dev/null)
              case "$MANUAL" in ''|'None') MANUAL=0;; esac
              TOTAL_MANUAL=$((TOTAL_MANUAL + MANUAL))
              if [ "$MANUAL" -gt "$MAXSNAP" ]; then
                SPRAWL_LIST="${SPRAWL_LIST}${ID} (${MANUAL} manual snapshots), "
                SPRAWL_COUNT=$((SPRAWL_COUNT + 1))
              fi
            done <<< "$CLUSTERS"
            echo "REGION_DONE=$REGION"
            echo "RISK_COUNT=$RISK_COUNT"
            echo "RISK_LIST=$RISK_LIST"
            echo "SPRAWL_COUNT=$SPRAWL_COUNT"
            echo "SPRAWL_LIST=$SPRAWL_LIST"
            echo "TOTAL_MANUAL=$TOTAL_MANUAL"
            if [ "$RISK_COUNT" -gt 0 ] || [ "$SPRAWL_COUNT" -gt 0 ]; then
              echo "ElastiCache audit in $REGION: $RISK_COUNT cluster(s) with NO automated backups, $SPRAWL_COUNT with snapshot sprawl."
              echo "FINDINGS_FOUND"
            else
              echo "ElastiCache audit in $REGION: retention on and manual snapshots under control."
            fi
      - id: notify_region
        type: io.kestra.plugin.core.flow.If
        description: Report unprotected clusters and snapshot sprawl, stay quiet when healthy.
        condition: "{{ outputs.audit_region.stdout contains 'FINDINGS_FOUND' }}"
        then:
          - id: slack_report
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":camera: *ElastiCache backup audit* — `{{ outputs.audit_region.vars.REGION_DONE }}`\n*No automated backups (SnapshotRetentionLimit = 0, data-loss risk):* {{ outputs.audit_region.vars.RISK_COUNT }} cluster(s):\n`{{ outputs.audit_region.vars.RISK_LIST }}`\n*Snapshot sprawl (> {{ inputs.max_manual_snapshots }} manual snapshots):* {{ outputs.audit_region.vars.SPRAWL_COUNT }} cluster(s), {{ outputs.audit_region.vars.TOTAL_MANUAL }} manual snapshots total:\n`{{ outputs.audit_region.vars.SPRAWL_LIST }}`\nClean up verified snapshots with: `aws elasticache delete-snapshot --snapshot-name <name>` (restore-test first!)"
              }
        else:
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            message: "All ElastiCache clusters in {{ outputs.audit_region.vars.REGION_DONE }} have automated backups on and manual snapshots under {{ inputs.max_manual_snapshots }}."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Monday at 09:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 9 * * 1"
    disabled: true

extend:
  title: ElastiCache Backup Audit
  metaTitle: Audit ElastiCache Backups and Snapshot Sprawl | Kestra
  shortDescription: Find ElastiCache clusters with no automated backups and clusters drowning in manual snapshots, across regions, with a Slack report.
  metaDescription: ElastiCache manual snapshots pile up and cost money while retention 0 means no automated backups. This weekly flow flags both across regions.
  description: |
    ElastiCache defaults are treacherous for backups: `SnapshotRetentionLimit` is 0 out of the box, so automated snapshots are off unless someone deliberately enabled them. Meanwhile every manual snapshot anyone ever took for a deploy or an experiment stays in the account at roughly $0.02/GB-month. This blueprint checks both sides — unprotected clusters and snapshot sprawl — across regions. Advisory only: it never touches a cluster or a snapshot.

    ## How it works

    1. A Schedule trigger fires weekly on Monday at 09:00 UTC (shipped disabled).
    2. A ForEach loop audits each region in `aws_regions`.
    3. Per region, the flow lists cache clusters with engine and `SnapshotRetentionLimit`. Redis/Valkey clusters at 0 (Memcached cannot snapshot, so it is excluded) become a RISK.
    4. Per cluster, it counts manual snapshots via `describe-snapshots`; clusters above `max_manual_snapshots` (default 10) become SPRAWL.
    5. An `If` task posts a Slack report with two sections — the risk list and the sprawl list — only when there is something to say.

    ## What you get

    - A weekly two-section report: clusters with no automated backups (data-loss risk) and clusters with snapshot sprawl (cost waste).
    - Total manual snapshot count per region to size the cleanup.
    - The exact `delete-snapshot` command to start the cleanup.
    - Silence on healthy weeks.

    ## Who it's for

    Teams running Redis/Valkey on ElastiCache who would like to know whether a failed node could actually be restored — and how much dead snapshot weight they carry.

    ## Why orchestrate this with Kestra

    Backup settings are set once and forgotten; snapshot counts only grow. As a scheduled flow the audit is continuous, the sprawl threshold is an input anyone can tune, every run is logged for audit, and adding a region is one list entry — not a new script.

    ## Prerequisites

    - AWS credentials with `elasticache:DescribeCacheClusters` and `elasticache:DescribeSnapshots` permissions.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the ElastiCache API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the ElastiCache API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the audit report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` and tune `max_manual_snapshots` to your housekeeping policy.
    3. Run manually once and review the Slack report (or the clean log line).
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Enrich sprawl entries with estimated GB by joining node-type memory sizes.
    - Add an opt-in cleanup path that deletes manual snapshots older than N days (approval-gated).
    - Cover ElastiCache Serverless caches via `describe-serverless-caches`.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [ElastiCache backup and restore](https://docs.aws.amazon.com/AmazonElastiCache/latest/red-ug/backups.html)
    - [ElastiCache pricing](https://aws.amazon.com/elasticache/pricing/)
  tags:
    - Infrastructure
  subTags:
    - Day 2 Operations
    - FinOps & Cost Management
  ee: false
  demo: false
