id: s3-multipart-cleanup
namespace: company.team

description: |
  Find and clean up abandoned S3 multipart uploads. Failed or forgotten
  multipart uploads leave parts sitting in S3 that you keep paying for —
  they never expire on their own. This flow scans buckets for uploads older
  than `age_days`, totals the stranded bytes per bucket, and only aborts
  them when you flip `enforce` to true. Dry-run by default.

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Monday at 09:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 9 * * 1"
    disabled: true

inputs:
  - id: bucket_names
    "type": ARRAY
    itemType: STRING
    defaults: []
    description: Buckets to audit. Leave empty to discover ALL buckets via list-buckets.
  - id: age_days
    "type": INT
    defaults: 7
    description: Multipart uploads initiated more than this many days ago count as stale.
  - id: enforce
    "type": BOOLEAN
    defaults: false
    description: "When true, aborts stale multipart uploads. Default false (report only)."
  - id: aws_region
    "type": STRING
    defaults: us-east-1
    description: Region used for the bucket discovery call (S3 bucket names are global).

tasks:
  - id: resolve_buckets
    type: io.kestra.plugin.aws.cli.AwsCLI
    description: Build the bucket list from the input, or discover every bucket in the account.
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        echo "Resolving bucket list (input buckets or full discovery) via {{ inputs.aws_region }}"
        aws s3api list-buckets --region "{{ inputs.aws_region }}" \
          --query 'Buckets[].Name' --output json > /tmp/all_buckets.json
        python3 << 'PYEOF'
        import json
        raw = """{{ inputs.bucket_names }}""".strip()
        buckets = []
        if raw and raw != "[]":
            if raw.startswith("["):
                try:
                    buckets = json.loads(raw)
                except Exception:
                    inner = raw[1:raw.rfind("]")].strip()
                    buckets = [p.strip().strip('"').strip("'") for p in inner.split(",") if p.strip()]
            else:
                buckets = [p.strip() for p in raw.split(",") if p.strip()]
        if not buckets:
            buckets = json.load(open("/tmp/all_buckets.json")) or []
            mode = "discovered"
        else:
            mode = "input"
        print("BUCKETS_JSON=" + json.dumps(buckets))
        print("BUCKET_COUNT=%d" % len(buckets))
        print("BUCKET_MODE=%s" % mode)
        print("BUCKETS_DISCOVERED")
        PYEOF
  - id: audit_buckets
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit each bucket for stale multipart uploads.
    values: "{{ outputs.resolve_buckets.vars.BUCKETS_JSON }}"
    tasks:
      - id: audit_bucket
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: Find stale multipart uploads in one bucket, sum the stranded bytes, optionally abort them.
        region: "{{ inputs.aws_region }}"
        accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
        commands:
          - |
            BUCKET="{{ taskrun.value }}"
            REGION="{{ inputs.aws_region }}"
            export BUCKET REGION
            export CUTOFF=$(date -u -d "{{ inputs.age_days }} days ago" +%Y-%m-%dT%H:%M:%SZ)
            export ENFORCE="{{ inputs.enforce }}"
            echo "Scanning s3://$BUCKET for multipart uploads older than $CUTOFF (enforce=$ENFORCE)"
            if ! aws s3api list-multipart-uploads --bucket "$BUCKET" --region "$REGION" \
              --query 'Uploads[].[Key,UploadId,Initiated]' --output json > /tmp/uploads.json 2>/tmp/up_err.txt; then
              echo "ERROR listing uploads for $BUCKET: $(head -c 200 /tmp/up_err.txt)"
              echo "null" > /tmp/uploads.json
            fi
            python3 << 'PYEOF' > /tmp/stale.txt
            import json, os, subprocess, datetime
            bucket = os.environ["BUCKET"]; region = os.environ["REGION"]
            cutoff = datetime.datetime.fromisoformat(os.environ["CUTOFF"].replace("Z", "+00:00"))
            enforce = os.environ["ENFORCE"] == "true"
            uploads = json.load(open("/tmp/uploads.json")) or []
            stale = [u for u in uploads
                     if datetime.datetime.fromisoformat(u[2].replace("Z", "+00:00")) < cutoff]
            total_bytes = 0; aborted = 0; failed = 0
            for key, uid, initiated in stale:
                try:
                    r = subprocess.run(["aws", "s3api", "list-parts", "--bucket", bucket,
                                        "--key", key, "--upload-id", uid, "--region", region,
                                        "--query", "Parts[].Size", "--output", "json"],
                                       capture_output=True, text=True, timeout=120)
                    sizes = json.loads(r.stdout.strip() or "[]") or []
                    total_bytes += sum(s for s in sizes if isinstance(s, (int, float)))
                except Exception:
                    pass
                if enforce:
                    r = subprocess.run(["aws", "s3api", "abort-multipart-upload", "--bucket", bucket,
                                        "--key", key, "--upload-id", uid, "--region", region],
                                       capture_output=True, text=True, timeout=120)
                    if r.returncode == 0:
                        aborted += 1
                    else:
                        failed += 1
            print("STALE_COUNT=%d" % len(stale))
            print("STALE_MB=%.2f" % (total_bytes / 1048576))
            print("ABORTED_COUNT=%d" % aborted)
            print("ABORT_FAILED=%d" % failed)
            print("ENFORCE_MODE=%s" % ("on" if enforce else "off"))
            if stale:
                print("STALE_UPLOADS_FOUND")
            PYEOF
            cat /tmp/stale.txt
            echo "BUCKET_DONE=$BUCKET"
      - id: decide_notify
        type: io.kestra.plugin.core.flow.If
        description: Report stale uploads per bucket, stay quiet on clean buckets.
        condition: "{{ outputs.audit_bucket.stdout contains 'STALE_UPLOADS_FOUND' }}"
        then:
          - id: slack_stale
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Report the stale upload count and stranded bytes for this bucket.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":wastebasket: *S3 multipart cleanup* — `s3://{{ outputs.audit_bucket.vars.BUCKET_DONE }}` has *{{ outputs.audit_bucket.vars.STALE_COUNT }}* stale multipart upload(s) older than {{ inputs.age_days }}d, ~{{ outputs.audit_bucket.vars.STALE_MB }} MB stranded. Enforce mode: {{ outputs.audit_bucket.vars.ENFORCE_MODE }} (aborted {{ outputs.audit_bucket.vars.ABORTED_COUNT }}, failed {{ outputs.audit_bucket.vars.ABORT_FAILED }}). Flip `enforce` to true to abort them automatically."
              }
        else:
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            message: "s3://{{ outputs.audit_bucket.vars.BUCKET_DONE }} — no stale multipart uploads older than {{ inputs.age_days }} days."

extend:
  title: S3 Multipart Cleanup
  metaTitle: Find and Abort Abandoned S3 Multipart Uploads | Kestra
  shortDescription: Scan S3 buckets for stale multipart uploads, total the stranded bytes, and optionally abort them. Dry-run by default; nothing is deleted unless you flip enforce.
  metaDescription: Abandoned S3 multipart uploads bill you forever. This flow finds uploads older than N days and aborts them weekly.
  description: |
    Every interrupted `aws s3 cp` of a large file, every crashed SDK upload, every CI job killed mid-push leaves a multipart upload behind — and S3 keeps billing you for the uploaded parts indefinitely. They don't show up in the console's object listing, so teams discover them only when the bill looks wrong. This blueprint makes the invisible visible, then cleans it up.

    ## How it works

    1. A Schedule trigger fires weekly on Monday at 09:00 UTC (shipped disabled).
    2. A discovery task builds the bucket list: the buckets you pass in `bucket_names`, or every bucket in the account via `list-buckets` when you leave it empty.
    3. A ForEach loop audits each bucket: `list-multipart-uploads` finds uploads initiated before the cutoff (`age_days`, default 7), and `list-parts` sums the stranded bytes per upload.
    4. When `enforce` is true, each stale upload is aborted with `abort-multipart-upload`; otherwise the flow only reports.
    5. An `If` task posts a per-bucket Slack report with the stale count and stranded megabytes — clean buckets just get a log line.

    ## What you get

    - A weekly per-bucket report of abandoned multipart uploads with the stranded bytes as evidence.
    - Optional auto-abort: flip `enforce` to true and stale uploads are removed for you.
    - Works two ways: target specific buckets, or leave `bucket_names` empty to sweep the whole account.
    - Silence on clean buckets — alerts only where money is actually leaking.

    ## Who it's for

    Platform engineers and FinOps folks who move large files through S3 (backups, data pipelines, artifacts) and have never checked for orphaned uploads.

    ## Why orchestrate this with Kestra

    The AWS console won't show you these uploads and the CLI one-liner you ran once is forgotten by next month. As a scheduled Kestra flow the sweep runs itself, the staleness threshold is an input, every abort is logged per bucket, and dry-run mode means you see the waste before anything is deleted.

    ## Prerequisites

    - AWS credentials with `s3:ListBucket`, `s3:ListBucketMultipartUploads`, `s3:ListMultipartUploadParts` and (for enforce mode) `s3:AbortMultipartUpload` permissions.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the S3 API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the S3 API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the stale-upload report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Leave `bucket_names` empty to sweep all buckets, or pass a targeted list.
    3. Run manually once with `enforce: false` and review the Slack report.
    4. Flip `enforce` to true when you're happy, then enable the weekly schedule trigger.

    ## How to extend

    - Add a bucket lifecycle rule (`AbortIncompleteMultipartUpload`) as the permanent fix once the backlog is cleared.
    - Alert on the uploader identity (IAM user/role) to find the noisy pipeline.
    - Export per-upload details (key, age, bytes) to S3 for a longer-lived audit trail.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [Multipart upload overview](https://docs.aws.amazon.com/AmazonS3/latest/userguide/mpuoverview.html)
    - [abort-multipart-upload API](https://docs.aws.amazon.com/cli/latest/reference/s3api/abort-multipart-upload.html)
  tags:
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Day 2 Operations
  ee: false
  demo: false
