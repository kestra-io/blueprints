id: crossref-research-funders-registry-lakehouse-loader
namespace: company.analytics
description: Ingests global academic grant bodies, research funding agencies, and DOI prefixes from CrossRef Funders API into DuckDB, exports Parquet and analytics datasets, and manages sync state with Kestra KV store.

inputs:
  - id: state_key
    type: STRING
    description: Kestra KV store key tracking processed unique entity identifiers.
    defaults: crossref-research-funders-registry-lakehouse-loader_state

variables:
  default_state: "[]"

triggers:
  - id: periodic_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * 1"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'PYEOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime, timezone

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_ids = set(json.loads(raw_state))
        except Exception:
            seen_ids = set()

        url = "https://api.crossref.org/funders?rows=50"
        headers = {"User-Agent": "KestraLakehouseLoader/1.0 (kestra-data-pipeline; contact@company.internal)"}

        resp = requests.get(url, headers=headers, timeout=30)
        resp.raise_for_status()
        data = resp.json()
        root_key = "message"
        items = data.get(root_key, data) if root_key else data

        records = []
        now_iso = datetime.now(timezone.utc).isoformat()
        current_ids = []

        
        funders_list = items.get('items', []) if isinstance(items, dict) else items
        for item in funders_list:
            fid = str(item.get('id', 'UNKNOWN'))
            current_ids.append(fid)
            name = item.get('name', 'Unknown Funder')
            location = item.get('location', 'Global')
            uri = item.get('uri', 'N/A')
            alt_names = item.get('alt-names', [])
            alt_count = len(alt_names) if isinstance(alt_names, list) else 0

            records.append({
                'funder_id': fid,
                'name': str(name),
                'location': str(location),
                'uri': str(uri),
                'alt_names_count': alt_count,
                'is_new': bool(fid not in seen_ids),
                'ingestion_timestamp': now_iso
            })
        

        con = duckdb.connect(database=":memory:")
        con.execute("""
            CREATE TABLE research_funders (
                funder_id VARCHAR,
                name VARCHAR,
                location VARCHAR,
                uri VARCHAR,
                alt_names_count INTEGER,
                is_new BOOLEAN,
                ingestion_timestamp VARCHAR
            );
        """)

        if records:
            con.execute("INSERT INTO research_funders SELECT * FROM read_json_auto(?)", [json.dumps(records)])

        con.execute("COPY research_funders TO 'research_funders.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);")
        con.execute("""
            COPY (
                SELECT
                    location,
                    COUNT(*) AS funder_count
                FROM research_funders
                GROUP BY 1
                ORDER BY funder_count DESC
            ) TO 'funders_by_location.csv' (HEADER, DELIMITER ',');
        """)

        new_count = con.execute("SELECT count(*) FROM research_funders WHERE is_new = true").fetchone()[0]
        total_count = con.execute("SELECT count(*) FROM research_funders").fetchone()[0]

        updated_ids = list(seen_ids.union(current_ids))
        with open("updated_state.json", "w") as f:
            json.dump(updated_ids, f)

        metrics = {
            "total_extracted": total_count,
            "new_entities": new_count,
            "synced_at": now_iso
        }
        with open("metrics.json", "w") as f:
            json.dump(metrics, f)

        print(f"Lakehouse sync complete. Processed {total_count} records ({new_count} newly observed).")
        PYEOF
    outputFiles:
      - research_funders.parquet
      - funders_by_location.csv
      - updated_state.json
      - metrics.json

  - id: update_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ read(outputs.ingest_and_transform.outputFiles['updated_state.json']) }}"

  - id: analyze_and_notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform.outputFiles['research_funders.parquet'] != null }}"
    then:
      - id: log_metrics
        type: io.kestra.plugin.core.log.Log
        message: "CrossRef Scientific Funders Registry sync succeeded. Metrics: {{ read(outputs.ingest_and_transform.outputFiles['metrics.json']) }}"
