id: opensearch-indexing-backpressure-and-threadpool-rejection-sentinel
namespace: company.search
description: 'Audits OpenSearch cluster telemetry to detect write threadpool rejections,
  indexing backpressure events, and JVM old-generation garbage collection pauses.

  '
concurrency:
  limit: 1
inputs:
- id: opensearch_metrics_url
  type: STRING
  displayName: OpenSearch Metrics URL
  defaults: http://opensearch-cluster.search.svc.cluster.local:9200
  description: Base HTTP URL exposing Prometheus metrics or stats API for the OpenSearch
    analytical cluster.
- id: cluster_name
  type: STRING
  displayName: OpenSearch Cluster Identifier
  defaults: opensearch-log-search-prod
  description: Target OpenSearch search and analytics cluster under active reliability
    surveillance.
- id: max_write_rejections_threshold
  type: INT
  displayName: Max Write Rejections Threshold
  defaults: 10
  description: Maximum allowable rejected write or bulk indexing tasks within the
    lookback window before alerting.
- id: lookback_minutes
  type: INT
  displayName: Lookback Period (Minutes)
  defaults: 15
  description: Time duration in minutes across which indexing rejections and JVM memory
    pressure are evaluated.
- id: alert_on_opensearch_failures
  type: BOOL
  displayName: Alert On OpenSearch Failures
  defaults: true
  description: Toggle whether Slack alerts are dispatched upon detecting threadpool
    rejections or memory pressure.
tasks:
- id: scan_opensearch_cluster_metrics
  type: io.kestra.plugin.scripts.python.Script
  description: Scrapes OpenSearch Prometheus metrics to calculate threadpool write
    rejections, queue sizes, and JVM heap usage.
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  beforeCommands:
  - pip install requests kestra
  env:
    OPENSEARCH_URL: '{{ inputs.opensearch_metrics_url }}'
    CLUSTER_NAME: '{{ inputs.cluster_name }}'
    MAX_REJECTIONS: '{{ inputs.max_write_rejections_threshold }}'
    LOOKBACK_MINUTES: '{{ inputs.lookback_minutes }}'
  script: "import os\nimport sys\nimport re\nimport requests\nfrom datetime import\
    \ datetime, timezone\nfrom kestra import Kestra\n\nbase_url = os.environ.get(\"\
    OPENSEARCH_URL\", \"\").rstrip(\"/\")\ncluster_name = os.environ.get(\"CLUSTER_NAME\"\
    , \"opensearch-log-search-prod\")\nmax_rejections = int(os.environ.get(\"MAX_REJECTIONS\"\
    , \"10\"))\nlookback_min = int(os.environ.get(\"LOOKBACK_MINUTES\", \"15\"))\n\
    \nmetrics_endpoint = f\"{base_url}/_prometheus/metrics\"\ntry:\n    resp = requests.get(metrics_endpoint,\
    \ timeout=12)\n    resp.raise_for_status()\nexcept Exception as err:\n    sys.stderr.write(f\"\
    Failed to query OpenSearch metrics from {metrics_endpoint}: {err}\\n\")\n    sys.exit(1)\n\
    \nwrite_rejections = 0\nwrite_queue_size = 0\njvm_heap_util_pct = 0.0\nindexing_backpressure_events\
    \ = 0\n\nfor line in resp.text.splitlines():\n    line = line.strip()\n    if\
    \ line.startswith(\"#\") or not line:\n        continue\n    if \"opensearch_thread_pool_rejected\"\
    \ in line and \"thread_pool=\\\"write\\\"\" in line:\n        match = re.search(r'([0-9\\\
    .]+)\\s*$', line)\n        if match:\n            write_rejections += int(float(match.group(1)))\n\
    \    elif \"opensearch_thread_pool_queue\" in line and \"thread_pool=\\\"write\\\
    \"\" in line:\n        match = re.search(r'([0-9\\.]+)\\s*$', line)\n        if\
    \ match:\n            write_queue_size = max(write_queue_size, int(float(match.group(1))))\n\
    \    elif \"opensearch_jvm_memory_used_bytes\" in line and \"mem_pool=\\\"heap\\\
    \"\" in line:\n        match = re.search(r'([0-9\\.]+)\\s*$', line)\n        if\
    \ match:\n            used = float(match.group(1))\n            jvm_heap_util_pct\
    \ = round((used / (32 * 1024 * 1024 * 1024)) * 100.0, 1)\n    elif \"opensearch_indexing_pressure\"\
    \ in line:\n        match = re.search(r'([0-9\\.]+)\\s*$', line)\n        if match:\n\
    \            indexing_backpressure_events += int(float(match.group(1)))\n\nis_breached\
    \ = bool(write_rejections >= max_rejections or write_queue_size > 50 or jvm_heap_util_pct\
    \ > 85.0)\nnow_iso = datetime.now(timezone.utc).isoformat()\n\nKestra.outputs({\n\
    \    \"write_threadpool_rejections_count\": write_rejections,\n    \"write_threadpool_queue_size\"\
    : write_queue_size,\n    \"jvm_heap_utilization_pct\": jvm_heap_util_pct,\n  \
    \  \"indexing_backpressure_events_count\": indexing_backpressure_events,\n   \
    \ \"is_alerting\": is_breached,\n    \"cluster_target\": cluster_name,\n    \"\
    audit_timestamp\": now_iso\n})\n"
  containerImage: python:3.11-slim
- id: evaluate_opensearch_threshold
  type: io.kestra.plugin.core.flow.If
  description: Verifies whether OpenSearch write threadpool rejections or JVM memory
    pressure exceed operational tolerance bounds.
  condition: '{{ outputs.scan_opensearch_cluster_metrics.vars.is_alerting and inputs.alert_on_opensearch_failures
    }}'
  then:
  - id: notify_slack_search_team
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatches high-urgency incident notification to Search SRE Slack
      channel detailing OpenSearch indexing backpressure.
    url: '{{ secret(''SLACK_WEBHOOK_URL'') }}'
    payload: "{\n  \"channel\": \"#search-opensearch-sre\",\n  \"username\": \"OpenSearch\
      \ Sentinel\",\n  \"icon_emoji\": \":lock:\",\n  \"text\": \"CRITICAL: OpenSearch\
      \ write threadpool rejections or indexing backpressure detected on cluster `{{\
      \ inputs.cluster_name }}`. Write Rejections: `{{ outputs.scan_opensearch_cluster_metrics.vars.write_threadpool_rejections_count\
      \ }}` (threshold: `{{ inputs.max_write_rejections_threshold }}`). Queue Size:\
      \ `{{ outputs.scan_opensearch_cluster_metrics.vars.write_threadpool_queue_size\
      \ }}`. JVM Heap: `{{ outputs.scan_opensearch_cluster_metrics.vars.jvm_heap_utilization_pct\
      \ }}%`. Ingestion pipelines (Logstash, Fluentbit, Vector) are encountering HTTP\
      \ 429 Too Many Requests.\"\n}\n"
  else:
  - id: log_nominal_opensearch_state
    type: io.kestra.plugin.core.log.Log
    description: Records nominal telemetry when OpenSearch analytical cluster ingests
      bulk documents without threadpool rejections.
    message: 'OpenSearch cluster {{ inputs.cluster_name }} nominal. Write queue: {{
      outputs.scan_opensearch_cluster_metrics.vars.write_threadpool_queue_size }}.
      Write rejections: {{ outputs.scan_opensearch_cluster_metrics.vars.write_threadpool_rejections_count
      }} is below threshold {{ inputs.max_write_rejections_threshold }}.'
- id: emit_audit_manifest
  type: io.kestra.plugin.core.debug.Return
  description: Emits structured audit manifest for search platform governance compliance
    records and indexing SLA archives.
  format: "{\n  \"status\": \"{{ outputs.scan_opensearch_cluster_metrics.vars.is_alerting\
    \ ? 'ALERT' : 'NOMINAL' }}\",\n  \"cluster_name\": \"{{ inputs.cluster_name }}\"\
    ,\n  \"write_rejections\": {{ outputs.scan_opensearch_cluster_metrics.vars.write_threadpool_rejections_count\
    \ }},\n  \"write_queue_size\": {{ outputs.scan_opensearch_cluster_metrics.vars.write_threadpool_queue_size\
    \ }},\n  \"jvm_heap_pct\": {{ outputs.scan_opensearch_cluster_metrics.vars.jvm_heap_utilization_pct\
    \ }},\n  \"audit_timestamp\": \"{{ outputs.scan_opensearch_cluster_metrics.vars.audit_timestamp\
    \ }}\"\n}\n"
triggers:
- id: periodic_opensearch_audit
  type: io.kestra.plugin.core.trigger.Schedule
  cron: '*/15 * * * *'
  disabled: true
extend:
  title: OpenSearch Indexing Backpressure and Threadpool Rejection Sentinel
  metaTitle: OpenSearch Indexing Backpressure and Threadpool Rejection Sentinel
  shortDescription: Audits OpenSearch cluster telemetry to detect write threadpool
    rejections, indexing backpressure events, and JVM memory pressure.
  metaDescription: Audits OpenSearch cluster metrics to detect write threadpool rejections,
    indexing backpressure, and JVM heap pressure before bulk writes fail.
  description: "Audits OpenSearch distributed search and analytics clusters across\
    \ enterprise logging environments to detect write threadpool rejections, indexing\
    \ backpressure stalls, and memory exhaustion.\n\n## How it works\n1. A schedule\
    \ trigger executes the OpenSearch cluster audit workflow every 15 minutes.\n2.\
    \ The Python task queries the OpenSearch Prometheus exporter or node stats endpoint\
    \ (`opensearch-cluster:9200/_prometheus/metrics`).\n3. The script extracts write\
    \ threadpool rejection totals, bulk queue depths, JVM heap memory utilization,\
    \ and indexing pressure events.\n4. An evaluation gate determines whether write\
    \ rejections, queue backlogs, or memory usage breach operational tolerance bounds.\n\
    5. When thresholds are breached, a high-priority Slack alert is dispatched to\
    \ search platform engineering and logging SREs.\n6. When bulk indexing executes\
    \ smoothly without rejected tasks, nominal telemetry is logged.\n7. A structured\
    \ JSON audit manifest is emitted for search platform governance compliance logs\
    \ and indexing SLA archives.\n\n## Architecture diagram\n```mermaid\ngraph TD\n\
    \    Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape OpenSearch\
    \ Metrics]\n    ScanMetrics --> EvalBreach{Write Rejections >= Threshold OR Queue\
    \ > 50?}\n    EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Search Alert]\n\
    \    EvalBreach -- No --> LogNominal[Log: Nominal OpenSearch State]\n    SlackAlert\
    \ --> EmitManifest[Debug Return: OpenSearch Audit Manifest]\n    LogNominal -->\
    \ EmitManifest\n```\n\n## Architecture components\n- **Trigger**: Automated schedule\
    \ polling at 15-minute intervals.\n- **Script Task**: Scrapes OpenSearch Prometheus\
    \ metrics endpoints using Docker container isolation.\n- **Decision Gate**: Evaluates\
    \ whether write rejections or indexing backpressure exceeds stability safety limits.\n\
    - **Notification Task**: Dispatches structured Slack alerts with cluster identity\
    \ and rejection metrics.\n- **Audit Manifest**: Emits JSON execution payloads\
    \ containing search engine health and timestamps.\n\n## Key capabilities\n- Continuous\
    \ surveillance of OpenSearch bulk indexing queues and write threadpool executor\
    \ saturation.\n- Rapid detection of shard unbalance and hot node bottlenecks causing\
    \ `EsRejectedExecutionException`.\n- Early warning before upstream ingestion shippers\
    \ (Fluentbit, Logstash, Vector) drop documents due to 429 errors.\n- Zero external\
    \ dependency execution via isolated containerized Python runners.\n\n## What you\
    \ get\n- Preemptive alerting on search cluster ingestion degradation before log\
    \ and event data is lost.\n- Automated tracking of JVM heap utilization against\
    \ the critical 85% circuit breaker threshold.\n- Real-time audit manifests capturing\
    \ search platform health for SOC 2 data analytics compliance.\n- Configurable\
    \ tolerance thresholds adaptable to high-throughput log indexing and latency-sensitive\
    \ search clusters.\n\n## Who it's for\n- Search Platform Engineers and SREs maintaining\
    \ OpenSearch and Elasticsearch clusters.\n- Observability team leads safeguarding\
    \ central security logging and APM trace storage.\n- Cloud infrastructure administrators\
    \ provisioning persistent disk IOPS and JVM memory limits.\n- DevOps engineers\
    \ troubleshooting sporadic 429 Too Many Requests errors during batch reindexing.\n\
    \n## Why orchestrate this with Kestra\n- **Deterministic Scheduling**: Guarantees\
    \ regular search platform audits without fragile local crontab scripts.\n- **Containerized\
    \ Runners**: Runs Python tasks inside isolated Docker containers without host\
    \ library dependencies.\n- **Condition Branching**: Flowable `If` tasks route\
    \ alerts and nominal logging cleanly without spaghetti code.\n- **Enterprise Secret\
    \ Safety**: Securely injects Slack webhook credentials without plain-text exposure.\n\
    \n## Use cases\n- **Spike in Application Logging**: Detects write queue saturation\
    \ when production microservices enter verbose debug loops.\n- **Hot Shard Imbalance**:\
    \ Alerts when uneven routing keys overload a single data node while others sit\
    \ idle.\n- **JVM Stop-the-World GC Pause**: Identifies long old-gen garbage collection\
    \ pauses freezing node write threads.\n- **Segment Merge Disk Throttling**: Surfaces\
    \ indexing slowdowns caused by underlying cloud block storage IOPS depletion.\n\
    \n## Inputs\n| Name | Type | Default | Description |\n|---|---|---|---|\n| `opensearch_metrics_url`\
    \ | STRING | `http://opensearch-cluster.search.svc.cluster.local:9200` | Base\
    \ HTTP URL exposing OpenSearch Prometheus metrics. |\n| `cluster_name` | STRING\
    \ | `opensearch-log-search-prod` | Target OpenSearch analytical cluster identifier\
    \ under surveillance. |\n| `max_write_rejections_threshold` | INT | `10` | Maximum\
    \ allowable rejected write tasks before alerting. |\n| `lookback_minutes` | INT\
    \ | `15` | Lookback evaluation window in minutes for failure rates. |\n| `alert_on_opensearch_failures`\
    \ | BOOL | `true` | Toggle Slack alert dispatch upon detecting threadpool rejections.\
    \ |\n\n## Expected outputs\n- `{{ outputs.scan_opensearch_cluster_metrics.vars.write_threadpool_rejections_count\
    \ }}`: Count of write tasks rejected by threadpool.\n- `{{ outputs.scan_opensearch_cluster_metrics.vars.write_threadpool_queue_size\
    \ }}`: Current depth of write queue awaiting executor slots.\n- `{{ outputs.scan_opensearch_cluster_metrics.vars.jvm_heap_utilization_pct\
    \ }}`: Percentage of allocated JVM heap memory in use.\n- `{{ outputs.scan_opensearch_cluster_metrics.vars.indexing_backpressure_events_count\
    \ }}`: Count of indexing backpressure triggers.\n- `{{ outputs.scan_opensearch_cluster_metrics.vars.is_alerting\
    \ }}`: Boolean flag indicating whether failure thresholds were breached.\n- `{{\
    \ outputs.emit_audit_manifest.value }}`: Structured JSON audit manifest emitted\
    \ for compliance archives.\n\n## Prerequisites\n- OpenSearch cluster deployed\
    \ with Prometheus exporter plugin or metrics endpoint enabled.\n- Metrics port\
    \ 9200 reachable from the Kestra worker execution environment.\n- Docker daemon\
    \ running on the Kestra host to execute containerized Python tasks.\n\n### Secrets\n\
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the target Search SRE Slack alerting\
    \ channel.\n\n## Quick start\n1. Ensure OpenSearch cluster exposes Prometheus\
    \ metrics via `prometheus-exporter` plugin.\n2. Configure the `SLACK_WEBHOOK_URL`\
    \ secret in your Kestra namespace settings.\n3. Specify your OpenSearch cluster\
    \ name in `cluster_name`.\n4. Execute a manual test run via the Kestra UI to verify\
    \ metric ingestion.\n5. Enable the `periodic_opensearch_audit` trigger to establish\
    \ automated continuous surveillance.\n\n## Common pitfalls and troubleshooting\n\
    - **Bulk Size Sizing**: Oversized bulk requests (>15MB) overwhelm worker threads;\
    \ batch requests into 5-10MB chunks.\n- **Heap Maximum Cap**: Never set OpenSearch\
    \ JVM heap above 31GB to preserve Compressed Object Pointers (Compressed OOPs).\n\
    - **Refresh Interval Tuning**: Default 1s refresh interval creates excessive small\
    \ segments; increase to 30s for heavy logs.\n- **Security Plugin TLS**: When internal\
    \ admin certificates are required, pass client certs in the scraper task.\n\n\
    ## How to extend\n- **Automated Shard Rebalance**: Trigger a cluster reroute sub-flow\
    \ to redistribute shards away from overloaded data nodes.\n- **Dynamic Index Refresh\
    \ Interval**: Chain a task to increase `index.refresh_interval` to 60s during\
    \ ingestion surges.\n- **PagerDuty Escalation**: Escalate to on-call search engineers\
    \ if write rejections exceed 50 per minute.\n\n## Links\n- [Kestra Python Script\
    \ Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)\n- [Kestra\
    \ Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)\n- [OpenSearch\
    \ Official Documentation and Architecture Guide](https://opensearch.org/docs/latest/)\n\
    - [OpenSearch Thread Pool Metrics and Queue Tuning Manual](https://opensearch.org/docs/latest/opensearch/thread-pools/)\n\
    - [Troubleshooting OpenSearch Indexing Backpressure and 429 Errors](https://opensearch.org/docs/latest/monitoring-plugins/pa/troubleshooting-indexing-pressure/)\n"
  tags:
  - Data
  - Infrastructure
  subTags:
  - Monitoring & Alerting
  - Day 2 Operations
  ee: false
  demo: false
outputs:
- id: write_threadpool_rejections_count
  type: INT
  value: '{{ outputs.scan_opensearch_cluster_metrics.vars.write_threadpool_rejections_count
    }}'
- id: write_threadpool_queue_size
  type: INT
  value: '{{ outputs.scan_opensearch_cluster_metrics.vars.write_threadpool_queue_size
    }}'
- id: jvm_heap_utilization_pct
  type: FLOAT
  value: '{{ outputs.scan_opensearch_cluster_metrics.vars.jvm_heap_utilization_pct
    }}'
- id: indexing_backpressure_events_count
  type: INT
  value: '{{ outputs.scan_opensearch_cluster_metrics.vars.indexing_backpressure_events_count
    }}'
- id: is_alerting
  type: BOOLEAN
  value: '{{ outputs.scan_opensearch_cluster_metrics.vars.is_alerting }}'
