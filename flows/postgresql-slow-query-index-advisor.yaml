id: postgresql-slow-query-index-advisor
namespace: company.team
description: |
  Audit PostgreSQL performance from pg_stat_statements: list the slowest queries
  over a mean-time floor and the tables where sequential scans dominate, then
  post one Slack advisory. Runs weekly or on demand via webhook.

inputs:
  - id: min_mean_ms
    type: INT
    displayName: Minimum mean time (ms)
    description: Only report queries whose mean execution time is at least this many milliseconds.
    defaults: 100

  - id: min_calls
    type: INT
    displayName: Minimum calls
    description: Ignore queries that ran fewer times than this, so one-off statements do not alert.
    defaults: 5

  - id: top_n
    type: INT
    displayName: Rows per list
    description: Maximum number of slow queries and index candidates to include in the report.
    defaults: 10

  - id: min_table_rows
    type: INT
    displayName: Minimum table rows
    description: Only suggest indexes for tables with at least this many estimated rows.
    defaults: 10000

tasks:
  - id: fetch_slow_queries
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: The slowest statements over the thresholds, ordered by cumulative time.
    url: "{{ secret('POSTGRES_JDBC_URL') }}"
    username: "{{ secret('POSTGRES_USERNAME') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      SELECT
        left(regexp_replace(query, E'[\n\r]+', ' ', 'g'), 160) AS query,
        calls,
        round(mean_exec_time::numeric, 1) AS mean_ms,
        round(total_exec_time::numeric, 1) AS total_ms
      FROM pg_stat_statements
      WHERE mean_exec_time >= {{ inputs.min_mean_ms }}
        AND calls >= {{ inputs.min_calls }}
        AND query NOT ILIKE '%pg_stat_statements%'
        AND query NOT ILIKE 'SET %'
        AND query NOT ILIKE 'BEGIN%'
      ORDER BY total_exec_time DESC
      LIMIT {{ inputs.top_n }}

  - id: fetch_totals
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Aggregate stats for the same filters so the alert can report totals without parsing rows.
    url: "{{ secret('POSTGRES_JDBC_URL') }}"
    username: "{{ secret('POSTGRES_USERNAME') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH_ONE
    sql: |
      SELECT
        count(*) AS slow_count,
        coalesce(round(sum(mean_exec_time * calls) / 1000.0, 1), 0) AS est_total_s
      FROM pg_stat_statements
      WHERE mean_exec_time >= {{ inputs.min_mean_ms }}
        AND calls >= {{ inputs.min_calls }}
        AND query NOT ILIKE '%pg_stat_statements%'
        AND query NOT ILIKE 'SET %'
        AND query NOT ILIKE 'BEGIN%'

  - id: fetch_index_candidates
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Tables big enough to matter where sequential scans outnumber index scans.
    url: "{{ secret('POSTGRES_JDBC_URL') }}"
    username: "{{ secret('POSTGRES_USERNAME') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      SELECT
        relname AS table_name,
        seq_scan,
        coalesce(idx_scan, 0) AS idx_scan,
        n_live_tup AS est_rows
      FROM pg_stat_user_tables
      WHERE seq_scan > coalesce(idx_scan, 0)
        AND n_live_tup >= {{ inputs.min_table_rows }}
      ORDER BY seq_scan DESC
      LIMIT {{ inputs.top_n }}

  - id: audit_gate
    type: io.kestra.plugin.core.flow.If
    description: Send the advisory when either list found something, log a quiet all-clear otherwise.
    condition: "{{ outputs.fetch_slow_queries.size > 0 or outputs.fetch_index_candidates.size > 0 }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: |
          :snail: PostgreSQL slow-query audit - {{ flow.namespace }}.{{ flow.id }} (execution {{ execution.id }}).
          Slow queries (>= {{ inputs.min_mean_ms }} ms mean, >= {{ inputs.min_calls }} calls): {{ outputs.fetch_totals.row.slow_count }}, {{ outputs.fetch_totals.row.est_total_s }} s cumulative time measured.
          {% for row in outputs.fetch_slow_queries.rows %}- {{ row.query }}
          {{ row.calls }} calls | {{ row.mean_ms }} ms mean | {{ row.total_ms }} ms total
          {% endfor %}
          Seq-scan index candidates (>= {{ inputs.min_table_rows }} rows): {{ outputs.fetch_index_candidates.size }}
          {% for row in outputs.fetch_index_candidates.rows %}- {{ row.table_name }}: {{ row.seq_scan }} seq scans vs {{ row.idx_scan }} index scans over ~{{ row.est_rows }} rows - check the WHERE predicates for a missing index
          {% endfor %}
          Next step: EXPLAIN ANALYZE the top offenders and add indexes CONCURRENTLY during an off-peak window.
    else:
      - id: log_clean
        type: io.kestra.plugin.core.log.Log
        message: No slow queries over {{ inputs.min_mean_ms }} ms and no seq-scan-heavy tables over {{ inputs.min_table_rows }} rows. Nothing to advise.

outputs:
  - id: slow_query_count
    type: INT
    value: "{{ outputs.fetch_slow_queries.size }}"
  - id: index_candidate_count
    type: INT
    value: "{{ outputs.fetch_index_candidates.size }}"
  - id: slowest_query
    type: STRING
    value: "{{ outputs.fetch_slow_queries.rows | length > 0 ? outputs.fetch_slow_queries.rows[0].query : 'none' }}"
  - id: cumulative_time_seconds
    type: FLOAT
    value: "{{ outputs.fetch_totals.row.est_total_s }}"

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: ":rotating_light: Slow-query audit {{ flow.id }} FAILED (execution {{ execution.id }}). Check connectivity to PostgreSQL and that the pg_stat_statements extension is installed. Error: {{ error.message }}"

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly audit on Monday morning. Enable when ready.
    cron: "0 6 * * 1"
    disabled: true

  - id: on_demand
    type: io.kestra.plugin.core.trigger.Webhook
    description: Trigger the audit from monitoring or a runbook. Replace the key with your own value.
    key: replace-with-a-random-key

extend:
  title: Audit PostgreSQL Slow Queries and Missing Indexes with Kestra
  shortDescription: Report the slowest queries from pg_stat_statements and tables where sequential scans dominate, as one Slack advisory on a schedule or webhook.
  metaTitle: PostgreSQL Slow Query and Index Advisor Blueprint for Kestra
  metaDescription: "Audit PostgreSQL with Kestra - slow queries from pg_stat_statements, seq-scan index candidates, one Slack advisory, weekly or on demand."
  description: |
    PostgreSQL records every statement in `pg_stat_statements`, but the view only answers questions someone remembers to ask. Nobody spot-checks it weekly, the report never reaches the team channel, and the table that has been doing sequential scans for months keeps doing them. This blueprint turns that view into a standing advisory: the queries that deserve attention, the tables that probably deserve an index, delivered where the team already reads.

    ## How it works

    1. `fetch_slow_queries` (`io.kestra.plugin.jdbc.postgresql.Query`, `fetchType: FETCH`) reads `pg_stat_statements` for statements whose mean time is at least `min_mean_ms` and that ran at least `min_calls` times, ordered by cumulative time, with newlines flattened out of the SQL text and capped at `top_n` rows.
    2. `fetch_totals` (same plugin, `FETCH_ONE`) aggregates the same filters into a count and a cumulative-time figure so the Slack message can state totals without parsing rows in Pebble.
    3. `fetch_index_candidates` reads `pg_stat_user_tables` for tables with at least `min_table_rows` estimated rows where sequential scans outnumber index scans - the classic shape of a query that should have been an index scan.
    4. `audit_gate` (`io.kestra.plugin.core.flow.If`) posts the advisory to Slack when either list is non-empty, and logs a quiet all-clear otherwise. The alert lists each slow query with its call count, mean and total time, and each candidate table with its scan counts.
    5. The flow-level `errors` handler posts a distinct Slack message when the audit itself fails, so a broken connection or a missing extension is loud instead of silently missing a week.

    The thresholds are deliberately inputs: a 20 ms floor suits an OLTP fleet, a 500 ms floor suits an analytics warehouse, and `min_calls` keeps a single exploratory statement from dominating the report.

    ## What you get

    - A ranked list of the statements actually costing time, with numbers, in the team channel.
    - Index candidates derived from real scan statistics, not guesswork.
    - Counts and cumulative time as flow outputs, usable by downstream tasks or dashboards.
    - A weekly cadence plus an on-demand webhook for after-migration checks.

    ## Who it's for

    - DBAs and backend teams who own a PostgreSQL instance and want a weekly performance pulse.
    - Platform teams running managed Postgres (RDS, Cloud SQL, Aurora) without Enterprise query tools.
    - Engineers who just shipped a migration and want immediate evidence of what changed.

    ## Why orchestrate this with Kestra

    A `pg_stat_statements` query in a cron job is a script: no retries when the connection blips, no execution history when someone asks what the report said three weeks ago, no built-in alert when the query itself breaks. Kestra gives the audit scheduled and event triggers, retries, execution lineage, inputs you can tune without editing SQL, and a failure path that pages instead of vanishing into a cron log.

    ## Prerequisites

    - PostgreSQL 13 or newer (the flow uses the `mean_exec_time` / `total_exec_time` columns).
    - The `pg_stat_statements` extension installed and loaded via `shared_preload_libraries` (managed services usually expose it as a parameter).
    - A Kestra instance with network access to the database.

    ### Secrets

    - `POSTGRES_JDBC_URL`: JDBC URL for the database (for example `jdbc:postgresql://host:5432/postgres`).
    - `POSTGRES_USERNAME`: database username.
    - `POSTGRES_PASSWORD`: database password.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for the advisory and failure alerts.

    ## Quick start

    1. Add the four secrets above to your Kestra instance.
    2. Confirm the extension answers: `SELECT count(*) FROM pg_stat_statements;`.
    3. Run the flow once manually and check the `fetch_slow_queries` output rows.
    4. Trigger it from the `on_demand` webhook with your own key, then enable the `weekly` schedule.

    ## How to extend

    - Raise `min_mean_ms` and `min_calls` to keep the channel quiet, or lower them after a migration to catch small regressions.
    - Add a task after `audit_gate` that opens a GitHub issue from the same rows, so the advisory leaves a permanent backlog item.
    - Chain this flow after a deployment with a `Flow` trigger and compare the outputs between releases.
    - Feed `slowest_query` into an `EXPLAIN` automation that plans the statement against production statistics.

    ## Links

    - Plugin docs: https://kestra.io/plugins/plugin-jdbc-postgres
    - pg_stat_statements: https://www.postgresql.org/docs/current/pgstatstatements.html
    - This blueprint has been created by [RudraMalvankar](https://github.com/RudraMalvankar)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
