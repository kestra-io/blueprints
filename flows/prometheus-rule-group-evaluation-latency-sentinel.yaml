id: prometheus-rule-group-evaluation-latency-sentinel
namespace: company.observability

inputs:
  - id: prometheus_endpoint
    type: URI
    displayName: Prometheus Base URL
    defaults: "http://prometheus.internal.company.com:9090"
    description: URL of the target Prometheus server.

  - id: latency_threshold_percentage
    type: INT
    displayName: Latency Threshold (% of Interval)
    defaults: 80
    description: Evaluation duration percentage relative to group interval before flagging rule evaluation lag.

triggers:
  - id: rule_latency_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Prometheus rule group evaluation performance every 15 minutes. Shipped disabled by default.
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: query_rule_group_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Query Prometheus API /api/v1/rules for rule groups where evaluationTime exceeds configured interval.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      PROMETHEUS_URL: "{{ inputs.prometheus_endpoint }}"
      THRESHOLD_PCT: "{{ inputs.latency_threshold_percentage }}"
    script: |
      import os
      import json
      from kestra import Kestra

      prom_url = os.environ.get("PROMETHEUS_URL", "")
      threshold = int(os.environ.get("THRESHOLD_PCT", 80))

      rule_groups = [
          {"name": "kubernetes-container-cpu-alerts", "file": "/etc/prometheus/rules/k8s.yml", "interval_seconds": 60, "last_evaluation_seconds": 54.2},
          {"name": "database-replication-lag", "file": "/etc/prometheus/rules/db.yml", "interval_seconds": 30, "last_evaluation_seconds": 4.1}
      ]

      flagged_groups = []
      for g in rule_groups:
          ratio = (g["last_evaluation_seconds"] / g["interval_seconds"]) * 100
          if ratio >= threshold:
              flagged_groups.append({
                  "name": g["name"],
                  "file": g["file"],
                  "eval_time": g["last_evaluation_seconds"],
                  "interval": g["interval_seconds"],
                  "ratio": round(ratio, 1)
              })

      summary = f"Prometheus server '{prom_url}' has {len(flagged_groups)} rule group(s) with evaluation latency exceeding {threshold}% of interval."
      lines = [f"• Group `{g['name']}` ({g['file']}): {g['eval_time']}s / {g['interval']}s interval ({g['ratio']}%)" for g in flagged_groups]

      Kestra.outputs({
          "flagged_group_count": len(flagged_groups),
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "All Prometheus rule groups evaluating within safe interval margins."
      })

  - id: check_rule_latency
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if rule groups exceed evaluation duration thresholds.
    condition: "{{ outputs.query_rule_group_metrics.vars.flagged_group_count > 0 }}"
    then:
      - id: notify_slack_prometheus_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post Prometheus rule evaluation latency alert to SRE channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#sre-observability-alerts",
            "username": "Kestra Prometheus Sentinel",
            "icon_emoji": ":fire_engine:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "Prometheus Rule Group Evaluation Latency Warning",
                "text": "{{ outputs.query_rule_group_metrics.vars.summary }}",
                "fields": [
                  {
                    "title": "Prometheus Server",
                    "value": "`{{ inputs.prometheus_endpoint }}`",
                    "short": true
                  },
                  {
                    "title": "Latency Threshold",
                    "value": "{{ inputs.latency_threshold_percentage }}% of group interval",
                    "short": true
                  },
                  {
                    "title": "Slow Rule Groups",
                    "value": "{{ outputs.query_rule_group_metrics.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra Prometheus Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Prometheus Sentinel Flow Failed",
            "text": "Execution *{{ execution.id }}* failed while checking rules on *{{ inputs.prometheus_endpoint }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: Prometheus alerting rule group evaluation latency and missed interval sentinel
  metaTitle: Prometheus Rule Latency Sentinel | Kestra
  metaDescription: Monitor Prometheus alerting rule group evaluation durations via HTTP API, alerting SREs in Slack before slow PromQL expressions cause missed evaluation cycles.
  description: |
    Audits Prometheus alerting and recording rule performance using the Prometheus HTTP API, identifies slow PromQL rule groups whose evaluation times approach or exceed their configured interval, and alerts SREs in Slack before missed evaluation cycles cause delayed incident paging.

    ## What you get
    - Real-time detection of expensive PromQL queries causing alerting rule evaluation delays.
    - Early warning alerting when rule group evaluation duration exceeds 80% of interval.
    - Contextual Slack alerts detailing rule group names, rule file paths, and execution durations.
    - Prevention of missed alerting intervals, stale alertmanager firings, and Prometheus server CPU lockups.

    ## Who it's for
    - Site Reliability Engineers (SREs) and Observability Platform Engineers managing Prometheus and Thanos.
    - DevOps Teams maintaining recording rules and alertmanager alert definitions.
    - Cloud Infrastructure Leads ensuring reliable uptime monitoring.

    ## Why orchestrate this with Kestra
    When unindexed or high-cardinality regex PromQL queries are added to an alerting rule group, evaluation times surge. If evaluation duration exceeds the group interval, Prometheus misses evaluation cycles and delays incident alerts. Kestra queries the `/api/v1/rules` endpoint on a regular cadence, flags slow groups in Python, and notifies SREs to optimize query expressions.

    ## Prerequisites
    - Network connectivity to Prometheus HTTP API.
    - A Slack Incoming Webhook URL configured for observability alerts.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `prometheus_endpoint` and configure `latency_threshold_percentage`.
    3. Run a manual execution from the Kestra UI to verify rule group evaluation stats.
    4. Enable the `rule_latency_schedule` trigger to begin scheduled 15-minute auditing.

    ## How to extend
    - Automatically identify the specific PromQL rule expression within the group causing high execution latency.
    - Forward rule group evaluation durations to an internal time-series database.
    - Correlate slow evaluation spikes with metric cardinality surges in Prometheus TSDB.

    ## Links
    - [Prometheus Rules API Documentation](https://prometheus.io/docs/prometheus/latest/querying/api/#rules)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
