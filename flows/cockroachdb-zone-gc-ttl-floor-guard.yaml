id: cockroachdb-zone-gc-ttl-floor-guard
namespace: company.team

description: |
  Find CockroachDB zone configurations whose gc.ttlseconds is set below a safe floor. A low GC TTL
  saves disk by garbage-collecting old MVCC versions sooner. It quietly breaks three things that
  all need that history: a BACKUP that runs longer than the TTL, a changefeed that falls behind the
  TTL and any AS OF SYSTEM TIME read older than the TTL. With approval, raise each too-low zone to
  the floor, then read the zone configurations again and fail the run if any in scope is still below.

inputs:
  - id: jdbc_url
    type: STRING
    displayName: JDBC URL
    description: Any CockroachDB node over the Postgres wire protocol. The SQL port is 26257 by default. Zone configurations are cluster wide, so one run covers the whole cluster.
    defaults: "jdbc:postgresql://localhost:26257/defaultdb?sslmode=require"

  - id: db_user
    type: STRING
    displayName: SQL user
    description: The role the queries connect as. It needs to read crdb_internal.zones, plus the ZONECONFIG privilege on a target to raise its TTL.
    defaults: "root"

  - id: password
    type: STRING
    displayName: SQL password
    description: Read from the COCKROACH_PASSWORD secret by default. An insecure local cluster ignores it.
    defaults: "{{ secret('COCKROACH_PASSWORD') }}"

  - id: min_gc_ttlseconds
    type: INT
    displayName: Minimum gc.ttlseconds (the floor)
    description: >-
      A zone whose own gc.ttlseconds is below this is flagged. The floor has to cover your longest
      BACKUP, the furthest a changefeed may fall behind and the oldest AS OF SYSTEM TIME read you
      rely on. The default of 14400 is four hours, which clears a typical nightly backup window.
    defaults: 14400

  - id: include_internal_zones
    type: BOOL
    displayName: Also raise CockroachDB internal zones
    description: >-
      CockroachDB's own system zones use short TTLs on purpose. RANGE liveness and RANGE timeseries
      hold transient data that is meant to be collected quickly, so they are left out by default.
      Turn this on only when you know why a system zone would need more history.
    defaults: false

  - id: max_zones_changed
    type: INT
    displayName: Maximum zones changed per run
    description: Per run ceiling on ALTER CONFIGURE ZONE, lowest TTL first. Whatever is left over is reported and picked up by the next run.
    defaults: 10

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    description: Allow ALTER CONFIGURE ZONE. Raising a TTL only keeps more old versions, so it never breaks a running query. It does cost disk.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, before any zone is changed. The approval Pause still has to be answered after that.
    defaults: true

variables:
  zone_cte: |
    z AS (
      SELECT zone_id, subzone_id, target,
             coalesce(database_name, '') AS database_name,
             coalesce(table_name, '') AS table_name,
             coalesce(index_name, '') AS index_name,
             coalesce(partition_name, '') AS partition_name,
             substring(raw_config_sql, 'gc\.ttlseconds = ([0-9]+)')::INT8 AS explicit_ttl,
             substring(full_config_sql, 'gc\.ttlseconds = ([0-9]+)')::INT8 AS effective_ttl,
             ((target LIKE 'RANGE %' AND target != 'RANGE default')
               OR coalesce(database_name, '') = 'system') AS internal_zone
        FROM crdb_internal.zones
    )

  settings_sql: |
    WITH {{ render(vars.zone_cte) }}
    SELECT current_database() AS database_name,
           coalesce((SELECT effective_ttl FROM z WHERE target = 'RANGE default'), -1) AS default_ttl,
           (SELECT count(*) FROM z)::INT8 AS total_zones,
           (SELECT count(*) FROM z WHERE explicit_ttl IS NOT NULL
              AND explicit_ttl < {{ inputs.min_gc_ttlseconds }}
              AND (NOT internal_zone OR {{ inputs.include_internal_zones }}))::INT8 AS below_floor_in_scope,
           (SELECT count(*) FROM z WHERE explicit_ttl IS NOT NULL
              AND explicit_ttl < {{ inputs.min_gc_ttlseconds }})::INT8 AS below_floor_all

  audit_sql: |
    WITH {{ render(vars.zone_cte) }}
    SELECT zone_id, subzone_id, target, database_name, table_name, index_name, partition_name,
           explicit_ttl, effective_ttl, internal_zone,
           'ALTER ' || target || ' CONFIGURE ZONE USING gc.ttlseconds = ' || {{ inputs.min_gc_ttlseconds }}::STRING AS fix_sql,
           row_number() OVER (ORDER BY explicit_ttl ASC, target)::INT8 AS fix_rank
      FROM z
     WHERE explicit_ttl IS NOT NULL
       AND explicit_ttl < {{ inputs.min_gc_ttlseconds }}
       AND (NOT internal_zone OR {{ inputs.include_internal_zones }})
     ORDER BY explicit_ttl ASC, target
     LIMIT 500

  verify_sql: |
    WITH targets(target, before_ttl) AS (
      VALUES ('', 0::INT8){% for r in outputs.audit.rows %}{% if r.fix_rank <= inputs.max_zones_changed %}, ('{{ r.target | replace({"'": "''"}) }}', {{ r.explicit_ttl }}::INT8){% endif %}{% endfor %}
    ), live AS (
      SELECT target,
             substring(full_config_sql, 'gc\.ttlseconds = ([0-9]+)')::INT8 AS effective_ttl
        FROM crdb_internal.zones
    )
    SELECT count(*) FILTER (WHERE t.target <> '')::INT8 AS targets_checked,
           count(*) FILTER (WHERE t.target <> ''
                              AND (l.effective_ttl IS NULL OR l.effective_ttl < {{ inputs.min_gc_ttlseconds }}))::INT8 AS targets_below_floor,
           coalesce(string_agg(t.target || ' now ' || coalesce(l.effective_ttl::STRING, 'none') || ' was ' || t.before_ttl::STRING, '; ')
                    FILTER (WHERE t.target <> ''
                              AND (l.effective_ttl IS NULL OR l.effective_ttl < {{ inputs.min_gc_ttlseconds }})), '') AS laggards,
           coalesce(string_agg(t.target || ' ' || coalesce(l.effective_ttl::STRING, 'none'), '; ')
                    FILTER (WHERE t.target <> ''), '') AS target_state,
           coalesce((SELECT substring(full_config_sql, 'gc\.ttlseconds = ([0-9]+)')::INT8
                       FROM crdb_internal.zones WHERE target = 'RANGE default'), -1) AS default_ttl_after
      FROM targets t LEFT JOIN live l ON l.target = t.target

tasks:
  - id: settings_before
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: >-
      Read-only. The cluster default gc.ttlseconds from RANGE default, the number of zones that carry
      a configuration and how many of them set their own gc.ttlseconds below the floor, in scope and in
      total. The default is read first because a low RANGE default lowers the effective TTL of every
      object that does not override it.
    url: "{{ inputs.jdbc_url }}"
    username: "{{ inputs.db_user }}"
    password: "{{ inputs.password }}"
    fetchType: FETCH_ONE
    sql: "{{ render(vars.settings_sql) }}"

  - id: audit
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: >-
      Read-only. One row per zone whose own gc.ttlseconds is below the floor, with the explicit value,
      the effective value, whether it is an internal zone and the ALTER that would raise it. Internal
      zones are listed only when include_internal_zones is on.
    url: "{{ inputs.jdbc_url }}"
    username: "{{ inputs.db_user }}"
    password: "{{ inputs.password }}"
    fetchType: FETCH
    sql: "{{ render(vars.audit_sql) }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      CockroachDB GC TTL on {{ outputs.settings_before.row.database_name }}:
      RANGE default is {{ outputs.settings_before.row.default_ttl }}s, floor {{ inputs.min_gc_ttlseconds }}s.
      {{ outputs.settings_before.row.total_zones }} zones configured,
      {{ outputs.settings_before.row.below_floor_in_scope }} below the floor in scope
      ({{ outputs.settings_before.row.below_floor_all }} including internal zones).
      Change cap {{ inputs.max_zones_changed }} per run.
      {% for r in outputs.audit.rows %}{{ r.internal_zone ? 'INTERNAL ' : '' }}{{ r.target }}: own gc.ttlseconds {{ r.explicit_ttl }}s, effective {{ r.effective_ttl }}s, rank {{ r.fix_rank }}{{ r.fix_rank <= inputs.max_zones_changed ? ' (in this pass)' : ' (next pass)' }}. {% endfor %}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit.size > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'CockroachDB ' ~ inputs.jdbc_url ~ ': ' ~ outputs.audit.size ~ ' zone(s) set gc.ttlseconds below the ' ~ inputs.min_gc_ttlseconds ~ 's floor, which can break a backup, a changefeed or an AS OF SYSTEM TIME read that needs more history. RANGE default is ' ~ outputs.settings_before.row.default_ttl ~ 's. ' ~ (outputs.audit.rows | jq('map("\(.target) \(.explicit_ttl)s") | join("; ")') | first) ~ '.' ~ (inputs.auto_remediate and not inputs.dry_run ? ' Asking for approval to raise up to ' ~ inputs.max_zones_changed ~ ' this pass.' : ' No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: approval_gate
            type: io.kestra.plugin.core.flow.Pause
            description: >-
              Hold the run until a human approves. Raising gc.ttlseconds keeps more old MVCC versions,
              so it never breaks a running read. It does cost disk on a high churn table and it is a
              retention policy decision, so the change never starts on its own.
            pauseDuration: PT2H
            behavior: FAIL
            onResume:
              - id: approved
                type: BOOL
                displayName: Approve the TTL change
                description: Set true to raise the listed zones to the floor. Anything else leaves every zone as it is.
                defaults: false
              - id: change_ticket
                type: STRING
                displayName: Change record
                defaults: ""

          - id: apply
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.approval_gate.onResume.approved ?? false }}"
            then:
              - id: remediate
                type: io.kestra.plugin.core.flow.Loop
                description: One ALTER CONFIGURE ZONE at a time. Zone configurations are written to a single system table, so parallel writes would conflict.
                concurrencyLimit: 1
                values: "{{ outputs.audit.rows | jq('map(select(.fix_rank <= ' ~ inputs.max_zones_changed ~ ') | .fix_sql)') | first | toJson }}"
                tasks:
                  - id: raise_one
                    type: io.kestra.plugin.jdbc.postgresql.Query
                    description: A rejected statement leaves the loop running so the re-read below is what decides the run.
                    allowFailure: true
                    url: "{{ inputs.jdbc_url }}"
                    username: "{{ inputs.db_user }}"
                    password: "{{ inputs.password }}"
                    fetchType: NONE
                    sql: "{{ item.value }}"

              - id: verify
                type: io.kestra.plugin.jdbc.postgresql.Query
                description: Read-only. Reads the zone configurations again and checks that every zone changed this pass now has an effective gc.ttlseconds at or above the floor.
                url: "{{ inputs.jdbc_url }}"
                username: "{{ inputs.db_user }}"
                password: "{{ inputs.password }}"
                fetchType: FETCH_ONE
                sql: "{{ render(vars.verify_sql) }}"

              - id: verify_result
                type: io.kestra.plugin.core.flow.If
                condition: "{{ outputs.verify.row.targets_below_floor > 0 }}"
                then:
                  - id: remediation_failed
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: >-
                      The re-read after remediation did not come back clean.
                      {{ outputs.verify.row.targets_below_floor }} of {{ outputs.verify.row.targets_checked }}
                      changed zones still read below the {{ inputs.min_gc_ttlseconds }}s floor{{ outputs.verify.row.laggards == '' ? '' : ': ' ~ outputs.verify.row.laggards }}.
                      A zone that did not move means the ALTER was rejected, the role lacks ZONECONFIG on that target or the
                      target was dropped between the audit and the change, so read the raise_one logs.
                else:
                  - id: remediated
                    type: io.kestra.plugin.core.log.Log
                    message: >-
                      Raised {{ outputs.verify.row.targets_checked }} zone(s) to at least {{ inputs.min_gc_ttlseconds }}s,
                      cap {{ inputs.max_zones_changed }} per run.
                      Change record {{ outputs.approval_gate.onResume.change_ticket == '' ? 'not given' : outputs.approval_gate.onResume.change_ticket }}.
                      Now: {{ outputs.verify.row.target_state }}. RANGE default {{ outputs.settings_before.row.default_ttl }}s before,
                      {{ outputs.verify.row.default_ttl_after }}s after.
                      {{ outputs.audit.size > inputs.max_zones_changed ? (outputs.audit.size - inputs.max_zones_changed) ~ ' zone(s) left for the next run.' : 'Nothing left over.' }}
            else:
              - id: declined
                type: io.kestra.plugin.core.log.Log
                message: >-
                  The approval was not given, so no zone was changed. Would have run:
                  {{ outputs.audit.rows | jq('map(select(.fix_rank <= ' ~ inputs.max_zones_changed ~ ') | .fix_sql) | if length == 0 then "nothing" else join("; ") end') | first }}.
        else:
          - id: no_change
            type: io.kestra.plugin.core.log.Log
            message: >-
              Reporting only (auto_remediate={{ inputs.auto_remediate }}, dry_run={{ inputs.dry_run }}).
              Would run: {{ outputs.audit.rows | jq('map(select(.fix_rank <= ' ~ inputs.max_zones_changed ~ ') | .fix_sql) | if length == 0 then "nothing" else join("; ") end') | first }}.
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "Every one of the {{ outputs.settings_before.row.total_zones }} configured zones has gc.ttlseconds at or above the {{ inputs.min_gc_ttlseconds }}s floor. RANGE default is {{ outputs.settings_before.row.default_ttl }}s."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'CockroachDB zone GC TTL floor guard failed on ' ~ inputs.jdbc_url ~ ' (execution ' ~ execution.id ~ '). A TTL set too low is invisible until a backup or a changefeed needs the history that was already collected, so a guard that cannot run is worth reading. Check the logs.'} | toJson }}

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled. Always runs in safe mode.
    cron: "0 2 * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: CockroachDB Zone GC TTL Floor Guard
  shortDescription: Find CockroachDB zone configurations whose gc.ttlseconds is below a safe floor, which breaks backups, changefeeds and AS OF SYSTEM TIME reads, then raise them to the floor after approval and verify the change landed.
  metaTitle: CockroachDB Zone GC TTL Floor Guard with Kestra
  metaDescription: Audit CockroachDB zones with a gc.ttlseconds below a safe floor that breaks backups and changefeeds, raise them after approval and re-read to verify.
  description: |
    CockroachDB keeps old versions of every row for `gc.ttlseconds` before it garbage-collects them. Lower that number and the cluster reclaims disk sooner. It is a tempting knob on a storage-heavy table. The cost does not show up where you set it.

    Three things depend on that retained history. All three fail only later. A `BACKUP` reads the cluster as of a fixed time, so a backup that runs longer than the TTL can have the versions it still needs collected out from under it. A changefeed that falls behind by more than the TTL cannot resume, because the rows it had not emitted yet are gone. An `AS OF SYSTEM TIME` query reaching further back than the TTL errors outright. None of this is visible on the day the TTL is lowered. It surfaces the first time a backup runs long, a changefeed stalls or someone runs a time-travel query, which is exactly when you need the history that was already thrown away.

    This blueprint reads CockroachDB's own zone configurations and flags every zone that sets its own `gc.ttlseconds` below a floor you choose. With approval, it raises each one to the floor, then reads the zone configurations again and fails the run if any zone in scope is still below. Raising a TTL only keeps more old versions, so it never breaks a running query. The only cost is disk, which is why a human approves it.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Findings

    - A zone is flagged on its own `gc.ttlseconds`, read from `raw_config_sql` in `crdb_internal.zones`, not on the effective value. `raw_config_sql` lists only the fields a zone sets for itself, so the flag fires at the exact level where someone lowered the TTL. A table that inherits a healthy TTL is not touched. Fixing a low `RANGE default` or a low `DATABASE` zone raises the effective TTL of everything that inherits from it, so the fix lands once at the source rather than being stamped onto every child.
    - `RANGE default` is in scope. It is the base every user object inherits, so a low default is the most dangerous case and the one a per-table scan would miss.
    - CockroachDB's own system zones use short TTLs on purpose. `RANGE liveness` and `RANGE timeseries` hold data that is meant to be collected quickly. The `system` database carries its own low TTLs too. Raising those wastes disk for no gain, so they are left out unless `include_internal_zones` is on.
    - Zone configurations are cluster wide, so one run covers every database. That is different from a statistics or index audit, which reads only the database named in the connection string.
    - The effective value is read back from `full_config_sql` after the change, because that is the number a backup or a changefeed actually gets. A green run means `full_config_sql` reports at or above the floor, not that an `ALTER` returned without error.

    ## Safety

    - Every read is a query against `crdb_internal.zones`. Nothing touches user data.
    - A zone is only changed when `auto_remediate` is true, when `dry_run` is false and when a human resumes the `Pause`. An unanswered Pause fails the run after two hours and changes nothing.
    - The only statement the flow ever writes is `ALTER <target> CONFIGURE ZONE USING gc.ttlseconds = <floor>`, built from `crdb_internal.zones.target`. It sets a TTL to the floor as audited, so a zone someone raised above the floor during the approval wait would be set back down. It never drops a zone and never touches `num_replicas`, constraints or lease preferences.
    - CockroachDB internal zones are out of scope by default.
    - `max_zones_changed` bounds one pass, lowest TTL first, so a cluster with many low zones is worked through over successive runs. The leftover count is logged.
    - The remediation loop runs with `concurrencyLimit: 1`, so two zone writes never collide on the single system table that holds them.
    - The re-read checks only the zones changed this pass, so a leftover zone held back by the cap does not read as a failure.

    ## How it works

    1. `settings_before` (`io.kestra.plugin.jdbc.postgresql.Query`, read-only) reads the `RANGE default` TTL, the number of configured zones and how many set their own `gc.ttlseconds` below the floor, in scope and in total.
    2. `audit` returns one row per zone whose own `gc.ttlseconds` is below the floor and in scope, with the explicit value, the effective value, the `ALTER` that would raise it and a rank the per run cap applies to.
    3. `summary` logs every flagged zone with its own TTL, its effective TTL and whether the cap covers it this pass.
    4. `route` (`io.kestra.plugin.core.flow.If`):
       - **clean:** logs that every configured zone is at or above the floor.
       - **findings:** `alert` posts the zones and their TTLs to Slack.
         - `remediate_gate` runs only when `auto_remediate` is true and `dry_run` is false. Otherwise `no_change` prints the exact statements it would have issued.
         - `approval_gate` (`io.kestra.plugin.core.flow.Pause`) holds for up to two hours and records who approved and under which change record. `behavior: FAIL` means an ignored request fails loudly rather than changing a retention setting on its own.
         - `remediate` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) runs one `ALTER ... CONFIGURE ZONE` at a time, up to the cap.
         - `verify` reads the zone configurations again. `verify_result` fails the run through `io.kestra.plugin.core.execution.Fail` when any changed zone still reads below the floor.
    5. `errors` alerts Slack when the audit itself cannot run.

    ## What you get

    - The zones that trade away the history a backup, a changefeed or a time-travel read depends on, named at the level where the low value was set.
    - `RANGE default` checked as well, so a low cluster-wide floor is caught rather than hidden behind every table that inherits it.
    - A TTL raised to a floor you set, behind a human approval, because the change costs disk.
    - A before and after value from `full_config_sql`, so a green run is a measurement rather than an assumption.

    ## Who it's for

    - Teams running CockroachDB who take backups, run changefeeds or rely on `AS OF SYSTEM TIME` and want the GC TTL that protects all three watched rather than discovered during an incident.
    - Platform engineers who have lowered a TTL to reclaim disk and need to know whether it is now too low for the longest backup on the cluster.
    - Anyone inheriting a cluster where someone set `gc.ttlseconds` on a table or the default and nobody wrote down why.

    ## Why orchestrate this with Kestra

    A GC TTL that is too low is a standing risk, not an event, so the useful thing is a schedule rather than an alert. Kestra runs the audit every day, keeps each run with its numbers, posts the zones to Slack and holds the change behind `auto_remediate`, `dry_run` and a `Pause` that records the approver and the change record. The per run cap spreads a large backlog across passes. The re-read makes the run report success only after `full_config_sql` says the TTL actually moved.

    ## Tested end to end

    On Kestra 2.0.5 OSS against a CockroachDB v24.1 single node insecure cluster reached with the PostgreSQL plugin, with a local HTTP sink standing in for Slack. One table was dropped to `gc.ttlseconds = 600` to stand for a TTL lowered to save disk. A second table was left at a healthy TTL to prove the audit does not flag what is fine. Every result was read back with `SHOW ZONE CONFIGURATION` rather than from the Kestra log.

    | Run | Cluster state | Result |
    |---|---|---|
    | 1 | every zone at or above the floor | Clean. 0 findings |
    | 2 | `shop.orders` set to `gc.ttlseconds = 600` | 1 finding on `TABLE shop.public.orders` at 600s against a 14400s floor, the healthy table not flagged. Alert sent, no change |
    | 3 | same, `auto_remediate: true`, `dry_run: true` | Same finding, the `ALTER` printed, the zone still at 600 when checked with `SHOW ZONE CONFIGURATION` |
    | 4 | same, `auto_remediate: true`, `dry_run: false`, approval declined | `Pause` held, resumed with `approved: false`, the zone still at 600 |
    | 5 | same, `auto_remediate: true`, `dry_run: false`, approved | `ALTER TABLE shop.public.orders CONFIGURE ZONE USING gc.ttlseconds = 14400` applied, 600 to 14400, verified against a fresh read and with `SHOW ZONE CONFIGURATION` |
    | 6 | `RANGE default` set to 600 as well, cap 1 | The default fixed first, the table reported as left for the next run, which the next run raised |
    | 7 | one target changed, run as a role without `ZONECONFIG` | The `ALTER` rejected, the re-read found the zone still at 600 and the run FAILED |
    | 8 | unreachable host | `errors` alert sent |

    ## Prerequisites

    - A CockroachDB cluster reachable over the Postgres wire protocol, which is what the PostgreSQL plugin speaks to it. There is no separate CockroachDB plugin.
    - The audit role needs to read `crdb_internal.zones`. That is admin scoped, so grant the `VIEWCLUSTERMETADATA` system privilege or use a member of `admin`. Raising a TTL needs `ZONECONFIG` on the target or admin rights.
    - Pick the floor to cover your longest `BACKUP`, the furthest a changefeed may fall behind and the oldest `AS OF SYSTEM TIME` read you depend on. The four hour default is a starting point, not a recommendation for every cluster.
    - Local testing: a single node insecure cluster is enough. `cockroach start-single-node --insecure` with a user table dropped to a low `gc.ttlseconds` reproduces every path.

    ### Secrets

    - `COCKROACH_PASSWORD`: the SQL password, read by the `password` input's default. An insecure local node ignores it.
    - `SLACK_WEBHOOK_URL`: used by `alert` and the `errors` block.
    - In Kestra OSS, provide each one as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `jdbc_url` | `jdbc:postgresql://localhost:26257/defaultdb?sslmode=require` | Any node of the cluster |
    | `db_user` | `root` | The role the queries connect as |
    | `password` | `{{ secret('COCKROACH_PASSWORD') }}` | SQL password |
    | `min_gc_ttlseconds` | `14400` | The floor, in seconds |
    | `include_internal_zones` | `false` | Also raise CockroachDB's own system zones |
    | `max_zones_changed` | `10` | Per run ceiling on `ALTER ... CONFIGURE ZONE` |
    | `auto_remediate` | `false` | Allow the TTL change |
    | `dry_run` | `true` | Must be `false` before any zone is changed |

    ## Quick start

    1. Add the `COCKROACH_PASSWORD` and `SLACK_WEBHOOK_URL` secrets.
    2. Import the flow and set `jdbc_url` to one of your nodes.
    3. Set `min_gc_ttlseconds` to a value that clears your longest backup plus a margin. Run it once as it ships and read the findings.
    4. Raise a flagged zone with `auto_remediate: true` and `dry_run: false`, then resume the `Pause` with `approved: true` and your change record.
    5. Enable the `daily` trigger, which always runs in safe mode.

    ## How to extend

    - Set the floor per database by running the flow once per database with its own `min_gc_ttlseconds`, since a reporting warehouse and a changefeed source rarely want the same retention.
    - Read `crdb_internal.kv_store_status` or the range sizes and lead the Slack message with the zones whose raised TTL will cost the most disk.
    - Cross-check the floor against your scheduled backup cadence by reading `SHOW SCHEDULES`, so the TTL is always at least the gap between two full backups.
    - Add a branch that lowers a TTL that is far above the floor on a table nobody backs up, to reclaim disk in the other direction behind the same approval.
    - Loop over several clusters by passing a list of JDBC URLs.

