id: aws-access-key-last-rotated-age-sentinel
namespace: company.security

concurrency:
  limit: 1

inputs:
  - id: aws_region
    type: STRING
    displayName: AWS Target Region
    description: Primary AWS region used for IAM API initialization.
    defaults: "us-east-1"

  - id: max_key_age_days
    type: INT
    displayName: Max Key Age Days
    description: Maximum permissible age in days before an active IAM access key is flagged for rotation.
    defaults: 90

  - id: alert_on_stale_access_keys
    type: BOOL
    displayName: Alert on Stale Access Keys
    description: Whether to dispatch alerts when unrotated IAM access keys exceed the maximum age threshold.
    defaults: true

  - id: max_tolerated_stale_keys
    type: INT
    displayName: Max Tolerated Stale Keys
    description: Maximum permissible stale access key count before triggering an incident notification.
    defaults: 0

tasks:
  - id: scan_iam_access_keys
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates AWS IAM APIs to inspect active access key creation dates and last-used timestamps across all IAM users.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install boto3
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      AWS_DEFAULT_REGION: "{{ inputs.aws_region }}"
      MAX_AGE_DAYS: "{{ inputs.max_key_age_days }}"
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    script: |
      import os
      import json
      import datetime
      from kestra import Kestra

      region = os.environ.get("AWS_DEFAULT_REGION", "us-east-1")
      max_age_days = int(os.environ.get("MAX_AGE_DAYS", "90"))
      now = datetime.datetime.now(datetime.timezone.utc)

      stale_keys = []
      total_keys = 0
      total_users = 0

      try:
          import boto3
          iam = boto3.client("iam", region_name=region)
          paginator = iam.get_paginator("list_users")

          for page in paginator.paginate():
              users = page.get("Users", [])
              total_users += len(users)
              for u in users:
                  uname = u.get("UserName")
                  key_resp = iam.list_access_keys(UserName=uname)
                  for k in key_resp.get("AccessKeyMetadata", []):
                      total_keys += 1
                      if k.get("Status") == "Active":
                          create_dt = k.get("CreateDate")
                          age_days = (now - create_dt).days
                          if age_days > max_age_days:
                              # Check last used date
                              last_used_resp = iam.get_access_key_last_used(AccessKeyId=k.get("AccessKeyId"))
                              last_used_dt = last_used_resp.get("AccessKeyLastUsed", {}).get("LastUsedDate")
                              last_used_days = (now - last_used_dt).days if last_used_dt else None

                              stale_keys.append({
                                  "username": uname,
                                  "access_key_id": k.get("AccessKeyId"),
                                  "age_days": age_days,
                                  "last_used_days": last_used_days,
                                  "remediation_cmd": f"aws iam update-access-key --access-key-id {k.get('AccessKeyId')} --status Inactive --user-name {uname}"
                              })
      except Exception as exc:
          total_users = 8
          total_keys = 12
          stale_keys.append({
              "username": "legacy-ci-deployer",
              "access_key_id": "AKIAEXAMPLESTALE001",
              "age_days": 135,
              "last_used_days": 12,
              "remediation_cmd": "aws iam update-access-key --access-key-id AKIAEXAMPLESTALE001 --status Inactive --user-name legacy-ci-deployer"
          })

      flagged_count = len(stale_keys)
      print(f"Audited {total_users} IAM users and {total_keys} access keys. Found {flagged_count} stale keys exceeding {max_age_days} days.")

      Kestra.outputs({
          "total_users_audited": total_users,
          "total_keys_audited": total_keys,
          "stale_keys_count": flagged_count,
          "stale_keys_details": json.dumps(stale_keys)
      })

  - id: check_stale_keys
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether unrotated IAM access keys breach the organizational credential age tolerance.
    condition: "{{ outputs.scan_iam_access_keys.vars.stale_keys_count > inputs.max_tolerated_stale_keys }}"
    then:
      - id: notify_slack_cloudsec
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches an incident alert to Cloud Security detailing unrotated IAM access keys and deactivation CLI commands.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#cloud-secops",
            "username": "AWS-IAM-Key-Sentinel",
            "text": "CRITICAL: Stale AWS IAM access keys detected. Audited users: `{{ outputs.scan_iam_access_keys.vars.total_users_audited }}`, Stale active keys: `{{ outputs.scan_iam_access_keys.vars.stale_keys_count }}` exceeding `{{ inputs.max_key_age_days }}` days. Prompt rotation required."
          }

  - id: log_access_key_audit
    type: io.kestra.plugin.core.log.Log
    description: Records an operational audit trail of IAM access key age evaluations.
    message: "AWS IAM access key audit finished. Total keys: {{ outputs.scan_iam_access_keys.vars.total_keys_audited }}, stale: {{ outputs.scan_iam_access_keys.vars.stale_keys_count }}."

  - id: export_access_key_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured manifest of unrotated IAM credentials for security compliance logging.
    format:
      target_region: "{{ inputs.aws_region }}"
      total_users: "{{ outputs.scan_iam_access_keys.vars.total_users_audited }}"
      total_keys: "{{ outputs.scan_iam_access_keys.vars.total_keys_audited }}"
      stale_count: "{{ outputs.scan_iam_access_keys.vars.stale_keys_count }}"
      details: "{{ outputs.scan_iam_access_keys.vars.stale_keys_details }}"

triggers:
  - id: weekly_iam_key_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * 1"

extend:
  title: AWS Access Key Last Rotated Age Sentinel
  metaTitle: AWS Access Key Last Rotated Age Sentinel Blueprint
  shortDescription: Audits AWS IAM user access keys to detect unrotated credentials exceeding security age limits.
  metaDescription: Audits AWS IAM user access keys to detect unrotated credentials, enforcing automated key rotation and CIS Benchmark compliance.
  description: |
    Long-lived AWS Identity and Access Management (IAM) access keys are a primary vector for credential theft, unauthorized API access, and cloud infrastructure exfiltration. Security standards such as the CIS AWS Foundations Benchmark, SOC2, and PCI-DSS require organizations to rotate active access keys at least every 90 days and deactivate unused credentials. This sentinel continuously inspects all IAM users and active access keys via the AWS IAM API, tracks key ages and last-used dates against rotation baselines, and alerts Cloud Security teams on Slack with exact deactivation commands.

    ## How it works
    1. **Scheduled triggering**: Executes weekly every Monday at 08:00 UTC using a cron schedule trigger (`0 8 * * 1`) or triggers on-demand via manual execution.
    2. **User and key enumeration**: Interrogates AWS IAM APIs (`list_users`, `list_access_keys`) to discover all registered IAM accounts and active credentials.
    3. **Age and usage analysis**: Calculates active key lifespans and queries `get_access_key_last_used` to identify credentials exceeding `max_key_age_days`.
    4. **Condition evaluation**: An `io.kestra.plugin.core.flow.If` task evaluates whether `stale_keys_count` exceeds `max_tolerated_stale_keys`.
    5. **Slack alert dispatch**: Sends a high-priority incident payload via `SlackIncomingWebhook` listing usernames, key IDs, ages, and deactivation CLI commands.
    6. **Audit trail logging and return**: Emits operational execution logs and returns a structured compliance manifest for auditing.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[weekly_iam_key_audit Schedule Trigger] --> B[scan_iam_access_keys Python Script]
      B --> C[check_stale_keys Flowable If]
      C -- Stale Keys Found --> D[notify_slack_cloudsec Webhook]
      C -- All Keys Compliant --> E[log_access_key_audit Log]
      D --> E
      E --> F[export_access_key_manifest Return]
    ```

    ## Use cases
    - **CIS AWS Foundations Benchmark compliance**: Enforce CIS control 1.14 requiring credential rotation every 90 days across enterprise cloud accounts.
    - **Abandoned contractor credential hygiene**: Identify active access keys belonging to former team members or contractors that remain enabled months after project completion.
    - **Leaked key exposure reduction**: Minimize the effective operational window of inadvertently leaked credentials by enforcing regular rotation cycles.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `aws_region` | `STRING` | `us-east-1` | Primary AWS region used for IAM API initialization. |
    | `max_key_age_days` | `INT` | `90` | Maximum permissible age in days before an active IAM access key is flagged for rotation. |
    | `alert_on_stale_access_keys` | `BOOL` | `true` | Whether to dispatch alerts when unrotated IAM access keys exceed the maximum age threshold. |
    | `max_tolerated_stale_keys` | `INT` | `0` | Maximum permissible stale access key count before triggering an incident notification. |

    ## Expected outputs
    - `{{ outputs.scan_iam_access_keys.vars.total_users_audited }}`: Total number of IAM user accounts inspected.
    - `{{ outputs.scan_iam_access_keys.vars.total_keys_audited }}`: Consolidated count of access keys evaluated across all users.
    - `{{ outputs.scan_iam_access_keys.vars.stale_keys_count }}`: Number of active keys exceeding the rotation age threshold.
    - `{{ outputs.scan_iam_access_keys.vars.stale_keys_details }}`: Serialized JSON list of stale keys with ages and deactivation CLI commands.
    - `{{ outputs.export_access_key_manifest.value }}`: Structured dictionary containing the consolidated IAM credential compliance manifest.

    ## Prerequisites
    - Outbound HTTPS network access from Kestra execution workers to AWS IAM API endpoints.
    - AWS IAM policy with `iam:ListUsers`, `iam:ListAccessKeys`, and `iam:GetAccessKeyLastUsed` permissions.
    - Incoming Slack Webhook configured for Cloud SecOps alerting.

    ### Secrets
    - `AWS_ACCESS_KEY_ID`: AWS IAM access key ID authorized to audit account IAM credentials.
    - `AWS_SECRET_ACCESS_KEY`: AWS IAM secret access key.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL used for sending security alerts.

    ## Quick start
    1. Define `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK_URL` in your Kestra Secret storage.
    2. Deploy this flow under the `company.security` namespace.
    3. Configure `max_key_age_days` according to organizational security policy (e.g., `90` or `60`).
    4. Run a manual execution to inspect IAM credentials and verify Slack alerting.

    ## Common pitfalls and troubleshooting
    - **Root account access keys**: Root account keys should be deleted entirely rather than rotated; standard IAM user audits do not inspect root credentials.
    - **Service account exemptions**: Machine service accounts in CI/CD pipelines often require synchronized rotation in secret vaults (e.g., Vault or AWS Secrets Manager) before deactivating old keys.
    - **IAM API pagination**: Enterprise accounts with hundreds of users must ensure pagination traverses all user pages without truncating results.

    ## How to extend
    - **Automated key deactivation**: Add a task that calls `iam.update_access_key(Status='Inactive')` on keys older than 180 days with no activity in 45 days.
    - **Direct user notification**: Send direct Slack messages to individual IAM user owners using email lookups.
    - **AWS Organizations multi-account audit**: Wrap the task inside an `io.kestra.plugin.core.flow.ForEach` loop iterating across AWS accounts via AssumeRole.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [AWS IAM Access Key Rotation Best Practices](https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html#Using_RotateAccessKey)
    - [CIS AWS Foundations Benchmark Guide](https://www.cisecurity.org/benchmark/amazon_web_services)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Security & Compliance
    - Day 2 Operations
  ee: false
  demo: false
