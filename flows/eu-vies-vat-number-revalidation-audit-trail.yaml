id: eu-vies-vat-number-revalidation-audit-trail
namespace: company.team

description: |
  Revalidate the EU VAT numbers of your B2B customers against the European Commission VIES service
  before zero-rating intra-EU invoices (reverse charge). Each number is normalised and checked once,
  the registered name is compared with the name on file, member-state outages are retried later
  without losing the last good evidence, and every check is written to an audit CSV with the VIES
  consultation number. Only changes (newly invalid, name mismatch, registry name changed) are alerted.

inputs:
  - id: customers_csv
    type: STRING
    description: |
      CSV with a header `customer_id,vat_id,name_on_file`. `vat_id` must start with the two-letter VIES
      country code (EL for Greece; GR is accepted and mapped, XI is Northern Ireland). Spaces, dots and dashes
      are removed. A webhook call can send its own list as `customers_csv` in the JSON body. The default list is
      sample data: real, publicly listed VAT numbers of large companies with invented customer ids and names on
      file, plus deliberate problems (a VAT number filed under the wrong Volvo company, a made-up Irish number,
      a UK number that is not in VIES since Brexit, and a duplicate).
    defaults: |
      customer_id,vat_id,name_on_file
      C001,IE6388047V,Google Ireland Ltd
      C002,IT00905811006,Eni S.p.A.
      C003,BE 0417.497.106,Anheuser-Busch InBev NV
      C004,SE556012579001,Volvo Car Corporation
      C005,ESA28015865,Telefonica SA
      C006,DE143454214,SAP SE
      C007,FR59542051180,TotalEnergies SE
      C008,GR094014201,
      C009,LV40003245752,Air Baltic Corporation
      C010,IE1234567X,Typo Trading Ltd
      C011,GB123456789,UK Customer Ltd
      C012,ie 6388047v,Google Ireland Limited

  - id: requester_vat
    type: STRING
    defaults: ""
    description: Your own EU VAT number with its country prefix. When set, VIES returns a consultation number (`requestIdentifier`) that proves the check was made. Leave empty to check without one.

  - id: max_age_days
    type: INT
    defaults: 30
    description: A number whose last conclusive check is younger than this is not queried again. Numbers waiting for a retry are always queried. Use 0 to force a fresh check.

  - id: retry_wait
    type: DURATION
    defaults: PT20S
    description: Wait before the one in-run retry of a number whose member state answered MS_UNAVAILABLE, TIMEOUT or a concurrency limit. Numbers still failing are retried on the next scheduled run.

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: Daily run. With max_age_days 30 each customer is revalidated monthly and pending retries are picked up the next day.
    cron: "0 6 * * *"

  - id: pre_invoice
    type: io.kestra.plugin.core.trigger.Webhook
    description: "Called by the billing system before an invoice run, optionally with a JSON body containing customers_csv."
    key: "{{ secret('VIES_WEBHOOK_KEY') }}"

tasks:
  - id: get_state
    type: io.kestra.plugin.core.kv.Get
    key: vies_vat_state
    errorOnMissing: false

  - id: prepare
    type: io.kestra.plugin.scripts.python.Script
    description: Parses and normalises the customer list, rejects rows VIES cannot answer (unknown prefix, too short) before any call, removes duplicates and selects the numbers that are due.
    containerImage: python:3.13-slim
    inputFiles:
      customers.csv: "{{ trigger.body.customers_csv ?? inputs.customers_csv }}"
      state.json: "{{ outputs.get_state.value ?? {} | toJson }}"
    env:
      MAX_AGE_DAYS: "{{ inputs.max_age_days }}"
      REQUESTER: "{{ inputs.requester_vat }}"
      RETRY_WAIT: "{{ inputs.retry_wait }}"
    script: |
      import csv, json, os, re
      from datetime import datetime, timedelta, timezone
      VIES = set("AT BE BG CY CZ DE DK EE EL ES FI FR HR HU IE IT LT LU LV MT NL PL PT RO SE SI SK XI".split())
      state = json.load(open("state.json", encoding="utf-8"))
      cutoff = (datetime.now(timezone.utc) - timedelta(days=int(os.environ["MAX_AGE_DAYS"]))).isoformat()
      req = re.sub(r"[^A-Z0-9]", "", os.environ["REQUESTER"].upper())
      customers, queue, rejected, fresh = {}, [], [], 0
      for row in csv.DictReader(open("customers.csv", encoding="utf-8")):
          cid, raw = (row.get("customer_id") or "").strip(), row.get("vat_id") or ""
          vat = re.sub(r"[^A-Z0-9]", "", raw.upper())
          cc = "EL" if vat[:2] == "GR" else vat[:2]
          vat = cc + vat[2:]
          if cc not in VIES or len(vat) < 4:
              rejected.append({"customer_id": cid, "vat_id": raw.strip(), "reason": f"{cc or 'empty'} is not a VIES country code" if cc not in VIES else "too short"})
              continue
          if vat in customers:
              customers[vat]["customer_ids"].append(cid)
              continue
          customers[vat] = {"customer_ids": [cid], "name_on_file": (row.get("name_on_file") or "").strip()}
          prev = state.get(vat)
          if prev and prev["status"] != "RETRY_PENDING" and prev["checked_at"] >= cutoff:
              fresh += 1
              continue
          body = {"countryCode": cc, "vatNumber": vat[2:]}
          if customers[vat]["name_on_file"]:
              body["traderName"] = customers[vat]["name_on_file"]
          if req:
              body.update({"requesterMemberStateCode": req[:2], "requesterNumber": req[2:]})
          queue.append({"vat": vat, "body": json.dumps(body), "wait": os.environ["RETRY_WAIT"]})
      for r in rejected:
          print(f"Rejected {r['customer_id']} {r['vat_id']}: {r['reason']}")
      json.dump(customers, open("customers.json", "w", encoding="utf-8"))
      print(f"{len(customers)} unique VAT numbers, {len(queue)} due for a VIES check, {fresh} still fresh, {len(rejected)} rejected")
      print("::" + json.dumps({"outputs": {"queue": queue, "rejected": rejected, "due": len(queue), "fresh": fresh}}) + "::")
    outputFiles:
      - customers.json

  - id: check
    type: io.kestra.plugin.core.flow.Loop
    description: One VIES call at a time. VIES reports member-state outages inside an HTTP 200 body, so a retryable error code triggers one delayed retry; HTTP 400 input errors are kept as normal responses (`allowFailed`).
    values: "{{ outputs.prepare.vars.queue }}"
    concurrencyLimit: 1
    tasks:
      - id: fetch
        type: io.kestra.plugin.core.http.Request
        uri: https://ec.europa.eu/taxation_customs/vies/rest-api/check-vat-number
        method: POST
        contentType: application/json
        body: "{{ fromJson(item.value).body }}"
        headers:
          User-Agent: kestra-blueprint-eu-vies-vat-revalidation
        options:
          allowFailed: true
        retry:
          type: exponential
          interval: PT5S
          maxInterval: PT30S
          maxAttempts: 3

      - id: retry_if_busy
        type: io.kestra.plugin.core.flow.If
        condition: "{{ (outputs.fetch.body ?? '') contains 'MS_UNAVAILABLE' or (outputs.fetch.body ?? '') contains 'TIMEOUT' or (outputs.fetch.body ?? '') contains 'MAX_CONCURRENT_REQ' or (outputs.fetch.body ?? '') contains 'SERVICE_UNAVAILABLE' }}"
        then:
          - id: wait
            type: io.kestra.plugin.core.flow.Sleep
            duration: "{{ fromJson(item.value).wait }}"
          - id: refetch
            type: io.kestra.plugin.core.http.Request
            uri: https://ec.europa.eu/taxation_customs/vies/rest-api/check-vat-number
            method: POST
            contentType: application/json
            body: "{{ fromJson(item.value).body }}"
            headers:
              User-Agent: kestra-blueprint-eu-vies-vat-revalidation
            options:
              allowFailed: true
    outputs:
      - id: vat
        type: STRING
        value: "{{ fromJson(item.value).vat }}"
      - id: body
        type: STRING
        value: "{{ outputs.refetch.body ?? outputs.fetch.body ?? '' }}"

  - id: evaluate
    type: io.kestra.plugin.scripts.python.Script
    description: |
      Classifies each answer as VALID, NAME_MISMATCH, INVALID, RETRY_PENDING or INPUT_ERROR and sets the
      zero-rating decision. Names are compared after removing accents, punctuation and legal-form words
      (token overlap of at least 60 percent); for member states that hide the name (ES, DE) the VIES approximate
      match `traderNameMatch` is used when available. A RETRY_PENDING number keeps its last valid date and
      consultation number in state as evidence. Only first results and status or registry-name changes are alerted.
    containerImage: python:3.13-slim
    inputFiles:
      state.json: "{{ outputs.get_state.value ?? {} | toJson }}"
      customers.json: "{{ outputs.prepare.outputFiles['customers.json'] }}"
      responses.json: "{{ outputs.check.outputs ?? [] | toJson }}"
      rejected.json: "{{ outputs.prepare.vars.rejected | toJson }}"
    outputFiles:
      - state.json
      - vies_audit.csv
    script: |
      import csv, json, re, unicodedata
      from datetime import datetime, timezone
      RETRYABLE = {"MS_UNAVAILABLE", "TIMEOUT", "MS_MAX_CONCURRENT_REQ", "GLOBAL_MAX_CONCURRENT_REQ", "SERVICE_UNAVAILABLE"}
      LEGAL = set("LTD LIMITED PLC SPA SRL SA SAS SARL NV BV AB AKTIEBOLAGET AKTIEBOLAG AG GMBH SE AS OY OYJ CORPORATION CORP INC CO COMPANY THE".split())
      def tokens(s):
          s = unicodedata.normalize("NFKD", s).encode("ascii", "ignore").decode().upper()
          s = re.sub(r"\b([A-Z])\.(?=[A-Z]\.)", r"\1", s).replace(".", "")
          return {t for t in re.split(r"[^A-Z0-9]+", s) if len(t) > 1 and t not in LEGAL}
      state, customers = json.load(open("state.json", encoding="utf-8")), json.load(open("customers.json", encoding="utf-8"))
      now = datetime.now(timezone.utc).isoformat(timespec="seconds")
      rows, alerts, counts = [], [], {}
      for r in json.load(open("responses.json", encoding="utf-8")):
          vat, body = r["outputs"]["vat"], json.loads(r["outputs"]["body"] or "{}")
          cust, prev = customers[vat], state.get(vat, {})
          errors = [e.get("error", "") for e in body.get("errorWrappers", [])]
          if "INVALID_REQUESTER_INFO" in errors:
              raise SystemExit("VIES rejected requester_vat (INVALID_REQUESTER_INFO); fix the input. State was not changed.")
          name, note = body.get("name", "---"), ""
          if errors:
              status = "RETRY_PENDING" if set(errors) & RETRYABLE else "INPUT_ERROR"
              note = ",".join(errors)
          elif not body.get("valid"):
              status = "INVALID"
          elif not cust["name_on_file"]:
              status, note = "VALID", "no name on file"
          elif name not in ("---", ""):
              a, b = tokens(name), tokens(cust["name_on_file"])
              score = len(a & b) / max(len(a | b), 1)
              status, note = ("VALID" if score >= 0.6 else "NAME_MISMATCH"), f"name overlap {score:.2f}"
          elif body.get("traderNameMatch") in ("VALID", "INVALID"):
              status = "VALID" if body["traderNameMatch"] == "VALID" else "NAME_MISMATCH"
              note = f"VIES traderNameMatch {body['traderNameMatch']}"
          else:
              status, note = "VALID", "member state does not publish the name"
          entry = {"status": status, "registry_name": name, "checked_at": body.get("requestDate", now),
                   "consultation_number": body.get("requestIdentifier", ""),
                   "last_valid_at": prev.get("last_valid_at", ""), "last_valid_consultation": prev.get("last_valid_consultation", "")}
          if status in ("VALID", "NAME_MISMATCH"):
              entry["last_valid_at"], entry["last_valid_consultation"] = entry["checked_at"], entry["consultation_number"]
          if status == "RETRY_PENDING":
              entry.update({k: prev[k] for k in ("registry_name", "checked_at", "consultation_number") if k in prev})
              entry["status"] = status
          state[vat] = entry
          changed = []
          if prev.get("status") != status:
              changed.append(f"{prev.get('status', 'new')} -> {status}")
          if status == "VALID" and prev.get("registry_name") not in (None, "---", name):
              changed.append(f"registry name changed from '{prev['registry_name']}'")
          decision = {"VALID": "ZERO_RATE", "NAME_MISMATCH": "REVIEW", "RETRY_PENDING": "REVIEW"}.get(status, "CHARGE_VAT")
          counts[status] = counts.get(status, 0) + 1
          if changed and (prev or status != "VALID"):
              alerts.append(f"{status} {vat} ({'/'.join(cust['customer_ids'])}, on file '{cust['name_on_file']}', VIES '{name}') {note} {'; '.join(changed)}".strip())
          rows.append({"vat_id": vat, "customer_ids": " ".join(cust["customer_ids"]), "status": status, "zero_rating": decision,
                       "name_on_file": cust["name_on_file"], "vies_name": name, "vies_address": (body.get("address") or "").replace("\n", " ").strip(),
                       "note": note, "request_date": body.get("requestDate", now), "consultation_number": body.get("requestIdentifier", ""),
                       "last_valid_at": entry["last_valid_at"], "last_valid_consultation": entry["last_valid_consultation"]})
          print(f"{vat}: {status} {decision} VIES name '{name}' {note}")
      for r in json.load(open("rejected.json", encoding="utf-8")):
          rows.append({"vat_id": r["vat_id"], "customer_ids": r["customer_id"], "status": "REJECTED", "zero_rating": "CHARGE_VAT", "note": r["reason"], "request_date": now})
      with open("vies_audit.csv", "w", newline="", encoding="utf-8") as f:
          w = csv.DictWriter(f, fieldnames=["vat_id", "customer_ids", "status", "zero_rating", "name_on_file", "vies_name", "vies_address", "note", "request_date", "consultation_number", "last_valid_at", "last_valid_consultation"])
          w.writeheader()
          w.writerows(rows)
      json.dump(state, open("state.json", "w", encoding="utf-8"))
      print("Checked " + str(sum(counts.values())) + ": " + ", ".join(f"{k}={v}" for k, v in sorted(counts.items())))
      print("::" + json.dumps({"outputs": {"counts": counts, "alerts": alerts[:40], "alert_count": len(alerts),
                                          "pending": counts.get("RETRY_PENDING", 0)}}) + "::")

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    key: vies_vat_state
    kvType: JSON
    value: "{{ read(outputs.evaluate.outputFiles['state.json']) }}"

  - id: notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.evaluate.vars.alert_count > 0 }}"
    then:
      - id: log_alerts
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "{{ outputs.evaluate.vars.alert_count }} VAT status change(s): {{ outputs.evaluate.vars.alerts | join('; ') }}"
      - id: slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: allowFailure keeps the audit run green when the Slack secret is not configured.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {"text": "*EU VIES VAT revalidation*: " ~ outputs.evaluate.vars.alert_count ~ " change(s). INVALID means charge local VAT instead of zero-rating; NAME_MISMATCH and RETRY_PENDING need review before invoicing.\n• " ~ (outputs.evaluate.vars.alerts | join('\n• '))} | toJson }}
    else:
      - id: no_changes
        type: io.kestra.plugin.core.log.Log
        message: "No VAT status changes. Due {{ outputs.prepare.vars.due }}, still fresh {{ outputs.prepare.vars.fresh }}, results {{ outputs.evaluate.vars.counts | toJson }}."

outputs:
  - id: summary
    type: JSON
    value:
      checked: "{{ outputs.prepare.vars.due }}"
      skipped_fresh: "{{ outputs.prepare.vars.fresh }}"
      rejected: "{{ outputs.prepare.vars.rejected | length }}"
      results: "{{ outputs.evaluate.vars.counts }}"
      retry_pending: "{{ outputs.evaluate.vars.pending }}"
      alerts: "{{ outputs.evaluate.vars.alert_count }}"
  - id: audit_csv
    type: FILE
    value: "{{ outputs.evaluate.outputFiles['vies_audit.csv'] }}"

extend:
  title: EU VIES VAT Number Revalidation with Audit Trail
  metaTitle: EU VIES VAT Number Revalidation and Audit Trail | Kestra
  shortDescription: Revalidate customer EU VAT numbers against the European Commission VIES service, flag invalid numbers and name mismatches before zero-rating, retry member-state outages and keep an audit CSV per run.
  metaDescription: Check customer EU VAT numbers in VIES, flag invalid IDs and name mismatches, retry member-state outages and keep consultation numbers as evidence.
  description: |
    Zero-rating an intra-EU B2B invoice (reverse charge) needs a valid customer VAT number and proof that it was
    checked. This flow revalidates your customers against the European Commission VIES REST API, compares the
    registered name with the name on file, retries member-state outages and writes every answer, with the VIES
    consultation number, to an audit CSV.
    The default customer list is sample data: real, publicly listed VAT numbers of large companies (Google
    Ireland, Eni, AB InBev, SAP and others) with invented customer ids and names on file, plus deliberate problems.
    All results come from the live VIES service.

    ## How it works
    1. A daily Schedule, a pre-invoice Webhook or a manual run starts the flow. The webhook can send its own list as
       `customers_csv` in the JSON body.
    2. `prepare` normalises each `vat_id` (GR mapped to EL), rejects numbers without a VIES country code (GB since
       Brexit) before any call, merges duplicates and skips numbers checked within `max_age_days`.
    3. A `Loop` posts each number to `check-vat-number` with the name on file as `traderName` and, if set, your
       `requester_vat` so VIES issues a consultation number. Outages (MS_UNAVAILABLE, TIMEOUT, MS_MAX_CONCURRENT_REQ)
       arrive inside an HTTP 200 body, so an `If` waits `retry_wait` and retries once.
    4. `evaluate` classifies each answer as VALID, NAME_MISMATCH, INVALID, RETRY_PENDING or INPUT_ERROR and sets the
       zero-rating decision (ZERO_RATE, REVIEW or CHARGE_VAT). Names are compared without accents, punctuation and
       legal-form words; where the name is hidden (Spain) the VIES approximate match is used.
    5. The KV store keeps the last result per number. A pending number keeps its last valid date and consultation
       number and is retried on the next run. Only new problems and changes go to the WARN log and Slack.

    ## What you get
    - An audit CSV per execution with the VIES request date, name, address and consultation number.
    - Invalid numbers and name mismatches flagged before the invoice run, not after an audit.
    - Outages retried without losing the evidence of the last good check.
    - Monthly revalidation per customer from a daily schedule.

    ## Who it's for
    - Tax, accounts receivable and billing teams issuing EU reverse-charge invoices.
    - Finance data engineers who own customer master data.

    ## Why orchestrate this with Kestra
    - Schedule and webhook share one flow, state lives in the KV store and each execution keeps its audit file.
    - Retries, waits and alerts are declared in YAML instead of hidden in a cron script.

    ## Prerequisites
    - A worker that can run the `python:3.13-slim` image (standard library only) and reach ec.europa.eu.
    - No API key. VIES only issues a consultation number when you pass your own VAT number as `requester_vat`.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for alerts (optional, alerts stay in the WARN log).
    - `VIES_WEBHOOK_KEY`: key of the pre-invoice webhook trigger.

    ## Quick start
    1. Import the blueprint and click **Execute** with the default inputs; the first run records a baseline.
    2. Replace `customers_csv` with your customer export and set `requester_vat` to your own VAT number.
    3. Add the secrets and keep the daily schedule, or call the webhook from your billing system before invoicing.

    ## How to extend
    - Push the audit CSV to object storage or a warehouse for long-term retention.
    - Write the zero-rating decision back to your ERP customer record.

    ## Links
    - [VIES VAT number validation](https://ec.europa.eu/taxation_customs/vies/)
    - [VIES technical information and REST API](https://ec.europa.eu/taxation_customs/vies/#/technical-information)
    - [Kestra Loop task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop)
    - [Kestra Python Script task](https://kestra.io/plugins/plugin-script-python/io.kestra.plugin.scripts.python.script)
    - [Kestra Slack Incoming Webhook](https://kestra.io/plugins/plugin-slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Business
  subTags:
    - Policy & Compliance
  ee: false
  demo: false
