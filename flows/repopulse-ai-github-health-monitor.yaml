id: repopulse-ai-github-health-monitor
namespace: company.devtools

description: |
  RepoPulse AI is an automated GitHub repository health-monitoring blueprint.
  It collects repository metadata, audits the open issue backlog, inspects releases,
  and evaluates community health standards using parallel execution, deterministic
  rules, and conditional alerting.

inputs:
  - id: owner
    type: STRING
    defaults: kestra-io
    description: GitHub repository owner or organization name.

  - id: repository
    type: STRING
    defaults: kestra
    description: Target repository name to monitor.

  - id: max_open_issues_threshold
    type: INT
    defaults: 150
    description: Maximum allowable open issues before flagging backlog review.

  - id: max_days_without_release
    type: INT
    defaults: 90
    description: Maximum days without a release before flagging cadence risk.

  - id: max_days_without_update
    type: INT
    defaults: 30
    description: Maximum days without a commit or update before flagging inactivity.

  - id: min_community_health_percent
    type: INT
    defaults: 75
    description: Minimum community health score percentage (README, LICENSE, etc.).

triggers:
  - id: daily_pulse
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * *"
    timezone: UTC
    description: Runs the health check daily at 06:00 UTC.

  - id: ondemand_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('REPO_PULSE_WEBHOOK_KEY') }}"
    description: Triggers on-demand health assessment via external webhook or CI/CD.

tasks:
  - id: collect_repository_data
    type: io.kestra.plugin.github.repositories.Search
    description: Collects core repository metadata including branch, description, visibility, and last update date using the official GitHub plugin.
    oauthToken: "{{ secret('GITHUB_TOKEN') }}"
    repository: "{{ inputs.owner }}/{{ inputs.repository }}"
    fetchType: FETCH_ONE

  - id: parallel_health_checks
    type: io.kestra.plugin.core.flow.Parallel
    description: Concurrently audits open issues, latest releases, and community health standards.
    tasks:
      - id: check_open_issues
        type: io.kestra.plugin.github.issues.Search
        description: Audits open issues backlog, counting total open issues and retrieving recent activity.
        oauthToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.owner }}/{{ inputs.repository }}"
        open: true
        sort: UPDATED
        order: DESC
        fetchType: FETCH

      - id: check_latest_releases
        type: io.kestra.plugin.core.http.Request
        description: Queries GitHub Releases API for recent releases, tags, and publication timestamps.
        uri: "https://api.github.com/repos/{{ inputs.owner }}/{{ inputs.repository }}/releases?per_page=5"
        method: GET
        headers:
          Accept: application/vnd.github+json
          Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
          X-GitHub-Api-Version: "2022-11-28"
        options:
          allowFailed: true

      - id: check_community_metadata
        type: io.kestra.plugin.core.http.Request
        description: Fetches GitHub community health profile verifying README, LICENSE, CONTRIBUTING guide, and issue templates.
        uri: "https://api.github.com/repos/{{ inputs.owner }}/{{ inputs.repository }}/community/profile"
        method: GET
        headers:
          Accept: application/vnd.github+json
          Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
          X-GitHub-Api-Version: "2022-11-28"
        options:
          allowFailed: true

  - id: evaluate_health
    type: io.kestra.plugin.scripts.python.Script
    description: Evaluates collected metrics deterministically against thresholds, producing health status, checks, and recommendations.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    inputFiles:
      repo_data.json: "{{ outputs.collect_repository_data.row | toJson }}"
      releases.json: "{{ outputs.check_latest_releases.body ?? '[]' }}"
      community.json: "{{ outputs.check_community_metadata.body ?? '{}' }}"
    env:
      REPOSITORY: "{{ inputs.owner }}/{{ inputs.repository }}"
      TOTAL_OPEN_ISSUES: "{{ outputs.check_open_issues.total ?? 0 }}"
      MAX_ISSUES_THRESHOLD: "{{ inputs.max_open_issues_threshold }}"
      MAX_DAYS_WITHOUT_RELEASE: "{{ inputs.max_days_without_release }}"
      MAX_DAYS_WITHOUT_UPDATE: "{{ inputs.max_days_without_update }}"
      MIN_COMMUNITY_HEALTH_PERCENT: "{{ inputs.min_community_health_percent }}"
    outputFiles:
      - health_report.json
    script: |
      import json
      import os
      from datetime import datetime, timezone

      repo_name = os.environ.get("REPOSITORY", "unknown")
      max_issues = int(os.environ.get("MAX_ISSUES_THRESHOLD", 150))
      max_release_days = int(os.environ.get("MAX_DAYS_WITHOUT_RELEASE", 90))
      max_update_days = int(os.environ.get("MAX_DAYS_WITHOUT_UPDATE", 30))
      min_community_pct = int(os.environ.get("MIN_COMMUNITY_HEALTH_PERCENT", 75))

      try:
          total_open_issues = int(os.environ.get("TOTAL_OPEN_ISSUES", 0))
      except (ValueError, TypeError):
          total_open_issues = 0

      repo_data = {}
      if os.path.exists("repo_data.json"):
          with open("repo_data.json", "r", encoding="utf-8") as f:
              try:
                  content = f.read().strip()
                  if content:
                      loaded = json.loads(content)
                      if isinstance(loaded, dict):
                          repo_data = loaded
              except Exception:
                  repo_data = {}

      releases = []
      if os.path.exists("releases.json"):
          with open("releases.json", "r", encoding="utf-8") as f:
              try:
                  content = f.read().strip()
                  if content:
                      loaded = json.loads(content)
                      if isinstance(loaded, list):
                          releases = loaded
              except Exception:
                  releases = []

      community = {}
      if os.path.exists("community.json"):
          with open("community.json", "r", encoding="utf-8") as f:
              try:
                  content = f.read().strip()
                  if content:
                      loaded = json.loads(content)
                      if isinstance(loaded, dict):
                          community = loaded
              except Exception:
                  community = {}

      now = datetime.now(timezone.utc)

      # 1. Evaluate Activity & Staleness
      updated_str = repo_data.get("updated")
      days_since_update = None
      if updated_str:
          try:
              if isinstance(updated_str, (int, float)):
                  dt_updated = datetime.fromtimestamp(updated_str / 1000.0, tz=timezone.utc)
              else:
                  clean_str = str(updated_str).replace("Z", "+00:00")
                  dt_updated = datetime.fromisoformat(clean_str)
              days_since_update = max(0, (now - dt_updated).days)
          except Exception:
              days_since_update = None

      # 2. Evaluate Releases
      days_since_release = None
      latest_release_tag = "none"
      if releases:
          latest_release = releases[0]
          latest_release_tag = latest_release.get("tag_name", "unknown")
          pub_str = latest_release.get("published_at") or latest_release.get("created_at")
          if pub_str:
              try:
                  clean_pub = str(pub_str).replace("Z", "+00:00")
                  dt_release = datetime.fromisoformat(clean_pub)
                  days_since_release = max(0, (now - dt_release).days)
              except Exception:
                  days_since_release = None

      # 3. Evaluate Community Metadata
      comm_health_pct = community.get("health_percentage", 0)
      comm_files = community.get("files", {}) or {}
      missing_files = []
      for key in ["readme", "license", "contributing", "code_of_conduct", "issue_template"]:
          if comm_files.get(key) is None:
              missing_files.append(key)

      # Deterministic checks
      checks = {}
      recommendations = []
      action_list = []

      # Check A: Open Issues
      if total_open_issues <= max_issues:
          checks["issues"] = "PASSED"
      else:
          checks["issues"] = "NEEDS_REVIEW"
          recommendations.append(
              f"Open issues backlog ({total_open_issues}) exceeds threshold ({max_issues}). Consider triaging stale issues and labelling priority bugs."
          )
          action_list.append("Triage open issue backlog and close stale/resolved tickets.")

      # Check B: Releases
      if releases and days_since_release is not None and days_since_release <= max_release_days:
          checks["releases"] = "PASSED"
      elif releases and days_since_release is not None:
          checks["releases"] = "NEEDS_ATTENTION"
          recommendations.append(
              f"Last release '{latest_release_tag}' was {days_since_release} days ago (threshold: {max_release_days} days). Schedule a new maintenance release."
          )
          action_list.append(f"Cut a new release version from branch '{repo_data.get('default_branch', 'main')}'.")
      else:
          checks["releases"] = "NEEDS_ATTENTION"
          recommendations.append("No published releases detected. Tag a release version to provide stable distribution artifacts for consumers.")
          action_list.append("Tag and publish an initial release version.")

      # Check C: Metadata & Community Standards
      has_readme = comm_files.get("readme") is not None
      has_license = comm_files.get("license") is not None
      if comm_health_pct >= min_community_pct and has_readme and has_license:
          checks["metadata"] = "PASSED"
      else:
          checks["metadata"] = "NEEDS_ATTENTION"
          recommendations.append(
              f"Community health score is {comm_health_pct}% (minimum: {min_community_pct}%). Missing files: {', '.join(missing_files) if missing_files else 'None'}."
          )
          if not has_license:
              action_list.append("Add an open-source LICENSE file to clarify software usage terms.")
          if not has_readme:
              action_list.append("Add a comprehensive README.md describing project goals and usage.")
          if "contributing" in missing_files:
              action_list.append("Add CONTRIBUTING.md guidelines for community contributors.")

      # Check D: Repository Activity
      if days_since_update is not None and days_since_update <= max_update_days:
          checks["activity"] = "PASSED"
      else:
          checks["activity"] = "NEEDS_ATTENTION"
          update_desc = f"{days_since_update} days ago" if days_since_update is not None else "unknown date"
          recommendations.append(
              f"Repository has not been updated recently (last update: {update_desc}, threshold: {max_update_days} days)."
          )
          action_list.append("Review repository activity and merge outstanding dependency or maintenance updates.")

      # Overall Status Calculation
      has_failures = any(v in ("NEEDS_ATTENTION", "NEEDS_REVIEW") for v in checks.values())
      health_status = "NEEDS_ATTENTION" if has_failures else "HEALTHY"

      if health_status == "HEALTHY":
          recommendations.append("Repository satisfies all health benchmarks. Continue routine CI and dependency maintenance.")

      # Compile structured report
      report = {
          "repository": repo_name,
          "health_status": health_status,
          "checks": {
              "metadata": checks.get("metadata", "NEEDS_ATTENTION"),
              "issues": checks.get("issues", "NEEDS_REVIEW"),
              "releases": checks.get("releases", "NEEDS_ATTENTION"),
              "activity": checks.get("activity", "NEEDS_ATTENTION")
          },
          "metrics": {
              "open_issues_count": total_open_issues,
              "max_issues_threshold": max_issues,
              "latest_release_tag": latest_release_tag,
              "days_since_release": days_since_release if days_since_release is not None else -1,
              "community_health_percent": comm_health_pct,
              "days_since_update": days_since_update if days_since_update is not None else -1,
              "stars_count": repo_data.get("stars_count", 0),
              "forks_count": repo_data.get("forks_count", 0),
              "default_branch": repo_data.get("default_branch", "main"),
              "visibility": repo_data.get("visibility", "PUBLIC")
          },
          "recommendations": recommendations,
          "action_list": action_list,
          "generated_at": now.isoformat()
      }

      with open("health_report.json", "w") as out:
          json.dump(report, out, indent=2)

      # Emit Kestra output protocol
      output_vars = {
          "health_status": health_status,
          "checks_metadata": checks.get("metadata"),
          "checks_issues": checks.get("issues"),
          "checks_releases": checks.get("releases"),
          "checks_activity": checks.get("activity"),
          "checks_summary": f"Metadata: {checks.get('metadata')}, Issues: {checks.get('issues')}, Releases: {checks.get('releases')}, Activity: {checks.get('activity')}",
          "open_issues_count": total_open_issues,
          "days_since_release": days_since_release if days_since_release is not None else -1,
          "community_health_percent": comm_health_pct,
          "days_since_update": days_since_update if days_since_update is not None else -1,
          "recommendations": recommendations,
          "action_list": action_list
      }
      print("::" + json.dumps({"outputs": output_vars}) + "::")

  - id: conditional_decision
    type: io.kestra.plugin.core.flow.If
    description: Branches execution based on evaluated repository health status.
    condition: "{{ outputs.evaluate_health.vars.health_status == 'HEALTHY' }}"
    then:
      - id: log_healthy_status
        type: io.kestra.plugin.core.log.Log
        description: Logs positive health status with current metrics and maintenance tips.
        level: INFO
        message: |
          =======================================================
          RepoPulse AI: Repository is in HEALTHY status!
          Repository: {{ inputs.owner }}/{{ inputs.repository }}
          =======================================================
          Checks:
          - Community Metadata: {{ outputs.evaluate_health.vars.checks_metadata }} ({{ outputs.evaluate_health.vars.community_health_percent }}%)
          - Open Issues Backlog: {{ outputs.evaluate_health.vars.checks_issues }} ({{ outputs.evaluate_health.vars.open_issues_count }} issues)
          - Release Cadence: {{ outputs.evaluate_health.vars.checks_releases }} ({{ outputs.evaluate_health.vars.days_since_release }} days ago)
          - Repository Activity: {{ outputs.evaluate_health.vars.checks_activity }} ({{ outputs.evaluate_health.vars.days_since_update }} days ago)

          All benchmarks satisfied. Routine maintenance recommended.

    else:
      - id: log_attention_required
        type: io.kestra.plugin.core.log.Log
        description: Logs warning and prioritized action items for degraded health checks.
        level: WARN
        message: |
          =======================================================
          RepoPulse AI: Repository NEEDS ATTENTION!
          Repository: {{ inputs.owner }}/{{ inputs.repository }}
          =======================================================
          Checks Summary:
          - Community Metadata: {{ outputs.evaluate_health.vars.checks_metadata }} (Score: {{ outputs.evaluate_health.vars.community_health_percent }}%)
          - Open Issues Backlog: {{ outputs.evaluate_health.vars.checks_issues }} (Total: {{ outputs.evaluate_health.vars.open_issues_count }} issues)
          - Release Cadence: {{ outputs.evaluate_health.vars.checks_releases }} (Days since release: {{ outputs.evaluate_health.vars.days_since_release }})
          - Repository Activity: {{ outputs.evaluate_health.vars.checks_activity }} (Days since update: {{ outputs.evaluate_health.vars.days_since_update }})

          Prioritized Action Items:
          {%- for action in outputs.evaluate_health.vars.action_list %}
          * {{ action }}
          {%- endfor %}

          Recommendations:
          {%- for rec in outputs.evaluate_health.vars.recommendations %}
          - {{ rec }}
          {%- endfor %}

  - id: generate_final_report
    type: io.kestra.plugin.core.storage.Write
    description: Persists the structured JSON health report artifact to Kestra internal storage.
    extension: .json
    content: |
      {
        "repository": "{{ inputs.owner }}/{{ inputs.repository }}",
        "health_status": "{{ outputs.evaluate_health.vars.health_status }}",
        "checks": {
          "metadata": "{{ outputs.evaluate_health.vars.checks_metadata }}",
          "issues": "{{ outputs.evaluate_health.vars.checks_issues }}",
          "releases": "{{ outputs.evaluate_health.vars.checks_releases }}",
          "activity": "{{ outputs.evaluate_health.vars.checks_activity }}"
        },
        "metrics": {
          "stars": {{ outputs.collect_repository_data.row.stars_count ?? 0 }},
          "forks": {{ outputs.collect_repository_data.row.forks_count ?? 0 }},
          "open_issues": {{ outputs.evaluate_health.vars.open_issues_count ?? 0 }},
          "community_health_percent": {{ outputs.evaluate_health.vars.community_health_percent ?? 0 }},
          "days_since_last_release": {{ outputs.evaluate_health.vars.days_since_release ?? -1 }},
          "days_since_last_update": {{ outputs.evaluate_health.vars.days_since_update ?? -1 }},
          "default_branch": "{{ outputs.collect_repository_data.row.default_branch ?? 'main' }}",
          "visibility": "{{ outputs.collect_repository_data.row.visibility ?? 'PUBLIC' }}"
        },
        "recommendations": {{ outputs.evaluate_health.vars.recommendations | toJson }},
        "action_list": {{ outputs.evaluate_health.vars.action_list | toJson }},
        "generated_at": "{{ now() }}"
      }

  - id: publish_report_summary
    type: io.kestra.plugin.core.log.Log
    description: Publishes final execution report artifact reference and health status.
    message: |
      RepoPulse AI audit complete for {{ inputs.owner }}/{{ inputs.repository }}.
      Health Status: {{ outputs.evaluate_health.vars.health_status }}
      Report Artifact URI: {{ outputs.generate_final_report.uri }}

outputs:
  - id: health_status
    type: STRING
    description: Evaluated repository health status (HEALTHY or NEEDS_ATTENTION).
    value: "{{ outputs.evaluate_health.vars.health_status }}"

  - id: report_uri
    type: STRING
    description: Kestra internal storage URI for the structured JSON health report.
    value: "{{ outputs.generate_final_report.uri }}"

  - id: checks_summary
    type: STRING
    description: Summary of individual health check statuses.
    value: "{{ outputs.evaluate_health.vars.checks_summary }}"

  - id: open_issues_count
    type: INT
    description: Total open issues detected during audit.
    value: "{{ outputs.evaluate_health.vars.open_issues_count }}"

  - id: days_since_release
    type: INT
    description: Days elapsed since last published release (-1 if none found).
    value: "{{ outputs.evaluate_health.vars.days_since_release }}"

  - id: community_health_percent
    type: INT
    description: GitHub community profile standards health percentage.
    value: "{{ outputs.evaluate_health.vars.community_health_percent }}"

extend:
  title: "RepoPulse AI: GitHub Repository Health & Maintenance Monitor"
  shortDescription: "Automate repository health audits with parallel checks on issues, releases, and community metadata, producing structured maintenance reports."
  metaTitle: "GitHub Repository Health Monitor with Kestra | RepoPulse AI"
  metaDescription: "Monitor GitHub repo health with Kestra: parallel checks for open issues, releases, and community standards, producing deterministic maintenance reports."
  description: |
    RepoPulse AI delivers automated, reproducible repository health auditing for open-source maintainers and engineering teams. It concurrently gathers repository metadata, audits open issue backlogs, tracks release cadence, and measures community health standards using declarative Kestra orchestration. A deterministic evaluation engine scores the repository, identifies hygiene risks, and outputs structured maintenance reports alongside actionable remediation lists.

    ## How it works

    1. **Triggering**: Runs on a scheduled daily cadence (`daily_pulse` via `io.kestra.plugin.core.trigger.Schedule` at 06:00 UTC) or instantaneously via webhook (`ondemand_webhook` via `io.kestra.plugin.core.trigger.Webhook`) upon pull requests or release events.
    2. **Repository Data Collection**: The `collect_repository_data` task (`io.kestra.plugin.github.repositories.Search`) queries the repository using the official GitHub plugin, extracting core attributes: name, description, default branch, visibility, stars, and last updated timestamp.
    3. **Parallel Health Checks**: The `parallel_health_checks` flowable (`io.kestra.plugin.core.flow.Parallel`) executes three audits concurrently:
       - `check_open_issues` (`io.kestra.plugin.github.issues.Search`): Counts total open issues and retrieves recent issues.
       - `check_latest_releases` (`io.kestra.plugin.core.http.Request`): Fetches published release tags and dates from the GitHub REST API.
       - `check_community_metadata` (`io.kestra.plugin.core.http.Request`): Retrieves GitHub's community health profile evaluating presence of README, LICENSE, CONTRIBUTING guide, and issue templates.
    4. **Deterministic Health Evaluation**: The `evaluate_health` task (`io.kestra.plugin.scripts.python.Script`) runs on `io.kestra.plugin.core.runner.Process` to compare metrics against configurable thresholds, calculating days elapsed since last update and release, computing community compliance, assigning status ratings (`PASSED`, `NEEDS_REVIEW`, `NEEDS_ATTENTION`), and producing prioritized action items.
    5. **Conditional Decision**: The `conditional_decision` flowable (`io.kestra.plugin.core.flow.If`) branches dynamically on `health_status`:
       - If `HEALTHY`: `log_healthy_status` logs confirmation and routine hygiene recommendations.
       - If `NEEDS_ATTENTION`: `log_attention_required` issues a warning with a prioritized remediation checklist.
    6. **Report Generation & Output**: The `generate_final_report` task (`io.kestra.plugin.core.storage.Write`) writes the complete, structured JSON report to Kestra internal storage (`{{ outputs.generate_final_report.uri }}`), and flow-level outputs expose key metrics directly to caller workflows.

    ## What you get

    - Comprehensive repository health assessments generated automatically on schedule or webhook.
    - Concurrent parallel API audits reducing workflow latency.
    - Deterministic evaluation rules covering open issues backlog, release cadence, staleness, and community standards.
    - Actionable remediation advice: immediate checklist of missing documentation, untriaged issues, or delayed releases.
    - Downloadable structured JSON health report artifact persisted in Kestra storage.
    - Zero external Python dependency requirements (runs on Python standard library with Process runner).

    ## Who it's for

    - **Open-Source Maintainers**: Ensure community health standards, track issue buildup, and maintain predictable release schedules.
    - **Engineering Managers & Tech Leads**: Gain cross-repository visibility into project health and maintenance debt.
    - **Platform & DevOps Teams**: Integrate repository quality gates and compliance audits into developer platform workflows.

    ## Why orchestrate this with Kestra

    Scripting repository audits with shell scripts or standalone Python tools creates fragile, unmonitored cron jobs that lack visibility, error handling, parallel execution, and state persistence. Orchestrating with Kestra provides:
    - **Declarative YAML Architecture**: Combine native GitHub plugin tasks, parallel flows, and HTTP calls in a readable blueprint.
    - **Built-in Concurrency**: Run multiple GitHub API queries simultaneously with `io.kestra.plugin.core.flow.Parallel`.
    - **Resilient Execution**: Automatic retries on rate limits or network glitches without bespoke retry code.
    - **Unified Storage & Lineage**: Persist and version every generated report artifact in internal storage with full execution history.
    - **Secure Credential Handling**: Seamless integration with Kestra Secrets (`{{ secret('GITHUB_TOKEN') }}`) preventing credential leaks.

    ## Prerequisites

    - A running Kestra instance (2.0 or newer).
    - Python 3.9+ installed on the host/worker environment for the `Process` task runner (uses standard library modules: `json`, `os`, `datetime`).
    - Outbound HTTPS network access to `api.github.com`.

    ### Secrets

    - `GITHUB_TOKEN`: GitHub Personal Access Token (classic with `repo` scope or fine-grained PAT with Repository permissions: Read-only access to Issues, Metadata, and Contents) to authenticate API requests and provide high rate limits.
    - `REPO_PULSE_WEBHOOK_KEY`: Secret alphanumeric token used to secure the on-demand webhook trigger URL.

    ## Quick start

    1. In the Kestra UI, navigate to **Namespaces** > `company.devtools` (or your preferred namespace) > **Secrets**, and add `GITHUB_TOKEN` and `REPO_PULSE_WEBHOOK_KEY`.
    2. Import or paste this blueprint YAML into the flow editor.
    3. Click **Execute** with target `owner` (e.g., `kestra-io`) and `repository` (e.g., `kestra`).
    4. View the real-time execution topology, inspect logs for the evaluated health breakdown, and download `health_report.json` from the `generate_final_report` task outputs.
    5. Keep the `daily_pulse` trigger enabled to run daily, or trigger via the webhook URL.

    ## How to extend

    - **Slack / Discord Notifications**: Add `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` or `io.kestra.plugin.notifications.discord.DiscordIncomingWebhook` inside the `else` branch of `conditional_decision` to page maintainers when attention is required.
    - **Automated Issue Filing**: Add `io.kestra.plugin.github.issues.Create` to automatically open a maintenance triage ticket in the target repository whenever health drops below threshold.
    - **Multi-Repository Batch Auditing**: Wrap this flow in a parent flow using `io.kestra.plugin.github.repositories.Search` and `io.kestra.plugin.core.flow.ForEachItem` to audit an entire GitHub organization.
    - **Data Warehouse Analytics**: Export the generated JSON report to BigQuery, Snowflake, or DuckDB for long-term health trend analysis across teams.

    ## Links

    - [Kestra GitHub Plugin Documentation](https://kestra.io/plugins/plugin-github)
    - [Kestra Parallel Flowable Documentation](https://kestra.io/docs/workflow-components/flowables/parallel)
    - [Kestra Python Script Task Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [GitHub REST API Documentation](https://docs.github.com/en/rest)
    - [GitHub Community Profile API](https://docs.github.com/en/rest/metrics/community)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - GitOps & Flow Sync
  ee: false
  demo: false
