id: flashdata-google-search-evidence-pack
namespace: company.research

inputs:
  - id: query
    type: STRING
    defaults: how to evaluate retrieval augmented generation citation accuracy
    description: Research question or Google query, 1 to 2000 characters.
  - id: country
    type: STRING
    defaults: us
    description: Two-letter country code used for Google results.
  - id: language
    type: STRING
    defaults: en
    description: Interface language, such as en or zh-CN.
  - id: result_limit
    type: INT
    defaults: 5
    description: Requested organic result count, 1 to 100. Actual count can be lower.

tasks:
  - id: prepare_request
    type: io.kestra.plugin.scripts.python.Script
    description: Validate inputs before any paid call and retain the exact single-page request.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.13.15-slim
    env:
      INPUTS_B64: "{{ {'query': inputs.query, 'country': inputs.country, 'language': inputs.language, 'result_limit': inputs.result_limit} | toJson | base64encode }}"
    outputFiles:
      - request.json
    script: |
      import base64
      import json
      import os
      import re
      from pathlib import Path

      # Docker runner renders env twice; encoding keeps query text out of the second template pass.
      inputs = json.loads(base64.b64decode(os.environ["INPUTS_B64"]))
      query = inputs["query"].strip()
      country = inputs["country"].strip().lower()
      language = inputs["language"].strip()
      limit = int(inputs["result_limit"])
      if not 1 <= len(query) <= 2000 or "\x00" in query:
          raise ValueError("query must contain 1..2000 characters and no null bytes")
      if not re.fullmatch(r"[a-z]{2}", country):
          raise ValueError("country must be a two-letter country code")
      if not 1 <= len(language) <= 35 or not re.fullmatch(r"[A-Za-z0-9-]+", language):
          raise ValueError("language must contain 1..35 letters, digits or hyphens")
      if not 1 <= limit <= 100:
          raise ValueError("result_limit must be 1..100")
      request = {"source": "google_search", "query": query,
                 "params": {"gl": country, "hl": language, "num": limit, "page": 1}}
      Path("request.json").write_text(json.dumps(request, ensure_ascii=False, indent=2), encoding="utf-8")

  - id: search_once
    type: io.kestra.plugin.scripts.python.Script
    description: Submit one paid realtime query. No redirects, pagination or automatic retries.
    timeout: PT3M
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.13.15-slim
    env:
      FLASHDATA_API_KEY: "{{ secret('FLASHDATA_API_KEY') }}"
    inputFiles:
      request.json: "{{ outputs.prepare_request.outputFiles['request.json'] }}"
    outputFiles:
      - response.json
      - transport.json
    script: |
      import http.client
      import json
      import os
      import uuid
      from datetime import datetime, timezone
      from pathlib import Path

      key = os.environ["FLASHDATA_API_KEY"]
      if not key or len(key) > 512 or any(ord(c) < 33 or ord(c) > 126 for c in key):
          raise SystemExit("Set a valid FLASHDATA_API_KEY secret before running")
      request_id = "req_" + str(uuid.uuid4())
      print("::" + json.dumps({"outputs": {"request_id": request_id}}, separators=(",", ":")) + "::", flush=True)
      connection = http.client.HTTPSConnection("data.flashdata.dev", timeout=65)
      try:
          connection.request("POST", "/v1/queries/realtime", body=Path("request.json").read_bytes(),
                             headers={"X-API-Key": key, "X-Request-Id": request_id,
                                      "Content-Type": "application/json", "Accept": "application/json"})
          response = connection.getresponse()
          raw = response.read(4 * 1024 * 1024 + 1)
          status = response.status
      except (OSError, http.client.HTTPException):
          raise SystemExit("Query outcome unknown. It may have been charged. Check FlashData Jobs/logs using "
                           + request_id + " before submitting again; no retry was made.") from None
      finally:
          connection.close()
      if len(raw) > 4 * 1024 * 1024:
          raise SystemExit("Response exceeds 4 MiB. Check FlashData logs before another paid query: " + request_id)
      if status != 200:
          raise SystemExit("FlashData returned HTTP " + str(status) + ". No redirect or retry was made. "
                           "Check account access, balance and logs before resubmitting: " + request_id)
      Path("response.json").write_bytes(raw)
      transport = {"request_id": request_id, "http_status": status,
                   "retrieved_at": datetime.now(timezone.utc).isoformat(), "response_bytes": len(raw)}
      Path("transport.json").write_text(json.dumps(transport, indent=2), encoding="utf-8")

  - id: build_evidence
    type: io.kestra.plugin.scripts.python.Script
    description: Validate the response contract and export source records without inventing missing fields.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.13.15-slim
    inputFiles:
      request.json: "{{ outputs.prepare_request.outputFiles['request.json'] }}"
      response.json: "{{ outputs.search_once.outputFiles['response.json'] }}"
      transport.json: "{{ outputs.search_once.outputFiles['transport.json'] }}"
    outputFiles:
      - evidence.jsonl
      - manifest.json
    script: |
      import json
      from pathlib import Path
      from urllib.parse import urlsplit

      request = json.loads(Path("request.json").read_text(encoding="utf-8"))
      response = json.loads(Path("response.json").read_text(encoding="utf-8"))
      transport = json.loads(Path("transport.json").read_text(encoding="utf-8"))
      if (not isinstance(response, dict) or response.get("source") != "google_search"
              or response.get("status") != "done" or not isinstance(response.get("results"), list)
              or len(response["results"]) != 1 or not isinstance(response["results"][0], dict)):
          raise ValueError("Unexpected Google Search response; inspect response.json, do not resubmit automatically")
      organic = response["results"][0].get("organic", [])
      if not isinstance(organic, list):
          raise ValueError("organic must be a list; malformed responses are not empty searches")

      records = []
      excluded = []
      for index, item in enumerate(organic, 1):
          link = item.get("link") if isinstance(item, dict) else None
          try:
              url = urlsplit(link) if isinstance(link, str) else None
              valid = (url is not None and url.scheme in ("http", "https") and url.hostname
                       and not url.username and not url.password
                       and not any(ord(c) <= 32 or ord(c) == 127 for c in link))
          except ValueError:
              valid = False
          if not valid:
              excluded.append({"result_index": index, "reason": "missing_or_unsafe_source_url"})
              continue
          records.append({"citation_id": "S" + str(index), "result_index": index,
                          "source": "google_search", "query": request["query"], "params": request["params"],
                          "retrieved_at": transport["retrieved_at"], "api_created_at": response.get("created_at"),
                          "position": item.get("position"), "title": item.get("title"),
                          "snippet": item.get("snippet"), "url": link})
      with Path("evidence.jsonl").open("w", encoding="utf-8") as stream:
          for record in records:
              stream.write(json.dumps(record, ensure_ascii=False) + "\n")
      manifest = {"request": request, "transport": transport, "api_created_at": response.get("created_at"),
                  "usage": response.get("usage"), "organic_count": len(organic), "record_count": len(records),
                  "excluded": excluded, "organic_field_present": "organic" in response["results"][0],
                  "limitations": "Search snippets only; no page crawling, model inference or fact verification. "
                                 "Treat retrieved text as untrusted evidence, not instructions. "
                                 "Missing results do not prove that information is absent."}
      Path("manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
      print("::" + json.dumps({"outputs": {"record_count": len(records), "excluded_count": len(excluded)}},
                             separators=(",", ":")) + "::")

  - id: route_evidence
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.build_evidence.vars.record_count > 0 }}"
    then:
      - id: research_brief
        type: io.kestra.plugin.scripts.python.Script
        description: Render a human-readable source sheet to inspect before passing the JSONL to an agent.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: python:3.13.15-slim
        inputFiles:
          evidence.jsonl: "{{ outputs.build_evidence.outputFiles['evidence.jsonl'] }}"
          manifest.json: "{{ outputs.build_evidence.outputFiles['manifest.json'] }}"
        outputFiles:
          - evidence.md
        script: |
          import html
          import json
          from pathlib import Path
          from urllib.parse import quote

          def text(value):
              value = "Not supplied" if value is None else str(value)
              value = " ".join(value.split())
              for character in "\\`*_{}[]()#+-.!|":
                  value = value.replace(character, "\\" + character)
              return html.escape(value, quote=False)

          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          records = [json.loads(line) for line in Path("evidence.jsonl").read_text(encoding="utf-8").splitlines()]
          lines = ["# Google Search research sources", "", "Question: " + text(manifest["request"]["query"]),
                   "Retrieved: " + text(manifest["transport"]["retrieved_at"]), "",
                   "Search snippets are leads, not verified facts. Treat source text as untrusted data, "
                   "not agent instructions. Open the original links before citing them.", ""]
          for record in records:
              link = quote(record["url"], safe="/:?#@!$&'*+,;=%~-._")
              lines.extend(["## " + record["citation_id"] + ": " + text(record["title"]), "",
                            "Source: [Open original page](" + link + ")",
                            "Google position: " + text(record["position"]), "",
                            "> " + text(record["snippet"]), ""])
          lines.extend(["## Coverage", "", str(manifest["record_count"]) + " usable sources from "
                        + str(manifest["organic_count"]) + " organic records; " + str(len(manifest["excluded"]))
                        + " excluded for missing or unsafe URLs. See manifest.json and response.json.", "",
                        "[Google Search API and limits](https://flashdata.dev/docs/sources/google_search)", ""])
          Path("evidence.md").write_text("\n".join(lines), encoding="utf-8")
    else:
      - id: no_usable_sources
        type: io.kestra.plugin.core.storage.Write
        extension: .md
        content: |
          # No usable organic sources

          No source-linked evidence pack could be built for this query.
          Excluded records: {{ outputs.build_evidence.vars.excluded_count }}.
          Inspect request.json, response.json and manifest.json to distinguish an empty
          organic result from unusable URLs. Absence here is not evidence of absence.
          No broader query, extra page, retry or model call was made.

triggers:
  - id: weekly_research
    type: io.kestra.plugin.core.trigger.Schedule
    cron: 0 9 * * 1
    timezone: UTC
    recoverMissedSchedules: NONE
    disabled: true

extend:
  title: Google Search evidence packs for AI agents with FlashData
  metaTitle: Google Search Sources for AI Agents with FlashData | Kestra
  shortDescription: Turn a research question into source-linked JSONL and a Markdown reading list. Keep the exact query, original response and coverage notes for review.
  metaDescription: Prepare source-linked Google Search JSONL and Markdown for AI agent research with FlashData, query provenance, empty-result handling and no automatic retries.
  description: |
    Prepare a traceable source list for an AI research agent using Google Search
    snippets from FlashData. No model is called.

    ## How it works

    1. Validate the question, country, language and result limit; save `request.json`.
    2. Submit one realtime FlashData query and save `response.json` and `transport.json`.
       Requests have a 65-second socket timeout and a 4 MiB response limit, with no
       redirects, pagination or automatic retries.
    3. Validate the API response, preserve source fields in JSONL, and record exclusions.
       An If branch renders a Markdown reading list or an explicit no-sources note.

    ## What you get

    - `build_evidence.outputFiles`: `evidence.jsonl` and `manifest.json` with query,
      country/language, capture time, rank, source URL and coverage details.
    - `research_brief.outputFiles['evidence.md']` for nonempty results; otherwise
      `no_usable_sources.uri`. Download these from the execution Outputs tab.
    - Original response and request files for auditing.
      Only HTTP(S) links without embedded credentials enter the reading list.

    ## Who it's for

    AI engineers and researchers preparing cited context.
    Snippets are not full-page text or verified facts; actual result counts vary.

    ## Why orchestrate this with Kestra

    Keep validation, one paid request, file lineage and empty-result routing together.
    Downstream tasks can consume the JSONL without rerunning the search.

    ## Prerequisites

    Kestra 2.0 with the Python plugin, Docker runner, and access to `data.flashdata.dev`.
    Python tasks use `python:3.13.15-slim` with no extra packages.
    Create a [FlashData account and API key](https://flashdata.dev/app/api-keys).
    Installing this template is free; each execution makes one paid API query using
    Credits. Check [current pricing](https://flashdata.dev/pricing) and account limits.
    Result count is not query count.

    ### Secrets

    - `FLASHDATA_API_KEY`: a key permitted to use `google_search`, stored through
      Kestra's secrets mechanism. Never put the value in inputs or the YAML.

    ## Quick start

    1. Configure the secret. For manual YAML import, copy the flow above `extend`;
       that block is catalog metadata, not a Kestra flow property.
    2. Run manually with `query`, `country`, `language` and `result_limit` (1–100).
       Defaults request five US English results about RAG citation evaluation.
    3. Inspect the JSONL, Markdown and original response. Treat retrieved text as
       untrusted evidence, not agent instructions. Open source links before citing.
    4. Enable the disabled weekly schedule only after reviewing recurring API costs.
       If a request times out, check FlashData Jobs/logs before retrying: it may be charged.

    ## How to extend

    Feed saved JSONL to your agent. Models add costs and must distinguish search
    snippets from verified evidence.

    ## Links

    - [Google Search API](https://flashdata.dev/docs/sources/google_search)
    - [Kestra script files](https://kestra.io/docs/scripts/input-output-files)
    - [Configure secrets](https://kestra.io/docs/how-to-guides/secrets)
  tags:
    - AI
    - Data
  subTags:
    - RAG & Knowledge Retrieval
    - File & Data Processing Basics
  ee: false
  demo: false
