id: step-ca-certificate-expiry-and-health-sentinel
namespace: company.security

description: |
  Infrastructure security sentinel that audits Smallstep step-ca certificate authority daemon
  health, extracts X.509 root certificate validity horizons via cryptographic probing,
  evaluates impending expiration windows through a Switch gate, dispatches actionable Slack
  alerts before mTLS outages occur, and persists compliance audit telemetry.

inputs:
  - id: stepca_url
    type: STRING
    displayName: "Smallstep CA URL"
    defaults: "https://localhost:9000"
    description: "Base URL for the Smallstep step-ca certificate authority daemon."

  - id: critical_days_threshold
    type: INT
    displayName: "Critical Expiry Threshold (Days)"
    defaults: 15
    description: "Days remaining before certificate expiration below which a critical Slack alert is raised."

  - id: warning_days_threshold
    type: INT
    displayName: "Warning Expiry Threshold (Days)"
    defaults: 45
    description: "Days remaining before certificate expiration below which an advisory warning is raised."

  - id: slack_channel
    type: STRING
    displayName: "Slack Alert Channel"
    defaults: "#security-pki"
    description: "Destination Slack channel for PKI authority health and certificate expiration alerts."

triggers:
  - id: scheduled_pki_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Executes automated PKI authority health and certificate validity audits every six hours. Shipped disabled by default for initial connection verification."
    cron: "0 */6 * * *"
    disabled: true

tasks:
  - id: probe_ca_health
    type: io.kestra.plugin.core.http.Request
    description: "Probes Smallstep step-ca daemon health endpoint to verify the certificate authority is operational and accepting requests."
    uri: "{{ inputs.stepca_url }}/health"
    method: GET
    options:
      allowFailed: false

  - id: probe_root_certificates
    type: io.kestra.plugin.scripts.python.Script
    description: "Retrieves the active root certificate bundle from the CA /roots endpoint, parses X.509 validity bounds, and computes days until expiration."
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install cryptography requests kestra
    env:
      STEPCA_URL: "{{ inputs.stepca_url }}"
      CRITICAL_DAYS: "{{ inputs.critical_days_threshold }}"
      WARNING_DAYS: "{{ inputs.warning_days_threshold }}"
    script: |
      import os
      import sys
      import datetime
      import requests
      from cryptography import x509
      from kestra import Kestra

      ca_url = os.environ.get("STEPCA_URL", "https://localhost:9000").rstrip("/")
      critical_days = int(os.environ.get("CRITICAL_DAYS", 15))
      warning_days = int(os.environ.get("WARNING_DAYS", 45))

      try:
          res = requests.get(f"{ca_url}/roots", timeout=10, verify=False)
          res.raise_for_status()
          roots_pem = res.text
      except Exception as e:
          print(f"Failed to fetch root certificates from {ca_url}: {e}", file=sys.stderr)
          sys.exit(1)

      certs = x509.load_pem_x509_certificates(roots_pem.encode("utf-8"))
      if not certs:
          print("No certificates found in roots bundle", file=sys.stderr)
          sys.exit(1)

      root_cert = certs[0]
      subject = root_cert.subject.rfc4514_string()
      issuer = root_cert.issuer.rfc4514_string()
      not_before = root_cert.not_valid_before_utc
      not_after = root_cert.not_valid_after_utc
      now = datetime.datetime.now(datetime.timezone.utc)
      days_remaining = max(0, (not_after - now).days)

      status = "HEALTHY"
      if days_remaining <= critical_days:
          status = "CRITICAL_EXPIRY_RISK"
      elif days_remaining <= warning_days:
          status = "EXPIRY_WARNING"

      Kestra.outputs({
          "subject": subject,
          "issuer": issuer,
          "not_before": not_before.isoformat(),
          "not_after": not_after.isoformat(),
          "days_remaining": days_remaining,
          "status": status,
          "serial_number": str(root_cert.serial_number)
      })

  - id: classify_certificate_health
    type: io.kestra.plugin.core.flow.Switch
    description: "Evaluates certificate expiration horizon and routes workflow into critical risk, warning advisory, or healthy state."
    value: "{{ outputs.probe_root_certificates.vars.status }}"
    cases:
      CRITICAL_EXPIRY_RISK:
        - id: notify_critical_expiration
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches high-priority Slack incident alert with exact certificate expiry date and rotation runbook."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": ":rotating_light: *CRITICAL PKI ALERT: Smallstep CA Certificate Expiration Risk*",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "CRITICAL PKI ALERT: Root CA Expiration Risk",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Authority URL:*\n`{{ inputs.stepca_url }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Status:*\n:fire: `CRITICAL EXPIRY RISK`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Days Remaining:*\n`{{ outputs.probe_root_certificates.vars.days_remaining }} days` (Limit: `{{ inputs.critical_days_threshold }}`)"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Expiration Timestamp:*\n`{{ outputs.probe_root_certificates.vars.not_after }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Certificate Subject:*\n`{{ outputs.probe_root_certificates.vars.subject }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Execution ID:*\n`{{ execution.id }}`"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Urgent Remediation Required:*\nRoot CA certificate expiration will invalidate all downstream mTLS tokens and leaf certificates across the cluster. Initiate root/intermediate CA key rotation via `step ca init` or renew active provisioner credentials immediately."
                  }
                }
              ]
            }

        - id: log_critical_pki_breach
          type: io.kestra.plugin.core.log.Log
          description: "Logs critical certificate expiration state in Kestra execution history."
          message: "CRITICAL PKI RISK: Smallstep CA at {{ inputs.stepca_url }} certificate expires in {{ outputs.probe_root_certificates.vars.days_remaining }} days (on {{ outputs.probe_root_certificates.vars.not_after }}). Subject: {{ outputs.probe_root_certificates.vars.subject }}."

      EXPIRY_WARNING:
        - id: notify_expiration_warning
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches advisory warning to Slack when certificate expiration horizon falls within the warning threshold."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": ":warning: *PKI ADVISORY: Impending CA Certificate Expiration*",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "PKI ADVISORY: Upcoming CA Certificate Renewal",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Authority URL:*\n`{{ inputs.stepca_url }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Days Remaining:*\n`{{ outputs.probe_root_certificates.vars.days_remaining }} days`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Expiration Date:*\n`{{ outputs.probe_root_certificates.vars.not_after }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Subject:*\n`{{ outputs.probe_root_certificates.vars.subject }}`"
                    }
                  ]
                }
              ]
            }

        - id: log_expiration_warning
          type: io.kestra.plugin.core.log.Log
          description: "Logs advisory certificate expiration warning in execution history."
          message: "PKI WARNING: Smallstep CA at {{ inputs.stepca_url }} certificate expires in {{ outputs.probe_root_certificates.vars.days_remaining }} days. Renewal recommended before critical threshold ({{ inputs.critical_days_threshold }} days)."

      HEALTHY:
        - id: log_healthy_certificate
          type: io.kestra.plugin.core.log.Log
          description: "Records healthy status when CA daemon is operational and certificate validity horizon is nominal."
          message: "PKI HEALTHY: Smallstep CA at {{ inputs.stepca_url }} daemon is healthy. Root certificate valid for {{ outputs.probe_root_certificates.vars.days_remaining }} days (expires {{ outputs.probe_root_certificates.vars.not_after }}). Subject: {{ outputs.probe_root_certificates.vars.subject }}."

  - id: finalize_pki_audit
    type: io.kestra.plugin.core.output.OutputValues
    description: "Publishes structured X.509 authority telemetry for audit logging, SLA dashboards, and compliance tracking."
    values:
      execution_id: "{{ execution.id }}"
      ca_url: "{{ inputs.stepca_url }}"
      subject: "{{ outputs.probe_root_certificates.vars.subject }}"
      issuer: "{{ outputs.probe_root_certificates.vars.issuer }}"
      not_before: "{{ outputs.probe_root_certificates.vars.not_before }}"
      not_after: "{{ outputs.probe_root_certificates.vars.not_after }}"
      days_remaining: "{{ outputs.probe_root_certificates.vars.days_remaining }}"
      serial_number: "{{ outputs.probe_root_certificates.vars.serial_number }}"
      classification: "{{ outputs.classify_certificate_health.value }}"
      daemon_status: "{{ fromJson(outputs.probe_ca_health.body).status ?? 'ok' }}"

errors:
  - id: notify_ca_outage
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alerts SRE team immediately if the Smallstep CA daemon is unreachable or returns HTTP errors."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": ":rotating_light: *SMALLSTEP CA DAEMON UNREACHABLE*\n*Target:* `{{ inputs.stepca_url }}`\n*Failure:* Sentinel was unable to reach the `/health` endpoint or the CA daemon has crashed.\n*Execution ID:* `{{ execution.id }}`"
      }

extend:
  title: Smallstep step-ca Certificate Expiry & Authority Health Sentinel
  metaTitle: Smallstep step-ca Certificate Expiry Sentinel | Kestra
  shortDescription: Audits Smallstep step-ca daemon health, monitors root X.509 certificate expiration horizons, and dispatches automated Slack alerts.
  metaDescription: Audit Smallstep step-ca daemon health, monitor root X.509 certificate expiration horizons, and dispatch automated Slack alerts before mTLS outages occur.
  description: |
    Smallstep `step-ca` is an open-source, automated private Certificate Authority (CA) used by DevOps and platform teams to issue mTLS identity certificates, manage internal Zero Trust PKI, and automate short-lived certificate lifecycles across Kubernetes clusters and microservices. However, if the CA daemon encounters an unhandled crash, or if the underlying root or intermediate X.509 certificates expire without renewal, all downstream service authentication, mTLS encryption handshakes, and automated certificate rotations fail simultaneously across the entire infrastructure.

    This blueprint provides an automated sentinel that periodically probes Smallstep `step-ca` daemon health, retrieves active root certificate chains over the public authority endpoint, calculates the exact days remaining until certificate expiration, classifies operational risk through a conditional Switch gate, dispatches context-rich Slack incident alerts, and exports structured PKI telemetry for security compliance auditing.

    ## How it works

    1. `scheduled_pki_audit` (`io.kestra.plugin.core.trigger.Schedule`) initiates automated surveillance every six hours. It is shipped disabled by default for initial connection verification.
    2. `probe_ca_health` (`io.kestra.plugin.core.http.Request`) invokes the Smallstep CA endpoint `GET /health` to confirm that the PKI daemon process is running and accepting client requests.
    3. `probe_root_certificates` (`io.kestra.plugin.scripts.python.Script` running inside Docker) fetches the active root certificate bundle from `GET /roots`, parses the X.509 validity boundaries using Python's `cryptography` library, and computes the exact days remaining until expiration against UTC timestamps.
    4. `classify_certificate_health` (`io.kestra.plugin.core.flow.Switch`) evaluates the calculated days remaining against team risk tolerances:
       - **`CRITICAL_EXPIRY_RISK`**: Triggered when days remaining falls below `critical_days_threshold` (default 15 days). Dispatches an urgent incident card to `#security-pki` via `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` containing the certificate subject, serial number, expiration timestamp, and CA rotation runbook guidance.
       - **`EXPIRY_WARNING`**: Triggered when validity falls below `warning_days_threshold` (default 45 days). Sends an advisory Slack message to schedule routine provisioner renewal.
       - **`HEALTHY`**: Logs nominal validity status via `io.kestra.plugin.core.log.Log` when certificates are well within operating parameters.
    5. `finalize_pki_audit` (`io.kestra.plugin.core.output.OutputValues`) publishes clean telemetry (subject, issuer, validity window, days remaining, daemon status) for compliance reporting and long-term monitoring dashboards.
    6. The global `errors` handler captures connection timeouts, unreachable endpoints, or crashed daemon states to alert the PKI operations team out-of-band.

    ## What you get

    - Early detection of impending root and intermediate CA expiration before microservice mTLS handshakes break.
    - Continuous verification of CA daemon uptime and HTTP endpoint availability.
    - Formatted Slack alert cards with exact expiration timestamps, subject identifiers, and actionable runbook steps.
    - Centralized audit records in Kestra to satisfy SOC 2, ISO 27001, and NIST Zero Trust cryptographic requirements.

    ## Who it's for

    - Platform Engineers and Site Reliability Engineers (SREs) operating internal PKI and Zero Trust service meshes.
    - Security Operations (SecOps) teams responsible for cryptographic key governance and certificate lifecycle auditing.
    - DevOps engineers running automated ACME or mTLS workloads with Smallstep `step-ca`.

    ## Why orchestrate this with Kestra

    Certificate Authority outages cause catastrophic ripple effects across distributed systems. Standalone monitoring scripts or cron tasks lack persistent execution histories, centralized audit logs, secret masking, and robust error recovery. Kestra provides declarative scheduling, containerized cryptographic parsing, conditional alerting logic, and enterprise collaboration integrations out of the box.

    ## Prerequisites

    - A running instance of Smallstep `step-ca`, reachable over HTTP or HTTPS. Smallstep publishes an official open-source Docker image (`smallstep/step-ca:latest`) requiring no paid license or commercial account.
    - An incoming Slack webhook configured for PKI alerts.
    - Docker enabled on Kestra workers to execute the Python cryptographic probe container.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to dispatch operational and security alerts.

    ## Quick start

    1. Start a local Smallstep CA container:
       ```bash
       docker run -d --name step-ca-sentinel -p 9000:9000 -e DOCKER_STEPCA_INIT_NAME="Internal PKI" -e DOCKER_STEPCA_INIT_DNS_NAMES="localhost" smallstep/step-ca:latest
       ```
    2. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    3. Import this blueprint into Kestra under namespace `company.security`.
    4. Click **Execute** with default parameters (`stepca_url: https://localhost:9000`) to confirm connectivity and view root certificate validity metrics.
    5. Enable `scheduled_pki_audit` to activate continuous six-hour PKI surveillance.

    ## How to extend

    - Add automated provisioner rotation: invoke the `step-cli` container task to execute `step ca renew` automatically when intermediate validity enters warning status.
    - Integrate with PagerDuty via `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert` for Sev-1 paging when root CA validity drops below 7 days.
    - Export certificate expiration metrics to Prometheus via `io.kestra.plugin.prometheus.PushGateway` for visualization on Grafana infrastructure dashboards.

    ## Links

    - [Smallstep step-ca Official Documentation](https://smallstep.com/docs/step-ca/)
    - [Smallstep step-ca GitHub Repository](https://github.com/smallstep/certificates)
    - [Smallstep Official Docker Hub Image](https://hub.docker.com/r/smallstep/step-ca)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false