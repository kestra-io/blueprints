id: github-code-scanning-alert-sentinel
namespace: company.team

description: Audits GitHub code scanning results to detect and escalate unmitigated critical security vulnerabilities.

inputs:
  - id: github_org
    type: STRING
    defaults: kestra-io
    description: GitHub organization or owner name.
  - id: github_repo
    type: STRING
    defaults: kestra
    description: Target repository to scan for code scanning alerts.

outputs:
  - id: critical_alert_count
    type: INT
    value: "{{ outputs.audit_security_alerts.vars.critical_alert_count }}"
  - id: alert_triggered
    type: BOOLEAN
    value: "{{ outputs.audit_security_alerts.vars.alert_triggered }}"

tasks:
  - id: audit_security_alerts
    type: io.kestra.plugin.scripts.python.Script
    description: Queries the GitHub code scanning API for critical open vulnerabilities.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      GITHUB_ORG: "{{ inputs.github_org }}"
      GITHUB_REPO: "{{ inputs.github_repo }}"
      GITHUB_TOKEN: "{{ secret('GITHUB_TOKEN') }}"
    outputFiles:
      - scan_summary.json
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      org = os.environ.get("GITHUB_ORG", "kestra-io")
      repo = os.environ.get("GITHUB_REPO", "kestra")
      token = os.environ.get("GITHUB_TOKEN", "")

      headers = {
          "Accept": "application/vnd.github.v3+json",
          "User-Agent": "Kestra-Code-Scanning-Sentinel"
      }
      if token:
          headers["Authorization"] = f"Bearer {token}"

      url = f"https://api.github.com/repos/{org}/{repo}/code-scanning/alerts?severity=critical&state=open"
      try:
          resp = requests.get(url, headers=headers, timeout=15)
          resp.raise_for_status()
          data = resp.json()
      except Exception as err:
          print(f"ERROR: Failed to query code scanning alerts: {err}", file=sys.stderr)
          sys.exit(1)

      alerts = []
      if isinstance(data, list):
          for a in data:
              alerts.append({
                  "number": a.get("number"),
                  "rule_id": a.get("rule", {}).get("id"),
                  "description": a.get("rule", {}).get("description"),
                  "path": a.get("most_recent_instance", {}).get("location", {}).get("path")
              })

      result = {
          "repo": f"{org}/{repo}",
          "critical_alert_count": len(alerts),
          "critical_alerts": alerts[:5],
          "alert_triggered": len(alerts) > 0
      }

      with open("scan_summary.json", "w", encoding="utf-8") as out:
          json.dump(result, out, indent=2)

      print(f"GitHub code scanning audit: {result}")
      Kestra.outputs(result)

  - id: evaluate_critical_alerts
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_security_alerts.vars.alert_triggered }}"
    then:
      - id: alert_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":shield: *Code Scanning Vulnerability Alert*: Discovered {{ outputs.audit_security_alerts.vars.critical_alert_count }} open critical CodeQL security vulnerabilities in `{{ inputs.github_org }}/{{ inputs.github_repo }}`."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": ":warning: *GitHub Scanning Sentinel Failure*: Failed to query code scanning alerts for `{{ inputs.github_org }}/{{ inputs.github_repo }}`."
      }

triggers:
  - id: daily_security_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 7 * * *"
    disabled: true

extend:
  metaDescription: "Audits GitHub code scanning results to detect and escalate unmitigated critical security vulnerabilities."
  metaTitle: GitHub CodeQL Code Scanning Critical Security Alert Sentinel with Kestra
  title: GitHub CodeQL Code Scanning Critical Security Alert Sentinel
  shortDescription: Audits GitHub code scanning results to detect and escalate unmitigated critical security vulnerabilities.
  description: |
    Audits open CodeQL static analysis findings and notifies security teams of critical severity vulnerabilities.
  tags:
    - Cloud
    - Business
  subTags:
    - Policy & Compliance
    - Monitoring & Alerting
  ee: false
  demo: false
