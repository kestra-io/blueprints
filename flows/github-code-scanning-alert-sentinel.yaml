id: github-code-scanning-alert-sentinel
namespace: company.security

inputs:
  - id: github_org
    type: STRING
    defaults: kestra-io
    description: GitHub organization or owner name.
  - id: github_repo
    type: STRING
    defaults: kestra
    description: Target repository to scan for code scanning alerts.

tasks:
  - id: audit_security_alerts
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - |
        curl -s -H "Authorization: Bearer {{ secret('GITHUB_TOKEN') }}"           -H "Accept: application/vnd.github.v3+json"           "https://api.github.com/repos/{{ inputs.github_org }}/{{ inputs.github_repo }}/code-scanning/alerts?severity=critical&state=open" > alerts.json
        python3 -c "
        import json
        with open('alerts.json') as f:
            data = json.load(f)
        alerts = []
        if isinstance(data, list):
            for a in data:
                alerts.append({
                    'number': a.get('number'),
                    'rule_id': a.get('rule', {}).get('id'),
                    'description': a.get('rule', {}).get('description'),
                    'path': a.get('most_recent_instance', {}).get('location', {}).get('path')
                })
        result = {
            'repo': '{{ inputs.github_org }}/{{ inputs.github_repo }}',
            'critical_alert_count': len(alerts),
            'critical_alerts': alerts[:5],
            'alert_triggered': len(alerts) > 0
        }
        with open('scan_summary.json', 'w') as out:
            json.dump(result, out)
        print('GitHub code scanning audit:', result)
        "
    outputFiles:
      - scan_summary.json

  - id: evaluate_critical_alerts
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.audit_security_alerts.outputFiles['scan_summary.json'])).alert_triggered }}"
    then:
      - id: alert_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":shield: *Code Scanning Vulnerability Alert*: Discovered {{ json(read(outputs.audit_security_alerts.outputFiles['scan_summary.json'])).critical_alert_count }} open critical CodeQL security vulnerabilities in `{{ inputs.github_org }}/{{ inputs.github_repo }}`."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *GitHub Scanning Sentinel Failure*: Failed to query code scanning alerts for `{{ inputs.github_org }}/{{ inputs.github_repo }}`."
      }

triggers:
  - id: daily_security_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 7 * * *"
    disabled: true

extend:
  title: GitHub CodeQL Code Scanning Critical Security Alert Sentinel
  shortDescription: Audits GitHub code scanning results to detect and escalate unmitigated critical security vulnerabilities.
  description: |
    ## How it works
    This workflow invokes the GitHub REST API to audit open CodeQL static analysis findings. It isolates vulnerabilities flagged with `critical` severity, extracts finding locations and rule classifications, and notifies AppSec teams to accelerate vulnerability remediation.

    ## What you get
    - Proactive visibility into code-level vulnerabilities before code hits production releases.
    - Automated detection of unaddressed static analysis security alerts.
    - Direct Slack notifications detailing rule identifiers and affected source files.

    ## Who it's for
    - Application security (AppSec) engineers and DevSecOps practitioners.
    - Engineering leads responsible for software supply chain integrity and code security.

    ## Why orchestrate this with Kestra
    Kestra coordinates security auditing flows seamlessly, keeping compliance and vulnerability scanning schedules consistent across entire microservice architectures.

    ## Prerequisites
    - GitHub Advanced Security or public repository with CodeQL scanning enabled.
    - A GitHub Personal Access Token with `security_events` scope.
    - Secrets `GITHUB_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Set `github_org` and `github_repo` parameters.
    3. Run manually to check open vulnerabilities.

    ## How to extend
    - Automate the creation of high-priority Jira security tickets directly from finding payloads.
    - Check Dependabot dependency alerts and secret scanning alerts concurrently.
    - Block downstream deployment pipelines if unresolved critical findings exist.

    ## Links
    - [GitHub Code Scanning API](https://docs.github.com/en/rest/code-scanning/code-scanning)
    - [Kestra GitHub Plugin Documentation](https://kestra.io/plugins/plugin-github)
  tags:
    - Cloud
    - Business
  subTags:
    - Governance & Compliance
    - Monitoring & Alerting
  ee: false
  demo: false
