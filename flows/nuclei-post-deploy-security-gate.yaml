id: nuclei-post-deploy-security-gate
namespace: company.team
description: |
  After a staging deploy, scan the running application with ProjectDiscovery
  Nuclei, compare the findings with the accepted-risk baseline kept in the KV
  store, and stop the release for a security sign-off when new findings at the
  chosen severities appear. Approving the sign-off accepts them into the
  baseline; rejecting it fails the release.

inputs:
  - id: target_url
    type: STRING
    defaults: "https://staging.example.com"
    displayName: "Target URL"
    description: "Base URL of the deployed application. Only scan systems you own or are authorized to test, never production without approval."
  - id: tags
    type: STRING
    defaults: "misconfig,exposure,headers,cve,default-login"
    displayName: "Template Tags"
    description: "Comma-separated Nuclei template tags to run."
  - id: block_on
    type: STRING
    defaults: "critical,high,medium"
    displayName: "Blocking Severities"
    description: "New findings at these severities (critical, high, medium, low, info) require a security sign-off before the release continues."
  - id: app
    type: STRING
    defaults: "shop_api"
    displayName: "Application Key"
    description: "Lowercase key for the accepted-risk baseline in the KV store (`nuclei_baseline_<app>`)."

triggers:
  - id: after_staging_deploy
    type: io.kestra.plugin.core.trigger.Flow
    description: Scan every time the staging deploy flow succeeds. Shipped disabled; point it at your own deploy flow and enable it after a manual run.
    disabled: true
    dependsOn:
      - namespace: company.team
        flowId: deploy_staging
        states: [SUCCESS]

tasks:
  - id: scan
    type: io.kestra.plugin.scripts.shell.Commands
    description: Run Nuclei 3.11.1 (official image) against the target with the chosen tags, rate-limited, writing one JSON line per finding. The exit code is captured so the findings are always kept.
    containerImage: projectdiscovery/nuclei:v3.11.1
    commands:
      - >-
        rc=0; nuclei -u '{{ inputs.target_url }}' -tags '{{ inputs.tags }}'
        -severity info,low,medium,high,critical -jsonl -o findings.jsonl
        -rate-limit 50 -timeout 10 -silent -no-color
        || rc=$?; touch findings.jsonl; echo nuclei exit code $rc
    outputFiles:
      - findings.jsonl
    timeout: PT45M

  - id: compare_with_baseline
    type: io.kestra.plugin.scripts.python.Script
    description: Turn every finding into a stable fingerprint (template, matcher, matched URL), split them into accepted (already in the KV baseline) and new, count by severity, and decide whether the new ones include a blocking severity.
    containerImage: python:3.12-slim
    inputFiles:
      findings.jsonl: "{{ outputs.scan.outputFiles['findings.jsonl'] }}"
      baseline.json: "{{ kv('nuclei_baseline_' ~ inputs.app, errorOnMissing=false) ?? '[]' }}"
    outputFiles:
      - fingerprints.json
    script: |
      import collections, json

      blocking_levels = {s.strip().lower() for s in "{{ inputs.block_on }}".split(",") if s.strip()}
      accepted = set(json.load(open("baseline.json", encoding="utf-8")) or [])
      findings = [json.loads(line) for line in open("findings.jsonl", encoding="utf-8") if line.strip()]

      def fingerprint(f):
          return f"{f.get('template-id')}|{f.get('matcher-name', '')}|{f.get('matched-at')}"

      by_sev, new, lines = collections.Counter(), [], []
      for f in findings:
          sev = f.get("info", {}).get("severity", "unknown")
          by_sev[sev] += 1
          fp = fingerprint(f)
          if fp not in accepted:
              new.append((sev, fp, f))
      order = ["critical", "high", "medium", "low", "info", "unknown"]
      new.sort(key=lambda n: order.index(n[0]) if n[0] in order else 9)
      blocking = [n for n in new if n[0] in blocking_levels]
      for sev, fp, f in new[:25]:
          name = f.get("info", {}).get("name", f.get("template-id"))
          matcher = f" ({f['matcher-name']})" if f.get("matcher-name") else ""
          lines.append(f"[{sev}] {name}{matcher} at {f.get('matched-at')}")
      json.dump(sorted(accepted | {fingerprint(f) for f in findings}), open("fingerprints.json", "w", encoding="utf-8"))
      print("::" + json.dumps({"outputs": {
          "total": len(findings), "by_severity": dict(by_sev), "accepted": len(findings) - len(new),
          "new": len(new), "blocking": len(blocking), "new_lines": lines,
      }}) + "::")

  - id: log_findings
    type: io.kestra.plugin.core.log.Log
    description: Log the totals and every new finding, most severe first.
    message: |
      Nuclei gate for {{ inputs.target_url }}: {{ outputs.compare_with_baseline.vars.total }} finding(s) {{ outputs.compare_with_baseline.vars.by_severity }}, {{ outputs.compare_with_baseline.vars.accepted }} already accepted, {{ outputs.compare_with_baseline.vars.new }} new, {{ outputs.compare_with_baseline.vars.blocking }} new at {{ inputs.block_on }}.
      {% for line in outputs.compare_with_baseline.vars.new_lines %}- {{ line }}
      {% endfor %}

  - id: gate
    type: io.kestra.plugin.core.flow.If
    description: When new findings reach a blocking severity, pause the release for a security sign-off; otherwise continue.
    condition: "{{ outputs.compare_with_baseline.vars.blocking > 0 }}"
    then:
      - id: security_signoff
        type: io.kestra.plugin.core.flow.Pause
        description: Wait up to 24 hours for a security reviewer. If nobody answers, the release fails (deny by default).
        pauseDuration: PT24H
        behavior: FAIL
        onResume:
          - id: accept
            type: BOOL
            defaults: false
            description: Accept these findings as known risk (they are added to the baseline) and let the release continue?
          - id: reason
            type: STRING
            defaults: "not reviewed"
            description: Why the findings are accepted or rejected (kept in the execution history).

      - id: apply_decision
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.security_signoff.onResume.accept }}"
        then:
          - id: accept_into_baseline
            type: io.kestra.plugin.core.kv.Set
            description: Record every current finding as accepted, so the next scans only flag what is new.
            key: "nuclei_baseline_{{ inputs.app }}"
            value: "{{ read(outputs.compare_with_baseline.outputFiles['fingerprints.json']) }}"
            kvType: JSON
          - id: log_accepted
            type: io.kestra.plugin.core.log.Log
            message: "Security sign-off: {{ outputs.compare_with_baseline.vars.blocking }} new finding(s) accepted ({{ outputs.security_signoff.onResume.reason }}); baseline updated, release continues."
        else:
          - id: block_release
            type: io.kestra.plugin.core.execution.Fail
            errorMessage: "Release blocked by security review: {{ outputs.compare_with_baseline.vars.blocking }} new finding(s) at {{ inputs.block_on }} on {{ inputs.target_url }} ({{ outputs.security_signoff.onResume.reason }})."
    else:
      - id: log_clear
        type: io.kestra.plugin.core.log.Log
        message: "Nuclei gate clear for {{ inputs.target_url }}: no new finding at {{ inputs.block_on }}."

outputs:
  - id: new_findings
    type: INT
    value: "{{ outputs.compare_with_baseline.vars.new }}"
  - id: findings
    type: FILE
    value: "{{ outputs.scan.outputFiles['findings.jsonl'] }}"

extend:
  title: "Nuclei Post-Deploy Security Gate with Sign-Off and Accepted-Risk Baseline"
  shortDescription: Scan every staging deploy with ProjectDiscovery Nuclei, compare findings with an accepted-risk baseline in the KV store, and pause the release for a security sign-off when new findings appear.
  metaTitle: Nuclei Post-Deploy Security Gate with Approval | Kestra
  metaDescription: "Scan each staging deploy with Nuclei, ignore accepted risks via a KV baseline, and pause the release for security sign-off on new findings."
  description: |
    Dynamic scanners find what code review misses: a debug endpoint left exposed, missing security headers, a default login, a known CVE in a component. Run once, though, a scanner buries the team in the same findings every time, and nobody owns the decision to ship anyway. This blueprint runs [ProjectDiscovery Nuclei](https://github.com/projectdiscovery/nuclei) against every staging deploy, separates new findings from the ones already accepted, and turns new findings into an explicit security sign-off with Kestra's `Pause` task: accept and the release continues with the baseline updated, reject (or let it time out) and the release fails.

    ## How it works

    1. `after_staging_deploy` (`io.kestra.plugin.core.trigger.Flow`) starts the gate when `deploy_staging` succeeds. It ships `disabled: true`.
    2. `scan` (`io.kestra.plugin.scripts.shell.Commands`) runs the official `projectdiscovery/nuclei:v3.11.1` image with the chosen `tags`, rate-limited, writing one JSON line per finding. The exit code is captured so `findings.jsonl` is always kept.
    3. `compare_with_baseline` (`io.kestra.plugin.scripts.python.Script`) fingerprints every finding (template, matcher, matched URL), reads the accepted fingerprints from `nuclei_baseline_<app>` with `kv()`, and counts the new findings and the new ones at the `block_on` severities.
    4. `log_findings` logs the totals and each new finding, most severe first.
    5. `gate` (`io.kestra.plugin.core.flow.If`): with no new blocking findings it logs a clear result. Otherwise `security_signoff` (`io.kestra.plugin.core.flow.Pause`) waits up to 24 hours with two resume inputs, `accept` and `reason`. Accepting runs `accept_into_baseline` (`io.kestra.plugin.core.kv.Set`) so the same findings never block again; rejecting runs `block_release` (`io.kestra.plugin.core.execution.Fail`). An unanswered pause fails the release (deny by default).

    ## What you get

    - A security scan on every staging deploy with no manual step.
    - Only new findings block; accepted risks are remembered per application in the KV store.
    - A recorded human decision (who resumed, accept or reject, and why) in the execution history for every release that needed one.
    - The raw `findings.jsonl` and the new-finding count as flow outputs.

    ## Who it's for

    - Application security and platform teams that own the release gates.
    - Engineering teams that want security checks between staging and production without blocking on known, accepted risks.

    ## Why orchestrate this with Kestra

    A scanner in a CI job either fails every build or gets ignored. Kestra links the scan to the real deploy through a Flow trigger, keeps the accepted-risk state in the KV store, and uses `Pause` with resume inputs for a real, auditable approval step with a timeout, so the release waits for a decision instead of a log nobody reads.

    ## Prerequisites

    - A staging or preview environment you own and are authorized to scan, reachable from the worker.
    - A Kestra worker that can run containers (Docker or Kubernetes task runner) and pull `projectdiscovery/nuclei` and `python:3.12-slim`. Nuclei downloads its community templates on the first run.

    ### Secrets

    - None for a public staging URL. For an authenticated app, add a header with `-H` in `scan` from a secret, for example a bearer token kept as `STAGING_SCAN_TOKEN`.

    ## Quick start

    1. Set `target_url`, `app` and the `tags` you want, and keep `block_on` at `critical,high,medium` to start.
    2. Execute the flow. If new blocking findings appear, open the paused execution, review `log_findings` and resume with `accept` true or false and a `reason`.
    3. Execute again: accepted findings no longer block, only new ones do.
    4. Point `after_staging_deploy` at your deploy flow and enable it.

    ## How to extend

    - Notify the security channel from the `then` branch before the pause, with a link to the execution.
    - Run your own custom templates next to the community ones for app-specific checks.
    - Expire accepted fingerprints after 90 days by storing a timestamp with each entry.
    - Open a ticket for every accepted finding with the issue-tracker plugins.

    ## Links

    - [Nuclei documentation](https://docs.projectdiscovery.io/tools/nuclei/overview)
    - [Nuclei templates](https://github.com/projectdiscovery/nuclei-templates)
    - [Kestra Pause task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.pause)
    - [Kestra Flow trigger](https://kestra.io/plugins/core/triggers/io.kestra.plugin.core.trigger.flow)
    - [Kestra KV store](https://kestra.io/docs/concepts/kv-store)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Approval Gates
  ee: false
  demo: false
