id: redis-connected-clients-spike-sentinel
namespace: company.cache
description: |
  Monitors Redis connected clients and connection pool exhaustion against maxclients safety thresholds,
  preventing cascading application connection starvation.
inputs:
  - id: redis_uri
    type: STRING
    displayName: Redis Connection URI
    defaults: redis://redis-master.internal:6379
  - id: max_clients_threshold
    type: INT
    displayName: Max Connected Clients Warning Threshold
    defaults: 8000

triggers:
  - id: periodic_redis_connection_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true

tasks:
  - id: inspect_redis_connections
    type: io.kestra.plugin.scripts.shell.Commands
    description: Connects to Redis via redis-cli to extract INFO clients telemetry
    runner: PROCESS
    env:
      REDIS_URI: "{{ inputs.redis_uri }}"
      REDIS_AUTH: "{{ secret('REDIS_PASSWORD') }}"
    commands:
      - |
        INFO_OUTPUT=$(redis-cli -u "$REDIS_URI" -a "$REDIS_AUTH" --no-auth-warning INFO clients)
        CONNECTED=$(echo "$INFO_OUTPUT" | grep "connected_clients:" | cut -d':' -f2 | tr -d '\r')
        BLOCKED=$(echo "$INFO_OUTPUT" | grep "blocked_clients:" | cut -d':' -f2 | tr -d '\r')
        
        echo "Connected clients: $CONNECTED, Blocked clients: $BLOCKED"
        echo "::{\"outputs\":{\"connected_clients\": ${CONNECTED:-0}, \"blocked_clients\": ${BLOCKED:-0}}}::"

  - id: evaluate_connection_capacity
    type: io.kestra.plugin.core.flow.If
    description: Checks if connected clients exceed safety threshold
    condition: "{{ outputs.inspect_redis_connections.vars.connected_clients >= inputs.max_clients_threshold }}"
    then:
      - id: alert_redis_connection_spike
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts infrastructure team on Slack
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": "🚨 *Redis Connected Clients Spike Detected*\n*Redis Endpoint:* `{{ inputs.redis_uri }}`\n*Connected Clients:* *{{ outputs.inspect_redis_connections.vars.connected_clients }}* (Threshold: `{{ inputs.max_clients_threshold }}`)\n*Blocked Clients:* *{{ outputs.inspect_redis_connections.vars.blocked_clients }}*\n\nReview application connection pool configuration to avoid client rejection errors."
          }
    else:
      - id: log_capacity_healthy
        type: io.kestra.plugin.core.log.Log
        message: "Redis connection pool on {{ inputs.redis_uri }} is healthy: {{ outputs.inspect_redis_connections.vars.connected_clients }} connected clients."

errors:
  - id: alert_audit_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts Slack on connection check failure
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "⚠️ *Redis Connection Sentinel Failed* during execution `{{ execution.id }}` on endpoint `{{ inputs.redis_uri }}`."
      }

extend:
  title: Redis Connected Clients Spike and Pool Saturation Sentinel
  shortDescription: Continuously monitor Redis connected and blocked clients against maxclients thresholds to prevent client starvation.
  metaTitle: Redis Connected Clients Sentinel with Kestra
  metaDescription: Monitor Redis connected clients with Kestra. Track INFO clients metrics and alert on connection spikes before pool exhaustion.
  description: |
    Redis servers enforce a maximum connection capacity governed by `maxclients` (commonly 10,000). When application microservices experience connection leaks, missing pool teardowns, or traffic spikes, connected client counts surge rapidly. Once the ceiling is breached, Redis immediately rejects new connections with `ERR max number of clients reached`, causing widespread application outages.

    This blueprint regularly queries Redis server metrics via `INFO clients`, extracts live connected and blocked client counts, evaluates them against configurable warning margins, and dispatches real-time alerts to operations teams before limits are exhausted.

    ## How it works

    1. `periodic_redis_connection_check` triggers on a 5-minute schedule.
    2. `inspect_redis_connections` queries the Redis instance for `INFO clients` to extract `connected_clients` and `blocked_clients`.
    3. `evaluate_connection_capacity` checks if connected clients exceed the configured threshold.
    4. If breached, `alert_redis_connection_spike` sends a rich diagnostic alert to Slack.
    5. If within limits, `log_capacity_healthy` logs green status.
    6. `errors` block catches connection or timeout failures.

    ## What you get

    - Early warning of application connection leaks before `maxclients` rejection.
    - Visibility into blocked client counts (e.g. `BLPOP` starvation).
    - Formatted Slack alert payloads with endpoint and metric details.

    ## Who it's for

    - Platform Engineers and SREs maintaining Redis caching tiers.
    - Backend developers optimizing microservice connection pools.
    - DevOps engineers operating Redis Cluster or Sentinel deployments.

    ## Why orchestrate this with Kestra

    Kestra provides an auditable, lightweight automation workflow that eliminates the need for separate standalone monitoring probes while providing flexible alerting destinations.

    ## Prerequisites

    - A running Redis 6.x/7.x instance.
    - Network connectivity from the Kestra runner to Redis.
    - A Slack incoming webhook URL.

    ### Secrets

    - `REDIS_PASSWORD`: Password for authenticating to Redis.
    - `SLACK_WEBHOOK`: Incoming Webhook URL for Slack alerts.

    ## Inputs

    - `redis_uri`: Connection URI (e.g. `redis://redis-master.internal:6379`).
    - `max_clients_threshold`: Client count threshold before alerting (default: 8000).

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Configure the `REDIS_PASSWORD` and `SLACK_WEBHOOK` secrets.
    3. Run manually to test connectivity.
    4. Enable the schedule trigger for continuous sentinel monitoring.

    ## How to extend

    - Add an automated task to dynamically increase `maxclients` via `CONFIG SET maxclients`.
    - Route critical alerts to PagerDuty or OpsGenie.

    ## Links

    - [Redis Clients Documentation](https://redis.io/docs/management/optimization/clients/)
    - [Kestra Redis Plugin](https://kestra.io/plugins/plugin-redis)
  tags:
    - Infrastructure
    - Core
  subTags:
    - Cache Monitoring
  ee: false
  demo: false
