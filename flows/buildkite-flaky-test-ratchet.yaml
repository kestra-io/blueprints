id: buildkite-flaky-test-ratchet
namespace: company.team
description: |
  Watch a Buildkite pipeline for steps that swing between pass and fail, compare the
  recent run set against the previous one, and ratchet newly flaky steps open as a
  GitHub issue with a Slack quarantine suggestion.

triggers:
  - id: daily_ratchet
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run the ratchet once a day. Shipped disabled so the first run is always the manual one.
    cron: "0 6 * * *"
    disabled: true

  - id: on_build_finished
    type: io.kestra.plugin.core.trigger.Webhook
    description: Buildkite posts here on build finished, so the ratchet also runs the moment a build settles.
    key: "{{ secret('BUILDKITE_WEBHOOK_KEY') }}"

inputs:
  - id: organization
    type: STRING
    defaults: your-buildkite-org
    description: Buildkite organization slug, used in the builds and the test analytics API paths.
  - id: pipeline
    type: STRING
    defaults: your-pipeline
    description: Buildkite pipeline slug watched for step level pass and fail variance.
  - id: github_repository
    type: STRING
    defaults: your-org/your-repo
    description: GitHub repository in owner slash repo form where the ratchet issue is opened.

tasks:
  # --- 1. collect the evidence ---
  - id: fetch_builds
    type: io.kestra.plugin.core.http.Request
    description: Pull the last 40 builds of the pipeline, newest first, authenticated with the Buildkite API token.
    uri: "https://api.buildkite.com/v2/organizations/{{ inputs.organization }}/pipelines/{{ inputs.pipeline }}/builds?per_page=40"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('BUILDKITE_TOKEN') }}"
      Accept: application/json

  - id: fetch_test_analytics
    type: io.kestra.plugin.core.http.Request
    description: Pull Test Engine records for the newest build. Failure here is tolerated so the step level check still runs.
    uri: "https://api.buildkite.com/v2/analytics/organizations/{{ inputs.organization }}/builds/{{ outputs.fetch_builds.body | jq('.[0].id') | first }}/tests"
    method: GET
    allowFailure: true
    headers:
      Authorization: "Bearer {{ secret('BUILDKITE_TOKEN') }}"
      Accept: application/json

  # --- 2. analyse the two windows ---
  - id: analyze_flakes
    type: io.kestra.plugin.scripts.python.Script
    description: Split the finished builds into a recent window and a previous window, then emit the ratchet verdict through the outputs protocol.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    inputFiles:
      builds.json: "{{ outputs.fetch_builds.body }}"
      tests.json: "{{ outputs.fetch_test_analytics is defined ? (outputs.fetch_test_analytics.body ?? '[]') : '[]' }}"
    script: |
      import json

      WINDOW = 10
      PASSED = "passed"
      FAILED = "failed"
      FINISHED = (PASSED, FAILED)

      def read_json(path, default):
          try:
              handle = open(path)
          except OSError:
              return default
          with handle:
              raw = handle.read().strip()
          if not raw:
              return default
          try:
              data = json.loads(raw)
          except ValueError:
              return default
          if isinstance(data, str):
              try:
                  data = json.loads(data)
              except ValueError:
                  return default
          return data

      def finished(builds):
          if not isinstance(builds, list):
              return []
          keep = []
          for build in builds:
              if not isinstance(build, dict):
                  continue
              if build.get("state") not in FINISHED:
                  continue
              jobs = build.get("jobs")
              if isinstance(jobs, list) and jobs:
                  keep.append(build)
          return keep

      def step_counts(builds):
          counts = {}
          for build in finished(builds):
              for job in build.get("jobs") or []:
                  if not isinstance(job, dict):
                      continue
                  name = job.get("name")
                  state = job.get("state")
                  if not name or state not in FINISHED:
                      continue
                  bucket = counts.setdefault(name, {PASSED: 0, FAILED: 0})
                  bucket[state] += 1
          return counts

      def flaky_steps(counts):
          return sorted(
              name for name, bucket in counts.items()
              if bucket[PASSED] > 0 and bucket[FAILED] > 0
          )

      def step_rate(counts, name):
          bucket = counts[name]
          total = bucket[PASSED] + bucket[FAILED]
          if total == 0:
              return 0.0
          return round(100.0 * bucket[FAILED] / total, 1)

      def worst_step(counts):
          name, rate = "none", 0.0
          for candidate in sorted(counts):
              current = step_rate(counts, candidate)
              if current > rate:
                  name, rate = candidate, current
          return name, rate

      def window_share(counts):
          failed = sum(bucket[FAILED] for bucket in counts.values())
          total = sum(bucket[PASSED] + bucket[FAILED] for bucket in counts.values())
          if total == 0:
              return 0.0
          return round(100.0 * failed / total, 1)

      def quarantine_candidates(tests):
          if not isinstance(tests, list):
              return []
          names = set()
          for test in tests:
              if not isinstance(test, dict):
                  continue
              name = test.get("name")
              if not name:
                  continue
              labels = [str(label).lower() for label in (test.get("labels") or [])]
              results = test.get("executions_count_by_result") or {}
              passed = results.get(PASSED) or 0
              failed = results.get(FAILED) or 0
              if "flaky" in labels or (passed > 0 and failed > 0):
                  names.add(name)
          return sorted(names)

      def analyze(recent_builds, baseline_builds, tests):
          recent = finished(recent_builds)
          baseline = finished(baseline_builds)
          recent_counts = step_counts(recent)
          baseline_counts = step_counts(baseline)
          newly_flaky = sorted(
              set(flaky_steps(recent_counts)) - set(flaky_steps(baseline_counts))
          )
          worst_name, worst_rate = worst_step(recent_counts)
          _, baseline_rate = worst_step(baseline_counts)
          rate_worsened = worst_rate > baseline_rate
          quarantine = quarantine_candidates(tests)
          escalate = bool(newly_flaky) or rate_worsened
          verdict = "RATCHET" if escalate else "STABLE"
          step_lines = [
              "- `%s` : %.1f%% failed (%d of %d builds)" % (
                  name,
                  step_rate(recent_counts, name),
                  recent_counts[name][FAILED],
                  recent_counts[name][PASSED] + recent_counts[name][FAILED],
              )
              for name in newly_flaky
          ]
          test_lines = ["- `%s`" % name for name in quarantine]
          summary = "%s: %d newly flaky of %d tracked steps, worst %s at %.1f%% failed" % (
              verdict,
              len(newly_flaky),
              len(recent_counts),
              worst_name,
              worst_rate,
          )
          return {
              "verdict": verdict,
              "new_flake_count": len(newly_flaky),
              "newly_flaky": newly_flaky,
              "newly_flaky_text": ", ".join(newly_flaky) or "none",
              "newly_flaky_md": "\n".join(step_lines) or "- none",
              "worst_step": worst_name,
              "worst_rate": "%.1f%%" % worst_rate,
              "baseline_worst_rate": "%.1f%%" % baseline_rate,
              "rate_worsened": rate_worsened,
              "recent_rate": "%.1f%%" % window_share(recent_counts),
              "baseline_rate": "%.1f%%" % window_share(baseline_counts),
              "quarantine_candidates": quarantine,
              "quarantine_text": ", ".join(quarantine) or "none",
              "quarantine_md": "\n".join(test_lines) or "- none",
              "builds_analyzed": len(recent),
              "baseline_builds": len(baseline),
              "steps_tracked": len(recent_counts),
              "summary": summary,
          }

      builds = read_json("builds.json", [])
      tests = read_json("tests.json", [])
      ordered = finished(builds)
      result = analyze(ordered[:WINDOW], ordered[WINDOW:2 * WINDOW], tests)
      print("::" + json.dumps({"outputs": result}) + "::")
      print(result["summary"])

  # --- 3. ratchet gate ---
  - id: ratchet_gate
    type: io.kestra.plugin.core.flow.If
    description: Escalate only when a step is newly flaky or the worst failed share got worse than in the previous window.
    condition: "{{ outputs.analyze_flakes.vars.new_flake_count > 0 or outputs.analyze_flakes.vars.rate_worsened }}"
    then:
      - id: open_ratchet_issue
        type: io.kestra.plugin.github.issues.Create
        description: Open one issue listing the newly flaky steps, their failed shares, and the quarantine candidates.
        jwtToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.github_repository }}"
        title: "Flaky steps detected in {{ inputs.pipeline }} by the Kestra ratchet"
        body: |
          ## Newly flaky steps

          Pipeline `{{ inputs.organization }}/{{ inputs.pipeline }}` shows **{{ outputs.analyze_flakes.vars.new_flake_count }} newly flaky step(s)** against the previous run set.

          {{ outputs.analyze_flakes.vars.newly_flaky_md }}

          ### Rates

          - Worst step now `{{ outputs.analyze_flakes.vars.worst_step }}` at {{ outputs.analyze_flakes.vars.worst_rate }} failed, against {{ outputs.analyze_flakes.vars.baseline_worst_rate }} in the previous window.
          - Overall failed share {{ outputs.analyze_flakes.vars.recent_rate }} now, {{ outputs.analyze_flakes.vars.baseline_rate }} before.
          - Builds analysed {{ outputs.analyze_flakes.vars.builds_analyzed }} recent and {{ outputs.analyze_flakes.vars.baseline_builds }} previous, tracking {{ outputs.analyze_flakes.vars.steps_tracked }} distinct steps.

          ### Quarantine suggestion

          {{ outputs.analyze_flakes.vars.quarantine_md }}

          Fix or quarantine every step listed above, then close this issue. The ratchet only reopens for a step that is newly flaky or whose failed share got worse, so a step that stays flaky does not keep generating issues.

          Execution {{ execution.id }}.
        labels:
          - flaky-tests
          - quarantine

      - id: quarantine_hint
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post the quarantine suggestion so the fix or quarantine decision starts immediately.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "Flake ratchet OPENED for {{ inputs.pipeline }} ({{ inputs.organization }}): {{ outputs.analyze_flakes.vars.new_flake_count }} newly flaky step(s) - {{ outputs.analyze_flakes.vars.newly_flaky_text }}. Worst {{ outputs.analyze_flakes.vars.worst_step }} at {{ outputs.analyze_flakes.vars.worst_rate }} failed, previous window {{ outputs.analyze_flakes.vars.baseline_worst_rate }}. Quarantine suggestion - {{ outputs.analyze_flakes.vars.quarantine_text }}. Issue opened in {{ inputs.github_repository }}. Execution {{ execution.id }}."
          }

    else:
      - id: log_stable
        type: io.kestra.plugin.core.log.Log
        description: Record the clean verdict so the execution history proves the ratchet ran and found nothing new.
        message: "STABLE for {{ inputs.pipeline }}: no newly flaky step and no worse failed share across {{ outputs.analyze_flakes.vars.builds_analyzed }} recent builds."

errors:
  - id: slack_alert
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the API call or the analysis itself breaks, because a dead ratchet looks exactly like a clean pipeline.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "FAILED {{ flow.id }} run {{ execution.id }} : the Buildkite flake ratchet could not run for {{ inputs.pipeline }}. Check the BUILDKITE_TOKEN secret and Python on the worker."
      }

outputs:
  - id: verdict
    type: STRING
    description: RATCHET when a step is newly flaky or the worst failed share got worse, otherwise STABLE.
    value: "{{ outputs.analyze_flakes.vars.verdict }}"
  - id: newly_flaky
    type: JSON
    description: Steps that swing pass to fail in the recent window but were clean in the previous one.
    value: "{{ outputs.analyze_flakes.vars.newly_flaky | toJson }}"
  - id: worst_rate
    type: STRING
    description: Highest per-step failed share in the recent window, for example 40.0%.
    value: "{{ outputs.analyze_flakes.vars.worst_rate }}"
  - id: new_flake_count
    type: INT
    description: How many steps crossed into flaky since the previous run set, for example 2.
    value: "{{ outputs.analyze_flakes.vars.new_flake_count }}"

extend:
  title: Detect Newly Flaky Buildkite Test Steps and Ratchet Them Open as Issues
  metaTitle: Flaky Test Ratchet for Buildkite with Kestra
  shortDescription: Pull recent Buildkite builds and test analytics, detect steps that swing pass to fail, and ratchet newly flaky steps into a GitHub issue plus a Slack quarantine suggestion.
  metaDescription: Detect Buildkite steps that swing pass to fail, then ratchet newly flaky tests open as a GitHub issue with a Slack quarantine suggestion.
  description: |
    Flaky tests are expensive because they hide real regressions behind noise, and most teams only notice them when a release slips. This blueprint turns flake detection into a ratchet: it reads the recent Buildkite run set, compares it with the previous one, and escalates only when a step is newly flaky or when its failed share got worse. Every step it raises lands as a GitHub issue with the numbers attached and a Slack suggestion for what to quarantine, while a clean comparison quietly records itself.

    ## How it works

    1. The `daily_ratchet` trigger (`io.kestra.plugin.core.trigger.Schedule`) runs the check every day at 06:00 and ships `disabled: true`, and `on_build_finished` (`io.kestra.plugin.core.trigger.Webhook`) fires the same check the moment Buildkite posts a build finished event.
    2. `fetch_builds` (`io.kestra.plugin.core.http.Request`) GETs the last 40 builds of `organization` and `pipeline` from the Buildkite REST API with the `BUILDKITE_TOKEN` secret sent as a Bearer header.
    3. `fetch_test_analytics` GETs the Test Engine records for the newest build, marked `allowFailure` so a pipeline without Test Engine still gets the step level check.
    4. `analyze_flakes` (`io.kestra.plugin.scripts.python.Script`) reads the two JSON inputs, keeps only builds that ended passed or failed, and splits them into a recent window of 10 builds and the previous window of 10.
    5. It computes a per-step failed share in each window, takes the steps that pass and fail inside the recent window but were clean before them, and emits `verdict`, `newly_flaky`, `worst_rate`, and `new_flake_count` through the `::json::` outputs protocol.
    6. `ratchet_gate` (`io.kestra.plugin.core.flow.If`) branches when the new flake count is over zero or the worst failed share got worse, opening `open_ratchet_issue` (`io.kestra.plugin.github.issues.Create`) and posting `quarantine_hint` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) on that path, while the clean path only logs with `log_stable`.
    7. The `errors` handler alerts Slack when the API call or the analysis fails, so a broken ratchet is never mistaken for a healthy pipeline.

    ## What you get

    - A ratchet instead of a dashboard, meaning the same old flake stops producing noise while anything that changes is escalated.
    - A GitHub issue that lists the newly flaky steps, their failed shares in both windows, and the builds behind them.
    - A quarantine suggestion drawn from Buildkite Test Engine labels and from tests that both passed and failed in the window.
    - Typed flow outputs (`verdict`, `newly_flaky`, `worst_rate`, `new_flake_count`) that a parent release flow can branch on.
    - Dated execution history in Kestra for every comparison, including the runs that found nothing new.

    ## Who it's for

    - CI owners who want flaky steps quarantined before they consume another release slot.
    - Test engineers who care about which step changed this week rather than which steps are always noisy.
    - Platform teams that already run Buildkite and GitHub and want the comparison in one file they can review.
    - Release managers who need a searchable record of every quarantine decision and the data behind it.

    ## Why orchestrate this with Kestra

    Buildkite tells you that a build failed, but it does not remember which steps were clean last week or who should decide what gets quarantined. Kestra holds the comparison window, the branch, the issue creation, and the Slack ping in one declarative file, with an execution record for each decision. A cron script can do the arithmetic, yet it cannot open the issue, notify the right channel, and prove what the verdict was last Tuesday from the same artifact. Putting the ratchet in the orchestrator also means retries, failure alerting, and a place to hang approvals when your team wants a human in the loop.

    ## Prerequisites

    - A Buildkite organization with an API token that can read builds, and pipelines that publish terminal step states for their jobs.
    - Buildkite Test Engine enabled if you want quarantine candidates, otherwise the analytics call degrades to a warning and the step check still runs.
    - A GitHub repository where this flow may open issues, using a classic token with `repo` scope or a fine-grained token with Issues write access.
    - Python 3 available on the Kestra worker for the analysis task, or switch its task runner to a container image.

    ### Secrets

    - `BUILDKITE_TOKEN`: Buildkite API token used as the Bearer credential for the builds and test analytics calls.
    - `BUILDKITE_WEBHOOK_KEY`: key segment guarding the webhook URL, so only Buildkite can start a ratchet run.
    - `GITHUB_TOKEN`: token passed to `jwtToken` by the issue task when the ratchet opens.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used for quarantine suggestions and failure alerts.

    ## Quick start

    1. Add the four secrets above to the `company.team` namespace in Kestra.
    2. Set the `organization`, `pipeline`, and `github_repository` inputs to your real slugs.
    3. Copy the trigger block below and flip `disabled` to `false` when you are ready for the daily run:

    ```yaml
    triggers:
      - id: daily_ratchet
        type: io.kestra.plugin.core.trigger.Schedule
        cron: "0 6 * * *"
        disabled: false
      - id: on_build_finished
        type: io.kestra.plugin.core.trigger.Webhook
        key: "{{ secret('BUILDKITE_WEBHOOK_KEY') }}"
    ```

    4. Point the Buildkite build finished hook at `/api/v1/{tenant}/executions/webhook/{namespace}/buildkite-flaky-test-ratchet/{BUILDKITE_WEBHOOK_KEY}`, or POST to that keyed URL after any build to try it by hand.
    5. Run the flow once manually and read the `verdict` output, then check GitHub and Slack when a step flips between pass and fail.

    ## How to extend

    - Watch several pipelines by copying the flow and overriding `organization` and `pipeline` per copy.
    - Fail the execution with `io.kestra.plugin.core.execution.Fail` on the ratchet branch when you want the check to block a merge instead of only filing an issue.
    - Record each verdict with `io.kestra.plugin.core.kv.Set` to chart flake rate trends across months rather than one window at a time.
    - Replace the GitHub issue with a Jira ticket through `io.kestra.plugin.jira.issues.Create`, keeping the same step list and rates.
    - Raise `WINDOW` inside the analysis script when your pipeline runs more than ten times a day, so the comparison covers a longer memory.
    - Feed the gate from `vars` instead of inputs so every copy in a namespace shares one repository target and one threshold.

    ## Links

    - [Buildkite REST API](https://buildkite.com/docs/apis/rest-api)
    - [Buildkite build tests API](https://buildkite.com/docs/apis/rest-api/test-engine/build-tests)
    - [GitHub plugin documentation](https://kestra.io/plugins/plugin-github)
  tags:
    - Infrastructure
    - Core
  subTags:
    - CI/CD & Deployment
    - Monitoring & Alerting
  ee: false
  demo: false
