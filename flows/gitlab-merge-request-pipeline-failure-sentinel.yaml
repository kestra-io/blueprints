id: gitlab-merge-request-pipeline-failure-sentinel
namespace: company.devops

inputs:
  - id: gitlab_host
    type: STRING
    displayName: GitLab Host Base URL
    defaults: "https://gitlab.com"
    description: Base URL for your GitLab instance (e.g. 'https://gitlab.com' or self-hosted 'https://gitlab.mycompany.com').

  - id: gitlab_project_path
    type: STRING
    displayName: GitLab Project Full Path
    defaults: "gitlab-org/gitlab"
    description: Full path of the target GitLab project (e.g. 'group/subgroup/project' or 'owner/repo').

  - id: mr_batch_size
    type: INT
    displayName: Merge Request Batch Size
    defaults: 25
    description: Maximum number of open merge requests to retrieve and evaluate per execution.

  - id: max_allowed_failing_mrs
    type: INT
    displayName: Maximum Tolerable Failing MRs
    defaults: 0
    description: Threshold of failing merge request pipelines allowed before triggering an alert.

triggers:
  - id: recurring_pipeline_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: 30-minute recurring CI health inspection to surface failing MR pipelines. Shipped disabled by default.
    cron: "*/30 * * * *"
    disabled: true

tasks:
  - id: fetch_merge_requests
    type: io.kestra.plugin.graphql.Request
    description: Query GitLab GraphQL API for opened merge requests and their latest head pipeline execution status.
    uri: "{{ inputs.gitlab_host }}/api/graphql"
    headers:
      Authorization: "Bearer {{ secret('GITLAB_API_TOKEN') }}"
      Content-Type: "application/json"
      User-Agent: "Kestra-GitLab-Pipeline-Sentinel/1.0"
    failOnGraphQLErrors: false
    allowFailed: true
    query: |
      query {
        project(fullPath: "{{ inputs.gitlab_project_path }}") {
          mergeRequests(state: opened, first: {{ inputs.mr_batch_size }}) {
            nodes {
              iid
              title
              webUrl
              author {
                username
                name
              }
              headPipeline {
                id
                iid
                status
                detailedStatus {
                  label
                }
              }
            }
          }
        }
      }

  - id: evaluate_failing_pipelines
    type: io.kestra.plugin.core.flow.If
    description: Check whether active merge requests with failing head pipelines exceed tolerance threshold.
    condition: "{{ outputs.fetch_merge_requests.body is defined and outputs.fetch_merge_requests.body.project is defined and outputs.fetch_merge_requests.body.project.mergeRequests is defined and (((outputs.fetch_merge_requests.body.project.mergeRequests.nodes | jq('[.[] | select(.headPipeline != null and .headPipeline.status == \"FAILED\")] | length') | first) | int) > inputs.max_allowed_failing_mrs) }}"
    then:
      - id: alert_failing_pipelines
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch high-priority Slack notification itemizing merge requests blocked by broken CI pipelines.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🔴 *GITLAB CI ALERT: Stalled Merge Requests with Failing Pipelines* 🔴\n\n*Project:* `{{ inputs.gitlab_project_path }}`\n*Failing MRs Count:* {{ outputs.fetch_merge_requests.body.project.mergeRequests.nodes | jq('[.[] | select(.headPipeline != null and .headPipeline.status == \"FAILED\")] | length') | first }}\n\n*Merge Requests Blocked by CI:*\n{{ outputs.fetch_merge_requests.body.project.mergeRequests.nodes | jq('[.[] | select(.headPipeline != null and .headPipeline.status == \"FAILED\") | \"• *!\" + .iid + \"*: \" + .title + \" (Author: @\" + .author.username + \") - <\" + .webUrl + \"|View MR>\"] | join(\"\\n\")') | first }}\n\n*Execution ID:* {{ execution.id }}\n*Action Required:* Authors or CI on-call engineers please unblock broken pipelines."
          }
    else:
      - id: log_pipelines_healthy
        type: io.kestra.plugin.core.log.Log
        description: Log clean status when zero merge requests exhibit failing pipelines.
        message: "HEALTHY: Zero opened merge requests with failing head pipelines detected in {{ inputs.gitlab_project_path }}."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Record final audit metrics for engineering velocity and pipeline stability.
    message: "GitLab pipeline sentinel finished for {{ inputs.gitlab_project_path }}. Evaluated MRs: {{ outputs.fetch_merge_requests.body is defined and outputs.fetch_merge_requests.body.project is defined and outputs.fetch_merge_requests.body.project.mergeRequests is defined ? (outputs.fetch_merge_requests.body.project.mergeRequests.nodes | length) : 0 }}. Failing MRs: {{ outputs.fetch_merge_requests.body is defined and outputs.fetch_merge_requests.body.project is defined and outputs.fetch_merge_requests.body.project.mergeRequests is defined ? (outputs.fetch_merge_requests.body.project.mergeRequests.nodes | jq('[.[] | select(.headPipeline != null and .headPipeline.status == \"FAILED\")] | length') | first) : 0 }}."

errors:
  - id: alert_on_gitlab_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert DevOps channel if GitLab GraphQL API query encounters network failure or token expiry.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *GitLab Sentinel Execution Error*: Execution `{{ execution.id }}` failed to query GitLab project `{{ inputs.gitlab_project_path }}`. Check GITLAB_API_TOKEN validity and host reachability."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.fetch_merge_requests.body is defined and outputs.fetch_merge_requests.body.project is defined and outputs.fetch_merge_requests.body.project.mergeRequests is defined and (((outputs.fetch_merge_requests.body.project.mergeRequests.nodes | jq('[.[] | select(.headPipeline != null and .headPipeline.status == \"FAILED\")] | length') | first) | int) > inputs.max_allowed_failing_mrs) ? 'FAILING_MR_DETECTED' : 'HEALTHY' }}"
  - id: failing_mrs_count
    type: INT
    value: "{{ outputs.fetch_merge_requests.body is defined and outputs.fetch_merge_requests.body.project is defined and outputs.fetch_merge_requests.body.project.mergeRequests is defined ? ((outputs.fetch_merge_requests.body.project.mergeRequests.nodes | jq('[.[] | select(.headPipeline != null and .headPipeline.status == \"FAILED\")] | length') | first) | int) : 0 }}"
  - id: total_evaluated_mrs
    type: INT
    value: "{{ outputs.fetch_merge_requests.body is defined and outputs.fetch_merge_requests.body.project is defined and outputs.fetch_merge_requests.body.project.mergeRequests is defined ? (outputs.fetch_merge_requests.body.project.mergeRequests.nodes | length) : 0 }}"

extend:
  title: GitLab merge request pipeline failure watchdog
  metaTitle: GitLab Merge Request Pipeline Failure Watchdog | Kestra
  shortDescription: Monitor GitLab open merge requests for failed CI pipelines via GraphQL API, alerting engineering teams in Slack to unblock review cycles.
  metaDescription: Audit GitLab open merge requests for failed CI pipelines via GraphQL API and alert engineering teams in Slack to unblock reviews and merge queues.
  description: |
    Prevent pull request queues from stalling due to broken CI/CD test runs by automatically surfacing failing GitLab Merge Requests. In busy development teams, merge requests frequently fail automated test suites due to transient flaky tests or merge conflicts without immediate author awareness, delaying release cycles and holding up dependent feature branches. This blueprint runs on a recurring 30-minute schedule, queries the GitLab GraphQL API for open merge requests and their head pipelines, filters for failed builds, and sends an itemized Slack alert with direct links to unblock development.

    ## How it works
    1. A `Schedule` trigger initiates a CI pipeline health audit every 30 minutes (shipped disabled by default).
    2. Task `fetch_merge_requests` uses `io.kestra.plugin.graphql.Request` to query the GitLab GraphQL endpoint (`{{ inputs.gitlab_host }}/api/graphql`) authenticating with a personal or project access token (`GITLAB_API_TOKEN`). It retrieves open merge requests with author usernames, titles, URLs, and head pipeline statuses.
    3. Task `evaluate_failing_pipelines` (`io.kestra.plugin.core.flow.If`) applies a jq expression to count merge requests where `headPipeline.status == "FAILED"`:
       - If failing MRs exceed `inputs.max_allowed_failing_mrs`, task `alert_failing_pipelines` transmits an itemized Slack notification with direct MR URLs and author handles.
       - If zero failing MRs are found, task `log_pipelines_healthy` logs that all merge requests have healthy or in-progress pipelines.
    4. Task `log_audit_summary` logs total evaluated and failing merge request counts for auditability.
    5. Top-level `errors` handler dispatches a notification if the GitLab API is unreachable or the access token has expired.

    ## What you get
    - Proactive visibility into broken CI/CD pipelines across active merge requests.
    - Elimination of stalled review queues and forgotten merge blockers.
    - Actionable Slack notifications directing engineers straight to failing merge requests.
    - Compatible with both GitLab SaaS (`gitlab.com`) and self-hosted GitLab Enterprise Edition.

    ## Who it's for
    - DevOps and Platform Engineering teams managing GitLab CI/CD infrastructure.
    - Engineering Managers and Tech Leads tracking sprint velocity and merge blockage.
    - QA Engineers monitoring test suite flakiness on incoming pull requests.

    ## Why orchestrate this with Kestra
    Rather than relying on individual developers checking their email or dashboard notifications, Kestra turns GitLab CI health into a centralized, observable pipeline. Kestra's native GraphQL task fetches nested MR and pipeline metadata in a single network round-trip, handles token authentication via secure secrets, and routes rich alerts into Slack or incident response channels without writing custom webhook listeners.

    ## Prerequisites
    - A GitLab project (on gitlab.com or self-hosted GitLab).
    - A GitLab Personal Access Token or Project Access Token with `read_api` scope.
    - A Slack Incoming Webhook URL.

    ### Secrets
    - `GITLAB_API_TOKEN`: GitLab access token with `read_api` permission passed in the `Authorization: Bearer` header.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to receive failure digests.

    ## Quick start
    1. Generate a GitLab Project Access Token under **Project Settings > Access Tokens** with `read_api` scope.
    2. Add `GITLAB_API_TOKEN` and `SLACK_WEBHOOK_URL` to Kestra Secrets.
    3. Configure `gitlab_project_path` with your project's full path (e.g. `my-org/my-app`).
    4. Execute the flow manually in Kestra to confirm successful GraphQL connection to GitLab.
    5. Enable the `recurring_pipeline_audit` schedule to automate 30-minute CI failure sweeps.

    ## How to extend
    - Add an automated auto-retry task using a GitLab GraphQL mutation to restart transiently failed test jobs.
    - Filter for MRs labeled with specific tags (e.g. `critical`, `release-blocker`) to route alerts to dedicated on-call channels.
    - Forward pipeline failure metrics to Datadog or Prometheus to graph mean time to resolution (MTTR) for broken builds.

    ## Links
    - [GitLab GraphQL API Documentation](https://docs.gitlab.com/ee/api/graphql/)
    - [Kestra GraphQL Plugin](https://kestra.io/plugins/plugin-graphql)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - CI/CD & Deployment
    - Monitoring & Alerting
  ee: false
  demo: false
