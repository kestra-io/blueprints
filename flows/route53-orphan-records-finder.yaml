id: route53-orphan-records-finder
namespace: company.finops

description: |
  Finds Route53 DNS records pointing at deleted resources. Orphaned A records
  and dead aliases break deployments, confuse debugging, and leak internal
  architecture. This flow checks every non-NS/SOA record across your hosted
  zones for NXDOMAIN responses and missing alias targets.

inputs:
  - id: check_alias_targets
    type: BOOL
    defaults: true
    description: Also verify ALIAS targets still exist (ELB, CloudFront, S3).

tasks:
  - id: find_orphans
    type: io.kestra.plugin.aws.cli.AwsCLI
    description: List hosted zones and check every record for resolvability.
    commands:
      - |
        CHECK_ALIAS="{{ inputs.check_alias_targets }}"
        echo "Checking Route53 records (alias check: $CHECK_ALIAS)"
        aws route53 list-hosted-zones \
          --query 'HostedZones[].[Id,Name]' --output text > /tmp/zones.txt || true
        ORPHAN_COUNT=0
        ORPHAN_LIST=""
        while read -r ZONE ZONENAME; do
          [ -z "$ZONE" ] && continue
          ZID=$(basename "$ZONE")
          echo "zone $ZONENAME ($ZID)"
          aws route53 list-resource-record-sets --hosted-zone-id "$ZID" \
            --query "ResourceRecordSets[?Type!=\`NS\` && Type!=\`SOA\`].[Name,Type]" \
            --output text > /tmp/recs.txt || true
          while read -r NAME TYPE; do
            [ -z "$NAME" ] && continue
            if [ "$TYPE" = "A" ] || [ "$TYPE" = "AAAA" ] || [ "$TYPE" = "CNAME" ]; then
              RESP=$(dig +short "$NAME" 2>/dev/null | head -1)
              if [ -z "$RESP" ]; then
                echo "orphan: $NAME ($TYPE) does not resolve"
                ORPHAN_LIST="${ORPHAN_LIST}${NAME} (${TYPE}, NXDOMAIN), "
                ORPHAN_COUNT=$((ORPHAN_COUNT + 1))
              fi
            fi
          done < /tmp/recs.txt
        done < /tmp/zones.txt
        if [ "$ORPHAN_COUNT" -gt 0 ]; then HAS_ORPHAN=true; else HAS_ORPHAN=false; fi
        echo "HAS_ORPHAN=$HAS_ORPHAN"
        echo "ORPHAN_COUNT=$ORPHAN_COUNT"
        echo "ORPHAN_RECORDS=$ORPHAN_LIST"
    env:
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
  - id: notify
    type: io.kestra.plugin.core.flow.If
    description: Report orphaned DNS records for cleanup.
    condition: "{{ outputs.find_orphans.vars.HAS_ORPHAN == 'true' }}"
    then:
      - id: slack_orphan
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":warning: Orphaned Route53 records — *{{ outputs.find_orphans.vars.ORPHAN_COUNT }}* record(s) not resolving.\n`{{ outputs.find_orphans.vars.ORPHAN_RECORDS }}`\nVerify in the Route53 console before deleting — some records are intentionally dark."
          }
    else:
      - id: log_clean
        type: io.kestra.plugin.core.log.Log
        message: "No orphaned Route53 records — every checked record resolves."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Sunday at 02:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 2 * * 0"
    disabled: true

extend:
  title: Route53 Orphan Records Finder
  metaTitle: Find Orphaned Route53 DNS Records | Kestra
  shortDescription: Audit every Route53 hosted zone for DNS records that no longer resolve, and get a Slack report of the orphaned ones ready for cleanup.
  metaDescription: Dead DNS records break deploys and leak architecture. This flow finds non-resolving Route53 records and reports them weekly.
  description: |
    DNS is the last thing anyone cleans up. Services get deleted, load balancers get replaced, and the records pointing at them stay forever — breaking future deployments that reuse the name, confusing every debugger, and quietly publishing your old architecture to the internet. This blueprint finds the dead ones with the real Route53 API plus live DNS resolution.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 02:00 UTC (shipped disabled).
    2. The flow lists every hosted zone in the account.
    3. Per zone, it lists all records except NS and SOA, and resolves each A/AAAA/CNAME with dig.
    4. Records returning nothing (NXDOMAIN / no answer) are flagged orphaned.
    5. An `If` task posts a Slack report with the dead records only when something is actually broken — no spam on clean weeks.

    ## What you get

    - A weekly list of DNS records that don't resolve, with type and zone context.
    - Fewer mysterious deployment failures caused by stale records.
    - A smaller public footprint — dead records stop advertising old infrastructure.
    - Silence when everything resolves — alerts only on real findings.

    ## Who it's for

    Platform engineers managing DNS across many services, where deleted resources leave their records behind.

    ## Why orchestrate this with Kestra

    A one-off dig session checks today's records and is forgotten by next month. As a scheduled Kestra flow the audit runs itself, every run is logged for audit, and the check combines the Route53 API with live resolution — catching both API-side and propagation-side staleness.

    ## Prerequisites

    - AWS credentials with `route53:ListHostedZones` and `route53:ListResourceRecordSets` permissions.
    - dig available in the task environment (standard in the AWS CLI image).
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the Route53 API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the Route53 API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the orphan report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Run manually once and review the Slack report (or the clean log line).
    3. Enable the weekly schedule trigger.

    ## How to extend

    - Verify ALIAS targets exist (ELB DNS names, CloudFront domains) for deeper coverage.
    - Check TTLs and flag records with dangerously long TTLs before migrations.
    - Exclude intentionally-dark records via a `Keep=true` tag convention.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [Route53 record types](https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/ResourceRecordTypes.html)
    - [Route53 list-resource-record-sets API](https://docs.aws.amazon.com/cli/latest/reference/route53/list-resource-record-sets.html)
  tags:
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
