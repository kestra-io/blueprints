id: minio-s3-multipart-upload-leak-sweep
namespace: company.finops

inputs:
  - id: bucket
    type: STRING
    displayName: Target S3 / MinIO Bucket
    description: Target Amazon S3 or MinIO bucket to inspect for abandoned multipart uploads.
    defaults: data-lake-staging

  - id: endpoint_url
    type: STRING
    displayName: S3 / MinIO Endpoint URL
    description: Custom S3 API endpoint URL for MinIO or S3-compatible storage (e.g. `http://minio:9000`). Leave empty for AWS S3.
    defaults: ""

  - id: region
    type: STRING
    displayName: AWS / MinIO Region
    description: AWS region or MinIO region identifier.
    defaults: us-east-1

  - id: prefix
    type: STRING
    displayName: Key Prefix Filter
    description: Optional object key prefix to scope the audit (e.g., `staging/` or `raw/`). Empty checks the entire bucket.
    defaults: ""

  - id: max_age_days
    type: INT
    displayName: Stale Age Threshold (Days)
    description: Multipart uploads initiated older than this age in days will be classified as abandoned and purged.
    defaults: 7

  - id: dry_run
    type: BOOL
    displayName: Dry Run Mode
    description: When enabled, scans abandoned uploads and calculates leaked storage volume without executing abort calls.
    defaults: true

  - id: notify_slack
    type: BOOL
    displayName: Notify Slack
    description: Post an executive FinOps cost recovery digest to Slack when abandoned uploads are found.
    defaults: false

  - id: docker_network
    type: STRING
    displayName: Docker Network
    description: Docker network joined by the container task runner to communicate with local or containerized S3 endpoints.
    defaults: bridge

tasks:
  - id: sweep_multipart_uploads
    type: io.kestra.plugin.scripts.python.Script
    description: Scan bucket for incomplete multipart uploads, calculate session age, aggregate leaked bytes and gigabytes across orphaned parts, and safely abort stale uploads when dry-run is disabled.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: "{{ inputs.docker_network }}"
    beforeCommands:
      - pip install --no-cache-dir boto3 kestra
    env:
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
      AWS_DEFAULT_REGION: "{{ inputs.region }}"
      S3_ENDPOINT_URL: "{{ inputs.endpoint_url }}"
    outputFiles:
      - sweep_report.json
    script: |
      import os
      import sys
      import json
      from datetime import datetime, timezone
      import boto3
      from botocore.client import Config
      from kestra import Kestra

      bucket = "{{ inputs.bucket }}".strip()
      prefix = "{{ inputs.prefix }}".strip()
      max_age_days = float("{{ inputs.max_age_days }}")
      dry_run = str("{{ inputs.dry_run }}").lower() in ("true", "1")
      endpoint_url = os.environ.get("S3_ENDPOINT_URL", "").strip() or None
      region = os.environ.get("AWS_DEFAULT_REGION", "us-east-1")
      access_key = os.environ.get("AWS_ACCESS_KEY_ID")
      secret_key = os.environ.get("AWS_SECRET_ACCESS_KEY")

      client_kwargs = {
          "service_name": "s3",
          "region_name": region,
          "config": Config(s3={"addressing_style": "path"}),
      }
      if endpoint_url:
          client_kwargs["endpoint_url"] = endpoint_url
      if access_key and secret_key:
          client_kwargs["aws_access_key_id"] = access_key
          client_kwargs["aws_secret_access_key"] = secret_key

      s3 = boto3.client(**client_kwargs)

      now = datetime.now(timezone.utc)
      paginator = s3.get_paginator("list_multipart_uploads")
      parts_paginator = s3.get_paginator("list_parts")

      total_scanned_uploads = 0
      stale_uploads = []
      retained_uploads = []
      total_leaked_bytes = 0
      total_stale_parts = 0
      total_aborted_uploads = 0
      failed_aborts = 0

      for page in paginator.paginate(Bucket=bucket):
          uploads = page.get("Uploads", [])
          for u in uploads:
              key = u["Key"]
              if prefix and not key.startswith(prefix):
                  continue

              total_scanned_uploads += 1
              upload_id = u["UploadId"]
              initiated_dt = u["Initiated"]
              if initiated_dt.tzinfo is None:
                  initiated_dt = initiated_dt.replace(tzinfo=timezone.utc)

              age_seconds = (now - initiated_dt).total_seconds()
              age_days = max(0.0, age_seconds / 86400.0)

              upload_bytes = 0
              part_count = 0
              try:
                  for p_page in parts_paginator.paginate(Bucket=bucket, Key=key, UploadId=upload_id):
                      for part in p_page.get("Parts", []):
                          upload_bytes += part.get("Size", 0)
                          part_count += 1
              except Exception as err:
                  print(f"Warning: Could not list parts for {key} ({upload_id}): {err}", file=sys.stderr)

              upload_info = {
                  "key": key,
                  "upload_id": upload_id,
                  "initiated": initiated_dt.isoformat(),
                  "age_days": round(age_days, 2),
                  "parts_count": part_count,
                  "size_bytes": upload_bytes,
                  "size_mb": round(upload_bytes / (1024 * 1024), 2),
              }

              if age_days >= max_age_days:
                  if not dry_run:
                      try:
                          s3.abort_multipart_upload(Bucket=bucket, Key=key, UploadId=upload_id)
                          upload_info["status"] = "ABORTED"
                          total_aborted_uploads += 1
                      except Exception as err:
                          upload_info["status"] = f"ABORT_FAILED: {err}"
                          failed_aborts += 1
                          print(f"Error aborting {key} ({upload_id}): {err}", file=sys.stderr)
                  else:
                      upload_info["status"] = "DRY_RUN_WOULD_ABORT"

                  total_leaked_bytes += upload_bytes
                  total_stale_parts += part_count
                  stale_uploads.append(upload_info)
              else:
                  upload_info["status"] = "RETAINED_ACTIVE"
                  retained_uploads.append(upload_info)

      leaked_mb = round(total_leaked_bytes / (1024 * 1024), 2)
      leaked_gb = round(total_leaked_bytes / (1024 * 1024 * 1024), 6)
      reclaimed_bytes = total_leaked_bytes if (not dry_run and failed_aborts == 0) else (0 if not dry_run else total_leaked_bytes)
      reclaimed_gb = leaked_gb if (not dry_run and failed_aborts == 0) else (0.0 if not dry_run else leaked_gb)

      summary_rows = [
          f"• `{item['key']}` (Age: {item['age_days']}d, Parts: {item['parts_count']}, Size: {item['size_mb']} MB, Status: {item['status']})"
          for item in stale_uploads[:10]
      ]
      summary_text = "\n".join(summary_rows) if summary_rows else "No abandoned multipart uploads found."
      if len(stale_uploads) > 10:
          summary_text += f"\n... and {len(stale_uploads) - 10} more abandoned upload session(s)."

      audit_record = {
          "execution_id": "{{ execution.id }}",
          "timestamp": now.isoformat(),
          "bucket": bucket,
          "prefix": prefix,
          "max_age_days": max_age_days,
          "dry_run": dry_run,
          "total_active_uploads": total_scanned_uploads,
          "stale_uploads_count": len(stale_uploads),
          "stale_parts_count": total_stale_parts,
          "total_leaked_bytes": total_leaked_bytes,
          "total_leaked_mb": leaked_mb,
          "total_leaked_gb": leaked_gb,
          "reclaimed_bytes": reclaimed_bytes,
          "reclaimed_gb": reclaimed_gb,
          "aborted_count": total_aborted_uploads,
          "failed_aborts_count": failed_aborts,
          "stale_uploads": stale_uploads,
      }

      with open("sweep_report.json", "w") as f:
          json.dump(audit_record, f, indent=2)

      print(f"Sweep complete: {len(stale_uploads)} stale uploads, {total_stale_parts} parts, {leaked_gb} GB ({total_leaked_bytes} bytes).")

      Kestra.outputs({
          "bucket": bucket,
          "dry_run": dry_run,
          "total_active_uploads": total_scanned_uploads,
          "stale_uploads_count": len(stale_uploads),
          "stale_parts_count": total_stale_parts,
          "total_leaked_bytes": total_leaked_bytes,
          "total_leaked_gb": leaked_gb,
          "reclaimed_bytes": reclaimed_bytes,
          "reclaimed_gb": reclaimed_gb,
          "audit_record": audit_record,
          "summary_text": summary_text,
      })

  - id: record_audit_kv
    type: io.kestra.plugin.core.kv.Set
    description: Record sweep audit metrics including reclaimed storage volume and upload counts into Kestra namespace KV store.
    key: "minio_s3_sweep_{{ inputs.bucket }}"
    value: "{{ outputs.sweep_multipart_uploads.vars.audit_record | toJson }}"
    kvType: JSON

  - id: evaluate_findings
    type: io.kestra.plugin.core.flow.If
    description: Branch based on discovered abandoned uploads and Slack notification preferences.
    condition: "{{ outputs.sweep_multipart_uploads.vars.stale_uploads_count > 0 and inputs.notify_slack }}"
    then:
      - id: send_slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post structured FinOps cost reclamation report card to Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🪣 *S3/MinIO Multipart Upload Sweep Digest*\n• *Bucket:* `{{ inputs.bucket }}`\n• *Mode:* `{{ inputs.dry_run ? 'DRY-RUN (Simulated)' : 'ENFORCED (Aborted)' }}`\n• *Threshold:* `{{ inputs.max_age_days }}` days\n• *Abandoned Uploads:* `{{ outputs.sweep_multipart_uploads.vars.stale_uploads_count }}` / `{{ outputs.sweep_multipart_uploads.vars.total_active_uploads }}`\n• *Orphaned Parts:* `{{ outputs.sweep_multipart_uploads.vars.stale_parts_count }}`\n• *Leaked Storage:* `{{ outputs.sweep_multipart_uploads.vars.total_leaked_gb }}` GB (`{{ outputs.sweep_multipart_uploads.vars.total_leaked_bytes }}` bytes)\n• *Reclaimed Storage:* `{{ outputs.sweep_multipart_uploads.vars.reclaimed_gb }}` GB (`{{ outputs.sweep_multipart_uploads.vars.reclaimed_bytes }}` bytes)\n• *KV Store Audit Key:* `minio_s3_sweep_{{ inputs.bucket }}`\n\n*Top Stale Uploads:*\n{{ outputs.sweep_multipart_uploads.vars.summary_text }}\n\n_Execution: {{ execution.id }}_"
          }
    else:
      - id: log_audit_summary
        type: io.kestra.plugin.core.log.Log
        description: Log sweep outcome when Slack alerts are skipped or no abandoned uploads exist.
        message: >-
          MinIO/S3 multipart sweep completed for bucket '{{ inputs.bucket }}'.
          Mode: {{ inputs.dry_run ? 'DRY-RUN' : 'LIVE' }}.
          Active uploads scanned: {{ outputs.sweep_multipart_uploads.vars.total_active_uploads }}.
          Abandoned uploads: {{ outputs.sweep_multipart_uploads.vars.stale_uploads_count }} ({{ outputs.sweep_multipart_uploads.vars.stale_parts_count }} parts).
          Storage volume: {{ outputs.sweep_multipart_uploads.vars.total_leaked_gb }} GB ({{ outputs.sweep_multipart_uploads.vars.total_leaked_bytes }} bytes).
          Reclaimed volume: {{ outputs.sweep_multipart_uploads.vars.reclaimed_gb }} GB.
          Audit recorded under KV key 'minio_s3_sweep_{{ inputs.bucket }}'.

errors:
  - id: alert_on_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert engineering if AWS/MinIO API calls fail due to permissions, connectivity, or invalid endpoints.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "🚨 *MinIO/S3 Multipart Upload Sweep Failed* in flow `{{ flow.id }}` for bucket `{{ inputs.bucket }}`. Check IAM permissions (`s3:ListBucketMultipartUploads`, `s3:ListMultipartUploadParts`, `s3:AbortMultipartUpload`) and endpoint availability. Execution: {{ execution.id }}."
      }

triggers:
  - id: weekly_sweep_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Trigger weekly staging sweep for abandoned multipart uploads every Sunday at 02:00 UTC.
    cron: "0 2 * * 0"

outputs:
  - id: bucket
    type: STRING
    value: "{{ inputs.bucket }}"
  - id: total_active_uploads
    type: INT
    value: "{{ outputs.sweep_multipart_uploads.vars.total_active_uploads }}"
  - id: stale_uploads_count
    type: INT
    value: "{{ outputs.sweep_multipart_uploads.vars.stale_uploads_count }}"
  - id: stale_parts_count
    type: INT
    value: "{{ outputs.sweep_multipart_uploads.vars.stale_parts_count }}"
  - id: total_leaked_bytes
    type: INT
    value: "{{ outputs.sweep_multipart_uploads.vars.total_leaked_bytes }}"
  - id: total_leaked_gb
    type: FLOAT
    value: "{{ outputs.sweep_multipart_uploads.vars.total_leaked_gb }}"
  - id: reclaimed_bytes
    type: INT
    value: "{{ outputs.sweep_multipart_uploads.vars.reclaimed_bytes }}"
  - id: reclaimed_gb
    type: FLOAT
    value: "{{ outputs.sweep_multipart_uploads.vars.reclaimed_gb }}"
  - id: dry_run
    type: BOOL
    value: "{{ inputs.dry_run }}"

extend:
  title: MinIO and S3 Multipart Upload Leak & Staging Sweep
  metaTitle: Sweep MinIO and S3 Multipart Upload Leaks | Kestra
  shortDescription: Discover and abort abandoned S3 and MinIO multipart uploads older than a retention threshold to reclaim leaked storage and cut cloud bills.
  metaDescription: Sweep orphaned S3 and MinIO multipart uploads, aggregate leaked storage volume, abort abandoned parts, and record reclaimed bytes to Kestra KV and Slack.
  description: |
    When ingesting high-volume data streams, database backups, or Parquet datasets into Amazon S3 or MinIO, clients utilize the **S3 Multipart Upload API** to parallelize chunks. However, network interruptions, spot worker preemptions, or ETL task timeouts often abort processes without finalizing the upload session.

    Unless explicitly aborted via `AbortMultipartUpload`, uploaded parts linger indefinitely in object storage:
    - Standard bucket listings (`aws s3 ls`) and console file trees completely hide incomplete multipart uploads.
    - Orphaned parts silently consume storage capacity and incur standard S3 per-GB storage fees every month.
    - Over time, abandoned staging uploads accumulate into gigabytes or terabytes of "ghost" storage.

    This blueprint automates proactive storage governance across Amazon S3 and MinIO deployments:
    - Paginates all active in-progress multipart uploads across target buckets and key prefixes.
    - Evaluates session age against a configurable retention threshold (`max_age_days`, default 7 days).
    - Queries the S3 API to enumerate individual orphaned parts and aggregates leaked byte and gigabyte volume.
    - Safely aborts abandoned uploads when dry-run mode is disabled, releasing occupied disk space.
    - Persists structured audit metrics (reclaimed gigabytes, part counts, session timestamps) into Kestra's internal KV store.
    - Dispatches structured FinOps reclamation summaries to Slack for operational visibility.

    ## How it works
    1. `weekly_sweep_schedule` triggers every Sunday at 02:00 UTC (or runs on demand with custom parameters).
    2. `sweep_multipart_uploads` executes an isolated Python container with `boto3`, connecting to AWS S3 or MinIO via `endpoint_url` with path-style addressing support.
    3. The script evaluates each upload session's `Initiated` timestamp against `max_age_days`.
    4. For matching stale sessions, it paginates `list_parts` to measure accumulated storage mass before invoking `abort_multipart_upload` (or logging intended removals in dry-run mode).
    5. `record_audit_kv` writes the execution audit record to Kestra's namespace KV store under key `minio_s3_sweep_<bucket>`.
    6. `evaluate_findings` posts a FinOps digest card to Slack if abandoned uploads were remediated and notifications are enabled, or records status in execution logs.
    7. An `errors` block catches IAM permission deficiencies or connection drops and alerts Slack.

    ## What you get
    - **Reclaimed Storage**: Permanently delete hidden multi-gigabyte staging leaks and lower AWS S3/MinIO infrastructure costs.
    - **Storage Volume Visibility**: Measure actual leaked megabytes and gigabytes across abandoned parts, not merely upload session counts.
    - **Safe Dry-Run Testing**: Audit candidate uploads and preview reclamation metrics before enabling destructive cleanup.
    - **Namespace Audit Ledger**: Retain historical sweep metrics in Kestra KV store for FinOps reporting and compliance audits.
    - **Hybrid Cloud Compatibility**: Works seamlessly with AWS S3, MinIO clusters, Ceph, and S3-compatible cloud object storage.

    ## Who it's for
    - Data Platform Engineers maintaining high-throughput ingestion pipelines.
    - FinOps Practitioners combating invisible cloud storage creep and uncontrolled staging bloat.
    - Site Reliability Engineers operating private MinIO object storage clusters with finite disk pools.

    ## Why orchestrate this with Kestra
    Kestra coordinates the end-to-end FinOps lifecycle in a single declarative YAML workflow. By combining containerized Python scripts for deep S3 part inspection, built-in namespace KV persistence for audit state, and native Slack alerts, teams eliminate brittle cron scripts and unmonitored Lambda functions while gaining full execution logs and metric tracking.

    ## Prerequisites
    - S3 / MinIO credentials with permissions:
      - `s3:ListBucketMultipartUploads`
      - `s3:ListMultipartUploadParts`
      - `s3:AbortMultipartUpload`
    - Docker container runner enabled on the Kestra worker.
    - (Optional) Slack Incoming Webhook URL for alerting.

    ### Secrets
    - `AWS_ACCESS_KEY_ID`: IAM or MinIO access key ID.
    - `AWS_SECRET_ACCESS_KEY`: IAM or MinIO secret access key.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL.

    ## Quick start
    1. Configure `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Run a manual execution with `dry_run: true` and your target `bucket` (and `endpoint_url` if using MinIO).
    3. Review the outputs and summary logs to inspect identified uploads and leaked gigabytes.
    4. Set `dry_run: false` to execute the sweep and activate `weekly_sweep_schedule` for continuous maintenance.

    ## How to extend
    - **Multi-Bucket Automation**: Nest this workflow inside an `io.kestra.plugin.core.flow.ForEach` loop over a list of bucket names to sweep an entire organizational cloud footprint.
    - **S3 Lifecycle Alignment**: Cross-reference sweeper findings against bucket lifecycle configurations (`AbortIncompleteMultipartUpload`) to audit policy enforcement.
    - **PagerDuty & MS Teams**: Replace or complement the Slack task with PagerDuty or Microsoft Teams notification plugins.

    ## Links
    - [Amazon S3 Multipart Upload Overview](https://docs.aws.amazon.com/AmazonS3/latest/userguide/mpuoverview.html)
    - [Boto3 S3 Client Reference](https://boto3.amazonaws.com/v1/documentation/api/latest/reference/services/s3.html)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra KV Store](https://kestra.io/docs/workflow-components/kv-store)
  tags:
    - Cloud
    - Data
  subTags:
    - FinOps & Cost Management
    - ELT & Warehouse Loading
  ee: false
  demo: false
