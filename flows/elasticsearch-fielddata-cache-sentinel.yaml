id: elasticsearch-fielddata-cache-sentinel
namespace: company.team

inputs:
  - id: elasticsearch_host
    type: STRING
    defaults: elasticsearch.internal:9200
    description: Host and port of the Elasticsearch cluster endpoint.
  - id: elasticsearch_user
    type: STRING
    defaults: elastic
    description: Elasticsearch username.
  - id: max_fielddata_mb_threshold
    type: FLOAT
    defaults: 2048.0
    description: Maximum permissible fielddata cache memory in megabytes before alerting.

tasks:
  - id: query_fielddata_memory
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests
    env:
      ES_HOST: "{{ inputs.elasticsearch_host }}"
      ES_USER: "{{ inputs.elasticsearch_user }}"
      ES_PASSWORD: "{{ secret('ELASTICSEARCH_PASSWORD') }}"
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      host = os.environ.get("ES_HOST", "elasticsearch.internal:9200")
      user = os.environ.get("ES_USER", "elastic")
      password = os.environ.get("ES_PASSWORD", "")

      auth = (user, password) if user and password else None
      url = f"http://{host}/_nodes/stats/indices/fielddata"

      try:
          resp = requests.get(url, auth=auth, timeout=15)
          resp.raise_for_status()
          data = resp.json().get("nodes", {})
      except Exception as e:
          print(f"CRITICAL: Failed to query Elasticsearch fielddata at {url}: {e}", file=sys.stderr)
          sys.exit(1)

      total_memory_bytes = 0
      total_evictions = 0
      node_details = []

      for node_id, node_data in data.items():
          name = node_data.get("name", node_id)
          fd = node_data.get("indices", {}).get("fielddata", {})
          mem_b = fd.get("memory_size_in_bytes", 0)
          evict = fd.get("evictions", 0)
          total_memory_bytes += mem_b
          total_evictions += evict
          if mem_b > 0:
              node_details.append({"node": name, "memory_mb": round(mem_b / 1048576.0, 1), "evictions": evict})

      total_mb = round(total_memory_bytes / 1048576.0, 1)
      max_limit = float("{{ inputs.max_fielddata_mb_threshold }}")
      alert_needed = (total_mb > max_limit) or (total_evictions > 0)

      result = {
          "total_fielddata_mb": total_mb,
          "total_evictions": total_evictions,
          "node_details": node_details,
          "alert_triggered": alert_needed
      }

      with open("fielddata_summary.json", "w") as out:
          json.dump(result, out, indent=2)

      Kestra.outputs({
          "total_fielddata_mb": total_mb,
          "total_evictions": total_evictions,
          "alert_triggered": alert_needed
      })
      print("Elasticsearch fielddata audit:", result)
    outputFiles:
      - fielddata_summary.json

  - id: evaluate_fielddata_pressure
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_fielddata_memory.vars.alert_triggered }}"
    then:
      - id: alert_es_administrators
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":warning: *Elasticsearch Fielddata Cache Alert*: Cluster on {{ inputs.elasticsearch_host }} has consumed {{ outputs.query_fielddata_memory.vars.total_fielddata_mb }} MB fielddata heap memory (Evictions: {{ outputs.query_fielddata_memory.vars.total_evictions }}). High risk of garbage collection stalls."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": ":warning: *Elasticsearch Sentinel Execution Failure*: Failed to query fielddata stats on {{ inputs.elasticsearch_host }}. Execution ID: {{ execution.id }}."
      }

triggers:
  - id: scheduled_fielddata_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Elasticsearch fielddata cache memory usage to detect expensive heap-consuming aggregations and evictions."
  metaTitle: Elasticsearch Fielddata Cache Memory Sentinel with Kestra
  title: Elasticsearch Fielddata Cache Memory Sentinel
  shortDescription: Audits Elasticsearch fielddata cache memory usage to detect expensive heap-consuming aggregations and evictions.
  description: |
    ## How it works
    This flow calls the Elasticsearch `_nodes/stats/indices/fielddata` API across all nodes in the cluster. It aggregates overall fielddata memory consumption and tracks cache eviction counts, alerting engineers when memory limits are reached.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[scheduled_fielddata_check Schedule Trigger] --> B[query_fielddata_memory Python Script]
      B --> C{Fielddata Memory High?}
      C -- Yes --> D[alert_es_administrators Slack Webhook]
      C -- No --> E[Fielddata Healthy]
    ```

    ## Prerequisites
    - Elasticsearch HTTP endpoint reachability (default 9200).
    - Secrets `ELASTICSEARCH_PASSWORD` and `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra under the `company.team` namespace.
    2. Set `elasticsearch_host` and credentials.
    3. Trigger a manual execution to inspect fielddata usage.

    ## Links
    - [Elasticsearch Fielddata Settings](https://www.elastic.co/guide/en/elasticsearch/reference/current/modules-fielddata.html)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
