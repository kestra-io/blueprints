id: elasticsearch-fielddata-cache-sentinel
namespace: company.dataops

inputs:
  - id: elasticsearch_host
    type: STRING
    defaults: elasticsearch.internal:9200
    description: Host and port of the Elasticsearch cluster endpoint.
  - id: max_fielddata_mb_threshold
    type: FLOAT
    defaults: 2048.0
    description: Maximum permissible fielddata cache memory in megabytes before alerting.

tasks:
  - id: query_fielddata_memory
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - |
        curl -s -u "{{ inputs.elasticsearch_user | default('elastic') }}:{{ secret('ELASTICSEARCH_PASSWORD') }}"           "http://{{ inputs.elasticsearch_host }}/_nodes/stats/indices/fielddata" > fielddata_stats.json
        python3 -c "
        import json
        with open('fielddata_stats.json') as f:
            data = json.load(f).get('nodes', {})
        total_memory_bytes = 0
        total_evictions = 0
        node_details = []
        for node_id, node_data in data.items():
            name = node_data.get('name', node_id)
            fd = node_data.get('indices', {}).get('fielddata', {})
            mem_b = fd.get('memory_size_in_bytes', 0)
            evict = fd.get('evictions', 0)
            total_memory_bytes += mem_b
            total_evictions += evict
            if mem_b > 0:
                node_details.append({'node': name, 'memory_mb': round(mem_b / 1048576.0, 1), 'evictions': evict})
        total_mb = round(total_memory_bytes / 1048576.0, 1)
        alert_needed = (total_mb > {{ inputs.max_fielddata_mb_threshold }}) or (total_evictions > 0)
        result = {
            'total_fielddata_mb': total_mb,
            'total_evictions': total_evictions,
            'node_details': node_details,
            'alert_triggered': alert_needed
        }
        with open('fielddata_summary.json', 'w') as out:
            json.dump(result, out)
        print('Elasticsearch fielddata audit:', result)
        "
    outputFiles:
      - fielddata_summary.json

  - id: evaluate_fielddata_pressure
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.query_fielddata_memory.outputFiles['fielddata_summary.json'])).alert_triggered }}"
    then:
      - id: alert_es_administrators
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *Elasticsearch Fielddata Memory Alert*: Fielddata cache has consumed {{ json(read(outputs.query_fielddata_memory.outputFiles['fielddata_summary.json'])).total_fielddata_mb }} MB across nodes on {{ inputs.elasticsearch_host }} with {{ json(read(outputs.query_fielddata_memory.outputFiles['fielddata_summary.json'])).total_evictions }} evictions. Unindexed text sorting or aggregations detected."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Elasticsearch Sentinel Execution Failure*: Failed to query fielddata stats on {{ inputs.elasticsearch_host }}."
      }

triggers:
  - id: scheduled_fielddata_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: Elasticsearch Fielddata Cache Memory Pressure Sentinel
  shortDescription: Audits Elasticsearch cluster fielddata cache usage to prevent heap memory exhaustion and out-of-memory crashes.
  description: |
    ## How it works
    This sentinel contacts the Elasticsearch `_nodes/stats/indices/fielddata` API across all nodes. It tallies heap memory allocated to in-memory fielddata structures and tracks cache evictions caused by sorting or aggregating on unmapped or raw `text` fields.

    ## What you get
    - Proactive visibility into hidden heap consumption before JVM GC pauses destabilize data nodes.
    - Immediate detection of costly aggregation queries executed by client applications.
    - Automated Slack incident delivery indicating affected nodes, memory size in MB, and eviction counts.

    ## Who it's for
    - Search infrastructure engineers and SREs supervising Elasticsearch or OpenSearch clusters.
    - Backend developers optimizing full-text query and aggregation performance.

    ## Why orchestrate this with Kestra
    Kestra automates distributed search cluster observability, executing scheduled health checks with fine-grained error management and notification routing.

    ## Prerequisites
    - Elasticsearch HTTP endpoint reachability (default 9200).
    - Secrets `ELASTICSEARCH_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Set `elasticsearch_host` and credentials.
    3. Run manually to check current fielddata usage.

    ## How to extend
    - Clear fielddata caches via `POST /_cache/clear?fielddata=true` automatically in an emergency flow.
    - Query index mappings to identify fields missing `keyword` sub-fields.
    - Forward fielddata metrics to Prometheus or Grafana.

    ## Links
    - [Elasticsearch Fielddata Documentation](https://www.elastic.co/guide/en/elasticsearch/reference/current/text.html#fielddata-mapping-param)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
