id: rabbitmq-dead-letter-exchange-sentinel
namespace: company.messaging

inputs:
  - id: rabbitmq_management_host
    type: STRING
    defaults: rabbitmq.internal:15672
    description: Host and port of the RabbitMQ Management API.
  - id: rabbitmq_username
    type: STRING
    defaults: guest
    description: Username for RabbitMQ Management API.
  - id: max_dlq_message_threshold
    type: INT
    defaults: 50
    description: Maximum permissible messages in Dead Letter Queues before triggering an alert.

tasks:
  - id: audit_dead_letter_queues
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - |
        curl -s -u "{{ inputs.rabbitmq_username }}:{{ secret('RABBITMQ_PASSWORD') }}"           "http://{{ inputs.rabbitmq_management_host }}/api/queues" > queues.json
        python3 -c "
        import json
        with open('queues.json') as f:
            queues = json.load(f)
        dlq_list = []
        for q in queues:
            args = q.get('arguments', {})
            name = q.get('name', '')
            msgs = q.get('messages', 0)
            if 'x-dead-letter-exchange' in args or 'dlq' in name.lower() or 'dead' in name.lower():
                dlq_list.append({'name': name, 'messages': msgs, 'consumers': q.get('consumers', 0)})
        breached_queues = [q for q in dlq_list if q['messages'] > {{ inputs.max_dlq_message_threshold }}]
        result = {
            'total_dlqs': len(dlq_list),
            'breached_count': len(breached_queues),
            'breached_queues': breached_queues,
            'alert_triggered': len(breached_queues) > 0
        }
        with open('dlq_summary.json', 'w') as out:
            json.dump(result, out)
        print('RabbitMQ DLQ audit:', result)
        "
    outputFiles:
      - dlq_summary.json

  - id: evaluate_dlq_accumulation
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.audit_dead_letter_queues.outputFiles['dlq_summary.json'])).alert_triggered }}"
    then:
      - id: alert_message_backlog
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *RabbitMQ Dead Letter Queue Alert*: Detected {{ json(read(outputs.audit_dead_letter_queues.outputFiles['dlq_summary.json'])).breached_count }} DLQs exceeding message thresholds on {{ inputs.rabbitmq_management_host }}."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *RabbitMQ Sentinel Execution Failure*: Unable to query RabbitMQ Management API at {{ inputs.rabbitmq_management_host }}."
      }

triggers:
  - id: scheduled_dlq_scan
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: RabbitMQ Dead Letter Exchange Queue Accumulation Sentinel
  shortDescription: Audits RabbitMQ Dead Letter Queues (DLQs) to detect message processing failures and unhandled poison pills.
  description: |
    ## How it works
    This sentinel inspects RabbitMQ clusters through the Management HTTP API. It scans all virtual hosts for queues configured with `x-dead-letter-exchange` routing or matching standard DLQ naming patterns, aggregates message backlog statistics, and alerts when poisoned or failed messages accumulate.

    ## What you get
    - Proactive visibility into consumer microservice failures before downstream queues stall.
    - Automated inspection across multiple dead-letter exchanges and dead queues.
    - Instant Slack alerts highlighting affected queue names and unacknowledged message counts.

    ## Who it's for
    - Microservices developers and backend engineers maintaining event-driven architectures.
    - SREs responsible for RabbitMQ broker health and message throughput.

    ## Why orchestrate this with Kestra
    Kestra automates distributed system observability and remediation. Chaining health probes directly to messaging queues allows engineering teams to detect, triage, and reprocess dead-lettered payloads within a unified platform.

    ## Prerequisites
    - RabbitMQ Management plugin enabled on the target broker.
    - Secrets `RABBITMQ_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure the Management host address and credentials.
    3. Run manually to verify DLQ discovery, then enable the schedule.

    ## How to extend
    - Add automated message re-routing or replay subflows into dead-lettered consumer queues.
    - Integrate with PagerDuty for critical production routing incidents.
    - Archive message headers to object storage (S3/GCS) for auditability.

    ## Links
    - [Kestra RabbitMQ Plugin](https://kestra.io/plugins/plugin-amqp)
    - [RabbitMQ Dead Letter Exchanges Documentation](https://www.rabbitmq.com/docs/dlx)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
