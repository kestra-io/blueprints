id: usgs-streamflow-monitoring-lakehouse-loader
namespace: company.analytics
description: Ingests real-time hydrological streamflow observations and discharge rates from USGS Water Services into Parquet lakehouse storage via DuckDB, tracking hydrological thresholds in Kestra KV store.

inputs:
  - id: site_ids
    type: STRING
    description: Comma-separated USGS hydrologic station monitoring site identifiers.
    defaults: "01646500,01463500,02087500,03086000"

  - id: discharge_alert_threshold_cfs
    type: FLOAT
    description: Streamflow discharge threshold in cubic feet per second (cfs) to trigger high-flow water alerts.
    defaults: 2000.0

  - id: state_key
    type: STRING
    description: Kestra KV store key tracking previous discharge observations per monitoring station.
    defaults: usgs_water_monitored_streamflow_state

variables:
  default_state: "{}"

triggers:
  - id: hourly_water_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_streamflow
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            state = json.loads(raw_state) if raw_state else {}
        except Exception:
            state = {}

        sites = "{{ inputs.site_ids }}"
        threshold = float("{{ inputs.discharge_alert_threshold_cfs }}")

        url = f"https://waterservices.usgs.gov/nwis/iv/?format=json&sites={sites}&parameterCd=00060&siteStatus=all"
        headers = {"User-Agent": "KestraHydrologyLakehouse/1.0 (water-analytics@kestra.io)"}

        records = []
        high_flow_sites = []
        new_state = dict(state)

        try:
            resp = requests.get(url, headers=headers, timeout=20)
            if resp.status_code == 200:
                data = resp.json()
                ts_list = data.get("value", {}).get("timeSeries", [])
                for ts in ts_list:
                    source_info = ts.get("sourceInfo", {})
                    site_name = source_info.get("siteName", "")
                    site_code = source_info.get("siteCode", [{}])[0].get("value", "")
                    geo = source_info.get("geoLocation", {}).get("geogLocation", {})
                    lat = float(geo.get("latitude", 0.0))
                    lon = float(geo.get("longitude", 0.0))

                    variable = ts.get("variable", {})
                    var_name = variable.get("variableName", "Discharge")
                    unit = variable.get("unit", {}).get("unitCode", "cfs")

                    values_entries = ts.get("values", [{}])[0].get("value", [])
                    latest_entry = values_entries[-1] if values_entries else {}
                    discharge_val = float(latest_entry.get("value", 0.0)) if latest_entry.get("value") else 0.0
                    obs_time = latest_entry.get("dateTime", "")

                    is_high_flow = discharge_val >= threshold
                    prior_val = state.get(site_code, discharge_val)
                    discharge_delta = discharge_val - prior_val

                    records.append({
                        "site_code": site_code,
                        "site_name": site_name,
                        "latitude": lat,
                        "longitude": lon,
                        "variable_name": var_name,
                        "discharge_cfs": discharge_val,
                        "unit": unit,
                        "observation_time": obs_time,
                        "is_high_flow": is_high_flow,
                        "discharge_delta_cfs": round(discharge_delta, 2),
                        "harvest_time": datetime.utcnow().isoformat()
                    })

                    if is_high_flow:
                        high_flow_sites.append({"site": site_name, "discharge_cfs": discharge_val})

                    new_state[site_code] = discharge_val
        except Exception as e:
            print(f"Error fetching USGS Water Services streamflow telemetry: {e}")

        with open("usgs_streamflow.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("CREATE TABLE usgs_water AS SELECT * FROM read_json_auto('usgs_streamflow.json')")
            con.execute("COPY usgs_water TO 'usgs_streamflow_audit.parquet' (FORMAT PARQUET)")
            con.execute("COPY usgs_water TO 'usgs_streamflow_audit.csv' (HEADER, DELIMITER ',')")
        else:
            con.execute("""
                CREATE TABLE usgs_water (
                    site_code VARCHAR,
                    site_name VARCHAR,
                    latitude DOUBLE,
                    longitude DOUBLE,
                    variable_name VARCHAR,
                    discharge_cfs DOUBLE,
                    unit VARCHAR,
                    observation_time VARCHAR,
                    is_high_flow BOOLEAN,
                    discharge_delta_cfs DOUBLE,
                    harvest_time VARCHAR
                )
            """)
            con.execute("COPY usgs_water TO 'usgs_streamflow_audit.parquet' (FORMAT PARQUET)")
            con.execute("COPY usgs_water TO 'usgs_streamflow_audit.csv' (HEADER, DELIMITER ',')")

        summary = {
            "monitored_stations_count": len(records),
            "high_flow_sites_count": len(high_flow_sites),
            "high_flow_sites": high_flow_sites[:5],
            "updated_state": new_state
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - usgs_streamflow_audit.parquet
      - usgs_streamflow_audit.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_streamflow.vars.updated_state | toJson }}"

  - id: check_high_flow
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_streamflow.vars.high_flow_sites_count > 0 }}"
    then:
      - id: notify_high_streamflow
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "🌊 High Streamflow Discharge Alert: {{ outputs.ingest_and_transform_streamflow.vars.high_flow_sites_count }} hydrological station(s) exceeded {{ inputs.discharge_alert_threshold_cfs }} cfs discharge rate."

outputs:
  - id: monitored_stations
    type: INT
    value: "{{ outputs.ingest_and_transform_streamflow.vars.monitored_stations_count }}"
  - id: high_flow_stations_count
    type: INT
    value: "{{ outputs.ingest_and_transform_streamflow.vars.high_flow_sites_count }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_streamflow.outputFiles['usgs_streamflow_audit.parquet'] }}"

extend:
  title: USGS Streamflow Hydrological Telemetry Lakehouse Loader with DuckDB
  metaTitle: USGS Streamflow Hydrological Lakehouse Loader | Kestra
  shortDescription: Ingests real-time hydrological streamflow observations and discharge rates from USGS Water Services into Parquet lakehouse storage via DuckDB.
  metaDescription: Poll USGS Water Services API for river discharge telemetry, convert streamflow readings into Parquet via DuckDB, and track state in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Automate the collection, geospatial harmonization, and analytical persistence of real-time river streamflow,
    hydrological discharge rates, and gauge heights from the official USGS Water Services REST API into Parquet using DuckDB.

    ## How it works

    1. **State Recovery**: Queries the Kestra KV store (`usgs_water_monitored_streamflow_state`) for previous discharge observations per monitoring station.
    2. **USGS Water Services Ingestion**: Queries the official USGS Water Services endpoint (`waterservices.usgs.gov/nwis/iv/`) for instantaneous streamflow measurements (`parameterCd=00060`).
    3. **DuckDB Hydrological Normalization**: Unpacks monitoring stations, geospatial coordinates, cubic feet per second discharge, and timestamps into a relational schema inside Docker.
    4. **Analytical Lake Export**: Exports normalized streamflow records into columnar Parquet and CSV files for flood risk modeling and water resource management.
    5. **Threshold Evaluation & State Commitment**: Detects stations breaching high-flow flood danger thresholds, issues warnings, and commits state to Kestra KV store.

    ## What you get

    - Automated, scheduled collection of institutional-grade hydrological observations.
    - Columnar Parquet datasets queryable with DuckDB, GIS toolchains, Snowflake, or ClickHouse.
    - Built-in KV state management providing idempotent execution and zero database requirements.

    ## Who it's for

    - Hydrologists and Water Resource Engineers tracking river basin flow rates.
    - Civil Protection and Emergency Management teams monitoring flood conditions.
    - Analytics Engineers building reproducible multi-cloud lakehouse pipelines.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains historical station states across runs without database infrastructure.
    - Ephemeral Docker execution guarantees reproducible, clean Python and DuckDB runtimes.
    - Declarative scheduled execution with automated error recovery and conditional logging.

    ## Prerequisites

    - Docker runner configured on the Kestra worker.
    - Outbound internet access to `waterservices.usgs.gov`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for alerting teams on high-flow streamflow events.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Set your target `site_ids` (comma-separated USGS station codes).
    3. Click **Execute** to run an immediate harvest and generate the Parquet table.
    4. Enable the `hourly_water_sync` schedule for automated hourly updates.

    ## How to extend

    - Add an S3 or Google Cloud Storage step to partition hourly streamflow observations.
    - Connect a rainfall correlation model downstream using NOAA weather precipitation data.

    ## Links

    - [USGS Water Services REST API](https://waterservices.usgs.gov/rest/IV-Service.html)
    - [DuckDB Documentation](https://duckdb.org/)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
