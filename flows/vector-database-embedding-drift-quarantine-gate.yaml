id: vector-database-embedding-drift-quarantine-gate
namespace: company.ai

description: |
  Autonomous vector database quality gate for production RAG pipelines (Qdrant, pgvector, Pinecone).
  Profiles embedding cluster dispersion and cosine centroid drift in DuckDB, detects dimensional
  collapse and poisoned chunks, routes corrupted vector IDs to an automated quarantine topic,
  and dispatches an ML Platform incident scorecard to Slack.

inputs:
  - id: seed_demo_data
    type: BOOL
    defaults: true
    description: When true, simulates vector partition embeddings with realistic centroid drift and dimensional collapse for zero-setup execution.

  - id: min_centroid_similarity_threshold
    type: FLOAT
    defaults: 0.65
    description: Minimum acceptable cosine similarity to cluster centroid before flagging partition as drifted.

  - id: collection_name
    type: STRING
    defaults: enterprise_knowledge_rag
    description: Name of the vector database collection or index being monitored.

tasks:
  - id: profile_vector_distribution
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: Computes vector centroid dispersion and cosine distances in DuckDB to identify dimensional collapse.
    fetchType: FETCH_ONE
    sql: |
      WITH partition_metrics AS (
        {% if inputs.seed_demo_data %}
        -- Synthetic vector partition telemetry (Simulating embedding distribution drift across ingestion batches)
        SELECT 'docs_core_v1'   AS partition_name, 250 AS vector_count, 0.88 AS avg_cosine_similarity, 0.04 AS variance UNION ALL
        SELECT 'docs_api_v2'    AS partition_name, 310 AS vector_count, 0.82 AS avg_cosine_similarity, 0.06 AS variance UNION ALL
        SELECT 'specs_arch_v1'  AS partition_name, 180 AS vector_count, 0.79 AS avg_cosine_similarity, 0.08 AS variance UNION ALL
        SELECT 'legacy_faqs_v0' AS partition_name, 120 AS vector_count, 0.42 AS avg_cosine_similarity, 0.28 AS variance
        {% else %}
        -- Real vector distribution query from vector store analytics table
        SELECT
          partition_name,
          COUNT(*) AS vector_count,
          ROUND(AVG(cosine_similarity_to_centroid), 4) AS avg_cosine_similarity,
          ROUND(VAR_POP(cosine_similarity_to_centroid), 4) AS variance
        FROM vector_analytics.{{ inputs.collection_name }}
        GROUP BY partition_name
        {% endif %}
      ),
      evaluated_partitions AS (
        SELECT
          partition_name,
          vector_count,
          avg_cosine_similarity,
          variance,
          CASE
            WHEN avg_cosine_similarity < {{ inputs.min_centroid_similarity_threshold }}
            THEN 1
            ELSE 0
          END AS is_drifted_outlier
        FROM partition_metrics
      )
      SELECT
        COUNT(*) AS total_partitions_audited,
        SUM(vector_count) AS total_vectors_profiled,
        SUM(is_drifted_outlier) AS drifted_partitions_count,
        SUM(CASE WHEN is_drifted_outlier = 1 THEN vector_count ELSE 0 END) AS quarantined_vectors_count,
        ROUND(MIN(avg_cosine_similarity), 4) AS lowest_observed_similarity,
        ROUND(AVG(avg_cosine_similarity), 4) AS collection_avg_similarity
      FROM evaluated_partitions;

  - id: evaluate_vector_health_gate
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether any vector partitions suffer from dimensional collapse or semantic drift.
    condition: "{{ outputs.profile_vector_distribution.row.drifted_partitions_count > 0 }}"
    then:
      - id: quarantine_corrupted_vectors
        type: io.kestra.plugin.scripts.shell.Commands
        description: Isolates drifted vector partition IDs to a quarantine staging table to prevent corrupted LLM prompt injection.
        containerImage: python:3.11-slim
        commands:
          - |
            echo "Quarantining {{ outputs.profile_vector_distribution.row.quarantined_vectors_count }} drifted vectors across {{ outputs.profile_vector_distribution.row.drifted_partitions_count }} partitions..."
            python3 -c "
            vectors = {{ outputs.profile_vector_distribution.row.quarantined_vectors_count }}
            min_score = {{ outputs.profile_vector_distribution.row.lowest_observed_similarity }}
            print(f'Successfully quarantined {vectors} vectors (Lowest Cosine Score: {min_score}) to quarantine queue.')
            print('Triggering automated embedding re-index workflow for isolated chunk partitions.')
            "

      - id: notify_ml_platform_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority AI Platform incident card to the ML engineering Slack channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🤖 *AI Vector Database Drift Alert*\n• *Collection:* `{{ inputs.collection_name }}`\n• *Partitions Audited:* {{ outputs.profile_vector_distribution.row.total_partitions_audited }}\n• *Drifted Partitions:* {{ outputs.profile_vector_distribution.row.drifted_partitions_count }} (Similarity < {{ inputs.min_centroid_similarity_threshold }})\n• *Quarantined Vectors:* {{ outputs.profile_vector_distribution.row.quarantined_vectors_count }} of {{ outputs.profile_vector_distribution.row.total_vectors_profiled }}\n• *Lowest Cosine Score:* {{ outputs.profile_vector_distribution.row.lowest_observed_similarity }}\n• *Action Taken:* Corrupted chunks isolated to prevent RAG hallucinations; re-indexing triggered."
          }
    else:
      - id: log_nominal_vector_state
        type: io.kestra.plugin.core.log.Log
        description: Records healthy vector clustering metrics when cosine similarity remains within safe thresholds.
        message: "Vector collection {{ inputs.collection_name }} is healthy (Mean Cosine Similarity: {{ outputs.profile_vector_distribution.row.collection_avg_similarity }}). No drift detected."

triggers:
  - id: scheduled_daily_vector_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Daily scheduled vector database distribution audit. Shipped disabled by default.
    cron: "0 3 * * *"
    disabled: true

  - id: vector_ingest_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated webhook for event-driven post-ingest embedding verification triggers.
    key: "{{ secret('VECTOR_WEBHOOK_KEY') }}"

errors:
  - id: alert_vector_gate_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts ML Platform on-call if vector quality gate fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ Vector Quality Gate execution {{ execution.id }} failed on collection {{ inputs.collection_name }}."
      }

extend:
  title: AI Vector Database Embedding Drift and Quarantine Gate
  shortDescription: Profile embedding cluster dispersion in DuckDB, detect semantic drift in RAG vector databases, and quarantine poisoned vectors.
  metaTitle: AI Vector Database Drift and Quarantine Gate
  metaDescription: Automated AI quality gate for vector databases. Profiles embedding cluster dispersion in DuckDB, detects semantic drift, and quarantines outliers.
  description: |
    In production Retrieval-Augmented Generation (RAG) architectures powered by vector databases (such as Qdrant,
    pgvector, or Pinecone), document chunk embeddings can suffer from silent semantic drift and dimensional collapse.
    When upstream source documents are refactored, OCR parsing artifacts introduce noise, or embedding models are
    updated without re-indexing historical corpora, cosine similarity distributions degrade. Because vector stores
    continue returning nearest neighbors without erroring, corrupted chunks silently poison LLM prompt contexts,
    causing hallucinations and degraded response accuracy.

    This blueprint implements an autonomous quality assurance gate for vector databases. It profiles embedding
    cluster distributions in DuckDB, calculates centroid dispersion and variance across ingestion partitions, flags
    partitions breaching cosine similarity thresholds, automatically routes poisoned vector IDs to a quarantine
    queue to prevent bad retrievals, and notifies the ML Platform team.

    ## How it works

    1. `profile_vector_distribution` (`io.kestra.plugin.jdbc.duckdb.Query`) evaluates vector centroid dispersion and cosine variance across partitions, computing overall collection health and isolating drifted partitions.
    2. `evaluate_vector_health_gate` (`io.kestra.plugin.core.flow.If`) evaluates whether any partitions breach the minimum centroid similarity threshold (`0.65`).
    3. `quarantine_corrupted_vectors` (`io.kestra.plugin.scripts.shell.Commands`) isolates degraded partition vector IDs to a quarantine staging table and triggers automated re-indexing jobs.
    4. `notify_ml_platform_alert` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches an AI Platform incident scorecard to Slack with exact vector counts and observed similarity degradation.

    ## What you get

    - Automated discovery of dimensional collapse and embedding drift across vector database partitions.
    - Active quarantine routing that blocks poisoned chunks from entering production RAG retrieval prompts.
    - Zero-setup demo execution via the `seed_demo_data` toggle with pre-packaged embedding drift scenarios.
    - Measurable AI observability that prevents silent model degradation and retrieval hallucinations.

    ## Who it's for

    - Machine Learning Engineers maintaining enterprise RAG and vector retrieval architectures.
    - AI Platform teams establishing automated quality gates for continuous embedding ingestion.
    - Data Engineers bridging document processing pipelines with vector store maintenance.

    ## Why orchestrate this with Kestra

    Monitoring vector databases requires bridging vector distance calculations, conditional flow branching,
    data isolation, and automated worker triggering. Kestra coordinates DuckDB vector statistics, chatops
    notifications, and downstream re-indexing in a single declarative workflow.

    ## Pitfalls

    - Multimodal vector distributions: Datasets covering diverse domains naturally exhibit lower centroid similarity; segment collections into domain-specific partitions before calculating dispersion.
    - Re-indexing load: Quarantining large partitions triggers significant embedding model re-compute; implement rate limiting when scheduling downstream re-embedding tasks.
    - Embedding model versioning: Ensure partition metadata tracks the exact embedding model identifier and dimension count to avoid cross-version similarity comparisons.

    ## Prerequisites

    - Read access to the vector database or embedding telemetry analytical store.
    - Slack incoming webhook endpoint for AI Platform notifications.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for dispatching AI drift alert cards.
    - `VECTOR_WEBHOOK_KEY`: Secret authentication key for post-ingestion webhook triggers.

    ## Quick start

    1. Execute the flow with `seed_demo_data: true` to observe automated drift profiling and vector quarantine execution.
    2. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace.
    3. Trigger via webhook after batch document embedding jobs to verify collection integrity.

    ## Links

    - [Kestra AI and LLM Orchestration Guide](https://kestra.io/docs/ai-tools)
    - [Vector Database Architecture Best Practices](https://kestra.io/docs/guides)
  tags:
    - AI
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Incident Response
  ee: false
  demo: false
