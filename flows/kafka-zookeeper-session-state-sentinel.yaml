id: kafka-zookeeper-session-state-sentinel
namespace: company.data

inputs:
  - id: kafka_bootstrap_servers
    type: STRING
    defaults: "kafka:9092"
    description: Apache Kafka bootstrap servers connection string.
  - id: kafka_image
    type: STRING
    defaults: apache/kafka:3.9.0
    description: Container image containing kafka-metadata-quorum.sh.

tasks:
  - id: check_metadata_quorum_status
    type: io.kestra.plugin.scripts.shell.Commands
    description: Describe KRaft or ZooKeeper metadata quorum status.
    containerImage: "{{ inputs.kafka_image }}"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: host
    outputFiles:
      - quorum_health.json
    commands:
      - |
        set -euo pipefail
        CMD_EXIT=0
        OUT=$(/opt/kafka/bin/kafka-metadata-quorum.sh --bootstrap-server "{{ inputs.kafka_bootstrap_servers }}" describe --status 2>&1) || CMD_EXIT=$?
        printf '%s\n' "$OUT"

        if [ $CMD_EXIT -ne 0 ] || printf '%s' "$OUT" | grep -iqE "Exception|Error:"; then
          echo "ERROR: kafka-metadata-quorum.sh failed with exit code $CMD_EXIT" >&2
          exit 1
        fi

        LEADER_ID=$(printf '%s\n' "$OUT" | grep -E 'LeaderId:' | awk '{print $2}' || echo "-1")
        LEADER_ID=${LEADER_ID:--1}
        VOTERS_COUNT=$(printf '%s\n' "$OUT" | grep -E 'Voters:' | grep -o 'id:' | wc -l | tr -d ' ' || echo "0")
        VOTERS_COUNT=${VOTERS_COUNT:-0}

        cat <<EOF > quorum_health.json
        {
          "leader_id": $LEADER_ID,
          "voters_count": $VOTERS_COUNT
        }
        EOF

        printf '::{"outputs":{"leader_id":%d,"voters_count":%d}}::\n' "$LEADER_ID" "$VOTERS_COUNT"

  - id: evaluate_quorum_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.check_metadata_quorum_status.vars.leader_id | int == -1 or outputs.check_metadata_quorum_status.vars.voters_count | int == 0 }}"
    then:
      - id: notify_streaming_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#kafka-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Kafka Metadata Quorum Session Failure Alert",
                "text": "Kafka cluster `{{ inputs.kafka_bootstrap_servers }}` metadata quorum is in an unready state! LeaderId: *{{ outputs.check_metadata_quorum_status.vars.leader_id }}*, Active Voters: *{{ outputs.check_metadata_quorum_status.vars.voters_count }}*. Impact: Controller quorum loss halts partition leader elections and topic metadata synchronization across the cluster.",
                "footer": "Kestra Streaming Sentinel • Apache Kafka"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#kafka-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Apache Kafka Metadata Quorum and Coordinator Session Sentinel Pipeline Failure",
            "text": "Failed to describe Kafka metadata quorum. Check bootstrap servers connectivity and network security groups.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

outputs:
  - id: leader_id
    type: INT
    description: Current metadata quorum leader broker ID.
    value: "{{ outputs.check_metadata_quorum_status.vars.leader_id }}"
  - id: voters_count
    type: INT
    description: Count of active quorum voter nodes.
    value: "{{ outputs.check_metadata_quorum_status.vars.voters_count }}"

extend:
  metaDescription: "Audits Apache Kafka metadata quorum and coordination state to detect voter disconnects and session expirations."
  metaTitle: Apache Kafka Metadata Quorum and Coordinator Session Sentinel with Kestra
  title: Apache Kafka Metadata Quorum and Coordinator Session Sentinel
  shortDescription: Audits Apache Kafka metadata quorum and coordination state to detect voter disconnects and session expirations.
  description: |
    ## How it works
    This workflow executes `kafka-metadata-quorum.sh --bootstrap-server <bootstrap> describe --status` against the target cluster to audit the metadata coordination state. In modern KRaft and ZooKeeper hybrid architectures, metadata quorum loss prevents partition elections, metadata propagation, and topic creations. When no active leader is present or voters disconnect, an immediate alert is dispatched to Slack.

    ## What you get
    - Continuous validation of Kafka KRaft metadata quorum leader status.
    - Early detection of controller partition isolates and voter disconnects.
    - Elimination of silent cluster management lockups.

    ## Who it's for
    - Kafka Platform Operators and Infrastructure Engineers managing KRaft clusters.
    - SREs maintaining distributed event-driven enterprise architectures.

    ## Why orchestrate this with Kestra
    - **Official CLI Execution**: Uses official Kafka CLI utilities in containerized environments.
    - **Comprehensive Quorum Inspection**: Validates voter counts and leader election status.
    - **Reliable Automation**: Schedule checks every 15 minutes without maintaining custom daemons.

    ## Prerequisites
    - Apache Kafka cluster (KRaft or ZooKeeper-backed) accessible to the Kestra worker.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Set `kafka_bootstrap_servers`.
    3. Run the workflow to inspect metadata quorum health.

    ## How to extend
    - Inspect high-watermark lag across metadata observers.
    - Check ZooKeeper 4-letter-word commands (`ruok`, `stat`) for ZooKeeper-backed deployments.

    ## Links
    - [Apache Kafka KRaft Documentation](https://kafka.apache.org/documentation/#kraft)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Realtime & Streaming
    - ELT & Data Landing
  ee: false
  demo: false
