id: kafka-zookeeper-session-state-sentinel
namespace: company.data

inputs:
  - id: kafka_bootstrap_servers
    type: STRING
    defaults: "kafka:9092"
    description: Apache Kafka bootstrap servers connection string.

tasks:
  - id: check_metadata_quorum_status
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: confluentinc/cp-kafka:7.5.0
    commands:
      - |
        kafka-metadata-quorum --bootstrap-server "{{ inputs.kafka_bootstrap_servers }}" describe --status > /tmp/quorum_status.txt 2>&1
        
        cat /tmp/quorum_status.txt
        
        LEADER_ID=$(grep -E 'LeaderId:' /tmp/quorum_status.txt | awk '{print $2}')
        LEADER_ID=${LEADER_ID:--1}
        
        VOTERS_COUNT=$(grep -E 'Voters:' /tmp/quorum_status.txt | grep -o 'id:' | wc -l | awk '{print $1}')
        
        echo "::set-output name=leader_id::$LEADER_ID::"
        echo "::set-output name=voters_count::$VOTERS_COUNT::"

  - id: evaluate_quorum_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.check_metadata_quorum_status.vars.leader_id | int == -1 or outputs.check_metadata_quorum_status.vars.voters_count | int == 0 }}"
    then:
      - id: notify_streaming_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#kafka-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Kafka Metadata Quorum Session Failure Alert",
                "text": "Kafka cluster `{{ inputs.kafka_bootstrap_servers }}` metadata quorum is in an unready state! LeaderId: *{{ outputs.check_metadata_quorum_status.vars.leader_id }}*, Active Voters: *{{ outputs.check_metadata_quorum_status.vars.voters_count }}*. Impact: Controller quorum loss halts partition leader elections and topic metadata synchronization across the cluster.",
                "footer": "Kestra Streaming Sentinel • Apache Kafka"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#kafka-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Apache Kafka Metadata Quorum and Coordinator Session Sentinel Pipeline Failure",
            "text": "Failed to describe Kafka metadata quorum. Check bootstrap servers connectivity and network security groups.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Apache Kafka Metadata Quorum and Coordinator Session Sentinel
  shortDescription: Audits Apache Kafka metadata quorum and coordination state to detect voter disconnects and session expirations.
  description: |
    ## How it works
    This workflow executes `kafka-metadata-quorum --bootstrap-server <bootstrap> describe --status` against the target cluster to audit the metadata coordination state. In modern KRaft and ZooKeeper hybrid architectures, metadata quorum loss prevents partition elections, metadata propagation, and topic creations. When no active leader is present or voters disconnect, an immediate alert is dispatched to Slack.

    ## What you get
    - Continuous validation of Kafka KRaft metadata quorum leader status.
    - Early detection of controller partition isolates and voter disconnects.
    - Elimination of silent cluster management lockups.

    ## Who it's for
    - Kafka Platform Operators and Infrastructure Engineers managing KRaft clusters.
    - SREs maintaining distributed event-driven enterprise architectures.

    ## Why orchestrate this with Kestra
    - **Official CLI Execution**: Uses official Kafka CLI utilities in containerized environments.
    - **Comprehensive Quorum Inspection**: Validates voter counts and leader election status.
    - **Reliable Automation**: Schedule checks every 15 minutes without maintaining custom daemons.

    ## Prerequisites
    - Apache Kafka cluster (KRaft or ZooKeeper-backed) accessible to the Kestra worker.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Set `kafka_bootstrap_servers`.
    3. Run the workflow to inspect metadata quorum health.

    ## How to extend
    - Inspect high-watermark lag across metadata observers.
    - Check ZooKeeper 4-letter-word commands (`ruok`, `stat`) for ZooKeeper-backed deployments.

    ## Links
    - [Apache Kafka KRaft Documentation](https://kafka.apache.org/documentation/#kraft)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Data
    - Infrastructure
  ee: false
  demo: false
