id: amqp-consumer-dead-letter-queue
namespace: company.team
description: |
  Consume order events from a RabbitMQ queue in real time, validate each message, forward
  valid orders to a downstream API, and route anything that fails validation or delivery to
  a self-provisioned dead letter exchange instead of losing the message or blocking the queue.

pluginDefaults:
  - type: io.kestra.plugin.amqp
    values:
      host: "{{ secret('RABBITMQ_HOST') }}"
      port: "{{ secret('RABBITMQ_PORT') }}"
      username: "{{ secret('RABBITMQ_USERNAME') }}"
      password: "{{ secret('RABBITMQ_PASSWORD') }}"
      virtualHost: "{{ secret('RABBITMQ_VHOST') }}"

tasks:
  - id: declare_dead_letter_exchange
    type: io.kestra.plugin.amqp.DeclareExchange
    description: Idempotently declare the fanout exchange that collects every message this flow cannot process.
    name: orders.dlx
    exchangeType: FANOUT

  - id: create_dead_letter_queue
    type: io.kestra.plugin.amqp.CreateQueue
    description: Idempotently create the durable queue backing the dead letter exchange.
    name: orders.dlq

  - id: bind_dead_letter_queue
    type: io.kestra.plugin.amqp.QueueBind
    description: Bind the dead letter queue to the dead letter exchange so every rejected message lands there.
    exchange: orders.dlx
    queue: orders.dlq

  - id: log_order
    type: io.kestra.plugin.core.log.Log
    description: Record the incoming order for traceability before validation.
    message: "Received order message: {{ trigger.data }}"

  - id: assert_valid_order
    type: io.kestra.plugin.core.execution.Fail
    description: Treat a message missing the fields downstream processing requires as a poison message, stopping the flow so the errors block can dead letter it.
    condition: "{{ (trigger.data.order_id is not defined) or (trigger.data.amount is not defined) }}"
    errorMessage: "Order message is missing order_id or amount: {{ trigger.data }}"

  - id: process_order
    type: io.kestra.plugin.core.http.Request
    description: Forward the validated order to the downstream order processing API; a non-2xx response fails the task the same way an invalid message does.
    uri: "{{ secret('ORDERS_API_URL') }}"
    method: POST
    headers:
      Content-Type: "application/json"
    body: "{{ trigger.data | json }}"

errors:
  - id: publish_to_dead_letter
    type: io.kestra.plugin.amqp.Publish
    description: Publish the original message that failed validation or downstream delivery to the dead letter exchange, tagged with the execution that rejected it.
    exchange: orders.dlx
    serdeType: JSON
    from:
      data: "{{ trigger.data }}"
      headers:
        failedExecutionId: "{{ execution.id }}"
        sourceQueue: orders.queue

triggers:
  - id: on_new_order
    type: io.kestra.plugin.amqp.RealtimeTrigger
    description: Stream one execution per message from the orders queue as soon as it arrives.
    queue: orders.queue
    serdeType: JSON

extend:
  title: Consume RabbitMQ orders with dead letter queue handling
  shortDescription: Stream RabbitMQ order messages into real-time executions, validate and forward them to an API, and route failures to a self-provisioned dead letter exchange.
  metaTitle: RabbitMQ Consumer with Dead Letter Queue Handling and Kestra
  metaDescription: Consume RabbitMQ messages in real time with Kestra, validate and forward orders to an API, and automatically dead letter failed or invalid messages.
  description: |
    Give every RabbitMQ order message a traceable, retryable home instead of an opaque consumer process. This blueprint streams messages from an `orders.queue` queue one execution at a time, validates each payload, forwards valid orders to a downstream API, and republishes anything that fails, whether from bad data or a failed API call, to a dead letter exchange it provisions on its own. No message is ever silently dropped or left stuck at the head of the queue.

    ## How it works

    1. `io.kestra.plugin.amqp.RealtimeTrigger` (`on_new_order`) opens a manual-ack subscription on the `orders.queue` queue with `serdeType: JSON`, launching one execution the moment a message arrives and exposing its deserialized body as `trigger.data`.
    2. `declare_dead_letter_exchange` (`io.kestra.plugin.amqp.DeclareExchange`) idempotently declares a `FANOUT` exchange named `orders.dlx`.
    3. `create_dead_letter_queue` (`io.kestra.plugin.amqp.CreateQueue`) idempotently creates the durable `orders.dlq` queue.
    4. `bind_dead_letter_queue` (`io.kestra.plugin.amqp.QueueBind`) binds `orders.dlq` to `orders.dlx`, so anything published to the exchange lands in the queue. All three provisioning calls are safe to repeat on every execution, since RabbitMQ treats a declare or bind of something that already exists as a no-op.
    5. `log_order` (`io.kestra.plugin.core.log.Log`) records the raw message for traceability.
    6. `assert_valid_order` (`io.kestra.plugin.core.execution.Fail`) checks the deserialized payload for `order_id` and `amount`; a message missing either field fails the execution immediately instead of reaching the downstream API.
    7. `process_order` (`io.kestra.plugin.core.http.Request`) POSTs the order to the downstream order processing API; a non-2xx response fails the task the same way an invalid message does.
    8. A flow-level `errors` block runs `publish_to_dead_letter` (`io.kestra.plugin.amqp.Publish`), which republishes the original `trigger.data` to `orders.dlx` with a `failedExecutionId` header, whether the failure came from validation or from the API call.

    ## What you get

    - One Kestra execution per RabbitMQ message, with full run history, logs, and retries for every order instead of an opaque consumer process.
    - A self-provisioning dead letter exchange and queue that a fresh environment can bootstrap without a separate setup script.
    - A single validation gate that rejects malformed messages before they reach the downstream API, plus one `errors` block that dead letters both validation failures and API failures.
    - A `failedExecutionId` header on every dead-lettered message, so a person or a follow-up flow can look up exactly which execution rejected it.

    ## Who it's for

    - Backend and platform teams running RabbitMQ who need poison-message handling without writing a custom consumer.
    - Data engineers bridging event queues into REST APIs or databases who want per-message observability.
    - Teams migrating off ad hoc consumer scripts (pika, amqplib) that have no retry, replay, or dead-lettering built in.

    ## Why orchestrate this with Kestra

    RabbitMQ can enforce dead-lettering natively with an `x-dead-letter-exchange` policy, but that keeps failure handling implicit and invisible outside the broker. Kestra's `errors` block makes the same pattern explicit and observable: every rejected message is tied to a specific execution, with logs, the exact validation or HTTP failure, and a full replay history. The `RealtimeTrigger` also removes the need to write and operate a long-running consumer process at all, since Kestra manages the subscription, retries, and concurrency for you.

    ## Prerequisites

    - A running RabbitMQ broker with an existing `orders.queue` queue that upstream producers publish to.
    - A downstream order processing API that accepts a JSON POST body.

    ### Secrets

    - `RABBITMQ_HOST`, `RABBITMQ_PORT`, `RABBITMQ_USERNAME`, `RABBITMQ_PASSWORD`, `RABBITMQ_VHOST`: broker connection details.
    - `ORDERS_API_URL`: endpoint of the downstream order processing API.

    ## Quick start

    1. Add the secrets above to your Kestra namespace.
    2. Confirm `orders.queue` exists and something publishes order messages to it (see the `produce-to-rabbitmq` blueprint for a producer pattern).
    3. Add this flow. On its first execution it creates `orders.dlx` and `orders.dlq` and binds them together.
    4. Publish a message missing `amount` to `orders.queue` and confirm it appears in `orders.dlq` instead of failing silently.

    ## How to extend

    - Move the three provisioning tasks into a separate one-time setup flow if you would rather not repeat idempotent declare calls on every message.
    - Add a retry policy to `process_order` so a transient API failure does not immediately dead letter a valid order.
    - Swap the `FANOUT` exchange for a `TOPIC` exchange with a routing key to split dead letters by failure type.
    - Chain a scheduled flow that periodically drains `orders.dlq` with `io.kestra.plugin.amqp.Consume` and reprocesses or archives the failed messages.

    ## Links

    - Kestra AMQP plugin: https://kestra.io/plugins/plugin-amqp
  tags:
    - Data
    - Realtime Events
    - Infrastructure Automation
  ee: false
  demo: false
