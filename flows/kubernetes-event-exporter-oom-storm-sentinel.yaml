id: kubernetes-event-exporter-oom-storm-sentinel
namespace: company.ops

inputs:
  - id: namespace
    type: STRING
    defaults: "default"
    description: Kubernetes namespace to audit for OOMKilled pod events.
  - id: oom_event_threshold
    type: INT
    defaults: 5
    description: Maximum acceptable count of OOMKilled termination events in the last 15 minutes.

tasks:
  - id: query_oom_events
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: bitnami/kubectl:latest
    commands:
      - |
        kubectl get events -n "{{ inputs.namespace }}" --field-selector reason=OOMKilled -o json > /tmp/oom_events.json
        
        OOM_COUNT=$(jq '.items | length // 0' /tmp/oom_events.json)
        
        echo "::set-output name=oom_count::$OOM_COUNT::"

  - id: evaluate_oom_storm
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_oom_events.vars.oom_count | int >= inputs.oom_event_threshold }}"
    then:
      - id: notify_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#kubernetes-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Kubernetes OOMKilled Pod Termination Storm Alert",
                "text": "Namespace `{{ inputs.namespace }}` recorded *{{ outputs.query_oom_events.vars.oom_count }}* container terminations due to OOMKilled! Impact: Pods are being terminated by the Linux kernel cgroup OOM killer due to memory exhaustion, triggering CrashLoopBackOff cascades and customer service downtime.",
                "footer": "Kestra Kubernetes Sentinel • OOMKilled"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#kubernetes-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Kubernetes OOMKilled Pod Termination Storm Sentinel Pipeline Failure",
            "text": "Failed to query Kubernetes events for OOMKilled terminations. Verify cluster RBAC permissions.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Kubernetes core events to detect cluster-wide OOMKilled container termination storms and memory thrashing."
  metaTitle: Kubernetes OOMKilled Pod Termination Storm Sentinel with Kestra
  title: Kubernetes OOMKilled Pod Termination Storm Sentinel
  shortDescription: Audits Kubernetes core events to detect cluster-wide OOMKilled container termination storms and memory thrashing.
  description: |
    ## How it works
    This workflow executes `kubectl get events --field-selector reason=OOMKilled -o json` to detect memory ceiling terminations within the target namespace. When container memory consumption exceeds configured `resources.limits.memory`, the Linux kernel cgroup killer abruptly terminates the offending process with exit code 137. If an OOM storm crosses the threshold, an immediate incident alert is dispatched to Slack.

    ## What you get
    - Immediate detection of cascading container OOMKilled crash loops.
    - Prevents silent microservice outages and service disruption.
    - Clear visibility into impacted workloads and termination frequency.

    ## Who it's for
    - SREs and Kubernetes Platform Engineers ensuring workload stability.
    - DevOps engineers setting container resource quotas and memory limits.

    ## Why orchestrate this with Kestra
    - **Targeted Event Filtering**: Uses official Kubernetes API field selectors directly.
    - **Proactive Incident Escalation**: Catches memory spikes before entire worker nodes experience memory pressure.
    - **Zero Agent Daemon**: Executes via lightweight standard kubectl container image.

    ## Prerequisites
    - Kubernetes cluster with read access to Events API in the target namespace.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Configure namespace and event threshold.
    3. Run the workflow to inspect container memory terminations.

    ## How to extend
    - Automatically trigger Vertical Pod Autoscaler (VPA) limit recommendations for failing pods.
    - Export OOM event history to Grafana or Loki for longitudinal analysis.

    ## Links
    - [Kubernetes Container Lifecycle and OOM Documentation](https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Kubernetes Operations
    - Day 2 Operations
  ee: false
  demo: false
