    - [AnsibleCLI task reference](https://kestra.io/plugins/plugin-ansible/tasks/cli/io.kestra.plugin.ansible.cli.ansiblecli)
    - [Ansible check mode](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_checkmode.html)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
    - [Sibling blueprint: ansible-config-drift](https://github.com/kestra-io/blueprints/blob/main/flows/ansible-config-drift.yaml)
  tags:
    - Infrastructure
    - Core
  subTags:
    - Infrastructure Automation
    - Day 2 Operations
  ee: false
  demo: false
