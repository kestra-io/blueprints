          import sys
          import urllib.request

          from PIL import Image, ImageDraw, ImageFont

          W, H = 1200, 630
          SS = 2  # supersample factor

          TITLE = (os.environ.get("TITLE") or "").strip()
          if not TITLE:
              sys.exit("TITLE must not be empty")
          SUBTITLE = (os.environ.get("SUBTITLE") or "").strip()
          KICKER = (os.environ.get("KICKER") or "").strip()
          FOOTER = (os.environ.get("FOOTER") or "").strip()
          ACCENT = (os.environ.get("ACCENT") or "#7C5CFF").strip()
          THEME = (os.environ.get("THEME") or "light").strip().lower()
          OUT = os.environ.get("OUT") or f"og-card-{THEME}.png"
          MAX_TITLE_CHARS = 220

          PALETTES = {
              "light": {"bg": "#FBFAF7", "fg": "#17181C", "muted": "#5B5E66", "faint": "#E7E5DF"},
              "dark": {"bg": "#0E1014", "fg": "#F5F4F0", "muted": "#9BA0AA", "faint": "#23262E"},
          }
          if THEME not in PALETTES:
              sys.exit(f"THEME must be one of {sorted(PALETTES)}, got {THEME!r}")
          PAL = PALETTES[THEME]

          FONT_URL = (
              "https://raw.githubusercontent.com/google/fonts/main/ofl/inter/"
              "Inter%5Bopsz%2Cwght%5D.ttf"
          )


          def load_font(size_px: int, weight: int) -> ImageFont.FreeTypeFont:
              """Inter variable (downloaded once), else DejaVu, else PIL default."""
              path = "/tmp/Inter-Variable.ttf"
              if not os.path.exists(path):
