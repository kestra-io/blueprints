id: kestra-flow-health-scorecard
namespace: company.team

inputs:
  - id: target_namespace
    type: STRING
    displayName: Namespace to audit
    description: Every flow in this namespace and its children is scored.
    defaults: company

  - id: lookback
    type: DURATION
    displayName: Lookback window
    description: History used as the baseline.
    defaults: P14D

  - id: recent_window
    type: DURATION
    displayName: Recent window
    description: The most recent slice, compared with the rest of the lookback.
    defaults: P1D

  - id: failure_spike_points
    type: FLOAT
    displayName: Failure spike (points)
    description: Flag a flow when its recent failure rate is this much higher than its baseline, for example 0.25 means 25 percentage points.
    defaults: 0.25

  - id: slowdown_ratio
    type: FLOAT
    displayName: Slowdown ratio
    description: Flag a flow when the p95 duration of its recent successful runs is this many times its baseline p95.
    defaults: 1.5

  - id: min_runs
    type: INT
    displayName: Minimum runs per window
    description: A window with fewer runs is too small to compare and is skipped for spikes and slowdowns.
    defaults: 3

  - id: kestra_url
    type: STRING
    displayName: Kestra API URL
    description: Reachable from the worker. In a standalone or docker compose setup, localhost works.
    defaults: http://localhost:8080

  - id: fail_on_findings
    type: BOOL
    displayName: Fail on findings
    description: End the run as FAILED when a flow is flagged, so it shows red and can trigger your failure alerts.
    defaults: true

variables:
  report_path: "health/{{ inputs.target_namespace }}-scorecard.md"

triggers:
  - id: hourly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "5 * * * *"

tasks:
  - id: score
    type: io.kestra.plugin.scripts.python.Script
    description: >
      Page through the flows and the executions of the lookback window from the Kestra API, then score each
      flow on four signals: a failure-rate spike, a p95 slowdown, a schedule with no success
      in the whole lookback, and a schedule that never ran. Standard library only.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: host
    outputFiles:
      - scorecard.md
    env:
      KESTRA_URL: "{{ inputs.kestra_url }}"
      KESTRA_USERNAME: "{{ secret('KESTRA_USERNAME') }}"
      KESTRA_PASSWORD: "{{ secret('KESTRA_PASSWORD') }}"
      NAMESPACE: "{{ inputs.target_namespace }}"
      LOOKBACK: "{{ inputs.lookback }}"
      RECENT: "{{ inputs.recent_window }}"
      SPIKE: "{{ inputs.failure_spike_points }}"
      SLOWDOWN: "{{ inputs.slowdown_ratio }}"
      MIN_RUNS: "{{ inputs.min_runs }}"
      SELF: "{{ flow.namespace }}.{{ flow.id }}"
    script: |
      import base64, json, os, re, urllib.parse, urllib.request
      from datetime import datetime, timedelta, timezone

      def iso_duration(s):
          # DURATION inputs render as seconds, execution durations as ISO 8601.
          if re.fullmatch(r"[\d.]+", s):
              return timedelta(seconds=float(s))
          m = re.fullmatch(r"P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?(?:([\d.]+)S)?)?", s)
          d, h, mi, se = (float(x) if x else 0 for x in m.groups())
          return timedelta(days=d, hours=h, minutes=mi, seconds=se)

      now = datetime.now(timezone.utc)
      start = now - iso_duration(os.environ["LOOKBACK"])
      recent_start = now - iso_duration(os.environ["RECENT"])
      spike, slowdown, min_runs = float(os.environ["SPIKE"]), float(os.environ["SLOWDOWN"]), int(os.environ["MIN_RUNS"])
      auth = base64.b64encode(f"{os.environ['KESTRA_USERNAME']}:{os.environ['KESTRA_PASSWORD']}".encode()).decode()

      def get(path, params):
          url = f"{os.environ['KESTRA_URL']}{path}?{urllib.parse.urlencode(params)}"
          req = urllib.request.Request(url, headers={"Authorization": f"Basic {auth}"})
          return json.load(urllib.request.urlopen(req, timeout=30))

      def paged(path, filters):
          items, page = [], 1
          while True:
              body = get(path, {"page": page, "size": 100, **filters})
              items += body["results"]
              if page * 100 >= body["total"] or not body["results"]:
                  return items
              page += 1

      # Flows of the namespace and every child namespace, with their triggers.
      flows = paged("/api/v1/main/flows/search", {"filters[namespace][STARTS_WITH]": os.environ["NAMESPACE"]})
      executions, page = [], 1
      while True:
          body = get("/api/v1/main/executions/search", {
              "page": page, "size": 100,
              "filters[namespace][STARTS_WITH]": os.environ["NAMESPACE"],
              "filters[startDate][GREATER_THAN_OR_EQUAL_TO]": start.isoformat(),
          })
          executions += body["results"]
          if page * 100 >= body["total"] or not body["results"]:
              break
          page += 1

      def p95(values):
          values = sorted(values)
          return values[min(len(values) - 1, int(round(0.95 * (len(values) - 1))))] if values else None

      def seconds(e):
          d = e["state"].get("duration")
          return iso_duration(d).total_seconds() if d else None

      terminal = {"SUCCESS", "FAILED", "WARNING", "KILLED", "CANCELLED"}
      by_flow = {}
      for e in executions:
          if e["state"]["current"] in terminal:
              by_flow.setdefault(f"{e['namespace']}.{e['flowId']}", []).append(e)

      rows, findings = [], []
      for f in flows:
          key = f"{f['namespace']}.{f['id']}"
          if key == os.environ["SELF"]:
              continue
          runs = by_flow.get(key, [])
          started = lambda e: datetime.fromisoformat(e["state"]["startDate"].replace("Z", "+00:00"))
          recent = [e for e in runs if started(e) >= recent_start]
          base = [e for e in runs if started(e) < recent_start]
          fail = lambda xs: sum(e["state"]["current"] != "SUCCESS" for e in xs) / len(xs) if xs else None
          dur = lambda xs: p95([seconds(e) for e in xs if e["state"]["current"] == "SUCCESS" and seconds(e) is not None])
          scheduled = any(t.get("type", "").endswith(".Schedule") and not t.get("disabled") for t in f.get("triggers") or [])
          fr, fb, dr, db = fail(recent), fail(base), dur(recent), dur(base)
          flags = []
          if len(recent) >= min_runs and len(base) >= min_runs and fr - fb >= spike:
              flags.append(f"FAILURE_SPIKE {fb:.0%} to {fr:.0%}")
          if dr and db and len(recent) >= min_runs and len(base) >= min_runs and dr > db * slowdown:
              flags.append(f"SLOWDOWN p95 {db:.1f}s to {dr:.1f}s")
          if scheduled and runs and not any(e["state"]["current"] == "SUCCESS" for e in runs):
              flags.append("SCHEDULED_NO_SUCCESS")
          if scheduled and not runs:
              flags.append("SCHEDULED_NEVER_RAN")
          rows.append((key, len(base), len(recent), fb, fr, db, dr, flags))
          findings += [f"{key}: {x}" for x in flags]

      fmt = lambda v, pct=False: "-" if v is None else (f"{v:.0%}" if pct else f"{v:.1f}s")
      lines = [f"# Flow health: {os.environ['NAMESPACE']}", "",
               f"{len(executions)} executions since {start:%Y-%m-%d %H:%M} UTC, recent window since {recent_start:%Y-%m-%d %H:%M} UTC.", "",
               "| flow | runs base / recent | failure rate base / recent | p95 base / recent | findings |", "|---|---|---|---|---|"]
      for key, nb, nr, fb, fr, db, dr, flags in sorted(rows, key=lambda r: (not r[7], r[0])):
          lines.append(f"| `{key}` | {nb} / {nr} | {fmt(fb, True)} / {fmt(fr, True)} | {fmt(db)} / {fmt(dr)} | {', '.join(flags) or 'ok'} |")
      report = "\n".join(lines)
      open("scorecard.md", "w").write(report + "\n")
      print(report)
      print("::" + json.dumps({"outputs": {"flows": len(rows), "executions": len(executions),
                                           "flagged": len({f.split(':')[0] for f in findings}), "findings": "; ".join(findings)}}) + "::")

  - id: publish_scorecard
    type: io.kestra.plugin.core.namespace.UploadFiles
    description: The latest scorecard, readable in the namespace Files tab.
    namespace: "{{ flow.namespace }}"
    filesMap:
      "{{ render(vars.report_path) }}": "{{ outputs.score.outputFiles['scorecard.md'] }}"

  - id: verdict
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.score.vars.flagged > 0 }}"
    then:
      - id: log_findings
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "{{ outputs.score.vars.flagged }} of {{ outputs.score.vars.flows }} flows need attention: {{ outputs.score.vars.findings }}"
      - id: fail_if_requested
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.fail_on_findings }}"
        then:
          - id: flag_run
            type: io.kestra.plugin.core.execution.Fail
            errorMessage: "Flow health degraded in {{ inputs.target_namespace }}: {{ outputs.score.vars.findings }}"
    else:
      - id: log_healthy
        type: io.kestra.plugin.core.log.Log
        message: "All {{ outputs.score.vars.flows }} flows in {{ inputs.target_namespace }} are healthy across {{ outputs.score.vars.executions }} executions."

extend:
  title: Score every flow in a namespace for failure spikes, slowdowns and silent schedules
  metaTitle: Kestra flow health scorecard from execution history
  shortDescription: Read your own Kestra execution history, compare each flow's recent window with its baseline, then flag failure spikes, p95 slowdowns and schedules that never succeed or never run.
  metaDescription: Audit your Kestra flows from execution history. Flag failure-rate spikes, p95 slowdowns, schedules with no success and schedules that never ran.
  description: |
    A failure alert tells you that one execution failed. It cannot tell you that a flow which used to fail 2% of the time now fails 40%, that a nightly job got three times slower over a week, or that a schedule has not succeeded in fourteen days because every run fails the same way. This flow reads the execution history of a namespace and its children from the Kestra API, compares each flow's **recent window** with its **baseline**, and publishes a scorecard with four signals:
    - `FAILURE_SPIKE`: the recent failure rate is at least `failure_spike_points` above the baseline rate.
    - `SLOWDOWN`: the recent p95 duration of successful runs is more than `slowdown_ratio` times the baseline p95.
    - `SCHEDULED_NO_SUCCESS`: the flow has an enabled Schedule trigger, ran in the lookback, and never succeeded.
    - `SCHEDULED_NEVER_RAN`: the flow has an enabled Schedule trigger and no execution at all in the lookback.

    Windows with fewer than `min_runs` runs are not compared, so a single failure cannot raise a spike.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## How it works

    1. `score` (`io.kestra.plugin.scripts.python.Script`, Python standard library only) pages through `GET /api/v1/main/flows/search` and `GET /api/v1/main/executions/search`, filtered with `STARTS_WITH` on the namespace and on the lookback start date. It computes the signals per flow and writes `scorecard.md`, a table of runs, failure rates and p95 per window. It outputs `flows`, `executions`, `flagged` and `findings`. The scorecard flow itself is excluded.
    2. `publish_scorecard` (`io.kestra.plugin.core.namespace.UploadFiles`) writes `health/<namespace>-scorecard.md`.
    3. `verdict` (`io.kestra.plugin.core.flow.If`):
       - With findings: logs them at WARN level, then `flag_run` (`io.kestra.plugin.core.execution.Fail`) ends the run as `FAILED` when `fail_on_findings` is on. Your existing failure alert flows then route it.
       - Without findings: logs that all flows are healthy.
    4. `hourly` (`io.kestra.plugin.core.trigger.Schedule`).

    ## Tested on a live instance

    I seeded `company.probe` with three flows: `orders-sync` ran 5 fast successes, then 3 slow successes and 3 failures; `invoice-export` is scheduled and fails every time; `monthly-report` is scheduled and has never run. With `lookback: PT45M` and `recent_window: PT4M`:

    | flow | runs base / recent | failure rate | p95 | findings |
    |---|---|---|---|---|
    | `company.probe.orders-sync` | 5 / 6 | 0% to 50% | 1.1s to 4.5s | `FAILURE_SPIKE`, `SLOWDOWN` |
    | `company.probe.invoice-export` | 0 / 2 | 100% | - | `SCHEDULED_NO_SUCCESS` |
    | `company.probe.monthly-report` | 0 / 0 | - | - | `SCHEDULED_NEVER_RAN` |

    The same run on `company.team`, where nothing changed, reported all 5 flows healthy.

    ## Inputs

    - `target_namespace` (STRING, default `company`): audited with all child namespaces.
    - `lookback` (DURATION, default `P14D`) and `recent_window` (DURATION, default `P1D`).
    - `failure_spike_points` (FLOAT, default `0.25`), `slowdown_ratio` (FLOAT, default `1.5`), `min_runs` (INT, default `3`).
    - `kestra_url` (STRING, default `http://localhost:8080`).
    - `fail_on_findings` (BOOL, default `true`).

    ## Prerequisites

    - The script task calls the Kestra API from its own container with `networkMode: host`, so `http://localhost:8080` reaches Kestra in the standard Docker Compose setup, where port 8080 is published. On Kubernetes, set `kestra_url` to the Kestra service and remove `networkMode`.

    ### Secrets

    - `KESTRA_USERNAME` and `KESTRA_PASSWORD`: a user that can read flows and executions in the namespace.

    ## Expected outputs

    - `outputs.score.vars`: `flows`, `executions`, `flagged`, `findings`.
    - Namespace file `health/<target_namespace>-scorecard.md`.

    ## Things to know

    - `DURATION` inputs reach scripts as seconds (`1209600.0` for `P14D`), while execution durations are ISO 8601 (`PT2.3S`). The script reads both.
    - I first used `io.kestra.plugin.kestra.executions.Query`. On 2.0.3 it returned no rows although the API had them, and its `timeRange` sent the start and end dates swapped. Calling the API directly avoids both.

    ## How to extend

    - Post the scorecard to Slack or open an issue per flagged flow.
    - Store each run's numbers in the KV store to plot a trend.
    - Add a signal for flows whose executions stay `RUNNING` longer than a limit.

    ## Links

    - Kestra API reference: https://kestra.io/docs/api-reference
    - Python scripts plugin: https://kestra.io/plugins/plugin-script-python
    - Failure alerts with a Flow trigger: https://kestra.io/docs/workflow-components/triggers/flow-trigger
  tags:
    - System
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
