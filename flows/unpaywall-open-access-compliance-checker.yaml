id: unpaywall-open-access-compliance-checker
namespace: company.team

description: |
  Check a list of DOIs against funder open-access mandates (Plan S, Wellcome, UKRI, NIH or your own
  rules) using Unpaywall. Each DOI is looked up once and cached, every free copy Unpaywall knows is
  re-labelled where Unpaywall's version tags are known to be wrong (bioRxiv preprints tagged as accepted
  manuscripts, NIH author manuscripts in PMC tagged as submitted), and DuckDB applies the policy that was
  in force on the publication date. Each (DOI, funder) pair gets COMPLIANT, AT_RISK, IN_EMBARGO,
  NON_COMPLIANT, NOT_COVERED or UNKNOWN; Slack only hears about status changes.

inputs:
  - id: unpaywall_email
    type: STRING
    defaults: you@example.com
    description: |
      Required by Unpaywall on every call (`?email=`). Replace the placeholder with a real address you read:
      Unpaywall rejects `example.com` addresses with HTTP 422, and the flow stops before calling the API.

  - id: dois_csv
    type: STRING
    description: |
      Inline CSV with a `doi` column and optional `funder`, `grant_id` and `publication_date` columns (any other
      columns are ignored). `doi` may be a bare DOI, `doi:` prefixed or a `https://doi.org/` link. Blank `funder`
      uses the `*` policy row. `publication_date` (YYYY-MM-DD, YYYY-MM or YYYY) overrides Unpaywall's date.
      Ignored when `dois_file` is uploaded.
    defaults: |
      doi,funder,grant_id,publication_date
      10.1038/s41586-024-07421-0,Wellcome,GRANT-001,
      https://doi.org/10.1016/j.cell.2025.12.040,Plan S,GRANT-002,
      10.1016/j.cell.2025.12.040,NIH,GRANT-003,
      10.1016/j.cell.2026.03.031,Plan S,GRANT-004,
      10.1056/NEJMoa2503109,Plan S,GRANT-005,
      10.1016/j.cell.2023.01.001,nih,GRANT-006,
      doi:10.1016/S0140-6736(97)11096-0,NIH,,
      10.7554/eLife.00013,,,
      10.7554/ELIFE.00013,,,
      10.1126/science.aac4716,,,
      10.1056/NEJMoa2511778,,,
      10.1016/j.cell.2026.05.004,,,2026-05
      10.5555/kestra-unpaywall-missing-doi,Wellcome,GRANT-007,
      PMC10091855,NIH,GRANT-008,

  - id: dois_file
    type: FILE
    required: false
    description: Optional CSV upload with the same columns as `dois_csv` (header row, comma separated). Takes precedence over the inline list.

  - id: funder_policies
    type: STRING
    description: |
      One row per funder and policy version. The row with the latest `effective_from` on or before the publication
      date applies; a funder whose rows all start later is NOT_COVERED. `accepted_licenses` is a `;` list of Unpaywall
      licence values or `any`. `publisher_route` lets a CC-licensed publisher copy satisfy the policy.
      `repository_embargo_months` is how long after publication a repository copy of the accepted manuscript may
      appear. `repository_needs_license` requires the repository copy to carry an accepted licence too (rights
      retention). Unknown funder names fall back to the `*` row.
    defaults: |
      funder,effective_from,accepted_licenses,publisher_route,repository_embargo_months,repository_needs_license
      *,1900-01-01,cc-by;cc0;public-domain,true,12,false
      Plan S,2021-01-01,cc-by;cc-by-sa;cc0;public-domain,true,0,true
      Wellcome,2021-01-01,cc-by;cc0;public-domain,true,0,true
      UKRI,2022-04-01,cc-by;cc0;public-domain,true,0,true
      NIH,2008-04-07,any,false,12,false
      NIH,2025-07-01,any,false,0,false

  - id: at_risk_days
    type: INT
    defaults: 60
    description: A DOI without a compliant copy whose deadline (publication date plus embargo) is this close, or passed less than `grace_days` ago, is AT_RISK instead of IN_EMBARGO or NON_COMPLIANT.

  - id: grace_days
    type: INT
    defaults: 30
    description: Tolerance after the deadline for deposits to show up in Unpaywall (repositories are harvested with a lag). Matters most for zero-embargo policies.

  - id: preprint_url_pattern
    type: STRING
    defaults: "biorxiv\\.org|medrxiv\\.org|arxiv\\.org|doi\\.org/10\\.1101/|doi\\.org/10\\.64898/|researchsquare\\.com|ssrn\\.com|preprints\\.org|/nihpp-"
    description: RE2 pattern on a location's URLs. Matching copies are treated as preprints (submittedVersion) whatever Unpaywall says; Unpaywall labels many bioRxiv copies `acceptedVersion`.

  - id: manuscript_url_pattern
    type: STRING
    defaults: "/nihms-|/ems[0-9]+|europepmc\\.org/abstract/med"
    description: RE2 pattern on a location's URLs. Matching copies are accepted manuscripts (NIH and Europe PMC author manuscripts), which Unpaywall currently labels `submittedVersion`. Empty disables the re-labelling.

  - id: refresh_after_days
    type: INT
    defaults: 25
    description: Look a cached DOI up again after this many days, so a monthly run sees new deposits and licence changes.

  - id: settled_refresh_days
    type: INT
    defaults: 180
    description: Longer cache life for DOIs whose publisher copy already carries a CC or public-domain licence; those rarely change.

  - id: max_lookups
    type: INT
    defaults: 5000
    description: Cap on Unpaywall calls per run (the daily limit is 100,000). DOIs over the cap keep their cached answer, or show as UNKNOWN/not_checked, and are looked up next run.

  - id: state_prefix
    type: STRING
    defaults: unpaywall_oa
    description: Prefix of the two KV keys (`<prefix>_cache`, `<prefix>_status`). Use one prefix per list.

triggers:
  - id: monthly_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 2 * *"
    description: Monthly, after most institutional repositories have run their month-end harvest into Unpaywall.

tasks:
  - id: require_real_email
    type: io.kestra.plugin.core.execution.Fail
    condition: "{{ inputs.unpaywall_email is empty or (inputs.unpaywall_email | lower) contains 'example.' or not ((inputs.unpaywall_email) contains '@') }}"
    errorMessage: "Set unpaywall_email to a real address you read. Unpaywall requires it on every request and rejects example.com placeholders."

  - id: inline_dois
    type: io.kestra.plugin.core.storage.Write
    content: "{{ inputs.dois_csv }}"
    extension: .csv

  - id: inline_policies
    type: io.kestra.plugin.core.storage.Write
    content: "{{ inputs.funder_policies }}"
    extension: .csv

  - id: empty_state
    type: io.kestra.plugin.core.storage.Write
    description: Empty newline-delimited JSON file used in place of the cache and status files on the first run.
    content: "\n"
    extension: .jsonl

  - id: previous_cache
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_prefix }}_cache"
    errorOnMissing: false

  - id: previous_status
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_prefix }}_status"
    errorOnMissing: false

  - id: plan
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Normalises DOIs (prefix stripped, lower case), rejects strings that are not DOIs, and lists the unique DOIs
      that are not cached or whose cached answer is older than the refresh window. Two funders on one DOI cost one call.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      dois.csv: "{{ inputs.dois_file ?? outputs.inline_dois.uri }}"
      cache.jsonl: "{{ outputs.previous_cache.value ?? outputs.empty_state.uri }}"
    outputFiles:
      - pending_csv
    sql: |
      SET TimeZone = 'UTC';
      CREATE MACRO norm_doi(s) AS lower(regexp_replace(trim(coalesce(s, '')), '^(https?://(dx\.)?doi\.org/|doi:\s*)', '', 'i'));
      CREATE TABLE wanted AS
      SELECT DISTINCT norm_doi(doi) AS doi
      FROM read_csv('dois.csv', header = true, all_varchar = true)
      WHERE regexp_full_match(norm_doi(doi), '10\.[0-9]{4,9}/\S+');
      CREATE TABLE cache AS SELECT * FROM read_json('cache.jsonl', format = 'newline_delimited',
        columns = {'doi': 'VARCHAR', 'fetched_at': 'TIMESTAMP', 'settled': 'BOOLEAN'});
      CREATE TABLE due AS
      SELECT w.doi, c.fetched_at
      FROM wanted w LEFT JOIN cache c USING (doi)
      WHERE c.doi IS NULL
         OR c.fetched_at < TIMESTAMP '{{ execution.startDate | date("yyyy-MM-dd HH:mm:ss", timeZone="UTC") }}'
                           - to_days(CASE WHEN c.settled THEN {{ inputs.settled_refresh_days }} ELSE {{ inputs.refresh_after_days }} END);
      COPY (SELECT doi FROM due ORDER BY fetched_at NULLS FIRST, doi LIMIT {{ inputs.max_lookups }})
        TO '{{ outputFiles.pending_csv }}' (HEADER true, DELIMITER ',');
      SELECT (SELECT count(*) FROM wanted) AS unique_dois,
             (SELECT count(*) FROM wanted) - (SELECT count(*) FROM due) AS from_cache,
             least((SELECT count(*) FROM due), {{ inputs.max_lookups }}) AS to_lookup,
             greatest((SELECT count(*) FROM due) - {{ inputs.max_lookups }}, 0) AS deferred,
             (SELECT count(*) FROM cache) AS cache_size_before;

  - id: lookup_due
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.plan.outputs[0].row.to_lookup > 0 }}"
    then:
      - id: unpaywall_lookup
        type: io.kestra.plugin.scripts.python.Script
        description: |
          Unpaywall has no batch endpoint, so this is one GET per DOI to `/v2/{doi}?email=...`, paced at about 8
          requests a second, with retries on 429 and 5xx. HTTP 404 is cached as "not in Unpaywall"; HTTP 422 (email
          rejected) stops the run. Only the fields the policy needs are kept, including every OA location, not just
          the best one, because a CC BY repository copy can sit behind a bronze publisher copy. Standard library only.
        containerImage: python:3.13-slim
        inputFiles:
          pending.csv: "{{ outputs.plan.outputFiles.pending_csv }}"
        outputFiles:
          - fresh.jsonl
        env:
          UNPAYWALL_EMAIL: "{{ inputs.unpaywall_email }}"
          FETCHED_AT: "{{ execution.startDate | date('yyyy-MM-dd HH:mm:ss', timeZone='UTC') }}"
        script: |
          import csv, json, os, sys, time, urllib.error, urllib.parse, urllib.request

          EMAIL = os.environ["UNPAYWALL_EMAIL"]
          HEADERS = {"Accept": "application/json", "User-Agent": f"kestra-unpaywall-oa-compliance/1.0 (mailto:{EMAIL})"}
          KEEP = ("host_type", "version", "license", "url", "url_for_pdf", "repository_institution", "oa_date")

          def fetch(doi):
              url = f"https://api.unpaywall.org/v2/{urllib.parse.quote(doi, safe='/')}?email={urllib.parse.quote(EMAIL)}"
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=HEADERS), timeout=30) as r:
                          return 200, json.load(r)
                  except urllib.error.HTTPError as e:
                      if e.code == 404:
                          return 404, None
                      if e.code == 422:
                          sys.exit(f"Unpaywall rejected the request (HTTP 422): {e.read()[:200]!r}. Check unpaywall_email.")
                      if e.code in (429, 500, 502, 503, 504) and attempt < 3:
                          time.sleep(min(float(e.headers.get("Retry-After") or 2 ** (attempt + 1)), 60))
                          continue
                      return e.code, None
                  except (urllib.error.URLError, TimeoutError):
                      if attempt < 3:
                          time.sleep(2 ** (attempt + 1))
                          continue
                      return None, None
              return None, None

          with open("pending.csv", newline="", encoding="utf-8") as f:
              pending = [row["doi"] for row in csv.DictReader(f)]

          stats = {"calls": 0, "found": 0, "not_found": 0, "failed": 0}
          with open("fresh.jsonl", "w", encoding="utf-8") as out:
              for i, doi in enumerate(pending):
                  if i:
                      time.sleep(0.12)
                  stats["calls"] += 1
                  status, body = fetch(doi)
                  if status not in (200, 404):
                      stats["failed"] += 1
                      print(f"Lookup failed for {doi} (HTTP {status}); keeping the cached answer if any")
                      continue
                  rec = {"doi": doi, "http_status": status, "fetched_at": os.environ["FETCHED_AT"]}
                  if body:
                      stats["found"] += 1
                      best = body.get("best_oa_location") or {}
                      locations = [{k: loc.get(k) for k in KEEP} for loc in body.get("oa_locations") or []]
                      rec.update(
                          title=body.get("title"), journal=body.get("journal_name"), publisher=body.get("publisher"),
                          published_date=body.get("published_date"), is_oa=body.get("is_oa"), oa_status=body.get("oa_status"),
                          journal_is_in_doaj=body.get("journal_is_in_doaj"),
                          best_host_type=best.get("host_type"), best_version=best.get("version"), best_license=best.get("license"),
                          best_url=best.get("url"), best_repository=best.get("repository_institution"),
                          embargoed_copies=len(body.get("oa_locations_embargoed") or []),
                          locations=json.dumps(locations, ensure_ascii=False),
                          settled=any(l["host_type"] == "publisher" and (l["license"] or "").startswith(("cc", "public-domain")) for l in locations))
                  else:
                      stats["not_found"] += 1
                      rec.update(locations="[]", settled=False)
                  out.write(json.dumps(rec, ensure_ascii=False) + "\n")

          print(f"Unpaywall lookups: {stats}")
          print("::" + json.dumps({"outputs": stats}) + "::")

  - id: evaluate
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Merges fresh answers into the cache, re-labels each OA location (preprint pattern, then manuscript pattern,
      then a PMC or Europe PMC copy carrying the same licence as the publisher copy counts as the published version),
      picks the policy row in force on the publication date (ASOF join), and decides the status. Compares with the
      previous status per (DOI, funder) and builds the Slack digest of changes.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      dois.csv: "{{ inputs.dois_file ?? outputs.inline_dois.uri }}"
      policies.csv: "{{ outputs.inline_policies.uri }}"
      cache.jsonl: "{{ outputs.previous_cache.value ?? outputs.empty_state.uri }}"
      fresh.jsonl: "{{ outputs.unpaywall_lookup.outputFiles['fresh.jsonl'] ?? outputs.empty_state.uri }}"
      status.jsonl: "{{ outputs.previous_status.value ?? outputs.empty_state.uri }}"
    outputFiles:
      - compliance_csv
      - cache_jsonl
      - status_jsonl
    sql: |
      SET TimeZone = 'UTC';
      CREATE MACRO norm_doi(s) AS lower(regexp_replace(trim(coalesce(s, '')), '^(https?://(dx\.)?doi\.org/|doi:\s*)', '', 'i'));
      CREATE MACRO run_date() AS DATE '{{ execution.startDate | date("yyyy-MM-dd", timeZone="UTC") }}';
      CREATE MACRO lic_ok(lic, accepted) AS accepted = 'any' OR list_contains(string_split(accepted, ';'), lower(lic));

      CREATE TABLE src AS
      SELECT * FROM (SELECT CAST(NULL AS VARCHAR) AS doi, CAST(NULL AS VARCHAR) AS funder, CAST(NULL AS VARCHAR) AS grant_id,
                            CAST(NULL AS VARCHAR) AS publication_date, CAST(NULL AS BIGINT) AS input_row WHERE false)
      UNION ALL BY NAME
      SELECT *, row_number() OVER () AS input_row FROM read_csv('dois.csv', header = true, all_varchar = true);

      CREATE TABLE rows AS
      SELECT min(input_row) AS input_row, count(*) AS duplicates, doi, arg_min(funder, input_row) AS funder, any_value(grant_id) AS grant_id,
             any_value(doi_input) AS doi_input, any_value(pub_override) AS pub_override
      FROM (SELECT input_row, trim(doi) AS doi_input, norm_doi(doi) AS doi, nullif(trim(coalesce(funder, '')), '') AS funder,
                   nullif(trim(grant_id), '') AS grant_id,
                   CAST(coalesce(try_strptime(trim(publication_date), '%Y-%m-%d'), try_strptime(trim(publication_date), '%Y-%m'),
                                 try_strptime(trim(publication_date), '%Y')) AS DATE) AS pub_override
            FROM src WHERE trim(coalesce(doi, '')) <> '')
      GROUP BY doi, lower(coalesce(funder, '*'));

      CREATE TABLE cache AS
      SELECT * EXCLUDE (filename), filename LIKE '%fresh.jsonl' AS fresh
      FROM read_json(['cache.jsonl', 'fresh.jsonl'], format = 'newline_delimited', filename = true, columns = {
        'doi': 'VARCHAR', 'http_status': 'INTEGER', 'fetched_at': 'TIMESTAMP', 'title': 'VARCHAR', 'journal': 'VARCHAR', 'publisher': 'VARCHAR',
        'published_date': 'DATE', 'is_oa': 'BOOLEAN', 'oa_status': 'VARCHAR', 'journal_is_in_doaj': 'BOOLEAN', 'best_host_type': 'VARCHAR',
        'best_version': 'VARCHAR', 'best_license': 'VARCHAR', 'best_url': 'VARCHAR', 'best_repository': 'VARCHAR',
        'embargoed_copies': 'INTEGER', 'locations': 'VARCHAR', 'settled': 'BOOLEAN'})
      QUALIFY row_number() OVER (PARTITION BY doi ORDER BY filename LIKE '%fresh.jsonl' DESC) = 1;
      COPY (SELECT * EXCLUDE (fresh) FROM cache) TO '{{ outputFiles.cache_jsonl }}' (FORMAT JSON);

      CREATE TABLE locs AS
      WITH raw AS (
        SELECT c.doi, l->>'$.host_type' AS host_type, l->>'$.version' AS label, lower(l->>'$.license') AS license,
               coalesce(l->>'$.url_for_pdf', l->>'$.url') AS url,
               lower(coalesce(l->>'$.url', '') || ' ' || coalesce(l->>'$.url_for_pdf', '')) AS urls
        FROM cache c, unnest(from_json(c.locations, '["JSON"]')) AS t(l))
      SELECT doi, host_type, license, url,
             CASE WHEN '{{ inputs.preprint_url_pattern | replace({"'": "''"}) }}' <> '' AND regexp_matches(urls, '{{ inputs.preprint_url_pattern | replace({"'": "''"}) }}') THEN 'submittedVersion'
                  WHEN '{{ inputs.manuscript_url_pattern | replace({"'": "''"}) }}' <> '' AND regexp_matches(urls, '{{ inputs.manuscript_url_pattern | replace({"'": "''"}) }}') THEN 'acceptedVersion'
                  WHEN host_type = 'repository' AND regexp_matches(urls, 'ncbi\.nlm\.nih\.gov/pmc|pmc\.ncbi\.nlm\.nih\.gov|europepmc\.org')
                       AND license IS NOT NULL
                       AND license = max(CASE WHEN host_type = 'publisher' THEN license END) OVER (PARTITION BY doi) THEN 'publishedVersion'
                  ELSE label END AS version
      FROM raw;

      CREATE TABLE policies AS
      SELECT lower(trim(funder)) AS policy_key, trim(funder) AS policy_funder, CAST(effective_from AS DATE) AS effective_from,
             lower(replace(accepted_licenses, ' ', '')) AS accepted_licenses, CAST(publisher_route AS BOOLEAN) AS publisher_route,
             CAST(repository_embargo_months AS INTEGER) AS embargo_months, CAST(repository_needs_license AS BOOLEAN) AS repository_needs_license
      FROM read_csv('policies.csv', header = true, all_varchar = true);

      CREATE TABLE base AS
      SELECT r.*, c.* EXCLUDE (doi), regexp_full_match(r.doi, '10\.[0-9]{4,9}/\S+') AS valid_doi,
             coalesce(r.pub_override, c.published_date) AS pub_date,
             CASE WHEN lower(r.funder) IN (SELECT policy_key FROM policies) THEN lower(r.funder) ELSE '*' END AS policy_key
      FROM rows r LEFT JOIN cache c ON c.doi = r.doi;

      CREATE TABLE judged AS
      WITH pol AS (
        SELECT b.*, p.policy_funder, p.effective_from, p.accepted_licenses, p.publisher_route, p.embargo_months, p.repository_needs_license,
               CAST(b.pub_date + to_months(p.embargo_months) AS DATE) AS deadline
        FROM base b ASOF LEFT JOIN policies p ON p.policy_key = b.policy_key AND coalesce(b.pub_date, DATE '9999-12-31') >= p.effective_from),
      routes AS (
        SELECT p.input_row,
               min(l.url) FILTER (WHERE l.host_type = 'publisher' AND p.publisher_route AND l.license IS NOT NULL AND lic_ok(l.license, p.accepted_licenses)) AS publisher_url,
               min(l.license) FILTER (WHERE l.host_type = 'publisher' AND p.publisher_route AND l.license IS NOT NULL AND lic_ok(l.license, p.accepted_licenses)) AS publisher_license,
               min(l.url) FILTER (WHERE l.host_type = 'repository' AND l.version IN ('acceptedVersion', 'publishedVersion')
                                  AND (NOT p.repository_needs_license OR (l.license IS NOT NULL AND lic_ok(l.license, p.accepted_licenses)))) AS repository_url,
               string_agg(DISTINCT l.license, '/') FILTER (WHERE l.host_type = 'publisher') AS publisher_licenses,
               string_agg(DISTINCT coalesce(l.license, 'no licence'), '/') FILTER (WHERE l.host_type = 'repository' AND l.version IN ('acceptedVersion', 'publishedVersion')) AS manuscript_licenses,
               count(l.doi) FILTER (WHERE l.version = 'submittedVersion') AS preprints,
               count(l.doi) AS free_copies
        FROM pol p LEFT JOIN locs l ON l.doi = p.doi GROUP BY p.input_row)
      SELECT p.*, r.* EXCLUDE (input_row),
             CASE WHEN NOT p.valid_doi THEN 'UNKNOWN'
                  WHEN p.http_status IS NULL THEN 'UNKNOWN'
                  WHEN p.http_status = 404 THEN 'UNKNOWN'
                  WHEN p.policy_funder IS NULL THEN 'NOT_COVERED'
                  WHEN r.publisher_url IS NOT NULL OR r.repository_url IS NOT NULL THEN 'COMPLIANT'
                  WHEN p.pub_date IS NULL THEN 'UNKNOWN'
                  WHEN run_date() > p.deadline + to_days({{ inputs.grace_days }}) THEN 'NON_COMPLIANT'
                  WHEN run_date() >= p.deadline - to_days({{ inputs.at_risk_days }}) THEN 'AT_RISK'
                  ELSE 'IN_EMBARGO' END AS status,
             CASE WHEN NOT p.valid_doi THEN 'invalid_doi'
                  WHEN p.http_status IS NULL THEN 'not_checked'
                  WHEN p.http_status = 404 THEN 'doi_not_in_unpaywall'
                  WHEN p.policy_funder IS NULL THEN 'published before the policy took effect'
                  WHEN r.publisher_url IS NOT NULL THEN 'publisher copy under ' || r.publisher_license
                  WHEN r.repository_url IS NOT NULL THEN 'repository manuscript'
                  WHEN p.pub_date IS NULL THEN 'no publication date'
                  WHEN r.free_copies = 0 THEN 'no free copy'
                  WHEN r.manuscript_licenses IS NOT NULL THEN 'repository manuscript licence ' || r.manuscript_licenses || ' not accepted'
                  WHEN r.publisher_licenses IS NOT NULL AND NOT p.publisher_route THEN 'publisher copy only, policy needs a repository manuscript'
                  WHEN r.publisher_licenses IS NOT NULL THEN 'publisher licence ' || r.publisher_licenses || ' not accepted'
                  WHEN r.preprints = r.free_copies THEN 'only preprint copies'
                  ELSE 'free copy without accepted licence' END AS reason
      FROM pol p JOIN routes r USING (input_row);

      CREATE TABLE prev AS SELECT * FROM read_json('status.jsonl', format = 'newline_delimited',
        columns = {'state_key': 'VARCHAR', 'status': 'VARCHAR', 'reason': 'VARCHAR', 'since': 'DATE'});

      CREATE TABLE result AS
      SELECT j.*, j.doi || '|' || lower(coalesce(j.funder, '*')) AS state_key, pv.status AS previous_status, pv.since AS previous_since,
             j.reason <> 'not_checked' AND pv.status IS DISTINCT FROM j.status AS changed
      FROM judged j LEFT JOIN prev pv ON pv.state_key = j.doi || '|' || lower(coalesce(j.funder, '*'));

      CREATE TABLE alerts AS
      SELECT * FROM result
      WHERE changed AND (status IN ('NON_COMPLIANT', 'AT_RISK', 'UNKNOWN')
                         OR (status = 'COMPLIANT' AND previous_status IN ('NON_COMPLIANT', 'AT_RISK', 'UNKNOWN')));

      COPY (
        SELECT input_row, doi_input, doi, funder, grant_id, policy_funder || ' from ' || CAST(effective_from AS VARCHAR) AS policy_applied,
               pub_date AS publication_date, deadline, status, reason, previous_status, changed,
               title, journal, publisher, is_oa, oa_status, journal_is_in_doaj, best_host_type, best_version, best_license, best_url,
               best_repository, coalesce(publisher_url, repository_url) AS compliant_url, free_copies, embargoed_copies, duplicates,
               fetched_at, fresh AS looked_up_this_run
        FROM result ORDER BY CASE status WHEN 'NON_COMPLIANT' THEN 1 WHEN 'AT_RISK' THEN 2 WHEN 'UNKNOWN' THEN 3 ELSE 4 END, input_row
      ) TO '{{ outputFiles.compliance_csv }}' (HEADER true, DELIMITER ',');

      COPY (
        SELECT state_key, status, reason, CASE WHEN changed OR previous_since IS NULL THEN run_date() ELSE previous_since END AS since
        FROM result WHERE reason <> 'not_checked'
        UNION ALL
        SELECT * FROM prev WHERE state_key NOT IN (SELECT state_key FROM result WHERE reason <> 'not_checked')
      ) TO '{{ outputFiles.status_jsonl }}' (FORMAT JSON);

      SELECT
        (SELECT count(*) FROM result) AS checked_pairs,
        (SELECT CAST(coalesce(sum(duplicates - 1), 0) AS INTEGER) FROM result) AS duplicate_rows,
        (SELECT count(*) FILTER (WHERE status = 'COMPLIANT') FROM result) AS compliant,
        (SELECT count(*) FILTER (WHERE status = 'NON_COMPLIANT') FROM result) AS non_compliant,
        (SELECT count(*) FILTER (WHERE status = 'AT_RISK') FROM result) AS at_risk,
        (SELECT count(*) FILTER (WHERE status = 'IN_EMBARGO') FROM result) AS in_embargo,
        (SELECT count(*) FILTER (WHERE status = 'NOT_COVERED') FROM result) AS not_covered,
        (SELECT count(*) FILTER (WHERE status = 'UNKNOWN') FROM result) AS unknown,
        (SELECT count(*) FROM prev) = 0 AS is_baseline,
        (SELECT count(*) FILTER (WHERE changed) FROM result) AS changes,
        (SELECT count(*) FROM alerts) AS alerts,
        (SELECT count(*) FROM cache) AS cache_size,
        (SELECT coalesce(string_agg(status || ' ' || CASE WHEN valid_doi THEN doi ELSE doi_input END || ' (' || coalesce(funder, 'default policy') || ', ' || reason
                  || CASE WHEN status = 'AT_RISK' THEN ', deadline ' || CAST(deadline AS VARCHAR) ELSE '' END
                  || CASE WHEN previous_status IS NOT NULL THEN ', was ' || previous_status ELSE '' END || ')', chr(10) ORDER BY input_row), '')
           FROM (SELECT * FROM alerts ORDER BY input_row LIMIT 25)) AS alert_lines;

  - id: save_cache
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_prefix }}_cache"
    value: "{{ outputs.evaluate.outputFiles.cache_jsonl }}"
    description: Points the cache key at this run's cache file (one JSON line per DOI with the extracted Unpaywall fields).

  - id: save_status
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_prefix }}_status"
    value: "{{ outputs.evaluate.outputFiles.status_jsonl }}"
    description: Last status and the date it started per (DOI, funder). DOIs that could not be checked keep their previous status.

  - id: notify_changes
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.evaluate.outputs[0].row.alerts > 0 }}"
    then:
      - id: log_changes
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "{{ outputs.evaluate.outputs[0].row.alerts }} open-access status change(s){{ outputs.evaluate.outputs[0].row.is_baseline ? ' (BASELINE run)' : '' }}:\n{{ outputs.evaluate.outputs[0].row.alert_lines }}"

      - id: slack_digest
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: allowFailure keeps the check green when SLACK_WEBHOOK_URL is not set; the changes are in the WARN log and the CSV.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: "{{ {'text': '*Open-access compliance* ' ~ (outputs.evaluate.outputs[0].row.is_baseline ? '(baseline) ' : '') ~ outputs.evaluate.outputs[0].row.alerts ~ ' change(s) across ' ~ outputs.evaluate.outputs[0].row.checked_pairs ~ ' DOI/funder pairs\n' ~ outputs.evaluate.outputs[0].row.alert_lines ~ (outputs.evaluate.outputs[0].row.alerts > 25 ? '\n...and more in the CSV' : '') ~ '\nNon-compliant ' ~ outputs.evaluate.outputs[0].row.non_compliant ~ ', at risk ' ~ outputs.evaluate.outputs[0].row.at_risk ~ ', unknown ' ~ outputs.evaluate.outputs[0].row.unknown ~ '\n' ~ (kestra.url ?? '') ~ '/ui/executions/' ~ flow.namespace ~ '/' ~ flow.id ~ '/' ~ execution.id} | toJson }}"
    else:
      - id: no_changes
        type: io.kestra.plugin.core.log.Log
        message: "No open-access status changes for {{ outputs.evaluate.outputs[0].row.checked_pairs }} DOI/funder pairs."

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      {{ outputs.plan.outputs[0].row.unique_dois }} unique DOIs: {{ outputs.plan.outputs[0].row.from_cache }} from cache, {{ outputs.plan.outputs[0].row.to_lookup }} looked up, {{ outputs.plan.outputs[0].row.deferred }} deferred{{ outputs.evaluate.outputs[0].row.is_baseline ? ' (BASELINE run)' : '' }}.
      {{ outputs.evaluate.outputs[0].row.checked_pairs }} DOI/funder pairs: compliant {{ outputs.evaluate.outputs[0].row.compliant }}, non-compliant {{ outputs.evaluate.outputs[0].row.non_compliant }}, at risk {{ outputs.evaluate.outputs[0].row.at_risk }}, in embargo {{ outputs.evaluate.outputs[0].row.in_embargo }}, not covered {{ outputs.evaluate.outputs[0].row.not_covered }}, unknown {{ outputs.evaluate.outputs[0].row.unknown }}; {{ outputs.evaluate.outputs[0].row.duplicate_rows }} duplicate rows merged.
      Status changes {{ outputs.evaluate.outputs[0].row.changes }}, alerted {{ outputs.evaluate.outputs[0].row.alerts }}. Report: {{ outputs.evaluate.outputFiles.compliance_csv }}

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.evaluate.outputs[0].row }}"
  - id: compliance_csv
    type: FILE
    value: "{{ outputs.evaluate.outputFiles.compliance_csv }}"

extend:
  title: Check Funder Open-Access Compliance for a DOI List with Unpaywall
  metaTitle: Unpaywall Open-Access Compliance Checker for Plan S, Wellcome and NIH | Kestra
  shortDescription: Look up each DOI in Unpaywall once a month, cache the answers, correct Unpaywall's version labels for preprints and PMC author manuscripts, apply the funder policy in force on the publication date in DuckDB and alert in Slack only when a paper's compliance status changes.
  metaDescription: Monthly Unpaywall check of DOIs against Plan S, Wellcome, UKRI and NIH open-access rules in DuckDB, with caching, status-change Slack alerts and a CSV.
  description: |
    Research offices and libraries have to show funders that the papers they paid for are open: Plan S, Wellcome and UKRI want a CC BY copy at publication, NIH wants the accepted manuscript in PubMed Central (after 12 months until mid-2025, with no embargo since). Unpaywall knows every free copy of a DOI with its host, version and licence, but answers one DOI per request and mislabels versions. This flow turns it into a monthly compliance report with cached lookups, an editable policy table and Slack messages only when a status changes.

    ## How it works

    1. A monthly `Schedule` (2nd of the month, 06:00 UTC) runs the check. `require_real_email` (Fail) stops the run if `unpaywall_email` is still the placeholder: Unpaywall rejects `example.com` with HTTP 422.
    2. The list comes from `dois_csv` or an uploaded `dois_file` (`doi`, optional `funder`, `grant_id`, `publication_date`). `plan` (DuckDB) normalises DOIs, drops strings that are not DOIs and lists the unique DOIs not cached or older than `refresh_after_days` (`settled_refresh_days` when the publisher copy is CC-licensed), capped at `max_lookups`.
    3. `lookup_due` (If) runs `unpaywall_lookup` (Python, standard library) only when something is due: one paced GET per DOI to `api.unpaywall.org/v2/{doi}?email=...` with retries on 429 and 5xx. It keeps `is_oa`, `oa_status`, `journal_is_in_doaj`, `best_oa_location` (host type, version, licence, URL, repository) and all `oa_locations`; a 404 is cached too.
    4. `evaluate` (DuckDB) merges the answers into the cache and re-labels each location: URLs matching `preprint_url_pattern` (bioRxiv, medRxiv, arXiv, `/nihpp-` PMC preprints) are preprints even when Unpaywall says `acceptedVersion`; URLs matching `manuscript_url_pattern` (`/nihms-`) are accepted manuscripts despite a `submittedVersion` label; a PMC copy under the publisher's licence is the published version.
    5. An ASOF join picks the `funder_policies` row in force on the publication date. A pair is COMPLIANT when a publisher copy carries an accepted licence (if the policy allows that route) or a repository holds the accepted or published version (with an accepted licence if required). Otherwise the deadline is publication date plus `repository_embargo_months`: AT_RISK within `at_risk_days` of it or up to `grace_days` after, NON_COMPLIANT later, IN_EMBARGO before. NOT_COVERED: published before the policy. UNKNOWN: invalid DOI, not in Unpaywall or over the lookup cap.
    6. `save_cache` and `save_status` (KV Set) point at this run's cache and status files. `notify_changes` (If) logs every change at WARN and posts one Slack digest (`allowFailure`) when a pair became NON_COMPLIANT, AT_RISK or UNKNOWN, or went back to COMPLIANT.

    ## What you get

    - A CSV with one row per DOI and funder: policy row applied, publication date, deadline, status, reason (for example `publisher licence cc-by-nc-nd not accepted`, `only preprint copies`, `no free copy`), previous status, OA status, DOAJ flag, best location and the URL of the compliant copy.
    - Slack only on status changes; the first run is a BASELINE that reports current problems once.
    - One Unpaywall call per unique DOI per refresh window.

    ## Who it's for

    - Research office and library staff preparing funder compliance reports.
    - Repository managers chasing manuscripts before an embargo ends.

    ## Why orchestrate this with Kestra

    - The policy is a CSV input and the logic is SQL, so rules are reviewable and versioned with the flow.
    - KV state turns a monthly report into change alerts without a database; the cache keeps a 10,000-DOI list well inside Unpaywall's 100,000 calls a day.
    - `If` skips the API step when everything is cached, and `allowFailure` keeps a missing webhook from failing the report.

    ## Prerequisites

    - Kestra 2.0 with the DuckDB, Python scripts and Slack plugins; Docker for the `python:3.13-slim` image (or another task runner).
    - Outbound HTTPS to `api.unpaywall.org`. No API key, but a real email address in `unpaywall_email`.
    - Cache and status files live in internal storage and the KV keys point at them; if you purge old executions, delete the `<state_prefix>_cache` and `_status` keys too.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the change digest (optional; without it the changes are in the WARN log and the CSV).

    ## Quick start

    1. Import the flow and set `unpaywall_email` to your address (in the inputs or by editing the default).
    2. Execute with the default list: 14 rows, 11 unique DOIs. In October 2026 the baseline showed 6 COMPLIANT, 2 NON_COMPLIANT (CC BY-NC-ND under Plan S), 1 AT_RISK, 1 IN_EMBARGO, 1 NOT_COVERED and 2 UNKNOWN (an unregistered DOI and a PMC id).
    3. Execute again: everything comes from the cache and nothing alerts.
    4. Edit `funder_policies` for your funders, add `SLACK_WEBHOOK_URL`, upload your list as `dois_file` and keep the monthly schedule.

    ## How to extend

    - Add funders as policy rows, including dated rows when a policy changes.
    - Read the list from your CRIS export via a Flow trigger.
    - Open a ticket per NON_COMPLIANT paper or email the author.

    ## Links

    - [Unpaywall REST API](https://unpaywall.org/products/api) and [data format](https://unpaywall.org/data-format)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries) and [Python Script](https://kestra.io/plugins/plugin-script-python/io.kestra.plugin.scripts.python.script)
    - [If](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if), [Fail](https://kestra.io/plugins/core/execution/io.kestra.plugin.core.execution.fail) and [KV Store](https://kestra.io/docs/concepts/kv-store)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [Plan S principles](https://www.coalition-s.org/plan_s_principles/), [Wellcome OA policy](https://wellcome.org/grant-funding/guidance/open-access-guidance/open-access-policy) and [NIH Public Access Policy](https://grants.nih.gov/policy-and-compliance/policy-topics/public-access)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - Testing & Quality
  ee: false
  demo: false
