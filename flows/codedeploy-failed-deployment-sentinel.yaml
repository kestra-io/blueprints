    - [AWS CLI deploy batch-get-deployments reference](https://docs.aws.amazon.com/cli/latest/reference/deploy/batch-get-deployments.html)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
