id: minio-bucket-disk-usage-quota-headroom-sentinel
namespace: company.storage

inputs:
  - id: minio_endpoint
    type: STRING
    defaults: "minio.internal:9000"
    description: Host and port of the MinIO object storage cluster.
  - id: bucket_name
    type: STRING
    description: Target MinIO bucket name to audit.
  - id: max_usage_percentage
    type: INT
    defaults: 85
    description: "Maximum allowable bucket quota usage percentage before alerting (default 85%)."

tasks:
  - id: inspect_bucket_quota
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Configure MinIO client alias
        mc alias set minio "http://{{ inputs.minio_endpoint }}" "{{ secret('MINIO_ACCESS_KEY') }}" "{{ secret('MINIO_SECRET_KEY') }}" > /dev/null 2>&1
        
        # Query bucket quota and disk usage
        mc quota info minio/{{ inputs.bucket_name }} --json > /tmp/minio_quota.json 2>/dev/null || echo "{}" > /tmp/minio_quota.json

        python3 -c "
        import json
        try:
            with open('/tmp/minio_quota.json') as f:
                data = json.load(f)
            quota_bytes = data.get('quota', 0)
            used_bytes = data.get('size', 0)
            if quota_bytes > 0:
                pct = (used_bytes / quota_bytes) * 100.0
                is_breach = 1 if pct >= {{ inputs.max_usage_percentage }} else 0
                print(f'{is_breach}|{pct:.1f}|{used_bytes // (1024**3)}|{quota_bytes // (1024**3)}')
            else:
                print('0|0|0|0')
        except Exception:
            print('0|0|0|0')
        " > /tmp/minio_summary.txt

        IS_BREACH=$(cut -d '|' -f 1 /tmp/minio_summary.txt)
        USAGE_PCT=$(cut -d '|' -f 2 /tmp/minio_summary.txt)
        USED_GB=$(cut -d '|' -f 3 /tmp/minio_summary.txt)
        QUOTA_GB=$(cut -d '|' -f 4 /tmp/minio_summary.txt)
        
        echo "::set-output name=is_breach::${IS_BREACH:-0}::"
        echo "::set-output name=usage_pct::$USAGE_PCT::"
        echo "::set-output name=used_gb::$USED_GB::"
        echo "::set-output name=quota_gb::$QUOTA_GB::"

  - id: evaluate_storage_headroom
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_bucket_quota.vars.is_breach | int == 1 }}"
    then:
      - id: notify_storage_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#storage-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 MinIO Bucket Quota Saturation Warning",
                "text": "Bucket {{ inputs.bucket_name }} has reached {{ outputs.inspect_bucket_quota.vars.usage_pct }}% of quota ({{ outputs.inspect_bucket_quota.vars.used_gb }} GB of {{ outputs.inspect_bucket_quota.vars.quota_gb }} GB). Risk of PUT reject errors.",
                "footer": "Kestra Storage Sentinel • MinIO"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#storage-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ MinIO Sentinel Failure",
            "text": "Failed to inspect bucket quota for MinIO at {{ inputs.minio_endpoint }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  ee: false
  demo: false
  title: MinIO Bucket Storage Quota and Disk Headroom Sentinel
  shortDescription: Audits MinIO object storage buckets for quota consumption and disk capacity exhaustion.
  description: |
    ## How it works
    This workflow connects to a MinIO distributed object storage cluster via the official MinIO client (`mc`) to audit assigned bucket quotas. When enterprise storage pools enforce hard capacity limits, reaching the allocated byte limit causes subsequent object uploads (`s3:PutObject`) to abort immediately with `XMinioStorageFull` errors. This sentinel computes total consumed bytes versus configured hard or soft quotas, calculates the usage percentage, and dispatches a Slack alert before client applications experience write failures.

    ## What you get
    - Real-time tracking of MinIO bucket storage consumption against quotas.
    - Early warning before object upload failures and backup stalls occur.
    - Automated Slack notifications with gigabyte usage metrics.

    ## Who it's for
    - Storage Engineers and SREs administering MinIO on-premise and hybrid object stores.
    - Data Platform teams providing S3-compatible staging buckets for data lakes.
    - DevOps engineers operating backup and archiving infrastructure.

    ## Why orchestrate this with Kestra
    - **Proactive Capacity Planning**: Automatically audits storage quotas on an hourly schedule.
    - **Native Enterprise Security**: Injects MinIO root and service account credentials via encrypted Kestra secrets.
    - **Remediation Workflows**: Can trigger automated data lifecycle archiving to glacier cold storage when space is low.

    ## Prerequisites
    - MinIO server instance with enabled management and S3 API ports.
    - MinIO client (`mc`) installed in the runner environment.
    - Secrets `MINIO_ACCESS_KEY`, `MINIO_SECRET_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Add `MINIO_ACCESS_KEY`, `MINIO_SECRET_KEY`, and `SLACK_WEBHOOK` secrets.
    3. Provide your `minio_endpoint` and target `bucket_name`.
    4. Enable the schedule trigger for continuous quota monitoring.

    ## How to extend
    - Automatically adjust bucket quotas using `mc quota set` upon manager approval.
    - Sweep buckets for expired multipart uploads that silently consume disk capacity.
    - Route critical alerts to PagerDuty or Opsgenie.

    ## Links
    - [MinIO Client Quota Documentation](https://min.io/docs/minio/linux/reference/minio-mc/mc-quota-info.html)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
