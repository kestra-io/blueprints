id: minio-bucket-disk-usage-quota-headroom-sentinel
namespace: company.storage

description: |
  Monitors MinIO bucket disk usage against configured storage quotas, alerting infrastructure teams on Slack.

concurrency:
  limit: 1

inputs:
  - id: minio_endpoint
    type: STRING
    defaults: "minio.internal:9000"
    description: Host and port of the MinIO object storage cluster.
  - id: bucket_name
    type: STRING
    description: Target MinIO bucket name to audit.
  - id: max_usage_percentage
    type: INT
    defaults: 85
    description: "Maximum allowable bucket quota usage percentage before alerting (default 85%)."

tasks:
  - id: inspect_bucket_quota
    type: io.kestra.plugin.scripts.python.Script
    description: Uses MinIO client CLI to query bucket quota and storage allocation metrics.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - curl -s -O https://dl.min.io/client/mc/release/linux-amd64/mc && chmod +x mc && mv mc /usr/local/bin/
      - pip install kestra
    env:
      MINIO_ENDPOINT: "{{ inputs.minio_endpoint }}"
      BUCKET_NAME: "{{ inputs.bucket_name }}"
      MAX_USAGE_PCT: "{{ inputs.max_usage_percentage }}"
      MINIO_ACCESS_KEY: "{{ secret('MINIO_ACCESS_KEY') }}"
      MINIO_SECRET_KEY: "{{ secret('MINIO_SECRET_KEY') }}"
    script: |
      import os
      import sys
      import json
      import subprocess
      from kestra import Kestra

      endpoint = os.environ.get("MINIO_ENDPOINT", "minio.internal:9000").strip()
      bucket = os.environ.get("BUCKET_NAME", "").strip()
      max_pct = float(os.environ.get("MAX_USAGE_PCT", "85"))
      access_key = os.environ.get("MINIO_ACCESS_KEY", "").strip()
      secret_key = os.environ.get("MINIO_SECRET_KEY", "").strip()

      if not access_key or not secret_key:
          print("ERROR: MINIO_ACCESS_KEY and MINIO_SECRET_KEY secrets are required.", file=sys.stderr)
          sys.exit(1)

      scheme = "https" if "443" in endpoint else "http"
      alias_url = f"{scheme}://{endpoint}"
      print(f"Configuring MinIO client alias for {alias_url}...")

      try:
          subprocess.run(["mc", "alias", "set", "minio", alias_url, access_key, secret_key], check=True, stdout=subprocess.DEVNULL)
          out = subprocess.check_output(["mc", "quota", "info", f"minio/{bucket}", "--json"], text=True)
          data = json.loads(out)
      except Exception as e:
          print(f"ERROR: Failed to inspect MinIO bucket quota for {bucket}: {e}", file=sys.stderr)
          sys.exit(1)

      quota_bytes = data.get("quota", 0)
      used_bytes = data.get("size", 0)

      if quota_bytes > 0:
          pct = round((used_bytes / quota_bytes) * 100.0, 1)
          is_breach = pct >= max_pct
          used_gb = round(used_bytes / (1024 ** 3), 2)
          quota_gb = round(quota_bytes / (1024 ** 3), 2)
      else:
          pct = 0.0
          is_breach = False
          used_gb = round(used_bytes / (1024 ** 3), 2)
          quota_gb = 0.0

      print(f"Bucket: {bucket}, Used: {used_gb}GB, Quota: {quota_gb}GB, Pct: {pct}%, Breach: {is_breach}")

      Kestra.outputs({
          "is_breach": is_breach,
          "usage_pct": pct,
          "used_gb": used_gb,
          "quota_gb": quota_gb
      })

  - id: evaluate_storage_headroom
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_bucket_quota.vars.is_breach }}"
    then:
      - id: notify_storage_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#storage-infra-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 MinIO Bucket Quota Warning",
                "text": "MinIO bucket {{ inputs.bucket_name }} is at {{ outputs.inspect_bucket_quota.vars.usage_pct }}% quota capacity ({{ outputs.inspect_bucket_quota.vars.used_gb }} GB / {{ outputs.inspect_bucket_quota.vars.quota_gb }} GB). Risk of S3 PUT rejections.",
                "footer": "Kestra Storage Sentinel • MinIO"
              }
            ]
          }
    else:
      - id: log_storage_nominal
        type: io.kestra.plugin.core.log.Log
        message: "MinIO bucket {{ inputs.bucket_name }} storage nominal: {{ outputs.inspect_bucket_quota.vars.usage_pct }}% used ({{ outputs.inspect_bucket_quota.vars.used_gb }} GB / {{ outputs.inspect_bucket_quota.vars.quota_gb }} GB)."

outputs:
  - id: is_breach
    type: BOOLEAN
    value: "{{ outputs.inspect_bucket_quota.vars.is_breach }}"
  - id: usage_pct
    type: NUMBER
    value: "{{ outputs.inspect_bucket_quota.vars.usage_pct }}"
  - id: used_gb
    type: NUMBER
    value: "{{ outputs.inspect_bucket_quota.vars.used_gb }}"
  - id: quota_gb
    type: NUMBER
    value: "{{ outputs.inspect_bucket_quota.vars.quota_gb }}"

triggers:
  - id: scheduled_quota_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */4 * * *"
    disabled: true

extend:
  title: MinIO Bucket Disk Usage and Quota Headroom Sentinel
  metaTitle: MinIO Storage Quota Sentinel | Kestra Blueprint
  shortDescription: Monitors MinIO bucket storage usage against quotas and alerts on Slack.
  metaDescription: Monitors MinIO bucket disk usage against configured storage quotas, alerting infrastructure teams on Slack.
  description: |
    Monitors MinIO bucket disk usage against configured storage quotas, alerting infrastructure teams on Slack.
  tags:
    - Data
    - Infrastructure
