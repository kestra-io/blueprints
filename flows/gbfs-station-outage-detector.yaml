id: gbfs-station-outage-detector
namespace: company.team

description: |
  Detect bike-share stations that are out of service from any public GBFS feed. The flow follows
  the system's `gbfs.json` auto-discovery file to its `station_status` and `station_information`
  feeds, classifies every installed station with DuckDB (not renting, not accepting returns, no
  report for too long, or too many disabled bikes and docks), keeps a per-station outage streak in
  the KV store so an outage only alerts after it persists for several runs, reports recoveries,
  and tracks each station's uptime for the day. Defaults to Citi Bike (New York); works with
  GBFS 1.x, 2.x and 3.0 feeds without an API key.

inputs:
  - id: gbfs_url
    type: URI
    defaults: https://gbfs.citibikenyc.com/gbfs/gbfs.json
    description: The system's GBFS auto-discovery URL (`gbfs.json`). The MobilityData systems catalog lists one for over a thousand systems.

  - id: system_label
    type: STRING
    defaults: Citi Bike NYC
    description: Name used in alerts and log lines.

  - id: language
    type: STRING
    defaults: en
    description: Feed language to pick from a GBFS 1.x/2.x discovery file. If the system does not publish it, the first language is used. GBFS 3.0 files have no language level and ignore this.

  - id: confirm_runs
    type: INT
    defaults: 2
    description: Consecutive runs a station must be out of service before it alerts. With the 10-minute schedule, 2 means an outage is confirmed after about 10 to 20 minutes and a one-off dock reboot stays quiet.

  - id: stale_minutes
    type: INT
    defaults: 60
    description: An installed station whose `last_reported` is this much older than the feed's `last_updated` counts as out of service (station lost its connection).

  - id: min_out_of_service_docks
    type: INT
    defaults: 5
    description: Disabled bikes plus disabled docks needed before a station counts as degraded.

  - id: out_of_service_share
    type: FLOAT
    defaults: 0.5
    description: Share of the station's capacity that must be disabled (bikes plus docks) for it to count as degraded.

  - id: max_feed_age_minutes
    type: INT
    defaults: 30
    description: If the feed's own `last_updated` is older than this, the whole feed is stale. The run then alerts on the feed, leaves station streaks unchanged and does not count the run toward uptime.

  - id: sla_timezone
    type: STRING
    defaults: America/New_York
    description: Time zone that defines the SLA day for the daily uptime counters.

triggers:
  - id: every_10_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    description: Lyft-operated feeds refresh every minute (`ttl` 60). Ten minutes keeps the load low and still confirms an outage within half an hour.

tasks:
  - id: discover
    type: io.kestra.plugin.core.http.Request
    description: Reads the auto-discovery file, which lists the URL of every feed the system publishes.
    uri: "{{ inputs.gbfs_url }}"
    headers:
      User-Agent: kestra-gbfs-station-outage-detector/1.0 (https://kestra.io)
      Accept: application/json

  - id: feed_urls
    type: io.kestra.plugin.core.debug.Return
    description: |
      Picks the `station_status` and `station_information` URLs with jq. GBFS 3.0 lists feeds under
      `data.feeds`; 1.x and 2.x list them per language under `data.<lang>.feeds`, so the requested
      language is tried first and the first published language is the fallback.
    format: >-
      {{ outputs.discover.body | jq('(.data.feeds // .data["' ~ inputs.language ~ '"].feeds // ([.data[]][0].feeds)) as $f
      | {status: ([$f[] | select(.name == "station_status") | .url][0] // ""),
      information: ([$f[] | select(.name == "station_information") | .url][0] // "")} | tojson') | first }}

  - id: require_station_feeds
    type: io.kestra.plugin.core.execution.Fail
    description: Free-floating systems (most scooter and car-share operators) publish no station feeds. Fail with a clear message instead of a 404 further down.
    runIf: "{{ fromJson(outputs.feed_urls.value).status == '' or fromJson(outputs.feed_urls.value).information == '' }}"
    errorMessage: "{{ inputs.gbfs_url }} does not list both station_status and station_information. This flow needs a docked (station-based) GBFS system."

  - id: download_status
    type: io.kestra.plugin.core.http.Download
    uri: "{{ fromJson(outputs.feed_urls.value).status }}"
    headers:
      User-Agent: kestra-gbfs-station-outage-detector/1.0 (https://kestra.io)
    retry:
      type: constant
      interval: PT20S
      maxAttempts: 3

  - id: download_information
    type: io.kestra.plugin.core.http.Download
    uri: "{{ fromJson(outputs.feed_urls.value).information }}"
    headers:
      User-Agent: kestra-gbfs-station-outage-detector/1.0 (https://kestra.io)
    retry:
      type: constant
      interval: PT20S
      maxAttempts: 3

  - id: get_state
    type: io.kestra.plugin.core.kv.Get
    description: Per-station streaks and today's uptime counters from earlier runs. Missing on the first run, which is a baseline.
    key: "gbfs_outage_{{ inputs.gbfs_url | slugify }}"
    errorOnMissing: false

  - id: evaluate
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Normalises GBFS 1.x/2.x (epoch seconds, 0/1 flags, `num_bikes_*`) and 3.0 (ISO timestamps,
      booleans, `num_vehicles_*`, localised names) into one table and classifies installed stations.
      Uninstalled stations and virtual parking zones (no dock that can fail) are skipped. It then
      advances the streaks and returns one row with the counts, the new state and the alert text.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      status.json: "{{ outputs.download_status.uri }}"
      information.json: "{{ outputs.download_information.uri }}"
      state.json: "{{ outputs.get_state.value ?? '{}' }}"
    outputFiles:
      - uptime_csv
    parameters:
      tz: "{{ inputs.sla_timezone }}"
      confirm_runs: "{{ inputs.confirm_runs }}"
      stale_s: "{{ inputs.stale_minutes * 60 }}"
      min_oos: "{{ inputs.min_out_of_service_docks }}"
      oos_share: "{{ inputs.out_of_service_share }}"
      max_feed_age_s: "{{ inputs.max_feed_age_minutes * 60 }}"
      label: "{{ inputs.system_label }}"
      execution_url: "{{ kestra.url ?? '' }}/ui/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"
    sql: |
      SET TimeZone = 'UTC';
      CREATE MACRO to_epoch(v) AS coalesce(TRY_CAST(v AS BIGINT), CAST(epoch(TRY_CAST(v AS TIMESTAMPTZ)) AS BIGINT));
      CREATE MACRO flag(v) AS coalesce(lower(v) IN ('1', 'true'), true);
      CREATE MACRO num(a, b) AS coalesce(TRY_CAST(a AS INTEGER), TRY_CAST(b AS INTEGER), 0);

      CREATE TABLE feed AS
      SELECT to_epoch(CAST(content AS JSON)->>'$.last_updated') AS last_updated,
             CAST(epoch(now()) AS BIGINT) AS now_s,
             CAST(timezone(:tz, now()) AS DATE) AS today
      FROM read_text('status.json');

      CREATE TABLE info AS
      SELECT i->>'$.station_id' AS station_id,
             CASE WHEN json_type(i->'$.name') = 'ARRAY' THEN i->>'$.name[0].text' ELSE i->>'$.name' END AS name,
             TRY_CAST(i->>'$.capacity' AS INTEGER) AS capacity,
             coalesce(lower(i->>'$.is_virtual_station') IN ('1', 'true'), false) AS is_virtual
      FROM (SELECT unnest(from_json(json_extract(content, '$.data.stations'), '["JSON"]')) AS i FROM read_text('information.json'));

      CREATE TABLE st AS
      SELECT s->>'$.station_id' AS station_id,
             flag(s->>'$.is_installed') AS installed,
             flag(s->>'$.is_renting') AS renting,
             flag(s->>'$.is_returning') AS accepts_returns,
             to_epoch(s->>'$.last_reported') AS last_reported,
             num(s->>'$.num_bikes_available', s->>'$.num_vehicles_available') AS bikes,
             num(s->>'$.num_bikes_disabled', s->>'$.num_vehicles_disabled') AS bikes_disabled,
             num(s->>'$.num_docks_available', NULL) AS docks,
             num(s->>'$.num_docks_disabled', NULL) AS docks_disabled
      FROM (SELECT unnest(from_json(json_extract(content, '$.data.stations'), '["JSON"]')) AS s FROM read_text('status.json'));

      CREATE TABLE classified AS
      SELECT *,
             concat_ws(', ',
               CASE WHEN NOT renting AND NOT accepts_returns THEN 'offline (not renting, not accepting returns)'
                    WHEN NOT renting THEN 'not renting'
                    WHEN NOT accepts_returns THEN 'not accepting returns' END,
               CASE WHEN feed_last_updated - last_reported > CAST(:stale_s AS BIGINT)
                    THEN 'no report for ' || CAST(round((feed_last_updated - last_reported) / 3600.0, 1) AS VARCHAR) || ' h' END,
               CASE WHEN oos >= CAST(:min_oos AS INTEGER) AND oos >= CAST(:oos_share AS DOUBLE) * total
                    THEN CAST(oos AS VARCHAR) || ' of ' || CAST(total AS VARCHAR) || ' docks unusable (disabled bikes or docks)' END
             ) AS reason
      FROM (
        SELECT st.*, coalesce(info.name, st.station_id) AS name, f.last_updated AS feed_last_updated,
               st.bikes_disabled + st.docks_disabled AS oos,
               greatest(coalesce(info.capacity, 0), st.bikes + st.bikes_disabled + st.docks + st.docks_disabled) AS total
        FROM st LEFT JOIN info USING (station_id), feed f
        WHERE st.installed AND NOT coalesce(info.is_virtual, false)
      );

      CREATE TABLE prev_meta AS
      SELECT TRY_CAST(j->>'$.day' AS DATE) AS day, coalesce(TRY_CAST(j->>'$.runs_today' AS INTEGER), 0) AS runs_today,
             coalesce(TRY_CAST(j->>'$.feed_stale' AS BOOLEAN), false) AS prev_stale,
             coalesce(json_extract(j, '$.stations'), CAST('[]' AS JSON)) AS stations
      FROM (SELECT CAST(content AS JSON) AS j FROM read_text('state.json'));

      CREATE TABLE prev AS
      SELECT p->>'$.id' AS station_id, CAST(p->>'$.streak' AS INTEGER) AS streak, TRY_CAST(p->>'$.since' AS TIMESTAMPTZ) AS since,
             CAST(p->>'$.alerted' AS BOOLEAN) AS alerted, CAST(p->>'$.down_runs' AS INTEGER) AS down_runs, p->>'$.name' AS name
      FROM (SELECT unnest(from_json(stations, '["JSON"]')) AS p FROM prev_meta);

      CREATE TABLE ctx AS
      SELECT live, NOT live AS feed_stale, NOT live AND NOT prev_stale AS feed_went_stale, feed_age_s, is_baseline,
             CASE WHEN live THEN today ELSE coalesce(prev_day, today) END AS today,
             live AND prev_day IS DISTINCT FROM today AS new_day,
             CASE WHEN live AND prev_day IS DISTINCT FROM today THEN 0 ELSE prev_runs END + CASE WHEN live THEN 1 ELSE 0 END AS runs_today
      FROM (SELECT f.now_s - f.last_updated <= CAST(:max_feed_age_s AS BIGINT) AS live, f.now_s - f.last_updated AS feed_age_s,
                   pm.day IS NULL AS is_baseline, f.today, pm.day AS prev_day, pm.runs_today AS prev_runs, pm.prev_stale
            FROM feed f, prev_meta pm);

      CREATE TABLE events AS
      SELECT *,
             r_live AND down AND streak >= CAST(:confirm_runs AS INTEGER) AND NOT was_alerted AS new_outage,
             r_live AND NOT coalesce(down, false) AND was_alerted AS recovered
      FROM (
        SELECT coalesce(c.station_id, p.station_id) AS station_id,
               coalesce(c.name, p.name) AS name,
               c.reason <> '' AS down,
               c.station_id IS NULL AS gone,
               c.reason,
               r.live AS r_live,
               CASE WHEN NOT r.live THEN coalesce(p.streak, 0) WHEN c.reason <> '' THEN coalesce(p.streak, 0) + 1 ELSE 0 END AS streak,
               CASE WHEN NOT r.live THEN p.since WHEN c.reason <> '' THEN coalesce(p.since, now()) END AS since,
               CASE WHEN r.new_day THEN 0 ELSE coalesce(p.down_runs, 0) END
                 + CASE WHEN r.live AND c.reason <> '' THEN 1 ELSE 0 END AS down_runs,
               coalesce(p.alerted, false) AS was_alerted
        FROM classified c FULL JOIN prev p USING (station_id), ctx r
      );

      CREATE TABLE totals AS
      SELECT (SELECT count(*) FROM classified) AS installed,
             (SELECT count(*) FROM st WHERE NOT installed) AS not_installed,
             (SELECT count(*) FROM st JOIN info USING (station_id) WHERE st.installed AND info.is_virtual) AS virtual_stations,
             (SELECT count(*) FILTER (WHERE reason <> '') FROM classified) AS down_now,
             (SELECT coalesce(sum(down_runs), 0) FROM events WHERE NOT gone) AS down_station_runs,
             (SELECT runs_today FROM ctx) AS runs_today;

      COPY (
        SELECT c.station_id, c.name, c.reason <> '' AS down, c.reason, c.bikes, c.oos AS out_of_service, c.total AS capacity,
               coalesce(e.streak, 0) AS streak, e.since AS down_since, coalesce(e.down_runs, 0) AS down_runs_today, t.runs_today,
               round(100 * (1 - coalesce(e.down_runs, 0) / greatest(t.runs_today, 1)), 2) AS uptime_pct_today
        FROM classified c LEFT JOIN events e USING (station_id), totals t
        ORDER BY uptime_pct_today, streak DESC, name
      ) TO '{{ outputFiles.uptime_csv }}' (HEADER, DELIMITER ',');

      CREATE TABLE result AS
      SELECT CAST(:label AS VARCHAR) AS system,
             r.is_baseline, r.feed_stale, r.feed_went_stale, r.feed_age_s, CAST(r.today AS VARCHAR) AS sla_day,
             t.installed, t.not_installed, t.virtual_stations, t.down_now, t.runs_today,
             (SELECT count(*) FROM events WHERE new_outage) AS new_outages,
             (SELECT count(*) FROM events WHERE recovered) AS recovered,
             (SELECT count(*) FROM events WHERE r_live AND down AND NOT new_outage AND NOT was_alerted) AS pending_confirmation,
             round(100 * (1 - t.down_station_runs / greatest(t.runs_today * t.installed, 1)), 3) AS system_uptime_pct_today,
             (SELECT coalesce(string_agg(line, chr(10)), '') FROM (
                SELECT '- ' || name || ' (' || station_id || ')' || chr(58) || ' ' || reason || ', down since ' || strftime(since, '%Y-%m-%d %H.%M UTC') AS line
                FROM events WHERE new_outage ORDER BY since, name LIMIT 25)) AS new_outage_lines,
             (SELECT coalesce(string_agg(line, chr(10)), '') FROM (
                SELECT '- ' || name || ' (' || station_id || ')' || CASE WHEN gone THEN ' removed from the feed or uninstalled' ELSE ' back in service' END AS line
                FROM events WHERE recovered ORDER BY name LIMIT 25)) AS recovered_lines,
             CAST(json_object('day', CAST(r.today AS VARCHAR), 'runs_today', t.runs_today, 'feed_stale', r.feed_stale, 'stations',
                    (SELECT coalesce(json_group_array(json_object('id', station_id, 'name', name, 'streak', streak, 'since', CAST(since AS VARCHAR),
                             'alerted', CASE WHEN r_live THEN coalesce(down, false) AND (was_alerted OR new_outage) ELSE was_alerted END,
                             'down_runs', down_runs)), CAST('[]' AS JSON))
                     FROM events WHERE (streak > 0 OR down_runs > 0) AND (NOT gone OR NOT r_live))) AS VARCHAR) AS next_state
      FROM ctx r, totals t;

      SELECT * EXCLUDE (new_outage_lines, recovered_lines),
             CASE WHEN feed_stale
                  THEN 'GBFS feed of ' || system || ' is stale, last updated ' || CAST(CAST(round(feed_age_s / 60) AS INTEGER) AS VARCHAR) || ' min ago. Station streaks and uptime counters were left unchanged.'
                  ELSE system || chr(58) || ' ' || CAST(new_outages AS VARCHAR) || ' new station outage(s) confirmed over ' || CAST(:confirm_runs AS VARCHAR) || ' runs, '
                       || CAST(recovered AS VARCHAR) || ' recovered. Out of service now ' || CAST(down_now AS VARCHAR) || ' of ' || CAST(installed AS VARCHAR)
                       || ' installed stations, system uptime today ' || CAST(system_uptime_pct_today AS VARCHAR) || '%.'
                       || CASE WHEN new_outages > 0 THEN chr(10) || 'New outages' || chr(58) || chr(10) || new_outage_lines || CASE WHEN new_outages > 25 THEN chr(10) || '... and ' || CAST(new_outages - 25 AS VARCHAR) || ' more in the uptime CSV' ELSE '' END ELSE '' END
                       || CASE WHEN recovered > 0 THEN chr(10) || 'Recovered' || chr(58) || chr(10) || recovered_lines || CASE WHEN recovered > 25 THEN chr(10) || '... and ' || CAST(recovered - 25 AS VARCHAR) || ' more' ELSE '' END ELSE '' END
             END || chr(10) || 'Execution and uptime CSV' || chr(58) || ' ' || CAST(:execution_url AS VARCHAR) AS alert_text
      FROM result;

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    key: "gbfs_outage_{{ inputs.gbfs_url | slugify }}"
    value: "{{ outputs.evaluate.outputs[0].row.next_state }}"

  - id: alert_on_changes
    type: io.kestra.plugin.core.flow.If
    description: Posts only when something changed (an outage got confirmed, a station recovered, or the feed itself just went stale), so a quiet system sends nothing.
    condition: "{{ outputs.evaluate.outputs[0].row.feed_went_stale or outputs.evaluate.outputs[0].row.new_outages > 0 or outputs.evaluate.outputs[0].row.recovered > 0 }}"
    then:
      - id: notify
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: allowFailure keeps the check green when the webhook is not configured; the same text is logged by `log_changes`.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": {{ (':rotating_light: ' ~ outputs.evaluate.outputs[0].row.alert_text) | toJson }}}

      - id: log_changes
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "{{ outputs.evaluate.outputs[0].row.alert_text }}"
    else:
      - id: no_changes
        type: io.kestra.plugin.core.log.Log
        message: "{{ outputs.evaluate.outputs[0].row.system }}: no new outages or recoveries."

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      {{ outputs.evaluate.outputs[0].row.system }}{{ outputs.evaluate.outputs[0].row.is_baseline ? ' (BASELINE run)' : '' }}:
      {{ outputs.evaluate.outputs[0].row.installed }} installed stations ({{ outputs.evaluate.outputs[0].row.not_installed }} uninstalled and {{ outputs.evaluate.outputs[0].row.virtual_stations }} virtual stations skipped),
      {{ outputs.evaluate.outputs[0].row.down_now }} out of service now, {{ outputs.evaluate.outputs[0].row.new_outages }} newly confirmed,
      {{ outputs.evaluate.outputs[0].row.pending_confirmation }} waiting for confirmation, {{ outputs.evaluate.outputs[0].row.recovered }} recovered.
      Feed age {{ outputs.evaluate.outputs[0].row.feed_age_s }} s{{ outputs.evaluate.outputs[0].row.feed_stale ? ' (STALE)' : '' }}.
      SLA day {{ outputs.evaluate.outputs[0].row.sla_day }}: run {{ outputs.evaluate.outputs[0].row.runs_today }}, system uptime {{ outputs.evaluate.outputs[0].row.system_uptime_pct_today }}%.

outputs:
  - id: summary
    type: JSON
    value: >-
      {%- set r = outputs.evaluate.outputs[0].row -%}
      {{ {'system': r.system, 'is_baseline': r.is_baseline, 'feed_stale': r.feed_stale, 'feed_age_s': r.feed_age_s, 'sla_day': r.sla_day, 'installed': r.installed, 'not_installed': r.not_installed, 'virtual_stations': r.virtual_stations, 'down_now': r.down_now, 'new_outages': r.new_outages, 'pending_confirmation': r.pending_confirmation, 'recovered': r.recovered, 'runs_today': r.runs_today, 'system_uptime_pct_today': r.system_uptime_pct_today} | toJson }}
  - id: uptime_csv
    type: FILE
    value: "{{ outputs.evaluate.outputFiles.uptime_csv }}"

extend:
  title: Detect Bike-Share Station Outages and Track Daily Uptime from GBFS Feeds
  metaTitle: GBFS Bike-Share Station Outage Detector with DuckDB and Slack | Kestra
  shortDescription: Follow any bike-share system's GBFS auto-discovery file, flag stations that stopped renting, stopped reporting or have most docks disabled, confirm outages over consecutive runs with the KV store, alert on new outages and recoveries, and track per-station uptime for the day.
  metaDescription: Detect bike-share station outages from any GBFS feed (Citi Bike by default), confirm them over runs, alert in Slack and track daily station uptime.
  description: |
    Bike-share operators and the cities that contract them care about how much of the time each station can rent a bike and take one back. Public GBFS feeds carry the signals, but one snapshot is noisy: docks reboot, heartbeats get missed, and some feeds list virtual parking zones or retired stations. This flow confirms an outage only after it persists, reports each outage and recovery once, and counts per-station uptime for the SLA day.

    ## How it works

    1. A `Schedule` trigger runs every 10 minutes. `discover` reads the system's `gbfs.json` and `feed_urls` (jq) picks the `station_status` and `station_information` URLs from the GBFS 3.0 layout or the 1.x/2.x per-language layout (`language`, else the first one).
    2. `require_station_feeds` (Fail) stops free-floating systems that publish no station feeds.
    3. Both feeds are downloaded with retries; `get_state` (KV Get) loads the streaks under a key derived from `gbfs_url`.
    4. `evaluate` (DuckDB) normalises 1.x/2.x and 3.0 fields, skips uninstalled and virtual stations, and marks a station down when it is not renting or returning, has not reported for `stale_minutes`, or has `min_out_of_service_docks` disabled bikes and docks covering `out_of_service_share` of capacity. `confirm_runs` consecutive down runs confirm an outage; a confirmed station that is fine again or left the feed recovers. A feed older than `max_feed_age_minutes` freezes streaks and alerts once.
    5. `save_state` (KV Set) stores streaks, alert flags and today's down-run counts.
    6. `alert_on_changes` (If) posts to Slack and logs at WARN only when something changed; `summary` always logs.

    ## What you get

    - One message per change: new outages with reason (e.g. `no report for 30.6 h`, `65 of 94 docks unusable`) and start time, plus recoveries.
    - `uptime_csv`: per installed station status, reason, unusable docks, streak, down-since and uptime today.
    - A `summary` output with counts and system-wide uptime for the day.
    - No alert storms: short blips stay quiet and a stale feed alerts once.

    ## Who it's for

    - Bike-share operations teams dispatching field technicians.
    - City mobility and contract managers checking a station availability SLA.
    - Mobility data engineers who depend on GBFS feeds.

    ## Why orchestrate this with Kestra

    - Streaks live in the KV store, so "confirm over N runs, report once" needs no database.
    - The classification is SQL you can read and tune in the flow.
    - Retries, the Fail guard and `allowFailure` on Slack are declarative; one flow serves any GBFS system.

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB plugin and the Slack plugin.
    - Outbound HTTPS to the GBFS host (`gbfs.citibikenyc.com`, `gbfs.lyft.com`). No API key.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook (optional; without it the message is only logged at WARN).

    ## Quick start

    1. Click **Execute**. The first run is a BASELINE: of about 2,500 Citi Bike stations a few dozen are down, all pending confirmation.
    2. Execute again: those still down are confirmed and listed. Later runs report only changes.
    3. Set `gbfs_url` to another system from MobilityData's `systems.csv`, adjust `system_label` and `sla_timezone`, add the Slack secret.

    ## How to extend

    - Append `uptime_csv` to a warehouse table for monthly SLA reports.
    - Route outages per `region_id` or open a ticket for the field team.

    ## Links

    - [GBFS specification](https://github.com/MobilityData/gbfs/blob/master/gbfs.md) and [systems catalog](https://github.com/MobilityData/gbfs/blob/master/systems.csv)
    - [HTTP Request](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.request) and [HTTP Download](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [KV Store](https://kestra.io/docs/concepts/kv-store)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - Testing & Quality
  ee: false
  demo: false
