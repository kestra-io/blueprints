id: vpa-recommender-cgroup-oom-event-sentinel
namespace: company.sre

description: |
  Audits Kubernetes Vertical Pod Autoscaler recommender metrics to detect pod cgroup OOM events, recommendation latency, and model decay.

concurrency:
  limit: 1

inputs:
  - id: vpa_metrics_url
    type: STRING
    displayName: "VPA Metrics URL"
    defaults: "http://vpa-recommender.kube-system.svc.cluster.local:8942"
    description: "Internal HTTP endpoint exposing Prometheus metrics for the Kubernetes Vertical Pod Autoscaler recommender component."

  - id: target_vpa_namespace
    type: STRING
    displayName: "Target VPA Namespace"
    defaults: "production"
    description: "Kubernetes namespace monitored for workload memory cgroup Out Of Memory (OOM) events and recommendation lags."

  - id: max_oom_events_threshold
    type: INT
    displayName: "Max OOM Events Threshold"
    defaults: 1
    description: "Maximum allowable container cgroup OOM kills observed during the recommender evaluation cycle before alerting."

  - id: max_recommender_duration_ms
    type: INT
    displayName: "Max Recommender Duration (ms)"
    defaults: 2500
    description: "Maximum allowable execution duration in milliseconds for the VPA recommender history loop to complete."

  - id: alert_on_missing_history
    type: BOOL
    displayName: "Alert on Missing History"
    defaults: true
    description: "Toggle whether Prometheus history provider data starvation or metric sample gaps trigger an incident notification."

outputs:
  - id: oom_events_total
    type: INT
    value: "{{ outputs.scan_vpa_telemetry.vars.oom_events_total }}"
  - id: recommender_latency_ms
    type: INT
    value: "{{ outputs.scan_vpa_telemetry.vars.recommender_latency_ms }}"
  - id: managed_vpa_objects_count
    type: INT
    value: "{{ outputs.scan_vpa_telemetry.vars.managed_vpa_objects_count }}"
  - id: history_samples_count
    type: INT
    value: "{{ outputs.scan_vpa_telemetry.vars.history_samples_count }}"
  - id: is_alerting
    type: BOOLEAN
    value: "{{ outputs.scan_vpa_telemetry.vars.is_alerting }}"
  - id: target_namespace
    type: STRING
    value: "{{ outputs.scan_vpa_telemetry.vars.target_namespace }}"
  - id: audit_timestamp
    type: STRING
    value: "{{ outputs.scan_vpa_telemetry.vars.audit_timestamp }}"


tasks:
  - id: scan_vpa_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Kubernetes VPA recommender Prometheus metrics to audit cgroup OOM events, recommendation cycle durations, and aggregate model sample counts.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.vpa_metrics_url }}"
      TARGET_NAMESPACE: "{{ inputs.target_vpa_namespace }}"
      MAX_OOM: "{{ inputs.max_oom_events_threshold }}"
      MAX_DURATION: "{{ inputs.max_recommender_duration_ms }}"
      ALERT_HISTORY: "{{ inputs.alert_on_missing_history }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METRICS_URL", "").rstrip("/")
      target_ns = os.environ.get("TARGET_NAMESPACE", "production")
      max_oom = int(os.environ.get("MAX_OOM", "1"))
      max_duration = int(os.environ.get("MAX_DURATION", "2500"))
      alert_history = os.environ.get("ALERT_HISTORY", "true").lower() == "true"

      oom_events_total = 0
      recommender_latency_ms = 0
      managed_vpa_objects = 0
      history_samples_count = 0
      degraded_workloads = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "vpa_recommender_oom_events_total" in line:
                  oom_events_total += int(val)
                  if oom_events_total > max_oom:
                      degraded_workloads.append(f"{target_ns}-oom-spike")
              elif "vpa_recommender_execution_latency_ms" in line:
                  recommender_latency_ms = max(recommender_latency_ms, int(val))
              elif "vpa_recommender_vpa_object_count" in line:
                  managed_vpa_objects = max(managed_vpa_objects, int(val))
              elif "vpa_recommender_metric_samples_count" in line:
                  history_samples_count = max(history_samples_count, int(val))
      except Exception as err:
          print(f"Error: Failed to scrape VPA metrics: {err}", file=sys.stderr)
          sys.exit(1)

      is_breached = bool(
          (oom_events_total > max_oom) or
          (recommender_latency_ms > max_duration) or
          (alert_history and history_samples_count < 10)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"VPA namespace '{target_ns}' audit: {oom_events_total} cgroup OOMs, "
          f"{recommender_latency_ms}ms cycle latency, {managed_vpa_objects} VPAs active, "
          f"{history_samples_count} historical metric samples."
      )
      print(f"VPA Telemetry Complete: {summary}")

      Kestra.outputs({
          "oom_events_total": oom_events_total,
          "recommender_latency_ms": recommender_latency_ms,
          "managed_vpa_objects_count": managed_vpa_objects,
          "history_samples_count": history_samples_count,
          "degraded_workloads": list(set(degraded_workloads)),
          "is_alerting": is_breached,
          "target_namespace": target_ns,
          "audit_timestamp": now_iso
      })

  - id: evaluate_vpa_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed VPA recommender cgroup OOM kills, cycle latencies, or sample counts breach thresholds.
    condition: "{{ outputs.scan_vpa_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to SRE Platform Slack channel detailing VPA workload OOM kills.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#platform-autoscaling-alerts",
            "text": "CRITICAL: VPA Workload cgroup OOM Events in Namespace `{{ inputs.target_vpa_namespace }}`. Observed OOM Kills: `{{ outputs.scan_vpa_telemetry.vars.oom_events_total }}` (max allowable: `{{ inputs.max_oom_events_threshold }}`). Recommender Latency: `{{ outputs.scan_vpa_telemetry.vars.recommender_latency_ms }}`ms (threshold: `{{ inputs.max_recommender_duration_ms }}`ms). Active VPA Objects: `{{ outputs.scan_vpa_telemetry.vars.managed_vpa_objects_count }}`. Historical Samples: `{{ outputs.scan_vpa_telemetry.vars.history_samples_count }}`. Audit Timestamp: `{{ outputs.scan_vpa_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_vpa_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when VPA recommender computes resource bounds cleanly without container memory starvation.
        message: "VPA recommender operating nominally: {{ outputs.scan_vpa_telemetry.vars.managed_vpa_objects_count }} VPAs managed, zero cgroup OOM kills, recommender latency {{ outputs.scan_vpa_telemetry.vars.recommender_latency_ms }}ms."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured JSON audit manifest for Kubernetes autoscaling compliance and capacity management archives.
    format: |
      {
        "sentinel_id": "vpa-recommender-cgroup-oom-event-sentinel",
        "target_namespace": "{{ outputs.scan_vpa_telemetry.vars.target_namespace }}",
        "oom_events": {{ outputs.scan_vpa_telemetry.vars.oom_events_total }},
        "recommender_latency_ms": {{ outputs.scan_vpa_telemetry.vars.recommender_latency_ms }},
        "managed_vpa_objects": {{ outputs.scan_vpa_telemetry.vars.managed_vpa_objects_count }},
        "history_samples": {{ outputs.scan_vpa_telemetry.vars.history_samples_count }},
        "degraded_workloads": {{ outputs.scan_vpa_telemetry.vars.degraded_workloads | toJson }},
        "breach_detected": {{ outputs.scan_vpa_telemetry.vars.is_alerting }},
        "execution_timestamp": "{{ outputs.scan_vpa_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_vpa_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: VPA Recommender cgroup OOM Event Sentinel
  metaTitle: VPA Recommender cgroup OOM Event Sentinel
  shortDescription: Audits Vertical Pod Autoscaler telemetry to detect cgroup OOM kills and recommendation lag.
  metaDescription: Scrapes Kubernetes VPA recommender metrics to detect pod cgroup OOM kills, model latency, and recommendation decay.
  description: |
    Automates continuous health monitoring for the Kubernetes Vertical Pod Autoscaler (VPA) recommender controller. The workflow scrapes Prometheus metrics to identify container cgroup Out Of Memory (OOM) events, recommender calculation cycle lag, and historical metric starvation before workloads crash in production.

    ## How it works
    1. A schedule trigger executes the VPA recommender audit workflow every 15 minutes.
    2. The Python task queries the VPA recommender Prometheus metrics endpoint on port 8942.
    3. The script extracts observed cgroup OOM counts, calculation loop latencies, and managed VPA counts.
    4. An evaluation gate determines whether container OOM events or recommender loop delays exceed safety limits.
    5. When memory starvation or cgroup kill spikes occur, a high-priority Slack alert is dispatched to SRE Platform teams.
    6. When recommendation models execute cleanly without OOM faults, nominal metrics are recorded in logs.
    7. A structured JSON audit manifest is emitted for infrastructure capacity governance and compliance archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape VPA Metrics]
        ScanMetrics --> EvalBreach{OOM > 1 OR Latency > 2500ms OR Samples < 10?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Platform Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal VPA State]
        SlackAlert --> EmitManifest[Debug Return: VPA Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes VPA recommender metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether cgroup OOM kills or recommender calculation latency exceed limits.
    - **Notification Task**: Dispatches structured Slack alerts with affected namespaces and OOM counts.
    - **Audit Manifest**: Emits JSON execution payloads containing autoscaling health and timestamps.

    ## Key capabilities
    - Continuous surveillance of VPA Recommender historical decay models and recommendation bounds.
    - Early warning detection for container cgroup OOM kills caused by tight memory limits.
    - Automated tracking of metrics-server and Prometheus query latency during recommendation evaluation.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into Kubernetes workload vertical rightsizing and capacity efficiency.
    - Proactive alerts preventing recurring container crash loops due to underprovisioned pod memory.
    - Standardized audit manifests containing exact OOM tallies, calculation times, and sample sizes.
    - Zero-overhead deployment compatible with GKE, EKS, AKS, and bare-metal Kubernetes distributions.

    ## Who it's for
    - Platform engineering teams tuning automated CPU and memory rightsizing policies across clusters.
    - Site Reliability Engineers preventing cascading OOM kill loops in critical stateful services.
    - FinOps architects balancing cloud compute cost efficiency with container availability guarantees.
    - Infrastructure operators managing large-scale multi-tenant Kubernetes clusters.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages autoscaling surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical rightsizing telemetry in searchable Kestra execution logs.

    ## Use cases
    - **Sudden Traffic Inrush**: Identifies bursty workloads that exceed VPA memory recommendations during traffic surges.
    - **Prometheus Metric Starvation**: Detects when VPA cannot retrieve historical CPU/memory metrics from Prometheus.
    - **Memory Leak Diagnosis**: Alerts operators when containers steadily trigger OOM kills despite increasing VPA limits.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `vpa_metrics_url` | STRING | `http://vpa-recommender.kube-system.svc.cluster.local:8942` | Internal HTTP URL exposing Prometheus metrics for VPA. |
    | `target_vpa_namespace` | STRING | `production` | Kubernetes namespace monitored for workload cgroup OOM events. |
    | `max_oom_events_threshold` | INT | `1` | Maximum allowable container cgroup OOM kills before alerting. |
    | `max_recommender_duration_ms` | INT | `2500` | Maximum acceptable recommender calculation duration in ms. |
    | `alert_on_missing_history` | BOOL | `true` | Toggle whether history metric starvation triggers an alert. |

    ## Expected outputs
    - `{{ outputs.scan_vpa_telemetry.vars.oom_events_total }}`: Total observed container cgroup OOM kill events.
    - `{{ outputs.scan_vpa_telemetry.vars.recommender_latency_ms }}`: Measured VPA recommender calculation loop duration.
    - `{{ outputs.scan_vpa_telemetry.vars.managed_vpa_objects_count }}`: Count of active VerticalPodAutoscaler CRDs tracked.
    - `{{ outputs.scan_vpa_telemetry.vars.is_alerting }}`: Boolean flag indicating if autoscaling bounds are breached.
    - `{{ outputs.scan_vpa_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the VPA telemetry audit run.

    ## Prerequisites
    - Kubernetes Vertical Pod Autoscaler installed with recommender metrics enabled on port 8942.
    - Network connectivity from the Kestra worker to the VPA recommender service.
    - Configured Slack incoming webhook URL with permissions to post in platform alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing autoscaling alerts to the Platform Slack channel.

    ## Quick start
    1. Verify that VPA recommender exposes Prometheus metrics on HTTP port 8942.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your target namespace in `target_vpa_namespace`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_vpa_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **OOM Kill Bump Factor**: If `oom-bump-up-ratio` is too low, workloads repeatedly OOM before VPA adapts.
    - **Prometheus Query Timeout**: Heavy metric queries cause recommender loops to exceed scrape timeouts.
    - **HPA/VPA Target CPU Conflict**: Running HPA and VPA simultaneously on CPU metrics causes thrashing.
    - **UpdateMode Auto Pod Eviction**: In Auto mode, VPA evicts pods during OOM recovery without disruption budgets.

    ## How to extend
    - **Dynamic Limit Bump**: Automate a Kestra Kubernetes task to increase container memory limits upon OOM bursts.
    - **PagerDuty Escalation**: Escalate to on-call platform engineers if OOM kills exceed 5 events in 15 minutes.
    - **Multi-Namespace Fleet Scan**: Expand script parameters to iterate across all production application namespaces.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Kubernetes Vertical Pod Autoscaler Official Repository](https://github.com/kubernetes/autoscaler/tree/master/vertical-pod-autoscaler)
    - [VPA Architecture and Recommender Design Documentation](https://github.com/kubernetes/autoscaler/blob/master/vertical-pod-autoscaler/pkg/recommender/README.md)
    - [Kubernetes Container Resource Management and OOM Guide](https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Kubernetes Operations
  ee: false
  demo: false
