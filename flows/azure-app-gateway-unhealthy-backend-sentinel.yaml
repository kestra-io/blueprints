id: azure-app-gateway-unhealthy-backend-sentinel
namespace: company.cloud

inputs:
  - id: subscription_id
    type: STRING
    description: Azure Subscription ID.
  - id: resource_group
    type: STRING
    description: Azure Resource Group name.
  - id: gateway_name
    type: STRING
    description: Azure Application Gateway name.

tasks:
  - id: check_backend_health
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: mcr.microsoft.com/azure-cli:latest
    commands:
      - |
        az login --service-principal -u "{{ secret('AZURE_CLIENT_ID') }}" -p "{{ secret('AZURE_CLIENT_SECRET') }}" --tenant "{{ secret('AZURE_TENANT_ID') }}" --output none
        az account set --subscription "{{ inputs.subscription_id }}"
        
        # Query backend health status across all address pools
        az network application-gateway show-backend-health           --name "{{ inputs.gateway_name }}"           --resource-group "{{ inputs.resource_group }}"           --query "backendAddressPools[].backendHttpSettingsCollection[].backendAddresses[?health!='Healthy']"           --output json > /tmp/gateway_telemetry.json
        
        UNHEALTHY_COUNT=$(jq 'flatten | length' /tmp/gateway_telemetry.json)
        echo "::set-output name=unhealthy_count::$UNHEALTHY_COUNT::"

  - id: evaluate_unhealthy_backends
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.check_backend_health.vars.unhealthy_count | int > 0 }}"
    then:
      - id: notify_networking_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#networking-ops",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Azure Application Gateway Unhealthy Backend Alert",
                "text": "Application Gateway `{{ inputs.gateway_name }}` detected *{{ outputs.check_backend_health.vars.unhealthy_count }} unhealthy backend host(s)*! Ingress traffic is experiencing degraded redundancy or service routing failures.",
                "footer": "Kestra Cloud Sentinel • Microsoft Azure Networking"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#networking-ops",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Azure Application Gateway Sentinel Failure",
            "text": "Failed to query Application Gateway backend health. Verify gateway name and service principal network reader access.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      subscription_id: replace-with-your-subscription-id
      resource_group: replace-with-your-resource-group
      gateway_name: replace-with-your-gateway-name

extend:
  metaDescription: "Monitors Azure Application Gateway backend health pools for unhealthy host instances to prevent traffic blackholing."
  metaTitle: Microsoft Azure Application Gateway Unhealthy Backend Host Pool Sentinel with Kestra
  title: Microsoft Azure Application Gateway Unhealthy Backend Host Pool Sentinel
  shortDescription: Monitors Azure Application Gateway backend health pools for unhealthy host instances to prevent traffic blackholing.
  description: |
    ## How it works
    This workflow executes `az network application-gateway show-backend-health` via an Azure CLI container to audit the operational health of all backend pools and servers behind a Microsoft Azure Application Gateway (v1/v2). In layer-7 application load balancing, when backend virtual machines, VM scale sets, or App Service endpoints fail health probe HTTP checks, the gateway ceases routing or returns HTTP 502 Bad Gateway responses. The flow inspects all backend pool targets, flattens the result, and alerts network operations when unhealthy backend targets are detected.

    ## What you get
    - Real-time visibility into degraded application gateway backend targets.
    - Prevents customer-facing HTTP 502/504 gateway timeouts.
    - Immediate detection of backend server probe failures and health regression.

    ## Who it's for
    - Cloud Network Engineers and Site Reliability Engineers managing Azure ingress controllers and load balancers.
    - Application Operations teams maintaining high-availability web services.

    ## Why orchestrate this with Kestra
    - **Continuous Ingress Health Auditing**: Periodically polls gateway health alongside backend application statuses.
    - **Zero Footprint Azure CLI Execution**: Standardizes Azure management tasks within containerized steps.
    - **Fast Remediation Dispatch**: Routes detailed failure notifications directly to network reliability channels.

    ## Prerequisites
    - Azure Service Principal with `Network Contributor` or `Reader` permissions on the Application Gateway resource.
    - Secrets `AZURE_CLIENT_ID`, `AZURE_CLIENT_SECRET`, `AZURE_TENANT_ID`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Provide your Azure Subscription ID, Resource Group, and Application Gateway name.
    3. Run the workflow to inspect backend health.

    ## How to extend
    - Automatically trigger diagnostic log exports to Azure Log Analytics for failing probe investigations.
    - Add a remediation step to recycle unhealthy VM scale set instances.

    ## Links
    - [Application Gateway Backend Health and Diagnostics](https://learn.microsoft.com/en-us/azure/application-gateway/application-gateway-backend-health-troubleshooting)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Azure Services
    - Infrastructure Automation
  ee: false
  verified: false
  demo: false
