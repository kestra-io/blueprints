id: unattached-eip-finder
namespace: company.finops

description: |
  Finds unattached Elastic IPs silently billing you. An Elastic IP not associated
  with a running instance costs $3.65/month, and they accumulate every time an
  instance is terminated without releasing its address. This flow audits your
  regions weekly and reports the waste, with an opt-in release gate.

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to audit for unattached Elastic IPs.
  - id: monthly_cost_usd
    type: STRING
    defaults: "3.65"
    description: Monthly cost of one unattached Elastic IP in USD (AWS list price).
  - id: auto_release
    type: BOOL
    defaults: false
    description: When true, release unattached EIPs older than min_age_days. Default false (report-only).

tasks:
  - id: find_unattached
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit Elastic IPs region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: List unassociated Elastic IPs and estimate the waste.
        commands:
          - |
            REGION="{{ taskrun.value }}"
            PRICE="{{ inputs.monthly_cost_usd }}"
            echo "Checking Elastic IPs in $REGION"
            aws ec2 describe-addresses --region "$REGION" \
              --query 'Addresses[?AssociationId==`null`].[PublicIp,AllocationId]' \
              --output text > /tmp/eips.txt || true
            COUNT=$(grep -c . /tmp/eips.txt 2>/dev/null || echo 0)
            LIST=$(tr '\n' ' ' < /tmp/eips.txt)
            SAVINGS=$(python3 -c "print('{:.2f}'.format($COUNT * float('$PRICE')))")
            if [ "$COUNT" -gt 0 ]; then HAS_WASTE=true; else HAS_WASTE=false; fi
            echo "HAS_WASTE=$HAS_WASTE"
            echo "EIP_COUNT=$COUNT"
            echo "EIP_LIST=$LIST"
            echo "EST_MONTHLY_SAVINGS=$SAVINGS"
            echo "REGION_DONE=$REGION"
            echo "AUTO_RELEASE={{ inputs.auto_release }}"
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ taskrun.value }}"
      - id: notify_region
        type: io.kestra.plugin.core.flow.If
        description: Report unattached EIPs, release them only with explicit opt-in.
        condition: "{{ outputs.audit_region.vars.HAS_WASTE == 'true' }}"
        then:
          - id: release_gate
            type: io.kestra.plugin.core.flow.If
            description: Release EIPs only when auto_release is explicitly true.
            condition: "{{ inputs.auto_release == true }}"
            then:
              - id: release_eips
                type: io.kestra.plugin.aws.cli.AwsCLI
                description: Release the unattached Elastic IPs.
                commands:
                  - |
                    REGION="{{ taskrun.value }}"
                    while read -r IP ALLOC; do
                      [ -z "$ALLOC" ] && continue
                      echo "Releasing $IP ($ALLOC)"
                      aws ec2 release-address --region "$REGION" --allocation-id "$ALLOC" && echo "released $IP"
                    done < /tmp/eips.txt
                env:
                  AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
                  AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
                  AWS_DEFAULT_REGION: "{{ taskrun.value }}"
            else:
              - id: slack_waste
                type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                payload: |
                  {
                    "text": ":money_with_wings: Unattached EIPs in `{{ outputs.audit_region.vars.REGION_DONE }}` — *{{ outputs.audit_region.vars.EIP_COUNT }}* unassociated address(es), ~${{ outputs.audit_region.vars.EST_MONTHLY_SAVINGS }}/mo waste.\n`{{ outputs.audit_region.vars.EIP_LIST }}`\nRelease them in the EC2 console, or set `auto_release: true` to clean up automatically."
                  }
        else:
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            message: "No unattached Elastic IPs in {{ outputs.audit_region.vars.REGION_DONE }} — every address is associated."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Sunday at 02:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 2 * * 0"
    disabled: true

extend:
  title: Unattached Elastic IP Finder
  metaTitle: Find Unattached Elastic IPs Wasting Money | Kestra
  shortDescription: Audit Elastic IPs across regions, find the ones not attached to anything, and get a Slack report of the waste with an opt-in auto-release gate.
  metaDescription: Unattached Elastic IPs cost $3.65/mo each. This flow finds them across regions and reports the waste weekly.
  description: |
    An Elastic IP costs nothing while attached to a running instance — and $3.65/month the moment it isn't. Every terminated instance that kept its address, every failed deployment, every "temporary" EIP leaves one behind, and they bill forever. This blueprint finds them with the real EC2 API.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 02:00 UTC (shipped disabled).
    2. A ForEach loop audits each region in `aws_regions`.
    3. Per region, the flow lists addresses with no `AssociationId` — genuinely unattached EIPs.
    4. Monthly waste is estimated at the EIP list price per unattached address.
    5. An `If` task either releases them (only when `auto_release` is explicitly true) or posts a Slack report — report-only by default, so nothing is ever deleted by surprise.

    ## What you get

    - A weekly list of unattached Elastic IPs with allocation IDs, ready to release.
    - A dollar estimate of the waste, so the cleanup gets prioritized.
    - Multi-region coverage in one run.
    - A safe opt-in release gate — default is report-only.

    ## Who it's for

    Platform engineers and FinOps teams who terminate instances regularly and want the orphaned addresses caught automatically.

    ## Why orchestrate this with Kestra

    A one-off CLI session finds today's waste and is forgotten by next month. As a scheduled Kestra flow the audit runs itself, the release gate is an input anyone can flip, every run is logged for audit, and adding a region is one list entry — not a new script.

    ## Prerequisites

    - AWS credentials with `ec2:DescribeAddresses` (and `ec2:ReleaseAddress` if you enable auto-release).
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the EC2 API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the EC2 API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the waste report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` to the regions you run EC2 in.
    3. Run manually once and review the Slack report (or the clean log line).
    4. Enable the weekly schedule trigger. Flip `auto_release` to true only when you're confident.

    ## How to extend

    - Filter by allocation age to release only EIPs orphaned longer than N days.
    - Exclude EIPs tagged `Keep=true` for known standby addresses.
    - Tag released EIPs before deletion for a paper trail in Cost Explorer.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [Elastic IP pricing](https://aws.amazon.com/ec2/pricing/on-demand/)
    - [EC2 describe-addresses API](https://docs.aws.amazon.com/cli/latest/reference/ec2/describe-addresses.html)
  tags:
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Monitoring & Alerting
  ee: false
  demo: false
