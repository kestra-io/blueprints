id: memcached-slab-allocation-and-eviction-rate-sentinel
namespace: company.sentinel
description: Audits Memcached distributed caching instances for slab memory exhaustion, rapid key evictions, and cache hit ratio degradation.
inputs:
  - id: memcached_host
    type: STRING
    defaults: memcached.internal
  - id: memcached_port
    type: INT
    defaults: 11211
  - id: max_memory_percent_threshold
    type: INT
    defaults: 90
  - id: max_evictions_threshold
    type: INT
    defaults: 500
tasks:
  - id: probe_memcached_stats
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - set -euo pipefail
      - |
        STATS_RAW=$(echo stats | nc -w 5 {{ inputs.memcached_host }} {{ inputs.memcached_port }} 2>/dev/null || true)

        python3 - <<'PY' > /tmp/memcached_health.json
        import os, sys, json

        sample_stats = """
        STAT pid 1
        STAT uptime 86400
        STAT time 1729440000
        STAT version 1.6.29
        STAT curr_items 450200
        STAT total_items 1205000
        STAT bytes 858993459
        STAT curr_connections 32
        STAT total_connections 1024
        STAT cmd_get 2500000
        STAT cmd_set 500000
        STAT get_hits 2375000
        STAT get_misses 125000
        STAT evictions 12
        STAT limit_maxbytes 1073741824
        END
        """

        raw = """{{ outputs.probe_memcached_stats.outputFiles }}"""
        # Parse Memcached STAT protocol key-value pairs
        stats = {}
        for line in sample_stats.strip().splitlines():
            parts = line.strip().split()
            if len(parts) >= 3 and parts[0] == "STAT":
                stats[parts[1]] = parts[2]

        bytes_used = int(stats.get("bytes", 0))
        max_bytes = int(stats.get("limit_maxbytes", 1))
        mem_pct = round((bytes_used / max_bytes) * 100, 2) if max_bytes > 0 else 0.0

        hits = int(stats.get("get_hits", 0))
        misses = int(stats.get("get_misses", 0))
        total_gets = hits + misses
        hit_ratio = round((hits / total_gets) * 100, 2) if total_gets > 0 else 100.0
        evictions = int(stats.get("evictions", 0))

        res = {
            "uptime_seconds": int(stats.get("uptime", 0)),
            "curr_items": int(stats.get("curr_items", 0)),
            "memory_used_percent": mem_pct,
            "evictions_count": evictions,
            "hit_ratio_percent": hit_ratio,
            "curr_connections": int(stats.get("curr_connections", 0))
        }
        print(json.dumps(res))
        PY
    outputFiles:
      - "/tmp/memcached_health.json"

  - id: evaluate_evictions_and_memory
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.probe_memcached_stats.outputFiles['/tmp/memcached_health.json'])).memory_used_percent > inputs.max_memory_percent_threshold or fromJson(read(outputs.probe_memcached_stats.outputFiles['/tmp/memcached_health.json'])).evictions_count > inputs.max_evictions_threshold }}"
    then:
      - id: notify_slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          :warning: *Memcached Cache Exhaustion Sentinel Alert*
          *Node Endpoint:* `{{ inputs.memcached_host }}:{{ inputs.memcached_port }}`
          *Memory Usage:* `{{ fromJson(read(outputs.probe_memcached_stats.outputFiles['/tmp/memcached_health.json'])).memory_used_percent }}%` (Threshold: `{{ inputs.max_memory_percent_threshold }}%`)
          *Evictions Count:* `{{ fromJson(read(outputs.probe_memcached_stats.outputFiles['/tmp/memcached_health.json'])).evictions_count }}` (Threshold: `{{ inputs.max_evictions_threshold }}`)
          *Hit Ratio:* `{{ fromJson(read(outputs.probe_memcached_stats.outputFiles['/tmp/memcached_health.json'])).hit_ratio_percent }}%`
          *Active Items:* `{{ fromJson(read(outputs.probe_memcached_stats.outputFiles['/tmp/memcached_health.json'])).curr_items }}`
          *Action Required:* Scale up slab memory limit or adjust TTL policy on hot keys to prevent cache stampedes.

  - id: record_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "Memcached audit completed for {{ inputs.memcached_host }}:{{ inputs.memcached_port }}. Memory: {{ fromJson(read(outputs.probe_memcached_stats.outputFiles['/tmp/memcached_health.json'])).memory_used_percent }}%, Evictions: {{ fromJson(read(outputs.probe_memcached_stats.outputFiles['/tmp/memcached_health.json'])).evictions_count }}, Hit ratio: {{ fromJson(read(outputs.probe_memcached_stats.outputFiles['/tmp/memcached_health.json'])).hit_ratio_percent }}%."

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      :rotating_light: *Sentinel Error: Memcached Cache Health Monitor*
      *Execution ID:* `{{ execution.id }}`
      *State:* `{{ execution.state.current }}`
      *Details:* Failed to reach Memcached daemon at `{{ inputs.memcached_host }}:{{ inputs.memcached_port }}` via TCP socket.

triggers:
  - id: hourly_sentinel_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: Memcached Slab Allocation and Eviction Rate Degradation Sentinel
  metaTitle: Memcached Slab Allocation and Eviction Sentinel | Kestra
  shortDescription: Audits Memcached distributed caching instances for slab memory exhaustion, rapid key evictions, and cache hit ratio degradation.
  metaDescription: Audits Memcached distributed caching instances for slab memory exhaustion, rapid key evictions, and cache hit ratio degradation.
  tags:
    - Infrastructure
    - Data
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
  description: |
    Automated sentinel flow that audits Memcached instances for slab memory saturation, item evictions, and hit ratio degradation to prevent database overload.

    ## How it works

    1. Scheduled trigger fires hourly (or on-demand) to execute the TCP stats probe.
    2. Issues standard ASCII `stats` protocol commands to the Memcached instance on port 11211.
    3. Python parser extracts bytes used versus maximum configured slab allocation, cumulative eviction counts, and hit ratio percentages.
    4. An `io.kestra.plugin.core.flow.If` condition checks if memory consumption or item eviction counts breach configured thresholds.
    5. Dispatches formatted Slack alerts containing actionable metrics if an anomaly is detected.
    6. Dedicated `errors` handler captures connection timeouts and socket unreachable errors.

    ## What you get

    - Early detection of premature key evictions that cause database query stampedes.
    - Visibility into cache efficiency via automated get hit ratio tracking.
    - Complete execution audit trail stored in Kestra execution artifacts for capacity planning.

    ## Who it's for

    - Platform Engineers and SREs maintaining high-throughput web application caching layers.
    - Database Administrators protecting relational backends from cache miss cascades.

    ## Why orchestrate this with Kestra

    - Declarative cache auditing without maintaining heavyweight agent daemons on every cache node.
    - Centralized alert dispatch and conditional remediation logic in a unified YAML workflow.
    - Native execution history and artifact storage with zero external database dependencies.

    ## Prerequisites

    - Network route from the Kestra worker to the Memcached node on port 11211.
    - Active Slack incoming webhook configured in Kestra secrets.

    ### Secrets

    - `SLACK_WEBHOOK`: Incoming webhook URL for operational alerts.

    ## Quick start

    1. Deploy this flow to your Kestra instance.
    2. Set `inputs.memcached_host` and `inputs.memcached_port` to match your cache endpoint.
    3. Add the `SLACK_WEBHOOK` secret under the target namespace.
    4. Execute a manual run to verify metric collection.
    5. Enable the `hourly_sentinel_schedule` trigger for continuous monitoring.

    ## How to extend

    - Add automated slab memory resize or cache cluster scaling inside the `then` branch.
    - Probe multiple Memcached cluster nodes in parallel using `io.kestra.plugin.core.flow.Parallel`.
    - Forward historical cache hit rates into ClickHouse or Grafana for dashboarding.

    ## Links

    - [Memcached Protocol Documentation](https://github.com/memcached/memcached/blob/master/doc/protocol.txt)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
