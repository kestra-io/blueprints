id: github-star-milestone-growth-tracker
namespace: company.team
description: |
  Track GitHub Star counts for several repositories once a day, alert Slack once
  per crossed milestone, and post an optional daily growth summary. State lives
  in the KV Store so baselines and sent alerts survive between executions.

concurrency:
  limit: 1
  behavior: QUEUE

variables:
  state_key: github_star_tracker_state

inputs:
  - id: repositories
    type: ARRAY
    itemType: STRING
    displayName: GitHub repositories
    description: Repositories to track in owner/name form. Names are validated before anything is fetched or stored.
    defaults:
      - kestra-io/kestra

  - id: milestones
    type: ARRAY
    itemType: INT
    displayName: Star milestones
    description: Positive Star counts that trigger a one-time Slack alert when a repository reaches them. Order and duplicates do not matter.
    defaults:
      - 100
      - 500
      - 1000
      - 5000

  - id: growth_alert_threshold
    type: INT
    displayName: Daily growth alert threshold
    description: Stars gained since the previous execution that flag a repository as a growth spike and force the summary to be posted. 0 disables spike alerts.
    defaults: 50
    min: 0

  - id: send_daily_summary
    type: BOOL
    displayName: Send daily summary
    description: Post one consolidated growth summary to Slack every execution. When false, the summary is only posted if a repository hits the growth threshold.
    defaults: true

  - id: use_github_token
    type: BOOL
    displayName: Use GitHub token
    description: Authenticate GitHub API calls with the GITHUB_TOKEN secret (5,000 requests per hour instead of 60, and access to private repositories). The secret is only read when this is true.
    defaults: false

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: Runs every day at 09:00 UTC. Shipped disabled so it never runs before secrets and inputs are configured.
    cron: "0 9 * * *"
    disabled: true

tasks:
  - id: compute
    type: io.kestra.plugin.scripts.python.Script
    description: Validate inputs, fetch current Star counts, compare them with the stored state and build the new state, the milestone alerts and the summary. Uses only the Python standard library. A repository that fails to fetch keeps its stored state untouched.
    containerImage: python:3.11-slim
    warningOnStdErr: false
    env:
      REPOSITORIES: "{{ inputs.repositories | toJson }}"
      MILESTONES: "{{ inputs.milestones | toJson }}"
      THRESHOLD: "{{ inputs.growth_alert_threshold }}"
      STATE: "{{ (kv(vars.state_key, errorOnMissing=false) ?? {}) | toJson }}"
      GITHUB_TOKEN: "{{ inputs.use_github_token ? secret('GITHUB_TOKEN') : '' }}"
    script: |
      import json
      import os
      import re
      import urllib.error
      import urllib.request
      from datetime import datetime, timezone

      REPO_PATTERN = re.compile(r"^[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9._-]{1,100}$")

      repos = json.loads(os.environ["REPOSITORIES"])
      raw_milestones = json.loads(os.environ["MILESTONES"])
      threshold = int(os.environ["THRESHOLD"])
      token = os.environ.get("GITHUB_TOKEN", "")
      state = json.loads(os.environ.get("STATE") or "{}") or {}

      invalid = [r for r in repos if not isinstance(r, str) or not REPO_PATTERN.match(r)]
      if not repos or invalid:
          raise SystemExit(f"Invalid repositories, expected owner/name: {invalid or 'empty list'}")
      if not raw_milestones or any(isinstance(m, bool) or not str(m).isdigit() or int(m) <= 0 for m in raw_milestones):
          raise SystemExit(f"Milestones must be a non-empty list of positive integers: {raw_milestones}")
      milestones = sorted({int(m) for m in raw_milestones})
      repos = list({r.lower(): r for r in repos}.values())

      headers = {
          "Accept": "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28",
          "User-Agent": "kestra-star-milestone-tracker",
      }
      if token:
          headers["Authorization"] = f"Bearer {token}"


      def fetch(repo):
          request = urllib.request.Request(f"https://api.github.com/repos/{repo}", headers=headers)
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  stars = json.load(response).get("stargazers_count")
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  return None, "not found (or private without a token)"
              if error.code == 429 or (error.code == 403 and error.headers.get("x-ratelimit-remaining") == "0"):
                  return None, "rate limited"
              return None, f"HTTP {error.code}"
          except Exception as error:
              return None, type(error).__name__
          if not isinstance(stars, int):
              return None, "response has no stargazers_count"
          return stars, None


      now = datetime.now(timezone.utc).isoformat(timespec="seconds")
      alerts, failed, lines = [], [], []
      spikes = 0
      rate_limited = False

      for repo in repos:
          key = repo.lower()
          stars, error = (None, "skipped after rate limit") if rate_limited else fetch(repo)
          if error:
              rate_limited = rate_limited or error == "rate limited"
              failed.append(f"{repo}: {error}")
              lines.append(f"• {repo}: fetch failed: {error}. Stored state kept")
              continue

          previous = state.get(key)
          if previous is None:
              state[key] = {"stars": stars, "notified": [m for m in milestones if m <= stars], "pending": [], "updated_at": now}
              lines.append(f"• {repo}: {stars:,} stars, baseline recorded")
              continue

          old = int(previous.get("stars", 0))
          delta = stars - old
          pct = f"{delta * 100 / old:+.2f}%" if old else "n/a"
          notified = sorted(set(previous.get("notified", [])))
          crossed = {m for m in milestones if old < m <= stars}
          pending = sorted(m for m in crossed | set(previous.get("pending", [])) if m <= stars and m not in notified)
          state[key] = {"stars": stars, "notified": notified, "pending": pending, "updated_at": now}

          spike = threshold > 0 and delta >= threshold
          spikes += spike
          lines.append(f"• {repo}: {stars:,} stars ({delta:+,} / {pct}){'  growth spike' if spike else ''}")

          for milestone in pending:
              notified = notified + [milestone]
              remaining = [m for m in pending if m not in notified]
              alerts.append(json.dumps({
                  "text": f":star2: {repo} reached {milestone:,} GitHub stars (now {stars:,}). https://github.com/{repo}",
                  "patch": {key: {"stars": stars, "notified": notified, "pending": remaining, "updated_at": now}},
              }))

      summary = f"GitHub Star summary {now[:10]}\n" + "\n".join(lines)
      print(summary)
      print("::" + json.dumps({"outputs": {
          "state": state,
          "alerts": alerts,
          "failed": failed,
          "summary": summary,
          "growth_spikes": spikes,
      }}) + "::")

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    description: Persist the new Star counts and pending milestones. Pending milestones are not marked as notified here, so a failed Slack call is retried on the next execution.
    key: "{{ vars.state_key }}"
    kvType: JSON
    value: "{{ outputs.compute.vars.state | toJson }}"

  - id: has_milestones
    type: io.kestra.plugin.core.flow.If
    description: Only enter the notification loop when at least one milestone is pending.
    condition: "{{ outputs.compute.vars.alerts | length > 0 }}"
    then:
      - id: notify_each_milestone
        type: io.kestra.plugin.core.flow.Loop
        description: One alert at a time, in ascending milestone order, so each milestone is marked notified right after its own Slack call succeeds.
        values: "{{ outputs.compute.vars.alerts }}"
        concurrencyLimit: 1
        tasks:
          - id: send_milestone_alert
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Announce one crossed milestone.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: "{{ {'text': fromJson(item.value).text} | toJson }}"
            retry:
              type: exponential
              interval: PT5S
              maxInterval: PT1M
              maxAttempts: 3

          - id: mark_notified
            type: io.kestra.plugin.core.kv.Set
            description: Move the milestone from pending to notified for this repository only, merging into the latest stored state.
            key: "{{ vars.state_key }}"
            kvType: JSON
            value: "{{ {'state': kv(vars.state_key), 'patch': fromJson(item.value).patch} | jq('.state + .patch') | first | toJson }}"

  - id: send_summary
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Post the consolidated growth summary when enabled, or whenever a repository hits the growth threshold.
    runIf: "{{ inputs.send_daily_summary or outputs.compute.vars.growth_spikes > 0 }}"
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: "{{ {'text': outputs.compute.vars.summary} | toJson }}"
    retry:
      type: exponential
      interval: PT5S
      maxInterval: PT1M
      maxAttempts: 3

  - id: fail_on_fetch_errors
    type: io.kestra.plugin.core.execution.Fail
    description: Mark the execution failed when any repository could not be fetched, after the healthy repositories were processed.
    condition: "{{ outputs.compute.vars.failed | length > 0 }}"
    errorMessage: "GitHub fetch failed for: {{ outputs.compute.vars.failed | join(', ') }}"

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Report any failure (invalid inputs, GitHub errors, rate limits, Slack errors) so a silent gap in tracking is never mistaken for zero growth.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: "{{ {'text': 'GitHub Star tracker failed in ' ~ flow.namespace ~ '.' ~ flow.id ~ ', execution ' ~ execution.id ~ '. Check the execution logs.'} | toJson }}"

outputs:
  - id: summary
    type: STRING
    description: Human-readable growth summary for every tracked repository.
    value: "{{ outputs.compute.vars.summary }}"
  - id: milestone_alerts
    type: INT
    description: Number of milestone alerts due in this execution. All of them were sent when the execution succeeded.
    value: "{{ outputs.compute.vars.alerts | length }}"
  - id: growth_spikes
    type: INT
    description: Number of repositories that gained at least growth_alert_threshold Stars since the previous execution.
    value: "{{ outputs.compute.vars.growth_spikes }}"

extend:
  title: Track GitHub Star Milestones and Daily Growth in Slack
  metaTitle: GitHub Star Milestone and Growth Tracker with Kestra
  shortDescription: Daily Star counts for many repositories, one-time Slack alerts per milestone, and an optional growth summary.
  metaDescription: Track GitHub Stars daily across repositories, alert Slack once per milestone, and post growth summaries with KV-backed deduplication.
  description: |
    Star milestones are worth celebrating, but only once, and only when they actually happen. This blueprint polls the GitHub REST API once a day for a list of repositories, compares each count with the value stored in the Kestra KV Store, sends one Slack message per newly crossed milestone, and posts an optional growth summary with absolute and percentage change.

    ## How it differs from the other GitHub Star blueprints

    - [Send GitHub Star Notifications to Slack](https://kestra.io/blueprints/github-star-slack-notification) reacts to every single star or unstar from a webhook on one repository. It has no memory, so it cannot tell you about growth over time or milestones.
    - [Export GitHub Stargazers to BigQuery](https://kestra.io/blueprints/github-stargazer-bigquery-export) copies stargazer rows into a warehouse for SQL analysis. It sends no growth or milestone alerts.
    - This blueprint needs no webhook or warehouse, tracks many repositories at once, keeps state between executions, and guarantees each milestone is announced once.

    ## How it works

    1. The `daily` Schedule trigger starts the flow (disabled until you enable it). `concurrency` with `limit: 1` queues overlapping executions, so two runs never read and write the state at the same time.
    2. `compute` (`io.kestra.plugin.scripts.python.Script`) validates the repository names and milestones, calls `GET /repos/{owner}/{repo}` for each repository and reads the previous state from the KV key `github_star_tracker_state`.
       - First execution for a repository: the current count becomes the baseline and every milestone already reached is recorded as notified. No alerts are sent.
       - Later executions: it computes absolute and percentage growth (`n/a` when the previous count was 0) and lists every milestone where `previous < milestone <= current`, so several milestones crossed in one day each get an alert.
       - A repository that returns 404, 5xx, a network error or a rate limit keeps its stored state untouched. After a rate limit the remaining repositories are skipped instead of burning more requests.
    3. `save_state` (`io.kestra.plugin.core.kv.Set`) stores the new counts. Crossed milestones are stored as `pending`, not as notified.
    4. `has_milestones` (`io.kestra.plugin.core.flow.If`) and `notify_each_milestone` (`io.kestra.plugin.core.flow.Loop`) send one Slack message per pending milestone with `SlackIncomingWebhook`. Only after a message succeeds does `mark_notified` move that milestone from `pending` to `notified`. A failed message stays pending and is retried on the next execution.
    5. `send_summary` posts the consolidated summary when `send_daily_summary` is true, or when a repository gained at least `growth_alert_threshold` Stars.
    6. `fail_on_fetch_errors` (`io.kestra.plugin.core.execution.Fail`) marks the execution failed if any repository could not be fetched, and the `errors` branch alerts Slack.

    ## Prerequisites

    - A Kestra instance with Docker available on the worker (the script runs in `python:3.11-slim`).
    - A Slack incoming webhook for the target channel.
    - Optional: a GitHub token. Public repositories work without one, within 60 unauthenticated requests per hour per IP.

    ### Secrets

    - `SLACK_WEBHOOK_URL` (required): incoming webhook used for milestone alerts, the summary and failure alerts.
    - `GITHUB_TOKEN` (optional): fine-grained or classic token, read only when `use_github_token` is true. Public repositories need no permissions. Private repositories need read access to metadata.

    ## Inputs

    | Input | Type | Default | Description |
    | --- | --- | --- | --- |
    | `repositories` | ARRAY of STRING | `[kestra-io/kestra]` | Repositories in `owner/name` form. |
    | `milestones` | ARRAY of INT | `[100, 500, 1000, 5000]` | Positive Star counts that each trigger one alert. |
    | `growth_alert_threshold` | INT, min 0 | `50` | Stars gained since the previous execution that count as a spike. `0` disables spikes. |
    | `send_daily_summary` | BOOL | `true` | Post the summary on every execution. |
    | `use_github_token` | BOOL | `false` | Authenticate with the `GITHUB_TOKEN` secret. |

    The KV key name is set once in `variables.state_key`. Give each copy of the flow its own key if you deploy it more than once in the same namespace.

    ## Quick start

    1. Add the `SLACK_WEBHOOK_URL` secret, and `GITHUB_TOKEN` if you track private repositories or more than a few dozen repositories.
    2. Create the flow and set the input defaults (or the trigger `inputs`) to your repositories and milestones.
    3. Run it once manually. This records the baseline and posts a summary with `baseline recorded` for each repository.
    4. Enable the `daily` trigger.

    ## Expected outputs

    - `outputs.summary`: the growth summary text, for example `• kestra-io/kestra: 25,310 stars (+42 / +0.17%)`.
    - `outputs.milestone_alerts`: number of milestone alerts sent in the execution.
    - `outputs.growth_spikes`: number of repositories that hit the growth threshold.
    - KV key `github_star_tracker_state`: JSON map of `owner/name` (lowercase) to `stars`, `notified`, `pending` and `updated_at`.
    - Slack: one message per crossed milestone, plus the summary when enabled.

    ## Limitations

    - Growth is measured between executions, not calendar days. A missed day makes the next delta cover two days.
    - Adding a milestone below a repository's current count never alerts for it, since it was not crossed while tracked. It alerts only if the count drops below and rises above it again.
    - A milestone already announced is not announced again after the count drops below and re-crosses it.
    - GitHub caches Star counts briefly, so a count may lag a few minutes.
    - The state lives in one KV key per flow. Keep the `concurrency` block, because it is what prevents lost updates.

    ## Troubleshooting

    - `Invalid repositories`: use `owner/name`, not a URL.
    - `not found (or private without a token)`: check the spelling, or set `use_github_token` and give the token access to the repository.
    - `rate limited`: enable `use_github_token` or run less often. Remaining repositories were skipped and their state was kept.
    - No milestone alert after a big jump: the first execution for a repository only records a baseline. Check `pending` in the KV entry. A pending milestone means Slack failed and the alert will be retried.
    - To start a repository over, delete the KV key or remove the repository entry from it in the KV Store UI.

    ## Links

    - [Kestra KV Store](https://kestra.io/docs/concepts/kv-store)
    - [Schedule trigger](https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.schedule)
    - [Loop task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop)
    - [Flow concurrency](https://kestra.io/docs/workflow-components/concurrency)
    - [Slack plugin](https://kestra.io/plugins/plugin-slack)
    - [Python Script task](https://kestra.io/plugins/plugin-script-python)
    - [GitHub REST API: get a repository](https://docs.github.com/en/rest/repos/repos#get-a-repository)
    - [GitHub REST API rate limits](https://docs.github.com/en/rest/using-the-rest-api/rate-limits-for-the-rest-api)
  tags:
    - Business
    - Core
  subTags:
    - Monitoring & Alerting
    - Reporting & Digests
  ee: false
  demo: false
