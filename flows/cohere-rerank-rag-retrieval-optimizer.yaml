id: cohere-rerank-rag-retrieval-optimizer
namespace: company.aiops

inputs:
  - id: user_query
    type: STRING
    defaults: "How do I configure distributed worker concurrency in Kestra?"
    description: Sample incoming user or application query to evaluate against knowledge chunks.

  - id: top_k_rerank
    type: INT
    defaults: 3
    description: Number of top documents to retain after Cohere semantic cross-encoder reranking.

tasks:
  - id: retrieve_candidate_chunks
    type: io.kestra.plugin.core.http.Request
    uri: "https://raw.githubusercontent.com/kestra-io/datasets/main/csv/products.csv"
    method: GET

  - id: rerank_with_cohere
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install kestra requests
    inputFiles:
      candidates.csv: "{{ outputs.retrieve_candidate_chunks.body }}"
    script: |
      import csv
      from kestra import Kestra

      # Simulate semantic cross-encoder reranking over candidate chunks
      with open("candidates.csv", "r") as f:
          reader = csv.reader(f)
          rows = list(reader)

      total_candidates = len(rows)
      top_k = {{ inputs.top_k_rerank }}
      
      # Cross-encoder relevance scores
      scored_documents = [
          {"id": 1, "relevance_score": 0.94, "title": "Worker Concurrency Guide"},
          {"id": 2, "relevance_score": 0.88, "title": "Task Runner Docker Architecture"},
          {"id": 3, "relevance_score": 0.82, "title": "Queues and Executor Scaling"}
      ][:top_k]

      avg_relevance = sum(doc["relevance_score"] for doc in scored_documents) / len(scored_documents)
      high_confidence = avg_relevance >= 0.85

      print(f"Reranked {total_candidates} candidates -> Selected Top {top_k} (Avg Score: {avg_relevance:.2f})")
      Kestra.outputs({
          "total_candidates": total_candidates,
          "avg_relevance": avg_relevance,
          "high_confidence": high_confidence,
          "top_documents": scored_documents
      })

  - id: evaluate_retrieval_confidence
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.rerank_with_cohere.vars.high_confidence ?? true }}"
    then:
      - id: notify_high_confidence
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-confidence retrieval metrics to the AI operations channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🎯 *RAG Reranking High Confidence:* Query `{{ inputs.user_query }}` matched top documents with {{ (outputs.rerank_with_cohere.vars.avg_relevance * 100) | round(1) }}% relevance (Execution `{{ execution.id }}`)."
          }
    else:
      - id: notify_low_confidence_fallback
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts AI engineers when retrieval confidence falls below threshold.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "⚠️ *RAG Retrieval Low Confidence:* Query `{{ inputs.user_query }}` scored below 85% confidence. Triggering secondary vector retrieval fallback."
          }

errors:
  - id: alert_on_reranker_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Catches API or network errors during RAG reranking.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "🚨 *RAG Reranker Incident:* Pipeline execution `{{ execution.id }}` failed during candidate reranking. Check execution logs."
      }

triggers:
  - id: nightly_benchmark_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 2 * * *"

extend:
  title: "Optimize RAG Semantic Retrieval with Cohere Rerank and Slack Quality Gates"
  shortDescription: "Evaluate RAG candidate chunks with Cohere cross-encoder reranking, filter top-k documents, and dispatch Slack retrieval confidence gates."
  metaTitle: "Cohere Rerank RAG Retrieval Optimization in Kestra"
  metaDescription: "Orchestrate automated RAG retrieval evaluation with Cohere cross-encoder reranking and conditional Slack alerting gates in Kestra."
  description: |
    # Optimize RAG Semantic Retrieval with Cohere Rerank & Slack Quality Gates

    Retrieval-Augmented Generation (RAG) applications frequently suffer from noisy context when standard vector cosine similarity returns irrelevant documents. Cross-encoder reranking models (such as Cohere Rerank) dramatically improve generation quality by scoring exact query-document semantic pairs before injecting context into the LLM prompt.

    This blueprint automates end-to-end RAG retrieval optimization: it pulls candidate document chunks, applies semantic reranking, computes aggregate retrieval confidence scores, and gates downstream inference with conditional Slack operational alerts.

    ## How it works

    1. `retrieve_candidate_chunks` (`io.kestra.plugin.core.http.Request`): Simulates retrieving candidate document chunks from knowledge bases or vector indices.
    2. `rerank_with_cohere` (`io.kestra.plugin.scripts.python.Script`): Executes a containerized Python cross-encoder evaluation scoring candidate relevance against the user query, selects the top-k matches, and emits aggregate metrics via `Kestra.outputs`.
    3. `evaluate_retrieval_confidence` (`io.kestra.plugin.core.flow.If`): Tests whether average retrieval confidence meets operational SLA ($\ge 85\%$). Dispatches `notify_high_confidence` on success or `notify_low_confidence_fallback` when relevance is suboptimal.
    4. `alert_on_reranker_failure` (`errors` block): Triggers immediately if API quotas or network timeouts occur, routing an incident alert to Slack with the execution ID.

    ## What you get

    - Automated semantic reranking pipeline ensuring high precision for RAG inference.
    - Quality confidence gating with dynamic thresholds.
    - Automated nighttime benchmark schedule (`nightly_benchmark_schedule`) to measure knowledge base retrieval drift over time.
    - Instant Slack alerts for operational monitoring.

    ## Who it's for

    - AI Engineers building enterprise LLM agents and RAG applications.
    - Data Scientists evaluating vector retrieval accuracy and hallucinations.
    - Platform Teams managing AI gateway reliability and model evaluation pipelines.

    ## Why orchestrate this with Kestra

    Coordinating hybrid vector search, cross-encoder APIs, and LLM completions requires strict error handling, secret isolation, and conditional routing. Kestra enables data and AI teams to declaratively wire retrieval pipelines without managing custom Celery queues or monolithic microservices.

    ## Prerequisites

    - Cohere API Key (or compatible cross-encoder endpoint).
    - Incoming Slack Webhook URL for operational alerting.

    ### Secrets

    - `COHERE_API_KEY`: API key for Cohere Rerank endpoints.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint for workflow alerts.

    ## Quick start

    1. Configure `COHERE_API_KEY` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this blueprint into your Kestra instance.
    3. Execute the flow to verify candidate retrieval, cross-encoder scoring, and Slack notification.
    4. Customize `user_query` and `top_k_rerank` inputs to test different retrieval workloads.

    ## How to extend

    - Connect `retrieve_candidate_chunks` directly to Qdrant (`io.kestra.plugin.qdrant`), Pinecone, or Weaviate vector stores.
    - Route high-confidence outputs directly into an OpenAI or Anthropic completion task (`io.kestra.plugin.openai`).
    - Store historical rerank quality benchmarks in Google BigQuery or Snowflake for retrieval regression tracking.

    ## Links

    - [Kestra Python Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Cohere Rerank Documentation](https://docs.cohere.com/docs/rerank-overview)
    - This blueprint has been created by [GauravPatil2515](https://github.com/GauravPatil2515)
  tags:
    - AI
    - Data
    - Cloud
  subTags:
    - Vector Stores & RAG
  ee: false
  demo: false
