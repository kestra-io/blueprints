id: wikipedia-trending-spike-detector
namespace: company.team
description: |
  Every morning, download yesterday's top 1,000 articles of a Wikipedia edition
  and the same list for the days before it from the Wikimedia REST API, then
  use DuckDB to find the articles whose views spiked far above their own recent
  baseline, and keep the result as a Parquet file.

inputs:
  - id: project
    type: STRING
    defaults: "en.wikipedia"
    displayName: "Wikimedia Project"
    description: "Project to read, for example `en.wikipedia`, `hi.wikipedia`, `de.wikipedia`."
  - id: baseline_days
    type: INT
    defaults: 7
    displayName: "Baseline Days"
    description: "How many days before yesterday form the baseline (yesterday is fetched on top of these)."
  - id: min_views
    type: INT
    defaults: 50000
    displayName: "Minimum Views"
    description: "Ignore articles with fewer views than this yesterday."
  - id: spike_ratio
    type: FLOAT
    defaults: 5.0
    displayName: "Spike Ratio"
    description: "Yesterday's views divided by the baseline median must be at least this to count as a spike. Articles absent from the baseline top lists count as new entries."
  - id: contact
    type: STRING
    defaults: "data-team@example.com"
    displayName: "Contact for User-Agent"
    description: "Wikimedia asks API clients to send a User-Agent with contact details."

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run every day at 07:00 UTC, after Wikimedia publishes the previous day's data. Shipped disabled.
    cron: "0 7 * * *"
    disabled: true

tasks:
  - id: list_days
    type: io.kestra.plugin.core.debug.Return
    description: Build the list of days to fetch, yesterday first, as YYYY/MM/DD path segments.
    format: >-
      [{% for i in range(1, inputs.baseline_days + 1) %}"{{ now() | dateAdd(-i, 'DAYS') | date('yyyy/MM/dd', timeZone='UTC') }}"{% if not loop.last %},{% endif %}{% endfor %}]

  - id: fetch_days
    type: io.kestra.plugin.core.flow.Loop
    description: Download the top-1000 list for every day, four at a time.
    values: "{{ outputs.list_days.value }}"
    concurrencyLimit: 4
    outputs:
      - id: day
        type: STRING
        value: "{{ item.value }}"
      - id: file
        type: STRING
        value: "{{ outputs.download_top.uri }}"
    tasks:
      - id: download_top
        type: io.kestra.plugin.core.http.Download
        description: Wikimedia top-viewed articles for one day (all access methods).
        uri: "https://wikimedia.org/api/rest_v1/metrics/pageviews/top/{{ inputs.project }}/all-access/{{ item.value }}"
        headers:
          User-Agent: "kestra-trending-spike-detector ({{ inputs.contact }})"
        retry:
          type: exponential
          interval: PT10S
          maxInterval: PT1M
          maxAttempts: 4

  - id: detect_spikes
    type: io.kestra.plugin.scripts.python.Script
    description: "Load every day into DuckDB, drop non-article pages (Main_Page and namespace pages such as Special: or Wikipedia:), compare yesterday with each article's median over the baseline days, and write the ranked spikes to Parquet."
    containerImage: python:3.12-slim
    beforeCommands:
      - pip install --quiet --disable-pip-version-check duckdb==1.5.6
    inputFiles: >-
      {{ (outputs.fetch_days.outputs ?? []) | toJson | jq('[.[] | {key: ("day_" + (.outputs.day | gsub("/"; "-")) + ".json"), value: .outputs.file}] | from_entries') | first | toJson }}
    outputFiles:
      - spikes.parquet
    script: |
      import glob, json
      import duckdb

      yesterday = "{{ outputs.list_days.value | jq('.[0]') | first | replace({'/': '-'}) }}"
      rows = []
      for path in glob.glob("day_*.json"):
          day = path[4:-5]
          for a in json.load(open(path, encoding="utf-8"))["items"][0]["articles"]:
              rows.append((day, a["article"], a["views"]))
      con = duckdb.connect()
      con.execute("CREATE TABLE top (day VARCHAR, article VARCHAR, views BIGINT)")
      con.executemany("INSERT INTO top VALUES (?, ?, ?)", rows)
      con.execute("""
          CREATE TABLE spikes AS
          WITH articles AS (
              SELECT * FROM top
              WHERE article <> 'Main_Page' AND article NOT SIMILAR TO '[A-Za-z_ ]+:.*'
          ),
          today AS (SELECT article, views FROM articles WHERE day = ?),
          base AS (
              SELECT article, median(views) AS baseline, count(*) AS days_seen
              FROM articles WHERE day <> ? GROUP BY article
          )
          SELECT t.article, t.views, b.baseline, coalesce(b.days_seen, 0) AS days_seen,
                 CASE WHEN b.baseline IS NULL THEN NULL ELSE round(t.views / b.baseline, 1) END AS ratio
          FROM today t LEFT JOIN base b USING (article)
          WHERE t.views >= ? AND (b.baseline IS NULL OR t.views / b.baseline >= ?)
          ORDER BY coalesce(t.views / b.baseline, 1e9) DESC, t.views DESC
      """, [yesterday, yesterday, {{ inputs.min_views }}, {{ inputs.spike_ratio }}])
      con.execute("COPY spikes TO 'spikes.parquet' (FORMAT PARQUET)")
      days = con.execute("SELECT count(DISTINCT day) FROM top").fetchone()[0]
      top = con.execute("SELECT article, views, baseline, ratio FROM spikes LIMIT 15").fetchall()
      lines = [f"{a.replace('_', ' ')}: {v:,} views" + (f" ({r}x its {int(b):,} median)" if r is not None else " (new to the top 1,000)")
               for a, v, b, r in top]
      print("::" + json.dumps({"outputs": {"day": yesterday, "days_loaded": days, "spikes": len(con.execute("SELECT 1 FROM spikes").fetchall()), "top": lines}}) + "::")

  - id: log_spikes
    type: io.kestra.plugin.core.log.Log
    description: Log the trending articles, strongest spike first.
    message: |
      {{ inputs.project }} trending on {{ outputs.detect_spikes.vars.day }} ({{ outputs.detect_spikes.vars.days_loaded }} days loaded): {{ outputs.detect_spikes.vars.spikes }} article(s) with >= {{ inputs.min_views }} views and >= {{ inputs.spike_ratio }}x their baseline median or new to the top list.
      {% for line in outputs.detect_spikes.vars.top %}- {{ line }}
      {% endfor %}

outputs:
  - id: spikes_parquet
    type: FILE
    value: "{{ outputs.detect_spikes.outputFiles['spikes.parquet'] }}"
  - id: spike_count
    type: INT
    value: "{{ outputs.detect_spikes.vars.spikes }}"

extend:
  title: "Wikipedia Trending Spike Detector with the Wikimedia API and DuckDB"
  shortDescription: Download the daily top 1,000 Wikipedia articles and a multi-day baseline from the Wikimedia REST API in parallel, and use DuckDB to find articles whose views spiked far above their own recent median.
  metaTitle: Wikipedia Trending Spike Detector (Wikimedia API + DuckDB) | Kestra
  metaDescription: "Fetch daily Wikipedia top-1,000 lists in parallel from the Wikimedia API and detect articles spiking far above their 7-day median with DuckDB."
  description: |
    Wikipedia pageviews are one of the best public signals of what people are paying attention to: news, launches, deaths, sports results and viral topics all show up there first. The raw top-1,000 list is dominated by the same evergreen pages every day, though. This blueprint pulls yesterday's list and several days before it from the [Wikimedia REST API](https://wikimedia.org/api/rest_v1/), and uses DuckDB to keep only the articles that jumped well above their own recent median, or appeared in the top 1,000 for the first time.

    ## How it works

    1. `daily` (`io.kestra.plugin.core.trigger.Schedule`) runs at 07:00 UTC, after Wikimedia publishes the previous day. It ships `disabled: true`.
    2. `list_days` (`io.kestra.plugin.core.debug.Return`) builds the list of `YYYY/MM/DD` days: yesterday plus the `baseline_days` days before it.
    3. `fetch_days` (`io.kestra.plugin.core.flow.Loop`, four at a time) runs `download_top` (`io.kestra.plugin.core.http.Download`) for each day, sending the User-Agent with contact details that Wikimedia asks for, with exponential retries. The loop's `outputs` expose each day with its file.
    4. `detect_spikes` (`io.kestra.plugin.scripts.python.Script`) receives every downloaded file through `inputFiles` (built from the loop outputs with one jq query), loads them into DuckDB, drops `Main_Page` and namespace pages such as `Special:` and `Wikipedia:`, and compares yesterday's views with each article's median over the other days. Articles above `min_views` and at least `spike_ratio` times their median, or absent from the baseline lists, are written to `spikes.parquet`, strongest first.
    5. `log_spikes` (`io.kestra.plugin.core.log.Log`) logs the top fifteen; the Parquet file and the spike count are flow outputs.

    ## What you get

    - A daily, ranked list of what is suddenly being read on Wikipedia, without the evergreen noise.
    - A Parquet file per day with views, baseline median, days seen and ratio for every spiking article.
    - Parallel, retried downloads that respect Wikimedia's User-Agent policy.
    - A spike count output that other flows can branch on, for example to post a digest only when something is trending.

    ## Who it's for

    - Newsrooms, social and content teams looking for rising topics.
    - Data and research teams studying public attention.
    - Anyone who needs a free, public "what's trending" signal in a pipeline.

    ## Why orchestrate this with Kestra

    The data is free but arrives as one file per day. Kestra fans out the daily downloads with a concurrency limit and retries, hands every file to one DuckDB task without glue code, keeps each day's Parquet result with its execution, and runs the whole thing on a schedule, so the trend history builds up on its own.

    ## Prerequisites

    - Outbound HTTPS access to `wikimedia.org` (no API key).
    - A Kestra worker that can run containers (Docker or Kubernetes task runner) and reach PyPI.

    ### Secrets

    - None. Set `contact` to a real address or URL: Wikimedia asks every API client to identify itself in the User-Agent.

    ## Quick start

    1. Set `project` (for example `en.wikipedia` or `hi.wikipedia`) and your `contact`.
    2. Execute the flow and read `log_spikes`.
    3. Tune `min_views` and `spike_ratio` until the list matches what you consider trending, then download `spikes_parquet`.
    4. Enable `daily`.

    ## How to extend

    - Run several editions in parallel with a `Loop` over `project` values.
    - Append each day's Parquet to a warehouse table to build a long-term trend history.
    - Post the top spikes to Slack or a newsletter, or feed them to an LLM task for a one-line summary of why each topic is trending.
    - Use the `per-article` Wikimedia endpoint for a longer baseline of the articles that spiked.

    ## Links

    - [Wikimedia REST API: pageviews](https://doc.wikimedia.org/generated-data-platform/aqs/analytics-api/reference/page-views.html)
    - [Wikimedia User-Agent policy](https://foundation.wikimedia.org/wiki/Policy:User-Agent_policy)
    - [DuckDB Python API](https://duckdb.org/docs/api/python/overview)
    - [Kestra Loop task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.loop)
    - [Kestra HTTP Download task](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.download)
  tags:
    - Data
  subTags:
    - ELT & Data Landing
    - File & Data Processing Basics
  ee: false
  demo: false
