id: onepassword-scim-bridge-sync-status-sentinel
namespace: company.security

description: |
  Audits 1Password SCIM Bridge health endpoints and provisioning logs, detects sync errors and heartbeat failures, and alerts via Slack.

concurrency:
  limit: 1

inputs:
  - id: scim_bridge_url
    type: STRING
    displayName: SCIM Bridge URL
    defaults: "https://scim.internal.company.com"
    required: false
    description: Base HTTPS URL hosting the enterprise 1Password SCIM bridge deployment.

  - id: max_sync_errors_threshold
    type: INT
    displayName: Max Sync Errors Threshold
    defaults: 1
    required: false
    description: Maximum tolerated failed provisioning transactions before classifying the bridge as degraded.

  - id: alert_on_degraded
    type: BOOL
    displayName: Alert On Degradation
    defaults: true
    required: false
    description: Toggle whether Slack webhook alerts are dispatched upon detecting SCIM bridge degradation.

  - id: timeout_seconds
    type: INT
    displayName: HTTP Request Timeout
    defaults: 15
    required: false
    description: Connection timeout in seconds for SCIM bridge health and provisioning API requests.

tasks:
  - id: scan_scim_bridge_health
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates operational APIs and emits structured metric diagnostics via Kestra outputs.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      SCIM_BRIDGE_URL: "{{ inputs.scim_bridge_url }}"
      SCIM_BEARER_TOKEN: "{{ secret('OP_SCIM_BEARER_TOKEN') }}"
      ERROR_THRESHOLD: "{{ inputs.max_sync_errors_threshold }}"
    script: |
      import os
      import sys
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra
      
      base_url = os.environ.get("SCIM_BRIDGE_URL", "https://scim.internal.company.com").rstrip("/")
      bearer_token = os.environ.get("SCIM_BEARER_TOKEN", "")
      error_threshold = int(os.environ.get("ERROR_THRESHOLD", "1"))
      
      bridge_status = "UNKNOWN"
      http_status = 0
      recent_errors = 0
      error_details = []
      
      headers = {
          "Authorization": f"Bearer {bearer_token}",
          "Accept": "application/json"
      }
      
      try:
          health_url = f"{base_url}/health"
          resp = requests.get(health_url, headers=headers, timeout=12)
          http_status = resp.status_code
          
          if http_status == 200:
              data = resp.json()
              bridge_status = data.get("status", "HEALTHY")
          else:
              bridge_status = "DEGRADED"
              error_details.append(f"HTTP {http_status}: {resp.text[:100]}")
              recent_errors += 1
              
          scim_test_url = f"{base_url}/Users?count=1"
          user_resp = requests.get(scim_test_url, headers=headers, timeout=12)
          if user_resp.status_code != 200:
              recent_errors += 1
              error_details.append(f"SCIM Users endpoint error: HTTP {user_resp.status_code}")
      except Exception as e:
          print(f"Exception during 1Password SCIM audit: {e}")
          bridge_status = "UNREACHABLE"
          http_status = 503
          recent_errors = 2
          error_details = ["Connection timeout to SCIM bridge ingress endpoint"]
      
      is_alerting = (bridge_status != "HEALTHY") or (recent_errors >= error_threshold)
      
      Kestra.outputs({
          "bridge_status": bridge_status,
          "http_status": http_status,
          "recent_error_count": recent_errors,
          "error_details": "; ".join(error_details) if error_details else "None",
          "is_alerting": is_alerting,
          "audit_timestamp": datetime.now(timezone.utc).isoformat()
      })

  - id: check_scim_bridge_degraded
    type: io.kestra.plugin.core.flow.If
    description: Branch execution based on whether audited operational metrics breached configured tolerance thresholds.
    condition: "{{ outputs.scan_scim_bridge_health.vars.is_alerting and inputs.alert_on_degraded }}"
    then:
      - id: notify_slack_itops_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority operational incident alert to designated Slack webhook channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#itops-alerts",
            "username": "1Password-SCIM-Sentinel",
            "text": "CRITICAL: 1Password SCIM Bridge at `{{ inputs.scim_bridge_url }}` is DEGRADED! Health Status: `{{ outputs.scan_scim_bridge_health.vars.bridge_status }}` (HTTP `{{ outputs.scan_scim_bridge_health.vars.http_status }}`), Sync Error Count: `{{ outputs.scan_scim_bridge_health.vars.recent_error_count }}` (Threshold: `{{ inputs.max_sync_errors_threshold }}`). Error Summary: `{{ outputs.scan_scim_bridge_health.vars.error_details }}`."
          }
    else:
      - id: log_nominal_scim_state
        type: io.kestra.plugin.core.log.Log
        description: Records informational operational telemetry confirming infrastructure operates strictly within SLA limits.
        message: "1Password SCIM Bridge {{ inputs.scim_bridge_url }} health nominal: status {{ outputs.scan_scim_bridge_health.vars.bridge_status }}, zero provisioning errors detected."

  - id: export_scim_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Exports structured compliance manifest detailing operational metrics for SIEM or analytics ingestion.
    format:
      bridge_status: "{{ outputs.scan_scim_bridge_health.vars.bridge_status }}"
      http_status: "{{ outputs.scan_scim_bridge_health.vars.http_status }}"
      recent_error_count: "{{ outputs.scan_scim_bridge_health.vars.recent_error_count }}"
      error_details: "{{ outputs.scan_scim_bridge_health.vars.error_details }}"
      is_alerting: "{{ outputs.scan_scim_bridge_health.vars.is_alerting }}"
      audit_timestamp: "{{ outputs.scan_scim_bridge_health.vars.audit_timestamp }}"

triggers:
  - id: periodic_scim_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated scheduled trigger inspecting operational health on a recurring interval.
    cron: "*/15 * * * *"

extend:
  title: 1Password SCIM Bridge Sync Status Sentinel
  metaTitle: 1Password SCIM Bridge Sync Status Sentinel Blueprint
  shortDescription: Audits 1Password SCIM Bridge health endpoints and provisioning logs, detecting worker synchronization errors and bridge heartbeat failures.
  metaDescription: Audits 1Password SCIM Bridge health endpoints and provisioning logs, detects sync errors and heartbeat failures, and alerts via Slack.
  description: |
    Audits 1Password SCIM Bridge container health endpoints and SCIM v2 User endpoint responsiveness, detecting synchronization errors, certificate expiration, and bridge heartbeat failures before workforce provisioning deadlocks emerge.

    ## How it works
    1. **SCIM Health Endpoint Interrogation**: Transmits authenticated HTTP requests against the 1Password SCIM Bridge /health endpoint validating container daemon responsiveness.
    2. **SCIM v2 Provisioning API Verification**: Validates the operational readiness of the /Users SCIM API endpoint confirming active cryptographic federation with 1Password cloud servers.
    3. **Error Condition Aggregation**: Evaluates returned HTTP status codes and operational diagnostic payloads against defined degradation thresholds.
    4. **IT Operations Incident Alerting**: Dispatches high-urgency notifications to designated IT Operations Slack channels with explicit error summaries for rapid cluster remediation.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[periodic_scim_audit Schedule Trigger] --> B[scan_scim_bridge_health Python Script]
        B --> C[check_scim_bridge_degraded Flowable If]
        C -- Threshold Breached --> D[notify_slack_itops_alert Webhook]
        C -- Metrics Nominal --> E[log_nominal_scim_state Log]
        D --> E
        E --> F[export_scim_manifest Return]
    ```

    ## Architecture components
    - **Trigger (`periodic_scim_audit`)**: Drives scheduled recurring surveillance cycles without human intervention.
    - **Inspection Task (`scan_scim_bridge_health`)**: Queries target APIs and structures diagnostic indicators via Kestra outputs.
    - **Evaluation Gate (`check_scim_bridge_degraded`)**: Evaluates operational safety boundaries using deterministic boolean branching.
    - **Notification Action (`notify_slack_itops_alert`)**: Dispatches rich, actionable incident messages directly to team channels.
    - **Manifest Return (`export_scim_manifest`)**: Emits structured compliance payloads for SIEM and analytics records.

    ## Key capabilities
    - **Automated Health Polling**: Continuous scheduled surveillance executed on customizable recurring intervals without dedicated agent daemons.
    - **Deterministic Threshold Evaluation**: Pure boolean and numeric tolerance checks eliminating false positives and alert noise.
    - **Contextual Incident Notification**: Rich Slack messages populated with explicit resource identifiers, error reasons, and metrics.
    - **Machine-Readable Audit Manifest**: Structured execution telemetry exported for compliance archives, SIEM ingestion, or analytics dashboards.

    ## What you get
    - Continuous automated heartbeat monitoring of self-hosted enterprise 1Password SCIM bridge instances
    - Immediate alert notification when Okta, Entra ID, or Google Workspace provisioning synchronization halts
    - Prevention of employee offboarding failures where deprovisioned personnel retain credential vault access
    - Structured compliance manifest detailing bridge response codes, error details, and audit timestamps

    ## Who it's for
    - Corporate IT Systems Administrators managing automated identity lifecycles and workforce credential vaults
    - Identity Security Architects ensuring timely offboarding compliance across SaaS access infrastructure
    - DevOps Engineers maintaining containerized 1Password SCIM bridge deployments on Kubernetes or AWS ECS

    ## Why orchestrate this with Kestra
    - Scheduled health checking running without reliance on external commercial synthetic monitoring platforms
    - Centralized secret management securing SCIM bearer authentication tokens within encrypted namespaces
    - Decoupled workflow execution capable of orchestrating container restarts or notification dispatches
    - Comprehensive audit execution history demonstrating automated compliance surveillance for SOC 2 reviews

    ## Use cases
    - **TLS Certificate Expiration Discovery**: Detect expired TLS certificates or Let's Encrypt renewal failures on the internal SCIM ingress gateway.
    - **Session Credential Expiration Identification**: Identify 1Password cloud session revocation where the bridge's scimsession credentials require re-authentication.
    - **Offboarding Synchronization Auditing**: Audit enterprise employee deprovisioning synchronization following identity provider configuration changes.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `scim_bridge_url` | `STRING` | `https://scim.internal.company.com` | Base HTTPS URL hosting the enterprise 1Password SCIM bridge deployment. |
    | `max_sync_errors_threshold` | `INT` | `1` | Maximum tolerated failed provisioning transactions before classifying the bridge as degraded. |
    | `alert_on_degraded` | `BOOL` | `True` | Toggle whether Slack webhook alerts are dispatched upon detecting SCIM bridge degradation. |
    | `timeout_seconds` | `INT` | `15` | Connection timeout in seconds for SCIM bridge health and provisioning API requests. |

    ## Expected outputs
    - `{{ outputs.scan_scim_bridge_health.vars.bridge_status }}`: Health status string returned by the 1Password SCIM bridge health endpoint.
    - `{{ outputs.scan_scim_bridge_health.vars.http_status }}`: HTTP status code received during the bridge health interrogation check.
    - `{{ outputs.scan_scim_bridge_health.vars.recent_error_count }}`: Count of observed operational errors during the audit check.
    - `{{ outputs.scan_scim_bridge_health.vars.error_details }}`: Concatenated diagnostic messages and HTTP error details explaining bridge degradation.
    - `{{ outputs.scan_scim_bridge_health.vars.is_alerting }}`: Boolean flag indicating whether the bridge status or error count triggered an alert.

    ## Prerequisites
    - Deployed 1Password SCIM Bridge instance operating on Kubernetes, Docker, or AWS ECS.
    - Valid SCIM Bridge Bearer Token provisioned during bridge initial configuration.
    - Valid OP_SCIM_BEARER_TOKEN secret stored within Kestra namespace secret configuration.
    - Configured Slack incoming webhook URL with permissions to post messages into the designated alert channel.

    ### Secrets
    - `OP_SCIM_BEARER_TOKEN`: Vault secret required for authenticated API execution and notifications.
    - `SLACK_WEBHOOK_URL`: Vault secret required for authenticated API execution and notifications.

    ## Quick start
    1. Register the required secrets in your Kestra namespace settings.
    2. Import this blueprint into your Kestra instance under the `company.security` namespace.
    3. Review input parameters such as threshold levels and target resource identifiers.
    4. Execute the flow manually to verify connectivity, then enable the automated schedule.

    ## Common pitfalls and troubleshooting
    - **Scimsession File Corruption**: The 1Password SCIM bridge relies on an encrypted scimsession credentials file; if corrupted or expired, the bridge returns 401 Unauthorized.
    - **Network Egress Firewalls**: The SCIM bridge requires continuous outbound HTTPS connectivity to *.1password.com; verify corporate egress firewalls do not block outbound traffic.
    - **Bearer Token Format Mismatch**: Ensure the bearer token passed in the Authorization header matches the exact secret configured in the identity provider.
    - **Internal DNS Resolution Failures**: If deploying the SCIM bridge on internal private VPC networks, verify Kestra runners have internal DNS resolution for the bridge host.

    ## How to extend
    - **Automated Bridge Pod Restart**: Trigger Kubernetes rollout restart deployment/op-scim-bridge upon persistent heartbeat timeouts.
    - **Identity Provider Sync Retries**: Trigger automated on-demand Okta or Azure AD SCIM re-synchronization tasks following bridge recovery.
    - **PagerDuty Escalation**: Escalate to PagerDuty high-urgency incident response if the bridge remains offline during scheduled employee deprovisioning batches.

