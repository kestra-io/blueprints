id: rabbitmq-retry-ladder-consumer
namespace: company.messaging

variables:
  rabbitmq_host: localhost
  rabbitmq_port: "5672"
  rabbitmq_vhost: /
  work_queue: orders.work
  parking_lot_queue: orders.parking-lot
  retry_delays_seconds: [10, 60, 600]
  handler_url: http://localhost:8000/orders
  dedupe_window: P1D

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: declare_topology
    type: io.kestra.plugin.core.flow.If
    description: A manual run has no trigger, so it declares the queues and stops. Running it again changes nothing.
    condition: "{{ trigger is not defined }}"
    then:
      - id: create_work_queue
        type: io.kestra.plugin.amqp.CreateQueue
        host: "{{ vars.rabbitmq_host }}"
        port: "{{ vars.rabbitmq_port }}"
        virtualHost: "{{ vars.rabbitmq_vhost }}"
        username: "{{ secret('RABBITMQ_USERNAME') }}"
        password: "{{ secret('RABBITMQ_PASSWORD') }}"
        name: "{{ vars.work_queue }}"

      - id: create_parking_lot_queue
        type: io.kestra.plugin.amqp.CreateQueue
        host: "{{ vars.rabbitmq_host }}"
        port: "{{ vars.rabbitmq_port }}"
        virtualHost: "{{ vars.rabbitmq_vhost }}"
        username: "{{ secret('RABBITMQ_USERNAME') }}"
        password: "{{ secret('RABBITMQ_PASSWORD') }}"
        name: "{{ vars.parking_lot_queue }}"

      - id: create_retry_queues
        type: io.kestra.plugin.core.flow.Loop
        values: "{{ vars.retry_delays_seconds }}"
        tasks:
          - id: create_retry_queue
            type: io.kestra.plugin.amqp.CreateQueue
            description: |
              Messages wait here for the delay, then expire and are dead-lettered through the default exchange straight into the work queue, so other queues bound to the producer's exchange never see the retry.
              The arguments are one Pebble expression because RabbitMQ rejects a TTL rendered as a string.
            host: "{{ vars.rabbitmq_host }}"
            port: "{{ vars.rabbitmq_port }}"
            virtualHost: "{{ vars.rabbitmq_vhost }}"
            username: "{{ secret('RABBITMQ_USERNAME') }}"
            password: "{{ secret('RABBITMQ_PASSWORD') }}"
            name: "{{ vars.work_queue }}.retry-{{ item.value }}s"
            args: "{{ {'x-message-ttl': item.value * 1000, 'x-dead-letter-exchange': '', 'x-dead-letter-routing-key': vars.work_queue} | toJson }}"

      - id: topology_ready
        type: io.kestra.plugin.core.execution.Exit

  - id: identify
    type: io.kestra.plugin.core.output.OutputValues
    description: A message without a message_id is identified by the hash of its body. KV keys only allow a few characters, so the id is hashed again for the key.
    values:
      message_id: "{{ trigger.messageId ?? ('body-sha256-' ~ (trigger.data | sha256)) }}"
      key: "{{ (trigger.messageId ?? ('body-sha256-' ~ (trigger.data | sha256))) | sha256 }}"

  - id: drop_duplicate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ kv('delivered-' ~ outputs.identify.values.key, errorOnMissing=false) is not null }}"
    then:
      - id: label_duplicate
        type: io.kestra.plugin.core.execution.Labels
        labels:
          messageId: "{{ outputs.identify.values.message_id }}"
          outcome: duplicate

      - id: log_duplicate
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "{{ outputs.identify.values.message_id }} was already delivered at {{ kv('delivered-' ~ outputs.identify.values.key, errorOnMissing=false) }}, so this copy is dropped."

      - id: stop_duplicate
        type: io.kestra.plugin.core.execution.Exit

  - id: count_attempt
    type: io.kestra.plugin.core.output.OutputValues
    description: RabbitMQ's x-death header would hold this, but the AMQP plugin turns every header into a "key=value" string, so attempts are counted in KV.
    values:
      attempt: "{{ (kv('attempts-' ~ outputs.identify.values.key, errorOnMissing=false) ?? 0) + 1 }}"

  - id: deliver
    type: io.kestra.plugin.core.http.Request
    description: Non-2xx responses are returned instead of failing the task (allowFailed), and a connection error only fails this task (allowFailure), so `decide` sees every result.
    method: POST
    uri: "{{ vars.handler_url }}"
    contentType: "{{ trigger.contentType ?? 'application/json' }}"
    headers:
      Idempotency-Key: "{{ outputs.identify.values.message_id }}"
      X-Delivery-Attempt: "{{ outputs.count_attempt.values.attempt }}"
    body: "{{ trigger.data }}"
    allowFailure: true
    options:
      allowFailed: true
      timeout:
        connectTimeout: PT5S
        readIdleTimeout: PT30S

  - id: decide
    type: io.kestra.plugin.core.output.OutputValues
    description: 2xx is delivered. Other 4xx codes are permanent, so the message is parked at once. 408, 425, 429, 5xx and no response climb the ladder until it runs out.
    values:
      outcome: >-
        {%- set code = outputs.deliver.code ?? 0 -%}
        {%- set attempt = outputs.count_attempt.values.attempt | number -%}
        {%- if code >= 200 and code < 300 -%}DELIVERED
        {%- elseif code >= 400 and code < 500 and not ([408, 425, 429] contains code) -%}PARK
        {%- elseif attempt <= (vars.retry_delays_seconds | length) -%}RETRY
        {%- else -%}PARK{%- endif -%}
      reason: >-
        {%- set code = outputs.deliver.code ?? 0 -%}
        {%- set result = code > 0 ? ('HTTP ' ~ code) : ('no response: ' ~ (errorLogs()[0].message ?? 'unknown error') | split('\n') | first) -%}
        {%- if code >= 400 and code < 500 and not ([408, 425, 429] contains code) -%}handler rejected the message with {{ result }}
        {%- elseif code >= 300 or code == 0 -%}attempt {{ outputs.count_attempt.values.attempt }} failed with {{ result }}
        {%- else -%}{{ result }}{%- endif -%}

  - id: label_outcome
    type: io.kestra.plugin.core.execution.Labels
    labels:
      messageId: "{{ outputs.identify.values.message_id }}"
      attempt: "{{ outputs.count_attempt.values.attempt }}"
      outcome: "{{ outputs.decide.values.outcome | lower }}"

  - id: route
    type: io.kestra.plugin.core.flow.Switch
    value: "{{ outputs.decide.values.outcome }}"
    cases:
      DELIVERED:
        - id: remember_delivery
          type: io.kestra.plugin.core.kv.Set
          key: "delivered-{{ outputs.identify.values.key }}"
          kvDescription: "{{ outputs.identify.values.message_id }}"
          value: "{{ now() }}"
          ttl: "{{ vars.dedupe_window }}"

        - id: forget_attempts
          type: io.kestra.plugin.core.kv.Delete
          key: "attempts-{{ outputs.identify.values.key }}"

      RETRY:
        - id: schedule_retry
          type: io.kestra.plugin.amqp.Publish
          description: Persistent (deliveryMode 2), so a message waiting on the ladder survives a broker restart. The retry is the only copy, so a broker outage is retried here instead of losing it.
          host: "{{ vars.rabbitmq_host }}"
          port: "{{ vars.rabbitmq_port }}"
          virtualHost: "{{ vars.rabbitmq_vhost }}"
          username: "{{ secret('RABBITMQ_USERNAME') }}"
          password: "{{ secret('RABBITMQ_PASSWORD') }}"
          exchange: ""
          routingKey: "{{ vars.work_queue }}.retry-{{ vars.retry_delays_seconds[(outputs.count_attempt.values.attempt | number) - 1] }}s"
          retry:
            type: exponential
            interval: PT5S
            maxInterval: PT1M
            maxAttempts: 20
          from:
            data: "{{ trigger.data }}"
            messageId: "{{ outputs.identify.values.message_id }}"
            contentType: "{{ trigger.contentType ?? 'application/json' }}"
            deliveryMode: 2

        - id: remember_attempt
          type: io.kestra.plugin.core.kv.Set
          key: "attempts-{{ outputs.identify.values.key }}"
          kvDescription: "{{ outputs.identify.values.message_id }}"
          kvType: NUMBER
          value: "{{ outputs.count_attempt.values.attempt }}"
          ttl: P7D

        - id: retry_scheduled
          type: io.kestra.plugin.core.execution.Exit
          state: WARNING

      PARK:
        - id: park
          type: io.kestra.plugin.amqp.Publish
          description: The parked message carries why it was parked, because headers cannot be read back with this plugin.
          host: "{{ vars.rabbitmq_host }}"
          port: "{{ vars.rabbitmq_port }}"
          virtualHost: "{{ vars.rabbitmq_vhost }}"
          username: "{{ secret('RABBITMQ_USERNAME') }}"
          password: "{{ secret('RABBITMQ_PASSWORD') }}"
          exchange: ""
          routingKey: "{{ vars.parking_lot_queue }}"
          serdeType: JSON
          retry:
            type: exponential
            interval: PT5S
            maxInterval: PT1M
            maxAttempts: 20
          from:
            messageId: "{{ outputs.identify.values.message_id }}"
            type: kestra.parked-message
            contentType: application/json
            deliveryMode: 2
            data:
              messageId: "{{ outputs.identify.values.message_id }}"
              sourceQueue: "{{ vars.work_queue }}"
              reason: "{{ outputs.decide.values.reason }}"
              attempts: "{{ outputs.count_attempt.values.attempt }}"
              lastStatus: "{{ outputs.deliver.code ?? 0 }}"
              parkedAt: "{{ now() }}"
              consumerExecutionId: "{{ execution.id }}"
              contentType: "{{ trigger.contentType ?? 'application/json' }}"
              payload: "{{ trigger.data }}"

        - id: forget_attempts_after_park
          type: io.kestra.plugin.core.kv.Delete
          description: A message replayed from the parking lot starts the ladder again from the first rung.
          key: "attempts-{{ outputs.identify.values.key }}"

        - id: parked
          type: io.kestra.plugin.core.execution.Exit
          state: WARNING

errors:
  - id: log_lost_message
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: "Processing {{ outputs.identify.values.message_id ?? 'a message' }} failed in {{ (errorLogs() | last).taskId ?? 'an unknown task' }}: {{ (errorLogs() | last).message ?? 'see the execution logs' }}. The trigger already acknowledged the message, so this execution holds the only copy: fix the cause, then replay the execution."

triggers:
  - id: on_message
    type: io.kestra.plugin.amqp.RealtimeTrigger
    description: serdeType STRING (the default) passes any payload through. With JSON, one undecodable message would stop the trigger and be redelivered forever.
    host: "{{ vars.rabbitmq_host }}"
    port: "{{ vars.rabbitmq_port }}"
    virtualHost: "{{ vars.rabbitmq_vhost }}"
    username: "{{ secret('RABBITMQ_USERNAME') }}"
    password: "{{ secret('RABBITMQ_PASSWORD') }}"
    queue: "{{ vars.work_queue }}"

extend:
  title: RabbitMQ consumer with a retry ladder, deduplication and a parking lot
  metaTitle: RabbitMQ retry ladder with TTL delay queues and a parking lot | Kestra
  shortDescription: Deliver every RabbitMQ message to an HTTP service. Failed deliveries wait in TTL delay queues (10 s, 1 min, 10 min) and come back on their own, redeliveries are dropped, and messages that keep failing are parked with the reason.
  metaDescription: Consume RabbitMQ in real time with Kestra. Retries wait in TTL delay queues, duplicates are dropped, and failing messages go to a parking lot.
  description: |
    Retrying inside a consumer holds up the queue, a nack with requeue retries in a hot loop, and a plain dead-letter queue gives up after one failure without saying why. This flow consumes a RabbitMQ queue in real time and delivers each message to an HTTP handler (an order service, an ERP endpoint, a partner webhook). A failed delivery waits in a RabbitMQ delay queue and comes back by itself after 10 seconds, then 1 minute, then 10 minutes. A message the handler rejects, or one that still fails after the last delay, goes to a parking-lot queue with the reason.

    Pair it with [rabbitmq-parking-lot-triage](https://kestra.io/blueprints/rabbitmq-parking-lot-triage), which records every parked message in Postgres and pauses until someone decides to replay it (optionally with a corrected payload) or discard it.

    This blueprint was created by [kruxarth](https://github.com/kruxarth).

    ## How it works

    1. `on_message` (`io.kestra.plugin.amqp.RealtimeTrigger`) starts one execution per message on `orders.work`. The payload is read as a string, so a message that is not JSON cannot stop the trigger.
    2. A manual run has no trigger, so `declare_topology` (`If`) creates the queues and stops: the work queue, the parking lot, and one `orders.work.retry-<seconds>s` queue per entry in `retry_delays_seconds` (`Loop` over `CreateQueue`). Each delay queue has `x-message-ttl` and dead-letters through the default exchange straight into the work queue, so a retry never reaches other queues bound to the producer's exchange.
    3. `identify` takes the AMQP `message_id`, or a hash of the body when there is none, and `drop_duplicate` ends the execution if that message was delivered within `dedupe_window` (a KV key with a TTL).
    4. `count_attempt` reads the attempt number from KV. RabbitMQ's `x-death` header would hold it, but the AMQP plugin returns every header as a `"key=value"` string.
    5. `deliver` (`io.kestra.plugin.core.http.Request`) POSTs the payload with `Idempotency-Key` and `X-Delivery-Attempt` headers, a 5-second connect timeout and a 30-second read timeout.
    6. `decide` and `route` (`Switch`) act on the result:
       - **2xx:** delivered. The message id is remembered for deduplication.
       - **408, 425, 429, 5xx or no response, with delays left:** `schedule_retry` (`io.kestra.plugin.amqp.Publish`) puts a persistent copy on the next delay queue. The execution ends in `WARNING`.
       - **Any other 4xx, or the last delay used up:** `park` publishes the message to `orders.parking-lot` with the reason, the number of attempts and the last status code.
    7. Every execution carries `messageId`, `attempt` and `outcome` labels.

    ## What you get

    - Backoff that costs nothing while it waits: the delays live in RabbitMQ, not in sleeping executions. In tests, retries arrived within 1 s of the configured 10 s, 60 s and 600 s.
    - Nothing lost when RabbitMQ restarts: retries are persistent messages in durable queues, the trigger reconnects by itself, and a publish that hits an outage is retried with backoff for about 15 minutes.
    - Duplicates dropped, whether the copy arrives seconds later or at the same instant, without calling the handler.
    - The full history of a message from one label filter: one execution per attempt, with its status code and error.
    - Poison messages leave the work queue at once and never block the ones behind them.

    ## Who it's for

    - Backend and platform teams that push queue messages to HTTP services: partner webhooks, order and ERP sync, payment callbacks.
    - Anyone who needs an audit trail of every delivery attempt.

    ## Why orchestrate this with Kestra

    - The retry and parking policy is a few YAML variables instead of code repeated in every consumer.
    - Each attempt is an execution with its own logs, state and labels, not a line lost in a container log.
    - Real-time triggers, KV with TTL, concurrency control and task retries are built in, and the triage flow adds a human decision without another service.

    ## Prerequisites

    - RabbitMQ 3.12 or later, reachable from Kestra:

      ```bash
      docker run -d --name rabbitmq -p 5672:5672 -p 15672:15672 -e RABBITMQ_DEFAULT_USER=kestra -e RABBITMQ_DEFAULT_PASS=change-me rabbitmq:4-management-alpine
      ```

    - An HTTP endpoint that answers 2xx once the message is processed, 4xx when it never will be, and 5xx or 429 to be tried later, and that uses `Idempotency-Key` to ignore a second copy. To try the flow without one, run `docker run -d --name handler -p 8000:8080 mccutchen/go-httpbin` and set `handler_url` to `http://localhost:8000/anything/orders`.

    The variables point at `localhost`. If Kestra runs in Docker, use `host.docker.internal` instead (on Linux, add `extra_hosts: ["host.docker.internal:host-gateway"]` to the Kestra service).

    ### Secrets

    - `RABBITMQ_USERNAME` and `RABBITMQ_PASSWORD`: a RabbitMQ user allowed to declare queues and to read and write `orders.*` in the virtual host.

    ## Quick start

    1. Start RabbitMQ and a handler, and add the two secrets.
    2. Execute the flow once to create the queues. Until then, the trigger logs that `orders.work` does not exist.
    3. In the RabbitMQ console (`http://localhost:15672`), open **Queues > orders.work > Publish message**, add the property `message_id` = `order-1` and the payload `{"order_id": "1", "amount": 42}`. An execution labelled `outcome: delivered` appears within a second.
    4. Publish the same message again: it ends as `outcome: duplicate`.
    5. Stop the handler and publish `order-2`. Watch `orders.work.retry-10s` and then `retry-60s` hold it, start the handler again, and the next attempt delivers it.

    ## Things to know

    - The trigger acknowledges a message once its execution is created, so the execution is then its only copy. If a publish still fails after its retries, the `errors` handler logs it; replay the execution once RabbitMQ is back.
    - `concurrency` (limit 1, `QUEUE`) handles one message at a time, about 0.4 s each in tests, which makes deduplication exact. A higher limit is faster, but two copies arriving together may then both be delivered.
    - A request that timed out may still have been processed by the handler. The retry carries the same `Idempotency-Key` so the handler can drop it.
    - Retries and parked messages keep the payload, `message_id` and content type, but not the original headers, which the AMQP plugin cannot read back intact.
    - Changing a delay creates a queue with a new name instead of failing on the existing one. Delete the old queue once it is empty.

    ## How to extend

    - Tune `retry_delays_seconds`: add a rung, or remove one for faster parking.
    - Add `'x-queue-type': 'quorum'` to the work and parking-lot queues on a replicated cluster.
    - Route on `trigger.routingKey` to send different message types to different handlers.

    ## Links

    - [AMQP plugin](https://kestra.io/plugins/plugin-amqp)
    - [HTTP Request task](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.request)
    - [KV Store](https://kestra.io/docs/concepts/kv-store)
    - [RabbitMQ TTL](https://www.rabbitmq.com/docs/ttl) and [dead-letter exchanges](https://www.rabbitmq.com/docs/dlx)
