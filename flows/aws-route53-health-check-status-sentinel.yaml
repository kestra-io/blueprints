id: aws-route53-health-check-status-sentinel
namespace: company.netops

inputs:
  - id: health_check_id
    type: STRING
    defaults: 1234abcd-56ef-78gh-90ij-1234567890kl
    description: Identifier of the AWS Route53 health check to inspect.

tasks:
  - id: query_health_check_status
    type: io.kestra.plugin.aws.cli.AwsCLI
    region: us-east-1
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        aws route53 get-health-check-status           --health-check-id "{{ inputs.health_check_id }}"           --output json > r53_health.json
        python3 -c "
        import json
        with open('r53_health.json') as f:
            checkers = json.load(f).get('HealthCheckObservations', [])
        failed_observations = []
        for o in checkers:
            status = o.get('StatusReport', {}).get('Status', '')
            if 'Success' not in status:
                failed_observations.append({
                    'region': o.get('Region', 'unknown'),
                    'ip': o.get('IPAddress'),
                    'status': status
                })
        is_failing = len(failed_observations) > (len(checkers) / 2) if checkers else False
        result = {
            'health_check_id': '{{ inputs.health_check_id }}',
            'total_observations': len(checkers),
            'failed_observations_count': len(failed_observations),
            'failed_observations': failed_observations[:5],
            'alert_triggered': is_failing
        }
        with open('r53_summary.json', 'w') as out:
            json.dump(result, out)
        print('Route53 audit:', result)
        "
    outputFiles:
      - r53_summary.json

  - id: evaluate_endpoint_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.query_health_check_status.outputFiles['r53_summary.json'])).alert_triggered }}"
    then:
      - id: alert_sre_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":rotating_light: *AWS Route53 Health Check Alert*: Health check `{{ inputs.health_check_id }}` has failed across {{ fromJson(read(outputs.query_health_check_status.outputFiles['r53_summary.json'])).failed_observations_count }} global checkers. DNS failover routing has been engaged."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Route53 Sentinel Failure*: Failed to query status for health check `{{ inputs.health_check_id }}`."
      }

triggers:
  - id: scheduled_health_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true

extend:
  metaDescription: "Audits AWS Route53 health checks to detect endpoint outages and verify automated DNS failover behavior."
  metaTitle: AWS Route53 DNS Health Check Failure and Failover Sentinel with Kestra
  title: AWS Route53 DNS Health Check Failure and Failover Sentinel
  shortDescription: Audits AWS Route53 health checks to detect endpoint outages and verify automated DNS failover behavior.
  description: |
    ## How it works
    This sentinel leverages `AwsCLI` to query `aws route53 get-health-check-status` for the specified health check identifier. It evaluates status reports across all global checker observation points, alerting SRE teams when a majority of observers report HTTP failure or connection timeouts.

    ## What you get
    - Real-time detection of external endpoint outages before end users report downtime.
    - Automated verification that Route53 DNS failover routing policies engage correctly.
    - Automated Slack delivery tracking failed observation counts, checker regions, and error descriptions.

    ## Who it's for
    - Site reliability engineers (SREs) and network administrators maintaining public DNS routing.
    - DevOps teams supervising multi-region disaster recovery endpoints.

    ## Why orchestrate this with Kestra
    Kestra runs automated scheduled operational health checks with native error handling, secret injection, and multi-channel alerting.

    ## Prerequisites
    - AWS IAM credentials with `route53:GetHealthCheckStatus` permissions.
    - Secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `health_check_id` and credentials.
    3. Run manually to check current health check observations.

    ## How to extend
    - Query CloudWatch metrics for `HealthCheckPercentageHealthy` concurrently.
    - Automatically trigger synthetic canary runs to verify SSL certificate or application response validity.
    - Forward DNS failover events to PagerDuty or an incident war room.

    ## Links
    - [Kestra AWS Plugin](https://kestra.io/plugins/plugin-aws)
    - [Route53 Health Check Monitoring](https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/monitoring-health-checks.html)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
