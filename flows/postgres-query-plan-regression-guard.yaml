id: postgres-query-plan-regression-guard
namespace: company.team

inputs:
  - id: setup_demo
    type: BOOL
    displayName: Create the demo schema
    description: Create a shop schema with 300,000 orders and the indexes the critical queries rely on. Leave false on a real database.
    defaults: true

  - id: simulate_regression
    type: BOOL
    displayName: Simulate a regression
    description: Drop the index on orders.customer_id, the way a migration or a reckless cleanup does, before the plans are checked.
    defaults: false

  - id: max_cost_ratio
    type: FLOAT
    displayName: Max cost ratio
    description: Flag a query whose estimated total cost grew by this factor or more against the baseline.
    defaults: 3.0

  - id: accept_new_baseline
    type: BOOL
    displayName: Accept current plans as baseline
    description: Store the current plans as the baseline even if they regressed, after a reviewed change.
    defaults: false

variables:
  baseline_key: pg_plan_baseline_shop

tasks:
  - id: demo_schema
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.setup_demo }}"
    then:
      - id: create_schema
        type: io.kestra.plugin.jdbc.postgresql.Queries
        description: Demo data and the critical queries to watch. In real use the critical_queries table holds your own statements.
        url: "{{ secret('POSTGRES_URL') }}"
        username: "{{ secret('POSTGRES_USERNAME') }}"
        password: "{{ secret('POSTGRES_PASSWORD') }}"
        sql: |
          CREATE TABLE IF NOT EXISTS orders AS
            SELECT g AS id, (g % 20000) + 1 AS customer_id, now() - (g % 365) * interval '1 day' AS created_at,
                   (array['NEW','PAID','SHIPPED','REFUNDED'])[1 + g % 4] AS status, round((random() * 500)::numeric, 2) AS amount
            FROM generate_series(1, 300000) g;
          CREATE UNIQUE INDEX IF NOT EXISTS orders_pkey_idx ON orders (id);
          CREATE INDEX IF NOT EXISTS orders_customer_idx ON orders (customer_id);
          CREATE INDEX IF NOT EXISTS orders_created_idx ON orders (created_at);
          ANALYZE orders;
          CREATE TABLE IF NOT EXISTS critical_queries (name text PRIMARY KEY, sql text NOT NULL);
          INSERT INTO critical_queries VALUES
            ('customer_order_history', 'SELECT * FROM orders WHERE customer_id = 4242 ORDER BY created_at DESC LIMIT 20'),
            ('order_by_id',            'SELECT * FROM orders WHERE id = 123456'),
            ('last_7_days_revenue',    'SELECT sum(amount) FROM orders WHERE created_at > now() - interval ''7 days''')
          ON CONFLICT (name) DO UPDATE SET sql = EXCLUDED.sql;

  - id: regression
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.simulate_regression }}"
    then:
      - id: drop_index
        type: io.kestra.plugin.jdbc.postgresql.Query
        url: "{{ secret('POSTGRES_URL') }}"
        username: "{{ secret('POSTGRES_USERNAME') }}"
        password: "{{ secret('POSTGRES_PASSWORD') }}"
        sql: DROP INDEX IF EXISTS orders_customer_idx

  - id: plan_helper
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: A small helper that returns the JSON plan of a statement. EXPLAIN cannot be used inside a SELECT, so a function wraps it.
    url: "{{ secret('POSTGRES_URL') }}"
    username: "{{ secret('POSTGRES_USERNAME') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    sql: |
      CREATE OR REPLACE FUNCTION kestra_plan_of(q text) RETURNS jsonb LANGUAGE plpgsql AS $$
      DECLARE p jsonb;
      BEGIN
        EXECUTE 'EXPLAIN (FORMAT JSON) ' || q INTO p;
        RETURN p -> 0 -> 'Plan';
      END $$

  - id: explain
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: >
      EXPLAIN every critical query without running it, then summarize each plan: root node,
      estimated total cost, every table read with a sequential scan and every index used.
      EXPLAIN without ANALYZE never executes the statement, so this is safe on production.
    url: "{{ secret('POSTGRES_URL') }}"
    username: "{{ secret('POSTGRES_USERNAME') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      WITH p AS (SELECT name, kestra_plan_of(sql) AS plan FROM critical_queries)
      SELECT name,
             plan ->> 'Node Type' AS root,
             round((plan ->> 'Total Cost')::numeric, 1) AS cost,
             coalesce((SELECT string_agg(DISTINCT n ->> 'Relation Name', ',')
                       FROM jsonb_path_query(plan, 'strict $.**') n
                       WHERE n ->> 'Node Type' = 'Seq Scan'), '') AS seq_scans,
             coalesce((SELECT string_agg(DISTINCT n ->> 'Index Name', ',')
                       FROM jsonb_path_query(plan, 'strict $.**') n
                       WHERE n ->> 'Index Name' IS NOT NULL), '') AS indexes
      FROM p ORDER BY name

  - id: compare
    type: io.kestra.plugin.core.output.OutputValues
    description: Compare each plan with the baseline. A regression is a cost growth past max_cost_ratio or a sequential scan the baseline did not have.
    values:
      current: "{{ outputs.explain.rows | toJson }}"
      baseline: "{{ kv(vars.baseline_key, errorOnMissing=false) ?? 'null' }}"
      regressions: >-
        {{ outputs.explain.rows | jq('
          . as $cur | (' ~ ((kv(vars.baseline_key, errorOnMissing=false) ?? null) | toJson) ~ ') as $base
          | if $base == null then [] else
            [ $cur[] | . as $q | ($base | map(select(.name == $q.name)) | first) as $b
              | select($b != null)
              | select(($q.cost / ([$b.cost, 0.01] | max)) >= ' ~ inputs.max_cost_ratio ~ '
                       or (($q.seq_scans | length) > 0 and ($b.seq_scans | length) == 0))
              | "\($q.name): \($b.root) cost \($b.cost) to \($q.root) cost \($q.cost)"
                + (if ($q.seq_scans | length) > 0 and ($b.seq_scans | length) == 0 then ", new sequential scan on \($q.seq_scans)" else "" end)
                + (if $b.indexes != $q.indexes then ", indexes [\($b.indexes)] to [\($q.indexes)]" else "" end) ]
            end') | first | toJson }}

  - id: log_plans
    type: io.kestra.plugin.core.log.Log
    message: "Plans now: {{ outputs.compare.values.current }}\nRegressions: {{ outputs.compare.values.regressions }}"

  - id: decide
    type: io.kestra.plugin.core.flow.Switch
    value: >-
      {{ outputs.compare.values.baseline == 'null' or inputs.accept_new_baseline ? 'SAVE_BASELINE'
         : (outputs.compare.values.regressions | jq('length') | first > 0 ? 'REGRESSED' : 'OK') }}
    cases:
      SAVE_BASELINE:
        - id: save_baseline
          type: io.kestra.plugin.core.kv.Set
          key: "{{ vars.baseline_key }}"
          kvType: JSON
          value: "{{ outputs.compare.values.current }}"
      OK:
        - id: plans_stable
          type: io.kestra.plugin.core.log.Log
          message: All critical queries keep their baseline plans.
      REGRESSED:
        - id: block
          type: io.kestra.plugin.core.execution.Fail
          description: Fails the run, so a migration pipeline that calls this flow stops before the slow plan reaches users.
          errorMessage: "Query plan regression: {{ outputs.compare.values.regressions | jq('join(\"; \")') | first }}"

triggers:
  - id: after_migration
    type: io.kestra.plugin.core.trigger.Webhook
    description: Call right after a schema migration. Replace the key first.
    key: replace-with-a-long-random-key
  - id: nightly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Catches plan flips from changing statistics as well.
    cron: "0 5 * * *"

extend:
  title: Catch Postgres query plan regressions after a migration
  metaTitle: Postgres query plan regression guard with EXPLAIN in Kestra
  shortDescription: EXPLAIN your critical queries without running them, compare root node, cost, sequential scans and indexes with a stored baseline, and block a migration that makes a plan worse.
  metaDescription: Detect Postgres query plan regressions in Kestra. EXPLAIN critical queries after a migration and block new sequential scans or cost blowups.
  description: |
    A migration that drops or renames an index, a type change that makes an index unusable, or fresh statistics that flip the planner: the query still returns the right rows, so every test passes, and it now reads the whole table. Users notice first. This flow watches the **plans** of the queries that matter:
    - It runs `EXPLAIN (FORMAT JSON)` on each critical query. Without `ANALYZE`, the statement is never executed, so this is safe on production.
    - It summarizes each plan: root node, estimated total cost, tables read with a sequential scan, indexes used.
    - It compares the summaries with a baseline in the KV store. A regression is a cost growth of `max_cost_ratio` or more, or a sequential scan the baseline did not have.


    ## How it works

    1. `demo_schema` (`io.kestra.plugin.core.flow.If`) creates 300,000 orders, three indexes and a `critical_queries` table with three statements when `setup_demo` is on.
    2. `regression` drops `orders_customer_idx` when `simulate_regression` is on.
    3. `plan_helper` (`io.kestra.plugin.jdbc.postgresql.Query`) creates `kestra_plan_of(text)`, a function that returns a statement's JSON plan. EXPLAIN cannot be used inside a SELECT, so the function wraps it.
    4. `explain` (`io.kestra.plugin.jdbc.postgresql.Query`) summarizes every plan with `jsonb_path_query`.
    5. `compare` (`io.kestra.plugin.core.output.OutputValues`) diffs the plans with the baseline in jq. `log_plans` prints both.
    6. `decide` (`io.kestra.plugin.core.flow.Switch`):
       - `SAVE_BASELINE` on the first run or with `accept_new_baseline`.
       - `OK` logs.
       - `REGRESSED` fails with the before and after plan of each regressed query.
    7. `after_migration` (Webhook) and `nightly` (Schedule) triggers. The nightly run catches plans that flip because statistics changed.

    ## Quick start

    | Run | Input | Result |
    |---|---|---|
    | 1 | defaults | Baseline stored: `customer_order_history` Limit cost 61.4 on `orders_customer_idx`, `last_7_days_revenue` cost 2,453.1 on `orders_created_idx`, `order_by_id` cost 8.4 on `orders_pkey_idx` |
    | 2 | defaults | All plans match the baseline |
    | 3 | `simulate_regression: true` | Blocked: `customer_order_history` cost 61.4 to 5,447.1 (88 times), new sequential scan on `orders`, index `orders_customer_idx` gone |
    | 4 | `accept_new_baseline: true` | Baseline refreshed after a reviewed change |

    ## Inputs

    - `setup_demo` (BOOL, default `true`): set it to `false` on a real database.
    - `simulate_regression` (BOOL, default `false`), `max_cost_ratio` (FLOAT, default `3.0`), `accept_new_baseline` (BOOL, default `false`).

    ## Prerequisites

    - A Postgres database and a user that can read the queried tables, read `critical_queries` and create the `kestra_plan_of` function.

    ### Secrets

    - `POSTGRES_URL` (for example `jdbc:postgresql://db:5432/shop`), `POSTGRES_USERNAME`, `POSTGRES_PASSWORD`.

    ## Things to know

    - The JDBC driver treats `?` as a bind parameter, so the jsonb `?` key operator cannot be used. The flow checks keys with `->> ... IS NOT NULL` instead.
    - Run it on a database whose statistics resemble production. Plans on a near-empty staging database tell you little.
    - Statements with parameters must be stored with representative literal values.

    ## Expected outputs

    - `outputs.explain.rows`: `name`, `root`, `cost`, `seq_scans`, `indexes` per query.
    - `outputs.compare.values.regressions`: one line per regressed query.
    - KV `pg_plan_baseline_shop`.

    ## Links

    - Postgres EXPLAIN: https://www.postgresql.org/docs/current/sql-explain.html
    - Postgres plugin: https://kestra.io/plugins/plugin-jdbc-postgres

    This blueprint was created by [zkasuran](https://github.com/zkasuran).
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - CI/CD & Deployment
  ee: false
  demo: false
