id: shopify-stale-draft-product-catalog-sentinel
namespace: company.ecommerce

inputs:
  - id: shopify_shop_name
    type: STRING
    displayName: Shopify Shop Name
    defaults: "my-ecommerce-store"
    description: Shopify store domain slug (e.g. 'my-ecommerce-store' for my-ecommerce-store.myshopify.com).

  - id: api_version
    type: STRING
    displayName: Shopify Admin API Version
    defaults: "2024-07"
    description: Supported Shopify GraphQL Admin API version string (e.g. '2024-07' or '2024-10').

  - id: max_allowed_draft_products
    type: INT
    displayName: Maximum Allowed Draft Products
    defaults: 5
    description: Tolerance threshold for unpublished draft products before sending a merchandising hygiene digest.

  - id: product_limit
    type: INT
    displayName: Product Retrieval Limit
    defaults: 25
    description: Maximum number of draft products to evaluate in one execution.

triggers:
  - id: weekly_catalog_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly Monday morning catalog hygiene sweep at 08:00 UTC to audit draft products. Shipped disabled by default.
    cron: "0 8 * * 1"
    disabled: true

tasks:
  - id: fetch_draft_products
    type: io.kestra.plugin.graphql.Request
    description: Query Shopify Admin GraphQL API for unpublished products in draft status.
    uri: "https://{{ inputs.shopify_shop_name }}.myshopify.com/admin/api/{{ inputs.api_version }}/graphql.json"
    headers:
      X-Shopify-Access-Token: "{{ secret('SHOPIFY_ACCESS_TOKEN') }}"
      Content-Type: "application/json"
      User-Agent: "Kestra-Shopify-Draft-Sentinel/1.0"
    failOnGraphQLErrors: false
    allowFailed: true
    query: |
      query GetDraftProducts {
        products(first: {{ inputs.product_limit }}, query: "status:draft") {
          edges {
            node {
              id
              title
              handle
              createdAt
              updatedAt
              totalInventory
              vendor
            }
          }
        }
      }

  - id: evaluate_draft_inventory
    type: io.kestra.plugin.core.flow.If
    description: Check whether active draft products exceed the allowed merchandising threshold.
    condition: "{{ outputs.fetch_draft_products.body is defined and outputs.fetch_draft_products.body.products is defined and ((outputs.fetch_draft_products.body.products.edges | length) > inputs.max_allowed_draft_products) }}"
    then:
      - id: alert_stale_drafts
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch weekly Slack digest to E-Commerce Merchandising with draft product titles, vendors, and inventory counts.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "📦 *SHOPIFY CATALOG HYGIENE: Stale Draft Products Digest* 📦\n\n*Store:* `{{ inputs.shopify_shop_name }}`\n*Draft Products Count:* {{ outputs.fetch_draft_products.body.products.edges | length }}\n\n*Draft Products Awaiting Review:*\n{{ outputs.fetch_draft_products.body.products.edges | jq('[.[].node | \"• *\" + .title + \"* (Vendor: \" + (.vendor // \"Generic\") + \", Total Inventory: \" + ((.totalInventory // 0) | tostring) + \") - Last Updated: \" + .updatedAt[:10]] | join(\"\\n\")') | first }}\n\n*Execution ID:* {{ execution.id }}\n*Action Required:* Merchandising team please review unpublished drafts to either publish or archive."
          }
    else:
      - id: log_catalog_clean
        type: io.kestra.plugin.core.log.Log
        description: Log clean catalog status when draft products remain within tolerance.
        message: "HEALTHY: Draft product count is within tolerance on store {{ inputs.shopify_shop_name }}."

  - id: log_catalog_summary
    type: io.kestra.plugin.core.log.Log
    description: Record final audit metrics for catalog governance.
    message: "Shopify draft product audit completed for {{ inputs.shopify_shop_name }}. Total draft products detected: {{ outputs.fetch_draft_products.body is defined and outputs.fetch_draft_products.body.products is defined ? (outputs.fetch_draft_products.body.products.edges | length) : 0 }}."

errors:
  - id: alert_on_shopify_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert E-Commerce Operations if Shopify Admin GraphQL API request fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *Shopify Draft Sentinel Error*: Execution `{{ execution.id }}` failed to query store `{{ inputs.shopify_shop_name }}`. Check SHOPIFY_ACCESS_TOKEN permissions."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.fetch_draft_products.body is defined and outputs.fetch_draft_products.body.products is defined and ((outputs.fetch_draft_products.body.products.edges | length) > inputs.max_allowed_draft_products) ? 'DRAFT_THRESHOLD_EXCEEDED' : 'HEALTHY' }}"
  - id: draft_products_count
    type: INT
    value: "{{ outputs.fetch_draft_products.body is defined and outputs.fetch_draft_products.body.products is defined ? (outputs.fetch_draft_products.body.products.edges | length) : 0 }}"

extend:
  title: Shopify stale draft product catalog audit sentinel
  metaTitle: Shopify Stale Draft Product Sentinel | Kestra
  shortDescription: Weekly catalog hygiene sentinel that queries Shopify Admin GraphQL API for draft products and dispatches an editorial review digest.
  metaDescription: Audit Shopify draft products via GraphQL Admin API and dispatch weekly Slack digests to e-commerce merchandising teams to prevent catalog bloat.
  description: |
    Maintain clean product catalogs and prevent orphaned draft items from tying up inventory numbers and SKU allocations. In fast-paced e-commerce operations, merchandising teams frequently prepare draft products for seasonal campaigns, prototype testing, or bulk supplier uploads that are subsequently forgotten, creating clutter in the merchant backend and confusing inventory management systems. This blueprint runs a weekly audit schedule, queries the Shopify Admin GraphQL API for products in `DRAFT` status (`io.kestra.plugin.graphql.Request`), evaluates draft volume against configured thresholds, and sends an itemized Slack digest with product titles, vendors, and last updated dates to keep catalogs orderly.

    ## How it works
    1. A `Schedule` trigger executes a weekly audit every Monday morning at 08:00 UTC (shipped disabled by default).
    2. Task `fetch_draft_products` uses `io.kestra.plugin.graphql.Request` to query the Shopify Admin GraphQL endpoint (`https://<shop>.myshopify.com/admin/api/<version>/graphql.json`) authenticated via `X-Shopify-Access-Token`. It fetches products matching `status:draft` along with titles, handles, total inventory, vendors, and update timestamps.
    3. Task `evaluate_draft_inventory` (`io.kestra.plugin.core.flow.If`) counts discovered draft products:
       - If the draft count exceeds `inputs.max_allowed_draft_products`: Task `alert_stale_drafts` posts an itemized digest to Slack itemizing titles, vendors, and inventory counts.
       - If draft volume is within normal limits: Task `log_catalog_clean` logs a healthy status.
    4. Task `log_catalog_summary` records total evaluated draft metrics.
    5. Top-level `errors` handler catches API authentication errors or rate limit throttles.

    ## What you get
    - Proactive weekly visibility into unpublished draft products across Shopify stores.
    - Elimination of forgotten catalog clutter, duplicate SKU entries, and abandoned drafts.
    - Automated Slack reporting providing merchandising teams with direct links to review.
    - Observability and audit history over e-commerce catalog operations.

    ## Who it's for
    - E-Commerce Merchandising and Inventory Operations Managers.
    - Catalog Specialists maintaining large SKU catalogs across multiple brands.
    - Store Operations Leads keeping digital storefronts clean and performant.

    ## Why orchestrate this with Kestra
    Checking catalog drafts manually requires tedious page-by-page filtering inside Shopify Admin. Kestra turns catalog hygiene into an automated, version-controlled scheduled flow. With native GraphQL querying, secure API token handling, and rich formatting via jq in Slack messages, Kestra keeps your e-commerce operations humming smoothly.

    ## Prerequisites
    - A Shopify store with access to the Shopify Admin API.
    - API scopes including `read_products` enabled on the access token.
    - A Slack Incoming Webhook URL.

    ### Secrets
    - `SHOPIFY_ACCESS_TOKEN`: Shopify Admin API access token passed in the `X-Shopify-Access-Token` header.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to post merchandising digests.

    ## Quick start
    1. Create a Custom App in Shopify Admin under **Settings > Apps and sales channels > Develop apps** with `read_products` scope.
    2. Store your access token and Slack webhook in Kestra Secrets (`SHOPIFY_ACCESS_TOKEN` and `SLACK_WEBHOOK_URL`).
    3. Configure `shopify_shop_name` with your store domain slug (e.g. `brand-store`).
    4. Run a manual execution from the Kestra UI to verify that the query connects to your Shopify store.
    5. Enable the `weekly_catalog_audit` schedule to automate weekly merchandising sweeps.

    ## How to extend
    - Add a mutation step to automatically transition draft products unmodified for >180 days to `ARCHIVED` status.
    - Filter for draft products that have active physical inventory attached to avoid warehouse inventory holding locks.
    - Cross-reference product vendor names to ping specific brand managers in dedicated Slack channels.

    ## Links
    - [Shopify GraphQL Admin API: Products](https://shopify.dev/docs/api/admin-graphql/latest/queries/products)
    - [Kestra GraphQL Plugin](https://kestra.io/plugins/plugin-graphql)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Business
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Reporting & Digests
  ee: false
  demo: false
