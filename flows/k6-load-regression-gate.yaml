id: k6-load-regression-gate
namespace: company.team

inputs:
  - id: service
    type: STRING
    displayName: Service name
    description: Names the baseline in the KV store. Keep it the same across releases of one service.
    defaults: quickpizza

  - id: base_url
    type: STRING
    displayName: Base URL
    description: The deployment under test. The default is Grafana's public k6 demo application.
    defaults: https://quickpizza.grafana.com

  - id: endpoint
    type: STRING
    displayName: Endpoint
    description: Path to load. Set it to /api/delay/1 to simulate a slow release and watch the gate block it.
    defaults: /api/quotes

  - id: release
    type: STRING
    displayName: Release
    description: Version or commit of the deployment under test. Stored with the baseline.
    defaults: v1.0.0

  - id: vus
    type: INT
    displayName: Virtual users
    description: Keep it small against a public demo target.
    defaults: 3

  - id: duration
    type: STRING
    displayName: Duration
    description: k6 duration string.
    defaults: 20s

  - id: max_p95_ms
    type: INT
    displayName: Absolute p95 limit (ms)
    description: Hard k6 threshold. A breach makes k6 exit with code 99.
    defaults: 3000

  - id: max_error_rate
    type: FLOAT
    displayName: Max error rate
    description: Hard k6 threshold on the share of failed requests.
    defaults: 0.01

  - id: max_p95_regression_pct
    type: INT
    displayName: Max p95 regression (%)
    description: How much slower than the last good release p95 may get before the release is blocked.
    defaults: 25

  - id: notify_slack
    type: BOOL
    displayName: Notify Slack
    description: Post the verdict to Slack. Needs the SLACK_WEBHOOK_URL secret.
    defaults: false

variables:
  baseline_key: "k6_baseline_{{ inputs.service }}"

triggers:
  - id: after_deploy
    type: io.kestra.plugin.core.trigger.Webhook
    description: >
      Call this from the deploy pipeline once a release is live, with the release in the
      body, for example {"release": "v1.4.2"}. Replace the key with a long random value first.
    key: replace-with-a-long-random-key

tasks:
  - id: load_test
    type: io.kestra.plugin.scripts.shell.Commands
    description: >
      Run k6 with hard thresholds. handleSummary prints p95, p99, error rate and request
      count as Kestra outputs, and the k6 exit code is captured instead of failing the
      task: 99 means a threshold was breached, which the gate below handles.
    containerImage: grafana/k6:2.3.0
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      user: root
    env:
      BASE_URL: "{{ inputs.base_url }}"
      ENDPOINT: "{{ trigger.body.endpoint ?? inputs.endpoint }}"
      VUS: "{{ inputs.vus }}"
      DURATION: "{{ inputs.duration }}"
      MAX_P95: "{{ inputs.max_p95_ms }}"
      MAX_ERR: "{{ inputs.max_error_rate }}"
    inputFiles:
      test.js: |
        import http from 'k6/http';
        import { check, sleep } from 'k6';

        export const options = {
          vus: Number(__ENV.VUS),
          duration: __ENV.DURATION,
          thresholds: {
            http_req_duration: [`p(95)<${__ENV.MAX_P95}`],
            http_req_failed: [`rate<${__ENV.MAX_ERR}`],
          },
          summaryTrendStats: ['avg', 'med', 'p(95)', 'p(99)', 'max'],
        };

        export default function () {
          const res = http.get(`${__ENV.BASE_URL}${__ENV.ENDPOINT}`);
          check(res, { 'status is 2xx': (r) => r.status >= 200 && r.status < 300 });
          sleep(0.5);
        }

        export function handleSummary(data) {
          const d = data.metrics.http_req_duration.values;
          const out = {
            p95_ms: Math.round(d['p(95)'] * 10) / 10,
            p99_ms: Math.round(d['p(99)'] * 10) / 10,
            median_ms: Math.round(d.med * 10) / 10,
            error_rate: Math.round(data.metrics.http_req_failed.values.rate * 10000) / 10000,
            requests: data.metrics.http_reqs.values.count,
          };
          return {
            stdout: `::${JSON.stringify({ outputs: out })}::\n`,
            'summary.json': JSON.stringify(data, null, 2),
          };
        }
    outputFiles:
      - summary.json
    commands:
      - k6 run --quiet test.js && code=0 || code=$?
      - echo "::{\"outputs\":{\"k6_exit\":$code}}::"
      - test "$code" -eq 0 -o "$code" -eq 99

  - id: read_baseline
    type: io.kestra.plugin.core.output.OutputValues
    description: The last good release for this service. kv() returns null when there is none yet.
    values:
      baseline: "{{ kv(render(vars.baseline_key), errorOnMissing=false) ?? '' }}"

  - id: verdict
    type: io.kestra.plugin.core.output.OutputValues
    description: >
      THRESHOLD_BROKEN when k6 itself failed a hard limit, FIRST_RUN when there is no
      baseline yet, REGRESSED when p95 got slower than the baseline by more than the
      allowed share, PASS otherwise.
    values:
      release: "{{ trigger.body.release ?? inputs.release }}"
      baseline_p95: "{{ outputs.read_baseline.values.baseline == '' ? 0 : (outputs.read_baseline.values.baseline | jq('.p95_ms') | first) }}"
      baseline_release: "{{ outputs.read_baseline.values.baseline == '' ? '' : (outputs.read_baseline.values.baseline | jq('.release') | first) }}"
      limit_p95: "{{ outputs.read_baseline.values.baseline == '' ? 0 : ((outputs.read_baseline.values.baseline | jq('.p95_ms') | first) * (100 + inputs.max_p95_regression_pct) / 100) | numberFormat('0.0') }}"
      state: >-
        {%- set p95 = outputs.load_test.vars.p95_ms -%}
        {%- if outputs.load_test.vars.k6_exit == 99 -%}THRESHOLD_BROKEN
        {%- elseif outputs.read_baseline.values.baseline == '' -%}FIRST_RUN
        {%- elseif p95 > ((outputs.read_baseline.values.baseline | jq('.p95_ms') | first) * (100 + inputs.max_p95_regression_pct) / 100) -%}REGRESSED
        {%- else -%}PASS{%- endif -%}

  - id: log_verdict
    type: io.kestra.plugin.core.log.Log
    message: >-
      {{ outputs.verdict.values.state }} for {{ inputs.service }} {{ outputs.verdict.values.release }}:
      p95 {{ outputs.load_test.vars.p95_ms }} ms, p99 {{ outputs.load_test.vars.p99_ms }} ms,
      error rate {{ outputs.load_test.vars.error_rate }}, {{ outputs.load_test.vars.requests }} requests.
      {% if outputs.verdict.values.baseline_release != '' %}Baseline {{ outputs.verdict.values.baseline_release }} p95 {{ outputs.verdict.values.baseline_p95 }} ms, limit {{ outputs.verdict.values.limit_p95 }} ms.{% else %}No baseline yet.{% endif %}

  - id: gate
    type: io.kestra.plugin.core.flow.Switch
    value: "{{ outputs.verdict.values.state }}"
    cases:
      PASS:
        - id: promote_baseline
          type: io.kestra.plugin.core.kv.Set
          description: This release becomes the bar the next one is measured against.
          key: "{{ render(vars.baseline_key) }}"
          kvType: JSON
          value: |
            {"release": "{{ outputs.verdict.values.release }}", "p95_ms": {{ outputs.load_test.vars.p95_ms }}, "error_rate": {{ outputs.load_test.vars.error_rate }}, "execution_id": "{{ execution.id }}"}
      FIRST_RUN:
        - id: seed_baseline
          type: io.kestra.plugin.core.kv.Set
          description: No baseline yet, so this run sets it. Only absolute thresholds were applied.
          key: "{{ render(vars.baseline_key) }}"
          kvType: JSON
          value: |
            {"release": "{{ outputs.verdict.values.release }}", "p95_ms": {{ outputs.load_test.vars.p95_ms }}, "error_rate": {{ outputs.load_test.vars.error_rate }}, "execution_id": "{{ execution.id }}"}
    defaults:
      - id: notify_blocked
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.notify_slack }}"
        then:
          - id: slack_blocked
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": "Load gate {{ outputs.verdict.values.state }} for {{ inputs.service }} {{ outputs.verdict.values.release }}: p95 {{ outputs.load_test.vars.p95_ms }} ms (limit {{ outputs.verdict.values.limit_p95 }} ms vs baseline {{ outputs.verdict.values.baseline_release }}), error rate {{ outputs.load_test.vars.error_rate }}. Baseline kept. Execution {{ execution.id }}."
              }

      - id: block_release
        type: io.kestra.plugin.core.execution.Fail
        description: End the run as FAILED, so the deploy pipeline that called the webhook can roll back. The baseline is not touched.
        errorMessage: "{{ outputs.verdict.values.state }}: p95 {{ outputs.load_test.vars.p95_ms }} ms, error rate {{ outputs.load_test.vars.error_rate }}. Baseline {{ outputs.verdict.values.baseline_release }} p95 {{ outputs.verdict.values.baseline_p95 }} ms, limit {{ outputs.verdict.values.limit_p95 }} ms."

  - id: notify_ok
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.notify_slack }}"
    then:
      - id: slack_ok
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "Load gate {{ outputs.verdict.values.state }} for {{ inputs.service }} {{ outputs.verdict.values.release }}: p95 {{ outputs.load_test.vars.p95_ms }} ms, error rate {{ outputs.load_test.vars.error_rate }}. Baseline updated. Execution {{ execution.id }}."
          }

extend:
  title: Block a release when k6 shows it is slower than the last good one
  metaTitle: k6 load test regression gate with a baseline in Kestra
  shortDescription: Load test each release with k6, compare p95 latency with the last good release stored in KV, then pass, block a regression or block a broken hard threshold.
  metaDescription: Run k6 after each deploy with Kestra, compare p95 with the last good release in KV, block slow releases. Runs against Grafana's public demo app.
  description: |
    A fixed latency budget catches a release that is slow in absolute terms. It misses the release that went from 290 ms to 1,200 ms but is still "under 3 seconds". This flow load tests every release with [k6](https://k6.io), compares p95 latency with the **last release that passed**, and blocks the release when it got more than `max_p95_regression_pct` slower. A release that passes becomes the new baseline, so the bar follows the service.

    It runs with no setup. The default target is [QuickPizza](https://quickpizza.grafana.com), Grafana's public k6 demo application, with 3 virtual users for 20 seconds. Run it again with `endpoint` set to `/api/delay/1` to watch a slow release get blocked.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## How it works

    1. `load_test` (`io.kestra.plugin.scripts.shell.Commands`, `grafana/k6:2.3.0`) runs a k6 script with two hard thresholds: p95 under `max_p95_ms` and an error rate under `max_error_rate`. Its `handleSummary()` prints p95, p99, median, error rate and request count as Kestra outputs and writes `summary.json`. k6 exits with code **99** when a threshold breaks. The task records the code and only fails on other codes.
    2. `read_baseline` (`io.kestra.plugin.core.output.OutputValues`) reads the last good release with the `kv()` function.
    3. `verdict` decides:
       - `THRESHOLD_BROKEN`: k6 exited with 99.
       - `FIRST_RUN`: no baseline yet.
       - `REGRESSED`: p95 is above `baseline p95 * (1 + max_p95_regression_pct / 100)`.
       - `PASS`: otherwise.
    4. `gate` (`io.kestra.plugin.core.flow.Switch`): `PASS` and `FIRST_RUN` store this release as the baseline (`io.kestra.plugin.core.kv.Set`). The other verdicts keep the baseline, optionally post to Slack, and end the run as `FAILED` (`io.kestra.plugin.core.execution.Fail`), so the deploy pipeline can roll back.
    5. `after_deploy` (`io.kestra.plugin.core.trigger.Webhook`) lets the pipeline call the gate with `{"release": "v1.4.2"}` in the body.

    ## Inputs

    - `service` (STRING, default `quickpizza`): names the baseline, `k6_baseline_<service>`.
    - `base_url` (STRING) and `endpoint` (STRING, default `/api/quotes`): what to load.
    - `release` (STRING, default `v1.0.0`): stored with the baseline. A webhook body `release` wins.
    - `vus` (INT, default `3`) and `duration` (STRING, default `20s`): keep them small against a shared demo target.
    - `max_p95_ms` (INT, default `3000`) and `max_error_rate` (FLOAT, default `0.01`): hard k6 thresholds.
    - `max_p95_regression_pct` (INT, default `25`): allowed slowdown against the baseline.
    - `notify_slack` (BOOL, default `false`).

    ## Prerequisites

    - A Kestra worker that can run Docker containers.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: only when `notify_slack` is `true`.

    ## Quick start

    1. Run the flow. It reads `FIRST_RUN` and stores the baseline, about 290 ms p95.
    2. Run it with `release` set to `v1.1.0`. It reads `PASS` and moves the baseline.
    3. Run it with `endpoint` set to `/api/delay/1`. p95 jumps to about 1,280 ms, the run reads `REGRESSED` and fails, and the baseline is kept.
    4. Run it with `endpoint` set to `/api/pizza` (a 404). The error rate is 1, so k6 breaks its threshold and the run reads `THRESHOLD_BROKEN`.

    ## Expected outputs

    - `outputs.load_test.vars`: `p95_ms`, `p99_ms`, `median_ms`, `error_rate`, `requests`, `k6_exit`.
    - `outputs.verdict.values.state` plus the baseline and the limit it was compared with.
    - `outputs.load_test.outputFiles['summary.json']`: the full k6 summary.
    - KV `k6_baseline_<service>`: `{release, p95_ms, error_rate, execution_id}`.

    ## How to extend

    - Load several endpoints with k6 scenarios and keep one baseline per scenario.
    - Compare p99 or a custom k6 metric the same way.
    - Run k6 in the cloud or with more load generators by changing the command.

    ## Links

    - k6: https://grafana.com/docs/k6/latest/
    - k6 thresholds: https://grafana.com/docs/k6/latest/using-k6/thresholds/
    - k6 handleSummary: https://grafana.com/docs/k6/latest/results-output/end-of-test/custom-summary/
    - Shell scripts plugin: https://kestra.io/plugins/plugin-script-shell
  tags:
    - Infrastructure
    - Core
  subTags:
    - CI/CD & Deployment
    - Monitoring & Alerting
  ee: false
  demo: false
