id: selenium-web-application-canary-health-gate
namespace: company.team

inputs:
  - id: target_url
    type: STRING
    displayName: Target Web Application URL
    description: Public or internal web application URL to audit with the headless browser.
    defaults: "https://example.com"

  - id: app_container_selector
    type: STRING
    displayName: App Container CSS Selector
    description: Critical DOM container selector that proves client-side framework rendering.
    defaults: "body, #root, #app, main"

  - id: expected_heading_selector
    type: STRING
    displayName: Heading Element CSS Selector
    description: CSS selector for key text heading indicating successful page load.
    defaults: "h1"

  - id: selenium_grid_url
    type: STRING
    displayName: Selenium Grid Hub URL
    description: Remote WebDriver endpoint URL for the Selenium Grid or standalone container.
    defaults: "http://localhost:4444/wd/hub"

  - id: max_load_duration_ms
    type: INT
    displayName: Max Load Duration SLA (ms)
    description: Page rendering duration threshold in milliseconds before flagging degraded performance.
    defaults: 3000

  - id: send_slack_alert
    type: BOOLEAN
    displayName: Send Slack Alert on Breach
    description: When true, dispatches a detailed Slack incident alert with evidence links on canary failures.
    defaults: true

triggers:
  - id: synthetic_canary_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled synthetic user journey audit executing every 15 minutes.
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_web_application
    type: io.kestra.plugin.selenium.Browse
    description: Navigate headless browser to target URL, wait for DOM container, extract text, evaluate timing, and capture screenshot.
    remoteUrl: "{{ inputs.selenium_grid_url }}"
    actions:
      - action: NAVIGATE
        url: "{{ inputs.target_url }}"
      - action: WAIT_FOR
        selector: "{{ inputs.app_container_selector }}"
      - action: EXTRACT_TEXT
        id: page_heading
        selector: "{{ inputs.expected_heading_selector }}"
      - action: EXECUTE_SCRIPT
        id: performance_metrics
        script: |
          return {
            readyState: document.readyState,
            domComplete: window.performance && window.performance.timing ? (window.performance.timing.domComplete - window.performance.timing.navigationStart) : 0,
            url: window.location.href
          };
      - action: SCREENSHOT
        name: "canary-evidence.png"

  - id: classify_canary_status
    type: io.kestra.plugin.core.log.Log
    description: Classify synthetic user journey status based on extracted DOM text and performance metrics.
    message: |
      Extracted Heading: {{ outputs.probe_web_application.extracted.page_heading ?? 'MISSING' }}
      Document ReadyState: {{ outputs.probe_web_application.scriptResults.performance_metrics.readyState ?? 'UNKNOWN' }}
      DOM Load Time (ms): {{ outputs.probe_web_application.scriptResults.performance_metrics.domComplete ?? 0 }}
      Classification: {{ (outputs.probe_web_application.extracted.page_heading is not null and (outputs.probe_web_application.extracted.page_heading | length) > 0) ? ((outputs.probe_web_application.scriptResults.performance_metrics.domComplete ?? 0) > inputs.max_load_duration_ms ? 'DEGRADED' : 'HEALTHY') : 'CRITICAL' }}

  - id: evaluate_canary_gate
    type: io.kestra.plugin.core.flow.Switch
    description: Route flow execution based on synthetic user journey verification verdict.
    value: "{{ (outputs.probe_web_application.extracted.page_heading is not null and (outputs.probe_web_application.extracted.page_heading | length) > 0) ? ((outputs.probe_web_application.scriptResults.performance_metrics.domComplete ?? 0) > inputs.max_load_duration_ms ? 'DEGRADED' : 'HEALTHY') : 'CRITICAL' }}"
    cases:
      HEALTHY:
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          description: Log confirmed client-side rendering health within normal operational SLA.
          message: "HEALTHY: Web application '{{ inputs.target_url }}' rendered successfully. Heading: '{{ outputs.probe_web_application.extracted.page_heading }}'. Screenshot captured."

      DEGRADED:
        - id: log_degraded
          type: io.kestra.plugin.core.log.Log
          description: Log elevated rendering latency breach exceeding performance threshold.
          message: "DEGRADED: Web application '{{ inputs.target_url }}' rendered with latency ({{ outputs.probe_web_application.scriptResults.performance_metrics.domComplete }} ms) exceeding SLA threshold ({{ inputs.max_load_duration_ms }} ms)."

      CRITICAL:
        - id: alert_slack_critical
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Dispatch high-priority alert to on-call channel with target URL and screenshot artifact reference.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": ":rotating_light: *CRITICAL Synthetic Web Application Canary Alert*\n*URL:* `{{ inputs.target_url }}`\n*Status:* Heading element `{{ inputs.expected_heading_selector }}` failed to render or returned empty.\n*ReadyState:* `{{ outputs.probe_web_application.scriptResults.performance_metrics.readyState ?? 'UNKNOWN' }}`\n*Evidence Screenshot:* `{{ outputs.probe_web_application.screenshots['canary-evidence.png'] ?? 'N/A' }}`\n*Execution:* <{{ flow.url }}|{{ execution.id }}>"
            }

        - id: fail_canary_gate
          type: io.kestra.plugin.core.execution.Fail
          description: Mark execution as failed to alert monitoring dashboards and block downstream deployment pipelines.

  - id: final_audit_log
    type: io.kestra.plugin.core.log.Log
    description: Record immutable audit trail of synthetic probe execution and captured visual evidence.
    message: |
      [AUDIT] Selenium Web Application Canary completed.
      Target URL: {{ inputs.target_url }}
      Extracted Heading: {{ outputs.probe_web_application.extracted.page_heading ?? 'MISSING' }}
      ReadyState: {{ outputs.probe_web_application.scriptResults.performance_metrics.readyState ?? 'UNKNOWN' }}
      DOM Load Time: {{ outputs.probe_web_application.scriptResults.performance_metrics.domComplete ?? 0 }} ms
      Verdict: {{ (outputs.probe_web_application.extracted.page_heading is not null and (outputs.probe_web_application.extracted.page_heading | length) > 0) ? ((outputs.probe_web_application.scriptResults.performance_metrics.domComplete ?? 0) > inputs.max_load_duration_ms ? 'DEGRADED' : 'HEALTHY') : 'CRITICAL' }}
      Evidence Screenshot URI: {{ outputs.probe_web_application.screenshots['canary-evidence.png'] ?? 'NONE' }}

extend:
  title: Selenium Web Application Synthetic Canary and SLA Health Gate
  metaTitle: Selenium Web Application Canary Health Gate | Kestra
  shortDescription: Audit web application client-side rendering with Selenium, evaluate DOM latency, capture screenshots, and alert Slack on failures.
  metaDescription: Audit web application client-side rendering with Selenium in Kestra, evaluate DOM readiness, capture screenshot artifacts, and alert Slack on canary failures.
  description: |
    Automated synthetic user journey sentinel that drives a real headless browser via Selenium Grid to verify client-side Single-Page Application (SPA) rendering, evaluate DOM readyState and navigation timing metrics, capture visual screenshot artifacts, and trigger actionable alerts on rendering failures.

    ## How it works

    1. A schedule trigger activates every 15 minutes to initiate the automated synthetic user journey audit against the target web application.
    2. The `io.kestra.plugin.selenium.Browse` task connects to a remote Selenium WebDriver endpoint and executes a sequential browser action plan:
       - `NAVIGATE`: Directs the browser to the target web application URL.
       - `WAIT_FOR`: Synchronously pauses until the root application container element mounts in the DOM.
       - `EXTRACT_TEXT`: Extracts user-facing title and heading elements to confirm complete template rendering.
       - `EXECUTE_SCRIPT`: Interrogates `document.readyState` and `window.performance.timing` to compute client-side DOM processing duration.
       - `SCREENSHOT`: Captures the full browser viewport and saves the image directly into Kestra internal storage.
    3. A Pebble classification expression assesses extracted text and load timing to assign an operational status (`HEALTHY`, `DEGRADED`, or `CRITICAL`).
    4. A `Switch` flow control task branches based on the evaluated status:
       - `HEALTHY`: Emits an informational log confirming DOM readiness and page load duration within normal SLA.
       - `DEGRADED`: Logs an advisory warning when rendering succeeds but exceeds latency thresholds.
       - `CRITICAL`: Transmits a formatted Slack incident notification containing deep links to the execution and visual screenshot artifact, followed by an execution failure gate.
    5. An unconditional final audit task logs the comprehensive evaluation trail and screenshot storage URI to Kestra's execution history.

    ## What you get

    - Real-browser synthetic canary verification catching client-side JavaScript crashes and broken asset bundles that standard HTTP status checks miss.
    - Automated screenshot evidence captured and stored in Kestra internal storage for instantaneous visual postmortem diagnosis.
    - Client-side performance SLA enforcement tracking DOM readiness timing directly from the browser window.
    - Tiered severity routing distinguishing between performance slowdowns and hard page render crashes.
    - Direct Slack notifications delivering contextual incident alerts with execution links and screenshot URIs.
    - An immutable execution audit log tracking web availability trends across deployment cycles.

    ## Who it's for

    - Platform Engineers and SREs responsible for customer-facing web application uptime and user experience SLAs.
    - QA and Release Automation Engineers gating blue/green and canary deployments on real browser verification.
    - Frontend Engineering Leads seeking automated synthetic monitoring without paying for proprietary APM subscriptions.

    ## Why orchestrate this with Kestra

    - Declarative YAML eliminates brittle custom Puppeteer or Selenium scripts running in unmonitored cron jobs.
    - Out-of-the-box secret masking ensures webhook URLs and credentials remain protected during execution.
    - Built-in internal storage automatically versions and hosts captured screenshots without requiring external S3 bucket setup.
    - Visual topology and centralized execution logs provide complete observability across synthetic audits and backend pipelines in a single unified interface.

    ## Prerequisites

    - A running Selenium Grid or standalone Chrome container (e.g. `selenium/standalone-chrome:latest`) reachable from Kestra workers.
    - Network reachability between the Selenium container and the target web application.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to transmit critical canary failure alerts (required when alerts fire).

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret within your Kestra namespace or environment variables.
    2. Import this blueprint into your Kestra instance under `company.team`.
    3. Execute the flow against your target web application URL (defaults to `https://example.com` for an immediate clean pass).
    4. Review the extracted heading and visual screenshot artifact under the execution outputs tab, then enable the `synthetic_canary_schedule` trigger.

    ## How to extend

    - Add simulated user interactions (`CLICK`, `TYPE`) to validate full authentication flows and multi-step checkout funnels.
    - Integrate `DOWNLOAD` actions to verify automated export generation (e.g. CSV or PDF report downloads).
    - Chain downstream rollback workflows that automatically revert Kubernetes or CDN deployments when canary verification fails post-release.

    ## Links

    - [Kestra Selenium Plugin Documentation](https://kestra.io/plugins/plugin-selenium)
    - [Selenium WebDriver Documentation](https://www.selenium.dev/documentation/)
    - [Selenium Docker Images](https://github.com/SeleniumHQ/docker-selenium)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Monitoring & Alerting
  ee: false
  demo: false
