id: snowflake-long-running-queries-sentinel
namespace: company.ops

description: |
  Detect Snowflake queries that have been executing longer than a configurable time threshold and alert Slack with query details.

inputs:
  - id: account
    type: STRING
    description: Snowflake account identifier (e.g. xy12345.us-east-1)
  - id: username
    type: STRING
    description: Snowflake username
  - id: database
    type: STRING
    defaults: SNOWFLAKE
  - id: schema
    type: STRING
    defaults: ACCOUNT_USAGE
  - id: execution_time_ms_threshold
    type: INT
    defaults: 1800000
    description: Minimum execution time in milliseconds before a query is flagged (default 30 minutes)

tasks:
  - id: query_long_running
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ inputs.account }}.snowflakecomputing.com/?warehouse=COMPUTE_WH&db={{ inputs.database }}&schema={{ inputs.schema }}"
    username: "{{ inputs.username }}"
    password: "{{ secret('SNOWFLAKE_PASSWORD') }}"
    sql: |
      SELECT QUERY_ID, USER_NAME, WAREHOUSE_NAME,
             ROUND(EXECUTION_TIME/1000/60, 2) AS execution_minutes,
             QUERY_TEXT
      FROM SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY
      WHERE EXECUTION_STATUS = 'RUNNING'
        AND EXECUTION_TIME > {{ inputs.execution_time_ms_threshold }}
        AND START_TIME >= DATEADD('hour', -1, CURRENT_TIMESTAMP())
      ORDER BY EXECUTION_TIME DESC
      LIMIT 10;
    fetchType: FETCH

  - id: check_long_queries
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_long_running.rows | length > 0 }}"
    then:
      - id: alert_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":hourglass_flowing_sand: *Snowflake Long-Running Query Alert*\n{{ outputs.query_long_running.rows | length }} query/queries running beyond *{{ inputs.execution_time_ms_threshold }}ms* threshold:\n{{ outputs.query_long_running.rows | map(r => '• `' ~ r.QUERY_ID ~ '` by `' ~ r.USER_NAME ~ '` on `' ~ r.WAREHOUSE_NAME ~ '` — ' ~ r.EXECUTION_MINUTES ~ ' min') | join('\n') }}\nConsider reviewing or terminating these queries."
          }
    else:
      - id: log_ok
        type: io.kestra.plugin.core.log.Log
        message: "No queries running beyond {{ inputs.execution_time_ms_threshold }}ms threshold detected."

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Snowflake Long-Running Query Sentinel failed* (execution `{{ execution.id }}`). Unable to query QUERY_HISTORY. Verify Snowflake credentials and ACCOUNT_USAGE grants."
      }

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Snowflake Long Running Queries and Warehouse Timeout Sentinel
  shortDescription: Detect Snowflake queries running beyond a configurable execution threshold and alert Slack with query IDs, user names, and warehouse details.
  metaTitle: Snowflake Long Running Query Sentinel with Kestra
  metaDescription: Automate Snowflake long-running query detection with Kestra. Query QUERY_HISTORY, threshold execution times, and send Slack alerts before warehouse credits are wasted.
  description: |
    Runaway queries in Snowflake waste credits, block warehouse capacity, and can cascade into pipeline failures. Without automated detection, long-running queries often go unnoticed until a downstream dbt model times out or an invoice arrives. This sentinel queries `SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY` every 15 minutes for queries in `RUNNING` state that exceed the configured execution time threshold and fires a Slack alert with the offending query IDs, users, warehouses, and runtime in minutes.

    ## How it works

    1. `query_long_running` (`io.kestra.plugin.jdbc.snowflake.Query`) connects over JDBC and retrieves up to 10 queries currently in `RUNNING` state whose execution time exceeds `inputs.execution_time_ms_threshold` milliseconds, ordered by duration descending.
    2. `check_long_queries` (`io.kestra.plugin.core.flow.If`) evaluates whether the result set is non-empty.
       - **then** — `alert_slack` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) posts a Slack message listing each query ID, owner, warehouse, and runtime in minutes.
       - **else** — `log_ok` (`io.kestra.plugin.core.log.Log`) records a clean check, confirming no runaway queries were found.
    3. The `errors` block fires a Slack alert if the JDBC query itself cannot complete, preventing silent monitoring blackouts.
    4. A `Schedule` trigger fires every 15 minutes and ships disabled.

    ## What you get

    - Automated detection of Snowflake queries running beyond a configurable time limit.
    - Slack alerts with query IDs, user names, warehouse names, and elapsed minutes for fast triage.
    - Audit log of every sentinel check in Kestra's execution history.
    - Failure alerting if the sentinel itself loses connectivity to Snowflake.

    ## Who it's for

    - Data engineers and analytics engineers managing large Snowflake transformation workloads.
    - Platform SREs responsible for shared warehouse utilization and cost governance.
    - FinOps teams tracking credit waste from inefficient or stuck queries.

    ## Why orchestrate this with Kestra

    Snowflake does not provide native push alerts for long-running queries. Third-party monitoring tools can query `QUERY_HISTORY` but require additional infrastructure and credential management. Kestra encapsulates the query, conditional evaluation, Slack dispatch, and error handling in a single, version-controlled YAML flow with full execution history, without any extra servers or agents.

    ## Prerequisites

    - A Snowflake user with `SELECT` on `SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY`.
    - A Slack incoming webhook for the alerting channel.

    ### Secrets

    - `SNOWFLAKE_PASSWORD`: Password for the Snowflake user in `inputs.username`.
    - `SLACK_WEBHOOK`: Slack incoming webhook URL.

    ## Quick start

    1. Store `SNOWFLAKE_PASSWORD` and `SLACK_WEBHOOK` in your Kestra namespace secrets.
    2. Import the blueprint and configure `account`, `username`, and `execution_time_ms_threshold` (default is 1 800 000 ms = 30 minutes).
    3. Run manually to confirm connectivity and inspect the returned rows.
    4. Enable the `Schedule` trigger for continuous 15-minute monitoring.

    ## How to extend

    - Add a `io.kestra.plugin.jdbc.snowflake.Query` task in the `then` branch to call `SELECT SYSTEM$CANCEL_QUERY('<query_id>')` and terminate runaway queries automatically after approval.
    - Persist detected rows to a data warehouse table for trend analysis of slow-query frequency by user and warehouse.
    - Add PagerDuty or OpsGenie webhook tasks for on-call escalation on critical warehouses.
    - Parameterize `LIMIT` and the one-hour lookback window as additional inputs for broader coverage.

    ## Links

    - [Kestra Snowflake Plugin](https://kestra.io/plugins/plugin-jdbc-snowflake)
    - [Snowflake QUERY_HISTORY View](https://docs.snowflake.com/en/sql-reference/account-usage/query_history)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
    - [Kestra If Task](https://kestra.io/plugins/plugin-core/tasks/flow/io.kestra.plugin.core.flow.if)

  tags:
    - Data
    - Cloud
  ee: false
  demo: false
