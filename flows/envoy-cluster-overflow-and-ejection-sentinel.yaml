id: envoy-cluster-overflow-and-ejection-sentinel
namespace: company.team

description: |
  Audits Envoy proxy clusters to detect host ejections, consecutive connection failures,
  and circuit breaker overflow events, alerting site reliability engineering teams on Slack.

concurrency:
  limit: 1

inputs:
  - id: envoy_admin_url
    type: STRING
    displayName: Envoy Admin URL
    defaults: "http://envoy.internal:9901"
    description: Base URL of the Envoy Admin API endpoint for querying cluster telemetry.

  - id: cluster_filter
    type: STRING
    displayName: Cluster Filter
    defaults: "payment_service_cluster"
    description: Substring filter to match target Envoy clusters (leave empty to scan all clusters).

  - id: overflow_threshold
    type: INT
    displayName: Overflow Threshold
    defaults: 5
    description: Maximum allowable connection failure events before flagging a cluster as degraded.

  - id: alert_on_unhealthy_members
    type: BOOL
    displayName: Alert on Unhealthy Members
    defaults: true
    description: Trigger an alert if any cluster member host is in an unhealthy state.

tasks:
  - id: scan_envoy_clusters
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates Envoy Admin API to inspect cluster endpoints, membership, and failure stats.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests
    env:
      ENVOY_ADMIN_URL: "{{ inputs.envoy_admin_url }}"
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      admin_url = os.environ.get("ENVOY_ADMIN_URL", "http://envoy.internal:9901").rstrip("/")
      cluster_filter = "{{ inputs.cluster_filter }}".strip().lower()
      overflow_threshold = int("{{ inputs.overflow_threshold }}")
      alert_on_unhealthy = "{{ inputs.alert_on_unhealthy_members }}".lower() == "true"

      clusters_url = f"{admin_url}/clusters?format=json"

      print(f"Connecting to Envoy Admin at: {admin_url}")

      try:
          resp = requests.get(clusters_url, timeout=15)
          resp.raise_for_status()
          clusters_data = resp.json()
      except Exception as err:
          print(f"CRITICAL: Failed to fetch Envoy cluster data from {clusters_url}: {err}", file=sys.stderr)
          sys.exit(1)

      cluster_statuses = clusters_data.get("cluster_statuses", [])
      degraded_clusters = []
      total_audited = 0
      total_overflow_events = 0

      for cluster in cluster_statuses:
          c_name = cluster.get("name", "")
          if cluster_filter and cluster_filter not in c_name.lower():
              continue

          total_audited += 1
          hosts = cluster.get("host_statuses", [])
          total_hosts = len(hosts)
          healthy_hosts = 0
          cx_fails = 0

          for host in hosts:
              health_status = host.get("health_status", {}).get("eds_health_status", "HEALTHY")
              if health_status in ["HEALTHY", ""]:
                  healthy_hosts += 1
              for s in host.get("stats", []):
                  if "connect_fail" in s.get("name", ""):
                      cx_fails += int(s.get("value", 0))

          unhealthy_hosts = total_hosts - healthy_hosts

          is_degraded = False
          reasons = []

          if cx_fails >= overflow_threshold:
              is_degraded = True
              reasons.append(f"Connection failures ({cx_fails}) crossed threshold ({overflow_threshold})")

          if alert_on_unhealthy and unhealthy_hosts > 0:
              is_degraded = True
              reasons.append(f"{unhealthy_hosts} of {total_hosts} hosts are unhealthy")

          total_overflow_events += cx_fails

          if is_degraded:
              degraded_clusters.append({
                  "cluster_name": c_name,
                  "total_hosts": total_hosts,
                  "healthy_hosts": healthy_hosts,
                  "unhealthy_hosts": unhealthy_hosts,
                  "connection_failures": cx_fails,
                  "reasons": reasons
              })

      report = {
          "total_audited": total_audited,
          "degraded_count": len(degraded_clusters),
          "total_overflow_events": total_overflow_events,
          "degraded_clusters": degraded_clusters
      }

      with open("envoy_cluster_report.json", "w") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "total_clusters_audited": total_audited,
          "degraded_clusters_count": len(degraded_clusters),
          "has_degraded_clusters": len(degraded_clusters) > 0,
          "total_overflow_events": total_overflow_events
      })
      print(f"Envoy cluster audit: audited={total_audited}, degraded={len(degraded_clusters)}")
    outputFiles:
      - envoy_cluster_report.json

  - id: check_degraded_clusters
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether any Envoy clusters are degraded by overflow or host ejections.
    condition: "{{ outputs.scan_envoy_clusters.vars.has_degraded_clusters }}"
    then:
      - id: notify_slack_sre
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority incident notifications to Slack with degraded cluster details.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#sre-alerts",
            "username": "Envoy-Sentinel",
            "text": "CRITICAL: Envoy upstream cluster degradation detected on `{{ inputs.envoy_admin_url }}`! Degraded clusters: `{{ outputs.scan_envoy_clusters.vars.degraded_clusters_count }}` of `{{ outputs.scan_envoy_clusters.vars.total_clusters_audited }}`. Overflow events: `{{ outputs.scan_envoy_clusters.vars.total_overflow_events }}`."
          }

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#sre-alerts",
        "username": "Envoy-Sentinel",
        "text": "CRITICAL: Envoy Cluster Overflow Sentinel failed on `{{ inputs.envoy_admin_url }}`. Execution ID: `{{ execution.id }}`."
      }

triggers:
  - id: scheduled_envoy_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated schedule trigger auditing Envoy clusters every 5 minutes.
    cron: "*/5 * * * *"

extend:
  title: Envoy Cluster Overflow and Ejection Sentinel
  metaTitle: Envoy Cluster Overflow and Ejection Sentinel Blueprint
  shortDescription: Audits Envoy clusters to detect host ejections, connection failures, and circuit breaker overflows.
  metaDescription: Audits Envoy proxy clusters to detect host ejections, consecutive connection failures, and circuit breaker overflows.
  description: |
    Microservice architectures depend on Envoy proxies to route traffic reliably to upstream backends. When upstream nodes crash, experience network partitions, or saturate connection limits, Envoy marks endpoints unhealthy or ejects them from the load balancing pool. This sentinel queries the Envoy Admin API, tracks connection failures and host health across clusters, and alerts SRE teams on Slack.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[scheduled_envoy_audit Schedule Trigger] --> B[scan_envoy_clusters Python Script]
      B --> C{Degraded Clusters > 0?}
      C -- Yes --> D[notify_slack_sre Webhook]
      C -- No --> E[Clusters Healthy]
    ```

    ## Prerequisites
    - Outbound HTTP access to the Envoy Admin API (`/clusters`).
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure `envoy_admin_url` and optional `cluster_filter`.
    3. Run manually to audit cluster membership.

    ## Links
    - [Envoy Admin Clusters Endpoint](https://www.envoyproxy.io/docs/envoy/latest/operations/admin#get--clusters)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
    - Network
  ee: false
  demo: false
