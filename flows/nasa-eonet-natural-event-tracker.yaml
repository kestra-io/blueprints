id: nasa-eonet-natural-event-tracker
namespace: company.team
description: |
  Every six hours, read the open natural events (wildfires, severe storms,
  volcanoes, floods...) from NASA's EONET API for an area, write them to
  GeoJSON and Parquet with DuckDB, and report which events appeared since the
  last run, using the KV store to remember the event ids already seen.

inputs:
  - id: categories
    type: STRING
    defaults: "wildfires,severeStorms,volcanoes,floods"
    displayName: "EONET Categories"
    description: "Comma-separated EONET category ids (see /api/v3/categories). Leave empty for all."
  - id: bbox
    type: STRING
    defaults: "-180,90,180,-90"
    displayName: "Bounding Box"
    description: "min lon,max lat,max lon,min lat (EONET's order). The default is the whole world."
  - id: days
    type: INT
    defaults: 20
    displayName: "Lookback (days)"
    description: "Only events with activity in the last this many days."
  - id: feed
    type: STRING
    defaults: "world"
    displayName: "Feed Name"
    description: "Lowercase name for the KV key that remembers the events already reported (`eonet_seen_<feed>`)."

triggers:
  - id: every_six_hours
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check for new events four times a day. Shipped disabled; enable it after a manual run.
    cron: "15 */6 * * *"
    disabled: true

tasks:
  - id: fetch_events
    type: io.kestra.plugin.core.http.Request
    description: Read the open events matching the categories, area and lookback from EONET v3, with retries.
    uri: "https://eonet.gsfc.nasa.gov/api/v3/events?status=open&days={{ inputs.days }}&bbox={{ inputs.bbox | urlencode }}{{ inputs.categories | trim != '' ? '&category=' ~ (inputs.categories | urlencode) : '' }}"
    method: GET
    options:
      timeout:
        connectTimeout: PT15S
        readIdleTimeout: PT90S
    retry:
      type: exponential
      interval: PT10S
      maxInterval: PT1M
      maxAttempts: 4

  - id: build_layers
    type: io.kestra.plugin.scripts.python.Script
    description: Turn every event into one row with its category, first and last observation, latest position and magnitude, load the rows into DuckDB, write `events.parquet` and an `events.geojson` of latest positions, and split the events into new and already reported using the ids kept in the KV store.
    containerImage: python:3.12-slim
    beforeCommands:
      - pip install --quiet --disable-pip-version-check duckdb==1.5.6
    inputFiles:
      events.json: "{{ outputs.fetch_events.body }}"
      seen.json: "{{ kv('eonet_seen_' ~ inputs.feed, errorOnMissing=false) ?? '[]' }}"
    outputFiles:
      - events.parquet
      - events.geojson
      - seen_now.json
    script: |
      import json
      import duckdb

      events = json.load(open("events.json", encoding="utf-8")).get("events", [])
      seen = set(json.load(open("seen.json", encoding="utf-8")) or [])
      rows, features = [], []
      for e in events:
          geo = e.get("geometry") or []
          last = geo[-1] if geo else {}
          coords = last.get("coordinates") or [None, None]
          lon, lat = (coords if last.get("type") == "Point" else (None, None))
          category = ", ".join(c["title"] for c in e.get("categories", []))
          rows.append((e["id"], e["title"], category, geo[0]["date"] if geo else None, last.get("date"),
                       lon, lat, last.get("magnitudeValue"), last.get("magnitudeUnit"), len(geo),
                       ", ".join(s.get("url", "") for s in e.get("sources", []))))
          if lon is not None:
              features.append({"type": "Feature", "geometry": {"type": "Point", "coordinates": [lon, lat]},
                               "properties": {"id": e["id"], "title": e["title"], "category": category,
                                              "last_seen": last.get("date"), "new": e["id"] not in seen}})

      con = duckdb.connect()
      con.execute("""CREATE TABLE events (id VARCHAR, title VARCHAR, category VARCHAR, first_seen TIMESTAMP,
                     last_seen TIMESTAMP, lon DOUBLE, lat DOUBLE, magnitude DOUBLE, magnitude_unit VARCHAR,
                     observations INTEGER, sources VARCHAR)""")
      con.executemany("INSERT INTO events VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)", rows)
      con.execute("COPY events TO 'events.parquet' (FORMAT PARQUET)")
      by_category = dict(con.execute("SELECT category, count(*) FROM events GROUP BY 1 ORDER BY 2 DESC").fetchall())
      json.dump({"type": "FeatureCollection", "features": features}, open("events.geojson", "w", encoding="utf-8"))

      new = [r for r in rows if r[0] not in seen]
      json.dump(sorted(seen | {r[0] for r in rows}), open("seen_now.json", "w", encoding="utf-8"))
      def line(r):
          where = f" at {r[6]:.2f},{r[5]:.2f}" if r[5] is not None else ""
          size = f", {r[7]:g} {r[8]}" if r[7] is not None else ""
          return f"{r[2]}: {r[1]} (since {str(r[3])[:10]}{where}{size})"
      print("::" + json.dumps({"outputs": {
          "total": len(rows), "new": len(new), "first_run": not seen, "by_category": by_category,
          "new_events": [line(r) for r in sorted(new, key=lambda r: str(r[4]), reverse=True)[:15]],
      }}) + "::")

  - id: remember_seen
    type: io.kestra.plugin.core.kv.Set
    description: Store every event id reported so far, so the next run only reports events that are new.
    key: "eonet_seen_{{ inputs.feed }}"
    value: "{{ read(outputs.build_layers.outputFiles['seen_now.json']) }}"
    kvType: JSON

  - id: report
    type: io.kestra.plugin.core.flow.If
    description: Log the new events when there are any (the first run reports everything open), otherwise one quiet line.
    condition: "{{ outputs.build_layers.vars.new > 0 }}"
    then:
      - id: log_new_events
        type: io.kestra.plugin.core.log.Log
        message: |
          EONET {{ inputs.feed }}: {{ outputs.build_layers.vars.new }} new event(s){{ outputs.build_layers.vars.first_run ? ' (first run: everything open is new)' : '' }}, {{ outputs.build_layers.vars.total }} open in total {{ outputs.build_layers.vars.by_category }}.
          {% for line in outputs.build_layers.vars.new_events %}- {{ line }}
          {% endfor %}
    else:
      - id: log_quiet
        type: io.kestra.plugin.core.log.Log
        message: "EONET {{ inputs.feed }}: no new events; {{ outputs.build_layers.vars.total }} still open {{ outputs.build_layers.vars.by_category }}."

outputs:
  - id: geojson
    type: FILE
    value: "{{ outputs.build_layers.outputFiles['events.geojson'] }}"
  - id: new_events
    type: INT
    value: "{{ outputs.build_layers.vars.new }}"

extend:
  title: "NASA EONET Natural Event Tracker with DuckDB and GeoJSON"
  shortDescription: Read open wildfires, storms, volcanoes and floods from NASA's EONET API every six hours, write them to GeoJSON and Parquet with DuckDB, and report only the events that are new since the last run.
  metaTitle: NASA EONET Natural Event Tracker (GeoJSON + DuckDB) | Kestra
  metaDescription: "Poll NASA EONET for open wildfires, storms and volcanoes, build GeoJSON and Parquet with DuckDB, and report only new events using the KV store."
  description: |
    NASA's [Earth Observatory Natural Event Tracker (EONET)](https://eonet.gsfc.nasa.gov/) publishes curated, geolocated natural events as they happen: wildfires, severe storms and tropical cyclones, volcanic eruptions, floods, sea and lake ice and more, each with its track of observations and links to the source agencies. This blueprint polls EONET for an area and a set of categories, turns the events into a GeoJSON map layer and a Parquet table with DuckDB, and reports only the events that appeared since the previous run.

    ## How it works

    1. `every_six_hours` (`io.kestra.plugin.core.trigger.Schedule`) runs four times a day. It ships `disabled: true`.
    2. `fetch_events` (`io.kestra.plugin.core.http.Request`) calls `GET /api/v3/events?status=open` with the `days`, `bbox` and `category` filters, with exponential retries. No API key is needed.
    3. `build_layers` (`io.kestra.plugin.scripts.python.Script`) builds one row per event (category, first and last observation, latest position, magnitude such as wind speed in knots or burned area, number of observations, source links), loads them into DuckDB, writes `events.parquet` and an `events.geojson` of latest positions, and compares the ids with the ones already reported, read with the `kv()` function.
    4. `remember_seen` (`io.kestra.plugin.core.kv.Set`) stores the ids reported so far under `eonet_seen_<feed>`.
    5. `report` (`io.kestra.plugin.core.flow.If`) logs the new events, newest first with position and magnitude, when there are any, and a single quiet line otherwise. The GeoJSON file and the new-event count are flow outputs.

    ## What you get

    - A GeoJSON layer of open natural events that drops straight into QGIS, Kepler.gl, Leaflet or a dashboard map.
    - A Parquet table with every event's track summary and source links, ready for DuckDB or a warehouse.
    - Only new events reported, so a schedule never repeats the same wildfire or storm.
    - A `new_events` output to branch on, for example to notify a team or open an incident only when something new appears in its area.

    ## Who it's for

    - Operations, logistics and supply-chain teams with sites or routes exposed to wildfires, storms or floods.
    - GIS, risk and insurance analysts.
    - Newsrooms and researchers tracking natural hazards.

    ## Why orchestrate this with Kestra

    The API answers in one call, but turning it into a reliable feed needs a schedule, retries, state to know what was already reported, and somewhere to keep each snapshot. Kestra provides all of it: the KV store remembers the reported ids, each execution keeps its GeoJSON and Parquet files, the `If` task separates "something new" from quiet runs, and the output count can trigger any downstream flow.

    ## Prerequisites

    - Outbound HTTPS access to `eonet.gsfc.nasa.gov` (public, no key).
    - A Kestra worker that can run containers (Docker or Kubernetes task runner) and reach PyPI.

    ### Secrets

    - None. EONET is a public NASA API.

    ## Quick start

    1. Set `categories`, a `bbox` for your area (EONET order: min lon, max lat, max lon, min lat) and a `feed` name.
    2. Execute the flow: the first run reports every open event and stores their ids.
    3. Execute it again: only events that appeared since are reported. Download `geojson` from the outputs and open it on a map.
    4. Enable `every_six_hours`.

    ## How to extend

    - Add a notification task in the `then` branch to page a team when a new event appears near its sites.
    - Compute the distance from each event to your own locations in DuckDB and keep only the close ones.
    - Run one feed per region with a `Loop` over bounding boxes.
    - Append each snapshot to a warehouse table to study how long events stay open.

    ## Links

    - [EONET API v3 documentation](https://eonet.gsfc.nasa.gov/docs/v3)
    - [EONET categories](https://eonet.gsfc.nasa.gov/api/v3/categories)
    - [DuckDB Python API](https://duckdb.org/docs/api/python/overview)
    - [Kestra If task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.if)
    - [Kestra KV store](https://kestra.io/docs/concepts/kv-store)
  tags:
    - Data
  subTags:
    - ELT & Data Landing
    - Monitoring & Alerting
  ee: false
  demo: false
