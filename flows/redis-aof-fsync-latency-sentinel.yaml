id: redis-aof-fsync-latency-sentinel
namespace: company.dataops

inputs:
  - id: redis_host
    type: STRING
    defaults: redis.internal
    description: Hostname of the Redis instance.
  - id: redis_port
    type: INT
    defaults: 6379
    description: TCP port of the Redis instance.
  - id: max_delayed_fsync_threshold
    type: INT
    defaults: 5
    description: Maximum permissible delayed AOF fsync events before alerting.

tasks:
  - id: inspect_aof_persistence
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - |
        redis-cli -h "{{ inputs.redis_host }}" -p {{ inputs.redis_port }} -a "{{ secret('REDIS_PASSWORD') }}" INFO persistence > persist_info.txt
        python3 -c "
        import json
        with open('persist_info.txt') as f:
            lines = f.readlines()
        info = {}
        for l in lines:
            if ':' in l:
                k, v = l.strip().split(':', 1)
                info[k] = v
        aof_enabled = int(info.get('aof_enabled', 0))
        delayed_fsync = int(info.get('aof_delayed_fsync', 0))
        alert_triggered = (aof_enabled == 1) and (delayed_fsync > {{ inputs.max_delayed_fsync_threshold }})
        result = {
            'aof_enabled': aof_enabled,
            'aof_delayed_fsync': delayed_fsync,
            'aof_last_bgrewrite_status': info.get('aof_last_bgrewrite_status', 'ok'),
            'alert_triggered': alert_triggered
        }
        with open('aof_summary.json', 'w') as out:
            json.dump(result, out)
        print('Redis AOF audit:', result)
        "
    outputFiles:
      - aof_summary.json

  - id: evaluate_aof_stalls
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.inspect_aof_persistence.outputFiles['aof_summary.json'])).alert_triggered }}"
    then:
      - id: alert_infrastructure_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *Redis AOF Write Stall Alert*: Redis server {{ inputs.redis_host }} has experienced {{ json(read(outputs.inspect_aof_persistence.outputFiles['aof_summary.json'])).aof_delayed_fsync }} delayed AOF fsync operations. Underlying disk I/O latency is stalling Redis main thread execution."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Redis Sentinel Execution Failure*: Failed to query persistence metrics on {{ inputs.redis_host }}."
      }

triggers:
  - id: scheduled_fsync_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Redis AOF Delayed Fsync Disk Write Stall Sentinel
  shortDescription: Audits Redis AOF persistence metrics to detect delayed fsync events stalling main thread query execution.
  description: |
    ## How it works
    This sentinel connects to Redis using `redis-cli` and queries `INFO persistence` to evaluate `aof_delayed_fsync`. In `appendfsync everysec` mode, background fsync delays over two seconds force the main event loop to block, leading to application command timeouts.

    ## What you get
    - Proactive visibility into underlying storage volume I/O saturation.
    - Early warning before Redis main thread freezes impact user requests.
    - Automated Slack incident delivery indicating delayed fsync counts and rewrite status.

    ## Who it's for
    - Database administrators and platform engineers managing persistent Redis clusters.
    - SREs troubleshooting unpredictable Redis response latency.

    ## Why orchestrate this with Kestra
    Kestra automates distributed system observability, executing scheduled health checks with fine-grained error management and notification delivery.

    ## Prerequisites
    - Redis server with AOF persistence enabled.
    - Secrets `REDIS_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure host, port, and credentials.
    3. Run manually to check current delayed fsync count.

    ## How to extend
    - Query `INFO commandstats` concurrently to track write command latency.
    - Correlate AOF delays with disk IOPS metrics on AWS EBS or Google Persistent Disk.
    - Forward persistence metrics to Datadog or Prometheus.

    ## Links
    - [Redis Persistence Documentation](https://redis.io/docs/management/persistence/)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
