    - [Verdaccio GitHub Repository](https://github.com/verdaccio/verdaccio)
    - [Verdaccio Docker Guide](https://verdaccio.org/docs/docker)
    - [Kestra HTTP Plugin](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Business
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  demo: false
