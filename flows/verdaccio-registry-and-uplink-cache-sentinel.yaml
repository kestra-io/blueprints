id: verdaccio-registry-and-uplink-cache-sentinel
namespace: company.team

description: |
  Continuously monitors private Verdaccio npm registries by probing service liveness endpoints, auditing internal storage engine readiness, validating upstream uplink cache proxying, classifying operational health, routing real-time Slack incident alerts, and logging compliance audit records.

inputs:
  - id: verdaccio_host
    type: STRING
    displayName: Verdaccio Host
    description: Hostname or IP address of the Verdaccio instance reachable by the Kestra worker.
    defaults: "localhost"

  - id: verdaccio_port
    type: INT
    displayName: Verdaccio Port
    description: HTTP port of the Verdaccio service (defaults to 4873).
    defaults: 4873

  - id: verdaccio_scheme
    type: STRING
    displayName: Protocol Scheme
    description: URI protocol scheme (http or https).
    defaults: "http"

  - id: canary_package
    type: STRING
    displayName: Canary Package Name
    description: Public or internal npm package identifier queried to verify uplink proxy resolution and tarball metadata caching.
    defaults: "express"

tasks:
  - id: probe_registry_ping
    type: io.kestra.plugin.core.http.Request
    description: Queries Verdaccio /-/ping endpoint to verify core HTTP web server liveness and network responsiveness.
    uri: "{{ inputs.verdaccio_scheme }}://{{ inputs.verdaccio_host }}:{{ inputs.verdaccio_port }}/-/ping"
    method: GET
    headers:
      Accept: "application/json"
    options:
      allowFailed: true
    allowFailure: true

  - id: probe_storage_engine
    type: io.kestra.plugin.core.http.Request
    description: Queries Verdaccio /-/verdaccio/ping endpoint to audit local database backend readiness and package storage health.
    uri: "{{ inputs.verdaccio_scheme }}://{{ inputs.verdaccio_host }}:{{ inputs.verdaccio_port }}/-/verdaccio/ping"
    method: GET
    headers:
      Accept: "application/json"
    options:
      allowFailed: true
    allowFailure: true

  - id: probe_uplink_package
    type: io.kestra.plugin.core.http.Request
    description: Queries metadata for canary_package to verify that upstream uplink proxying (e.g., npmjs.org) and local tarball caching are actively functioning.
    uri: "{{ inputs.verdaccio_scheme }}://{{ inputs.verdaccio_host }}:{{ inputs.verdaccio_port }}/{{ inputs.canary_package }}"
    method: GET
    headers:
      Accept: "application/json"
    options:
      allowFailed: true
    allowFailure: true

  - id: classify_registry_posture
    type: io.kestra.plugin.core.debug.Return
    description: Evaluates HTTP status codes across liveness, storage readiness, and uplink proxy probes to classify registry operational posture.
    format: |
      {{ outputs.probe_registry_ping.code is not defined or outputs.probe_storage_engine.code is not defined ? 'REGISTRY_UNREACHABLE' : (outputs.probe_registry_ping.code != 200 ? 'REGISTRY_DEGRADED' : (outputs.probe_storage_engine.code != 200 or not (((outputs.probe_storage_engine.body | json | jq('.status') | first) ?? '') == 'ok') ? 'STORAGE_ENGINE_DEGRADED' : (outputs.probe_uplink_package.code != 200 ? 'UPLINK_PROXY_OFFLINE' : 'HEALTHY_COMPLIANT'))) }}

  - id: route_by_posture
    type: io.kestra.plugin.core.flow.Switch
    description: Routes alerts and logs based on the classified Verdaccio registry operational posture.
    value: "{{ outputs.classify_registry_posture.value }}"
    cases:
      "HEALTHY_COMPLIANT":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "Verdaccio registry at {{ inputs.verdaccio_scheme }}://{{ inputs.verdaccio_host }}:{{ inputs.verdaccio_port }} is HEALTHY_COMPLIANT. Ping: {{ outputs.probe_registry_ping.code }}. Storage status: {{ outputs.probe_storage_engine.code }} ({{ outputs.probe_storage_engine.body | json | jq('.status') | first }}). Uplink canary '{{ inputs.canary_package }}': HTTP {{ outputs.probe_uplink_package.code }}."

      "UPLINK_PROXY_OFFLINE":
        - id: alert_uplink_offline_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {"text": "Verdaccio Sentinel WARNING: Uplink proxy offline or degraded on " ~ inputs.verdaccio_host ~ ":" ~ inputs.verdaccio_port ~ "! Querying canary package '" ~ inputs.canary_package ~ "' failed with HTTP " ~ (outputs.probe_uplink_package.code ?? 'NONE') ~ ". Upstream npmjs.org uplink connection timed out or DNS unresolvable. CI/CD package installs will fail! Execution: " ~ execution.id ~ "."} | toJson }}

        - id: log_uplink_offline
          type: io.kestra.plugin.core.log.Log
          message: "WARNING: Verdaccio uplink proxy returned non-200 for canary package {{ inputs.canary_package }}: {{ outputs.probe_uplink_package.code }}."

      "STORAGE_ENGINE_DEGRADED":
        - id: alert_storage_degraded_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {"text": "Verdaccio Sentinel CRITICAL ALERT: Package storage engine degraded on " ~ inputs.verdaccio_host ~ ":" ~ inputs.verdaccio_port ~ "! /-/verdaccio/ping returned HTTP " ~ (outputs.probe_storage_engine.code ?? 'NONE') ~ ". Local storage backend full, read-only, or database corrupted. Package publish and fetch blocked! Execution: " ~ execution.id ~ "."} | toJson }}

        - id: log_storage_degraded
          type: io.kestra.plugin.core.log.Log
          message: "CRITICAL: Verdaccio /-/verdaccio/ping returned non-200 or unready status: {{ outputs.probe_storage_engine.code }}."

      "REGISTRY_DEGRADED":
        - id: alert_registry_degraded_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {"text": "Verdaccio Sentinel WARNING: Registry HTTP server degraded on " ~ inputs.verdaccio_host ~ ":" ~ inputs.verdaccio_port ~ "! /-/ping returned HTTP " ~ (outputs.probe_registry_ping.code ?? 'NONE') ~ ". Node.js event loop stalled or worker thread constrained. Execution: " ~ execution.id ~ "."} | toJson }}

        - id: log_registry_degraded
          type: io.kestra.plugin.core.log.Log
          message: "WARNING: Verdaccio /-/ping returned non-200 code: {{ outputs.probe_registry_ping.code }}."

      "REGISTRY_UNREACHABLE":
        - id: alert_unreachable_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {"text": "Verdaccio Sentinel OUTAGE: Cannot reach Verdaccio registry at " ~ inputs.verdaccio_scheme ~ "://" ~ inputs.verdaccio_host ~ ":" ~ inputs.verdaccio_port ~ ". Container offline, network partitioned, or connection refused. All npm/pnpm/yarn builds blocked! Execution: " ~ execution.id ~ "."} | toJson }}

        - id: log_unreachable
          type: io.kestra.plugin.core.log.Log
          message: "OUTAGE: Verdaccio registry unreachable at {{ inputs.verdaccio_scheme }}://{{ inputs.verdaccio_host }}:{{ inputs.verdaccio_port }}."

  - id: audit_summary
    type: io.kestra.plugin.core.output.OutputValues
    description: Exports structured telemetry attributes and endpoint verification metrics for compliance audit reporting.
    values:
      target_registry: "{{ inputs.verdaccio_scheme }}://{{ inputs.verdaccio_host }}:{{ inputs.verdaccio_port }}"
      ping_http_code: "{{ outputs.probe_registry_ping.code ?? 0 }}"
      storage_ping_code: "{{ outputs.probe_storage_engine.code ?? 0 }}"
      storage_status: "{{ outputs.probe_storage_engine.body | json | jq('.status') | first ?? 'NONE' }}"
      canary_package_code: "{{ outputs.probe_uplink_package.code ?? 0 }}"
      canary_package_name: "{{ inputs.canary_package }}"
      registry_posture: "{{ outputs.classify_registry_posture.value }}"

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts on unexpected workflow runtime execution failure.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {"text": "Verdaccio Sentinel workflow failed unexpectedly during execution " ~ execution.id ~ " in namespace " ~ flow.namespace ~ "."} | toJson }}

triggers:
  - id: hourly_canary
    type: io.kestra.plugin.core.trigger.Schedule
    description: Executes automated Verdaccio registry and uplink health audit at the top of every hour. Shipped disabled.
    cron: "0 * * * *"
    disabled: true
    inputs:
      verdaccio_host: "localhost"
      verdaccio_port: 4873
      verdaccio_scheme: "http"
      canary_package: "express"

extend:
  title: Verdaccio Private NPM Registry and Uplink Cache Sentinel
  metaTitle: Verdaccio Private NPM Registry and Uplink Cache Sentinel | Kestra
  shortDescription: Continuous health, storage readiness, and upstream uplink proxy cache monitoring for Verdaccio private npm registries.
  metaDescription: Audit Verdaccio private npm registry health, validate storage engine readiness and upstream package uplink cache proxying, and alert Slack via Kestra.
  description: |
    Continuously audits private Verdaccio npm registries and artifact mirrors by probing web server liveness endpoints, validating local package storage backend readiness, verifying upstream uplink cache proxying (e.g., npmjs.org), classifying operational health, and dispatching real-time incident escalation alerts to Slack.

    This blueprint was created by [Mohit Jeswani](https://github.com/mohitjeswani01).

    ## How it works

    1. `probe_registry_ping` (`io.kestra.plugin.core.http.Request`) queries `/-/ping` to verify that the Verdaccio Node.js web server process is responsive and accepting client requests.
    2. `probe_storage_engine` (`io.kestra.plugin.core.http.Request`) queries `/-/verdaccio/ping` to verify that the underlying local storage backend, package database, and filesystem permissions are operational and accepting package reads/writes.
    3. `probe_uplink_package` (`io.kestra.plugin.core.http.Request`) queries metadata for a configurable `canary_package` (defaults to `express`) to verify that upstream uplink proxying to public registries (e.g., `https://registry.npmjs.org/`) and cached metadata lookups are functioning.
    4. `classify_registry_posture` (`io.kestra.plugin.core.debug.Return`) evaluates endpoint HTTP codes and JSON status attributes using a declarative Pebble expression:
       - Classifies as `REGISTRY_UNREACHABLE` if endpoints cannot be reached over the network.
       - Classifies as `REGISTRY_DEGRADED` if the basic `/-/ping` endpoint returns non-200.
       - Classifies as `STORAGE_ENGINE_DEGRADED` if `/-/verdaccio/ping` returns non-200 or reports an unready storage state.
       - Classifies as `UPLINK_PROXY_OFFLINE` if canary package resolution fails, indicating that upstream proxying to public registries is broken while the local server remains up.
       - Classifies as `HEALTHY_COMPLIANT` when all probes succeed.
    5. `route_by_posture` (`io.kestra.plugin.core.flow.Switch`) routes execution based on the classification:
       - `HEALTHY_COMPLIANT`: Logs successful audit confirmation with endpoint response codes.
       - `UPLINK_PROXY_OFFLINE`: Dispatches an urgent Slack alert warning that upstream proxying is failing and CI/CD npm builds will be impacted.
       - `STORAGE_ENGINE_DEGRADED`: Alerts Slack that package storage is read-only or corrupted.
       - `REGISTRY_DEGRADED` / `REGISTRY_UNREACHABLE`: Alerts on total service outage.
    6. `audit_summary` (`io.kestra.plugin.core.output.OutputValues`) exports structured metrics capturing endpoint HTTP status codes and operational posture for compliance logging.
    7. `errors` sends a priority failure notification to Slack if unhandled workflow execution errors occur.

    ## What you get

    - Automated, continuous validation of critical private npm registries without relying on developer error reports.
    - Early warning of upstream uplink proxy failures and DNS stalls before CI/CD pipelines break across the organization.
    - Instant detection of filesystem disk-full errors and storage engine corruptions blocking package publishing.
    - Contextual Slack alerts detailing exact endpoint failure codes and target hostnames.
    - Auditable execution history satisfying SOC2 and ISO27001 software supply chain and CI/CD availability controls.

    ## Who it's for

    - Platform Engineers and DevOps teams maintaining private npm registries and artifact caching proxies.
    - Build and Release Engineers ensuring continuous availability of package dependencies for CI/CD runners.
    - Site Reliability Engineers (SREs) monitoring developer productivity infrastructure and internal developer platforms (IDP).

    ## Why orchestrate this with Kestra

    A silent uplink failure in a private npm registry can halt hundreds of continuous integration pipelines simultaneously when developers merge pull requests. Simple TCP port checks only confirm that port 4873 is listening; they cannot test whether Verdaccio can successfully reach upstream registries or write to its storage engine. Kestra orchestrates multi-stage HTTP inspection, declarative Pebble classification, failure escalation to Slack, and centralized compliance audit trails in a single workflow.

    ## Prerequisites

    - A running Verdaccio instance (Docker container or Kubernetes deployment).
    - An incoming Slack webhook URL for incident notifications.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Incoming Slack webhook URL used by `alert_uplink_offline_slack`, `alert_storage_degraded_slack`, `alert_registry_degraded_slack`, `alert_unreachable_slack`, and `alert_flow_failure`.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Start a local Verdaccio instance using Docker:
       ```bash
       docker run -d --name verdaccio -p 4873:4873 verdaccio/verdaccio:latest
       ```
    3. Import this blueprint into Kestra and click **Execute** with default inputs (`verdaccio_host: "localhost"`).
    4. Confirm that `classify_registry_posture` classifies `HEALTHY_COMPLIANT` and inspect the structured telemetry in `audit_summary`.
    5. Enable the `hourly_canary` schedule to automate continuous npm registry and uplink cache monitoring.

    ## How to extend

    - Add authenticated private package verification by supplying a Verdaccio npm token in request authorization headers.
    - Integrate PagerDuty or Opsgenie alerts for out-of-hours on-call paging during `UPLINK_PROXY_OFFLINE` or `STORAGE_ENGINE_DEGRADED` incidents.
    - Expand multi-registry monitoring by looping over an array of internal Verdaccio mirror instances using `io.kestra.plugin.core.flow.ForEach`.

    ## Links

