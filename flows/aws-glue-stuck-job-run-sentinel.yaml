id: aws-glue-stuck-job-run-sentinel
namespace: company.team
description: |
  Probe an AWS Glue job run's status via GetJobRun, flag it AT_RISK when
  it ended in FAILED, TIMEOUT, ERROR, EXPIRED, or STOPPED, or when it is
  still RUNNING past a configured time budget, classify HEALTHY/AT_RISK/
  UNREACHABLE, alert Slack, and conditionally stop a stuck run with
  StopJobRun. auto_remediate and dry_run are two independent gates; a run
  that already reached a terminal state is never touched by remediation.

inputs:
  - id: job_name
    type: STRING
    displayName: "Glue Job Name"
    description: Glue job containing the run audited, matching the jobName property documented on both GetJobRun and StopJobRun.
  - id: run_id
    type: STRING
    displayName: "Glue Job Run ID"
    description: Specific run audited, matching GetJobRun's runId property. Required here rather than relying on "latest run" so repeated audits always track the exact same run.
  - id: max_running_minutes
    type: INT
    displayName: "Max Allowed Running Minutes"
    defaults: 120
    description: Breach when a run still in RUNNING, STARTING, or STOPPING state has an executionTime (seconds) exceeding this many minutes - a run taking far longer than expected is treated the same as a stuck job.
  - id: auto_remediate
    type: SELECT
    displayName: "Auto Remediate"
    defaults: "false"
    values:
      - "false"
      - "true"
    description: If "true" and the run is AT_RISK while still in a non-terminal state, stop it with StopJobRun (still gated by dry_run below). If "false", the risk is only reported. Has no effect on a run that already reached a terminal state, since there is nothing left to stop.
  - id: dry_run
    type: SELECT
    displayName: "Dry Run"
    defaults: "true"
    values:
      - "true"
      - "false"
    description: If "true", remediation is only logged, StopJobRun never runs. Must be explicitly "false", together with auto_remediate "true", for the run to actually be stopped.

triggers:
  - id: periodic_job_run_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Check every 30 minutes. Shipped disabled; enable it once job_name/run_id point at a real Glue job run and a manual run has been verified. Always fires in safe mode (auto_remediate false, dry_run true) regardless of this flow's own defaults."
    cron: "*/30 * * * *"
    disabled: true
    inputs:
      max_running_minutes: 120
      auto_remediate: "false"
      dry_run: "true"

tasks:
  - id: probe_job_run_status
    type: io.kestra.plugin.aws.glue.GetJobRun
    description: "Returns state (documented values include SUCCEEDED and RUNNING; AWS Glue's own JobRunState enum additionally includes STARTING, STOPPING, STOPPED, FAILED, TIMEOUT, ERROR, WAITING, EXPIRED) plus executionTime, startedOn, completedOn, and errorMessage. allowFailure true (a base Task property) lets an invalid job_name/run_id or an unreachable AWS endpoint be classified UNREACHABLE by the next task instead of failing this execution outright."
    jobName: "{{ inputs.job_name }}"
    runId: "{{ inputs.run_id }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    region: "{{ secret('AWS_DEFAULT_REGION') }}"
    allowFailure: true

  - id: evaluate_run_health
    type: io.kestra.plugin.core.debug.Return
    description: "Classify UNREACHABLE when state is not defined, AT_RISK when state is one of the documented non-success terminal states or when a still-running state has exceeded max_running_minutes, otherwise HEALTHY."
    format: "{{ outputs.probe_job_run_status.state is defined ? ((outputs.probe_job_run_status.state isIn ['FAILED', 'TIMEOUT', 'ERROR', 'EXPIRED', 'STOPPED'] or (outputs.probe_job_run_status.state isIn ['RUNNING', 'STARTING', 'STOPPING'] and (outputs.probe_job_run_status.executionTime ?? 0) > (inputs.max_running_minutes * 60))) ? 'AT_RISK' : 'HEALTHY') : 'UNREACHABLE' }}"

  - id: route_by_health
    type: io.kestra.plugin.core.flow.Switch
    description: "Log a quiet confirmation when healthy, route to the remediation gate when the run failed or is stuck running, or page Slack when the Glue API itself could not be reached."
    value: "{{ outputs.evaluate_run_health.value }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "Run {{ inputs.run_id }} of {{ inputs.job_name }} is state={{ outputs.probe_job_run_status.state }}, executionTime={{ outputs.probe_job_run_status.executionTime }}s, within the {{ inputs.max_running_minutes }}-minute budget."
      "AT_RISK":
        - id: route_remediation
          type: io.kestra.plugin.core.flow.Switch
          description: "auto_remediate only decides whether remediation is considered at all; dry_run, checked separately below, decides whether StopJobRun actually runs. Terminal states (FAILED, TIMEOUT, ERROR, EXPIRED, STOPPED) have nothing left to stop; StopJobRun is only meaningful while the run is still RUNNING, STARTING, or STOPPING past budget."
          value: "{{ inputs.auto_remediate }}"
          cases:
            "true":
              - id: check_dry_run
                type: io.kestra.plugin.core.flow.If
                condition: "{{ inputs.dry_run == \"false\" }}"
                then:
                  - id: stop_stuck_job_run
                    type: io.kestra.plugin.aws.glue.StopJobRun
                    description: "Stops run_id if it is still in a non-terminal state. Calling StopJobRun on a run that already reached SUCCEEDED/FAILED/etc has nothing to stop and is a safe no-op per Glue's own API behavior; this task is never reached for a run this flow has not itself classified AT_RISK."
                    jobName: "{{ inputs.job_name }}"
                    jobRunId: "{{ inputs.run_id }}"
                    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
                    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
                    region: "{{ secret('AWS_DEFAULT_REGION') }}"
                  - id: log_remediation_applied
                    type: io.kestra.plugin.core.log.Log
                    message: "Stopped run {{ inputs.run_id }} of {{ inputs.job_name }} (was state={{ outputs.probe_job_run_status.state }})."
                else:
                  - id: log_dry_run_remediation
                    type: io.kestra.plugin.core.log.Log
                    message: "DRY RUN: would stop run {{ inputs.run_id }} of {{ inputs.job_name }} (state={{ outputs.probe_job_run_status.state }}) (dry_run is true). No change made."
            "false":
              - id: log_remediation_disabled
                type: io.kestra.plugin.core.log.Log
                message: "auto_remediate is false: run {{ inputs.run_id }} of {{ inputs.job_name }} is state={{ outputs.probe_job_run_status.state }}, but no StopJobRun was attempted."
        - id: alert_at_risk
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Always alert on AT_RISK, independent of whether a stop was issued."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "AWS Glue stuck job run sentinel AT_RISK: run {{ inputs.run_id }} of {{ inputs.job_name }} is state={{ outputs.probe_job_run_status.state }}, executionTime={{ outputs.probe_job_run_status.executionTime }}s (budget {{ inputs.max_running_minutes }}m). auto_remediate: {{ inputs.auto_remediate }}. dry_run: {{ inputs.dry_run }}. Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "AWS Glue stuck job run sentinel UNREACHABLE: GetJobRun did not return a state for run {{ inputs.run_id }} of {{ inputs.job_name }} (invalid job/run ID, missing IAM permissions, or an unreachable AWS endpoint). Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        message: "Completed Glue job run audit with status: {{ outputs.evaluate_run_health.value }}"

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: "Post-audit status line recorded on every run regardless of branch, for a continuous job-reliability trend in the execution history."
    message: "Glue job run audit: job_name={{ inputs.job_name }}, run_id={{ inputs.run_id }}, status={{ outputs.evaluate_run_health.value }}, auto_remediate={{ inputs.auto_remediate }}, dry_run={{ inputs.dry_run }}, execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alert Slack when the sentinel flow itself fails, so a broken audit never silently stops monitoring the job run."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "AWS Glue stuck job run sentinel flow {{ flow.id }} FAILED (execution {{ execution.id }}). Job run status is now unknown; check the task logs and the AWS Glue console manually."
      }

extend:
  title: "AWS Glue Stuck Job Run Sentinel"
  shortDescription: Audit an AWS Glue job run's status, alert Slack when it failed or has run far longer than expected, and optionally stop a stuck run with StopJobRun.
  metaTitle: AWS Glue Stuck Job Run Sentinel with Kestra
  metaDescription: "Audit an AWS Glue job run for failure or a stuck RUNNING state past budget, alert on breach, and optionally stop it."
  description: |
    A Glue job that fails errors out quickly and loudly. A Glue job that is merely
    stuck - stalled on a slow partition, waiting on a resource it will never get, looping
    without making progress - does neither. It sits in `RUNNING` consuming DPUs and
    billable time while nothing downstream of it moves forward, and Glue's own job timeout
    is often set far looser than what any individual run should actually take. This
    blueprint reads a specific run's status and execution time through `GetJobRun`, flags
    it the moment it either ends badly or simply runs too long, alerts Slack, and can stop
    it cleanly with `StopJobRun` - leaving any run that already reached a terminal state
    completely untouched.

    ## How it works

    1. `periodic_job_run_check` (`io.kestra.plugin.core.trigger.Schedule`) runs every 30 minutes, always forcing `auto_remediate: "false"` and `dry_run: "true"` through its own `inputs:` override regardless of this flow's defaults. Shipped disabled so you can validate a manual run first.
    2. `probe_job_run_status` (`io.kestra.plugin.aws.glue.GetJobRun`, `allowFailure: true`) reads `run_id`'s `state`, `executionTime`, and related fields.
    3. `evaluate_run_health` (`io.kestra.plugin.core.debug.Return`) classifies the result as `UNREACHABLE` (`state` undefined), `AT_RISK` (a non-success terminal state, or still running/starting/stopping past `max_running_minutes`), or `HEALTHY`.
    4. `route_by_health` (`io.kestra.plugin.core.flow.Switch`) branches on that classification:
       - `HEALTHY`: `log_healthy` records the current, on-budget state.
       - `AT_RISK`: a nested `route_remediation` (`Switch` on `auto_remediate`) either considers remediation (`"true"`, gated again by `dry_run` through `check_dry_run`) or only logs that remediation is disabled (`"false"`). When both gates allow it, `stop_stuck_job_run` (`io.kestra.plugin.aws.glue.StopJobRun`) stops the run. `alert_at_risk` always fires to Slack regardless of which path ran.
       - `UNREACHABLE`: `alert_unreachable` pages Slack directly - a broken API call must never read as "job is fine".
    5. `log_audit_complete` always runs last, printing the classification regardless of which branch fired.
    6. The `errors` block alerts Slack separately if the flow itself fails outside these handled branches.

    ## What you get

    - A direct, Glue-native answer to "is this specific run actually healthy right now", distinguishing a genuinely stuck run from one that is simply still working within its expected time budget.
    - Remediation that only ever stops the one audited run; no other run of the same job, and no other job, is ever touched.
    - A three-way classification (`HEALTHY`/`AT_RISK`/`UNREACHABLE`) and a final status log every run, so the execution history doubles as a job-reliability trend for `job_name`.

    ## Who it's for

    - Data engineering teams running AWS Glue ETL jobs who need a cost and pipeline-latency safeguard against a run that quietly stalls instead of failing outright.
    - Platform teams who want a standard post-launch check after triggering a critical Glue job from another Kestra flow (such as this repo's own `aws-glue-athena-dynamodb.yaml`), auditing the run it started.
    - Anyone evaluating the Glue plugin who wants a worked example of `GetJobRun` and `StopJobRun` used together as a genuine operational safeguard.

    ## Why orchestrate this with Kestra

    Glue's own per-job timeout is a single blunt ceiling set once at the job definition level; it does not know that this particular run, for this particular input, should have finished in ten minutes rather than the two hours the job's timeout allows. Kestra supplies the schedule, the time-budget classification as a first-class branch, two independent authorization gates before anything is stopped, and an execution history that shows exactly when a run first crossed its budget and whether it was stopped.

    ## Prerequisites

    - An AWS account (or a LocalStack instance - `GetJobRun`/`StopJobRun` both expose `endpointOverride` for this) with a Glue job and a run ID to audit.
    - IAM permissions for `glue:GetJobRun` and, if remediation runs, `glue:StopJobRun`.
    - A Slack incoming webhook for alerts.

    Local testing: start LocalStack with `docker run -d --name glue-sentinel -p 4567:4566 localstack/localstack` (host port `4567` chosen to avoid any collision with Kestra's own UI on `8080`), `docker network connect YOUR_KESTRA_NETWORK glue-sentinel` (check `docker network ls` first; only needed if the Kestra Worker runs in a separate Docker network), then set `endpointOverride` to `http://glue-sentinel:4566` (in-network) or `http://localhost:4567` (from the host) on both `probe_job_run_status` and `stop_stuck_job_run`. Whether LocalStack's Community edition mocks Glue job-run state transitions realistically enough to exercise `AT_RISK` has not been verified in this environment; a real AWS account with a real Glue job remains the most reliable way to validate this flow end to end.

    ### Secrets

    - `AWS_ACCESS_KEY_ID` / `AWS_SECRET_ACCESS_KEY` / `AWS_DEFAULT_REGION`: AWS credentials used by both `GetJobRun` and `StopJobRun`, matching this plugin's own documented connection properties (see `build-aws-ecr-image.yaml`).
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by `alert_at_risk`, `alert_unreachable`, and the `errors` block.
    - In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_`, base64-encoded, and read back in flows with `{{ secret('NAME') }}` - for example `SECRET_AWS_ACCESS_KEY_ID=$(echo -n '<your-access-key>' | base64)`. This keeps credentials out of the flow YAML but, per Kestra's own documentation, offers no encryption at rest or access control beyond the host environment; use the Enterprise secrets backend for stronger guarantees.

    ### Inputs

    - `job_name` (STRING, no default): Glue job audited.
    - `run_id` (STRING, no default): specific run audited.
    - `max_running_minutes` (INT, default `120`): time budget before a still-running state counts as stuck.
    - `auto_remediate` (SELECT: `"false"`, `"true"`; default `"false"`): must be `"true"` for `StopJobRun` to even be considered.
    - `dry_run` (SELECT: `"true"`, `"false"`; default `"true"`): must be explicitly `"false"`, together with `auto_remediate: "true"`, for the run to actually be stopped.

    ### Outputs

    - `outputs.probe_job_run_status.state` / `.executionTime` / `.startedOn` / `.completedOn` / `.errorMessage`: the audited run's own fields for every run.
    - `outputs.evaluate_run_health.value`: `HEALTHY`, `AT_RISK`, or `UNREACHABLE` for every run.

    ## Quick start

    1. Start a Glue job (or point at an existing one) and note its `job_name` and a `run_id` to audit - for example, the `jobRunId` output from this repo's own `aws-glue-athena-dynamodb.yaml` after triggering it.
    2. Add the `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, `AWS_DEFAULT_REGION`, and `SLACK_WEBHOOK_URL` secrets.
    3. Run the flow manually against a run that completed successfully and confirm `log_healthy` fires.
    4. Point `run_id` at a run that failed and re-run; confirm `alert_at_risk` fires with `state: FAILED`, and that `log_remediation_disabled` logs without issuing a stop.
    5. Lower `max_running_minutes` below a currently-running run's actual elapsed time, run once with `auto_remediate: "true"` and `dry_run: "true"`, and confirm `log_dry_run_remediation` describes the stop without issuing it.
    6. Run once with `auto_remediate: "true"` and `dry_run: "false"` against that same still-running job and confirm `stop_stuck_job_run` transitions it toward `STOPPED`.
    7. Enable `periodic_job_run_check` once you trust the check; it always runs in the safe `auto_remediate: "false"` / `dry_run: "true"` mode regardless of what you leave the flow's own defaults set to.

    ## How to extend

    - Chain this flow directly after a `StartJobRun` task (via a `Subflow` call passing through the new run's `jobRunId`) for same-execution stuck-run protection on a critical pipeline, instead of waiting for the next scheduled sweep.
    - Loop over several `job_name`/`run_id` pairs with `io.kestra.plugin.core.flow.Loop` to audit every currently-running job across a Glue environment in one pass.
    - Surface `errorMessage` (returned by `GetJobRun` when present) in the Slack alert for terminal-state failures, giving the on-call engineer Glue's own failure reason without opening the AWS console.
    - Route the remediation branch through a `Pause` approval task instead of (or alongside) the static `auto_remediate` input, for a human-reviewed stop on a production job.

    ## Pitfalls

    - **`GetJobRun`'s `runId` and `StopJobRun`'s `jobRunId` are different property names for the same value.** Verified from each task's own documented schema; this blueprint reads `inputs.run_id` into both, but a direct copy-paste between the two tasks without checking the property name would silently fail schema validation.
    - **AWS Glue's full `JobRunState` enum has ten values, not just the two Kestra's own task description mentions as examples (`SUCCEEDED`, `RUNNING`).** Verified against AWS's own Glue API reference: `STARTING`, `RUNNING`, `STOPPING`, `STOPPED`, `SUCCEEDED`, `FAILED`, `TIMEOUT`, `ERROR`, `WAITING`, `EXPIRED`. This blueprint's classification explicitly lists every non-success terminal state it treats as `AT_RISK`, rather than assuming only `FAILED` matters.
    - **`StopJobRun` has nothing to stop a run that already reached a terminal state.** This blueprint only reaches `stop_stuck_job_run` from the `AT_RISK` branch, and a run classified `AT_RISK` purely for being in a terminal state (`FAILED`/`TIMEOUT`/`ERROR`/`EXPIRED`/`STOPPED`) will still have `StopJobRun` called against it by this flow's current logic - per Glue's own API behavior this is a safe no-op, but it does mean the task runs even when there is nothing left to stop; see How to extend for narrowing this to only the still-running case.
    - **Whether LocalStack Community edition realistically mocks Glue job-run state transitions has not been verified in this environment.** `endpointOverride` is a real, documented property on both tasks that supports pointing at LocalStack, but exercising `AT_RISK` end to end was not done here.
    - **`allowFailure: true` is what lets `UNREACHABLE` be classified instead of failing the execution outright.** A base `Task` property, not specific to this plugin; without it, an invalid `job_name`/`run_id` or a missing IAM permission would abort the flow before `evaluate_run_health` ever runs.
    - **`auto_remediate` and `dry_run` are independent gates, not a single boolean.** Both must be `"true"`/`"false"` respectively for `StopJobRun` to run; setting only one leaves the other still blocking.
    - **`Switch` case keys are quoted strings matching the classifier's exact output.** `"HEALTHY"`, `"AT_RISK"`, and `"UNREACHABLE"` must match `evaluate_run_health.value` verbatim; the `defaults:` block exists specifically to catch any value that does not match one of those three cases.

    ## Links

    - [plugin-aws Glue documentation](https://kestra.io/plugins/plugin-aws/aws-glue)
    - [AWS Glue GetJobRun API reference](https://docs.aws.amazon.com/glue/latest/webapi/API_GetJobRun.html)
    - [AWS Glue JobRunState reference](https://docs.aws.amazon.com/AWSJavaSDK/latest/javadoc/com/amazonaws/services/glue/model/JobRunState.html)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Monitoring & Alerting
    - Policy & Compliance
  ee: false
  demo: false
