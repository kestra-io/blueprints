id: vpc-flowlogs-enabler
namespace: company.security

description: |
  Audits VPC flow-log coverage across your AWS regions, optionally enables
  missing flow logs to CloudWatch Logs, and posts a Slack coverage report.

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to audit for VPC flow-log coverage.
  - id: log_group_name
    type: STRING
    defaults: "/aws/vpc/flowlogs"
    description: CloudWatch Logs log group where new flow logs are delivered.
  - id: iam_role_arn
    type: STRING
    defaults: ""
    description: IAM role ARN with permission to publish flow logs to CloudWatch Logs. Empty means report-only (no auto-enable).
  - id: auto_enable
    type: BOOLEAN
    defaults: false
    description: When true (and iam_role_arn is set), create flow logs for every VPC missing them.

variables:
  slack_webhook_url: "{{ secret('SLACK_WEBHOOK_URL') }}"

tasks:
  - id: audit_vpcs
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit VPC flow-log coverage in each region, in parallel.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: List VPCs in this region and check each for flow logs.
        commands:
          - |
            export REGION="{{ taskrun.value }}"
            aws ec2 describe-vpcs --region "$REGION" --output json > "/tmp/vpcs_${REGION}.json"
            python3 << 'PYEOF'
            import json, os, subprocess
            region = os.environ["REGION"]
            with open(f"/tmp/vpcs_{region}.json") as f:
                vpcs = json.load(f).get("Vpcs", [])
            records = []
            missing = []
            for v in vpcs:
                vpc_id = v["VpcId"]
                r = subprocess.run(
                    ["aws", "ec2", "describe-flow-logs", "--region", region,
                     "--filter", f"Name=resource-id,Values={vpc_id}",
                     "--output", "json"],
                    capture_output=True, text=True, check=True,
                )
                logs = json.loads(r.stdout).get("FlowLogs", [])
                covered = bool(logs)
                if not covered:
                    missing.append(vpc_id)
                records.append({
                    "region": region,
                    "vpc_id": vpc_id,
                    "cidr": v.get("CidrBlock", ""),
                    "is_default": bool(v.get("IsDefault")),
                    "covered": covered,
                    "enabled": False,
                })
            with open(f"/tmp/flowlogs_{region}.json", "w") as f:
                json.dump(records, f)
            print(f"VPC_COUNT={len(vpcs)}")
            print(f"MISSING_COUNT={len(missing)}")
            print(f"MISSING={','.join(missing)}")
            PYEOF
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ taskrun.value }}"
        outputFiles:
          - "/tmp/flowlogs_*.json"

      - id: enable_flowlogs
        type: io.kestra.plugin.core.flow.If
        description: Enable flow logs for uncovered VPCs when auto_enable is on and the IAM role is set.
        condition: "{{ inputs.auto_enable == true and inputs.iam_role_arn != '' and outputs.audit_region.vars.MISSING != '' }}"
        then:
          - id: create_flowlogs
            type: io.kestra.plugin.aws.cli.AwsCLI
            description: Create VPC flow logs (ALL traffic) to CloudWatch Logs for each uncovered VPC.
            commands:
              - |
                export REGION="{{ taskrun.value }}"
                export MISSING="{{ outputs.audit_region.vars.MISSING }}"
                export LOG_GROUP="{{ inputs.log_group_name }}"
                export ROLE_ARN="{{ inputs.iam_role_arn }}"
                python3 << 'PYEOF'
                import json, os, subprocess
                region = os.environ["REGION"]
                vpc_ids = [v for v in os.environ.get("MISSING", "").split(",") if v]
                created = []
                for vpc_id in vpc_ids:
                    try:
                        subprocess.run(
                            ["aws", "ec2", "create-flow-logs", "--region", region,
                             "--resource-type", "VPC", "--resource-ids", vpc_id,
                             "--traffic-type", "ALL", "--log-destination-type", "cloud-watch-logs",
                             "--log-group-name", os.environ["LOG_GROUP"],
                             "--deliver-logs-permission-arn", os.environ["ROLE_ARN"],
                             "--output", "json"],
                            check=True, capture_output=True, text=True,
                        )
                        created.append(vpc_id)
                    except subprocess.CalledProcessError:
                        pass
                path = f"/tmp/flowlogs_{region}.json"
                with open(path) as f:
                    records = json.load(f)
                for r in records:
                    if r["vpc_id"] in created:
                        r["enabled"] = True
                        r["covered"] = True
                with open(path, "w") as f:
                    json.dump(records, f)
                print(f"ENABLED={','.join(created)}")
                print(f"ENABLED_COUNT={len(created)}")
                PYEOF
            env:
              AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
              AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
              AWS_DEFAULT_REGION: "{{ taskrun.value }}"
            outputFiles:
              - "/tmp/flowlogs_*.json"

  - id: aggregate
    type: io.kestra.plugin.aws.cli.AwsCLI
    description: Combine per-region VPC results into coverage vars for the report.
    commands:
      - |
        python3 << 'PYEOF'
        import json, glob
        records = []
        for path in sorted(glob.glob("/tmp/flowlogs_*.json")):
            with open(path) as f:
                records.extend(json.load(f))
        total = len(records)
        covered = [r for r in records if r["covered"]]
        missing = [r for r in records if not r["covered"]]
        enabled = [r for r in records if r.get("enabled")]
        pct = round(len(covered) / total * 100, 1) if total else 100.0
        print(f"TOTAL_VPCS={total}")
        print(f"COVERED_COUNT={len(covered)}")
        print(f"COVERAGE_PCT={pct}")
        print(f"MISSING_COUNT={len(missing)}")
        print(f"ENABLED_COUNT={len(enabled)}")
        print(f"MISSING_LIST={', '.join(f\"{r['vpc_id']} ({r['region']})\" for r in missing) if missing else 'none'}")
        print(f"ENABLED_LIST={', '.join(f\"{r['vpc_id']} ({r['region']})\" for r in enabled) if enabled else 'none'}")
        print(f"HAS_FINDINGS={'true' if (missing or enabled) else 'false'}")
        print("REPORT<<EOF")
        for r in records:
            mark = "[OK] " if r["covered"] else "[MISS]"
            en_mark = " (enabled this run)" if r.get("enabled") else ""
            default_mark = " default" if r.get("is_default") else ""
            print(f"{mark} {r['vpc_id']} [{r['region']}{default_mark}] {r['cidr']}{en_mark}")
        print("EOF")
        PYEOF

  - id: notify
    type: io.kestra.plugin.core.flow.If
    description: Post the coverage report to Slack when there are gaps or enables.
    condition: "{{ outputs.aggregate.vars.HAS_FINDINGS == 'true' }}"
    then:
      - id: slack_report
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ vars.slack_webhook_url }}"
        payload: |
          {
            "text": ":satellite_antenna: *VPC flow-log coverage report*\n{{ outputs.aggregate.vars.COVERED_COUNT }}/{{ outputs.aggregate.vars.TOTAL_VPCS }} VPCs have flow logs ({{ outputs.aggregate.vars.COVERAGE_PCT }}%).\nMissing: {{ outputs.aggregate.vars.MISSING_LIST }}\nEnabled this run: {{ outputs.aggregate.vars.ENABLED_LIST }}"
          }
    else:
      - id: log_clean
        type: io.kestra.plugin.core.log.Log
        message: "All {{ outputs.aggregate.vars.TOTAL_VPCS }} VPCs have flow logs enabled. No gaps to report."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    disabled: true
    cron: "0 9 * * MON"
    description: Weekly on Monday at 09:00 UTC — VPC inventory changes slowly, a weekly audit is enough.

extend:
  title: VPC Flow Logs Enabler
  metaTitle: Enable VPC Flow Logs Across Regions | Kestra
  shortDescription: Audit VPC flow-log coverage across regions, auto-enable missing flow logs to CloudWatch, and track coverage in a Slack report.
  metaDescription: No flow logs means no network forensics — audit VPC coverage across regions, auto-enable missing logs, and get a Slack report.
  description: |
    VPCs without flow logs have zero network forensics — when something happens, there is nothing to investigate with. This blueprint finds every VPC missing flow logs across your regions, optionally enables them to CloudWatch Logs, and reports the coverage percentage to Slack — so no VPC stays dark.

    ## How it works

    1. A Schedule trigger fires weekly on Monday at 09:00 UTC (shipped disabled).
    2. A `ForEach` iterates your `aws_regions` input; per region it runs `aws ec2 describe-vpcs`, then `aws ec2 describe-flow-logs` filtered to each VPC, recording coverage per VPC.
    3. An `If` task gates the remediation: when `auto_enable` is true AND `iam_role_arn` is set, it runs `aws ec2 create-flow-logs` (ALL traffic, CloudWatch Logs destination) for every uncovered VPC.
    4. An aggregation task computes the coverage percentage across regions, and a final `If` posts a Slack coverage report when there are gaps or enables — otherwise it just logs that coverage is complete.

    ## What you get

    - A real per-VPC flow-log inventory across regions — including which are default VPCs.
    - Optional one-click remediation: set `iam_role_arn` + `auto_enable: true` and the gaps close themselves to your log group.
    - A Slack report with the coverage percentage, the VPCs still missing logs, and the ones enabled this run.
    - Silence on clean weeks: no alert fatigue when every VPC is covered.

    ## Who it's for

    Security engineers, network teams, and platform owners who need network forensics available before the incident — not wished for during it.

    ## Why orchestrate this with Kestra

    Flow logs are easy to forget when new VPCs are created, and a one-off CLI run doesn't stay true. As a Kestra flow the audit runs weekly, the IAM role and log group are versioned inputs, every enable action is logged with its VPC ID, and the Slack report keeps coverage visible — all in YAML, not a wiki page.

    ## Prerequisites

    - AWS credentials with `ec2:DescribeVpcs`, `ec2:DescribeFlowLogs` (plus `ec2:CreateFlowLogs` and `iam:PassRole` if you use `auto_enable`).
    - An IAM role that VPC Flow Logs can assume to publish to CloudWatch Logs (required only for auto-enable; the trust policy must allow `vpc-flow-logs.amazonaws.com`).
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the EC2 API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the EC2 API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the coverage report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Run manually once (report-only) to see which VPCs lack flow logs.
    3. To remediate: set `iam_role_arn` to your flow-logs delivery role and re-run with `auto_enable: true`.
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Deliver to S3 instead of CloudWatch Logs for cheaper long-term retention.
    - Add Athena queries over the flow logs for top-talkers and rejected-traffic summaries.
    - Alert immediately (not just weekly) when a NEW VPC appears without flow logs.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [EC2 describe-flow-logs API](https://docs.aws.amazon.com/cli/latest/reference/ec2/describe-flow-logs.html)
    - [EC2 create-flow-logs API](https://docs.aws.amazon.com/cli/latest/reference/ec2/create-flow-logs.html)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
