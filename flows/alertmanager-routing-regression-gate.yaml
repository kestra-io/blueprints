# Check Alertmanager receiver routing before releasing a candidate configuration.
id: alertmanager-routing-regression-gate
namespace: company.observability
description: Validate an Alertmanager configuration and its expected receiver routes, retaining evidence before enforcing
  the gate.
inputs:
  - id: config_yaml
    type: STRING
    description: Candidate Alertmanager YAML, at most 64 KiB. Referenced templates and credential files are not supplied
      by this flow.
    defaults: |
      route:
        receiver: default
        routes:
          - receiver: critical
            matchers: ['severity="critical"']
            continue: true
          - receiver: audit
            matchers: ['severity="critical"']
      receivers:
        - name: default
        - name: critical
        - name: audit
  - id: cases
    type: JSON
    description: 1-100 cases with unique name, labels object and nonempty ordered receivers list. Receiver names cannot
      contain commas; total JSON is at most 256 KiB.
    defaults:
      - name: critical-fanout
        labels:
          severity: critical
          service: payments
        receivers:
          - critical
          - audit
      - name: default-fallback
        labels:
          severity: warning
        receivers:
          - default
variables:
  python_image: python:3.12.12-slim@sha256:f3fa41d74a768c2fce8016b98c191ae8c1bacd8f1152870a3f9f87d350920b7c
  alertmanager_image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
tasks:
  - id: prepare
    type: io.kestra.plugin.scripts.python.Script
    timeout: PT1M
    containerImage: "{{ vars.python_image }}"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    inputFiles:
      candidate.b64: "{{ inputs.config_yaml | base64encode }}"
      cases.b64: "{{ inputs.cases | toJson | base64encode }}"
    script: |
      import base64
      import hashlib
      import json
      import re
      import shlex
      from pathlib import Path

      # Base64 keeps Alertmanager's Go templates outside Kestra's expression renderer.
      config = base64.b64decode(Path('candidate.b64').read_bytes(), validate=True)
      case_bytes = base64.b64decode(Path('cases.b64').read_bytes(), validate=True)
      if len(case_bytes) > 262144:
          raise ValueError('cases JSON must be at most 262144 bytes')
      cases = json.loads(case_bytes)
      if not 0 < len(config) <= 65536:
          raise ValueError('config_yaml must contain 1-65536 UTF-8 bytes')
      if not isinstance(cases, list) or not 1 <= len(cases) <= 100:
          raise ValueError('cases must contain 1-100 routing cases')
      names = set()
      for index, case in enumerate(cases):
          if not isinstance(case, dict) or set(case) != {'name', 'labels', 'receivers'}:
              raise ValueError('Each case requires only name, labels and receivers')
          name, labels, receivers = case['name'], case['labels'], case['receivers']
          if not isinstance(name, str) or not 1 <= len(name) <= 100 or name in names:
              raise ValueError('Case names must be unique strings of 1-100 characters')
          names.add(name)
          if not isinstance(labels, dict) or len(labels) > 100:
              raise ValueError('labels must be an object with at most 100 entries')
          for key, value in labels.items():
              if not re.fullmatch(r'[a-zA-Z_][a-zA-Z0-9_]*', key):
                  raise ValueError('Use Prometheus ASCII label names')
              if not isinstance(value, str) or len(value.encode()) > 4096:
                  raise ValueError('Label values must be strings of at most 4096 bytes')
          if not isinstance(receivers, list) or not 1 <= len(receivers) <= 100:
              raise ValueError('receivers must be a nonempty ordered list')
          if any(not isinstance(r, str) or not r or ',' in r or len(r) > 256 for r in receivers):
              raise ValueError('Receiver names must be nonempty, comma-free strings of at most 256 characters')
          # amtool compares receiver order; an empty expectation would disable verification.
          args = ['/bin/amtool', 'config', 'routes', 'test', '--config.file=config.yml',
                  '--verify.receivers=' + ','.join(receivers)]
          args.extend(key + '=' + json.dumps(value, ensure_ascii=False) for key, value in sorted(labels.items()))
          command = shlex.join(args)
          Path(f'case-{index}.sh').write_text(
              'status=0\n' + command + f' > case-{index}.txt 2>&1 || status=$?\nprintf "%s" "$status" > case-{index}.status\n',
              encoding='utf-8')
      Path('config.yml').write_bytes(config)
      Path('cases.json').write_text(json.dumps(cases), encoding='utf-8')
      print('::' + json.dumps({'outputs': {'indices': list(range(len(cases))),
            'config_sha256': hashlib.sha256(config).hexdigest()}}) + '::')
    outputFiles:
      - config.yml
      - cases.json
      - case-*.sh
  - id: check_syntax
    type: io.kestra.plugin.scripts.shell.Commands
    timeout: PT30S
    description: Capture the real exit status so syntax evidence survives a failed verdict.
    containerImage: "{{ vars.alertmanager_image }}"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      user: 0:0
      entryPoint:
        - ''
    commands:
      - status=0; /bin/amtool check-config config.yml > syntax.txt 2>&1 || status=$?; printf '%s' "$status" > syntax.status
    inputFiles:
      config.yml: "{{ outputs.prepare.outputFiles['config.yml'] }}"
    outputFiles:
      - syntax.txt
      - syntax.status
  - id: each_case
    type: io.kestra.plugin.core.flow.Loop
    description: Run every expectation sequentially and export each real status and diagnostic output.
    values: "{{ outputs.prepare.vars.indices | toJson }}"
    concurrencyLimit: 1
    tasks:
      - id: test_route
        type: io.kestra.plugin.scripts.shell.Commands
        timeout: PT30S
        containerImage: "{{ vars.alertmanager_image }}"
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          user: 0:0
          entryPoint:
            - ''
        commands:
          - sh case.sh
        inputFiles:
          config.yml: "{{ outputs.prepare.outputFiles['config.yml'] }}"
          case.sh: "{{ outputs.prepare.outputFiles['case-' ~ item.value ~ '.sh'] }}"
        outputFiles:
          - case-*.txt
          - case-*.status
    outputs:
      - id: index
        type: INT
        value: "{{ item.value }}"
      - id: status
        type: INT
        value: "{{ read(outputs.test_route.outputFiles['case-' ~ item.value ~ '.status']) }}"
      - id: output_b64
        type: STRING
        value: "{{ read(outputs.test_route.outputFiles['case-' ~ item.value ~ '.txt']) | base64encode }}"
  - id: report
    type: io.kestra.plugin.scripts.python.Script
    timeout: PT1M
    description: Require complete results and save diagnostic files before the assertion can fail.
    containerImage: "{{ vars.python_image }}"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    outputFiles:
      - report.json
      - report.md
      - syntax.txt
    script: |
      import base64
      import hashlib
      import json
      from pathlib import Path

      cases = json.loads(Path('cases.json').read_text())
      syntax_status = int(Path('syntax.status').read_text())
      rows = [row['outputs'] for row in json.loads(base64.b64decode(Path('results.b64').read_bytes(), validate=True))]
      if len(rows) != len(cases) or {r['index'] for r in rows} != set(range(len(cases))):
          raise ValueError('Missing or duplicate routing results')
      rows.sort(key=lambda row: row['index'])
      results = []
      for index, case in enumerate(cases):
          status = rows[index]['status']
          results.append({'name': case['name'], 'labels': case['labels'],
                          'expected_receivers': case['receivers'], 'exit_code': status,
                          'output': base64.b64decode(rows[index]['output_b64'], validate=True).decode('utf-8', errors='replace')})
      passed = bool(results) and syntax_status == 0 and all(r['exit_code'] == 0 for r in results)
      report = {'passed': passed, 'config_sha256': hashlib.sha256(Path('config.yml').read_bytes()).hexdigest(),
                'amtool_version': '0.28.1', 'syntax_exit_code': syntax_status, 'cases': results}
      Path('report.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
      lines = ['# Alertmanager routing gate', '', f'Passed: {passed}',
               f'Configuration SHA256: {report["config_sha256"]}', f'Syntax exit code: {syntax_status}', '']
      lines.extend(json.dumps({'case': r['name'], 'exit_code': r['exit_code']}) for r in results)
      Path('report.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
      print('::' + json.dumps({'outputs': {'passed': passed, 'cases_checked': len(results)}}) + '::')
    inputFiles:
      config.yml: "{{ outputs.prepare.outputFiles['config.yml'] }}"
      cases.json: "{{ outputs.prepare.outputFiles['cases.json'] }}"
      syntax.status: "{{ outputs.check_syntax.outputFiles['syntax.status'] }}"
      syntax.txt: "{{ outputs.check_syntax.outputFiles['syntax.txt'] }}"
      results.b64: "{{ outputs.each_case.outputs | toJson | base64encode }}"
  - id: enforce_gate
    type: io.kestra.plugin.core.execution.Assert
    conditions:
      - '{{ outputs.report.vars.passed }}'
  - id: release_bundle
    type: io.kestra.plugin.scripts.python.Script
    timeout: PT1M
    description: Package the exact checked configuration only after syntax and all routing cases pass.
    containerImage: "{{ vars.python_image }}"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    outputFiles:
      - approved-config.tar.gz
    script: |
      import tarfile

      with tarfile.open('approved-config.tar.gz', 'w:gz') as archive:
          for name in ['config.yml', 'cases.json', 'report.json', 'report.md']:
              archive.add(name, arcname=name)
    inputFiles:
      config.yml: "{{ outputs.prepare.outputFiles['config.yml'] }}"
      cases.json: "{{ outputs.prepare.outputFiles['cases.json'] }}"
      report.json: "{{ outputs.report.outputFiles['report.json'] }}"
      report.md: "{{ outputs.report.outputFiles['report.md'] }}"
triggers:
  - id: nightly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: 0 5 * * *
    disabled: true
outputs:
  - id: report
    type: FILE
    required: false
    value: "{{ outputs.report.outputFiles['report.json'] ?? null }}"
  - id: approved_bundle
    type: FILE
    required: false
    value: "{{ outputs.release_bundle.outputFiles['approved-config.tar.gz'] ?? null }}"
extend:
  title: Gate Alertmanager Configuration Releases on Receiver Routing Tests
  metaTitle: Alertmanager Receiver Routing Regression Gate | Kestra
  shortDescription: Check configuration syntax and expected receiver routes with real amtool commands. Retain failure
    evidence and release a bundle only when every case passes.
  metaDescription: Test Alertmanager receiver routing with amtool, retain per-case evidence, and release the checked
    configuration only after every expectation passes.
  description: |
    Valid YAML can still send a critical alert to the wrong team. Test a candidate Alertmanager configuration against explicit receiver expectations before releasing it.

    ## How it works
    1. A manual run or disabled nightly Schedule accepts `config_yaml` and JSON `cases`.
    2. Python validates bounded inputs and prepares quoted commands and stored input files.
    3. Pinned amtool checks syntax. A sequential Loop tests each label set against ordered receivers.
    4. Python saves JSON, Markdown and raw tool output before Assert enforces the verdict.
    5. A passing run packages the exact configuration, cases and reports. Nothing is deployed.

    ## What you get
    - JSON evidence at `outputs.report.outputFiles['report.json']`, Markdown alongside it, and raw syntax/case logs, including on verdict failure.
    - A passing artifact at `outputs.release_bundle.outputFiles['approved-config.tar.gz']`, with a configuration SHA256.
    - Detection of wrong fallback routes, matcher changes and unexpected multi-receiver fanout.

    ## Who it's for
    SRE and platform teams reviewing Alertmanager routing changes.

    ## Why orchestrate this with Kestra
    Each case is a visible task run. Reports survive a failed gate, while downstream artifact publication requires a successful assertion.

    ## Prerequisites
    Docker-capable workers and the Python/Shell plugins. The images are digest-pinned. The configuration must be self-contained; referenced templates and credential files are not mounted. This checks routing, not notification delivery, grouping, inhibition or time-based notification suppression. Configuration and case artifacts may contain sensitive operational data.

    ### Secrets
    None. The default receiver definitions send no notifications.

    ## Quick start
    1. Import the flow and execute its working defaults.
    2. Replace `config_yaml` (1-65536 UTF-8 bytes) and `cases` (at most 256 KiB, 1-100 objects with unique `name`, `labels`, ordered `receivers`). Use ASCII label names and nonempty receiver names without commas.
    3. Change an expected receiver and confirm failure with retained reports and no approved bundle.
    4. For recurring tests, update the defaults before enabling the disabled schedule. CI can execute the flow through the Kestra execution API.

    ## How to extend
    Add cases for each team's routes or upload the passing artifact to your deployment store. Keep deployment downstream of success and match amtool's version to your Alertmanager release.

    ## Links
    - [Alertmanager routing CLI](https://github.com/prometheus/alertmanager/blob/v0.28.1/cli/test_routing.go)
    - [Shell Commands](https://kestra.io/plugins/plugin-script-shell/io.kestra.plugin.scripts.shell.commands)
    - [Python Script](https://kestra.io/plugins/plugin-script-python/io.kestra.plugin.scripts.python.script)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - CI/CD & Deployment
  ee: false
  demo: false
