id: influxdb-task-consecutive-failure-sentinel
namespace: company.team
description: |
  Probes InfluxDB v2 task run logs via the REST API to flag consecutive
  execution failures on mission-critical Flux aggregation pipelines.

inputs:
  - id: influx_url
    type: STRING
    defaults: "http://influxdb.internal:8086"
    description: Base URL of the InfluxDB v2 server.
  - id: org_name
    type: STRING
    defaults: "kestra-org"
    description: InfluxDB organization name.
  - id: max_failed_runs_threshold
    type: INT
    defaults: 0
    description: Maximum acceptable failed downsampling task runs.

triggers:
  - id: scheduled_monitor
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true

tasks:
  - id: audit_influxdb_tasks
    type: io.kestra.plugin.scripts.python.Script
    description: Inspects InfluxDB v2 downsampling tasks and detects consecutive failures.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests
    env:
      INFLUX_URL: "{{ inputs.influx_url }}"
      ORG_NAME: "{{ inputs.org_name }}"
      INFLUX_TOKEN: "{{ secret('INFLUX_TOKEN') }}"
    outputFiles:
      - influx_task_status.json
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      influx_url = os.environ.get("INFLUX_URL", "http://influxdb.internal:8086").rstrip("/")
      org_name = os.environ.get("ORG_NAME", "kestra-org")
      token = os.environ.get("INFLUX_TOKEN", "")

      headers = {
          "Authorization": f"Token {token}",
          "Content-Type": "application/json"
      }

      print(f"Querying InfluxDB tasks for org: {org_name} at {influx_url}...")
      try:
          resp = requests.get(f"{influx_url}/api/v2/tasks?org={org_name}", headers=headers, timeout=20)
          resp.raise_for_status()
          tasks_data = resp.json().get("tasks", [])
      except Exception as exc:
          print(f"ERROR: Failed to retrieve InfluxDB tasks: {exc}", file=sys.stderr)
          sys.exit(1)

      failing_tasks = []
      for task in tasks_data:
          task_id = task.get("id")
          task_name = task.get("name", task_id)
          try:
              run_resp = requests.get(f"{influx_url}/api/v2/tasks/{task_id}/runs?limit=1", headers=headers, timeout=15)
              run_resp.raise_for_status()
              runs = run_resp.json()
              latest_status = runs[0].get("status") if runs else "unknown"
              if latest_status == "failed":
                  failing_tasks.append({
                      "task_id": task_id,
                      "name": task_name,
                      "status": latest_status,
                      "error": runs[0].get("errorMessage", "Execution failed")
                  })
          except Exception as exc:
              print(f"Warning: Failed to fetch runs for task {task_id}: {exc}")

      result = {
          "total_tasks": len(tasks_data),
          "failed_tasks_count": len(failing_tasks),
          "failing_tasks": failing_tasks
      }

      with open("influx_task_status.json", "w", encoding="utf-8") as f:
          json.dump(result, f, indent=2)

      print(f"InfluxDB audit complete: {len(tasks_data)} total tasks, {len(failing_tasks)} failing tasks.")
      Kestra.outputs({
          "failed_tasks_count": len(failing_tasks),
          "failing_tasks": failing_tasks,
          "total_tasks": len(tasks_data)
      })

  - id: evaluate_and_alert
    type: io.kestra.plugin.core.flow.If
    description: Dispatches Slack alert if failing downsampling tasks exceed threshold.
    condition: "{{ outputs.audit_influxdb_tasks.vars.failed_tasks_count > inputs.max_failed_runs_threshold }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": "❌ *InfluxDB Downsampling Task Failures Detected*\n*Endpoint:* `{{ inputs.influx_url }}`\n*Org:* `{{ inputs.org_name }}`\n*Failing Tasks Count:* {{ outputs.audit_influxdb_tasks.vars.failed_tasks_count }}\n*Failing Tasks Details:* {{ outputs.audit_influxdb_tasks.vars.failing_tasks | toJson }}\n*Action:* Inspect Flux query memory limits and invalid schema references."
          }

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "🚨 *InfluxDB Task Sentinel Pipeline Failure*: Execution {{ execution.id }} in flow {{ flow.id }} failed."
      }

outputs:
  - id: failed_tasks_count
    type: INT
    value: "{{ outputs.audit_influxdb_tasks.vars.failed_tasks_count }}"
  - id: failing_tasks
    type: JSON
    value: "{{ outputs.audit_influxdb_tasks.vars.failing_tasks }}"

extend:
  title: InfluxDB Continuous Downsampling Task Failure Sentinel
  shortDescription: Probes InfluxDB v2 task run logs via the REST API to flag consecutive execution failures on mission-critical Flux aggregation pipelines.
  metaTitle: InfluxDB Continuous Downsampling Task Failure Sentinel with Kestra
  metaDescription: Probes InfluxDB v2 task run logs via the REST API to flag consecutive execution failures on mission-critical Flux aggregation pipelines.
  description: |
    Continuous operational health sentinel for InfluxDB v2 tasks.
    Queries the InfluxDB REST API to inspect scheduled Flux downsampling tasks and detect
    consecutive failures, alerting Slack when failures exceed acceptable thresholds.
  tags:
    - Data
    - Cloud
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
