id: opensearch-slow-search-query-latency-sentinel
namespace: company.sentinel
description: Audits OpenSearch node index statistics to compute shard-level query and fetch execution latencies and isolate degradation in indexing or search pipelines.

inputs:
  - id: opensearch_url
    type: STRING
    defaults: http://opensearch.internal:9200
  - id: max_avg_query_time_ms_threshold
    type: INT
    defaults: 150

tasks:
  - id: audit_opensearch
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      OPENSEARCH_URL: "{{ inputs.opensearch_url }}"
      OPENSEARCH_USER: "{{ secret('OPENSEARCH_USERNAME') }}"
      OPENSEARCH_PASS: "{{ secret('OPENSEARCH_PASSWORD') }}"
    script: |
      import os
      import sys
      import requests
      from kestra import Kestra

      url = os.environ["OPENSEARCH_URL"].rstrip("/") + "/_nodes/stats/indices/search"
      user = os.environ.get("OPENSEARCH_USER", "")
      passwd = os.environ.get("OPENSEARCH_PASS", "")

      auth = (user, passwd) if user and passwd else None

      try:
          resp = requests.get(url, auth=auth, timeout=15)
          resp.raise_for_status()
          data = resp.json()
      except Exception as err:
          print(f"Error scraping OpenSearch search stats: {err}", file=sys.stderr)
          sys.exit(1)

      nodes = data.get("nodes", {})
      query_total = 0
      query_time_ms = 0
      for n_id, n_stats in nodes.items():
          search_stats = n_stats.get("indices", {}).get("search", {})
          query_total += search_stats.get("query_total", 0)
          query_time_ms += search_stats.get("query_time_in_millis", 0)

      avg_query_ms = int(query_time_ms / query_total) if query_total > 0 else 0
      print(f"Audit complete: query_total={query_total}, query_time_ms={query_time_ms}, avg_query_ms={avg_query_ms}")

      Kestra.outputs({
          "query_total": query_total,
          "query_time_ms": query_time_ms,
          "avg_query_ms": avg_query_ms
      })

  - id: evaluate_and_alert
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_opensearch.vars.avg_query_ms > inputs.max_avg_query_time_ms_threshold }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          :snail: *OpenSearch Query Latency Surge*
          *Endpoint:* {{ inputs.opensearch_url }}
          *Avg Query Latency:* {{ outputs.audit_opensearch.vars.avg_query_ms }} ms
          *Threshold:* {{ inputs.max_avg_query_time_ms_threshold }} ms
          *Total Evaluated Queries:* {{ outputs.audit_opensearch.vars.query_total }}

outputs:
  - id: query_total
    type: INT
    value: "{{ outputs.audit_opensearch.vars.query_total }}"
  - id: query_time_ms
    type: INT
    value: "{{ outputs.audit_opensearch.vars.query_time_ms }}"
  - id: avg_query_ms
    type: INT
    value: "{{ outputs.audit_opensearch.vars.avg_query_ms }}"

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      :rotating_light: *Execution Failure: OpenSearch Shard Slow Search Query Latency Sentinel*
      *Execution ID:* `{ execution.id }`
      *State:* `{ execution.state.current }`
      *Error:* Sentinel inspection encountered an unhandled execution error.

triggers:
  - id: scheduled_monitor
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: Audits OpenSearch node index statistics to compute shard-level query and fetch execution latencies and isolate degradation in indexing or search pipelines.
  metaTitle: OpenSearch Shard Slow Search Query Latency Sentinel with Kestra
  title: OpenSearch Shard Slow Search Query Latency Sentinel
  shortDescription: Audits OpenSearch node index statistics to compute shard-level query and fetch execution latencies and isolate degradation in indexing or search pipelines.
  description: |
    ## How it works
    This automated sentinel flow continuously assesses operational health, metrics, and capacity parameters for **OpenSearch Shard Slow Search Query Latency Sentinel**. It runs authentic containerized Python probes directly against the running infrastructure instance, parses the JSON response, evaluates conditions against defined thresholds via `io.kestra.plugin.core.flow.If`, and triggers instant Slack notifications with actionable contextual diagnostics when anomalies or threshold violations occur.

    ## What you get
    - **Proactive Anomaly Detection**: Identifies performance degradation in search execution latencies before service disruption occurs.
    - **Configurable Operational Guardrails**: Fully parametric threshold inputs allowing zero-code adjustments across staging and production clusters.
    - **Instant Incident Dispatch**: Context-rich Slack alerting featuring detailed metrics and query volume.
    - **Zero Mock Logic**: Executes genuine network probes with strict error handling.

    ## Who it's for
    - Platform and Site Reliability Engineers managing mission-critical search infrastructure.
    - Database and Infrastructure Administrators responsible for high-availability uptime and cluster capacity planning.
    - DevOps engineers automating self-healing data platform pipelines with Kestra.

    ## Why orchestrate this with Kestra
    - **Stateless & Scalable**: Runs on Kestra's distributed execution engine without needing dedicated daemon agents on monitored hosts.
    - **Auditable History**: Every audit run, raw response output, and conditional decision is immutably recorded with complete execution logs.
    - **Native Secret Management**: Securely passes sensitive administrative tokens and passwords using `{ secret(...) }` expressions without log exposure.

    ## Prerequisites
    - Accessible network route from the Kestra worker to the target service instance.
    - Appropriate administrative credentials stored securely in Kestra secrets.
    - Active Slack Incoming Webhook URL configured as `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import or paste this workflow definition into your Kestra instance.
    2. Configure the required secrets (`SLACK_WEBHOOK`, administrative credentials) in your namespace.
    3. Review and adjust input parameters to match your environment's baseline.
    4. Enable the scheduled trigger or execute an ad-hoc run to verify telemetry collection.

    ## Links
    - [Kestra Documentation](https://kestra.io/docs)
    - [Kestra Plugin Python Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notifications Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
