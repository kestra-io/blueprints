id: nat-gateway-idle-finder
namespace: company.finops

description: |
  Finds idle NAT Gateways burning money. A NAT Gateway costs ~$32.40/month even
  at zero traffic, and orphaned ones pile up silently after subnets or
  environments get deleted. This flow checks 7 days of CloudWatch traffic per
  gateway across your regions and reports the idle ones with estimated savings.

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to audit for idle NAT Gateways.
  - id: idle_threshold_bytes
    type: INT
    defaults: 1048576
    description: Gateways moving fewer bytes than this in 7 days count as idle (default 1 MB).
  - id: monthly_cost_usd
    type: STRING
    defaults: "32.40"
    description: Monthly cost of one NAT Gateway in USD (AWS list price $0.045/hr).

tasks:
  - id: check_traffic
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit NAT Gateways region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: List NAT Gateways and check 7-day CloudWatch traffic per gateway.
        commands:
          - |
            REGION="{{ taskrun.value }}"
            THRESHOLD={{ inputs.idle_threshold_bytes }}
            PRICE="{{ inputs.monthly_cost_usd }}"
            END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            START=$(date -u -d "7 days ago" +%Y-%m-%dT%H:%M:%SZ)
            echo "Checking NAT gateways in $REGION (traffic window: last 7 days)"
            aws ec2 describe-nat-gateways --region "$REGION" \
              --filter Name=state,Values=available \
              --query 'NatGateways[].NatGatewayId' --output text > /tmp/gw.txt
            IDLE_COUNT=0
            IDLE_LIST=""
            for GW in $(cat /tmp/gw.txt); do
              BYTES=$(aws cloudwatch get-metric-statistics --region "$REGION" \
                --namespace AWS/NATGateway \
                --metric-name BytesOutToDestination \
                --dimensions Name=NatGatewayId,Value="$GW" \
                --start-time "$START" --end-time "$END" \
                --period 604800 --statistics Sum \
                --query 'Datapoints[0].Sum' --output text 2>/dev/null)
              case "$BYTES" in ''|'None') BYTES=0;; esac
              BYTES_INT=${BYTES%.*}
              echo "gateway $GW: ${BYTES_INT} bytes out in 7d"
              if [ "$BYTES_INT" -lt "$THRESHOLD" ]; then
                IDLE_LIST="${IDLE_LIST}${GW} (${BYTES_INT}B), "
                IDLE_COUNT=$((IDLE_COUNT + 1))
              fi
            done
            SAVINGS=$(python3 -c "print('{:.2f}'.format($IDLE_COUNT * float('$PRICE')))")
            if [ "$IDLE_COUNT" -gt 0 ]; then HAS_IDLE=true; else HAS_IDLE=false; fi
            echo "HAS_IDLE=$HAS_IDLE"
            echo "IDLE_COUNT=$IDLE_COUNT"
            echo "IDLE_GATEWAYS=$IDLE_LIST"
            echo "EST_MONTHLY_SAVINGS=$SAVINGS"
            echo "REGION_DONE=$REGION"
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ taskrun.value }}"
      - id: notify_region
        type: io.kestra.plugin.core.flow.If
        description: Alert on idle gateways, stay quiet when everything is busy.
        condition: "{{ outputs.audit_region.vars.HAS_IDLE == 'true' }}"
        then:
          - id: slack_idle
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":money_with_wings: NAT Gateway idle check `{{ outputs.audit_region.vars.REGION_DONE }}` — *{{ outputs.audit_region.vars.IDLE_COUNT }}* idle gateway(s), ~${{ outputs.audit_region.vars.EST_MONTHLY_SAVINGS }}/mo waste.\n`{{ outputs.audit_region.vars.IDLE_GATEWAYS }}`\nDelete them in the VPC console (check route tables still pointing at them first!)."
              }
        else:
          - id: log_busy
            type: io.kestra.plugin.core.log.Log
            message: "No idle NAT gateways in {{ outputs.audit_region.vars.REGION_DONE }} — every gateway moved traffic in the last 7 days."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Sunday at 02:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 2 * * 0"
    disabled: true

extend:
  title: NAT Gateway Idle Finder
  metaTitle: Find Idle NAT Gateways Wasting Money | Kestra
  shortDescription: Audit NAT Gateways across regions, check 7 days of CloudWatch traffic per gateway, and get a Slack report of idle ones with estimated monthly savings.
  metaDescription: NAT Gateways cost ~$32/mo even idle. This flow finds the idle ones via CloudWatch and reports the waste weekly.
  description: |
    A NAT Gateway costs $0.045/hour — about $32.40/month — whether it moves a terabyte or zero bytes. Every deleted test environment, every reworked subnet leaves a NAT Gateway behind, and nobody notices because there's no alarm for "expensive thing doing nothing." This blueprint finds them with real traffic data.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 02:00 UTC (shipped disabled).
    2. A ForEach loop audits each region in `aws_regions`.
    3. Per region, the flow lists available NAT Gateways, then pulls 7 days of the `BytesOutToDestination` CloudWatch metric per gateway.
    4. Gateways under `idle_threshold_bytes` (default 1 MB/week) are flagged idle, and monthly waste is estimated at the NAT Gateway list price.
    5. An `If` task posts a Slack alert with the idle gateway IDs and savings only when something is actually idle — no spam on clean weeks.

    ## What you get

    - A weekly list of NAT Gateways doing (almost) nothing, with per-gateway byte counts as evidence.
    - A dollar estimate of the waste, so the cleanup gets prioritized.
    - Multi-region coverage in one run.
    - Silence when everything is busy — alerts only on real findings.

    ## Who it's for

    Platform engineers and FinOps-minded teams who have ever deleted a subnet and forgotten the NAT Gateway behind it (everyone).

    ## Why orchestrate this with Kestra

    A one-off CLI session finds today's waste and is forgotten by next month. As a scheduled Kestra flow the audit runs itself, the idle threshold is an input anyone can tune, every run is logged for audit, and adding a region is one list entry — not a new script.

    ## Prerequisites

    - AWS credentials with `ec2:DescribeNatGateways` and `cloudwatch:GetMetricStatistics` permissions.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the EC2 and CloudWatch API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the EC2 and CloudWatch API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the idle-gateway alert.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` to the regions you run VPCs in.
    3. Run manually once and review the Slack report (or the clean log line).
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Also check `BytesInToSource` for gateways that only receive but never send.
    - Exclude gateways tagged `Keep=true` for known standby setups.
    - Auto-remove route-table references before deleting, for a full cleanup flow.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [NAT Gateway pricing](https://aws.amazon.com/vpc/pricing/)
    - [CloudWatch get-metric-statistics API](https://docs.aws.amazon.com/cli/latest/reference/cloudwatch/get-metric-statistics.html)
  tags:
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Monitoring & Alerting
  ee: false
  demo: false
