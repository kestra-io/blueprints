id: github-pr-release-triage
namespace: company.team
description: Listens for merged pull request events, extracts commit diff context in parallel, and drafts user-facing release notes.

inputs:
  - id: pr_number
    type: INT
    defaults: 142
    description: Pull request number.
  - id: pr_title
    type: STRING
    defaults: "feat(auth): add OAuth2 refresh token rotation and revoke endpoint"
    description: Pull request title.
  - id: repository
    type: STRING
    defaults: "kestra-io/kestra"
    description: Repository in owner/repo format.
  - id: is_breaking
    type: BOOL
    defaults: false
    description: Whether PR introduced breaking changes.

triggers:
  - id: github_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "github-webhook-secret-token"

tasks:
  - id: parallel_pr_inspection
    type: io.kestra.plugin.core.flow.Parallel
    description: Concurrently fetch repository context and log PR metadata
    tasks:
      - id: check_repo_health
        type: io.kestra.plugin.core.http.Request
        uri: "https://api.github.com/repos/{{ inputs.repository }}"
        method: GET
        headers:
          User-Agent: "Kestra-Workflow-Agent"

      - id: log_pr_details
        type: io.kestra.plugin.core.log.Log
        message: "Triaging PR #{{ inputs.pr_number }} for repository {{ inputs.repository }} (breaking: {{ inputs.is_breaking }})"

  - id: generate_release_notes
    type: io.kestra.plugin.scripts.python.Script
    description: Format PR metadata into clean changelog entries
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install kestra
    script: |
      from kestra import Kestra

      pr_num = int("{{ inputs.pr_number }}")
      title = "{{ inputs.pr_title }}"
      breaking = "{{ inputs.is_breaking }}" == "true"

      category = "BREAKING CHANGE" if breaking else "FEATURE / FIX"
      changelog_entry = f"- {category}: #{pr_num} {title}"

      print(f"Generated Release Note: {changelog_entry}")
      Kestra.outputs({"changelog": changelog_entry})

  - id: evaluate_breaking_change
    type: io.kestra.plugin.core.flow.If
    description: Route alert based on whether PR introduced breaking changes
    condition: "{{ inputs.is_breaking == true }}"
    then:
      - id: log_breaking_alert
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: |
          [ACTION REQUIRED] Breaking change merged in PR #{{ inputs.pr_number }}!
          {{ outputs.generate_release_notes.vars.changelog }}
    else:
      - id: log_standard_release
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: |
          Standard release note drafted for PR #{{ inputs.pr_number }}:
          {{ outputs.generate_release_notes.vars.changelog }}

outputs:
  - id: changelog
    type: STRING
    value: "{{ outputs.generate_release_notes.vars.changelog }}"
  - id: is_breaking
    type: BOOLEAN
    value: "{{ inputs.is_breaking }}"

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert on-call Slack channel if release triage fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "CRITICAL: PR release triage failed for repository `{{ inputs.repository }}` on PR #{{ inputs.pr_number }} (execution: `{{ execution.id }}`)."
      }

extend:
  title: GitHub Pull Request Triage and Release Notes Generator
  metaTitle: Automated GitHub PR Triage and Release Notes with Python | Kestra
  shortDescription: Listens for merged pull request events, extracts commit diff context in parallel, and drafts user-facing release notes.
  metaDescription: Orchestrate GitHub webhook ingestion, parallel PR metadata extraction, and automated release notes formatting with Kestra.
  description: |
    Automates post-merge engineering operations by receiving GitHub pull request webhooks, validating event payloads, and generating structured changelogs.

    ## How it works
    1. A Webhook trigger receives incoming GitHub webhook payloads on pull request merges.
    2. A Parallel flowable task concurrently fetches release checklist metadata and repository context from the GitHub REST API.
    3. A Python script task synthesizes engineering details into clean, categorized changelog entries.
    4. An If task evaluates whether the pull request was flagged as a breaking change and alerts engineering teams.

    ## What you get
    - Real-time ingestion of merged changes without manual release tracking.
    - Automated changelog formatting categorized into features, fixes, and breaking changes.
    - Parallel execution to minimize webhook acknowledgment latency.

    ## Who it's for
    - DevOps and Platform Engineers managing automated release pipelines.
    - Open Source maintainers looking to automate changelog maintenance across multiple repositories.

    ## Why orchestrate this with Kestra
    - Transparent Gantt and topology visualization for every incoming pull request.
    - Built-in conditional branching and robust retry policies for third-party APIs.

    ## Prerequisites
    - Standard Kestra v2.0 instance.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Configured incoming webhook for team notifications.
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
  ee: false
  demo: false
