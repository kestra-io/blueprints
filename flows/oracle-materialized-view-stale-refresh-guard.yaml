id: oracle-materialized-view-stale-refresh-guard
namespace: company.team

description: |
  Find Oracle materialized views on REFRESH ON DEMAND that are no longer fresh, compile
  the ones whose freshness Oracle cannot even determine, refresh the ones that are really
  stale with DBMS_MVIEW.REFRESH behind a dry run plus an approval pause, then read
  dba_mviews again and fail if a target did not actually refresh.

inputs:
  - id: jdbc_url
    type: STRING
    displayName: Oracle JDBC URL
    defaults: "jdbc:oracle:thin:@//localhost:1521/FREEPDB1"

  - id: username
    type: STRING
    displayName: Database user
    description: A user that can read dba_mviews (SELECT_CATALOG_ROLE or SELECT ANY DICTIONARY). Compiling or refreshing another schema's materialized view needs ALTER ANY MATERIALIZED VIEW. A DBA role covers both.
    defaults: SYSTEM

  - id: password
    type: STRING
    displayName: Database password
    defaults: "{{ secret('ORACLE_PASSWORD') }}"

  - id: mview_owners
    type: ARRAY
    itemType: STRING
    displayName: Schema owners to check
    description: Application schemas whose materialized views are checked. System schemas are left out so an internal view is never touched.
    defaults:
      - APP

  - id: max_age_hours
    type: FLOAT
    displayName: Maximum hours since the last refresh
    description: A view that reads FRESH but was last refreshed longer ago than this is also treated as a target. Set it to the freshness your reports promise. 0 reports every on demand view.
    defaults: 24.0

  - id: refresh_method
    type: SELECT
    displayName: DBMS_MVIEW.REFRESH method code
    description: C is a complete rebuild and always works. F is a fast refresh and needs a materialized view log on every base table, so it fails with ORA-23413 without one. ? is force, which tries fast then falls back to complete. A refreshes all, which for one view behaves like complete.
    values:
      - C
      - F
      - "?"
      - A
    defaults: C

  - id: atomic_refresh
    type: BOOL
    displayName: Atomic refresh
    description: True keeps the view queryable for the whole refresh because the delete plus insert runs in one transaction. False lets Oracle truncate then direct path load, which is much faster but leaves the view empty to readers until it finishes.
    defaults: true

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    description: Allow ALTER MATERIALIZED VIEW COMPILE and DBMS_MVIEW.REFRESH to run. Off by default.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, for any change to run.
    defaults: true

variables:
  audit_sql: |
    SELECT m.owner AS owner,
           m.mview_name AS mview_name,
           NVL(m.staleness, 'UNKNOWN') AS staleness,
           NVL(m.compile_state, 'UNKNOWN') AS compile_state,
           m.refresh_method AS declared_method,
           m.fast_refreshable AS fast_refreshable,
           NVL(m.last_refresh_type, 'NONE') AS last_refresh_type,
           NVL(TO_CHAR(m.last_refresh_date, 'YYYY-MM-DD HH24:MI:SS'), 'never') AS last_refresh_date,
           NVL(TO_CHAR(m.stale_since, 'YYYY-MM-DD HH24:MI:SS'), 'none') AS stale_since,
           NVL(ROUND((SYSDATE - m.last_refresh_date) * 24, 4), -1) AS hours_since_refresh,
           CASE
             WHEN NVL(m.staleness, 'UNKNOWN') = 'NEEDS_COMPILE' THEN 'COMPILE'
             WHEN NVL(m.staleness, 'UNKNOWN') IN ('UNUSABLE', 'COMPILATION_ERROR', 'ERROR') THEN 'REPORT_ONLY'
             WHEN NVL(m.staleness, 'UNKNOWN') = 'FRESH' THEN 'REFRESH_BY_AGE'
             ELSE 'REFRESH'
           END AS action,
           'BEGIN DBMS_MVIEW.REFRESH(list => ''' || m.owner || '.' || m.mview_name
             || ''', method => ''{{ inputs.refresh_method }}'', atomic_refresh => '
             || '{{ inputs.atomic_refresh ? "TRUE" : "FALSE" }}' || '); END;' AS fix_sql,
           'ALTER MATERIALIZED VIEW "' || m.owner || '"."' || m.mview_name || '" COMPILE' AS compile_sql
      FROM dba_mviews m
     WHERE m.owner IN ('{{ inputs.mview_owners | jq('map(ascii_upcase | gsub("\u0027"; "\u0027\u0027")) | join("\u0027,\u0027")') | first }}')
       AND m.refresh_mode = 'DEMAND'
       AND ( NVL(m.staleness, 'UNKNOWN') <> 'FRESH'
             OR m.last_refresh_date IS NULL
             OR (SYSDATE - m.last_refresh_date) * 24 >= {{ inputs.max_age_hours }} )
     ORDER BY m.owner, m.mview_name

  totals_sql: |
    SELECT COUNT(*) AS mview_count,
           NVL(SUM(CASE WHEN m.staleness = 'FRESH' THEN 1 ELSE 0 END), 0) AS fresh_count,
           NVL(SUM(CASE WHEN m.staleness = 'STALE' THEN 1 ELSE 0 END), 0) AS stale_count,
           NVL(SUM(CASE WHEN m.staleness = 'NEEDS_COMPILE' THEN 1 ELSE 0 END), 0) AS needs_compile_count,
           NVL(SUM(CASE WHEN m.staleness IN ('UNUSABLE', 'COMPILATION_ERROR', 'ERROR') THEN 1 ELSE 0 END), 0) AS broken_count,
           NVL(SUM(CASE WHEN NVL(m.staleness, 'UNKNOWN') NOT IN ('FRESH', 'STALE', 'NEEDS_COMPILE', 'UNUSABLE', 'COMPILATION_ERROR', 'ERROR') THEN 1 ELSE 0 END), 0) AS other_count,
           NVL(TO_CHAR(MIN(m.last_refresh_date), 'YYYY-MM-DD HH24:MI:SS'), 'never') AS oldest_refresh
      FROM dba_mviews m
     WHERE m.owner IN ('{{ inputs.mview_owners | jq('map(ascii_upcase | gsub("\u0027"; "\u0027\u0027")) | join("\u0027,\u0027")') | first }}')
       AND m.refresh_mode = 'DEMAND'

  compile_check_sql: |
    SELECT m.owner AS owner,
           m.mview_name AS mview_name,
           NVL(m.staleness, 'UNKNOWN') AS staleness,
           NVL(m.compile_state, 'UNKNOWN') AS compile_state
      FROM dba_mviews m
     WHERE INSTR(',{{ outputs.targets.values.compile_names }},', ',' || m.owner || '.' || m.mview_name || ',') > 0
       AND ( NVL(m.staleness, 'UNKNOWN') = 'NEEDS_COMPILE'
             OR NVL(m.compile_state, 'UNKNOWN') IN ('NEEDS_COMPILE', 'ERROR', 'COMPILATION_ERROR') )
     ORDER BY m.owner, m.mview_name

  reverify_sql: |
    SELECT m.owner AS owner,
           m.mview_name AS mview_name,
           NVL(m.staleness, 'UNKNOWN') AS staleness,
           NVL(TO_CHAR(m.last_refresh_date, 'YYYY-MM-DD HH24:MI:SS'), 'never') AS last_refresh_date,
           CASE
             WHEN m.last_refresh_date IS NULL THEN 'never refreshed'
             WHEN m.last_refresh_date < TO_DATE('{{ outputs.mark_time.row.DB_CLOCK }}', 'YYYY-MM-DD HH24:MI:SS') THEN 'refresh did not run'
             ELSE 'refreshed but staleness is ' || NVL(m.staleness, 'UNKNOWN')
           END AS reason
      FROM dba_mviews m
     WHERE INSTR(',{{ outputs.resolved_targets.values.name_list }},', ',' || m.owner || '.' || m.mview_name || ',') > 0
       AND ( NVL(m.staleness, 'UNKNOWN') <> 'FRESH'
             OR m.last_refresh_date IS NULL
             OR m.last_refresh_date < TO_DATE('{{ outputs.mark_time.row.DB_CLOCK }}', 'YYYY-MM-DD HH24:MI:SS') )
     ORDER BY m.owner, m.mview_name

tasks:
  - id: totals_before
    type: io.kestra.plugin.jdbc.oracle.Query
    description: Read-only. How many on demand materialized views the checked schemas hold, split by staleness state, plus the oldest last refresh.
    url: "{{ inputs.jdbc_url }}"
    username: "{{ inputs.username }}"
    password: "{{ inputs.password }}"
    fetchType: FETCH_ONE
    sql: "{{ render(vars.totals_sql) }}"

  - id: audit
    type: io.kestra.plugin.jdbc.oracle.Query
    description: Read-only. Lists the on demand materialized views that are not FRESH or whose last refresh is past the age threshold, with the staleness value, the compile state, whether a fast refresh is possible at all plus the exact COMPILE and DBMS_MVIEW.REFRESH statements for each.
    url: "{{ inputs.jdbc_url }}"
    username: "{{ inputs.username }}"
    password: "{{ inputs.password }}"
    fetchType: FETCH
    sql: "{{ render(vars.audit_sql) }}"

  - id: targets
    type: io.kestra.plugin.core.output.OutputValues
    description: Split the findings by what the staleness value actually calls for. STALE, UNKNOWN, UNDEFINED plus aged FRESH views are refresh targets. NEEDS_COMPILE views are compile targets, because their freshness is not known yet. UNUSABLE views are reported only.
    values:
      refresh_sql: >-
        {{ outputs.audit.rows | jq('[.[] | select(.ACTION == "REFRESH" or .ACTION == "REFRESH_BY_AGE") | .FIX_SQL]') | first | toJson }}
      refresh_count: >-
        {{ outputs.audit.rows | jq('[.[] | select(.ACTION == "REFRESH" or .ACTION == "REFRESH_BY_AGE")] | length') | first }}
      refresh_detail: >-
        {{ outputs.audit.rows | jq('[.[] | select(.ACTION == "REFRESH" or .ACTION == "REFRESH_BY_AGE") | .OWNER + "." + .MVIEW_NAME + " [" + .STALENESS + ", " + .ACTION + ", last refresh " + .LAST_REFRESH_DATE + ", " + (.HOURS_SINCE_REFRESH | tostring) + "h ago, fast_refreshable " + .FAST_REFRESHABLE + "]"] | join("; ")') | first }}
      compile_sql: >-
        {{ outputs.audit.rows | jq('[.[] | select(.ACTION == "COMPILE") | .COMPILE_SQL]') | first | toJson }}
      compile_count: >-
        {{ outputs.audit.rows | jq('[.[] | select(.ACTION == "COMPILE")] | length') | first }}
      compile_names: >-
        {{ outputs.audit.rows | jq('[.[] | select(.ACTION == "COMPILE") | .OWNER + "." + .MVIEW_NAME] | (if length == 0 then ["__NO_TARGET__"] else . end) | join(",")') | first }}
      compile_detail: >-
        {{ outputs.audit.rows | jq('[.[] | select(.ACTION == "COMPILE") | .OWNER + "." + .MVIEW_NAME + " [compile_state " + .COMPILE_STATE + ", last refresh " + .LAST_REFRESH_DATE + "]"] | join("; ")') | first }}
      broken_count: >-
        {{ outputs.audit.rows | jq('[.[] | select(.ACTION == "REPORT_ONLY")] | length') | first }}
      broken_detail: >-
        {{ outputs.audit.rows | jq('[.[] | select(.ACTION == "REPORT_ONLY") | .OWNER + "." + .MVIEW_NAME + " [" + .STALENESS + ", last refresh type " + .LAST_REFRESH_TYPE + "]"] | join("; ")') | first }}

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      Oracle on demand materialized views on {{ inputs.jdbc_url }} for schemas {{ inputs.mview_owners | jq('map(ascii_upcase) | join(", ")') | first }}:
      {{ outputs.totals_before.row.MVIEW_COUNT }} total, {{ outputs.totals_before.row.FRESH_COUNT }} FRESH, {{ outputs.totals_before.row.STALE_COUNT }} STALE, {{ outputs.totals_before.row.NEEDS_COMPILE_COUNT }} NEEDS_COMPILE, {{ outputs.totals_before.row.BROKEN_COUNT }} broken, {{ outputs.totals_before.row.OTHER_COUNT }} in another state. Oldest last refresh {{ outputs.totals_before.row.OLDEST_REFRESH }}.
      {{ outputs.audit.size }} view(s) are outside the freshness policy of {{ inputs.max_age_hours }} hour(s):
      {{ outputs.targets.values.refresh_count }} refreshable now with method {{ inputs.refresh_method }} ({{ outputs.targets.values.refresh_detail }}),
      {{ outputs.targets.values.compile_count }} needing a COMPILE before their freshness is even known ({{ outputs.targets.values.compile_detail }}),
      {{ outputs.targets.values.broken_count }} broken or unusable and reported only ({{ outputs.targets.values.broken_detail }}).

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit.size > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'Oracle ' ~ inputs.jdbc_url ~ ': ' ~ outputs.audit.size ~ ' on demand materialized view(s) are outside the ' ~ inputs.max_age_hours ~ 'h freshness policy and may be answering queries from old rows. Stale, refreshable: ' ~ (outputs.targets.values.refresh_detail == '' ? 'none' : outputs.targets.values.refresh_detail) ~ '. Freshness unknown until compiled: ' ~ (outputs.targets.values.compile_detail == '' ? 'none' : outputs.targets.values.compile_detail) ~ '. Broken or unusable, reported only: ' ~ (outputs.targets.values.broken_detail == '' ? 'none' : outputs.targets.values.broken_detail) ~ '.' ~ (inputs.auto_remediate and not inputs.dry_run ? ' Compile plus refresh with method ' ~ inputs.refresh_method ~ ' is armed and waiting for approval.' : ' No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: state_route
        type: io.kestra.plugin.core.flow.If
        description: Route on the staleness value. NEEDS_COMPILE and UNUSABLE are not data staleness, so neither is handed straight to DBMS_MVIEW.REFRESH.
        condition: "{{ (outputs.targets.values.compile_count | number) + (outputs.targets.values.broken_count | number) > 0 }}"
        then:
          - id: state_explained
            type: io.kestra.plugin.core.log.Log
            level: WARN
            message: >-
              {{ outputs.targets.values.compile_count }} view(s) read NEEDS_COMPILE, which is not the same as STALE: Oracle marks a view NEEDS_COMPILE after any base object change it cannot track incrementally. Until ALTER MATERIALIZED VIEW COMPILE runs, dba_mviews cannot say whether the data moved at all ({{ outputs.targets.values.compile_detail }}).
              A COMPILE is metadata only. It touches no rows and it resolves the state to STALE or FRESH. If it errors instead, the base change broke the definition, which a blind refresh would have hidden behind a long outage. So this flow compiles first, re-reads, then refreshes only what is really stale.
              {{ outputs.targets.values.broken_count }} view(s) read UNUSABLE, COMPILATION_ERROR or ERROR ({{ outputs.targets.values.broken_detail }}). Those are not data staleness at all. COMPILATION_ERROR is what a view reads once a compile has already been tried and the definition no longer holds, which happens when a base column the view selects was dropped or retyped. UNUSABLE usually follows a refresh that was interrupted with atomic_refresh set to false. Both are reported here rather than refreshed, because the fix is a definition change or a rebuild, not more data.
        else:
          - id: state_clean
            type: io.kestra.plugin.core.log.Log
            message: "Every finding is plain data staleness. No view in the checked schemas is NEEDS_COMPILE or UNUSABLE, so DBMS_MVIEW.REFRESH is the right verb for all of them."

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run and (outputs.targets.values.refresh_count | number) + (outputs.targets.values.compile_count | number) > 0 }}"
        then:
          - id: approval_gate
            type: io.kestra.plugin.core.flow.Pause
            description: Hold the run until a human approves. A complete refresh rereads every base row, writes the whole container table again plus can run for hours on a large view, so it never starts on its own.
            pauseDuration: PT2H
            behavior: FAIL
            onResume:
              - id: approved
                type: BOOL
                defaults: false
                description: Set true to compile the undetermined views then refresh the stale ones with the chosen method. Anything else leaves every view as it is.

          - id: apply
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.approval_gate.onResume.approved ?? false }}"
            then:
              - id: mark_time
                type: io.kestra.plugin.jdbc.oracle.Query
                description: Read the database clock before any change, so the re-read can require a last_refresh_date at or after this moment. That proves the refresh ran rather than trusting a FRESH flag.
                url: "{{ inputs.jdbc_url }}"
                username: "{{ inputs.username }}"
                password: "{{ inputs.password }}"
                fetchType: FETCH_ONE
                sql: "SELECT TO_CHAR(SYSDATE, 'YYYY-MM-DD HH24:MI:SS') AS db_clock FROM dual"

              - id: compile_stage
                type: io.kestra.plugin.core.flow.If
                condition: "{{ (outputs.targets.values.compile_count | number) > 0 }}"
                then:
                  - id: compile_pass
                    type: io.kestra.plugin.core.flow.Loop
                    description: One ALTER MATERIALIZED VIEW COMPILE per undetermined view. Metadata only, no rows are read or written. Sequential so a dependent set compiles in a stable order.
                    concurrencyLimit: 1
                    values: "{{ outputs.targets.values.compile_sql }}"
                    tasks:
                      - id: compile_one
                        type: io.kestra.plugin.jdbc.oracle.Query
                        description: allowFailure, so one view whose definition really is broken does not stop the others from being compiled plus reported.
                        allowFailure: true
                        url: "{{ inputs.jdbc_url }}"
                        username: "{{ inputs.username }}"
                        password: "{{ inputs.password }}"
                        fetchType: NONE
                        sql: "{{ item.value }}"

                  - id: compile_check
                    type: io.kestra.plugin.jdbc.oracle.Query
                    description: Read dba_mviews again for the compiled views. Anything still NEEDS_COMPILE or carrying an error compile_state did not compile.
                    url: "{{ inputs.jdbc_url }}"
                    username: "{{ inputs.username }}"
                    password: "{{ inputs.password }}"
                    fetchType: FETCH
                    sql: "{{ render(vars.compile_check_sql) }}"

                  - id: compile_verify
                    type: io.kestra.plugin.core.flow.If
                    condition: "{{ outputs.compile_check.size > 0 }}"
                    then:
                      - id: compile_failed
                        type: io.kestra.plugin.core.execution.Fail
                        errorMessage: >-
                          {{ outputs.compile_check.size }} of {{ outputs.targets.values.compile_count }} view(s) are still unresolved after the compile pass: {{ outputs.compile_check.rows | jq('map(.OWNER + "." + .MVIEW_NAME + " [" + .STALENESS + ", compile_state " + .COMPILE_STATE + "]") | join(", ")') | first }}.
                          A view that will not compile has a definition its base objects no longer support, so a dropped or retyped base column is the usual cause. Fix the definition before any refresh, because a refresh would empty the container and then fail.
                    else:
                      - id: compiled
                        type: io.kestra.plugin.core.log.Log
                        message: "Compiled {{ fromJson(outputs.targets.values.compile_sql) | length }} view(s). Their real staleness is now readable in dba_mviews, so the re-audit decides which of them actually need data."

              - id: reaudit
                type: io.kestra.plugin.jdbc.oracle.Query
                description: Re-run the audit after the compile pass. A view that was NEEDS_COMPILE now reads STALE (it needs data) or FRESH (the base change did not alter the result set, so no refresh is needed).
                url: "{{ inputs.jdbc_url }}"
                username: "{{ inputs.username }}"
                password: "{{ inputs.password }}"
                fetchType: FETCH
                sql: "{{ render(vars.audit_sql) }}"

              - id: resolved_targets
                type: io.kestra.plugin.core.output.OutputValues
                description: The refresh list after the compile pass resolved the undetermined views.
                values:
                  refresh_sql: >-
                    {{ outputs.reaudit.rows | jq('[.[] | select(.ACTION == "REFRESH" or .ACTION == "REFRESH_BY_AGE") | .FIX_SQL]') | first | toJson }}
                  refresh_count: >-
                    {{ outputs.reaudit.rows | jq('[.[] | select(.ACTION == "REFRESH" or .ACTION == "REFRESH_BY_AGE")] | length') | first }}
                  name_list: >-
                    {{ outputs.reaudit.rows | jq('[.[] | select(.ACTION == "REFRESH" or .ACTION == "REFRESH_BY_AGE") | .OWNER + "." + .MVIEW_NAME] | (if length == 0 then ["__NO_TARGET__"] else . end) | join(",")') | first }}
                  refresh_detail: >-
                    {{ outputs.reaudit.rows | jq('[.[] | select(.ACTION == "REFRESH" or .ACTION == "REFRESH_BY_AGE") | .OWNER + "." + .MVIEW_NAME + " [" + .STALENESS + ", stale since " + .STALE_SINCE + "]"] | join("; ")') | first }}

              - id: refresh_stage
                type: io.kestra.plugin.core.flow.If
                condition: "{{ (outputs.resolved_targets.values.refresh_count | number) > 0 }}"
                then:
                  - id: remediate
                    type: io.kestra.plugin.core.flow.Loop
                    description: One DBMS_MVIEW.REFRESH call per view. Sequential on purpose, since two complete refreshes at once compete for undo plus temp and can push each other into a tablespace error.
                    concurrencyLimit: 1
                    values: "{{ outputs.resolved_targets.values.refresh_sql }}"
                    tasks:
                      - id: refresh_one
                        type: io.kestra.plugin.jdbc.oracle.Query
                        description: An anonymous PL/SQL block calling DBMS_MVIEW.REFRESH for one view. allowFailure, so a view with no materialized view log under method F does not stop the rest of the pass. The re-read is what decides the run.
                        allowFailure: true
                        url: "{{ inputs.jdbc_url }}"
                        username: "{{ inputs.username }}"
                        password: "{{ inputs.password }}"
                        fetchType: NONE
                        sql: "{{ item.value }}"

                  - id: reverify
                    type: io.kestra.plugin.jdbc.oracle.Query
                    description: Read dba_mviews again for the exact views that were refreshed. A view only passes when it reads FRESH and its last_refresh_date is at or after the clock reading taken before the change.
                    url: "{{ inputs.jdbc_url }}"
                    username: "{{ inputs.username }}"
                    password: "{{ inputs.password }}"
                    fetchType: FETCH
                    sql: "{{ render(vars.reverify_sql) }}"

                  - id: totals_after
                    type: io.kestra.plugin.jdbc.oracle.Query
                    description: Re-read the per state counts so the run reports what the pass actually changed.
                    url: "{{ inputs.jdbc_url }}"
                    username: "{{ inputs.username }}"
                    password: "{{ inputs.password }}"
                    fetchType: FETCH_ONE
                    sql: "{{ render(vars.totals_sql) }}"

                  - id: verify_result
                    type: io.kestra.plugin.core.flow.If
                    condition: "{{ outputs.reverify.size > 0 }}"
                    then:
                      - id: remediation_failed
                        type: io.kestra.plugin.core.execution.Fail
                        errorMessage: >-
                          {{ outputs.reverify.size }} of {{ outputs.resolved_targets.values.refresh_count }} refreshed view(s) did not come back fresh: {{ outputs.reverify.rows | jq('map(.OWNER + "." + .MVIEW_NAME + " [" + .STALENESS + ", last refresh " + .LAST_REFRESH_DATE + ", " + .REASON + "]") | join(", ")') | first }}.
                          The schemas now hold {{ outputs.totals_after.row.FRESH_COUNT }} FRESH, {{ outputs.totals_after.row.STALE_COUNT }} STALE, {{ outputs.totals_after.row.NEEDS_COMPILE_COUNT }} NEEDS_COMPILE, {{ outputs.totals_after.row.BROKEN_COUNT }} broken, from {{ outputs.totals_before.row.FRESH_COUNT }}, {{ outputs.totals_before.row.STALE_COUNT }}, {{ outputs.totals_before.row.NEEDS_COMPILE_COUNT }}, {{ outputs.totals_before.row.BROKEN_COUNT }}.
                          Method F fails with ORA-23413 when a base table has no materialized view log. Any refresh is refused without ALTER ANY MATERIALIZED VIEW on another schema's view. Check the refresh_method input plus the privileges of the username input.
                    else:
                      - id: remediated
                        type: io.kestra.plugin.core.log.Log
                        message: >-
                          Refreshed {{ fromJson(outputs.resolved_targets.values.refresh_sql) | length }} materialized view(s) with method {{ inputs.refresh_method }}, atomic_refresh {{ inputs.atomic_refresh }}: {{ outputs.resolved_targets.values.refresh_detail }}.
                          Every one now reads FRESH with a last_refresh_date at or after {{ outputs.mark_time.row.DB_CLOCK }}, the database clock read before the pass started.
                          The checked schemas went from {{ outputs.totals_before.row.FRESH_COUNT }} FRESH, {{ outputs.totals_before.row.STALE_COUNT }} STALE, {{ outputs.totals_before.row.NEEDS_COMPILE_COUNT }} NEEDS_COMPILE to {{ outputs.totals_after.row.FRESH_COUNT }} FRESH, {{ outputs.totals_after.row.STALE_COUNT }} STALE, {{ outputs.totals_after.row.NEEDS_COMPILE_COUNT }} NEEDS_COMPILE. Oldest last refresh now {{ outputs.totals_after.row.OLDEST_REFRESH }}.
                else:
                  - id: nothing_to_refresh
                    type: io.kestra.plugin.core.log.Log
                    message: >-
                      The compile pass resolved every undetermined view to FRESH, so no data refresh was needed.
                      The base objects changed in a way that did not alter what the view returns. {{ outputs.totals_before.row.NEEDS_COMPILE_COUNT }} view(s) were NEEDS_COMPILE before the pass, {{ outputs.reaudit.size }} finding(s) remain.
            else:
              - id: declined
                type: io.kestra.plugin.core.log.Log
                message: "Not approved. {{ outputs.targets.values.refresh_count }} stale view(s) plus {{ outputs.targets.values.compile_count }} undetermined view(s) are left exactly as they are, still serving the rows they already hold."
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: >-
          Every on demand materialized view in the checked schemas is FRESH with a last refresh inside {{ inputs.max_age_hours }} hour(s).
          {{ outputs.totals_before.row.MVIEW_COUNT }} view(s) checked, oldest last refresh {{ outputs.totals_before.row.OLDEST_REFRESH }}.

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Oracle materialized view stale refresh guard failed on ' ~ inputs.jdbc_url ~ ' (execution ' ~ execution.id ~ '). Materialized views may still be answering queries from old rows. Check the logs.'} | toJson }}

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled and always in safe mode (report only).
    cron: "0 6 * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: Oracle Materialized View Stale Refresh Guard
  shortDescription: Find Oracle materialized views on REFRESH ON DEMAND that are no longer fresh, compile the ones whose freshness Oracle cannot determine, refresh the ones that are really stale with DBMS_MVIEW.REFRESH behind a dry run plus an approval pause, then re-read dba_mviews.
  metaTitle: Oracle Materialized View Stale Refresh Guard with Kestra
  metaDescription: Detect Oracle materialized views serving old rows, compile then refresh them with DBMS_MVIEW.REFRESH behind an approval pause, then re-read dba_mviews.
  description: |
    A materialized view on `REFRESH ON DEMAND` is exactly as fresh as the last refresh
    somebody ran. Nothing in Oracle refreshes it for you. When the refresh job is removed,
    fails quietly or was never scheduled, the view keeps answering every query out of the
    rows it already holds.

    This is the dangerous shape of staleness, because nothing errors. A query against a
    stale materialized view is fast, returns a number plus raises no warning. On the test
    rig below, a view reported 8 orders while its base table held 11. The only place
    that showed was `dba_mviews.staleness`. Query rewrite can route a query to the same
    stale view without the query ever naming it.

    This blueprint reads that column, carefully, because the value most
    people expect is not the value Oracle sets.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Findings

    Insert rows into a base table that has no materialized view log and the view does not
    go `STALE`. It goes `NEEDS_COMPILE`, which means Oracle cannot say whether the data
    moved until the view is compiled. Only after `ALTER MATERIALIZED VIEW ... COMPILE`
    does `dba_mviews` resolve it to `STALE` or `FRESH`. A detector that looks for `STALE`
    alone misses the most common case completely.

    | staleness | what it means | what this flow does |
    |---|---|---|
    | `FRESH` | the view matches its base tables | reported only when the last refresh is past `max_age_hours` |
    | `STALE` | base data changed since the last refresh | refresh target |
    | `NEEDS_COMPILE` | a base object changed in a way Oracle could not track, so freshness is undetermined | compile target, then re-audited, then refreshed only if it resolved to STALE |
    | `UNKNOWN` | Oracle cannot tell whether the view matches its masters, as with a prebuilt table | refresh target |
    | `UNDEFINED` | the view has remote masters, so staleness is not defined for it | refresh target |
    | `UNUSABLE` | the container table is not trustworthy, usually an interrupted refresh | reported only, a rebuild is not a refresh |
    | `COMPILATION_ERROR` | a compile was already tried and the definition no longer holds, so a base column was dropped or retyped | reported only, the definition has to change first |

    Compiling first is also the cheapest safety check available. A `COMPILE` touches no
    rows. If it errors, the base change broke the definition. That is exactly the case
    where a blind complete refresh does the most damage: it empties the container, then
    fails.

    ## Safety

    - A change runs only when `auto_remediate` is true, `dry_run` is false and a human
      resumes the `approval_gate` pause with `approved` set to true. Three conditions, all
      off by default.
    - `refresh_method` defaults to `C`, a complete refresh, because it always works. `F`
      fails with ORA-23413 unless every base table has a materialized view log, so it is a
      per view choice rather than a default. The findings carry `fast_refreshable` so you
      can see which views `F` could ever work on.
    - A complete refresh is heavy. It rereads every base row, writes the whole container
      table again plus can run for hours on a large view. That is what the pause is for.
    - `atomic_refresh` defaults to true, which keeps the view queryable throughout because
      the delete plus insert runs as one transaction. Setting it false lets Oracle truncate
      the container then direct path load it, which is much faster and leaves the view
      **empty to every reader** until the load finishes. On a view behind a live dashboard
      that is an outage, not an optimisation.
    - Only `refresh_mode = 'DEMAND'` views are touched. An `ON COMMIT` view refreshes
      itself, so a flow refreshing it would be fighting the database.
    - The re-read requires a `last_refresh_date` at or after a clock reading taken from the
      database before the pass, so a view that was already FRESH cannot be counted as a
      refresh that happened.

    ## How it works

    1. `totals_before` (`io.kestra.plugin.jdbc.oracle.Query`, read-only) counts the on demand
       materialized views in the checked schemas by staleness state plus reads the oldest
       last refresh.
    2. `audit` (read-only) lists the views that are not FRESH or whose `last_refresh_date`
       is older than `max_age_hours`. For each one it returns the staleness value, the
       compile state, `fast_refreshable`, the last refresh type, `stale_since` plus the exact
       `COMPILE` and `DBMS_MVIEW.REFRESH` statements.
    3. `targets` (`io.kestra.plugin.core.output.OutputValues`) splits the findings into
       refresh targets, compile targets and reported only. `summary` logs all three groups.
    4. `route` (`io.kestra.plugin.core.flow.If`):
       - **clean:** every view is fresh inside the policy, so it logs the counts and stops.
       - **findings:** `alert` posts the three groups to Slack. `state_route` explains the
         NEEDS_COMPILE plus UNUSABLE views when there are any, otherwise it says so.
         - `remediate_gate` runs only when `auto_remediate` is true, `dry_run` is false and
           there is at least one compile or refresh target.
         - `approval_gate` (`io.kestra.plugin.core.flow.Pause`) holds the run. `apply` checks
           the resume answer, so an unanswered pause never reads as approval.
         - `mark_time` reads the database clock before anything changes.
         - `compile_stage` runs `compile_pass` (`io.kestra.plugin.core.flow.Loop`,
           `concurrencyLimit: 1`), one `ALTER MATERIALIZED VIEW ... COMPILE` per undetermined
           view, then `compile_check` re-reads `dba_mviews` and `compile_verify` fails the run
           if any of them is still unresolved.
         - `reaudit` re-runs the audit. `resolved_targets` rebuilds the refresh list from it,
           so a view that compiled back to FRESH is never refreshed.
         - `refresh_stage` runs `remediate` (`Loop`, `concurrencyLimit: 1`), one
           `DBMS_MVIEW.REFRESH` per view. `reverify` re-reads `dba_mviews` for those exact
           views, `totals_after` re-reads the counts. `verify_result` fails the run
           through `io.kestra.plugin.core.execution.Fail` if any target did not come back
           fresh with a newer `last_refresh_date`.
    5. `errors` posts to Slack if the flow fails for any reason.

    ## What you get

    - A detector that catches the common case, not just the textbook one, because it treats
      `NEEDS_COMPILE` as a finding and resolves it instead of ignoring it.
    - A freshness policy in hours, so a view that still reads FRESH but has not refreshed
      since yesterday is a finding rather than a surprise.
    - A compile pass that is both the way to learn the real staleness and a free check that
      the definition still holds.
    - `fast_refreshable` in the findings, so the choice between `F` and `C` is informed.
    - Two independent failure gates. A view that will not compile fails the run. A view that
      did not actually refresh fails the run too.
    - Slack alerts on the findings and on any failure.

    ## Who it's for

    - Data teams whose dashboards read from materialized views and whose numbers quietly
      stopped matching the source tables.
    - DBAs who inherited an instance with materialized views nobody owns, where the refresh
      jobs may or may not still exist.
    - Platform teams who want the freshness promise written down as a schedule plus a
      threshold, rather than living in a scheduler entry somebody deleted.

    ## Why orchestrate this with Kestra

    The usual answer is a `DBMS_SCHEDULER` job calling `DBMS_MVIEW.REFRESH`, which is the
    thing that goes missing in the first place. When it fails it fails inside the database,
    with the error in a scheduler table nobody watches. Kestra puts the check outside the
    database: it reads `dba_mviews` on a schedule, posts what is stale to Slack, holds a
    heavy complete refresh behind a human approval, then proves the refresh landed by reading
    the catalog again plus failing the run if it did not. Every run keeps its logs, so you
    can show which view was stale, since when and what the refresh changed.

    ## Tested end to end

    On Kestra 2.0.5 OSS against Oracle Database Free 23ai (`gvenzl/oracle-free`, service
    FREEPDB1), with a local HTTP sink standing in for Slack. Schema `APP` held `SALES` with
    8 rows plus `REGION_DIM` with 3. Two materialized views were built
    `REFRESH COMPLETE ON DEMAND`: `MV_SALES_BY_REGION` over `SALES` and `MV_REGION_DIM` over
    `REGION_DIM`. Both were refreshed once so both read FRESH, then 3 rows were inserted into
    `SALES` only.

    The wrong answer was measured, not assumed. With `MV_SALES_BY_REGION` not fresh,
    `SELECT SUM(order_count) FROM app.mv_sales_by_region` returned **8** while
    `SELECT COUNT(*) FROM app.sales` returned **11**. The amounts were **1475** against
    **2435**. After the flow compiled plus refreshed it, the same two queries both returned
    **11** and both returned **2435**. `MV_REGION_DIM` stayed FRESH throughout, which is the
    precision check: the detector returned exactly one row, not two.

    | Run | Setup and inputs | Result |
    |---|---|---|
    | 1 | both views FRESH, defaults | 0 findings, clean branch, SUCCESS |
    | 2 | 3 rows inserted into `SALES`, defaults | 1 finding, staleness NEEDS_COMPILE, posted to Slack, no change, SUCCESS |
    | 3 | same, `auto_remediate: true`, `dry_run: true` | Same report, Slack said no change applied, `remediate_gate` never opened. The dry run gate held |
    | 4 | same, armed, pause resumed `approved: false` | Declined, state unchanged, SUCCESS |
    | 5 | same, armed, pause resumed `approved: true` | Compiled, resolved to STALE, refreshed, reverify found 0, SUCCESS |
    | 6 | base column the view aggregates dropped then compiled by hand, defaults | 1 COMPILATION_ERROR finding, 0 refresh targets, 0 compile targets, reported only, SUCCESS |
    | 7 | stale view, `refresh_method: F`, no materialized view log, armed, approved | Refresh failed with ORA-23413, reverify reported `refresh did not run`, run FAILED, errors block alerted Slack |
    | 8 | base column dropped with the view left NEEDS_COMPILE, armed, approved | Compile failed, `compile_verify` fired, no refresh was attempted, run FAILED, errors block alerted Slack |
    | 9 | `max_age_hours: 0`, both views FRESH | Both detected by age alone with staleness FRESH, SUCCESS |

    Runs 1 and 2 are the proof the check can fail: the same query returned 0 rows against two
    FRESH views and exactly 1 row after 3 inserts into one base table. Run 9 proves the age
    predicate works on its own, independently of the staleness column. Run 8 is the one that
    matters most for safety, because the broken view was never handed to a refresh. Every
    staleness value plus last refresh timestamp was read back from `dba_mviews` with sqlplus,
    not only from the Kestra log.

    ## Prerequisites

    - An Oracle Database reachable over the thin JDBC driver (`jdbc:oracle:thin:@//host:1521/service`).
    - A database user that can read `dba_mviews` (`SELECT_CATALOG_ROLE` or `SELECT ANY
      DICTIONARY`). Compiling or refreshing another schema's materialized view needs
      `ALTER ANY MATERIALIZED VIEW`. A user working only on its own views needs no extra
      privilege.
    - At least one materialized view with `REFRESH ON DEMAND`. `ON COMMIT` views are skipped
      by design.
    - For `refresh_method: F`, a materialized view log on every base table, created before
      the view was built.

    ### Secrets

    - `ORACLE_PASSWORD`: the database password. It is the default for the `password` input.
    - `SLACK_WEBHOOK_URL`: used by `alert` and the `errors` block.
    - In Kestra OSS, provide each one as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `jdbc_url` | `jdbc:oracle:thin:@//localhost:1521/FREEPDB1` | The Oracle instance to check |
    | `username` | `SYSTEM` | The database user |
    | `password` | `{{ secret('ORACLE_PASSWORD') }}` | The database password |
    | `mview_owners` | `[APP]` | Schemas whose materialized views are checked |
    | `max_age_hours` | `24.0` | A FRESH view last refreshed longer ago than this is also a finding |
    | `refresh_method` | `C` | DBMS_MVIEW.REFRESH method code, one of C, F, ?, A |
    | `atomic_refresh` | `true` | True keeps the view readable during the refresh |
    | `auto_remediate` | `false` | Allow COMPILE plus DBMS_MVIEW.REFRESH |
    | `dry_run` | `true` | Must be false for any change to run |

    ## Quick start

    1. Add the `ORACLE_PASSWORD` and `SLACK_WEBHOOK_URL` secrets.
    2. Import the flow, set `jdbc_url` plus `username`, then list the schemas in `mview_owners`.
    3. Run it with the defaults and read which views are stale or undetermined.
    4. Set `max_age_hours` to the freshness your reports actually promise.
    5. When you want it to fix things, run with `auto_remediate: true` plus `dry_run: false`,
       then resume the pause with `approved: true`.
    6. Enable the `daily` trigger, which always runs in safe mode.

    ## How to extend

    - Fail the run as soon as the audit finds anything, for a read-only freshness gate in
      front of a reporting job.
    - Call `DBMS_MVIEW.EXPLAIN_MVIEW` on the `fast_refreshable: NO` views to get the exact
      reason a fast refresh is impossible, then create the missing materialized view logs.
    - Refresh a dependent set in one call by passing a comma separated list to
      `DBMS_MVIEW.REFRESH`, which keeps those views consistent with each other.
    - Add a per view freshness policy from a table instead of one `max_age_hours` for the
      whole schema.
    - Switch the age predicate to `stale_since`, so the measure becomes how long the view has
      been wrong rather than how long since it was refreshed.
    - Compare the view's own aggregate against the base table after the refresh, for a value
      level check on top of the catalog check.
    - Loop over several instances to check every database from one flow.

    ## Links

    - Oracle plugin: https://kestra.io/plugins/plugin-jdbc-oracle
    - DBMS_MVIEW.REFRESH: https://docs.oracle.com/en/database/oracle/oracle-database/23/arpls/DBMS_MVIEW.html
    - Refreshing materialized views: https://docs.oracle.com/en/database/oracle/oracle-database/23/dwhsg/refreshing-materialized-views.html
    - DBA_MVIEWS: https://docs.oracle.com/en/database/oracle/oracle-database/23/refrn/ALL_MVIEWS.html
    - Schedule trigger: https://kestra.io/plugins/core/triggers/io.kestra.plugin.core.trigger.schedule
