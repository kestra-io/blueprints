id: autonomous-incident-triage-with-fallback
namespace: company.team
description: |
  Autonomous incident triage workflow that ingests production alerts via webhook or schedule,
  synthesizes root causes using multi-tier LLM failover from OpenAI to Gemini, assesses blast radius,
  pauses for human engineer sign-off, and dispatches actionable Slack notifications.

triggers:
  - id: alert_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Inbound webhook receiving alerts from PagerDuty, Sentry, or monitoring systems.
    key: "{{ secret('INCIDENT_WEBHOOK_KEY') }}"

  - id: poll_unassigned_incidents
    type: io.kestra.plugin.core.trigger.Schedule
    description: Optional recurring poll to sweep for unassigned production incidents.
    cron: "*/30 * * * *"
    disabled: true

inputs:
  - id: incident_id
    type: STRING
    description: Unique identifier for the incident ticket or alert event.
    defaults: "INC-84920"

  - id: service
    type: STRING
    description: Affected microservice or infrastructure component name.
    defaults: "checkout-payment-api"

  - id: severity
    type: SELECT
    values:
      - CRITICAL
      - HIGH
      - MEDIUM
      - LOW
    description: Inbound alert severity level.
    defaults: HIGH

  - id: error_message
    type: STRING
    description: Primary error message or anomaly alert description.
    defaults: "HTTP 504 Gateway Timeout spike exceeding 35% error rate on POST /api/v2/charge across us-east-1"

  - id: logs
    type: STRING
    description: Diagnostic logs, stack trace, or observability snippets associated with the incident.
    defaults: "2026-10-02T18:50:12Z ERROR [pool-payment-upstream] Connection pool exhausted (active=100/100, pending=482). Latency p99 > 8500ms. Upstream gateway db-replica-02 read timeouts."

  - id: environment
    type: STRING
    description: Target deployment environment.
    defaults: "production"

tasks:
  - id: log_incident_payload
    type: io.kestra.plugin.core.log.Log
    description: Record the inbound incident alert details for auditability.
    message: |
      Incoming incident triage initiated:
      - Incident ID: {{ trigger.body.incident_id ?? inputs.incident_id }}
      - Service: {{ trigger.body.service ?? inputs.service }}
      - Inbound Severity: {{ trigger.body.severity ?? inputs.severity }}
      - Environment: {{ trigger.body.environment ?? inputs.environment }}
      - Error: {{ trigger.body.error_message ?? inputs.error_message }}

  - id: triage_incident_with_fallback
    type: io.kestra.plugin.scripts.python.Script
    description: Execute autonomous incident triage using primary OpenAI model with seamless automatic fallback to Google Gemini and deterministic heuristics.
    dependencies:
      - kestra
      - requests
    env:
      OPENAI_API_KEY: "{{ secret('OPENAI_API_KEY') }}"
      GEMINI_API_KEY: "{{ secret('GEMINI_API_KEY') }}"
      INCIDENT_ID: "{{ trigger.body.incident_id ?? inputs.incident_id }}"
      SERVICE_NAME: "{{ trigger.body.service ?? inputs.service }}"
      SEVERITY: "{{ trigger.body.severity ?? inputs.severity }}"
      ERROR_MESSAGE: "{{ trigger.body.error_message ?? inputs.error_message }}"
      INCIDENT_LOGS: "{{ trigger.body.logs ?? inputs.logs }}"
      ENVIRONMENT: "{{ trigger.body.environment ?? inputs.environment }}"
    script: |
      import os
      import json
      import time
      import requests
      from kestra import Kestra

      def clean_text(text):
          if not text:
              return ""
          return str(text).replace('"', "'").replace("\n", " ").strip()

      incident_id = os.environ.get("INCIDENT_ID", "INC-UNKNOWN")
      service = os.environ.get("SERVICE_NAME", "unknown-service")
      severity = os.environ.get("SEVERITY", "HIGH")
      error_msg = os.environ.get("ERROR_MESSAGE", "")
      logs = os.environ.get("INCIDENT_LOGS", "")
      env_name = os.environ.get("ENVIRONMENT", "production")

      openai_api_key = os.environ.get("OPENAI_API_KEY", "").strip()
      gemini_api_key = os.environ.get("GEMINI_API_KEY", "").strip()

      triage_prompt = f"""You are a Principal Site Reliability Engineer on-call. Analyze the following production incident:
      Incident ID: {incident_id}
      Service: {service}
      Environment: {env_name}
      Reported Severity: {severity}
      Error Message: {error_msg}
      Recent Logs:
      {logs}

      Provide a structured JSON triage response with the exact keys:
      - "root_cause_hypothesis": concise analysis of likely root cause
      - "blast_radius": estimated user impact, services affected, data loss risk
      - "severity_level": "CRITICAL", "HIGH", "MEDIUM", or "LOW"
      - "mitigation_steps": list of 3-5 concise actionable mitigation steps
      - "requires_human_approval": boolean true if blast radius is severe or risk is high, false otherwise
      - "summary": 2-3 sentence executive triage summary
      """

      triage_result = None
      provider_used = None
      failover_occurred = False
      error_log = []

      # Tier 1: Primary provider - OpenAI
      if openai_api_key:
          print("Attempting primary LLM triage with OpenAI (gpt-4o-mini)...")
          try:
              start_time = time.time()
              response = requests.post(
                  "https://api.openai.com/v1/chat/completions",
                  headers={
                      "Authorization": f"Bearer {openai_api_key}",
                      "Content-Type": "application/json"
                  },
                  json={
                      "model": "gpt-4o-mini",
                      "messages": [
                          {"role": "system", "content": "You are an automated incident triage engine. Respond ONLY with valid JSON."},
                          {"role": "user", "content": triage_prompt}
                      ],
                      "temperature": 0.2,
                      "response_format": {"type": "json_object"}
                  },
                  timeout=12
              )
              if response.status_code == 200:
                  res_data = response.json()
                  raw_content = res_data["choices"][0]["message"]["content"]
                  triage_result = json.loads(raw_content)
                  provider_used = "OpenAI (gpt-4o-mini)"
                  latency = round((time.time() - start_time) * 1000, 2)
                  print(f"OpenAI triage succeeded in {latency}ms.")
              else:
                  error_log.append(f"OpenAI HTTP {response.status_code}")
                  print(f"OpenAI returned non-200: {response.status_code}")
          except Exception as e:
              error_log.append(f"OpenAI exception: {str(e)}")
              print(f"OpenAI call failed: {str(e)}")
      else:
          error_log.append("OPENAI_API_KEY not configured.")

      # Tier 2: Secondary provider - Google Gemini Fallback
      if not triage_result and gemini_api_key:
          print("Failing over to secondary LLM provider: Google Gemini (gemini-1.5-flash)...")
          failover_occurred = True
          try:
              start_time = time.time()
              gemini_url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={gemini_api_key}"
              response = requests.post(
                  gemini_url,
                  headers={"Content-Type": "application/json"},
                  json={
                      "contents": [
                          {
                              "parts": [
                                  {"text": "You are an automated incident triage engine. Respond strictly with valid JSON conforming to keys: root_cause_hypothesis, blast_radius, severity_level, mitigation_steps, requires_human_approval, summary.\n\n" + triage_prompt}
                              ]
                          }
                      ],
                      "generationConfig": {
                          "temperature": 0.2,
                          "responseMimeType": "application/json"
                      }
                  },
                  timeout=12
              )
              if response.status_code == 200:
                  res_data = response.json()
                  raw_text = res_data["candidates"][0]["content"]["parts"][0]["text"]
                  triage_result = json.loads(raw_text)
                  provider_used = "Google Gemini (gemini-1.5-flash)"
                  latency = round((time.time() - start_time) * 1000, 2)
                  print(f"Gemini fallback triage succeeded in {latency}ms.")
              else:
                  error_log.append(f"Gemini HTTP {response.status_code}")
                  print(f"Gemini returned non-200: {response.status_code}")
          except Exception as e:
              error_log.append(f"Gemini exception: {str(e)}")
              print(f"Gemini call failed: {str(e)}")

      # Tier 3: Deterministic Rule-Based Fallback Engine
      if not triage_result:
          print("Engaging Tier 3 deterministic heuristic fallback...")
          failover_occurred = True
          provider_used = "Deterministic Heuristic Engine (Offline Fallback)"

          lower_context = (logs + " " + error_msg).lower()
          if "connection pool" in lower_context or "exhausted" in lower_context:
              hypothesis = f"Database connection pool exhaustion detected in dependencies for {service}."
              radius = "Payment transactions failing; upstream database read replica thread pool saturated."
              mitigations = [
                  "Increase upstream database connection pool max connections",
                  "Recycle degraded worker pods on checkout-payment-api",
                  "Enable read replica traffic shedding for non-critical query paths",
                  "Verify database slow query log and active lock count"
              ]
          elif "timeout" in lower_context or "504" in lower_context:
              hypothesis = f"Upstream service or gateway timeout degradation impacting {service}."
              radius = "Inbound API latency spike affecting client requests and webhook delivery."
              mitigations = [
                  "Verify health and response latency of downstream gateway dependencies",
                  "Enable circuit breaker to shed load to fallback cache",
                  "Drain unhealthy availability zone routing if regional",
                  "Scale horizontal pod autoscalers (HPA) to absorb queue build-up"
              ]
          else:
              hypothesis = f"Application runtime exception spike detected in {service}."
              radius = "Degraded transaction throughput across production environment."
              mitigations = [
                  "Review recent deployments within the last 60 minutes",
                  "Inspect pod memory and CPU utilization metrics",
                  "Rotate container replicas to clear potential deadlock states"
              ]

          triage_result = {
              "root_cause_hypothesis": hypothesis,
              "blast_radius": radius,
              "severity_level": severity.upper() if severity in ["CRITICAL", "HIGH", "MEDIUM", "LOW"] else "HIGH",
              "mitigation_steps": mitigations,
              "requires_human_approval": True,
              "summary": f"Automated heuristic fallback diagnosed degradation in {service}. Mitigation runbook requires on-call verification."
          }

      steps_raw = triage_result.get("mitigation_steps", [])
      if isinstance(steps_raw, list):
          mitigation_formatted = " | ".join([f"Step {i+1}: {clean_text(s)}" for i, s in enumerate(steps_raw)])
      else:
          mitigation_formatted = clean_text(steps_raw)

      requires_approval = bool(triage_result.get("requires_human_approval", True))
      assessed_severity = str(triage_result.get("severity_level", severity)).upper()
      if assessed_severity in ["CRITICAL", "HIGH"]:
          requires_approval = True

      Kestra.outputs({
          "incident_id": incident_id,
          "service": service,
          "provider_used": provider_used,
          "failover_occurred": failover_occurred,
          "severity_level": assessed_severity,
          "root_cause_hypothesis": clean_text(triage_result.get("root_cause_hypothesis", "N/A")),
          "blast_radius": clean_text(triage_result.get("blast_radius", "N/A")),
          "mitigation_steps": mitigation_formatted,
          "summary": clean_text(triage_result.get("summary", "Triage completed.")),
          "requires_human_approval": requires_approval,
          "error_log": "; ".join(error_log) if error_log else "None"
      })

  - id: notify_triage_channel
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Dispatch AI triage report and blast radius analysis to the incident Slack channel.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Incident Triage [{{ outputs.triage_incident_with_fallback.vars.incident_id }}] - {{ outputs.triage_incident_with_fallback.vars.severity_level }}: {{ outputs.triage_incident_with_fallback.vars.summary }}",
        "blocks": [
          {
            "type": "header",
            "text": {
              "type": "plain_text",
              "text": "Incident Triage: {{ outputs.triage_incident_with_fallback.vars.incident_id }}"
            }
          },
          {
            "type": "section",
            "fields": [
              {
                "type": "mrkdwn",
                "text": "*Service:*\n{{ outputs.triage_incident_with_fallback.vars.service }}"
              },
              {
                "type": "mrkdwn",
                "text": "*Severity:*\n{{ outputs.triage_incident_with_fallback.vars.severity_level }}"
              },
              {
                "type": "mrkdwn",
                "text": "*LLM Provider:*\n{{ outputs.triage_incident_with_fallback.vars.provider_used }}"
              },
              {
                "type": "mrkdwn",
                "text": "*Failover Active:*\n{{ outputs.triage_incident_with_fallback.vars.failover_occurred }}"
              }
            ]
          },
          {
            "type": "section",
            "text": {
              "type": "mrkdwn",
              "text": "*Root Cause Hypothesis:*\n{{ outputs.triage_incident_with_fallback.vars.root_cause_hypothesis }}\n\n*Blast Radius:*\n{{ outputs.triage_incident_with_fallback.vars.blast_radius }}"
            }
          },
          {
            "type": "section",
            "text": {
              "type": "mrkdwn",
              "text": "*Mitigation Runbook:*\n{{ outputs.triage_incident_with_fallback.vars.mitigation_steps }}\n\n*Summary:*\n{{ outputs.triage_incident_with_fallback.vars.summary }}"
            }
          }
        ]
      }

  - id: evaluate_approval_gate
    type: io.kestra.plugin.core.flow.If
    description: Pause execution for human on-call engineer sign-off if severity is high or critical, or if LLM triage mandates approval.
    condition: "{{ outputs.triage_incident_with_fallback.vars.requires_human_approval == true or (trigger.body.severity ?? inputs.severity) == 'CRITICAL' or (trigger.body.severity ?? inputs.severity) == 'HIGH' }}"
    then:
      - id: notify_approval_requested
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Request human confirmation in Slack before initiating automated remediation.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "ACTION REQUIRED: Human approval needed for incident {{ outputs.triage_incident_with_fallback.vars.incident_id }} (Execution: {{ execution.id }}). Resume execution in Kestra UI to authorize mitigation runbook."
          }

      - id: pause_for_human_approval
        type: io.kestra.plugin.core.flow.Pause
        description: Hold execution awaiting on-call engineer approval and remediation action confirmation.
        pauseDuration: PT1H
        onResume:
          - id: approved
            type: BOOL
            defaults: false
            description: Set to true to authorize automated mitigation runbooks.
          - id: approver_email
            type: STRING
            defaults: "oncall-lead@company.team"
            description: Email address of the authorizing responder.
          - id: remediation_action
            type: STRING
            defaults: "restart-upstream-pool"
            description: Confirmed runbook remediation action.

      - id: execute_mitigation_decision
        type: io.kestra.plugin.core.flow.If
        description: Branch on human approval decision.
        condition: "{{ (outputs.pause_for_human_approval.onResume is defined) and outputs.pause_for_human_approval.onResume.approved }}"
        then:
          - id: log_mitigation_approved
            type: io.kestra.plugin.core.log.Log
            description: Record approved mitigation execution details.
            message: "Remediation action [{{ outputs.pause_for_human_approval.onResume.remediation_action }}] authorized by {{ outputs.pause_for_human_approval.onResume.approver_email }} for incident {{ outputs.triage_incident_with_fallback.vars.incident_id }}."

          - id: notify_mitigation_commenced
            type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
            description: Notify Slack channel that remediation action has commenced.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": "Mitigation commenced for {{ outputs.triage_incident_with_fallback.vars.incident_id }}: Action [{{ outputs.pause_for_human_approval.onResume.remediation_action }}] approved by {{ outputs.pause_for_human_approval.onResume.approver_email }}."
              }
        else:
          - id: log_mitigation_rejected
            type: io.kestra.plugin.core.log.Log
            description: Log that human approver declined or timed out the mitigation action.
            message: "Incident mitigation was not approved. Standing down automated intervention for {{ outputs.triage_incident_with_fallback.vars.incident_id }}."

  - id: record_triage_audit
    type: io.kestra.plugin.core.log.Log
    description: Record final audit log entry summarizing triage execution and provider routing.
    message: |
      Incident triage workflow execution {{ execution.id }} completed.
      Provider utilized: {{ outputs.triage_incident_with_fallback.vars.provider_used }}
      Severity: {{ outputs.triage_incident_with_fallback.vars.severity_level }}
      Failover triggered: {{ outputs.triage_incident_with_fallback.vars.failover_occurred }}

errors:
  - id: alert_workflow_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert the SRE on-call channel if the incident triage pipeline fails unexpectedly.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "CRITICAL: Incident triage workflow failed in execution {{ execution.id }} on namespace {{ flow.namespace }}. Check execution logs in Kestra console."
      }

extend:
  shortDescription: "Triage production alerts using multi-tier LLM failover from OpenAI to Gemini, evaluate blast radius, pause for human approval, and dispatch Slack alerts."
  metaTitle: Autonomous Incident Triage with Multi-Provider LLM Fallback and Slack Escalation in Kestra
  title: Autonomous Incident Triage with Multi-Provider LLM Fallback and Slack Escalation
  metaDescription: Triage production alerts using multi-tier LLM failover from OpenAI to Gemini, evaluate blast radius, pause for human approval, and dispatch Slack alerts.
  tags:
    - AI
    - Infrastructure
    - Business
  subTags:
    - Incident Response
    - Agents & Structured Output
  ee: false
  demo: false
  description: |
    Automate production incident triage across mission-critical services with resilient multi-tier LLM failover. When production outages occur, on-call engineers face alert storms from PagerDuty, Sentry, Datadog, and cloud monitors. Single-model AI pipelines introduce a single point of failure (SPOF): if OpenAI experiences latency spikes, rate limits (HTTP 429), or outages, automated incident response stops dead in its tracks.

    This workflow provides an enterprise-grade incident triage pipeline orchestrated by Kestra. It ingests alert events via authenticated webhooks or scheduled polling, triages diagnostic logs using OpenAI as the primary provider, automatically fails over to Google Gemini if OpenAI fails or times out, and falls back to a deterministic offline heuristic rule engine if external AI APIs are unreachable. High-severity incidents are held in a human-in-the-loop approval gate before running automated mitigation actions, keeping production safe and auditable.

    ## Architecture and Failover Mechanics

    The workflow executes a 3-tier failover hierarchy:

    1. **Tier 1 (Primary - OpenAI):** Attempts root cause analysis, blast radius estimation, and runbook generation using `gpt-4o-mini` with strict JSON schema constraints.
    2. **Tier 2 (Secondary - Google Gemini):** If OpenAI returns an HTTP error, times out after 12 seconds, or exhausts token quotas, execution instantly fails over to Google Gemini (`gemini-1.5-flash`) via the Gemini REST API.
    3. **Tier 3 (Offline Deterministic Heuristic):** If both external AI providers are unavailable (e.g. network partition or missing credentials), the flow executes an internal rule-based heuristic that maps log patterns (such as connection pool saturation or gateway timeouts) to remediation playbooks with `requires_human_approval` forced to true.
    4. **Human-in-the-Loop Gate:** High-severity or high-blast-radius incidents pause execution (`io.kestra.plugin.core.flow.Pause`) for up to 1 hour, notifying on-call responders via Slack. The execution only advances to mitigation runbooks when an engineer explicitly resumes the flow with an approval flag and change parameters.

    ## How It Works

    1. **Inbound Trigger:** An alert payload arrives via the `alert_webhook` (`io.kestra.plugin.core.trigger.Webhook`) or manual execution. An optional disabled schedule trigger (`poll_unassigned_incidents`) is provided for batch triage sweeps.
    2. **Payload Logging (`log_incident_payload`):** Records the incident identifier, impacted service, incoming severity, environment, and error message in the execution trace.
    3. **Multi-Tier Triage (`triage_incident_with_fallback`):** The Python script evaluates the error message and diagnostic logs through the OpenAI -> Gemini -> Heuristic failover chain, emitting structured outputs (`severity_level`, `root_cause_hypothesis`, `blast_radius`, `mitigation_steps`, `requires_human_approval`, `provider_used`, `failover_occurred`).
    4. **Slack Broadcast (`notify_triage_channel`):** Posts a formatted Slack message with block elements detailing the diagnosis, blast radius, provider utilized, and recommended mitigation steps.
    5. **Approval Gate (`evaluate_approval_gate`):** If severity is HIGH or CRITICAL, or if the triage model flags `requires_human_approval: true`, the workflow notifies Slack and pauses execution. Responders resume with approval status, approver email, and remediation action.
    6. **Mitigation Execution (`execute_mitigation_decision`):** If approved, logs and confirms the mitigation runbook start in Slack. If rejected or timed out, logs that automated remediation stood down.
    7. **Audit Record (`record_triage_audit`):** Logs final execution metadata, including the LLM provider utilized and failover state.
    8. **Failure Handling (`errors`):** Any unhandled task failure immediately dispatches an urgent failure alert to Slack.

    ## Prerequisites

    - A Slack workspace with an Incoming Webhook configured.
    - An OpenAI API account with an active API key.
    - A Google AI Studio or Google Cloud account with a Gemini API key.
    - Access to Kestra to configure namespace secrets and execute workflows.

    ### Secret Configuration

    Configure the following secrets in your Kestra namespace (`company.team`):

    - `OPENAI_API_KEY`: API secret key for OpenAI (Tier 1 primary provider).
    - `GEMINI_API_KEY`: API key for Google Gemini REST API (Tier 2 failover provider).
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for incident triage reports and approval requests.
    - `INCIDENT_WEBHOOK_KEY`: Secret authentication key used to authorize inbound alert webhooks.

    ## Input Parameters

    - `incident_id` (STRING, default: "INC-84920"): Unique tracking identifier for the incident or alert.
    - `service` (STRING, default: "checkout-payment-api"): Impacted service or infrastructure component.
    - `severity` (SELECT, default: HIGH): Inbound alert priority (`CRITICAL`, `HIGH`, `MEDIUM`, `LOW`).
    - `error_message` (STRING): Summary error or threshold breach alert text.
    - `logs` (STRING): Recent diagnostic logs, stack traces, or metrics context.
    - `environment` (STRING, default: "production"): Target environment under incident investigation.

    ## Tasks Summary

    - `log_incident_payload` (`io.kestra.plugin.core.log.Log`): Logs incoming alert metadata.
    - `triage_incident_with_fallback` (`io.kestra.plugin.scripts.python.Script`): Multi-tier LLM triage with OpenAI, Gemini, and offline rule fallback.
    - `notify_triage_channel` (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`): Sends formatted diagnostic summary to Slack.
    - `evaluate_approval_gate` (`io.kestra.plugin.core.flow.If`): Conditional branch that gates remediation on human approval:
      - `notify_approval_requested` (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`): Slack alert requesting engineer sign-off.
      - `pause_for_human_approval` (`io.kestra.plugin.core.flow.Pause`): Pauses workflow execution for up to 1 hour.
      - `execute_mitigation_decision` (`io.kestra.plugin.core.flow.If`): Evaluates resume inputs to trigger remediation or stand down.
    - `record_triage_audit` (`io.kestra.plugin.core.log.Log`): Records completion status and provider lineage.
    - `alert_workflow_failure` (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`): Global flow-level error handler.

    ## Example Execution Output

    When executed, `outputs.triage_incident_with_fallback.vars` yields structured outputs:

    ```json
    {
      "incident_id": "INC-84920",
      "service": "checkout-payment-api",
      "provider_used": "OpenAI (gpt-4o-mini)",
      "failover_occurred": false,
      "severity_level": "HIGH",
      "root_cause_hypothesis": "Database connection pool starvation on db-replica-02 causing upstream gateway timeouts on charge endpoints.",
      "blast_radius": "Checkout payment processing degraded for approximately 35% of inbound user checkout requests in us-east-1.",
      "mitigation_steps": "Step 1: Increase connection pool ceiling | Step 2: Recycle checkout worker pods | Step 3: Shed non-critical read replica traffic",
      "summary": "Connection pool exhaustion on db-replica-02 is causing 504 timeouts on POST /api/v2/charge. Responders should verify replica health and recycle worker pods.",
      "requires_human_approval": true
    }
    ```

    Slack notification dispatched:
    ```text
    Incident Triage: INC-84920
    Service: checkout-payment-api | Severity: HIGH
    LLM Provider: OpenAI (gpt-4o-mini) | Failover Active: False
    Root Cause Hypothesis: Database connection pool starvation on db-replica-02...
    Blast Radius: Checkout payment processing degraded for approximately 35% of inbound requests...
    ```

    ## Quick Start

    1. Add the four required secrets (`OPENAI_API_KEY`, `GEMINI_API_KEY`, `SLACK_WEBHOOK_URL`, `INCIDENT_WEBHOOK_KEY`) to the `company.team` namespace in Kestra.
    2. Deploy the blueprint YAML to your Kestra instance.
    3. Trigger a test run manually via the Kestra UI with the default inputs, or send an HTTP POST request to your Kestra webhook endpoint:
       `curl -X POST https://kestra.example.com/api/v1/executions/webhook/company.team/autonomous-incident-triage-with-fallback/{INCIDENT_WEBHOOK_KEY} -H "Content-Type: application/json" -d '{"incident_id": "INC-1001", "service": "auth-service", "severity": "HIGH", "error_message": "Token verification failure spike", "logs": "JWT signature validation timeout"}'`
    4. Review the Slack alert in your incident channel.
    5. Navigate to the paused execution in the Kestra UI, click Resume, set `approved: true`, and confirm mitigation dispatch.

    ## How to Extend

    - **Automated Remediation:** Replace `log_mitigation_approved` with a task that triggers an Ansible playbook, Kubernetes pod rollout (`io.kestra.plugin.kubernetes.pod.Delete`), or AWS ECS service update.
    - **PagerDuty Bidirectional Sync:** Add a task to acknowledge or update the PagerDuty incident notes with the LLM triage findings.
    - **Post-Mortem Storage:** Export the incident triage summary and latency metrics to BigQuery or Elasticsearch for weekly incident reviews and SLA tracking.
    - **Anthropic Claude Tier:** Add Claude 3.5 Sonnet as an intermediate failover tier between OpenAI and Gemini for deep code diff analysis.

