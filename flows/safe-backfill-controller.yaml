id: safe-backfill-controller
namespace: company.team
description: |
  Backfill any date-partitioned job safely. Split a date range into day, week or
  month partitions, run the job flow once per partition with a concurrency limit,
  checkpoint each finished partition in the KV store, and resume from where it
  stopped when a run fails, without redoing partitions that already succeeded.

concurrency:
  limit: 1
  behavior: QUEUE

triggers:
  - id: nightly_resume
    type: io.kestra.plugin.core.trigger.Schedule
    description: Re-run the backfill configured in the input defaults every night. Finished partitions are skipped, so this only retries what is still missing, for example data published late.
    cron: "0 2 * * *"
    disabled: true

inputs:
  - id: job_namespace
    type: STRING
    displayName: Job namespace
    defaults: company.team
  - id: job_flow_id
    type: STRING
    displayName: Job flow
    description: Flow run once per partition. It must accept `partition_start` and `partition_end` (exclusive) inputs.
    defaults: backfill-example-nyc-taxi-monthly
  - id: start_date
    type: DATE
    displayName: Start date
    defaults: "2024-01-01"
  - id: end_date
    type: DATE
    displayName: End date
    description: Inclusive. The last partition is the one containing this date.
    defaults: "2024-06-30"
  - id: granularity
    type: SELECT
    displayName: Partition size
    values:
      - DAY
      - WEEK
      - MONTH
    defaults: MONTH
  - id: backfill_id
    type: STRING
    displayName: Backfill ID
    description: Names this backfill's checkpoints. Re-run with the same ID to resume; use a new ID to start a fresh backfill of the same range.
    defaults: initial-load
  - id: force
    type: BOOL
    displayName: Ignore checkpoints
    description: Re-run every partition, even those already marked as done.
    defaults: false

tasks:
  - id: plan
    type: io.kestra.plugin.scripts.python.Script
    description: Split the date range into partitions. Weeks start on Monday and months on the 1st, so partitions line up with how the data is usually stored.
    dependencies:
      - kestra
    script: |
      from datetime import date, timedelta
      from kestra import Kestra

      start = date.fromisoformat("{{ inputs.start_date }}")
      end = date.fromisoformat("{{ inputs.end_date }}")
      granularity = "{{ inputs.granularity }}"
      if end < start:
          raise ValueError("end_date is before start_date")

      def next_boundary(day):
          if granularity == "DAY":
              return day + timedelta(days=1)
          if granularity == "WEEK":
              return day + timedelta(days=7)
          return date(day.year + day.month // 12, day.month % 12 + 1, 1)

      if granularity == "WEEK":
          current = start - timedelta(days=start.weekday())
      elif granularity == "MONTH":
          current = start.replace(day=1)
      else:
          current = start

      starts, ends = [], {}
      while current <= end:
          following = next_boundary(current)
          starts.append(current.isoformat())
          ends[current.isoformat()] = following.isoformat()
          current = following
      if len(starts) > 1000:
          raise ValueError(f"{len(starts)} partitions; split the range into smaller backfills")

      Kestra.outputs({"starts": starts, "ends": ends, "count": len(starts)})

  - id: checkpoints_before
    type: io.kestra.plugin.core.debug.Return
    description: Snapshot each partition's checkpoint before this run, to report what was already done.
    format: >-
      { {% for p in outputs.plan.vars.starts %}{{ p | toJson }}: {{ (kv(('backfill_' ~ inputs.backfill_id ~ '_' ~ inputs.job_flow_id ~ '_' ~ p) | slugify, errorOnMissing=false) ?? 'PENDING') | toJson }}, {% endfor %}"_": "" }

  - id: run_partitions
    type: io.kestra.plugin.core.flow.Loop
    description: Run up to two partitions at a time. A failed partition doesn't stop the others; the run fails at the end instead.
    values: "{{ outputs.plan.vars.starts }}"
    concurrencyLimit: 2
    transmitFailed: false
    tasks:
      - id: partition
        type: io.kestra.plugin.core.flow.Sequential
        description: Skip a finished partition, otherwise run the job and record the result.
        tasks:
          - id: skip_or_run
            type: io.kestra.plugin.core.flow.If
            description: A partition checkpointed as SUCCESS is skipped unless `force` is set.
            condition: "{{ not inputs.force and kv(('backfill_' ~ inputs.backfill_id ~ '_' ~ inputs.job_flow_id ~ '_' ~ item.value) | slugify, errorOnMissing=false) == 'SUCCESS' }}"
            then:
              - id: skipped
                type: io.kestra.plugin.core.log.Log
                description: Note the skip in the logs.
                message: "Partition {{ item.value }} already succeeded in backfill {{ inputs.backfill_id }}; skipping."
            else:
              - id: run_job
                type: io.kestra.plugin.core.flow.Subflow
                description: Run the job flow for this partition and wait for it. Its failure fails the partition.
                namespace: "{{ inputs.job_namespace }}"
                flowId: "{{ inputs.job_flow_id }}"
                inputs:
                  partition_start: "{{ item.value }}"
                  partition_end: "{{ outputs.plan.vars.ends[item.value] }}"
                labels:
                  backfill_id: "{{ inputs.backfill_id }}"
                  partition: "{{ item.value }}"

              - id: mark_success
                type: io.kestra.plugin.core.kv.Set
                description: Checkpoint the partition, so later runs of this backfill skip it.
                key: "{{ ('backfill_' ~ inputs.backfill_id ~ '_' ~ inputs.job_flow_id ~ '_' ~ item.value) | slugify }}"
                value: SUCCESS
                kvDescription: "Partition {{ item.value }} of backfill {{ inputs.backfill_id }}, job execution {{ outputs.run_job.executionId }}"
                ttl: P90D
        errors:
          - id: mark_failed
            type: io.kestra.plugin.core.kv.Set
            description: Record the failure, so it shows in the summary and is retried by the next run.
            key: "{{ ('backfill_' ~ inputs.backfill_id ~ '_' ~ inputs.job_flow_id ~ '_' ~ item.value) | slugify }}"
            value: FAILED
            kvDescription: "Partition {{ item.value }} of backfill {{ inputs.backfill_id }} failed in execution {{ execution.id }}"
            ttl: P90D

  - id: summarize
    type: io.kestra.plugin.scripts.python.Script
    description: Compare the checkpoints before and after this run.
    dependencies:
      - kestra
    inputFiles:
      before.json: "{{ outputs.checkpoints_before.value }}"
      after.json: >-
        { {% for p in outputs.plan.vars.starts %}{{ p | toJson }}: {{ (kv(('backfill_' ~ inputs.backfill_id ~ '_' ~ inputs.job_flow_id ~ '_' ~ p) | slugify, errorOnMissing=false) ?? 'PENDING') | toJson }}, {% endfor %}"_": "" }
    script: |
      import json
      from kestra import Kestra

      before = {k: v for k, v in json.load(open("before.json")).items() if k != "_"}
      after = {k: v for k, v in json.load(open("after.json")).items() if k != "_"}
      force = "{{ inputs.force }}" == "true"

      already_done = [] if force else [p for p, s in before.items() if s == "SUCCESS"]
      done_now = [p for p, s in after.items() if s == "SUCCESS" and p not in already_done]
      failed = [p for p, s in after.items() if s == "FAILED"]
      pending = [p for p, s in after.items() if s not in ("SUCCESS", "FAILED")]

      Kestra.outputs({
          "total": len(after),
          "already_done": len(already_done),
          "done_now": len(done_now),
          "failed": failed,
          "failed_count": len(failed),
          "pending_count": len(pending),
          "complete": not failed and not pending,
      })

  - id: notify
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Report the backfill's progress.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: |
      *Backfill `{{ inputs.backfill_id }}`* of `{{ inputs.job_namespace }}.{{ inputs.job_flow_id }}`, {{ inputs.start_date }} to {{ inputs.end_date }} by {{ inputs.granularity | lower }}: {% if outputs.summarize.vars.complete %}*complete*{% else %}*incomplete*{% endif %}.
      {{ outputs.summarize.vars.done_now }} partition(s) done in this run, {{ outputs.summarize.vars.already_done }} already done earlier, {{ outputs.summarize.vars.failed_count }} failed, of {{ outputs.summarize.vars.total }}.
      {% if outputs.summarize.vars.failed_count > 0 %}Failed: {{ outputs.summarize.vars.failed | join(', ') }}. Re-run with backfill ID `{{ inputs.backfill_id }}` to retry only these.{% endif %}

  - id: fail_if_incomplete
    type: io.kestra.plugin.core.execution.Fail
    description: Fail the run while any partition is missing, so the backfill shows as unfinished and alerting picks it up.
    condition: "{{ not outputs.summarize.vars.complete }}"
    errorMessage: "Backfill {{ inputs.backfill_id }} is incomplete: {{ outputs.summarize.vars.failed_count }} failed partition(s) ({{ outputs.summarize.vars.failed | join(', ') }}). Re-run with the same backfill ID to resume."

outputs:
  - id: complete
    type: BOOL
    displayName: Complete
    value: "{{ outputs.summarize.vars.complete }}"
  - id: summary
    type: JSON
    displayName: Summary
    value: |
      {"total": {{ outputs.summarize.vars.total }}, "done_now": {{ outputs.summarize.vars.done_now }}, "already_done": {{ outputs.summarize.vars.already_done }}, "failed": {{ outputs.summarize.vars.failed | toJson }}}

extend:
  shortDescription: Backfill any date-partitioned job by day, week or month with a concurrency limit, KV checkpoints, and resume from the last good partition after a failure.
  title: Safe Backfill Controller with Checkpoints and Resume
  metaTitle: Safe Backfill Controller with Resume
  description: |
    Backfilling a year of data usually means a fragile script looping over dates. When it dies at month seven, someone has to work out what already ran, whether re-running is safe, and how to avoid hammering the source. This blueprint turns any date-partitioned job into a safe, resumable backfill. It splits a date range into partitions, runs your job flow once per partition with a concurrency limit, checkpoints every partition that finishes, and when a run fails, the next run picks up exactly where it stopped.

    Kestra's built-in backfill replays a flow's Schedule trigger over past dates. This controller is for everything else: jobs that take a date range as input, backfills you want to run in parallel with a cap, and long backfills that need to survive failures and resume without redoing finished work.

    ## How it works
    1. `plan` (`io.kestra.plugin.scripts.python.Script`) splits `start_date` to `end_date` into DAY, WEEK or MONTH partitions. Weeks start on Monday and months on the 1st, so partitions line up with how data is usually stored. Each partition has a start and an exclusive end.
    2. `checkpoints_before` (`io.kestra.plugin.core.debug.Return`) snapshots each partition's checkpoint from the KV store, so the summary can tell what was already done.
    3. `run_partitions` (`io.kestra.plugin.core.flow.Loop`) processes two partitions at a time, with `transmitFailed: false` so one failure doesn't stop the rest. For each partition:
       - `skip_or_run` (`io.kestra.plugin.core.flow.If`) skips it if its checkpoint is `SUCCESS`, unless `force` is set.
       - `run_job` (`io.kestra.plugin.core.flow.Subflow`) runs your job flow with `partition_start` and `partition_end`, waits for it, and labels the child execution with the backfill ID and partition.
       - `mark_success` (`io.kestra.plugin.core.kv.Set`) checkpoints the partition. If anything fails, `mark_failed` in the `errors` branch records `FAILED` instead. Checkpoints expire after 90 days.
    4. `summarize` compares the checkpoints before and after, and `notify` posts the result to Slack: done in this run, already done, and failed.
    5. `fail_if_incomplete` (`io.kestra.plugin.core.execution.Fail`) fails the run while any partition is missing, naming the failed partitions and how to resume.
    6. The flow has a `concurrency` limit of 1, so two runs of the controller never process the same backfill at once. A second run waits in the queue.
    7. The `nightly_resume` trigger (`io.kestra.plugin.core.trigger.Schedule`, shipped disabled) re-runs the backfill configured in the input defaults every night. Finished partitions are skipped, so it only retries what's missing, for example data published late.

    This blueprint ships with an example job, `backfill-example-nyc-taxi-monthly`, which computes monthly NYC taxi trip metrics with DuckDB from the public TLC Parquet files. Run it once with the defaults to see a real backfill with no account or setup.

    ## What you get
    - Resumable backfills. Re-run with the same `backfill_id`, and only failed or missing partitions run again.
    - Bounded load on the source system through the loop's concurrency limit.
    - A KV checkpoint per partition, with the job execution that produced it in the description, for auditing.
    - Child executions labeled `backfill_id` and `partition`, so you can filter them in the UI.
    - A Slack summary and a clearly failed run while a backfill is incomplete.
    - The same controller for any job that takes a date range: dbt runs, API extracts, warehouse loads or ML feature builds.

    ## Who it's for
    - Data engineers who backfill pipelines after schema changes, bug fixes or onboarding a new source.
    - Analytics teams rebuilding historical aggregates partition by partition.
    - Platform teams who want a standard, auditable way to run backfills instead of ad hoc scripts.

    ## Why orchestrate this with Kestra
    A backfill is a long-running, failure-prone loop, which is exactly what scripts handle worst. Kestra runs each partition as its own execution with its own logs, retries and labels. It caps parallelism with `concurrencyLimit` and records progress in the KV store, which outlives any single run. A backfill can stop and resume across days. Every partition is visible in the UI, and the job flow stays reusable for daily runs.

    ## Prerequisites
    - A job flow that accepts `partition_start` and `partition_end` as DATE inputs (start inclusive, end exclusive) and is safe to re-run for the same partition. The example job does this by overwriting one KV entry per month.
    - A Slack incoming webhook for the summary.
    - A Kestra worker with Docker available for the Python steps.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the backfill summary.

    ### Inputs
    - `job_namespace` (STRING, default `company.team`): namespace of the job flow.
    - `job_flow_id` (STRING, default `backfill-example-nyc-taxi-monthly`): flow run once per partition.
    - `start_date` (DATE, default `2024-01-01`): first date of the range. The first partition starts at its boundary, for example the 1st of the month.
    - `end_date` (DATE, default `2024-06-30`): last date of the range, inclusive. The last partition is the one containing this date.
    - `granularity` (SELECT `DAY`, `WEEK` or `MONTH`, default `MONTH`): partition size.
    - `backfill_id` (STRING, default `initial-load`): names the checkpoints. Re-use it to resume, or change it to backfill the same range again from scratch.
    - `force` (BOOL, default `false`): re-run every partition, ignoring checkpoints.

    ### Outputs
    - `{{ outputs.complete }}` (flow output): `true` when every partition has succeeded.
    - `{{ outputs.summary }}` (flow output): total partitions, done in this run, already done, and the failed partitions.
    - `{{ outputs.plan.vars.starts }}` and `{{ outputs.plan.vars.ends }}`: the planned partitions.
    - `{{ outputs.run_partitions.terminatedIterations }}`: partition outcomes by state for this run.
    - KV keys `backfill-<backfill_id>-<job_flow_id>-<partition>` with value `SUCCESS` or `FAILED`.

    ## Quick start
    1. Add both flows and the `SLACK_WEBHOOK_URL` secret.
    2. Run `safe-backfill-controller` with the defaults. It backfills January to June 2024 with the example job in under a minute.
    3. Run it again with the same inputs. Every partition is skipped.
    4. To see a resume, backfill a range that ends in months not yet published by NYC TLC. Those partitions fail, the run fails, and a later run with the same `backfill_id` retries only them.
    5. Point `job_namespace` and `job_flow_id` at your own job flow.

    ## How to extend
    - Raise or lower `concurrencyLimit` on `run_partitions` to match what your source can take.
    - Add a `retry` to `run_job` for flaky sources, so transient errors are retried before a partition is marked failed.
    - Pass more inputs to your job through `run_job.inputs`, such as a target table or a dry-run flag.
    - Replace the Slack step with email, Teams or PagerDuty, or add an SLA to alert when a backfill runs too long.
    - Enable `nightly_resume` with your backfill as the input defaults to let it complete itself as late data arrives.

    ## Links
    - Loop task: https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.loop
    - Subflow task: https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.subflow
    - KV store: https://kestra.io/docs/concepts/kv-store
    - Kestra backfills for scheduled flows: https://kestra.io/docs/concepts/backfill

    - This blueprint has been created by [Biplab Bera](https://github.com/bishalbera)
  tags:
    - Data
    - Core
  subTags:
    - Flow Control & Conditions
  ee: false
  demo: false
  metaDescription: Backfill any date-partitioned job with Kestra by day, week or month, with a concurrency limit, KV checkpoints and automatic resume after failures.
