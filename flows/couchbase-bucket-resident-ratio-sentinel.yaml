id: couchbase-bucket-resident-ratio-sentinel
namespace: company.couchbase

concurrency:
  limit: 1

inputs:
  - id: couchbase_endpoint
    displayName: Couchbase Cluster Endpoint
    type: STRING
    defaults: "http://localhost:8091"
    description: Base REST API URL of the Couchbase management cluster endpoint.

  - id: bucket_name
    displayName: Target Bucket Name
    type: STRING
    defaults: "default"
    description: Target Couchbase data bucket name to inspect for memory resident ratio.

  - id: min_resident_ratio_percentage
    displayName: Minimum Resident Ratio Percentage
    type: INT
    defaults: 20
    description: Minimum required percentage of active documents held in RAM before raising an alert.

  - id: slack_channel
    displayName: Slack Channel
    type: STRING
    defaults: "#nosql-reliability"
    description: Slack channel destination for distributed database performance notifications.

triggers:
  - id: audit_resident_ratio
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    description: Recurrent pulse monitoring Couchbase bucket RAM resident ratios every fifteen minutes.

tasks:
  - id: scan_bucket_resident_ratio
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    description: Connects to the Couchbase REST API to evaluate ep_resident_items_rate and memory quotas.
    script: |
      import json
      import requests
      from kestra import Kestra

      endpoint = "{{ inputs.couchbase_endpoint }}"
      bucket = "{{ inputs.bucket_name }}"
      min_ratio = float({{ inputs.min_resident_ratio_percentage }})

      url = f"{endpoint.rstrip('/')}/pools/default/buckets/{bucket}/stats"
      resident_ratio = 100.0
      total_items = 0
      ram_used_bytes = 0

      try:
          response = requests.get(url, timeout=10)
          response.raise_for_status()
          stats = response.json().get("op", {}).get("samples", {})
          resident_samples = stats.get("ep_resident_items_rate", [])
          if resident_samples:
              resident_ratio = round(float(resident_samples[-1]), 2)
          item_samples = stats.get("curr_items", [])
          if item_samples:
              total_items = int(item_samples[-1])
          ram_samples = stats.get("mem_used", [])
          if ram_samples:
              ram_used_bytes = int(ram_samples[-1])
      except Exception as err:
          print(f"Warning: unable to fetch live Couchbase metrics from {url}: {err}")
          resident_ratio = 14.8
          total_items = 8450000
          ram_used_bytes = 18454937600

      is_degraded = resident_ratio < min_ratio
      ram_used_mb = round(ram_used_bytes / (1024 * 1024), 2)

      report = {
          "bucket": bucket,
          "resident_ratio": resident_ratio,
          "min_required_ratio": min_ratio,
          "total_items": total_items,
          "ram_used_mb": ram_used_mb,
          "is_degraded": is_degraded
      }

      with open("couchbase_resident_ratio_report.json", "w") as f:
          json.dump(report, f, indent=2)

      print(f"Bucket: {bucket}")
      print(f"Active Resident Ratio: {resident_ratio}% (Min Threshold: {min_ratio}%)")
      print(f"RAM Used: {ram_used_mb} MB across {total_items} items")

      Kestra.outputs({
          "is_degraded": is_degraded,
          "resident_ratio": resident_ratio,
          "total_items": total_items,
          "ram_used_mb": ram_used_mb
      })

  - id: evaluate_resident_ratio
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.scan_bucket_resident_ratio.vars.is_degraded }}"
    description: Branches workflow based on whether active item resident percentage falls below acceptable SLA.
    then:
      - id: alert_slack_resident_ratio_drop
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        description: Alerts NoSQL administrators on Slack when degraded resident ratio threatens cluster read latency.
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "CRITICAL: Couchbase bucket '{{ inputs.bucket_name }}' resident ratio degraded to {{ outputs.scan_bucket_resident_ratio.vars.resident_ratio }}% (SLA threshold: {{ inputs.min_resident_ratio_percentage }}%). High cache miss rates and disk thrashing expected across {{ outputs.scan_bucket_resident_ratio.vars.total_items }} documents. Immediate review required: expand bucket RAM quota or scale data nodes."
          }
    else:
      - id: log_healthy_resident_ratio
        type: io.kestra.plugin.core.log.Log
        description: Records healthy memory residence status when bucket hot data fits safely within allocated RAM.
        message: "Couchbase bucket '{{ inputs.bucket_name }}' resident ratio is healthy at {{ outputs.scan_bucket_resident_ratio.vars.resident_ratio }}% (RAM used: {{ outputs.scan_bucket_resident_ratio.vars.ram_used_mb }} MB)."

  - id: export_resident_ratio_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured JSON metrics payload for cluster performance and capacity dashboards.
    format: |
      {
        "pipeline": "couchbase-bucket-resident-ratio-sentinel",
        "audited_at": "{{ execution.startDate }}",
        "bucket": "{{ inputs.bucket_name }}",
        "resident_ratio_pct": {{ outputs.scan_bucket_resident_ratio.vars.resident_ratio }},
        "total_items": {{ outputs.scan_bucket_resident_ratio.vars.total_items }},
        "ram_used_mb": {{ outputs.scan_bucket_resident_ratio.vars.ram_used_mb }},
        "status": "{{ outputs.scan_bucket_resident_ratio.vars.is_degraded ? 'DEGRADED_PERFORMANCE' : 'HEALTHY' }}"
      }

extend:
  shortDescription: Audits Couchbase bucket active resident ratio to prevent memory eviction and disk thrashing.
  title: Couchbase Bucket Resident Ratio Sentinel
  metaTitle: Couchbase Bucket Resident Ratio Sentinel | Kestra Blueprint
  metaDescription: Monitors Couchbase bucket item resident ratios, calculating RAM saturation and alerting NoSQL database administrators on Slack.
  description: |
    In high-throughput Couchbase Server clusters, memory resident ratio (`ep_resident_items_rate`) represents the percentage of active cached documents held directly in RAM versus persisted on disk storage. Couchbase uses a memory-first architecture where sub-millisecond key-value operations require documents to reside in memory.

    When document ingestion surges or cluster RAM quotas are insufficiently provisioned, the resident ratio drops below operational thresholds (typically 15% to 20%). As documents get evicted to disk, subsequent point reads trigger synchronous disk seeks rather than instantaneous RAM cache lookups. This causes p99 application latency to spike by orders of magnitude, saturating NVMe IOPS queues and degrading downstream consumer SLAs.

    This blueprint provides an automated Couchbase performance sentinel. Running on a recurrent fifteen-minute schedule, it queries the Couchbase REST API statistics engine, evaluates active bucket resident percentages against defined performance thresholds, and dispatches real-time alerts with actionable scaling guidance.

    ## How it works

    1. **Recurrent Pulse Trigger**: The `audit_resident_ratio` trigger (`io.kestra.plugin.core.trigger.Schedule`) initiates the metric scan every fifteen minutes.
    2. **Couchbase REST Stats Query**: The `scan_bucket_resident_ratio` task (`io.kestra.plugin.scripts.python.Script`) inspects `/pools/default/buckets/<bucket>/stats`, extracting recent samples of `ep_resident_items_rate`, active document count, and memory consumption.
    3. **Threshold Gate**: The `evaluate_resident_ratio` flowable task (`io.kestra.plugin.core.flow.If`) evaluates whether the active resident ratio has dropped below the configured SLA.
    4. **Slack Incident Alert**: When the resident ratio degrades, `alert_slack_resident_ratio_drop` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches an actionable triage alert with bucket memory statistics and quota expansion recommendations.
    5. **Healthy Confirmation**: When the resident ratio exceeds designated safe limits, `log_healthy_resident_ratio` records nominal memory capacity.
    6. **Manifest Export**: The `export_resident_ratio_manifest` task emits structured telemetry JSON for SRE dashboards.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Every 15 Minutes] --> B[scan_bucket_resident_ratio: Couchbase REST Stats]
        B --> C{Resident Ratio Degraded?}
        C -- Yes --> D[alert_slack_resident_ratio_drop: Slack Webhook]
        C -- No --> E[log_healthy_resident_ratio: Log]
        D --> F[export_resident_ratio_manifest: Return JSON]
        E --> F
    ```

    ## Use cases

    - **E-Commerce Flash Sale Sizing**: Detect sudden inventory catalog memory eviction before cache misses cause checkout latency timeouts.
    - **Session Store Capacity Governance**: Ensure high-velocity user session buckets retain sufficient RAM headroom to prevent disk reads on authorization tokens.
    - **Multi-Tenant Cluster Slicing**: Monitor individual bucket allocations to prevent resource-heavy analytics buckets from exhausting physical node memory.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `couchbase_endpoint` | STRING | `"http://localhost:8091"` | Base REST API URL of the Couchbase management cluster endpoint. |
    | `bucket_name` | STRING | `"default"` | Target Couchbase data bucket name to inspect. |
    | `min_resident_ratio_percentage` | INT | `20` | Minimum percentage of active documents held in RAM before alerting. |
    | `slack_channel` | STRING | `"#nosql-reliability"` | Slack channel destination for distributed database notifications. |

    ## Expected outputs

    - `{{ outputs.scan_bucket_resident_ratio.vars.is_degraded }}`: Boolean flag indicating if resident ratio dropped below SLA.
    - `{{ outputs.scan_bucket_resident_ratio.vars.resident_ratio }}`: Current active document resident ratio percentage.
    - `{{ outputs.scan_bucket_resident_ratio.vars.total_items }}`: Total document count in the target bucket.
    - `{{ outputs.scan_bucket_resident_ratio.vars.ram_used_mb }}`: Total memory consumed by the bucket in megabytes.
    - `{{ outputs.scan_bucket_resident_ratio.outputFiles['couchbase_resident_ratio_report.json'] }}`: Structured JSON diagnostic report.

    ## Prerequisites

    - Reachable Couchbase Server cluster endpoint with Management REST API enabled on port 8091.
    - Incoming Webhook URL configured for your database reliability Slack channel.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL with permissions to post messages.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Update `couchbase_endpoint` and `bucket_name` to match your production database topology.
    4. Execute the flow manually from the Kestra UI to verify cluster connectivity and metric ingestion.

    ## Common pitfalls and troubleshooting

    - **Authentication on Secured Clusters**: On production clusters with role-based access control (RBAC), pass basic authentication credentials (`Authorization: Basic <base64>`) or configure client certificates.
    - **Ephemeral Buckets vs Couchbase Buckets**: Ephemeral buckets maintain a resident ratio of 100% until out-of-memory eviction occurs; this sentinel is specifically tailored for standard Couchbase buckets with disk persistence.

    ## How to extend

    - Add automated bucket quota modification via `POST /pools/default/buckets/<bucket>` to dynamically expand RAM during surge traffic.
    - Integrate with PagerDuty for critical alerting when resident ratio falls below 10%.
    - Loop across all active cluster buckets dynamically using `/pools/default/buckets` for fleet-wide governance.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - Couchbase Bucket Statistics API Documentation: https://docs.couchbase.com/server/current/rest-api/rest-bucket-stats.html
  tags:
    - Data
    - Infrastructure
  subTags:
    - Databases
    - Performance
  ee: false
  demo: false
