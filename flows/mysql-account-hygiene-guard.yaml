id: mysql-account-hygiene-guard
namespace: company.team

description: |
  Audit MySQL accounts in mysql.user for the findings security reviews ask about: anonymous
  accounts, accounts with an empty password, root reachable from remote hosts, global admin
  privileges (SUPER, FILE, SHUTDOWN, CREATE USER, GRANT OPTION) outside an allowlist, and
  accounts open to every host. Alert Slack, and optionally drop, lock or revoke with generated
  statements, never touching the account the flow is connected as, then audit again to verify.

inputs:
  - id: jdbc_url
    type: STRING
    displayName: JDBC URL
    defaults: "jdbc:mysql://localhost:3306/mysql"

  - id: privileged_accounts
    type: ARRAY
    itemType: STRING
    displayName: Accounts allowed admin privileges
    description: As user@host.
    defaults:
      - "root@localhost"

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    description: Drop anonymous accounts, lock empty-password and remote root accounts, revoke global admin privileges. Wildcard hosts are only reported.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, for any statement to run.
    defaults: true

variables:
  audit_sql: |
    WITH acc AS (
      SELECT CONVERT(u.User USING utf8mb4) AS user_name, CONVERT(u.Host USING utf8mb4) AS host,
             CONVERT(CONCAT(QUOTE(u.User), '@', QUOTE(u.Host)) USING utf8mb4) AS account,
             CONVERT(CONCAT(u.User, '@', u.Host) USING utf8mb4) AS id, u.authentication_string = '' AS empty_password, u.account_locked = 'Y' AS locked,
             CONVERT(CONCAT_WS(', ',
               IF(u.Super_priv = 'Y', 'SUPER', NULL), IF(u.File_priv = 'Y', 'FILE', NULL), IF(u.Shutdown_priv = 'Y', 'SHUTDOWN', NULL),
               IF(u.Create_user_priv = 'Y', 'CREATE USER', NULL), IF(u.Grant_priv = 'Y', 'GRANT OPTION', NULL)) USING utf8mb4) AS admin_privs,
             CONVERT(CONCAT(u.User, '@', u.Host) USING utf8mb4) = CONVERT(CURRENT_USER() USING utf8mb4) AS is_self
        FROM mysql.user u
       WHERE u.User NOT IN ('mysql.infoschema', 'mysql.session', 'mysql.sys')
    )
    SELECT * FROM (
      SELECT 'ANONYMOUS_ACCOUNT' AS finding, 'HIGH' AS severity, id, is_self, 'Any user name can log in from this host' AS detail,
             CONCAT('DROP USER ', account) AS fix_sql FROM acc WHERE user_name = ''
      UNION ALL
      SELECT 'EMPTY_PASSWORD', 'HIGH', id, is_self, 'Account with no password', CONCAT('ALTER USER ', account, ' ACCOUNT LOCK')
        FROM acc WHERE empty_password AND NOT locked AND user_name <> ''
      UNION ALL
      SELECT 'REMOTE_ROOT', 'HIGH', id, is_self, CONCAT('root can log in from ', host), CONCAT('ALTER USER ', account, ' ACCOUNT LOCK')
        FROM acc WHERE user_name = 'root' AND host NOT IN ('localhost', '127.0.0.1', '::1') AND NOT locked
      UNION ALL
      SELECT 'GLOBAL_ADMIN_PRIVILEGES', 'HIGH', id, is_self, CONCAT('Global ', admin_privs),
             CONCAT('REVOKE IF EXISTS ', admin_privs, ' ON *.* FROM ', account)
        FROM acc WHERE admin_privs <> '' AND user_name <> 'root' AND id NOT IN ({{ inputs.privileged_accounts | jq('map("\u0027" + gsub("\u0027"; "\u0027\u0027") + "\u0027") | join(",")') | first }})
      UNION ALL
      SELECT 'WILDCARD_HOST', 'MEDIUM', id, is_self, 'Can connect from any host (%)', NULL
        FROM acc WHERE host = '%' AND user_name NOT IN ('', 'root')
    ) f
    ORDER BY severity, finding, id

tasks:
  - id: audit
    type: io.kestra.plugin.jdbc.mysql.Query
    description: Read-only query on mysql.user. Statements quote names with QUOTE(), and the connecting account is flagged so it is never changed.
    url: "{{ inputs.jdbc_url }}"
    username: "{{ secret('MYSQL_USERNAME') }}"
    password: "{{ secret('MYSQL_PASSWORD') }}"
    fetchType: FETCH
    sql: "{{ render(vars.audit_sql) }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      MySQL account audit on {{ inputs.jdbc_url }}: {{ outputs.audit.size }} findings.
      {% for r in outputs.audit.rows %}{{ r.severity }} {{ r.finding }} {{ r.id }}{{ r.is_self ? ' (connected account, never changed)' : '' }}: {{ r.detail }}. {% endfor %}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit.size > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'MySQL account audit on ' ~ inputs.jdbc_url ~ ': ' ~ (outputs.audit.rows | jq('map("\(.severity) \(.finding) \(.id)") | join(", ")') | first) ~ '.' ~ (inputs.auto_remediate and not inputs.dry_run ? ' Applying the fixes now.' : ' No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run and outputs.audit.rows | jq('map(select(.fix_sql != null and (.is_self | tostring) != \"1\" and (.is_self | tostring) != \"true\")) | length') | first > 0 }}"
        then:
          - id: remediate
            type: io.kestra.plugin.core.flow.Loop
            concurrencyLimit: 1
            description: One statement per finding, each isolated. The connecting account is skipped.
            values: "{{ outputs.audit.rows | jq('map(select(.fix_sql != null and (.is_self | tostring) != \"1\" and (.is_self | tostring) != \"true\") | .fix_sql)') | first | toJson }}"
            tasks:
              - id: fix
                type: io.kestra.plugin.jdbc.mysql.Query
                allowFailure: true
                url: "{{ inputs.jdbc_url }}"
                username: "{{ secret('MYSQL_USERNAME') }}"
                password: "{{ secret('MYSQL_PASSWORD') }}"
                fetchType: NONE
                sql: "{{ item.value }}"

          - id: reaudit
            type: io.kestra.plugin.jdbc.mysql.Query
            url: "{{ inputs.jdbc_url }}"
            username: "{{ secret('MYSQL_USERNAME') }}"
            password: "{{ secret('MYSQL_PASSWORD') }}"
            fetchType: FETCH
            sql: "{{ render(vars.audit_sql) }}"

          - id: verify_result
            type: io.kestra.plugin.core.flow.If
            description: Every finding that was fixed must be gone from the second audit.
            condition: >-
              {{ {'b': outputs.audit.rows, 'a': outputs.reaudit.rows ?? []} | jq('([.a[] | .finding + "|" + .id]) as $a
                 | [.b[] | select(.fix_sql != null and (.is_self | tostring) != "1" and (.is_self | tostring) != "true") | .finding + "|" + .id | select(. as $x | $a | index($x))] | length') | first > 0 }}
            then:
              - id: remediation_failed
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: "Some fixes did not take: {{ outputs.reaudit.rows | jq('map(\"\\(.finding) \\(.id)\") | join(\", \")') | first }}. The connecting account may lack CREATE USER or GRANT OPTION."
            else:
              - id: remediated
                type: io.kestra.plugin.core.log.Log
                message: >-
                  Fixed and verified: {{ outputs.audit.rows | jq('map(select(.fix_sql != null and (.is_self | tostring) != "1" and (.is_self | tostring) != "true") | .fix_sql) | join("; ")') | first }}.
                  Left for review: {{ outputs.reaudit.rows | jq('if length == 0 then "none" else map("\(.finding) \(.id)") | join(", ") end') | first }}.
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "No account finding."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'MySQL account audit failed on ' ~ inputs.jdbc_url ~ ' (execution ' ~ execution.id ~ '). Treat the accounts as unaudited.'} | toJson }}

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled, and always in safe mode.
    cron: "0 6 * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: MySQL Account Hygiene Guard
  shortDescription: Audit MySQL accounts for anonymous users, empty passwords, remote root, global admin privileges and wildcard hosts, alert Slack, and optionally drop, lock or revoke and verify, never touching the connected account.
  metaTitle: MySQL Account Hygiene Guard with Kestra
  metaDescription: Find anonymous MySQL accounts, empty passwords, remote root and global admin privileges, alert Slack, drop, lock or revoke and re-audit.
  description: |
    MySQL servers that have been running for a few years have accounts nobody remembers:
    - an anonymous `''@'localhost'` left from an old install;
    - a reporting user created with an empty password;
    - `root@'%'` added to debug from a laptop;
    - a legacy ETL account with `ALL PRIVILEGES ON *.* WITH GRANT OPTION`, which can read every file the server can and create new admins.

    This blueprint reads `mysql.user` every day, flags those accounts and alerts Slack. It can generate and run the fixes one by one, then audit again to verify. The account the flow itself connects with is reported, but never changed, so a fix cannot lock the flow out halfway through.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Findings

    | Finding | Severity | Rule | Fix |
    |---|---|---|---|
    | `ANONYMOUS_ACCOUNT` | High | Account with an empty user name | `DROP USER` |
    | `EMPTY_PASSWORD` | High | Unlocked account with no password | `ALTER USER ... ACCOUNT LOCK` |
    | `REMOTE_ROOT` | High | `root` allowed from a host other than localhost | `ALTER USER ... ACCOUNT LOCK` |
    | `GLOBAL_ADMIN_PRIVILEGES` | High | Global `SUPER`, `FILE`, `SHUTDOWN`, `CREATE USER` or `GRANT OPTION` outside `privileged_accounts` | `REVOKE IF EXISTS` of exactly those privileges, the others are kept |
    | `WILDCARD_HOST` | Medium | Non-root account allowed from `%` | Report only |

    Account names are quoted with `QUOTE()` inside MySQL. A finding on `CURRENT_USER()` is marked as the connected account and skipped.

    ## How it works

    1. `audit` (`io.kestra.plugin.jdbc.mysql.Query`, read-only) runs one query on `mysql.user` that returns every finding with its fix statement. MySQL's own system accounts (`mysql.sys`, `mysql.session`, `mysql.infoschema`) are excluded.
    2. `summary` logs every finding.
    3. `route` (`io.kestra.plugin.core.flow.If`):
       - **clean:** logs it.
       - **findings:** `alert` posts to Slack.
         - `remediate_gate` runs only when `auto_remediate` is true and `dry_run` is false.
         - `remediate` (`io.kestra.plugin.core.flow.Loop`) runs each fix in its own `Query`, so one failure does not stop the others.
         - `reaudit` runs the same audit again, and `verify_result` fails if a fixed finding is still there.
    4. `errors` alerts Slack when the audit cannot run.

    ## What you get

    - A daily list of the risky accounts on each server, with the reason each one matters.
    - Fixes that are as narrow as possible: locking instead of dropping a named account, and revoking only the admin privileges.
    - Protection against locking out the account that runs the audit, and a second audit as proof.

    ## Who it's for

    - DBAs and platform teams responsible for MySQL servers that predate their current access policy.
    - Security and compliance teams that need evidence that anonymous, passwordless and over-privileged accounts are gone.
    - Teams evaluating the MySQL plugin who want an example of a catalog query driving account changes.

    ## Why orchestrate this with Kestra

    The query is easy to run once. Kestra runs it every day on every server, sends findings to Slack, gates the fixes behind `auto_remediate` and `dry_run`, isolates each statement, verifies the result, and keeps an execution history as evidence for audits.

    ## Tested end to end

    On Kestra 2.0.5 OSS against MySQL 8.4, with a local HTTP sink standing in for Slack. The flow connected as `root@'%'`. Seeded accounts:
    - an anonymous `''@'localhost'`, and `reporting@'%'` with an empty password;
    - `legacy_etl@'%'` with `ALL ON *.* WITH GRANT OPTION`, and `dba_tom@'%'` with `SUPER, FILE`;
    - a restricted `app@'10.0.%'`, and a `backup@localhost` with `RELOAD, PROCESS`.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | defaults | 8 findings. `root@%` reported as the connected account. `app` and `backup` not flagged. Alert sent |
    | 2 | `auto_remediate: true`, `dry_run: true` | Same report. The anonymous account is still in `mysql.user` |
    | 3 | `auto_remediate: true`, `dry_run: false` | 4 statements run and verified: anonymous dropped, `reporting` locked, admin privileges revoked from `dba_tom` and `legacy_etl`. Then in MySQL: `reporting` gets `Account is locked`, `legacy_etl` still reads but `SHUTDOWN` is denied. `root@%` untouched |
    | 4 | same again | Only `root@%` and the wildcard hosts left, nothing run |
    | 5 | unreachable server | `errors` alert sent |

    ## Prerequisites

    - A MySQL 8.0.30 or later server (for `REVOKE IF EXISTS`), reachable from the Kestra worker.
    - For the audit, `SELECT` on `mysql.user`. For remediation, `CREATE USER` and the privileges to revoke, with `GRANT OPTION`.
    - Local testing: `docker run -d --name mysql -p 3306:3306 -e MYSQL_ROOT_PASSWORD=pw mysql:8.4`, then create a few accounts.

    ### Secrets

    - `MYSQL_USERNAME` / `MYSQL_PASSWORD`: credentials used by every query.
    - `SLACK_WEBHOOK_URL`: used by `alert` and the `errors` block.
    - In Kestra OSS, provide each one as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `jdbc_url` | `jdbc:mysql://localhost:3306/mysql` | Server |
    | `privileged_accounts` | `[root@localhost]` | Accounts allowed admin privileges |
    | `auto_remediate` | `false` | Allow fixes |
    | `dry_run` | `true` | Must be `false` for a statement to run |

    ## Quick start

    1. Create a dedicated audit account, so the flow never relies on `root`. Add `MYSQL_USERNAME`, `MYSQL_PASSWORD` and `SLACK_WEBHOOK_URL` as secrets.
    2. Import the flow and set `jdbc_url` and `privileged_accounts`.
    3. Run it once and read the findings.
    4. Check which applications use a flagged account, then run with `auto_remediate: true` and `dry_run: false`.
    5. Enable the `daily` trigger, which always runs in safe mode.

    ## How to extend

    - Loop over a list of JDBC URLs to audit every server in one execution.
    - Add dynamic privileges (`SYSTEM_VARIABLES_ADMIN`, `BINLOG_ADMIN`...) from `mysql.global_grants` to the admin rule.
    - Flag accounts with no password expiry, or that have not changed their password in a year (`password_last_changed`).
    - Ask for approval with a `Pause` before locking accounts on production.

    ## Links

    - MySQL account management: https://dev.mysql.com/doc/refman/8.4/en/account-management-statements.html
    - MySQL plugin: https://kestra.io/plugins/plugin-jdbc-mysql
  tags:
    - Data
    - Infrastructure
  subTags:
    - Policy & Compliance
    - Day 2 Operations
  ee: false
  demo: false
