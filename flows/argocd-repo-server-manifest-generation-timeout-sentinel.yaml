    - [Argo CD Prometheus Metrics Catalog](https://argo-cd.readthedocs.io/en/stable/operator-manual/metrics/)
    - [Optimizing Argo CD Monorepo Performance](https://argo-cd.readthedocs.io/en/stable/operator-manual/high_availability/#argocd-repo-server)
