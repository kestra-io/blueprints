id: grpc-microservice-health-probe-sentinel
namespace: company.sre

inputs:
  - id: grpc_host
    type: STRING
    defaults: "grpcb.in"
    description: "Target gRPC service hostname or IP address"

  - id: grpc_port
    type: INT
    defaults: 9000
    description: "gRPC service listening port"

  - id: service_name
    type: STRING
    defaults: ""
    description: "Specific gRPC service name to probe, or empty string to check overall server health"

  - id: timeout_seconds
    type: INT
    defaults: 5
    description: "Timeout in seconds for the gRPC health probe invocation"

  - id: alert_on_unhealthy
    type: BOOL
    defaults: true
    description: "Whether to dispatch a high-priority alert card to Slack when the service is degraded or unreachable"

triggers:
  - id: scheduled_health_probe
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Periodic synthetic gRPC health audit executed every 5 minutes"
    cron: "*/5 * * * *"
    disabled: true

tasks:
  - id: probe_grpc_endpoint
    type: io.kestra.plugin.scripts.shell.Commands
    description: "Executes standard grpc-health-probe against the target gRPC service using the official container"
    warningOnStdErr: false
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: ghcr.io/grpc-ecosystem/grpc-health-probe:v0.4.38
    commands:
      - |
        SERVICE_ARG=""
        if [ -n "{{ inputs.service_name }}" ]; then
          SERVICE_ARG="-service={{ inputs.service_name }}"
        fi

        STATUS="UNKNOWN"
        OUTPUT_LOG="/tmp/grpc_probe.log"

        set +e
        /ko-app/grpc-health-probe \
          -addr="{{ inputs.grpc_host }}:{{ inputs.grpc_port }}" \
          -connect-timeout="{{ inputs.timeout_seconds }}s" \
          -rpc-timeout="{{ inputs.timeout_seconds }}s" \
          ${SERVICE_ARG} > "$OUTPUT_LOG" 2>&1
        EXIT_CODE=$?
        set -e

        if [ $EXIT_CODE -eq 0 ]; then
          STATUS="SERVING"
        elif [ $EXIT_CODE -eq 1 ]; then
          STATUS="NOT_SERVING"
        elif [ $EXIT_CODE -eq 2 ]; then
          STATUS="CONNECTION_FAILURE"
        elif [ $EXIT_CODE -eq 3 ]; then
          STATUS="TIMEOUT"
        else
          STATUS="UNHEALTHY"
        fi

        RAW_MSG=$(cat "$OUTPUT_LOG" | tr '\n' ' ')
        echo "::{\"outputs\": {\"status\": \"$STATUS\", \"exit_code\": $EXIT_CODE, \"probe_output\": \"$RAW_MSG\"}}::"

  - id: evaluate_service_health
    type: io.kestra.plugin.core.flow.If
    description: "Evaluates probe results and conditionally escalates unreachable or degraded gRPC services"
    condition: "{{ inputs.alert_on_unhealthy and outputs.probe_grpc_endpoint.vars.status != 'SERVING' }}"
    then:
      - id: alert_grpc_outage_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Dispatches incident alert card to the SRE channel"
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#sre-alerts",
            "text": ":rotating_light: *gRPC Service Outage Detected* :rotating_light:\n*Target:* `{{ inputs.grpc_host }}:{{ inputs.grpc_port }}`\n*Service Name:* `{{ inputs.service_name == '' ? 'DEFAULT_ROOT' : inputs.service_name }}`\n*Probe Status:* `{{ outputs.probe_grpc_endpoint.vars.status }}`\n*Details:* {{ outputs.probe_grpc_endpoint.vars.probe_output }}\n*Execution:* {{ execution.id }}"
          }

  - id: log_operational_status
    type: io.kestra.plugin.core.log.Log
    description: "Logs the consolidated gRPC probe results for audit trail and SLA tracking"
    message: "gRPC synthetic health audit finished for {{ inputs.grpc_host }}:{{ inputs.grpc_port }}. Status: {{ outputs.probe_grpc_endpoint.vars.status }} (exit code: {{ outputs.probe_grpc_endpoint.vars.exit_code }})."

extend:
  title: gRPC Microservice Health Probe Sentinel
  shortDescription: Execute synthetic gRPC health checks using the official grpc-health-probe standard and alert on unreachable or non-serving services.
  metaTitle: gRPC Microservice Health Probe and Outage Sentinel with Kestra
  metaDescription: Run synthetic gRPC health checks with grpc-health-probe, detect service connectivity drops, and alert SRE teams on Slack via Kestra.
  description: |
    ## How it works
    Standard HTTP pingers and TCP socket checks cannot verify the internal status of gRPC services running behind HTTP/2 endpoints. This blueprint implements an operational sentinel using the official `grpc-health-probe` standard (`grpc.health.v1.Health` service):

    1. **Execute Synthetic Probe**: Runs the official `grpc-health-probe` binary inside an isolated Docker container against the specified gRPC host and port.
    2. **State Classification**: Differentiates clean operation (`SERVING`), service-level degradation (`NOT_SERVING`), network connection drops (`CONNECTION_FAILURE`), and deadline timeouts (`TIMEOUT`).
    3. **Incident Routing**: When the target endpoint fails health verification, an automated Slack alert is sent to SRE on-call engineers with exit codes and error logs.
    4. **Audit Logging**: Emits clean audit log events tracking endpoint health over time for SLA verification.

    ## What you get
    - Native containerized gRPC health checking without writing custom Go or Python client code.
    - Automated incident routing on Slack with exact probe failure classifications.
    - Periodic execution tracking providing historical uptime records in the Kestra UI.

    ## Who it's for
    - Site Reliability Engineers (SREs) and Platform Engineers operating microservice architectures.
    - Teams using gRPC, Envoy, or Kubernetes service meshes needing continuous black-box probing.

    ## Why orchestrate this with Kestra
    Kestra coordinates scheduled container execution, captures standard outputs into workflow variables, executes conditional logic, and dispatches incident alerts without requiring dedicated synthetic monitoring infrastructure.

    ## Prerequisites
    - A gRPC service implementing standard gRPC health checking (`grpc.health.v1.Health`).
    - A Slack Incoming Webhook URL.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Your Slack Incoming Webhook URL.

    ## Quick start
    Set the `grpc_host` and `grpc_port` in the flow inputs, configure your `SLACK_WEBHOOK_URL` secret, and trigger execution.

    ## How to extend
    You can extend this workflow to automatically restart failed Kubernetes pods via the Kubernetes plugin, or cycle backend instances behind an AWS Network Load Balancer when a health probe fails consecutively.

    ## Links
    - [Official grpc-health-probe](https://github.com/grpc-ecosystem/grpc-health-probe)
    - [gRPC Health Checking Protocol](https://github.com/grpc/grpc/blob/master/doc/health-checking.md)
    - [Slack Plugin documentation](https://kestra.io/plugins/plugin-slack)
  subTags:
    - Monitoring & Alerting
  tags:
    - Infrastructure
    - Cloud
    - Core
  ee: false
  demo: false
