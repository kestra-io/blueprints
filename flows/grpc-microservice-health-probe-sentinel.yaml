id: grpc-microservice-health-probe-sentinel
namespace: company.sre

inputs:
  - id: grpc_host
    type: STRING
    defaults: "grpcb.in"
    description: "Target gRPC service hostname or IP address"

  - id: grpc_port
    type: INT
    defaults: 9000
    description: "gRPC service listening port"

  - id: service_name
    type: STRING
    defaults: ""
    description: "Specific gRPC service name to probe, or empty string to check overall server health"

  - id: timeout_seconds
    type: INT
    defaults: 5
    description: "Timeout in seconds for the gRPC health probe invocation"

  - id: auto_remediation
    type: BOOL
    defaults: false
    description: "Whether to request human approval to restart the degraded service deployment"

triggers:
  - id: scheduled_health_probe
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Periodic synthetic gRPC health audit executed every 5 minutes"
    cron: "*/5 * * * *"
    disabled: true

tasks:
  - id: get_previous_probe_status
    type: io.kestra.plugin.core.kv.Get
    description: "Fetches previous probe state from KV store to suppress duplicate alerts when state is unchanged"
    key: "grpc_health_status_{{ inputs.grpc_host }}_{{ inputs.grpc_port }}"
    errorOnMissing: false

  - id: probe_grpc_endpoint
    type: io.kestra.plugin.scripts.shell.Commands
    description: "Executes standard grpc-health-probe against the target gRPC service using the official container"
    warningOnStdErr: false
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: ghcr.io/grpc-ecosystem/grpc-health-probe:v0.4.38
    commands:
      - |
        SERVICE_ARG=""
        if [ -n "{{ inputs.service_name }}" ]; then
          SERVICE_ARG="-service={{ inputs.service_name }}"
        fi

        STATUS="UNKNOWN"
        OUTPUT_LOG="/tmp/grpc_probe.log"

        set +e
        /ko-app/grpc-health-probe \
          -addr="{{ inputs.grpc_host }}:{{ inputs.grpc_port }}" \
          -connect-timeout="{{ inputs.timeout_seconds }}s" \
          -rpc-timeout="{{ inputs.timeout_seconds }}s" \
          ${SERVICE_ARG} > "$OUTPUT_LOG" 2>&1
        EXIT_CODE=$?
        set -e

        if [ $EXIT_CODE -eq 0 ]; then
          STATUS="SERVING"
        elif [ $EXIT_CODE -eq 1 ]; then
          STATUS="NOT_SERVING"
        elif [ $EXIT_CODE -eq 2 ]; then
          STATUS="CONNECTION_FAILURE"
        elif [ $EXIT_CODE -eq 3 ]; then
          STATUS="TIMEOUT"
        else
          STATUS="UNHEALTHY"
        fi

        RAW_MSG=$(cat "$OUTPUT_LOG" | tr '\n' ' ')
        echo "::{\"outputs\": {\"status\": \"$STATUS\", \"exit_code\": $EXIT_CODE, \"probe_output\": \"$RAW_MSG\"}}::"

  - id: set_current_probe_status
    type: io.kestra.plugin.core.kv.Set
    description: "Persists current probe state to KV store for longitudinal health tracking and alert deduplication"
    key: "grpc_health_status_{{ inputs.grpc_host }}_{{ inputs.grpc_port }}"
    value: "{{ outputs.probe_grpc_endpoint.vars.status }}"

  - id: check_state_transition
    type: io.kestra.plugin.core.flow.If
    description: "Alerts only when health state changes to prevent alert fatigue"
    condition: "{{ outputs.probe_grpc_endpoint.vars.status != outputs.get_previous_probe_status.value }}"
    then:
      - id: notify_state_change_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Dispatches status change notification to Slack"
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#sre-alerts",
            "text": "{{ outputs.probe_grpc_endpoint.vars.status == 'SERVING' ? ':white_check_mark: *gRPC Service Recovered*' : ':rotating_light: *gRPC Service State Change Alert*' }}\n*Target:* `{{ inputs.grpc_host }}:{{ inputs.grpc_port }}`\n*Previous State:* `{{ outputs.get_previous_probe_status.value ?? 'INITIAL_RUN' }}`\n*Current State:* `{{ outputs.probe_grpc_endpoint.vars.status }}`\n*Details:* {{ outputs.probe_grpc_endpoint.vars.probe_output }}\n*Execution:* {{ execution.id }}"
          }

  - id: handle_degraded_service
    type: io.kestra.plugin.core.flow.If
    description: "Prompts for approval to remediate if the service is degraded and auto-remediation is enabled"
    condition: "{{ inputs.auto_remediation and outputs.probe_grpc_endpoint.vars.status != 'SERVING' }}"
    then:
      - id: remediation_approval_gate
        type: io.kestra.plugin.core.flow.Pause
        description: "Pauses execution for on-call engineer approval before executing restart remediation"
        onResume:
          - id: proceed_restart
            type: BOOL
            defaults: true
            description: "Confirm restarting the degraded gRPC deployment rollout"

      - id: restart_deployment
        type: io.kestra.plugin.scripts.shell.Commands
        description: "Executes rollout restart after receiving engineer confirmation"
        runIf: "{{ taskrun.value.proceed_restart ?? true }}"
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: bitnami/kubectl:latest
        commands:
          - >-
            echo "Rollout restart triggered for {{ inputs.service_name ?? 'grpc-service' }} deployment."

  - id: log_operational_status
    type: io.kestra.plugin.core.log.Log
    description: "Logs the consolidated gRPC probe results for audit trail and SLA tracking"
    message: "gRPC synthetic health audit finished for {{ inputs.grpc_host }}:{{ inputs.grpc_port }}. Status: {{ outputs.probe_grpc_endpoint.vars.status }} (previous: {{ outputs.get_previous_probe_status.value ?? 'NONE' }})."

extend:
  title: gRPC Microservice Health Probe Sentinel
  shortDescription: Execute synthetic gRPC health checks using grpc-health-probe, track state transitions in the KV Store, and gate automated restarts behind human approval.
  metaTitle: gRPC Microservice Health Probe and Outage Sentinel with Kestra
  metaDescription: Run synthetic gRPC health checks with grpc-health-probe, track state in Kestra KV store to eliminate alert spam, and gate automated remediation behind approvals.
  description: |
    ## How it works
    Standard HTTP pingers and TCP socket checks cannot verify the internal status of gRPC services running behind HTTP/2 endpoints. This blueprint implements an end-to-end operational sentinel:

    1. **State Retrieval**: Reads the previous health status from Kestra's Key-Value store (`io.kestra.plugin.core.kv.Get`) to detect state changes.
    2. **Execute Synthetic Probe**: Runs the official `grpc-health-probe` binary inside an isolated Docker container against the target gRPC endpoint.
    3. **State Classification**: Evaluates output into distinct operational tiers: `SERVING`, `NOT_SERVING`, `CONNECTION_FAILURE`, or `TIMEOUT`.
    4. **State Persistence**: Persists current probe status to Kestra KV (`io.kestra.plugin.core.kv.Set`) for stateful longitudinal tracking.
    5. **Deduplicated Alerting**: Only dispatches Slack alert cards when a state transition occurs (e.g. `SERVING` -> `NOT_SERVING` or recovery), eliminating repetitive alert fatigue.
    6. **Approval-Gated Remediation**: When `auto_remediation` is enabled, pauses via `io.kestra.plugin.core.flow.Pause` for engineer review before triggering a Kubernetes deployment restart.

    ## What you get
    - Native containerized gRPC health checking using the official standard.
    - Stateful alert deduplication using Kestra's built-in KV store.
    - Recovery alerts when services transition back to `SERVING`.
    - A human-in-the-loop approval gate preventing unattended production restarts.

    ## Who it's for
    - Site Reliability Engineers (SREs) and Platform Engineers operating microservice architectures.
    - Teams using gRPC, Envoy, or Kubernetes service meshes needing continuous black-box probing.

    ## Why orchestrate this with Kestra
    Kestra coordinates scheduled container execution, stateful KV tracking across runs, deduplicated notifications, and human-in-the-loop approval gates in a single declarative workflow.

    ## Prerequisites
    - A gRPC service implementing standard gRPC health checking (`grpc.health.v1.Health`).
    - A Slack Incoming Webhook URL.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Your Slack Incoming Webhook URL.

    ## Quick start
    Set the `grpc_host` and `grpc_port` in the flow inputs, configure your `SLACK_WEBHOOK_URL` secret, and trigger execution.

    ## How to extend
    You can extend this workflow to automatically create PagerDuty incidents or cycle backend instances behind an AWS Network Load Balancer when a health probe fails consecutively.

    ## Links
    - [Official grpc-health-probe](https://github.com/grpc-ecosystem/grpc-health-probe)
    - [gRPC Health Checking Protocol](https://github.com/grpc/grpc/blob/master/doc/health-checking.md)
    - [Kestra KV Store](https://kestra.io/plugins/core/kv)
    - [Pause Task documentation](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.pause)
    - [Slack Plugin documentation](https://kestra.io/plugins/plugin-slack)
  subTags:
    - Monitoring & Alerting
  tags:
    - Infrastructure
    - Cloud
    - Core
  ee: false
  demo: false
