id: shellcheck-shell-script-security-and-posix-compliance-gate
namespace: company.platform

description: |
  Audits Bash and POSIX shell scripts for security vulnerabilities, word-splitting
  bugs, unhandled exit codes, and syntax flaws using ShellCheck in a containerized
  deployment gate. Blocks pipelines when critical issues or antipatterns are found.

inputs:
  - id: scripts_bundle
    type: FILE
    displayName: Scripts Archive Bundle
    description: A tar.gz, zip, or single .sh file containing the shell script(s) to audit. Used during manual execution or Subflow chaining; ignored when the webhook trigger fires, which supplies the bundle instead.

  - id: severity_threshold
    type: SELECT
    displayName: Severity Threshold
    values:
      - "style"
      - "info"
      - "warning"
      - "error"
    defaults: "warning"
    description: Minimum severity level that triggers gate evaluation. Findings at or above this level are flagged.

  - id: shell_dialect
    type: SELECT
    displayName: Target Shell Dialect
    values:
      - "bash"
      - "sh"
      - "dash"
      - "ksh"
    defaults: "bash"
    description: Shell dialect to enforce for syntax parsing and POSIX compatibility checks.

  - id: fail_on_violations
    type: BOOL
    displayName: Fail Gate on Violations
    defaults: true
    description: When true, halts the deployment gate with an execution failure if errors or warnings exceeding the severity threshold are detected.

  - id: slack_channel
    type: STRING
    displayName: Slack Notification Channel
    defaults: "#devsecops-alerts"
    description: Slack channel destination for ShellCheck security violation alerts.

triggers:
  - id: pull_request_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: "Webhook endpoint called by CI/CD pipelines (GitHub Actions, GitLab CI) on pull request creation or update to lint modified shell scripts. fetchType: STORE streams the POST body into Kestra's internal storage and exposes it as the safe trigger.uri reference, rather than as raw trigger.body text, which the Webhook trigger's own documentation warns is untrusted input unsafe to interpolate into a script task's commands."
    key: "{{ secret('SHELLCHECK_GATE_WEBHOOK_KEY') }}"
    fetchType: STORE
    disabled: true

tasks:
  - id: run_shellcheck_scan
    type: io.kestra.plugin.scripts.shell.Commands
    description: Execute ShellCheck static analysis inside an official container against target scripts, exporting findings in JSON and human-readable formats.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: koalaman/shellcheck:stable
    allowFailure: true
    outputFiles:
      - "shellcheck-report.json"
      - "shellcheck-summary.txt"
    commands:
      - |
        mkdir -p /workspace/scripts
        BUNDLE_PATH="{{ trigger.uri is defined ? trigger.uri : inputs.scripts_bundle }}"

        if [[ "${BUNDLE_PATH}" == *.tar.gz ]] || [[ "${BUNDLE_PATH}" == *.tgz ]]; then
          tar -xzf "${BUNDLE_PATH}" -C /workspace/scripts
        elif [[ "${BUNDLE_PATH}" == *.zip ]]; then
          unzip -q "${BUNDLE_PATH}" -d /workspace/scripts
        else
          cp "${BUNDLE_PATH}" /workspace/scripts/
        fi

        set +e
        shellcheck --format=json1 --shell={{ inputs.shell_dialect }} /workspace/scripts/*.sh > shellcheck-report.json 2>&1
        shellcheck --format=tty --shell={{ inputs.shell_dialect }} /workspace/scripts/*.sh > shellcheck-summary.txt 2>&1 || true

        if [ ! -s shellcheck-report.json ]; then
          echo '{"comments": []}' > shellcheck-report.json
        fi

  - id: evaluate_findings
    type: io.kestra.plugin.scripts.python.Script
    description: Parse ShellCheck JSON report, group comments by severity level, filter against severity threshold, and construct structured violation details.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    inputFiles:
      shellcheck-report.json: "{{ read(outputs.run_shellcheck_scan.outputFiles['shellcheck-report.json']) }}"
    outputFiles:
      - "analysis_summary.json"
    script: |
      import json
      import sys

      with open("shellcheck-report.json", "r") as f:
          try:
              raw_data = json.load(f)
          except Exception:
              raw_data = {"comments": []}

      if isinstance(raw_data, dict) and "comments" in raw_data:
          comments = raw_data["comments"]
      elif isinstance(raw_data, list):
          comments = raw_data
      else:
          comments = []

      threshold = "{{ inputs.severity_threshold }}".lower()
      severity_rank = {"style": 1, "info": 2, "warning": 3, "error": 4}
      min_rank = severity_rank.get(threshold, 3)

      filtered = []
      counts = {"error": 0, "warning": 0, "info": 0, "style": 0}

      for c in comments:
          lvl = c.get("level", "info").lower()
          counts[lvl] = counts.get(lvl, 0) + 1
          if severity_rank.get(lvl, 1) >= min_rank:
              code_num = c.get("code", 0)
              filtered.append({
                  "file": c.get("file", "unknown"),
                  "line": c.get("line", 0),
                  "column": c.get("column", 0),
                  "level": lvl,
                  "code": f"SC{code_num}",
                  "message": c.get("message", ""),
                  "wiki_url": f"https://www.shellcheck.net/wiki/SC{code_num}"
              })

      if filtered:
          if any(c["level"] in ["error", "warning"] for c in filtered):
              verdict = "VIOLATIONS_FOUND"
          else:
              verdict = "ADVISORY_ONLY"
      else:
          verdict = "PASSED"

      summary = {
          "verdict": verdict,
          "total_violations": len(filtered),
          "error_count": counts.get("error", 0),
          "warning_count": counts.get("warning", 0),
          "info_count": counts.get("info", 0),
          "style_count": counts.get("style", 0),
          "violations": filtered[:25]
      }

      with open("analysis_summary.json", "w") as f:
          json.dump(summary, f, indent=2)

      print(f"ShellCheck Evaluation: {verdict}")
      print(f"Errors: {counts.get('error', 0)}, Warnings: {counts.get('warning', 0)}, Total Exceeding Threshold: {len(filtered)}")

  - id: route_gate_verdict
    type: io.kestra.plugin.core.flow.Switch
    description: Route execution based on evaluated ShellCheck compliance verdict.
    value: "{{ fromJson(read(outputs.evaluate_findings.outputFiles['analysis_summary.json'])).verdict }}"
    cases:
      "VIOLATIONS_FOUND":
        - id: alert_violations
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Alert engineering and security teams when critical shell script violations or security bugs are detected.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": ":rotating_light: *ShellCheck Security & Compliance Violations Detected*",
              "attachments": [
                {
                  "color": "#D32F2F",
                  "title": "Shell Script Static Analysis Gate Failure",
                  "fields": [
                    {
                      "title": "Severity Threshold",
                      "value": "`{{ inputs.severity_threshold }}`",
                      "short": true
                    },
                    {
                      "title": "Total Violations",
                      "value": "{{ fromJson(read(outputs.evaluate_findings.outputFiles['analysis_summary.json'])).total_violations }}",
                      "short": true
                    },
                    {
                      "title": "Errors / Warnings",
                      "value": "{{ fromJson(read(outputs.evaluate_findings.outputFiles['analysis_summary.json'])).error_count }} error(s), {{ fromJson(read(outputs.evaluate_findings.outputFiles['analysis_summary.json'])).warning_count }} warning(s)",
                      "short": true
                    },
                    {
                      "title": "Target Dialect",
                      "value": "`{{ inputs.shell_dialect }}`",
                      "short": true
                    },
                    {
                      "title": "Flagged Rule Codes",
                      "value": "{{ fromJson(read(outputs.evaluate_findings.outputFiles['analysis_summary.json'])).violations | jq('[.[].code] | unique | join(", ")') }}",
                      "short": false
                    },
                    {
                      "title": "Remediation",
                      "value": "Review `shellcheck-summary.txt` execution artifact or visit the ShellCheck wiki links to resolve flagged antipatterns before merging.",
                      "short": false
                    }
                  ],
                  "footer": "Kestra ShellCheck Compliance Gate"
                }
              ]
            }

        - id: check_fail_gate
          type: io.kestra.plugin.core.flow.If
          description: Evaluate whether workflow execution should halt when violations are detected.
          condition: "{{ inputs.fail_on_violations }}"
          then:
            - id: fail_gate
              type: io.kestra.plugin.core.execution.Fail
              description: Halt execution and block CI/CD pipeline due to shell script security violations.
              errorMessage: "ShellCheck compliance gate failed: {{ fromJson(read(outputs.evaluate_findings.outputFiles['analysis_summary.json'])).total_violations }} violations detected exceeding severity threshold '{{ inputs.severity_threshold }}'."

      "ADVISORY_ONLY":
        - id: log_advisories
          type: io.kestra.plugin.core.log.Log
          description: Log informational findings when analysis detects non-blocking advisory or style recommendations.
          message: "ShellCheck analysis passed with non-blocking advisories: {{ fromJson(read(outputs.evaluate_findings.outputFiles['analysis_summary.json'])).info_count }} informational finding(s) noted."

      "PASSED":
        - id: log_clean_compliance
          type: io.kestra.plugin.core.log.Log
          description: Confirm full POSIX and shell security compliance when zero violations are detected.
          message: "ShellCheck security and POSIX compliance verified. Zero violations detected across scanned shell scripts."

extend:
  title: ShellCheck Shell Script Security & POSIX Compliance Gate
  metaTitle: ShellCheck Script Security & POSIX Compliance Gate | Kestra
  shortDescription: Audit Bash and POSIX shell scripts for security vulnerabilities, unquoted expansions, and syntax flaws with ShellCheck and Kestra.
  metaDescription: Audit Bash and POSIX shell scripts for security vulnerabilities, word-splitting bugs, and syntax errors with ShellCheck and Kestra deployment gates.
  description: |
    Automate ShellCheck static analysis, shell script security auditing, and POSIX compliance enforcement with Kestra orchestration. Shell scripts (`*.sh`) form the backbone of container entrypoints, CI/CD runners, infrastructure automation, and operational cron tasks across enterprise environments.

    Despite their ubiquity, shell scripts are notoriously susceptible to catastrophic defects. Unquoted variable expansions (`cp -r $SRC/* $DST/`) lead to unintended word splitting and destructive globbing when directories contain whitespace. Masked exit codes in local declarations (`local var=$(failing_cmd)`) silently bypass `set -e` error handling, and unhandled `cd` commands can cause subsequent commands to run in root or unintended directories.

    This blueprint executes official `koalaman/shellcheck:stable` container analysis against uploaded script archives or repository scripts. It translates findings into structured JSON metrics, filters issues against a configurable severity threshold, alerts engineering channels via Slack with links to ShellCheck wiki remediations, and gates CI/CD pipelines to prevent defective scripts from reaching production.

    ## How it works

    1. `pull_request_webhook` (`io.kestra.plugin.core.trigger.Webhook`) lets a CI pipeline POST a pull request's changed scripts directly to this flow. `fetchType: STORE` streams that POST body into Kestra's internal storage and exposes it as `trigger.uri`, a safe file reference, rather than as raw `trigger.body` text, which the trigger's own documentation flags as untrusted input unsafe to interpolate into a script task's `commands`. Running this flow manually or as a `Subflow` instead uses the `scripts_bundle` input, the same kind of safe file reference.
    2. `run_shellcheck_scan` (`io.kestra.plugin.scripts.shell.Commands`) unpacks the target shell scripts inside a container running `koalaman/shellcheck:stable`. It executes ShellCheck with `--format=json1` and `--format=tty`, capturing output into `shellcheck-report.json` and `shellcheck-summary.txt`.
    3. `evaluate_findings` (`io.kestra.plugin.scripts.python.Script`) parses the JSON report, categorizes issues by severity level (`error`, `warning`, `info`, `style`), and filters issues against `severity_threshold`. It enriches each violation with the ShellCheck wiki URL (e.g., `SC2086`, `SC2164`) and writes `analysis_summary.json`.
    4. `route_gate_verdict` (`io.kestra.plugin.core.flow.Switch`) evaluates the verdict:
       - **`VIOLATIONS_FOUND`**: `alert_violations` posts a Slack card with the flagged rule codes, file locations, and remediation links. If `fail_on_violations` is enabled, `fail_gate` (`io.kestra.plugin.core.execution.Fail`) halts execution to block deployment.
       - **`ADVISORY_ONLY`**: `log_advisories` logs non-blocking recommendations (style and info level) without interrupting deployment.
       - **`PASSED`**: `log_clean_compliance` confirms zero violations and logs successful compliance verification.

    ## What you get

    - Automated prevention of destructive word-splitting and globbing vulnerabilities in deployment scripts.
    - Detection of silent exit code masking that bypasses `set -e` failure handling in automation pipelines.
    - Direct markdown links to the ShellCheck wiki explaining exact root causes and code corrections for every flagged rule.
    - Automated Slack alerts notifying on-call engineers and developers with file paths and line numbers.
    - Gated CI/CD pull request validation preventing unvetted shell scripts from merging into main branches.

    ## Who it's for

    - Platform Engineers and DevOps teams maintaining container entrypoints and bootstrap automation.
    - SREs enforcing reliability and error-handling standards across operational runbooks.
    - Security Engineers implementing DevSecOps guardrails in continuous delivery pipelines.

    ## Why orchestrate this with Kestra

    Running ShellCheck in standalone CI scripts often results in fragmented pipeline configurations across different repositories, unparsed console logs, and lost historical execution traces.

    Orchestrating this with Kestra provides a centralized webhook endpoint, containerized execution without local tool installations, structured JSON metric extraction, conditional Slack routing, and full execution history with downloadable artifact logs.

    ## Prerequisites

    - A Kestra instance with access to run container tasks via Docker.
    - A Slack Incoming Webhook URL for dispatching compliance alerts.
    - A shell script, or a tar.gz/zip archive of scripts, to audit — either uploaded as `scripts_bundle` or POSTed to the webhook by a CI pipeline.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to dispatch violation notifications.
    - `SHELLCHECK_GATE_WEBHOOK_KEY`: Secret authentication key securing the incoming webhook trigger endpoint.

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret, and `SHELLCHECK_GATE_WEBHOOK_KEY` if you plan to enable the webhook.
    2. Write a test script containing an unquoted expansion (e.g. `cp -r $SRC/* $DST/`) and upload it as `scripts_bundle`, run the flow, and confirm the gate blocks on the flagged rule code.
    3. Either enable `pull_request_webhook` and have your CI pipeline `curl --data-binary @script.sh` the webhook URL on each pull request, or wire a `Subflow` task pointing at this flow into your pipeline.

    ## How to extend

    - **Inline GitHub PR Comments**: Pair with `io.kestra.plugin.github.issues.Comment` or the GitHub REST API to post line-by-line review comments directly on pull requests.
    - **Automated Patch Generation**: Use `shellcheck --format=diff` to generate unified diff patches that developers can apply directly with `git apply`.
    - **Custom ShellCheckrc**: Pass a repository-specific `.shellcheckrc` file to customize excluded rules (e.g., `--exclude=SC1090`) across different project directories.

    ## Links

    - [ShellCheck Documentation & Gallery](https://www.shellcheck.net/)
    - [ShellCheck GitHub Repository](https://github.com/koalaman/shellcheck)
    - [Kestra Shell Plugin Documentation](https://kestra.io/plugins/plugin-scripts)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Day 2 Operations
  ee: false
  demo: false
