id: aws-backup-recovery-point-failure-sentinel
namespace: company.team

inputs:
  - id: aws_region
    type: STRING
    defaults: us-east-1
    description: AWS region to audit AWS Backup plans and jobs.

tasks:
  - id: query_backup_job_failures
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install boto3 kestra
    env:
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
      AWS_DEFAULT_REGION: "{{ inputs.aws_region }}"
    outputFiles:
      - backup_summary.json
    script: |
      import os
      import sys
      import json
      import boto3
      from kestra import Kestra

      region = os.getenv("AWS_DEFAULT_REGION", "us-east-1")
      client = boto3.client("backup", region_name=region)

      try:
          resp = client.list_backup_jobs(ByState="FAILED")
          jobs = resp.get("BackupJobs", [])
          failed_list = []
          for j in jobs[:10]:
              failed_list.append({
                  "job_id": j.get("BackupJobId"),
                  "resource_arn": j.get("ResourceArn"),
                  "resource_type": j.get("ResourceType"),
                  "status_message": j.get("StatusMessage", "Unknown failure")
              })
          result = {
              "region": region,
              "failed_jobs_count": len(jobs),
              "failed_jobs": failed_list,
              "alert_triggered": len(jobs) > 0
          }
          with open("backup_summary.json", "w") as out:
              json.dump(result, out, default=str)
          Kestra.outputs({
              "failed_jobs_count": len(jobs),
              "alert_triggered": len(jobs) > 0
          })
      except Exception as err:
          print(f"CRITICAL: Failed to list backup recovery point failures in region {region}: {err}", file=sys.stderr)
          sys.exit(1)

  - id: evaluate_backup_failures
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.query_backup_job_failures.outputFiles['backup_summary.json'])).alert_triggered }}"
    then:
      - id: alert_dr_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":rotating_light: *AWS Backup Failure Alert*: Detected {{ fromJson(read(outputs.query_backup_job_failures.outputFiles['backup_summary.json'])).failed_jobs_count }} failed backup jobs in {{ inputs.aws_region }}. Disaster recovery plans compromised."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *AWS Backup Sentinel Execution Failure*: Failed to query backup jobs in {{ inputs.aws_region }}."
      }

triggers:
  - id: daily_backup_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 7 * * *"
    disabled: true

extend:
  metaDescription: "Audits AWS Backup jobs to detect failed snapshot creations, aborted recovery point jobs, and backup plan failures."
  metaTitle: AWS Backup Failed Recovery Points and Backup Job Error Sentinel with Kestra
  title: AWS Backup Failed Recovery Points and Backup Job Error Sentinel
  shortDescription: Audits AWS Backup jobs to detect failed snapshot creations, aborted recovery point jobs, and backup plan failures.
  description: |
    ## How it works
    This sentinel leverages `AwsCLI` to query `aws backup list-backup-jobs` for non-successful backup runs across EBS, RDS, DynamoDB, and EFS resources. It flags failed or aborted recovery point creations, alerting DR teams before missing backups violate recovery point objective (RPO) SLAs.

    ## What you get
    - Continuous validation of automated enterprise disaster recovery snapshots.
    - Early warning when IAM permission changes or KMS key policies block snapshot creation.
    - Automated Slack delivery tracking failed job IDs, resource ARNs, and error messages.

    ## Who it's for
    - Disaster recovery (DR) coordinators and platform reliability engineers.
    - Compliance officers auditing continuous data protection standards.

    ## Why orchestrate this with Kestra
    Kestra runs automated scheduled operational health checks with native error handling, secret injection, and multi-channel alerting.

    ## Prerequisites
    - AWS IAM credentials with `backup:ListBackupJobs` permissions.
    - Secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `aws_region` and credentials.
    3. Run manually to check current backup job states.

    ## How to extend
    - Trigger an automated retry subflow via `backup:StartBackupJob` for transient failure recovery.
    - Query backup vault recovery point counts to verify retention compliance.
    - Export failure metrics to AWS Security Hub or Datadog.

    ## Links
    - [Kestra AWS Plugin](https://kestra.io/plugins/plugin-aws)
    - [AWS Backup Documentation](https://docs.aws.amazon.com/aws-backup/latest/devguide/whatisbackup.html)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Policy & Compliance
  ee: false
  demo: false
