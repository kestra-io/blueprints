id: neon-branch-lifecycle-and-compute-sentinel
namespace: company.finops

tasks:
  - id: list_neon_branches
    type: io.kestra.plugin.fs.http.Request
    uri: "https://console.neon.tech/api/v2/projects/{{ secret('NEON_PROJECT_ID') }}/branches"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('NEON_API_KEY') }}"
      Accept: "application/json"

  - id: audit_stale_branches
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.12-slim
    script: |
      import json
      from datetime import datetime, timezone, timedelta
      from kestra import Kestra

      raw_data = """{{ outputs.list_neon_branches.body }}"""
      try:
          parsed = json.loads(raw_data) if raw_data else {}
      except Exception:
          parsed = {}

      branches = parsed.get("branches", [])
      now = datetime.now(timezone.utc)
      stale_branches = []

      # Audit preview/ephemeral branches older than TTL threshold (default 48 hours)
      for b in branches:
          b_name = b.get("name", "")
          # Skip primary/main production branch
          if b.get("primary", False) or b_name in ["main", "master", "production"]:
              continue

          created_str = b.get("created_at", "")
          if created_str:
              try:
                  created_dt = datetime.fromisoformat(created_str.replace("Z", "+00:00"))
                  age_hours = (now - created_dt).total_seconds() / 3600
                  if age_hours > 48:
                      stale_branches.append({
                          "id": b.get("id"),
                          "name": b_name,
                          "age_hours": round(age_hours, 1)
                      })
              except Exception:
                  pass

      print(f"Total branches inspected: {len(branches)}. Stale candidates: {len(stale_branches)}")
      Kestra.outputs({
          "total_count": len(branches),
          "stale_count": len(stale_branches),
          "stale_branches": stale_branches,
          "has_stale": len(stale_branches) > 0
      })

  - id: check_stale_threshold
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_stale_branches.vars.has_stale }}"
    then:
      - id: notify_slack_finops
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":money_with_wings: *Neon Ephemeral Branch FinOps Alert*\nProject ID: `{{ secret('NEON_PROJECT_ID') }}`\nDetected `{{ outputs.audit_stale_branches.vars.stale_count }}` orphaned feature branch(es) older than 48 hours.\nReview and prune to optimize compute costs."
          }

  - id: log_finops_audit
    type: io.kestra.plugin.core.log.Log
    message: "Neon branch lifecycle sentinel check completed. Inspected: {{ outputs.audit_stale_branches.vars.total_count }}, Stale: {{ outputs.audit_stale_branches.vars.stale_count }}"

triggers:
  - id: daily_finops_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * *"

extend:
  title: Neon Serverless Branch Lifecycle and Compute Sentinel
  metaTitle: Neon Branch Lifecycle and FinOps Sentinel | Kestra
  shortDescription: Automated supervision of ephemeral Neon database branches to prevent compute cost drift.
  metaDescription: Audit stale Neon PostgreSQL branches, enforce branch lifecycles, and alert engineering teams via Slack to prevent compute drift with Kestra.
  description: |
    Automated supervision, lifecycle enforcement, and cost optimization for ephemeral Neon serverless PostgreSQL feature branches.

    ## How it works

    1. A daily schedule initiates the inspection workflow at 08:00 UTC.
    2. An HTTP request task queries the Neon REST API to enumerate all active project branches.
    3. An inline Python script evaluates branch age against configured retention thresholds (excluding primary production branches).
    4. A conditional flow gate determines whether orphaned or stale branches exceed the 48-hour TTL.
    5. A Slack alert is dispatched to the FinOps/Platform team with a summary of candidates eligible for pruning.
    6. Audit telemetry is recorded in the execution log for compliance and cost attribution.

    ## What you get

    - Automated discovery of orphaned preview databases created by CI/CD pipelines.
    - Proactive prevention of unexpected compute and storage cost sprawl.
    - Centralized visibility into serverless database branch lifecycles across teams.

    ## Who it's for

    - Platform Engineers and DevOps teams managing ephemeral preview environments.
    - FinOps practitioners tracking cloud database infrastructure spend.
    - Data Engineers leveraging branching workflows for schema testing.

    ## Why orchestrate this with Kestra

    - Declarative, schedule-driven automation without maintaining dedicated server daemons.
    - Secure secret management for Neon API credentials and Slack webhooks.
    - Detailed execution logs and visual topology tracking every audit cycle.

    ## Prerequisites

    - A Neon serverless account and target project identifier.
    - A Slack Incoming Webhook for dispatching notifications.

    ### Secrets

    - `NEON_PROJECT_ID`: Alphanumeric project identifier from the Neon console.
    - `NEON_API_KEY`: Neon personal API token with project inspection permissions.
    - `SLACK_WEBHOOK_URL`: Target webhook endpoint for engineering alerts.

    ## Quick start

    1. Configure `NEON_PROJECT_ID`, `NEON_API_KEY`, and `SLACK_WEBHOOK_URL` in your namespace secrets.
    2. Import this blueprint into your Kestra instance and trigger an execution.
    3. Review the execution output in the topology view and enable the daily schedule.

    ## How to extend

    - Add an automated branch deletion task to directly prune stale databases after human approval.
    - Export branch cost metrics to a central BigQuery or Snowflake warehouse.
    - Trigger notifications through Microsoft Teams or PagerDuty.

    ## Links

    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-fs/tasks/io.kestra.plugin.fs.http.request)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-notifications/tasks/slack/io.kestra.plugin.notifications.slack.slackincomingwebhook)
    - [Neon API Documentation](https://neon.tech/docs/reference/api-reference)
  tags:
    - Cloud
  subTags:
    - FinOps & Cost Management
    - Day 2 Operations
  ee: false
  demo: false
