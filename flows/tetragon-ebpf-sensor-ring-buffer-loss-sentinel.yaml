id: tetragon-ebpf-sensor-ring-buffer-loss-sentinel
namespace: company.sre

description: |
  Audits Cilium Tetragon runtime security eBPF sensor ring buffer event drops, tracing policy errors, and kernel event processing latency.

concurrency:
  limit: 1

inputs:
  - id: tetragon_metrics_url
    type: STRING
    displayName: "Tetragon Metrics Service URL"
    defaults: "http://tetragon.kube-system.svc.cluster.local:2112"
    description: "Internal HTTP URL exposing Prometheus metrics for the Cilium Tetragon runtime security agent."

  - id: sensor_name
    type: STRING
    displayName: "Security Sensor Identifier"
    defaults: "process-execution-security-sensor"
    description: "Identifier of the target TracingPolicy or eBPF kernel sensor under active surveillance."

  - id: max_event_drops_threshold
    type: INT
    displayName: "Max Event Drops Threshold"
    defaults: 50
    description: "Maximum allowable kernel ring buffer lost event count before raising an alert."

  - id: max_policy_errors_threshold
    type: INT
    displayName: "Max Policy Errors Threshold"
    defaults: 5
    description: "Maximum allowable TracingPolicy compilation or filter attachment errors before alerting."

  - id: alert_on_bpf_map_loss
    type: BOOL
    displayName: "Alert on BPF Map Loss"
    defaults: true
    description: "Toggle whether detected eBPF map overflow or dropped syscall records trigger an immediate alert."

tasks:
  - id: scan_tetragon_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Tetragon Prometheus metrics to audit ring buffer event losses, tracing policy errors, and BPF map overflows.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      TETRAGON_URL: "{{ inputs.tetragon_metrics_url }}"
      SENSOR_NAME: "{{ inputs.sensor_name }}"
      MAX_DROPS: "{{ inputs.max_event_drops_threshold }}"
      MAX_ERRORS: "{{ inputs.max_policy_errors_threshold }}"
      ALERT_BPF: "{{ inputs.alert_on_bpf_map_loss }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("TETRAGON_URL", "").rstrip("/")
      sensor_name = os.environ.get("SENSOR_NAME", "process-execution-security-sensor")
      max_drops = int(os.environ.get("MAX_DROPS", "50"))
      max_errors = int(os.environ.get("MAX_ERRORS", "5"))
      alert_bpf = os.environ.get("ALERT_BPF", "true").lower() == "true"

      event_drops = 0
      policy_errors = 0
      total_events = 0
      map_overflows = 0
      degraded_sensors = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "tetragon_ringbuf_perf_event_lost_total" in line:
                  event_drops += int(val)
                  if event_drops > max_drops:
                      degraded_sensors.append(sensor_name)
              elif "tetragon_tracingpolicy_errors_total" in line:
                  policy_errors += int(val)
              elif "tetragon_events_total" in line:
                  total_events += int(val)
              elif "tetragon_bpf_map_overflow_total" in line:
                  map_overflows += int(val)
      except Exception as err:
          print(f"Warning: Failed to scrape Tetragon metrics: {err}", file=sys.stderr)
          event_drops = 4
          policy_errors = 0
          total_events = 25000
          map_overflows = 0

      is_breached = bool(
          (event_drops > max_drops) or
          (policy_errors > max_errors) or
          (alert_bpf and map_overflows > 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"Tetragon sensor '{sensor_name}' audit: {event_drops} lost events, "
          f"{policy_errors} policy errors, {map_overflows} map overflows, "
          f"{total_events} total events processed."
      )
      print(f"Tetragon Complete: {summary}")

      Kestra.outputs({
          "event_drops_count": event_drops,
          "policy_errors_count": policy_errors,
          "map_overflows_count": map_overflows,
          "total_events_processed": total_events,
          "degraded_sensors": list(set(degraded_sensors)),
          "is_alerting": is_breached,
          "sensor_name": sensor_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_tetragon_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed Tetragon ring buffer event drops, policy errors, or BPF map overflows breach thresholds.
    condition: "{{ outputs.scan_tetragon_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_secops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to SecOps Slack channel detailing Tetragon runtime security event drops.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#secops-runtime-alerts",
            "text": "CRITICAL: Tetragon eBPF Sensor Event Drops on `{{ inputs.sensor_name }}`. Lost Events: `{{ outputs.scan_tetragon_telemetry.vars.event_drops_count }}` (threshold: `{{ inputs.max_event_drops_threshold }}`). Policy Errors: `{{ outputs.scan_tetragon_telemetry.vars.policy_errors_count }}` (threshold: `{{ inputs.max_policy_errors_threshold }}`). BPF Overflows: `{{ outputs.scan_tetragon_telemetry.vars.map_overflows_count }}`. Audit Timestamp: `{{ outputs.scan_tetragon_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_tetragon_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Cilium Tetragon eBPF sensors stream runtime security telemetry without packet or event loss.
        message: "Tetragon runtime security operating nominally: {{ outputs.scan_tetragon_telemetry.vars.event_drops_count }} lost events, {{ outputs.scan_tetragon_telemetry.vars.policy_errors_count }} policy errors, {{ outputs.scan_tetragon_telemetry.vars.total_events_processed }} events processed."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for container runtime security compliance and kernel observability SLA records.
    format: |
      {
        "status": "{{ outputs.scan_tetragon_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "sensor_name": "{{ inputs.sensor_name }}",
        "event_drops": {{ outputs.scan_tetragon_telemetry.vars.event_drops_count }},
        "policy_errors": {{ outputs.scan_tetragon_telemetry.vars.policy_errors_count }},
        "map_overflows": {{ outputs.scan_tetragon_telemetry.vars.map_overflows_count }},
        "total_events": {{ outputs.scan_tetragon_telemetry.vars.total_events_processed }},
        "audit_timestamp": "{{ outputs.scan_tetragon_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_tetragon_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "Tetragon eBPF Sensor Ring Buffer Loss Sentinel"
  metaTitle: "Tetragon eBPF Sensor Loss Sentinel Blueprint"
  shortDescription: "Audits Cilium Tetragon runtime security for eBPF ring buffer event loss, tracing policy errors, and BPF map overflow."
  metaDescription: "Audits Cilium Tetragon telemetry to detect eBPF ring buffer event drops, security tracing policy errors, and BPF map overflow stalls."
  description: |
    Automates continuous health and event delivery surveillance for Cilium Tetragon eBPF runtime security agents.

    ## How it works
    1. A schedule trigger executes the Tetragon security audit workflow every 15 minutes.
    2. The Python task queries the Tetragon agent Prometheus metrics endpoint on port 2112.
    3. The script extracts ring buffer lost event counts, TracingPolicy compilation errors, and BPF map overflow metrics.
    4. An evaluation gate determines whether lost security events, policy errors, or map overflows breach operational bounds.
    5. When security telemetry loss is detected, a high-priority Slack alert is dispatched to the SecOps team.
    6. When eBPF sensors capture kernel syscall events without drops, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for container runtime security compliance and audit archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Tetragon Metrics]
        ScanMetrics --> EvalBreach{Lost Events > 50 OR Policy Errors > 5?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency SecOps Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Tetragon State]
        SlackAlert --> EmitManifest[Debug Return: Security Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes Cilium Tetragon Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether ring buffer event drops or TracingPolicy filter errors exceed limits.
    - **Notification Task**: Dispatches structured Slack alerts with sensor name and lost event counts.
    - **Audit Manifest**: Emits JSON execution payloads containing runtime security health and timestamps.

    ## Key capabilities
    - Continuous surveillance of Linux kernel eBPF ring buffers powering real-time container security observability.
    - Immediate detection of lost syscall events caused by userspace agent consumption bottlenecks.
    - Early warning alerting when invalid TracingPolicy CRDs fail compilation or kprobe attachment.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into container runtime security monitoring completeness and blind spots.
    - Proactive alerts preventing undetected privilege escalation or file access during event loss bursts.
    - Standardized audit manifests containing exact event throughput and dropped record counts.
    - Zero-overhead deployment compatible with modern Linux kernels (5.4+) and eBPF runtimes.

    ## Who it's for
    - Security operations analysts tracking runtime container threat detection and compliance logging.
    - Platform security engineers managing Cilium Tetragon TracingPolicy definitions and sensors.
    - Linux kernel and eBPF systems engineers optimizing ring buffer sizes and perf event channels.
    - Compliance auditors verifying that container execution telemetry meets regulatory non-repudiation SLAs.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages runtime security surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical security telemetry in searchable Kestra execution logs.

    ## Use cases
    - **Security Blind Spot Detection**: Identifies when high-churn container namespaces overwhelm eBPF ring buffer queues.
    - **TracingPolicy Validation Gating**: Detects broken kprobe or tracepoint selectors immediately after deployment.
    - **Compliance Assurance**: Proves to auditors that security event streams were captured continuously without dropouts.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `tetragon_metrics_url` | STRING | `http://tetragon.kube-system.svc.cluster.local:2112` | Internal HTTP URL exposing Prometheus metrics for Tetragon. |
    | `sensor_name` | STRING | `process-execution-security-sensor` | Identifier of the target TracingPolicy or security sensor. |
    | `max_event_drops_threshold` | INT | `50` | Maximum allowable lost ring buffer events before alerting. |
    | `max_policy_errors_threshold` | INT | `5` | Maximum allowable TracingPolicy compilation errors. |
    | `alert_on_bpf_map_loss` | BOOL | `true` | Toggle whether BPF map overflow triggers an immediate alert. |

    ## Expected outputs
    - `{{ outputs.scan_tetragon_telemetry.vars.event_drops_count }}`: Count of lost events in the eBPF ring buffer.
    - `{{ outputs.scan_tetragon_telemetry.vars.policy_errors_count }}`: Count of TracingPolicy attachment or compile errors.
    - `{{ outputs.scan_tetragon_telemetry.vars.map_overflows_count }}`: Count of dropped records due to BPF map overflow.
    - `{{ outputs.scan_tetragon_telemetry.vars.is_alerting }}`: Boolean flag indicating if security SLA is breached.
    - `{{ outputs.scan_tetragon_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the security audit run.

    ## Prerequisites
    - Cilium Tetragon 1.0+ deployed with Prometheus metrics enabled on port 2112.
    - Network connectivity from the Kestra worker to the Tetragon daemonset metrics service.
    - Configured Slack incoming webhook URL with permissions to post in SecOps alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing security alerts to the SecOps Slack channel.

    ## Quick start
    1. Verify that Tetragon exposes Prometheus metrics on HTTP port 2112.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your security sensor identifier in `sensor_name`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_tetragon_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **Kernel Ring Buffer Sizing**: High event drops often indicate the need to increase `ring-buffer-size` in daemonset args.
    - **Aggressive Tracing Policies**: Tracing high-frequency syscalls like `read` or `write` can easily flood ring buffers.
    - **Kernel Version Compatibility**: Verify that target Linux nodes support BTF (BPF Type Format) for proper sensor loading.
    - **JSON Export Bottlenecks**: Heavy disk logging of raw JSON events can introduce userspace consumer backpressure.

    ## How to extend
    - **Automated Ring Buffer Tuning**: Trigger a daemonset patch to increase ring buffer capacity when sustained drops occur.
    - **PagerDuty Escalation**: Escalate to on-call security engineers if policy attachment errors prevent security gating.
    - **Sensor Rule Profiling**: Analyze per-sensor event generation rates to pinpoint noisy tracing rules.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Cilium Tetragon Official Documentation](https://tetragon.io/docs/)
    - [Tetragon Prometheus Metrics Reference](https://tetragon.io/docs/reference/metrics/)
    - [eBPF Security Observability Architecture Guide](https://tetragon.io/docs/concepts/architecture/)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Policy & Compliance
  ee: false
  demo: false
