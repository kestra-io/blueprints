id: redpanda-under-replicated-partitions-and-cluster-health-sentinel
namespace: company.streaming

inputs:
  - id: redpanda_admin_host
    type: STRING
    required: true
    defaults: "redpanda.internal.company.com"
    description: "Redpanda broker Admin API hostname or load balancer endpoint"

  - id: redpanda_admin_port
    type: INT
    required: true
    defaults: 9644
    description: "Redpanda HTTP Admin API port (default: 9644)"

  - id: alert_on_leaderless
    type: BOOLEAN
    required: true
    defaults: true
    description: "Trigger high-urgency alerts if any partitions lack an elected Raft leader"

  - id: slack_channel
    type: STRING
    required: true
    defaults: "#streaming-alerts"
    description: "Target Slack channel for Redpanda cluster health warnings"

triggers:
  - id: periodic_cluster_health_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"

tasks:
  - id: probe_redpanda_cluster_health
    type: io.kestra.plugin.scripts.python.Script
    description: "Queries Redpanda Admin API for cluster health overview, broker liveness, and partition replication states"
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install kestra
    env:
      REDPANDA_ADMIN_HOST: "{{ inputs.redpanda_admin_host }}"
      REDPANDA_ADMIN_PORT: "{{ inputs.redpanda_admin_port }}"
      REDPANDA_ADMIN_TOKEN: "{{ secret('REDPANDA_ADMIN_TOKEN') }}"
    script: |
      import os
      import sys
      import json
      import urllib.request
      import urllib.error
      from kestra import Kestra

      host = os.environ.get("REDPANDA_ADMIN_HOST", "localhost")
      port = int(os.environ.get("REDPANDA_ADMIN_PORT", 9644))
      token = os.environ.get("REDPANDA_ADMIN_TOKEN", "")

      base_url = f"http://{host}:{port}"
      headers = {"Accept": "application/json"}
      if token:
          headers["Authorization"] = f"Bearer {token}"

      def fetch_endpoint(path):
          url = f"{base_url}{path}"
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req, timeout=10) as resp:
              return json.loads(resp.read().decode("utf-8"))

      # Query cluster health overview
      health_data = fetch_endpoint("/v1/cluster/health_overview")

      is_healthy = bool(health_data.get("is_healthy", False))
      controller_id = health_data.get("controller_id", -1)
      all_nodes = health_data.get("all_nodes", [])
      nodes_down = health_data.get("nodes_down", [])
      leaderless_partitions = int(health_data.get("leaderless_partitions", 0))
      under_replicated_partitions = int(health_data.get("under_replicated_partitions", 0))

      total_nodes = len(all_nodes)
      nodes_alive = total_nodes - len(nodes_down)

      # Check partition balancer status if cluster is degraded
      balancer_status = "unknown"
      try:
          balancer_data = fetch_endpoint("/v1/cluster/partition_balancer/status")
          balancer_status = balancer_data.get("status", "in_progress" if balancer_data.get("in_progress") else "idle")
      except Exception:
          balancer_status = "unavailable"

      if nodes_down or leaderless_partitions > 0:
          status = "CRITICAL_CLUSTER_PARTITION_UNAVAILABLE"
          runbook = (
              f"Critical streaming degradation! Nodes down: {nodes_down}. Leaderless partitions: {leaderless_partitions}. "
              "1. Check broker container logs and host systemd units for crash loops or disk exhaustion. "
              "2. Verify node network reachability across Raft quorum. "
              "3. Inspect broker health with 'rpk cluster status'."
          )
      elif under_replicated_partitions > 0:
          status = "WARNING_UNDER_REPLICATED_PARTITIONS"
          runbook = (
              f"Replication lag detected ({under_replicated_partitions} under-replicated partitions). "
              f"Partition balancer state: '{balancer_status}'. "
              "1. Verify inter-broker network bandwidth and disk I/O saturation. "
              "2. Monitor Raft catch-up progress using 'rpk cluster partition-balancer status'."
          )
      else:
          status = "HEALTHY"
          runbook = "All brokers operational and all partitions fully replicated with active Raft leaders."

      Kestra.outputs({
          "is_healthy": is_healthy,
          "controller_id": controller_id,
          "total_nodes": total_nodes,
          "nodes_alive": nodes_alive,
          "nodes_down": nodes_down,
          "nodes_down_count": len(nodes_down),
          "leaderless_partitions": leaderless_partitions,
          "under_replicated_partitions": under_replicated_partitions,
          "balancer_status": balancer_status,
          "status": status,
          "runbook": runbook
      })

  - id: evaluate_cluster_health
    type: io.kestra.plugin.core.flow.If
    description: "Evaluates whether any brokers are offline, partitions lack leaders, or replication is lagging"
    condition: "{{ outputs.probe_redpanda_cluster_health.vars.is_healthy == false or outputs.probe_redpanda_cluster_health.vars.under_replicated_partitions > 0 or (inputs.alert_on_leaderless == true and outputs.probe_redpanda_cluster_health.vars.leaderless_partitions > 0) }}"
    then:
      - id: notify_slack_cluster_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Dispatches high-urgency alert to Slack with cluster metrics and recommended remediation"
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "⚠️ *REDPANDA CLUSTER REPLICATION ALERT*\n*Status:* `{{ outputs.probe_redpanda_cluster_health.vars.status }}`\n*Admin Endpoint:* `{{ inputs.redpanda_admin_host }}:{{ inputs.redpanda_admin_port }}`\n*Brokers Online:* {{ outputs.probe_redpanda_cluster_health.vars.nodes_alive }}/{{ outputs.probe_redpanda_cluster_health.vars.total_nodes }} (Down: `{{ outputs.probe_redpanda_cluster_health.vars.nodes_down }}`)\n*Under-Replicated Partitions:* {{ outputs.probe_redpanda_cluster_health.vars.under_replicated_partitions }}\n*Leaderless Partitions:* {{ outputs.probe_redpanda_cluster_health.vars.leaderless_partitions }}\n*Partition Balancer:* `{{ outputs.probe_redpanda_cluster_health.vars.balancer_status }}`\n*Runbook Action:* {{ outputs.probe_redpanda_cluster_health.vars.runbook }}\n*Execution:* `{{ execution.id }}`"
          }

    else:
      - id: log_healthy_cluster
        type: io.kestra.plugin.core.log.Log
        description: "Records healthy status and quorum telemetry when all partitions are replicated"
        message: "Redpanda cluster at {{ inputs.redpanda_admin_host }}:{{ inputs.redpanda_admin_port }} is healthy. All {{ outputs.probe_redpanda_cluster_health.vars.total_nodes }} nodes alive. Under-replicated partitions: 0. Leaderless partitions: 0."

  - id: finalize_health_telemetry
    type: io.kestra.plugin.core.output.OutputValues
    description: "Publishes final structured telemetry for audit logs and observability dashboards"
    values:
      execution_id: "{{ execution.id }}"
      endpoint: "{{ inputs.redpanda_admin_host }}"
      total_nodes: "{{ outputs.probe_redpanda_cluster_health.vars.total_nodes }}"
      nodes_down_count: "{{ outputs.probe_redpanda_cluster_health.vars.nodes_down_count }}"
      under_replicated_partitions: "{{ outputs.probe_redpanda_cluster_health.vars.under_replicated_partitions }}"
      leaderless_partitions: "{{ outputs.probe_redpanda_cluster_health.vars.leaderless_partitions }}"
      status: "{{ outputs.probe_redpanda_cluster_health.vars.status }}"

errors:
  - id: notify_probe_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alerts SRE team if the Admin API endpoint is unreachable or authentication fails"
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "🚨 *REDPANDA SENTINEL PROBE FAILED*\n*Target:* `{{ inputs.redpanda_admin_host }}:{{ inputs.redpanda_admin_port }}`\n*Failure:* Sentinel was unable to connect to the Redpanda Admin API or evaluate cluster health.\n*Execution ID:* `{{ execution.id }}`\n*Flow:* `{{ flow.id }}`"
      }

extend:
  title: Redpanda Under-Replicated Partitions and Cluster Health Sentinel
  metaTitle: Redpanda Under-Replicated Partitions and Cluster Health Sentinel
  shortDescription: Monitors Redpanda cluster health, tracks under-replicated and leaderless partitions via Admin API, and alerts Slack upon degradation.
  metaDescription: Audits Redpanda cluster health and under-replicated partitions via Admin API, routing alerts and recovery runbooks to Slack.
  description: |
    Redpanda delivers a high-throughput, C++ Apache Kafka-compatible distributed event streaming platform governed by Raft consensus. In high-volume production streaming architectures, broker failures, disk I/O saturation, or network partitioning can cause partitions to lose in-sync replicas (ISRs), creating Under-Replicated Partitions (URPs) or leaderless partitions.

    When left unmonitored, under-replicated partitions compromise high-availability fault tolerance, cause producer latency spikes, and risk data unavailability. This blueprint provides continuous cluster health monitoring by querying Redpanda's HTTP Admin API, evaluating broker liveness and partition replication health, and dispatching actionable SRE runbook alerts to Slack whenever replication degrades.

    ## How it works

    1. **Scheduled Probing**: The `periodic_cluster_health_check` trigger (`io.kestra.plugin.core.trigger.Schedule`) initiates a sentinel scan every 10 minutes.
    2. **Admin API Telemetry Extraction**: The `probe_redpanda_cluster_health` task (`io.kestra.plugin.scripts.python.Script` inside Docker) calls Redpanda's `/v1/cluster/health_overview` and `/v1/cluster/partition_balancer/status` endpoints, extracting active node counts, dead brokers, leaderless partitions, and under-replicated partition metrics.
    3. **Threshold Gate**: The `evaluate_cluster_health` task (`io.kestra.plugin.core.flow.If`) evaluates cluster indicators:
       - **Alert Path**: If any nodes are down, leaderless partitions exist, or under-replicated partitions exceed zero, dispatches a detailed Slack alert card via `notify_slack_cluster_alert` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) including downed node IDs, partition balancer status, and `rpk` recovery commands.
       - **Healthy Path**: Logs healthy quorum confirmation through `log_healthy_cluster` (`io.kestra.plugin.core.log.Log`).
    4. **Telemetry Export**: The `finalize_health_telemetry` task (`io.kestra.plugin.core.output.OutputValues`) exposes clean outputs for external monitoring dashboards and SLA auditing.
    5. **Pipeline Resilience**: An `errors` handler (`notify_probe_failure`) ensures immediate Slack alerting if Redpanda's Admin API becomes unreachable, network connectivity drops, or authentication fails.

    ## What you get

    - Early detection of replication lag and broker offline events before consumers experience data starvation.
    - Automated inspection of Raft leader availability to protect critical event streaming topics.
    - Actionable Slack notifications enriched with node IDs and `rpk cluster status` runbook instructions.
    - Complete execution audit history in Kestra.

    ## Who it's for

    - Platform Engineers and Site Reliability Engineers (SREs) operating production Redpanda streaming clusters.
    - Data Engineers managing real-time event-driven pipelines reliant on Kafka-compatible streaming guarantees.
    - DevOps teams migrating from legacy ZooKeeper/Kafka clusters to modern Redpanda architectures.

    ## Why orchestrate this with Kestra

    Kestra simplifies streaming infrastructure monitoring by combining recurring schedules, containerized Python script execution, conditional alerting, and enterprise Slack webhooks into a unified, auditable execution graph. If an alert fails or the cluster becomes unreachable, Kestra captures full execution logs and executes fallback alerts automatically.

    ## Prerequisites

    - A running Redpanda cluster with the HTTP Admin API enabled (default port 9644).
    - A Slack Incoming Webhook URL configured with permission to post to the alert channel.
    - Docker enabled on Kestra workers to run the Python script container.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Incoming Webhook URL for the target Slack workspace.
    - `REDPANDA_ADMIN_TOKEN`: (Optional) Bearer authentication token for secured Redpanda Admin APIs.

    ## Quick start

    1. Store your `SLACK_WEBHOOK_URL` and `REDPANDA_ADMIN_TOKEN` in your Kestra namespace secrets.
    2. Import this blueprint into your Kestra workspace under namespace `company.streaming`.
    3. Trigger a manual execution with your Redpanda Admin hostname and port to verify connectivity and telemetry outputs.
    4. Enable the `periodic_cluster_health_check` trigger to start continuous 10-minute replication surveillance.

    ## How to extend

    - Add automated healing: trigger an `rpk cluster partition-balancer` or restart commands via SSH/Kubernetes tasks on confirmed failed nodes.
    - Integrate PagerDuty or Opsgenie alerts specifically when `leaderless_partitions > 0` indicates active partition downtime.
    - Query individual topic configurations (`/v1/partitions/{topic}`) to pinpoint the exact degraded topic names.

    ## Links

    - [Redpanda Admin API Documentation](https://docs.redpanda.com/current/reference/admin-api/)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.script)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Redpanda Partition Balancer Overview](https://docs.redpanda.com/current/manage/cluster-maintenance/disk-architecture/)
    - This blueprint has been created by [Pranjulchaurasiya](https://github.com/Pranjulchaurasiya)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - DevOps & CI/CD
  ee: false
  demo: false
