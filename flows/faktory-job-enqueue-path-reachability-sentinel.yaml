id: faktory-job-enqueue-path-reachability-sentinel
namespace: company.team
description: |
  Push a canary job to a dedicated, worker-free Faktory queue over the
  raw Faktory Work Protocol (FWP) TCP port, then confirm it landed by
  reading the Web UI's /stats endpoint, classify the result HEALTHY or
  ENQUEUE_PATH_UNHEALTHY, log clean passes, and alert Slack the moment
  the enqueue path and the stats/reporting path fall out of sync.

triggers:
  - id: periodic_enqueue_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Checks every 15 minutes - the FWP enqueue port (7419) and the Web UI stats port (7420) are two separate subsystems on the same Faktory server, and either can fail independently with no cross-check today. Shipped disabled; enable it once faktory_host and faktory_web_stats_url point at a real Faktory server and a manual run has been verified."
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      faktory_host: "localhost"
      faktory_port: 7419
      faktory_web_stats_url: "http://localhost:7420/stats"
      canary_queue: "kestra-canary-queue"

inputs:
  - id: faktory_host
    type: STRING
    displayName: "Faktory Server Host"
    defaults: "localhost"
    description: "Passed to the Push task's own host property (FWP TCP connection, default port 7419)."

  - id: faktory_port
    type: INT
    displayName: "Faktory FWP Port"
    defaults: 7419
    description: "Passed to the Push task's own port property. Verified from the plugin's own AbstractFaktoryConnection source: a separate Integer property from the Web UI port below, defaulting to 7419."

  - id: faktory_web_stats_url
    type: STRING
    displayName: "Faktory Web UI Stats URL"
    defaults: "http://localhost:7420/stats"
    description: "Full HTTP URL to the Faktory Web UI's /stats endpoint (default port 7420, a different port and protocol entirely from faktory_port's raw FWP socket)."

  - id: canary_queue
    type: STRING
    displayName: "Canary Queue Name"
    defaults: "kestra-canary-queue"
    description: "A dedicated Faktory queue with no real worker consuming it, so a pushed canary job simply accumulates instead of being processed. Never point this at a queue a real worker also consumes."

tasks:
  - id: probe_push_canary_job
    type: io.kestra.plugin.faktory.Push
    description: "Pushes a synthetic job over the raw Faktory Work Protocol (FWP) TCP socket (verified from the task's own source: a line-based TCP protocol, not HTTP) - the actual job-submission path real workers depend on, which this repository's existing Faktory blueprint never exercises (it only polls the separate Web UI /stats HTTP endpoint). retries is set to -1 so a job that is somehow picked up and fails is discarded immediately rather than retried or moved to the dead queue, since this queue is expected to have no consumer at all."
    host: "{{ inputs.faktory_host }}"
    port: "{{ inputs.faktory_port }}"
    password: "{{ secret('FAKTORY_PASSWORD') }}"
    jobType: "KestraCanaryHeartbeat"
    queue: "{{ inputs.canary_queue }}"
    args:
      - "{{ execution.id }}"
    retries: -1

  - id: probe_fetch_stats
    type: io.kestra.plugin.core.http.Request
    description: "Reads the Web UI's /stats endpoint, a completely separate subsystem from the FWP push above. Verified from Faktory's own server source (webui/pages.go statsHandler marshaling Server().CurrentState(), and client/faktory.go's FaktoryState/DataSnapshot structs): the JSON response has shape {\"faktory\":{\"queues\":{\"<name>\":<depth>, ...}, \"total_enqueued\":N, ...}, \"server\":{...}}. body is returned as a raw string (per Kestra's own documentation: 'the expression returns a string, not a JSON'), parsed here with jq."
    uri: "{{ inputs.faktory_web_stats_url }}"
    method: GET

  - id: evaluate_enqueue_reachability
    type: io.kestra.plugin.core.flow.If
    description: "HEALTHY only when the canary queue's reported depth (from the verified faktory.queues map, keyed by queue name) is greater than zero - proving the job pushed over FWP was actually durably recorded and is visible through the separate Web UI reporting path. A thrown exception from either probe task routes to the errors block below instead of reaching this condition at all."
    condition: "{{ (outputs.probe_fetch_stats.body | jq('.faktory.queues[\"' ~ inputs.canary_queue ~ '\"] // 0') | first) > 0 }}"
    then:
      - id: log_enqueue_healthy
        type: io.kestra.plugin.core.log.Log
        message: "HEALTHY: canary job {{ outputs.probe_push_canary_job.jid }} pushed to queue {{ inputs.canary_queue }} and confirmed present via the Web UI stats endpoint."
    else:
      - id: alert_enqueue_unhealthy
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Always alert on ENQUEUE_PATH_UNHEALTHY - the FWP push itself did not throw (jid was returned), but the canary queue shows zero or no depth through the Web UI stats path, meaning the two subsystems have fallen out of sync."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {
            "text": "Faktory enqueue path sentinel: ENQUEUE_PATH_UNHEALTHY on " ~ inputs.faktory_host ~ ". Canary job " ~ outputs.probe_push_canary_job.jid ~ " was pushed to queue '" ~ inputs.canary_queue ~ "' over FWP but does not show a positive depth via the Web UI /stats endpoint. Execution " ~ execution.id ~ "."
          } | toJson }}

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: "Final status line for every run, independent of which branch fired."
    message: "Enqueue path audit complete for {{ inputs.faktory_host }}. canary_jid={{ outputs.probe_push_canary_job.jid }} queue={{ inputs.canary_queue }}."

errors:
  - id: alert_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alert when the flow itself fails outright - the FWP push was rejected or the TCP connection failed (verified from the task's own source: AbstractFaktoryConnection throws with the host/port/tls in the message), or the Web UI stats endpoint was unreachable."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {
        "text": "Faktory enqueue path sentinel FAILED in execution " ~ execution.id ~ " for " ~ inputs.faktory_host ~ ". The FWP push or the Web UI stats request did not complete; investigate before trusting the last known HEALTHY/ENQUEUE_PATH_UNHEALTHY status."
      } | toJson }}

extend:
  title: "Faktory Job Enqueue Path Reachability Sentinel"
  metaTitle: "Faktory Job Enqueue Path Reachability Sentinel with Kestra"
  shortDescription: "Push a canary job over Faktory's raw FWP protocol and cross-check it against the Web UI stats endpoint to catch the two subsystems falling out of sync."
  metaDescription: "Push a Faktory canary job over FWP and verify it via the Web UI stats endpoint, alerting Slack if the two subsystems disagree."
  description: |
    A Faktory server exposes two independent subsystems: the raw Faktory
    Work Protocol (FWP) TCP port that real workers and job producers
    depend on, and a separate Web UI HTTP port used for dashboards and
    monitoring. Checking only one - as this repository's existing Faktory
    blueprint does, which polls just the Web UI `/stats` endpoint - can
    miss a failure in the other. This blueprint pushes a synthetic canary
    job over the real FWP enqueue path and cross-checks it against the
    Web UI's own reporting, catching the moment either subsystem breaks
    or the two fall out of sync with each other.

    ## How it works

    1. `periodic_enqueue_check` (`io.kestra.plugin.core.trigger.Schedule`) runs every 15 minutes, explicitly passing `faktory_host`, `faktory_port`, `faktory_web_stats_url`, and `canary_queue` through its own `inputs:` block so the flow is self-contained when the trigger fires. Shipped disabled so a manual run can be verified first.
    2. `probe_push_canary_job` (`io.kestra.plugin.faktory.Push`) pushes a synthetic job over the raw FWP TCP socket to a dedicated, worker-free canary queue, capturing the returned job id (`jid`).
    3. `probe_fetch_stats` (`io.kestra.plugin.core.http.Request`) reads the Web UI's `/stats` endpoint - a completely separate HTTP subsystem - and captures the raw JSON response body.
    4. `evaluate_enqueue_reachability` (`io.kestra.plugin.core.flow.If`) branches on whether the canary queue's reported depth (parsed from the stats response with `jq`) is greater than zero.
       - `then` (HEALTHY): `log_enqueue_healthy` records the pass with the canary job id.
       - `else` (ENQUEUE_PATH_UNHEALTHY): `alert_enqueue_unhealthy` reports the mismatch to Slack.
    5. `log_audit_complete` always runs last, printing the canary job id and queue regardless of which branch fired.
    6. The `errors` block alerts Slack separately if either probe fails outright - an unreachable FWP port or an unreachable Web UI.

    ## What you get

    - A cross-subsystem consistency check that this repository's existing Faktory blueprint cannot provide: it only ever polls the Web UI, so a healthy dashboard with a silently broken FWP enqueue port would read as `HEALTHY` there, but is caught here.
    - A worked example of `io.kestra.plugin.faktory.Push`, a real task class with zero prior usage anywhere in this repository's blueprints, combined with the plugin's documented `/stats` JSON schema (`faktory.queues`, verified directly from Faktory's own Go source) parsed via `jq` on a raw HTTP response body - the officially documented pattern for this exact situation, per Kestra's own HTTP request documentation.
    - A non-destructive design: the canary queue has no real consumer by design, so the pushed job never gets executed, retried, or sent to the dead queue (`retries: -1` discards it immediately in the unlikely case something does pick it up).

    ## Who it's for

    - Platform and backend teams running Faktory who want proof that the actual job-submission path works, not just that the dashboard responds.
    - Teams who have been burned by a worker-side outage that a Web-UI-only health check missed because the dashboard itself stayed up.
    - Anyone evaluating the Faktory plugin who wants a worked example of `Push` used for synthetic monitoring rather than real job submission.

    ## Why orchestrate this with Kestra

    Faktory's own Web UI has no built-in cross-check between its FWP and HTTP subsystems, and no Slack integration of its own. Kestra supplies the schedule, the HEALTHY/ENQUEUE_PATH_UNHEALTHY classification as a first-class branch, and an execution history showing exactly when the two subsystems first disagreed.

    ## Prerequisites

    - A running Faktory server, reachable over both its FWP port (default `7419`) and its Web UI port (default `7420`). Faktory publishes an [official open-source Docker image](https://hub.docker.com/r/contribsys/faktory) requiring no account or license - `docker run --rm -p 7419:7419 -p 7420:7420 contribsys/faktory:latest` starts a local instance for testing.
    - A dedicated queue name with no real worker subscribed to it (`canary_queue`).
    - A Slack incoming webhook for alerts.

    ### Secrets

    - `FAKTORY_PASSWORD`: password for `io.kestra.plugin.faktory.Push`, matching the plugin's own documented `password` connection property. Leave the secret empty for an unauthenticated local Faktory instance.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by `alert_enqueue_unhealthy` and the `errors` block.
    - In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_`, base64-encoded - for example `SECRET_FAKTORY_PASSWORD=$(echo -n '<your-password>' | base64)` - and read back in flows with `{{ secret('NAME') }}`.

    ### Inputs

    - `faktory_host` (STRING, default `localhost`): Faktory server host for the FWP connection.
    - `faktory_port` (INT, default `7419`): FWP TCP port.
    - `faktory_web_stats_url` (STRING, default `http://localhost:7420/stats`): Web UI stats endpoint, a separate port and protocol.
    - `canary_queue` (STRING, default `kestra-canary-queue`): the dedicated, worker-free queue the canary job is pushed to.

    ### Outputs

    - `outputs.probe_push_canary_job.jid` (String): the Faktory job id of the pushed canary (verified field from `Push`'s own `Output` class).
    - `outputs.probe_fetch_stats.body` (String): the raw `/stats` JSON response, parsed with `jq` for the `faktory.queues` map.

    ## Quick start

    1. Run a local Faktory server (`docker run --rm -p 7419:7419 -p 7420:7420 contribsys/faktory:latest`) or point this at a real one.
    2. Add the `SLACK_WEBHOOK_URL` secret (and `FAKTORY_PASSWORD` if the server requires authentication).
    3. Run the flow manually and confirm `log_enqueue_healthy` fires, with the pushed `jid` visible in the Faktory Web UI's queue list for `canary_queue`.
    4. Temporarily point `faktory_web_stats_url` at an unreachable address and re-run to confirm the `errors` block fires, distinct from the `ENQUEUE_PATH_UNHEALTHY` branch.
    5. Enable `periodic_enqueue_check` once you trust the check against your real Faktory server.

    ## How to extend

    - Loop over several `canary_queue` values (one per priority tier your real queues use) to verify the enqueue path separately for each, catching a tier-specific FWP routing issue.
    - Add a `total_enqueued` trend check using the same `/stats` response (also verified from Faktory's own `DataSnapshot` struct) to catch a server-wide enqueue slowdown, not just a per-queue one.
    - Add a remediation branch that pages a different on-call rotation when the `errors` block fires (infrastructure-down) versus when `ENQUEUE_PATH_UNHEALTHY` fires (subsystem desync) - the two failure modes likely need different responders.

    ## Pitfalls

    - **`canary_queue` must never be a queue a real worker also consumes** - if a worker picks up the synthetic `KestraCanaryHeartbeat` job type and doesn't recognize it, `retries: -1` ensures it is discarded immediately rather than retried indefinitely, but this sentinel is designed around the queue having no consumer at all.
    - **The Web UI `/stats` body is a raw string, not pre-parsed JSON** - verified directly from Kestra's own HTTP request documentation ("the expression returns a string, not a JSON"), which is why `jq` is used here rather than direct dot-notation field access.
    - **A canary job pushed moments before this sentinel's next run could still be counted** if nothing ever drains `canary_queue` - queue depth only grows across repeated runs unless something clears it periodically; this is expected and does not indicate a problem, but a very long-running deployment may want an occasional manual purge of the canary queue.
    - **This blueprint is UNTESTED against a live Faktory server.** The `Push` task's properties, the `/stats` JSON schema (`faktory.queues`, `total_enqueued`, etc.), and the FWP/Web-UI port distinction are all taken verbatim from the Kestra plugin's own source and Faktory's own Go server source - but no Kestra engine was run to execute this flow end to end.

    ## Links

    - [Kestra Faktory plugin documentation](https://kestra.io/plugins/plugin-faktory)
    - [Faktory official Docker image](https://hub.docker.com/r/contribsys/faktory)
    - [Kestra HTTP request documentation (body is a string, parse with jq)](https://kestra.io/docs/how-to-guides/http-request)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
