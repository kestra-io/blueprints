id: aws_dynamic_sandbox_cleanup
namespace: developer.sandboxes
description: "Provisions temporary AWS sandbox environments, enforces a strict TTL timer with a 10-minute Slack warning, and automatically tears down resources."

variables:
  slackWebhook: "{{ secret('SLACK_WEBHOOK_URL') }}"
  ttlDuration: "PT2H" # 2 hours TTL timer (Adjust as needed)

tasks:
  - id: provision_sandbox
    type: io.kestra.plugin.aws.cli.AwsCli
    commands:
      - echo "Provisioning temporary AWS security group and EC2 sandbox instance..."
      # Add your AWS CLI or cloud formation provisioning commands here

  - id: send_provision_notice
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    url: "{{ vars.slackWebhook }}"
    payload: |
      {
        "text": ":rocket: *AWS Sandbox Deployed!*\nYour temporary developer sandbox has been provisioned. It will automatically terminate in 2 hours."
      }

  - id: sandbox_ttl_timer
    type: io.kestra.plugin.core.flow.Pause
    # Enforces the execution timeout / TTL duration
    timeout: "{{ vars.ttlDuration }}"

errors:
  - id: handle_timeout_or_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    url: "{{ vars.slackWebhook }}"
    payload: |
      {
        "text": ":warning: *AWS Sandbox TTL Expired / Cleaned Up*\nThe sandbox timer reached its limit. Automated teardown of security groups and EC2/S3 resources is executing now."
      }