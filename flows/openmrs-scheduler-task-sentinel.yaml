id: openmrs-scheduler-task-sentinel
namespace: company.team
description: |
  On a schedule, read-only check the scheduler of an OpenMRS medical record
  system (the background tasks that auto-close visits, mark missed
  appointments, send reminders and run stock and report jobs; nothing is
  started, stopped or changed) and classify them as HEALTHY, WARNING, CRITICAL
  or UNREACHABLE. Page Slack when a task that should run has stopped or has
  not run for several of its intervals, remember the alert in the KV store so
  an unchanged problem is not paged again every run, and tell Slack when it
  recovers.

inputs:
  - id: openmrs_url
    type: STRING
    defaults: "https://openmrs.example.org/openmrs"
    displayName: "OpenMRS URL"
    description: "Base URL of the OpenMRS web application (the one that serves /ws/rest/v1), without a trailing slash."
  - id: overdue_factor
    type: INT
    defaults: 3
    displayName: "Overdue Factor"
    description: "A running task counts as overdue when its last run is older than this many of its own repeat intervals, plus the grace period."
  - id: grace_minutes
    type: INT
    defaults: 15
    displayName: "Grace (minutes)"
    description: "Extra minutes allowed on top of overdue_factor intervals, so tasks that run every minute are not flagged for a short pause."
  - id: realert_hours
    type: INT
    defaults: 6
    displayName: "Re-alert After (hours)"
    description: "An unchanged problem (same status, same tasks) is paged once, then again only after this many hours. Any change in the problem pages straight away."

triggers:
  - id: scheduler_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check the OpenMRS scheduler every 30 minutes. Shipped disabled; enable it once openmrs_url and the OPENMRS_USERNAME and OPENMRS_PASSWORD secrets point at a real server and a manual run has been verified.
    cron: "*/30 * * * *"
    disabled: true
    inputs:
      openmrs_url: "https://openmrs.example.org/openmrs"

tasks:
  - id: check_session
    type: io.kestra.plugin.core.http.Request
    description: Read /ws/rest/v1/session to confirm the server is OpenMRS and accepts the credentials. OpenMRS answers wrong credentials here with HTTP 200 and authenticated false, so the flag is checked, not only the code. This is a GET; nothing is changed.
    uri: "{{ inputs.openmrs_url }}/ws/rest/v1/session"
    method: GET
    headers:
      Accept: application/json
    options:
      auth:
        type: BASIC
        username: "{{ secret('OPENMRS_USERNAME') }}"
        password: "{{ secret('OPENMRS_PASSWORD') }}"
      allowFailed: true
      timeout:
        connectTimeout: PT10S
        readIdleTimeout: PT30S
    retry:
      type: constant
      interval: PT15S
      maxAttempts: 3
    allowFailure: true

  - id: fetch_task_definitions
    type: io.kestra.plugin.core.http.Request
    description: Read every scheduler task with its started flag, start-on-startup flag, repeat interval and last execution time from /ws/rest/v1/taskdefinition. Skipped when the session check did not answer.
    runIf: "{{ outputs.check_session.code is defined and outputs.check_session.code == 200 and (outputs.check_session.body | trim | startsWith('{')) }}"
    uri: "{{ inputs.openmrs_url }}/ws/rest/v1/taskdefinition?v=full"
    method: GET
    headers:
      Accept: application/json
    options:
      auth:
        type: BASIC
        username: "{{ secret('OPENMRS_USERNAME') }}"
        password: "{{ secret('OPENMRS_PASSWORD') }}"
      allowFailed: true
      timeout:
        connectTimeout: PT10S
        readIdleTimeout: PT30S
    retry:
      type: constant
      interval: PT15S
      maxAttempts: 3
    allowFailure: true

  - id: classify_tasks
    type: io.kestra.plugin.core.debug.Return
    description: Classify the scheduler tasks in one jq query. A task with startOnStartup true that is not started is stopped; a started task whose last run is older than overdue_factor repeat intervals plus grace_minutes is overdue. A missing response, a non-200 code, a body that is not JSON, or a session that is not authenticated become UNREACHABLE instead of looking healthy.
    format: >-
      {{ (outputs.check_session.code is not defined or outputs.check_session.code != 200
      or not (outputs.check_session.body | trim | startsWith('{'))
      or outputs.fetch_task_definitions is not defined or outputs.fetch_task_definitions.code is not defined
      or outputs.fetch_task_definitions.code != 200 or not (outputs.fetch_task_definitions.body | trim | startsWith('{')))
      ? '{"status":"UNREACHABLE","tasks":0,"stopped":0,"overdue":0,"stopped_tasks":"none","overdue_tasks":"none","fingerprint":"UNREACHABLE"}'
      : ({'session': fromJson(outputs.check_session.body), 'defs': fromJson(outputs.fetch_task_definitions.body)} | jq('
      if .session.authenticated != true or (.defs.results | type) != "array"
      then {status: "UNREACHABLE", tasks: 0, stopped: 0, overdue: 0, stopped_tasks: "none", overdue_tasks: "none", fingerprint: "UNREACHABLE"}
      else
      def epoch: (.[0:19] + "Z" | fromdateiso8601) - (if length >= 28 then (if .[23:24] == "-" then -1 else 1 end) * ((.[24:26] | tonumber) * 3600 + (.[26:28] | tonumber) * 60) else 0 end);
      ' ~ (now() | timestamp) ~ ' as $now
      | .defs.results as $tasks
      | [$tasks[] | select(.startOnStartup == true and .started != true)] as $stopped
      | [$tasks[] | select(.started == true and (.repeatInterval // 0) > 0 and .lastExecutionTime != null
      and ($now - (.lastExecutionTime | epoch)) > (.repeatInterval * ' ~ inputs.overdue_factor ~ ' + ' ~ (inputs.grace_minutes * 60) ~ '))] as $overdue
      | {tasks: ($tasks | length), stopped: ($stopped | length), overdue: ($overdue | length),
      stopped_tasks: (if ($stopped | length) == 0 then "none" else ([$stopped[] | .name + " (last run " + ((.lastExecutionTime // "never")[0:16]) + ")"] | join(", ")) end),
      overdue_tasks: (if ($overdue | length) == 0 then "none" else ([$overdue[] | .name + " (last run " + .lastExecutionTime[0:16] + ")"] | join(", ")) end),
      status: (if ($stopped | length) > 0 then "CRITICAL" elif ($overdue | length) > 0 then "WARNING" else "HEALTHY" end)}
      | .fingerprint = .status + " stopped:" + ([$stopped[] | .name] | sort | join(",")) + " overdue:" + ([$overdue[] | .name] | sort | join(","))
      end
      ') | first | toJson) }}

  - id: load_last_alert
    type: io.kestra.plugin.core.kv.Get
    description: Read the alert this flow last sent for this server (its status, the tasks involved and when). Missing when nothing is currently alerted.
    key: "openmrs_scheduler_last_alert_{{ inputs.openmrs_url | slugify }}"
    errorOnMissing: false

  - id: decide_alert
    type: io.kestra.plugin.core.debug.Return
    description: Compare this run with the last alert. A problem identical to the one already alerted (same fingerprint) within realert_hours becomes REPEAT and is only logged; HEALTHY after an alert becomes RECOVERED; anything else keeps its status, so a new or changed problem always pages.
    format: >-
      {{ {'c': fromJson(outputs.classify_tasks.value), 'last': (outputs.load_last_alert.value ?? {})} | jq('
      (.last.fingerprint // "") as $last_fingerprint
      | ' ~ (now() | timestamp) ~ ' as $now
      | if .c.status == "HEALTHY" then (if $last_fingerprint != "" then "RECOVERED" else "HEALTHY" end)
      elif .c.fingerprint == $last_fingerprint and ($now - (.last.alerted_at // 0)) < ' ~ (inputs.realert_hours * 3600) ~ ' then "REPEAT"
      else .c.status end
      ') | first }}

  - id: route_by_scheduler_status
    type: io.kestra.plugin.core.flow.Switch
    description: Route to a quiet log when every task that should run is running on time, an informational Slack message for overdue tasks, a Slack page when a task has stopped or OpenMRS could not be read, a log line for a problem already alerted, or a recovery message once an alerted problem is gone.
    value: "{{ outputs.decide_alert.value }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          description: Log a quiet confirmation when no task is stopped or overdue.
          message: "OpenMRS scheduler healthy: {{ fromJson(outputs.classify_tasks.value).tasks }} task(s), none stopped, none overdue."
      "WARNING":
        - id: alert_overdue_tasks
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Post an informational Slack message listing the tasks that are still marked started but have not run on time.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "OpenMRS scheduler WARNING: {{ fromJson(outputs.classify_tasks.value).overdue }} task(s) have not run for more than {{ inputs.overdue_factor }} of their intervals: {{ fromJson(outputs.classify_tasks.value).overdue_tasks }}. Check System Administration > Manage Scheduler on {{ inputs.openmrs_url }}. Execution {{ execution.id }}."
            }
      "CRITICAL":
        - id: alert_stopped_tasks
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when a task configured to start with OpenMRS is not running, so visits, appointments or reports stop being processed.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "OpenMRS scheduler CRITICAL: {{ fromJson(outputs.classify_tasks.value).stopped }} task(s) set to start with OpenMRS are stopped: {{ fromJson(outputs.classify_tasks.value).stopped_tasks }}.{% if fromJson(outputs.classify_tasks.value).overdue > 0 %} Also overdue: {{ fromJson(outputs.classify_tasks.value).overdue_tasks }}.{% endif %} Check System Administration > Manage Scheduler on {{ inputs.openmrs_url }}. Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable_openmrs
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when OpenMRS could not be read, did not accept the credentials, or did not answer like OpenMRS.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "OpenMRS scheduler UNREACHABLE: {{ inputs.openmrs_url }} did not return an authenticated session and its scheduler tasks (server down, wrong URL, rejected credentials, missing scheduler privilege, or a page that is not OpenMRS). Scheduler status is unknown. Execution {{ execution.id }}."
            }
      "REPEAT":
        - id: log_already_alerted
          type: io.kestra.plugin.core.log.Log
          description: Log instead of paging again when the problem is unchanged since the last alert.
          message: "OpenMRS scheduler still {{ fromJson(outputs.classify_tasks.value).status }}, unchanged since the alert at {{ outputs.load_last_alert.value.alerted_at_text }} ({{ outputs.load_last_alert.value.summary }}). Not paging again before {{ inputs.realert_hours }} hour(s) have passed."
      "RECOVERED":
        - id: alert_recovered
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Tell Slack that the alerted problem is gone, so the on-call person can close it.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "OpenMRS scheduler RECOVERED: every task that should run on {{ inputs.openmrs_url }} is running on time again. Last alert ({{ outputs.load_last_alert.value.alerted_at_text }}): {{ outputs.load_last_alert.value.summary }}. Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        description: Log any classification outside the four known values, so a change in the jq query never fails silently.
        message: "OpenMRS scheduler task sentinel completed with an unexpected classification: {{ outputs.classify_tasks.value }}."

  - id: remember_alert
    type: io.kestra.plugin.core.kv.Set
    description: After a page was sent, save what was alerted and when, so the next run can tell an unchanged problem from a new one. Runs after the Slack task, so a failed delivery is not remembered and the next run pages again.
    runIf: "{{ outputs.decide_alert.value == 'WARNING' or outputs.decide_alert.value == 'CRITICAL' or outputs.decide_alert.value == 'UNREACHABLE' }}"
    key: "openmrs_scheduler_last_alert_{{ inputs.openmrs_url | slugify }}"
    value: "{{ {'fingerprint': fromJson(outputs.classify_tasks.value).fingerprint, 'status': fromJson(outputs.classify_tasks.value).status, 'alerted_at': (now() | timestamp), 'alerted_at_text': (now() | date(\"yyyy-MM-dd HH:mm 'UTC'\", timeZone='UTC')), 'summary': fromJson(outputs.classify_tasks.value).status ~ ', stopped: ' ~ fromJson(outputs.classify_tasks.value).stopped_tasks ~ ', overdue: ' ~ fromJson(outputs.classify_tasks.value).overdue_tasks} | toJson }}"
    kvType: JSON

  - id: forget_alert
    type: io.kestra.plugin.core.kv.Delete
    description: Clear the remembered alert once the scheduler has recovered, so the next problem pages straight away.
    runIf: "{{ outputs.decide_alert.value == 'RECOVERED' }}"
    key: "openmrs_scheduler_last_alert_{{ inputs.openmrs_url | slugify }}"

  - id: log_audit_result
    type: io.kestra.plugin.core.log.Log
    description: Record one audit line for every run, whichever branch fired, with both HTTP codes and the classification, so the check's own history stays queryable even if Slack delivery fails.
    message: "OpenMRS scheduler audit: server={{ inputs.openmrs_url }} session_http={{ outputs.check_session.code ?? 'n/a' }} tasks_http={{ outputs.fetch_task_definitions.code ?? 'n/a' }} result={{ outputs.classify_tasks.value }} route={{ outputs.decide_alert.value }} execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack when the sentinel flow itself fails outright, so a broken check is never mistaken for a healthy scheduler.
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "OpenMRS scheduler task sentinel flow {{ flow.id }} FAILED (execution {{ execution.id }}). Scheduler status at {{ inputs.openmrs_url }} is unknown; check the task logs and Manage Scheduler manually."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.classify_tasks is defined ? fromJson(outputs.classify_tasks.value).status : 'UNREACHABLE' }}"
  - id: scheduler
    type: JSON
    value: "{{ outputs.classify_tasks is defined ? outputs.classify_tasks.value : '{\"status\":\"UNREACHABLE\"}' }}"

extend:
  title: "OpenMRS Scheduler Task Sentinel"
  shortDescription: Read-only check of an OpenMRS medical record system's scheduler on a schedule, paging Slack once when a background task has stopped or stops running on time, and again when it recovers.
  metaTitle: OpenMRS Scheduler Task Sentinel for Kestra
  metaDescription: Check OpenMRS scheduler tasks on a schedule, change nothing, and alert Slack once when a task has stopped, falls behind or the server is down, then when it recovers.
  description: |
    OpenMRS is the open-source medical record system used by hospitals and clinics in many countries. Much of its day-to-day work runs in its scheduler: closing visits left open overnight, marking missed appointments, sending appointment reminders, evaluating stock rules and generating reports. When one of these tasks stops, for example after a module error or a restart that did not bring it back, OpenMRS shows it only on the Manage Scheduler page, and the first sign is usually a ward with visits still open from last week. This blueprint turns two read-only OpenMRS REST calls into a scheduled health gate: `/ws/rest/v1/session` proves the server is answering and accepts the credentials, `/ws/rest/v1/taskdefinition` returns every task with its state, a single jq query finds stopped and overdue tasks, and the result routes to a quiet log, an informational Slack note or a Slack page.

    ## How it works

    1. `check_session` (`io.kestra.plugin.core.http.Request`) reads `/ws/rest/v1/session` with basic authentication. OpenMRS answers wrong credentials there with HTTP 200 and `authenticated: false`, so the flow checks the flag, not only the code. Every request is a GET with a timeout, three retries, `allowFailed: true` and `allowFailure: true`, so an outage never aborts the flow.
    2. `fetch_task_definitions` reads `/ws/rest/v1/taskdefinition?v=full`, which includes `started`, `startOnStartup`, `repeatInterval` and `lastExecutionTime`. A `runIf` skips it when the session check did not answer.
    3. `classify_tasks` (`io.kestra.plugin.core.debug.Return`) checks both responses (a missing response, a non-200 code, a body that is not JSON or an unauthenticated session is `UNREACHABLE`), then finds the tasks set to start with OpenMRS that are not started (stopped) and the started tasks whose last run is older than `overdue_factor` of their own repeat intervals plus `grace_minutes` (overdue). Any stopped task is `CRITICAL`, any overdue task is `WARNING`, otherwise `HEALTHY`.
    4. `load_last_alert` (`io.kestra.plugin.core.kv.Get`) reads what this flow last paged for this server, and `decide_alert` (`io.kestra.plugin.core.debug.Return`) compares it with this run. The same status with the same tasks within `realert_hours` becomes `REPEAT`; `HEALTHY` after an alert becomes `RECOVERED`; any new or changed problem keeps its status and pages.
    5. `route_by_scheduler_status` (`io.kestra.plugin.core.flow.Switch`) logs `HEALTHY` quietly, posts a Slack note for `WARNING`, pages Slack for `CRITICAL` and `UNREACHABLE`, only logs a `REPEAT`, posts a recovery message for `RECOVERED`, and logs any unexpected value in `defaults`.
    6. `remember_alert` (`io.kestra.plugin.core.kv.Set`) saves the alert after it was sent, and `forget_alert` (`io.kestra.plugin.core.kv.Delete`) clears it on recovery. Because the save runs after Slack, a failed delivery is not remembered and the next run pages again.
    7. `log_audit_result` writes one audit line per run with both HTTP codes, the classification and the route taken. The flow-level `errors` block alerts Slack if the flow fails outright, and the `scheduler_check` trigger runs every 30 minutes and ships `disabled: true`.

    ## What you get

    - A scheduled, read-only check of every OpenMRS scheduler task, using only the REST API.
    - A `status` output (`HEALTHY` / `WARNING` / `CRITICAL` / `UNREACHABLE`) other flows can gate on, and a `scheduler` JSON output with `tasks`, `stopped`, `overdue` and the names and last run of each stopped or overdue task.
    - Slack messages that name each task and when it last ran.
    - One page per problem instead of one every 30 minutes: an unchanged problem is only logged until `realert_hours` pass, a changed one pages straight away, and a recovery message closes it.
    - An audit log line on every run, so scheduler health history survives a Slack outage.

    ## Who it's for

    - Hospital and clinic IT teams running OpenMRS, including OpenMRS 3 distributions.
    - Implementing partners who look after several OpenMRS sites.
    - Data platform teams already using Kestra who want the same alerting for their OpenMRS servers.

    ## Why orchestrate this with Kestra

    OpenMRS knows whether each task is started and when it last ran, but nobody is told when that changes. Kestra runs the same read-only check on a schedule, classifies the whole scheduler in one typed status, keeps every run in the execution history, routes it to the right channel, and keeps state between runs in the KV store, so the person on call gets one page per problem and a message when it is fixed, not a page every 30 minutes.

    ## Prerequisites

    - An OpenMRS server with the REST Web Services module (included in the reference application and OpenMRS 3 distributions) reachable from Kestra (tested on OpenMRS Platform 2.8).
    - A dedicated OpenMRS user for monitoring whose role has the `Manage Scheduler` privilege, which the REST API requires to list task definitions.
    - A Slack incoming webhook for the WARNING, CRITICAL, UNREACHABLE and flow-failure alerts.

    ### Secrets

    - `OPENMRS_USERNAME` and `OPENMRS_PASSWORD`: credentials of the monitoring user (HTTP basic authentication).
    - `SLACK_WEBHOOK`: Slack incoming webhook used for every alert branch and the flow-failure alert.

    In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_` and base64-encoded, then read in flows with `{{ secret('NAME') }}`, for example `SECRET_OPENMRS_PASSWORD=$(echo -n '<password>' | base64)`.

    ## Quick start

    1. To try it without your own server, point `openmrs_url` at an OpenMRS public test server (such as `https://dev3.openmrs.org/openmrs`) with the demo credentials published by the OpenMRS community. Shared test servers are reset and restarted often, so their scheduler state changes from day to day.
    2. Add `OPENMRS_USERNAME`, `OPENMRS_PASSWORD` and `SLACK_WEBHOOK` as secrets and run the flow once.
    3. Raise `overdue_factor` or `grace_minutes` to tune how quickly a late task is reported, then point the flow at your own server.
    4. Enable `scheduler_check` once pointed at the real server.

    ## How to extend

    - Keep a list of task names that are allowed to be stopped at your site and leave them out in the jq query.
    - Run it as a Subflow across every site with a `ForEach` over a list of OpenMRS URLs.
    - Add a second check on `/ws/rest/v1/visit?includeInactive=false` to count visits left open for days.

    ## Inputs

    - `openmrs_url`: type STRING, default `"https://openmrs.example.org/openmrs"`.
    - `overdue_factor`: type INT, default `3`.
    - `grace_minutes`: type INT, default `15`.
    - `realert_hours`: type INT, default `6`.

    ## Outputs

    - `status`: one of `HEALTHY`, `WARNING`, `CRITICAL`, `UNREACHABLE`.
    - `scheduler`: the full classification as JSON, for example `{"tasks":9,"stopped":1,"overdue":0,"stopped_tasks":"Asynchronous Report Generation And Batch Jobs (last run 2026-10-19T12:48)","status":"CRITICAL",...}`.

    ## Links

    - [OpenMRS REST API reference](https://rest.openmrs.org/)
    - [OpenMRS REST Web Services module](https://github.com/openmrs/openmrs-module-webservices.rest)
    - [Kestra HTTP Request task](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Switch task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.switch)
    - [Kestra KV store](https://kestra.io/docs/concepts/kv-store)

    ## Pitfalls

    - Do not rely on the HTTP code alone: OpenMRS answers `/session` with HTTP 200 for wrong credentials and only sets `authenticated` to false. The flow checks the flag, and a user without `Manage Scheduler` gets a non-200 on task definitions, so both cases are `UNREACHABLE`.
    - Some tasks are set to start with OpenMRS but are deliberately stopped at a site. Leave them out (see How to extend), or they keep the check `CRITICAL`.
    - Tasks that never ran (`lastExecutionTime` empty) are not counted as overdue, since a daily task that started an hour ago has not had its first run yet.
    - `lastExecutionTime` carries a UTC offset, and the flow compares it with Kestra's clock, so keep Kestra's host clock in sync (NTP).
    - The check covers task definitions, the scheduler model of OpenMRS Platform 2.8 and earlier. The new scheduler being built for Platform 2.9 marks them deprecated, so revisit the check when you upgrade.
    - The alert memory is kept per server URL in the namespace KV store (`openmrs_scheduler_last_alert_<url>`). Delete that key to force the next run to page.
    - The check only reads OpenMRS. It never starts, stops or reschedules tasks.
  tags:
    - Data
    - Business
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
