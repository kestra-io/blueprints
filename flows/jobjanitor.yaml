id: jobjanitor
namespace: company.team
description: Finds completed Kubernetes Jobs older than the retention window, deletes them, and reports the cleanup on Slack.

labels:
  project: jobjanitor
  team: platform

inputs:
  - id: namespace
    type: STRING
    displayName: "Namespace"
    description: the namespace whose jobs to clean
    defaults: default
  - id: retention_days
    type: INT
    displayName: "Retention (days)"
    description: completed jobs older than this many days get deleted
    defaults: 7
  - id: dry_run
    type: BOOL
    displayName: "Dry run"
    description: when true, only reports what would be deleted without deleting anything
    defaults: true
  - id: slack_webhook
    type: STRING
    displayName: "Slack Webhook URL"
    description: Incoming webhook URL of the Slack channel for the cleanup report

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: cleans up old completed jobs every Sunday morning
    cron: "0 8 * * 0"
    timezone: UTC
    inputs:
      namespace: default
      retention_days: 7
      dry_run: true
      slack_webhook: "{{ secret('SLACK_WEBHOOK') }}"

tasks:
  - id: list_jobs
    type: io.kestra.plugin.scripts.shell.Commands
    description: lists all jobs in the namespace as JSON
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      user: "0"
    containerImage: bitnami/kubectl
    inputFiles:
      client.crt: "{{ secret('CLIENT_CRT') }}"
      client.key: "{{ secret('CLIENT_KEY') }}"
    commands:
      - kubectl get jobs -n {{ inputs.namespace }} -o json --client-certificate=client.crt --client-key=client.key --server={{ secret('MASTERURL') }} --insecure-skip-tls-verify=true > jobs.json
    outputFiles:
      - jobs.json

  - id: find_stale
    type: io.kestra.plugin.scripts.python.Script
    description: finds completed jobs older than the retention window
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      user: "0"
    containerImage: python:3.11
    dependencies:
      - kestra
    outputFiles:
      - stale.txt
    script: |
      import json
      from datetime import datetime, timezone, timedelta
      from kestra import Kestra

      namespace = """{{ inputs.namespace }}"""
      retention = int("""{{ inputs.retention_days }}""")
      dry_run = """{{ inputs.dry_run }}""".strip().lower() == "true"

      with open("""{{ outputs.list_jobs.outputFiles['jobs.json'] }}""") as f:
          jobs = json.load(f)['items']

      cutoff = datetime.now(timezone.utc) - timedelta(days=retention)

      stale = []
      for job in jobs:
          status = job.get('status', {})
          # only successful completions; failed jobs stay for investigation
          completed = any(
              c.get('type') == 'Complete' and c.get('status') == 'True'
              for c in status.get('conditions', [])
          )
          if not completed:
              continue
          done_at_raw = status.get('completionTime')
          if not done_at_raw:
              continue
          done_at = datetime.fromisoformat(done_at_raw.replace('Z', '+00:00'))
          if done_at < cutoff:
              age = (datetime.now(timezone.utc) - done_at).days
              stale.append({'name': job['metadata']['name'], 'age_days': age})

      # one name per line for the delete step to read
      with open('stale.txt', 'w') as f:
          for s in stale:
              f.write(s['name'] + '\n')

      if dry_run:
          title = f"*JobJanitor - dry run in '{namespace}'*"
          tail = "would delete {n} job(s). set dry_run to false to actually clean."
      else:
          title = f"*JobJanitor - cleaned '{namespace}'*"
          tail = "deleted {n} job(s)."
      lines = [title, ""]
      for s in stale:
          lines.append(f"- *{s['name']}*: completed {s['age_days']} days ago")
      lines.append("")
      lines.append(tail.format(n=len(stale)))
      summary_text = "\n".join(lines)

      Kestra.outputs({
          'stale': stale,
          'count': len(stale),
          'summary_text': summary_text,
      })

  - id: maybe_clean
    type: io.kestra.plugin.core.flow.If
    description: only acts when there is something stale to report
    condition: "{{ outputs.find_stale.vars.count > 0 }}"
    then:
      - id: do_clean
        type: io.kestra.plugin.core.flow.If
        description: deletes the stale jobs, live mode only
        condition: "{{ inputs.dry_run == false }}"
        then:
          - id: delete_jobs
            type: io.kestra.plugin.scripts.shell.Commands
            description: deletes each stale job by name
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
              user: "0"
            containerImage: bitnami/kubectl
            inputFiles:
              client.crt: "{{ secret('CLIENT_CRT') }}"
              client.key: "{{ secret('CLIENT_KEY') }}"
            commands:
              - |
                while read -r name; do
                  if [ -n "$name" ]; then
                    kubectl delete job "$name" -n {{ inputs.namespace }} --client-certificate=client.crt --client-key=client.key --server={{ secret('MASTERURL') }} --insecure-skip-tls-verify=true
                  fi
                done < {{ outputs.find_stale.outputFiles['stale.txt'] }}
      - id: send_summary
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: posts the cleanup summary to Slack
        url: "{{ inputs.slack_webhook }}"
        messageText: "{{ outputs.find_stale.vars.summary_text }}"

extend:
  title: "JobJanitor - Kubernetes completed Job cleaner"
  shortDescription: "Deletes completed Kubernetes Jobs past the retention window and reports the cleanup on Slack."
  metaTitle: "JobJanitor: Kubernetes completed Job cleaner blueprint for Kestra"
  metaDescription: "A Kestra blueprint that cleans up old completed Kubernetes Jobs and posts a Slack summary, with a safe dry-run default."
  tags:
    - Infrastructure
  subTags:
    - Kubernetes Operations
    - Automation
  ee: false
  demo: false
  description: |
    ## How it works

    1. `list_jobs` (`io.kestra.plugin.scripts.shell.Commands`) runs `kubectl get jobs` in the target namespace and saves the full job list as JSON. It authenticates with a client certificate and key passed as Kestra secrets, the same pattern the Kubernetes gallery blueprints use.
    2. `find_stale` (`io.kestra.plugin.scripts.python.Script`) checks every job: only jobs with a `Complete=True` condition and a `completionTime` older than `retention_days` count as stale. Failed jobs are never touched, they stay for investigation. It also writes the stale names to `stale.txt` and builds the Slack summary.
    3. `maybe_clean` (`io.kestra.plugin.core.flow.If`) runs only when something is stale. Inside it, `do_clean` runs only in live mode (`dry_run: false`) and deletes each stale job with kubectl. `send_summary` always posts the report to Slack: what would be deleted in dry-run mode, what was deleted in live mode.
    4. There is no KV state in this flow, and that is deliberate. A janitor does not need memory: once a job is deleted it is gone, and dry-run mode is a report, not an alert.

    ## What you get

    - Automatic cleanup of completed Jobs past the retention window, no more manual `kubectl delete`.
    - A Slack report every run that found something: which jobs, how old, and whether it was a dry run or a real cleanup.
    - Safety by default: `dry_run` is true unless you explicitly turn it off, failed jobs are never deleted, and the retention window guards fresh jobs.
    - Quiet runs when there is nothing stale to clean.

    ## Who it's for

    Anyone running batch Jobs on Kubernetes: migrations, backups, report generators, data loads. Completed jobs pile up forever by default and clutter `kubectl get jobs` until nobody can find the real failures. Works on any cluster you can reach with a client certificate: minikube, kind, managed clusters.

    ## Why orchestrate this with Kestra

    A shell script on a cron server can delete old jobs, but then you need somewhere to hold the secrets, a place to see the run history when something got deleted that should not have been, and a safe dry-run mode you can trust. Kestra gives you all three: secrets stay out of the YAML, every run keeps its logs and outputs where you can audit them, and the dry-run default means the first run can never surprise you.

    ## Prerequisites

    - A Kubernetes cluster reachable from where Kestra runs, with a client certificate and key for authentication.
    - Kestra with the Docker task runner available (used for the kubectl and Python steps).
    - A Slack Incoming Webhook URL.

    ### Secrets

    | Secret | What it is |
    | --- | --- |
    | `CLIENT_CRT` | base64-encoded client certificate for the cluster |
    | `CLIENT_KEY` | base64-encoded client key for the cluster |
    | `MASTERURL` | base64-encoded Kubernetes API server URL, reachable from inside the Kestra container |
    | `SLACK_WEBHOOK` | base64-encoded Slack Incoming Webhook URL |

    In Kestra OSS, secrets come from environment variables prefixed with `SECRET_` and must be base64-encoded.

    ## Quick start

    1. Start Kestra with the four secrets above as `SECRET_` environment variables.
    2. Import this flow and run it with `retention_days: 0` and `dry_run: true`: the Slack report lists what would be deleted, and nothing is touched.
    3. Create a test job that completes (`kubectl create job jj-clean --image=busybox -- sh -c 'echo done'`), wait for it to complete, run again in dry-run mode: it shows up in the report.
    4. Run once with `dry_run: false`: the job is deleted and the Slack report says so. Run again: quiet, nothing stale left.

    ## How to extend

    - Clean up completed Pods too by listing pods with phase Succeeded and deleting the old ones the same way.
    - Add failed jobs to the cleanup with a longer retention window, keeping the safety split between completed and failed.
    - Lower the schedule to daily for busy namespaces by changing the `cron` trigger.
    - Route reports to PagerDuty or Opsgenie by swapping the Slack task for another notification task.

    ## Inputs

    | Input | Type | Default | What it does |
    | --- | --- | --- | --- |
    | `namespace` | STRING | `default` | the namespace whose jobs to clean |
    | `retention_days` | INT | `7` | completed jobs older than this many days get deleted |
    | `dry_run` | BOOL | `true` | when true, only reports what would be deleted without deleting anything |
    | `slack_webhook` | STRING | (required) | Incoming webhook URL of the Slack channel for the cleanup report |

    ## Links

    - [Kestra blueprint catalog](https://kestra.io/blueprints)
    - [Kubernetes Jobs documentation](https://kubernetes.io/docs/concepts/workloads/controllers/job/)
    - [Kestra KV store documentation](https://kestra.io/docs/concepts/kv-store)

    ## Pitfalls

    - `dry_run` defaults to true for a reason. Flip it to false only after you have seen a dry-run report and you trust the list.
    - Only jobs with `Complete=True` are ever deleted. Failed jobs are left alone because they might be evidence for an ongoing investigation.
    - A job without a `completionTime` is skipped. This should not happen for completed jobs, but the guard is there.
    - Make sure the `MASTERURL` is reachable from inside the Kestra container. `localhost` inside the container is not your host: use `host.docker.internal` when Kestra runs in Docker on the same machine as the cluster.
