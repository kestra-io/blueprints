id: scylladb-materialized-view-build-sentinel
namespace: company.database

description: |
  Audit ScyllaDB materialized view build and synchronization states on a recurring schedule,
  identifying failed builds, background view lag, and schema desynchronization before
  downstream queries return inconsistent or stale partition data.

inputs:
  - id: contact_points
    type: STRING
    defaults: "localhost:9042"
    displayName: "Contact Points"
    description: "Comma-separated host:port contact points for ScyllaDB cluster nodes."

  - id: local_datacenter
    type: STRING
    defaults: "datacenter1"
    displayName: "Local Datacenter"
    description: "Name of the local ScyllaDB datacenter used for driver load balancing."

  - id: remediation_mode
    type: SELECT
    values:
      - "ALERT_ONLY"
      - "LOG_GUIDANCE"
    defaults: "ALERT_ONLY"
    displayName: "Remediation Mode"
    description: "Response strategy on detected view degradation: dispatch Slack notification only or record remediation telemetry."

triggers:
  - id: periodic_view_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */6 * * *"
    disabled: true
    inputs:
      contact_points: "localhost:9042"
      local_datacenter: "datacenter1"
      remediation_mode: "ALERT_ONLY"

tasks:
  - id: probe_view_build_status
    type: io.kestra.plugin.scylladb.Query
    description: "Query ScyllaDB system.view_build_status table to inspect the build and synchronization state of all materialized views."
    connection:
      contactPoints: "{{ inputs.contact_points | split(',') }}"
      localDatacenter: "{{ inputs.local_datacenter }}"
      username: "{{ secret('SCYLLADB_USERNAME') }}"
      password: "{{ secret('SCYLLADB_PASSWORD') }}"
    cql: "SELECT keyspace_name, view_name, status FROM system.view_build_status;"
    fetchType: FETCH

  - id: evaluate_view_status
    type: io.kestra.plugin.core.flow.Switch
    description: "Evaluate whether any materialized view has failed to build or remains in an incomplete state."
    value: "{{ (outputs.probe_view_build_status.rows is defined and outputs.probe_view_build_status.rows | length > 0 and (outputs.probe_view_build_status.rows | jq('[.[] | select(.status != \"SUCCESS\")] | length') | first | default(0)) > 0) ? 'VIEW_BUILD_DEGRADED' : 'HEALTHY' }}"
    cases:
      "HEALTHY":
        - id: log_views_healthy
          type: io.kestra.plugin.core.log.Log
          description: "Record healthy status when all materialized views are verified in SUCCESS status."
          message: "ScyllaDB materialized views are healthy. Total audited views: {{ outputs.probe_view_build_status.size ?? 0 }}. All views report status SUCCESS."
      "VIEW_BUILD_DEGRADED":
        - id: alert_view_degraded
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatch urgent operational notification to Slack detailing degraded materialized views."
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {"text": "ScyllaDB Materialized View Alert: Detected degraded materialized views in cluster. At least one view failed to build or remains incomplete. Total audited views: {{ outputs.probe_view_build_status.size }}. Check nodetool viewbuildstatus immediately. Remediation mode: {{ inputs.remediation_mode }}."}
        - id: log_remediation_guidance
          type: io.kestra.plugin.core.log.Log
          description: "Log diagnostic guidance for database administrators to repair degraded materialized views."
          message: "Remediation guidance: Run 'nodetool viewbuildstatus' across cluster nodes. If view building failed, consider rebuilding the affected view using 'nodetool rebuild_view <keyspace> <view>' or inspect system.log for compaction and tombstone timeouts. Mode: {{ inputs.remediation_mode }}."
    defaults:
      - id: log_fallback_state
        type: io.kestra.plugin.core.log.Log
        description: "Fallback logger for unexpected view status evaluation states."
        message: "ScyllaDB materialized view audit completed with unclassified metrics."

  - id: log_audit_completion
    type: io.kestra.plugin.core.log.Log
    description: "Record audit completion summary for execution lineage and compliance tracking."
    message: "ScyllaDB materialized view sentinel audit pass completed for datacenter '{{ inputs.local_datacenter }}'. Audited views count: {{ outputs.probe_view_build_status.size ?? 0 }}."

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Dispatch urgent Slack notification if flow execution encounters an unexpected error."
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {"text": "Flow execution failed: scylladb-materialized-view-build-sentinel encountered an error during execution {{ execution.id }}."}

extend:
  title: "Audit ScyllaDB Materialized View Build Status and Desynchronization"
  metaTitle: "ScyllaDB Materialized View Build Sentinel | Kestra"
  shortDescription: "Audit ScyllaDB materialized view build status and detect view synchronization failures with automated Slack alerts."
  metaDescription: "Audit ScyllaDB materialized view build status with Kestra. Detect view synchronization failures and dispatch automated Slack incident alerts."
  description: |
    ScyllaDB Materialized Views allow developers to query base table data using alternative
    partition keys without maintaining dual-write pipelines in application code. When base tables
    receive writes, ScyllaDB asynchronously generates and streams view updates in the background.
    During cluster node additions, heavy compaction loads, or network blips, view generation can
    stall or enter a `FAILED` state in ScyllaDB's internal `system.view_build_status` metadata.
    When a view build fails or falls behind, queries routed to the materialized view silently return
    incomplete or stale results, violating application data consistency.

    This blueprint implements an automated Day 2 Operations sentinel that queries ScyllaDB on a
    recurring schedule. It reads the cluster-wide `system.view_build_status` table via native CQL,
    evaluates whether all materialized views have achieved `SUCCESS` state, identifies lagging or
    unsuccessful builds, and automatically dispatches Slack incident alerts with operational
    guidance to database administrators before stale data affects end-user workloads.

    ## How it works

    1. `periodic_view_audit` (`io.kestra.plugin.core.trigger.Schedule`) triggers the audit pass every 6 hours (shipped disabled for safe initial onboarding).
    2. `probe_view_build_status` (`io.kestra.plugin.scylladb.Query`) executes a CQL query against the internal `system.view_build_status` table with `fetchType: FETCH`, retrieving the build state for every materialized view across the cluster.
    3. `evaluate_view_status` (`io.kestra.plugin.core.flow.Switch`) applies a Pebble condition to verify whether any materialized view has a status other than `SUCCESS`.
    4. When within acceptable operational limits (`HEALTHY`), `log_views_healthy` records that all views report `SUCCESS` along with total view counts.
    5. When a degraded or incomplete view build is detected (`VIEW_BUILD_DEGRADED`), `alert_view_degraded` dispatches an urgent alert to Slack using `io.kestra.plugin.slack.notifications.SlackIncomingWebhook`, and `log_remediation_guidance` logs actionable recovery steps.
    6. `log_audit_completion` writes a final audit recap for execution tracking and compliance lineage.
    7. The flow-level `errors` block alerts Slack immediately if CQL authentication or node connectivity fails.

    ## What you get

    - Proactive visibility into ScyllaDB materialized view build failures before stale queries impact production applications.
    - Automated cluster-wide inspection across all keyspaces and materialized views in a single pass.
    - Instant Slack incident notifications alerting DBAs to run view rebuild procedures.
    - Diagnostic logging with direct nodetool remediation commands (`nodetool rebuild_view`).
    - Flow-level error alerting safeguarding audit pipeline reliability.

    ## Who it's for

    - Database Administrators (DBAs) and Site Reliability Engineers managing ScyllaDB or Apache Cassandra clusters.
    - Platform Engineers maintaining distributed NoSQL databases with materialized view schemas.
    - Backend Architects relying on materialized views for low-latency secondary index lookups.

    ## Why orchestrate this with Kestra

    Monitoring ScyllaDB internal system tables with standalone cron scripts requires managing
    CQL driver binaries, credential rotation, connection pool lifecycle, and alerting webhooks
    in brittle custom infrastructure. Kestra provides a declarative workflow engine with native
    ScyllaDB CQL support, centralized secret management, conditional branching, execution
    history, and native Slack integrations without maintaining separate monitoring daemons.

    ## Prerequisites

    - A running ScyllaDB cluster (v5.x or compatible Apache Cassandra v4.x deployment).
    - Database credentials with read access to the `system` keyspace.
    - A Slack Incoming Webhook URL configured in Kestra secrets.

    ### Local Docker Container Setup

    To run ScyllaDB locally for development and testing without host port conflicts:

    ```bash
    docker run -d --name scylla-dev -p 9042:9042 scylladb/scylla:5.2 \
      --smp 1 --memory 1G --overprovisioned 1
    ```

    If Kestra is running inside a Docker network, connect the ScyllaDB container to Kestra's network:

    ```bash
    docker network ls
    docker network connect YOUR_KESTRA_NETWORK scylla-dev
    ```

    ### Secrets

    - `SCYLLADB_USERNAME`: Username for ScyllaDB cluster authentication (leave blank if authentication is disabled in dev).
    - `SCYLLADB_PASSWORD`: Password for ScyllaDB cluster authentication.
    - `SLACK_WEBHOOK`: Incoming Webhook URL for Slack alerting.

    > Note for Kestra Open-Source (OSS): Secrets are configured as base64-encoded environment variables formatted as `SECRET_<NAME>` (e.g. `SECRET_SCYLLADB_PASSWORD`).

    ### Inputs

    | Name | Type | Default | Allowed Values | Description |
    | :--- | :--- | :--- | :--- | :--- |
    | `contact_points` | STRING | `"localhost:9042"` | Comma-separated host:port | ScyllaDB node contact points |
    | `local_datacenter` | STRING | `"datacenter1"` | String identifier | Local datacenter for load balancing |
    | `remediation_mode` | SELECT | `"ALERT_ONLY"` | `"ALERT_ONLY"`, `"LOG_GUIDANCE"` | Action mode on view build degradation |

    ### Outputs

    - `{{ outputs.probe_view_build_status.rows }}`: List of rows from `system.view_build_status` containing `keyspace_name`, `view_name`, and `status`.
    - `{{ outputs.probe_view_build_status.size }}`: Total number of materialized view records audited.

    ## Quick start

    1. Configure `SCYLLADB_USERNAME`, `SCYLLADB_PASSWORD`, and `SLACK_WEBHOOK` in your Kestra namespace secrets.
    2. Import this blueprint into your Kestra instance.
    3. Run a manual execution with `contact_points` pointing to your cluster to verify connectivity and view status retrieval.
    4. Enable the `periodic_view_audit` schedule trigger to run automated recurring audits.

    ## How to extend

    - Add automated view rebuild trigger by invoking `io.kestra.plugin.scripts.shell.Commands` to execute `nodetool rebuild_view` over SSH or JMX upon build failure.
    - Integrate with PagerDuty or Opsgenie in the `VIEW_BUILD_DEGRADED` branch for critical consumer-facing views.
    - Chain a downstream subflow using `io.kestra.plugin.core.flow.Subflow` to pause upstream batch loading jobs until materialized views finish synchronization.

    ## Pitfalls

    - **Local Datacenter Name**: ScyllaDB Java driver requires an exact match for `connection.localDatacenter` (e.g., `datacenter1` or `us-east-1`). Providing an invalid datacenter name will cause initial connection failure.
    - **Empty Result When No Views Exist**: If the cluster has no materialized views defined, `system.view_build_status` returns zero rows. The Pebble condition safely defaults to `HEALTHY`.
    - **Port Availability**: Ensure CQL native protocol port 9042 is open and accessible between the Kestra worker and ScyllaDB nodes.

    ## Links

    - [Kestra ScyllaDB Plugin Documentation](https://kestra.io/plugins/plugin-scylladb)
    - [ScyllaDB Materialized Views Guide](https://docs.scylladb.com/manual/materialized-views/)
    - [ScyllaDB Nodetool ViewBuildStatus Documentation](https://docs.scylladb.com/manual/nodetool/viewbuildstatus/)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
