id: mcp-governed-action-executor
namespace: company.team

description: |
  Executor for governed actions. Not an MCP tool: it is started by mcp-governed-action-request,
  and can also be started by hand or by its webhook with a key. It only acts on a request row
  that is in status `claimed`, so a run with an unknown key, or a key that was already handled,
  does nothing.

inputs:
  - id: key
    type: STRING
    # Not required: a webhook run gets the key from the request body instead.
    required: false
    validator: '^[A-Za-z0-9_-]{1,64}$'
    description: Request key of a row created by mcp-governed-action-request.

variables:
  # Placeholders: replace with your own values.
  jdbc_url: jdbc:postgresql://demo-postgres:5432/demo
  jdbc_user: governed_actions
  kestra_url: http://localhost:8080
  # Environments that need a human approval. Fixed list, never an input.
  approval_environments: production
  # Fixed map: the schema name is never taken from free text.
  schemas:
    staging: staging
    production: production

tasks:
  # The key comes from the input, or from {"key": "..."} in a webhook body. Never from anything else.
  - id: resolve_key
    type: io.kestra.plugin.core.output.OutputValues
    values:
      key: "{{ inputs.key ?? trigger.body.key ?? '' }}"

  - id: claim_request
    # Webhook bodies are not validated by Kestra, so the pattern is also checked in SQL: an invalid key matches no row.
    description: Atomically take a claimed request. Zero rows means nothing to do.
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "{{ vars.jdbc_url }}"
    username: "{{ vars.jdbc_user }}"
    password: "{{ secret('PG_PASSWORD') }}"
    fetchType: FETCH_ONE
    sql: |
      UPDATE public.governed_requests
      SET status = CASE WHEN environment = ANY(string_to_array(CAST(:approval_environments AS text), ',')) THEN 'pending' ELSE 'running' END,
          executor_execution_id = CAST(:exec AS text),
          updated_at = now()
      WHERE request_key = CAST(:key AS text) AND status = 'claimed'
        AND CAST(:key AS text) ~ '^[A-Za-z0-9_-]{1,64}$'
        AND (executor_execution_id IS NULL OR executor_execution_id = CAST(:exec AS text))
      RETURNING environment, days, status
    parameters:
      key: "{{ outputs.resolve_key.values.key }}"
      exec: "{{ execution.id }}"
      approval_environments: "{{ vars.approval_environments }}"

  - id: has_claim
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (outputs.claim_request.size ?? 0) > 0 }}"
    then:
      - id: notify_approvers
        type: io.kestra.plugin.core.flow.Sequential
        runIf: "{{ outputs.claim_request.row.status == 'pending' }}"
        # A failed notification must never block the approval.
        allowFailure: true
        tasks:
          - id: notify_slack
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            retry:
              type: constant
              interval: PT10S
              maxAttempts: 3
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            # toJson escapes the whole text, so no input can break the JSON string.
            payload: |
              {
                "text": {{ ('Approval needed: ' ~ outputs.claim_request.row.environment ~ ' purge of rows older than ' ~ outputs.claim_request.row.days ~ ' days (request ' ~ outputs.resolve_key.values.key ~ '). Approve or deny: ' ~ vars.kestra_url ~ '/ui/' ~ flow.tenantId ~ '/executions/' ~ flow.namespace ~ '/' ~ flow.id ~ '/' ~ execution.id) | toJson }}
              }
        errors:
          - id: record_unnotified
            type: io.kestra.plugin.jdbc.postgresql.Query
            url: "{{ vars.jdbc_url }}"
            username: "{{ vars.jdbc_user }}"
            password: "{{ secret('PG_PASSWORD') }}"
            sql: |
              UPDATE public.governed_requests SET status = 'pending_unnotified', updated_at = now()
              WHERE request_key = CAST(:key AS text) AND executor_execution_id = CAST(:exec AS text) AND status = 'pending'
            parameters:
              key: "{{ outputs.resolve_key.values.key }}"
              exec: "{{ execution.id }}"

      - id: wait_for_approval
        type: io.kestra.plugin.core.flow.Pause
        runIf: "{{ outputs.claim_request.row.status == 'pending' }}"
        # Literal values on purpose: templated pause settings are ignored in Kestra 2.0.4.
        # FAIL makes the `errors` block run on timeout; WARN and RESUME would run the next task.
        pauseDuration: PT1H
        behavior: FAIL
        onResume:
          - id: decision
            type: SELECT
            required: true
            defaults: deny
            values:
              - approve
              - deny
          - id: approver
            type: STRING
            required: false
            description: Self-asserted name of the approver.

      - id: label_execution
        type: io.kestra.plugin.core.execution.Labels
        allowFailure: true
        labels:
          # Label values cannot be empty: `default` also replaces an empty string.
          environment: "{{ outputs.claim_request.row.environment }}"
          decision: "{{ outputs.claim_request.row.status == 'pending' ? (outputs.wait_for_approval.onResume.decision | default('deny')) : 'auto' }}"
          decided_by: "{{ outputs.claim_request.row.status == 'pending' ? (outputs.wait_for_approval.onResume.approver | default('unknown')) : 'auto' }}"

      # The Pause is NOT the gate: resuming with a wrong or missing field proceeds with defaults.
      # Only an explicit decision == approve (or no approval required) runs the action.
      - id: authorization_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.claim_request.row.status == 'running' or (outputs.wait_for_approval.onResume.decision ?? 'deny') == 'approve' }}"
        then:
          - id: record_running
            type: io.kestra.plugin.jdbc.postgresql.Query
            url: "{{ vars.jdbc_url }}"
            username: "{{ vars.jdbc_user }}"
            password: "{{ secret('PG_PASSWORD') }}"
            sql: |
              UPDATE public.governed_requests
              SET status = 'running', decided_by = CAST(:decided_by AS text), updated_at = now()
              WHERE request_key = CAST(:key AS text) AND executor_execution_id = CAST(:exec AS text)
                AND status IN ('pending', 'pending_unnotified', 'running')
            parameters:
              key: "{{ outputs.resolve_key.values.key }}"
              exec: "{{ execution.id }}"
              decided_by: "{{ outputs.claim_request.row.status == 'pending' ? (outputs.wait_for_approval.onResume.approver | default('unknown')) : 'auto' }}"

          # ONE statement: the DELETE and the `executed` update commit or roll back together.
          # Schema comes from the fixed map, days from the claimed row. Both the DELETE and the UPDATE
          # require the row to be `running` for this execution.
          - id: purge_and_record
            type: io.kestra.plugin.jdbc.postgresql.Query
            url: "{{ vars.jdbc_url }}"
            username: "{{ vars.jdbc_user }}"
            password: "{{ secret('PG_PASSWORD') }}"
            fetchType: FETCH_ONE
            sql: |
              WITH purged AS (
                DELETE FROM {{ vars.schemas[outputs.claim_request.row.environment] }}.demo_events
                WHERE created_at < now() - make_interval(days => CAST(:days AS integer))
                  AND EXISTS (
                    SELECT 1 FROM public.governed_requests
                    WHERE request_key = CAST(:key AS text) AND executor_execution_id = CAST(:exec AS text) AND status = 'running'
                  )
                RETURNING 1
              )
              UPDATE public.governed_requests
              SET status = 'executed', updated_at = now()
              WHERE request_key = CAST(:key AS text) AND executor_execution_id = CAST(:exec AS text) AND status = 'running'
              RETURNING (SELECT count(*) FROM purged) AS deleted_rows
            parameters:
              days: "{{ outputs.claim_request.row.days }}"
              key: "{{ outputs.resolve_key.values.key }}"
              exec: "{{ execution.id }}"

          # Zero rows means the row was no longer `running` for this execution (for example a Restart after
          # a recorded failure). Nothing was deleted: fail so the execution does not look successful.
          - id: fail_if_not_executed
            type: io.kestra.plugin.core.execution.Fail
            runIf: "{{ (outputs.purge_and_record.size ?? 0) == 0 }}"
            errorMessage: "Request {{ outputs.resolve_key.values.key }} is not running for this execution. Nothing was deleted."
        else:
          - id: record_rejected
            type: io.kestra.plugin.jdbc.postgresql.Query
            url: "{{ vars.jdbc_url }}"
            username: "{{ vars.jdbc_user }}"
            password: "{{ secret('PG_PASSWORD') }}"
            sql: |
              UPDATE public.governed_requests
              SET status = 'rejected', decided_by = CAST(:decided_by AS text), updated_at = now()
              WHERE request_key = CAST(:key AS text) AND executor_execution_id = CAST(:exec AS text)
                AND status IN ('pending', 'pending_unnotified')
            parameters:
              key: "{{ outputs.resolve_key.values.key }}"
              exec: "{{ execution.id }}"
              decided_by: "{{ outputs.wait_for_approval.onResume.approver | default('unknown') }}"
    else:
      - id: nothing_to_do
        type: io.kestra.plugin.core.log.Log
        message: "Nothing to do: the key is empty or invalid, unknown, or its request is not in status claimed."

errors:
  # Pending: not approved within 1 hour, or the executor failed before the purge started. Running: the purge failed.
  - id: record_expired
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "{{ vars.jdbc_url }}"
    username: "{{ vars.jdbc_user }}"
    password: "{{ secret('PG_PASSWORD') }}"
    sql: |
      UPDATE public.governed_requests SET status = 'expired', updated_at = now()
      WHERE request_key = CAST(:key AS text) AND executor_execution_id = CAST(:exec AS text)
        AND status IN ('pending', 'pending_unnotified')
    parameters:
      key: "{{ outputs.resolve_key.values.key ?? '' }}"
      exec: "{{ execution.id }}"

  - id: record_failed
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "{{ vars.jdbc_url }}"
    username: "{{ vars.jdbc_user }}"
    password: "{{ secret('PG_PASSWORD') }}"
    sql: |
      UPDATE public.governed_requests SET status = 'failed', updated_at = now()
      WHERE request_key = CAST(:key AS text) AND executor_execution_id = CAST(:exec AS text)
        AND status = 'running'
    parameters:
      key: "{{ outputs.resolve_key.values.key ?? '' }}"
      exec: "{{ execution.id }}"

triggers:
  - id: webhook
    type: io.kestra.plugin.core.trigger.Webhook
    # The webhook needs no Kestra credentials: this key is its only protection. Anyone who knows it can start
    # this flow with a body like {"key": "<request key>"}. It cannot bypass approval, but anyone with the key can
    # take over a `claimed` request, so the id returned to the agent may then point to a no-op execution.
    key: "{{ secret('GOVERNED_EXECUTOR_WEBHOOK_KEY') }}"

extend:
  title: Governed Action Executor with Human Approval Gate
  metaTitle: Governed Action Executor with Human Approval | Kestra Blueprint
  shortDescription: Executor for governed MCP actions. It takes a claimed request, asks a human for approval when the environment requires it, and runs one atomic Postgres purge and status update.
  metaDescription: Pause for human approval, check the decision explicitly, then purge rows and record the result in one atomic Postgres statement. Webhook or manual start.
  description: |
    Executor of the governed MCP actions pattern. It is started by `mcp-governed-action-request`, which also documents setup, secrets and the security model: read it first. Companion flow: `mcp-governed-action-status`.

    ## How it works

    1. `resolve_key` takes the key from the `key` input or from `{"key": "..."}` in a webhook body.
    2. `claim_request` moves the row from `claimed` to `pending` (the environment needs approval) or `running` (it does not) in one `UPDATE ... RETURNING`. It only matches a key that fits `^[A-Za-z0-9_-]{1,64}$` (checked in SQL, so a webhook body cannot bypass it) and a row with no executor yet, or this one. Zero rows means nothing to do.
    3. For approval environments, `notify_approvers` posts a Slack message with a link to this execution (3 attempts). If all fail, the row becomes `pending_unnotified`, the approval keeps waiting, and the execution ends with a WARNING.
    4. `wait_for_approval` pauses for 1 hour (`behavior: FAIL`). The decision defaults to `deny`.
    5. `authorization_gate` runs the purge only for an explicit `approve`, or when no approval is required. `purge_and_record` is one SQL statement: the `DELETE` and the update to `executed` commit or roll back together, and both require the row to be `running` for this execution.
    6. Errors: `pending` or `pending_unnotified` becomes `expired`, `running` becomes `failed`.

    ## What you get

    - A claim that decides whether approval is needed from the row and a fixed list of environments, never from an input.
    - A Slack approval message with a link to the paused execution, retried, with a recorded status when it fails.
    - A one-hour approval window, a decision that defaults to `deny`, and a purge that only runs for an explicit `approve`.
    - A result recorded in the row (`executed`, `rejected`, `expired` or `failed`) and labels on the execution (`environment`, `decision`, `decided_by`).
    - A webhook and a manual run that can only act on a row in status `claimed`.

    ## Who it's for

    Teams that run the request flow and need to know what happens after an agent asks for a production action. It also works on its own for any `claimed` row, started by hand or by its webhook, if you want the approval-then-purge half without the MCP tool.

    ## Why orchestrate this with Kestra

    A shell script can delete rows, but it cannot wait an hour for a person without holding anything open, keep the decision next to the execution, retry a notification, or turn a failure into a recorded status. Here the Pause holds the approval, the `errors` block records `expired` or `failed`, labels show who decided what, and the purge only deletes while the row is `running` for this execution, so a Restart after a recorded failure deletes nothing.

    ## Tested end to end

    On Kestra 2.0.4 OSS with Postgres 16, as a least-privilege role, with a local Slack stub.

    - Staging runs at once; production waits, and approve, deny, a resume with no fields and a resume with a wrong field behave as described. Nothing is deleted before approval or after a deny.
    - Slack down: the row becomes `pending_unnotified` and approving still works.
    - A real Pause expiry (tested with a 20-second copy of the pause) ends in `expired` with nothing deleted.
    - Restart after a failed purge deletes nothing and fails with "Nothing was deleted". A stuck `claimed` row is recovered by a direct run or a Restart.
    - Webhook runs on a claimed row; a wrong webhook key returns 404.
    - Five simultaneous approvals of the same pause: one accepted, four answered 409, one `DELETE`.
    - 25 keys with 50 webhook calls racing the starting executor: every key executed exactly once. For 5 of the 10 production keys the webhook won the claim, so the id returned to the agent pointed to an executor that did nothing.

    ## Prerequisites

    - Postgres with the tables from the Database setup in `mcp-governed-action-request` (`public.governed_requests` and `<schema>.demo_events`).
    - Secrets: `PG_PASSWORD` (database password), `SLACK_WEBHOOK_URL` (Slack incoming webhook) and `GOVERNED_EXECUTOR_WEBHOOK_KEY` (webhook key, a long random value).
    - Replace the placeholders in `variables`: `jdbc_url`, `jdbc_user` and `kestra_url`. Change `kestra_url` to your own Kestra URL: it is a placeholder (`http://localhost:8080`), and the approval link in the Slack message is built from it because `kestra.url` is unset in Kestra 2.0.4. Left as is, the link points to localhost.

    ## Quick start

    1. Import this flow first, then `mcp-governed-action-request` and `mcp-governed-action-status`, all into the same namespace.
    2. To try it without the MCP tool, insert a request row: `INSERT INTO public.governed_requests (request_key, environment, days, status) VALUES ('demo-1', 'staging', 30, 'claimed');`
    3. Run this flow with `key` set to `demo-1`. A `staging` row runs the purge at once. To see the approval, insert a second row with a new key and `production` (for example `demo-2`) and run the flow with that key: the execution pauses. Open it from the Slack link, or from the Executions list, and choose `approve` or `deny`.

    ## How to extend

    Ideas, not tested in this blueprint:

    - Replace the demo `DELETE` in `purge_and_record` with your own action and keep its guards.
    - Change the approval window by editing the literal `pauseDuration`. It has to stay a literal: templated Pause settings are ignored in Kestra 2.0.4.
    - Replace `notify_slack` inside `notify_approvers` with your own channel or ticket system. Keep that block's `allowFailure` and `record_unnotified` so a failed notification stays visible.
    - Replace the self-asserted approver with a checked identity, for example by approving through your own front end.

    ## Inputs

    - `key` (STRING, optional, `^[A-Za-z0-9_-]{1,64}$`): request key of a row created by `mcp-governed-action-request`. Environment and days are read from the row, never from inputs. A webhook run passes it as `{"key": "..."}`.

    ## Known limits

    - Direct and webhook runs cannot bypass approval, but anyone with the key can take over a `claimed` request, so the id returned to the agent may then point to a no-op execution. The webhook needs no Kestra credentials: its key, read from the `GOVERNED_EXECUTOR_WEBHOOK_KEY` secret, is the only protection.
    - The approver name is self-asserted text, not an authenticated identity. Anyone who can resume the execution can approve.
    - If the status is `pending_unnotified`, nobody was told. Nothing re-sends the link on its own: calling `governed_action_status` re-sends it once the row has been `pending_unnotified` for 10 minutes.
    - A killed executor or a lost worker leaves the row in `pending`, `pending_unnotified` or `running`. `running` means the purge statement had not committed (it is atomic). After checking in the Executions list that the executor is really gone, reset it: `UPDATE public.governed_requests SET status = 'failed', updated_at = now() WHERE request_key = '<key>' AND status IN ('pending', 'pending_unnotified', 'running');` The key can then be requested again with the same environment and days.
    - A row stuck in `claimed`: if no executor was started, run this flow by hand with the key, call its webhook, or Restart the failed request execution. If an executor was started but failed before claiming, Restart that executor execution: the claim only accepts the executor recorded on the row.
    - Restart or Replay: Replay finds no `claimed` row and does nothing. A Restart re-runs the failed task. After a recorded failure the purge deletes nothing and the execution fails with "Nothing was deleted". If recording `failed` also failed (for example the database was down), the row stays `running` and a Restart can re-run the purge with the old approval.

    ## Links

    - [Pause task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.pause)
    - [Webhook trigger](https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.webhook)
    - [Postgres plugin](https://kestra.io/plugins/plugin-jdbc-postgres)
    - [Slack plugin](https://kestra.io/plugins/plugin-slack)

    This blueprint was created by [daiwangk](https://github.com/daiwangk).
