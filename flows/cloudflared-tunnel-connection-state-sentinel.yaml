id: cloudflared-tunnel-connection-state-sentinel
namespace: company.cloud

inputs:
  - id: account_id
    type: STRING
    description: Target Cloudflare Account ID.
  - id: tunnel_id
    type: STRING
    description: Target Cloudflare Tunnel UUID to audit.

tasks:
  - id: inspect_tunnel_connections
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query Cloudflare API for Zero Trust Tunnel connection details
        curl -s -H "Authorization: Bearer {{ secret('CLOUDFLARE_API_TOKEN') }}" \
          "https://api.cloudflare.com/client/v4/accounts/{{ inputs.account_id }}/cfd_tunnel/{{ inputs.tunnel_id }}/connections" > /tmp/cf_tunnel.json

        python3 -c "
        import json
        try:
            with open('/tmp/cf_tunnel.json') as f:
                data = json.load(f)
            success = data.get('success', False)
            conns = data.get('result', [])
            active_edges = len([c for c in conns if c.get('is_pending_reconnect') is False])
            is_breach = 1 if not success or active_edges < 2 else 0
            print(f'{is_breach}|{active_edges}|{len(conns)}')
        except Exception:
            print('1|0|0')
        " > /tmp/cf_summary.txt

        IS_BREACH=$(cut -d '|' -f 1 /tmp/cf_summary.txt)
        ACTIVE_EDGES=$(cut -d '|' -f 2 /tmp/cf_summary.txt)
        TOTAL_CONNS=$(cut -d '|' -f 3 /tmp/cf_summary.txt)
        
        echo "::set-output name=is_breach::${IS_BREACH:-0}::"
        echo "::set-output name=active_edges::$ACTIVE_EDGES::"
        echo "::set-output name=total_conns::$TOTAL_CONNS::"

  - id: evaluate_tunnel_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_tunnel_connections.vars.is_breach | int == 1 }}"
    then:
      - id: notify_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#infra-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Cloudflare Zero Trust Tunnel Disconnection Alert",
                "text": "Tunnel {{ inputs.tunnel_id }} has only {{ outputs.inspect_tunnel_connections.vars.active_edges }} healthy edge connection(s) (Total: {{ outputs.inspect_tunnel_connections.vars.total_conns }}). Cloudflare connector daemon has lost redundancy or disconnected, exposing internal services to edge routing failures.",
                "footer": "Kestra Cloud Sentinel • Cloudflare"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#infra-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Cloudflare Tunnel Sentinel Failure",
            "text": "Failed to query tunnel connections for tunnel {{ inputs.tunnel_id }} on Cloudflare API.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    disabled: true
    inputs:
      account_id: replace-with-your-account-id
      tunnel_id: replace-with-your-tunnel-id

extend:
  metaDescription: "Audits Cloudflare Zero Trust tunnels to detect edge connection drops and connector daemon failures."
  metaTitle: Cloudflare Zero Trust Tunnel Active Edge Connection Sentinel with Kestra
  ee: false
  demo: false
  title: Cloudflare Zero Trust Tunnel Active Edge Connection Sentinel
  shortDescription: Audits Cloudflare Zero Trust tunnels to detect edge connection drops and connector daemon failures.
  description: |
    ## How it works
    This workflow connects to the Cloudflare REST API (`/accounts/{account}/cfd_tunnel/{tunnel}/connections`) using an administrative API token to audit Cloudflare Tunnel (cloudflared) edge connections. Cloudflare Tunnels expose private web applications and internal APIs to Cloudflare's global anycast edge without opening public inbound firewall ports. Each healthy tunnel daemon maintains four active connections across redundant edge datacenters. When daemon pods crash, egress firewalls block outbound UDP/QUIC traffic, or DNS resolutions fail, connections drop into pending reconnect status. This sentinel audits edge redundancy and dispatches incident alerts.

    ## What you get
    - Real-time tracking of Cloudflare Zero Trust tunnel edge connection health.
    - Protection against internal service blackholes and edge routing failures.
    - Automated Slack incident notifications detailing active edge connections.

    ## Who it's for
    - Cloud Infrastructure and Network Security Engineers operating Zero Trust access.
    - SREs safeguarding internal ingress routing and private API gateways.
    - DevOps Teams maintaining `cloudflared` daemons on Kubernetes.

    ## Why orchestrate this with Kestra
    - **Automated Network Surveillance**: Regularly audits tunnel connectivity on a scheduled cadence.
    - **Encrypted Credential Protection**: Safely injects Cloudflare API tokens via Kestra secrets.
    - **Incident Orchestration**: Notifies platform engineers directly in team collaboration channels.

    ## Prerequisites
    - Cloudflare Account ID and Tunnel UUID.
    - Cloudflare API token with `Tunnel:Read` permissions.
    - Slack incoming webhook URL configured in `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Add `CLOUDFLARE_API_TOKEN` and `SLACK_WEBHOOK` secrets.
    3. Specify `account_id` and `tunnel_id`.
    4. Enable the schedule trigger for continuous tunnel surveillance.

    ## How to extend
    - Automatically trigger a `cloudflared` deployment restart in Kubernetes.
    - Audit all tunnels in an account via `/accounts/{account}/cfd_tunnel`.
    - Route critical alerts to PagerDuty or Opsgenie.

    ## Links
    - [Cloudflare Tunnel API Documentation](https://developers.cloudflare.com/api/operations/cloudflare-tunnel-get-a-cloudflare-tunnel)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Infrastructure Automation
    - Day 2 Operations
