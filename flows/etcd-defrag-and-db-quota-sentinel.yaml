id: etcd-defrag-and-db-quota-sentinel
namespace: company.team

concurrency:
  limit: 1

inputs:
  - id: etcd_endpoint
    displayName: etcd Client Endpoint
    type: STRING
    defaults: "http://localhost:2379"
    description: Base HTTP/gRPC client endpoint of the target etcd cluster member.

  - id: quota_mb_limit
    displayName: Database Quota Limit (MB)
    type: INT
    defaults: 2048
    description: Maximum storage backend quota in megabytes (default 2048 MB for 2GB quota-backend-bytes).

  - id: fragmentation_threshold_pct
    displayName: Fragmentation Threshold (%)
    type: INT
    defaults: 40
    description: Free fragmentation percentage threshold that triggers proactive defragmentation alerts.

  - id: slack_channel
    displayName: Slack Channel
    type: STRING
    defaults: "#kubernetes-reliability"
    description: Slack channel destination for distributed key-value storage alerts.

triggers:
  - id: poll_etcd_storage
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    description: Periodic health probe measuring etcd database size and fragmentation every fifteen minutes.

tasks:
  - id: inspect_etcd_db_status
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    description: Interrogates etcd v3 maintenance status API to compute database size in use and fragmentation.
    env:
      ETCD_URL: "{{ inputs.etcd_endpoint }}"
      QUOTA_MB: "{{ inputs.quota_mb_limit }}"
      FRAG_THRESHOLD: "{{ inputs.fragmentation_threshold_pct }}"
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      endpoint = os.environ.get("ETCD_URL", "http://localhost:2379").rstrip("/")
      quota_mb = float(os.environ.get("QUOTA_MB", "2048"))
      quota_limit = quota_mb * 1024 * 1024
      frag_threshold = float(os.environ.get("FRAG_THRESHOLD", "40"))

      url = f"{endpoint}/v3/maintenance/status"
      try:
          response = requests.post(url, json={}, timeout=10)
          response.raise_for_status()
          payload = response.json()
          db_size = float(payload.get("dbSize", 0))
          db_in_use = float(payload.get("dbSizeInUse", db_size))
      except Exception as err:
          print(f"CRITICAL: Failed to query live etcd endpoint at {url}: {err}", file=sys.stderr)
          sys.exit(1)

      db_size_mb = round(db_size / (1024 * 1024), 2)
      db_in_use_mb = round(db_in_use / (1024 * 1024), 2)
      quota_utilization_pct = round((db_size / quota_limit) * 100, 2) if quota_limit > 0 else 0.0

      frag_bytes = max(0.0, db_size - db_in_use)
      frag_pct = round((frag_bytes / db_size) * 100, 2) if db_size > 0 else 0.0
      requires_defrag = (frag_pct >= frag_threshold or quota_utilization_pct >= 85.0)

      report = {
          "endpoint": endpoint,
          "db_size_mb": db_size_mb,
          "db_in_use_mb": db_in_use_mb,
          "quota_mb": quota_mb,
          "quota_utilization_pct": quota_utilization_pct,
          "fragmentation_pct": frag_pct,
          "requires_defrag": requires_defrag
      }

      with open("etcd_status_report.json", "w") as f:
          json.dump(report, f, indent=2)

      print(f"etcd DB Size: {db_size_mb} MB / {quota_mb} MB ({quota_utilization_pct}%)")
      print(f"Fragmentation: {frag_pct}% (Threshold: {frag_threshold}%)")
      print(f"Defrag Required: {requires_defrag}")

      Kestra.outputs({
          "requires_defrag": requires_defrag,
          "db_size_mb": db_size_mb,
          "quota_utilization_pct": quota_utilization_pct,
          "fragmentation_pct": frag_pct
      })
    outputFiles:
      - etcd_status_report.json

  - id: evaluate_etcd_pressure
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_etcd_db_status.vars.requires_defrag }}"
    then:
      - id: alert_slack_etcd_alarm
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "CRITICAL: etcd database storage alert! Database size is {{ outputs.inspect_etcd_db_status.vars.db_size_mb }} MB ({{ outputs.inspect_etcd_db_status.vars.quota_utilization_pct }}% of quota). Fragmentation is {{ outputs.inspect_etcd_db_status.vars.fragmentation_pct }}%. Execute `etcdctl defrag` to prevent NOSPACE cluster freeze."
          }
    else:
      - id: log_healthy_etcd_storage
        type: io.kestra.plugin.core.log.Log
        message: "etcd storage capacity is nominal: {{ outputs.inspect_etcd_db_status.vars.db_size_mb }} MB used."

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "CRITICAL: etcd Defragmentation Sentinel pipeline failed on {{ inputs.etcd_endpoint }}. Execution ID: {{ execution.id }}."
      }

extend:
  title: etcd Defragmentation and Quota Sentinel
  metaTitle: etcd Defragmentation and Quota Sentinel Blueprint
  shortDescription: Audits etcd database size and free fragmentation to prevent cluster NOSPACE alarms.
  metaDescription: Audits etcd database size and free fragmentation to prevent cluster NOSPACE alarms using Kestra.
  description: |
    ## How it works
    Kubernetes and cloud-native systems depend on etcd for state and coordination. When database size approaches quota or space becomes heavily fragmented from object turnover, etcd triggers NOSPACE alarms and rejects write transactions. This sentinel monitors `/v3/maintenance/status`, calculates true disk fragmentation, and alerts SREs on Slack when defragmentation is required.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[poll_etcd_storage Schedule Trigger] --> B[inspect_etcd_db_status Python Script]
      B --> C{Requires Defrag?}
      C -- Yes --> D[alert_slack_etcd_alarm Webhook]
      C -- No --> E[log_healthy_etcd_storage Log]
    ```

    ## Prerequisites
    - Outbound access to etcd HTTP/v3 endpoint.
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure `etcd_endpoint` and `quota_mb_limit`.
    3. Run manually or enable the scheduled trigger.

    ## Links
    - [etcd Maintenance Documentation](https://etcd.io/docs/latest/op-guide/maintenance/)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Infrastructure
    - Database
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
