id: apache-pinot-realtime-segment-consumption-delay-sentinel
namespace: company.analytics

inputs:
  - id: pinot_controller_url
    type: STRING
    defaults: "http://pinot-controller.internal:9000"
    description: Base URL of the Apache Pinot controller API.
  - id: table_name
    type: STRING
    description: Real-time Pinot table name (e.g. events_REALTIME).
  - id: max_consuming_segments
    type: INT
    defaults: 16
    description: "Maximum allowable consuming segments in state CONSUMING before alerting (default 16)."

tasks:
  - id: query_segment_states
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query Pinot controller for externalview of real-time table
        curl -s "{{ inputs.pinot_controller_url }}/tables/{{ inputs.table_name }}/externalview" > /tmp/pinot_externalview.json

        python3 -c "
        import json
        try:
            with open('/tmp/pinot_externalview.json') as f:
                data = json.load(f)
            segments = data.get('records', [{}])[0]
            consuming = 0
            offline = 0
            for seg, host_states in segments.items():
                for host, state in host_states.items():
                    if state == 'CONSUMING':
                        consuming += 1
                    elif state == 'ERROR':
                        offline += 1
            print(f'{consuming}|{offline}')
        except Exception:
            print('0|0')
        " > /tmp/pinot_summary.txt

        CONSUMING_COUNT=$(cut -d '|' -f 1 /tmp/pinot_summary.txt)
        ERROR_COUNT=$(cut -d '|' -f 2 /tmp/pinot_summary.txt)
        
        echo "::set-output name=consuming_count::${CONSUMING_COUNT:-0}::"
        echo "::set-output name=error_count::${ERROR_COUNT:-0}::"

  - id: evaluate_pinot_lag
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_segment_states.vars.error_count | int > 0 or outputs.query_segment_states.vars.consuming_count | int > inputs.max_consuming_segments }}"
    then:
      - id: notify_analytics_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#realtime-analytics-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Apache Pinot Real-Time Ingestion Lag Alert",
                "text": "Table {{ inputs.table_name }} has abnormal segment distribution. Consuming: {{ outputs.query_segment_states.vars.consuming_count }} (threshold {{ inputs.max_consuming_segments }}), Error: {{ outputs.query_segment_states.vars.error_count }}.",
                "footer": "Kestra Real-Time Analytics Sentinel • Apache Pinot"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#realtime-analytics-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Apache Pinot Sentinel Failure",
            "text": "Failed to connect to Apache Pinot controller at {{ inputs.pinot_controller_url }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Apache Pinot controller and broker endpoints to detect consuming segment lag in real-time tables."
  metaTitle: Apache Pinot Real-Time Segment Consumption Delay Sentinel with Kestra
  ee: false
  demo: false
  title: Apache Pinot Real-Time Segment Consumption Delay Sentinel
  shortDescription: Audits Apache Pinot controller and broker endpoints to detect consuming segment lag in real-time tables.
  description: |
    ## How it works
    This workflow connects to the Apache Pinot controller REST API (`/tables/{tableName}/externalview`) to inspect Helix segment routing and real-time ingestion state. For real-time tables reading from Kafka or Apache Pulsar, segments transition from `CONSUMING` to `ONLINE` once commit thresholds (row count or time duration) are reached. If consumers hang, offsets stall, or server partitions encounter unhandled errors, segments remain in `CONSUMING` state or transition into `ERROR`. This sentinel tallies segment states and triggers an incident alert if abnormal lag is detected.

    ## What you get
    - Real-time health monitoring of Apache Pinot streaming ingestion.
    - Detection of stuck consuming segments and Helix partition errors.
    - Context-rich Slack alerts detailing consuming and error counts.

    ## Who it's for
    - Real-time analytics engineers managing low-latency OLAP on Apache Pinot.
    - Platform engineers operating Kafka-to-Pinot ingestion pipelines.
    - SREs maintaining Helix and Zookeeper cluster orchestration.

    ## Why orchestrate this with Kestra
    - **Continuous Telemetry**: Audits high-velocity OLAP systems without requiring custom daemons.
    - **Unified Alerting**: Bridges real-time database state with Slack, Discord, and incident responders.
    - **Automated Operations**: Allows triggering segment commit calls or restarting lagging server instances.

    ## Prerequisites
    - Running Apache Pinot cluster with accessible controller port (`9000`).
    - Pinot real-time table name.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Add `SLACK_WEBHOOK` to your namespace secrets.
    3. Specify `pinot_controller_url` and target `table_name`.
    4. Enable the schedule trigger to commence automatic audits.

    ## How to extend
    - Execute a Helix rebalance command via REST API when segment imbalance occurs.
    - Add partition-level lag inspection by querying broker debug endpoints.
    - Correlate with Kafka consumer group lag using Kestra's Kafka sentinel blueprints.

    ## Links
    - [Apache Pinot Controller API](https://docs.pinot.apache.org/developers/advanced-troubleshooting/rest-apis)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
