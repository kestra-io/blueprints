id: nginx-reverse-proxy-hardening-gate
namespace: company.infrastructure
description: |
  Audit a real Nginx reverse-proxy configuration before deployment. The flow checks for unsafe
  autoindex settings, version disclosure, insecure TLS protocol directives, disabled upstream TLS
  verification, and incomplete proxy forwarding headers. It writes machine-readable findings and
  can fail a deployment gate when critical configuration risks are present.

inputs:
  - id: config_url
    type: STRING
    displayName: Raw Nginx configuration URL
    defaults: https://raw.githubusercontent.com/docker/awesome-compose/master/nginx-golang-mysql/proxy/nginx.conf
    description: HTTPS URL to a public Nginx configuration file hosted on raw.githubusercontent.com.
  - id: production_mode
    type: BOOL
    displayName: Apply production expectations
    defaults: false
    description: Add production-focused warnings for HTTP listeners without a TLS listener or an HTTPS redirect, and for missing body-size limits.
  - id: require_proxy_forward_headers
    type: BOOL
    displayName: Check proxy forwarding headers
    defaults: true
    description: Warn when the configuration does not pass the original host and client/protocol metadata to proxied applications.
  - id: fail_on_critical_findings
    type: BOOL
    displayName: Fail on critical findings
    defaults: false
    description: In report-only mode the flow records all findings; enable this input to fail when unsafe directives are detected.

triggers:
  - id: weekly_nginx_config_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Re-audit the configured public Nginx file weekly. Keep disabled until the source and desired enforcement policy are reviewed.
    cron: "0 8 * * 1"
    disabled: true

tasks:
  - id: validate_config_url
    type: io.kestra.plugin.scripts.python.Script
    description: Restrict the source to raw GitHub HTTPS content and reject hostnames resolving to non-public addresses.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      CONFIG_URL: "{{ inputs.config_url }}"
    script: |
      import ipaddress
      import socket
      from urllib.parse import urlsplit

      url = urlsplit(__import__("os").environ.get("CONFIG_URL", "").strip())
      if url.scheme.lower() != "https" or url.hostname != "raw.githubusercontent.com":
          raise ValueError("config_url must use HTTPS on raw.githubusercontent.com")
      if url.username or url.password or url.port not in (None, 443):
          raise ValueError("config_url must not contain credentials or a non-standard port")
      if not url.path.lower().endswith(".conf"):
          raise ValueError("config_url must point to a .conf file")

      addresses = sorted({
          result[4][0]
          for result in socket.getaddrinfo(url.hostname, url.port or 443, type=socket.SOCK_STREAM)
      })
      if not addresses or any(not ipaddress.ip_address(address).is_global for address in addresses):
          raise ValueError("config_url must resolve only to public IP addresses")
      print(f"Validated public Nginx configuration URL on {url.hostname}.")

  - id: fetch_nginx_config
    type: io.kestra.plugin.core.http.Request
    description: Fetch the actual Nginx configuration text from the supplied public repository source.
    uri: "{{ inputs.config_url }}"
    method: GET
    headers:
      Accept: text/plain, */*
      User-Agent: Kestra-Nginx-Reverse-Proxy-Hardening-Gate/1.0
    timeout: PT30S

  - id: audit_nginx_hardening
    type: io.kestra.plugin.scripts.python.Script
    description: Parse Nginx directive lines and identify critical host/TLS risks separately from recommended hardening controls.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    dependencies:
      - kestra
    inputFiles:
      nginx.conf: "{{ outputs.fetch_nginx_config.body }}"
    env:
      CONFIG_URL: "{{ inputs.config_url }}"
      PRODUCTION_MODE: "{{ inputs.production_mode }}"
      REQUIRE_PROXY_FORWARD_HEADERS: "{{ inputs.require_proxy_forward_headers }}"
    outputFiles:
      - nginx-hardening-report.json
    script: |
      import json
      import os
      import re
      from datetime import datetime, timezone

      from kestra import Kestra

      source_url = os.environ["CONFIG_URL"]
      production_mode = os.environ.get("PRODUCTION_MODE", "false").lower() == "true"
      require_forward_headers = os.environ.get("REQUIRE_PROXY_FORWARD_HEADERS", "true").lower() == "true"

      with open("nginx.conf", encoding="utf-8") as source:
          original = source.read()
      if not original.strip():
          raise ValueError("Nginx configuration file is empty")

      effective_lines = []
      for raw_line in original.splitlines():
          line = raw_line.strip()
          if not line or line.startswith("#"):
              continue
          line = re.sub(r"\s+#.*$", "", line).strip()
          if line:
              effective_lines.append(line)
      normalized = "\n".join(effective_lines)
      lower = normalized.lower()

      directives = {}
      directive_pattern = re.compile(r"^\s*([a-z_][a-z0-9_]*)\s+(.+?)\s*;\s*$", re.IGNORECASE)
      for line in effective_lines:
          match = directive_pattern.match(line)
          if match:
              directives.setdefault(match.group(1).lower(), []).append(match.group(2).strip())

      findings = []
      def add(severity, code, message):
          findings.append({"severity": severity, "code": code, "message": message})

      if re.search(r"^\s*autoindex\s+on\s*;", lower, re.MULTILINE):
          add("BLOCK", "DIRECTORY_LISTING_ENABLED", "autoindex on exposes directory listings and should be removed or tightly scoped.")
      if any(value.strip().lower() == "off" for value in directives.get("proxy_ssl_verify", [])):
          add("BLOCK", "UPSTREAM_TLS_VERIFICATION_DISABLED", "proxy_ssl_verify off disables certificate verification for HTTPS upstreams.")
      if any(value.strip().lower() == "on" for value in directives.get("server_tokens", [])):
          add("WARN", "NGINX_VERSION_DISCLOSURE", "server_tokens on can disclose the Nginx version in error pages and response headers.")
      if not any(value.strip().lower() == "off" for value in directives.get("server_tokens", [])):
          add("WARN", "SERVER_TOKENS_NOT_DISABLED", "No server_tokens off directive was found; consider suppressing Nginx version disclosure.")

      ssl_protocols_values = " ".join(directives.get("ssl_protocols", [])).lower()
      deprecated_protocols = [
          protocol for protocol in ("sslv3", "tlsv1", "tlsv1.1")
          if re.search(r"(?<![a-z0-9.])" + re.escape(protocol) + r"(?![a-z0-9.])", ssl_protocols_values)
      ]
      if deprecated_protocols:
          add("BLOCK", "DEPRECATED_TLS_PROTOCOL_ENABLED", "ssl_protocols includes deprecated versions: " + ", ".join(deprecated_protocols) + ".")
      if re.search(r"\blisten\s+[^;]*\bssl\b", lower) and not ssl_protocols_values:
          add("WARN", "TLS_PROTOCOLS_NOT_EXPLICIT", "A TLS listener exists but ssl_protocols is not explicitly configured in the inspected file.")

      if require_forward_headers:
          required_forwarding = {
              "host": "proxy_set_header Host",
              "x-real-ip": "proxy_set_header X-Real-IP",
              "x-forwarded-for": "proxy_set_header X-Forwarded-For",
              "x-forwarded-proto": "proxy_set_header X-Forwarded-Proto",
          }
          missing = [
              directive for header, directive in required_forwarding.items()
              if not re.search(r"\bproxy_set_header\s+" + re.escape(header) + r"\s+", lower)
          ]
          if missing:
              add("WARN", "PROXY_FORWARD_HEADERS_INCOMPLETE", "Missing proxy forwarding directives: " + ", ".join(required_forwarding[header] for header in missing) + ".")

      listens_on_http = bool(re.search(r"\blisten\s+(?:\*:)??(?:80|8080)(?:\s|;)", lower))
      listens_on_tls = bool(re.search(r"\blisten\s+[^;]*(?:443|ssl)\b", lower))
      has_https_redirect = bool(re.search(r"\breturn\s+30[1278]\s+https://", lower)) or bool(re.search(r"\brewrite\s+\S+\s+https://", lower))
      if production_mode and listens_on_http and not listens_on_tls and not has_https_redirect:
          add("WARN", "HTTP_WITHOUT_TLS_OR_REDIRECT", "Production mode is enabled, but the inspected file has an HTTP listener without a TLS listener or an HTTPS redirect.")

      if production_mode and not directives.get("client_max_body_size"):
          add("WARN", "CLIENT_BODY_LIMIT_MISSING", "Production mode is enabled but client_max_body_size is not configured.")

      proxy_pass_values = directives.get("proxy_pass", [])
      if not proxy_pass_values:
          add("WARN", "NO_PROXY_PASS_DIRECTIVE", "No proxy_pass directive was found; confirm that this is the intended reverse-proxy configuration.")
      if re.search(r"\bproxy_pass\s+https://", lower) and not directives.get("proxy_ssl_verify"):
          add("WARN", "UPSTREAM_TLS_VERIFICATION_UNSET", "An HTTPS upstream is configured but proxy_ssl_verify is not explicitly set to on.")

      blocking = [finding for finding in findings if finding["severity"] == "BLOCK"]
      warnings = [finding for finding in findings if finding["severity"] == "WARN"]
      verdict = "BLOCK" if blocking else ("PASS_WITH_WARNINGS" if warnings else "PASS")
      report = {
          "schemaVersion": 1,
          "checkedAt": datetime.now(timezone.utc).isoformat(),
          "sourceUrl": source_url,
          "directiveCount": sum(len(values) for values in directives.values()),
          "directiveNames": sorted(directives.keys()),
          "productionMode": production_mode,
          "blockingFindingCount": len(blocking),
          "warningCount": len(warnings),
          "verdict": verdict,
          "findings": findings,
          "scopeNote": "This is a directive-based configuration heuristic, not a full Nginx parser. Run nginx -t with the intended includes and deployment context before applying configuration.",
      }
      with open("nginx-hardening-report.json", "w", encoding="utf-8") as target:
          json.dump(report, target, indent=2, ensure_ascii=False)

      print(f"Nginx hardening audit: verdict={verdict}, directives={report['directiveCount']}, blocking={len(blocking)}, warnings={len(warnings)}")
      Kestra.outputs({
          "source_url": source_url,
          "directive_count": report["directiveCount"],
          "blocking_finding_count": len(blocking),
          "warning_count": len(warnings),
          "verdict": verdict,
          "findings": findings,
      })

  - id: enforce_nginx_policy
    type: io.kestra.plugin.core.flow.If
    description: Optionally fail when critical Nginx directives are present; report-only mode supports baseline assessment before enforcement.
    condition: "{{ inputs.fail_on_critical_findings and outputs.audit_nginx_hardening.vars.verdict == 'BLOCK' }}"
    then:
      - id: fail_nginx_gate
        type: io.kestra.plugin.core.execution.Fail
        description: Prevent downstream promotion when configuration contains critical Nginx risks.
        errorMessage: "Nginx hardening gate blocked: {{ outputs.audit_nginx_hardening.vars.blocking_finding_count }} critical finding(s). Review nginx-hardening-report.json."
    else:
      - id: log_nginx_verdict
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Nginx hardening audit {{ outputs.audit_nginx_hardening.vars.verdict }}; directives={{ outputs.audit_nginx_hardening.vars.directive_count }}, warnings={{ outputs.audit_nginx_hardening.vars.warning_count }}."

extend:
  title: Nginx Reverse Proxy Hardening Gate
  metaTitle: Nginx Reverse Proxy Hardening Gate | Kestra
  shortDescription: Inspect a real Nginx reverse-proxy configuration for unsafe directory listing, weak TLS settings, version disclosure, and incomplete proxy-forwarding headers.
  metaDescription: Audit Nginx configuration for directory listing, deprecated TLS versions, disabled upstream verification, proxy-header gaps, and production redirect safeguards.
  description: |
    Review a public Nginx configuration before deployment. The workflow fetches the actual .conf file, examines active directive lines, and records findings for unsafe directory listing, deprecated TLS protocols, disabled upstream certificate verification, Nginx version disclosure, missing proxy-forwarding headers, and production HTTP listeners that have no TLS listener or HTTPS redirect. A JSON report separates critical items from advisory hardening recommendations and supports an optional failure gate.

    ## How it works

    1. The URL validation task restricts the source to public HTTPS raw GitHub content and checks that the hostname resolves to public addresses.
    2. The HTTP Request fetches the actual Nginx configuration text.
    3. The Python policy task removes comment-only lines, extracts directive names, and evaluates risky directives and missing proxy header forwarding.
    4. The report records the source URL, observed directive names, critical findings, warnings and a PASS/BLOCK verdict.
    5. An optional If gate fails the execution when critical directives are found and fail_on_critical_findings is enabled.

    ## What you get

    - A machine-readable nginx-hardening-report.json file.
    - Detection of autoindex on and proxy_ssl_verify off.
    - Warnings for server version disclosure, missing client/protocol forwarding, and weak production listener posture.
    - Report-only rollout before enabling enforcement.

    ## Who it's for

    - Platform engineers operating Nginx reverse proxies.
    - SRE and DevOps teams maintaining gateway configuration.
    - Security engineers auditing TLS and proxy trust boundaries.

    ## Why orchestrate this with Kestra

    Kestra makes Nginx configuration audits repeatable and visible across scheduled reviews and deployment workflows. The output report can be stored or consumed by later tasks, and the optional failure gate provides an explicit control instead of a manual grep checklist.

    ## Prerequisites

    - A Kestra 2.x worker with Docker enabled for Python Script tasks.
    - Network access to raw.githubusercontent.com.
    - Full include resolution and runtime syntax validation still require nginx -t against the actual host/container configuration.

    ### Secrets

    - No secrets are required for the default public configuration. Do not put credentials in config_url.

    ## Quick start

    1. Import this flow and leave config_url pointed at the public Docker Compose Nginx sample.
    2. Execute the flow and inspect audit_nginx_hardening output and nginx-hardening-report.json.
    3. Review blocking findings before deployment; enable production_mode to add production-focused warnings.
    4. Add a supported location or server block for each TLS and proxy-header control that the application requires.
    5. Enable weekly_nginx_config_audit after checking that the configured source is the intended file.

    ## How to extend

    - Fetch each include file and evaluate the resulting effective configuration.
    - Add an nginx -t task with the exact Nginx container image used in deployment.
    - Compare findings against an approved directive baseline and detect drift across environments.
    - Store the report in S3 or connect a blocking verdict to a change approval.

    ## Links

    - [Nginx core module directives](https://nginx.org/en/docs/ngx_core_module.html)
    - [Nginx HTTP SSL module](https://nginx.org/en/docs/http/ngx_http_ssl_module.html)
    - [Nginx proxy module](https://nginx.org/en/docs/http/ngx_http_proxy_module.html)
    - [Nginx headers module](https://nginx.org/en/docs/http/ngx_http_headers_module.html)
    - [Kestra Python Script plugin](https://kestra.io/plugins/plugin-scripts/python)
    - [Kestra HTTP Request plugin](https://kestra.io/plugins/plugin-core/http/io.kestra.plugin.core.http.request)
  tags:
    - Infrastructure
  subTags:
    - Infrastructure Automation
    - CI/CD & Deployment
  ee: false
  demo: false
