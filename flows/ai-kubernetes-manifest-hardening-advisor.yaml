id: ai-kubernetes-manifest-hardening-advisor
namespace: company.platform

inputs:
  - id: manifest_url
    type: STRING
    defaults: "https://raw.githubusercontent.com/kubernetes/website/main/content/en/examples/application/deployment.yaml"
    description: "URL of the raw Kubernetes manifest (YAML) to audit and harden"

  - id: auto_apply
    type: BOOL
    defaults: false
    description: "Whether to prompt for human approval to apply the hardened manifest"

tasks:
  - id: download_manifest
    type: io.kestra.plugin.core.http.Download
    uri: "{{ inputs.manifest_url }}"

  - id: audit_k8s_manifest_ai
    type: io.kestra.plugin.ai.completion.ChatCompletion
    description: "Audits Kubernetes manifest against NSA/CISA benchmarks using Kestra AI completion"
    provider:
      type: io.kestra.plugin.ai.provider.OpenAI
      apiKey: "{{ secret('OPENAI_API_KEY') }}"
      modelName: "gpt-4o-mini"
    messages:
      - type: SYSTEM
        content: |
          You are a Senior Kubernetes Security Specialist following NSA/CISA and CIS Kubernetes Benchmark guidelines.
          Audit the provided Kubernetes manifest.
          1. Identify missing securityContext (runAsNonRoot, readOnlyRootFilesystem, allowPrivilegeEscalation: false, drop ALL capabilities), missing resource limits/requests, and missing readiness/liveness probes.
          2. Generate a fully hardened, production-ready replacement YAML manifest.
          3. Rate overall compliance score from 0 to 100.

          Respond strictly with valid JSON matching the requested schema.
      - type: USER
        content: |
          Raw Kubernetes Manifest:
          ```yaml
          {{ read(outputs.download_manifest.uri) }}
          ```
    configuration:
      responseFormat:
        type: JSON
        jsonSchema:
          type: object
          properties:
            compliance_score:
              type: integer
            severity:
              type: string
              enum: ["LOW", "MEDIUM", "HIGH", "CRITICAL"]
            violations_found:
              type: array
              items:
                type: string
            hardened_yaml:
              type: string
            summary:
              type: string
          required:
            - compliance_score
            - severity
            - violations_found
            - hardened_yaml
            - summary

  - id: generate_artifacts
    type: io.kestra.plugin.scripts.python.Script
    description: "Parses AI evaluation output and produces downloadable audit report and hardened manifest files"
    warningOnStdErr: false
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: ghcr.io/kestra-io/pydata:latest
    env:
      AI_RESPONSE: "{{ outputs.audit_k8s_manifest_ai.choices[0].message.content }}"
    script: |
      import os
      import json
      from kestra import Kestra

      raw_response = os.environ.get("AI_RESPONSE", "{}")
      try:
          data = json.loads(raw_response)
      except Exception:
          data = {
              "compliance_score": 50,
              "severity": "MEDIUM",
              "violations_found": ["Unknown violation"],
              "hardened_yaml": "# Hardened manifest unavailable",
              "summary": "AI audit parsing failed."
          }

      hardened_file = "hardened-deployment.yaml"
      with open(hardened_file, "w", encoding="utf-8") as f:
          f.write(data.get("hardened_yaml", ""))

      report_file = "k8s-security-audit-report.md"
      with open(report_file, "w", encoding="utf-8") as f:
          f.write("# Kubernetes Manifest Security Audit Report\n\n")
          f.write(f"**Compliance Score:** {data.get('compliance_score', 0)}/100\n")
          f.write(f"**Severity Level:** {data.get('severity', 'UNKNOWN')}\n\n")
          f.write("## Violations Detected\n")
          for v in data.get("violations_found", []):
              f.write(f"- {v}\n")
          f.write(f"\n## Summary\n{data.get('summary', '')}\n")

      Kestra.outputs({
          "compliance_score": data.get("compliance_score", 0),
          "severity": data.get("severity", "LOW"),
          "violation_count": len(data.get("violations_found", [])),
          "summary": data.get("summary", "")
      })
    outputFiles:
      - "hardened-deployment.yaml"
      - "k8s-security-audit-report.md"

  - id: notify_security_slack
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#platform-security",
        "text": ":shield: *Kubernetes Security Manifest Audit Completed*\n*Source:* `{{ inputs.manifest_url }}`\n*Compliance Score:* {{ outputs.generate_artifacts.vars.compliance_score }}/100\n*Risk Severity:* {{ outputs.generate_artifacts.vars.severity }}\n*Violations Found:* {{ outputs.generate_artifacts.vars.violation_count }}\n*Hardened Manifest:* Available in execution outputs (`hardened-deployment.yaml`)."
      }

  - id: require_approval_gate
    type: io.kestra.plugin.core.flow.If
    description: "Gate applying the hardened manifest behind human verification when auto_apply is enabled"
    condition: "{{ inputs.auto_apply }}"
    then:
      - id: approval_gate
        type: io.kestra.plugin.core.flow.Pause
        description: "Pauses execution for platform engineer review and sign-off before applying hardened manifest"
        onResume:
          - id: proceed
            type: BOOL
            defaults: true
            description: "Approve applying the hardened manifest to the cluster"

      - id: apply_hardened_manifest
        type: io.kestra.plugin.kubernetes.kubectl.Apply
        description: "Applies the verified hardened manifest to the Kubernetes cluster"
        runIf: "{{ item.value.proceed ?? true }}"
        spec: "{{ read(outputs.generate_artifacts.outputFiles['hardened-deployment.yaml']) }}"

extend:
  title: AI Kubernetes Workload Hardening and Security Policy Advisor
  shortDescription: Audit Kubernetes manifests against NSA/CISA benchmarks using Kestra AI, generate hardened manifests, and gate deployment behind human approval.
  metaTitle: AI Kubernetes Workload Security Advisor and Hardening
  metaDescription: Automatically audit Kubernetes deployments for container security misconfigurations using Kestra AI, generate hardened manifests, and gate application behind approvals.
  description: |
    ## How it works
    This workflow downloads a target Kubernetes manifest (Deployment, StatefulSet, or Pod) and performs automated static security analysis against CIS Kubernetes benchmarks and NSA/CISA workload guidance.
    
    1. **Download Manifest**: Retrieves the raw Kubernetes manifest via `io.kestra.plugin.core.http.Download`.
    2. **AI Security Evaluation**: Uses Kestra's native AI completion task (`io.kestra.plugin.ai.completion.ChatCompletion`) with structured JSON schema outputs to detect container misconfigurations (root execution, missing capability drops, unconfined privilege escalation, and missing probes).
    3. **Artifact Generation**: Produces a ready-to-deploy hardened YAML manifest (`hardened-deployment.yaml`) alongside an executive Markdown audit report (`k8s-security-audit-report.md`).
    4. **Team Notification**: Alerts platform and DevSecOps engineers via Slack with compliance scores and findings.
    5. **Approval Gate & Application**: When `auto_apply` is enabled, pauses execution via `io.kestra.plugin.core.flow.Pause` for manual engineer sign-off before applying the hardened manifest to the cluster using `io.kestra.plugin.kubernetes.kubectl.Apply`.

    ## What you get
    - A hardened, ready-to-deploy Kubernetes YAML manifest (`hardened-deployment.yaml`).
    - A comprehensive security audit report (`k8s-security-audit-report.md`) stored as an execution artifact.
    - Automated Slack notification with compliance scores.
    - A human-in-the-loop approval gate preventing unreviewed cluster modifications.

    ## Who it's for
    - DevOps, DevSecOps, and Platform Engineering teams operating Kubernetes clusters.
    - Developers wanting to ensure their manifests comply with cluster admission policies.

    ## Why orchestrate this with Kestra
    Kestra coordinates the entire end-to-end lifecycle: from manifest download and native AI evaluation to artifact generation, team notification, and human-in-the-loop approval gates before cluster application.

    ## Prerequisites
    - An OpenAI API Key.
    - A Slack Incoming Webhook URL.

    ### Secrets
    - `OPENAI_API_KEY`: Your OpenAI API key.
    - `SLACK_WEBHOOK_URL`: Your Slack Incoming Webhook URL.

    ## Quick start
    Set the required secrets in your Kestra namespace, provide a manifest URL, and trigger execution.

    ## How to extend
    You can extend this workflow by archiving the audit reports to AWS S3 or Google Cloud Storage, or opening an automated GitHub pull request with the hardened manifest.

    ## Links
    - [Kestra AI Plugin](https://kestra.io/plugins/plugin-ai)
    - [Kubernetes Plugin](https://kestra.io/plugins/plugin-kubernetes)
    - [Pause Task documentation](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.pause)
    - [Slack Plugin documentation](https://kestra.io/plugins/plugin-slack)
  subTags:
    - Policy & Compliance
    - Monitoring & Alerting
  tags:
    - AI
    - Infrastructure
    - Cloud
  ee: false
  demo: false
