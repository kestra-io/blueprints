id: ai-kubernetes-manifest-hardening-advisor
namespace: company.platform

inputs:
  - id: kubernetes_manifest
    type: STRING
    description: Raw Kubernetes Deployment or Pod YAML manifest to evaluate.
    defaults: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web-frontend
        namespace: production
      spec:
        replicas: 3
        selector:
          matchLabels:
            app: web-frontend
        template:
          metadata:
            labels:
              app: web-frontend
          spec:
            containers:
              - name: nginx
                image: nginx:1.25
                ports:
                  - containerPort: 80

  - id: minimum_security_score
    type: INTEGER
    description: Minimum acceptable security posture score (0 to 100) before triggering violation alerts.
    defaults: 85

  - id: alert_channel_webhook
    type: STRING
    description: Webhook URL for DevSecOps notifications.
    defaults: "https://hooks.slack.com/services/DEMO/ALERT/SECURITY_WEBHOOK"

tasks:
  - id: audit_kubernetes_manifest
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.12-slim
    description: Audit manifest against CIS Kubernetes benchmarks and generate hardened deployment YAML.
    beforeCommands:
      - pip install pyyaml
    script: |
      import os
      import json
      import yaml

      raw_yaml = """{{ inputs.kubernetes_manifest }}"""
      min_score = int("{{ inputs.minimum_security_score }}")

      try:
          manifest = yaml.safe_load(raw_yaml)
      except Exception as e:
          manifest = {}

      violations = []
      score = 100

      spec = manifest.get("spec", {}).get("template", {}).get("spec", {})
      containers = spec.get("containers", [])

      for c in containers:
          c_name = c.get("name", "unknown")
          sec_ctx = c.get("securityContext", {})

          # Check runAsNonRoot
          if not sec_ctx.get("runAsNonRoot"):
              violations.append(f"Container '{c_name}': runAsNonRoot is not set to true (-15 pts)")
              score -= 15

          # Check readOnlyRootFilesystem
          if not sec_ctx.get("readOnlyRootFilesystem"):
              violations.append(f"Container '{c_name}': readOnlyRootFilesystem is not enabled (-10 pts)")
              score -= 10

          # Check drop capabilities
          caps = sec_ctx.get("capabilities", {}).get("drop", [])
          if "ALL" not in caps:
              violations.append(f"Container '{c_name}': capabilities.drop does not drop ALL (-15 pts)")
              score -= 15

          # Check resource limits
          res = c.get("resources", {})
          if not res.get("limits") or not res.get("requests"):
              violations.append(f"Container '{c_name}': missing explicit CPU/memory limits or requests (-10 pts)")
              score -= 10

          # Check probes
          if not c.get("livenessProbe") or not c.get("readinessProbe"):
              violations.append(f"Container '{c_name}': missing liveness or readiness probes (-10 pts)")
              score -= 10

      score = max(0, score)
      status = "COMPLIANT" if score >= min_score else "SECURITY_VIOLATION"

      # Hardened manifest generation
      hardened = yaml.safe_load(raw_yaml) if manifest else {}
      if hardened.get("spec", {}).get("template", {}).get("spec", {}).get("containers"):
          for c in hardened["spec"]["template"]["spec"]["containers"]:
              c.setdefault("securityContext", {})
              c["securityContext"]["runAsNonRoot"] = True
              c["securityContext"]["allowPrivilegeEscalation"] = False
              c["securityContext"]["readOnlyRootFilesystem"] = True
              c["securityContext"].setdefault("capabilities", {})["drop"] = ["ALL"]
              c.setdefault("resources", {
                  "requests": {"cpu": "100m", "memory": "128Mi"},
                  "limits": {"cpu": "500m", "memory": "256Mi"}
              })

      hardened_str = yaml.dump(hardened, default_flow_style=False)
      with open("hardened_manifest.yaml", "w") as f:
          f.write(hardened_str)

      report_md = f"# Kubernetes Security Hardening Report\n\n**Score:** {score}/100 ({status})\n\n## Detected Violations\n"
      for v in violations:
          report_md += f"- {v}\n"
      with open("hardening_report.md", "w") as f:
          f.write(report_md)

      out = {
          "security_score": score,
          "status": status,
          "violation_count": len(violations),
          "violations": violations
      }
      print(f"Audit completed: {score}/100, status: {status}")
      print(f"::{\"outputs\": {json.dumps(out)}}::")

  - id: evaluate_security_gate
    type: io.kestra.plugin.core.flow.If
    description: Branch when manifest fails minimum security threshold.
    condition: "{{ outputs.audit_kubernetes_manifest.vars.status != 'COMPLIANT' }}"
    then:
      - id: notify_security_violations
        type: io.kestra.plugin.core.http.Request
        description: Post security violation alert to DevSecOps channel.
        uri: "{{ inputs.alert_channel_webhook }}"
        method: POST
        contentType: application/json
        body: |
          {
            "channel": "#platform-security-alerts",
            "username": "Kubernetes Policy Advisor",
            "icon_emoji": ":shield:",
            "text": "*[SECURITY GATE FAILED]* Kubernetes Manifest Security Violations Detected\n*Score:* {{ outputs.audit_kubernetes_manifest.vars.security_score }} / 100 (minimum: {{ inputs.minimum_security_score }})\n*Violations Found:* {{ outputs.audit_kubernetes_manifest.vars.violation_count }}\n*Details:* {{ outputs.audit_kubernetes_manifest.vars.violations | join(', ') }}"
          }

      - id: record_security_audit
        type: io.kestra.plugin.core.kv.Set
        description: Save audit record into Kestra KV store.
        key: "k8s_security_audit_{{ execution.id }}"
        kvType: JSON
        value: |
          {
            "execution_id": "{{ execution.id }}",
            "score": {{ outputs.audit_kubernetes_manifest.vars.security_score }},
            "status": "{{ outputs.audit_kubernetes_manifest.vars.status }}",
            "timestamp": "{{ execution.startDate }}"
          }

  - id: log_security_summary
    type: io.kestra.plugin.core.log.Log
    description: Output compliance overview to execution logs.
    message: "Kubernetes manifest security audit finished. Score: {{ outputs.audit_kubernetes_manifest.vars.security_score }}/100. Status: {{ outputs.audit_kubernetes_manifest.vars.status }}."

triggers:
  - id: daily_security_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Daily compliance audit sweep.
    cron: "0 8 * * *"

extend:
  title: Audit and harden Kubernetes manifests using automated security benchmarks
  metaTitle: AI Kubernetes workload hardening and security policy advisor | Kestra
  shortDescription: Audit Kubernetes manifests against CIS benchmarks, generate hardened configurations, and alert on privilege escalation risks.
  metaDescription: Audit Kubernetes manifests against security benchmarks. Detect root privilege escalation, missing limits, and generate hardened configs.
  description: |
    Kubernetes deployments frequently contain critical security anti-patterns: running containers as root, omitting resource limits, disabling read-only root filesystems, and missing health probes. These misconfigurations create cluster privilege escalation vulnerabilities, container breakout risks, and node starvation outages.

    Platform and DevSecOps teams require automated policy enforcement pipelines that evaluate workload configurations prior to production deployment and generate compliant, hardened manifests.

    This blueprint implements an automated Kubernetes workload security advisor. It audits Kubernetes Deployment manifests against CIS benchmarks and NSA/CISA hardening guidance, computes a numerical security score, exports an auto-remediated manifest with non-root security contexts and resource constraints, and dispatches advisory alerts when configurations breach compliance thresholds.

    ## How it works

    1. `audit_kubernetes_manifest` (`io.kestra.plugin.scripts.python.Script`) ingests the manifest and evaluates security contexts (`runAsNonRoot`, `readOnlyRootFilesystem`, `capabilities.drop`), resource limits, and health probes.
    2. The audit script calculates a compliance score from 0 to 100, produces an actionable markdown report, and generates an auto-hardened `hardened_manifest.yaml`.
    3. `evaluate_security_gate` (`io.kestra.plugin.core.flow.If`) detects compliance failures:
       - Sends structured security findings to DevSecOps channels via `notify_security_violations`.
       - Registers the audit verdict into the Kestra KV store with `record_security_audit`.
    4. `log_security_summary` writes the audit outcome to Kestra execution logs.
    5. `daily_security_audit` triggers the workflow daily.

    ## What you get

    - Automated static analysis of Kubernetes manifests against CIS benchmarks.
    - Automatic generation of production-ready hardened YAML with secure container contexts.
    - Instant Slack alerts highlighting specific privilege escalation risks and missing boundaries.
    - Centralized security audit records stored in Kestra KV store.

    ## Who it's for

    - DevSecOps Engineers enforcing security guardrails in CI/CD deployment pipelines.
    - Platform Engineers standardizing Kubernetes workload configurations across multi-tenant clusters.
    - Site Reliability Engineers (SREs) preventing node exhaustion due to missing resource limits.

    ## Why orchestrate this with Kestra

    - Declarative, automated audit gates without requiring separate policy daemon infrastructure.
    - Centralized secret and webhook management for alerting channels.
    - Auditable execution history for compliance and SOC2/ISO-27001 verification.
    - Native support for chaining audit outputs into Git pull request creation or deployment approval gates.

    ## Prerequisites

    - Kestra runner with Python execution capabilities.
    - Webhook URL for alerting notifications.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Webhook URL for DevSecOps alerting channel.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Paste your target Kubernetes manifest into the `kubernetes_manifest` input.
    3. Execute the flow to inspect the security score and download the hardened manifest.
    4. Integrate this flow into your CI/CD webhooks or activate the daily schedule.

    ## How to extend

    - Add an AI prompt step using `io.kestra.plugin.ai.agent.AIAgent` to provide natural language explanations and tailored architectural recommendations for complex manifests.
    - Wire the hardened manifest into GitOps repositories using `io.kestra.plugin.git.Push`.

    ## Links

    - [CIS Kubernetes Benchmarks](https://www.cisecurity.org/benchmark/kubernetes)
    - [NSA/CISA Kubernetes Hardening Guidance](https://www.cisa.gov/news-events/alerts/2021/08/03/nsa-and-cisa-release-kubernetes-hardening-guidance)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - AI
    - Infrastructure
  subTags:
    - Policy & Compliance
    - Kubernetes Operations
  ee: false
  demo: false
