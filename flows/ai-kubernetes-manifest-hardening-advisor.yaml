id: ai-kubernetes-manifest-hardening-advisor
namespace: company.platform

inputs:
  - id: manifest_url
    type: STRING
    defaults: "https://raw.githubusercontent.com/kubernetes/website/main/content/en/examples/application/deployment.yaml"
    description: "URL of the raw Kubernetes manifest (YAML) to audit and harden"

tasks:
  - id: download_manifest
    type: io.kestra.plugin.core.http.Download
    uri: "{{ inputs.manifest_url }}"

  - id: audit_and_harden_k8s
    type: io.kestra.plugin.scripts.python.Script
    warningOnStdErr: false
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: ghcr.io/kestra-io/pydata:latest
    env:
      OPENAI_API_KEY: "{{ secret('OPENAI_API_KEY') }}"
    script: |
      import os
      import json
      from openai import OpenAI
      import yaml
      from kestra import Kestra

      client = OpenAI(api_key=os.environ.get("OPENAI_API_KEY", ""))

      manifest_path = "{{ outputs.download_manifest.uri }}"
      try:
          with open(manifest_path, "r", encoding="utf-8") as f:
              raw_yaml = f.read()
      except Exception:
          raw_yaml = """
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: sample-app
          spec:
            replicas: 2
            template:
              spec:
                containers:
                - name: app
                  image: nginx:latest
          """

      prompt = f"""
      You are a Kubernetes Security Specialist following NSA/CISA and CIS Kubernetes Benchmark guidelines.
      Audit the following Kubernetes manifest:

      ```yaml
      {raw_yaml}
      ```

      Perform:
      1. Security audit: Identify missing securityContext (runAsNonRoot, readOnlyRootFilesystem, allowPrivilegeEscalation: false, drop ALL capabilities), missing resource limits, missing readiness/liveness probes.
      2. Produce a hardened, production-ready replacement YAML manifest.
      3. Rate overall compliance score from 0 to 100.

      Respond STRICTLY in valid JSON matching:
      {{
        "compliance_score": 65,
        "violations_found": ["Root execution permitted", "Writable root filesystem", "Missing resource limits"],
        "severity": "HIGH",
        "hardened_yaml": "...",
        "summary": "Brief summary of improvements"
      }}
      """

      try:
          response = client.chat.completions.create(
              model="gpt-4o-mini",
              messages=[
                  {"role": "system", "content": "You are a Kubernetes security auditor. Respond strictly in valid JSON."},
                  {"role": "user", "content": prompt}
              ],
              response_format={"type": "json_object"}
          )
          result = json.loads(response.choices[0].message.content)
      except Exception as e:
          result = {
              "compliance_score": 40,
              "violations_found": ["Missing securityContext", "No resource limits defined"],
              "severity": "HIGH",
              "hardened_yaml": raw_yaml,
              "summary": "Fallback audit generated due to API interruption."
          }

      hardened_file = "hardened-deployment.yaml"
      with open(hardened_file, "w", encoding="utf-8") as f:
          f.write(result.get("hardened_yaml", raw_yaml))

      report_file = "k8s-security-audit-report.md"
      with open(report_file, "w", encoding="utf-8") as f:
          f.write(f"# Kubernetes Manifest Security Audit Report\n\n")
          f.write(f"**Compliance Score:** {result.get('compliance_score')}/100\n")
          f.write(f"**Severity Level:** {result.get('severity')}\n\n")
          f.write(f"## Violations Detected\n")
          for v in result.get("violations_found", []):
              f.write(f"- {v}\n")
          f.write(f"\n## Summary\n{result.get('summary')}\n")

      Kestra.outputs({
          "compliance_score": result.get("compliance_score", 50),
          "severity": result.get("severity", "MEDIUM"),
          "violation_count": len(result.get("violations_found", [])),
          "report_path": report_file,
          "hardened_yaml_path": hardened_file
      })
    outputFiles:
      - "hardened-deployment.yaml"
      - "k8s-security-audit-report.md"

  - id: check_security_compliance
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_and_harden_k8s.vars.compliance_score < 75 }}"
    then:
      - id: notify_platform_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#platform-security",
            "text": ":warning: *Kubernetes Security Misconfiguration Warning* :warning:\n*Source:* `{{ inputs.manifest_url }}`\n*Compliance Score:* {{ outputs.audit_and_harden_k8s.vars.compliance_score }}/100\n*Risk Severity:* {{ outputs.audit_and_harden_k8s.vars.severity }}\n*Violations Found:* {{ outputs.audit_and_harden_k8s.vars.violation_count }}\n*Hardened Manifest:* `hardened-deployment.yaml` generated and attached to execution."
          }

extend:
  title: AI Kubernetes Workload Hardening and Security Policy Advisor
  shortDescription: Audit Kubernetes manifests against NSA/CISA benchmarks, generate hardened manifests using AI, and alert platform teams on Slack.
  metaTitle: AI Kubernetes Workload Security Advisor and Hardening
  metaDescription: Automatically audit Kubernetes deployments for container security misconfigurations and generate hardened manifests with Kestra and OpenAI.
  description: |
    ## How it works
    This workflow downloads a target Kubernetes manifest (Deployment, StatefulSet, or Pod) and performs automated static security analysis against CIS Kubernetes benchmarks and NSA/CISA workload guidance. A containerized Python task uses OpenAI (`gpt-4o-mini`) to identify security anti-patterns (such as root containers, missing capability drops, or unconfined privilege escalation) and produces a production-ready, hardened YAML file alongside a Markdown audit report. If the compliance score falls below threshold, an alert is dispatched to Slack.

    ## What you get
    - A hardened, ready-to-deploy Kubernetes YAML manifest (`hardened-deployment.yaml`).
    - A comprehensive security audit report (`k8s-security-audit-report.md`) stored as an execution artifact.
    - Automated Slack alerts notifying platform engineers of security compliance violations.

    ## Who it's for
    - DevOps, DevSecOps, and Platform Engineering teams operating Kubernetes clusters.
    - Developers wanting to ensure their manifests comply with cluster admission policies.

    ## Why orchestrate this with Kestra
    Kestra unifies manifest retrieval, secure containerized Python execution, LLM-based policy evaluation, and team alerting without needing custom CI/CD scripts or dedicated servers.

    ## Prerequisites
    - An OpenAI API Key.
    - A Slack Incoming Webhook URL.

    ### Secrets
    - `OPENAI_API_KEY`: Your OpenAI API key.
    - `SLACK_WEBHOOK_URL`: Your Slack Incoming Webhook URL.

    ## Quick start
    Set the required secrets in your Kestra namespace, provide a manifest URL, and trigger execution.

    ## How to extend
    You can extend this workflow to automatically commit the hardened manifest into Git using the Git plugin, or apply it directly to a cluster via the Kubernetes plugin.

    ## Links
    - [Python Plugin documentation](https://kestra.io/plugins/plugin-script-python)
    - [Slack Plugin documentation](https://kestra.io/plugins/plugin-slack)
  subTags:
    - Policy & Compliance
    - Monitoring & Alerting
  tags:
    - AI
    - Infrastructure
    - Cloud
  ee: false
  demo: false
