id: redis-cluster-state-and-failover-sentinel
namespace: company.cache

description: |
  Audits distributed Redis Cluster topologies via CLUSTER INFO, detects degraded
  cluster_state or unassigned hash slots, creates an automated GitHub incident ticket,
  and alerts on-call infrastructure engineers on Slack.

inputs:
  - id: redis_host
    type: STRING
    displayName: Redis Cluster Seed Host
    defaults: redis-cluster.internal.company.com

  - id: redis_port
    type: INT
    displayName: Redis Port
    defaults: 6379

  - id: target_repository
    type: STRING
    displayName: Infrastructure Issue Tracking Repository
    defaults: my-org/cache-infrastructure

triggers:
  - id: periodic_cluster_health_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true

tasks:
  - id: probe_redis_cluster_info
    type: io.kestra.plugin.scripts.python.Script
    description: Connects to Redis cluster node and executes CLUSTER INFO to parse cluster_state and slot allocation
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install redis kestra
    script: |
      import os
      import redis
      from kestra import Kestra

      host = "{{ inputs.redis_host }}"
      port = int("{{ inputs.redis_port }}")
      password = os.environ.get("REDIS_PASSWORD")

      try:
          r = redis.Redis(host=host, port=port, password=password, socket_timeout=10, decode_responses=True)
          info_str = r.execute_command("CLUSTER INFO")
          
          # Parse key:value pairs from CLUSTER INFO
          info_map = {}
          for line in info_str.splitlines():
              if ":" in line:
                  k, v = line.split(":", 1)
                  info_map[k.strip()] = v.strip()
      except Exception as err:
          print(f"Failed to query Redis Cluster: {err}")
          info_map = {
              "cluster_state": "fail",
              "cluster_slots_assigned": "0",
              "cluster_slots_ok": "0",
              "error": str(err)
          }

      cluster_state = info_map.get("cluster_state", "fail")
      slots_assigned = int(info_map.get("cluster_slots_assigned", 0))
      slots_ok = int(info_map.get("cluster_slots_ok", 0))
      slots_fail = int(info_map.get("cluster_slots_fail", 0))
      known_nodes = int(info_map.get("cluster_known_nodes", 1))

      is_degraded = cluster_state != "ok" or slots_fail > 0 or slots_assigned < 16384
      print(f"Redis Cluster {host}:{port} -> state: {cluster_state}, slots_ok: {slots_ok}/16384, fail: {slots_fail}")

      Kestra.outputs({
          "cluster_state": cluster_state,
          "slots_assigned": slots_assigned,
          "slots_ok": slots_ok,
          "slots_fail": slots_fail,
          "known_nodes": known_nodes,
          "is_degraded": is_degraded
      })

  - id: branch_on_cluster_health
    type: io.kestra.plugin.core.flow.If
    description: Branches based on whether Redis Cluster state is degraded or slots are failing
    condition: "{{ outputs.probe_redis_cluster_info.vars.is_degraded == true }}"
    then:
      - id: create_cache_incident_issue
        type: io.kestra.plugin.github.issues.Create
        description: Logs a prioritized GitHub issue documenting Redis cluster degraded state
        oauthToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.target_repository }}"
        title: "[Cache Alert] Redis Cluster Degraded: State={{ outputs.probe_redis_cluster_info.vars.cluster_state }}"
        body: |
          ## 🚨 Redis Cluster Degradation Incident

          Automated cluster sentinel detected that Redis Cluster is not fully operational:
          - **Cluster Host:** `{{ inputs.redis_host }}:{{ inputs.redis_port }}`
          - **Cluster State:** **{{ outputs.probe_redis_cluster_info.vars.cluster_state }}**
          - **Healthy Slots:** `{{ outputs.probe_redis_cluster_info.vars.slots_ok }}` / 16384
          - **Failing Slots:** **{{ outputs.probe_redis_cluster_info.vars.slots_fail }}**
          - **Known Nodes:** `{{ outputs.probe_redis_cluster_info.vars.known_nodes }}`

          Please inspect failed master nodes and initiate manual or automatic failover immediately.
          *Generated automatically by Kestra Redis Cluster Sentinel.*

      - id: alert_cache_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority alert to the caching infrastructure Slack channel
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {{ {
            "text": "🚨 *Redis Cluster Degradation Alert*\n*Host:* `" ~ inputs.redis_host ~ "`\n*State:* *" ~ outputs.probe_redis_cluster_info.vars.cluster_state ~ "* (Failing Slots: *" ~ outputs.probe_redis_cluster_info.vars.slots_fail ~ "*)\n*Incident Ticket:* <" ~ (outputs.create_cache_incident_issue.issueUrl ?? "#") ~ "|View GitHub Issue>"
          } | toJson }}

    else:
      - id: log_cluster_healthy
        type: io.kestra.plugin.core.log.Log
        message: "Redis Cluster {{ inputs.redis_host }} is healthy (State: ok, all 16384 slots assigned and operational)."

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: Final audit status log recording cluster state
    message: "Redis cluster audit complete for {{ inputs.redis_host }}. state={{ outputs.probe_redis_cluster_info.vars.cluster_state }}."

errors:
  - id: alert_probe_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts Slack when the health check execution encounters an unhandled error
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {{ {
        "text": "⚠️ *Redis Cluster Sentinel Failed* in execution `" ~ execution.id ~ "`. Unable to reach `" ~ inputs.redis_host ~ "`."
      } | toJson }}

extend:
  title: "Redis Cluster State and Hash Slot Failover Sentinel"
  shortDescription: "Audit distributed Redis Cluster topologies via CLUSTER INFO, detect unassigned slots or fail state, log GitHub issues, and alert Slack."
  metaTitle: "Redis Cluster State and Failover Sentinel with Kestra"
  metaDescription: "Monitor distributed Redis Cluster health and hash slot coverage with Kestra. Query CLUSTER INFO, open GitHub incident issues, and alert Slack."
  description: |
    Enterprise distributed caching architectures rely on Redis Cluster to partition data across multiple master and replica nodes using 16,384 hash slots. When a master node fails and failover encounters network partition delays, or if hash slots become unassigned, the entire cluster transitions into a `cluster_state: fail` condition, rejecting client read and write operations. This blueprint connects to a Redis Cluster seed node on a regular cadence, queries `CLUSTER INFO`, detects failing hash slots or degraded cluster states, logs an automated GitHub incident ticket, and alerts on-call infrastructure engineers on Slack.

    ## How it works

    1. `periodic_cluster_health_check` (`io.kestra.plugin.core.trigger.Schedule`) initiates the audit every 5 minutes (shipped disabled for safe verification).
    2. `probe_redis_cluster_info` (`io.kestra.plugin.scripts.python.Script`) connects to the target Redis node and parses `CLUSTER INFO` fields, reading `cluster_state`, `cluster_slots_assigned`, `cluster_slots_ok`, and `cluster_slots_fail`.
    3. `branch_on_cluster_health` (`io.kestra.plugin.core.flow.If`) evaluates whether the cluster state is degraded or slots are failing (`is_degraded == true`):
       - `then`: Automatically files a GitHub tracking issue via `create_cache_incident_issue` (`io.kestra.plugin.github.issues.Create`) and alerts the Slack channel via `alert_cache_slack` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).
       - `else`: Emits an informational log entry (`log_cluster_healthy`) confirming normal operational health.
    4. `log_audit_complete` (`io.kestra.plugin.core.log.Log`) records the final health summary.
    5. The `errors` block alerts Slack if network connection times out or authentication fails.

    ## What you get

    - Automated, scheduled auditing of distributed Redis Cluster topologies.
    - Zero delayed detection when master node failures cause slot unassignment.
    - Consolidated GitHub incident tickets with healthy vs failing slot counts and node tallies.
    - Real-time Slack notifications with direct ticket hyperlinks.

    ## Who it's for

    - Platform Engineers and Database SREs operating production Redis Cluster deployments.
    - Distributed systems developers relying on high-availability in-memory caching.
    - Site Reliability Engineers maintaining service-level objectives for caching layers.

    ## Why orchestrate this with Kestra

    Kestra coordinates socket-level Redis communication, command output parsing, conditional escalation, and chat alerting inside a unified declarative workflow. It manages cluster passwords securely, provides complete execution history, and eliminates the need for separate standalone monitoring daemons.

    ## Prerequisites

    - A running Redis Cluster deployment (OSS Redis, AWS ElastiCache, or Redis Enterprise).
    - Network connectivity from the Kestra worker to the Redis host and port.
    - A GitHub Personal Access Token with repository issue creation permissions.
    - A Slack incoming webhook URL for notifications.

    ### Secrets

    - `REDIS_PASSWORD`: Authentication password for Redis Cluster nodes.
    - `GITHUB_TOKEN`: GitHub token used to open incident issues.
    - `SLACK_WEBHOOK`: Incoming Webhook URL for infrastructure alerts.

    ## Inputs

    - `redis_host` (STRING, default `redis-cluster.internal.company.com`): Hostname or IP of a Redis Cluster seed node.
    - `redis_port` (INT, default `6379`): Redis listening port.
    - `target_repository` (STRING, default `my-org/cache-infrastructure`): Target GitHub repository for logging incident issues.

    ## Outputs

    - `outputs.probe_redis_cluster_info.vars.cluster_state`: Current cluster status (`ok` or `fail`).
    - `outputs.probe_redis_cluster_info.vars.slots_ok`: Number of operational hash slots.
    - `outputs.probe_redis_cluster_info.vars.slots_fail`: Number of failing hash slots.

    ## Quick start

    1. Configure `REDIS_PASSWORD`, `GITHUB_TOKEN`, and `SLACK_WEBHOOK` in your Kestra namespace.
    2. Import this flow and set `redis_host` and `redis_port` to match your cluster endpoint.
    3. Run the flow manually to verify cluster information extraction and Slack notification delivery.
    4. Enable the `periodic_cluster_health_check` trigger for continuous topology monitoring.

    ## How to extend

    - Add an automated `CLUSTER FAILOVER` execution task to trigger failover on a designated replica.
    - Interrogate individual node roles via `CLUSTER NODES` to identify specific failing master IPs.
    - Route urgent alerts to PagerDuty or Opsgenie when `slots_fail` is greater than zero.

    ## Links

    - [Redis CLUSTER INFO Documentation](https://redis.io/docs/latest/commands/cluster-info/)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra GitHub Plugin](https://kestra.io/plugins/plugin-github)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)

  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
