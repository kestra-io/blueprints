id: github-secret-scan-gitleaks-on-push
namespace: company.team
description: |
  Scan a GitHub repository for committed secrets on every push with
  gitleaks: check out the repository into a shared working directory,
  run the scanner in its official container with redacted output, parse
  the JSON report, and when a leak is found open a labeled GitHub issue,
  alert Slack, and fail the run.

triggers:
  - id: on_push
    type: io.kestra.plugin.core.trigger.Webhook
    description: GitHub (or your CI) POSTs here on every push to re-scan the repository. Shipped with a keyed URL — treat the key as a secret.
    key: "{{ secret('SECRET_SCAN_WEBHOOK_KEY') }}"

inputs:
  - id: repository
    type: STRING
    defaults: your-org/your-repo
    description: GitHub repository to scan, in owner/repo form — used for cloning and as the target for the issue it opens.
  - id: branch
    type: STRING
    defaults: main
    description: Branch to check out and scan.
  - id: git_username
    type: STRING
    defaults: x-access-token
    description: Username sent to git when cloning; keep the default when authenticating with a personal access token.

tasks:
  - id: workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One shared directory so the clone, the scanner container, and the report parser all see the same files.
    tasks:
      - id: clone_repository
        type: io.kestra.plugin.git.Clone
        description: Check out the repository under scan at the configured branch, authenticated with the GitHub token.
        url: "https://github.com/{{ inputs.repository }}.git"
        username: "{{ inputs.git_username }}"
        password: "{{ secret('GITHUB_TOKEN') }}"
        branch: "{{ inputs.branch }}"

      - id: run_secret_scan
        type: io.kestra.plugin.scripts.shell.Commands
        description: Run gitleaks over the checkout in its official container. --redact keeps detected values out of the logs and --exit-code 0 keeps this task green so the report, not the exit code, drives the next step.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: zricethezav/gitleaks:latest
        commands:
          - gitleaks detect --source . --no-banner --redact --report-format json --report-path gitleaks-report.json --exit-code 0

      - id: parse_report
        type: io.kestra.plugin.scripts.python.Script
        description: Turn the raw gitleaks JSON into a leak count plus the distinct rule IDs, emitted through the outputs protocol for the branch below.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        script: |
          import json
          import os

          path = "gitleaks-report.json"
          findings = []
          if os.path.exists(path) and os.path.getsize(path) > 0:
              with open(path) as f:
                  findings = json.load(f)

          rules = sorted({f.get("RuleID", "unknown") for f in findings})
          print(f"{len(findings)} finding(s) across {len(rules)} rule(s)")
          print("::" + json.dumps({"outputs": {
              "leak_count": len(findings),
              "rules": rules,
              "rules_summary": ", ".join(rules) if rules else "n/a",
          }}) + "::")

  - id: check_findings
    type: io.kestra.plugin.core.flow.If
    description: Branch on the leak count — findings escalate everywhere, a clean scan just records itself.
    condition: "{{ outputs.parse_report.vars.leak_count > 0 }}"
    then:
      - id: create_issue
        type: io.kestra.plugin.github.issues.Create
        description: Open a labeled GitHub issue listing the triggered rules, so the leak lands in the same backlog engineers already work from.
        jwtToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.repository }}"
        title: "Secrets detected in {{ inputs.repository }} by Kestra scan"
        body: |
          ## Secret scan findings

          **{{ outputs.parse_report.vars.leak_count }} finding(s)** on branch `{{ inputs.branch }}` — rules triggered: {{ outputs.parse_report.vars.rules_summary }}.

          Execution: {{ execution.id }}

          Rotate anything that was committed, scrub it from history, then close this issue.
        labels:
          - security
          - secrets
      - id: alert_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Tell the team how many leaks were found and that a GitHub issue is waiting.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "Secret scan found {{ outputs.parse_report.vars.leak_count }} leak(s) in {{ inputs.repository }} (branch {{ inputs.branch }}): {{ outputs.parse_report.vars.rules_summary }}. A GitHub issue has been opened — rotate anything that was committed. Execution {{ execution.id }}."
          }
      - id: fail_the_run
        type: io.kestra.plugin.core.execution.Fail
        description: Fail the execution so whatever automation watches it sees red instead of a quiet success.
        errorMessage: "Secret scan found {{ outputs.parse_report.vars.leak_count }} finding(s) in {{ inputs.repository }}."
    else:
      - id: log_clean
        type: io.kestra.plugin.core.log.Log
        description: Record the clean result so the execution history doubles as a scan trail.
        message: "gitleaks found no secrets in {{ inputs.repository }} (branch {{ inputs.branch }})."

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the scan itself broke — clone failure, image pull failure — because a dead scanner is indistinguishable from a clean repository.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Secret scan FAILED in flow {{ flow.id }} (execution {{ execution.id }}) — the repository was NOT checked. Verify the GITHUB_TOKEN secret and Docker access on the worker."
      }

outputs:
  - id: leak_count
    type: INT
    description: Number of secret findings in the scanned branch, e.g. 3.
    value: "{{ outputs.parse_report.vars.leak_count }}"
  - id: rules
    type: ARRAY
    description: 'Distinct gitleaks rule IDs that fired, e.g. ["aws-access-key-id", "generic-api-key"].'
    value: "{{ outputs.parse_report.vars.rules | toJson }}"

extend:
  title: Scan GitHub Repos for Committed Secrets with gitleaks
  shortDescription: On every push, clone the repository, run gitleaks in a container, and escalate findings as a labeled GitHub issue, a Slack alert, and a failed run.
  metaTitle: Secret Scanning on Push with gitleaks and Kestra
  metaDescription: Scan every push for committed secrets with gitleaks, open a labeled GitHub issue on findings, alert Slack, and fail the run — orchestrated in Kestra.
  description: |
    Secrets committed to git rarely stay secret: keys end up in issue threads, forks, and clone histories even after the file is deleted. This blueprint makes scanning automatic. A webhook fires on push, the repository is checked out into a shared working directory, `gitleaks` runs inside its official container with `--redact` so detected values never reach the logs, and a small Python step turns the JSON report into a leak count and the distinct rules that fired. Findings escalate three ways at once — a labeled GitHub issue, a Slack alert, and a failed execution — while a clean scan quietly records itself as proof the check ran.

    ## How it works

    1. The `on_push` trigger (`io.kestra.plugin.core.trigger.Webhook`) exposes a keyed URL for your GitHub push hook or CI to POST to.
    2. `workspace` (`io.kestra.plugin.core.flow.WorkingDirectory`) opens one shared filesystem for everything that follows, so the scanner sees the clone and the parser sees the report.
    3. `clone_repository` (`io.kestra.plugin.git.Clone`) checks out `{{ inputs.repository }}` at `{{ inputs.branch }}`, authenticating with `GITHUB_TOKEN`.
    4. `run_secret_scan` (`io.kestra.plugin.scripts.shell.Commands` on the `io.kestra.plugin.scripts.runner.docker.Docker` runner, image `zricethezav/gitleaks:latest`) executes `gitleaks detect --redact --report-format json --report-path gitleaks-report.json --exit-code 0`: findings land in a redacted JSON file and the task stays green so evaluation happens in the next step.
    5. `parse_report` (`io.kestra.plugin.scripts.python.Script` on the Process runner) reads the report, and emits `leak_count`, `rules`, and `rules_summary` through Kestra's outputs protocol.
    6. `check_findings` (`io.kestra.plugin.core.flow.If`) branches on `leak_count`. Over zero, `create_issue` (`io.kestra.plugin.github.issues.Create`) opens an issue labeled `security` and `secrets` with the rule list, `alert_slack` posts the count and rules, and `fail_the_run` (`io.kestra.plugin.core.execution.Fail`) turns the execution red. At zero, `log_clean` records the all-clear.
    7. The `errors` block alerts Slack when the scan itself fails, because a broken scanner looks exactly like a clean repository.

    ## What you get

    - Committed secrets found on every push instead of during the next incident.
    - Findings escalated where engineers already work: a labeled GitHub issue plus a Slack ping.
    - Redacted logs — gitleaks never prints the discovered values, only rule IDs and file paths.
    - A scan trail: every execution (clean or not) is a dated record in Kestra's history, with `leak_count` and `rules` as outputs.
    - A failed run on findings, so branch protections and downstream automations can enforce it.

    ## Who it's for

    - Development teams that want secret scanning without standing up a SaaS scanner.
    - Security engineers enforcing "no credentials in git" as a checked, alertable gate.
    - Platform teams already running Kestra who want CI-grade checks in their orchestrator.

    ## Why orchestrate this with Kestra

    gitleaks is an excellent scanner, but a scanner nobody runs catches nothing. Kestra supplies the loop around it: an event trigger for the scan, a hermetic Docker runner so the tool version lives in the flow, a branch that separates escalation from the all-clear, retries and execution history for every run, and alert routing into GitHub and Slack from one declarative file. A git hook running `gitleaks` locally gives developers none of that — it only protects the machines of people who remember to install it.

    ## Prerequisites

    - A worker with Docker access (the scan runs in the gitleaks container) and Python 3 on the host for the report parser, or switch `parse_report` to a Docker task runner.
    - A GitHub repository that allows issue creation with the provided token (classic PAT scope `repo`, or fine-grained **Issues: write** plus **Contents: read**).
    - A Slack incoming webhook for escalation and failure alerts.

    ### Secrets

    - `GITHUB_TOKEN`: personal access token used both to clone the repository and to open the issue on findings.
    - `SECRET_SCAN_WEBHOOK_KEY`: key segment guarding the webhook URL — anyone with it can trigger a scan, so treat it as a secret.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL.

    ## Quick start

    1. Add the three secrets to your Kestra namespace.
    2. Set `repository` to the `owner/repo` you want scanned and `branch` if it is not `main`.
    3. Point your GitHub webhook (push events) at `/api/v1/{tenant}/executions/webhook/{namespace}/github-secret-scan-gitleaks-on-push/{SECRET_SCAN_WEBHOOK_KEY}`, or trigger the webhook manually.
    4. Confirm a clean run, then push a test commit containing a fake key (for example a dummy `AKIA` string) and confirm the issue, the Slack alert, and the failed execution.

    ## How to extend

    - Scan many repositories by overriding the `repository` input per call, or fan out with a `Loop` over a repository list.
    - Derive the repository and branch from the push payload instead of inputs with `{{ fromJson(trigger.body).repository.full_name }}` and `{{ trigger.ref }}` for multi-repo setups.
    - Replace `create_issue` with a pull-request comment or a security ticket in Jira/Linear.
    - Add `gitleaks dir --no-git` variants for repositories shipped as artifacts, or schedule the scan nightly with a `Schedule` trigger as defense in depth.

    ## Links

    - [gitleaks documentation](https://github.com/gitleaks/gitleaks)
    - [Git plugin documentation](https://kestra.io/plugins/plugin-git)
    - [GitHub plugin documentation](https://kestra.io/plugins/plugin-github)
    - [Slack plugin documentation](https://kestra.io/plugins/plugin-slack)
    - This blueprint as been created by [RudraMalvankar](https://github.com/RudraMalvankar)
  tags:
    - Infrastructure
  subTags:
    - Policy & Compliance
    - CI/CD & Deployment
  ee: false
  demo: false
