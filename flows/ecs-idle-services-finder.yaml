id: ecs-idle-services-finder
namespace: company.finops

description: |
  Finds ECS services that are broken or idle: services with zero running tasks
  despite a desired count, and services with near-zero CPU and memory over 7
  days. Reports per-service utilization so you can scale to zero or delete.

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to audit for idle ECS services.
  - id: cpu_threshold_pct
    type: STRING
    defaults: "5"
    description: Services under this average CPU % (7d) count as idle.
  - id: mem_threshold_pct
    type: STRING
    defaults: "10"
    description: Services under this average memory % (7d) count as idle.

tasks:
  - id: check_services
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit ECS services region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: List clusters and services, check task counts and 7-day CPU/memory per service.
        commands:
          - |
            REGION="{{ taskrun.value }}"
            CPU_T="{{ inputs.cpu_threshold_pct }}"
            MEM_T="{{ inputs.mem_threshold_pct }}"
            END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            START=$(date -u -d "7 days ago" +%Y-%m-%dT%H:%M:%SZ)
            echo "Checking ECS services in $REGION"
            BROKEN_LIST=""
            IDLE_LIST=""
            for CARN in $(aws ecs list-clusters --region "$REGION" --query 'clusterArns' --output text); do
              CNAME=$(basename "$CARN")
              for SARN in $(aws ecs list-services --region "$REGION" --cluster "$CARN" --query 'serviceArns' --output text); do
                INFO=$(aws ecs describe-services --region "$REGION" --cluster "$CARN" --services "$SARN" \
                  --query 'services[0].[serviceName,desiredCount,runningCount]' --output text)
                SNAME=$(echo "$INFO" | awk '{print $1}')
                DESIRED=$(echo "$INFO" | awk '{print $2}')
                RUNNING=$(echo "$INFO" | awk '{print $3}')
                if [ "$RUNNING" -eq 0 ] && [ "$DESIRED" -gt 0 ]; then
                  BROKEN_LIST="${BROKEN_LIST}${SNAME} (cluster ${CNAME}: desired=${DESIRED} running=0), "
                  continue
                fi
                if [ "$RUNNING" -eq 0 ]; then
                  IDLE_LIST="${IDLE_LIST}${SNAME} (cluster ${CNAME}: scaled to zero already), "
                  continue
                fi
                CPU=$(aws cloudwatch get-metric-statistics --region "$REGION" \
                  --namespace AWS/ECS --metric-name CPUUtilization \
                  --dimensions Name=ServiceName,Value="$SNAME" Name=ClusterName,Value="$CNAME" \
                  --start-time "$START" --end-time "$END" --period 604800 --statistics Average \
                  --query 'Datapoints[0].Average' --output text 2>/dev/null)
                MEM=$(aws cloudwatch get-metric-statistics --region "$REGION" \
                  --namespace AWS/ECS --metric-name MemoryUtilization \
                  --dimensions Name=ServiceName,Value="$SNAME" Name=ClusterName,Value="$CNAME" \
                  --start-time "$START" --end-time "$END" --period 604800 --statistics Average \
                  --query 'Datapoints[0].Average' --output text 2>/dev/null)
                case "$CPU" in ''|'None') CPU=0;; esac
                case "$MEM" in ''|'None') MEM=0;; esac
                LOW=$(python3 -c "print('y' if float('$CPU') < float('$CPU_T') and float('$MEM') < float('$MEM_T') else 'n')")
                if [ "$LOW" = "y" ]; then
                  IDLE_LIST="${IDLE_LIST}${SNAME} (cluster ${CNAME}: cpu=${CPU}% mem=${MEM}%), "
                fi
              done
            done
            if [ -n "$BROKEN_LIST$IDLE_LIST" ]; then HAS_FINDINGS=true; else HAS_FINDINGS=false; fi
            echo "HAS_FINDINGS=$HAS_FINDINGS"
            echo "BROKEN_SERVICES=$BROKEN_LIST"
            echo "IDLE_SERVICES=$IDLE_LIST"
            echo "REGION_DONE=$REGION"
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ taskrun.value }}"
      - id: notify_region
        type: io.kestra.plugin.core.flow.If
        description: Report broken and idle services, stay quiet on healthy regions.
        condition: "{{ outputs.audit_region.vars.HAS_FINDINGS == 'true' }}"
        then:
          - id: slack_findings
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":whale: ECS audit `{{ outputs.audit_region.vars.REGION_DONE }}`\n:rotating_light: Broken (desired>0, running=0): `{{ outputs.audit_region.vars.BROKEN_SERVICES }}`\n:zzz: Idle (low CPU/mem 7d): `{{ outputs.audit_region.vars.IDLE_SERVICES }}`\nScale the idle ones to zero or delete them; investigate the broken ones."
              }
        else:
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            message: "All ECS services in {{ outputs.audit_region.vars.REGION_DONE }} have healthy task counts and utilization."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Sunday at 02:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 2 * * 0"
    disabled: true

extend:
  title: ECS Idle Services Finder
  metaTitle: Find Idle or Broken ECS Services | Kestra
  shortDescription: Audit ECS services across regions for zero running tasks or near-zero CPU/memory over 7 days, and get a Slack report to scale or delete them.
  metaDescription: Idle ECS services burn Fargate/EC2 capacity. This flow finds broken and idle services via CloudWatch and reports weekly.
  description: |
    ECS services fail in two expensive ways: tasks that never start (desired > 0, running = 0) while the scheduler keeps trying, and services nobody calls anymore still holding their task count. Both are invisible in the console unless you go looking. This blueprint looks for both, every week, in every region.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 02:00 UTC (shipped disabled).
    2. A ForEach loop audits each region in `aws_regions`.
    3. Per region, the flow lists clusters and services, then checks desired vs running task counts.
    4. Services with running tasks get 7-day `CPUUtilization` and `MemoryUtilization` from CloudWatch; under both thresholds counts as idle.
    5. An `If` task posts a Slack report separating broken services from idle ones.

    ## What you get

    - Broken services called out immediately — desired tasks with zero running is usually a bad image, bad IAM role, or bad health check.
    - Idle services with utilization evidence, ready to scale to zero or delete.
    - Multi-region coverage, silence on healthy weeks.

    ## Who it's for

    Teams running ECS on Fargate or EC2 whose service count grew past what anyone reviews by hand.

    ## Why orchestrate this with Kestra

    The ECS console shows one service at a time. As a scheduled flow the whole fleet is audited on a cadence, thresholds are inputs the team can tune, and the report lands in Slack where on-call already lives.

    ## Prerequisites

    - AWS credentials with `ecs:ListClusters`, `ecs:ListServices`, `ecs:DescribeServices`, and `cloudwatch:GetMetricStatistics`.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the ECS and CloudWatch API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the ECS and CloudWatch API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the service report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` to your ECS regions.
    3. Run manually once and triage the broken vs idle lists.
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Auto-scale idle services to zero with an opt-in gate.
    - Add cost estimates using Fargate vCPU/GB-hour pricing per task definition.
    - Alert immediately (not weekly) on any service with running=0 and desired>0.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [ECS CloudWatch metrics](https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/ecs-metricscollected.html)
    - [ECS describe-services API](https://docs.aws.amazon.com/cli/latest/reference/ecs/describe-services.html)
  tags:
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Monitoring & Alerting
  ee: false
  demo: false
