id: timefold-solver-feasibility-gate
namespace: company.team
description: |
  Submit an optimization dataset to the Timefold Platform on a
  schedule, wait for the solver to finish, classify the returned score
  as FEASIBLE, INFEASIBLE, or UNREACHABLE by checking for hard
  constraint violations, log clean solves, and alert Slack the moment
  a solution breaks a hard constraint or the platform cannot be
  reached.

inputs:
  - id: model_type
    type: SELECT
    defaults: "EMPLOYEE_SCHEDULING"
    values:
      - "EMPLOYEE_SCHEDULING"
      - "FIELD_SERVICE_ROUTING"
    displayName: "Timefold Model"
    description: "Which Timefold Platform model to solve with; determines the REST resource the dataset is submitted to."
  - id: model_input_json
    type: STRING
    defaults: '{"employees":[{"id":"Alice","skills":[{"id":"nursing"}]}],"shifts":[{"id":"SHIFT-001","start":"2027-02-01T08:00:00Z","end":"2027-02-01T16:00:00Z","requiredSkills":["nursing"]}]}'
    displayName: "Model Input (JSON)"
    description: "JSON string for the modelInput dataset, following the selected model's schema (employees/shifts for EMPLOYEE_SCHEDULING, vehicles/visits for FIELD_SERVICE_ROUTING)."
  - id: solve_duration
    type: STRING
    defaults: "PT15S"
    displayName: "Solve Duration"
    description: "ISO-8601 duration the platform solver spends on this dataset before returning."

triggers:
  - id: timefold_feasibility_gate_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Resolve and classify a fresh solve every 6 hours."
    cron: "0 */6 * * *"
    disabled: true
    inputs:
      model_type: "EMPLOYEE_SCHEDULING"
      solve_duration: "PT15S"

tasks:
  - id: submit_and_solve
    type: io.kestra.plugin.timefold.Solve
    description: "Submit the dataset to the Timefold Platform and wait for the solver to finish, returning solverStatus and score. fetchType is NONE since this gate only needs the score, not the full modelOutput."
    apiKey: "{{ secret('TIMEFOLD_API_KEY') }}"
    model: "{{ inputs.model_type }}"
    modelInput: "{{ inputs.model_input_json }}"
    solveDuration: "{{ inputs.solve_duration }}"
    wait: true
    fetchType: NONE
    allowFailure: true

  - id: classify_solution_feasibility
    type: io.kestra.plugin.core.debug.Return
    description: "Classify UNREACHABLE when no score was returned, INFEASIBLE when the score reports any hard constraint violations, otherwise FEASIBLE. Timefold formats score as e.g. 0hard/0medium/-3603soft, so a feasible solution always starts with 0hard."
    format: "{{ outputs.submit_and_solve.score is defined ? (outputs.submit_and_solve.score starts with '0hard' ? 'FEASIBLE' : 'INFEASIBLE') : 'UNREACHABLE' }}"

  - id: route_by_feasibility
    type: io.kestra.plugin.core.flow.Switch
    description: "Log a quiet confirmation when the solution is feasible, page Slack when a hard constraint is broken, or page Slack when the platform could not be reached."
    value: "{{ outputs.classify_solution_feasibility.value }}"
    cases:
      "FEASIBLE":
        - id: log_feasible
          type: io.kestra.plugin.core.log.Log
          message: "Timefold solve for {{ inputs.model_type }} is feasible, score {{ outputs.submit_and_solve.score }}."
      "INFEASIBLE":
        - id: alert_infeasible
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Timefold sentinel INFEASIBLE: solve for model {{ inputs.model_type }} (job {{ outputs.submit_and_solve.jobId }}) returned score {{ outputs.submit_and_solve.score }}, which reports at least one hard constraint violation. Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Timefold sentinel UNREACHABLE: no score was returned for model {{ inputs.model_type }} (invalid API key, platform outage, or solve timed out before requestTimeout). Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        message: "Completed Timefold feasibility check for {{ inputs.model_type }} with status: {{ outputs.classify_solution_feasibility.value }}"

  - id: log_audit_status
    type: io.kestra.plugin.core.log.Log
    description: "Post-audit status line recorded on every run regardless of branch, for a continuous feasibility trend in the execution history."
    message: "Timefold feasibility audit: model={{ inputs.model_type }}, jobId={{ outputs.submit_and_solve.jobId }}, status={{ outputs.classify_solution_feasibility.value }}, execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alert Slack when the gate flow itself fails, so a broken check never silently stops auditing solver feasibility."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Timefold feasibility gate flow {{ flow.id }} FAILED (execution {{ execution.id }}). Feasibility status for model {{ inputs.model_type }} is now unknown; check the task logs and the Timefold Platform manually."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.classify_solution_feasibility.value }}"

extend:
  title: "Timefold Solver Feasibility Gate"
  metaTitle: Timefold Solver Feasibility Gate for Kestra
  shortDescription: Submit a dataset to the Timefold Platform, wait for the solve, classify the score for hard constraint violations, and alert Slack when a solution is infeasible.
  metaDescription: Gate Timefold Platform optimization solves on hard constraint violations and alert Slack when a schedule or route is infeasible.
  description: |
    An optimized schedule or route plan that silently breaks a hard constraint, like double-booking an employee or missing a required skill, is worse than no plan at all, because it looks solved. This blueprint submits a dataset to the Timefold Platform, waits for the solver, and gates the result on its own reported score: any hard constraint violation pages Slack instead of letting the solution flow downstream unreviewed.

    ## How it works

    1. `submit_and_solve` (`io.kestra.plugin.timefold.Solve`) submits `model_input_json` to the selected `model_type` with `wait: true`, so the task blocks until the Timefold Platform finishes solving and returns `jobId`, `solverStatus`, and `score`. `fetchType: NONE` skips the full `modelOutput` since this gate only inspects the score. `allowFailure: true` means a connection or authentication failure still lets the flow continue instead of aborting.
    2. `classify_solution_feasibility` (`io.kestra.plugin.core.debug.Return`) checks whether `outputs.submit_and_solve.score` is defined; if not, `UNREACHABLE`. Otherwise it checks whether the score string starts with `0hard` (Timefold's score format is `{hard}hard/{medium}medium/{soft}soft`), returning `FEASIBLE` or `INFEASIBLE`.
    3. `route_by_feasibility` (`io.kestra.plugin.core.flow.Switch`) branches on that string: `FEASIBLE` logs a quiet confirmation, `INFEASIBLE` pages Slack with the job id and score, `UNREACHABLE` pages Slack separately, and `defaults` logs the raw outcome.
    4. `log_audit_status` records a status line on every run regardless of branch, so the execution history is a continuous feasibility trend.
    5. The `errors` block pages Slack separately if the flow itself fails outright.
    6. The `timefold_feasibility_gate_schedule` trigger polls every 6 hours with explicit input overrides, shipped `disabled: true` until you add a real API key and dataset.

    ## What you get

    - A solve-and-gate check with zero custom polling code; the task itself waits for the solver.
    - A three-way `status` output (`FEASIBLE` / `INFEASIBLE` / `UNREACHABLE`) you can chart or gate other flows on.
    - A Slack page naming the job id and the exact score behind an infeasible solution.
    - A separate failure channel for the gate flow itself, plus a standing audit log line per run.

    ## Who it's for

    - Operations and workforce-planning teams who generate schedules or routes with Timefold and want an automatic check before publishing a plan.
    - Platform teams who want a feasibility audit trail for every solve, not just the ones someone remembers to check manually.

    ## Why orchestrate this with Kestra

    Calling the Timefold API from a script gets you a score once; this flow makes that score load-bearing. Every solve is recorded in the execution history, the feasibility check becomes a typed output other flows can depend on, and the Switch branch is one edit away from real remediation (blocking publication, re-submitting with relaxed constraints, opening a ticket) instead of a one-off check.

    ## Prerequisites

    - A Timefold Platform API key with access to the selected model, created at [timefold.ai](https://timefold.ai/). `baseUrl` defaults to the managed cloud (`https://app.timefold.ai`) and can be overridden for a self-hosted Timefold deployment; no standalone open-source Docker image exists for the managed Platform API this blueprint targets, and the plugin's own documentation does not state whether a free tier exists, so treat API access as UNVERIFIED without checking current Timefold pricing.
    - A Slack incoming webhook for the infeasible and unreachable alerts.

    ### Secrets

    - `TIMEFOLD_API_KEY`: Timefold Platform API key, sent as the `X-API-KEY` header.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used for the infeasible alert, the unreachable alert, and the flow-failure alert.
    - OSS note: if your Kestra instance reads secrets from environment variables instead of a secrets backend, set `SECRET_TIMEFOLD_API_KEY` and `SECRET_SLACK_WEBHOOK_URL` as base64, for example `echo -n "<your-api-key>" | base64` and `echo -n "<your-webhook-url>" | base64`.

    ## Quick start

    1. Add the `TIMEFOLD_API_KEY` and `SLACK_WEBHOOK_URL` secrets.
    2. Set `model_type` and `model_input_json` to a real dataset for your model.
    3. Run the flow once and confirm `status` reads `FEASIBLE` for a valid dataset.
    4. Enable `timefold_feasibility_gate_schedule`.

    ## How to extend

    - Parse the `medium` and `soft` components of the score too, and classify a WARNING tier for solutions that are feasible but score poorly on soft constraints.
    - Add a remediation task that re-submits the dataset with `wait: false` and a longer `solveDuration` when a first attempt is infeasible.
    - Loop over several datasets with a `Loop` task to gate an entire batch of schedules or route plans in one run.

    ## Links

    - [Timefold Platform API documentation](https://docs.timefold.ai/)
    - [Kestra Switch task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.switch)
  tags:
    - Data
    - Business
  subTags:
    - Monitoring & Alerting
    - Policy & Compliance
  ee: false
  demo: false
