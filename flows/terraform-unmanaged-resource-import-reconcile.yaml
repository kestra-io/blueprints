id: terraform-unmanaged-resource-import-reconcile
namespace: company.team

description: |
  Someone created the resource by hand and Terraform does not know it exists.
  The configuration still declares it, so terraform plan reports a create and
  the next apply dies on a name collision or builds a duplicate. This flow
  reads the provider inventory over its own API, matches every planned create
  against the live object, imports only the addresses inside an allowed prefix
  list, removes a state entry whose object is gone first, undoes an import that
  would make the next apply destroy the object, then re-reads plan and state and
  fails the run when the reconcile did not land.

labels:
  owner: platform-team
  system: terraform

inputs:
  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Report the import plan without touching the state. Safe mode, on by default.
    defaults: true

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    description: Allow state writes. Still needs dry_run false plus an approval on the paused execution.
    defaults: false

  - id: docker_host
    type: STRING
    displayName: Provider endpoint
    description: >-
      The daemon this configuration manages. Point it at the remote daemon that
      owns the resources, never at the daemon running Kestra. The flow reads the
      same endpoint over the Engine API, independently of the provider.
    defaults: tcp://127.0.0.1:2375

  - id: allowed_address_prefixes
    type: ARRAY
    itemType: STRING
    displayName: Allowed address prefixes
    description: >-
      An import is only ever attempted for an address starting with one of these
      prefixes. Every other collision is reported and left alone.
    defaults: ["docker_container.edge_", "docker_network.edge_"]

  - id: protected_addresses
    type: ARRAY
    itemType: STRING
    displayName: Protected addresses
    description: >-
      Exact addresses this flow never imports, even when they sit inside an
      allowed prefix and collide with a live object.
    defaults: []

  - id: importable_types
    type: ARRAY
    itemType: STRING
    displayName: Importable resource types
    description: Resource types whose import id this flow knows how to read from the provider API.
    defaults: ["docker_container", "docker_network", "docker_volume"]

  - id: max_imports
    type: INT
    displayName: Maximum imports per run
    description: Ceiling on state writes in one run. Anything above it is reported as held back.
    defaults: 5

  - id: tolerated_attributes
    type: ARRAY
    itemType: STRING
    displayName: Attributes the provider cannot read back
    description: >-
      Attributes that exist only in the configuration, so a freshly imported
      resource always shows them as an in place update. Any other attribute
      difference after an import fails the run.
    defaults: ["must_run", "attach", "logs", "start", "rm", "wait", "wait_timeout", "remove_volumes", "container_read_refresh_timeout_milliseconds"]

  - id: task_network
    type: STRING
    displayName: Docker network for the task containers
    description: >-
      Network the Terraform containers join so they can reach the state backend
      and the provider endpoint by name. Use bridge when both are reachable by
      address.
    defaults: bridge

  - id: state_pg_endpoint
    type: STRING
    displayName: State backend host:port
    description: Postgres holding the Terraform state. The pg backend ships with Terraform, no extra provider.
    defaults: postgres:5432

  - id: state_pg_database
    type: STRING
    displayName: State backend database
    description: Database inside that Postgres holding the state table.
    defaults: terraform_state

  - id: node_image
    type: STRING
    displayName: Image the managed containers run
    description: Passed to the configuration below as a Terraform variable.
    defaults: busybox:1.37

tasks:
  - id: detect
    type: io.kestra.plugin.terraform.cli.TerraformCLI
    description: >-
      Read the truth twice in one container. First the provider inventory
      straight off the Engine API, then terraform plan with a refresh. A planned
      create whose object is already live is an unmanaged resource, not new work.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: "{{ inputs.task_network }}"
    containerImage: hashicorp/terraform:1.10.5
    env:
      PG_CONN_STR: "postgres://{{ secret('POSTGRES_USERNAME') }}:{{ secret('POSTGRES_PASSWORD') }}@{{ inputs.state_pg_endpoint }}/{{ inputs.state_pg_database }}?sslmode=disable"
      TF_IN_AUTOMATION: "true"
      TF_VAR_docker_host: "{{ inputs.docker_host }}"
      TF_VAR_node_image: "{{ inputs.node_image }}"
      ALLOWED: "{{ inputs.allowed_address_prefixes | toJson }}"
      PROTECTED: "{{ inputs.protected_addresses | toJson }}"
      TYPES: "{{ inputs.importable_types | toJson }}"
      MAX_IMPORTS: "{{ inputs.max_imports }}"
    inputFiles:
      main.tf: |
        # Replace this with your own configuration. Keep the backend remote so
        # every task in the flow reads and writes the same state.
        terraform {
          required_version = ">= 1.6"
          backend "pg" {}
          required_providers {
            docker = {
              source  = "kreuzwerker/docker"
              version = "~> 3.0"
            }
          }
        }

        variable "docker_host" { type = string }

        variable "node_image" {
          type    = string
          default = "busybox:1.37"
        }

        provider "docker" {
          host = var.docker_host
        }

        resource "docker_image" "node" {
          name         = var.node_image
          keep_locally = true
        }

        resource "docker_network" "edge_net" {
          name   = "edge-net"
          driver = "bridge"
        }

        resource "docker_container" "edge_api" {
          name     = "edge-api"
          image    = docker_image.node.name
          must_run = true
          restart  = "no"
          command  = ["sleep", "86400"]

          lifecycle {
            # An imported container reports the env the image sets. Because env
            # forces replacement, every import without this would look like a
            # resource the next apply has to rebuild.
            ignore_changes = [env]
          }
        }

        resource "docker_container" "edge_cache" {
          name     = "edge-cache"
          image    = docker_image.node.name
          must_run = true
          restart  = "no"
          command  = ["sleep", "86400"]

          lifecycle {
            # An imported container reports the env the image sets. Because env
            # forces replacement, every import without this would look like a
            # resource the next apply has to rebuild.
            ignore_changes = [env]
          }
        }

        resource "docker_container" "edge_worker" {
          name     = "edge-worker"
          image    = docker_image.node.name
          must_run = true
          restart  = "no"
          command  = ["sleep", "86400"]

          lifecycle {
            # An imported container reports the env the image sets. Because env
            # forces replacement, every import without this would look like a
            # resource the next apply has to rebuild.
            ignore_changes = [env]
          }
        }

        resource "docker_container" "edge_cron" {
          name     = "edge-cron"
          image    = docker_image.node.name
          must_run = true
          restart  = "no"
          command  = ["sleep", "86400"]

          lifecycle {
            # An imported container reports the env the image sets. Because env
            # forces replacement, every import without this would look like a
            # resource the next apply has to rebuild.
            ignore_changes = [env]
          }
        }

        resource "docker_container" "legacy_sidecar" {
          name     = "legacy-sidecar"
          image    = docker_image.node.name
          must_run = true
          restart  = "no"
          command  = ["sleep", "86400"]

          lifecycle {
            # An imported container reports the env the image sets. Because env
            # forces replacement, every import without this would look like a
            # resource the next apply has to rebuild.
            ignore_changes = [env]
          }
        }
      inventory.sh: |
        #!/bin/sh
        # Read the provider inventory from the Engine API, not from Terraform.
        # Writes live.json: [{type, name, live_id}]
        set -e
        API=$(echo "$TF_VAR_docker_host" | sed -e 's|^tcp://|http://|' -e 's|^unix://|http://localhost|')
        wget -qO- "$API/containers/json?all=true" \
          | jq -c '[.[] | {type: "docker_container", name: (.Names[0] | ltrimstr("/")), live_id: .Id}]' > live_containers.json
        wget -qO- "$API/networks" \
          | jq -c '[.[] | {type: "docker_network", name: .Name, live_id: .Id}]' > live_networks.json
        wget -qO- "$API/volumes" \
          | jq -c '[.Volumes[]? | {type: "docker_volume", name: .Name, live_id: .Name}]' > live_volumes.json
        jq -s -c add live_containers.json live_networks.json live_volumes.json > live.json
      reconcile.jq: |
        # Select import targets from a Terraform JSON plan.
        # stdin: terraform show -json <planfile>
        # $live: [{type,name,live_id}] read from the provider API
        # $st: terraform show -json, the persisted state
        # $allowed: address prefixes that may be touched
        # $protected: addresses never touched
        # $types: resource types whose import id this flow can resolve
        # $max: per run cap on state writes
        ($live[0] // []) as $live_objects
        | ($st[0].values.root_module.resources // []) as $state_resources
        | ([$state_resources[] | .address] | sort) as $state_addresses
        | [$live_objects[] | .live_id] as $live_ids
        | [.resource_changes[]? | select(.change.actions == ["create"])] as $creates
        | [.resource_changes[]? | select(.change.actions != ["no-op"]) | .address] as $pending
        | [$pending[] | select(. as $a | ([$allowed[] | select(. as $p | ($a | startswith($p)))] | length) > 0)] as $pending_in_scope
        | [$creates[]
           | . as $c
           | ($c.change.after.name // null) as $name
           | ($live_objects | map(select(.type == $c.type and .name == $name)) | .[0].live_id // null) as $live_id
           | ($state_resources | map(select(.address == $c.address)) | .[0].values.id // null) as $recorded_id
           | (($state_addresses | index($c.address)) != null) as $in_state
           | {address: $c.address,
              type: $c.type,
              name: $name,
              live_id: $live_id,
              recorded_id: $recorded_id,
              in_state: $in_state,
              verdict:
                (if ($protected | index($c.address)) != null then "protected"
                 elif ([$allowed[] | select(. as $p | ($c.address | startswith($p)))] | length) == 0 then "outside_allowed_prefix"
                 elif ($types | index($c.type)) == null then "type_not_importable"
                 elif $name == null then "no_identity_in_plan"
                 elif $live_id == null then "create_not_a_collision"
                 elif $in_state and ($recorded_id != null) and (($live_ids | index($recorded_id)) != null) then "recorded_object_still_live"
                 elif $in_state then "state_rm_then_import"
                 else "import" end)}]
          as $candidates
        | ([$candidates[] | select(.verdict == "import" or .verdict == "state_rm_then_import")] | sort_by(.address)) as $eligible
        | {counts: {candidates: ($candidates | length),
                    collisions: ($eligible | length),
                    selected: ($eligible[0:$max] | length),
                    held_back: ($eligible[$max:] | length),
                    spared: ([$candidates[] | select(.verdict != "import" and .verdict != "state_rm_then_import")] | length),
                    state_entries: ($state_addresses | length),
                    live_objects: ($live_objects | length),
                    pending_changes: ($pending | length),
                    pending_in_scope: ($pending_in_scope | length)},
           state_addresses: $state_addresses,
           pending_in_scope: ($pending_in_scope | sort),
           selected: $eligible[0:$max],
           held_back: $eligible[$max:],
           spared: [$candidates[] | select(.verdict != "import" and .verdict != "state_rm_then_import")],
           candidates: $candidates}
    outputFiles:
      - main.tf
      - inventory.sh
      - reconcile.jq
      - live.json
      - plan.txt
      - targets.json
      - state_backup.json
    beforeCommands:
      - apk add --no-cache jq > /dev/null
      - terraform init -input=false -no-color
    commands:
      - |
        set -e
        sh inventory.sh
        terraform state pull > state_backup.json
        set +e
        terraform plan -refresh=true -detailed-exitcode -no-color -input=false -lock-timeout=60s -out=tfplan > plan.txt 2>&1
        PLAN_EXIT=$?
        set -e
        if [ "$PLAN_EXIT" = "1" ]; then
          cat plan.txt
          echo "terraform plan failed, nothing was read"
          exit 1
        fi
        terraform show -json tfplan > plan.json
        terraform show -json > state.json
        jq -f reconcile.jq \
          --slurpfile live live.json --slurpfile st state.json \
          --argjson allowed "$ALLOWED" --argjson protected "$PROTECTED" \
          --argjson types "$TYPES" --argjson max "$MAX_IMPORTS" \
          plan.json > targets.json
        echo "counts $(jq -c .counts targets.json)"
        jq -r '.candidates[] | "candidate \(.address) name=\(.name) live=\(.live_id // "none") verdict=\(.verdict)"' targets.json
        printf '::{"outputs":{"plan_exit":%s,"collisions":%s,"selected":%s,"selected_count":%s,"held_back":%s,"spared":%s,"state_entries":%s,"live_objects":%s,"pending_in_scope":%s,"state_addresses":%s}}::\n' \
          "$PLAN_EXIT" \
          "$(jq -r .counts.collisions targets.json)" \
          "$(jq -c .selected targets.json)" \
          "$(jq -r .counts.selected targets.json)" \
          "$(jq -r .counts.held_back targets.json)" \
          "$(jq -r .counts.spared targets.json)" \
          "$(jq -r .counts.state_entries targets.json)" \
          "$(jq -r .counts.live_objects targets.json)" \
          "$(jq -r .counts.pending_in_scope targets.json)" \
          "$(jq -c .state_addresses targets.json)"

  - id: report
    type: io.kestra.plugin.core.log.Log
    description: Say what was found and whether this run is allowed to write anything.
    message: |
      terraform plan detailed exit code {{ outputs.detect.vars.plan_exit }} on {{ inputs.docker_host }}
      live objects {{ outputs.detect.vars.live_objects }}, state entries {{ outputs.detect.vars.state_entries }}
      pending changes inside the allowed prefixes {{ outputs.detect.vars.pending_in_scope }}
      unmanaged resources that collide with a live object {{ outputs.detect.vars.collisions }}
      selected for import {{ outputs.detect.vars.selected_count }}, held back by max_imports {{ outputs.detect.vars.held_back }}, spared {{ outputs.detect.vars.spared }}
      selected {{ outputs.detect.vars.selected | toJson }}
      dry_run {{ inputs.dry_run }}, auto_remediate {{ inputs.auto_remediate }}
      {{ (outputs.detect.vars.collisions > 0 and inputs.auto_remediate and inputs.dry_run == false) ? 'the run will pause for approval before any state write' : 'nothing will be written on this run' }}

  - id: reconcile_gate
    type: io.kestra.plugin.core.flow.If
    description: The write path. Needs a real collision, auto_remediate true and dry_run false.
    condition: "{{ outputs.detect.vars.collisions > 0 and inputs.auto_remediate and inputs.dry_run == false }}"
    then:
      - id: approve_import
        type: io.kestra.plugin.core.flow.Pause
        description: >-
          An import rewrites state for a live resource, so a human answers
          first. Resume with approved true to write, false to walk away.
        pauseDuration: PT1H
        onResume:
          - id: approved
            type: BOOL
            displayName: Import the selected addresses
            description: true writes state for the addresses listed above. Anything else leaves the state alone.
            defaults: false

      - id: when_approved
        type: io.kestra.plugin.core.flow.If
        description: An unanswered or declined pause must write nothing.
        condition: "{{ outputs.approve_import.onResume.approved ?? false }}"
        then:
          - id: recheck
            type: io.kestra.plugin.terraform.cli.TerraformCLI
            description: >-
              The approval is a snapshot of the past. Read the inventory and the
              plan again, then keep only the addresses whose live object still
              carries the id the human approved.
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
              networkMode: "{{ inputs.task_network }}"
            containerImage: hashicorp/terraform:1.10.5
            env:
              PG_CONN_STR: "postgres://{{ secret('POSTGRES_USERNAME') }}:{{ secret('POSTGRES_PASSWORD') }}@{{ inputs.state_pg_endpoint }}/{{ inputs.state_pg_database }}?sslmode=disable"
              TF_IN_AUTOMATION: "true"
              TF_VAR_docker_host: "{{ inputs.docker_host }}"
              TF_VAR_node_image: "{{ inputs.node_image }}"
              ALLOWED: "{{ inputs.allowed_address_prefixes | toJson }}"
              PROTECTED: "{{ inputs.protected_addresses | toJson }}"
              TYPES: "{{ inputs.importable_types | toJson }}"
              MAX_IMPORTS: "{{ inputs.max_imports }}"
              APPROVED: "{{ outputs.detect.vars.selected | toJson }}"
            inputFiles:
              main.tf: "{{ outputs.detect.outputFiles['main.tf'] }}"
              inventory.sh: "{{ outputs.detect.outputFiles['inventory.sh'] }}"
              reconcile.jq: "{{ outputs.detect.outputFiles['reconcile.jq'] }}"
            outputFiles:
              - main.tf
              - inventory.sh
              - confirmed.json
              - state_backup.json
            beforeCommands:
              - apk add --no-cache jq > /dev/null
              - terraform init -input=false -no-color
            commands:
              - |
                set -e
                sh inventory.sh
                terraform state pull > state_backup.json
                set +e
                terraform plan -refresh=true -detailed-exitcode -no-color -input=false -lock-timeout=60s -out=tfplan > replan.txt 2>&1
                PLAN_EXIT=$?
                set -e
                if [ "$PLAN_EXIT" = "1" ]; then
                  cat replan.txt
                  echo "terraform plan failed after the approval, nothing was written"
                  exit 1
                fi
                terraform show -json tfplan > plan.json
                terraform show -json > state.json
                jq -f reconcile.jq \
                  --slurpfile live live.json --slurpfile st state.json \
                  --argjson allowed "$ALLOWED" --argjson protected "$PROTECTED" \
                  --argjson types "$TYPES" --argjson max "$MAX_IMPORTS" \
                  plan.json > targets_now.json
                echo "$APPROVED" > approved.json
                jq -c -n --slurpfile a approved.json --slurpfile t targets_now.json '
                  ($a[0] // []) as $approved
                  | ($t[0].selected // []) as $now
                  | {confirmed: [$approved[] | . as $x | select($now | map(select(.address == $x.address and .live_id == $x.live_id)) | length > 0)],
                     stale: [$approved[] | . as $x | select(($now | map(select(.address == $x.address and .live_id == $x.live_id)) | length) == 0) | .address]}
                ' > diff.json
                jq -c .confirmed diff.json > confirmed.json
                echo "approved $(jq -r 'length' approved.json), still eligible $(jq -r '.confirmed | length' diff.json), stale $(jq -c .stale diff.json)"
                jq -r '.selected[] | "eligible now \(.address) live=\(.live_id)"' targets_now.json
                printf '::{"outputs":{"confirmed":%s,"confirmed_count":%s,"stale":%s,"stale_count":%s,"collisions_now":%s,"state_before":%s,"pending_in_scope_before":%s}}::\n' \
                  "$(jq -c .confirmed diff.json)" \
                  "$(jq -r '.confirmed | length' diff.json)" \
                  "$(jq -c .stale diff.json)" \
                  "$(jq -r '.stale | length' diff.json)" \
                  "$(jq -r .counts.collisions targets_now.json)" \
                  "$(jq -c .state_addresses targets_now.json)" \
                  "$(jq -r .counts.pending_in_scope targets_now.json)"

          - id: fail_when_plan_stale
            type: io.kestra.plugin.core.execution.Fail
            description: >-
              Something moved between the approval and now. Stop before the
              first write instead of importing an id that no longer exists.
            condition: "{{ outputs.recheck.vars.stale_count > 0 }}"
            errorMessage: >-
              The approved plan is stale. {{ outputs.recheck.vars.stale | toJson }} no longer
              match the live objects the approval was given for. No state was written.
              Run the flow again to approve the current plan.

          - id: import_targets
            type: io.kestra.plugin.core.flow.Loop
            description: >-
              One state write at a time. The pg backend takes a lock per write,
              and parallel imports would queue on it, so the loop is serial.
            values: "{{ outputs.recheck.vars.confirmed | toJson }}"
            concurrencyLimit: 1
            tasks:
              - id: import_one
                type: io.kestra.plugin.terraform.cli.TerraformCLI
                description: >-
                  Read this one object from the Engine API again, drop a state
                  entry whose object is gone, import the live id, then check the
                  resulting plan. An import that would destroy the object on the
                  next apply is removed from state again and fails the run.
                taskRunner:
                  type: io.kestra.plugin.scripts.runner.docker.Docker
                  networkMode: "{{ inputs.task_network }}"
                containerImage: hashicorp/terraform:1.10.5
                env:
                  PG_CONN_STR: "postgres://{{ secret('POSTGRES_USERNAME') }}:{{ secret('POSTGRES_PASSWORD') }}@{{ inputs.state_pg_endpoint }}/{{ inputs.state_pg_database }}?sslmode=disable"
                  TF_IN_AUTOMATION: "true"
                  TF_VAR_docker_host: "{{ inputs.docker_host }}"
                  TF_VAR_node_image: "{{ inputs.node_image }}"
                  ADDR: "{{ fromJson(item.value).address }}"
                  OBJ_TYPE: "{{ fromJson(item.value).type }}"
                  OBJ_NAME: "{{ fromJson(item.value).name }}"
                  LIVE_ID: "{{ fromJson(item.value).live_id }}"
                inputFiles:
                  main.tf: "{{ outputs.recheck.outputFiles['main.tf'] }}"
                  inventory.sh: "{{ outputs.recheck.outputFiles['inventory.sh'] }}"
                beforeCommands:
                  - apk add --no-cache jq > /dev/null
                  - terraform init -input=false -no-color
                commands:
                  - |
                    set -e
                    sh inventory.sh
                    FRESH=$(jq -r --arg t "$OBJ_TYPE" --arg n "$OBJ_NAME" \
                      '[.[] | select(.type == $t and .name == $n)] | .[0].live_id // ""' live.json)
                    if [ "$FRESH" != "$LIVE_ID" ]; then
                      echo "refusing $ADDR: the approved object was $LIVE_ID, the live object is now ${FRESH:-gone}"
                      exit 1
                    fi
                    if terraform state list | grep -Fxq "$ADDR"; then
                      RECORDED=$(terraform show -json | jq -r --arg a "$ADDR" \
                        '[.values.root_module.resources[]? | select(.address == $a)] | .[0].values.id // ""')
                      if [ "$RECORDED" = "$LIVE_ID" ]; then
                        echo "$ADDR already records $LIVE_ID, this run writes nothing for it"
                        exit 0
                      fi
                      echo "state entry for $ADDR records ${RECORDED:-nothing}, which is not the live object, removing it first"
                      terraform state rm -lock-timeout=120s "$ADDR"
                    fi
                    terraform import -input=false -no-color -lock-timeout=120s "$ADDR" "$LIVE_ID"
                    terraform plan -refresh=false -no-color -input=false -lock-timeout=60s -out=after.tfplan > after_plan.txt 2>&1 || {
                      cat after_plan.txt
                      echo "cannot plan after importing $ADDR"
                      exit 1
                    }
                    DESTROY=$(terraform show -json after.tfplan | jq -r --arg a "$ADDR" \
                      '[.resource_changes[]? | select(.address == $a) | select((.change.actions | index("delete")) != null)] | length')
                    if [ "$DESTROY" != "0" ]; then
                      echo "the imported object does not match the configuration for $ADDR, the next apply would destroy it"
                      terraform state rm -lock-timeout=120s "$ADDR"
                      echo "the import was undone, $ADDR is unmanaged again and the object is untouched"
                      exit 1
                    fi
                    echo "imported $ADDR as $LIVE_ID"

          - id: verify
            type: io.kestra.plugin.terraform.cli.TerraformCLI
            description: >-
              Read the system a third time. Every approved address must now hold
              the live id, the live object must still carry the id it had before
              the run and the plan must no longer want to create or destroy it.
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
              networkMode: "{{ inputs.task_network }}"
            containerImage: hashicorp/terraform:1.10.5
            env:
              PG_CONN_STR: "postgres://{{ secret('POSTGRES_USERNAME') }}:{{ secret('POSTGRES_PASSWORD') }}@{{ inputs.state_pg_endpoint }}/{{ inputs.state_pg_database }}?sslmode=disable"
              TF_IN_AUTOMATION: "true"
              TF_VAR_docker_host: "{{ inputs.docker_host }}"
              TF_VAR_node_image: "{{ inputs.node_image }}"
              ALLOWED: "{{ inputs.allowed_address_prefixes | toJson }}"
              APPROVED: "{{ outputs.recheck.vars.confirmed | toJson }}"
              STATE_BEFORE: "{{ outputs.recheck.vars.state_before | toJson }}"
              RESIDUAL: "{{ inputs.tolerated_attributes | toJson }}"
            inputFiles:
              main.tf: "{{ outputs.recheck.outputFiles['main.tf'] }}"
              inventory.sh: "{{ outputs.recheck.outputFiles['inventory.sh'] }}"
              verify.jq: |
                # Verify a reconcile against the system itself.
                # stdin: terraform show -json <planfile>, taken after the imports
                # $live: provider inventory read again
                # $st: terraform show -json, the state now
                # $approved: the targets the loop was given
                # $before: state addresses recorded before the imports
                # $residual: attributes the provider cannot read back on import
                ($live[0] // []) as $live_objects
                | ($st[0].values.root_module.resources // []) as $state_resources
                | ([$state_resources[] | .address] | sort) as $state_now
                | ($approved[0] // []) as $targets
                | ($before[0] // []) as $state_before
                | [.resource_changes[]?
                   | select(.change.actions != ["no-op"])
                   | {address: .address,
                      actions: .change.actions,
                      attrs: (.change as $c
                              | (($c.after // {}) as $a | ($c.before // {}) as $b
                                 | (($a | keys) + ($b | keys) | unique
                                    | map(select((($a[.]) // null) != (($b[.]) // null))))))}]
                  as $changes
                | [$targets[]
                   | . as $t
                   | ($live_objects | map(select(.type == $t.type and .name == $t.name)) | .[0].live_id // null) as $live_now
                   | ($state_resources | map(select(.address == $t.address)) | .[0].values.id // null) as $state_id
                   | ($changes | map(select(.address == $t.address)) | .[0]) as $chg
                   | {address: $t.address,
                      name: $t.name,
                      approved_live_id: $t.live_id,
                      live_id_now: $live_now,
                      state_id_now: $state_id,
                      plan_actions: ($chg.actions // ["no-op"]),
                      changed_attrs: ($chg.attrs // []),
                      unexpected_attrs: (($chg.attrs // []) - $residual),
                      in_state: (($state_now | index($t.address)) != null),
                      object_survived: ($live_now != null and $live_now == $t.live_id),
                      state_matches_object: ($state_id != null and $state_id == $t.live_id),
                      plan_is_quiet: ((($chg.actions // ["no-op"]) | map(select(. != "no-op" and . != "update")) | length) == 0),
                      residual_is_allowed: (((($chg.attrs // []) - $residual) | length) == 0)}]
                  as $results
                | [$targets[] | .address] as $target_addresses
                | ([$targets[] | select(.in_state == false) | .address] | sort) as $expected_added
                | ([$targets[] | select(.in_state) | .address] | sort) as $reimported
                | (($state_now - $state_before) | sort) as $state_added
                | [$changes[] | .address] as $pending
                | [$pending[] | select(. as $a | ([$allowed[] | select(. as $p | ($a | startswith($p)))] | length) > 0)] as $pending_in_scope
                | {ok: (([$results[] | select(.object_survived and .state_matches_object and .in_state and .plan_is_quiet and .residual_is_allowed)] | length) == ($targets | length)
                        and ($state_added == $expected_added)),
                   counts: {approved: ($targets | length),
                            reconciled: ([$results[] | select(.object_survived and .state_matches_object and .in_state and .plan_is_quiet and .residual_is_allowed)] | length),
                            objects_replaced: ([$results[] | select(.object_survived == false)] | length),
                            pending_changes: ($changes | length),
                            pending_in_scope: ($pending_in_scope | length),
                            unexpected_attr_targets: ([$results[] | select(.residual_is_allowed == false)] | length),
                            reimported_in_place: ($reimported | length)},
                   state_added: $state_added,
                   state_added_expected: $expected_added,
                   reimported_in_place: $reimported,
                   state_now: $state_now,
                   pending_in_scope: ($pending_in_scope | sort),
                   targets: $results}
            outputFiles:
              - verified.json
              - replan.txt
            beforeCommands:
              - apk add --no-cache jq > /dev/null
              - terraform init -input=false -no-color
            commands:
              - |
                set -e
                sh inventory.sh
                echo "$APPROVED" > approved.json
                echo "$STATE_BEFORE" > state_before.json
                set +e
                terraform plan -refresh=true -detailed-exitcode -no-color -input=false -lock-timeout=60s -out=tfplan > replan.txt 2>&1
                PLAN_EXIT=$?
                set -e
                if [ "$PLAN_EXIT" = "1" ]; then
                  cat replan.txt
                  echo "terraform plan failed after the imports"
                  exit 1
                fi
                terraform show -json tfplan > plan.json
                terraform show -json > state.json
                jq -f verify.jq \
                  --slurpfile live live.json --slurpfile st state.json \
                  --slurpfile approved approved.json --slurpfile before state_before.json \
                  --argjson residual "$RESIDUAL" --argjson allowed "$ALLOWED" \
                  plan.json > verified.json
                echo "counts $(jq -c .counts verified.json)"
                jq -r '.targets[] | "verified \(.address) state=\(.state_id_now // "none") live=\(.live_id_now // "gone") actions=\(.plan_actions | join(",")) unexpected=\(.unexpected_attrs | join(","))"' verified.json
                echo "state entries added $(jq -c .state_added verified.json), expected $(jq -c .state_added_expected verified.json)"
                printf '::{"outputs":{"ok":%s,"reconciled":%s,"approved":%s,"objects_replaced":%s,"pending_in_scope":%s,"unexpected_attr_targets":%s,"reimported_in_place":%s,"state_added":%s,"state_added_expected":%s}}::\n' \
                  "$(jq -r .ok verified.json)" \
                  "$(jq -r .counts.reconciled verified.json)" \
                  "$(jq -r .counts.approved verified.json)" \
                  "$(jq -r .counts.objects_replaced verified.json)" \
                  "$(jq -r .counts.pending_in_scope verified.json)" \
                  "$(jq -r .counts.unexpected_attr_targets verified.json)" \
                  "$(jq -r .counts.reimported_in_place verified.json)" \
                  "$(jq -c .state_added verified.json)" \
                  "$(jq -c .state_added_expected verified.json)"

          - id: fail_when_not_reconciled
            type: io.kestra.plugin.core.execution.Fail
            description: The imports going green proves nothing. Only the re-read counts.
            condition: "{{ outputs.verify.vars.ok == false }}"
            errorMessage: >-
              Reconcile did not land. {{ outputs.verify.vars.reconciled }} of
              {{ outputs.verify.vars.approved }} approved addresses hold their live id,
              {{ outputs.verify.vars.objects_replaced }} live objects no longer carry the id
              they had before the run, {{ outputs.verify.vars.unexpected_attr_targets }} show an
              attribute difference outside tolerated_attributes and state gained
              {{ outputs.verify.vars.state_added | toJson }} where
              {{ outputs.verify.vars.state_added_expected | toJson }} was expected. The state backup saved before the
              writes is on the recheck task as state_backup.json.

          - id: reconcile_confirmed
            type: io.kestra.plugin.core.log.Log
            description: Before and after, both read back from the system itself.
            message: |
              imported {{ outputs.verify.vars.reconciled }} of {{ outputs.verify.vars.approved }} approved addresses
              state entries {{ outputs.detect.vars.state_entries }} before, {{ outputs.verify.vars.state_added | toJson }} added
              addresses whose stale entry was replaced in place {{ outputs.verify.vars.reimported_in_place }}
              pending changes inside the allowed prefixes {{ outputs.detect.vars.pending_in_scope }} before, {{ outputs.verify.vars.pending_in_scope }} after
              live objects whose id changed during the run {{ outputs.verify.vars.objects_replaced }}
              every imported object kept the id it was created with by hand, so nothing was rebuilt

        else:
          - id: import_declined
            type: io.kestra.plugin.core.log.Log
            description: Nothing was written. Say so.
            message: |
              the import of {{ outputs.detect.vars.selected | toJson }} was declined or the pause went unanswered
              state entries are still {{ outputs.detect.vars.state_entries }}
              nothing was imported, nothing was removed from state

    else:
      - id: no_write
        type: io.kestra.plugin.core.log.Log
        description: Either there is nothing to reconcile or this run is read only.
        message: |
          unmanaged resources that collide with a live object {{ outputs.detect.vars.collisions }}
          {{ (outputs.detect.vars.collisions == 0) ? 'every planned create is new work, not an unmanaged resource' : 'collisions found but this run is read only' }}
          dry_run {{ inputs.dry_run }}, auto_remediate {{ inputs.auto_remediate }}
          terraform plan detailed exit code {{ outputs.detect.vars.plan_exit }}, pending changes inside the allowed prefixes {{ outputs.detect.vars.pending_in_scope }}

errors:
  - id: notify_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Tell the on-call channel which stage failed and on which endpoint.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": ":rotating_light: terraform-unmanaged-resource-import-reconcile failed on {{ inputs.docker_host }}. Execution {{ execution.id }}, flow {{ flow.namespace }}.{{ flow.id }}."
      }

triggers:
  - id: hourly_drift_scan
    type: io.kestra.plugin.core.trigger.Schedule
    description: Hourly read only scan. Enable it once the endpoint, the configuration and the allowed prefixes are yours.
    cron: "23 * * * *"
    disabled: true
    inputs:
      dry_run: true
      auto_remediate: false

extend:
  title: Import unmanaged resources into Terraform state and reconcile
  shortDescription: Match every planned create against the live object, import the unmanaged ones behind an approval then prove the next apply no longer rebuilds them.
  metaTitle: Reconcile unmanaged Terraform resources with Kestra
  metaDescription: Detect resources Terraform plans to create that already exist, import them behind an approval then verify the object survived.
  tags:
    - Infrastructure
  subTags:
    - Infrastructure Automation
    - Day 2 Operations
    - Approval Gates
  ee: false
  verified: false
  demo: false
  description: |
    ## Safety

    `terraform import` plus `terraform state rm` write directly to state. State is the only record of what Terraform believes it owns. Import the wrong id and the next apply destroys a live resource to build the one the configuration describes. Remove the wrong entry and Terraform forgets a resource it was managing. Neither command touches infrastructure, so nothing warns you at the time: the damage lands on the next apply, which is usually someone else's pipeline run. That is why this flow refuses by default. Every guard below is load bearing. Each one was proven by its own execution on the final revision.

    | Guard | What it stops |
    | --- | --- |
    | Live object read from the Engine API, matched to the planned create by type plus name | importing an address whose create is genuinely new work |
    | `allowed_address_prefixes` | writing state for an address outside the scope you named |
    | `protected_addresses` | touching an address you listed as never importable |
    | `importable_types` | writing state for a type whose import id this flow cannot resolve |
    | `max_imports` | a wrong detector writing state for everything in one run |
    | `auto_remediate` false plus `dry_run` true plus a `Pause` read as `onResume.approved ?? false` | three separate gates before one state write |
    | `recheck` after the approval, compared by address plus live id | importing an id that moved while the approval waited |
    | Per target re-read of the object inside the write task | acting on an object that changed after the recheck |
    | Already managed check before the write | a second runner importing the same address twice |
    | Post import plan check plus `terraform state rm` | leaving behind an import that the next apply would turn into a destroy |
    | `Loop` with `concurrencyLimit: 1` | parallel writes fighting over the backend lock |
    | `terraform state pull` saved before the writes | a bad reconcile with no way back |
    | `verify` plus `Fail` on the re-read | an import that reported success without landing |

    ## How it works

    1. `detect` (`io.kestra.plugin.terraform.cli.TerraformCLI`) reads the same system twice in one container. `inventory.sh` reads containers, networks plus volumes straight off the Docker Engine API. Then `terraform plan -refresh=true -detailed-exitcode -out=tfplan` produces the plan. `terraform state pull` saves the state as it was before anything is written.
    2. Still in `detect`, `reconcile.jq` joins the plan to that inventory. Every `create` action is looked up in the live inventory by type plus name then classified: `import`, `state_rm_then_import` when a state entry records an object that is gone, `create_not_a_collision` when the create is real new work, `outside_allowed_prefix`, `protected`, `type_not_importable` or `recorded_object_still_live`. Only the first two are eligible, sorted by address then capped at `max_imports`.
    3. `report` (`io.kestra.plugin.core.log.Log`) prints the plan exit code, the live object count, the state entry count, the pending changes inside the allowed prefixes, every candidate with its verdict plus whether this run may write.
    4. `reconcile_gate` (`io.kestra.plugin.core.flow.If`) needs a real collision together with `auto_remediate: true` plus `dry_run: false`. Anything else ends at `no_write`.
    5. `approve_import` (`io.kestra.plugin.core.flow.Pause`) waits for a person. `when_approved` reads `onResume.approved ?? false`, so a pause resumed without an answer is a refusal that ends at `import_declined`.
    6. `recheck` runs the whole detection again after the approval then keeps only the addresses whose live object still carries the id that was approved. `fail_when_plan_stale` (`io.kestra.plugin.core.execution.Fail`) ends the run before the first write when anything moved.
    7. `import_targets` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) handles one address at a time with `item.value`. `import_one` re-reads that single object from the Engine API, exits without writing when the address is already in state with the live id, runs `terraform state rm` first when the recorded object is gone, then runs `terraform import`. It plans again immediately: if the imported object does not match the configuration so the next apply would destroy it, the import is removed from state again then the run fails.
    8. `verify` reads plan, state plus the Engine API a third time. `verify.jq` requires that every approved address now records the live id, that the live object still carries the id it had before the run, that the plan no longer wants to create or destroy it plus that any remaining in place difference is limited to `tolerated_attributes`. `fail_when_not_reconciled` fails the run otherwise. The `errors` block posts the failure to Slack.

    Worth reading after a run: `{{ outputs.detect.vars.selected }}` is what the flow proposes to import, `{{ outputs.detect.outputFiles['targets.json'] }}` holds every candidate with its verdict, `{{ outputs.recheck.outputFiles['state_backup.json'] }}` is the state as it was immediately before the writes plus `{{ outputs.verify.outputFiles['verified.json'] }}` is the per address verdict after them.

    ## What you get

    - An answer to the plan nobody trusts: which of these creates are real new resources, which are things that already exist outside state.
    - The import itself, with the live id read from the provider API rather than typed by hand during an incident.
    - A stale state entry removed before its address is imported again, instead of an import that fails on an address already in state.
    - An import that would make the next apply destroy a live resource undone in the same run, with the run failing loudly.
    - A state backup saved immediately before the writes, so a bad reconcile can be restored with `terraform state push`.

    ## Who it's for

    Platform teams plus infrastructure teams whose pipelines are blocked by `Error: ... already exists` or by a plan full of creates for resources that are plainly running, usually after an emergency fix was made by hand.

    ## Why orchestrate this with Kestra

    The manual fix is a terminal, a plan read in a hurry, an id copied out of a cloud console plus `terraform import` typed once per resource, with no record of which ids went in or whether the result was safe to apply. As a flow the read, the decision, the approval, the write plus the proof are one audited execution: the plan together with the live inventory are captured as files, the write is held at a `Pause`, eligibility is read again after the approval, the loop serialises state writes then the verification is what decides whether the run passed. Running it on a disabled schedule in report only mode also turns the question "is anything running outside Terraform" into a routine check rather than a discovery during an incident.

    ## Tested end to end

    Kestra 2.0.5, Terraform plugin 1.2.10, Terraform 1.10.5, kreuzwerker/docker provider 3.6.2, state in a Postgres 17.5 `pg` backend, provider target an isolated Docker 27.5.1 daemon so nothing could touch the host. Flow validate on stock Kestra 2.0.5 was clean: no constraints, no warnings, no deprecations. The fixture declares five containers plus one network. It keeps a healthy control, a live container that no address declares (`edge-worker-canary`) plus a live container outside the allowed prefixes (`legacy-sidecar`). Every state, every live id plus every backend serial below was read with the `terraform` CLI together with the Engine API from outside Kestra, never from the flow's own output. The `pg` backend bumps the state serial on every write, so an unchanged serial is direct proof that no write happened. All eighteen executions ran on the final revision 7.

    | Case | Execution | Result |
    | --- | --- | --- |
    | Healthy | `5zULcj4ojebDhTTfj1zkPy` | SUCCESS. 0 collisions out of 1 candidate, 6 state entries against 10 live objects, serial 99 unchanged |
    | New resource inside the allowed scope | `2BtvgdrYraI8DRrgY16VfV` | SUCCESS. With the prefixes widened to every container plus network, the create whose object was deleted is spared as `create_not_a_collision`, serial 99 unchanged |
    | Degraded dry run | `4tufKsHyZ7FK0nmFDSxAo1` | SUCCESS. 3 collisions named with their live ids, 1 spared, state still 3 entries, serial 102 unchanged. The live `edge-worker-canary` that no address declares was never a candidate |
    | Protected addresses | `6BId0iAS7gt1Ia8a3Ruvf5` | SUCCESS. Two of the three eligible addresses listed in `protected_addresses` drop to spared, 1 collision left, serial 102 unchanged |
    | Type filter | `7HiZjRkxgZN0H7JUeRTF2X` | SUCCESS. With `importable_types` cut to `docker_network`, both container collisions become `type_not_importable`, 1 collision left |
    | Per run cap | `5ouXZ05WvySlEisAoWO2wf` | SUCCESS. 3 collisions, 1 selected, 2 held back, serial 102 unchanged |
    | Declined approval | `59WDqFt5QeL4WhmaaUteMq` | SUCCESS. Pause answered false, 0 state entries added, serial 102 unchanged |
    | Change during the Pause | `37DX0CBmQJfH769jBTEna9` | FAILED as intended. A target container was replaced while the approval waited. `recheck` reported 3 approved, 2 still eligible, 1 stale, then `fail_when_plan_stale` stopped the run before the first write. Serial 102 unchanged, so the two targets that had not moved were left alone as well |
    | Remediation | `6UjqWqsxdORjhRAacNuXok` | SUCCESS. 3 addresses imported in 3 serial loop iterations. An independent `terraform apply` on exactly those targets went from **exit 1 with "Plan: 3 to add" plus 3 name collisions** to **exit 0 with "0 added, 2 changed, 0 destroyed" plus 0 name collisions**. All 6 live container ids were identical before the run plus after the verifying apply, so nothing was rebuilt |
    | Repeat | `LrtERW86VX0tvk9zgjRQr` | SUCCESS. The identical second run found 0 collisions, took the read only exit, serial 106 unchanged |
    | Second full reconcile | `276eGFFED9Pfryf3cK3C72` | SUCCESS. From a freshly degraded fixture, 3 imports again, serial 111 to 114, one write per import |
    | Change mid loop | `6qlwOtVoXdMjr9XZx7qd1M` | FAILED as intended. The first target was replaced after `recheck` but before its write. Loop iteration 0 (`5OtMkL82rwcZIFRdIo5tov`) compared the id it had been given with the id the daemon returned then refused. Serial 109 unchanged, 0 state entries added, no later iteration ran |
    | Second runner mid loop | `5biorsXIobZesWqrnU8Gh` | SUCCESS. An operator imported the address by hand after `recheck`. Loop iteration 0 (`4bBCDZM2pYDOOFVBWiTDlF`) found it already recording the live id then wrote nothing. Serial moved 109 to 110, which is the operator's own import, leaving exactly 1 state entry for that address |
    | Interrupted pass | `5GJmOYUGNJz7OkLYT7WyhG` | FAILED as intended. Iteration 0 committed its import, iteration 1 was refused because its target had been replaced, iteration 2 never ran. Serial 117 to 118, exactly one committed write, two addresses left unmanaged |
    | Recovery after that interrupted pass | `4fZZOj68sL3rXsuvZW3DT4` | SUCCESS. The next run found only the 2 remaining collisions, imported each with the id it has now rather than the id the interrupted pass was approved for, left the committed entry untouched, created 0 duplicates. Serial 118 to 120 |
    | Refused write | `1UUuUXyFelACKe2rax9sQI` | FAILED as intended. A trigger on the state table made every backend write fail. `terraform import` reported `Error writing state file`, the run failed, serial stayed at 123 plus 0 state entries were added |
    | Import that would destroy the object | `4n9lohxGepaDE7sRDkrwmL` | FAILED as intended. A live container whose command did not match the configuration was imported, the post import plan showed a destroy, the import was removed from state again then the run failed. The address is unmanaged again, the container still carries the id it was created with by hand. The committed first iteration was kept |
    | Stale state entry | `4QByOKl0FAftTB29Comqg` | SUCCESS. The entry recording a container that no longer existed was removed first then the live container was imported in its place: the recorded id moved from the dead object to the live one, the entry count stayed at 6, serial 129 to 131 |

    A second fixture on fresh containers (a separate Docker daemon with zero containers at the start plus its own empty Postgres) repeated the three that matter: healthy `6LS8lfuVRun4jhgkmIVLDo` with 0 collisions plus the serial unchanged at 1, remediation `2qmQmHv5NI5Q4YLRcNwlod` with the same apply exit 1 to exit 0 plus serial 11 to 14 for three imports plus every live id conserved, then the pause race `5cXlseb8dP9G2WGPi1V6Az` refused again with serial 18 unchanged. Slack was a local HTTP sink that recorded the failure alerts.

    Earlier revisions failed two cases for real reasons that are now fixed in the flow: an imported container reports the env its image sets, which forces replacement unless the configuration ignores it. `remove_volumes` plus `container_read_refresh_timeout_milliseconds` exist only in the configuration, so they always show as an in place update after an import. The `recorded_object_still_live` plus `no_identity_in_plan` verdicts are defensive: the fixtures could not produce a plan that reaches them, so they are not counted as tested.

    ## Prerequisites

    - Terraform 1.6 or newer with a remote backend, so every task in the flow reads plus writes the same state. Tested on 1.10.5 with the `pg` backend.
    - A provider endpoint the Kestra worker can reach, plus a configuration whose resources this flow can look up by name.
    - Kestra 2.0 with the Terraform plugin plus the Slack plugin, together with a Docker task runner on a network that reaches both the backend plus the provider endpoint.
    - Minimum permissions: read on the provider inventory, read plus write on the state backend. No apply rights are needed, because this flow never applies.

    ### Secrets

    | Secret | What it is |
    | --- | --- |
    | `POSTGRES_USERNAME` | state backend account used in `PG_CONN_STR` |
    | `POSTGRES_PASSWORD` | its password |
    | `SLACK_WEBHOOK_URL` | Slack incoming webhook for the failure alert |

    ### Inputs

    | Input | Type | Default | What it does |
    | --- | --- | --- | --- |
    | `dry_run` | BOOL | `true` | report the import plan without writing state |
    | `auto_remediate` | BOOL | `false` | allow state writes, still behind `dry_run` false plus an approval |
    | `docker_host` | STRING | `tcp://127.0.0.1:2375` | provider endpoint, also read directly over the Engine API |
    | `allowed_address_prefixes` | ARRAY | `docker_container.edge_`, `docker_network.edge_` | the only addresses an import is ever attempted for |
    | `protected_addresses` | ARRAY | `[]` | exact addresses never imported, even when eligible |
    | `importable_types` | ARRAY | container, network, volume | types whose import id the flow can read from the API |
    | `max_imports` | INT | `5` | ceiling on state writes per run |
    | `tolerated_attributes` | ARRAY | `must_run`, `attach`, `logs`, `start`, `rm`, `wait`, `wait_timeout`, `remove_volumes`, `container_read_refresh_timeout_milliseconds` | attributes the provider cannot read back on import, so an in place update for them is accepted |
    | `task_network` | STRING | `bridge` | Docker network the Terraform containers join |
    | `state_pg_endpoint` | STRING | `postgres:5432` | host plus port of the state backend |
    | `state_pg_database` | STRING | `terraform_state` | database holding the state table |
    | `node_image` | STRING | `busybox:1.37` | variable passed to the shipped example configuration |

    ## Quick start

    1. Add the three secrets above to your Kestra instance.
    2. Replace the `main.tf` in `detect` with your own configuration. You can also fetch it with `io.kestra.plugin.git.Clone` then pass the checkout as `inputFiles`. Keep the backend remote.
    3. Set `docker_host`, `state_pg_endpoint` plus `task_network` so the task containers reach your provider endpoint together with your backend.
    4. Execute with the defaults. Read the candidate lines: each one names the address, the live id plus the verdict.
    5. Narrow `allowed_address_prefixes` to the addresses you are willing to have imported. List anything delicate in `protected_addresses`.
    6. Execute with `dry_run: false` plus `auto_remediate: true`. The run pauses. Approve it, then read the verification lines: state ids, live ids plus what the plan still wants to do.
    7. Enable the `hourly_drift_scan` trigger once you trust the report. It forces report only mode.

    ## How to extend

    - Swap the Docker provider for your own: replace `inventory.sh` with the API or CLI read that returns `{type, name, live_id}` for your resources. List those types in `importable_types`. The rest of the flow is provider agnostic.
    - Add `import` blocks to a pull request instead of writing state directly, by sending `targets.json` to a Git task. The selection logic stays the same.
    - Feed `targets.json` into a ticket so the resource created by hand gets an owner.
    - Run one execution per workspace, each with its own prefixes, approval plus schedule.
    - Keep `{{ outputs.recheck.outputFiles['state_backup.json'] }}` in your incident record. It is the state immediately before the writes, which is what `terraform state push` needs for a rollback.

    Limits: the flow imports resources whose live id can be resolved from their name, so a resource type with a composite or opaque import id needs its own lookup. Resource types whose import needs a module path or an index are out of scope. The example configuration is a sample, not a reconciler for every provider. Verification proves the plan no longer creates or destroys the imported addresses plus that the object kept its id. It does not run `terraform apply`, so the measured payoff of an apply that stops failing was taken with the CLI in the test rig rather than inside the flow. Attributes a provider cannot read back are accepted rather than corrected, which is why `tolerated_attributes` is a list you should review for your own resources. A run holds the backend lock only for the length of one write, so two executions can interleave: the post approval recheck together with the already managed check make that safe, they do not serialise it. A refused iteration stops the loop, so a run can end with part of its plan committed. That residue is state only, it is reported in the failure, the next run reconciles what is left plus the saved state backup restores the rest.

    ## Links

    - [Terraform: import a resource](https://developer.hashicorp.com/terraform/cli/import)
    - [Terraform: state rm](https://developer.hashicorp.com/terraform/cli/commands/state/rm)
    - [Terraform: the pg backend](https://developer.hashicorp.com/terraform/language/backend/pg)
    - [kreuzwerker/docker provider](https://registry.terraform.io/providers/kreuzwerker/docker/latest/docs)
