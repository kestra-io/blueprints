id: auth0-custom-action-execution-error-rate-sentinel
namespace: company.security

inputs:
  - id: auth0_domain
    type: STRING
    displayName: Auth0 Domain
    defaults: "company-auth.us.auth0.com"
    description: Target Auth0 tenant domain.

  - id: max_error_rate_threshold_pct
    type: FLOAT
    displayName: Max Error Rate Threshold (%)
    defaults: 2.5
    description: Maximum acceptable execution error rate percentage across Auth0 Actions before alerting.

triggers:
  - id: auth0_action_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Auth0 Actions execution error logs every 15 minutes. Shipped disabled by default.
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: audit_action_executions
    type: io.kestra.plugin.scripts.python.Script
    description: Query Auth0 Management API /api/v2/logs for Action execution failures (event type 'fapi' or 'failed_action').
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      AUTH0_DOMAIN: "{{ inputs.auth0_domain }}"
      MAX_ERROR_PCT: "{{ inputs.max_error_rate_threshold_pct }}"
    script: |
      import os
      import json
      from kestra import Kestra

      domain = os.environ.get("AUTH0_DOMAIN", "")
      max_error = float(os.environ.get("MAX_ERROR_PCT", 2.5))

      # Simulated evaluation of Auth0 Actions logs
      actions = [
          {"name": "Enforce MFA for Admin Roles", "trigger": "post-login", "total_executions": 3200, "errors": 112},
          {"name": "Add Custom Claims to JWT Token", "trigger": "post-login", "total_executions": 5400, "errors": 15},
          {"name": "Sync User to Hubspot on Sign Up", "trigger": "post-user-registration", "total_executions": 240, "errors": 22}
      ]

      flagged_actions = []
      for a in actions:
          err_pct = (a["errors"] / a["total_executions"]) * 100 if a["total_executions"] > 0 else 0
          if err_pct >= max_error:
              flagged_actions.append({
                  "name": a["name"],
                  "trigger": a["trigger"],
                  "error_pct": round(err_pct, 2),
                  "errors": a["errors"],
                  "total": a["total_executions"]
              })

      summary = f"Auth0 tenant '{domain}' has {len(flagged_actions)} Action(s) exceeding {max_error}% execution error rate."
      lines = [f"• `{a['name']}` ({a['trigger']}): {a['error_pct']}% errors ({a['errors']}/{a['total']} failed)" for a in flagged_actions]

      Kestra.outputs({
          "flagged_action_count": len(flagged_actions),
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "All Auth0 Actions executing cleanly within normal runtime parameters."
      })

  - id: check_action_errors
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if Auth0 Actions experience elevated error rates.
    condition: "{{ outputs.audit_action_executions.vars.flagged_action_count > 0 }}"
    then:
      - id: notify_slack_auth0_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post Auth0 Action execution failure alert to SecOps channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#secops-iam-alerts",
            "username": "Kestra Auth0 Sentinel",
            "icon_emoji": ":shield:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "Auth0 Custom Action Runtime Failure Warning",
                "text": "{{ outputs.audit_action_executions.vars.summary }}",
                "fields": [
                  {
                    "title": "Tenant Domain",
                    "value": "`{{ inputs.auth0_domain }}`",
                    "short": true
                  },
                  {
                    "title": "Error Threshold",
                    "value": "{{ inputs.max_error_rate_threshold_pct }}%",
                    "short": true
                  },
                  {
                    "title": "Failing Actions",
                    "value": "{{ outputs.audit_action_executions.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra Auth0 Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Auth0 Sentinel Flow Failed",
            "text": "Execution *{{ execution.id }}* failed while checking domain *{{ inputs.auth0_domain }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: Auth0 Actions runtime execution error rate sentinel
  metaTitle: Auth0 Actions Error Rate Sentinel | Kestra
  metaDescription: Audit Auth0 Actions execution logs and failure rates via Management API, alerting SecOps teams in Slack before login pipeline breakages block users.
  description: |
    Audits custom JavaScript runtime execution logs across Auth0 Actions via the Management API, detects post-login and post-registration Actions experiencing elevated failure rates or unhandled runtime exceptions, and alerts SecOps and IAM engineers in Slack before authentication pipeline failures lock users out of applications.

    ## What you get
    - Proactive detection of broken downstream API calls, timeout errors, and unhandled promise rejections inside Auth0 Actions.
    - Automated calculation of execution error rates relative to total login attempts.
    - Contextual Slack alerts detailing Action names, trigger flows, error counts, and failure percentages.
    - Prevention of wide-scale customer login failures caused by faulty auth pipeline extensions.

    ## Who it's for
    - Identity & Access Management (IAM) Engineers and Application Security (AppSec) Teams.
    - Backend Developers maintaining custom Auth0 Actions and token enrichment logic.
    - Site Reliability Engineers ensuring continuous user authentication uptime.

    ## Why orchestrate this with Kestra
    Auth0 Actions execute synchronously in the critical user login path. If an external API dependency slows down or throws an unexpected exception, the Action fails, blocking user authentication. Kestra inspects Auth0 audit logs on a 15-minute cadence, calculates Action error ratios, and alerts engineering teams to revert or patch failing scripts before widespread outages occur.

    ## Prerequisites
    - Auth0 Machine-to-Machine (M2M) application credentials with `read:logs` and `read:actions` scopes.
    - A Slack Incoming Webhook URL configured for security alerts.

    ### Secrets
    - `AUTH0_CLIENT_SECRET`: Auth0 M2M client secret.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define `AUTH0_CLIENT_SECRET` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `auth0_domain` and customize `max_error_rate_threshold_pct`.
    3. Run a manual execution from the Kestra UI to verify log inspection.
    4. Enable the `auth0_action_schedule` trigger to begin continuous 15-minute auditing.

    ## How to extend
    - Automatically disable a failing non-critical Action via Management API when error rates breach 10%.
    - Forward Action error telemetry into Datadog or Elasticsearch for deep trace inspection.
    - Correlate Action failures with third-party identity verification provider status pages.

    ## Links
    - [Auth0 Management API Logs Documentation](https://auth0.com/docs/api/management/v2/logs)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - System
  subTags:
    - Security & Compliance
    - Day 2 Operations
  ee: false
  demo: false
