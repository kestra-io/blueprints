id: chess-com-grandmaster-leaderboard-lakehouse-loader
namespace: company.analytics
description: Ingests competitive Grandmaster rankings, FIDE ratings, and win-loss statistics from Chess.com Leaderboards into Parquet lakehouse storage via DuckDB, tracking top rankings in Kestra KV store.

inputs:
  - id: game_mode
    type: STRING
    description: Chess rating discipline category (e.g. live_blitz, live_rapid, live_bullet).
    defaults: live_blitz

  - id: top_limit
    type: INT
    description: Number of top ranked Grandmasters to extract.
    defaults: 25

  - id: state_key
    type: STRING
    description: Kestra KV store key maintaining the latest known #1 ranked Grandmaster username.
    defaults: chess_com_monitored_top_player_state

variables:
  default_state: '""'

triggers:
  - id: daily_chess_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 2 * * *"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_leaderboard
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            prev_top = json.loads(raw_state) if raw_state else ""
        except Exception:
            prev_top = ""

        mode = "{{ inputs.game_mode }}"
        top_limit = int("{{ inputs.top_limit }}")

        url = "https://api.chess.com/pub/leaderboards"
        headers = {"User-Agent": "KestraChessLakehouse/1.0 (sports-analytics@kestra.io)"}

        records = []
        current_top_player = ""

        try:
            resp = requests.get(url, headers=headers, timeout=20)
            if resp.status_code == 200:
                data = resp.json()
                leaderboard = data.get(mode, [])

                for item in leaderboard[:top_limit]:
                    rank = int(item.get("rank", 0))
                    username = item.get("username", "")
                    player_id = int(item.get("player_id", 0))
                    title = item.get("title") or "None"
                    score = int(item.get("score", 0))
                    status = item.get("status", "")
                    country_url = item.get("country", "")

                    win_count = int(item.get("win_count", 0))
                    loss_count = int(item.get("loss_count", 0))
                    draw_count = int(item.get("draw_count", 0))

                    if rank == 1:
                        current_top_player = username

                    records.append({
                        "discipline": mode,
                        "rank": rank,
                        "username": username,
                        "player_id": player_id,
                        "fide_title": title,
                        "rating_score": score,
                        "status": status,
                        "country_code": country_url.split("/")[-1] if country_url else "",
                        "win_count": win_count,
                        "loss_count": loss_count,
                        "draw_count": draw_count,
                        "harvest_time": datetime.utcnow().isoformat()
                    })
        except Exception as e:
            print(f"Error fetching Chess.com leaderboard: {e}")

        with open("chess_leaderboard.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("CREATE TABLE chess_rankings AS SELECT * FROM read_json_auto('chess_leaderboard.json')")
            con.execute("COPY chess_rankings TO 'chess_grandmaster_leaderboard.parquet' (FORMAT PARQUET)")
            con.execute("COPY chess_rankings TO 'chess_grandmaster_leaderboard.csv' (HEADER, DELIMITER ',')")
        else:
            con.execute("""
                CREATE TABLE chess_rankings (
                    discipline VARCHAR,
                    rank INTEGER,
                    username VARCHAR,
                    player_id BIGINT,
                    fide_title VARCHAR,
                    rating_score INTEGER,
                    status VARCHAR,
                    country_code VARCHAR,
                    win_count INTEGER,
                    loss_count INTEGER,
                    draw_count INTEGER,
                    harvest_time VARCHAR
                )
            """)
            con.execute("COPY chess_rankings TO 'chess_grandmaster_leaderboard.parquet' (FORMAT PARQUET)")
            con.execute("COPY chess_rankings TO 'chess_grandmaster_leaderboard.csv' (HEADER, DELIMITER ',')")

        is_new_no1 = bool(current_top_player and current_top_player != prev_top)

        summary = {
            "total_players_ranked": len(records),
            "current_top_player": current_top_player,
            "is_new_no1_leader": is_new_no1,
            "updated_state": current_top_player
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - chess_grandmaster_leaderboard.parquet
      - chess_grandmaster_leaderboard.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_leaderboard.vars.updated_state | toJson }}"

  - id: check_leader_change
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_leaderboard.vars.is_new_no1_leader }}"
    then:
      - id: notify_new_leader
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "♟️ Chess.com Leaderboard Transition: Grandmaster {{ outputs.ingest_and_transform_leaderboard.vars.current_top_player }} is now ranked #1 in {{ inputs.game_mode }}."

outputs:
  - id: total_players
    type: INT
    value: "{{ outputs.ingest_and_transform_leaderboard.vars.total_players_ranked }}"
  - id: top_player
    type: STRING
    value: "{{ outputs.ingest_and_transform_leaderboard.vars.current_top_player }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_leaderboard.outputFiles['chess_grandmaster_leaderboard.parquet'] }}"

extend:
  title: Chess.com Grandmaster Competitive Leaderboard Lakehouse Loader with DuckDB
  metaTitle: Chess.com Leaderboard Lakehouse Loader | Kestra
  shortDescription: Ingests competitive Grandmaster rankings, FIDE titles, and win-loss statistics from Chess.com Leaderboards into Parquet lakehouse storage via DuckDB.
  metaDescription: Poll Chess.com public REST API for Grandmaster leaderboards, convert ratings into Parquet via DuckDB, and track #1 rankings in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Automate the collection, sports analytics harmonization, and analytical lakehouse persistence of Grandmaster
    competitive rankings, FIDE master titles, win-draw-loss records, and ELO rating scores from Chess.com into Parquet using DuckDB.

    ## How it works

    1. **State Recovery**: Queries the Kestra KV store (`chess_com_monitored_top_player_state`) for the previously logged #1 ranked Grandmaster.
    2. **Chess.com Ingestion**: Queries the official Chess.com Pub API (`api.chess.com/pub/leaderboards`) across configured discipline categories (`live_blitz`, `live_rapid`, `live_bullet`).
    3. **DuckDB Competitive Normalization**: Unpacks ranks, player IDs, usernames, titles (GM, IM), scores, and win/loss statistics into a relational schema inside Docker.
    4. **Analytical Lake Export**: Exports normalized ranking records into columnar Parquet and CSV files for competitive sports analytics and rating progression models.
    5. **Leader Change Detection & State Commitment**: Detects transitions at the top of the leaderboard, issues alerts, and commits the #1 player to Kestra KV store.

    ## What you get

    - Automated, scheduled collection of global competitive chess leaderboards and player statistics.
    - Columnar Parquet datasets queryable with DuckDB, ClickHouse, Snowflake, or Athena.
    - Built-in KV state management providing idempotent execution and zero database requirements.

    ## Who it's for

    - Sports Analytics Engineers and Esports Data Scientists modeling competitive matchmaking ratings.
    - Chess Content Creators tracking world top player rank fluctuations.
    - Analytics Engineers building reproducible multi-cloud lakehouse pipelines.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains historical rank #1 states across runs without database infrastructure.
    - Ephemeral Docker execution guarantees reproducible, clean Python and DuckDB runtimes.
    - Declarative scheduled execution with automated error recovery and conditional logging.

    ## Prerequisites

    - Docker runner configured on the Kestra worker.
    - Outbound internet access to `api.chess.com`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for forwarding leaderboard crown notifications.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Select your `game_mode` (e.g. `live_blitz`, `live_rapid`).
    3. Click **Execute** to run an immediate harvest and generate the Parquet archive.
    4. Enable the `daily_chess_sync` schedule for automated daily updates.

    ## How to extend

    - Add an S3 or Google Cloud Storage step to partition daily leaderboard rankings.
    - Connect a player game archive scraper to extract PGN game moves of top-ranked players.

    ## Links

    - [Chess.com Published Data API](https://www.chess.com/news/view/published-data-api)
    - [DuckDB Documentation](https://duckdb.org/)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
