id: openapi-server-transport-security-gate
namespace: company.api
description: |
  Audit a public OpenAPI 3.x document before publishing or onboarding consumers. The flow extracts server
  URLs declared at the document, path and operation levels; resolves server variables using their declared
  defaults; and checks that every effective endpoint uses HTTPS, avoids local/private addresses, and
  stays within an optional hostname allowlist. It produces JSON evidence, can archive the report to S3,
  and blocks publication on policy violations. This checks the server URLs written in the specification;
  it does not probe every endpoint for reachability or verify TLS certificates.

inputs:
  - id: spec_url
    type: STRING
    displayName: OpenAPI document URL
    defaults: https://petstore3.swagger.io/api/v3/openapi.json
    description: Public URL for an OpenAPI 3.x JSON or YAML document.
  - id: allowed_server_hosts
    type: STRING
    displayName: Allowed server hostnames
    defaults: petstore3.swagger.io
    description: Comma-separated allowed hostnames; exact hosts and their subdomains are permitted.
  - id: require_explicit_servers
    type: BOOL
    displayName: Require explicit server URLs
    defaults: true
    description: Block if the document has no effective server URL declarations.
  - id: require_https
    type: BOOL
    displayName: Require HTTPS
    defaults: true
    description: Block server URLs that are not absolute HTTPS URLs.
  - id: reject_local_or_private_hosts
    type: BOOL
    displayName: Reject local or private hosts
    defaults: true
    description: Block loopback, private, link-local, localhost and internal-only hostnames.
  - id: archive_report
    type: BOOL
    displayName: Archive report to S3
    defaults: false
    description: Store the JSON endpoint policy report in S3. AWS secrets are required only when enabled.
  - id: notify_slack
    type: BOOL
    displayName: Send Slack notifications
    defaults: false
    description: Enable only after configuring SLACK_WEBHOOK_URL in the Kestra namespace.
  - id: evidence_bucket
    type: STRING
    displayName: Evidence bucket
    defaults: my-api-governance-evidence
    description: Existing S3 bucket used when report archival is enabled.
  - id: evidence_prefix
    type: STRING
    displayName: Evidence prefix
    defaults: openapi-server-transport
    description: Prefix for OpenAPI endpoint policy reports.
  - id: aws_region
    type: STRING
    displayName: AWS region
    defaults: eu-west-1
    description: Region of the evidence bucket.

triggers:
  - id: weekly_openapi_endpoint_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Recheck the endpoint transport policy weekly after spec releases. Enable after validating the hostname allowlist.
    cron: "0 8 * * 1"
    disabled: true

tasks:
  - id: validate_request
    type: io.kestra.plugin.scripts.python.Script
    description: Validate the document URL and policy options before requesting the public OpenAPI document.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      SPEC_URL: "{{ inputs.spec_url }}"
      ALLOWED_HOSTS: "{{ inputs.allowed_server_hosts }}"
    script: |
      import os
      from urllib.parse import urljoin, urlsplit

      spec_url = os.environ.get("SPEC_URL", "").strip()
      hosts = [h.strip().lower() for h in os.environ.get("ALLOWED_HOSTS", "").split(",") if h.strip()]
      parsed = urlsplit(spec_url)
      if parsed.scheme.lower() != "https" or not parsed.hostname:
          raise ValueError("spec_url must be an absolute HTTPS URL")
      if parsed.username or parsed.password:
          raise ValueError("spec_url must not embed credentials")
      if not hosts:
          raise ValueError("allowed_server_hosts must contain at least one hostname")
      print(f"Validated OpenAPI spec URL and {len(hosts)} allowed server host rule(s).")

  - id: fetch_openapi_spec
    type: io.kestra.plugin.core.http.Request
    description: Fetch the real public OpenAPI JSON or YAML document to evaluate its declared server URLs.
    uri: "{{ inputs.spec_url }}"
    method: GET
    headers:
      Accept: application/vnd.oai.openapi+json, application/json, application/yaml, text/yaml, */*
      User-Agent: Kestra-OpenAPI-Server-Transport-Gate/1.0
    timeout: PT45S

  - id: audit_server_urls
    type: io.kestra.plugin.scripts.python.Script
    description: Parse OpenAPI 3.x, resolve declared server variables and validate effective server URL schemes, hosts, and local/private address restrictions.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install pyyaml kestra
    inputFiles:
      openapi-spec.txt: "{{ outputs.fetch_openapi_spec.body }}"
    env:
      SPEC_URL: "{{ inputs.spec_url }}"
      ALLOWED_HOSTS: "{{ inputs.allowed_server_hosts }}"
      REQUIRE_EXPLICIT_SERVERS: "{{ inputs.require_explicit_servers }}"
      REQUIRE_HTTPS: "{{ inputs.require_https }}"
      REJECT_LOCAL_OR_PRIVATE: "{{ inputs.reject_local_or_private_hosts }}"
    outputFiles:
      - openapi-server-audit.json
    script: |
      import ipaddress
      import json
      import os
      import re
      from datetime import datetime, timezone
      from urllib.parse import urljoin, urlsplit

      import yaml
      from kestra import Kestra

      spec_url = os.environ["SPEC_URL"].strip()
      allowed_hosts = [h.strip().lower().lstrip(".") for h in os.environ.get("ALLOWED_HOSTS", "").split(",") if h.strip()]
      require_explicit = os.environ.get("REQUIRE_EXPLICIT_SERVERS", "true").lower() == "true"
      require_https = os.environ.get("REQUIRE_HTTPS", "true").lower() == "true"
      reject_local = os.environ.get("REJECT_LOCAL_OR_PRIVATE", "true").lower() == "true"

      with open("openapi-spec.txt", encoding="utf-8") as source:
          raw = source.read()
      try:
          document = json.loads(raw)
      except json.JSONDecodeError:
          document = yaml.safe_load(raw)
      if not isinstance(document, dict):
          raise ValueError("OpenAPI document must be a YAML or JSON object")

      version = str(document.get("openapi") or "")
      if not (version.startswith("3.0.") or version.startswith("3.1.")):
          raise ValueError(f"Expected an OpenAPI 3.0.x or 3.1.x document, found {version!r}")

      findings = []
      def add(code, severity, message, location=None, url=None):
          findings.append({
              "code": code,
              "severity": severity,
              "location": location,
              "url": url,
              "message": message,
          })

      declarations = []
      def add_servers(servers, location):
          if servers is None:
              return
          if not isinstance(servers, list):
              add("SERVERS_SHAPE_INVALID", "BLOCK", "OpenAPI servers field must be an array.", location)
              return
          for index, server in enumerate(servers):
              if not isinstance(server, dict):
                  add("SERVER_ENTRY_INVALID", "BLOCK", "Server entry must be an object.", f"{location}[{index}]")
                  continue
              raw_url = str(server.get("url") or "").strip()
              if not raw_url:
                  add("SERVER_URL_MISSING", "BLOCK", "Server object has no URL.", f"{location}[{index}]")
                  continue
              variables = server.get("variables") or {}
              missing_defaults = []
              def replace_variable(match):
                  key = match.group(1)
                  value = variables.get(key) if isinstance(variables, dict) else None
                  if not isinstance(value, dict) or "default" not in value:
                      missing_defaults.append(key)
                      return match.group(0)
                  return str(value["default"])
              resolved_url = re.sub(r"\{([^{}]+)\}", replace_variable, raw_url)
              # OpenAPI permits server URLs relative to the location of the OpenAPI document.
              # Resolve them against the spec URL before applying absolute endpoint policy.
              if not missing_defaults:
                  resolved_url = urljoin(spec_url, resolved_url)
              if missing_defaults:
                  add("SERVER_VARIABLE_DEFAULT_MISSING", "BLOCK", "Server variables have no declared defaults: " + ", ".join(missing_defaults), f"{location}[{index}]", raw_url)
              declarations.append({
                  "location": f"{location}[{index}]",
                  "template": raw_url,
                  "resolvedUrl": resolved_url,
              })

      add_servers(document.get("servers"), "servers")
      paths = document.get("paths") or {}
      if not isinstance(paths, dict):
          add("PATHS_SHAPE_INVALID", "BLOCK", "OpenAPI paths must be an object.", "paths")
          paths = {}
      operation_count = 0
      for path_name, path_item in paths.items():
          if not isinstance(path_item, dict):
              continue
          add_servers(path_item.get("servers"), f"paths.{path_name}.servers")
          for method in ("get", "put", "post", "delete", "options", "head", "patch", "trace"):
              operation = path_item.get(method)
              if isinstance(operation, dict):
                  operation_count += 1
                  add_servers(operation.get("servers"), f"paths.{path_name}.{method}.servers")

      if require_explicit and not declarations:
          add("SERVER_URLS_MISSING", "BLOCK", "No explicit server URLs were declared in the document, paths or operations.")

      checked_hosts = []
      invalid_server_urls = []
      local_or_private_hosts = []
      disallowed_hosts = []
      for declaration in declarations:
          location = declaration["location"]
          url = declaration["resolvedUrl"]
          parsed = urlsplit(url)
          scheme = parsed.scheme.lower()
          host = (parsed.hostname or "").lower().rstrip(".")
          checked_hosts.append(host)
          if not parsed.netloc or not host:
              invalid_server_urls.append({"location": location, "url": url})
              add("SERVER_URL_NOT_ABSOLUTE", "BLOCK", "Server URL did not resolve to an absolute URL with a hostname.", location, url)
              continue
          if parsed.username or parsed.password:
              add("SERVER_URL_EMBEDS_CREDENTIALS", "BLOCK", "Server URL must not embed username or password.", location, url)
          if require_https and scheme != "https":
              add("SERVER_NOT_HTTPS", "BLOCK", f"Server URL scheme is {scheme!r}; HTTPS is required.", location, url)
          try:
              ip = ipaddress.ip_address(host)
              is_local = ip.is_private or ip.is_loopback or ip.is_link_local or ip.is_unspecified or ip.is_reserved
          except ValueError:
              is_local = host == "localhost" or host.endswith(".localhost") or host.endswith(".local") or host.endswith(".internal")
          if reject_local and is_local:
              local_or_private_hosts.append({"location": location, "host": host})
              add("SERVER_LOCAL_OR_PRIVATE_HOST", "BLOCK", f"Server host {host!r} is local, private or internal-only.", location, url)
          host_allowed = any(host == allowed or host.endswith("." + allowed) for allowed in allowed_hosts)
          if not host_allowed:
              disallowed_hosts.append({"location": location, "host": host})
              add("SERVER_HOST_NOT_ALLOWLISTED", "BLOCK", f"Server host {host!r} is not within the configured allowlist.", location, url)

      blocking = [finding for finding in findings if finding["severity"] == "BLOCK"]
      warnings = [finding for finding in findings if finding["severity"] == "WARN"]
      verdict = "FAIL" if blocking else ("PASS_WITH_WARNINGS" if warnings else "PASS")
      print(json.dumps({
          "diagnostic": "openapi-server-policy-evaluation",
          "allowedServerHosts": allowed_hosts,
          "serverUrls": declarations,
          "findings": findings,
      }, indent=2, ensure_ascii=False))
      report = {
          "schemaVersion": 1,
          "checkedAt": datetime.now(timezone.utc).isoformat(),
          "specUrl": spec_url,
          "openapiVersion": version,
          "pathCount": len(paths),
          "operationCount": operation_count,
          "allowedServerHosts": allowed_hosts,
          "serverUrlCount": len(declarations),
          "serverUrls": declarations,
          "checkedHosts": sorted(set(checked_hosts)),
          "invalidServerUrls": invalid_server_urls,
          "localOrPrivateHosts": local_or_private_hosts,
          "disallowedHosts": disallowed_hosts,
          "findings": findings,
          "blockingFindingCount": len(blocking),
          "warningCount": len(warnings),
          "verdict": verdict,
          "scopeNote": "This checks server URL declarations in the spec. It does not probe each endpoint, validate DNS resolution, or verify certificate chains.",
      }
      with open("openapi-server-audit.json", "w", encoding="utf-8") as target:
          json.dump(report, target, indent=2, ensure_ascii=False)
      print(f"OpenAPI server transport audit: version={version} verdict={verdict}; servers={len(declarations)}, operations={operation_count}, blocking={len(blocking)}")
      Kestra.outputs({
          "spec_url": spec_url,
          "openapi_version": version,
          "path_count": len(paths),
          "operation_count": operation_count,
          "server_url_count": len(declarations),
          "checked_hosts": sorted(set(checked_hosts)),
          "blocking_finding_count": len(blocking),
          "warning_count": len(warnings),
          "findings": findings,
          "verdict": verdict,
      })

  - id: optionally_archive_report
    type: io.kestra.plugin.core.flow.If
    description: Optionally save the OpenAPI endpoint policy report to S3 for release evidence.
    condition: "{{ inputs.archive_report }}"
    then:
      - id: upload_openapi_report
        type: io.kestra.plugin.aws.s3.Upload
        description: Archive the endpoint policy report, not the OpenAPI server payload.
        accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
        region: "{{ inputs.aws_region }}"
        bucket: "{{ inputs.evidence_bucket }}"
        from: "{{ outputs.audit_server_urls.outputFiles['openapi-server-audit.json'] }}"
        key: "{{ inputs.evidence_prefix }}/{{ inputs.allowed_server_hosts | replace(',', '_') }}/openapi-server-audit.json"

  - id: enforce_server_policy
    type: io.kestra.plugin.core.flow.If
    description: Fail closed when an effective OpenAPI server URL violates endpoint transport or host policy; Slack is opt-in.
    condition: "{{ outputs.audit_server_urls.vars.verdict == 'FAIL' }}"
    then:
      - id: optionally_alert_blocked_servers
        type: io.kestra.plugin.core.flow.If
        description: Send a Slack alert only when notification is explicitly enabled.
        condition: "{{ inputs.notify_slack }}"
        then:
          - id: alert_blocked_servers
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Notify API owners when server endpoints are insecure, local or outside the allowlist.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |-
              {{
                {
                  "text": ":rotating_light: OpenAPI server transport gate BLOCKED\\nSpec: " ~ outputs.audit_server_urls.vars.spec_url ~
                    "\\nFindings: " ~ (outputs.audit_server_urls.vars.findings | toJson) ~
                    "\\nExecution: " ~ execution.id ~
                    "\\nReview openapi-server-audit.json for details."
                } | toJson
              }}
      - id: fail_server_policy
        type: io.kestra.plugin.core.execution.Fail
        description: Block downstream API publication or consumer onboarding when server policy fails.
        errorMessage: "OpenAPI server transport policy failed for {{ outputs.audit_server_urls.vars.spec_url }}."
    else:
      - id: log_server_verdict
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "OpenAPI server transport audit {{ outputs.audit_server_urls.vars.verdict }} for {{ outputs.audit_server_urls.vars.spec_url }}; servers={{ outputs.audit_server_urls.vars.server_url_count }}, blocking={{ outputs.audit_server_urls.vars.blocking_finding_count }}."

errors:
  - id: optionally_alert_openapi_audit_failure
    type: io.kestra.plugin.core.flow.If
    description: Send an error notification only when Slack is enabled and its secret has been configured.
    condition: "{{ inputs.notify_slack }}"
    then:
      - id: alert_openapi_audit_failure
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alert when the OpenAPI document cannot be fetched or parsed so an execution failure is not mistaken for passing policy.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |-
          {{
            {
              "text": ":warning: OpenAPI server transport audit execution failed\\nSpec: " ~ inputs.spec_url ~
                "\\nExecution: " ~ execution.id ~
                "\\nInspect Kestra logs; fetch and parsing failures must not be interpreted as PASS."
            } | toJson
          }}

outputs:
  - id: openapi_server_audit
    type: JSON
    description: Machine-readable summary of OpenAPI version, effective server URLs, host policy findings and verdict.
    value: "{{ outputs.audit_server_urls.vars | toJson }}"

extend:
  title: OpenAPI Server Transport Security Gate
  metaTitle: OpenAPI Server Transport Security Gate | Kestra
  shortDescription: Validate OpenAPI server declarations for HTTPS-only transport, public hosts and hostname allowlist compliance before publishing or onboarding API consumers.
  metaDescription: Gate OpenAPI specs on explicit HTTPS server URLs, non-private endpoints, server variable defaults and an approved hostname allowlist.
  description: |
    Audit the server URLs declared by a public OpenAPI 3.x document before publishing it or onboarding consumers. The flow resolves template variables from declared defaults, checks absolute HTTPS URLs, rejects local or private endpoints, and applies a configurable hostname allowlist. It writes a JSON evidence report, supports optional S3 archival, and fails closed on transport or host-policy violations.

    ## How it works

    1. Validate the OpenAPI document URL and host allowlist.
    2. Fetch the real JSON or YAML spec from the configured public URL.
    3. Parse OpenAPI 3.0 or 3.1, gather document-level, path-level and operation-level server declarations, and resolve server variables where defaults are supplied.
    4. Check endpoint schemes, credentials embedded in URLs, local/private hostnames and allowlist compliance.
    5. Optionally archive the report to S3 and fail the flow when blocking findings remain.

    ## What you get

    - A machine-readable list of effective server URLs and checked hostnames.
    - Detection of HTTP endpoints, unresolved URL templates, local/private endpoints and off-allowlist hosts.
    - Explicit evidence that server declarations were read from the real spec rather than hard-coded.
    - Optional S3 report retention and a blocking path before publication.

    ## Who it's for

    - API platform teams reviewing OpenAPI specs before publication.
    - Security engineers ensuring consumers are not directed to insecure or internal endpoints.
    - Developer experience teams enforcing approved service domains across APIs.

    ## Why orchestrate this with Kestra

    Kestra records the spec URL, version, endpoint inventory and policy verdict in one execution. Scheduled rechecks can detect server changes in a published document and provide a consistent failed state that downstream release workflows can require.

    ## Prerequisites

    - A Kestra 2.x worker with Docker enabled for the Python Script task runner.
    - Network access to the public OpenAPI spec URL.
    - A Slack incoming webhook for alerts; S3 evidence archival is optional.

    ### Secrets

    - SLACK_WEBHOOK_URL: Slack incoming webhook for a blocked policy result or execution failure.
    - AWS_ACCESS_KEY_ID: optional AWS access key used only when report archival is enabled.
    - AWS_SECRET_ACCESS_KEY: optional AWS secret key used only when report archival is enabled.

    ## Quick start

    1. Import the flow with the default Petstore OpenAPI document URL.
    2. Execute once and inspect the openapi-server-audit.json artifact and openapi_server_audit output.
    3. Adjust allowed_server_hosts for the API's expected public domains.
    4. Keep require_https and reject_local_or_private_hosts enabled for public production APIs.
    5. Configure Slack and optional S3, then enable weekly_openapi_endpoint_audit after reviewing the initial result.

    ## How to extend

    - Add DNS resolution and TLS certificate checks against each declared host.
    - Compare the server allowlist to a service catalogue or deployment environment policy.
    - Add path-specific host policies for separate public and internal API environments.
    - Require successful endpoint probes before generating a release or developer-portal entry.

    ## Links

    - [OpenAPI 3.1 specification](https://spec.openapis.org/oas/v3.1.0)
    - [OpenAPI server objects](https://spec.openapis.org/oas/v3.1.0#server-object)
    - [Kestra HTTP Request plugin](https://kestra.io/plugins/plugin-core/http/io.kestra.plugin.core.http.request)
    - [Kestra Python Script plugin](https://kestra.io/plugins/plugin-scripts/python)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack/slackincomingwebhook)
    - [Kestra AWS S3 plugin](https://kestra.io/plugins/plugin-aws/s3)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Monitoring & Alerting
  ee: false
  demo: false
