id: aws-elasticache-cpu-credit-depletion-sentinel
namespace: company.cloud

inputs:
  - id: aws_region
    type: STRING
    defaults: "us-east-1"
    description: Target AWS region.
  - id: cache_cluster_id
    type: STRING
    description: Amazon ElastiCache cluster identifier (e.g., redis-prod-001).
  - id: min_credit_balance
    type: FLOAT
    defaults: 20.0
    description: Minimum acceptable CPU credit balance before triggering depletion warning.

tasks:
  - id: query_elasticache_credits
    type: io.kestra.plugin.aws.cli.AwsCLI
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        START_TIME=$(date -u -v-30M +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d "30 minutes ago" +%Y-%m-%dT%H:%M:%SZ)
        END_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        
        aws cloudwatch get-metric-data           --metric-data-queries '[{"Id":"cred","MetricStat":{"Metric":{"Namespace":"AWS/ElastiCache","MetricName":"CPUCreditBalance","Dimensions":[{"Name":"CacheClusterId","Value":"{{ inputs.cache_cluster_id }}"}]},"Period":300,"Stat":"Minimum"}}]'           --start-time "$START_TIME"           --end-time "$END_TIME"           --output json > /tmp/elasticache_credits.json
        
        CREDIT_BALANCE=$(jq '.MetricDataResults[0].Values[0] // 1000' /tmp/elasticache_credits.json)
        
        echo "::set-output name=credit_balance::$CREDIT_BALANCE::"

  - id: evaluate_credit_depletion
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_elasticache_credits.vars.credit_balance | float < inputs.min_credit_balance }}"
    then:
      - id: notify_cache_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#infrastructure-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 AWS ElastiCache CPU Credit Balance Depletion Alert",
                "text": "ElastiCache cluster `{{ inputs.cache_cluster_id }}` CPU credit balance has dropped to *{{ outputs.query_elasticache_credits.vars.credit_balance }}* (warning threshold: {{ inputs.min_credit_balance }}). Impact: Burstable cache node (t2/t3/t4g) will be severely CPU throttled to baseline performance, spiking Redis/Memcached command latencies and breaking web session caching.",
                "footer": "Kestra Cloud Sentinel • AWS ElastiCache"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#infrastructure-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ ElastiCache Credit Sentinel Execution Failed",
            "text": "The ElastiCache CPU credit CloudWatch query failed. Please verify AWS credentials and cluster ID.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      cache_cluster_id: replace-with-your-cache-cluster-id

extend:
  metaDescription: "Audits Amazon ElastiCache CloudWatch metrics to detect burstable CPU credit starvation and Redis latency spikes."
  metaTitle: AWS ElastiCache Burstable Node CPU Credit Balance Depletion Sentinel with Kestra
  title: AWS ElastiCache Burstable Node CPU Credit Balance Depletion Sentinel
  shortDescription: Audits Amazon ElastiCache CloudWatch metrics to detect burstable CPU credit starvation and Redis latency spikes.
  description: |
    ## How it works
    This workflow connects to Amazon CloudWatch via the AWS CLI plugin to sample the `CPUCreditBalance` metric for burstable (t2, t3, t4g) ElastiCache Redis and Memcached clusters. When high traffic or command spikes exhaust CPU credits, AWS hard-throttles the cache instance to its baseline CPU performance, causing severe Redis queue backups and application timeouts. When credits drop below safety margins, an automated Slack alert is triggered.

    ## What you get
    - Proactive warning before cache instances hit CPU throttling walls.
    - Prevents cascading web application failures caused by slow Redis session responses.
    - Clear guidance to scale to larger instance types (e.g., m6g/r6g) or enable unlimited mode.

    ## Who it's for
    - Database Administrators (DBAs) and SREs operating AWS ElastiCache Redis clusters.
    - Performance Engineers monitoring caching infrastructure during sales events and peak hours.

    ## Why orchestrate this with Kestra
    - **Automated Metric Auditing**: Continuously poll CloudWatch without standing up dedicated agent daemons.
    - **Flexible Thresholds**: Tune credit buffer thresholds per environment (staging vs production).
    - **Automated Upscaling**: Can be extended to automatically trigger cluster instance type upgrades.

    ## Prerequisites
    - AWS IAM credentials with `cloudwatch:GetMetricData` permissions.
    - Secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Enter your ElastiCache cluster ID and configure secrets.
    3. Run the workflow to inspect current CPU credit reserves.

    ## How to extend
    - Query `EngineCPUUtilization` and `SwapUsage` alongside CPU credits.
    - Integrate with AWS Auto Scaling API to scale out read replica nodes automatically.

    ## Links
    - [Amazon ElastiCache Metrics in CloudWatch](https://docs.aws.amazon.com/AmazonElastiCache/latest/red-ug/CacheMetrics.WhichShouldIMonitor.html)
    - [Kestra AWS Plugin](https://kestra.io/plugins/plugin-aws)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - AWS Services
    - Infrastructure Automation
  ee: false
  demo: false
