id: keda-cloudevent-source-metric-stream-latency-sentinel
namespace: company.sre

description: |
  Audits KEDA CloudEvents source metric streaming telemetry to detect event ingestion latency spikes, scaler evaluation errors, and stream buffer lag.

concurrency:
  limit: 1

inputs:
  - id: keda_metrics_url
    type: STRING
    displayName: "KEDA Metrics URL"
    defaults: "http://keda-operator-metrics.keda.svc.cluster.local:8080"
    description: "Internal HTTP endpoint exposing Prometheus metrics for the KEDA event-driven autoscaling operator service."

  - id: scaled_object_name
    type: STRING
    displayName: "ScaledObject Name"
    defaults: "payment-event-consumer-scaler"
    description: "Identifier of the target KEDA ScaledObject or CloudEvents stream source under active performance surveillance."

  - id: max_stream_latency_ms
    type: INT
    displayName: "Max Stream Latency (ms)"
    defaults: 800
    description: "Maximum allowable CloudEvents metric ingestion and processing latency in milliseconds before alerting."

  - id: max_scaler_errors_threshold
    type: INT
    displayName: "Max Scaler Errors Threshold"
    defaults: 2
    description: "Maximum allowable trigger scaler evaluation or external CloudEvents endpoint query errors."

  - id: alert_on_zero_emission
    type: BOOL
    displayName: "Alert on Zero Emission"
    defaults: false
    description: "Toggle whether zero emitted CloudEvents across active triggers flags unexpected upstream event producer drops."

tasks:
  - id: scan_keda_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes KEDA Prometheus metrics to audit CloudEvents metric stream latency, scaler evaluation errors, and emitted event counts.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.keda_metrics_url }}"
      SCALER_NAME: "{{ inputs.scaled_object_name }}"
      MAX_LATENCY_MS: "{{ inputs.max_stream_latency_ms }}"
      MAX_ERRORS: "{{ inputs.max_scaler_errors_threshold }}"
      ALERT_ZERO: "{{ inputs.alert_on_zero_emission }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METRICS_URL", "").rstrip("/")
      scaler_name = os.environ.get("SCALER_NAME", "payment-event-consumer-scaler")
      max_latency_ms = int(os.environ.get("MAX_LATENCY_MS", "800"))
      max_errors = int(os.environ.get("MAX_ERRORS", "2"))
      alert_zero = os.environ.get("ALERT_ZERO", "false").lower() == "true"

      stream_latency_ms = 0
      scaler_errors_total = 0
      events_emitted_total = 0
      metric_value = 0
      degraded_scalers = []

      metrics_endpoint = f"{base_url}/metrics"
      print(f"Scraping KEDA metrics from {metrics_endpoint}...")
      try:
          resp = requests.get(metrics_endpoint, timeout=12)
          resp.raise_for_status()
      except Exception as err:
          print(f"ERROR: Failed to scrape KEDA metrics from {metrics_endpoint}: {err}", file=sys.stderr)
          sys.exit(1)

      for line in resp.text.splitlines():
          line = line.strip()
          if not line or line.startswith("#"):
              continue
          match = re.search(r'([0-9.]+)\s*$', line)
          if not match:
              continue
          val = float(match.group(1))
          if "keda_cloudevents_source_metric_latency_seconds" in line:
              stream_latency_ms = max(stream_latency_ms, int(val * 1000))
              if stream_latency_ms > max_latency_ms:
                  degraded_scalers.append(scaler_name)
          elif "keda_scaler_errors_total" in line:
              scaler_errors_total += int(val)
          elif "keda_cloudevents_source_events_emitted_total" in line:
              events_emitted_total += int(val)
          elif "keda_scaler_metric_value" in line and scaler_name in line:
              metric_value = max(metric_value, int(val))

      is_breached = bool(
          (stream_latency_ms > max_latency_ms) or
          (scaler_errors_total > max_errors) or
          (alert_zero and events_emitted_total == 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"KEDA scaler '{scaler_name}' audit: {stream_latency_ms}ms stream latency, "
          f"{scaler_errors_total} scaler errors, {events_emitted_total} events emitted, "
          f"current_metric_value={metric_value}."
      )
      print(f"KEDA Complete: {summary}")

      Kestra.outputs({
          "stream_latency_ms": stream_latency_ms,
          "scaler_errors_total": scaler_errors_total,
          "events_emitted_total": events_emitted_total,
          "current_metric_value": metric_value,
          "degraded_scalers": list(set(degraded_scalers)),
          "is_alerting": is_breached,
          "scaler_name": scaler_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_keda_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed KEDA CloudEvents stream latency or scaler evaluation errors breach operational bounds.
    condition: "{{ outputs.scan_keda_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_event_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Event Platform Slack channel detailing KEDA CloudEvents latency or scaler errors.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#event-platform-alerts",
            "text": "CRITICAL: KEDA CloudEvents Metric Stream Degradation for Scaler `{{ inputs.scaled_object_name }}`. Stream Latency: `{{ outputs.scan_keda_telemetry.vars.stream_latency_ms }}`ms (max allowable: `{{ inputs.max_stream_latency_ms }}`ms). Scaler Errors: `{{ outputs.scan_keda_telemetry.vars.scaler_errors_total }}` (threshold: `{{ inputs.max_scaler_errors_threshold }}`). Emitted Events: `{{ outputs.scan_keda_telemetry.vars.events_emitted_total }}`. Audit Timestamp: `{{ outputs.scan_keda_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_keda_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when KEDA streams CloudEvents metrics smoothly and evaluates workload scaling targets cleanly.
        message: "KEDA operating nominally: {{ outputs.scan_keda_telemetry.vars.stream_latency_ms }}ms latency, {{ outputs.scan_keda_telemetry.vars.events_emitted_total }} events emitted, zero scaler errors."

triggers:
  - id: periodic_keda_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

outputs:
  - id: stream_latency_ms
    type: INT
    description: Measured CloudEvents stream latency in milliseconds.
    value: "{{ outputs.scan_keda_telemetry.vars.stream_latency_ms }}"
  - id: scaler_errors_total
    type: INT
    description: Total KEDA scaler errors detected.
    value: "{{ outputs.scan_keda_telemetry.vars.scaler_errors_total }}"
  - id: events_emitted_total
    type: INT
    description: Total CloudEvents emitted.
    value: "{{ outputs.scan_keda_telemetry.vars.events_emitted_total }}"
  - id: is_alerting
    type: BOOLEAN
    description: True if stream latency or errors exceeded threshold, false otherwise.
    value: "{{ outputs.scan_keda_telemetry.vars.is_alerting }}"

extend:
  title: "KEDA CloudEvent Source Metric Stream Latency Sentinel"
  metaTitle: "KEDA CloudEvent Stream Sentinel Blueprint"
  shortDescription: "Audits KEDA CloudEvents source metric stream telemetry for ingestion latency spikes and scaler evaluation errors."
  metaDescription: "Audits KEDA metrics to detect CloudEvents source metric streaming latency spikes, scaler evaluation errors, and buffer lag."
  description: |
    Automates continuous health and stream latency surveillance for KEDA event-driven autoscalers and CloudEvents metric sources.

    ## How it works
    1. A schedule trigger executes the KEDA CloudEvents metric health audit workflow every 15 minutes.
    2. The Python task queries the KEDA operator Prometheus metrics endpoint on port 8080.
    3. The script extracts CloudEvents metric stream latency, scaler evaluation error counters, and emitted event volumes.
    4. An evaluation gate determines whether metric streaming latency spikes or trigger scaler query errors exceed limits.
    5. When event-driven autoscaling degradation is detected, a high-priority Slack alert is dispatched to Event Platform teams.
    6. When CloudEvents streams ingest smoothly and scaler loops compute accurate replica counts, nominal telemetry is logged.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape KEDA Metrics]
        ScanMetrics --> EvalBreach{Latency > 800ms OR Scaler Errors > 2?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Event Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal KEDA State]
    ```

    ## Prerequisites
    - KEDA operator Prometheus metrics endpoint accessible from the Kestra worker container.
    - Slack incoming webhook secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Add `SLACK_WEBHOOK_URL` secret.
    3. Configure `keda_metrics_url` and `scaled_object_name`.
    4. Enable the schedule trigger for continuous metric surveillance.

    ## Links
    - [KEDA Prometheus Metrics Documentation](https://keda.sh/docs/latest/operate/metrics/)
    - [Kestra Python Plugin](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Kubernetes Operations
  ee: false
  demo: false
