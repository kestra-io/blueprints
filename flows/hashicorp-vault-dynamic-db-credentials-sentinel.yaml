id: hashicorp-vault-dynamic-db-credentials-sentinel
namespace: company.team
description: Audits HashiCorp Vault dynamic database credential leases to detect impending expirations before application connection drops occur.

inputs:
  - id: vault_addr
    type: STRING
    defaults: "http://vault.internal:8200"
    description: Base URL of the HashiCorp Vault server.

  - id: lease_prefix
    type: STRING
    defaults: "database/creds/readonly-analytics"
    description: Secret lease prefix to inspect for expiring dynamic credentials.

  - id: warning_threshold_minutes
    type: INT
    defaults: 30
    description: Minimum remaining lease validity in minutes before alerting.

tasks:
  - id: query_dynamic_db_leases
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    description: Query Vault API for dynamic database credential leases nearing expiration
    env:
      VAULT_ADDR: "{{ inputs.vault_addr }}"
      VAULT_TOKEN: "{{ secret('VAULT_TOKEN') }}"
      LEASE_PREFIX: "{{ inputs.lease_prefix }}"
      WARNING_THRESHOLD_MINUTES: "{{ inputs.warning_threshold_minutes }}"
    script: |
      import os
      import sys
      import requests
      from kestra import Kestra

      vault_addr = os.environ.get("VAULT_ADDR", "http://vault.internal:8200").rstrip("/")
      token = os.environ.get("VAULT_TOKEN")
      prefix = os.environ.get("LEASE_PREFIX", "database/creds/readonly-analytics").strip("/")
      threshold_min = int(os.environ.get("WARNING_THRESHOLD_MINUTES", "30"))

      if not token:
          print("CRITICAL: VAULT_TOKEN secret must be configured", file=sys.stderr)
          sys.exit(1)

      headers = {
          "X-Vault-Token": token,
          "User-Agent": "Kestra-Vault-Sentinel"
      }

      url = f"{vault_addr}/v1/sys/leases/lookup/{prefix}"
      try:
          resp = requests.request("LIST", url, headers=headers, timeout=30)
          if resp.status_code == 404:
              print(f"No active leases found under prefix: {prefix}")
              keys = []
          else:
              resp.raise_for_status()
              keys = resp.json().get("data", {}).get("keys", [])
      except Exception as e:
          print(f"CRITICAL: Failed to list leases under {prefix} at {url}: {e}", file=sys.stderr)
          sys.exit(1)

      expiring = []
      lookup_url = f"{vault_addr}/v1/sys/leases/lookup"

      for l_id in keys[:25]:
          full_id = f"{prefix}/{l_id}"
          try:
              l_resp = requests.put(lookup_url, headers=headers, json={"lease_id": full_id}, timeout=15)
              if l_resp.status_code == 200:
                  l_info = l_resp.json().get("data", {})
                  ttl = l_info.get("ttl", 0)
                  if 0 < ttl <= (threshold_min * 60):
                      expiring.append({
                          "lease_id": full_id,
                          "ttl_minutes": round(ttl / 60.0, 1)
                      })
          except Exception as err:
              print(f"Warning: Failed to lookup lease {full_id}: {err}", file=sys.stderr)

      alert_triggered = len(expiring) > 0
      print(f"Audit completed: {len(keys)} total leases found, {len(expiring)} expiring within {threshold_min}m")

      Kestra.outputs({
          "prefix": prefix,
          "total_leases_inspected": len(keys),
          "expiring_count": len(expiring),
          "expiring_leases": expiring,
          "alert_triggered": alert_triggered
      })

  - id: evaluate_expiring_leases
    type: io.kestra.plugin.core.flow.If
    description: Alert security team if expiring leases exceed zero
    condition: "{{ outputs.query_dynamic_db_leases.vars.alert_triggered == true }}"
    then:
      - id: alert_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🚨 *Vault Dynamic Credential Expiration Alert*: Found {{ outputs.query_dynamic_db_leases.vars.expiring_count }} dynamic database leases under `{{ inputs.lease_prefix }}` expiring in less than {{ inputs.warning_threshold_minutes }} minutes on `{{ inputs.vault_addr }}`. Ensure consumer services renew leases to prevent database connection dropouts."
          }

outputs:
  - id: total_leases_inspected
    type: INT
    value: "{{ outputs.query_dynamic_db_leases.vars.total_leases_inspected }}"
  - id: expiring_count
    type: INT
    value: "{{ outputs.query_dynamic_db_leases.vars.expiring_count }}"
  - id: alert_triggered
    type: BOOLEAN
    value: "{{ outputs.query_dynamic_db_leases.vars.alert_triggered }}"

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *Vault Sentinel Failure*: Failed to lookup dynamic database leases on {{ inputs.vault_addr }} during execution `{{ execution.id }}`."
      }

triggers:
  - id: scheduled_lease_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: Audits HashiCorp Vault dynamic database credential leases to detect impending expirations before application connection drops occur.
  metaTitle: HashiCorp Vault Dynamic Database Credentials Lease Expiration Sentinel with Kestra
  title: HashiCorp Vault Dynamic Database Credentials Lease Expiration Sentinel
  shortDescription: Audits HashiCorp Vault dynamic database credential leases to detect impending expirations before application connection drops occur.
  description: |
    ## How it works
    This sentinel queries the HashiCorp Vault `/v1/sys/leases/lookup` administrative endpoint for active dynamic database credential leases. It evaluates remaining time-to-live (`ttl`) and alerts operations teams when consumer services fail to renew leases, preventing sudden authentication failures against backend databases.

    ## What you get
    - Continuous validation of dynamic secret renewal lifecycles.
    - Early warning before expired dynamic credentials break long-running worker connections.
    - Automated Slack delivery tracking lease IDs and remaining TTL in minutes.

    ## Who it's for
    - Security operations (SecOps) teams and platform engineers administering HashiCorp Vault.
    - Backend application developers consuming dynamic database secrets.

    ## Prerequisites
    - HashiCorp Vault server access with database secrets engine mounted.
    - A Vault token with `sudo` or `read` permissions on `sys/leases/lookup`.
    - Secrets `VAULT_TOKEN` and `SLACK_WEBHOOK_URL` configured in Kestra.
  tags:
    - Infrastructure
    - Security
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
