id: accessibility-test
namespace: company.team

description: |
  Automatically audit a website for accessibility issues using Playwright,
  axe-core, and Google Gemini. The workflow detects accessibility violations,
  uses AI to explain and prioritize the findings, and generates an audit report.

labels:
  - key: category
    value: accessibility
  - key: technology
    value: playwright
  - key: technology
    value: axe-core
  - key: technology
    value: ai

inputs:
  - id: target_url
    type: STRING
    defaults: https://example.com
    description: Website URL to audit

triggers:
  - id: daily_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * *"


tasks:

  - id: scan_website
    type: io.kestra.plugin.scripts.node.Script
    containerImage: node:20

    beforeCommands:
      - npm install playwright axe-core
      - npx playwright install --with-deps chromium

    outputFiles:
      - accessibility.json

    script: |
      const { chromium } = require("playwright");
      const fs = require("fs");

      (async () => {
        const browser = await chromium.launch({
          headless: true
        });

        const page = await browser.newPage();

        await page.goto("{{ inputs.target_url }}", {
          waitUntil: "networkidle"
        });

        await page.addScriptTag({
          path: require.resolve("axe-core/axe.min.js")
        });

        const results = await page.evaluate(async () => {
          return await axe.run();
        });

        const report = {
         url: "{{ inputs.target_url }}",
          totalViolations: results.violations.length,
          violations: results.violations.map(v => ({
            id: v.id,
            impact: v.impact,
            description: v.description,
            help: v.help,
            helpUrl: v.helpUrl,
            affectedElements: v.nodes.map(node => ({
              html: node.html,
              target: node.target,
              failureSummary: node.failureSummary
            }))
          }))
        };

        fs.writeFileSync(
          "accessibility.json",
          JSON.stringify(report, null, 2)
        );

        console.log("=== ACCESSIBILITY SCAN COMPLETE ===");
        console.log("Violations found:", results.violations.length);
        console.log("Created accessibility.json");

        await browser.close();
      })();

  - id: ai_analysis
    type: io.kestra.plugin.ai.agent.AIAgent

    provider:
      type: io.kestra.plugin.ai.provider.GoogleGemini
      modelName: gemini-3.5-flash-lite
      apiKey: "{{ secret('GEMINI_API_KEY') }}"

    systemMessage: |
      You are an accessibility expert analyzing axe-core results.

      Only analyze the violations provided in the input.
      Do not invent additional violations.

      Classify each violation as:
      - CRITICAL: serious accessibility problem that significantly blocks access
      - WARNING: accessibility problem that should be fixed but is not necessarily blocking
      - PASS: no accessibility problem

      Determine the overall severity as:
      - CRITICAL if at least one violation is CRITICAL
      - WARNING if there are no CRITICAL violations but at least one WARNING
      - PASS if there are no violations

      Return ONLY valid JSON.
      Do not use Markdown.
      Do not wrap the JSON in ```json code fences.

      Use exactly this structure:

      {
        "overallSeverity": "CRITICAL | WARNING | PASS",
        "criticalCount": 0,
        "warningCount": 0,
        "pass": false,
        "summary": "Short overall summary",
        "violations": [
          {
            "id": "axe violation id",
            "severity": "CRITICAL | WARNING | PASS",
            "problem": "What is wrong",
            "whyItMatters": "Why this matters to users",
            "recommendedFix": "Practical fix"
          }
        ]
      }

    prompt: |
      Analyze this axe-core accessibility scan:

      {{ read(outputs.scan_website.outputFiles['accessibility.json']) }}

  - id: severity_switch
    type: io.kestra.plugin.core.flow.Switch

    value: "{{ fromJson(outputs.ai_analysis.textOutput).overallSeverity }}"

    cases:
      CRITICAL:
        - id: critical_report
          type: io.kestra.plugin.core.log.Log
          message: "CRITICAL accessibility issues detected."

      WARNING:
        - id: warning_report
          type: io.kestra.plugin.core.log.Log
          message: "WARNING accessibility issues detected."

      PASS:
        - id: pass_report
          type: io.kestra.plugin.core.log.Log
          message: "No accessibility issues detected."

    defaults:
      - id: unknown_severity
        type: io.kestra.plugin.core.log.Log
        message: "Could not determine accessibility severity."
        
  - id: create_report
    type: io.kestra.plugin.scripts.node.Script
    containerImage: node:20

    outputFiles:
      - accessibility-report.txt

    script: |
      const fs = require("fs");

      const report = `
      ACCESSIBILITY AUDIT REPORT
      ==========================

      Website:
      {{ inputs.target_url }}

      AI ANALYSIS:
      {{ outputs.ai_analysis.textOutput }}
      `;

      fs.writeFileSync(
        "accessibility-report.txt",
        report
      );

      console.log("=== ACCESSIBILITY REPORT CREATED ===");
      console.log(report);
      
extend:
  title: AI Website Accessibility Auditor
  shortDescription: Automatically scan websites for accessibility issues and use AI to explain, prioritize, and report actionable fixes.
  metaTitle: AI Website Accessibility Auditor

  description: |
    An automated website accessibility auditor that combines deterministic accessibility testing with AI-powered analysis. The blueprint uses Playwright to open the target website, axe-core to detect accessibility violations, and Google Gemini to explain, prioritize, and recommend fixes for the detected issues.

    ## How it works

    1. `scan_website` launches a headless Chromium browser with Playwright and opens the configured `target_url`.
    2. axe-core is injected into the page and performs an accessibility scan. The detected violations, affected elements, and remediation information are saved as `accessibility.json`.
    3. `ai_analysis` sends the axe-core results to Google Gemini. Gemini classifies each detected issue as `CRITICAL`, `WARNING`, or `PASS`, determines the overall severity, explains why the issue matters, and provides a recommended fix.
    4. `severity_switch` routes the workflow according to the overall severity returned by Gemini.
    5. `create_report` generates an `accessibility-report.txt` file containing the audited website and AI analysis.

    ## What you get

    - A repeatable automated accessibility scan for any website URL.
    - Deterministic accessibility findings from axe-core.
    - AI-generated explanations and practical recommendations for detected violations.
    - Severity-based routing for CRITICAL, WARNING, and PASS results.
    - A generated accessibility audit report that can be reviewed or shared.
    - A scheduled trigger that can be used to run accessibility audits automatically.

    ## Who it's for

    - Developers who want to identify accessibility issues before releasing a website.
    - QA and testing teams looking to automate accessibility checks.
    - Web teams that need a repeatable accessibility audit workflow.
    - Teams that want AI-assisted explanations of technical accessibility findings.

    ## Why orchestrate this with Kestra

    Without orchestration, accessibility scanning, AI analysis, severity handling, and report generation would need to be connected manually. Kestra brings these steps into one observable workflow with configurable inputs, task dependencies, branching, scheduled execution, and execution history. This makes the audit repeatable and provides a foundation for extending the workflow with notifications, issue tracking, dashboards, or additional quality checks.

    ## Prerequisites

    - A Kestra instance with Docker task execution enabled.
    - A website that can be accessed by the Playwright browser.
    - A Google Gemini API key.

    ### Secrets

    - `GEMINI_API_KEY`: Google Gemini API key used by the AI analysis task.

    Store the Gemini API key as a Kestra secret and reference it with `{{ secret('GEMINI_API_KEY') }}`. Do not place the API key directly in the flow configuration.

    ## Quick start

    1. Add the `GEMINI_API_KEY` secret to your Kestra instance.
    2. Import or create this flow in Kestra.
    3. Execute the flow and provide the `target_url` input with the website you want to audit.
    4. Wait for the Playwright and axe-core scan to complete.
    5. Review the Gemini analysis and the generated `accessibility-report.txt` file.
    6. Enable the scheduled trigger if you want the audit to run automatically.

    ## How to extend

    - Add Slack or email notifications to alert a team when CRITICAL accessibility issues are detected.
    - Store audit results in a database or analytics system to track accessibility improvements over time.
    - Add additional quality checks alongside axe-core, such as performance or SEO checks.
    - Extend the severity branches to automatically create issues in a project-management or issue-tracking system.
    - Add historical comparison so new accessibility violations can be distinguished from previously known issues.
    - Add additional report formats such as JSON, HTML, or PDF.

    ## Links

    - [Kestra Node.js Script plugin](https://kestra.io/plugins/plugin-script-node)
    - [Kestra AI Agent plugin](https://kestra.io/plugins/plugin-ai/agent)
    - [axe-core](https://github.com/dequelabs/axe-core)
    - [Playwright](https://playwright.dev/)
    - [Google Gemini](https://ai.google.dev/)
    

  metaDescription: Audit website accessibility with Playwright, axe-core, and Gemini AI, then generate a prioritized accessibility report.

  subTags:
    - Policy & Compliance
    - Testing & Quality
    - Reporting & Digests

  tags:
    - AI

  ee: false
  demo: false
