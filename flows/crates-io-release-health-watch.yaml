id: crates-io-release-health-watch
namespace: company.team
description: |
  Checks the Rust crates a project uses. It reads the project's Cargo.lock, looks up each crate on
  crates.io and sends a Slack message if a crate is yanked, outdated or has had no release for a long time.
  It only sends a message when the report is different from the last run.

inputs:
  - id: cargo_lock_url
    type: STRING
    description: Raw URL of the Cargo.lock file. It works for public repositories. For a private one you would need to add authentication.
    defaults: https://raw.githubusercontent.com/sharkdp/fd/master/Cargo.lock
  - id: max_crates
    type: INT
    description: Check at most this many crates in one run. crates.io allows only one request per second, so a big list takes a while.
    defaults: 25
  - id: outdated_threshold
    type: SELECT
    description: How far behind a crate must be to count as OUTDATED. With major, only a new major version counts (for 0.x crates a new minor version counts as major).
    values:
      - major
      - minor
      - patch
    defaults: major
  - id: stale_after_days
    type: INT
    description: A crate is STALE if its latest stable release is older than this many days.
    defaults: 365
  - id: user_agent
    type: STRING
    description: crates.io asks for a User-Agent that says who you are. Put your project name and a contact URL or email here.
    defaults: kestra-crates-release-health-watch (replace-with-your-contact)

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run every Monday at 08:00 UTC. It is disabled until you set the Slack secret.
    cron: "0 8 * * 1"
    disabled: true

tasks:
  - id: fetch_cargo_lock
    type: io.kestra.plugin.core.http.Request
    description: Download the Cargo.lock file.
    uri: "{{ inputs.cargo_lock_url }}"
    method: GET

  - id: list_crates
    type: io.kestra.plugin.transform.jsonata.TransformValue
    description: Get the crates from the lock file (only the ones from crates.io, not git or private ones) and keep the first max_crates.
    from: "{{ outputs.fetch_cargo_lock.body | toJson }}"
    expression: |
      (
        $found := $match($, /name = "([^"]+)"\r?\nversion = "([^"]+)"\r?\nsource = "registry\+https:\/\/github\.com\/rust-lang\/crates\.io-index"/);
        $pairs := [$found.(groups[0] & "@" & groups[1])];
        $pairs[[0..{{ inputs.max_crates }} - 1]]
      )

  - id: check_crates
    type: io.kestra.plugin.core.flow.Loop
    description: Check one crate at a time, because crates.io allows only one request per second.
    values: "{{ outputs.list_crates.value | toJson }}"
    concurrencyLimit: 1
    outputs:
      - id: verdict
        type: JSON
        value: "{{ outputs.assess.value }}"
    tasks:
      - id: fetch_crate
        type: io.kestra.plugin.core.http.Request
        description: Get the crate info and the list of all its versions from crates.io.
        uri: "https://crates.io/api/v1/crates/{{ item.value | split('@') | first }}"
        method: GET
        headers:
          User-Agent: "{{ inputs.user_agent }}"
        retry:
          type: constant
          interval: PT5S
          maxAttempts: 3

      - id: assess
        type: io.kestra.plugin.transform.jsonata.TransformValue
        description: Decide the status of this crate from the crates.io answer.
        from: "{{ outputs.fetch_crate.body }}"
        expression: |
          (
            $pinned := "{{ item.value | split('@') | last }}";
            $current := versions[num = $pinned];
            $maxv := crate.max_stable_version;
            $latest := versions[num = $maxv];
            $age := ($toMillis($now()) - $toMillis($latest[0].created_at)) / 86400000;
            $yanked := $count($current) > 0 and $current[0].yanked = true;
            $p := $split($pinned, ".");
            $l := $split($maxv, ".");
            $behind := (
              ($number($l[0]) > $number($p[0]) or ($p[0] = "0" and $l[0] = "0" and $number($l[1]) > $number($p[1]))) ? 3
              : ($number($l[0]) = $number($p[0]) and $number($l[1]) > $number($p[1])) ? 2
              : ($pinned != $maxv) ? 1
              : 0
            );
            $needed := {"major": 3, "minor": 2, "patch": 1}."{{ inputs.outdated_threshold }}";
            $status := $yanked ? "YANKED"
              : $count($current) = 0 ? "UNKNOWN_VERSION"
              : $age > {{ inputs.stale_after_days }} ? "STALE"
              : $behind >= $needed ? "OUTDATED"
              : "OK";
            {
              "crate": crate.name,
              "pinned": $pinned,
              "latest": crate.max_stable_version,
              "days_since_release": $round($age),
              "status": $status
            }
          )

      - id: pause_for_rate_limit
        type: io.kestra.plugin.core.flow.Sleep
        description: Wait one second before the next crate.
        duration: PT1S

  - id: summarize
    type: io.kestra.plugin.transform.jsonata.TransformValue
    description: Put all the results together and write the message for the crates that need attention.
    from: "{{ outputs.check_crates.outputs | toJson }}"
    expression: |
      (
        $all := outputs.verdict;
        $bad := $all[status != "OK"];
        {
          "checked": $count($all),
          "problem_count": $count($bad),
          "message": $count($bad) = 0
            ? "All " & $count($all) & " crates look healthy."
            : "Rust dependency health: " & $count($bad) & " of " & $count($all) & " crates need attention." & "\n" &
              $join($bad.(
                "• " & crate & " " & pinned & ": " & status &
                (status = "YANKED" ? " (this version was pulled from crates.io)" : "") &
                ". Latest stable is " & latest & ", released " & days_since_release & " days ago."
              ), "\n")
        }
      )

  - id: previous_report
    type: io.kestra.plugin.core.kv.Get
    description: Get the report from the last run for this Cargo.lock, if there is one.
    key: "crates_report_{{ inputs.cargo_lock_url | sha256 }}"
    errorOnMissing: false

  - id: alert_if_new
    type: io.kestra.plugin.core.flow.If
    description: Send to Slack only if there is a problem and the report is different from last time, so the same message is not sent every week.
    condition: "{{ outputs.summarize.value.problem_count > 0 and (outputs.previous_report.value | default('')) != outputs.summarize.value.message }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Send the list of crates that need attention.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": {{ outputs.summarize.value.message | toJson }}
          }

  - id: remember_report
    type: io.kestra.plugin.core.kv.Set
    description: Save this report so the next run can see if anything changed.
    key: "crates_report_{{ inputs.cargo_lock_url | sha256 }}"
    value: "{{ outputs.summarize.value.message }}"

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Send a message if the check itself fails, for example when the Cargo.lock URL is wrong or crates.io cannot be reached.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": {{ ("The Rust crate health check failed in execution " ~ execution.id ~ ". Check that cargo_lock_url points to a valid Cargo.lock and that crates.io is reachable.") | toJson }}
      }

extend:
  title: Check Rust Crates from a Cargo.lock for Yanked, Outdated and Stale Versions
  metaTitle: Rust Cargo.lock Dependency Health Check with crates.io and Kestra
  shortDescription: Reads a Cargo.lock, checks each crate on crates.io for yanked, outdated and stale versions, and sends a Slack message only when there is something new.
  metaDescription: Read a Cargo.lock, check each crate on crates.io for yanked, outdated or stale versions and get a Slack message only when something changes.
  description: |
    Sometimes a Rust dependency has a problem and nobody notices. The exact version you use can be yanked because it is broken or unsafe, or the crate can go a year without a new release. This flow reads your `Cargo.lock`, asks crates.io about each crate, and tells you about the ones that need attention, but only when the report is different from last time.

    ## How it works

    1. `weekly` (`io.kestra.plugin.core.trigger.Schedule`) runs the flow every Monday at 08:00 UTC. It is disabled by default.
    2. `fetch_cargo_lock` (`io.kestra.plugin.core.http.Request`) downloads the lock file from `cargo_lock_url`.
    3. `list_crates` (`io.kestra.plugin.transform.jsonata.TransformValue`) gets the crates from crates.io and keeps the first `max_crates`.
    4. `check_crates` (`io.kestra.plugin.core.flow.Loop`) checks one crate at a time. `fetch_crate` calls crates.io, `assess` gives it a status (`YANKED`, `UNKNOWN_VERSION`, `STALE`, `OUTDATED` or `OK`) and `pause_for_rate_limit` waits one second. A crate is only `OUTDATED` when there is a new major version. You can change this with `outdated_threshold`.
    5. `summarize` writes one message with the crates that are not `OK`.
    6. `previous_report` (`io.kestra.plugin.core.kv.Get`) gets the last report. `alert_if_new` (`io.kestra.plugin.core.flow.If`) sends the Slack message only if there is a problem and the report is different. `remember_report` saves it.
    7. The `errors` block sends a message if the check itself fails.

    ## What you get

    - A weekly check of whether any of your crates is yanked, outdated or not maintained.
    - No repeated messages: the same problems are sent only once.
    - A different message when the lock file or crates.io cannot be reached.

    ## Who it's for

    - Rust teams that keep a `Cargo.lock` in their repository.
    - Platform engineers who want a simple dependency check.

    ## Why orchestrate this with Kestra

    With a cron script you have to build the schedule, the rate limit, the saved state and the error handling yourself. Kestra gives you these and keeps the history of every run.

    ## Prerequisites

    - Access to `crates.io` and to your `Cargo.lock` over HTTPS.
    - A Slack incoming webhook.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: the Slack incoming webhook that receives the messages (required).

    ## Quick start

    1. Add the `SLACK_WEBHOOK_URL` secret to your namespace.
    2. Set `cargo_lock_url` to the raw URL of your `Cargo.lock` and `user_agent` to your project name and a contact URL or email.
    3. Click **Execute** once and look at the `summarize` output.
    4. Enable the `weekly` trigger.

    ## How to extend

    - Raise `max_crates` to check the whole lock file.
    - Send the message by email or Teams instead of Slack.

    ## Links

    - [crates.io data access policy](https://crates.io/data-access)
    - [Kestra JSONata TransformValue task](https://kestra.io/plugins/plugin-transform-json/jsonata/io.kestra.plugin.transform.jsonata.transformvalue)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  verified: false
  demo: false
