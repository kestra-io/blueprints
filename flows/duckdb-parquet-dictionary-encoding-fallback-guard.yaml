id: duckdb-parquet-dictionary-encoding-fallback-guard
namespace: company.lakehouse

description: |
  Reads the column chunk metadata of a Parquet file with DuckDB and checks that the categorical columns
  you name are dictionary encoded in every row group. A column that fell back to PLAIN encoding is
  reported, and the execution fails when more columns than you tolerate have degraded.

inputs:
  - id: parquet_uri
    type: URI
    displayName: Parquet File URI
    description: Kestra internal storage URI (kestra://...) or namespace file URI of the Parquet file to audit.
    required: true

  - id: categorical_columns
    type: ARRAY
    itemType: STRING
    displayName: Categorical Columns
    description: Top-level columns that are expected to be dictionary encoded in every row group, such as status codes, country codes or payment methods. Names must not contain single quotes.
    required: true

  - id: max_degraded_columns
    type: INT
    displayName: Maximum Degraded Columns
    description: Number of listed columns that may have fallen back to PLAIN encoding before the execution fails. 0 fails on the first degraded column.
    defaults: 0
    min: 0

tasks:
  - id: profile_dictionary_encoding
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: Aggregates parquet_metadata() per column across all row groups and returns the verdict.
    inputFiles:
      target.parquet: "{{ inputs.parquet_uri }}"
    fetchType: FETCH_ONE
    sql: |
      WITH target AS (
        SELECT DISTINCT unnest(['{{ inputs.categorical_columns | join("','") }}']) AS column_name
      ),
      chunks AS (
        SELECT
          path_in_schema AS column_name,
          COUNT(*) AS row_groups,
          COUNT(*) FILTER (WHERE encodings::VARCHAR LIKE '%DICTIONARY%') AS dictionary_row_groups
        FROM parquet_metadata('{{ workingDir }}/target.parquet')
        GROUP BY path_in_schema
      ),
      per_column AS (
        SELECT t.column_name, c.row_groups, c.dictionary_row_groups
        FROM target t
        LEFT JOIN chunks c USING (column_name)
      )
      SELECT
        COUNT(*) AS target_columns,
        COUNT(*) FILTER (WHERE row_groups IS NULL) AS missing_columns,
        COUNT(*) FILTER (WHERE row_groups IS NOT NULL AND dictionary_row_groups = row_groups) AS healthy_columns,
        COUNT(*) FILTER (WHERE row_groups IS NOT NULL AND dictionary_row_groups < row_groups) AS degraded_columns,
        COALESCE(string_agg(column_name, ', ') FILTER (WHERE row_groups IS NULL), 'NONE') AS missing_column_names,
        COALESCE(string_agg(column_name, ', ') FILTER (WHERE row_groups IS NOT NULL AND dictionary_row_groups < row_groups), 'NONE') AS degraded_column_names,
        CASE
          WHEN COUNT(*) FILTER (WHERE row_groups IS NULL) > 0 THEN 'COLUMNS_NOT_FOUND'
          WHEN COUNT(*) FILTER (WHERE row_groups IS NOT NULL AND dictionary_row_groups < row_groups) = 0 THEN 'HEALTHY'
          WHEN COUNT(*) FILTER (WHERE row_groups IS NOT NULL AND dictionary_row_groups < row_groups) <= {{ inputs.max_degraded_columns }} THEN 'DEGRADED_WITHIN_TOLERANCE'
          ELSE 'CRITICAL_DICTIONARY_OVERFLOW'
        END AS gate_verdict
      FROM per_column;

  - id: write_encoding_report
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Writes a per-column CSV with row group counts, dictionary coverage and compression ratio.
    inputFiles:
      target.parquet: "{{ inputs.parquet_uri }}"
    outputFiles:
      - dictionary_encoding_report.csv
    sql: |
      COPY (
        WITH target AS (
          SELECT DISTINCT unnest(['{{ inputs.categorical_columns | join("','") }}']) AS column_name
        ),
        chunks AS (
          SELECT
            path_in_schema AS column_name,
            COUNT(*) AS row_groups,
            COUNT(*) FILTER (WHERE encodings::VARCHAR LIKE '%DICTIONARY%') AS dictionary_row_groups,
            SUM(total_uncompressed_size) AS uncompressed_bytes,
            SUM(total_compressed_size) AS compressed_bytes
          FROM parquet_metadata('{{ workingDir }}/target.parquet')
          GROUP BY path_in_schema
        )
        SELECT
          t.column_name,
          c.row_groups,
          c.dictionary_row_groups,
          c.uncompressed_bytes,
          c.compressed_bytes,
          ROUND(c.uncompressed_bytes::DOUBLE / GREATEST(c.compressed_bytes, 1), 2) AS compression_ratio,
          CASE
            WHEN c.row_groups IS NULL THEN 'NOT_FOUND'
            WHEN c.dictionary_row_groups = c.row_groups THEN 'DICTIONARY_ENCODED'
            ELSE 'PLAIN_FALLBACK'
          END AS status
        FROM target t
        LEFT JOIN chunks c USING (column_name)
        ORDER BY t.column_name
      ) TO '{{ workingDir }}/dictionary_encoding_report.csv' (HEADER, DELIMITER ',');

  - id: route_by_encoding_health
    type: io.kestra.plugin.core.flow.Switch
    description: Logs a healthy or tolerated result, and fails the execution on missing columns or too many degraded columns.
    value: "{{ outputs.profile_dictionary_encoding.row.gate_verdict }}"
    cases:
      HEALTHY:
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "Parquet encoding check passed: all {{ outputs.profile_dictionary_encoding.row.target_columns }} listed columns are dictionary encoded in every row group."

      DEGRADED_WITHIN_TOLERANCE:
        - id: log_degraded_within_tolerance
          type: io.kestra.plugin.core.log.Log
          level: WARN
          message: "{{ outputs.profile_dictionary_encoding.row.degraded_columns }} column(s) fell back to PLAIN encoding: {{ outputs.profile_dictionary_encoding.row.degraded_column_names }}. This is within max_degraded_columns ({{ inputs.max_degraded_columns }}). See dictionary_encoding_report.csv."

      CRITICAL_DICTIONARY_OVERFLOW:
        - id: fail_on_dictionary_overflow
          type: io.kestra.plugin.core.execution.Fail
          description: Fails the execution so that this file is not promoted downstream.
          errorMessage: "{{ outputs.profile_dictionary_encoding.row.degraded_columns }} column(s) fell back to PLAIN encoding in at least one row group: {{ outputs.profile_dictionary_encoding.row.degraded_column_names }} (limit {{ inputs.max_degraded_columns }}). High-cardinality values overflowed the writer's dictionary page, which inflates file size and slows filters. See dictionary_encoding_report.csv."

      COLUMNS_NOT_FOUND:
        - id: fail_on_missing_columns
          type: io.kestra.plugin.core.execution.Fail
          description: Fails instead of reporting a pass when a listed column does not exist in the file.
          errorMessage: "These columns were not found in the Parquet file, so their encoding could not be checked: {{ outputs.profile_dictionary_encoding.row.missing_column_names }}."

    defaults:
      - id: log_unexpected_verdict
        type: io.kestra.plugin.core.log.Log
        message: "Unexpected encoding gate verdict: {{ outputs.profile_dictionary_encoding.row.gate_verdict }}"

extend:
  title: DuckDB Parquet Dictionary Encoding Fallback Guard
  metaTitle: DuckDB Parquet Dictionary Encoding Fallback Guard | Kestra Blueprint
  shortDescription: Read Parquet column chunk metadata with DuckDB to find categorical columns that fell back from dictionary to PLAIN encoding, and fail the run when too many degrade.
  metaDescription: Check Parquet column chunk metadata with DuckDB for categorical columns that fell back from dictionary to PLAIN encoding, and fail when too many degrade.
  description: |
    Checks a Parquet file for silent loss of dictionary encoding before it is loaded into a lakehouse or warehouse. Categorical columns such as status codes, country codes and payment methods normally compress through dictionary encoding. When a producer writes high-cardinality values into one of them (random tokens, UUIDs, unparsed timestamps), the writer's dictionary page overflows and the column falls back to PLAIN encoding. File size grows, filter pushdown slows down, and no row count or file size check shows it.

    The flow reads `parquet_metadata()` with embedded DuckDB, groups the column chunks by column across all row groups, and reports every column you listed as dictionary encoded in all row groups, partly or not at all. It writes a per-column CSV and fails the execution when the number of degraded columns is above your limit, or when a listed column does not exist in the file. It only reads metadata and never modifies the file.

    ## How it works

    1. `profile_dictionary_encoding` (`io.kestra.plugin.jdbc.duckdb.Query`, `fetchType: FETCH_ONE`) mounts `parquet_uri` with `inputFiles` and aggregates `parquet_metadata()` per column. A column counts as healthy when every row group has a dictionary encoding in its `encodings`, and as degraded when at least one row group does not. Columns you listed that are missing from the file are counted separately, so a typo cannot pass silently.
    2. The query returns one verdict: `HEALTHY`, `DEGRADED_WITHIN_TOLERANCE`, `CRITICAL_DICTIONARY_OVERFLOW` or `COLUMNS_NOT_FOUND`.
    3. `write_encoding_report` (`io.kestra.plugin.jdbc.duckdb.Queries`) writes `dictionary_encoding_report.csv` with, for each listed column, the row group count, the number of dictionary-encoded row groups, uncompressed and compressed bytes, the compression ratio and a status.
    4. `route_by_encoding_health` (`io.kestra.plugin.core.flow.Switch`) acts on the verdict:
       - **`HEALTHY`**: logs the result.
       - **`DEGRADED_WITHIN_TOLERANCE`**: logs a warning that names the degraded columns.
       - **`CRITICAL_DICTIONARY_OVERFLOW`**: `fail_on_dictionary_overflow` (`Fail`) fails the execution.
       - **`COLUMNS_NOT_FOUND`**: `fail_on_missing_columns` (`Fail`) fails the execution.

    ## What you get

    - A check of Parquet encoding that file size and row count checks cannot give you.
    - Per-column results across all row groups, so a column that degrades only in later row groups is still caught.
    - A CSV report with compression ratios for the columns you care about.
    - A failed execution, rather than a pass, when a listed column is absent.

    ## Who it's for

    - **Data Lakehouse Engineers**: Teams that operate Parquet, Iceberg or Delta storage.
    - **Analytics Engineers**: Teams that watch query latency and storage cost on warehouses and DuckDB.
    - **Data Platform Engineers**: Engineers who add quality gates to batch landing pipelines.

    ## Why orchestrate this with Kestra

    The check is cheap but easy to forget. In Kestra it runs right after a file lands, leaves a per-column report as an execution output and fails the execution so downstream flows can stop. A `Switch` keeps the policy in one visible place.

    ## Prerequisites

    - A Kestra instance with the DuckDB JDBC plugin (`io.kestra.plugin.jdbc.duckdb`).
    - A Parquet file available as a `kestra://` internal storage URI or a namespace file URI.
    - A Parquet writer that records dictionary encodings in `encodings`, such as DuckDB. Writers that fall back in the middle of a column chunk can list a dictionary encoding next to PLAIN, and that fallback is not detected.

    ### Secrets

    - None required: DuckDB runs in-process against files in task storage.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Execute it with `parquet_uri` set to a Parquet file in internal storage, and `categorical_columns` set to the columns that should be dictionary encoded.
    3. Read the verdict in the execution logs and download `dictionary_encoding_report.csv` from the task outputs.
    4. Raise `max_degraded_columns` if you accept some degraded columns, or keep it at 0 to fail on the first one.

    ## How to extend

    - **Trigger on landing**: Add a `Schedule` or `Webhook` trigger with an `inputs:` block, or call this flow as a subflow after your ingestion flow.
    - **Scan several files**: Wrap the tasks in a `ForEach` over the files of a partition.
    - **Alert on failure**: Add a Slack or PagerDuty notification in a flow-level `errors` block.

    ## Links

    - [Kestra DuckDB Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [DuckDB Parquet Metadata Documentation](https://duckdb.org/docs/data/parquet/metadata)
    - [Apache Parquet Encodings](https://parquet.apache.org/docs/file-format/data-pages/encodings/)
  tags:
    - Data
  subTags:
    - Testing & Quality
    - ELT & Data Landing
  ee: false
  verified: false
  demo: false
