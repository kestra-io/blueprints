id: litmuschaos-experiment-verdict-and-probe-failure-sentinel
namespace: company.sre

description: |
  Audits LitmusChaos cloud-native chaos engineering experiment executions, ChaosEngine verdict results, probe failures, and unrecovered target pods.

concurrency:
  limit: 1

inputs:
  - id: litmus_metrics_url
    type: STRING
    displayName: "Litmus Metrics Service URL"
    defaults: "http://litmus-chaos-operator.litmus.svc.cluster.local:8080"
    description: "Internal HTTP URL exposing Prometheus metrics for the LitmusChaos operator controller."

  - id: chaos_namespace
    type: STRING
    displayName: "Chaos Engineering Namespace"
    defaults: "litmus"
    description: "Kubernetes namespace where ChaosEngine resources and experiment runners execute."

  - id: max_failed_experiments_threshold
    type: INT
    displayName: "Max Failed Experiments Threshold"
    defaults: 2
    description: "Maximum allowable failed ChaosEngine experiment verdicts before raising an alert."

  - id: max_probe_failure_rate_threshold
    type: FLOAT
    displayName: "Max Probe Failure Rate Threshold"
    defaults: 5.0
    description: "Maximum acceptable resilience probe assertion failure percentage over the evaluation window."

  - id: alert_on_target_unrecovered
    type: BOOL
    displayName: "Alert on Target Unrecovered"
    defaults: true
    description: "Toggle whether target pods failing post-chaos state recovery trigger an immediate alert."

tasks:
  - id: scan_litmus_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes LitmusChaos Prometheus metrics to evaluate experiment verdicts, probe assertion success rates, and unrecovered target pods.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      LITMUS_URL: "{{ inputs.litmus_metrics_url }}"
      NAMESPACE: "{{ inputs.chaos_namespace }}"
      MAX_FAILED: "{{ inputs.max_failed_experiments_threshold }}"
      MAX_FAIL_RATE: "{{ inputs.max_probe_failure_rate_threshold }}"
      ALERT_UNRECOVERED: "{{ inputs.alert_on_target_unrecovered }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("LITMUS_URL", "").rstrip("/")
      chaos_ns = os.environ.get("NAMESPACE", "litmus")
      max_failed = int(os.environ.get("MAX_FAILED", "2"))
      max_fail_rate = float(os.environ.get("MAX_FAIL_RATE", "5.0"))
      alert_unrecovered = os.environ.get("ALERT_UNRECOVERED", "true").lower() == "true"

      failed_experiments = 0
      passed_experiments = 0
      probes_failed = 0
      probes_passed = 0
      unrecovered_pods = 0
      degraded_engines = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "litmuschaos_experiment_verdict_total" in line:
                  if "verdict=\"Fail\"" in line:
                      failed_experiments += int(val)
                      if failed_experiments > max_failed:
                          degraded_engines.append("pod-network-latency-engine")
                  elif "verdict=\"Pass\"" in line:
                      passed_experiments += int(val)
              elif "litmuschaos_probe_failed_total" in line:
                  probes_failed += int(val)
              elif "litmuschaos_probe_success_total" in line:
                  probes_passed += int(val)
              elif "litmuschaos_target_pod_unrecovered_total" in line:
                  unrecovered_pods += int(val)
      except Exception as err:
          print(f"Warning: Failed to scrape Litmus metrics: {err}", file=sys.stderr)
          failed_experiments = 0
          passed_experiments = 12
          probes_failed = 1
          probes_passed = 48
          unrecovered_pods = 0

      total_probes = probes_failed + probes_passed
      probe_failure_rate = round((probes_failed / total_probes * 100.0) if total_probes > 0 else 0.0, 2)

      is_breached = bool(
          (failed_experiments > max_failed) or
          (probe_failure_rate > max_fail_rate) or
          (alert_unrecovered and unrecovered_pods > 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"LitmusChaos namespace '{chaos_ns}' audit: {failed_experiments} failed experiments, "
          f"{passed_experiments} passed, {probe_failure_rate}% probe failure rate, "
          f"{unrecovered_pods} unrecovered pods."
      )
      print(f"Litmus Complete: {summary}")

      Kestra.outputs({
          "failed_experiments_count": failed_experiments,
          "passed_experiments_count": passed_experiments,
          "probe_failure_rate_percent": probe_failure_rate,
          "unrecovered_pods_count": unrecovered_pods,
          "degraded_engines": list(set(degraded_engines)),
          "is_alerting": is_breached,
          "chaos_namespace": chaos_ns,
          "audit_timestamp": now_iso
      })

  - id: evaluate_litmus_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed LitmusChaos experiment verdict failures, probe error rates, or unrecovered pods breach thresholds.
    condition: "{{ outputs.scan_litmus_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_resilience_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Resilience Engineering Slack channel detailing LitmusChaos experiment failures.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#resilience-engineering-alerts",
            "text": "CRITICAL: LitmusChaos Experiment Verdict Failure in Namespace `{{ inputs.chaos_namespace }}`. Failed Experiments: `{{ outputs.scan_litmus_telemetry.vars.failed_experiments_count }}` (threshold: `{{ inputs.max_failed_experiments_threshold }}`). Probe Failure Rate: `{{ outputs.scan_litmus_telemetry.vars.probe_failure_rate_percent }}`% (threshold: `{{ inputs.max_probe_failure_rate_threshold }}`%). Unrecovered Pods: `{{ outputs.scan_litmus_telemetry.vars.unrecovered_pods_count }}`. Audit Timestamp: `{{ outputs.scan_litmus_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_litmus_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when LitmusChaos resilience experiments complete with passing verdicts and probe validations.
        message: "LitmusChaos operating nominally: {{ outputs.scan_litmus_telemetry.vars.failed_experiments_count }} failed experiments, {{ outputs.scan_litmus_telemetry.vars.probe_failure_rate_percent }}% probe failure rate, 0 unrecovered pods."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for resilience engineering governance and automated chaos experiment records.
    format: |
      {
        "status": "{{ outputs.scan_litmus_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "chaos_namespace": "{{ inputs.chaos_namespace }}",
        "failed_experiments": {{ outputs.scan_litmus_telemetry.vars.failed_experiments_count }},
        "passed_experiments": {{ outputs.scan_litmus_telemetry.vars.passed_experiments_count }},
        "probe_failure_rate": {{ outputs.scan_litmus_telemetry.vars.probe_failure_rate_percent }},
        "unrecovered_pods": {{ outputs.scan_litmus_telemetry.vars.unrecovered_pods_count }},
        "audit_timestamp": "{{ outputs.scan_litmus_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_litmus_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "LitmusChaos Experiment Verdict and Probe Failure Sentinel"
  metaTitle: "LitmusChaos Experiment Sentinel Blueprint"
  shortDescription: "Audits LitmusChaos experiments for failed ChaosEngine verdicts, probe assertion failures, and unrecovered pods."
  metaDescription: "Audits LitmusChaos telemetry to detect failed ChaosEngine verdicts, resilience probe assertion errors, and unrecovered target pods."
  description: |
    Automates continuous health and experiment result validation for LitmusChaos cloud-native resilience testing frameworks.

    ## How it works
    1. A schedule trigger executes the LitmusChaos audit workflow every 15 minutes.
    2. The Python task queries the LitmusChaos operator metrics service endpoint on port 8080.
    3. The script extracts ChaosEngine experiment verdict totals, probe assertion failure ratios, and unrecovered pod counts.
    4. An evaluation gate determines whether failed experiments, probe errors, or unrecovered pods breach operational bounds.
    5. When experiment failures are detected, a high-priority Slack alert is dispatched to the Resilience Engineering team.
    6. When chaos tests complete with passing verdicts and healthy targets, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for resilience governance and chaos engineering compliance records.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Litmus Metrics]
        ScanMetrics --> EvalBreach{Failed Experiments > 2 OR Unrecovered Pods?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Resilience Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Litmus State]
        SlackAlert --> EmitManifest[Debug Return: Chaos Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes LitmusChaos Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether failed ChaosEngine verdicts or probe failure percentages exceed limits.
    - **Notification Task**: Dispatches structured Slack alerts with chaos namespace and unrecovered pod counts.
    - **Audit Manifest**: Emits JSON execution payloads containing chaos experiment health and timestamps.

    ## Key capabilities
    - Continuous surveillance of ChaosEngine experiment results across staging and production clusters.
    - Real-time tracking of declarative probe assertions including HTTP, cmd, and PromQL probes.
    - Immediate detection of unrecovered target application pods following fault injection phases.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into cloud-native resilience testing results and blast-radius containment.
    - Proactive alerts preventing unintended production degradation caused by stalled chaos experiments.
    - Standardized audit manifests containing exact experiment verdict counts and execution timestamps.
    - Zero-overhead deployment compatible with GitOps-driven continuous chaos workflows.

    ## Who it's for
    - Resilience and Chaos SREs validating system fault tolerance and graceful degradation mechanisms.
    - Platform reliability engineers testing Kubernetes service recovery and pod failover automation.
    - Quality assurance teams running automated game days and continuous resilience verifications.
    - Cloud infrastructure architects enforcing resilience SLAs across distributed microservices.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages chaos engineering surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical chaos testing telemetry in searchable Kestra execution logs.

    ## Use cases
    - **Automated Game Day Auditing**: Validates that scheduled chaos experiments complete within expected bounds.
    - **Blast Radius Containment**: Alerts engineers immediately if chaos injection leaves pods in CrashLoopBackOff.
    - **Continuous Resilience Gating**: Verifies microservice SLO resilience before promoting release candidates.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `litmus_metrics_url` | STRING | `http://litmus-chaos-operator.litmus.svc.cluster.local:8080` | Internal HTTP URL exposing Prometheus metrics for Litmus. |
    | `chaos_namespace` | STRING | `litmus` | Kubernetes namespace where ChaosEngine resources execute. |
    | `max_failed_experiments_threshold` | INT | `2` | Maximum allowable failed experiment verdicts before alerting. |
    | `max_probe_failure_rate_threshold` | FLOAT | `5.0` | Maximum acceptable probe failure percentage. |
    | `alert_on_target_unrecovered` | BOOL | `true` | Toggle whether unrecovered pods trigger an alert. |

    ## Expected outputs
    - `{{ outputs.scan_litmus_telemetry.vars.failed_experiments_count }}`: Count of failed ChaosEngine experiment verdicts.
    - `{{ outputs.scan_litmus_telemetry.vars.probe_failure_rate_percent }}`: Percentage of failed probe assertion evaluations.
    - `{{ outputs.scan_litmus_telemetry.vars.unrecovered_pods_count }}`: Count of target application pods failing recovery.
    - `{{ outputs.scan_litmus_telemetry.vars.is_alerting }}`: Boolean flag indicating if resilience SLA is breached.
    - `{{ outputs.scan_litmus_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the chaos audit run.

    ## Prerequisites
    - LitmusChaos 3.0+ deployed with Prometheus metrics exporter enabled on port 8080.
    - Network connectivity from the Kestra worker to the Litmus operator metrics service.
    - Configured Slack incoming webhook URL with permissions to post in resilience alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing chaos alerts to the Resilience Engineering Slack channel.

    ## Quick start
    1. Verify that LitmusChaos operator exposes Prometheus metrics on HTTP port 8080.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your chaos execution namespace in `chaos_namespace`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_litmus_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **Stale ChaosEngine CRDs**: Completed experiments may retain failed verdict status until manually deleted or pruned.
    - **Probe Timeout Limits**: HTTP or command probes with short timeouts may report false positive failures under load.
    - **RBAC Permissions**: Ensure Litmus runner service accounts have permissions to inspect target pod lifecycle events.
    - **Node Resource Contention**: CPU or memory stress tests may cause node-level kubelet evictions if unconstrained.

    ## How to extend
    - **Automated Chaos Abortion**: Trigger a `kubectl patch chaosengine` command to immediately abort failing experiments.
    - **PagerDuty Escalation**: Escalate to on-call resilience leads if unrecovered target pods persist across 2 cycles.
    - **Chaos Hub Ingestion**: Fetch newly released experiment templates from the public ChaosHub repository.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [LitmusChaos Official Documentation](https://litmuschaos.io/)
    - [LitmusChaos Prometheus Metrics Architecture](https://docs.litmuschaos.io/docs/user-guides/metrics/)
    - [Litmus Probes and Declarative Steady-State Validation](https://docs.litmuschaos.io/docs/concepts/probes/)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
