id: sqlserver-stale-statistics-refresh-guard
namespace: company.team

description: |
  Find SQL Server statistics whose modification_counter is high relative to the
  table rowcount, from sys.stats CROSS APPLY sys.dm_db_stats_properties, alert
  Slack, then refresh each one with UPDATE STATISTICS behind a safe-by-default
  gate and re-read dm_db_stats_properties to confirm none are still stale. Stale
  statistics give the optimizer wrong row estimates, which produces bad plans.

inputs:
  - id: url
    type: STRING
    displayName: JDBC URL
    description: Points at the database to check. The query reads sys.stats for the connected database.
    defaults: "jdbc:sqlserver://localhost:1433;databaseName=app;encrypt=false"

  - id: user
    type: STRING
    displayName: SQL Server login
    defaults: sa

  - id: password
    type: STRING
    displayName: SQL Server password
    description: Defaults to the SQLSERVER_PASSWORD secret. Override only for local testing.
    defaults: "{{ secret('SQLSERVER_PASSWORD') }}"

  - id: modification_pct
    type: FLOAT
    displayName: Modification percent threshold
    description: Flag a statistic when its modification_counter is at least this percent of the rowcount at the last update.
    defaults: 20.0

  - id: min_modifications
    type: INT
    displayName: Minimum modifications
    description: Ignore statistics with fewer modifications than this, so small tables do not churn.
    defaults: 500

  - id: full_scan
    type: BOOL
    displayName: Use WITH FULLSCAN
    description: Refresh with a full scan instead of a sample. Slower but exact.
    defaults: false

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    description: Allow the UPDATE STATISTICS statements to run.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, for any refresh to run.
    defaults: true

variables:
  audit_sql: |
    SELECT
      sch.name AS schema_name,
      obj.name AS table_name,
      s.name AS stats_name,
      sp.rows AS row_count,
      sp.modification_counter AS mod_counter,
      CAST(CASE WHEN sp.rows = 0 THEN NULL ELSE sp.modification_counter * 100.0 / sp.rows END AS DECIMAL(18,2)) AS mod_pct,
      'UPDATE STATISTICS ' + QUOTENAME(sch.name) + '.' + QUOTENAME(obj.name) + ' ' + QUOTENAME(s.name){% if inputs.full_scan %} + ' WITH FULLSCAN'{% endif %} AS fix_sql
    FROM sys.stats s
    JOIN sys.objects obj ON obj.object_id = s.object_id
    JOIN sys.schemas sch ON sch.schema_id = obj.schema_id
    CROSS APPLY sys.dm_db_stats_properties(s.object_id, s.stats_id) sp
    WHERE obj.is_ms_shipped = 0
      AND obj.type = 'U'
      AND sp.modification_counter >= {{ inputs.min_modifications }}
      AND (sp.rows = 0 OR sp.modification_counter * 100.0 / sp.rows >= {{ inputs.modification_pct }})
    ORDER BY mod_pct DESC, mod_counter DESC

tasks:
  - id: audit
    type: io.kestra.plugin.jdbc.sqlserver.Query
    description: Read-only. Joins sys.stats to dm_db_stats_properties for every user table statistic, keeps the ones over the threshold and builds the UPDATE STATISTICS statement for each with QUOTENAME.
    url: "{{ inputs.url }}"
    username: "{{ inputs.user }}"
    password: "{{ inputs.password }}"
    trustServerCertificate: true
    fetchType: FETCH
    sql: "{{ render(vars.audit_sql) }}"

  - id: fixes
    type: io.kestra.plugin.core.output.OutputValues
    description: The UPDATE STATISTICS statement per stale statistic, built in SQL with QUOTENAME so identifiers are quoted by the server.
    values:
      sql: "{{ outputs.audit.rows | jq('map(.fix_sql)') | first | toJson }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      SQL Server stale statistics audit on {{ inputs.url }}: {{ outputs.audit.size }} statistic(s) over threshold (modification_counter at least {{ inputs.modification_pct }}% of rows, floor {{ inputs.min_modifications }}).
      {{ outputs.audit.rows | jq('map("\(.schema_name).\(.table_name).\(.stats_name) mod=\(.mod_counter) rows=\(.row_count) pct=\(.mod_pct)") | join("; ")') | first }}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit.size > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'SQL Server ' ~ inputs.url ~ ': ' ~ outputs.audit.size ~ ' stale statistic(s) over threshold: ' ~ (outputs.audit.rows | jq('map("\(.schema_name).\(.table_name).\(.stats_name) mod=\(.mod_counter)") | join("; ")') | first) ~ '.' ~ (inputs.auto_remediate and not inputs.dry_run ? ' Refreshing now.' : ' No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: remediate
            type: io.kestra.plugin.core.flow.Loop
            description: Serial on purpose. Each UPDATE STATISTICS runs as its own autocommitting Query, never a Queries task with transaction true. concurrencyLimit 1 keeps the refreshes one at a time.
            concurrencyLimit: 1
            values: "{{ outputs.fixes.values.sql }}"
            tasks:
              - id: apply
                type: io.kestra.plugin.jdbc.sqlserver.Query
                description: One UPDATE STATISTICS. Rebuilds the statistic from the current data and resets its modification_counter to 0.
                url: "{{ inputs.url }}"
                username: "{{ inputs.user }}"
                password: "{{ inputs.password }}"
                trustServerCertificate: true
                fetchType: NONE
                sql: "{{ item.value }}"

          - id: reaudit
            type: io.kestra.plugin.jdbc.sqlserver.Query
            description: Re-read dm_db_stats_properties after the refresh to confirm no statistic is still over the threshold.
            url: "{{ inputs.url }}"
            username: "{{ inputs.user }}"
            password: "{{ inputs.password }}"
            trustServerCertificate: true
            fetchType: FETCH
            sql: "{{ render(vars.audit_sql) }}"

          - id: verify_result
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.reaudit.size > 0 }}"
            then:
              - id: remediation_failed
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: "Still stale after refresh: {{ outputs.reaudit.rows | jq('map(\"\\(.schema_name).\\(.table_name).\\(.stats_name)\") | join(\", \")') | first }}. The login needs ALTER on these tables. The data may also be changing faster than the refresh keeps up. Check the logs."
            else:
              - id: remediated
                type: io.kestra.plugin.core.log.Log
                message: "Refreshed and verified fresh: {{ fromJson(outputs.fixes.values.sql) | join('; ') }}. Every flagged statistic is now under the threshold."
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "No statistic on {{ inputs.url }} is over the threshold. The optimizer has current row estimates."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'SQL Server stale statistics guard failed on ' ~ inputs.url ~ ' (execution ' ~ execution.id ~ '). A refresh did not land or the audit could not run. Check the logs.'} | toJson }}

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled. Always runs in safe mode (audit only).
    cron: "0 3 * * 0"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: SQL Server Stale Statistics Refresh Guard
  shortDescription: Find SQL Server statistics whose modification_counter is high versus the table rowcount, alert Slack, then refresh each with UPDATE STATISTICS behind a safe-by-default gate and re-read dm_db_stats_properties to confirm.
  metaTitle: SQL Server Stale Statistics Refresh Guard with Kestra
  metaDescription: Find SQL Server statistics with a high modification counter versus rowcount, alert Slack, refresh with UPDATE STATISTICS, then re-read to confirm.
  description: |
    SQL Server keeps column and index statistics so the query optimizer can
    estimate how many rows a predicate returns. Each statistic carries a
    modification_counter that counts the rows changed since it was last built.
    When that counter grows large relative to the table, the stored histogram no
    longer matches the data, the optimizer estimates the wrong row counts and it
    picks bad plans: a loop join where a hash join was right, a seek where a scan
    was right, too little or too much memory granted. Auto update statistics helps,
    but it can be off, it can lag on large tables and a load that bypasses it leaves
    the counter high.

    This blueprint reads `sys.stats` joined through `sys.dm_db_stats_properties`
    for every user table statistic in the connected database, flags the ones whose
    modification_counter is at least a chosen percent of the rowcount (with a floor
    so small tables are ignored) and alerts Slack. When you allow it, it refreshes
    each flagged statistic with `UPDATE STATISTICS`, one statement at a time, then
    reads `dm_db_stats_properties` again and fails the run if any flagged statistic
    is still over the threshold.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Safety

    - Read-only by default. `dry_run` is `true` and `auto_remediate` is `false`, so a normal run only reads the statistics and alerts.
    - A write happens only when `auto_remediate` is `true` and `dry_run` is `false`.
    - Each refresh runs as its own autocommitting `io.kestra.plugin.jdbc.sqlserver.Query`, never a `Queries` task with `transaction: true`. `UPDATE STATISTICS` does not run inside an explicit transaction.
    - The remediation loop has `concurrencyLimit: 1`, so the refreshes never run in parallel.
    - `UPDATE STATISTICS` holds a short schema lock while it rebuilds the histogram. `WITH FULLSCAN` reads the whole table, so leave it off on very large tables unless you need exact estimates.

    ## How it works

    1. `audit` (`io.kestra.plugin.jdbc.sqlserver.Query`, read-only) joins `sys.stats` to `sys.objects` and `sys.schemas`, then `CROSS APPLY sys.dm_db_stats_properties(s.object_id, s.stats_id)`. It keeps every user table statistic where `modification_counter` is at least `min_modifications` and at least `modification_pct` of the rowcount, then builds the `UPDATE STATISTICS` statement for each one with `QUOTENAME`.
    2. `fixes` (`io.kestra.plugin.core.output.OutputValues`) collects the per statistic refresh statements. `summary` (`io.kestra.plugin.core.log.Log`) logs the findings with the modification counter and rowcount for each.
    3. `route` (`io.kestra.plugin.core.flow.If`):
       - **clean:** logs that no statistic is over the threshold.
       - **findings:** `alert` posts the flagged statistics to Slack.
         - `remediate_gate` runs only when `auto_remediate` is `true` and `dry_run` is `false`.
         - `remediate` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) runs each `UPDATE STATISTICS` in turn.
         - `reaudit` re-reads `dm_db_stats_properties`. `verify_result` fails the run if any flagged statistic is still over the threshold.
    4. `errors` posts a Slack alert when a refresh did not land or the audit cannot run.

    ## What you get

    - Every statistic the optimizer is reading from a stale histogram, with its modification counter, the rowcount at the last update and the percent over.
    - A refresh that rebuilds each flagged statistic from the current data and resets its modification counter, so the optimizer gets current estimates.
    - A re-read of `dm_db_stats_properties` after the change that fails the run if a statistic is still over the threshold, so a refresh that did not land is never reported as success.
    - A Slack alert on findings and a separate alert if a refresh fails or the audit cannot run.

    ## Who it's for

    - DBAs who turned off auto update statistics for predictable load windows and want a controlled refresh of only the statistics that drifted.
    - Platform teams chasing a plan regression who want to know which statistics are stale before they rebuild everything.
    - Teams evaluating the SQL Server plugin who want an example that reads a dynamic management function and drives `UPDATE STATISTICS`.

    ## Why orchestrate this with Kestra

    Refreshing every statistic on a schedule wastes IO and can still miss the one table that drifted overnight. You want to see which statistics are actually stale first, refresh only those, one at a time, then confirm the counters reset. You want the run to stop and shout if a refresh did not take. Kestra reads `dm_db_stats_properties`, gates the change behind two inputs, runs each `UPDATE STATISTICS` on its own, re-reads the function and fails loudly if anything is still stale. The Slack alert says what was found and whether anything changed. The run history keeps every before and after.

    ## Tested end to end

    On Kestra 2.0.5 against SQL Server 2022 on Linux, with a local HTTP sink standing in for Slack. A table was seeded, its statistics were fully updated, then many rows were changed with `AUTO_UPDATE_STATISTICS OFF` so the modification counters climbed and stayed high.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | defaults, two statistics over threshold | 2 flagged, Slack alert "No change applied". `dm_db_stats_properties` still showed modification_counter 1000 and 3000, so a default run changed nothing |
    | 2 | `auto_remediate: true`, `dry_run: true` | 2 flagged, still "No change applied". The dry run blocked the write even with `auto_remediate` on |
    | 3 | `auto_remediate: true`, `dry_run: false` | `remediate` ran two `UPDATE STATISTICS`. `reaudit` returned 0 rows. `dm_db_stats_properties` reported modification_counter 0 for both |
    | 4 | defaults, after run 3 | 0 flagged, `clean` branch |
    | 5 | `min_modifications: 999999` | 0 flagged on the degraded table, which proves the threshold gates the detection |
    | 6 | unreachable server | `audit` failed, `errors` block posted to Slack |

    ## Prerequisites

    - A SQL Server database you can reach over JDBC.
    - A login that can read `sys.stats` and run `sys.dm_db_stats_properties` for the audit, plus `ALTER` on the tables (for example `db_ddladmin` or table ownership) for `UPDATE STATISTICS`.
    - A Slack incoming webhook.

    ### Secrets

    - `SQLSERVER_PASSWORD`: password for the login in `user`. The `password` input defaults to this secret.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook, used by `alert` and the `errors` block.
    - In Kestra OSS, provide each one as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `url` | `jdbc:sqlserver://localhost:1433;databaseName=app;encrypt=false` | Database to check. The query reads the connected database |
    | `user` | `sa` | SQL Server login |
    | `password` | `{{ secret('SQLSERVER_PASSWORD') }}` | Password for the login |
    | `modification_pct` | `20.0` | Flag a statistic when its modification counter is at least this percent of the rowcount |
    | `min_modifications` | `500` | Ignore statistics with fewer modifications than this |
    | `full_scan` | `false` | Refresh with a full scan instead of a sample |
    | `auto_remediate` | `false` | Allow the refresh statements |
    | `dry_run` | `true` | Must be `false` for a statement to run |

    ## Quick start

    1. Add the `SQLSERVER_PASSWORD` and `SLACK_WEBHOOK_URL` secrets.
    2. Import the flow, then set `url` to the database you want to check and set `user`.
    3. Run it once with the defaults and read the flagged statistics.
    4. When you are ready, run with `auto_remediate: true` and `dry_run: false`.
    5. Enable the `weekly` trigger, which always runs in safe mode.

    ## How to extend

    - Limit the audit to one schema by adding a `WHERE sch.name = ...` filter so a shared instance is checked in parts.
    - Raise `modification_pct` or `min_modifications` to match your own staleness tolerance. Drop `full_scan` for faster sampled refreshes.
    - Post the modification counter and rowcount to Slack so an on-call engineer can judge urgency without opening the database.
    - Loop over several databases on the instance by reading `sys.databases` first.

    ## Links

    - UPDATE STATISTICS: https://learn.microsoft.com/en-us/sql/t-sql/statements/update-statistics-transact-sql
    - sys.dm_db_stats_properties: https://learn.microsoft.com/en-us/sql/relational-databases/system-dynamic-management-views/sys-dm-db-stats-properties-transact-sql
    - SQL Server plugin: https://kestra.io/plugins/plugin-jdbc-sqlserver
  tags:
    - Infrastructure
    - Data
  subTags:
    - Databases
    - Maintenance & Optimization
    - Performance
  ee: false
  demo: false
