id: github-branch-protection-compliance-sentinel
namespace: company.team
description: |
  GitHub repository branch protection governance sentinel. Audits organization repositories via the
  GitHub REST API to detect unprotected default branches and missing PR approval gates, alerting DevSecOps.

concurrency:
  limit: 1

inputs:
  - id: github_organization
    type: STRING
    displayName: GitHub Organization
    defaults: "kestra-io"
    description: "Target GitHub organization name to audit for repository branch protection."

  - id: target_repositories
    type: STRING
    displayName: Target Repositories
    defaults: "core,plugins,blueprints"
    description: "Comma-separated list of repository names to verify for compliant branch protection rules."

  - id: default_branch_name
    type: STRING
    displayName: Default Branch Name
    defaults: "main"
    description: "The primary branch expected to enforce branch protection policies."

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#security-alerts"
    description: "Slack channel destination for repository governance compliance notifications."

outputs:
  - id: has_violations
    type: BOOLEAN
    value: "{{ outputs.scan_branch_protection_rules.vars.has_violations }}"
  - id: violations_count
    type: INT
    value: "{{ outputs.scan_branch_protection_rules.vars.violations_count }}"
  - id: total_scanned
    type: INT
    value: "{{ outputs.scan_branch_protection_rules.vars.total_scanned }}"

triggers:
  - id: weekly_branch_protection_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Audits repository branch protection policies weekly on Monday at 09:00 UTC."
    cron: "0 9 * * 1"

tasks:
  - id: scan_branch_protection_rules
    type: io.kestra.plugin.scripts.python.Script
    description: "Queries GitHub REST API to audit branch protection settings across target repositories."
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      GITHUB_ORG: "{{ inputs.github_organization }}"
      TARGET_REPOS: "{{ inputs.target_repositories }}"
      DEFAULT_BRANCH: "{{ inputs.default_branch_name }}"
      GITHUB_TOKEN: "{{ secret('GITHUB_TOKEN') }}"
    outputFiles:
      - branch_protection_report.json
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      org = os.environ.get("GITHUB_ORG", "kestra-io")
      repos_raw = os.environ.get("TARGET_REPOS", "core,plugins,blueprints")
      default_branch = os.environ.get("DEFAULT_BRANCH", "main")
      token = os.environ.get("GITHUB_TOKEN", "")

      headers = {
          "Accept": "application/vnd.github+json",
          "User-Agent": "Kestra-Branch-Protection-Sentinel"
      }
      if token:
          headers["Authorization"] = f"Bearer {token}"

      repo_list = [r.strip() for r in repos_raw.split(",") if r.strip()]
      violations = []
      compliant_repos = []

      for repo in repo_list:
          url = f"https://api.github.com/repos/{org}/{repo}/branches/{default_branch}/protection"
          try:
              resp = requests.get(url, headers=headers, timeout=15)
              if resp.status_code == 404:
                  violations.append({
                      "repository": f"{org}/{repo}",
                      "branch": default_branch,
                      "violations": ["Branch protection is completely disabled (404)"]
                  })
                  continue
              elif resp.status_code != 200:
                  print(f"ERROR: GitHub API returned {resp.status_code} for {org}/{repo}: {resp.text}", file=sys.stderr)
                  sys.exit(1)
              data = resp.json()
              reasons = []
              reviews = data.get("required_pull_request_reviews", {})
              approvals = reviews.get("required_approving_review_count", 0) if reviews else 0
              if approvals < 1:
                  reasons.append("Missing required pull request review approvals")
              allow_force = data.get("allow_force_pushes", {}).get("enabled", False)
              if allow_force:
                  reasons.append("Force pushes are permitted on default branch")
              if reasons:
                  violations.append({"repository": f"{org}/{repo}", "branch": default_branch, "violations": reasons})
              else:
                  compliant_repos.append(f"{org}/{repo}")
          except Exception as err:
              print(f"ERROR querying branch protection for {org}/{repo}: {err}", file=sys.stderr)
              sys.exit(1)

      has_violations = len(violations) > 0
      top_repo = violations[0]["repository"] if violations else "none"
      top_reason = violations[0]["violations"][0] if violations else "none"

      report = {
          "organization": org,
          "total_scanned_repositories": len(repo_list),
          "violations_count": len(violations),
          "compliant_count": len(compliant_repos),
          "violations": violations,
          "compliant_repositories": compliant_repos
      }

      with open("branch_protection_report.json", "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)

      print(f"Audit complete: {len(violations)} violations across {len(repo_list)} repositories.")
      Kestra.outputs({
          "has_violations": has_violations,
          "violations_count": len(violations),
          "top_violating_repo": top_repo,
          "top_violation_reason": top_reason,
          "total_scanned": len(repo_list)
      })

  - id: check_protection_violations
    type: io.kestra.plugin.core.flow.If
    description: "Evaluates whether any repositories violate mandatory branch protection standards."
    condition: "{{ outputs.scan_branch_protection_rules.vars.has_violations }}"
    then:
      - id: notify_slack_security
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Dispatches actionable security alert card to DevSecOps channel with remediation advice."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "*SECURITY ALERT: GitHub Branch Protection Compliance Violation*\n• *Organization*: `{{ inputs.github_organization }}`\n• *Violating Repositories*: {{ outputs.scan_branch_protection_rules.vars.violations_count }} of {{ outputs.scan_branch_protection_rules.vars.total_scanned }} scanned repos\n• *Primary Offender*: `{{ outputs.scan_branch_protection_rules.vars.top_violating_repo }}`\n• *Violation Details*: {{ outputs.scan_branch_protection_rules.vars.top_violation_reason }}"
          }

    else:
      - id: log_compliant_protection_status
        type: io.kestra.plugin.core.log.Log
        description: "Logs confirmation that all audited repositories enforce branch protection policies."
        message: "Branch protection audit compliant. All {{ outputs.scan_branch_protection_rules.vars.total_scanned }} repositories in organization '{{ inputs.github_organization }}' enforce compliant PR approval rules."

  - id: export_protection_manifest
    type: io.kestra.plugin.core.debug.Return
    description: "Outputs structured JSON compliance manifest for security audit records."
    format: |
      {
        "pipeline": "github-branch-protection-compliance-sentinel",
        "audited_at": "{{ execution.startDate }}",
        "organization": "{{ inputs.github_organization }}",
        "scanned_repositories": {{ outputs.scan_branch_protection_rules.vars.total_scanned }},
        "violations_count": {{ outputs.scan_branch_protection_rules.vars.violations_count }},
        "status": "{{ outputs.scan_branch_protection_rules.vars.has_violations ? 'NON_COMPLIANT' : 'COMPLIANT' }}"
      }

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack if branch protection scan fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "CRITICAL: GitHub Branch Protection Compliance Sentinel failed on execution `{{ execution.id }}`."
      }

extend:
  shortDescription: Audits GitHub repositories for missing branch protection rules and PR review gates, alerting DevSecOps.
  title: GitHub Branch Protection Compliance Sentinel
  metaTitle: GitHub Branch Protection Compliance Sentinel | Kestra Blueprint
  metaDescription: Audits GitHub organization repositories for missing branch protection and PR review approval rules, delivering actionable Slack alerts to DevSecOps.
  description: |
    Audits default branches across organization repositories for mandatory branch protection rules and PR review approval gates.
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Policy & Compliance
    - Monitoring & Alerting
  ee: false
  demo: false
