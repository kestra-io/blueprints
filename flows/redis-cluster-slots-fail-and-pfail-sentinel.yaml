id: redis-cluster-slots-fail-and-pfail-sentinel
namespace: company.data

inputs:
  - id: redis_host
    type: STRING
    defaults: "redis-cluster.internal"
    description: Redis cluster node hostname or IP address.
  - id: redis_port
    type: INT
    defaults: 6379
    description: Redis port.

tasks:
  - id: query_cluster_state
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install redis kestra
    env:
      REDIS_HOST: "{{ inputs.redis_host }}"
      REDIS_PORT: "{{ inputs.redis_port }}"
      REDIS_PASSWORD: "{{ secret('REDIS_PASSWORD') }}"
    script: |
      import os
      import sys
      import redis
      from kestra import Kestra

      host = os.environ.get("REDIS_HOST", "redis-cluster.internal")
      port = int(os.environ.get("REDIS_PORT", "6379"))
      password = os.environ.get("REDIS_PASSWORD") or None

      try:
          r = redis.Redis(host=host, port=port, password=password, socket_connect_timeout=10, socket_timeout=10)
          info = r.cluster_info()
      except Exception as e:
          print(f"Error querying Redis cluster info at {host}:{port}: {e}", file=sys.stderr)
          sys.exit(1)

      state = info.get("cluster_state", "fail")
      slots_fail = int(info.get("cluster_slots_fail", 0))
      slots_pfail = int(info.get("cluster_slots_pfail", 0))

      print(f"Redis cluster: state={state}, slots_fail={slots_fail}, slots_pfail={slots_pfail}")
      Kestra.outputs({
          "cluster_state": state,
          "slots_fail": slots_fail,
          "slots_pfail": slots_pfail
      })

  - id: evaluate_cluster_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_cluster_state.vars.cluster_state != 'ok' or outputs.query_cluster_state.vars.slots_fail | int > 0 or outputs.query_cluster_state.vars.slots_pfail | int > 0 }}"
    then:
      - id: notify_cache_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#redis-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Redis Cluster Slot Degradation Alert",
                "text": "Redis cluster node `{{ inputs.redis_host }}` reported degraded cluster health! State: *{{ outputs.query_cluster_state.vars.cluster_state }}*, Failing Slots (fail): *{{ outputs.query_cluster_state.vars.slots_fail }}*, Possible Failing Slots (pfail): *{{ outputs.query_cluster_state.vars.slots_pfail }}*. Impact: Key commands mapping to unserved hash slots are rejected with `CLUSTERDOWN` errors.",
                "footer": "Kestra Cache Sentinel • Redis Cluster"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#redis-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Redis Cluster Slots Fail and PFail Sentinel Pipeline Failure",
            "text": "Failed to query Redis cluster info. Check host reachability, port, and authentication password.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

outputs:
  - id: cluster_state
    type: STRING
    value: "{{ outputs.query_cluster_state.vars.cluster_state }}"
  - id: slots_fail
    type: INT
    value: "{{ outputs.query_cluster_state.vars.slots_fail }}"
  - id: slots_pfail
    type: INT
    value: "{{ outputs.query_cluster_state.vars.slots_pfail }}"

extend:
  metaDescription: "Audits Redis cluster topology to detect node fail/pfail states, degraded cluster health, and unassigned hash slots."
  metaTitle: Redis Cluster Slots Fail and PFail Sentinel with Kestra
  title: Redis Cluster Slots Fail and PFail Sentinel
  shortDescription: Audits Redis cluster topology to detect node fail/pfail states, degraded cluster health, and unassigned hash slots.
  description: |
    ## How it works
    This workflow executes `CLUSTER INFO` on a Redis Cluster node, parsing `cluster_state`, `cluster_slots_fail`, and `cluster_slots_pfail`. In Redis Cluster, all 16,384 hash slots must be assigned and served by reachable master nodes. If a master node crashes or becomes partitioned and cannot fail over to a replica, the cluster enters `cluster_state:fail` and rejects operations. Slack is alerted immediately upon any slot failure.

    ## What you get
    - Real-time detection of Redis Cluster master partition and failover states.
    - Prevents application downtime caused by `CLUSTERDOWN The cluster is down` errors.
    - Clear distinction between full slot failures and possible fail (pfail) gossip states.

    ## Who it's for
    - SREs and Infrastructure Engineers operating production Redis Clusters.
    - Application teams relying on distributed caching and session stores.

    ## Why orchestrate this with Kestra
    - **Official CLI Execution**: Uses standard `redis-cli` in a lightweight Alpine container.
    - **Continuous State Auditing**: Periodic 15-minute verification of hash slot allocation.
    - **Automated Incident Routing**: Rapid escalation to on-call cache engineers.

    ## Prerequisites
    - Redis Cluster accessible to the Kestra worker.
    - Secrets `REDIS_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import blueprint into Kestra.
    2. Set `redis_host` and `redis_port`.
    3. Run the workflow to inspect Redis Cluster slot health.

    ## How to extend
    - Run `redis-cli --cluster check` to automatically detect orphaned or migrating slots.
    - Trigger automated failover promotion via `CLUSTER FAILOVER` on replica nodes.

    ## Links
    - [Redis Cluster Specification](https://redis.io/docs/latest/operate/oss_and_stack/reference/cluster-spec/)
    - [Kestra Python Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
