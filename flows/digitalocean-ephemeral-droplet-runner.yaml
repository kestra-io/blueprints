id: digitalocean-ephemeral-droplet-runner
namespace: company.team
description: |
  Provision a throwaway DigitalOcean droplet for a batch workload, wait
  until it boots, lock it down with a dedicated firewall, run the job, and
  destroy both the firewall and the droplet in a finally block so a failed
  run never leaves a forgotten VM billing by the hour.

inputs:
  - id: region
    type: STRING
    defaults: nyc3
    description: DigitalOcean region slug to provision the droplet in, e.g. nyc3, ams3, sgp1.

  - id: droplet_size
    type: STRING
    defaults: s-2vcpu-4gb
    description: Droplet size slug controlling CPU and memory for this run.

  - id: image
    type: STRING
    defaults: ubuntu-24-04-x64
    description: Image slug the droplet boots from.

  - id: admin_cidr
    type: STRING
    defaults: 203.0.113.0/24
    description: CIDR range allowed to reach the droplet over SSH while it exists.

tasks:
  - id: create_droplet
    type: io.kestra.plugin.digitalocean.droplet.Create
    description: Provision the ephemeral droplet, tagged so any leftovers are easy to spot, with the batch workload injected through cloud-init.
    name: "kestra-runner-{{ execution.id | lower }}"
    region: "{{ inputs.region }}"
    size: "{{ inputs.droplet_size }}"
    image: "{{ inputs.image }}"
    tags:
      - kestra
      - ephemeral
    userData: |
      #cloud-config
      runcmd:
        - echo "replace this with your batch job, e.g. docker run my-etl:latest" >> /var/log/kestra-runner.log

  - id: wait_until_active
    type: io.kestra.plugin.core.flow.LoopUntil
    description: Poll the droplet every 10 seconds until DigitalOcean reports it active, failing the run if that takes longer than 10 minutes.
    condition: "{{ outputs.poll_droplet.status == 'active' }}"
    checkFrequency:
      interval: PT10S
      maxDuration: PT10M
    failOnMaxReached: true
    tasks:
      - id: poll_droplet
        type: io.kestra.plugin.digitalocean.droplet.Get
        dropletId: "{{ outputs.create_droplet.id }}"

  - id: lock_down
    type: io.kestra.plugin.digitalocean.firewall.Create
    description: Attach a single-purpose firewall so the runner only accepts SSH from the admin network, while keeping outbound open for package installs and data pushes.
    name: "kestra-runner-{{ execution.id | lower }}"
    inboundRules:
      - protocol: tcp
        ports: "22"
        sources:
          addresses:
            - "{{ inputs.admin_cidr }}"
    outboundRules:
      - protocol: tcp
        ports: "1-65535"
        destinations:
          addresses:
            - 0.0.0.0/0
            - ::/0
      - protocol: udp
        ports: "1-65535"
        destinations:
          addresses:
            - 0.0.0.0/0
            - ::/0
    dropletIds:
      - "{{ outputs.create_droplet.id }}"

  - id: run_workload
    type: io.kestra.plugin.core.log.Log
    description: Placeholder for the actual work. The cloud-init script is already running on the droplet; replace this task with io.kestra.plugin.fs.ssh.Command to drive the machine interactively.
    message: "Droplet {{ outputs.poll_droplet.name }} is active at {{ outputs.poll_droplet.ip ?? 'IP pending' }} in {{ outputs.poll_droplet.region }}, workload started via cloud-init"

finally:
  - id: remove_firewall
    type: io.kestra.plugin.core.flow.If
    description: Delete the per-run firewall whenever one was created, even if a later task failed.
    condition: "{{ (outputs.lock_down.id ?? '') != '' }}"
    then:
      - id: delete_firewall
        type: io.kestra.plugin.digitalocean.firewall.Delete
        firewallId: "{{ outputs.lock_down.id }}"

  - id: remove_droplet
    type: io.kestra.plugin.core.flow.If
    description: Destroy the droplet whenever one was created, so no run ever leaks a paid VM.
    condition: "{{ (outputs.create_droplet.id ?? '') != '' }}"
    then:
      - id: delete_droplet
        type: io.kestra.plugin.digitalocean.droplet.Delete
        dropletId: "{{ outputs.create_droplet.id }}"

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Tell the team a run failed. The finally block has already destroyed the droplet and firewall.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Ephemeral droplet run failed in flow {{ flow.id }} (execution {{ execution.id }}). Teardown ran in the finally block; verify in the DigitalOcean console that nothing tagged 'ephemeral' remains."
      }

pluginDefaults:
  - type: io.kestra.plugin.digitalocean
    values:
      apiToken: "{{ secret('DIGITALOCEAN_TOKEN') }}"

extend:
  title: Ephemeral DigitalOcean Droplet Runner with Guaranteed Teardown
  shortDescription: Provision a throwaway droplet for a batch job, wait until it boots, firewall it, run the workload, and always destroy it in a finally block.
  metaTitle: Ephemeral DigitalOcean Droplet Runner with Kestra
  metaDescription: Orchestrate ephemeral DigitalOcean droplets with Kestra. Create a VM per run, poll until active, run your job, and guarantee teardown with finally.
  description: |
    Run batch workloads on DigitalOcean droplets that exist only for the duration of a single execution. This blueprint provisions a fresh droplet with your job injected through cloud-init, polls the API until the machine is actually active, restricts SSH access to your admin network with a dedicated firewall, and then destroys both the firewall and the droplet in a `finally` block. Because teardown lives in `finally` rather than at the end of the happy path, a crashed workload or a failed boot never leaves an orphaned VM billing by the hour.

    ## How it works

    1. `create_droplet` (`io.kestra.plugin.digitalocean.droplet.Create`) provisions a droplet named after the execution ID, tagged `kestra` and `ephemeral`, in the region and size passed as inputs. The batch job itself ships as a cloud-init `userData` script that runs on first boot.
    2. `wait_until_active` (`io.kestra.plugin.core.flow.LoopUntil`) polls `droplet.Get` every 10 seconds until the droplet status flips from `new` to `active`, failing the run if that takes longer than 10 minutes.
    3. `lock_down` (`io.kestra.plugin.digitalocean.firewall.Create`) attaches a single-purpose firewall that only allows inbound SSH from the `admin_cidr` input while keeping all outbound traffic open.
    4. `run_workload` is a placeholder log task reporting the droplet's public IP. In production you replace it with `io.kestra.plugin.fs.ssh.Command` pointed at `{{ outputs.poll_droplet.ip }}` to drive the machine directly.
    5. The `finally` block deletes the firewall and the droplet through `If` guards, so cleanup only targets resources that were actually created and runs whether the execution succeeded or failed.
    6. The `errors` block posts a Slack alert whenever anything fails, reminding the team that teardown already ran.

    The DigitalOcean API token is set once through `pluginDefaults` for the whole `io.kestra.plugin.digitalocean` group, so no task repeats credentials.

    ## What you get

    - A per-execution droplet with a unique, traceable hostname derived from the Kestra execution ID.
    - A hard guarantee that compute is destroyed at the end of every run, including failed ones, thanks to `finally`.
    - A per-run firewall so the ephemeral machine is never exposed to the internet beyond SSH from your admin range.
    - Region, size, image, and admin CIDR as flow inputs, so the same flow serves smoke tests on 1 vCPU and heavy batch jobs on dedicated CPU sizes.

    ## Who it's for

    - Data and platform engineers running nightly ETL, model training, or build jobs that need a clean machine per run without paying for idle time.
    - Teams replacing hand-rolled doctl scripts and cron with versioned, observable orchestration.
    - Anyone who has ever found a months-old forgotten droplet on the invoice.

    ## Why orchestrate this with Kestra

    The DigitalOcean console and doctl can create droplets, but neither can chain create, poll, firewall, execute, and destroy into one atomic unit with failure handling. A shell script dies halfway and leaks the VM; Kestra's `finally` block runs teardown no matter where the execution stopped, `LoopUntil` turns the asynchronous droplet boot into a synchronous step, and every run leaves a full audit trail of what was created, when, and what it cost in wall-clock time.

    ## Prerequisites

    - A DigitalOcean account and a personal access token with read and write scopes for droplets and firewalls.
    - A Slack incoming webhook for failure alerts.

    ### Secrets

    - `DIGITALOCEAN_TOKEN`: DigitalOcean personal access token.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL.

    ## Quick start

    1. Add the two secrets above to your Kestra namespace.
    2. Set `admin_cidr` to the network you actually SSH from.
    3. Replace the cloud-init `runcmd` in `create_droplet` with your real job.
    4. Execute the flow and watch the droplet appear, work, and disappear in the DigitalOcean console.

    ## How to extend

    - Replace the `run_workload` log with `io.kestra.plugin.fs.ssh.Command` to run commands over SSH on `{{ outputs.poll_droplet.ip }}` and stream their output into Kestra.
    - Add `io.kestra.plugin.digitalocean.droplet.Action` with `action: SNAPSHOT` before teardown to keep an image of the machine for debugging.
    - Attach a `io.kestra.plugin.digitalocean.volume.Create` and `volume.Attach` pair when the job needs scratch space larger than the droplet disk.
    - Trigger the flow from `io.kestra.plugin.core.trigger.Schedule` or a webhook to run the ephemeral machine on your release cadence.

    ## Links

    - [DigitalOcean plugin documentation](https://kestra.io/plugins/plugin-digitalocean)
    - [Kestra finally block](https://kestra.io/docs/workflow-components/finally)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - VM Provisioning
    - Infrastructure Automation
  ee: false
  demo: false
