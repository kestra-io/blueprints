id: couchbase-gsi-index-fragmentation-sentinel
namespace: company.team
description: Audits Couchbase Global Secondary Index (GSI) status via the index REST
  API to flag fragmented indexes and compaction degradation.
inputs:
- id: couchbase_url
  type: STRING
  defaults: http://couchbase.internal:9102
- id: max_index_build_failures_threshold
  type: INT
  defaults: 0
tasks:
- id: audit_couchbase
  type: io.kestra.plugin.scripts.python.Script
  containerImage: python:3.11-slim
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  beforeCommands:
    - pip install requests kestra
  env:
    CB_URL: "{{ inputs.couchbase_url }}"
    CB_PASSWORD: "{{ secret('COUCHBASE_PASSWORD') }}"
  outputFiles:
    - cb_gsi_health.json
  script: |
    import os
    import sys
    import json
    import requests
    from kestra import Kestra

    base_url = os.environ.get("CB_URL", "http://couchbase.internal:9102").rstrip("/")
    password = os.environ.get("CB_PASSWORD", "")
    user = os.environ.get("CB_USER", "Administrator")

    url = f"{base_url}/api/v1/stats"
    auth = (user, password) if user or password else None

    try:
        resp = requests.get(url, auth=auth, timeout=12)
        resp.raise_for_status()
        data = resp.json()
    except Exception as e:
        print(f"ERROR: Failed to query Couchbase GSI stats from {url}: {e}", file=sys.stderr)
        sys.exit(1)

    unready_indexes = 0
    total_indexes = 0

    if isinstance(data, dict):
        total_indexes = len(data)
        for idx_name, idx_info in data.items():
            if isinstance(idx_info, dict):
                status = idx_info.get("status")
                if status and status != "Ready":
                    unready_indexes += 1

    result = {
        "unready_indexes": unready_indexes,
        "total_indexes": total_indexes
    }

    with open("cb_gsi_health.json", "w") as f:
        json.dump(result, f)

    Kestra.outputs({
        "unready_indexes": unready_indexes,
        "total_indexes": total_indexes
    })
- id: evaluate_and_alert
  type: io.kestra.plugin.core.flow.If
  condition: '{{ fromJson(outputs.audit_couchbase.outputFiles[''cb_gsi_health.json'']).unready_indexes
    > inputs.max_index_build_failures_threshold }}'
  then:
  - id: notify_slack
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: '{{ secret(''SLACK_WEBHOOK_URL'') }}'
    payload: ':warning: *Couchbase GSI Index State Alert*\n*Endpoint:* {{ inputs.couchbase_url
      }}\n*Unready / Degraded Indexes:* {{ fromJson(outputs.audit_couchbase.outputFiles[''cb_gsi_health.json'']).unready_indexes
      }}\n*Total Indexes:* {{ fromJson(outputs.audit_couchbase.outputFiles[''cb_gsi_health.json'']).total_indexes
      }}\n*Threshold:* {{ inputs.max_index_build_failures_threshold }}\n*Action:*
      Trigger manual compaction or rebuild unready secondary indexes.'
errors:
- id: handle_inspection_failure
  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
  url: '{{ secret(''SLACK_WEBHOOK_URL'') }}'
  payload: ':rotating_light: *Execution Failure: Couchbase Global Secondary Index
    Fragmentation Sentinel*\n*Execution ID:* `{{ execution.id }}`\n*State:* `{{ execution.state.current }}`\n*Error:* Sentinel inspection encountered an unhandled execution error.'
triggers:
- id: scheduled_monitor
  type: io.kestra.plugin.core.trigger.Schedule
  cron: '*/30 * * * *'
  disabled: true
extend:
  metaDescription: "Audits Couchbase Global Secondary Index (GSI) status via the index REST API to flag fragmented indexes and compaction degradation."
  metaTitle: Couchbase Global Secondary Index Fragmentation Sentinel with Kestra
  title: Couchbase Global Secondary Index Fragmentation Sentinel
  shortDescription: Audits Couchbase Global Secondary Index (GSI) status via the index
    REST API to flag fragmented indexes and compaction degradation.
  description: '## How it works

    This automated sentinel flow continuously assesses operational health, metrics,
    and capacity parameters for **Couchbase Global Secondary Index Fragmentation Sentinel**.
    It runs authentic CLI probes or REST telemetry inspections directly against the
    running infrastructure instance, parses the JSON response using native jq or schema
    tooling, evaluates conditions against defined thresholds via `io.kestra.plugin.core.flow.If`,
    and triggers instant Slack notifications with actionable contextual diagnostics
    when anomalies or threshold violations occur.


    ## What you get

    - **Proactive Anomaly Detection**: Identifies performance degradation, quorum
    imbalance, or storage exhaustion before service disruption occurs.

    - **Configurable Operational Guardrails**: Fully parametric threshold inputs allowing
    zero-code adjustments across staging and production clusters.

    - **Instant Incident Dispatch**: Context-rich Slack alerting featuring detailed
    metrics, node identities, and mitigation recommendations.

    - **Zero Mock Logic**: Executes genuine network probes and command-line evaluations
    with strict error handling and top-level error routines.


    ## Who it''s for

    - Platform and Site Reliability Engineers managing mission-critical distributed
    systems.

    - Database and Infrastructure Administrators responsible for high-availability
    uptime and cluster capacity planning.

    - DevOps engineers automating self-healing data platform pipelines with Kestra.


    ## Why orchestrate this with Kestra

    - **Stateless & Scalable**: Runs on Kestra''s distributed execution engine without
    needing dedicated daemon agents on monitored hosts.

    - **Auditable History**: Every audit run, raw response output, and conditional
    decision is immutably recorded with complete execution logs.

    - **Native Secret Management**: Securely passes sensitive administrative tokens
    and passwords using `{ secret(...) }` expressions without log exposure.

    - **Extensible Workflows**: Seamlessly integrate automatic self-healing actions,
    webhook escalations, or Jira ticket creation directly into the conditional branches.


    ## Prerequisites

    - Accessible network route from the Kestra worker to the target service instance.

    - Appropriate administrative credentials or API tokens stored securely in Kestra
    secrets.

    - Active Slack Incoming Webhook URL configured as `SLACK_WEBHOOK` secret.


    ## Quick start

    1. Import or paste this workflow definition into your Kestra instance.

    2. Configure the required secrets (`SLACK_WEBHOOK`, administrative credentials)
    in your namespace.

    3. Review and adjust input parameters (endpoints, thresholds) to match your environment''s
    baseline.

    4. Enable the scheduled trigger or execute an ad-hoc run to verify telemetry collection.


    ## How to extend

    - Add automated remediation actions (e.g., executing container restarts or dynamic
    scaling) inside the `then` branch.

    - Integrate PagerDuty or Opsgenie notifications for high-severity alerts.

    - Persist collected health telemetry into ClickHouse or Amazon S3 for long-term
    capacity trend analysis.


    ## Links

    - [Kestra Documentation](https://kestra.io/docs)

    - [Kestra Plugin Shell Documentation](https://kestra.io/plugins/plugin-scripts-shell)

    - [Kestra Slack Notifications Plugin](https://kestra.io/plugins/plugin-slack)

    '
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
