id: dhis2-scheduled-job-failure-sentinel
namespace: company.team
description: |
  On a schedule, read-only check the background jobs of a DHIS2 health
  information system (analytics tables, data synchronisation, imports,
  notifications; nothing is run, changed or deleted) and classify them as
  HEALTHY, WARNING, CRITICAL or UNREACHABLE. Log quiet runs and page Slack
  when jobs fail or stay stuck, so dashboards and reports never silently show
  stale health data.

inputs:
  - id: dhis2_url
    type: STRING
    defaults: "https://dhis2.example.org"
    displayName: "DHIS2 URL"
    description: "Base URL of the DHIS2 instance (the one that serves /api), without a trailing slash."
  - id: lookback_hours
    type: INT
    defaults: 24
    displayName: "Lookback (hours)"
    description: "Jobs whose last run failed within this many hours, by the server's own clock, are counted."
  - id: stuck_hours
    type: INT
    defaults: 6
    displayName: "Stuck After (hours)"
    description: "A job still RUNNING this many hours after its last start counts as stuck."
  - id: critical_failed
    type: INT
    defaults: 3
    displayName: "Critical Failed Jobs"
    description: "At or above this many failed jobs in the lookback window, the check is classified CRITICAL. A failed enabled scheduled job is always CRITICAL."

triggers:
  - id: job_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check DHIS2 jobs every hour. Shipped disabled; enable it once dhis2_url and the DHIS2_USERNAME and DHIS2_PASSWORD secrets point at a real instance and a manual run has been verified.
    cron: "20 * * * *"
    disabled: true
    inputs:
      dhis2_url: "https://dhis2.example.org"

tasks:
  - id: read_system_info
    type: io.kestra.plugin.core.http.Request
    description: Read /api/system/info to confirm the endpoint is DHIS2 and to get the server's own date, which every time window below is measured against. This is a GET; nothing is changed.
    uri: "{{ inputs.dhis2_url }}/api/system/info"
    method: GET
    headers:
      Accept: application/json
    options:
      auth:
        type: BASIC
        username: "{{ secret('DHIS2_USERNAME') }}"
        password: "{{ secret('DHIS2_PASSWORD') }}"
      allowFailed: true
      timeout:
        connectTimeout: PT10S
        readIdleTimeout: PT30S
    retry:
      type: constant
      interval: PT15S
      maxAttempts: 3
    allowFailure: true

  - id: fetch_job_configurations
    type: io.kestra.plugin.core.http.Request
    description: Read every job configuration with its type, scheduling, status, last run and last result from /api/jobConfigurations. Skipped when /system/info did not answer.
    runIf: "{{ outputs.read_system_info.code is defined and outputs.read_system_info.code == 200 and (outputs.read_system_info.body | trim | startsWith('{')) }}"
    uri: "{{ inputs.dhis2_url }}/api/jobConfigurations?paging=false&fields=id,name,jobType,enabled,schedulingType,jobStatus,lastExecutedStatus,lastExecuted"
    method: GET
    headers:
      Accept: application/json
    options:
      auth:
        type: BASIC
        username: "{{ secret('DHIS2_USERNAME') }}"
        password: "{{ secret('DHIS2_PASSWORD') }}"
      allowFailed: true
      timeout:
        connectTimeout: PT10S
        readIdleTimeout: PT60S
    retry:
      type: constant
      interval: PT15S
      maxAttempts: 3
    allowFailure: true

  - id: classify_jobs
    type: io.kestra.plugin.core.debug.Return
    description: Classify the jobs in one jq query. DHIS2 returns times in the server's local time without an offset, so the lookback and stuck windows are measured against the server's own serverDate rather than Kestra's clock. A missing response, a non-200 code, a body that is not JSON, or an answer without a DHIS2 version become UNREACHABLE instead of looking healthy.
    format: >-
      {{ (outputs.read_system_info.code is not defined or outputs.read_system_info.code != 200
      or not (outputs.read_system_info.body | trim | startsWith('{'))
      or outputs.fetch_job_configurations is not defined or outputs.fetch_job_configurations.code is not defined
      or outputs.fetch_job_configurations.code != 200 or not (outputs.fetch_job_configurations.body | trim | startsWith('{')))
      ? '{"status":"UNREACHABLE","jobs":0,"failed":0,"failed_scheduled":0,"stuck":0,"failed_jobs":"none","stuck_jobs":"none"}'
      : ({'sys': fromJson(outputs.read_system_info.body), 'cfg': fromJson(outputs.fetch_job_configurations.body)} | jq('
      if (.sys.version // "") == "" or (.cfg.jobConfigurations | type) != "array"
      then {status: "UNREACHABLE", jobs: 0, failed: 0, failed_scheduled: 0, stuck: 0, failed_jobs: "none", stuck_jobs: "none"}
      else
      def epoch: .[0:19] + "Z" | fromdateiso8601;
      (.sys.serverDate | epoch) as $now
      | ($now - ' ~ (inputs.lookback_hours * 3600) ~ ') as $since
      | ($now - ' ~ (inputs.stuck_hours * 3600) ~ ') as $stuck_before
      | .cfg.jobConfigurations as $jobs
      | [$jobs[] | select(.lastExecutedStatus == "FAILED" and .lastExecuted != null and (.lastExecuted | epoch) >= $since)] as $failed
      | [$failed[] | select(.enabled == true and (.schedulingType == "CRON" or .schedulingType == "FIXED_DELAY"))] as $failed_scheduled
      | [$jobs[] | select(.jobStatus == "RUNNING" and .lastExecuted != null and (.lastExecuted | epoch) < $stuck_before)] as $stuck
      | {dhis2_version: .sys.version, server_date: .sys.serverDate, jobs: ($jobs | length),
      failed: ($failed | length), failed_scheduled: ($failed_scheduled | length), stuck: ($stuck | length),
      failed_jobs: (if ($failed | length) == 0 then "none" else ([$failed[] | .jobType] | group_by(.) | map(.[0] + " (" + (length | tostring) + ")") | join(", ")) end),
      failed_scheduled_jobs: (if ($failed_scheduled | length) == 0 then "none" else ([$failed_scheduled[] | .name] | join(", ")) end),
      stuck_jobs: (if ($stuck | length) == 0 then "none" else ([$stuck[] | .name + " since " + .lastExecuted[0:16]] | join(", ")) end),
      status: (if ($failed_scheduled | length) > 0 or ($stuck | length) > 0 or ($failed | length) >= ' ~ inputs.critical_failed ~ ' then "CRITICAL"
      elif ($failed | length) > 0 then "WARNING"
      else "HEALTHY" end)}
      end
      ') | first | toJson) }}

  - id: route_by_job_status
    type: io.kestra.plugin.core.flow.Switch
    description: Route to a quiet log when no job failed in the window and none is stuck, an informational Slack message for a few failed one-off jobs, or a Slack page when a scheduled job failed, failures pile up, a job is stuck, or DHIS2 could not be read.
    value: "{{ fromJson(outputs.classify_jobs.value).status }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          description: Log a quiet confirmation when no job failed in the lookback window and none is stuck.
          message: "DHIS2 jobs healthy: {{ fromJson(outputs.classify_jobs.value).jobs }} job configuration(s), none failed in the last {{ inputs.lookback_hours }} hour(s), none stuck (DHIS2 {{ fromJson(outputs.classify_jobs.value).dhis2_version }})."
      "WARNING":
        - id: alert_warning_jobs
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Post an informational Slack message listing the job types that failed.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "DHIS2 jobs WARNING: {{ fromJson(outputs.classify_jobs.value).failed }} job(s) failed in the last {{ inputs.lookback_hours }} hour(s): {{ fromJson(outputs.classify_jobs.value).failed_jobs }}. Check Data Administration > Scheduler on {{ inputs.dhis2_url }}. Execution {{ execution.id }}."
            }
      "CRITICAL":
        - id: alert_critical_jobs
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when an enabled scheduled job failed, failures crossed critical_failed, or a job is stuck; analytics and synced data may be stale.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "DHIS2 jobs CRITICAL: {{ fromJson(outputs.classify_jobs.value).failed }} failed job(s) in the last {{ inputs.lookback_hours }} hour(s) ({{ fromJson(outputs.classify_jobs.value).failed_jobs }}).{% if fromJson(outputs.classify_jobs.value).failed_scheduled > 0 %} Scheduled jobs that failed: {{ fromJson(outputs.classify_jobs.value).failed_scheduled_jobs }}.{% endif %}{% if fromJson(outputs.classify_jobs.value).stuck > 0 %} Stuck: {{ fromJson(outputs.classify_jobs.value).stuck_jobs }}.{% endif %} Dashboards and reports may show stale data. Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable_dhis2
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when DHIS2 could not be read, rejected the credentials, or did not answer like DHIS2.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "DHIS2 jobs UNREACHABLE: {{ inputs.dhis2_url }} did not return its system information and job configurations (server down, wrong URL, rejected credentials, or a page that is not DHIS2). Job status is unknown. Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        description: Log any classification outside the four known values, so a change in the jq query never fails silently.
        message: "DHIS2 scheduled job failure sentinel completed with an unexpected classification: {{ outputs.classify_jobs.value }}."

  - id: log_audit_result
    type: io.kestra.plugin.core.log.Log
    description: Record one audit line for every run, whichever branch fired, with both HTTP codes and the classification, so the check's own history stays queryable even if Slack delivery fails.
    message: "DHIS2 jobs audit: server={{ inputs.dhis2_url }} system_http={{ outputs.read_system_info.code ?? 'n/a' }} jobs_http={{ outputs.fetch_job_configurations.code ?? 'n/a' }} result={{ outputs.classify_jobs.value }} execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack when the sentinel flow itself fails outright, so a broken check is never mistaken for healthy DHIS2 jobs.
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "DHIS2 scheduled job failure sentinel flow {{ flow.id }} FAILED (execution {{ execution.id }}). Job status at {{ inputs.dhis2_url }} is unknown; check the task logs and the DHIS2 scheduler manually."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.classify_jobs is defined ? fromJson(outputs.classify_jobs.value).status : 'UNREACHABLE' }}"
  - id: jobs
    type: JSON
    value: "{{ outputs.classify_jobs is defined ? outputs.classify_jobs.value : '{\"status\":\"UNREACHABLE\"}' }}"

extend:
  title: "DHIS2 Scheduled Job Failure Sentinel"
  shortDescription: Read-only check of a DHIS2 health information system's background jobs on a schedule, paging Slack when analytics, sync or import jobs fail or get stuck.
  metaTitle: DHIS2 Scheduled Job Failure Sentinel for Kestra
  metaDescription: Check DHIS2 scheduled jobs on a schedule, change nothing, and alert Slack when analytics, sync or import jobs fail, get stuck, or the server is down.
  description: |
    DHIS2 is the health information system used by ministries of health and NGOs in more than 80 countries for routine reporting, disease surveillance and programme data. Its dashboards are only as fresh as its background jobs: the analytics tables export, data synchronisation with other instances, metadata sync, data imports and notifications. When one of these fails, DHIS2 records it in the scheduler, but dashboards keep showing yesterday's numbers and nobody is paged. This blueprint turns two read-only DHIS2 API calls into a scheduled job health gate: `/api/system/info` proves the server is answering and gives its own clock, `/api/jobConfigurations` returns every job with its last result, a single jq query counts failed and stuck jobs, and the result routes to a quiet log, an informational Slack note or a Slack page.

    ## How it works

    1. `read_system_info` (`io.kestra.plugin.core.http.Request`) reads `/api/system/info` with basic authentication. Only an answer with a DHIS2 `version` counts as a working server, and its `serverDate` becomes the reference clock. Every request is a GET with a timeout, three retries, `allowFailed: true` and `allowFailure: true`, so an outage never aborts the flow.
    2. `fetch_job_configurations` reads `/api/jobConfigurations` with only the fields the check needs: `jobType`, `enabled`, `schedulingType`, `jobStatus`, `lastExecutedStatus` and `lastExecuted`. A `runIf` skips it when `/system/info` did not answer.
    3. `classify_jobs` (`io.kestra.plugin.core.debug.Return`) checks both responses (a missing response, a non-200 code or a body that is not JSON is `UNREACHABLE`), then, against the server's own `serverDate`, counts the jobs whose last run `FAILED` within `lookback_hours`, the enabled scheduled jobs among them, and the jobs still `RUNNING` after `stuck_hours`. A failed enabled scheduled job, a stuck job, or at least `critical_failed` failures is `CRITICAL`; any other failure is `WARNING`; otherwise `HEALTHY`.
    4. `route_by_job_status` (`io.kestra.plugin.core.flow.Switch`) logs `HEALTHY` quietly, posts a Slack note for `WARNING`, pages Slack for `CRITICAL` and `UNREACHABLE`, and logs any unexpected value in `defaults`.
    5. `log_audit_result` writes one audit line per run with both HTTP codes and the classification. The flow-level `errors` block alerts Slack if the flow fails outright, and the `job_check` trigger runs every hour and ships `disabled: true`.

    ## What you get

    - A scheduled, read-only check of every DHIS2 background job, using only the Web API.
    - A `status` output (`HEALTHY` / `WARNING` / `CRITICAL` / `UNREACHABLE`) other flows can gate on, and a `jobs` JSON output with `jobs`, `failed`, `failed_scheduled`, `stuck`, the job types that failed, `dhis2_version` and `server_date`.
    - Slack messages that group failures by job type, for example `DATAVALUE_IMPORT (8)`, and name scheduled jobs and stuck jobs.
    - An audit log line on every run, so job health history survives a Slack outage.

    ## Who it's for

    - Health information system administrators and HMIS teams running DHIS2 for a country, state or programme.
    - Implementing partners who maintain DHIS2 instances and their synchronisation with other systems.
    - Data platform teams already using Kestra who want the same alerting for their DHIS2 servers.

    ## Why orchestrate this with Kestra

    DHIS2 keeps the result of each job, but only an administrator opening the scheduler sees it, and a failed analytics run is easy to miss until a programme manager asks why the dashboard has not moved. Kestra runs the same read-only check on a schedule, classifies all jobs in one typed status, keeps every run in the execution history, and routes it to the right channel, while the Switch branches are ready to grow into follow-up (a ticket for the HMIS team, a rerun after an approval) without changing the check.

    ## Prerequisites

    - A DHIS2 instance whose Web API is reachable from Kestra (tested on DHIS2 2.43).
    - A dedicated DHIS2 user for monitoring with the authority to view the scheduler (job configurations).
    - A Slack incoming webhook for the WARNING, CRITICAL, UNREACHABLE and flow-failure alerts.

    ### Secrets

    - `DHIS2_USERNAME` and `DHIS2_PASSWORD`: credentials of the monitoring user (HTTP basic authentication).
    - `SLACK_WEBHOOK`: Slack incoming webhook used for every alert branch and the flow-failure alert.

    In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_` and base64-encoded, then read in flows with `{{ secret('NAME') }}`, for example `SECRET_DHIS2_PASSWORD=$(echo -n '<password>' | base64)`.

    ## Quick start

    1. To try it without your own instance, point `dhis2_url` at the public DHIS2 demo listed on https://play.dhis2.org (it redirects to the current stable version) with the demo credentials published there. The demo usually has a few failed data import jobs, so the first run is not `HEALTHY`.
    2. Add `DHIS2_USERNAME`, `DHIS2_PASSWORD` and `SLACK_WEBHOOK` as secrets and run the flow once.
    3. Lower `lookback_hours` or raise `critical_failed` to see the other branches, then point the flow at your own instance.
    4. Enable `job_check` once pointed at the real server.

    ## How to extend

    - Filter `jobType` to the jobs that matter most (`ANALYTICS_TABLE`, `META_DATA_SYNC`, `DATA_SYNC`) and send each its own channel.
    - Read `/api/jobConfigurations/{id}/errors` for the failed jobs and include the first error in the Slack message.
    - Store `status` in the KV store and alert only on changes.

    ## Inputs

    - `dhis2_url`: type STRING, default `"https://dhis2.example.org"`.
    - `lookback_hours`: type INT, default `24`.
    - `stuck_hours`: type INT, default `6`.
    - `critical_failed`: type INT, default `3`.

    ## Outputs

    - `status`: one of `HEALTHY`, `WARNING`, `CRITICAL`, `UNREACHABLE`.
    - `jobs`: the full classification as JSON, for example `{"dhis2_version":"2.43.2","jobs":19,"failed":8,"failed_scheduled":0,"stuck":0,"failed_jobs":"DATAVALUE_IMPORT (8)","status":"CRITICAL",...}`.

    ## Links

    - [DHIS2 Web API: scheduling](https://docs.dhis2.org/en/develop/using-the-api/dhis-core-version-master/scheduling.html)
    - [DHIS2 public demo instances](https://play.dhis2.org)
    - [Kestra HTTP Request task](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Switch task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.switch)

    ## Pitfalls

    - DHIS2 returns job times in the server's local time without an offset. The flow measures every window against the server's own `serverDate`, so do not compare them with Kestra's clock if you extend it.
    - One-off jobs such as `DATAVALUE_IMPORT` are kept as disabled job configurations after they run. Their failures count as `WARNING` (or `CRITICAL` above `critical_failed`); a failed enabled scheduled job is always `CRITICAL`.
    - `jobStatus` and `lastExecuted` only describe the most recent run. A job that failed and then succeeded on its next run is reported as healthy, by design.
    - The check only reads. It never runs, enables or deletes jobs.
  tags:
    - Data
    - Business
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
