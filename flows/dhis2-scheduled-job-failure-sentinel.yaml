id: dhis2-scheduled-job-failure-sentinel
namespace: company.team
description: |
  On a schedule, check the background jobs of a DHIS2 health information
  system (analytics tables, data synchronisation, imports, notifications) and
  classify them as HEALTHY, WARNING, CRITICAL or UNREACHABLE. Log quiet runs,
  page Slack when jobs fail or stay stuck, then pause for someone to approve
  re-running the failed jobs through the DHIS2 API. Nothing is run without
  that approval.

inputs:
  - id: dhis2_url
    type: STRING
    defaults: "https://dhis2.example.org"
    displayName: "DHIS2 URL"
    description: "Base URL of the DHIS2 instance (the one that serves /api), without a trailing slash."
  - id: lookback_hours
    type: INT
    defaults: 24
    displayName: "Lookback (hours)"
    description: "Jobs whose last run failed within this many hours, by the server's own clock, are counted."
  - id: stuck_hours
    type: INT
    defaults: 6
    displayName: "Stuck After (hours)"
    description: "A job still RUNNING this many hours after its last start counts as stuck."
  - id: critical_failed
    type: INT
    defaults: 3
    displayName: "Critical Failed Jobs"
    description: "At or above this many failed jobs in the lookback window, the check is classified CRITICAL. A failed enabled scheduled job is always CRITICAL."
  - id: approval_wait
    type: DURATION
    defaults: PT2H
    displayName: "Retry Approval Window"
    description: "How long the execution waits for someone to approve re-running the failed jobs. With no answer in time, nothing is re-run."
  - id: max_retry_jobs
    type: INT
    defaults: 5
    displayName: "Max Jobs to Retry"
    description: "At most this many failed jobs, most recent first, are offered for a retry in one run."

triggers:
  - id: job_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check DHIS2 jobs every hour. Shipped disabled; enable it once dhis2_url and the DHIS2_USERNAME and DHIS2_PASSWORD secrets point at a real instance and a manual run has been verified.
    cron: "20 * * * *"
    disabled: true
    inputs:
      dhis2_url: "https://dhis2.example.org"

tasks:
  - id: read_system_info
    type: io.kestra.plugin.core.http.Request
    description: Read /api/system/info to confirm the endpoint is DHIS2 and to get the server's own date, which every time window below is measured against. This is a GET; nothing is changed.
    uri: "{{ inputs.dhis2_url }}/api/system/info"
    method: GET
    headers:
      Accept: application/json
    options:
      auth:
        type: BASIC
        username: "{{ secret('DHIS2_USERNAME') }}"
        password: "{{ secret('DHIS2_PASSWORD') }}"
      allowFailed: true
      timeout:
        connectTimeout: PT10S
        readIdleTimeout: PT30S
    retry:
      type: constant
      interval: PT15S
      maxAttempts: 3
    allowFailure: true

  - id: fetch_job_configurations
    type: io.kestra.plugin.core.http.Request
    description: Read every job configuration with its type, scheduling, status, last run and last result from /api/jobConfigurations. Skipped when /system/info did not answer.
    runIf: "{{ outputs.read_system_info.code is defined and outputs.read_system_info.code == 200 and (outputs.read_system_info.body | trim | startsWith('{')) }}"
    uri: "{{ inputs.dhis2_url }}/api/jobConfigurations?paging=false&fields=id,name,jobType,enabled,schedulingType,jobStatus,lastExecutedStatus,lastExecuted"
    method: GET
    headers:
      Accept: application/json
    options:
      auth:
        type: BASIC
        username: "{{ secret('DHIS2_USERNAME') }}"
        password: "{{ secret('DHIS2_PASSWORD') }}"
      allowFailed: true
      timeout:
        connectTimeout: PT10S
        readIdleTimeout: PT60S
    retry:
      type: constant
      interval: PT15S
      maxAttempts: 3
    allowFailure: true

  - id: classify_jobs
    type: io.kestra.plugin.core.debug.Return
    description: Classify the jobs in one jq query. DHIS2 returns times in the server's local time without an offset, so the lookback and stuck windows are measured against the server's own serverDate rather than Kestra's clock. A missing response, a non-200 code, a body that is not JSON, or an answer without a DHIS2 version become UNREACHABLE instead of looking healthy.
    format: >-
      {{ (outputs.read_system_info.code is not defined or outputs.read_system_info.code != 200
      or not (outputs.read_system_info.body | trim | startsWith('{'))
      or outputs.fetch_job_configurations is not defined or outputs.fetch_job_configurations.code is not defined
      or outputs.fetch_job_configurations.code != 200 or not (outputs.fetch_job_configurations.body | trim | startsWith('{')))
      ? '{"status":"UNREACHABLE","jobs":0,"failed":0,"failed_scheduled":0,"stuck":0,"failed_jobs":"none","stuck_jobs":"none","retry_ids":[],"retry_jobs":"none"}'
      : ({'sys': fromJson(outputs.read_system_info.body), 'cfg': fromJson(outputs.fetch_job_configurations.body)} | jq('
      if (.sys.version // "") == "" or (.cfg.jobConfigurations | type) != "array"
      then {status: "UNREACHABLE", jobs: 0, failed: 0, failed_scheduled: 0, stuck: 0, failed_jobs: "none", stuck_jobs: "none", retry_ids: [], retry_jobs: "none"}
      else
      def epoch: .[0:19] + "Z" | fromdateiso8601;
      (.sys.serverDate | epoch) as $now
      | ($now - ' ~ (inputs.lookback_hours * 3600) ~ ') as $since
      | ($now - ' ~ (inputs.stuck_hours * 3600) ~ ') as $stuck_before
      | .cfg.jobConfigurations as $jobs
      | [$jobs[] | select(.lastExecutedStatus == "FAILED" and .lastExecuted != null and (.lastExecuted | epoch) >= $since)] as $failed
      | [$failed[] | select(.enabled == true and (.schedulingType == "CRON" or .schedulingType == "FIXED_DELAY"))] as $failed_scheduled
      | [$jobs[] | select(.jobStatus == "RUNNING" and .lastExecuted != null and (.lastExecuted | epoch) < $stuck_before)] as $stuck
      | ($failed | sort_by(.lastExecuted) | reverse | .[0:' ~ inputs.max_retry_jobs ~ ']) as $retry
      | {dhis2_version: .sys.version, server_date: .sys.serverDate, jobs: ($jobs | length),
      failed: ($failed | length), failed_scheduled: ($failed_scheduled | length), stuck: ($stuck | length),
      failed_jobs: (if ($failed | length) == 0 then "none" else ([$failed[] | .jobType] | group_by(.) | map(.[0] + " (" + (length | tostring) + ")") | join(", ")) end),
      failed_scheduled_jobs: (if ($failed_scheduled | length) == 0 then "none" else ([$failed_scheduled[] | .name] | join(", ")) end),
      stuck_jobs: (if ($stuck | length) == 0 then "none" else ([$stuck[] | .name + " since " + .lastExecuted[0:16]] | join(", ")) end),
      retry_ids: [$retry[] | .id],
      retry_jobs: (if ($retry | length) == 0 then "none" else ([$retry[] | .name + " (" + .id + ")"] | join(", ")) end),
      status: (if ($failed_scheduled | length) > 0 or ($stuck | length) > 0 or ($failed | length) >= ' ~ inputs.critical_failed ~ ' then "CRITICAL"
      elif ($failed | length) > 0 then "WARNING"
      else "HEALTHY" end)}
      end
      ') | first | toJson) }}

  - id: route_by_job_status
    type: io.kestra.plugin.core.flow.Switch
    description: Route to a quiet log when no job failed in the window and none is stuck, an informational Slack message for a few failed one-off jobs, or a Slack page when a scheduled job failed, failures pile up, a job is stuck, or DHIS2 could not be read.
    value: "{{ fromJson(outputs.classify_jobs.value).status }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          description: Log a quiet confirmation when no job failed in the lookback window and none is stuck.
          message: "DHIS2 jobs healthy: {{ fromJson(outputs.classify_jobs.value).jobs }} job configuration(s), none failed in the last {{ inputs.lookback_hours }} hour(s), none stuck (DHIS2 {{ fromJson(outputs.classify_jobs.value).dhis2_version }})."
      "WARNING":
        - id: alert_warning_jobs
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Post an informational Slack message listing the job types that failed.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "DHIS2 jobs WARNING: {{ fromJson(outputs.classify_jobs.value).failed }} job(s) failed in the last {{ inputs.lookback_hours }} hour(s): {{ fromJson(outputs.classify_jobs.value).failed_jobs }}. Check Data Administration > Scheduler on {{ inputs.dhis2_url }}. To re-run {{ fromJson(outputs.classify_jobs.value).retry_jobs }}, resume execution {{ execution.id }} in Kestra with retry set to true before the approval window ends."
            }
      "CRITICAL":
        - id: alert_critical_jobs
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when an enabled scheduled job failed, failures crossed critical_failed, or a job is stuck; analytics and synced data may be stale.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "DHIS2 jobs CRITICAL: {{ fromJson(outputs.classify_jobs.value).failed }} failed job(s) in the last {{ inputs.lookback_hours }} hour(s) ({{ fromJson(outputs.classify_jobs.value).failed_jobs }}).{% if fromJson(outputs.classify_jobs.value).failed_scheduled > 0 %} Scheduled jobs that failed: {{ fromJson(outputs.classify_jobs.value).failed_scheduled_jobs }}.{% endif %}{% if fromJson(outputs.classify_jobs.value).stuck > 0 %} Stuck: {{ fromJson(outputs.classify_jobs.value).stuck_jobs }}.{% endif %} Dashboards and reports may show stale data.{% if fromJson(outputs.classify_jobs.value).retry_ids | length > 0 %} To re-run {{ fromJson(outputs.classify_jobs.value).retry_jobs }}, resume execution {{ execution.id }} in Kestra with retry set to true before the approval window ends.{% else %} Execution {{ execution.id }}.{% endif %}"
            }
      "UNREACHABLE":
        - id: alert_unreachable_dhis2
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when DHIS2 could not be read, rejected the credentials, or did not answer like DHIS2.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "DHIS2 jobs UNREACHABLE: {{ inputs.dhis2_url }} did not return its system information and job configurations (server down, wrong URL, rejected credentials, or a page that is not DHIS2). Job status is unknown. Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        description: Log any classification outside the four known values, so a change in the jq query never fails silently.
        message: "DHIS2 scheduled job failure sentinel completed with an unexpected classification: {{ outputs.classify_jobs.value }}."

  - id: wait_for_retry_approval
    type: io.kestra.plugin.core.flow.Pause
    description: When failed jobs were found, pause until an on-call person resumes the execution with retry set to true or false. If nobody answers within approval_wait, the execution resumes on its own and nothing is re-run. Skipped for HEALTHY, UNREACHABLE and stuck-only runs.
    runIf: "{{ fromJson(outputs.classify_jobs.value).retry_ids | length > 0 }}"
    pauseDuration: "{{ inputs.approval_wait }}"
    behavior: RESUME
    onResume:
      - id: retry
        type: BOOL
        defaults: false
        displayName: "Re-run the failed jobs"
        description: "Set to true to re-run the failed jobs listed in the alert through the DHIS2 API."

  - id: retry_if_approved
    type: io.kestra.plugin.core.flow.If
    description: Re-run the failed jobs only when the resume answer was true. A declined or timed-out pause (which has no answer) goes to else, so nothing is re-run without an explicit approval.
    condition: "{{ (outputs.wait_for_retry_approval.onResume.retry ?? false) == true }}"
    then:
      - id: retry_each_failed_job
        type: io.kestra.plugin.core.flow.Loop
        description: Only after an explicit approval, re-run each failed job one at a time, most recent first, up to max_retry_jobs. A timed-out pause has no resume answer and counts as not approved.
        values: "{{ fromJson(outputs.classify_jobs.value).retry_ids | toJson }}"
        concurrencyLimit: 1
        tasks:
          - id: run_job
            type: io.kestra.plugin.core.http.Request
            description: Ask DHIS2 to run the job now with POST /api/jobConfigurations/{id}/execute, the same as Run now in the scheduler. The job keeps its schedule.
            uri: "{{ inputs.dhis2_url }}/api/jobConfigurations/{{ item.value }}/execute"
            method: POST
            headers:
              Accept: application/json
            options:
              auth:
                type: BASIC
                username: "{{ secret('DHIS2_USERNAME') }}"
                password: "{{ secret('DHIS2_PASSWORD') }}"
              allowFailed: true
              timeout:
                connectTimeout: PT10S
                readIdleTimeout: PT30S
            allowFailure: true
        outputs:
          - id: job_id
            type: STRING
            description: The DHIS2 job configuration id that was re-run.
            value: "{{ item.value }}"
          - id: http_code
            type: INT
            description: The HTTP code DHIS2 answered the run request with; 0 when it did not answer.
            value: "{{ outputs.run_job.code ?? 0 }}"

      - id: alert_retry_requested
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Tell Slack which jobs DHIS2 accepted for a re-run; the next check reports whether they succeeded.
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": "DHIS2 retry approved: asked {{ inputs.dhis2_url }} to re-run {{ fromJson(outputs.classify_jobs.value).retry_jobs }}. Answers: {% for run in outputs.retry_each_failed_job.outputs %}{{ run.outputs.job_id }} HTTP {{ run.outputs.http_code }}{% if not loop.last %}, {% endif %}{% endfor %}. The next check shows whether they completed. Execution {{ execution.id }}."
          }
    else:
      - id: log_retry_not_approved
        type: io.kestra.plugin.core.log.Log
        description: Record that a retry was offered but declined or not answered in time, so nothing was re-run.
        runIf: "{{ fromJson(outputs.classify_jobs.value).retry_ids | length > 0 }}"
        message: "DHIS2 retry not approved for {{ fromJson(outputs.classify_jobs.value).retry_jobs }}; nothing was re-run."

  - id: log_audit_result
    type: io.kestra.plugin.core.log.Log
    description: Record one audit line for every run, whichever branch fired, with both HTTP codes and the classification, so the check's own history stays queryable even if Slack delivery fails.
    message: "DHIS2 jobs audit: server={{ inputs.dhis2_url }} system_http={{ outputs.read_system_info.code ?? 'n/a' }} jobs_http={{ outputs.fetch_job_configurations.code ?? 'n/a' }} result={{ outputs.classify_jobs.value }} retry_approved={{ fromJson(outputs.classify_jobs.value).retry_ids | length == 0 ? 'not offered' : (outputs.wait_for_retry_approval.onResume.retry ?? 'no answer') }} execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack when the sentinel flow itself fails outright, so a broken check is never mistaken for healthy DHIS2 jobs.
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "DHIS2 scheduled job failure sentinel flow {{ flow.id }} FAILED (execution {{ execution.id }}). Job status at {{ inputs.dhis2_url }} is unknown; check the task logs and the DHIS2 scheduler manually."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.classify_jobs is defined ? fromJson(outputs.classify_jobs.value).status : 'UNREACHABLE' }}"
  - id: jobs
    type: JSON
    value: "{{ outputs.classify_jobs is defined ? outputs.classify_jobs.value : '{\"status\":\"UNREACHABLE\"}' }}"

extend:
  title: "DHIS2 Scheduled Job Failure Sentinel"
  shortDescription: Check a DHIS2 health information system's background jobs on a schedule, page Slack when analytics, sync or import jobs fail or get stuck, and re-run the failed jobs after an on-call approval.
  metaTitle: DHIS2 Scheduled Job Failure Sentinel for Kestra
  metaDescription: Check DHIS2 scheduled jobs, alert Slack when analytics, sync or import jobs fail or get stuck, and re-run them through the DHIS2 API once someone approves.
  description: |
    DHIS2 is the health information system used by ministries of health and NGOs in more than 80 countries for routine reporting, disease surveillance and programme data. Its dashboards are only as fresh as its background jobs: the analytics tables export, data synchronisation with other instances, metadata sync, data imports and notifications. When one of these fails, DHIS2 records it in the scheduler, but dashboards keep showing yesterday's numbers and nobody is paged. This blueprint turns two read-only DHIS2 API calls into a scheduled job health gate: `/api/system/info` proves the server is answering and gives its own clock, `/api/jobConfigurations` returns every job with its last result, a single jq query counts failed and stuck jobs, and the result routes to a quiet log, an informational Slack note or a Slack page. When jobs failed, the execution then pauses for the person on call: one approval re-runs them through the DHIS2 API, and no answer means nothing is touched.

    ## How it works

    1. `read_system_info` (`io.kestra.plugin.core.http.Request`) reads `/api/system/info` with basic authentication. Only an answer with a DHIS2 `version` counts as a working server, and its `serverDate` becomes the reference clock. Every request is a GET with a timeout, three retries, `allowFailed: true` and `allowFailure: true`, so an outage never aborts the flow.
    2. `fetch_job_configurations` reads `/api/jobConfigurations` with only the fields the check needs: `jobType`, `enabled`, `schedulingType`, `jobStatus`, `lastExecutedStatus` and `lastExecuted`. A `runIf` skips it when `/system/info` did not answer.
    3. `classify_jobs` (`io.kestra.plugin.core.debug.Return`) checks both responses (a missing response, a non-200 code or a body that is not JSON is `UNREACHABLE`), then, against the server's own `serverDate`, counts the jobs whose last run `FAILED` within `lookback_hours`, the enabled scheduled jobs among them, and the jobs still `RUNNING` after `stuck_hours`. A failed enabled scheduled job, a stuck job, or at least `critical_failed` failures is `CRITICAL`; any other failure is `WARNING`; otherwise `HEALTHY`.
    4. `route_by_job_status` (`io.kestra.plugin.core.flow.Switch`) logs `HEALTHY` quietly, posts a Slack note for `WARNING`, pages Slack for `CRITICAL` and `UNREACHABLE`, and logs any unexpected value in `defaults`.
    5. When failed jobs were found, `wait_for_retry_approval` (`io.kestra.plugin.core.flow.Pause`) waits up to `approval_wait` for someone to resume the execution with `retry` set to true or false. The Slack alert names the jobs and the execution to resume.
    6. `retry_if_approved` (`io.kestra.plugin.core.flow.If`) re-runs the jobs only on an explicit `true`: `retry_each_failed_job` (`io.kestra.plugin.core.flow.Loop`, one job at a time, at most `max_retry_jobs`, most recent first) calls `POST /api/jobConfigurations/{id}/execute`, the same as Run now in the DHIS2 scheduler, and `alert_retry_requested` posts each job's HTTP answer to Slack. A `false` answer or a pause that times out goes to `log_retry_not_approved`, and nothing is re-run.
    7. `log_audit_result` writes one audit line per run with both HTTP codes, the classification and the retry answer. The flow-level `errors` block alerts Slack if the flow fails outright, and the `job_check` trigger runs every hour and ships `disabled: true`.

    ## What you get

    - A scheduled check of every DHIS2 background job, using only the Web API.
    - A human-approved retry: failed jobs are re-run only after someone on call says yes, and the result is posted back to Slack.
    - A `status` output (`HEALTHY` / `WARNING` / `CRITICAL` / `UNREACHABLE`) other flows can gate on, and a `jobs` JSON output with `jobs`, `failed`, `failed_scheduled`, `stuck`, the job types that failed, `dhis2_version` and `server_date`.
    - Slack messages that group failures by job type, for example `DATAVALUE_IMPORT (8)`, and name scheduled jobs and stuck jobs.
    - An audit log line on every run, so job health history survives a Slack outage.

    ## Who it's for

    - Health information system administrators and HMIS teams running DHIS2 for a country, state or programme.
    - Implementing partners who maintain DHIS2 instances and their synchronisation with other systems.
    - Data platform teams already using Kestra who want the same alerting for their DHIS2 servers.

    ## Why orchestrate this with Kestra

    DHIS2 keeps the result of each job, but only an administrator opening the scheduler sees it, and a failed analytics run is easy to miss until a programme manager asks why the dashboard has not moved. Kestra runs the same read-only check on a schedule, classifies all jobs in one typed status, keeps every run in the execution history, routes it to the right channel, and then holds the execution open for a person to decide on the retry. The approval, the re-run and its answer all land in the same execution, so the audit trail of who fixed what stays in one place.

    ## Prerequisites

    - A DHIS2 instance whose Web API is reachable from Kestra (tested on DHIS2 2.43).
    - A dedicated DHIS2 user with the authority to view the scheduler (job configurations) and, for the retry, to run jobs.
    - A Slack incoming webhook for the WARNING, CRITICAL, UNREACHABLE and flow-failure alerts.

    ### Secrets

    - `DHIS2_USERNAME` and `DHIS2_PASSWORD`: credentials of the monitoring user (HTTP basic authentication).
    - `SLACK_WEBHOOK`: Slack incoming webhook used for every alert branch and the flow-failure alert.

    In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_` and base64-encoded, then read in flows with `{{ secret('NAME') }}`, for example `SECRET_DHIS2_PASSWORD=$(echo -n '<password>' | base64)`.

    ## Quick start

    1. To try it without your own instance, point `dhis2_url` at the public DHIS2 demo listed on https://play.dhis2.org (it redirects to the current stable version) with the demo credentials published there. The demo is reset regularly, so it may or may not have failed jobs when you try it.
    2. Add `DHIS2_USERNAME`, `DHIS2_PASSWORD` and `SLACK_WEBHOOK` as secrets and run the flow once.
    3. When the run pauses, open the execution in Kestra and resume it with `retry` set to true or false. Lower `lookback_hours` or raise `critical_failed` to see the other branches, then point the flow at your own instance.
    4. Enable `job_check` once pointed at the real server.

    ## How to extend

    - Filter `jobType` to the jobs that matter most (`ANALYTICS_TABLE`, `META_DATA_SYNC`, `DATA_SYNC`) and send each its own channel.
    - Read `/api/jobConfigurations/{id}/errors` for the failed jobs and include the first error in the Slack message.
    - Store `status` in the KV store and alert only on changes.
    - Run a second check a few minutes after an approved retry and post whether the jobs completed.

    ## Inputs

    - `dhis2_url`: type STRING, default `"https://dhis2.example.org"`.
    - `lookback_hours`: type INT, default `24`.
    - `stuck_hours`: type INT, default `6`.
    - `critical_failed`: type INT, default `3`.
    - `approval_wait`: type DURATION, default `PT2H`.
    - `max_retry_jobs`: type INT, default `5`.

    ## Outputs

    - `status`: one of `HEALTHY`, `WARNING`, `CRITICAL`, `UNREACHABLE`.
    - `jobs`: the full classification as JSON, for example `{"dhis2_version":"2.43.2","jobs":19,"failed":8,"failed_scheduled":0,"stuck":0,"failed_jobs":"DATAVALUE_IMPORT (8)","retry_ids":["..."],"status":"CRITICAL",...}`.

    ## Links

    - [DHIS2 Web API: scheduling](https://docs.dhis2.org/en/develop/using-the-api/dhis-core-version-master/scheduling.html)
    - [DHIS2 public demo instances](https://play.dhis2.org)
    - [Kestra HTTP Request task](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Switch task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.switch)
    - [Kestra Pause task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.pause)

    ## Pitfalls

    - DHIS2 returns job times in the server's local time without an offset. The flow measures every window against the server's own `serverDate`, so do not compare them with Kestra's clock if you extend it.
    - One-off jobs such as `DATAVALUE_IMPORT` are kept as disabled job configurations after they run. Their failures count as `WARNING` (or `CRITICAL` above `critical_failed`); a failed enabled scheduled job is always `CRITICAL`.
    - `jobStatus` and `lastExecuted` only describe the most recent run. A job that failed and then succeeded on its next run is reported as healthy, by design.
    - The only write is the approved re-run. The flow never enables, edits or deletes jobs, and a declined or unanswered pause re-runs nothing.
    - A job that is still running when the retry is approved answers HTTP 409; the message shows the code, and the next check reports its outcome.
    - A re-run reruns the job as configured. If the cause (for example a missing remote server for data sync) is still there, it fails again and the next check reports it.
  tags:
    - Data
    - Business
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
