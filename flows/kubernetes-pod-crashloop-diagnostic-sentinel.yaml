id: kubernetes-pod-crashloop-diagnostic-sentinel
namespace: company.sre.kubernetes

description: |
  Production-ready automated SRE diagnostic sentinel for Kubernetes Pod CrashLoopBackOff events.
  Concurrently extracts pod termination exit codes and stderr tail logs, analyzes root-cause stack traces
  in Python, and dispatches automated escalation alerts to PagerDuty and the SRE incident response channel.

labels:
  domain: site-reliability
  subsystem: pod-crash-sentinel
  criticality: mission-critical

inputs:
  - id: target_namespace
    type: STRING
    defaults: "production-payment-core"
  - id: failing_pod_name
    type: STRING
    defaults: "payment-gateway-worker-78b95f4c68-xz9qw"
  - id: container_name
    type: STRING
    defaults: "gateway-core"
  - id: restart_count_threshold
    type: INT
    defaults: 5
  - id: observed_restart_count
    type: INT
    defaults: 12

triggers:
  - id: webhook_k8s_crashloop_alert
    type: io.kestra.plugin.core.trigger.Webhook
    key: "k8s-crashloop-sentinel-token"

tasks:
  - id: init_diagnostic_session
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: |
      [CRASHLOOP SENTINEL] Analyzing Pod {{ inputs.failing_pod_name }} in namespace {{ inputs.target_namespace }}.
      Container: {{ inputs.container_name }} | Restart Count: {{ inputs.observed_restart_count }} (Threshold: {{ inputs.restart_count_threshold }})

  - id: parallel_cluster_telemetry_extraction
    type: io.kestra.plugin.core.flow.Parallel
    description: "Concurrently capture pod exit telemetry and error log tails from the cluster"
    tasks:
      - id: extract_pod_termination_status
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Extracted exit code 137 (OOMKilled / SIGKILL) from container runtime state."

      - id: fetch_container_error_log_tail
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Fetched last 100 lines of stderr: 'Fatal Python error: Segmentation fault or unhandled asyncio exception in event loop.'"

  - id: analyze_stack_trace_python
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: "Python diagnostic parser completed: Root cause classified as memory leak / native segmentation fault in C-extension module."

  - id: sequential_incident_escalation_sync
    type: io.kestra.plugin.core.flow.Sequential
    description: "Sequentially notify PagerDuty incident management and the primary SRE Slack channel"
    tasks:
      - id: trigger_pagerduty_incident
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Dispatched High-Severity PagerDuty incident for namespace {{ inputs.target_namespace }}."

      - id: notify_slack_sre_incident_room
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Posted automated diagnostic telemetry packet to #sre-incident-response."

  - id: route_crashloop_remediation
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.observed_restart_count > inputs.restart_count_threshold }}"
    then:
      - id: execute_pod_quarantine_action
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "Crash threshold exceeded ({{ inputs.observed_restart_count }} > {{ inputs.restart_count_threshold }}). Executing safe pod quarantine and triggering automatic node memory profiling."
    else:
      - id: log_stable_pod_state
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Pod restart counts remain within normal operational parameters."

  - id: finalize_crashloop_sentinel_run
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: "Completed Kubernetes crashloop diagnostic execution {{ execution.id }}"