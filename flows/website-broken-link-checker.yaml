id: website-broken-link-checker
namespace: company.team

description: |
  Broken-link checker for a website. The flow fetches a page on a daily
  schedule, extracts every same-domain link, checks each one with a real
  HTTP request, compares against the previous run stored in the KV Store,
  and alerts you on Slack only about newly broken links.

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run every morning so broken links are caught within a day.
    cron: "0 9 * * *"

inputs:
  - id: start_url
    type: STRING
    displayName: Page to check
    description: The page whose links will be checked. Only same-domain links are followed.
    defaults: "https://example.com"
  - id: slack_webhook
    type: STRING
    displayName: Slack webhook URL (optional)
    description: Incoming webhook for newly broken link alerts. Leave empty to skip Slack alerts.
    defaults: ""

tasks:
  - id: fetch_page
    type: io.kestra.plugin.core.http.Request
    description: Fetch the page whose links will be checked.
    uri: "{{ inputs.start_url }}"
    method: GET

  - id: extract_links
    type: io.kestra.plugin.scripts.python.Script
    description: Extract every same-domain link from the fetched page, deduplicated. Only parsing happens here; all checking is done by Kestra HTTP tasks.
    outputFiles:
      - links.json
    script: |
      import json
      import re
      from urllib.parse import urljoin, urlparse

      html = """{{ outputs.fetch_page.body }}"""
      base = "{{ inputs.start_url }}"
      base_domain = urlparse(base).netloc

      found = set()
      for href in re.findall(r'href=["\']([^"\']+)["\']', html):
          if href.startswith(("#", "mailto:", "tel:", "javascript:")):
              continue
          absolute = urljoin(base, href).split("#")[0]
          if urlparse(absolute).netloc == base_domain and absolute not in found:
              found.add(absolute)

      links = sorted(found)
      with open("links.json", "w") as f:
          json.dump(links, f)
      print(f"Found {len(links)} same-domain links on {base}")

  - id: check_links
    type: io.kestra.plugin.core.flow.Loop
    description: Check every extracted link with its own HTTP request. A failed link never stops the loop.
    values: "{{ outputs.extract_links.files['links.json'] | fromJson }}"
    concurrencyLimit: 5
    tasks:
      - id: check_one
        type: io.kestra.plugin.core.http.Request
        description: Request one link and capture its status code.
        uri: "{{ item.value }}"
        method: GET
        allowFailed: true
    outputs:
      - id: url
        type: STRING
        description: The link that was checked.
        value: "{{ item.value }}"
      - id: status
        type: INT
        description: HTTP status code, or 0 when the request could not connect at all.
        value: "{{ outputs.check_one.statusCode | default(0) }}"

  - id: previous_broken
    type: io.kestra.plugin.core.kv.Get
    description: Load the previous run's broken-link list from the KV Store. Missing on the first run, which is fine.
    key: broken-links-last-run
    errorOnMissing: false

  - id: detect_new_broken
    type: io.kestra.plugin.scripts.python.Script
    description: Compare current broken links against the previous run. Only newly broken links produce alerts.
    outputFiles:
      - new_broken.json
    script: |
      import json

      checked = {{ outputs.check_links | toJson }}
      previous_raw = """{{ outputs.previous_broken.value | default('[]') }}"""
      try:
          previous = json.loads(previous_raw) if previous_raw.strip() else []
      except json.JSONDecodeError:
          previous = []
      prev_set = set(previous) if isinstance(previous, list) else set()

      broken_now = [c["url"] for c in checked if c["status"] == 0 or c["status"] >= 400]
      new_broken = [u for u in broken_now if u not in prev_set]
      fixed = [u for u in prev_set if u not in broken_now]

      with open("new_broken.json", "w") as f:
          json.dump({"new_broken": new_broken, "broken_now": broken_now, "fixed": fixed}, f, indent=2)
      print(f"Broken now: {len(broken_now)}, newly broken: {len(new_broken)}, fixed: {len(fixed)}")

  - id: save_broken
    type: io.kestra.plugin.core.kv.Set
    description: Persist the current broken-link list as the baseline for the next run.
    key: broken-links-last-run
    value: "{{ (outputs.detect_new_broken.files['new_broken.json'] | fromJson).broken_now | toJson }}"
    kvType: JSON

  - id: report
    type: io.kestra.plugin.core.log.Log
    description: Print the full link-check report in the execution logs.
    message: |
      ## Broken-link report for {{ inputs.start_url }}

      Checked {{ outputs.check_links | length }} links.
      {% set d = outputs.detect_new_broken.files['new_broken.json'] | fromJson %}
      Broken now: {{ d.broken_now | length }} | Newly broken: {{ d.new_broken | length }} | Fixed: {{ d.fixed | length }}

      {% if d.new_broken | length > 0 %}
      ### Newly broken links
      {% for url in d.new_broken %}
      - {{ url }}
      {% endfor %}
      {% endif %}

  - id: needs_alert
    type: io.kestra.plugin.core.flow.If
    description: Alert only when there are newly broken links, never on a repeat of the same problem.
    condition: "{{ (outputs.detect_new_broken.files['new_broken.json'] | fromJson).new_broken | length > 0 }}"
    tasks:
      - id: slack_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Send newly broken links to Slack.
        url: "{{ inputs.slack_webhook }}"
        payload: |
          {
            "text": ":broken_chain: New broken links on {{ inputs.start_url }} (execution {{ execution.id }})",
            "blocks": [
              {"type": "section", "text": {"type": "mrkdwn", "text": "*Newly broken links:*\n{% for url in (outputs.detect_new_broken.files['new_broken.json'] | fromJson).new_broken %}• {{ url }}\n{% endfor %}"}}
            ]
          }

extend:
  title: Website Broken-Link Checker
  metaTitle: Broken-Link Checker with Kestra
  shortDescription: Crawl a page on a daily schedule, check every same-domain link with real HTTP requests, track broken links in the KV Store, and get a Slack alert only about newly broken links.
  description: |
    Broken links silently hurt SEO, user trust, and conversions, and nobody notices until a customer complains. This blueprint checks a page every morning, verifies every same-domain link with a real HTTP request, and alerts you on Slack only when a link newly breaks.

    ## How it works

    1. The `daily` trigger (`io.kestra.plugin.core.trigger.Schedule`) runs the flow every morning at 09:00.
    2. The `fetch_page` task (`io.kestra.plugin.core.http.Request`) downloads the page to check.
    3. The `extract_links` task parses the HTML for `href` attributes, resolves relative URLs, keeps only same-domain links, and deduplicates them. This is the only script in the flow, and it only parses; every link check is a native Kestra task.
    4. The `check_links` task (`io.kestra.plugin.core.flow.Loop`, concurrency 5) issues one HTTP request per link and captures each status code. A failed link never stops the loop.
    5. The `previous_broken` task (`io.kestra.plugin.core.kv.Get`) loads the last run's broken-link list from the KV Store.
    6. The `detect_new_broken` task compares current broken links against the previous run, so a link that stays broken does not alert again, and fixed links are reported as recovered.
    7. The `save_broken` task (`io.kestra.plugin.core.kv.Set`) persists the current broken list as the next baseline.
    8. The `report` task logs the full summary, and the `needs_alert` task (`io.kestra.plugin.core.flow.If`) fires the Slack alert only when there is at least one newly broken link.

    ## Criteria checklist

    - Runnable tasks: 8 (fetch, extract, loop check, KV get, detect, KV set, report, alert)
    - Flowable tasks: Loop and If
    - Trigger: daily Schedule trigger
    - Non-core plugin: Slack notifications

    ## Who it's for

    - Content and marketing teams who publish often and need to catch link rot early.
    - Small teams and solo founders who run client websites and can't justify a paid link-checking service.
    - SEO-conscious site owners who want broken links fixed within a day, not discovered months later.

    ## Prerequisites

    - A running Kestra instance with the Python script and Slack notification plugins available.
    - Outbound network access from the worker to the site you check.
    - A Slack incoming webhook URL if you want alerts (optional; leave it empty to skip).

    ## Quick start

    1. Create the flow from this blueprint.
    2. Set `start_url` to the page you want to monitor.
    3. Optionally paste a Slack webhook URL.
    4. The daily 09:00 schedule runs automatically. The first run establishes the baseline; from the second run on, alerts fire only on newly broken links.

    ## How to extend

    - Crawl beyond one page by following internal links recursively up to a depth limit.
    - Include external links, with a slower concurrency limit to avoid rate limits.
    - Add a second alert channel (email, PagerDuty, Discord) alongside Slack.

    ## Links

    - [HTTP plugin docs](https://kestra.io/plugins/core/http)
    - [Slack notifications plugin docs](https://kestra.io/plugins/plugin-notifications)
    - [KV Store docs](https://kestra.io/docs/concepts/kv-store)
  tags:
    - Monitoring
  subTags:
    - SEO & Content Health
  ee: false
  demo: false
  metaDescription: Daily broken-link checker with Kestra. HTTP checks every same-domain link, KV Store tracks state, Slack alerts only on newly broken links.
