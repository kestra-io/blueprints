id: kubernetes-cilium-bgp-peering-session-state-sentinel
namespace: company.networking

description: |
  Audits Cilium BGP Peering node states across Kubernetes clusters, alerting network administrators on Slack when peer sessions drop or route convergence stalls.

concurrency:
  limit: 1

inputs:
  - id: cluster_name
    type: STRING
    displayName: Cluster Name
    defaults: "k8s-prod-dc-west"
    description: Identifier for the target Kubernetes bare-metal or cloud cluster.

  - id: gateway_node_name
    type: STRING
    displayName: Gateway Node Name
    defaults: "k8s-worker-gw-01"
    description: Target Kubernetes gateway node name hosting BGP control plane peering sessions.

  - id: expected_peer_count
    type: INT
    displayName: Expected Peer Count
    defaults: 4
    description: Expected number of active Top-of-Rack (ToR) BGP peer sessions per node.

  - id: alert_on_degraded
    type: BOOL
    displayName: Alert on Degraded
    defaults: true
    description: Whether to dispatch automated Slack incident notifications when BGP sessions drop.

tasks:
  - id: scan_cilium_bgp_peers
    type: io.kestra.plugin.scripts.python.Script
    description: Queries CiliumNode Kubernetes custom resource and audits BGP peering sessions.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      CLUSTER_NAME: "{{ inputs.cluster_name }}"
      GATEWAY_NODE: "{{ inputs.gateway_node_name }}"
      EXPECTED_PEERS: "{{ inputs.expected_peer_count }}"
      KUBERNETES_API_SERVER: "{{ secret('KUBERNETES_API_SERVER') }}"
      KUBERNETES_SERVICE_ACCOUNT_TOKEN: "{{ secret('KUBERNETES_SERVICE_ACCOUNT_TOKEN') }}"
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      cluster = os.environ.get("CLUSTER_NAME", "k8s-prod-dc-west").strip()
      node_name = os.environ.get("GATEWAY_NODE", "k8s-worker-gw-01").strip()
      expected_peers = int(os.environ.get("EXPECTED_PEERS", 4))
      api_server = os.environ.get("KUBERNETES_API_SERVER", "").rstrip("/")
      token = os.environ.get("KUBERNETES_SERVICE_ACCOUNT_TOKEN", "")

      if not api_server or not token:
          print("ERROR: KUBERNETES_API_SERVER and KUBERNETES_SERVICE_ACCOUNT_TOKEN secrets must be configured.", file=sys.stderr)
          sys.exit(1)

      headers = {"Authorization": f"Bearer {token}", "Accept": "application/json"}
      url = f"{api_server}/apis/cilium.io/v2/ciliumnodes/{node_name}"
      print(f"Querying CiliumNode status from {url}...")

      try:
          resp = requests.get(url, headers=headers, timeout=15, verify=False)
          resp.raise_for_status()
          data = resp.json()
      except Exception as e:
          print(f"ERROR: Failed to query CiliumNode CRD at {url}: {e}", file=sys.stderr)
          sys.exit(1)

      status = data.get("status", {})
      bgp_status = status.get("bgp", {})
      peers = bgp_status.get("peers", []) or bgp_status.get("peer-states", [])

      total_peers = len(peers)
      unhealthy = [p for p in peers if p.get("state") != "Established"]
      unhealthy_count = len(unhealthy)
      has_degraded = unhealthy_count > 0 or total_peers < expected_peers
      unhealthy_ips = [p.get("peer_ip", p.get("peerAddress", "unknown")) for p in unhealthy]

      report = {
          "cluster_name": cluster,
          "node_name": node_name,
          "total_peers": total_peers,
          "expected_peers": expected_peers,
          "unhealthy_peers_count": unhealthy_count,
          "unhealthy_peers": unhealthy,
          "has_degraded_peers": has_degraded,
          "recommended_action": f"cilium bgp peers --node {node_name} && kubectl describe ciliumnode {node_name}"
      }

      with open("cilium_bgp_report.json", "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)

      print(f"Audited Cilium BGP on {node_name}: {unhealthy_count}/{total_peers} down. Degraded: {has_degraded}")
      Kestra.outputs({
          "cluster_name": cluster,
          "node_name": node_name,
          "total_peers": total_peers,
          "unhealthy_peers_count": unhealthy_count,
          "unhealthy_neighbors": json.dumps(unhealthy_ips),
          "has_degraded_peers": has_degraded
      })

  - id: check_degraded_bgp_peers
    type: io.kestra.plugin.core.flow.If
    description: Branch execution based on whether audited operational metrics breached configured tolerance thresholds.
    condition: "{{ outputs.scan_cilium_bgp_peers.vars.has_degraded_peers and inputs.alert_on_degraded }}"
    then:
      - id: notify_network_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority incident notifications to network operations teams on Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#netops-alerts",
            "text": "CRITICAL: Cilium BGP Peering Session Degradation on Node `{{ outputs.scan_cilium_bgp_peers.vars.node_name }}` (Cluster: `{{ outputs.scan_cilium_bgp_peers.vars.cluster_name }}`). Unhealthy Peers: {{ outputs.scan_cilium_bgp_peers.vars.unhealthy_peers_count }}/{{ outputs.scan_cilium_bgp_peers.vars.total_peers }} (Expected: {{ inputs.expected_peer_count }}). Down Neighbors: {{ outputs.scan_cilium_bgp_peers.vars.unhealthy_neighbors }}."
          }
    else:
      - id: log_healthy_bgp_status
        type: io.kestra.plugin.core.log.Log
        description: Records healthy state in execution history when operational parameters remain within nominal limits.
        message: "Cilium BGP peering nominal on {{ outputs.scan_cilium_bgp_peers.vars.node_name }}: all {{ outputs.scan_cilium_bgp_peers.vars.total_peers }} sessions Established."

triggers:
  - id: scheduled_bgp_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

outputs:
  - id: cluster_name
    type: STRING
    description: Target Kubernetes cluster identifier.
    value: "{{ outputs.scan_cilium_bgp_peers.vars.cluster_name }}"
  - id: node_name
    type: STRING
    description: Gateway node inspected.
    value: "{{ outputs.scan_cilium_bgp_peers.vars.node_name }}"
  - id: total_peers
    type: INT
    description: Total BGP peers configured on node.
    value: "{{ outputs.scan_cilium_bgp_peers.vars.total_peers }}"
  - id: unhealthy_peers_count
    type: INT
    description: Count of non-Established BGP peer sessions.
    value: "{{ outputs.scan_cilium_bgp_peers.vars.unhealthy_peers_count }}"
  - id: has_degraded_peers
    type: BOOLEAN
    description: True if BGP peering is degraded, false otherwise.
    value: "{{ outputs.scan_cilium_bgp_peers.vars.has_degraded_peers }}"

extend:
  title: Kubernetes Cilium BGP Peering Session State Sentinel
  metaTitle: Kubernetes Cilium BGP Peering Sentinel
  shortDescription: Audits Cilium BGP Peering node states across Kubernetes clusters, alerting network administrators on Slack when peer sessions drop or route convergence stalls.
  metaDescription: Audits Cilium BGP Peering node states across Kubernetes clusters, alerting network administrators on Slack when peer sessions drop or route convergence stalls.
  description: |
    Automates continuous health surveillance of Cilium BGP control plane peering sessions across bare-metal and hybrid cloud Kubernetes clusters.

    ## How it works
    1. Periodically queries the Kubernetes API server for the target CiliumNode custom resource.
    2. Inspects BGP peer connection states and compares against the expected neighbor threshold.
    3. Evaluates session health and triggers instant Slack incident notifications when peer links drop or flap.

    ## Prerequisites
    - Cilium CNI installed with BGP Control Plane enabled.
    - Secrets `KUBERNETES_API_SERVER` and `KUBERNETES_SERVICE_ACCOUNT_TOKEN` configured.
    - Secret `SLACK_WEBHOOK_URL` configured for incident alerts.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Configure cluster credentials in Kestra secrets.
    3. Run the workflow to inspect BGP peer states.

    ## Links
    - [Cilium BGP Control Plane Documentation](https://docs.cilium.io/en/stable/network/bgp-control-plane/)
    - [Kestra Python Plugin](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Kubernetes Operations
    - Monitoring & Alerting
  ee: false
  demo: false
