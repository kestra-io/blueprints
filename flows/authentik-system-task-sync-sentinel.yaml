id: authentik-system-task-sync-sentinel
namespace: company.infrastructure

inputs:
  - id: authentik_url
    type: STRING
    description: Base URL for the Authentik instance (e.g. https://auth.company.com or http://authentik-server:9000)
    defaults: "http://authentik-server:9000"

  - id: auto_retry
    type: BOOLEAN
    description: Whether to automatically trigger task retry for failed background jobs
    defaults: false

  - id: dry_run
    type: BOOLEAN
    description: When true, audits failing tasks without dispatching retry POST requests
    defaults: true

  - id: slack_channel
    type: STRING
    description: Slack notification channel for operational security alerts and audit reports
    defaults: "#secops-alerts"

triggers:
  - id: every_fifteen_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_tasks
    type: io.kestra.plugin.core.http.Request
    description: Queries Authentik task API to inspect status and health of background worker tasks
    uri: "{{ inputs.authentik_url }}/api/v3/tasks/tasks/"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('AUTHENTIK_API_TOKEN') }}"
      Accept: "application/json"
    contentType: APPLICATION_JSON
    allowFailure: true

  - id: classify_status
    type: io.kestra.plugin.core.debug.Return
    description: Evaluates task statuses into operational health tiers
    format: |
      {% if outputs.probe_tasks.body is null %}
      PROBE_FAILED
      {% else %}
        {% set failed_tasks = [] %}
        {% set warning_tasks = [] %}
        {% for task in outputs.probe_tasks.body %}
          {% if task.status == 'error' or task.status == 'ERROR' %}
            {% set failed_tasks = failed_tasks | concat([task]) %}
          {% elseif task.status == 'warning' or task.status == 'WARNING' %}
            {% set warning_tasks = warning_tasks | concat([task]) %}
          {% endif %}
        {% endfor %}
        {% if failed_tasks | length > 0 %}
        CRITICAL
        {% elseif warning_tasks | length > 0 %}
        WARNING
        {% else %}
        HEALTHY
        {% endif %}
      {% endif %}

  - id: route_by_status
    type: io.kestra.plugin.core.flow.Switch
    description: Routes downstream remediation and alerting based on health classification
    value: "{{ outputs.classify_status.value | trim }}"
    cases:
      CRITICAL:
        - id: alert_critical_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Dispatches high-severity incident notification to Slack with failing task names
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "🚨 *AUTHENTIK IDENTITY TASK FAILURE ALERT*\n*Status:* `CRITICAL`\n*Instance:* `{{ inputs.authentik_url }}`\n*Auto-Retry:* `{{ inputs.auto_retry }}` (Dry-run: `{{ inputs.dry_run }}`)\n*Details:* Background tasks in Authentik have failed (LDAP sync, certificate rotation, or session cleanup). Immediate investigation required.\n*Execution ID:* `{{ execution.id }}`"
            }

        - id: check_remediation
          type: io.kestra.plugin.core.flow.If
          description: Validates whether automated task retry is authorized
          condition: "{{ inputs.auto_retry == true and inputs.dry_run == false }}"
          then:
            - id: retry_tasks
              type: io.kestra.plugin.core.flow.Loop
              description: Iterates over failing tasks to trigger background retries
              values: "{{ outputs.probe_tasks.body | filter(t -> t.status == 'error' or t.status == 'ERROR') }}"
              tasks:
                - id: trigger_retry
                  type: io.kestra.plugin.core.http.Request
                  description: Dispatches POST request to retry the failing task
                  uri: "{{ inputs.authentik_url }}/api/v3/tasks/tasks/{{ item.value.uid | default(item.value.task_name) }}/retry/"
                  method: POST
                  headers:
                    Authorization: "Bearer {{ secret('AUTHENTIK_API_TOKEN') }}"
                    Accept: "application/json"
                  contentType: APPLICATION_JSON

            - id: log_retry_executed
              type: io.kestra.plugin.core.log.Log
              message: "Automated retry initiated for failing Authentik background tasks."
          else:
            - id: log_remediation_bypassed
              type: io.kestra.plugin.core.log.Log
              message: "Automated retry bypassed (auto_retry={{ inputs.auto_retry }}, dry_run={{ inputs.dry_run }}). Failing tasks remain queued."

      WARNING:
        - id: alert_warning_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Dispatches warning notification for degraded background tasks
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "⚠️ *AUTHENTIK TASK HEALTH WARNING*\n*Status:* `WARNING`\n*Instance:* `{{ inputs.authentik_url }}`\n*Details:* Non-critical warnings detected in Authentik system tasks.\n*Execution ID:* `{{ execution.id }}`"
            }

      PROBE_FAILED:
        - id: alert_probe_failed
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Alerts on HTTP or authentication failure reaching Authentik API
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "🔥 *AUTHENTIK SENTINEL PROBE FAILED*\n*Target:* `{{ inputs.authentik_url }}`\n*Failure:* Unable to connect or authenticate to Authentik task API.\n*Execution ID:* `{{ execution.id }}`"
            }

      HEALTHY:
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "All Authentik background tasks and scheduled routines are operating normally."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Emits immutable audit summary record
    message: "Authentik sentinel finished. Result: {{ outputs.classify_status.value | trim }} | Instance: {{ inputs.authentik_url }} | Execution: {{ execution.id }}"

errors:
  - id: alert_flow_crash
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Intercepts unhandled flow execution errors
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "💥 *AUTHENTIK SENTINEL EXECUTION CRASH*\n*Flow ID:* `{{ flow.id }}`\n*Execution ID:* `{{ execution.id }}`\n*Namespace:* `{{ flow.namespace }}`\n*Error:* Unexpected failure halted workflow execution."
      }

extend:
  title: Authentik Background Task & Certificate Sync Sentinel
  metaTitle: Authentik Background Task & Certificate Sync Sentinel | Kestra
  shortDescription: Audits Authentik background worker tasks for failures in LDAP synchronization or certificate renewal and automates guarded retries.
  metaDescription: Audit Authentik background worker tasks, route failures to Slack, and safely retry stalled LDAP synchronization or certificate renewal routines.
  description: |
    Authentik is an open-source Identity Provider focused on flexibility and security. Production deployments rely on background worker tasks to synchronize external LDAP and Active Directory user directories, renew ACME and SAML signing certificates, prune expired user sessions, and sync SCIM identities. When background tasks encounter upstream directory timeouts, TLS handshakes with expiring authorities, or database transaction locks, Authentik flags them with error states. Because task failures in an identity plane operate quietly in the background, administrators often discover broken directory syncs or expired signing certificates only after user authentications fail. This blueprint provides a continuous sentinel that monitors the Authentik task management API, alerts security teams before federation fails, and triggers safe, guarded retries when enabled.

    ## How it works

    1. Scheduled trigger (`every_fifteen_minutes`) initiates background auditing every 15 minutes, with manual on-demand execution supported via inputs.
    2. Diagnostic probe (`probe_tasks`) connects to the Authentik REST API endpoint (`/api/v3/tasks/tasks/`) using bearer token authentication to retrieve execution statuses of all background workers.
    3. Classification step (`classify_status`) processes task state arrays using Pebble template filters, assigning the run to `HEALTHY`, `WARNING`, `CRITICAL`, or `PROBE_FAILED`.
    4. Flow router (`route_by_status`) switches downstream execution paths based on the classified operational health tier.
    5. On `CRITICAL` state, `alert_critical_slack` dispatches an incident alert to the configured Slack channel with target instance details and execution metadata.
    6. Guarded remediation (`check_remediation`) evaluates whether `auto_retry` is enabled and `dry_run` is disabled. If approved, `retry_tasks` loops across failing tasks and issues authenticated `POST` requests to the task retry endpoint (`/api/v3/tasks/tasks/{task_id}/retry/`).
    7. On `PROBE_FAILED` or API unreachable states, dedicated alerts notify administrators of connectivity degradation or expired API tokens.
    8. Audit log task (`log_audit_summary`) outputs a structured record documenting the execution outcome, health tier, and run lineage.

    ## What you get

    - Proactive automated detection of failed LDAP synchronization, SAML signing certificate renewal, and session cleanup tasks.
    - Actionable incident alerts routed to Slack with instance URLs and failure diagnostics.
    - Guarded auto-remediation capability that triggers authenticated task retries without manual admin console login.
    - Complete dry-run safety controls ensuring remediation actions are strictly previewed by default.
    - Resilient execution with flow-level error handlers intercepting unexpected HTTP network faults.

    ## Who it's for

    - Identity and Access Management (IAM) Engineers administering enterprise Authentik deployments.
    - Security Operations (SecOps) teams maintaining continuous user directory synchronization.
    - Site Reliability Engineers (SREs) monitoring single sign-on (SSO) and identity plane health.

    ## Why orchestrate this with Kestra

    - Declarative YAML definition unifies identity monitoring, notification routing, and automated self-healing into version-controlled GitOps workflows.
    - Centralized secret management protects Authentik administrative API tokens from exposure in scripts, logs, and external monitors.
    - Built-in conditional routing and looping isolate discovery, dry-run safety gates, and remediation calls without custom wrapper daemons.
    - Complete execution audit trails provide historical visibility into task failure frequencies and recovery durations for compliance audits.
    - Cloud-native scheduling and error-trapping ensure continuous sentinel operation independent of external cron infrastructure.

    ## Prerequisites

    - Authentik server (v2023.1+) with administrative API access.
    - Authentik API token associated with an administrator account or service account with `tasks.view_task` and `tasks.retry_task` permissions.
    - Slack incoming webhook URL for notification delivery.

    ### Secrets

    - `AUTHENTIK_API_TOKEN`: API token for authenticating against the Authentik REST API.
    - `SLACK_WEBHOOK_URL`: HTTPS incoming webhook URL for the security alert Slack channel.

    ## Quick start

    1. Configure `AUTHENTIK_API_TOKEN` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Deploy this blueprint to your Kestra instance and execute an initial manual run with `dry_run: true` to confirm API connectivity.
    3. Review the execution logs in the Kestra UI to verify Authentik background task payloads are parsed successfully.
    4. Enable the `every_fifteen_minutes` schedule trigger to establish automated continuous surveillance.

    ## How to extend

    - Add Prometheus exporter checks via `io.kestra.plugin.prometheus` to correlate task failures with worker memory and queue backlogs.
    - Integrate PagerDuty incident creation via `io.kestra.plugin.notifications.pagerduty.PagerDutyAlert` for sustained directory sync outages.
    - Connect downstream webhook notifications to identity monitoring portals or corporate SIEM platforms.

    ## Links

    - [Authentik REST API Documentation](https://goauthentik.io/docs/developer-docs/api/)
    - [Authentik Task Management Reference](https://goauthentik.io/docs/troubleshooting/tasks)
    - [Kestra HTTP Plugin Documentation](https://kestra.io/plugins/core/http)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-notifications)
  tags:
    - Infrastructure
  subTags:
    - Incident Response
    - Monitoring & Alerting
  ee: false
  demo: false
