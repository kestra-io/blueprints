id: surrealdb-orphaned-graph-edge-cleanup-guard
namespace: company.team

description: |
  SurrealDB does not enforce referential integrity on RELATE. An edge can be created against an id
  that was never written. An import can load edges ahead of their vertices. A restore can drop a
  vertex table. Any of these leaves edge records that still carry a target id while the record on
  the other end is gone. The edge is not empty, so a plain row check sees nothing wrong. This guard
  tests link resolution instead. It selects the edge records whose in or out link no longer resolves
  to a record, reports that exact id set, deletes exactly those ids one at a time behind an approval,
  then re-selects the dangling set and fails the run if any edge still points at nothing.


inputs:
  - id: host
    type: STRING
    displayName: SurrealDB host
    defaults: surrealdb

  - id: namespace
    type: STRING
    displayName: SurrealDB namespace
    defaults: test

  - id: database
    type: STRING
    displayName: SurrealDB database
    defaults: test

  - id: username
    type: STRING
    displayName: SurrealDB user
    defaults: root

  - id: password
    type: STRING
    displayName: SurrealDB password
    defaults: "{{ secret('SURREALDB_PASSWORD') }}"

  - id: edge_table
    type: STRING
    displayName: Edge table to guard
    description: The RELATE edge table whose in and out links are checked. One table per run.
    defaults: follows

  - id: max_edges
    type: INT
    displayName: Edges examined and deleted per run
    description: >-
      Ceiling on the dangling set a single run returns and deletes. A run that reaches it reports
      the scan as capped and asks to be re-run after cleanup.
    defaults: 1000

  - id: approval_timeout
    type: STRING
    displayName: Approval timeout
    description: ISO-8601 duration the pause waits for an answer before it expires.
    defaults: "PT2H"

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    description: Allow the DELETE. Still needs dry_run false and an approval.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, before any edge is deleted.
    defaults: true

tasks:
  - id: detect
    type: io.kestra.plugin.surrealdb.Query
    description: >-
      Read-only. Select the edge records whose in or out link no longer resolves to a record. The
      test is link resolution (in.id IS NONE or out.id IS NONE), not row existence, so an edge that
      still carries a target id but whose target is gone is caught. type::string renders each id as
      a canonical string the remediation step deletes by exact id.
    host: "{{ inputs.host }}"
    port: 8000
    namespace: "{{ inputs.namespace }}"
    database: "{{ inputs.database }}"
    username: "{{ inputs.username }}"
    password: "{{ inputs.password }}"
    useTls: false
    fetchType: FETCH
    query: |
      SELECT type::string(id) AS edge_id,
             type::string(in) AS in_ref,
             type::string(out) AS out_ref,
             (in.id IS NONE) AS in_missing,
             (out.id IS NONE) AS out_missing
      FROM {{ inputs.edge_table }}
      WHERE in.id IS NONE OR out.id IS NONE
      ORDER BY id
      LIMIT {{ inputs.max_edges }};

  - id: count_edges
    type: io.kestra.plugin.surrealdb.Query
    description: Read-only. Count all edge records in the table so the report states what share is orphaned.
    host: "{{ inputs.host }}"
    port: 8000
    namespace: "{{ inputs.namespace }}"
    database: "{{ inputs.database }}"
    username: "{{ inputs.username }}"
    password: "{{ inputs.password }}"
    useTls: false
    fetchType: FETCH
    query: |
      SELECT count() AS c FROM {{ inputs.edge_table }} GROUP ALL;

  - id: assess
    type: io.kestra.plugin.core.output.OutputValues
    description: Derive the id set, the counts and the alert text once so every branch reads the same values.
    values:
      items: >-
        {{ {'rows': (outputs.detect.rows ?? []), 'tot': (outputs.count_edges.rows ?? []), 'max': inputs.max_edges, 'edge': inputs.edge_table, 'host': inputs.host, 'ns': inputs.namespace, 'db': inputs.database, 'armed': (inputs.auto_remediate and not inputs.dry_run)} | jq('. as $i | ($i.rows // []) as $r | ($r | length) as $n | ($i.max) as $max | ($n >= $max) as $capped | [$r[] | .edge_id] as $ids | ([$r[] | select(.in_missing)] | length) as $inm | ([$r[] | select(.out_missing)] | length) as $outm | (($i.tot // []) | if length > 0 then (.[0].c) else 0 end) as $totraw | ($totraw | tostring | sub("\\.0$";"")) as $total | ([$r[] | "\(.edge_id) in=\(.in_ref) out=\(.out_ref)" + (if .in_missing and .out_missing then " both-missing" elif .in_missing then " in-missing" else " out-missing" end)] | join("; ")) as $detail | {count: $n, total: $total, capped: $capped, ids: $ids, in_missing: $inm, out_missing: $outm, detail: $detail, slack: ("SurrealDB orphaned graph edges on " + $i.host + " at " + $i.ns + "/" + $i.db + " table " + $i.edge + ": " + ($n | tostring) + " of " + $total + " edges point at a record that no longer exists" + (if $capped then " (capped at " + ($max | tostring) + ", re-run after cleanup)" else "" end) + ". " + (if $i.armed then "Remediation armed, so these ids are deleted after approval." else "Read-only run, nothing deleted." end) + (if $n > 0 then " ids: " + ($ids | join(", ")) else "" end))}') | first | toJson }}

  - id: report
    type: io.kestra.plugin.core.log.Log
    message: >-
      {{ fromJson(outputs.assess.values.items) | jq('"Checked " + .total + " edges, " + (.count | tostring) + " orphaned (" + (.in_missing | tostring) + " missing in, " + (.out_missing | tostring) + " missing out)." + (if .count > 0 then " Orphaned: " + .detail else "" end) + (if .capped then " Scan capped, re-run after cleanup." else "" end)') | first }}

  - id: route
    type: io.kestra.plugin.core.flow.If
    description: Alert and continue when an orphaned edge is found. A clean table logs and stops.
    condition: "{{ outputs.detect.size > 0 }}"
    then:
      - id: alert_findings
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': (fromJson(outputs.assess.values.items) | jq('.slack') | first)} | toJson }}

      - id: planned
        type: io.kestra.plugin.core.log.Log
        description: What a remediation run would delete, printed on every run including a dry one.
        message: >-
          {{ fromJson(outputs.assess.values.items) | jq('"Would delete " + (.count | tostring) + " orphaned edge" + (if .count == 1 then "" else "s" end) + " by exact id: " + (.ids | join(", ")) + ". Each delete names the id and repeats the dangling guard, so a clean edge is never removed."') | first }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        description: The DELETE runs only when auto_remediate is true, dry_run is false and the dangling set is non-empty.
        condition: "{{ inputs.auto_remediate and not inputs.dry_run and outputs.detect.size > 0 }}"
        then:
          - id: hold
            type: io.kestra.plugin.core.flow.Pause
            description: >-
              Deleting an edge is irreversible, so a human approves first. With no answer the pause
              expires and nothing is deleted.
            pauseDuration: "{{ inputs.approval_timeout }}"
            onResume:
              - id: approved
                type: BOOL
                displayName: Delete the listed orphaned edges?
                defaults: false
              - id: note
                type: STRING
                displayName: Decision note
                defaults: ""

          - id: apply
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.hold.onResume.approved ?? false }}"
            then:
              - id: remediate_delete
                type: io.kestra.plugin.core.flow.Loop
                description: >-
                  Remediation. One edge id at a time. Each DELETE names a single record id and
                  repeats the dangling guard (in.id IS NONE OR out.id IS NONE), so a blanket delete
                  of the whole edge table cannot happen and an edge that resolved in the meantime is
                  left alone. Serial because concurrent writes to one table race.
                concurrencyLimit: 1
                values: "{{ fromJson(outputs.assess.values.items) | jq('.ids') | first | toJson }}"
                tasks:
                  - id: delete_one
                    type: io.kestra.plugin.surrealdb.Query
                    host: "{{ inputs.host }}"
                    port: 8000
                    namespace: "{{ inputs.namespace }}"
                    database: "{{ inputs.database }}"
                    username: "{{ inputs.username }}"
                    password: "{{ inputs.password }}"
                    useTls: false
                    fetchType: FETCH
                    query: |
                      DELETE {{ item.value }} WHERE in.id IS NONE OR out.id IS NONE RETURN BEFORE;

                  - id: deleted_log
                    type: io.kestra.plugin.core.log.Log
                    message: "Deleted {{ item.value }}: removed {{ outputs.delete_one.size }} record (0 means it resolved before the delete and was left)."

              - id: reselect
                type: io.kestra.plugin.surrealdb.Query
                description: Re-read the dangling set after the deletes. This is the proof the change landed.
                host: "{{ inputs.host }}"
                port: 8000
                namespace: "{{ inputs.namespace }}"
                database: "{{ inputs.database }}"
                username: "{{ inputs.username }}"
                password: "{{ inputs.password }}"
                useTls: false
                fetchType: FETCH
                query: |
                  SELECT type::string(id) AS edge_id FROM {{ inputs.edge_table }}
                  WHERE in.id IS NONE OR out.id IS NONE
                  LIMIT {{ inputs.max_edges }};

              - id: verify
                type: io.kestra.plugin.core.flow.If
                description: Fail the run if any edge still points at a missing record after the deletes.
                condition: "{{ outputs.reselect.size > 0 }}"
                then:
                  - id: remediation_failed
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: >-
                      Deletes ran but {{ outputs.reselect.size }} edge(s) in {{ inputs.edge_table }} still point at a missing record. Either the scan was capped at {{ inputs.max_edges }} and more remain. Or a writer is still creating edges that point at nothing. Re-run after fixing the write path.
                else:
                  - id: remediated
                    type: io.kestra.plugin.core.log.Log
                    message: >-
                      {{ fromJson(outputs.assess.values.items) | jq('"Removed " + (.count | tostring) + " orphaned edge" + (if .count == 1 then "" else "s" end) + ". Re-select finds 0 remaining, so every edge now resolves on both ends."') | first }}
            else:
              - id: declined
                type: io.kestra.plugin.core.log.Log
                message: >-
                  Approval not granted{{ (outputs.hold.onResume.note ?? '') == '' ? '' : (', note: ' ~ outputs.hold.onResume.note) }}. No edge was deleted. The findings stay open.
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: >-
          {{ fromJson(outputs.assess.values.items) | jq('"No orphaned edges. All " + .total + " edges resolve on both their in and out links."') | first }}

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': ('SurrealDB orphaned graph edge cleanup guard failed on ' ~ inputs.host ~ ' table ' ~ inputs.edge_table ~ ' (execution ' ~ execution.id ~ '). Check the logs.')} | toJson }}

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled. Its inputs always force safe mode (dry_run on, auto_remediate off).
    cron: "20 3 * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: SurrealDB Orphaned Graph Edge Cleanup Guard
  shortDescription: Find SurrealDB RELATE edges whose in or out link points at a record that no longer exists, alert Slack, then delete exactly those edge ids one at a time behind an approval and re-select to prove the table is clean.
  metaTitle: SurrealDB Orphaned Graph Edge Cleanup Guard with Kestra
  metaDescription: Catch SurrealDB RELATE edges that point at a missing record, alert Slack, then delete exactly those edge ids behind an approval and re-verify.
  description: |
    `RELATE a->follows->b` succeeds in SurrealDB even when `a` or `b` does not exist. There is no
    referential integrity on a graph edge. A typo in an id, an import that loads edges before their
    vertices or a restore that drops a vertex table all leave edge records that still carry a target
    id while the record on the other end is gone. The edge is not empty, so a plain
    `SELECT * FROM follows` shows nothing wrong. Graph traversals then return half-built paths and
    counts drift from reality.

    This blueprint tests link resolution rather than row existence. An edge is orphaned when
    `in.id` or `out.id` resolves to `NONE`, which is exactly the case where the linked record is
    not there. It reports the orphaned id set, alerts Slack, then deletes those ids one at a time
    behind an approval and re-selects the set to prove the table is clean.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Findings

    | Finding | Rule | Fix |
    |---|---|---|
    | Orphaned edge | `in.id IS NONE` or `out.id IS NONE`, so one end points at a record that is gone | `DELETE` the exact edge id behind an approval, then re-select |
    | Clean edge | both `in` and `out` resolve to a record | None |

    ## Safety

    - Detection tests link resolution (`in.id IS NONE OR out.id IS NONE`), not whether the edge row
      exists. A row check would pass every edge, because the edge row is always present. It is the
      link target that is missing.
    - A bare `DELETE follows` with no filter wipes the whole edge table. This flow never issues one.
      Remediation loops over the id set from detection and each statement is
      `DELETE <one id> WHERE in.id IS NONE OR out.id IS NONE`, so it names a single record and
      repeats the guard. An edge that was repaired between detection and remediation is left alone.
    - The DELETE needs `auto_remediate` true, `dry_run` false, a non-empty dangling set, then a
      human answering the `Pause`. Four conditions, all of them, before an edge is removed.
    - The loop is serial (`concurrencyLimit: 1`) because concurrent writes to one table race.
    - After the deletes, `reselect` reads the dangling set again. If any edge still points at a
      missing record the run fails, so a cleanup that did not land is never reported as success.
    - `max_edges` caps how many edges one run returns and deletes. A run that reaches the cap says
      so and asks to be re-run, rather than loading an unbounded result.

    ## How it works

    1. `detect` (`io.kestra.plugin.surrealdb.Query`, `fetchType: FETCH`) selects the orphaned edges
       with `WHERE in.id IS NONE OR out.id IS NONE`, up to `max_edges`. It returns each edge id as a
       canonical string with `type::string`, plus which end is missing. `size` is the orphan count.
    2. `count_edges` reads the total number of edges in the table for context.
    3. `assess` (`io.kestra.plugin.core.output.OutputValues`) derives the id set, the counts, the
       capped flag and the alert text once, so every branch reads the same values.
    4. `report` logs the summary. `route` (`io.kestra.plugin.core.flow.If`) stops on a clean table
       and continues on a finding.
    5. On a finding, `alert_findings` posts the orphan set to Slack and `planned` logs what a
       remediation run would delete, on every run including a dry one.
    6. `remediate_gate` opens only with `auto_remediate` true, `dry_run` false and a non-empty set.
       `hold` (`io.kestra.plugin.core.flow.Pause`) waits for an answer. On approval `remediate_delete`
       (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) deletes each id with its guard,
       `reselect` reads the dangling set again and `verify` fails the run if any edge still dangles.
       Without approval `declined` records the decision and nothing changes.
    7. `errors` posts to Slack when the flow fails.

    ## What you get

    - The exact id set of edges that point at a record that is gone, not a vague count.
    - Which end is missing for each edge, so you can trace the write path that created it.
    - A Slack alert the moment a scheduled run finds an orphan.
    - A bounded cleanup that deletes only the detected ids, each behind its own guard, with a
      re-select that fails the run when the change did not land.

    ## Who it's for

    - Teams using SurrealDB graph edges (`RELATE`) where application code or imports can create an
      edge whose target record does not exist yet.
    - Platform engineers who have seen graph traversals return half-built paths after a restore or
      a bulk delete.
    - Anyone who wants referential-integrity cleanup on a store that does not enforce it.

    ## Why orchestrate this with Kestra

    SurrealDB has no scheduler, no approval step and no alerting of its own. Kestra runs the check
    on a cadence, holds the destructive half behind `auto_remediate`, `dry_run` and a `Pause` with
    the decision recorded on the execution, posts findings to Slack and keeps the read, the delete
    and the re-read in one auditable run. The id set from detection is carried straight into the
    delete loop, so remediation acts on what was found and nothing wider.

    ## Tested end to end

    Verified on Kestra 2.0.5 OSS against a SurrealDB 3.3.3 container on the same Docker network, with
    a local HTTP sink standing in for Slack. Every count below was read back from SurrealDB's own
    `surreal sql`, not only from the Kestra log. The `follows` table held one clean edge
    (`person:alice` to `person:carol`) plus, in the degraded runs, two orphans: one from
    `RELATE person:alice->follows->person:ghost` where `person:ghost` was never created, one from
    `CREATE follows:manual SET in=person:nobody` where `person:nobody` was never created.

    | Run | Execution | Inputs | Result |
    |---|---|---|---|
    | 1 | `1Buf29LevKA5j7wLhMj69H` | defaults, clean table | 0 orphaned of 1 edge. `clean` logs, no Slack finding |
    | 2 | `2PTDFFnSLXesva53Rv8bKJ` | defaults, 2 orphans seeded | 2 orphaned of 3. Slack finding posted, `planned` logged. CLI after: still 3 edges, 2 orphaned |
    | 3 | `5M1cRExCWJKDB5ZXjNNC2z` | `auto_remediate: true`, `dry_run: true` | gate held, nothing deleted. CLI after: 2 orphaned |
    | 4 | `2tb5rfL4msdRFcDVGb9Mu0` | `auto_remediate: true`, `dry_run: false`, resumed `approved: true` | 2 edges deleted, `reselect` found 0, SUCCESS. CLI before 3 edges with 2 orphaned, after 1 edge with 0 orphaned, the clean edge survived |
    | 5 | `7VzkAkw2lzsCncRJPsvtIC` | the same, resumed `approved: false` | `declined`, nothing deleted. CLI after: 2 orphaned |
    | 6 | `1PvCug8JC9y3jR8JaHn6Vr` | unreachable host | `detect` failed, `errors` posted to Slack, FAILED |
    | 7 | `2yDy87dbRT7VGBRJtuAqM6` | `max_edges: 1`, resumed `approved: true` | capped at 1, deleted 1 of 2, `reselect` found 1 remaining, `verify` failed the run, `errors` posted. CLI before 2 orphaned, after 1 orphaned with the clean edge still present |

    Run 1 against run 2 isolates that the detector catches a real orphan. Nothing changed between
    them except two edges pointing at records that do not exist. The report moved from 0 findings
    to 2. Run 7 proves the re-verify can fail. One orphan was deleted by exact id while the other
    orphan and the clean edge were left untouched, so `reselect` still found an orphan and the run
    failed rather than reporting a clean table. That the other orphan survived also proves the delete
    acts on one id at a time, never a blanket `DELETE follows`.


    ## Prerequisites

    - A SurrealDB instance reachable from the Kestra workers, with a user allowed to `SELECT` and
      `DELETE` on the edge table.
    - The `plugin-surrealdb` plugin, bundled with Kestra.
    - An edge table built with `RELATE`, so its records carry `in` and `out` links.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: used by `alert_findings` and the `errors` block. In Kestra OSS, provide
      it as the base64-encoded environment variable `SECRET_SLACK_WEBHOOK_URL`.
    - `SURREALDB_PASSWORD`: the database password, the default for the `password` input.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `host` | `surrealdb` | The SurrealDB host |
    | `namespace`, `database` | `test`, `test` | Namespace and database to check |
    | `username`, `password` | `root`, secret | Credentials |
    | `edge_table` | `follows` | The RELATE edge table to guard |
    | `max_edges` | `1000` | Ceiling on edges returned and deleted per run |
    | `approval_timeout` | `PT2H` | How long the pause waits |
    | `auto_remediate` | `false` | Allow the DELETE |
    | `dry_run` | `true` | Must be `false` for a change to apply |

    The port (`8000`) and TLS (off) are set on the `Query` tasks. For a different port or a TLS
    endpoint, change `port` and `useTls` on each task.

    ## Quick start

    1. Add the `SLACK_WEBHOOK_URL` and `SURREALDB_PASSWORD` secrets.
    2. Import the flow, set `host`, `namespace`, `database` and `edge_table`, then run it. A clean
       table logs and stops. An orphan sends a Slack alert and logs the id set.
    3. To clean up, set `auto_remediate: true` and `dry_run: false`, run it, then answer the pause.
    4. Read the `reselect` step. The run fails if any edge still points at a missing record.
    5. Enable the `daily` trigger, which always runs in safe mode.

    ## How to extend

    - Guard several edge tables by wrapping the tasks in a `Loop` over a table list. You can also
      read the edge tables from `INFO FOR DB` first.
    - Alert only above a threshold, so a handful of known orphans stays quiet and a spike pages.
    - Replace the `Pause` with a Slack approval. Or drop it for a table you are sure about.
    - Add a second detection for edges whose `in` and `out` resolve but violate a schema rule.

    ## Links

    - SurrealDB `RELATE`: https://surrealdb.com/docs/surrealql/statements/relate
    - SurrealDB record links: https://surrealdb.com/docs/surrealql/datamodel/records
    - SurrealDB plugin: https://kestra.io/plugins/plugin-surrealdb
  tags:
    - Data
    - Infrastructure
  subTags:
    - Databases
    - Data Quality
    - Day 2 Operations
  ee: false
  demo: false





