id: jpl-sentry-impact-risk-change-watch
namespace: company.team

description: |
  Daily diff of the NASA/JPL Sentry asteroid impact-risk list. New objects, removals, Palermo and Torino scale
  changes and threshold crossings are reported once, enriched with the Sentry object detail, and posted to Slack.

inputs:
  - id: ps_alert
    type: FLOAT
    displayName: Palermo alert level
    description: Objects with a cumulative Palermo scale value at or above this are tracked closely. -2 is about 1% of the background impact hazard; most listed objects are below -5.
    defaults: -3.0

  - id: ts_alert
    type: INT
    displayName: Torino alert level
    description: Any object at or above this Torino value is alerted. 1 means "normal, merits attention by astronomers".
    defaults: 1

  - id: ps_jump
    type: FLOAT
    displayName: Palermo change to report
    description: A tracked object is re-posted when its cumulative Palermo value rises by at least this much since the last run.
    defaults: 0.5

  - id: watch
    type: JSON
    displayName: Watched designations
    description: Designations reported on any change (added, removed, Palermo, Torino or impact count), whatever their level. Use the Sentry `des` form, e.g. "99942" or "2000 SG344".
    defaults: '["99942", "101955", "2000 SG344", "2024 YR4"]'

  - id: max_details
    type: INT
    displayName: Max detail lookups
    description: Upper bound on per-object detail requests per run, to stay polite to the JPL API.
    defaults: 10

  - id: state_key
    type: STRING
    displayName: KV state key
    defaults: jpl_sentry_snapshot

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "30 6 * * *"
    description: Sentry recomputes objects within hours of new astrometry; one run per day catches each change.

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: fetch_list
    type: io.kestra.plugin.core.http.Download
    description: Summary row for every object currently on the Sentry risk list (about 2,200).
    uri: https://ssd-api.jpl.nasa.gov/sentry.api
    headers:
      User-Agent: kestra-sentry-watch/1.0 (https://kestra.io)
    retry:
      type: exponential
      interval: PT30S
      maxInterval: PT5M
      maxAttempts: 4

  - id: fetch_removed
    type: io.kestra.plugin.core.http.Download
    description: Objects removed from the list with the removal time. Removal usually means new observations ruled out every listed impact.
    uri: https://ssd-api.jpl.nasa.gov/sentry.api?removed=1
    headers:
      User-Agent: kestra-sentry-watch/1.0 (https://kestra.io)
    retry:
      type: exponential
      interval: PT30S
      maxInterval: PT5M
      maxAttempts: 4

  - id: previous_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false
    description: Compact snapshot of the list from the last run. Missing on the first run (BASELINE).

  - id: diff
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Compares the list with the snapshot. `ts_max` is null for objects whose potential impacts are more than
      100 years away (Torino is only defined within 100 years), so null is kept as "n/a" and never counts as a rise.
    url: "jdbc:duckdb:"
    timeZoneId: UTC
    fetchType: FETCH_ONE
    inputFiles:
      list.json: "{{ outputs.fetch_list.uri }}"
      removed.json: "{{ outputs.fetch_removed.uri }}"
      state.json: "{{ outputs.previous_state.value ?? '[]' }}"
      watch.json: "{{ inputs.watch | toJson }}"
    outputFiles:
      - changes_csv
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE cur AS
      SELECT o->>'$.des' AS des, o->>'$.fullname' AS name, TRY_CAST(o->>'$.ps_cum' AS DOUBLE) AS ps, TRY_CAST(o->>'$.ps_max' AS DOUBLE) AS ps_max,
             TRY_CAST(o->>'$.ts_max' AS INT) AS ts, TRY_CAST(o->>'$.ip' AS DOUBLE) AS ip, TRY_CAST(o->>'$.n_imp' AS INT) AS n_imp,
             o->>'$.range' AS yrs, TRY_CAST(o->>'$.diameter' AS DOUBLE) AS diam_km, o->>'$.last_obs' AS last_obs
      FROM (SELECT unnest(json_extract(content, '$.data[*]')) AS o FROM read_text('list.json'));
      CREATE TABLE rem AS
      SELECT r->>'$.des' AS des, max(r->>'$.removed') AS removed
      FROM (SELECT unnest(json_extract(content, '$.data[*]')) AS r FROM read_text('removed.json')) GROUP BY 1;
      CREATE TABLE prev AS
      SELECT p->>'$.d' AS des, TRY_CAST(p->>'$.p' AS DOUBLE) AS ps, TRY_CAST(p->>'$.t' AS INT) AS ts, TRY_CAST(p->>'$.n' AS INT) AS n_imp
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS p FROM read_text('state.json'));
      CREATE TABLE w AS SELECT DISTINCT trim(x) AS des FROM (SELECT unnest(from_json(content, '["VARCHAR"]')) AS x FROM read_text('watch.json'));

      CREATE TABLE j AS
      SELECT coalesce(c.des, p.des) AS des, c.name, c.ps, p.ps AS prev_ps, c.ts, p.ts AS prev_ts, c.ip, c.n_imp, p.n_imp AS prev_n,
             c.yrs, c.diam_km, c.last_obs, rem.removed, w.des IS NOT NULL AS watched,
             CASE WHEN p.des IS NULL THEN 'added' WHEN c.des IS NULL THEN 'removed' ELSE 'listed' END AS state,
             coalesce(c.ps >= {{ inputs.ps_alert }} OR c.ts >= {{ inputs.ts_alert }}, false) AS hot,
             coalesce(p.ps >= {{ inputs.ps_alert }} OR p.ts >= {{ inputs.ts_alert }}, false) AS was_hot
      FROM cur c FULL JOIN prev p ON c.des = p.des
      LEFT JOIN rem ON rem.des = coalesce(c.des, p.des)
      LEFT JOIN w ON w.des = coalesce(c.des, p.des);

      CREATE TABLE ch AS
      SELECT *, CASE
          WHEN state = 'added' AND hot THEN 'new on list at alert level'
          WHEN state = 'removed' AND (was_hot OR watched) THEN 'removed from list'
          WHEN state = 'listed' AND hot AND NOT was_hot THEN 'rose to alert level'
          WHEN state = 'listed' AND was_hot AND NOT hot THEN 'fell below alert level'
          WHEN state = 'listed' AND coalesce(ts > coalesce(prev_ts, 0), false) THEN 'Torino rose'
          WHEN state = 'listed' AND hot AND ps - prev_ps >= {{ inputs.ps_jump }} THEN 'Palermo rose'
          WHEN watched AND state = 'added' THEN 'watched object added'
          WHEN watched AND (ps IS DISTINCT FROM prev_ps OR ts IS DISTINCT FROM prev_ts OR n_imp IS DISTINCT FROM prev_n) THEN 'watched object changed'
        END AS reason
      FROM j;

      COPY (SELECT des, name, reason, state, ps, prev_ps, ts, prev_ts, ip, n_imp, prev_n, yrs AS impact_years, diam_km, last_obs, removed, watched
            FROM ch WHERE reason IS NOT NULL ORDER BY ps DESC NULLS LAST) TO '{{ outputFiles.changes_csv }}' (HEADER, DELIMITER ',');

      SELECT (SELECT count(*) FROM prev) = 0 AS is_baseline,
             (SELECT count(*) FROM cur) AS listed,
             (SELECT count(*) FROM cur WHERE ps >= {{ inputs.ps_alert }} OR ts >= {{ inputs.ts_alert }}) AS at_alert_level,
             (SELECT count(*) FROM j WHERE state = 'added') AS added,
             (SELECT count(*) FROM j WHERE state = 'removed') AS dropped,
             (SELECT count(*) FROM ch WHERE reason IS NOT NULL) AS change_count,
             (SELECT coalesce(string_agg(name || ' ' || CAST(ps AS VARCHAR), ', ' ORDER BY ps DESC), 'none') FROM (SELECT * FROM cur ORDER BY ps DESC LIMIT 3)) AS top3,
             (SELECT coalesce(string_agg(w.des || coalesce(' (removed ' || rem.removed || ')', ' (not found)'), ', '), '') FROM w LEFT JOIN rem ON rem.des = w.des WHERE w.des NOT IN (SELECT des FROM cur)) AS watched_off_list,
             (SELECT coalesce(CAST(to_json(list(json_object('des', des, 'name', coalesce(name, des), 'why', reason, 'ps', ps, 'pps', prev_ps, 'ts', coalesce(CAST(ts AS VARCHAR), 'n/a'),
                'ip', printf('%.2e', ip), 'odds', CAST(round(1 / ip) AS BIGINT), 'n', n_imp, 'pn', prev_n, 'yrs', yrs, 'm', CAST(round(diam_km * 1000) AS INT), 'st', state, 'obs', last_obs, 'rm', removed) ORDER BY ps DESC NULLS LAST)) AS VARCHAR), '[]') FROM ch WHERE reason IS NOT NULL) AS changes,
             (SELECT coalesce(CAST(to_json(list(des)) AS VARCHAR), '[]') FROM (SELECT des FROM ch WHERE reason IS NOT NULL AND state <> 'removed' ORDER BY ps DESC LIMIT {{ inputs.max_details }})) AS detail_des,
             (SELECT CAST(to_json(list(json_object('d', des, 'p', ps, 't', ts, 'n', n_imp))) AS VARCHAR) FROM cur) AS new_state;

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.diff.outputs[0].row.new_state }}"
    description: Overwritten every run, so the next diff is against today's list.

  - id: on_change
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.diff.outputs[0].row.change_count > 0 }}"
    then:
      - id: details
        type: io.kestra.plugin.core.flow.Loop
        description: One detail request per reported object, one at a time, capped by `max_details`.
        values: "{{ outputs.diff.outputs[0].row.detail_des }}"
        concurrencyLimit: 1
        tasks:
          - id: detail
            type: io.kestra.plugin.core.http.Request
            description: Object detail with impact energy, impact speed, observation arc and the time the solution was computed.
            uri: "https://ssd-api.jpl.nasa.gov/sentry.api?des={{ item.value | urlencode }}"
            headers:
              User-Agent: kestra-sentry-watch/1.0 (https://kestra.io)
            retry:
              type: constant
              interval: PT10S
              maxAttempts: 3
        outputs:
          - id: des
            type: STRING
            value: "{{ item.value }}"
          - id: summary
            type: STRING
            value: "{{ fromJson(outputs.detail.body).summary ?? {} | toJson }}"
      - id: compose
        type: io.kestra.plugin.core.debug.Return
        format: |-
          *JPL Sentry impact-risk changes*{{ outputs.diff.outputs[0].row.is_baseline ? ' (baseline)' : '' }}: {{ outputs.diff.outputs[0].row.change_count }} object(s). {{ outputs.diff.outputs[0].row.added }} added and {{ outputs.diff.outputs[0].row.dropped }} removed since the last run; {{ outputs.diff.outputs[0].row.listed }} on the list.
          {% for c in fromJson(outputs.diff.outputs[0].row.changes) %}{% set s = null %}{% for d in outputs.details.outputs %}{% if d.outputs.des == c.des %}{% set s = fromJson(d.outputs.summary) %}{% endif %}{% endfor %}:comet: *{{ c.name }}*: {{ c.why }}. {% if c.st == 'removed' %}Off the list{% if c.rm is not null %} since {{ c.rm }} UTC{% endif %}; last Palermo {{ c.pps }}.{% else %}Palermo {{ c.ps }}{% if c.pps is not null and c.pps != c.ps %} (was {{ c.pps }}){% endif %}, Torino {{ c.ts }}, impact probability {{ c.ip }} (1 in {{ c.odds }}) over {{ c.n }}{% if c.pn is not null and c.pn != c.n %} (was {{ c.pn }}){% endif %} potential impacts in {{ c.yrs }}, about {{ c.m }} m{% if s is not null %}, {{ s.energy }} Mt at {{ s.v_imp }} km/s, observation arc {{ s.darc | replace({' days': ''}) }} d, solution computed {{ s.cdate }}{% endif %}. <https://cneos.jpl.nasa.gov/sentry/details.html#?des={{ c.des | urlencode }}|details>{% endif %}
          {% endfor %}
      - id: slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: allowFailure keeps the run going when `SLACK_WEBHOOK_URL` is not set; the message is still logged and the CSV written.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: "{{ outputs.compose.value }}"
      - id: log_changes
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "{{ outputs.compose.value }}"
    else:
      - id: log_quiet
        type: io.kestra.plugin.core.log.Log
        message: "No Sentry change at the alert levels or on watched objects. Highest cumulative Palermo values: {{ outputs.diff.outputs[0].row.top3 }}."

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      {{ outputs.diff.outputs[0].row.listed }} objects on the Sentry list, {{ outputs.diff.outputs[0].row.at_alert_level }} at Palermo >= {{ inputs.ps_alert }} or Torino >= {{ inputs.ts_alert }}.
      {{ outputs.diff.outputs[0].row.added }} added, {{ outputs.diff.outputs[0].row.dropped }} removed, {{ outputs.diff.outputs[0].row.change_count }} reported{{ outputs.diff.outputs[0].row.is_baseline ? ' (BASELINE run, every object counts as added)' : '' }}.
      {% if outputs.diff.outputs[0].row.watched_off_list != '' %}Watched but not on the list: {{ outputs.diff.outputs[0].row.watched_off_list }}.{% endif %}

outputs:
  - id: summary
    type: JSON
    value:
      baseline: "{{ outputs.diff.outputs[0].row.is_baseline }}"
      listed: "{{ outputs.diff.outputs[0].row.listed }}"
      at_alert_level: "{{ outputs.diff.outputs[0].row.at_alert_level }}"
      added: "{{ outputs.diff.outputs[0].row.added }}"
      removed: "{{ outputs.diff.outputs[0].row.dropped }}"
      reported: "{{ outputs.diff.outputs[0].row.change_count }}"
  - id: changes_csv
    type: FILE
    value: "{{ outputs.diff.outputFiles.changes_csv }}"

extend:
  title: Track Asteroid Impact Risk Changes on the NASA/JPL Sentry List
  metaTitle: NASA JPL Sentry Asteroid Impact Risk Change Watch with DuckDB and Slack | Kestra
  shortDescription: Diff the NASA/JPL Sentry impact-risk list every day and post new objects, removals and Palermo or Torino scale changes to Slack, with impact energy and observation arc from the object detail.
  metaDescription: Daily NASA/JPL Sentry diff for asteroid impact risk. Palermo and Torino changes, new and removed objects, KV snapshot, CSV output and Slack.
  description: |
    NASA/JPL Sentry monitors the asteroid catalogue for possible Earth impacts. Its list of about 2,200 objects changes daily: discoveries are added, objects are removed when new observations rule out every impact, and Palermo and Torino values move as orbits are refined. The CNEOS table only shows the current state; this flow reports what changed.

    ## How it works

    1. A `Schedule` trigger runs daily. Two `HTTP Download` tasks fetch the Sentry summary list (`sentry.api`) and the removed-objects list (`sentry.api?removed=1`, with removal times).
    2. `previous_state` (KV Get) reads the compact snapshot from the last run (designation, cumulative Palermo, maximum Torino, potential impacts). It is missing on the first run (BASELINE).
    3. `diff` (DuckDB) joins the list with the snapshot and gives each object one reason: new at alert level, rose to or fell below the alert level (`ps_alert`, `ts_alert`), Torino rose, Palermo rose by `ps_jump`, removed (with the removal time), or any change to a watched designation. `ts_max` is null when all impacts are over 100 years away (1950 DA, Bennu), so it shows as `n/a` and never counts as a rise.
    4. `save_state` overwrites the snapshot.
    5. `on_change` (If): a `Loop` fetches the object detail (one at a time, at most `max_details`) for impact energy, speed, observation arc and solution date, then one Slack message is sent and logged at WARN. Otherwise the top three Palermo values are logged.
    6. `summary` logs counts and watched designations not on the list (with removal time, or "not found" for a typo).

    ## What you get

    - One Slack message per run: Palermo (and previous value), Torino, impact probability as "1 in N", potential impacts and years, diameter, energy in Mt and a CNEOS link.
    - A CSV of every reported change and a flow summary with counts.
    - Removals with the time JPL took the object off the list, so good news is visible too.

    ## Who it's for

    - Planetary defence analysts, NEO follow-up observers and science outreach teams.

    ## Why orchestrate this with Kestra

    - The KV snapshot turns a static table into a change feed; re-runs on an unchanged list are quiet.
    - Retries ride out short JPL API outages; `concurrency` prevents overlapping runs.

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB plugin and the Slack plugin.
    - Outbound HTTPS to `ssd-api.jpl.nasa.gov`. No API key is needed.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook (optional; without it the message is logged at WARN and the run ends in WARNING).

    ## Quick start

    1. Execute with the defaults. The first run is a baseline: every object counts as new, and only those at Palermo -3 or above are posted (seven at the time of writing, led by 1950 DA and Bennu).
    2. Execute again: nothing changed, so `log_quiet` runs.
    3. Edit `watch`. Watched objects are reported on any change at any level; those off the list are named in the summary (Apophis and 2024 YR4 in the defaults).
    4. Add `SLACK_WEBHOOK_URL` and keep the daily schedule.

    ## How to extend

    - Add the JPL close-approach API (`cad.api`) for objects that also have a near-term flyby.
    - Route a Torino 1 or higher to an on-call pager, or write the CSV to object storage for a history of the list.

    ## Links

    - [HTTP Download](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download), [HTTP Request](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.request), [If](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if), [Loop](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop) and [KV Store](https://kestra.io/docs/concepts/kv-store)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [Sentry API documentation](https://ssd-api.jpl.nasa.gov/doc/sentry.html) and [CNEOS Sentry](https://cneos.jpl.nasa.gov/sentry/)
    - [Palermo scale](https://cneos.jpl.nasa.gov/sentry/palermo_scale.html) and [Torino scale](https://cneos.jpl.nasa.gov/sentry/torino_scale.html)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
