id: coral-reef-watch-dhw-bleaching-alert
namespace: company.team

description: |
  Daily coral bleaching heat stress check for reef and aquaculture sites. The flow reads NOAA Coral Reef
  Watch Degree Heating Weeks (DHW) and the 7-day Bleaching Alert Area from the CoastWatch ERDDAP server
  for a small pixel box around each site, maps them to the CRW alert levels (including Alert Levels 3 to 5),
  and posts to Slack only when a site's level changes.

inputs:
  - id: sites
    type: JSON
    displayName: Reef or farm sites
    description: >-
      One object per site with `site`, `lat` and `lon` (decimal degrees). Site names are examples; DHW and
      alert levels come from the live CRW 5 km products.
    defaults: |
      [
        {"site": "Looe Key, Florida Keys", "lat": 24.55, "lon": -81.41},
        {"site": "Belize Barrier Reef (Carrie Bow Caye)", "lat": 16.80, "lon": -88.08},
        {"site": "Kaneohe Bay, Oahu", "lat": 21.45, "lon": -157.80},
        {"site": "Lizard Island, Great Barrier Reef", "lat": -14.67, "lon": 145.45},
        {"site": "North Male Atoll, Maldives", "lat": 4.17, "lon": 73.50},
        {"site": "Hurghada, Red Sea", "lat": 27.25, "lon": 33.85}
      ]

  - id: box_pixels
    type: INT
    displayName: Search box (pixels each side)
    description: >-
      The 5 km grid marks coastal pixels as land, so a reef at the shoreline can fall on a land pixel. The flow
      reads a box of (2n+1) x (2n+1) pixels around each site and uses the maximum over valid water pixels, as
      CRW does for its virtual stations. 1 means a 3 x 3 box (about 15 km).
    defaults: 1

  - id: notify_min_level
    type: SELECT
    displayName: Notify from level
    description: >-
      Only report a change when the old or the new level is at least this one. The default ignores the
      day-to-day flicker between No Stress and Watch.
    values:
      - WATCH
      - WARNING
      - ALERT_1
      - ALERT_2
    defaults: WARNING

  - id: stale_days
    type: INT
    displayName: Stale after (days)
    description: CRW data are usually 1 to 4 days behind. Older data are reported as stale in the log and the CSV.
    defaults: 6

  - id: state_key
    type: STRING
    displayName: KV state key
    defaults: coral_bleaching_alert_levels

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 18 * * *"
    description: The CRW daily products are published once a day; one run a day catches each new day.

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: prepare_sites
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Validates each site (name, latitude, longitude, duplicates) and builds the pixel box. Invalid rows are listed and skipped instead of failing the run.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      sites.json: "{{ inputs.sites | toJson }}"
    sql: |
      CREATE TABLE raw AS
      SELECT row_number() OVER () AS ord, trim(s->>'$.site') AS site,
             TRY_CAST(s->>'$.lat' AS DOUBLE) AS lat, TRY_CAST(s->>'$.lon' AS DOUBLE) AS lon
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS s FROM read_text('sites.json'));

      CREATE TABLE v AS
      SELECT *, CASE WHEN site IS NULL OR site = '' THEN 'missing site name'
                     WHEN lat IS NULL OR lon IS NULL THEN 'missing or non-numeric lat/lon'
                     WHEN lat NOT BETWEEN -90 AND 90 OR lon NOT BETWEEN -180 AND 180 THEN 'lat/lon out of range'
                     WHEN count(*) OVER (PARTITION BY site) > 1 AND ord > min(ord) OVER (PARTITION BY site) THEN 'duplicate site name'
                END AS problem
      FROM raw;

      SELECT count(*) FILTER (WHERE problem IS NULL) AS valid_sites,
             coalesce(string_agg('row ' || ord || ' (' || coalesce(site, '?') || ') ' || problem, '; ' ORDER BY ord) FILTER (WHERE problem IS NOT NULL), '') AS invalid_sites,
             coalesce(CAST(to_json(list(json_object(
               'ord', ord, 'site', site, 'lat', lat, 'lon', lon,
               'n', round(least(lat + 0.05 * {{ inputs.box_pixels }}, 89.975), 3), 's', round(greatest(lat - 0.05 * {{ inputs.box_pixels }}, -89.975), 3),
               'w', round(greatest(lon - 0.05 * {{ inputs.box_pixels }}, -179.975), 3), 'e', round(least(lon + 0.05 * {{ inputs.box_pixels }}, 179.975), 3)
             ) ORDER BY ord) FILTER (WHERE problem IS NULL)) AS VARCHAR), '[]') AS loop_items
      FROM v;

  - id: require_sites
    type: io.kestra.plugin.core.execution.Fail
    runIf: "{{ outputs.prepare_sites.outputs[0].row.valid_sites == 0 }}"
    errorMessage: "No valid site to check. {{ outputs.prepare_sites.outputs[0].row.invalid_sites }}"

  - id: previous_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false
    description: Last level per site. Missing on the first run (BASELINE), when every site reports its current level once.

  - id: per_site
    type: io.kestra.plugin.core.flow.Loop
    description: Two small ERDDAP requests per site. Values the summary needs travel in the loop item.
    values: "{{ outputs.prepare_sites.outputs[0].row.loop_items }}"
    concurrencyLimit: 3
    tasks:
      - id: fetch_dhw
        type: io.kestra.plugin.core.http.Download
        description: DHW and the pixel mask (0 water, 1 land, 2 missing, 4 ice) for the latest day and the day one week earlier (`last-7:7:last`).
        uri: "https://coastwatch.noaa.gov/erddap/griddap/noaacrwdhwDaily.csv?degree_heating_week%5Blast-7:7:last%5D%5B({{ fromJson(item.value).n }}):({{ fromJson(item.value).s }})%5D%5B({{ fromJson(item.value).w }}):({{ fromJson(item.value).e }})%5D,mask%5Blast-7:7:last%5D%5B({{ fromJson(item.value).n }}):({{ fromJson(item.value).s }})%5D%5B({{ fromJson(item.value).w }}):({{ fromJson(item.value).e }})%5D"
        headers:
          User-Agent: kestra-coral-bleaching-alert/1.0 (https://kestra.io)
        retry:
          type: exponential
          interval: PT30S
          maxInterval: PT5M
          maxAttempts: 4

      - id: fetch_baa
        type: io.kestra.plugin.core.http.Download
        description: Official 7-day maximum Bleaching Alert Area (0 No Stress, 1 Watch, 2 Warning, 3 Alert Level 1, 4 Alert Level 2) for the latest day.
        uri: "https://coastwatch.noaa.gov/erddap/griddap/noaacrwbaa7dDaily.csv?bleaching_alert_area%5Blast%5D%5B({{ fromJson(item.value).n }}):({{ fromJson(item.value).s }})%5D%5B({{ fromJson(item.value).w }}):({{ fromJson(item.value).e }})%5D,mask%5Blast%5D%5B({{ fromJson(item.value).n }}):({{ fromJson(item.value).s }})%5D%5B({{ fromJson(item.value).w }}):({{ fromJson(item.value).e }})%5D"
        headers:
          User-Agent: kestra-coral-bleaching-alert/1.0 (https://kestra.io)
        retry:
          type: exponential
          interval: PT30S
          maxInterval: PT5M
          maxAttempts: 4

      - id: summarise_site
        type: io.kestra.plugin.jdbc.duckdb.Queries
        description: ERDDAP CSV has a units row under the header, and land or missing pixels are `NaN`, so only rows with mask 0 count.
        url: "jdbc:duckdb:"
        fetchType: FETCH_ONE
        inputFiles:
          dhw.csv: "{{ outputs.fetch_dhw.uri }}"
          baa.csv: "{{ outputs.fetch_baa.uri }}"
        sql: |
          CREATE TABLE d AS
          SELECT CAST(left(column0, 10) AS DATE) AS day, TRY_CAST(column3 AS DOUBLE) AS dhw, TRY_CAST(column4 AS INT) AS mask
          FROM read_csv('dhw.csv', skip = 2, header = false, all_varchar = true);
          CREATE TABLE b AS
          SELECT CAST(left(column0, 10) AS DATE) AS day, TRY_CAST(column3 AS INT) AS baa, TRY_CAST(column4 AS INT) AS mask
          FROM read_csv('baa.csv', skip = 2, header = false, all_varchar = true);
          SELECT {{ fromJson(item.value).ord }} AS ord,
                 CAST((SELECT max(day) FROM d) AS VARCHAR) AS data_date,
                 (SELECT count(*) FROM d WHERE day = (SELECT max(day) FROM d)) AS pixels,
                 (SELECT count(*) FROM d WHERE day = (SELECT max(day) FROM d) AND mask = 0 AND NOT isnan(dhw)) AS water_pixels,
                 (SELECT round(max(dhw), 2) FROM d WHERE day = (SELECT max(day) FROM d) AND mask = 0 AND NOT isnan(dhw)) AS dhw,
                 (SELECT round(max(dhw), 2) FROM d WHERE day = (SELECT min(day) FROM d) AND mask = 0 AND NOT isnan(dhw)) AS dhw_week_ago,
                 (SELECT max(baa) FROM b WHERE mask = 0 AND baa BETWEEN 0 AND 4) AS baa;
    outputs:
      - id: stats
        type: STRING
        value: "{{ outputs.summarise_site.outputs[0].row | toJson }}"

  - id: evaluate
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      The ERDDAP alert area stops at Alert Level 2. CRW v3.1 adds Alert Levels 3, 4 and 5 at DHW 12, 16 and 20,
      so an Alert Level 2 pixel box is raised by its DHW. When the water has cooled (alert area Watch or lower)
      while DHW is still 4 or more, the site is flagged as residual stress: the heat has eased but bleaching is
      likely already under way. A box with no water pixel is NO_WATER (move the site offshore or widen the box).
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      stats.json: "[{% for it in outputs.per_site.outputs %}{{ it.outputs.stats }}{% if not loop.last %},{% endif %}{% endfor %}]"
      items.json: "{{ outputs.prepare_sites.outputs[0].row.loop_items }}"
      state.json: "{{ outputs.previous_state.value ?? '[]' }}"
    outputFiles:
      - levels_csv
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE lv AS SELECT * FROM (VALUES
        (-1, 'NO_WATER', 'No water pixel'), (0, 'NO_STRESS', 'No Stress'), (1, 'WATCH', 'Bleaching Watch'), (2, 'WARNING', 'Bleaching Warning'),
        (3, 'ALERT_1', 'Alert Level 1'), (4, 'ALERT_2', 'Alert Level 2'), (5, 'ALERT_3', 'Alert Level 3'),
        (6, 'ALERT_4', 'Alert Level 4'), (7, 'ALERT_5', 'Alert Level 5')) t(rank, level, label);
      CREATE TABLE prev AS
      SELECT p->>'$.site' AS site, TRY_CAST(p->>'$.rank' AS INT) AS prev_rank, TRY_CAST(p->>'$.residual' AS BOOLEAN) AS prev_residual, p->>'$.since' AS prev_since
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS p FROM read_text('state.json'));

      CREATE TABLE e AS
      SELECT i.ord, i.site, i.lat, i.lon, CAST(s.data_date AS VARCHAR) AS data_date, s.pixels, s.water_pixels, s.dhw, s.dhw_week_ago, s.baa,
             round(s.dhw - s.dhw_week_ago, 2) AS dhw_change_7d,
             date_diff('day', CAST(s.data_date AS DATE), current_date) AS age_days,
             CASE WHEN coalesce(s.water_pixels, 0) = 0 OR s.baa IS NULL THEN -1
                  WHEN s.baa = 4 AND s.dhw >= 20 THEN 7 WHEN s.baa = 4 AND s.dhw >= 16 THEN 6 WHEN s.baa = 4 AND s.dhw >= 12 THEN 5
                  ELSE s.baa END AS rank,
             coalesce(s.baa <= 1 AND s.dhw >= 4, false) AS residual_stress,
             p.prev_rank, p.prev_residual, p.prev_since
      FROM read_json('items.json', format = 'array') i
      LEFT JOIN read_json('stats.json', format = 'array') s ON s.ord = i.ord
      LEFT JOIN prev p ON p.site = i.site;

      CREATE TABLE r AS
      SELECT e.*, l.level, l.label, pl.label AS prev_label,
             (e.rank IS DISTINCT FROM e.prev_rank AND greatest(e.rank, coalesce(e.prev_rank, -1)) >= (SELECT rank FROM lv WHERE level = '{{ inputs.notify_min_level }}'))
               OR (e.residual_stress AND NOT coalesce(e.prev_residual, false)) AS notify
      FROM e JOIN lv l ON l.rank = e.rank LEFT JOIN lv pl ON pl.rank = e.prev_rank;

      -- Sites not in this run keep their saved level, so a one-off run on a short list does not erase the others.
      CREATE TABLE ns AS
      SELECT json_object('site', site, 'rank', rank, 'residual', residual_stress,
               'since', CASE WHEN rank IS DISTINCT FROM prev_rank OR prev_since IS NULL THEN data_date ELSE prev_since END) AS x FROM r
      UNION ALL
      SELECT json_object('site', site, 'rank', prev_rank, 'residual', prev_residual, 'since', prev_since) FROM prev WHERE site NOT IN (SELECT site FROM r);

      COPY (
        SELECT site, lat, lon, level, label, prev_label AS previous_level, data_date, age_days, dhw, dhw_week_ago, dhw_change_7d,
               baa AS baa_7d_max, residual_stress, water_pixels, pixels
        FROM r ORDER BY ord
      ) TO '{{ outputFiles.levels_csv }}' (HEADER, DELIMITER ',');

      SELECT count(*) AS sites,
             (SELECT count(*) FROM prev) = 0 AS is_baseline,
             count(*) FILTER (WHERE rank IS DISTINCT FROM prev_rank) AS changes,
             count(*) FILTER (WHERE notify) AS notify_count,
             count(*) FILTER (WHERE rank >= 3) AS alert_sites,
             max(data_date) AS data_date,
             coalesce(string_agg(site, ', ' ORDER BY ord) FILTER (WHERE age_days > {{ inputs.stale_days }}), '') AS stale_sites,
             string_agg(site || ' ' || label || ' (DHW ' || coalesce(CAST(dhw AS VARCHAR), 'n/a') || CASE WHEN residual_stress THEN ', residual stress' ELSE '' END || ')', '; ' ORDER BY ord) AS status_line,
             coalesce(CAST(to_json(list(json_object(
               'site', site, 'label', label, 'prev', coalesce(prev_label, 'none'), 'changed', rank IS DISTINCT FROM prev_rank, 'up', rank > coalesce(prev_rank, -1),
               'dhw', dhw, 'chg', dhw_change_7d, 'baa', baa, 'residual', residual_stress, 'date', data_date, 'lat', lat, 'lon', lon
             ) ORDER BY rank DESC, ord) FILTER (WHERE notify)) AS VARCHAR), '[]') AS change_list,
             (SELECT CAST(to_json(list(x)) AS VARCHAR) FROM ns) AS new_state
      FROM r;

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.evaluate.outputs[0].row.new_state }}"

  - id: on_level_change
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.evaluate.outputs[0].row.notify_count > 0 }}"
    then:
      - id: compose
        type: io.kestra.plugin.core.debug.Return
        format: |-
          *Coral bleaching heat stress*{{ outputs.evaluate.outputs[0].row.is_baseline ? ' (baseline)' : '' }}, CRW data for {{ outputs.evaluate.outputs[0].row.data_date }}: {{ outputs.evaluate.outputs[0].row.notify_count }} site(s) changed, {{ outputs.evaluate.outputs[0].row.alert_sites }} of {{ outputs.evaluate.outputs[0].row.sites }} at Alert Level 1 or higher.
          {% for c in fromJson(outputs.evaluate.outputs[0].row.change_list) %}{{ not c.changed ? ':warning:' : (c.up ? ':red_circle:' : ':large_green_circle:') }} *{{ c.site }}*: {% if c.changed %}{{ c.prev }} -> *{{ c.label }}*{% else %}still *{{ c.label }}*{% endif %}{% if c.dhw is not null %}, DHW {{ c.dhw }} C-weeks{% if c.chg is not null %} ({{ c.chg >= 0 ? '+' : '' }}{{ c.chg }} in 7 days){% endif %}{% endif %}.{% if c.residual %} Water has cooled but DHW is still high: expect bleaching already under way.{% endif %} <https://coralreefwatch.noaa.gov/product/5km/index.php|CRW 5 km> at {{ c.lat }}, {{ c.lon }}
          {% endfor %}
      - id: slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: allowFailure keeps the run going when `SLACK_WEBHOOK_URL` is not set; the message is still logged and the CSV written.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: "{{ outputs.compose.value }}"
      - id: log_change
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "{{ outputs.compose.value }}"
    else:
      - id: log_no_change
        type: io.kestra.plugin.core.log.Log
        message: "No level change to report: {{ outputs.evaluate.outputs[0].row.status_line }}."

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      CRW data for {{ outputs.evaluate.outputs[0].row.data_date }}: {{ outputs.evaluate.outputs[0].row.sites }} sites,
      {{ outputs.evaluate.outputs[0].row.alert_sites }} at Alert Level 1+, {{ outputs.evaluate.outputs[0].row.changes }} level changes,
      {{ outputs.evaluate.outputs[0].row.notify_count }} reported{{ outputs.evaluate.outputs[0].row.is_baseline ? ' (BASELINE run)' : '' }}.
      {{ outputs.evaluate.outputs[0].row.status_line }}.
      {% if outputs.evaluate.outputs[0].row.stale_sites != '' %}Stale data (older than {{ inputs.stale_days }} days): {{ outputs.evaluate.outputs[0].row.stale_sites }}.{% endif %}
      {% if outputs.prepare_sites.outputs[0].row.invalid_sites != '' %}Skipped: {{ outputs.prepare_sites.outputs[0].row.invalid_sites }}.{% endif %}

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.evaluate.outputs[0].row | toJson }}"
  - id: levels_csv
    type: FILE
    value: "{{ outputs.evaluate.outputFiles.levels_csv }}"

extend:
  title: Alert on Coral Bleaching Heat Stress Level Changes with NOAA Coral Reef Watch
  metaTitle: Coral Bleaching DHW Alert with NOAA Coral Reef Watch ERDDAP | Kestra
  shortDescription: Read NOAA Coral Reef Watch Degree Heating Weeks and the 7-day Bleaching Alert Area for each reef or farm site every day, map them to CRW alert levels up to Alert Level 5, and post to Slack only when a site's level changes.
  metaDescription: Daily NOAA Coral Reef Watch check of DHW and bleaching alert levels per reef site, with KV state, residual-stress flag, CSV output and Slack alerts.
  description: |
    Coral bleaching follows accumulated heat. NOAA Coral Reef Watch (CRW) measures it as Degree Heating Weeks (DHW): about 4 C-weeks brings significant bleaching, 8 or more widespread bleaching and mortality. This flow reads the CRW 5 km daily products for each site from NOAA's CoastWatch ERDDAP server, maps them to the CRW alert levels and reports each change once.

    ## How it works

    1. A daily `Schedule` trigger (18:00 UTC) runs the check. `prepare_sites` (DuckDB) validates `sites` (missing name, bad or out-of-range coordinates, duplicates) and builds a pixel box per site; invalid rows are skipped and listed.
    2. `previous_state` (KV Get) reads the last level per site. It is missing on the first run (BASELINE).
    3. `per_site` (Loop) makes two small ERDDAP requests per site: DHW with the pixel mask for the latest day and one week earlier (`[last-7:7:last]`), and the official 7-day maximum Bleaching Alert Area. `summarise_site` (DuckDB) keeps valid water pixels (mask 0) and takes the box maximum, as CRW virtual stations do, because coastal reefs often sit on a pixel the grid marks as land.
    4. `evaluate` (DuckDB) raises Alert Level 2 to Alert Level 3, 4 or 5 at DHW 12, 16 and 20 (CRW v3.1; the ERDDAP alert area stops at level 2), flags residual stress when the water has cooled to Watch or lower but DHW is still 4 or more, marks land-only boxes `NO_WATER` and old data stale, and compares with the saved state. Sites not in this run keep their saved level.
    5. `on_level_change` (If) posts one Slack message and a WARN log when a level changed and the old or new level is at least `notify_min_level`, or when residual stress appears.

    ## What you get

    - One Slack message with changes only: old and new level, DHW, its 7-day change and a residual-stress note.
    - A CSV per site: level, DHW now and a week earlier, alert area, residual flag, water pixels.
    - No daily noise from the flicker between No Stress and Watch (default `notify_min_level: WARNING`).

    ## Who it's for

    - Reef managers, marine park rangers and conservation NGOs who schedule bleaching surveys.
    - Coral and shellfish aquaculture farms and dive or tourism operators.

    ## Why orchestrate this with Kestra

    - The KV store remembers each site's level, so only changes are reported and re-runs are quiet.
    - `Loop` with retries keeps one slow request from failing the check.
    - DuckDB reads the ERDDAP CSV directly; the CRW scale is plain SQL.

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB plugin and the Slack plugin.
    - Outbound HTTPS to `coastwatch.noaa.gov`. No API key is needed.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook (optional; without it the message is logged at WARN and the run ends in WARNING).

    ## Quick start

    1. Execute with the defaults. The six sites are example reef coordinates; DHW and levels come from the live CRW products. The first run is a baseline: it reports sites at Warning or higher and residual stress.
    2. Execute again: nothing changed, so `log_no_change` runs.
    3. Add a site on land: it shows as `No water pixel`; move it offshore or widen `box_pixels`.
    4. Add `SLACK_WEBHOOK_URL` and your own sites, and keep the daily schedule.

    ## How to extend

    - Add the CRW 4-month bleaching outlook to warn weeks ahead.
    - Append the CSV to a warehouse table for a season-long heat stress history per site.

    ## Links

    - [Loop](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop), [HTTP Download](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download) and [KV Store](https://kestra.io/docs/concepts/kv-store)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [NOAA Coral Reef Watch 5 km products](https://coralreefwatch.noaa.gov/product/5km/index.php)
    - [CoastWatch ERDDAP DHW dataset](https://coastwatch.noaa.gov/erddap/griddap/noaacrwdhwDaily.html)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
