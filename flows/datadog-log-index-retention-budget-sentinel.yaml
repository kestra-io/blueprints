id: datadog-log-index-retention-budget-sentinel
namespace: company.team

inputs:
  - id: dd_site
    type: STRING
    defaults: "datadoghq.com"
    description: Datadog site hostname.
  - id: daily_quota_warning_pct
    type: FLOAT
    defaults: 85.0
    description: Warning threshold percentage of daily log index quota consumed.

tasks:
  - id: audit_log_indexes
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates Datadog log index configuration API to detect unbounded log indexes.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      DD_SITE: "{{ inputs.dd_site }}"
      DD_API_KEY: "{{ secret('DATADOG_API_KEY') }}"
      DD_APP_KEY: "{{ secret('DATADOG_APP_KEY') }}"
    outputFiles:
      - log_indexes.json
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      site = os.environ.get("DD_SITE", "datadoghq.com")
      api_key = os.environ.get("DD_API_KEY")
      app_key = os.environ.get("DD_APP_KEY")

      if not api_key or not app_key:
          print("ERROR: DATADOG_API_KEY and DATADOG_APP_KEY secrets must be configured.", file=sys.stderr)
          sys.exit(1)

      url = f"https://api.{site}/api/v1/logs/config/indexes"
      headers = {
          "DD-API-KEY": api_key,
          "DD-APPLICATION-KEY": app_key,
          "Accept": "application/json"
      }

      try:
          resp = requests.get(url, headers=headers, timeout=20)
          resp.raise_for_status()
          data = resp.json()
      except Exception as exc:
          print(f"ERROR querying Datadog log index API: {exc}", file=sys.stderr)
          sys.exit(1)

      with open("log_indexes.json", "w", encoding="utf-8") as f:
          json.dump(data, f, indent=2)

      indexes = data.get("indexes", [])
      index_summary = []
      unbounded_indexes = 0

      for idx in indexes:
          daily_limit = idx.get("daily_limit")
          if daily_limit is None:
              unbounded_indexes += 1
          exclusion_filters = idx.get("exclusion_filters") or []
          index_summary.append({
              "name": idx.get("name"),
              "daily_limit": daily_limit,
              "exclusion_filters": len(exclusion_filters)
          })

      print(f"Audited {len(indexes)} log indexes. Found {unbounded_indexes} unbounded indexes.")

      Kestra.outputs({
          "unbounded_indexes": unbounded_indexes,
          "index_summary": json.dumps(index_summary)
      })

  - id: evaluate_log_budget_safety
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_log_indexes.vars.unbounded_indexes > 0 }}"
    then:
      - id: notify_finops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#finops-cost-alerts",
            "attachments": [
              {
                "color": "warning",
                "title": "Datadog Log Index Missing Daily Quota Safeguard Alert",
                "text": "Detected *{{ outputs.audit_log_indexes.vars.unbounded_indexes }}* Datadog log index(es) configured without a daily volume limit. Index configurations: {{ outputs.audit_log_indexes.vars.index_summary }}. Impact: A debug logging surge in any microservice can exhaust organization log ingestion budgets and create massive overage invoices.",
                "footer": "Kestra FinOps Sentinel Datadog Log Index"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#finops-cost-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "Datadog Log Index Sentinel Workflow Error",
            "text": "The Datadog log index configuration query failed for execution {{ execution.id }}. Please verify API credentials and site parameters.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * 1"
    disabled: true

extend:
  metaDescription: "Audits Datadog log index configurations to detect unconstrained log indexes lacking daily quota volume caps."
  metaTitle: Datadog Log Index Daily Quota and Budget Safeguard Sentinel with Kestra
  title: Datadog Log Index Daily Quota and Budget Safeguard Sentinel
  shortDescription: Audits Datadog log index configurations to detect unconstrained log indexes lacking daily quota volume caps.
  description: |
    ## How it works
    This workflow connects to the Datadog Log Index configuration API (`/api/v1/logs/config/indexes`) to audit all defined log indexes. It evaluates whether safety limits (`daily_limit`) are actively enforced on each index. Unconstrained indexes risk absorbing massive logging storms (e.g. from debug verbosity left in production code) that rapidly exhaust monthly contractual log allocations. Identified risks trigger an immediate notification.

    ## What you get
    - Proactive budget governance preventing unexpected log ingestion overages.
    - Complete inventory of defined log indexes and associated exclusion filters.
    - Peace of mind that log storms will be throttled before creating billing surprises.

    ## Who it's for
    - FinOps Practitioners and SRE leads managing Datadog contracts and cost allocations.
    - Platform Teams providing shared observability infrastructure for multi-tenant microservices.

    ## Why orchestrate this with Kestra
    - **Continuous Compliance**: Perform weekly configuration hygiene audits without manual spreadsheet audits.
    - **Auditable History**: Keep an audit record of index changes and alert triggers.
    - **Unified Alerting**: Route configuration drift notices to Slack, Microsoft Teams, or Jira.

    ## Prerequisites
    - Datadog API and Application keys with permissions to read log configuration.
    - Secrets `DATADOG_API_KEY`, `DATADOG_APP_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into your Kestra instance under the `company.team` namespace.
    2. Add Datadog credentials and Slack webhook secret.
    3. Run the flow to audit log index configuration safety.

    ## How to extend
    - Add an automated update step using `PUT /api/v1/logs/config/indexes/{index_name}` to apply a safety daily cap automatically.
    - Compare actual daily ingested volumes against index caps.

    ## Links
    - [Datadog Log Indexes API Documentation](https://docs.datadoghq.com/api/latest/logs-indexes/#get-all-indexes)
    - [Kestra FinOps Use Cases](https://kestra.io/use-cases)
  tags:
    - Cloud
    - Business
  subTags:
    - Infrastructure Automation
    - HR & Ops Automation
  ee: false
  demo: false
