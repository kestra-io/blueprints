id: greenhouse-scorecard-chase
namespace: company.team

description: |
  Interview scorecards that never arrive quietly bias every debrief that follows, and by the time recruiting notices, the panel has already lost the context needed to write a fair one. A keyed webhook fires the moment an interview is marked complete, with a disabled weekly sweep standing by as the fallback net; the Greenhouse Harvest interviews API is pulled with a bearer token and a local fixture of recent completions stands in when the API is unreachable. A python pass compares every completed interview against the scorecard SLA, counting the ones still missing a scorecard past the window and grouping them by interviewer. When anything is overdue each interviewer gets their own chase email, the channel gets one Slack summary and one rollup issue tracks the batch, while a clean board is logged; the verdict, the missing count, the interviewer list and the oldest wait are published as typed outputs.

triggers:
  - id: interview_completed
    type: io.kestra.plugin.core.trigger.Webhook
    description: Greenhouse hooks or recruiting ops POST here the moment an interview is marked complete, so overdue scorecards are chased while the debrief is still fresh.
    key: "{{ secret('INTERVIEW_COMPLETION_WEBHOOK_KEY') }}"
  - id: weekly_scorecard_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Disabled Monday morning sweep that re-checks every open interview scorecard each week until an operator switches it on.
    cron: "0 6 * * 1"
    disabled: true

inputs:
  - id: scorecard_sla_hours
    type: INT
    defaults: 48
    description: Hours after interview completion before a missing scorecard counts as overdue and its interviewer is chased.
  - id: escalation_repo
    type: STRING
    defaults: your-org/hiring-ops
    description: GitHub repository that receives the rollup issue listing every overdue scorecard in the batch.

tasks:
  # --- 1. interview workspace ---
  - id: scorecard_workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One shared directory so the fixture written by the shell step is the exact file the scorecard analysis reads when the API answers with nothing usable.
    tasks:
      # --- 2. fixture fallback ---
      - id: write_fixture
        type: io.kestra.plugin.scripts.shell.Commands
        description: Writes interviews.json from a heredoc of six recent completions with two scorecards already past the SLA, one submitted on time and three still inside the window.
        commands:
          - |
            set -eu
            cat > interviews.json <<'INTERVIEWS_EOF'
            {"interviews": [
                {"interview_id": "iv-20401", "candidate": "Dana Okafor", "job": "Senior Backend Engineer", "interviewer": "Alice Nguyen", "email": "alice.nguyen@example.com", "status": "completed", "scorecard": "missing", "hours_since_completion": 62},
                {"interview_id": "iv-20402", "candidate": "Marco Silva", "job": "Staff Platform Engineer", "interviewer": "Bruno Costa", "email": "bruno.costa@example.com", "status": "completed", "scorecard": "missing", "hours_since_completion": 55},
                {"interview_id": "iv-20403", "candidate": "Priya Raman", "job": "Product Designer", "interviewer": "Carla Diaz", "email": "carla.diaz@example.com", "status": "completed", "scorecard": "submitted", "hours_since_completion": 71},
                {"interview_id": "iv-20404", "candidate": "Leo Fischer", "job": "Senior Backend Engineer", "interviewer": "Dmitri Volkov", "email": "dmitri.volkov@example.com", "status": "completed", "scorecard": "pending", "hours_since_completion": 30},
                {"interview_id": "iv-20405", "candidate": "Amara Diallo", "job": "Product Designer", "interviewer": "Emily Tran", "email": "emily.tran@example.com", "status": "completed", "scorecard": "pending", "hours_since_completion": 12},
                {"interview_id": "iv-20406", "candidate": "Jonas Berg", "job": "Staff Platform Engineer", "interviewer": "Farah Haddad", "email": "farah.haddad@example.com", "status": "completed", "scorecard": "pending", "hours_since_completion": 5}
            ]}
            INTERVIEWS_EOF
            echo "interview fixture $(wc -c < interviews.json) bytes"

      # --- 3. greenhouse harvest pull ---
      - id: fetch_interviews
        type: io.kestra.plugin.core.http.Request
        description: GET the Greenhouse Harvest interviews feed with a bearer token and absorb a non 2xx answer, so an API problem hands the decision to the fixture instead of failing the chase.
        method: GET
        uri: "https://harvest.greenhouse.io/v1/interviews?per_page=50"
        headers:
          Authorization: "Bearer {{ secret('GREENHOUSE_API_TOKEN') }}"
          Accept: application/json
        options:
          allowFailed: true
          followRedirects: true
        timeout: PT30S

      # --- 4. SLA analysis ---
      - id: analyze_scorecards
        type: io.kestra.plugin.scripts.python.Script
        description: Read the Greenhouse response or the fixture, flag completed interviews with no scorecard past the SLA, group them by interviewer, and emit verdict, missing_count, interviewers and oldest_hours through the outputs protocol.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          SCORECARD_SLA_HOURS: "{{ inputs.scorecard_sla_hours }}"
          GREENHOUSE_BODY: "{{ (outputs.fetch_interviews.body ?? '') | json }}"
        script: |
          import json
          import os
          from datetime import datetime, timezone

          FIXTURE = "interviews.json"
          COMPLETED = ("completed", "done", "finished")
          SUBMITTED = ("submitted", "complete", "completed", "done")

          def as_int(value, fallback):
              try:
                  parsed = int(str(value).strip())
              except (TypeError, ValueError):
                  return fallback
              return parsed if parsed >= 0 else fallback

          def loads_payload(raw):
              if raw is None:
                  return None
              text = str(raw).strip()
              if not text:
                  return None
              try:
                  parsed = json.loads(text)
              except ValueError:
                  return None
              if isinstance(parsed, str):
                  try:
                      parsed = json.loads(parsed)
                  except ValueError:
                      return None
              return parsed if isinstance(parsed, (dict, list)) else None

          def extract_interviews(document):
              rows = document.get("interviews") if isinstance(document, dict) else document
              if not isinstance(rows, list):
                  return None
              interviews = []
              for row in rows:
                  if not isinstance(row, dict):
                      continue
                  interview_id = str(row.get("interview_id") or row.get("id") or "").strip()
                  candidate = str(row.get("candidate") or "").strip()
                  job = str(row.get("job") or row.get("job_name") or "").strip()
                  interviewer = str(row.get("interviewer") or "").strip()
                  email = str(row.get("email") or row.get("interviewer_email") or "").strip()
                  status = str(row.get("status") or "").strip().lower()
                  scorecard = str(row.get("scorecard") or row.get("scorecard_status") or "").strip().lower()
                  if not interview_id or not candidate or not interviewer or "@" not in email:
                      continue
                  hours = None
                  try:
                      hours = int(row.get("hours_since_completion"))
                  except (TypeError, ValueError):
                      hours = None
                  if hours is None:
                      try:
                          moment = datetime.fromisoformat(
                              str(row.get("completed_at") or "").strip().replace("Z", "+00:00"))
                      except ValueError:
                          continue
                      if moment.tzinfo is None:
                          moment = moment.replace(tzinfo=timezone.utc)
                      hours = int((datetime.now(timezone.utc) - moment).total_seconds() // 3600)
                  interviews.append({
                      "interview_id": interview_id, "candidate": candidate, "job": job,
                      "interviewer": interviewer, "email": email, "status": status,
                      "scorecard": scorecard, "hours": max(hours, 0),
                  })
              return interviews or None

          def read_fixture():
              if not os.path.exists(FIXTURE) or os.path.getsize(FIXTURE) == 0:
                  return None
              try:
                  with open(FIXTURE, "r", encoding="utf-8") as handle:
                      return loads_payload(handle.read())
              except OSError:
                  return None

          sla = as_int(os.environ.get("SCORECARD_SLA_HOURS"), 48)
          interviews = extract_interviews(loads_payload(os.environ.get("GREENHOUSE_BODY")))
          source = "greenhouse_api" if interviews else "none"
          if not interviews:
              interviews = extract_interviews(read_fixture())
              source = "fixture" if interviews else "none"

          missing = []
          submitted = 0
          pending = 0
          for interview in interviews or []:
              if interview["status"] not in COMPLETED:
                  continue
              if interview["scorecard"] in SUBMITTED:
                  submitted += 1
              elif interview["hours"] >= sla:
                  missing.append(interview)
              else:
                  pending += 1

          groups = {}
          for interview in sorted(missing, key=lambda row: -row["hours"]):
              entry = groups.setdefault(interview["email"].lower(), {
                  "interviewer": interview["interviewer"], "email": interview["email"],
                  "interview_count": 0, "oldest_hours": 0, "interviews": [],
              })
              entry["interview_count"] += 1
              entry["oldest_hours"] = max(entry["oldest_hours"], interview["hours"])
              entry["interviews"].append({
                  "interview_id": interview["interview_id"],
                  "candidate": interview["candidate"],
                  "job": interview["job"],
                  "hours_overdue": interview["hours"],
              })

          interviewers = sorted(groups.values(), key=lambda row: -row["oldest_hours"])
          missing_count = len(missing)
          oldest_hours = interviewers[0]["oldest_hours"] if interviewers else 0
          verdict = "NO_DATA" if not interviews else ("CHASE_REQUIRED" if missing_count else "ALL_CLEAR")

          print("checked %d interview(s), %d overdue, %d submitted, %d pending, source %s" % (
              len(interviews or []), missing_count, submitted, pending, source))
          print("::" + json.dumps({"outputs": {
              "verdict": verdict, "missing_count": missing_count,
              "interviewers": interviewers, "oldest_hours": oldest_hours,
          }}) + "::")

  # --- 5. chase gate and escalation ---
  - id: chase_gate
    type: io.kestra.plugin.core.flow.If
    description: Branches on the overdue count so past-SLA scorecards escalate to per-interviewer emails, one Slack summary and one rollup issue, while a clean board is recorded without waking anyone.
    condition: "{{ outputs.analyze_scorecards.vars.missing_count > 0 }}"
    then:
      - id: chase_each_interviewer
        type: io.kestra.plugin.core.flow.Loop
        description: Walks the overdue interviewers one at a time so each person is chased about their own interviews instead of receiving one crowded digest.
        values: "{{ outputs.analyze_scorecards.vars.interviewers }}"
        concurrencyLimit: 1
        tasks:
          - id: email_interviewer
            type: io.kestra.plugin.email.MailSend
            description: Asks a single interviewer to submit every scorecard past the SLA, listing each candidate, job, interview id and hours since completion.
            from: "{{ secret('SMTP_FROM') }}"
            to: "{{ item.value.email }}"
            host: "{{ secret('SMTP_HOST') }}"
            username: "{{ secret('SMTP_USERNAME') }}"
            password: "{{ secret('SMTP_PASSWORD') }}"
            port: 465
            subject: "Scorecard overdue - {{ item.value.interview_count }} interview(s), oldest {{ item.value.oldest_hours }}h"
            htmlTextContent: |
              <p>{{ item.value.interviewer }},</p>
              <p><strong>{{ item.value.interview_count }}</strong> interview scorecard(s) are past the {{ inputs.scorecard_sla_hours }} hour SLA, the oldest waiting <strong>{{ item.value.oldest_hours }}</strong> hours.</p>
              <ul>
              {% for iv in item.value.interviews %}
              <li>{{ iv.candidate }} - {{ iv.job }} - {{ iv.interview_id }} - {{ iv.hours_overdue }} hours since completion</li>
              {% endfor %}
              </ul>
              <p>Submit each scorecard in Greenhouse before the debrief panel loses context, then close the rollup issue.</p>
              <p>Execution {{ execution.id }}</p>
      - id: alert_overdue_scorecards
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Posts one summary to the channel that leads with the overdue count and the oldest wait, then names every interviewer and how many scorecards they owe.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": "Greenhouse scorecard chase - {{ outputs.analyze_scorecards.vars.missing_count }} scorecard(s) past the {{ inputs.scorecard_sla_hours }}h SLA, oldest {{ outputs.analyze_scorecards.vars.oldest_hours }} hours. {% for g in outputs.analyze_scorecards.vars.interviewers %}{{ g.interviewer }} owes {{ g.interview_count }} (oldest {{ g.oldest_hours }}h). {% endfor %}Execution {{ execution.id }}."}
      - id: open_rollup_issue
        type: io.kestra.plugin.github.issues.Create
        description: Opens one rollup issue listing every overdue scorecard with interviewer, candidate, job, interview id and hours late, so the whole batch is worked as a single ticket.
        jwtToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.escalation_repo }}"
        title: "Overdue interview scorecards - {{ outputs.analyze_scorecards.vars.missing_count }} past SLA"
        body: |
          ## Overdue interview scorecards

          **{{ outputs.analyze_scorecards.vars.missing_count }}** scorecard(s) are past the {{ inputs.scorecard_sla_hours }} hour SLA, the oldest waiting **{{ outputs.analyze_scorecards.vars.oldest_hours }}** hours.

          {% for g in outputs.analyze_scorecards.vars.interviewers %}
          ### {{ g.interviewer }} ({{ g.email }}) - {{ g.interview_count }} overdue, oldest {{ g.oldest_hours }}h
          {% for iv in g.interviews %}- {{ iv.candidate }} - {{ iv.job }} - {{ iv.interview_id }} - {{ iv.hours_overdue }}h since completion
          {% endfor %}
          {% endfor %}

          Verdict **{{ outputs.analyze_scorecards.vars.verdict }}** from {{ flow.id }} execution {{ execution.id }}. Submit every scorecard listed above in Greenhouse, then close this issue.
        labels:
          - recruiting
          - scorecards
    else:
      - id: log_all_clear
        type: io.kestra.plugin.core.log.Log
        description: Records the clean board in execution history so a run with nothing overdue still leaves evidence that the SLA was checked.
        message: "No scorecard past the SLA - verdict {{ outputs.analyze_scorecards.vars.verdict }}, missing_count {{ outputs.analyze_scorecards.vars.missing_count }}, oldest_hours {{ outputs.analyze_scorecards.vars.oldest_hours }}."

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Escalate any failure to the ops channel with the execution url.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "FAILED: {{ flow.id }} {{ execution.id }}"}

outputs:
  - id: verdict
    type: STRING
    description: One of CHASE_REQUIRED, ALL_CLEAR or NO_DATA depending on whether any scorecard sits past the SLA.
    value: "{{ outputs.analyze_scorecards.vars.verdict }}"
  - id: missing_count
    type: INT
    description: Number of completed interviews still missing a scorecard at or after the SLA, zero on a clean board.
    value: "{{ outputs.analyze_scorecards.vars.missing_count }}"
  - id: interviewers
    type: ARRAY
    description: 'Overdue interviewers as objects, for example [{"interviewer": "Alice Nguyen", "email": "alice.nguyen@example.com", "interview_count": 1, "oldest_hours": 62, "interviews": [{"interview_id": "iv-20401", "candidate": "Dana Okafor", "job": "Senior Backend Engineer", "hours_overdue": 62}]}].'
    value: "{{ outputs.analyze_scorecards.vars.interviewers | toJson }}"
  - id: oldest_hours
    type: INT
    description: Longest wait among overdue scorecards in hours, zero when nothing is overdue.
    value: "{{ outputs.analyze_scorecards.vars.oldest_hours }}"

extend:
  title: Chase Overdue Interview Scorecards Before Debiasing the Panel
  metaTitle: Overdue Greenhouse Interview Scorecard Chase
  shortDescription: Flag completed Greenhouse interviews whose scorecards are past the SLA, email each interviewer, alert Slack and open one rollup issue.
  metaDescription: Flag completed Greenhouse interviews whose scorecards are past the SLA, chase each interviewer by email, alert Slack and open one rollup issue.
  description: |
    A scorecard written three days after the interview is a reconstruction, not a recollection, and the panel that already discussed the candidate has quietly set the bar. This flow turns the gap between interview completion and scorecard submission into an enforced SLA, so recruiting sees the overdue list while memory is still sharp instead of after the offer decision.

    ## How it works

    1. `interview_completed` (`io.kestra.plugin.core.trigger.Webhook`, keyed) accepts the completion event from Greenhouse hooks or recruiting ops and starts the chase on the spot. `weekly_scorecard_sweep` (`io.kestra.plugin.core.trigger.Schedule`, cron `0 6 * * 1`) is the Monday morning net that re-checks the whole board once someone switches it on.
    2. `scorecard_workspace` (`io.kestra.plugin.core.flow.WorkingDirectory`) gives the run one directory, so the file written by the shell task is the file the analysis script reads.
    3. `write_fixture` (`io.kestra.plugin.scripts.shell.Commands`) drops `interviews.json` through a heredoc of six recent completions. Two rows carry no scorecard past 48 hours, one row has a submitted scorecard, and three rows are still inside the window at 30, 12 and 5 hours.
    4. `fetch_interviews` (`io.kestra.plugin.core.http.Request`) calls `GET https://harvest.greenhouse.io/v1/interviews?per_page=50` with `Authorization: Bearer {{ secret('GREENHOUSE_API_TOKEN') }}`. `options.allowFailed: true` means a 4xx or 5xx answer degrades to the fixture instead of killing the chase.
    5. `analyze_scorecards` (`io.kestra.plugin.scripts.python.Script`) parses the API body or falls back to the fixture, keeps completed interviews whose scorecard is not submitted, and marks one missing when `hours_since_completion` reaches `scorecard_sla_hours` (or derives the hours from a `completed_at` timestamp on the live payload). It groups the overdue set by interviewer email and prints the repo-standard `::` plus json outputs plus `::` payload carrying `verdict`, `missing_count`, `interviewers` and `oldest_hours`, reporting `NO_DATA` when neither source yields a usable interview.
    6. `chase_gate` (`io.kestra.plugin.core.flow.If`) branches on `missing_count` being above zero.
    7. In the chase branch `chase_each_interviewer` (`io.kestra.plugin.core.flow.Loop`) walks the overdue interviewers one at a time and `email_interviewer` (`io.kestra.plugin.email.MailSend`) asks that person to submit each listed scorecard. `alert_overdue_scorecards` (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) posts one summary naming every interviewer and their oldest wait, and `open_rollup_issue` (`io.kestra.plugin.github.issues.Create`) files a single labeled issue holding the full batch. The quiet branch records `log_all_clear` (`io.kestra.plugin.core.log.Log`) with the verdict.
    8. The `errors` block posts to Slack whenever the fixture, the pull or a notifier breaks, because a crashed chase must never look like a clean board.

    ## What you get

    - `verdict` (STRING): `CHASE_REQUIRED` when at least one scorecard is past the SLA, `ALL_CLEAR` when none is, `NO_DATA` when no usable interviews arrive from either source.
    - `missing_count` (INT): completed interviews still missing a scorecard at or after the SLA, zero on a clean board.
    - `interviewers` (ARRAY): one object per overdue interviewer with `interviewer`, `email`, `interview_count`, `oldest_hours` and the `interviews` they owe, sorted by the oldest wait.
    - `oldest_hours` (INT): longest wait among overdue scorecards in hours, zero when nothing is overdue.
    - One email per overdue interviewer, one Slack summary and one rollup issue when action is required, plus a log line when it is not.

    ## Who it's for

    - Recruiting coordinators who own scorecard collection and cannot let a debrief panel run on missing or late write-ups.
    - Hiring managers who want the overdue list surfaced before the candidate reaches the offer stage.
    - Interview operations teams who prefer one rollup ticket and a targeted interviewer email over chasing people in direct messages.

    ## Why orchestrate this with Kestra

    A calendar nudge works only until somebody clears it, and a Greenhouse report runs only when somebody remembers to open it. Kestra gives the chase a keyed webhook and a disabled weekly schedule, a branch that separates a late board from a clean one, a loop that turns one API pull into one email per interviewer, and SMTP, Slack and GitHub routing from a single versioned file. The verdict, the missing count, the interviewer list and the oldest wait are typed outputs, so a hiring dashboard or a downstream offer gate can read the state without scraping logs, and the `errors` handler keeps a broken run visible.

    ## Prerequisites

    - Python 3 and a shell on the Kestra worker, the calculation uses only `json`, `os` and `datetime`, plus a Greenhouse Harvest API token with read access to interviews.
    - An SMTP relay reachable from the worker, with a sender address allowed to use it.
    - A Slack incoming webhook for the overdue summary and for failure alerts.
    - A GitHub token that can open issues in `escalation_repo`, with classic PAT scope `repo` or fine-grained **Issues: write**.
    - Your own Greenhouse export in place of the heredoc fixture, keeping the same interview fields.

    ### Secrets

    - `INTERVIEW_COMPLETION_WEBHOOK_KEY`: key segment guarding the webhook URL, anyone holding it can start a chase.
    - `GREENHOUSE_API_TOKEN`: bearer token used by `fetch_interviews` against the Harvest API.
    - `SMTP_FROM`, `SMTP_HOST`, `SMTP_USERNAME`, `SMTP_PASSWORD`: relay and credentials used by `email_interviewer`.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the overdue summary and for failure alerts.
    - `GITHUB_TOKEN`: token used to open the rollup issue.

    ## Quick start

    1. Add the eight secrets to your namespace and import the flow.
    2. Run once with the default inputs. The bundled fixture puts Alice Nguyen at 62 hours and Bruno Costa at 55 hours without scorecards, so the run reports `verdict: CHASE_REQUIRED`, `missing_count: 2` and `oldest_hours: 62`, emails two interviewers, posts the summary to Slack and opens the rollup issue.
    3. Raise `scorecard_sla_hours` to 72 and run again to watch the same fixture degrade to `verdict: ALL_CLEAR` with `missing_count: 0`, because the two overdue rows fall back inside the window.
    4. Empty the heredoc rows inside `write_fixture` and clear the API body to see `NO_DATA` recorded by the gate.
    5. Trigger `interview_completed` at `/api/v1/{tenant}/executions/webhook/{namespace}/greenhouse-scorecard-chase/{INTERVIEW_COMPLETION_WEBHOOK_KEY}`, then enable `weekly_scorecard_sweep` once your Harvest token is in place.

    ## How to extend

    - Replace the heredoc with a scheduled `io.kestra.plugin.core.http.Request` pull per open job, keeping the same python verdict and the fixture as the offline fallback.
    - Add a second SLA tier as a new input, so scorecards between forty-eight and ninety-six hours get a Slack line without a personal email.
    - Group the loop by hiring manager when one person wants a digest of every interviewer on their req instead of one mail per interviewer.
    - Escalate to the hiring manager over email as well when any single scorecard crosses ninety-six hours.
    - Persist `interviewers` for trend reporting with `io.kestra.plugin.jdbc.postgresql.Queries` or ship the snapshot to `io.kestra.plugin.aws.s3.Upload`.

    ## Links

    - [Kestra workflow triggers](https://kestra.io/docs/workflow-triggers)
    - [Greenhouse Harvest API](https://developers.greenhouse.io/harvest.html)
    - [Kestra email plugin](https://kestra.io/plugins/plugin-email)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)
    - [Kestra GitHub plugin](https://kestra.io/plugins/plugin-github)
  tags:
    - Business
  subTags:
    - recruiting
    - interviews
    - scorecards
    - greenhouse
    - hiring
  ee: false
  demo: false
