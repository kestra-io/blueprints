id: backfill-example-nyc-taxi-monthly
namespace: company.team
description: |
  Example partition job for the safe-backfill-controller blueprint. It computes
  trip metrics for one month of NYC yellow taxi data straight from the public
  Parquet file with DuckDB, and stores the result under a key for that month, so
  re-running a month replaces its result instead of duplicating it.

inputs:
  - id: partition_start
    type: DATE
    displayName: Partition start
    description: First day of the month to process (inclusive).
    defaults: "2024-01-01"
  - id: partition_end
    type: DATE
    displayName: Partition end
    description: First day of the next month (exclusive).
    defaults: "2024-02-01"

triggers:
  - id: monthly_refresh
    type: io.kestra.plugin.core.trigger.Schedule
    description: Process the previous month on the 15th, once NYC TLC has published it. Backfills of older months go through the controller instead.
    cron: "0 6 15 * *"
    disabled: true
    inputs:
      partition_start: "{{ trigger.date | dateAdd(-1, 'MONTHS') | date('yyyy-MM-01') }}"
      partition_end: "{{ trigger.date | date('yyyy-MM-01') }}"

tasks:
  - id: monthly_metrics
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: Read only the needed columns of the month's Parquet file over HTTP (DuckDB loads its httpfs extension automatically) and aggregate them. A month that isn't published yet fails here, which is what the controller retries later.
    sql: |
      SELECT
        '{{ inputs.partition_start | date('yyyy-MM') }}' AS month,
        COUNT(*) AS trips,
        ROUND(AVG(trip_distance), 2) AS avg_distance_miles,
        ROUND(AVG(fare_amount), 2) AS avg_fare_usd,
        CAST(ROUND(SUM(total_amount)) AS BIGINT) AS revenue_usd
      FROM read_parquet('https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_{{ inputs.partition_start | date('yyyy-MM') }}.parquet')
      WHERE tpep_pickup_datetime >= TIMESTAMP '{{ inputs.partition_start }}'
        AND tpep_pickup_datetime < TIMESTAMP '{{ inputs.partition_end }}'
    fetchType: FETCH_ONE

  - id: quality_gate
    type: io.kestra.plugin.core.flow.If
    description: Refuse to store an empty month, so a partition with no data is never checkpointed as done.
    condition: "{{ outputs.monthly_metrics.row.trips == 0 }}"
    then:
      - id: empty_month
        type: io.kestra.plugin.core.execution.Fail
        description: Fail the partition so the backfill controller retries it later.
        errorMessage: "No trips found between {{ inputs.partition_start }} and {{ inputs.partition_end }}."
    else:
      - id: store_result
        type: io.kestra.plugin.core.kv.Set
        description: Upsert the month's metrics under one key per month, so the job is idempotent and safe to re-run.
        key: "nyc_taxi_metrics_{{ inputs.partition_start | date('yyyy_MM') }}"
        kvType: JSON
        value: "{{ outputs.monthly_metrics.row | toJson }}"

      - id: log_result
        type: io.kestra.plugin.core.log.Log
        description: Record the month's headline numbers in the execution logs.
        message: "{{ outputs.monthly_metrics.row.month }}: {{ outputs.monthly_metrics.row.trips }} trips, ${{ outputs.monthly_metrics.row.revenue_usd }} revenue."

outputs:
  - id: metrics
    type: JSON
    displayName: Monthly metrics
    value: "{{ outputs.monthly_metrics.row }}"

extend:
  shortDescription: Compute monthly NYC taxi trip metrics with DuckDB straight from public Parquet files, as an idempotent partition job for backfills.
  title: Monthly NYC Taxi Metrics with DuckDB as a Backfill Partition Job
  metaTitle: Monthly NYC Taxi Metrics with DuckDB
  description: |
    A small, real data job built to be backfilled. Given a month as `partition_start` and `partition_end`, it reads that month's NYC yellow taxi trips directly from the public TLC Parquet file with DuckDB, computes trip count, average distance, average fare and revenue, and stores the result under one key per month. Re-running a month overwrites its result, which makes the job safe to retry. It's the example job for the `safe-backfill-controller` blueprint, and it's a useful template for any partitioned job.

    ## How it works
    1. `monthly_metrics` (`io.kestra.plugin.jdbc.duckdb.Query`) runs one SQL query over `https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_<yyyy-MM>.parquet`. DuckDB loads its HTTP extension automatically and reads only the columns the query needs, so it never downloads the whole file. A month that isn't published yet fails here.
    2. `quality_gate` (`io.kestra.plugin.core.flow.If`) fails the run with `empty_month` when the window has no trips, so an empty partition is never stored or checkpointed as done.
    3. Otherwise `store_result` (`io.kestra.plugin.core.kv.Set`) upserts the metrics as JSON under `nyc_taxi_metrics_<yyyy_MM>`, and `log_result` logs the headline numbers.
    4. The `monthly_refresh` trigger (`io.kestra.plugin.core.trigger.Schedule`, shipped disabled) processes the previous month on the 15th, after TLC publishes it, by setting the partition inputs from `trigger.date`.

    ## What you get
    - Real monthly metrics from a public dataset, with no account, credentials or download step.
    - An idempotent job: one result per month, overwritten on re-run.
    - A data-quality gate that refuses to store empty months.
    - A template for the partition contract the backfill controller expects: `partition_start` inclusive, `partition_end` exclusive.

    ## Who it's for
    - Anyone trying the `safe-backfill-controller` blueprint.
    - Data engineers looking for a DuckDB-over-HTTP pattern for remote Parquet files.

    ## Why orchestrate this with Kestra
    The same flow serves the monthly schedule and historical backfills. Kestra passes the partition as typed inputs, keeps a log and output per month, and lets the controller run it per partition with checkpoints. There's no separate script to maintain for backfills.

    ## Prerequisites
    - Outbound HTTPS from the Kestra worker to `d37ci6vzurychx.cloudfront.net`.
    - No secrets are needed.

    ### Inputs
    - `partition_start` (DATE, default `2024-01-01`): first day of the month, inclusive.
    - `partition_end` (DATE, default `2024-02-01`): first day of the next month, exclusive.

    ### Outputs
    - `{{ outputs.metrics }}` (flow output) / `{{ outputs.monthly_metrics.row }}`: `month`, `trips`, `avg_distance_miles`, `avg_fare_usd` and `revenue_usd` (whole dollars).
    - KV key `nyc_taxi_metrics_<yyyy_MM>`: the stored metrics for the month.

    ## Quick start
    1. Save the flow and run it with the defaults to get January 2024's metrics.
    2. To backfill many months, run `safe-backfill-controller` with this flow as `job_flow_id`.

    ## How to extend
    - Load the results into a warehouse table instead of the KV store, for example with `io.kestra.plugin.jdbc.postgresql.Query` using an upsert on the month.
    - Switch to green taxi or for-hire vehicle data by changing the file name in the URL.
    - Add metrics such as tips, airport trips or trips per borough using the TLC zone lookup.

    ## Links
    - DuckDB plugin: https://kestra.io/plugins/plugin-jdbc-duckdb
    - NYC TLC trip record data: https://www.nyc.gov/site/tlc/about/tlc-trip-record-data.page
    - DuckDB reading Parquet over HTTP: https://duckdb.org/docs/extensions/httpfs/https

    - This blueprint has been created by [Biplab Bera](https://github.com/bishalbera)
  tags:
    - Data
  subTags:
    - ELT & Data Landing
  ee: false
  demo: false
  metaDescription: Compute monthly NYC taxi trip metrics with DuckDB from public Parquet files in Kestra, as an idempotent job ready for partitioned backfills.
