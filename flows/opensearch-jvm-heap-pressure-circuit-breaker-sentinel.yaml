id: opensearch-jvm-heap-pressure-circuit-breaker-sentinel
namespace: company.search
inputs:
- id: opensearch_host
  type: STRING
  defaults: opensearch.internal
  description: Hostname or IP of OpenSearch node.
- id: opensearch_port
  type: INT
  defaults: 9200
  description: OpenSearch HTTP port.
- id: heap_threshold_pct
  type: INT
  defaults: 85
  description: Maximum allowable JVM heap used percentage before alerting (default
    85%).
- id: opensearch_user
  type: STRING
  defaults: admin
  description: OpenSearch username for authentication.
tasks:
- id: query_node_stats
  type: io.kestra.plugin.scripts.python.Script
  containerImage: python:3.11-slim
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  beforeCommands:
  - pip install requests kestra
  env:
    OPENSEARCH_HOST: '{{ inputs.opensearch_host }}'
    OPENSEARCH_PORT: '{{ inputs.opensearch_port }}'
    OPENSEARCH_USER: '{{ inputs.opensearch_user }}'
    OPENSEARCH_PASSWORD: '{{ secret(''OPENSEARCH_PASSWORD'') }}'
  script: "import os\nimport sys\nimport requests\nfrom requests.auth import HTTPBasicAuth\n\
    from kestra import Kestra\n\nhost = os.environ.get(\"OPENSEARCH_HOST\", \"opensearch.internal\"\
    )\nport = os.environ.get(\"OPENSEARCH_PORT\", \"9200\")\nuser = os.environ.get(\"\
    OPENSEARCH_USER\", \"admin\")\npassword = os.environ.get(\"OPENSEARCH_PASSWORD\"\
    , \"\")\n\nauth = HTTPBasicAuth(user, password) if user or password else None\n\
    url = f\"http://{host}:{port}/_nodes/stats/jvm\"\n\ntry:\n    resp = requests.get(url,\
    \ auth=auth, timeout=12)\n    resp.raise_for_status()\n    payload = resp.json()\n\
    except Exception as err:\n    sys.stderr.write(f\"Failed to query OpenSearch JVM\
    \ node stats from {url}: {err}\\n\")\n    sys.exit(1)\n\nnodes = payload.get(\"\
    nodes\", {})\nheaps = []\nfor nid, ndata in nodes.items():\n    pct = ndata.get(\"\
    jvm\", {}).get(\"mem\", {}).get(\"heap_used_percent\")\n    if pct is not None:\n\
    \        heaps.append(int(pct))\n\nmax_heap_pct = max(heaps) if heaps else 0\n\
    \nKestra.outputs({\n    \"max_heap_pct\": max_heap_pct\n})\n"
- id: evaluate_heap_pressure
  type: io.kestra.plugin.core.flow.If
  condition: '{{ outputs.query_node_stats.vars.max_heap_pct >= inputs.heap_threshold_pct
    }}'
  then:
  - id: notify_search_team
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: '{{ secret(''SLACK_WEBHOOK'') }}'
    payload: "{\n  \"channel\": \"#search-alerts\",\n  \"attachments\": [\n    {\n\
      \      \"color\": \"danger\",\n      \"title\": \"\U0001F6A8 OpenSearch JVM\
      \ Heap Memory Pressure Alert\",\n      \"text\": \"OpenSearch cluster at `{{\
      \ inputs.opensearch_host }}` reached peak JVM heap utilization of *{{ outputs.query_node_stats.vars.max_heap_pct\
      \ }}%* (threshold {{ inputs.heap_threshold_pct }}%)! Prolonged concurrent garbage\
      \ collection pauses and OutOfMemoryError node crashes are imminent.\",\n   \
      \   \"footer\": \"Kestra Search Sentinel \u2022 OpenSearch\"\n    }\n  ]\n}"
errors:
- id: alert_pipeline_failure
  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
  url: '{{ secret(''SLACK_WEBHOOK'') }}'
  payload: "{\n  \"channel\": \"#search-alerts\",\n  \"attachments\": [\n    {\n \
    \     \"color\": \"danger\",\n      \"title\": \"\u26A0\uFE0F OpenSearch JVM Sentinel\
    \ Failure\",\n      \"text\": \"Failed to query OpenSearch _nodes/stats/jvm. Verify\
    \ host address and credentials.\",\n      \"footer\": \"Kestra Workflow Failure\
    \ Sentinel\"\n    }\n  ]\n}\n"
triggers:
- id: periodic_schedule
  type: io.kestra.plugin.core.trigger.Schedule
  cron: '*/15 * * * *'
  disabled: true
extend:
  metaDescription: Monitors OpenSearch cluster nodes for JVM heap memory pressure
    exceeding 85% to prevent out-of-memory crashes.
  metaTitle: OpenSearch Cluster JVM Heap Memory Pressure and Breaker Sentinel with
    Kestra
  title: OpenSearch Cluster JVM Heap Memory Pressure and Breaker Sentinel
  shortDescription: Monitors OpenSearch cluster nodes for JVM heap memory pressure
    exceeding 85% to prevent out-of-memory crashes.
  description: '## How it works

    This workflow connects to the OpenSearch Nodes Stats API (`/_nodes/stats/jvm`)
    using basic authentication to evaluate `heap_used_percent` across all cluster
    nodes. In OpenSearch, when heap utilization exceeds 85%, the JVM experiences prolonged
    "Stop the World" garbage collection pauses. Nodes become unresponsive to cluster
    state pings, get ejected by the cluster manager as dead nodes, and trigger expensive
    index shard reallocations that worsen cluster overload. This workflow continuously
    inspects heap pressure and raises alerts before node ejections occur.


    ## What you get

    - Real-time detection of critical JVM heap memory exhaustion in OpenSearch.

    - Prevents node ejections, shard unassigned states, and query timeouts.

    - Quantitative metrics on maximum heap utilization across data nodes.


    ## Who it''s for

    - OpenSearch Cluster Administrators and Search Platform Engineers.

    - SREs maintaining high-volume search and log analytics clusters.


    ## Why orchestrate this with Kestra

    - **Continuous Cluster Health Auditing**: Regularly polls node health metrics
    without standalone monitoring daemons.

    - **Secure Credential Injection**: Passes OpenSearch credentials safely via Kestra
    secrets.

    - **Instant Team Escalation**: Delivers structured notifications with heap metrics
    to Slack.


    ## Prerequisites

    - OpenSearch cluster with HTTP API reachable.

    - Secrets `OPENSEARCH_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.


    ## Quick start

    1. Import the blueprint.

    2. Input OpenSearch host, port, and user.

    3. Run the workflow to inspect node heap utilization.


    ## How to extend

    - Query fielddata and query cache memory footprint directly via `_nodes/stats/indices`.

    - Automatically clear search cache via `POST /_cache/clear` when heap approaches
    90%.


    ## Links

    - [OpenSearch Node Stats API Documentation](https://opensearch.org/docs/latest/api-reference/nodes-apis/nodes-stats/)

    - [Kestra Documentation](https://kestra.io/docs)

    '
  tags:
  - Data
  - Infrastructure
  subTags:
  - ELT & Data Landing
  - Day 2 Operations
  ee: false
  demo: false
outputs:
- id: max_heap_pct
  type: INT
  value: '{{ outputs.query_node_stats.vars.max_heap_pct }}'
