id: pylint-python-code-quality-and-fatal-bug-deployment-gate
namespace: company.security

extend:
  title: Pylint Python Code Quality and Fatal Bug Deployment Gate
  metaTitle: Pylint Python Code Quality and Fatal Bug Deployment Gate
  shortDescription: Gate Python service deployments with Pylint static analysis to block fatal bugs and undefined variables before production release.
  metaDescription: Enforce Python code quality gates with Pylint. Block fatal runtime bugs, undefined variables, and import errors while alerting on non-blocking code smells.
  description: |
    ## How it works
    This blueprint implements an automated quality and reliability deployment gate for Python applications using `pylint`, the comprehensive static code analysis tool for Python. Unlike simple formatters or syntax linters, Pylint inspects AST structures to detect high-risk runtime failure patterns including undefined variables, missing imports, unhandled exception paths, and dangerous mutable default arguments.

    The workflow runs across four orchestrated stages:
    1. **Ingest and Scan**: Receives a Python project tarball via CI/CD webhook or manual UI execution, unpacks the source code in an isolated container running `python:3.11-slim`, and executes `pylint --output-format=json` with configurable rule disables.
    2. **Static Quality Triage**: Evaluates JSON findings across Pylint's core taxonomy: `fatal` and `error` items (guaranteed runtime crashes such as `E0602` undefined variables or `E1101` nonexistent attributes) versus `warning` and `refactor` items (dangerous patterns and code smells).
    3. **Gate Classification**: If any fatal error is detected (or if strict mode is enabled and warnings exist), the gate classifies as `BLOCK_FATAL_ERROR`. If only warnings, refactor suggestions, or conventions exist, it classifies as `WARN_CODE_SMELL`. Clean codebases evaluate to `PASS_CLEAN`.
    4. **Enforcement and Alerting**: Routes through a flow Switch task. Fatal runtime bugs trigger an urgent Slack alert containing the error symbol, message, and file line location, then halt the pipeline with a Fail task to prevent packaging or deployment. Advisory warnings notify Slack for sprint backlog triage without blocking deployment. Clean scans log confirmation and pass immediately.

    ## What you get
    - **Zero Preventable Crashes in Production**: Blocks release of Python modules containing `NameError`, `AttributeError`, or `ImportError` bugs before services are containerized or deployed to Kubernetes.
    - **Nuanced Release Gating**: Distinguishes between critical operational blockers that crash production workers and minor stylistic conventions (e.g. docstring formatting) that can be improved in regular development cycles.
    - **Configurable Rule Exclusions**: Allows platform teams to customize ignored rule codes (e.g. `C0114`, `C0115`) while keeping critical runtime safety checks strictly enforced.
    - **Compliance & Audit Archiving**: Stores complete scanner reports (`pylint-report.json`) and structured quality records (`pylint-summary.json`) in Kestra internal storage for engineering quality audits.

    ## Who it's for
    - **Python Backend Engineers**: Protecting API services and background workers from silent runtime exceptions caused by refactoring oversights or missing variable definitions.
    - **Data Platform & ML Engineers**: Ensuring data transformation scripts, Airflow DAGs, and model serving endpoints adhere to strict code quality standards before release.
    - **DevOps & Release Engineers**: Embedding automated, deterministic code quality verification into deployment pipelines with clear Slack notifications.

    ## Why orchestrate this with Kestra
    - **Ephemeral Container Isolation**: Runs Pylint in clean Docker containers without requiring local Python toolchain dependencies or linters installed on CI host machines.
    - **Declarative Quality Branching**: Combines return classification with declarative Switch branching, separating blocking production stoppages from advisory notifications.
    - **Encrypted Secret Handling**: Protects Slack incoming webhook URLs and webhook authentication tokens using encrypted Kestra secrets.
    - **Centralized Quality History**: Retains complete execution logs, container outputs, and JSON findings directly in Kestra for historical code quality trend tracking.

    ## Prerequisites
    - Docker daemon or container runtime accessible to the Kestra worker executing container tasks.
    - Slack Incoming Webhook URL configured for the target quality notification channel.
    - Python project repository packaged as a `.tar.gz` archive containing `.py` source files.

    ### Secrets
    Configure the following secrets in your Kestra namespace or key-value store:
    - `SLACK_WEBHOOK_URL`: Full Incoming Webhook URL for the Slack channel receiving quality notifications.
    - `PYLINT_GATE_WEBHOOK_KEY`: Secret authentication key required by the inbound webhook trigger.

    ## Quick start
    1. Create the required secrets `SLACK_WEBHOOK_URL` and `PYLINT_GATE_WEBHOOK_KEY` in your Kestra namespace.
    2. Package your Python repository into an archive: `tar -czf app-bundle.tar.gz ./src requirements.txt pyproject.toml`.
    3. In the Kestra UI, navigate to this flow and click **Execute**.
    4. Under **Inputs**, upload `app-bundle.tar.gz` to `python_project_bundle`.
    5. Review the execution topology: inspect `classify_quality_gate` to view the quality breakdown and check Slack for the generated triage card.

    ## How to extend
    - **Automated Issue Tracking**: Add an HTTP task in the `BLOCK_FATAL_ERROR` branch to automatically create GitHub Issues or Jira tickets with the failure location and error message.
    - **Type Checking Integration**: Add a subsequent step running `mypy` to enforce strict type annotations alongside Pylint AST analysis.
    - **Quality Score Thresholds**: Extend the Python evaluation script to enforce a minimum Pylint evaluation score (e.g. minimum 8.5/10) before permitting release.

    ## Links
    - [Pylint Official Documentation](https://pylint.pycqa.org/)
    - [Pylint Message Index](https://pylint.pycqa.org/en/latest/user_guide/messages/messages_overview.html)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-notifications)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Approval Gates
  ee: false
  demo: false

inputs:
  - id: python_project_bundle
    type: FILE
    displayName: Python Project Archive
    description: Tarball (.tar.gz) containing the Python repository with pyproject.toml, requirements.txt, or Python package source code. When triggered by CI webhook, this is passed directly from the build step.
    required: false

  - id: strict_mode
    type: BOOL
    displayName: Strict Quality Enforcement
    description: When true, fail the deployment gate on any quality finding (including warnings, refactor suggestions, and conventions). When false (recommended), only block fatal errors and bug-level issues.
    required: false
    defaults: false

  - id: ignore_rules
    type: STRING
    displayName: Ignored Rule IDs
    description: Comma-separated list of Pylint rule codes or symbol names to disable (e.g. 'C0114,C0115,R0903'). Defaults to standard non-blocking style rules.
    required: false
    defaults: "C0114,C0115,C0116"

  - id: slack_channel
    type: STRING
    displayName: Slack Notification Channel
    description: Slack channel for Python quality gate triage notifications.
    required: false
    defaults: "#dev-quality-alerts"

triggers:
  - id: scan_on_pr_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Inbound webhook endpoint for CI/CD runners (GitHub Actions, GitLab CI) to submit Python repository archives for static quality analysis.
    key: "{{ secret('PYLINT_GATE_WEBHOOK_KEY') }}"
    fetchType: STORE
    disabled: true

tasks:
  - id: scan_python_quality
    type: io.kestra.plugin.scripts.shell.Commands
    description: Execute Pylint static code analysis against Python codebase in a container and parse JSON findings.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    allowFailure: true
    outputFiles:
      - pylint-summary.json
      - pylint-report.json
    commands:
      - |
        set -euo pipefail

        echo "Initializing Pylint quality inspection environment..."
        pip install --no-cache-dir pylint > /dev/null 2>&1

        BUNDLE_PATH="{{ trigger.uri is defined ? trigger.uri : (inputs.python_project_bundle is defined ? inputs.python_project_bundle : '') }}"

        if [ -z "${BUNDLE_PATH}" ] || [ ! -f "${BUNDLE_PATH}" ]; then
          echo "No valid Python repository archive provided. Emitting UNREACHABLE diagnostic status."
          cat <<'EOF' > pylint-summary.json
        {
          "gate_status": "UNREACHABLE",
          "total_issues": 0,
          "fatal_error_count": 0,
          "warning_count": 0,
          "refactor_count": 0,
          "convention_count": 0,
          "fatal_errors": [],
          "warnings": [],
          "error_message": "Repository bundle was missing or could not be located."
        }
        EOF
          touch pylint-report.json
          exit 0
        fi

        ORIGINAL_DIR="$(pwd)"
        mkdir -p /build/app
        tar -xzf "${BUNDLE_PATH}" -C /build/app
        cd /build/app

        DISABLE_RULES="{{ inputs.ignore_rules }}"
        DISABLE_ARG=""
        if [ -n "${DISABLE_RULES}" ]; then
          DISABLE_ARG="--disable=${DISABLE_RULES}"
        fi

        echo "Executing Pylint static analysis..."
        pylint --recursive=y ${DISABLE_ARG} --output-format=json /build/app > /build/app/pylint-report.json 2> /build/app/pylint.log || true
        cp /build/app/pylint-report.json "${ORIGINAL_DIR}/pylint-report.json"

        echo "Parsing Pylint findings with quality gate classifier..."
        python3 - <<'PYEOF'
        import json
        import os
        import sys

        report_path = "pylint-report.json"

        issues = []
        if os.path.exists(report_path):
            try:
                with open(report_path, "r", encoding="utf-8", errors="ignore") as f:
                    data = json.load(f)
                    if isinstance(data, list):
                        issues = data
            except Exception:
                pass

        strict_mode = "{{ inputs.strict_mode }}".lower() == "true"

        fatal_errors = []
        warnings = []
        refactors = []
        conventions = []

        for item in issues:
            itype = str(item.get("type", "")).lower()
            symbol = str(item.get("symbol", "unknown"))
            msg = str(item.get("message", "Quality finding"))
            msg_id = str(item.get("message-id", "UNKNOWN"))
            path = str(item.get("path", "unknown"))
            line = str(item.get("line", ""))

            record = {
                "type": itype,
                "message_id": msg_id,
                "symbol": symbol,
                "message": msg,
                "location": f"{path}:{line}"
            }

            if itype in ["fatal", "error"]:
                fatal_errors.append(record)
            elif itype == "warning":
                warnings.append(record)
            elif itype == "refactor":
                refactors.append(record)
            else:
                conventions.append(record)

        if fatal_errors or (strict_mode and (warnings or refactors)):
            gate_status = "BLOCK_FATAL_ERROR"
        elif warnings or refactors:
            gate_status = "WARN_CODE_SMELL"
        else:
            gate_status = "PASS_CLEAN"

        summary_data = {
            "gate_status": gate_status,
            "total_issues": len(issues),
            "fatal_error_count": len(fatal_errors),
            "warning_count": len(warnings),
            "refactor_count": len(refactors),
            "convention_count": len(conventions),
            "fatal_errors": fatal_errors,
            "warnings": warnings
        }

        with open("pylint-summary.json", "w", encoding="utf-8") as out:
            json.dump(summary_data, out, indent=2)

        print(f"Pylint scan complete: {len(fatal_errors)} fatal/errors, {len(warnings)} warnings, {len(refactors)} refactors. Gate status: {gate_status}")
        PYEOF

        cp pylint-summary.json "${ORIGINAL_DIR}/pylint-summary.json"

  - id: classify_quality_gate
    type: io.kestra.plugin.core.debug.Return
    description: Classifies scan results into BLOCK_FATAL_ERROR, WARN_CODE_SMELL, PASS_CLEAN, or UNREACHABLE.
    format: "{{ outputs.scan_python_quality.outputFiles is defined and outputs.scan_python_quality.outputFiles['pylint-summary.json'] is defined ? (read(outputs.scan_python_quality.outputFiles['pylint-summary.json']) | jq('.gate_status') | first) : 'UNREACHABLE' }}"

  - id: route_by_quality_status
    type: io.kestra.plugin.core.flow.Switch
    description: Routes execution based on Python static quality classification.
    value: "{{ outputs.classify_quality_gate.value }}"
    cases:
      "BLOCK_FATAL_ERROR":
        - id: alert_fatal_error_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Notify engineering team of critical Python runtime error blocking deployment.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "*Pylint Code Quality Gate BLOCKED*\n*Status:* BLOCK_FATAL_ERROR\n*Fatal / Runtime Errors:* {{ read(outputs.scan_python_quality.outputFiles['pylint-summary.json']) | jq('.fatal_error_count') | first }}\n*Warnings & Smells:* {{ read(outputs.scan_python_quality.outputFiles['pylint-summary.json']) | jq('.warning_count') | first }}\n*Total Issues:* {{ read(outputs.scan_python_quality.outputFiles['pylint-summary.json']) | jq('.total_issues') | first }}\n*Action:* Deployment halted. Critical runtime bugs (undefined variable, missing import, or call signature mismatch) detected. Remediate flagged code before release.\n*Execution ID:* {{ execution.id }}"
            }

        - id: fail_fatal_error
          type: io.kestra.plugin.core.execution.Fail
          description: Block deployment pipeline due to fatal Python runtime bugs.
          errorMessage: "Pylint quality gate BLOCKED: fatal runtime errors (undefined variables, invalid imports, syntax errors) detected in Python codebase. Remediate before release."

      "WARN_CODE_SMELL":
        - id: alert_code_smell_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Notify team of Python code smells and warnings without blocking deployment.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "*Pylint Code Quality Advisory (Non-Blocking)*\n*Status:* WARN_CODE_SMELL\n*Fatal / Runtime Errors:* 0\n*Warnings & Smells:* {{ read(outputs.scan_python_quality.outputFiles['pylint-summary.json']) | jq('.warning_count') | first }}\n*Total Issues:* {{ read(outputs.scan_python_quality.outputFiles['pylint-summary.json']) | jq('.total_issues') | first }}\n*Action:* Deployment allowed to proceed. Non-blocking code hygiene advisories detected. Schedule cleanup during regular sprint backlog.\n*Execution ID:* {{ execution.id }}"
            }

        - id: log_code_smell_pass
          type: io.kestra.plugin.core.log.Log
          description: Record that deployment proceeds with non-blocking code smell advisories.
          message: "Pylint quality gate PASSED with advisories: zero fatal errors found; code smells and warnings logged for backlog remediation."

      "PASS_CLEAN":
        - id: log_clean_scan
          type: io.kestra.plugin.core.log.Log
          description: Record clean quality scan with zero detected issues.
          message: "Pylint quality gate PASSED: 0 errors or warnings detected across scanned Python codebase."

      "UNREACHABLE":
        - id: log_diagnostic_failure
          type: io.kestra.plugin.core.log.Log
          description: Record diagnostic failure when repository bundle was missing or invalid.
          message: "Pylint quality gate diagnostic failure: repository bundle was not provided or could not be unpacked."

        - id: fail_unreachable
          type: io.kestra.plugin.core.execution.Fail
          description: Fail execution when repository bundle could not be scanned.
          errorMessage: "Pylint quality gate failed: repository archive was missing, corrupt, or invalid."
