id: mozilla-public-suffix-cookie-isolation
namespace: company.security

description: |
  Audit application endpoints and API gateways against the official Mozilla Public
  Suffix List to detect supercookie domain leaks, unencrypted transport, and RFC 6265
  isolation violations using cached downloads and DuckDB SQL.

inputs:
  - id: target_endpoints
    type: ARRAY
    itemType: STRING
    description: Web application or API gateway URLs to probe for Set-Cookie header compliance.
    defaults:
      - https://kestra.io
      - https://github.com

  - id: dry_run
    type: BOOL
    description: When true, audits cookies and exports reports without failing the execution on security violations.
    defaults: true

  - id: fail_on_supercookie
    type: BOOL
    description: When true and dry_run is false, fails the pipeline immediately upon detecting a supercookie.
    defaults: false

triggers:
  - id: weekly_security_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run the cookie boundary and public suffix audit every Monday at 04:00 UTC.
    cron: 0 4 * * 1
    disabled: true

tasks:
  - id: download_mozilla_psl
    type: io.kestra.plugin.core.http.Download
    description: Fetch the official Mozilla Public Suffix List with a 24-hour task cache to minimize upstream load.
    uri: https://publicsuffix.org/list/public_suffix_list.dat
    taskCache:
      enabled: true
      ttl: PT24H

  - id: probe_cookie_endpoints
    type: io.kestra.plugin.scripts.python.Script
    description: Probe configured endpoints via Python stdlib to capture Set-Cookie attributes into an audit table.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    outputFiles:
      - observed_cookies.csv
    script: |
      import csv
      import json
      import sys
      import urllib.request
      import urllib.parse
      from http.cookies import SimpleCookie

      endpoints = json.loads("""{{ inputs.target_endpoints | toJson }}""")
      output_path = "observed_cookies.csv"

      rows = []
      headers = ["endpoint", "cookie_name", "domain_scope", "path", "is_secure", "is_httponly", "same_site"]

      for url in endpoints:
          try:
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Kestra-Security-Audit/1.0"}
              )
              with urllib.request.urlopen(req, timeout=15) as resp:
                  raw_cookies = resp.headers.get_all("Set-Cookie") or []
                  parsed_host = urllib.parse.urlparse(url).hostname or ""
                  for raw in raw_cookies:
                      cookie = SimpleCookie()
                      try:
                          cookie.load(raw)
                          for key, morsel in cookie.items():
                              domain = morsel["domain"] if morsel["domain"] else parsed_host
                              rows.append({
                                  "endpoint": url,
                                  "cookie_name": key,
                                  "domain_scope": domain,
                                  "path": morsel["path"] or "/",
                                  "is_secure": "true" if morsel["secure"] else "false",
                                  "is_httponly": "true" if morsel["httponly"] else "false",
                                  "same_site": morsel["samesite"] or "None"
                              })
                      except Exception as parse_err:
                          print(f"Warning: Could not parse cookie string '{raw}': {parse_err}", file=sys.stderr)
          except Exception as req_err:
              print(f"Warning: Failed to probe endpoint '{url}': {req_err}", file=sys.stderr)

      # Ensure observed_cookies.csv always exists with standard schema even if zero cookies were set
      with open(output_path, "w", newline="", encoding="utf-8") as f:
          writer = csv.DictWriter(f, fieldnames=headers)
          writer.writeheader()
          for r in rows:
              writer.writerow(r)

      print(f"Captured {len(rows)} cookies across {len(endpoints)} endpoints.")

  - id: duckdb_psl_analysis
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Parse the Mozilla PSL rules, cross-reference cookie scopes, and export a Parquet audit report.
    inputFiles:
      psl.dat: "{{ outputs.download_mozilla_psl.uri }}"
      observed_cookies.csv: "{{ outputs.probe_cookie_endpoints.outputFiles['observed_cookies.csv'] }}"
    outputFiles:
      - cookie_isolation_audit.parquet
    sql: |
      CREATE TABLE raw_lines AS 
      SELECT 
        row_number() OVER () AS line_number, 
        line 
      FROM read_csv('{{ workingDir }}/psl.dat', header=false, delim='\n', quote='', escape='', columns={'line': 'VARCHAR'});

      CREATE TABLE psl_rules AS
      WITH labeled AS (
        SELECT 
          line_number,
          trim(line) AS rule,
          CASE 
            WHEN line LIKE '%===BEGIN ICANN DOMAINS===' THEN 'ICANN'
            WHEN line LIKE '%===BEGIN PRIVATE DOMAINS===' THEN 'PRIVATE'
            ELSE NULL
          END AS marker
        FROM raw_lines
      ),
      sectioned AS (
        SELECT 
          line_number,
          rule,
          last_value(marker IGNORE NULLS) OVER (ORDER BY line_number ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS section
        FROM labeled
      )
      SELECT 
        CASE 
          WHEN rule LIKE '!%' THEN lower(trim(substr(rule, 2)))
          WHEN rule LIKE '*.%' THEN lower(trim(substr(rule, 3)))
          ELSE lower(trim(rule))
        END AS clean_suffix,
        lower(trim(rule)) AS raw_rule,
        section,
        CASE 
          WHEN rule LIKE '!%' THEN 'EXCEPTION'
          WHEN rule LIKE '*.%' THEN 'WILDCARD'
          ELSE 'EXACT'
        END AS rule_type
      FROM sectioned
      WHERE rule != '' 
        AND rule NOT LIKE '//%' 
        AND rule NOT LIKE '%===%';

      CREATE TABLE observed AS
      SELECT 
        endpoint,
        cookie_name,
        domain_scope,
        path,
        CAST(is_secure AS BOOLEAN) AS is_secure,
        CAST(is_httponly AS BOOLEAN) AS is_httponly,
        same_site,
        lower(ltrim(domain_scope, '.')) AS clean_domain
      FROM read_csv_auto('{{ workingDir }}/observed_cookies.csv', header=True);

      CREATE TABLE candidate_matches AS
      SELECT 
        o.endpoint,
        o.cookie_name,
        o.domain_scope,
        o.clean_domain,
        o.path,
        o.is_secure,
        o.is_httponly,
        o.same_site,
        p.clean_suffix,
        p.raw_rule,
        p.section,
        p.rule_type,
        CASE 
          WHEN p.rule_type = 'EXCEPTION' AND o.clean_domain = p.clean_suffix THEN 1
          WHEN p.rule_type = 'EXACT' AND o.clean_domain = p.clean_suffix THEN 2
          WHEN p.rule_type = 'WILDCARD' AND (
            o.clean_domain = p.clean_suffix 
            OR (o.clean_domain LIKE '%.' || p.clean_suffix AND length(o.clean_domain) - length(replace(o.clean_domain, '.', '')) = length(p.clean_suffix) - length(replace(p.clean_suffix, '.', '')) + 1)
          ) THEN 3
          ELSE 99
        END AS match_priority
      FROM observed o
      LEFT JOIN psl_rules p ON 
        o.clean_domain = p.clean_suffix
        OR (p.rule_type = 'WILDCARD' AND (
          o.clean_domain = p.clean_suffix
          OR o.clean_domain LIKE '%.' || p.clean_suffix
        ));

      CREATE TABLE cookie_audit AS
      WITH ranked_matches AS (
        SELECT *,
          row_number() OVER (PARTITION BY endpoint, cookie_name, clean_domain ORDER BY match_priority ASC) AS rank
        FROM candidate_matches
        WHERE match_priority < 99
      )
      SELECT 
        o.endpoint,
        o.cookie_name,
        o.domain_scope,
        o.clean_domain,
        r.section AS psl_section,
        r.rule_type AS psl_rule_type,
        r.raw_rule AS matched_psl_rule,
        CASE 
          WHEN r.rule_type = 'EXCEPTION' THEN 'COMPLIANT'
          WHEN r.clean_suffix IS NOT NULL THEN 'CRITICAL_SUPERCOOKIE'
          WHEN NOT o.is_secure THEN 'HIGH_INSECURE_TRANSPORT'
          WHEN NOT o.is_httponly THEN 'MEDIUM_MISSING_HTTPONLY'
          WHEN o.same_site IS NULL OR lower(o.same_site) = 'none' OR trim(o.same_site) = '' THEN 'MEDIUM_SAMESITE_CROSS_SITE'
          ELSE 'COMPLIANT'
        END AS security_verdict,
        CASE 
          WHEN r.rule_type = 'EXCEPTION' THEN 'Cookie domain explicitly exempt from wildcard public suffix rule.'
          WHEN r.clean_suffix IS NOT NULL THEN 'RFC 6265 violation: Cookie scoped to public suffix; exposes credentials across all tenant subdomains.'
          WHEN NOT o.is_secure THEN 'Cookie transmitted over unencrypted HTTP or lacks Secure attribute.'
          WHEN NOT o.is_httponly THEN 'Cookie accessible via client-side JavaScript document.cookie (XSS risk).'
          WHEN o.same_site IS NULL OR lower(o.same_site) = 'none' OR trim(o.same_site) = '' THEN 'Cookie lacks Lax or Strict SameSite isolation (CSRF exposure).'
          ELSE 'Cookie scope and security flags adhere to RFC 6265bis security baseline.'
        END AS risk_rationale
      FROM observed o
      LEFT JOIN (SELECT * FROM ranked_matches WHERE rank = 1) r 
        ON o.endpoint = r.endpoint 
        AND o.cookie_name = r.cookie_name 
        AND o.clean_domain = r.clean_domain;

      COPY cookie_audit TO '{{ workingDir }}/cookie_isolation_audit.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);

      SELECT 
        count(*) AS total_cookies_audited,
        count(*) FILTER (WHERE security_verdict = 'CRITICAL_SUPERCOOKIE') AS critical_supercookies,
        count(*) FILTER (WHERE security_verdict = 'HIGH_INSECURE_TRANSPORT') AS insecure_transport,
        count(*) FILTER (WHERE security_verdict = 'MEDIUM_MISSING_HTTPONLY') AS missing_httponly,
        count(*) FILTER (WHERE security_verdict = 'COMPLIANT') AS compliant_cookies
      FROM cookie_audit;
    fetchType: FETCH_ONE

  - id: check_security_violations
    type: io.kestra.plugin.core.flow.If
    description: Branch based on whether any supercookie leaks or insecure transport attributes were detected.
    condition: "{{ outputs.duckdb_psl_analysis.outputs[0].row.critical_supercookies > 0 or outputs.duckdb_psl_analysis.outputs[0].row.insecure_transport > 0 }}"
    then:
      - id: notify_security_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alert the security engineering channel with observed cookie boundary violations.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#appsec-alerts",
            "text": ":warning: *Cookie Isolation Security Alert*\nAudited: `{{ outputs.duckdb_psl_analysis.outputs[0].row.total_cookies_audited }}` cookies\nCritical Supercookies: `{{ outputs.duckdb_psl_analysis.outputs[0].row.critical_supercookies }}`\nInsecure Transport: `{{ outputs.duckdb_psl_analysis.outputs[0].row.insecure_transport }}`\nMissing HttpOnly: `{{ outputs.duckdb_psl_analysis.outputs[0].row.missing_httponly }}`\nParquet Audit: `{{ outputs.duckdb_psl_analysis.outputFiles['cookie_isolation_audit.parquet'] }}`"
          }

      - id: log_security_breach
        type: io.kestra.plugin.core.log.Log
        description: Log warning metrics for observability dashboards when isolation boundaries fail.
        message: "Security warning: Found {{ outputs.duckdb_psl_analysis.outputs[0].row.critical_supercookies }} supercookies and {{ outputs.duckdb_psl_analysis.outputs[0].row.insecure_transport }} unencrypted cookies across probed endpoints."
    else:
      - id: log_clean_audit
        type: io.kestra.plugin.core.log.Log
        description: Log success confirmation when all audited cookies observe Public Suffix boundaries.
        message: "Security audit clean: All {{ outputs.duckdb_psl_analysis.outputs[0].row.total_cookies_audited }} cookies observe RFC 6265bis public suffix isolation rules."

  - id: enforce_isolation_gate
    type: io.kestra.plugin.core.execution.Assert
    description: Block pipeline progression if critical supercookies are discovered and enforcement is active.
    conditions:
      - "{{ inputs.dry_run == true or inputs.fail_on_supercookie == false or outputs.duckdb_psl_analysis.outputs[0].row.critical_supercookies == 0 }}"
    errorMessage: "Critical RFC 6265 security violation: One or more cookies are scoped to a public suffix, enabling cross-tenant session hijacking."

extend:
  title: Audit HTTP Cookie Domain Isolation with the Mozilla Public Suffix List in DuckDB
  shortDescription: Download the Mozilla Public Suffix List, probe web endpoints, and detect supercookie domain leaks using DuckDB.
  metaTitle: Audit Cookie Domain Isolation with Mozilla Public Suffix in Kestra
  metaDescription: Audit web cookies against the Mozilla Public Suffix List in DuckDB, detect RFC 6265 supercookie leaks, and export Parquet compliance reports in Kestra.
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  demo: false
  description: |
    Modern web architectures frequently serve multiple tenant environments, APIs, and portals under shared parent domains or cloud provider platform endpoints like `github.io`, `azurewebsites.net`, or country-code TLDs like `co.uk`. If an application scopes an authentication session cookie to a public suffix (for instance, setting `domain=.co.uk` or `domain=.github.io`), that cookie transforms into an RFC 6265 supercookie. Any other tenant sharing that public suffix can read, hijack, or overwrite user sessions across organizational boundaries.

    This blueprint orchestrates an automated security boundary audit. It downloads Mozilla's authoritative Public Suffix List (PSL), caches the catalog with a 24-hour TTL to respect upstream bandwidth, probes live web endpoints to extract HTTP response cookies and security flags, and uses DuckDB to cross-reference every domain scope against 10,000+ ICANN and private suffix rules including wildcard and exception directives. Discovered violations are exported into compressed Parquet audit files, alerted via Slack, and blocked using an execution assertion gate.

    ## How it works

    1. `download_mozilla_psl` (`io.kestra.plugin.core.http.Download`) fetches `https://publicsuffix.org/list/public_suffix_list.dat`. It enables `taskCache` with a 24-hour duration (`PT24H`) so subsequent daily runs reuse the local copy rather than repeatedly hammering Mozilla's public servers.
    2. `probe_cookie_endpoints` (`io.kestra.plugin.scripts.python.Script`) executes a Docker container (`python:3.11-slim`) that iterates through `inputs.target_endpoints` via the Python standard library (`urllib.request` and `http.cookies.SimpleCookie`). It extracts every `Set-Cookie` header, resolves effective domain scopes, parses `Secure`, `HttpOnly`, and `SameSite` attributes, and writes the structured records to `observed_cookies.csv`.
    3. `duckdb_psl_analysis` (`io.kestra.plugin.jdbc.duckdb.Queries`) mounts both the cached PSL dat file and the extracted CSV. It normalizes wildcard (`*.`) and exception (`!`) directives, joins observed cookie scopes using rule-priority ranking, classifies vulnerabilities (`CRITICAL_SUPERCOOKIE`, `HIGH_INSECURE_TRANSPORT`, `MEDIUM_MISSING_HTTPONLY`, `MEDIUM_SAMESITE_CROSS_SITE`), writes `cookie_isolation_audit.parquet` to internal storage, and aggregates compliance metrics with `fetchType: FETCH_ONE`.
    4. `check_security_violations` (`io.kestra.plugin.core.flow.If`) evaluates the query aggregation. If any critical supercookie leaks or insecure transport cookies are detected, it dispatches an alert payload to Slack (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) and logs incident details. If no violations exist, it logs a clean audit pass.
    5. `enforce_isolation_gate` (`io.kestra.plugin.core.execution.Assert`) validates `conditions` ensuring `outputs.duckdb_psl_analysis.outputs[0].row.critical_supercookies == 0`. When `dry_run` is false and `fail_on_supercookie` is enabled, this halts the pipeline with an explicit RFC 6265 violation error to prevent deployment into production.

    ## What you get

    - Automated verification against the official, live Mozilla Public Suffix List with built-in 24-hour caching.
    - Zero external Python package dependencies, leveraging the Python standard library for robust HTTP header extraction.
    - DuckDB in-memory analytical SQL processing 10,000+ suffix rules in sub-second execution time.
    - Audit-ready compressed Parquet output files stored in Kestra for security compliance records and historical tracking.
    - Configurable assertion gates that prevent deploying services with cross-origin session leaks.

    ## Who it's for

    - Application Security (AppSec) engineers validating cookie scoping across microservices and public portals.
    - DevOps and Platform teams enforcing RFC 6265 and OWASP security baselines in CI/CD deployment pipelines.
    - Compliance officers auditing cloud infrastructure against multi-tenant credential isolation requirements.

    ## Why orchestrate this with Kestra

    Conducting ad-hoc cookie audits through manual browser DevTools checks misses regressions introduced during microservice deployments or API gateway configuration updates. Running standalone scripts leaves security findings buried in transient terminal output without audit trails. Kestra provides scheduled orchestration with automatic task caching, combines Python HTTP probing with DuckDB SQL analytics, publishes queryable Parquet compliance artifacts, and gates production rollouts when tenant isolation is violated.

    ## Pitfalls

    - **Private vs ICANN Suffixes**: Suffixes like `github.io` and `s3.amazonaws.com` are listed in the `PRIVATE DOMAINS` section of the PSL rather than ICANN top-level domains. Cookies scoped to these private suffixes create cross-customer session leaks even though they are technically third-level domains. DuckDB must segment and audit both sections.
    - **Empty Cookie Headers**: Endpoints that redirect or require session establishment may omit `Set-Cookie` headers on initial GET requests. The Python probe script is configured with error trapping to ensure `observed_cookies.csv` maintains valid headers even when an endpoint returns zero cookies.
    - **Upstream Rate Limiting**: Fetching `public_suffix_list.dat` on every pipeline run can lead to upstream rate limiting from public suffix mirrors. Enabling `taskCache` with `PT24H` ensures Kestra only downloads the catalog once per day.

    ## Prerequisites

    - Docker daemon accessible to Kestra for running the containerized Python probe task (`python:3.11-slim`).
    - An incoming webhook URL stored in Kestra secrets as `SLACK_WEBHOOK_URL` for alert delivery.
    - Outbound internet access to `https://publicsuffix.org` and target application URLs.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Add your Slack incoming webhook secret under the key `SLACK_WEBHOOK_URL` in your namespace settings.
    3. Set `inputs.target_endpoints` to your organization's web application and API gateway URLs.
    4. Run an initial test execution with `dry_run: true` to review the generated Parquet audit artifact in the Kestra UI.
    5. Toggle `fail_on_supercookie: true` and `dry_run: false` to enforce cookie isolation in pre-production staging gates.

    ## How to extend

    - **Gateway Ingress Ingestion**: Extend the Python probe task to parse Kubernetes Ingress manifests or AWS ALB listener rule definitions directly from Git repositories.
    - **Automated Ticket Creation**: Replace or augment the Slack notification task with Jira or ServiceNow plugins to automatically file vulnerability tickets for flagged domains.
    - **Historical Drift Tracking**: Persist the Parquet audit outputs into an Amazon S3 or Google Cloud Storage bucket partitioned by execution date to track compliance drift over time.

    ## Links

    - [Mozilla Public Suffix List](https://publicsuffix.org/)
    - [RFC 6265bis: Cookies - Domain Matching and Security Considerations](https://datatracker.ietf.org/doc/html/draft-ietf-httpbis-rfc6265bis)
    - [Kestra DuckDB Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
