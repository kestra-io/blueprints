id: goes-xray-flare-radio-blackout-alert
namespace: company.team

description: |
  Solar flare radio blackout alert for HF radio, aviation and GNSS operators. Every 10 minutes the flow reads
  the NOAA SWPC GOES X-ray flare event list (7 days) and the in-progress flare record, maps each flare to the
  NOAA R-scale (R1 at M1 up to R5 at X20), works out which of your stations were on the sunlit side at the
  flare peak, and posts to Slack once per flare, again only if a growing flare reaches a higher R level.

inputs:
  - id: stations
    type: JSON
    displayName: Stations
    description: >-
      One object per station with `name`, `lat` and `lon` (decimal degrees). The defaults are sample HF and
      oceanic-control locations; flare data come from the live GOES feed.
    defaults: |
      [
        {"name": "Shannon oceanic HF (Ballygirreen)", "lat": 52.69, "lon": -8.92},
        {"name": "Gander oceanic HF", "lat": 48.95, "lon": -54.57},
        {"name": "New York HF (Riverhead)", "lat": 40.92, "lon": -72.66},
        {"name": "San Francisco HF (Point Reyes)", "lat": 38.10, "lon": -122.93},
        {"name": "Johannesburg", "lat": -26.14, "lon": 28.25},
        {"name": "Mumbai", "lat": 19.09, "lon": 72.87},
        {"name": "Singapore", "lat": 1.36, "lon": 103.99},
        {"name": "Auckland", "lat": -37.01, "lon": 174.79}
      ]

  - id: min_class
    type: SELECT
    displayName: Alert from flare class
    description: M1 is the start of the R-scale (R1 Minor). C5 also reports strong C flares that can still degrade low-frequency HF on the dayside.
    values:
      - C5
      - M1
      - M5
      - X1
    defaults: M1

  - id: alert_window_hours
    type: INT
    displayName: Alert window (hours)
    description: Only flares that peaked within this window are posted. Older flares in the 7-day list are stored silently, so the first run does not replay a whole week.
    defaults: 24

  - id: stale_minutes
    type: INT
    displayName: Feed stale after (minutes)
    description: The in-progress record is refreshed every few minutes. If it is older than this, the run warns that "no flare" may mean "no data".
    defaults: 30

  - id: state_key
    type: STRING
    displayName: KV state key
    defaults: goes_xray_flares_alerted

triggers:
  - id: every_10_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    description: Flares rise to peak in minutes; a 10-minute poll catches the peak of most M and X flares while they are still in progress.

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: fetch_flares_7d
    type: io.kestra.plugin.core.http.Download
    description: Flare events detected by SWPC on the primary GOES satellite over the last 7 days (begin, peak, end, class).
    uri: https://services.swpc.noaa.gov/json/goes/primary/xray-flares-7-day.json
    headers:
      User-Agent: kestra-goes-flare-alert/1.0 (https://kestra.io)
    retry:
      type: exponential
      interval: PT20S
      maxInterval: PT2M
      maxAttempts: 4

  - id: fetch_flare_latest
    type: io.kestra.plugin.core.http.Download
    description: The current or most recent flare. While a flare is in progress `end_time` is null and `max_class` is the peak so far.
    uri: https://services.swpc.noaa.gov/json/goes/primary/xray-flares-latest.json
    headers:
      User-Agent: kestra-goes-flare-alert/1.0 (https://kestra.io)
    retry:
      type: exponential
      interval: PT20S
      maxInterval: PT2M
      maxAttempts: 4

  - id: previous_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false
    description: R level already alerted per flare. Missing on the first run (BASELINE).

  - id: evaluate
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Merges both files by `begin_time` (the in-progress record wins), skips events without a peak class, derives
      the peak flux from the official class string (X12 = 1.2e-3 W/m2) and the R level from it, and computes the
      solar elevation of each station at the peak from the subsolar point (declination and UTC hour, about 1 degree
      accuracy). HF absorption only affects the sunlit hemisphere, so night-side stations are listed separately.
    url: "jdbc:duckdb:"
    timeZoneId: UTC
    fetchType: FETCH_ONE
    inputFiles:
      f7.json: "{{ outputs.fetch_flares_7d.uri }}"
      latest.json: "{{ outputs.fetch_flare_latest.uri }}"
      stations.json: "{{ inputs.stations | toJson }}"
      state.json: "{{ outputs.previous_state.value ?? '[]' }}"
    outputFiles:
      - flares_csv
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE raw AS
      SELECT 2 AS src, j FROM (SELECT unnest(from_json(content, '["JSON"]')) AS j FROM read_text('f7.json'))
      UNION ALL
      SELECT 1 AS src, j FROM (SELECT unnest(from_json(content, '["JSON"]')) AS j FROM read_text('latest.json'));

      CREATE TABLE ev AS
      SELECT * FROM (
        SELECT src, j->>'$.begin_time' AS begin_time, j->>'$.max_time' AS max_time, j->>'$.end_time' AS end_time,
               upper(j->>'$.max_class') AS max_class, j->>'$.time_tag' AS time_tag,
               row_number() OVER (PARTITION BY j->>'$.begin_time' ORDER BY src) AS rn
        FROM raw) WHERE rn = 1;

      CREATE TABLE f AS
      SELECT begin_time, max_time, end_time, max_class, time_tag, end_time IS NULL AS ongoing,
             CAST(CAST(max_time AS TIMESTAMPTZ) AS TIMESTAMP) AS peak,
             CASE left(max_class, 1) WHEN 'A' THEN 1e-8 WHEN 'B' THEN 1e-7 WHEN 'C' THEN 1e-6 WHEN 'M' THEN 1e-5 WHEN 'X' THEN 1e-4 END
               * TRY_CAST(substr(max_class, 2) AS DOUBLE) AS flux
      FROM ev WHERE max_class IS NOT NULL AND max_time IS NOT NULL;

      CREATE TABLE q AS
      SELECT *, CASE WHEN flux >= 2e-3 THEN 5 WHEN flux >= 1e-3 THEN 4 WHEN flux >= 1e-4 THEN 3 WHEN flux >= 5e-5 THEN 2 WHEN flux >= 1e-5 THEN 1 ELSE 0 END AS r,
             -23.44 * cos(radians(360.0 / 365 * (dayofyear(peak) + 10))) AS sun_lat,
             ((-15.0 * (hour(peak) + minute(peak) / 60.0 - 12) + 540) % 360) - 180 AS sun_lon
      FROM f WHERE flux >= CASE '{{ inputs.min_class }}' WHEN 'C5' THEN 5e-6 WHEN 'M5' THEN 5e-5 WHEN 'X1' THEN 1e-4 ELSE 1e-5 END;

      CREATE TABLE st AS
      SELECT s->>'$.name' AS name, TRY_CAST(s->>'$.lat' AS DOUBLE) AS lat, TRY_CAST(s->>'$.lon' AS DOUBLE) AS lon
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS s FROM read_text('stations.json'));

      CREATE TABLE prev AS
      SELECT p->>'$.begin' AS begin_time, TRY_CAST(p->>'$.r' AS INT) AS prev_r, p->>'$.cls' AS prev_class
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS p FROM read_text('state.json'));

      CREATE TABLE el AS
      SELECT q.begin_time, st.name,
             round(degrees(asin(sin(radians(st.lat)) * sin(radians(q.sun_lat))
               + cos(radians(st.lat)) * cos(radians(q.sun_lat)) * cos(radians(st.lon - q.sun_lon)))), 0) AS elev
      FROM q CROSS JOIN st WHERE st.lat BETWEEN -90 AND 90 AND st.lon BETWEEN -180 AND 180;

      CREATE TABLE res AS
      SELECT q.*, p.prev_r, p.prev_class,
             ['below R-scale', 'R1 Minor', 'R2 Moderate', 'R3 Strong', 'R4 Severe', 'R5 Extreme'][q.r + 1] AS r_label,
             date_diff('minute', CAST(CAST(q.begin_time AS TIMESTAMPTZ) AS TIMESTAMP), CAST(CAST(coalesce(q.end_time, q.time_tag) AS TIMESTAMPTZ) AS TIMESTAMP)) AS minutes,
             (SELECT coalesce(string_agg(name || ' (' || CAST(CAST(elev AS INT) AS VARCHAR) || ' deg)', ', ' ORDER BY elev DESC), 'none') FROM el WHERE el.begin_time = q.begin_time AND elev > 0) AS sunlit,
             (SELECT coalesce(string_agg(name, ', '), 'none') FROM el WHERE el.begin_time = q.begin_time AND elev <= 0) AS night_side,
             (p.begin_time IS NULL OR q.r > p.prev_r)
               AND q.peak >= CAST(now() AS TIMESTAMP) - INTERVAL {{ inputs.alert_window_hours }} HOUR AS notify,
             p.begin_time IS NOT NULL AND q.r > p.prev_r AS escalated
      FROM q
      LEFT JOIN prev p ON p.begin_time = q.begin_time;

      COPY (
        SELECT begin_time, max_time AS peak_time, end_time, max_class, r_label, ongoing, minutes AS duration_min,
               round(sun_lat, 1) AS subsolar_lat, round(sun_lon, 1) AS subsolar_lon, sunlit AS sunlit_stations, night_side AS night_side_stations, notify
        FROM res ORDER BY begin_time
      ) TO '{{ outputFiles.flares_csv }}' (HEADER, DELIMITER ',');

      SELECT (SELECT count(*) FROM prev) = 0 AS is_baseline,
             (SELECT count(*) FROM ev) AS events_7d,
             (SELECT count(*) FROM ev WHERE max_class IS NULL) AS incomplete_events,
             (SELECT count(*) FROM res) AS qualifying,
             (SELECT count(*) FROM res WHERE notify) AS notify_count,
             (SELECT coalesce(arg_max(max_class, flux), 'none') FROM f WHERE peak >= CAST(now() AS TIMESTAMP) - INTERVAL 24 HOUR) AS largest_24h,
             (SELECT max(time_tag) FROM ev WHERE src = 1) AS latest_time_tag,
             coalesce((SELECT date_diff('minute', CAST(CAST(max(time_tag) AS TIMESTAMPTZ) AS TIMESTAMP), CAST(now() AS TIMESTAMP)) FROM ev WHERE src = 1), 9999) AS feed_age_min,
             (SELECT coalesce(string_agg(coalesce(name, '?'), ', '), '') FROM st WHERE NOT coalesce(lat BETWEEN -90 AND 90 AND lon BETWEEN -180 AND 180, false)) AS invalid_stations,
             (SELECT coalesce(CAST(to_json(list(json_object('begin', begin_time, 'peak', max_time, 'end', end_time, 'cls', max_class, 'r', r_label,
                'ongoing', ongoing, 'min', minutes, 'escalated', escalated, 'prev', prev_class, 'slat', round(sun_lat, 1), 'slon', round(sun_lon, 1),
                'sunlit', sunlit, 'night', night_side) ORDER BY begin_time)) AS VARCHAR), '[]') FROM res WHERE notify) AS alert_list,
             (SELECT coalesce(CAST(to_json(list(x)) AS VARCHAR), '[]') FROM (
                SELECT json_object('begin', begin_time, 'r', r, 'cls', max_class) AS x FROM res
                UNION ALL
                SELECT json_object('begin', begin_time, 'r', prev_r, 'cls', prev_class) FROM prev
                WHERE begin_time NOT IN (SELECT begin_time FROM res)
                  AND CAST(CAST(begin_time AS TIMESTAMPTZ) AS TIMESTAMP) >= CAST(now() AS TIMESTAMP) - INTERVAL 8 DAY)) AS new_state;

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.evaluate.outputs[0].row.new_state }}"
    description: Flares older than 8 days drop out, so the state stays as small as the feed.

  - id: on_flare
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.evaluate.outputs[0].row.notify_count > 0 }}"
    then:
      - id: compose
        type: io.kestra.plugin.core.debug.Return
        format: |-
          *GOES X-ray flare alert*{{ outputs.evaluate.outputs[0].row.is_baseline ? ' (baseline)' : '' }}: {{ outputs.evaluate.outputs[0].row.notify_count }} flare(s) at {{ inputs.min_class }} or above.
          {% for a in fromJson(outputs.evaluate.outputs[0].row.alert_list) %}:sunny: *{{ a.cls }}* flare, *{{ a.r }}* radio blackout{% if a.escalated %} (escalated from {{ a.prev }}){% endif %}. {% if a.ongoing %}In progress since {{ a.begin | slice(11, 16) }} UTC, peak so far {{ a.peak | slice(11, 16) }} UTC{% else %}Began {{ a.begin | slice(11, 16) }}, peaked {{ a.peak | slice(0, 16) | replace({'T': ' '}) }}, ended {{ a.end | slice(11, 16) }} UTC ({{ a.min }} min){% endif %}. Subsolar point {{ a.slat }}, {{ a.slon }}.
          Sunlit at peak (HF absorption likely): {{ a.sunlit }}. Night side (unaffected): {{ a.night }}.
          {% endfor %}<https://www.swpc.noaa.gov/products/goes-x-ray-flux|GOES X-ray flux> | <https://www.swpc.noaa.gov/products/d-region-absorption-predictions-d-rap|D-RAP>
      - id: slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: allowFailure keeps the run going when `SLACK_WEBHOOK_URL` is not set; the message is still logged and the CSV written.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: "{{ outputs.compose.value }}"
      - id: log_alert
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "{{ outputs.compose.value }}"
    else:
      - id: log_quiet
        type: io.kestra.plugin.core.log.Log
        message: "No new flare at {{ inputs.min_class }} or above. Largest flare in the last 24 h: {{ outputs.evaluate.outputs[0].row.largest_24h }}."

  - id: stale_feed
    type: io.kestra.plugin.core.log.Log
    runIf: "{{ outputs.evaluate.outputs[0].row.feed_age_min > inputs.stale_minutes }}"
    level: WARN
    message: "The GOES in-progress flare record is {{ outputs.evaluate.outputs[0].row.feed_age_min }} min old (last {{ outputs.evaluate.outputs[0].row.latest_time_tag }}). The feed looks stale, so a quiet run may mean missing data rather than a quiet Sun."

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      {{ outputs.evaluate.outputs[0].row.events_7d }} flare events in the 7-day list ({{ outputs.evaluate.outputs[0].row.incomplete_events }} without a peak class, skipped),
      {{ outputs.evaluate.outputs[0].row.qualifying }} at {{ inputs.min_class }} or above, {{ outputs.evaluate.outputs[0].row.notify_count }} posted{{ outputs.evaluate.outputs[0].row.is_baseline ? ' (BASELINE run)' : '' }}.
      Largest flare in the last 24 h: {{ outputs.evaluate.outputs[0].row.largest_24h }}. In-progress record updated {{ outputs.evaluate.outputs[0].row.feed_age_min }} min ago.
      {% if outputs.evaluate.outputs[0].row.invalid_stations != '' %}Skipped stations with missing or out-of-range coordinates: {{ outputs.evaluate.outputs[0].row.invalid_stations }}.{% endif %}

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.evaluate.outputs[0].row | toJson }}"
  - id: flares_csv
    type: FILE
    value: "{{ outputs.evaluate.outputFiles.flares_csv }}"

extend:
  title: Alert on Solar Flare Radio Blackouts from NOAA GOES X-ray Flux
  metaTitle: GOES X-ray Solar Flare R-Scale Radio Blackout Alert with NOAA SWPC | Kestra
  shortDescription: Poll the NOAA SWPC GOES X-ray flare list every 10 minutes, map each flare to the R-scale, list which of your HF stations were in daylight at the peak, and post to Slack once per flare or when a flare escalates.
  metaDescription: NOAA SWPC GOES X-ray flare alerts with R1-R5 radio blackout levels, sunlit-station impact, escalation tracking via KV, CSV output and Slack.
  description: |
    A flare of class M1 or above ionises the dayside D-region within minutes and absorbs HF radio (3-30 MHz) on the sunlit side of the Earth. NOAA classes these events on its R-scale (R1 Minor at M1, R2 at M5, R3 at X1, R4 at X10, R5 at X20). This flow reads the GOES X-ray flare events that NOAA SWPC publishes, works out which of your stations were in daylight at the peak, and reports each flare once.

    ## How it works

    1. A `Schedule` trigger runs every 10 minutes. Two `HTTP Download` tasks fetch the SWPC 7-day flare event list and the current or most recent flare record (`xray-flares-latest.json`, where an in-progress flare has no `end_time` yet).
    2. `previous_state` (KV Get) reads the R level already alerted per flare. It is missing on the first run (BASELINE).
    3. `evaluate` (DuckDB) merges both files by `begin_time` (the in-progress record wins), skips events SWPC lists without a peak class, derives the peak flux from the official class string and the R level from it, and computes each station's solar elevation at the peak from the subsolar point. It writes a CSV and the new state (flares older than 8 days drop out).
    4. A flare is posted when it is new or has reached a higher R level than last time (a flare caught at M3 while rising and peaking at X2 is posted twice), and only if it peaked within `alert_window_hours`, so the first run does not replay a week of flares.
    5. `on_flare` (If) sends one Slack message and a WARN log; otherwise the largest flare of the last 24 hours is logged. `stale_feed` warns when the in-progress record has not been updated for `stale_minutes`.

    ## What you get

    - One Slack message per flare with class, R level, begin, peak, end and duration, the subsolar point, and your stations split into sunlit (with sun elevation, highest first) and night side.
    - A CSV of every flare at or above `min_class` in the last 7 days.
    - A warning when the GOES feed is stale, so a quiet run is not mistaken for a quiet Sun.

    ## Who it's for

    - HF radio operators, oceanic air traffic and airline operations centres, maritime and emergency communications teams.

    ## Why orchestrate this with Kestra

    - The KV store remembers each flare's alerted level, so re-runs are quiet and only escalations re-alert.
    - Retries on both downloads ride out short SWPC hiccups; `concurrency` stops overlapping polls.

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB plugin and the Slack plugin.
    - Outbound HTTPS to `services.swpc.noaa.gov`. No API key is needed.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook (optional; without it the message is logged at WARN and the run ends in WARNING).

    ## Quick start

    1. Execute with the defaults. The eight stations are sample locations; flare data come from the live GOES feed. The first run is a baseline: flares at M1 or above that peaked in the last 24 hours are posted, older ones are stored silently.
    2. Execute again: nothing new, so `log_quiet` runs.
    3. Set `min_class` to `C5` to include strong C flares, or add a station with bad coordinates to see it skipped and listed.
    4. Add `SLACK_WEBHOOK_URL` and your own stations, and keep the 10-minute schedule.

    ## How to extend

    - Add the SWPC proton flux feed for S-scale (polar HF) events.
    - Route R3 and above to an on-call pager.

    ## Links

    - [HTTP Download](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download), [If](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if) and [KV Store](https://kestra.io/docs/concepts/kv-store)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [NOAA SWPC GOES X-ray flux](https://www.swpc.noaa.gov/products/goes-x-ray-flux) and [NOAA space weather scales](https://www.swpc.noaa.gov/noaa-scales-explanation)
    - [SWPC JSON data service](https://services.swpc.noaa.gov/json/goes/primary/)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - Realtime & Streaming
  ee: false
  demo: false
