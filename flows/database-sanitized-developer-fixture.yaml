id: database-sanitized-developer-fixture
namespace: company.platform

description: |
  Sanitize relational customer database extracts using in-memory DuckDB, masking PII,
  standardizing test credentials, and preserving foreign key entity joins to package
  compliant, ready-to-load SQL and Parquet developer fixtures.

inputs:
  - id: environment
    type: SELECT
    displayName: Target Environment
    values:
      - LOCAL_DEV
      - QA
      - STAGING
    defaults: LOCAL_DEV
    description: Target test environment receiving the sanitized fixture bundle.

  - id: developer_password_hash
    type: STRING
    displayName: Uniform Developer Password Hash
    defaults: "$2b$12$e8Y5M5O7d2F7a6J4k8H9u.7vG4t3s2r1q0p9o8n7m6l5k4j3i2h1g"
    description: Standard bcrypt hash applied to all sanitized user records for immediate developer test login.

  - id: masking_domain
    type: STRING
    displayName: Masking Domain Suffix
    defaults: "anonymized.test"
    description: Domain suffix appended to deterministic email pseudonyms.

  - id: dry_run
    type: BOOL
    displayName: Dry Run Mode
    defaults: true
    description: When true, generates and audits fixture artifacts without publishing notifications to team channels.

  - id: source_users_payload
    type: JSON
    displayName: Source Users Extract
    description: Operational user account records to sanitize.
    defaults:
      - user_id: 101
        full_name: "Eleanor Vance"
        email: "eleanor.vance@enterprise-corp.com"
        phone: "+1-415-555-2671"
        billing_address: "742 Evergreen Terrace, Springfield, OR"
        role: "admin"
        raw_password_hash: "$2b$12$prodSecR3tHashAlphaOmega9918273645"
      - user_id: 102
        full_name: "Marcus Holloway"
        email: "m.holloway@prime-logistics.net"
        phone: "+1-206-555-8392"
        billing_address: "1200 Grand Avenue, Seattle, WA"
        role: "editor"
        raw_password_hash: "$2b$12$prodSecR3tHashBetaGamma8827162534"
      - user_id: 103
        full_name: "Sophia Rodriguez"
        email: "sophia.rodriguez@global-health.org"
        phone: "+1-512-555-9104"
        billing_address: "450 Congress Ave, Austin, TX"
        role: "viewer"
        raw_password_hash: "$2b$12$prodSecR3tHashDeltaTheta7736251423"
      - user_id: 104
        full_name: "Tariq Mansoor"
        email: "t.mansoor@aerospace-systems.co.uk"
        phone: "+44-20-7946-0192"
        billing_address: "10 Downing St, London, UK"
        role: "billing"
        raw_password_hash: "$2b$12$prodSecR3tHashZetaEpsilon6645342312"

  - id: source_orders_payload
    type: JSON
    displayName: Source Orders Extract
    description: Operational orders maintaining relational foreign keys to users.
    defaults:
      - order_id: 5001
        user_id: 101
        order_total: 349.50
        currency: "USD"
        shipping_city: "Springfield"
        customer_notes: "Leave package at front porch door"
      - order_id: 5002
        user_id: 101
        order_total: 89.20
