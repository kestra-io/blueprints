tasks:
  - id: stage_users
    type: io.kestra.plugin.core.storage.Write
    description: Stages raw user records extract into Kestra internal storage.
    extension: ".json"
    content: "{{ inputs.source_users_payload | json }}"

  - id: stage_orders
    type: io.kestra.plugin.core.storage.Write
    description: Stages raw order records extract into Kestra internal storage.
    extension: ".json"
    content: "{{ inputs.source_orders_payload | json }}"

  - id: sanitize_and_generate_fixtures
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Anonymizes PII, preserves foreign keys, and generates SQL and Parquet developer fixtures in DuckDB.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      raw_users.json: "{{ outputs.stage_users.uri }}"
      raw_orders.json: "{{ outputs.stage_orders.uri }}"
    outputFiles:
      - dev_fixture_sql
      - sanitized_users_parquet
      - sanitized_orders_parquet
      - anonymization_audit
    sql: |
      CREATE TABLE raw_users AS SELECT * FROM read_json_auto('raw_users.json');
      CREATE TABLE raw_orders AS SELECT * FROM read_json_auto('raw_orders.json');

      CREATE TABLE sanitized_users AS
      SELECT
        user_id,
        'Dev User ' || SUBSTRING(MD5(CAST(user_id AS VARCHAR)), 1, 6) AS full_name,
        'dev_user_' || SUBSTRING(MD5(CAST(user_id AS VARCHAR)), 1, 8) || '@{{ inputs.masking_domain }}' AS email,
        '+1-555-' || LPAD(CAST((1000 + (user_id * 17) % 9000) AS VARCHAR), 4, '0') AS phone,
        '100 Compliance Test Blvd, Suite ' || CAST(user_id AS VARCHAR) AS billing_address,
        role,
        '{{ inputs.developer_password_hash }}' AS password_hash,
        CURRENT_TIMESTAMP AS sanitized_at
      FROM raw_users;

      CREATE TABLE sanitized_orders AS
      SELECT
        order_id,
        user_id,
        order_total,
        currency,
        shipping_city,
        'Standard test delivery fixture' AS customer_notes,
        CURRENT_TIMESTAMP AS sanitized_at
      FROM raw_orders;

      CREATE TABLE fk_integrity_check AS
      SELECT 
        COUNT(*) AS orphan_order_count
      FROM sanitized_orders o
      LEFT JOIN sanitized_users u ON o.user_id = u.user_id
      WHERE u.user_id IS NULL;

      CREATE TABLE pii_leak_check AS
      SELECT
        COUNT(*) FILTER (WHERE email NOT LIKE '%@{{ inputs.masking_domain }}') AS unmasked_email_count,
        COUNT(*) FILTER (WHERE phone NOT LIKE '+1-555-%') AS unmasked_phone_count,
        COUNT(*) FILTER (WHERE password_hash != '{{ inputs.developer_password_hash }}') AS unmasked_password_count
      FROM sanitized_users;

      COPY sanitized_users TO '{{ outputFiles.sanitized_users_parquet }}' (FORMAT PARQUET, COMPRESSION ZSTD);
      COPY sanitized_orders TO '{{ outputFiles.sanitized_orders_parquet }}' (FORMAT PARQUET, COMPRESSION ZSTD);

      COPY (
        SELECT 
          'INSERT INTO users (user_id, full_name, email, phone, billing_address, role, password_hash) VALUES (' 
          || user_id || ', ' 
          || chr(39) || replace(full_name, chr(39), chr(39) || chr(39)) || chr(39) || ', ' 
          || chr(39) || replace(email, chr(39), chr(39) || chr(39)) || chr(39) || ', ' 
          || chr(39) || replace(phone, chr(39), chr(39) || chr(39)) || chr(39) || ', ' 
          || chr(39) || replace(billing_address, chr(39), chr(39) || chr(39)) || chr(39) || ', ' 
          || chr(39) || replace(role, chr(39), chr(39) || chr(39)) || chr(39) || ', ' 
          || chr(39) || replace(password_hash, chr(39), chr(39) || chr(39)) || chr(39) || ');' AS sql_statement
        FROM sanitized_users
        UNION ALL
        SELECT 
          'INSERT INTO orders (order_id, user_id, order_total, currency, shipping_city, customer_notes) VALUES (' 
          || order_id || ', ' 
          || user_id || ', ' 
          || order_total || ', ' 
          || chr(39) || replace(currency, chr(39), chr(39) || chr(39)) || chr(39) || ', ' 
          || chr(39) || replace(shipping_city, chr(39), chr(39) || chr(39)) || chr(39) || ', ' 
          || chr(39) || replace(customer_notes, chr(39), chr(39) || chr(39)) || chr(39) || ');' AS sql_statement
        FROM sanitized_orders
      ) TO '{{ outputFiles.dev_fixture_sql }}' (FORMAT CSV, HEADER false, QUOTE '', ESCAPE '');

      COPY (
        SELECT 
          (SELECT COUNT(*) FROM sanitized_users) AS users_sanitized,
          (SELECT COUNT(*) FROM sanitized_orders) AS orders_sanitized,
          (SELECT orphan_order_count FROM fk_integrity_check) AS orphan_orders,
          (SELECT unmasked_email_count FROM pii_leak_check) AS unmasked_emails,
          (SELECT unmasked_phone_count FROM pii_leak_check) AS unmasked_phones
      ) TO '{{ outputFiles.anonymization_audit }}' (HEADER, DELIMITER ',');

      SELECT 
        (SELECT COUNT(*) FROM sanitized_users) AS users_sanitized,
        (SELECT COUNT(*) FROM sanitized_orders) AS orders_sanitized,
        (SELECT orphan_order_count FROM fk_integrity_check) AS orphan_orders,
        (SELECT unmasked_email_count FROM pii_leak_check) AS unmasked_emails,
        (SELECT unmasked_phone_count FROM pii_leak_check) AS unmasked_phones,
        CASE 
          WHEN (SELECT orphan_order_count FROM fk_integrity_check) = 0 
           AND (SELECT unmasked_email_count FROM pii_leak_check) = 0 
           AND (SELECT unmasked_phone_count FROM pii_leak_check) = 0 
          THEN true 
          ELSE false 
        END AS audit_passed;

  - id: assert_audit_passed
    type: io.kestra.plugin.core.execution.Assert
    description: Asserts zero residual PII leakage and complete foreign key integrity before releasing the fixture.
    conditions:
      - "{{ outputs.sanitize_and_generate_fixtures.row.audit_passed == true }}"

  - id: evaluate_delivery_routing
    type: io.kestra.plugin.core.flow.If
    description: Dispatches team notifications when dry_run is disabled.
    condition: "{{ not inputs.dry_run }}"
    then:
      - id: notify_dev_channel_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts engineering team that a fresh sanitized fixture is ready for local development.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: |
          :package: *New Sanitized Developer Database Fixture Available*
          • Environment: `{{ inputs.environment }}`
          • Sanitized Users: `{{ outputs.sanitize_and_generate_fixtures.row.users_sanitized }}`
          • Sanitized Orders: `{{ outputs.sanitize_and_generate_fixtures.row.orders_sanitized }}`
          • Foreign Key Integrity: `VERIFIED (0 orphan orders)`
          • PII Leakage Check: `PASSED (0 residual PII)`
          • SQL Fixture URI: `{{ outputs.sanitize_and_generate_fixtures.outputFiles.dev_fixture_sql }}`
          • Parquet Dataset URI: `{{ outputs.sanitize_and_generate_fixtures.outputFiles.sanitized_users_parquet }}`
    else:
      - id: log_dry_run_summary
        type: io.kestra.plugin.core.log.Log
        description: Logs dry-run audit metrics without publishing to team communication channels.
        message: "DRY-RUN PASS: Generated sanitized fixture (Users: {{ outputs.sanitize_and_generate_fixtures.row.users_sanitized }}, Orders: {{ outputs.sanitize_and_generate_fixtures.row.orders_sanitized }}). Audit passed: {{ outputs.sanitize_and_generate_fixtures.row.audit_passed }}. SQL URI: {{ outputs.sanitize_and_generate_fixtures.outputFiles.dev_fixture_sql }}"

triggers:
  - id: weekly_fixture_refresh
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * 1"
    disabled: true

errors:
  - id: alert_on_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: |
      :x: *Execution {{ execution.id }} failed in flow {{ flow.id }}*

extend:
  title: Database Sanitized Developer Fixture
  metaTitle: Database Sanitized Developer Fixture | Kestra
  shortDescription: Sanitize relational customer database extracts in DuckDB, mask PII, standardize test credentials, and output ready-to-load SQL and Parquet fixtures.
  metaDescription: Sanitize relational database extracts with DuckDB, mask PII, preserve entity joins, and export compliant SQL and Parquet developer fixtures.
  tags:
    - Data
  subTags:
    - Testing & Quality
    - Day 2 Operations
  ee: false
  demo: false
  description: |
    Engineering and QA teams frequently require realistic relational test data to debug query performance, test schema migrations, and build features locally. Exporting raw production database dumps directly to developer laptops violates GDPR Article 32, HIPAA, and SOC 2 security mandates by exposing sensitive customer identities, unmasked billing records, and password hashes. Conversely, purely synthetic test generators often fail to capture deep foreign key hierarchies and production-like cardinality distributions.

    This blueprint provides an automated data sanitization workflow powered by DuckDB. It ingests relational database extracts, masks customer PII (names, emails, phone numbers, and physical addresses) using deterministic pseudonym hashing, scrubs sensitive customer order notes, resets all password hashes to a uniform local developer test password, and mathematically asserts foreign key integrity across related tables. The workflow exports both a ready-to-pipe SQL insert script and compressed Parquet datasets into Kestra internal storage.

    ## How it works

    1. `stage_users` and `stage_orders` (`io.kestra.plugin.core.storage.Write`) persist input operational extracts into Kestra internal storage as staging JSON files.
    2. `sanitize_and_generate_fixtures` (`io.kestra.plugin.jdbc.duckdb.Queries`) mounts the JSON extracts in DuckDB, generates deterministic user pseudonyms and standardized phone numbers, resets password hashes to `developer_password_hash`, scrubs sensitive order notes, validates foreign key integrity between orders and users, audits the output for unmasked PII leakage, and exports ready-to-pipe SQL scripts alongside ZSTD-compressed Parquet datasets.
    3. `assert_audit_passed` (`io.kestra.plugin.core.execution.Assert`) evaluates the single-row audit metric from DuckDB and halts execution if any orphan foreign keys or unmasked PII are detected.
    4. `evaluate_delivery_routing` (`io.kestra.plugin.core.flow.If`) logs execution metrics in `dry_run` mode, or delivers a Slack announcement card to `notify_dev_channel_slack` with direct artifact download URIs when running against active test environments.

    ## What you get

    - Ready-to-import SQL insert script (`dev_fixture.sql`) that engineers can pipe directly into local SQLite, PostgreSQL, or MySQL instances.
    - ZSTD-compressed Parquet datasets for fast analytical query benchmarking in DuckDB or ClickHouse.
    - Deterministic pseudonymization guaranteeing identical entities receive consistent masked IDs across table joins.
    - Automated security assertions halting the workflow if any raw email domain, phone number, or orphan foreign key escapes masking.
    - Standardized test credentials enabling developers and QA to immediately authenticate into local accounts without password recovery steps.

    ## Who it's for

    - Platform Engineers and DevEx teams supplying compliant test fixtures to software engineering squads.
    - Security and Compliance Officers enforcing GDPR and SOC 2 data sanitization policies across non-production environments.
    - Database Administrators and QA Automation Engineers building reproducible local database environments.

    ## Why orchestrate this with Kestra

    - **Declarative In-Memory Processing**: Coordinates multi-table data anonymization and SQL generation in DuckDB without maintaining external sanitization servers.
    - **Artifact Lineage & UI Distribution**: Persists generated SQL and Parquet fixtures in Kestra internal storage with downloadable execution links accessible directly from the Web UI.
    - **Automated Security Gates**: Combines SQL assertions with conditional delivery routing, ensuring non-compliant data is never published to developer channels.
    - **Scheduled Refresh Automation**: Replaces manual ad-hoc database dump sanitization with a scheduled or webhook-triggered workflow.

    ## Pitfalls

    - **Large Dataset Slices**: When extracting large tables (millions of rows), consider applying an explicit sample filter (`WHERE created_at >= NOW() - INTERVAL 90 DAYS LIMIT 50000`) at the extraction layer to keep fixture sizes convenient for developer machines.
    - **Custom Unique Constraints**: If application tables enforce custom unique format constraints (e.g. strict phone or tax ID formatting), ensure the masking expressions reflect the target application regex.

    ## Prerequisites

    - A running Kestra 2.0 instance.
    - Access to Slack incoming webhooks for developer team notifications.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alerting on successful fixture publication and pipeline failures.

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace.
    2. Import this blueprint into your Kestra instance.
    3. Run a manual execution with default inputs (`dry_run: true`) to observe the 4-user and 5-order sample sanitization, SQL insert script generation, and Parquet export.
    4. Download the generated `dev_fixture_sql` artifact from the **Outputs** tab and pipe it into your local development database.

    ## How to extend

    - Add an upstream PostgreSQL or MySQL query task to automatically extract production database slices directly instead of passing manual JSON payloads.
    - Add an Amazon S3 or Google Cloud Storage upload task to automatically mirror generated `.sql.gz` fixture archives into a developer bucket.
    - Incorporate automated Docker container spin-up downstream to verify that the generated SQL fixture imports cleanly into a fresh test container.

    ## Links

    - [Kestra DuckDB Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [Kestra Storage Write Documentation](https://kestra.io/plugins/core/storage/io.kestra.plugin.core.storage.write)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
