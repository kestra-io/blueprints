id: python-markdown-link-checker
namespace: company.team

triggers:
  - id: weekly_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Disabled by default. Enable this schedule to continuously monitor the links in your repository.
    cron: "0 9 * * 1"
    disabled: true

inputs:
  - id: markdown_url
    type: URI
    defaults: https://raw.githubusercontent.com/kestra-io/kestra/develop/README.md
    description: Public raw URL of the Markdown file to check.

  - id: timeout_seconds
    type: INT
    defaults: 10
    description: Timeout for checking each link in seconds.

  - id: fail_on_dead_links
    type: BOOLEAN
    defaults: true
    description: Whether to fail the flow execution if dead links are found.

tasks:
  - id: download
    type: io.kestra.plugin.core.http.Download
    description: Download the Markdown file to Kestra's internal storage.
    uri: "{{ inputs.markdown_url }}"

  - id: check_links
    type: io.kestra.plugin.scripts.python.Script
    description: Extract URLs from the Markdown file, deduplicate them, and check each link for accessibility using HEAD and GET fallbacks.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    inputFiles:
      file.md: "{{ outputs.download.uri }}"
    env:
      TIMEOUT: "{{ inputs.timeout_seconds }}"
    script: |
      import os
      import json
      import re
      import urllib.request
      import urllib.error
      import time

      timeout = int(os.environ["TIMEOUT"])

      with open("file.md", "r", encoding="utf-8") as f:
          content = f.read()

      urls = re.findall(r'(https?://[^\s)\]"\']+)', content)
      urls = list(set(urls))
      urls = [u for u in urls if not u.startswith("mailto:") and "localhost" not in u and "127.0.0.1" not in u]

      headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'}

      dead_links = []

      for u in urls:
          success = False
          error_msg = ""
          for attempt in range(3):
              try:
                  req = urllib.request.Request(u, headers=headers, method='HEAD')
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as response:
                          success = True
                          break
                  except (urllib.error.HTTPError, urllib.error.URLError) as e:
                      if isinstance(e, urllib.error.HTTPError) and e.code in [403, 405, 503, 429]:
                          req = urllib.request.Request(u, headers=headers, method='GET')
                          with urllib.request.urlopen(req, timeout=timeout) as response:
                              success = True
                              break
                      else:
                          raise e
              except Exception as e:
                  error_msg = str(e)
                  time.sleep(2)
          if not success:
              dead_links.append({"url": u, "error": error_msg})

      total = len(urls)
      dead_count = len(dead_links)

      print(f"Checked {total} links. Found {dead_count} dead links.")

      outputs = {
          "outputs": {
              "total": total,
              "dead_count": dead_count,
              "dead_links": dead_links
          }
      }
      print("::" + json.dumps(outputs) + "::")

  - id: evaluate
    type: io.kestra.plugin.core.flow.If
    description: If dead links are found, post them to Slack. Otherwise, log a success message.
    condition: "{{ outputs.check_links.vars.dead_count > 0 }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post the detailed list of dead links to Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "Dead links found in {{ inputs.markdown_url }} (Execution {{ execution.id }}):\n{{ outputs.check_links.vars.dead_links | toJson }}"
          }
      
      - id: fail_flow
        type: io.kestra.plugin.core.execution.Fail
        description: Fail the flow execution since fail_on_dead_links is true.
        runIf: "{{ inputs.fail_on_dead_links }}"
        errorMessage: "Flow failed because {{ outputs.check_links.vars.dead_count }} dead links were found."
    else:
      - id: log_success
        type: io.kestra.plugin.core.log.Log
        description: Log a success message when all links are accessible.
        message: "Success: All {{ outputs.check_links.vars.total }} links in {{ inputs.markdown_url }} are valid."

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert the team if the flow execution fails due to a task error or dead links.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Link checker FAILED in flow {{ flow.id }} (execution {{ execution.id }}) for {{ inputs.markdown_url }}."
      }

extend:
  title: Check Markdown Files for Dead Links
  metaDescription: Automatically extract and check all HTTP/HTTPS links in a Markdown file. Get Slack alerts for dead links and handle timeouts, redirects, and retries.
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Policy & Compliance
  ee: false
  demo: false
  description: |
    Dead links in READMEs and documentation erode user trust and cause frustration. This blueprint automates link checking by downloading a Markdown file, extracting all URLs, and testing them for accessibility. It handles rate limits, redirects, and server rejections elegantly, alerting you in Slack when links rot.

    ## How it works

    1. `download` (`io.kestra.plugin.core.http.Download`) fetches the raw Markdown file to Kestra's internal storage.
    2. `check_links` (`io.kestra.plugin.scripts.python.Script`) runs a slim Python script in a Docker container. It deduplicates links, skips local addresses, and uses `HEAD` requests to verify URLs quickly, falling back to `GET` for servers that block `HEAD`.
    3. `evaluate` (`io.kestra.plugin.core.flow.If`) branches based on the results. If dead links are found, it posts a detailed JSON payload to Slack and conditionally fails the execution. If all links pass, it logs a success message.
    4. The `errors` block acts as a safety net, sending a Slack alert if the flow itself fails to execute.

    ## What you get

    - Automated, repeatable link hygiene for your documentation.
    - Detailed Slack notifications listing exactly which links died and why.
    - Graceful handling of common web scraping pitfalls like `405 Method Not Allowed` or `403 Forbidden` on `HEAD` requests.

    ## Who it's for

    - DevRel and documentation teams managing large repositories.
    - Open-source maintainers who want to ensure their READMEs stay current.
    - Infrastructure engineers enforcing documentation policies.

    ## Why orchestrate this with Kestra

    Instead of relying on a fragile local script or a CI job that hides results in logs, orchestrating this with Kestra gives you scheduled execution, automatic Slack alerts, and a clear audit trail. You get visibility into how many links were checked and exactly what failed, right in the Kestra UI and your team's Slack channel.

    ## Prerequisites

    - A local `docker run` command or Docker service for Kestra to run the Python image.
    - A Slack incoming webhook configured for your workspace.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: The Slack webhook URL used to send notifications for dead links and flow failures. Note: Secrets are passed as environment variables prefixed with `SECRET_` and base64-encoded (example: `SECRET_SLACK_WEBHOOK_URL=<base64 of the url>`).

    ## Inputs

    - `markdown_url`: The URL of the Markdown file to check.
    - `timeout_seconds`: The timeout for each HTTP request.
    - `fail_on_dead_links`: Whether to fail the Kestra execution if any dead links are found.

    ## Outputs

    - `{{ outputs.download.uri }}`: The internal storage path of the downloaded Markdown file.
    - `{{ outputs.check_links.vars.dead_count }}`: The total number of dead links found.
    - `{{ outputs.check_links.vars.dead_links }}`: A JSON array containing the dead URLs and their error messages.

    ## Quick start

    1. Store your Slack webhook URL in the `SLACK_WEBHOOK_URL` secret.
    2. Upload this blueprint and run it manually against a raw README URL.
    3. Enable the `weekly_schedule` trigger to monitor your links automatically.

    ## How to extend

    - Add an input for a list of URLs and use a `ForEach` task to check multiple documentation files in parallel.
    - Store the results in a database like PostgreSQL or BigQuery for long-term tracking of documentation health.
    - Instead of just checking URLs, extend the Python script to validate anchor links within the same repository.

    ## Pitfalls

    - **Disabled schedule**: The schedule is disabled by default. You must set `disabled: false` to run it automatically.
    - **Bot-blocking sites**: Some websites block automated requests entirely. The script uses a standard User-Agent, but aggressive CDNs might still return a 403.
    - **Rate limits**: Checking a page with hundreds of links to the same domain might trigger rate limits (429). The script includes simple retries, but a large file might require a longer timeout or a delay between requests.
    - **Redirects**: The `urllib` library handles standard redirects automatically, but complex JavaScript redirects will not be followed.
    - **Secret setup**: Ensure the Slack webhook secret is created correctly.
    - **Expression syntax**: Be careful when editing Pebble expressions; ensure variables like `outputs.check_links.vars.dead_count` exactly match the emitted outputs.

    ## Links

    - [HTTP Download Plugin Documentation](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.download)
    - [Python Script Plugin Documentation](https://kestra.io/plugins/scripts/tasks/python/io.kestra.plugin.scripts.python.script)
    - [If Task Plugin Documentation](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.if)
    - [Slack Incoming Webhook Documentation](https://api.slack.com/messaging/webhooks)
