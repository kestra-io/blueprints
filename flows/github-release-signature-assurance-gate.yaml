id: github-release-signature-assurance-gate
namespace: company.infrastructure
description: |
  Inspect the latest public GitHub release, its tag object, and the commit the tag
  resolves to. Read GitHub's verification metadata for annotated tag signatures and
  commit signatures, record unsigned/unverified states with precise reasons, and
  optionally fail a release gate when the repository requires verified signatures.
  This checks GitHub's reported signature status; it does not independently verify
  cryptographic material or attest release artifacts.

inputs:
  - id: repository
    type: STRING
    displayName: GitHub repository
    defaults: kestra-io/kestra
    description: Public GitHub repository in owner/name format.
  - id: fail_on_unsigned_tag
    type: BOOL
    displayName: Fail if release tag is not verified
    defaults: false
    description: When true, block if the release tag is lightweight, unsigned, or GitHub cannot verify its signature.
  - id: fail_on_unverified_commit
    type: BOOL
    displayName: Fail if release commit is not verified
    defaults: false
    description: When true, block unless GitHub reports the release commit signature as verified.
  - id: allow_prerelease
    type: BOOL
    displayName: Allow prereleases
    defaults: false
    description: When false, block if the latest release is marked as a prerelease.
  - id: notify_slack
    type: BOOL
    displayName: Send Slack alerts
    defaults: false
    description: Enable only after configuring SLACK_WEBHOOK_URL in the Kestra namespace.
  - id: archive_report
    type: BOOL
    displayName: Archive report to S3
    defaults: false
    description: Store the JSON audit report in S3. AWS secrets are required only when enabled.
  - id: evidence_bucket
    type: STRING
    displayName: S3 evidence bucket
    defaults: my-release-signature-audit
    description: Existing S3 bucket used only when report archival is enabled.
  - id: evidence_prefix
    type: STRING
    displayName: S3 evidence prefix
    defaults: github-release-signature-audits
    description: Prefix for repository-specific signature audit reports.
  - id: aws_region
    type: STRING
    displayName: AWS region
    defaults: eu-west-1
    description: Region containing the evidence bucket.

triggers:
  - id: weekday_release_signature_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Recheck the latest public release every weekday. Enable after reviewing the repository signing policy and configuring optional integrations.
    cron: "0 9 * * 1-5"
    disabled: true

tasks:
  - id: validate_request
    type: io.kestra.plugin.scripts.python.Script
    description: Validate the owner/repository identifier before making public GitHub API requests.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      REPOSITORY: "{{ inputs.repository }}"
    script: |
      import os
      import re

      repository = os.environ.get("REPOSITORY", "").strip()
      if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
          raise ValueError("repository must be a public GitHub owner/name pair")
      print(f"Validated public GitHub repository: {repository}")

  - id: inspect_release_signatures
    type: io.kestra.plugin.scripts.python.Script
    description: Resolve the latest release tag through GitHub's API, inspect annotated tag and commit signatures, and apply the configured enforcement policy.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    dependencies:
      - kestra
    env:
      REPOSITORY: "{{ inputs.repository }}"
      FAIL_ON_UNSIGNED_TAG: "{{ inputs.fail_on_unsigned_tag }}"
      FAIL_ON_UNVERIFIED_COMMIT: "{{ inputs.fail_on_unverified_commit }}"
      ALLOW_PRERELEASE: "{{ inputs.allow_prerelease }}"
    outputFiles:
      - release-signature-audit.json
    script: |
      import json
      import os
      from datetime import datetime, timezone
      from urllib.parse import quote
      from urllib.request import Request, urlopen

      from kestra import Kestra

      repository = os.environ["REPOSITORY"].strip()
      fail_on_unsigned_tag = os.environ.get("FAIL_ON_UNSIGNED_TAG", "false").lower() == "true"
      fail_on_unverified_commit = os.environ.get("FAIL_ON_UNVERIFIED_COMMIT", "false").lower() == "true"
      allow_prerelease = os.environ.get("ALLOW_PRERELEASE", "false").lower() == "true"
      api_base = "https://api.github.com"
      findings = []

      def get_json(url):
          request = Request(url, headers={
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "Kestra-GitHub-Release-Signature-Assurance/1.0",
          })
          with urlopen(request, timeout=30) as response:
              if response.status < 200 or response.status >= 300:
                  raise RuntimeError(f"GitHub API returned HTTP {response.status}: {url}")
              payload = json.load(response)
          if not isinstance(payload, dict):
              raise ValueError(f"Expected a JSON object from GitHub API: {url}")
          return payload

      def add(code, severity, message):
          findings.append({"code": code, "severity": severity, "message": message})

      release = get_json(f"{api_base}/repos/{repository}/releases/latest")
      tag_name = str(release.get("tag_name") or "").strip()
      release_url = str(release.get("html_url") or "").strip()
      if not tag_name:
          raise ValueError("GitHub latest-release response has no tag_name")
      if release.get("prerelease") and not allow_prerelease:
          add("PRERELEASE_BLOCKED", "BLOCK", f"Latest release {tag_name} is a prerelease and policy disallows prereleases.")

      encoded_tag = quote(tag_name, safe="")
      ref = get_json(f"{api_base}/repos/{repository}/git/ref/tags/{encoded_tag}")
      initial_object = ref.get("object") or {}
      tag_object_type = initial_object.get("type")
      tag_object_sha = str(initial_object.get("sha") or "")
      tag_chain = []
      visited = set()
      tag_signature = {
          "verified": False,
          "reason": "lightweight tag: no annotated tag object to carry a tag signature",
          "objectType": tag_object_type,
          "objectSha": tag_object_sha,
      }
      commit_sha = None

      # Follow annotated tag objects until the reference resolves to an immutable commit.
      for depth in range(5):
          if tag_object_type == "commit":
              commit_sha = tag_object_sha
              break
          if tag_object_type != "tag" or not tag_object_sha:
              add("TAG_TARGET_UNRESOLVED", "BLOCK", f"Tag {tag_name} points to unsupported object type {tag_object_type!r}.")
              break
          if tag_object_sha in visited:
              add("TAG_OBJECT_CYCLE", "BLOCK", f"GitHub tag object chain contains a cycle at {tag_object_sha}.")
              break
          visited.add(tag_object_sha)
          tag_data = get_json(f"{api_base}/repos/{repository}/git/tags/{tag_object_sha}")
          verification = tag_data.get("verification") or {}
          tag_chain.append({
              "sha": tag_object_sha,
              "tag": tag_data.get("tag"),
              "object": tag_data.get("object"),
              "verification": verification,
          })
          tag_signature = {
              "verified": verification.get("verified") is True,
              "reason": verification.get("reason") or ("verified" if verification.get("verified") is True else "verification reason unavailable"),
              "objectType": "tag",
              "objectSha": tag_object_sha,
              "tagger": tag_data.get("tagger"),
          }
          next_object = tag_data.get("object") or {}
          tag_object_type = next_object.get("type")
          tag_object_sha = str(next_object.get("sha") or "")
      else:
          add("TAG_CHAIN_TOO_DEEP", "BLOCK", f"Tag {tag_name} did not resolve to a commit within five tag objects.")

      if not commit_sha and tag_object_type == "commit":
          commit_sha = tag_object_sha
      if not commit_sha:
          raise ValueError(f"Unable to resolve release tag {tag_name} to a commit")

      commit_data = get_json(f"{api_base}/repos/{repository}/commits/{commit_sha}")
      commit_info = commit_data.get("commit") or {}
      verification = commit_info.get("verification") or {}
      commit_verified = verification.get("verified") is True
      commit_reason = verification.get("reason") or ("verified" if commit_verified else "verification reason unavailable")

      if not tag_signature.get("verified"):
          severity = "BLOCK" if fail_on_unsigned_tag else "WARN"
          add("RELEASE_TAG_NOT_VERIFIED", severity, f"Release tag {tag_name} was not verified by GitHub: {tag_signature.get('reason')}.")
      if not commit_verified:
          severity = "BLOCK" if fail_on_unverified_commit else "WARN"
          add("RELEASE_COMMIT_NOT_VERIFIED", severity, f"Commit {commit_sha} was not verified by GitHub: {commit_reason}.")

      blocking = [item for item in findings if item["severity"] == "BLOCK"]
      warnings = [item for item in findings if item["severity"] == "WARN"]
      verdict = "FAIL" if blocking else ("PASS_WITH_WARNINGS" if warnings else "PASS")
      report = {
          "schemaVersion": 1,
          "checkedAt": datetime.now(timezone.utc).isoformat(),
          "repository": repository,
          "release": {
              "tagName": tag_name,
              "releaseUrl": release_url,
              "publishedAt": release.get("published_at"),
              "prerelease": bool(release.get("prerelease", False)),
              "targetCommitish": release.get("target_commitish"),
          },
          "tag": {
              "initialObjectType": initial_object.get("type"),
              "initialObjectSha": initial_object.get("sha"),
              "annotatedTagChain": tag_chain,
              "verification": tag_signature,
          },
          "commit": {
              "sha": commit_sha,
              "htmlUrl": commit_data.get("html_url"),
              "message": commit_info.get("message"),
              "verification": {
                  "verified": commit_verified,
                  "reason": commit_reason,
                  "verifiedAt": verification.get("verified_at"),
                  "signaturePresent": bool(verification.get("signature")),
              },
          },
          "policy": {
              "failOnUnsignedTag": fail_on_unsigned_tag,
              "failOnUnverifiedCommit": fail_on_unverified_commit,
              "allowPrerelease": allow_prerelease,
          },
          "findings": findings,
          "blockingFindingCount": len(blocking),
          "warningCount": len(warnings),
          "verdict": verdict,
          "scopeNote": "This report relies on GitHub's verification API fields. It does not independently verify signatures, prove publisher identity outside GitHub's trust model, or verify downloaded release assets or build provenance attestations.",
      }
      with open("release-signature-audit.json", "w", encoding="utf-8") as target:
          json.dump(report, target, indent=2, ensure_ascii=False)

      print(f"GitHub release signature audit: {repository}@{tag_name}, tag_verified={tag_signature.get('verified')}, commit_verified={commit_verified}, verdict={verdict}")
      print("Release signature findings: " + json.dumps(findings, ensure_ascii=False))
      Kestra.outputs({
          "repository": repository,
          "tag_name": tag_name,
          "release_url": release_url,
          "tag_signature_verified": tag_signature.get("verified"),
          "tag_signature_reason": tag_signature.get("reason"),
          "commit_sha": commit_sha,
          "commit_signature_verified": commit_verified,
          "commit_signature_reason": commit_reason,
          "blocking_finding_count": len(blocking),
          "warning_count": len(warnings),
          "verdict": verdict,
          "findings": findings,
      })

  - id: optionally_archive_report
    type: io.kestra.plugin.core.flow.If
    description: Optionally retain signature verification evidence in S3.
    condition: "{{ inputs.archive_report }}"
    then:
      - id: upload_release_signature_report
        type: io.kestra.plugin.aws.s3.Upload
        description: Store the signature audit report; the flow does not download release binaries.
        accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
        region: "{{ inputs.aws_region }}"
        bucket: "{{ inputs.evidence_bucket }}"
        from: "{{ outputs.inspect_release_signatures.outputFiles['release-signature-audit.json'] }}"
        key: "{{ inputs.evidence_prefix }}/{{ inputs.repository | replace('/', '_') }}/{{ outputs.inspect_release_signatures.vars.tag_name | replace('/', '_') }}/release-signature-audit.json"

  - id: enforce_signature_policy
    type: io.kestra.plugin.core.flow.If
    description: Fail closed when strict signature policy inputs require verified tag or commit signatures and GitHub reports otherwise.
    condition: "{{ outputs.inspect_release_signatures.vars.verdict == 'FAIL' }}"
    then:
      - id: optionally_alert_signature_failure
        type: io.kestra.plugin.core.flow.If
        description: Send an alert only when enabled and the webhook secret is configured.
        condition: "{{ inputs.notify_slack }}"
        then:
          - id: alert_signature_failure
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Alert release owners that signature policy requirements were not met.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |-
              {{
                {
                  "text": ":warning: GitHub release signature policy BLOCKED\nRepository: " ~ outputs.inspect_release_signatures.vars.repository ~
                    "\nTag: " ~ outputs.inspect_release_signatures.vars.tag_name ~
                    "\nRelease: " ~ outputs.inspect_release_signatures.vars.release_url ~
                    "\nFindings: " ~ (outputs.inspect_release_signatures.vars.findings | toJson) ~
                    "\nExecution: " ~ execution.id ~
                    "\nReview release-signature-audit.json before promotion."
                } | toJson
              }}
      - id: fail_signature_gate
        type: io.kestra.plugin.core.execution.Fail
        description: Stop downstream release promotion when configured signature requirements are unmet.
        errorMessage: "GitHub release signature policy failed for {{ inputs.repository }}@{{ outputs.inspect_release_signatures.vars.tag_name }}. Review release-signature-audit.json."
    else:
      - id: log_signature_verdict
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "GitHub release signature audit {{ outputs.inspect_release_signatures.vars.verdict }} for {{ inputs.repository }}@{{ outputs.inspect_release_signatures.vars.tag_name }}; tag_verified={{ outputs.inspect_release_signatures.vars.tag_signature_verified }}, commit_verified={{ outputs.inspect_release_signatures.vars.commit_signature_verified }}."

errors:
  - id: optionally_alert_execution_failure
    type: io.kestra.plugin.core.flow.If
    description: Send technical execution failure notifications only when enabled.
    condition: "{{ inputs.notify_slack }}"
    then:
      - id: alert_execution_failure
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alert when a network/API, parsing, or orchestration failure prevents the audit.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |-
          {{
            {
              "text": ":warning: GitHub release signature audit execution failed\nRepository: " ~ inputs.repository ~
                "\nExecution: " ~ execution.id ~
                "\nInspect Kestra logs; execution failure is not a passing signature result."
            } | toJson
          }}

outputs:
  - id: release_signature_audit
    type: JSON
    description: Machine-readable release tag and commit signature status, GitHub verification reasons, findings, and policy verdict.
    value: "{{ outputs.inspect_release_signatures.vars | toJson }}"

extend:
  title: GitHub Release Signature Assurance Gate
  metaTitle: GitHub Release Signature Assurance Gate | Kestra
  shortDescription: Inspect GitHub release tag and commit signature verification and optionally block releases that do not meet a repository's signing policy.
  metaDescription: Audit GitHub releases for tag and commit signature status via GitHub's API, with optional fail-closed enforcement and JSON evidence.
  description: |
    Review the latest published release of a public GitHub repository before it is promoted to production. The flow resolves the release's tag reference through annotated tag objects to an immutable commit, reads GitHub's reported tag and commit verification metadata, and compares those observations to an explicit signing policy. It writes a JSON report with verification reasons, optionally stores that report in S3, and can alert Slack and fail when strict policy settings require a verified tag or commit.

    ## How it works

    1. Validate the public GitHub repository identifier.
    2. Fetch the latest published release and resolve its tag ref.
    3. Follow annotated tag objects until the tag points to the immutable release commit, recording the tag object's verification status when available.
    4. Fetch the commit through the GitHub commits API and record its signature verification status and reason.
    5. Report unsigned/unverified states as warnings by default; optionally turn either condition into a blocking policy finding, then archive evidence or alert on a strict-policy failure.

    ## What you get

    - A tag and commit identity record pinned to an immutable commit SHA.
    - GitHub's verification state and reason for the tag and commit signature checks.
    - A structured report of unsigned tags, unverified commits and prerelease policy findings.
    - Optional S3 report retention and Slack notification for strict-policy failures.
    - A default audit mode that reveals current signing practice without assuming every public project signs releases, plus explicit strict mode for repositories with mandatory signature policy.

    ## Who it's for

    - Release engineers evaluating signature requirements before deployment.
    - Platform teams comparing signing practices across public GitHub repositories.
    - Security and compliance teams tracking release verification evidence.

    ## Why orchestrate this with Kestra

    The flow gives release-signature observations repeatable scheduling, task-level logs, input-driven policy and a machine-readable report. Teams can first collect evidence, then enable strict enforcement only after establishing the repository's documented signing policy.

    ## Prerequisites

    - Kestra 2.x workers with Docker enabled for the Python Script task runner.
    - Network access from the worker to the public GitHub REST API.
    - Optional Slack incoming webhook and optional S3 bucket with write access.
    - Public repositories can be inspected without a GitHub token; unauthenticated API rate limits apply.

    ### Secrets

    - SLACK_WEBHOOK_URL: optional Slack incoming webhook; required only when notify_slack is true.
    - AWS_ACCESS_KEY_ID: optional AWS access key used only when report archival is enabled.
    - AWS_SECRET_ACCESS_KEY: optional AWS secret key used only when report archival is enabled.

    ## Quick start

    1. Import the flow and start with kestra-io/kestra as the public repository example.
    2. Execute it manually and review the release_signature_audit output and release-signature-audit.json.
    3. Review the tag and commit verification.reason values before deciding whether signing is mandatory for your project.
    4. Enable fail_on_unsigned_tag or fail_on_unverified_commit only when those are actual release requirements.
    5. Configure optional alert/report secrets and enable weekday_release_signature_audit after reviewing the initial result.

    ## How to extend

    - Compare multiple release channels (stable vs prerelease) and the release tag against a protected release branch.
    - Add signature-policy allowlists for documented, legacy unsigned releases.
    - Verify artifact digests and build provenance separately; commit/tag signatures do not establish that binaries were built from the inspected source.
    - Export reports to a central compliance bucket and correlate changes in verification reason over time.

    ## Links

    - [GitHub Releases REST API](https://docs.github.com/en/rest/releases/releases#get-the-latest-release)
    - [Git references REST API](https://docs.github.com/en/rest/git/refs#get-a-reference)
    - [Git tags REST API](https://docs.github.com/en/rest/git/tags#get-a-tag)
    - [GitHub commits REST API](https://docs.github.com/en/rest/commits/commits#get-a-commit)
    - [Kestra Python Script plugin](https://kestra.io/plugins/plugin-scripts/python)
    - [Kestra Slack Incoming Webhook plugin](https://kestra.io/plugins/plugin-slack/slackincomingwebhook)
    - [Kestra AWS S3 plugin](https://kestra.io/plugins/plugin-aws/s3)
  tags:
    - Infrastructure
  subTags:
    - Policy & Compliance
    - CI/CD & Deployment
  ee: false
  demo: false
