id: spaceflight-news-media-lakehouse-loader
namespace: company.analytics
description: Ingests global aerospace news articles, publishing sites, and mission summaries from Spaceflight News API into Parquet lakehouse storage via DuckDB, tracking aerospace publication activity in Kestra KV store.

inputs:
  - id: articles_limit
    type: INT
    description: Maximum number of recent aerospace news dispatches to ingest.
    defaults: 20

  - id: state_key
    type: STRING
    description: Kestra KV store key maintaining the latest known spaceflight article IDs.
    defaults: spaceflight_news_monitored_articles_state

variables:
  default_state: "[]"

triggers:
  - id: daily_aerospace_news_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 10 * * *"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_news
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_articles = set(json.loads(raw_state)) if raw_state else set()
        except Exception:
            seen_articles = set()

        limit = int("{{ inputs.articles_limit }}")

        url = f"https://api.spaceflightnewsapi.net/v4/articles/?limit={limit}"
        headers = {"User-Agent": "KestraAerospaceLakehouse/1.0 (space-journalism@kestra.io)"}

        records = []
        new_articles = []
        harvested_ids = []

        try:
            resp = requests.get(url, headers=headers, timeout=20)
            if resp.status_code == 200:
                data = resp.json()
                results = data.get("results", [])
                for art in results:
                    art_id = art.get("id")
                    title = art.get("title", "")
                    url_link = art.get("url", "")
                    image_url = art.get("image_url", "")
                    news_site = art.get("news_site", "")
                    summary = (art.get("summary") or "")[:250]
                    published_at = art.get("published_at", "")

                    is_new = art_id not in seen_articles
                    harvested_ids.append(art_id)

                    records.append({
                        "article_id": art_id,
                        "title": title,
                        "news_site": news_site,
                        "url": url_link,
                        "image_url": image_url,
                        "summary": summary,
                        "published_at": published_at,
                        "is_new_article": is_new,
                        "harvest_time": datetime.utcnow().isoformat()
                    })

                    if is_new:
                        new_articles.append({"id": art_id, "title": title, "site": news_site})
        except Exception as e:
            print(f"Error fetching Spaceflight News API: {e}")

        with open("spaceflight_articles.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("CREATE TABLE aerospace_news AS SELECT * FROM read_json_auto('spaceflight_articles.json')")
            con.execute("COPY aerospace_news TO 'spaceflight_news_archive.parquet' (FORMAT PARQUET)")
            con.execute("COPY aerospace_news TO 'spaceflight_news_archive.csv' (HEADER, DELIMITER ',')")
        else:
            con.execute("""
                CREATE TABLE aerospace_news (
                    article_id BIGINT,
                    title VARCHAR,
                    news_site VARCHAR,
                    url VARCHAR,
                    image_url VARCHAR,
                    summary VARCHAR,
                    published_at VARCHAR,
                    is_new_article BOOLEAN,
                    harvest_time VARCHAR
                )
            """)
            con.execute("COPY aerospace_news TO 'spaceflight_news_archive.parquet' (FORMAT PARQUET)")
            con.execute("COPY aerospace_news TO 'spaceflight_news_archive.csv' (HEADER, DELIMITER ',')")

        summary = {
            "total_articles_count": len(records),
            "new_articles_count": len(new_articles),
            "new_articles": new_articles[:5],
            "updated_state": list(set(list(seen_articles) + harvested_ids))[:500]
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - spaceflight_news_archive.parquet
      - spaceflight_news_archive.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_news.vars.updated_state | toJson }}"

  - id: check_new_articles
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_news.vars.new_articles_count > 0 }}"
    then:
      - id: notify_space_news
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "🛰️ Aerospace Journalism Lakehouse Sync: Discovered {{ outputs.ingest_and_transform_news.vars.new_articles_count }} newly published spaceflight articles across verified news outlets."

outputs:
  - id: total_articles
    type: INT
    value: "{{ outputs.ingest_and_transform_news.vars.total_articles_count }}"
  - id: new_articles_count
    type: INT
    value: "{{ outputs.ingest_and_transform_news.vars.new_articles_count }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_news.outputFiles['spaceflight_news_archive.parquet'] }}"

extend:
  title: Spaceflight News Media Intelligence Lakehouse Loader with DuckDB
  metaTitle: Spaceflight News Media Lakehouse Loader | Kestra
  shortDescription: Ingests global aerospace news articles, publishing sites, and mission summaries from Spaceflight News API into Parquet lakehouse storage via DuckDB.
  metaDescription: Poll Spaceflight News API for aerospace journalism, convert publication archives into Parquet via DuckDB, and track state in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Automate the collection, aerospace journalism harmonization, and analytical persistence of global spaceflight
    news articles, mission updates, launch summaries, and publisher telemetry from the Spaceflight News API into Parquet using DuckDB.

    ## How it works

    1. **State Recovery**: Queries the Kestra KV store (`spaceflight_news_monitored_articles_state`) for previously indexed article identifiers.
    2. **Spaceflight News Ingestion**: Queries the official Spaceflight News REST API (`api.spaceflightnewsapi.net/v4/articles/`) across major verified aerospace journalism outlets.
    3. **DuckDB Media Normalization**: Normalizes article headlines, publication dates, publishers, and summaries into a relational schema inside Docker.
    4. **Analytical Lake Export**: Exports normalized news records into columnar Parquet and CSV files for market intelligence, NLP analysis, and research archives.
    5. **Publication Detection & State Commitment**: Detects newly published aerospace dispatches, logs summaries, and commits article IDs to Kestra KV store.

    ## What you get

    - Automated, scheduled collection of verified global space exploration news and mission updates.
    - Columnar Parquet datasets queryable with DuckDB, ClickHouse, Snowflake, or Athena.
    - Built-in KV state management providing idempotent execution and zero database requirements.

    ## Who it's for

    - Aerospace Market Analysts tracking launch provider and satellite industry developments.
    - NLP Data Scientists building domain-specific corpus pipelines.
    - Analytics Engineers building reproducible multi-cloud lakehouse pipelines.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains historical publication state across runs without database infrastructure.
    - Ephemeral Docker execution guarantees reproducible, clean Python and DuckDB runtimes.
    - Declarative scheduled execution with automated error recovery and conditional logging.

    ## Prerequisites

    - Docker runner configured on the Kestra worker.
    - Outbound internet access to `api.spaceflightnewsapi.net`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for alerting teams on newly published aerospace articles.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Customize the `articles_limit` input parameter.
    3. Click **Execute** to run an immediate harvest and generate the Parquet archive.
    4. Enable the `daily_aerospace_news_sync` schedule for automated daily updates.

    ## How to extend

    - Add an S3 or Google Cloud Storage step to partition daily aerospace journalism snapshots.
    - Connect an LLM summarization task downstream using Mistral, Gemini, or OpenAI.

    ## Links

    - [Spaceflight News API Documentation](https://spaceflightnewsapi.net/)
    - [DuckDB Documentation](https://duckdb.org/)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
