id: redpanda-under-replicated-partition-and-rebalance-guard
namespace: company.streaming

description: |
  Audit Redpanda clusters via the Admin API for under-replicated and leaderless partitions,
  differentiate transient rebalances from persistently stuck partition replication using
  differential tracking in Kestra KV, alert on-call teams, pause for operator sign-off,
  trigger cluster-wide partition rebalancing, and verify post-remediation cluster convergence.

inputs:
  - id: admin_api_url
    type: STRING
    displayName: Redpanda Admin API URL
    description: Base HTTP URL of the Redpanda Admin API endpoint (default port 9644), e.g. http://redpanda.internal:9644.
    defaults: "http://localhost:9644"

  - id: under_replicated_threshold
    type: INT
    displayName: Under-Replicated Partition Threshold
    description: Minimum number of under-replicated partitions required before a cluster is flagged as a candidate for remediation.
    defaults: 1

  - id: critical_threshold
    type: INT
    displayName: Critical Under-Replicated Threshold
    description: Number of under-replicated partitions at or above which the cluster is escalated immediately to CRITICAL, bypassing consecutive-run confirmation.
    defaults: 5

  - id: min_consecutive_runs
    type: INT
    displayName: Minimum Consecutive Degraded Runs
    description: Number of consecutive audit passes an under-replicated partition must persist before being treated as stuck rather than in-flight replication or node restart.
    defaults: 2

  - id: cursor_key
    type: STRING
    displayName: KV Cursor Key
    description: Kestra KV key used to persist per-partition replication state and consecutive degraded run counts across executions.
    defaults: "redpanda_partition_health_tracker"

  - id: slack_webhook_uri
    type: URI
    displayName: Slack Webhook URI
    description: Webhook endpoint used to alert operators and deliver the execution approval link.
    defaults: https://kestra.io/api/mock

  - id: dry_run
    type: BOOL
    displayName: Dry Run Mode
    description: When true, audits cluster health and logs proposed rebalancing actions without triggering mutations on the Redpanda cluster.
    defaults: true

  - id: auto_remediate
    type: BOOL
    displayName: Auto Remediate
    description: When true and dry_run is false, halts execution for operator sign-off and triggers partition rebalancing via the Admin API.
    defaults: false

triggers:
  - id: periodic_health_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audit Redpanda partition health and replication state every 10 minutes. Shipped disabled so the flow can be verified safely first.
    cron: "*/10 * * * *"
    disabled: true

  - id: on_demand_health_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated HTTP endpoint invoked by monitoring alerts, Prometheus Alertmanager, or incident response runbooks.
    key: "{{ secret('REDPANDA_GUARD_WEBHOOK_KEY') }}"

tasks:
  - id: validate_inputs
    type: io.kestra.plugin.core.execution.Assert
    description: Assert operational thresholds satisfy sanity constraints before querying the Redpanda Admin API.
    conditions:
      - "{{ inputs.under_replicated_threshold >= 1 }}"
      - "{{ inputs.critical_threshold >= inputs.under_replicated_threshold }}"
      - "{{ inputs.min_consecutive_runs >= 1 }}"
    errorMessage: "Invalid configuration: critical_threshold must be >= under_replicated_threshold, and min_consecutive_runs must be positive."

  - id: fetch_cluster_health
    type: io.kestra.plugin.core.http.Request
    description: Query the Redpanda Admin API health overview endpoint to inspect nodes, leaderless partitions, and under-replicated partitions.
    uri: "{{ inputs.admin_api_url }}/v1/cluster/health_overview"
    method: GET
    headers:
      Accept: application/json

  - id: fetch_balancer_status
    type: io.kestra.plugin.core.http.Request
    description: Query the Redpanda partition autobalancer status to check for unavailable nodes or disk limit violations.
    uri: "{{ inputs.admin_api_url }}/v1/cluster/partition_balancer/status"
    method: GET
    headers:
      Accept: application/json

  - id: triage_cluster_health
    type: io.kestra.plugin.scripts.python.Script
    description: Classify cluster health, diff under-replicated partitions against historical KV state, and identify actionable degradation.
    containerImage: python:3.11-slim
    env:
      HEALTH_BODY: "{{ outputs.fetch_cluster_health.body is defined ? outputs.fetch_cluster_health.body : '{}' }}"
      BALANCER_BODY: "{{ outputs.fetch_balancer_status.body is defined ? outputs.fetch_balancer_status.body : '{}' }}"
      UNDER_REPLICATED_THRESHOLD: "{{ inputs.under_replicated_threshold }}"
      CRITICAL_THRESHOLD: "{{ inputs.critical_threshold }}"
      MIN_CONSECUTIVE_RUNS: "{{ inputs.min_consecutive_runs }}"
      EXECUTION_ID: "{{ execution.id }}"
      PREVIOUS_STATE_JSON: "{{ kv(inputs.cursor_key, errorOnMissing=false) ?? '{}' }}"
    script: |
      import json
      import os
      from datetime import datetime, timezone

      try:
          from kestra import Kestra
      except ImportError:
          Kestra = None

      now_iso = datetime.now(timezone.utc).isoformat()
      health_raw = os.environ.get("HEALTH_BODY", "{}")
      balancer_raw = os.environ.get("BALANCER_BODY", "{}")
      under_rep_threshold = int(os.environ.get("UNDER_REPLICATED_THRESHOLD", "1"))
      critical_threshold = int(os.environ.get("CRITICAL_THRESHOLD", "5"))
      min_consecutive_runs = int(os.environ.get("MIN_CONSECUTIVE_RUNS", "2"))
      execution_id = os.environ.get("EXECUTION_ID", "manual")

      prev_state_raw = os.environ.get("PREVIOUS_STATE_JSON", "{}")
      try:
          prev_state = json.loads(prev_state_raw) if prev_state_raw.strip() else {}
      except Exception:
          prev_state = {}

      try:
          health_data = json.loads(health_raw) if isinstance(health_raw, str) and health_raw.strip() else (health_raw if isinstance(health_raw, dict) else {})
      except Exception:
          health_data = {}

      try:
          balancer_data = json.loads(balancer_raw) if isinstance(balancer_raw, str) and balancer_raw.strip() else (balancer_raw if isinstance(balancer_raw, dict) else {})
      except Exception:
          balancer_data = {}

      is_healthy = bool(health_data.get("is_healthy", False))
      all_nodes = health_data.get("all_nodes", []) or []
      nodes_down = health_data.get("nodes_down", []) or []
      leaderless = health_data.get("leaderless_partitions", []) or []
      under_rep = health_data.get("under_replicated_partitions", []) or []

      balancer_status = str(balancer_data.get("status", "unknown"))
      violations = balancer_data.get("violations", {}) or {}
      overdisk_nodes = violations.get("overdisk_limit_nodes", []) or []
      unavailable_nodes = violations.get("unavailable_nodes", []) or []
      pending_force_recovery = int(balancer_data.get("partitions_pending_force_recovery", 0) or 0)

      new_state_snapshot = {}
      stuck_partitions = []

      for p in under_rep:
          prev_entry = prev_state.get(str(p), {})
          prev_consecutive = int(prev_entry.get("consecutive_runs", 0))
          consecutive = prev_consecutive + 1
          new_state_snapshot[str(p)] = {
              "consecutive_runs": consecutive,
              "last_evaluated_at": now_iso,
          }
          if consecutive >= min_consecutive_runs:
              stuck_partitions.append(str(p))

      is_critical = (
          len(under_rep) >= critical_threshold
          or len(leaderless) > 0
          or len(nodes_down) > 0
          or len(overdisk_nodes) > 0
          or pending_force_recovery > 0
      )

      is_actionable = (
          (len(under_rep) >= under_rep_threshold and len(stuck_partitions) > 0)
          or is_critical
      )

      if is_critical:
          overall_status = "CRITICAL"
      elif is_actionable:
          overall_status = "WARNING"
      else:
          overall_status = "HEALTHY"

      summary_lines = []
      if nodes_down:
          summary_lines.append(f"- Down Nodes: `{nodes_down}`")
      if leaderless:
          summary_lines.append(f"- Leaderless Partitions ({len(leaderless)}): `{leaderless[:5]}`")
      if under_rep:
          summary_lines.append(f"- Under-Replicated Partitions ({len(under_rep)}): `{under_rep[:5]}`")
      if stuck_partitions:
          summary_lines.append(f"- Stuck Partitions (>= {min_consecutive_runs} runs): `{stuck_partitions[:5]}`")
      if overdisk_nodes:
          summary_lines.append(f"- Nodes Violating Disk Limits: `{overdisk_nodes}`")
      if balancer_status != "ready":
          summary_lines.append(f"- Balancer Status: `{balancer_status}`")

      summary_text = (
          f"Redpanda Partition Health: {overall_status} | "
          f"Nodes: {len(all_nodes)} total, {len(nodes_down)} down | "
          f"Under-replicated: {len(under_rep)} (stuck: {len(stuck_partitions)}) | "
          f"Leaderless: {len(leaderless)} | Balancer: {balancer_status}"
      )
      print(summary_text)

      audit_manifest = {
          "overall_status": overall_status,
          "is_actionable": is_actionable,
          "all_nodes": all_nodes,
          "nodes_down": nodes_down,
          "under_replicated_count": len(under_rep),
          "stuck_partitions_count": len(stuck_partitions),
          "leaderless_count": len(leaderless),
          "balancer_status": balancer_status,
          "overdisk_nodes": overdisk_nodes,
          "execution_id": execution_id,
          "evaluated_at": now_iso,
          "summary": summary_text,
      }

      output_data = {
          "is_actionable": is_actionable,
          "overall_status": overall_status,
          "under_replicated_count": len(under_rep),
          "stuck_partitions_count": len(stuck_partitions),
          "stuck_partitions": stuck_partitions,
          "leaderless_count": len(leaderless),
          "leaderless_partitions": leaderless,
          "all_nodes_count": len(all_nodes),
          "nodes_down_count": len(nodes_down),
          "nodes_down": nodes_down,
          "balancer_status": balancer_status,
          "overdisk_nodes": overdisk_nodes,
          "summary": summary_text,
          "summary_details": "\n".join(summary_lines) if summary_lines else "All partitions and nodes nominal.",
          "new_state_snapshot": new_state_snapshot,
          "audit_manifest": audit_manifest,
      }

      if Kestra:
          Kestra.outputs(output_data)
      else:
          print("::" + json.dumps({"outputs": output_data}) + "::")

  - id: save_tracker_kv
    type: io.kestra.plugin.core.kv.Set
    description: Persist updated per-partition replication tracking state into Kestra KV for differential trend analysis.
    key: "{{ inputs.cursor_key }}"
    value: "{{ outputs.triage_cluster_health.vars.new_state_snapshot | toJson }}"
    kvType: JSON

  - id: evaluate_cluster_state
    type: io.kestra.plugin.core.flow.If
    description: Determine whether actionable cluster degradation requires alert dispatch and remediation.
    condition: "{{ outputs.triage_cluster_health.vars.is_actionable ?? false }}"
    then:
      - id: notify_slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch an incident alert to Slack with cluster metrics and approval link.
        url: "{{ inputs.slack_webhook_uri }}"
        messageText: |
          :warning: *Redpanda Partition Health Alert [{{ outputs.triage_cluster_health.vars.overall_status }}]*
          *Cluster Nodes:* `{{ outputs.triage_cluster_health.vars.all_nodes_count }}` total | *Nodes Down:* `{{ outputs.triage_cluster_health.vars.nodes_down_count }}`
          *Under-Replicated Partitions:* `{{ outputs.triage_cluster_health.vars.under_replicated_count }}` (Stuck: `{{ outputs.triage_cluster_health.vars.stuck_partitions_count }}`)
          *Leaderless Partitions:* `{{ outputs.triage_cluster_health.vars.leaderless_count }}`
          *Balancer Status:* `{{ outputs.triage_cluster_health.vars.balancer_status }}`
          *Details:*
          {{ outputs.triage_cluster_health.vars.summary_details }}
          *Action Required:* Review degradation and authorize partition rebalance in Kestra:
          http://localhost:8080/ui/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}

      - id: check_remediation_mode
        type: io.kestra.plugin.core.flow.If
        description: Check whether automated remediation is enabled and dry run mode is disabled.
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: pause_for_rebalance_approval
            type: io.kestra.plugin.core.flow.Pause
            description: Pause flow execution to require human sign-off before triggering cluster partition rebalance.
            onResume:
              - id: approved
                type: BOOL
                description: Set to true to authorize partition rebalancing across cluster nodes.
                defaults: true
              - id: approval_reason
                type: STRING
                description: Incident ticket reference or operational justification for the rebalance.
                defaults: "Approved partition rebalance to heal under-replicated partitions"

          - id: execute_rebalance_if_approved
            type: io.kestra.plugin.core.flow.If
            description: Execute the partition rebalance if the operator confirmed approval.
            condition: "{{ outputs.pause_for_rebalance_approval.onResume.approved ?? false }}"
            then:
              - id: trigger_partition_rebalance
                type: io.kestra.plugin.core.http.Request
                description: Invoke Redpanda Admin API to trigger partition rebalancing across available nodes.
                uri: "{{ inputs.admin_api_url }}/v1/partitions/rebalance"
                method: POST
                headers:
                  Accept: application/json

              - id: wait_for_rebalance_stabilization
                type: io.kestra.plugin.core.flow.Sleep
                description: Wait 15 seconds for Redpanda Raft group leadership and partition movement to commence.
                duration: PT15S

              - id: verify_post_rebalance_health
                type: io.kestra.plugin.core.http.Request
                description: Re-query cluster health overview to confirm rebalance progression.
                uri: "{{ inputs.admin_api_url }}/v1/cluster/health_overview"
                method: GET
                headers:
                  Accept: application/json

              - id: save_recovery_audit_kv
                type: io.kestra.plugin.core.kv.Set
                description: Persist the rebalance audit manifest into Kestra KV for incident post-mortem compliance.
                key: "redpanda_rebalance_audit_{{ execution.id }}"
                value: "{{ outputs.triage_cluster_health.vars.audit_manifest | toJson }}"
                kvType: JSON

              - id: notify_rebalance_success
                type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                description: Post confirmation card to Slack indicating partition rebalance was triggered and verified.
                url: "{{ inputs.slack_webhook_uri }}"
                messageText: |
                  :white_check_mark: *Redpanda Partition Rebalance Initiated*
                  *Cluster Endpoint:* `{{ inputs.admin_api_url }}`
                  *Operator Sign-Off:* Approved by operator (`{{ outputs.pause_for_rebalance_approval.onResume.approval_reason }}`)
                  *Post-Rebalance Health Check:* HTTP status `{{ outputs.verify_post_rebalance_health.status }}`
                  *Audit Record:* Archived in Kestra KV key `redpanda_rebalance_audit_{{ execution.id }}`
            else:
              - id: log_rebalance_cancelled
                type: io.kestra.plugin.core.log.Log
                message: "Redpanda partition rebalancing cancelled: operator declined sign-off."
    else:
      - id: log_nominal_health
        type: io.kestra.plugin.core.log.Log
        message: "Redpanda cluster operating nominally: all {{ outputs.triage_cluster_health.vars.all_nodes_count }} node(s) online, 0 under-replicated partitions."

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert operators if the Redpanda health audit encounters an unhandled exception or connectivity failure.
    url: "{{ inputs.slack_webhook_uri }}"
    messageText: |
      :rotating_light: *Redpanda Health Guard Execution Failure*
      *Flow:* `{{ flow.id }}` (`{{ flow.namespace }}`)
      *Execution ID:* `{{ execution.id }}`
      The guard flow encountered an unhandled error while auditing the Redpanda cluster at `{{ inputs.admin_api_url }}`. Please inspect task logs immediately.

extend:
  title: Redpanda Under-Replicated Partition and Auto-Rebalance Guard
  shortDescription: Audit Redpanda clusters for stuck under-replicated or leaderless partitions, diff against Kestra KV across runs, pause for operator approval, and trigger partition rebalancing.
  metaTitle: Redpanda Under-Replicated Partition and Auto-Rebalance Guard with Kestra
  metaDescription: Automatically detect and remediate under-replicated partitions in Redpanda clusters using the Admin API, Kestra KV persistence, and human-in-the-loop approval.
  description: |
    In high-throughput event streaming architectures, Redpanda partitions can fall into an under-replicated or
    leaderless state following node reboots, rolling upgrades, localized disk I/O saturation, or transient network
    partitions. While momentary replication lag is normal during sudden producer traffic spikes, under-replicated
    partitions that fail to heal across multiple audit passes indicate node failure, unbalanced Raft replica placement,
    or stuck recovery loops that expose the cluster to data loss and degraded consumer availability.

    Standard monitoring solutions either flood Slack channels with transient alerts on brief replication dips or require
    engineers to SSH into bastion hosts and run manual `rpk` CLI commands under incident pressure. This blueprint provides
    an automated, self-healing operational guardrail: it queries the Redpanda Admin API, performs differential state analysis
    against historical snapshots persisted in Kestra KV, alerts the team when true replication stalls occur, pauses for human
    approval, triggers automated cluster partition rebalancing, and verifies cluster convergence.

    ## How it works

    1. **Configuration Validation**: `validate_inputs` (`io.kestra.plugin.core.execution.Assert`) verifies that operational thresholds satisfy sanity rules before contacting cluster endpoints.
    2. **Cluster Health Telemetry**: `fetch_cluster_health` (`io.kestra.plugin.core.http.Request`) queries `GET /v1/cluster/health_overview` on the Redpanda Admin API (port 9644) to retrieve active brokers, down nodes, leaderless partitions, and under-replicated partitions.
    3. **Partition Balancer Inspection**: `fetch_balancer_status` (`io.kestra.plugin.core.http.Request`) queries `GET /v1/cluster/partition_balancer/status` to evaluate whether the partition autobalancer is ready, paused, or blocked by disk limit violations.
    4. **Differential State Triage**: `triage_cluster_health` (`io.kestra.plugin.scripts.python.Script`) diffs the active under-replicated partition list against the previous execution snapshot retrieved from Kestra KV (`inputs.cursor_key`). Partitions under-replicated for `>= min_consecutive_runs` or exceeding `critical_threshold` are classified as actionable incidents.
    5. **Trend State Persistence**: `save_tracker_kv` (`io.kestra.plugin.core.kv.Set`) writes the updated partition state snapshot back into Kestra KV.
    6. **Incident Notification**: When actionable degradation is detected, `notify_slack_alert` dispatches a rich Slack card containing affected partitions, broker counts, balancer state, and direct navigation to the Kestra execution approval interface.
    7. **Human-in-the-Loop Sign-Off**: When `auto_remediate` is enabled and `dry_run` is false, `pause_for_rebalance_approval` (`io.kestra.plugin.core.flow.Pause`) halts execution until an authorized engineer reviews the incident and submits approval (`approved: true`).
    8. **Remediation Execution**: `trigger_partition_rebalance` (`io.kestra.plugin.core.http.Request`) invokes `POST /v1/partitions/rebalance` on the Admin API to initiate automated replica movement across healthy brokers.
    9. **Stabilization and Verification**: `wait_for_rebalance_stabilization` (`io.kestra.plugin.core.flow.Sleep`) pauses for 15 seconds, followed by `verify_post_rebalance_health` which re-checks cluster health and logs a verified recovery audit in Kestra KV.
    10. **Error Escalation**: A flow-level `errors` handler captures unexpected HTTP timeouts or connection failures and alerts responders immediately.

    ## What you get

    - Automated, noise-free detection of genuinely stuck Redpanda partitions using cross-run differential tracking.
    - Human-in-the-loop safety gate preventing unintended cluster partition rebalancing during peak production hours.
    - Zero external agent dependencies: interacts natively with the Redpanda Admin API over HTTP.
    - Full post-incident audit trail recorded in Kestra KV with execution ID, operator sign-off rationale, and pre/post metrics.

    ## Who it's for

    - Platform Engineers and SREs responsible for mission-critical Redpanda and Apache Kafka event streaming clusters.
    - Data Infrastructure teams seeking automated self-healing runbooks for distributed partition imbalances.
    - DevOps teams migrating from ad-hoc `rpk` bash scripts to declarative, auditable orchestration.

    ## Why orchestrate this with Kestra

    Ad-hoc scripts running in cron jobs lack state persistence across runs, cannot securely pause for human sign-off,
    and create silent operational blind spots when they crash. Kestra provides native HTTP and KV persistence plugins,
    durable workflow pausing (`io.kestra.plugin.core.flow.Pause`), centralized secrets management, and transparent execution
    timelines that give engineering teams complete confidence during distributed cluster remediation.

    ## Prerequisites

    - A running Redpanda cluster (v22.x, v23.x, or v24.x) with the Admin API accessible over HTTP (default port `9644`).
    - A configured Slack Incoming Webhook URL for operational alerting.

    ### Secrets

    - `REDPANDA_GUARD_WEBHOOK_KEY`: Secret authentication key required to trigger the flow via external Webhook.

    ## Quick start

    1. Configure `admin_api_url` to point to your Redpanda Admin API host (e.g., `http://redpanda-admin.internal:9644`).
    2. Add `REDPANDA_GUARD_WEBHOOK_KEY` to your Kestra namespace secrets.
    3. Specify your Slack incoming webhook URL in `slack_webhook_uri`.
    4. Run the flow with default safe parameters (`dry_run: true`, `auto_remediate: false`) to verify cluster connectivity.
    5. Set `auto_remediate: true` and enable the `periodic_health_audit` schedule trigger to establish automated cluster self-healing.

    ## How to extend

    - **Topic-Specific SLA Filtering**: Add input filters to prioritize mission-critical topics (e.g. `payment-events`) over transient telemetry streams.
    - **PagerDuty Escalation**: Integrate `io.kestra.plugin.pagerduty.Incident` alongside Slack to page on-call SREs if `leaderless_partitions` are detected.
    - **Intra-Broker Core Balancing**: Extend remediation with `POST /v1/partitions/rebalance_cores` to optimize CPU core distribution on multi-core brokers.

    ## Links

    - [Redpanda Admin API Documentation](https://docs.redpanda.com/current/reference/api/admin-api/)
    - [Redpanda Partition Balancer Architecture](https://docs.redpanda.com/current/manage/cluster-maintenance/cluster-balancing/)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Pause Task Documentation](https://kestra.io/plugins/plugin-core/tasks/flow/io.kestra.plugin.core.flow.pause)
    - [Kestra KV Store Documentation](https://kestra.io/docs/concepts/kv-store)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Realtime & Streaming
    - Approval Gates
    - Day 2 Operations
  ee: false
  demo: false
