id: redpanda-under-replicated-partition-and-rebalance-guard
namespace: company.streaming

description: |
  Audit Redpanda topic partitions using native Kafka AdminClient plugin tasks,
  detect under-replicated or leaderless partitions, alert on-call teams via Slack,
  halt execution behind a Pause task for human operator approval, and trigger
  cluster-wide partition rebalancing via the Redpanda Admin API.

inputs:
  - id: bootstrap_servers
    type: STRING
    displayName: Redpanda Kafka Bootstrap Servers
    description: Kafka broker bootstrap address for the Redpanda cluster (default Kafka API port 9092).
    defaults: "localhost:9092"

  - id: admin_api_url
    type: STRING
    displayName: Redpanda Admin API URL
    description: Base HTTP URL of the Redpanda Admin API (default port 9644) used to trigger cluster partition rebalancing.
    defaults: "http://localhost:9644"

  - id: topic
    type: STRING
    displayName: Specific Topic (Optional)
    description: Optional specific topic to audit. If left empty, all non-internal topics on the cluster are discovered and inspected.
    defaults: ""

  - id: slack_webhook_uri
    type: URI
    displayName: Slack Webhook URI
    description: Webhook endpoint used to alert operators and deliver the execution approval link.
    defaults: https://kestra.io/api/mock

triggers:
  - id: periodic_health_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audit Redpanda partition health every 10 minutes. Shipped disabled so the flow can be verified safely first.
    cron: "*/10 * * * *"
    disabled: true

tasks:
  - id: list_topics
    type: io.kestra.plugin.kafka.TopicList
    description: Query cluster metadata via Kafka AdminClient to discover all topics hosted on the Redpanda cluster.
    properties:
      bootstrap.servers: "{{ inputs.bootstrap_servers }}"
    callTimeout: PT15S

  - id: filter_topics
    type: io.kestra.plugin.core.output.OutputValues
    description: Select the targeted topic if specified, or filter down to all non-internal application topics.
    values:
      target_topics: "{{ inputs.topic != '' ? [inputs.topic] : (outputs.list_topics.topics | jq('[.[] | select(startswith(\"_\") | not)]') | first) }}"

  - id: describe_topics
    type: io.kestra.plugin.core.flow.Loop
    description: Describe each target topic to read per-partition leader, replica assignments, and in-sync replica sets.
    values: "{{ outputs.filter_topics.values.target_topics }}"
    concurrencyLimit: 4
    tasks:
      - id: describe
        type: io.kestra.plugin.kafka.TopicDescribe
        description: Read-only AdminClient call retrieving partition layout, leaders, replicas, and ISR counts.
        topic: "{{ item.value }}"
        properties:
          bootstrap.servers: "{{ inputs.bootstrap_servers }}"
        callTimeout: PT15S
        allowFailure: true

  - id: evaluate_partition_health
    type: io.kestra.plugin.core.output.OutputValues
    description: Identify partitions where in-sync replica count is less than configured replicas, or where no leader is elected.
    values:
      degraded_partitions: >-
        {{ (outputs.describe_topics.outputs ?? []) | jq('[
          .[]
          | .outputs.describe as $d
          | select($d.partitions != null)
          | $d.partitions[]
          | select((.replicas | length) > (.isr | length) or .leader == null or .leader < 0)
          | {
              topic: $d.topic,
              partition: .partition,
              leader: .leader,
              configured_replicas: (.replicas | length),
              in_sync_replicas: (.isr | length)
            }
        ]') | first | toJson }}

  - id: check_guard_status
    type: io.kestra.plugin.core.output.OutputValues
    description: Evaluate total count of degraded partitions to determine whether operator sign-off and rebalance are needed.
    values:
      degraded_count: "{{ fromJson(outputs.evaluate_partition_health.values.degraded_partitions) | length }}"
      is_degraded: "{{ (fromJson(outputs.evaluate_partition_health.values.degraded_partitions) | length) > 0 }}"

  - id: guard_decision
    type: io.kestra.plugin.core.flow.If
    description: If under-replicated partitions exist, dispatch an alert and halt behind a Pause approval gate before rebalancing.
    condition: "{{ outputs.check_guard_status.values.is_degraded }}"
    then:
      - id: alert_slack_under_replicated
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch high-priority alert to Slack with degraded partition breakdown and execution approval link.
        url: "{{ inputs.slack_webhook_uri }}"
        messageText: |
          :warning: *Redpanda Partition Health Alert*
          Detected *{{ outputs.check_guard_status.values.degraded_count }}* under-replicated or leaderless partition(s) across `{{ inputs.bootstrap_servers }}`:
          ```
          {{ outputs.evaluate_partition_health.values.degraded_partitions }}
          ```
          *Operator Sign-Off Required:* Authorize cluster partition rebalance in Kestra:
          http://localhost:8080/ui/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}

      - id: pause_for_rebalance_approval
        type: io.kestra.plugin.core.flow.Pause
        description: Halt workflow execution until a human engineer reviews degraded partitions and approves the cluster rebalance.
        onResume:
          - id: approved
            type: BOOL
            description: Set to true to authorize partition rebalancing across cluster nodes.
            defaults: true
          - id: approval_reason
            type: STRING
            description: Operational ticket reference or justification for initiating the rebalance.
            defaults: "Approved partition rebalance to heal under-replicated partitions"

      - id: execute_rebalance_if_approved
        type: io.kestra.plugin.core.flow.If
        description: If the operator confirms approval, trigger the rebalance via the Redpanda Admin API and verify convergence.
        condition: "{{ outputs.pause_for_rebalance_approval.onResume.approved ?? false }}"
        then:
          - id: trigger_redpanda_rebalance
            type: io.kestra.plugin.core.http.Request
            description: Invoke Redpanda Admin API endpoint to trigger partition rebalancing across healthy cluster nodes.
            uri: "{{ inputs.admin_api_url }}/v1/partitions/rebalance"
            method: POST
            headers:
              Accept: application/json

          - id: wait_for_rebalance_stabilization
            type: io.kestra.plugin.core.flow.Sleep
            description: Pause 15 seconds to allow Raft replica leadership elections and partition movement to commence.
            duration: PT15S

          - id: recheck_topics
            type: io.kestra.plugin.core.flow.Loop
            description: Re-query target topics via Kafka AdminClient to verify replication recovery.
            values: "{{ outputs.filter_topics.values.target_topics }}"
            concurrencyLimit: 4
            tasks:
              - id: verify_describe
                type: io.kestra.plugin.kafka.TopicDescribe
                description: Re-check partition replica states post-rebalance.
                properties:
                  bootstrap.servers: "{{ inputs.bootstrap_servers }}"
                topic: "{{ item.value }}"
                callTimeout: PT15S
                allowFailure: true

          - id: notify_rebalance_success
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Notify Slack that partition rebalancing was authorized, triggered, and verified.
            url: "{{ inputs.slack_webhook_uri }}"
            messageText: |
              :white_check_mark: *Redpanda Partition Rebalance Triggered*
              Cluster: `{{ inputs.bootstrap_servers }}`
              Operator Justification: `{{ outputs.pause_for_rebalance_approval.onResume.approval_reason }}`
              Rebalance command dispatched to Redpanda Admin API (`{{ inputs.admin_api_url }}/v1/partitions/rebalance`) and post-rebalance topic metadata refreshed.
        else:
          - id: log_rebalance_declined
            type: io.kestra.plugin.core.log.Log
            message: "Operator declined partition rebalance for Redpanda cluster {{ inputs.bootstrap_servers }}."
    else:
      - id: log_cluster_healthy
        type: io.kestra.plugin.core.log.Log
        message: "All Redpanda topic partitions on {{ inputs.bootstrap_servers }} are fully in-sync and replicated."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatch urgent notification to Slack if the partition guard workflow encounters an unhandled error.
    url: "{{ inputs.slack_webhook_uri }}"
    messageText: |
      :rotating_light: *Redpanda Partition Guard Workflow Failed*
      Flow `{{ flow.id }}` in namespace `{{ flow.namespace }}` failed unexpectedly during execution `{{ execution.id }}`.
      Please inspect broker reachability on `{{ inputs.bootstrap_servers }}` and Admin API availability on `{{ inputs.admin_api_url }}`.

extend:
  title: Redpanda under-replicated partition and rebalance guard
  metaTitle: Redpanda under-replicated partition and rebalance guard | Kestra
  shortDescription: Audit Redpanda topic partitions via Kafka AdminClient tasks, alert on under-replicated partitions, pause for human approval, and trigger partition rebalancing.
  metaDescription: Guard Redpanda partitions with native Kafka AdminClient checks, alert on under-replicated partitions, pause for human approval, and trigger rebalancing.
  description: |
    A Redpanda cluster partition can silently lose its replication redundancy following broker restarts,
    hardware degradations, or transient network partitions. Because Redpanda provides native wire-level
    compatibility with the Apache Kafka protocol, cluster health can be audited directly using standard
    Kafka AdminClient APIs without installing proprietary CLI agents on workers.

    This blueprint transforms partition health management into a real Day-2 operational guard:
    `io.kestra.plugin.kafka.TopicList` and `io.kestra.plugin.kafka.TopicDescribe` inspect every non-internal topic
    to compare assigned replicas against in-sync replicas (ISR) and verify partition leaders. If under-replicated
    partitions are discovered, Kestra alerts the on-call team via Slack and halts execution behind an
    `io.kestra.plugin.core.flow.Pause` approval gate. Once an authorized engineer approves the remediation,
    Kestra dispatches a rebalance request to the Redpanda Admin API (`POST /v1/partitions/rebalance`), waits for
    cluster stabilization, and re-queries topic metadata to verify convergence.

    ## How it works

    1. **Topic Discovery**: `list_topics` (`io.kestra.plugin.kafka.TopicList`) queries cluster metadata via the Kafka AdminClient at `bootstrap_servers`.
    2. **Scope Filtering**: `filter_topics` (`io.kestra.plugin.core.output.OutputValues`) isolates non-internal topics (excluding `_schemas`, `__consumer_offsets`, etc.) or scopes to `inputs.topic` if explicitly provided.
    3. **Partition Metadata Inspection**: `describe_topics` (`io.kestra.plugin.core.flow.Loop` over `io.kestra.plugin.kafka.TopicDescribe`) inspects each topic's partition count, replica lists, ISR sets, and leader broker IDs.
    4. **Replication Health Evaluation**: `evaluate_partition_health` (`io.kestra.plugin.core.output.OutputValues`) uses jq to identify any partition where ISR count is less than configured replicas (`len(isr) < len(replicas)`) or where no leader is assigned (`leader == null or leader < 0`).
    5. **Guard Routing**: `guard_decision` (`io.kestra.plugin.core.flow.If`):
       - If all partitions are healthy, `log_cluster_healthy` records nominal cluster status.
       - If degraded partitions exist, `alert_slack_under_replicated` posts an incident card with degraded partition details and direct link to the Kestra execution approval UI.
    6. **Human-in-the-Loop Sign-Off**: `pause_for_rebalance_approval` (`io.kestra.plugin.core.flow.Pause`) halts execution until an authorized engineer reviews the degradation and provides approval (`approved: true`).
    7. **Remediation Execution**: When approved, `trigger_redpanda_rebalance` (`io.kestra.plugin.core.http.Request`) calls `POST /v1/partitions/rebalance` on the Redpanda Admin API to initiate replica movement across healthy brokers.
    8. **Stabilization & Post-Verification**: `wait_for_rebalance_stabilization` (`io.kestra.plugin.core.flow.Sleep`) pauses for 15 seconds, followed by `recheck_topics` which queries topic metadata via the Kafka AdminClient to confirm recovery, and `notify_rebalance_success` alerts Slack of completion.
    9. **Failure Escalation**: Flow-level `errors` capture unexpected broker timeouts or HTTP connection errors and notify on-call engineers immediately.

    ## What you get

    - Native, agentless partition auditing leveraging Redpanda's Kafka API compatibility.
    - Noise-free detection of under-replicated and leaderless partitions across all cluster topics.
    - Safety-first human approval gate (`Pause`) preventing unexpected rebalances during peak traffic.
    - Automated cluster partition rebalance invocation via Redpanda Admin API upon engineer sign-off.
    - End-to-end auditability and Slack notifications tracking every operational step and approval note.

    ## Who it's for

    - Platform Engineers and SREs maintaining production Redpanda and Kafka-compatible streaming infrastructure.
    - Data Infrastructure teams seeking automated, auditable runbooks for partition replication incidents.
    - DevOps teams replacing unmonitored cron bash scripts (`rpk cluster health`) with declarative workflows.

    ## Why orchestrate this with Kestra

    Ad-hoc scripts running on bastion hosts cannot securely halt for human approval, lack transparent execution
    timelines, and create blind spots when network partitions occur. Kestra provides native Kafka and HTTP plugins,
    durable workflow pausing (`io.kestra.plugin.core.flow.Pause`), centralized secrets management, and automated
    Slack escalation that turns incident response into an auditable self-healing workflow.

    ## Prerequisites

    - A running Redpanda cluster with Kafka API accessible at `bootstrap_servers` (port `9092`) and Admin API accessible at `admin_api_url` (port `9644`).
    - An incoming Slack webhook URI for notifications.

    ## Quick start

    1. Set `bootstrap_servers` to your Redpanda Kafka broker address (e.g., `redpanda.internal:9092`).
    2. Set `admin_api_url` to your Redpanda Admin API endpoint (e.g., `http://redpanda.internal:9644`).
    3. Supply your Slack incoming webhook URL in `slack_webhook_uri`.
    4. Run the flow manually to audit cluster partition health.
    5. If under-replicated partitions are detected, open the execution URL, review degraded partitions, and resume the flow to trigger the rebalance.
    6. Enable the `periodic_health_audit` schedule trigger to establish continuous automated partition guarding.

    ## How to extend

    - **Topic-Specific Criticality**: Add input filters or SLA thresholds to prioritize tier-1 transactional topics over bulk log topics.
    - **Intra-Broker Core Balancing**: Extend remediation with `POST /v1/partitions/rebalance_cores` to optimize CPU core distribution on multi-core brokers.
    - **PagerDuty Escalation**: Integrate `io.kestra.plugin.pagerduty.Incident` alongside Slack to page on-call SREs if leaderless partitions are detected.

    ## Links

    - [Redpanda Admin API Documentation](https://docs.redpanda.com/current/reference/api/admin-api/)
    - [Redpanda Partition Balancer Architecture](https://docs.redpanda.com/current/manage/cluster-maintenance/cluster-balancing/)
    - [Kestra Kafka Plugin Documentation](https://kestra.io/plugins/plugin-kafka)
    - [Kestra Pause Task Documentation](https://kestra.io/plugins/plugin-core/tasks/flow/io.kestra.plugin.core.flow.pause)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
