id: fluentbit-output-buffer-saturation-and-drop-sentinel
namespace: company.sentinel
description: Audits Fluent Bit log forwarder HTTP monitoring endpoints for output buffer memory saturation and dropped log records to prevent audit loss.
inputs:
  - id: fluentbit_metrics_url
    type: STRING
    defaults: http://fluentbit.internal:2020/api/v1/metrics/prometheus
  - id: max_dropped_records_threshold
    type: INT
    defaults: 10
  - id: max_retries_threshold
    type: INT
    defaults: 50
tasks:
  - id: probe_fluentbit_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - set -euo pipefail
      - |
        AUTH_HEADER=""
        if [ -n "{{ secret('FLUENTBIT_AUTH_TOKEN') }}" ]; then
          AUTH_HEADER="-H Authorization:Bearer {{ secret('FLUENTBIT_AUTH_TOKEN') }}"
        fi

        curl -sf -m 10 $AUTH_HEADER "{{ inputs.fluentbit_metrics_url }}" > /tmp/fb_metrics.txt 2>/dev/null || echo "" > /tmp/fb_metrics.txt

        python3 - <<'PY' > /tmp/fluentbit_health.json
        import os, sys, json

        metrics = {}
        try:
            with open("/tmp/fb_metrics.txt", "r") as f:
                for line in f:
                    line = line.strip()
                    if line and not line.startswith("#"):
                        parts = line.split()
                        if len(parts) >= 2:
                            try:
                                metrics[parts[0]] = float(parts[1])
                            except ValueError:
                                pass
        except Exception:
            pass

        dropped = int(metrics.get("fluentbit_output_dropped_records_total", 0))
        retries = int(metrics.get("fluentbit_output_retries_total", 0))
        proc_records = int(metrics.get("fluentbit_output_proc_records_total", 0))
        errors = int(metrics.get("fluentbit_output_errors_total", 0))

        res = {
            "dropped_records_total": dropped,
            "retries_total": retries,
            "proc_records_total": proc_records,
            "errors_total": errors
        }
        print(json.dumps(res))
        PY
    outputFiles:
      - "/tmp/fluentbit_health.json"

  - id: evaluate_buffer_and_drops
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.probe_fluentbit_metrics.outputFiles['/tmp/fluentbit_health.json'])).dropped_records_total > inputs.max_dropped_records_threshold or fromJson(read(outputs.probe_fluentbit_metrics.outputFiles['/tmp/fluentbit_health.json'])).retries_total > inputs.max_retries_threshold }}"
    then:
      - id: notify_slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          :warning: *Fluent Bit Log Forwarder Sentinel Alert*
          *Metrics URL:* `{{ inputs.fluentbit_metrics_url }}`
          *Dropped Log Records:* `{{ fromJson(read(outputs.probe_fluentbit_metrics.outputFiles['/tmp/fluentbit_health.json'])).dropped_records_total }}` (Threshold: `{{ inputs.max_dropped_records_threshold }}`)
          *Output Retries Total:* `{{ fromJson(read(outputs.probe_fluentbit_metrics.outputFiles['/tmp/fluentbit_health.json'])).retries_total }}` (Threshold: `{{ inputs.max_retries_threshold }}`)
          *Processed Records:* `{{ fromJson(read(outputs.probe_fluentbit_metrics.outputFiles['/tmp/fluentbit_health.json'])).proc_records_total }}`
          *Errors Total:* `{{ fromJson(read(outputs.probe_fluentbit_metrics.outputFiles['/tmp/fluentbit_health.json'])).errors_total }}`
          *Action Required:* Check downstream log aggregation endpoints (Elasticsearch, Loki, OpenSearch) for HTTP 429 throttling or network timeouts.

  - id: record_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "Fluent Bit audit completed for {{ inputs.fluentbit_metrics_url }}. Dropped records: {{ fromJson(read(outputs.probe_fluentbit_metrics.outputFiles['/tmp/fluentbit_health.json'])).dropped_records_total }}, Output retries: {{ fromJson(read(outputs.probe_fluentbit_metrics.outputFiles['/tmp/fluentbit_health.json'])).retries_total }}."

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      :rotating_light: *Sentinel Error: Fluent Bit Forwarder Health Monitor*
      *Execution ID:* `{{ execution.id }}`
      *State:* `{{ execution.state.current }}`
      *Details:* Failed to reach Fluent Bit Prometheus metrics endpoint at `{{ inputs.fluentbit_metrics_url }}`.

triggers:
  - id: hourly_sentinel_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: Fluent Bit Output Buffer Saturation and Record Drop Sentinel
  metaTitle: Fluent Bit Output Buffer Sentinel | Kestra
  shortDescription: Audits Fluent Bit log forwarder HTTP monitoring endpoints for buffer memory saturation and dropped log records.
  metaDescription: Audits Fluent Bit log forwarder HTTP monitoring endpoints for output buffer memory saturation and dropped log records to prevent audit loss.
  tags:
    - Infrastructure
    - Data
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
  description: |
    Automated sentinel flow that audits Fluent Bit log shipping daemons for output chunk backpressure, destination retry storms, and unrecoverable log drop cascades.

    ## How it works

    1. Scheduled trigger fires hourly (or on-demand) to execute the forwarder telemetry probe.
    2. Probes the Fluent Bit HTTP Prometheus metrics endpoint (`/api/v1/metrics/prometheus` on port 2020).
    3. Python parser extracts cumulative dropped log records, retry counts, total processed logs, and network transport errors.
    4. An `io.kestra.plugin.core.flow.If` condition checks if record drops or retry storms cross configured operational thresholds.
    5. Dispatches formatted Slack alerts containing actionable metrics if an anomaly is detected.
    6. Dedicated `errors` handler captures connection timeouts and network unreachable errors.

    ## What you get

    - Early detection of log forwarding buffers filling up before daemon memory ceilings force log record drops.
    - Visibility into downstream SIEM or log warehouse ingest throttling (e.g., Elasticsearch rate limits).
    - Automated execution audit trail recorded in Kestra execution artifacts for compliance auditing.

    ## Who it's for

    - Platform Engineers and SREs maintaining Kubernetes logging infrastructure and audit trails.
    - Security Operations Teams ensuring compliance with mandatory system log retention policies.

    ## Why orchestrate this with Kestra

    - Declarative logging infrastructure monitoring without maintaining separate scraper daemons.
    - Centralized secret management for authenticated forwarder endpoints via `{{ secret('FLUENTBIT_AUTH_TOKEN') }}`.
    - Seamless alerting and automated remediation pipeline integration in declarative YAML workflows.

    ## Prerequisites

    - Network route from the Kestra worker to the Fluent Bit HTTP port 2020.
    - Fluent Bit monitoring API enabled (`HTTP_Server On`).

    ### Secrets

    - `FLUENTBIT_AUTH_TOKEN`: Optional bearer token for secured Fluent Bit HTTP endpoints.
    - `SLACK_WEBHOOK`: Incoming webhook URL for operational alerts.

    ## Quick start

    1. Deploy this flow to your Kestra instance.
    2. Set `inputs.fluentbit_metrics_url` to match your Fluent Bit Prometheus metrics endpoint.
    3. Add the `SLACK_WEBHOOK` secret under the target namespace.
    4. Execute a manual test run to verify telemetry collection.
    5. Enable the `hourly_sentinel_schedule` trigger for continuous monitoring.

    ## How to extend

    - Add automated daemon restart or buffer flush trigger commands inside the `then` branch.
    - Forward historical record drop statistics into ClickHouse or Grafana dashboards.
    - Integrate with PagerDuty for critical audit log drop warnings.

    ## Links

    - [Fluent Bit Monitoring Documentation](https://docs.fluentbit.io/manual/administration/monitoring)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
