id: aws-dynamodb-throttling-and-gsi-backpressure-sentinel
namespace: company.database

description: |
  Monitor Amazon DynamoDB throttled requests, user errors, and Global Secondary Index (GSI)
  replication backpressure via CloudWatch metrics, persist telemetry in Kestra KV, and deliver
  actionable partition key hot spot alerts to Slack.

inputs:
  - id: aws_region
    type: STRING
    displayName: AWS Region
    description: Target AWS region where the DynamoDB table and CloudWatch metrics reside.
    defaults: us-east-1

  - id: table_name
    type: STRING
    displayName: DynamoDB Table Name
    description: Name of the primary DynamoDB table to audit for throttling and capacity saturation.
    defaults: orders-production-table

  - id: gsi_names
    type: ARRAY
    itemType: STRING
    displayName: Global Secondary Indexes (GSIs)
    description: List of Global Secondary Indexes attached to the table to evaluate for replication backpressure.
    defaults:
      - gsi_customer_orders
      - gsi_status_created_at

  - id: evaluation_period_minutes
    type: INT
    displayName: Evaluation Lookback Window (Minutes)
    description: Time range in minutes over which CloudWatch metrics are aggregated and evaluated.
    defaults: 15

  - id: max_allowed_throttle_events
    type: INT
    displayName: Maximum Allowed Throttle Events
    description: Maximum acceptable sum of table and GSI throttle events in the evaluation window before tripping alert.
    defaults: 5

  - id: max_allowed_user_errors
    type: INT
    displayName: Maximum Allowed UserErrors (4xx)
    description: Maximum acceptable HTTP 4xx UserErrors in the evaluation window before triggering an incident.
    defaults: 10

  - id: fail_on_sla_breach
    type: BOOL
    displayName: Fail Flow on SLA Breach
    description: When true, trips circuit breaker and halts workflow execution when throttling or GSI backpressure occurs.
    defaults: false

  - id: enable_synthetic_simulation_fallback
    type: BOOL
    displayName: Enable Synthetic Telemetry Simulation Fallback
    description: Fall back to representative DynamoDB telemetry when live AWS credentials or CloudWatch permissions are absent.
    defaults: true

triggers:
  - id: periodic_dynamodb_sentinel
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run automated DynamoDB throttling and GSI backpressure audit every 15 minutes.
    cron: "*/15 * * * *"
    disabled: true

  - id: on_demand_sentinel_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated HTTP endpoint invoked on demand by CI/CD load tests or CloudWatch alarms.
    key: "{{ secret('DYNAMODB_SENTINEL_WEBHOOK_KEY') }}"

tasks:
  - id: validate_inputs
    type: io.kestra.plugin.core.execution.Assert
    description: Validate lookback window, threshold parameters, and table name before metric collection.
    conditions:
      - "{{ inputs.evaluation_period_minutes >= 5 }}"
      - "{{ inputs.max_allowed_throttle_events >= 0 }}"
      - "{{ inputs.max_allowed_user_errors >= 0 }}"
      - "{{ inputs.table_name | length > 0 }}"
    errorMessage: "Invalid inputs: table_name must be non-empty, evaluation_period_minutes >= 5, and thresholds must be non-negative."

  - id: audit_dynamodb_throttling
    type: io.kestra.plugin.scripts.python.Script
    description: Query AWS CloudWatch metrics for DynamoDB table and GSIs, detect backpressure, and diagnose hot partition keys.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install -q boto3
    env:
      AWS_REGION: "{{ inputs.aws_region }}"
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
      AWS_SESSION_TOKEN: "{{ secret('AWS_SESSION_TOKEN') ?? '' }}"
      TABLE_NAME: "{{ inputs.table_name }}"
      GSI_NAMES: "{{ inputs.gsi_names | toJson }}"
      PERIOD_MINUTES: "{{ inputs.evaluation_period_minutes }}"
      MAX_THROTTLES: "{{ inputs.max_allowed_throttle_events }}"
      MAX_USER_ERRORS: "{{ inputs.max_allowed_user_errors }}"
      ENABLE_SIMULATION: "{{ inputs.enable_synthetic_simulation_fallback }}"
    script: |
      import os
      import sys
      import json
      from datetime import datetime, timezone, timedelta

      aws_region = os.environ.get("AWS_REGION", "us-east-1").strip()
      table_name = os.environ.get("TABLE_NAME", "orders-production-table").strip()
      raw_gsis = os.environ.get("GSI_NAMES", "[]").strip()

      try:
          gsi_names = json.loads(raw_gsis) if raw_gsis else []
      except Exception:
          gsi_names = [s.strip() for s in raw_gsis.strip("[]").split(",") if s.strip()]

      period_minutes = int(os.environ.get("PERIOD_MINUTES", "15"))
      max_throttles = int(os.environ.get("MAX_THROTTLES", "5"))
      max_user_errors = int(os.environ.get("MAX_USER_ERRORS", "10"))
      enable_simulation = os.environ.get("ENABLE_SIMULATION", "true").lower() in ("true", "1", "yes")

      aws_key = os.environ.get("AWS_ACCESS_KEY_ID", "").strip()
      aws_secret = os.environ.get("AWS_SECRET_ACCESS_KEY", "").strip()
      aws_session = os.environ.get("AWS_SESSION_TOKEN", "").strip()

      now_utc = datetime.now(timezone.utc)
      start_utc = now_utc - timedelta(minutes=period_minutes)
      period_seconds = max(60, period_minutes * 60)

      is_live_aws = False
      table_desc_data = {}
      cw_results = {}

      # Attempt live AWS API connection if credentials exist
      if aws_key and aws_secret and not aws_key.startswith("<"):
          try:
              import boto3
              from botocore.config import Config

              boto_cfg = Config(connect_timeout=5, read_timeout=10, retries={"max_attempts": 2})
              session_kwargs = {"region_name": aws_region}
              if aws_key and aws_secret:
                  session_kwargs["aws_access_key_id"] = aws_key
                  session_kwargs["aws_secret_access_key"] = aws_secret
              if aws_session:
                  session_kwargs["aws_session_token"] = aws_session

              cw = boto3.client("cloudwatch", config=boto_cfg, **session_kwargs)
              dynamo = boto3.client("dynamodb", config=boto_cfg, **session_kwargs)

              # Describe table topology and status
              table_desc_resp = dynamo.describe_table(TableName=table_name)
              table_desc_data = table_desc_resp.get("Table", {})

              # Construct CloudWatch Metric Queries
              queries = [
                  {
                      "Id": "tbl_throttled_requests",
                      "MetricStat": {
                          "Metric": {
                              "Namespace": "AWS/DynamoDB",
                              "MetricName": "ThrottledRequests",
                              "Dimensions": [{"Name": "TableName", "Value": table_name}]
                          },
                          "Period": period_seconds,
                          "Stat": "Sum"
                      },
                      "ReturnData": True
                  },
                  {
                      "Id": "tbl_read_throttles",
                      "MetricStat": {
                          "Metric": {
                              "Namespace": "AWS/DynamoDB",
                              "MetricName": "ReadThrottleEvents",
                              "Dimensions": [{"Name": "TableName", "Value": table_name}]
                          },
                          "Period": period_seconds,
                          "Stat": "Sum"
                      },
                      "ReturnData": True
                  },
                  {
                      "Id": "tbl_write_throttles",
                      "MetricStat": {
                          "Metric": {
                              "Namespace": "AWS/DynamoDB",
                              "MetricName": "WriteThrottleEvents",
                              "Dimensions": [{"Name": "TableName", "Value": table_name}]
                          },
                          "Period": period_seconds,
                          "Stat": "Sum"
                      },
                      "ReturnData": True
                  },
                  {
                      "Id": "tbl_user_errors",
                      "MetricStat": {
                          "Metric": {
                              "Namespace": "AWS/DynamoDB",
                              "MetricName": "UserErrors",
                              "Dimensions": [{"Name": "TableName", "Value": table_name}]
                          },
                          "Period": period_seconds,
                          "Stat": "Sum"
                      },
                      "ReturnData": True
                  },
                  {
                      "Id": "tbl_consumed_rcu",
                      "MetricStat": {
                          "Metric": {
                              "Namespace": "AWS/DynamoDB",
                              "MetricName": "ConsumedReadCapacityUnits",
                              "Dimensions": [{"Name": "TableName", "Value": table_name}]
                          },
                          "Period": period_seconds,
                          "Stat": "Sum"
                      },
                      "ReturnData": True
                  },
                  {
                      "Id": "tbl_consumed_wcu",
                      "MetricStat": {
                          "Metric": {
                              "Namespace": "AWS/DynamoDB",
                              "MetricName": "ConsumedWriteCapacityUnits",
                              "Dimensions": [{"Name": "TableName", "Value": table_name}]
                          },
                          "Period": period_seconds,
                          "Stat": "Sum"
                      },
                      "ReturnData": True
                  }
              ]

              for idx, gsi in enumerate(gsi_names):
                  pfx = f"gsi_{idx}"
                  dims = [
                      {"Name": "TableName", "Value": table_name},
                      {"Name": "GlobalSecondaryIndexName", "Value": gsi}
                  ]
                  queries.extend([
                      {
                          "Id": f"{pfx}_throttled_requests",
                          "MetricStat": {
                              "Metric": {"Namespace": "AWS/DynamoDB", "MetricName": "ThrottledRequests", "Dimensions": dims},
                              "Period": period_seconds,
                              "Stat": "Sum"
                          },
                          "ReturnData": True
                      },
                      {
                          "Id": f"{pfx}_read_throttles",
                          "MetricStat": {
                              "Metric": {"Namespace": "AWS/DynamoDB", "MetricName": "ReadThrottleEvents", "Dimensions": dims},
                              "Period": period_seconds,
                              "Stat": "Sum"
                          },
                          "ReturnData": True
                      },
                      {
                          "Id": f"{pfx}_write_throttles",
                          "MetricStat": {
                              "Metric": {"Namespace": "AWS/DynamoDB", "MetricName": "WriteThrottleEvents", "Dimensions": dims},
                              "Period": period_seconds,
                              "Stat": "Sum"
                          },
                          "ReturnData": True
                      },
                      {
                          "Id": f"{pfx}_consumed_wcu",
                          "MetricStat": {
                              "Metric": {"Namespace": "AWS/DynamoDB", "MetricName": "ConsumedWriteCapacityUnits", "Dimensions": dims},
                              "Period": period_seconds,
                              "Stat": "Sum"
                          },
                          "ReturnData": True
                      },
                      {
                          "Id": f"{pfx}_progress",
                          "MetricStat": {
                              "Metric": {"Namespace": "AWS/DynamoDB", "MetricName": "OnlineIndexPercentageProgress", "Dimensions": dims},
                              "Period": period_seconds,
                              "Stat": "Average"
                          },
                          "ReturnData": True
                      }
                  ])

              cw_resp = cw.get_metric_data(
                  MetricDataQueries=queries,
                  StartTime=start_utc,
                  EndTime=now_utc,
                  ScanBy="TimestampAscending"
              )

              for r in cw_resp.get("MetricDataResults", []):
                  metric_id = r.get("Id")
                  vals = r.get("Values", [])
                  cw_results[metric_id] = sum(vals) if vals else 0.0

              is_live_aws = True
              print(f"Successfully collected live CloudWatch telemetry for DynamoDB table '{table_name}'.")

          except Exception as exc:
              print(f"AWS API query failed or unavailable: {exc}. Falling back to simulation mode.")
              is_live_aws = False

      # Parse or simulate telemetry
      if is_live_aws:
          base_throttled_requests = int(cw_results.get("tbl_throttled_requests", 0))
          base_read_throttles = int(cw_results.get("tbl_read_throttles", 0))
          base_write_throttles = int(cw_results.get("tbl_write_throttles", 0))
          base_user_errors = int(cw_results.get("tbl_user_errors", 0))
          base_consumed_rcu = round(cw_results.get("tbl_consumed_rcu", 0) / period_seconds, 2)
          base_consumed_wcu = round(cw_results.get("tbl_consumed_wcu", 0) / period_seconds, 2)

          billing_mode = table_desc_data.get("BillingModeSummary", {}).get("BillingMode", "PROVISIONED")
          prov_info = table_desc_data.get("ProvisionedThroughput", {})
          base_provisioned_rcu = float(prov_info.get("ReadCapacityUnits", 0))
          base_provisioned_wcu = float(prov_info.get("WriteCapacityUnits", 0))
          table_status = table_desc_data.get("TableStatus", "ACTIVE")

          gsi_meta = {g.get("IndexName"): g for g in table_desc_data.get("GlobalSecondaryIndexes", [])}
          gsi_reports = []
          for idx, gsi in enumerate(gsi_names):
              pfx = f"gsi_{idx}"
              g_read = int(cw_results.get(f"{pfx}_read_throttles", 0))
              g_write = int(cw_results.get(f"{pfx}_write_throttles", 0))
              g_req = int(cw_results.get(f"{pfx}_throttled_requests", 0))
              g_c_wcu = round(cw_results.get(f"{pfx}_consumed_wcu", 0) / period_seconds, 2)
              g_prog = float(cw_results.get(f"{pfx}_progress", 100.0))

              g_meta = gsi_meta.get(gsi, {})
              g_status = g_meta.get("IndexStatus", "ACTIVE")
              g_prov = g_meta.get("ProvisionedThroughput", {})
              g_p_wcu = float(g_prov.get("WriteCapacityUnits", 0))
              g_p_rcu = float(g_prov.get("ReadCapacityUnits", 0))

              gsi_reports.append({
                  "gsi_name": gsi,
                  "status": g_status,
                  "read_throttle_events": g_read,
                  "write_throttle_events": g_write,
                  "throttled_requests": g_req,
                  "consumed_wcu": g_c_wcu,
                  "provisioned_wcu": g_p_wcu,
                  "consumed_rcu": 0.0,
                  "provisioned_rcu": g_p_rcu,
                  "online_index_percentage_progress": g_prog,
                  "is_throttled": (g_read + g_write > 0)
              })
      else:
          # Synthetic telemetry mode: simulate high-throughput workload with GSI backpressure
          print("Operating in synthetic telemetry mode: simulating high-throughput DynamoDB workload with GSI backpressure.")
          table_status = "ACTIVE"
          billing_mode = "PROVISIONED"
          base_provisioned_rcu = 300.0
          base_provisioned_wcu = 250.0
          base_consumed_rcu = 68.0
          base_consumed_wcu = 145.0
          base_read_throttles = 0
          base_write_throttles = 16
          base_throttled_requests = 16
          base_user_errors = 2

          gsi_reports = [
              {
                  "gsi_name": "gsi_customer_orders",
                  "status": "ACTIVE",
                  "read_throttle_events": 0,
                  "write_throttle_events": 0,
                  "throttled_requests": 0,
                  "consumed_rcu": 42.0,
                  "provisioned_rcu": 150.0,
                  "consumed_wcu": 58.0,
                  "provisioned_wcu": 150.0,
                  "online_index_percentage_progress": 100.0,
                  "is_throttled": False
              },
              {
                  "gsi_name": "gsi_status_created_at",
                  "status": "ACTIVE",
                  "read_throttle_events": 0,
                  "write_throttle_events": 28,
                  "throttled_requests": 28,
                  "consumed_rcu": 15.0,
                  "provisioned_rcu": 50.0,
                  "consumed_wcu": 49.8,
                  "provisioned_wcu": 50.0,
                  "online_index_percentage_progress": 100.0,
                  "is_throttled": True
              }
          ]

      # Correlate metrics and compute telemetry insights
      total_base_throttles = base_read_throttles + base_write_throttles
      total_gsi_throttles = sum(g["read_throttle_events"] + g["write_throttle_events"] for g in gsi_reports)
      total_throttles = total_base_throttles + total_gsi_throttles

      throttled_gsis = [g["gsi_name"] for g in gsi_reports if g["write_throttle_events"] > 0]
      gsi_backpressure_detected = (base_write_throttles > 0 and len(throttled_gsis) > 0)

      partition_hotspot_detected = False
      if base_write_throttles > 0 and not gsi_backpressure_detected:
          if billing_mode == "PROVISIONED" and base_consumed_wcu < (0.85 * base_provisioned_wcu):
              partition_hotspot_detected = True
          elif billing_mode == "PAY_PER_REQUEST":
              partition_hotspot_detected = True

      active_index_builds = [
          g for g in gsi_reports
          if g.get("online_index_percentage_progress", 100.0) < 100.0 or g.get("status") in ("CREATING", "UPDATING")
      ]

      sla_breached = (
          total_throttles > max_throttles
          or base_user_errors > max_user_errors
          or gsi_backpressure_detected
      )
      circuit_breaker_tripped = sla_breached

      if gsi_backpressure_detected:
          overall_status = "CRITICAL_GSI_BACKPRESSURE"
          is_alerting = True
      elif total_throttles > max_throttles:
          overall_status = "CRITICAL_THROTTLE_BREACH"
          is_alerting = True
      elif partition_hotspot_detected:
          overall_status = "WARNING_PARTITION_HOTSPOT"
          is_alerting = True
      elif base_user_errors > max_user_errors:
          overall_status = "WARNING_USER_ERRORS"
          is_alerting = True
      elif len(active_index_builds) > 0:
          overall_status = "NOTICE_ONLINE_INDEX_BUILD"
          is_alerting = False
      elif total_throttles > 0 or base_user_errors > 0:
          overall_status = "WARNING_ELEVATED_METRICS"
          is_alerting = True
      else:
          overall_status = "NOMINAL_HEALTHY"
          is_alerting = False

      recs = []
      if gsi_backpressure_detected:
          recs.append(
              f"GSI Replication Backpressure: Secondary index(es) {throttled_gsis} have exhausted Write Capacity Units (WCU), "
              f"choking writes on base table '{table_name}'. DynamoDB requires synchronous index updates; increase GSI provisioned WCU "
              f"to match base table peak write demand or transition the table to On-Demand capacity mode."
          )
      if partition_hotspot_detected:
          recs.append(
              f"Partition Key Hot Spot: Base table '{table_name}' incurred write throttles despite aggregate WCU consumption "
              f"remaining under provisioned capacity limits. Individual partition throughput exceeds the 1,000 WCU / 3,000 RCU per-partition limit. "
              f"Apply partition key salting (append '#0'..'#N' suffix) or enable DynamoDB Contributor Insights to locate offending keys."
          )
      if base_user_errors > max_user_errors:
          recs.append(
              f"HTTP 4xx UserErrors: Table '{table_name}' recorded {base_user_errors} UserErrors. Verify client SDK error handling, "
              f"TransactionCanceledExceptions, conditional update failures, and schema validation."
          )
      for b in active_index_builds:
          recs.append(
              f"Online GSI Construction: Index '{b['gsi_name']}' is {b['online_index_percentage_progress']}% complete. "
              f"Allocate additional backfill capacity to expedite index population and avoid throttling concurrent writes."
          )
      if not recs:
          recs.append(f"Table '{table_name}' and attached GSIs are operating normally within provisioned capacity ceilings.")

      summary = (
          f"DynamoDB Sentinel: {overall_status} | Table '{table_name}'. "
          f"Base Throttles: {total_base_throttles} (Read: {base_read_throttles}, Write: {base_write_throttles}). "
          f"GSI Throttles: {total_gsi_throttles}. UserErrors: {base_user_errors}. "
          f"GSI Backpressure: {'ACTIVE' if gsi_backpressure_detected else 'NONE'}. "
          f"Circuit Breaker: {'TRIPPED' if circuit_breaker_tripped else 'OK'}."
      )
      print(summary)

      table_report = {
          "table_name": table_name,
          "aws_region": aws_region,
          "table_status": table_status,
          "billing_mode": billing_mode,
          "evaluation_period_minutes": period_minutes,
          "throttled_requests": base_throttled_requests,
          "read_throttle_events": base_read_throttles,
          "write_throttle_events": base_write_throttles,
          "total_throttle_events": total_base_throttles,
          "user_errors": base_user_errors,
          "consumed_rcu": base_consumed_rcu,
          "provisioned_rcu": base_provisioned_rcu,
          "consumed_wcu": base_consumed_wcu,
          "provisioned_wcu": base_provisioned_wcu,
          "wcu_utilization_pct": round((base_consumed_wcu / max(1.0, base_provisioned_wcu)) * 100.0, 2),
          "rcu_utilization_pct": round((base_consumed_rcu / max(1.0, base_provisioned_rcu)) * 100.0, 2),
          "evaluated_at": now_utc.isoformat()
      }

      audit_manifest = {
          "overall_status": overall_status,
          "summary": summary,
          "is_alerting": is_alerting,
          "circuit_breaker_tripped": circuit_breaker_tripped,
          "table_name": table_name,
          "aws_region": aws_region,
          "telemetry_source": "LIVE_CLOUDWATCH" if is_live_aws else "SYNTHETIC_SIMULATION",
          "total_table_throttles": total_base_throttles,
          "total_gsi_throttles": total_gsi_throttles,
          "total_user_errors": base_user_errors,
          "gsi_backpressure_detected": gsi_backpressure_detected,
          "partition_hotspot_detected": partition_hotspot_detected,
          "affected_gsis": throttled_gsis,
          "active_index_builds_count": len(active_index_builds),
          "table_report": table_report,
          "gsi_reports": gsi_reports,
          "recommendations": recs,
          "evaluated_at": now_utc.isoformat()
      }

      print("::" + json.dumps({
          "outputs": {
              "overall_status": overall_status,
              "summary": summary,
              "is_alerting": is_alerting,
              "circuit_breaker_tripped": circuit_breaker_tripped,
              "telemetry_source": "LIVE_CLOUDWATCH" if is_live_aws else "SYNTHETIC_SIMULATION",
              "table_name": table_name,
              "total_table_throttles": total_base_throttles,
              "total_gsi_throttles": total_gsi_throttles,
              "total_user_errors": base_user_errors,
              "gsi_backpressure_detected": gsi_backpressure_detected,
              "partition_hotspot_detected": partition_hotspot_detected,
              "affected_gsis": throttled_gsis,
              "table_report": table_report,
              "gsi_reports": gsi_reports,
              "recommendations": recs,
              "audit_manifest": audit_manifest
          }
      }) + "::")

  - id: persist_table_metrics_to_kv
    type: io.kestra.plugin.core.kv.Set
    description: Record table throttle and capacity utilization telemetry into Kestra namespace KV store.
    key: "dynamodb_metrics_{{ inputs.table_name }}"
    value: "{{ outputs.audit_dynamodb_throttling.vars.table_report | toJson }}"
    kvType: JSON

  - id: persist_sentinel_summary_to_kv
    type: io.kestra.plugin.core.kv.Set
    description: Record aggregate audit manifest and GSI backpressure diagnostic state into Kestra namespace KV store.
    key: dynamodb_sentinel_summary
    value: "{{ outputs.audit_dynamodb_throttling.vars.audit_manifest | toJson }}"
    kvType: JSON

  - id: evaluate_alert_and_circuit_breaker
    type: io.kestra.plugin.core.flow.If
    description: Deliver operational Slack notification and evaluate circuit breaker enforcement upon SLA breach.
    condition: "{{ outputs.audit_dynamodb_throttling.vars.is_alerting == true }}"
    then:
      - id: notify_slack_dynamodb_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Deliver actionable DynamoDB throttling and GSI backpressure diagnostic alert to database operations team.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "attachments": [
              {
                "color": "{{ outputs.audit_dynamodb_throttling.vars.gsi_backpressure_detected == true ? 'danger' : (outputs.audit_dynamodb_throttling.vars.circuit_breaker_tripped == true ? 'danger' : 'warning') }}",
                "title": ":warning: Amazon DynamoDB Sentinel: {{ outputs.audit_dynamodb_throttling.vars.overall_status }}",
                "text": "*{{ outputs.audit_dynamodb_throttling.vars.summary }}*\n\n*Table:* `{{ inputs.table_name }}` | *Region:* `{{ inputs.aws_region }}`\n*Telemetry Source:* `{{ outputs.audit_dynamodb_throttling.vars.telemetry_source }}`\n*Base Table Throttles:* {{ outputs.audit_dynamodb_throttling.vars.total_table_throttles }} (threshold: {{ inputs.max_allowed_throttle_events }})\n*GSI Throttles:* {{ outputs.audit_dynamodb_throttling.vars.total_gsi_throttles }}\n*UserErrors (4xx):* {{ outputs.audit_dynamodb_throttling.vars.total_user_errors }} (threshold: {{ inputs.max_allowed_user_errors }})\n*GSI Backpressure Active:* `{{ outputs.audit_dynamodb_throttling.vars.gsi_backpressure_detected }}`\n*Affected GSIs:* `{{ outputs.audit_dynamodb_throttling.vars.affected_gsis | join(', ') }}`\n*Partition Key Hot Spot:* `{{ outputs.audit_dynamodb_throttling.vars.partition_hotspot_detected }}`\n*Execution:* `{{ execution.id }}`\n\n*Remediation Recommendations:*\n{{ outputs.audit_dynamodb_throttling.vars.recommendations | join('\n• ') }}"
              }
            ]
          }

      - id: check_circuit_breaker_gate
        type: io.kestra.plugin.core.flow.If
        description: Halt workflow execution if fail_on_sla_breach is enabled and circuit breaker is tripped.
        condition: "{{ inputs.fail_on_sla_breach == true and outputs.audit_dynamodb_throttling.vars.circuit_breaker_tripped == true }}"
        then:
          - id: trip_circuit_breaker
            type: io.kestra.plugin.core.execution.Fail
            description: Halt workflow execution to prevent cascade failures when DynamoDB capacity is starving.
            errorMessage: "CRITICAL: Amazon DynamoDB Sentinel SLA breached. Table throttling or GSI backpressure exceeded tolerance thresholds."

  - id: log_sentinel_summary
    type: io.kestra.plugin.core.log.Log
    description: Record operational summary in execution log.
    message: "DynamoDB Sentinel completed for table {{ inputs.table_name }}. Status: {{ outputs.audit_dynamodb_throttling.vars.overall_status }}. Throttles: {{ outputs.audit_dynamodb_throttling.vars.total_table_throttles + outputs.audit_dynamodb_throttling.vars.total_gsi_throttles }}. UserErrors: {{ outputs.audit_dynamodb_throttling.vars.total_user_errors }}."

errors:
  - id: alert_on_sentinel_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Deliver failure notification if the DynamoDB sentinel execution terminates with an unexpected error.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "attachments": [
          {
            "color": "danger",
            "title": ":rotating_light: Amazon DynamoDB Sentinel Execution Failed",
            "text": "DynamoDB sentinel flow failed during execution `{{ execution.id }}`.\nInspect CloudWatch API access, IAM permissions (`cloudwatch:GetMetricData`, `dynamodb:DescribeTable`), or worker network configuration."
          }
        ]
      }

extend:
  title: Amazon DynamoDB Throttling and GSI Backpressure Sentinel
  metaTitle: Amazon DynamoDB Throttling and GSI Backpressure Sentinel | Kestra
  shortDescription: Audit Amazon DynamoDB throttling, UserErrors, and GSI replication backpressure with CloudWatch metrics, store telemetry in Kestra KV, and send partition key hot spot alerts to Slack.
  metaDescription: Audit Amazon DynamoDB throttling and GSI replication lag via CloudWatch metrics, record KV state, and alert Slack with hot spot guidance in Kestra.
  description: |
    Amazon DynamoDB partitions NoSQL data across physical storage nodes based on the
    hash value of the partition key. Each storage partition provides a strict throughput
    ceiling of 1,000 Write Capacity Units (WCU) and 3,000 Read Capacity Units (RCU).
    When an application creates uneven traffic distribution across partition keys or
    spikes above allocated capacity, DynamoDB rejects requests with HTTP 400
    `ProvisionedThroughputExceededException` errors.

    A subtle, severe operational failure pattern occurs with Global Secondary Indexes
    (GSIs). In DynamoDB, writes to the base table replicate synchronously or
    semi-synchronously to all projected GSIs. If a secondary index has insufficient
    write capacity (e.g. lower provisioned WCU or a hot GSI partition key), DynamoDB
    throttles writes on the *base table* to prevent index replication queues from
    falling behind indefinitely. This is known as **GSI replication backpressure**.
    Base table writes fail even when the base table has hundreds of unused WCUs.

    This blueprint provides an automated sentinel that queries Amazon CloudWatch metrics
    across primary tables and secondary indexes. It isolates partition key hot spots from
    GSI backpressure, monitors online index build completion, records metric state in
    Kestra's KV store, and dispatches actionable Slack alerts with concrete remediation
    guidance.

    ## How it works

    1. **Input Assertion**: Validates operational inputs, ensuring minimum 5-minute lookback windows, valid SLA thresholds, and non-empty table identifiers.
    2. **CloudWatch Metrics Query**: Collects `ThrottledRequests`, `ReadThrottleEvents`, `WriteThrottleEvents`, `UserErrors`, and consumed capacity units for both the base table and all registered GSIs using batched queries.
    3. **Table & Index Topology Inspection**: Calls DynamoDB `DescribeTable` to determine billing mode (`PROVISIONED` vs `PAY_PER_REQUEST`), current table status, and provisioned throughput ceilings.
    4. **GSI Backpressure Correlation**: Analyzes base table write throttles against secondary index write throttles. When both base table and GSI write throttles spike simultaneously while base capacity is underutilized, it flags active GSI backpressure.
    5. **Partition Key Hot Spot Detection**: Identifies when base table write throttling occurs despite total consumed WCU staying below 85% of provisioned capacity, isolating single-partition key saturation from global capacity starvation.
    6. **Online Index Build Tracking**: Inspects `OnlineIndexPercentageProgress` and index status for active GSI creations to notify operators of indexing backfill progress and prevent premature capacity alerts.
    7. **Kestra KV Store Persistence**: Stores structured table telemetry under key `dynamodb_metrics_{table_name}` and records an aggregate audit manifest under `dynamodb_sentinel_summary` for downstream orchestration tasks.
    8. **Actionable Slack Diagnostics**: Sends detailed Slack notifications with color-coded severity, metric breakdowns, affected index names, and specific partitioning advice.
    9. **SLA Circuit Breaker Enforcement**: When `fail_on_sla_breach` is enabled, halts execution via `io.kestra.plugin.core.execution.Fail` if throttling or backpressure breaches operational SLAs.

    ## What you get

    - Real-time detection of GSI replication backpressure choking primary table writes.
    - Automated differentiation between global capacity depletion and single-partition key hot spots.
    - Continuous tracking of online index build progress (`OnlineIndexPercentageProgress`).
    - Namespace KV state persistence enabling downstream data pipelines to throttle ingestion when databases are saturated.
    - Actionable remediation playbooks directly in Slack messages, including partition key salting guidance and Contributor Insights recommendations.

    ## Who it's for

    - Site Reliability Engineers (SREs) and Database Administrators (DBAs) managing production DynamoDB tables.
    - Cloud Infrastructure and Platform Engineers tuning NoSQL auto-scaling policies and cost allocation.
    - Backend and Data Platform Engineers debugging mysterious write latency spikes and `ProvisionedThroughputExceededException` errors.

    ## Why orchestrate this with Kestra

    DynamoDB CloudWatch alarms can notify an SNS topic, but standard metric alarms cannot correlate multi-dimensional metrics across a base table and multiple secondary indexes simultaneously. Kestra enables multi-query metric aggregation, cross-index mathematical correlation, and stateful tracking via built-in Key-Value storage. Furthermore, Kestra can act as an automated circuit breaker: if DynamoDB reports severe backpressure, Kestra can pause upstream Kafka consumers, halt batch ETL ingestion workflows, and scale table provisioned capacity automatically.

    ## Prerequisites

    - An AWS account with an active DynamoDB table and optional Global Secondary Indexes.
    - IAM credentials with `cloudwatch:GetMetricData` and `dynamodb:DescribeTable` permissions.
    - A Slack Incoming Webhook URL to receive operational alerts.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS IAM access key ID with CloudWatch and DynamoDB read permissions.
    - `AWS_SECRET_ACCESS_KEY`: AWS IAM secret access key.
    - `AWS_SESSION_TOKEN`: (Optional) Temporary session token if using STS assumed roles.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alerting.
    - `DYNAMODB_SENTINEL_WEBHOOK_KEY`: Secret authentication key for the on-demand webhook trigger.

    ## Quick start

    1. Configure `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Deploy this flow and set `table_name` to your target DynamoDB table and `gsi_names` to your secondary indexes.
    3. Run an initial test execution to verify CloudWatch metric collection and KV store recording.
    4. Enable the `periodic_dynamodb_sentinel` schedule trigger to run automated health audits every 15 minutes.

    ## How to extend

    - **Automated Capacity Auto-Tuning**: Add an AWS CLI task or Lambda invocation to dynamically increase GSI provisioned WCU or toggle `PAY_PER_REQUEST` on-demand billing mode when backpressure is detected.
    - **Upstream Pipeline Backpressure Throttling**: Use `io.kestra.plugin.core.kv.Get` in upstream data ingestion workflows to read `dynamodb_sentinel_summary` and pause batch imports while the database is throttled.
    - **PagerDuty Incident Escalation**: Integrate `io.kestra.plugin.notifications.pagerduty.PagerDutyAlert` to trigger high-severity on-call pages when the circuit breaker trips.

    ## Links

    - [Amazon DynamoDB Best Practices for Secondary Indexes](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GSI.html)
    - [DynamoDB Metrics and Dimensions Reference](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/metrics-dimensions.html)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Key-Value Store](https://kestra.io/docs/concepts/kv-store)
    - [Kestra Slack Notifications Plugin](https://kestra.io/plugins/plugin-slack)
