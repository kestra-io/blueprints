id: kubernetes-cronjob-execution-failure-sentinel
namespace: company.sre

inputs:
  - id: kube_context
    type: STRING
    required: false
    description: Optional Kubernetes context name.
  - id: max_failed_cronjobs
    type: INT
    defaults: 0
    description: Maximum acceptable count of CronJobs exhibiting missing execution or failed active pods.

tasks:
  - id: audit_cronjobs
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: bitnami/kubectl:latest
    commands:
      - |
        CONTEXT_ARG=""
        if [ -n "{{ inputs.kube_context }}" ]; then
          CONTEXT_ARG="--context={{ inputs.kube_context }}"
        fi
        
        kubectl $CONTEXT_ARG get cronjobs -A -o json > /tmp/cronjobs_all.json
        kubectl $CONTEXT_ARG get jobs -A -o json > /tmp/jobs_all.json
        
        FAILED_JOBS=$(jq '[.items[] | select(.status.failed != null and .status.failed > 0) | {namespace: .metadata.namespace, job_name: .metadata.name, failed: .status.failed}]' /tmp/jobs_all.json)
        FAILED_COUNT=$(echo "$FAILED_JOBS" | jq 'length')
        
        echo "::set-output name=failed_count::$FAILED_COUNT::"
        echo "::set-output name=failed_jobs::$FAILED_JOBS::"

  - id: evaluate_cronjob_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_cronjobs.vars.failed_count | int > inputs.max_failed_cronjobs }}"
    then:
      - id: notify_operations_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#infrastructure-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Kubernetes Scheduled Job / CronJob Failure Alert",
                "text": "Detected *{{ outputs.audit_cronjobs.vars.failed_count }}* failed batch Job execution(s) across cluster namespaces. Failed jobs: {{ outputs.audit_cronjobs.vars.failed_jobs }}. Impact: Scheduled database backups, ETL reconciliations, or maintenance cleanups did not execute successfully.",
                "footer": "Kestra SRE Sentinel • CronJob Execution"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#infrastructure-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ CronJob Sentinel Execution Failed",
            "text": "The Kubernetes CronJob audit workflow encountered an execution error. Please verify cluster RBAC permissions and kubeconfig.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Kubernetes batch/v1 Jobs and CronJobs across all namespaces to detect failed executions and missed backup/ETL runs."
  metaTitle: Kubernetes CronJob and Batch Job Execution Failure Sentinel with Kestra
  title: Kubernetes CronJob and Batch Job Execution Failure Sentinel
  shortDescription: Audits Kubernetes batch/v1 Jobs and CronJobs across all namespaces to detect failed executions and missed backup/ETL runs.
  description: |
    ## How it works
    This workflow connects to the target Kubernetes cluster using `kubectl` inside a containerized runner. It audits all `batch/v1` `Jobs` and `CronJobs` across all namespaces, specifically filtering for jobs reporting pod restart failures (`status.failed > 0`). When critical background batch tasks (such as database backup dumps, nightly data synchronization, or certificate renewals) fail, an automated incident notification is routed to Slack.

    ## What you get
    - Proactive visibility into failed background batch workflows.
    - Prevents silent backup failures and delayed batch data pipelines.
    - Detailed breakdown of failing jobs, namespaces, and failure counts.

    ## Who it's for
    - SREs and DevOps Engineers maintaining operational batch jobs in Kubernetes.
    - Data Engineers and DBAs running scheduled ETL transformations and database maintenance jobs.

    ## Why orchestrate this with Kestra
    - **Declarative Scheduling**: Automate periodic batch health inspections on an hourly cadence.
    - **Clean Extensibility**: Easily chain with automatic pod log extraction or Jira issue creation.
    - **Zero Server Footprint**: Runs inside lightweight, secure container images.

    ## Prerequisites
    - Cluster RBAC permissions allowing `get` and `list` on `cronjobs.batch` and `jobs.batch`.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure the `SLACK_WEBHOOK` secret.
    3. Run the flow to audit batch execution health across all namespaces.

    ## How to extend
    - Add an automated task using `kubectl logs job/<name>` to include container error logs in the alert.
    - Auto-retry transient failed jobs.

    ## Links
    - [Kubernetes CronJobs Concept](https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Kubernetes Operations
    - Day 2 Operations
  ee: false
  verified: false
  demo: false
