id: victoriametrics-churn-rate-and-active-timeseries-sentinel
namespace: company.sentinel
description: Audits VictoriaMetrics time-series database metrics endpoints for high time-series churn rate and RAM saturation to prevent OOM crashes.
inputs:
  - id: victoriametrics_url
    type: STRING
    defaults: http://victoriametrics.internal:8428
  - id: max_active_series_threshold
    type: INT
    defaults: 5000000
  - id: max_memory_percent_threshold
    type: INT
    defaults: 85
tasks:
  - id: probe_victoriametrics_stats
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - set -euo pipefail
      - |
        AUTH_HEADER=""
        if [ -n "{{ secret('VM_AUTH_TOKEN') }}" ]; then
          AUTH_HEADER="-H Authorization:Bearer {{ secret('VM_AUTH_TOKEN') }}"
        fi

        curl -sf -m 10 $AUTH_HEADER "{{ inputs.victoriametrics_url }}/metrics" > /tmp/vm_metrics.txt 2>/dev/null || echo "" > /tmp/vm_metrics.txt

        python3 - <<'PY' > /tmp/vm_health.json
        import os, sys, json

        metrics = {}
        try:
            with open("/tmp/vm_metrics.txt", "r") as f:
                for line in f:
                    line = line.strip()
                    if line and not line.startswith("#"):
                        parts = line.split()
                        if len(parts) >= 2:
                            try:
                                metrics[parts[0]] = float(parts[1])
                            except ValueError:
                                pass
        except Exception:
            pass

        active_series = int(metrics.get("vm_active_timeseries", 0))
        rss_bytes = int(metrics.get("vm_process_memory_resident_bytes", 0))
        allowed_bytes = int(metrics.get("vm_allowed_memory_bytes", 0))
        mem_pct = round((rss_bytes / allowed_bytes) * 100, 2) if allowed_bytes > 0 else 0.0
        slow_queries = int(metrics.get("vm_slow_queries_total", 0))

        res = {
            "active_timeseries": active_series,
            "memory_resident_bytes": rss_bytes,
            "allowed_memory_bytes": allowed_bytes,
            "memory_usage_pct": mem_pct,
            "slow_queries_total": slow_queries
        }
        print(json.dumps(res))
        PY
    outputFiles:
      - "/tmp/vm_health.json"

  - id: evaluate_series_and_memory
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.probe_victoriametrics_stats.outputFiles['/tmp/vm_health.json'])).active_timeseries > inputs.max_active_series_threshold or fromJson(read(outputs.probe_victoriametrics_stats.outputFiles['/tmp/vm_health.json'])).memory_usage_pct > inputs.max_memory_percent_threshold }}"
    then:
      - id: notify_slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          :warning: *VictoriaMetrics Time Series Saturation Alert*
          *Instance:* `{{ inputs.victoriametrics_url }}`
          *Active Time Series:* `{{ fromJson(read(outputs.probe_victoriametrics_stats.outputFiles['/tmp/vm_health.json'])).active_timeseries }}` (Threshold: `{{ inputs.max_active_series_threshold }}`)
          *Memory Usage:* `{{ fromJson(read(outputs.probe_victoriametrics_stats.outputFiles['/tmp/vm_health.json'])).memory_usage_pct }}%` (Threshold: `{{ inputs.max_memory_percent_threshold }}%`)
          *Slow Queries Total:* `{{ fromJson(read(outputs.probe_victoriametrics_stats.outputFiles['/tmp/vm_health.json'])).slow_queries_total }}`
          *Action Required:* Audit ephemeral high-cardinality labels emitted by Kubernetes pods or Prometheus scrape targets to prevent TSDB memory exhaustion.

  - id: record_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "VictoriaMetrics audit completed for {{ inputs.victoriametrics_url }}. Active series: {{ fromJson(read(outputs.probe_victoriametrics_stats.outputFiles['/tmp/vm_health.json'])).active_timeseries }}, Memory: {{ fromJson(read(outputs.probe_victoriametrics_stats.outputFiles['/tmp/vm_health.json'])).memory_usage_pct }}%."

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      :rotating_light: *Sentinel Error: VictoriaMetrics Health Monitor*
      *Execution ID:* `{{ execution.id }}`
      *State:* `{{ execution.state.current }}`
      *Details:* Failed to reach VictoriaMetrics metrics endpoint at `{{ inputs.victoriametrics_url }}`.

triggers:
  - id: hourly_sentinel_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: VictoriaMetrics Churn Rate and Active Time Series Sentinel
  metaTitle: VictoriaMetrics Churn Rate Sentinel | Kestra
  shortDescription: Audits VictoriaMetrics time-series database metrics endpoints for active time-series cardinality and RAM saturation.
  metaDescription: Audits VictoriaMetrics time-series database metrics endpoints for high time-series churn rate and RAM saturation to prevent OOM crashes.
  tags:
    - Infrastructure
    - Data
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
  description: |
    Automated sentinel flow that audits VictoriaMetrics TSDB instances for high-cardinality label churn, active series accumulation, and process memory saturation.

    ## How it works

    1. Scheduled trigger fires hourly (or on-demand) to execute the VictoriaMetrics telemetry probe.
    2. Probes the VictoriaMetrics HTTP `/metrics` endpoint to collect active time series counts and memory consumption.
    3. Python parser extracts resident memory versus allowed allocation and active series cardinality.
    4. An `io.kestra.plugin.core.flow.If` condition checks if active time series or process RAM utilization exceed user thresholds.
    5. Dispatches formatted Slack alerts containing actionable metrics if an anomaly is detected.
    6. Dedicated `errors` handler captures connection timeouts and network unreachable errors.

    ## What you get

    - Early detection of cardinality explosions caused by dynamic user IDs or container UUIDs leaking into metric labels.
    - Proactive RAM exhaustion warnings before Linux OOM killers terminate the TSDB process.
    - Automated audit trail recorded in Kestra execution artifacts for observability platform compliance.

    ## Who it's for

    - Platform Engineers and Observability Teams managing enterprise Prometheus and VictoriaMetrics monitoring stacks.
    - SREs responsible for metrics ingestion throughput and query response latency SLAs.

    ## Why orchestrate this with Kestra

    - Declarative TSDB capacity monitoring without deploying third-party agent scrapers.
    - Centralized secret management for authenticated monitoring endpoints via `{{ secret('VM_AUTH_TOKEN') }}`.
    - Unified alerting and automated remediation pipeline integration in declarative YAML workflows.

    ## Prerequisites

    - Network route from the Kestra worker to the VictoriaMetrics HTTP port 8428.
    - Metrics endpoint accessible on `/metrics`.

    ### Secrets

    - `VM_AUTH_TOKEN`: Optional bearer token for secured VictoriaMetrics instances.
    - `SLACK_WEBHOOK`: Incoming webhook URL for operational alerts.

    ## Quick start

    1. Deploy this flow to your Kestra instance.
    2. Set `inputs.victoriametrics_url` to point to your VictoriaMetrics instance.
    3. Add the `SLACK_WEBHOOK` secret under the target namespace.
    4. Execute a manual test run to verify telemetry collection.
    5. Enable the `hourly_sentinel_schedule` trigger for continuous monitoring.

    ## How to extend

    - Add automated drop-series or relabeling trigger commands inside the `then` branch.
    - Forward historical cardinality statistics into ClickHouse or Grafana dashboards.
    - Integrate with PagerDuty for critical out-of-memory warnings.

    ## Links

    - [VictoriaMetrics Monitoring Documentation](https://docs.victoriametrics.com/monitoring/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
