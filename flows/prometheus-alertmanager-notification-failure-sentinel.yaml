id: prometheus-alertmanager-notification-failure-sentinel
namespace: company.observability

inputs:
  - id: alertmanager_metrics_url
    type: STRING
    defaults: "http://alertmanager.observability:9093/metrics"
    description: Prometheus scrape endpoint for Alertmanager metrics.
  - id: failure_threshold
    type: INT
    defaults: 0
    description: "Maximum allowable notification delivery failures (default 0)."

tasks:
  - id: query_alertmanager_failures
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Alertmanager Prometheus metrics to calculate notification failures across integrations.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      ALERTMANAGER_URL: "{{ inputs.alertmanager_metrics_url }}"
      FAILURE_THRESHOLD: "{{ inputs.failure_threshold }}"
    script: |
      import os
      import sys
      import re
      import requests
      from kestra import Kestra

      metrics_url = os.environ.get("ALERTMANAGER_URL")
      failure_threshold = int(os.environ.get("FAILURE_THRESHOLD", "0"))

      try:
          resp = requests.get(metrics_url, timeout=15)
          resp.raise_for_status()
      except Exception as err:
          print(f"Error: Failed to fetch Alertmanager metrics from {metrics_url}: {err}", file=sys.stderr)
          sys.exit(1)

      failed_total = 0
      for line in resp.text.splitlines():
          line = line.strip()
          if line.startswith("alertmanager_notifications_failed_total"):
              parts = line.split()
              if len(parts) >= 2:
                  try:
                      failed_total += int(float(parts[-1]))
                  except ValueError:
                      pass

      is_alerting = bool(failed_total > failure_threshold)
      print(f"Alertmanager audit: failed_notifications={failed_total}, threshold={failure_threshold}, alerting={is_alerting}")

      Kestra.outputs({
          "failed_notifications": failed_total,
          "is_alerting": is_alerting
      })

  - id: evaluate_failures
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_alertmanager_failures.vars.is_alerting }}"
    then:
      - id: notify_oncall_lead
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#observability-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Alertmanager Notification Delivery Failure Alert",
                "text": "Alertmanager at `{{ inputs.alertmanager_metrics_url }}` has recorded *{{ outputs.query_alertmanager_failures.vars.failed_notifications }} failed notification attempts*! PagerDuty, Opsgenie, Webhook, or email dispatchers are failing.",
                "footer": "Kestra Observability Sentinel • Alertmanager"
              }
            ]
          }

outputs:
  - id: failed_notifications
    type: INT
    value: "{{ outputs.query_alertmanager_failures.vars.failed_notifications }}"
  - id: is_alerting
    type: BOOLEAN
    value: "{{ outputs.query_alertmanager_failures.vars.is_alerting }}"

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#observability-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Alertmanager Sentinel Failure",
            "text": "Failed to scrape Alertmanager metrics endpoint. Verify Alertmanager service availability.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Alertmanager for failed notification deliveries and receiver integration dropouts to prevent silent alert suppression."
  metaTitle: Prometheus Alertmanager Notification Failure and Drop Sentinel with Kestra
  title: Prometheus Alertmanager Notification Failure and Drop Sentinel
  shortDescription: Audits Alertmanager for failed notification deliveries and receiver integration dropouts to prevent silent alert suppression.
  description: |
    ## How it works
    This workflow inspects the metrics endpoint of Prometheus Alertmanager (`/metrics`) to audit the cumulative `alertmanager_notifications_failed_total` counter across all configured receivers (PagerDuty, Webhooks, Slack, Email). When incident escalation backends reject payloads due to invalid authentication tokens, expired SSL certificates, or rate limits, alerts are silently lost while incidents continue unabated. This workflow detects failed dispatch attempts and alerts on-call teams immediately.

    ## What you get
    - Continuous validation of incident dispatch pipelines.
    - Prevents silent failure of critical on-call paging mechanisms.
    - Instant visibility when notification webhooks fail.

    ## Who it's for
    - SRE and Incident Response Managers overseeing on-call escalation policies.
    - Cloud Infrastructure Engineers maintaining monitoring and alerting platforms.

    ## Why orchestrate this with Kestra
    - **Independent Heartbeat**: Monitors the alerting layer through an independent communication channel.
    - **Reliable Fallback**: Uses a direct Slack webhook to notify teams when primary dispatchers fail.
    - **Automated Verification**: Runs on a continuous cadence with zero human oversight required.

    ## Prerequisites
    - Prometheus Alertmanager running with `/metrics` accessible.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint into your Kestra instance.
    2. Set the Alertmanager metrics URL.
    3. Run the workflow to inspect dispatch failure counters.

    ## How to extend
    - Parse specific failing receivers (e.g. `integration="pagerduty"` vs `integration="slack"`).
    - Trigger an automatic secret reload in Alertmanager when webhook tokens expire.

    ## Links
    - [Prometheus Alertmanager Documentation](https://prometheus.io/docs/alerting/latest/alertmanager/)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
