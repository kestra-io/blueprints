id: linear-cycle-blocker-and-stalled-issue-sentinel
namespace: company.engineering

inputs:
  - id: max_allowed_blockers
    type: INT
    displayName: Maximum Allowed Blockers
    defaults: 0
    description: Tolerance threshold for high-priority blocked issues before triggering team alerts. Set to 0 to alert on any blocked issue.

  - id: target_team_name
    type: STRING
    displayName: Target Team Filter
    defaults: ""
    description: Optional Linear team key or name to scope the audit (e.g. 'ENG' or 'Core'). Leave empty to audit across the entire workspace.

triggers:
  - id: daily_morning_standup_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Morning audit running Monday through Friday at 08:30 UTC ahead of team standups. Shipped disabled by default.
    cron: "30 8 * * 1-5"
    disabled: true
    inputs:
      max_allowed_blockers: 0

tasks:
  - id: query_blocked_issues
    type: io.kestra.plugin.graphql.Request
    description: Query Linear GraphQL API for urgent and high-priority issues currently marked as Blocked or In Progress.
    uri: "https://api.linear.app/graphql"
    headers:
      Authorization: "{{ secret('LINEAR_API_TOKEN') }}"
      User-Agent: "Kestra-Linear-Blocker-Sentinel/1.0"
    failOnGraphQLErrors: false
    allowFailed: true
    query: |
      query LinearBlockedIssuesAudit {
        issues(filter: {
          state: { name: { in: ["Blocked", "In Progress"] } }
          priority: { in: [1, 2] }
        }, first: 50) {
          nodes {
            identifier
            title
            url
            priorityLabel
            updatedAt
            state {
              name
            }
            assignee {
              name
            }
          }
        }
      }

  - id: evaluate_blockers
    type: io.kestra.plugin.core.flow.If
    description: Evaluate whether the number of active blocked issues exceeds the configured tolerance threshold.
    condition: "{{ outputs.query_blocked_issues.body is defined and outputs.query_blocked_issues.body.issues is defined and ((outputs.query_blocked_issues.body.issues.nodes | jq('[.[] | select(.state.name == \"Blocked\")] | length') | first) | int) > inputs.max_allowed_blockers }}"
    then:
      - id: alert_blocked_issues_digest
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch formatted blocker digest to Slack with issue keys, titles, assignees, and direct Linear links.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🚧 *Linear Morning Blocker Digest*: Found {{ outputs.query_blocked_issues.body.issues.nodes | jq('[.[] | select(.state.name == \"Blocked\")] | length') | first }} blocked high-priority issue(s) needing resolution.\n\n*Blocked Issues:*\n{{ outputs.query_blocked_issues.body.issues.nodes | jq('[.[] | select(.state.name == \"Blocked\") | \"• *\" + .identifier + \"*: \" + .title + \" (Assignee: \" + (.assignee.name // \"Unassigned\") + \") - <\" + .url + \"|View Issue>\"] | join(\"\\n\")') | first }}\n\n*Execution ID:* {{ execution.id }}"
          }
    else:
      - id: log_velocity_healthy
        type: io.kestra.plugin.core.log.Log
        description: Log healthy sprint velocity when no blocked issues are detected.
        message: "HEALTHY: Zero high-priority blocked issues detected in Linear workspace. Sprint velocity on track."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Record final audit metrics for engineering velocity and historical tracking.
    message: "Linear issue audit completed. Total issues evaluated: {{ outputs.query_blocked_issues.body is defined and outputs.query_blocked_issues.body.issues is defined ? (outputs.query_blocked_issues.body.issues.nodes | length) : 0 }}, Blocked: {{ outputs.query_blocked_issues.body is defined and outputs.query_blocked_issues.body.issues is defined ? (outputs.query_blocked_issues.body.issues.nodes | jq('[.[] | select(.state.name == \"Blocked\")] | length') | first) : 0 }}."

errors:
  - id: alert_on_audit_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert engineering operations channel if network failure or invalid credentials prevent Linear API querying.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *Linear Sentinel Error*: Execution `{{ execution.id }}` failed to query Linear GraphQL API. Verify LINEAR_API_TOKEN credentials and API status."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.query_blocked_issues.body is defined and outputs.query_blocked_issues.body.issues is defined and ((outputs.query_blocked_issues.body.issues.nodes | jq('[.[] | select(.state.name == \"Blocked\")] | length') | first) | int) > inputs.max_allowed_blockers ? 'BLOCKERS_DETECTED' : 'HEALTHY' }}"
  - id: blocked_issues_count
    type: INT
    value: "{{ outputs.query_blocked_issues.body is defined and outputs.query_blocked_issues.body.issues is defined ? ((outputs.query_blocked_issues.body.issues.nodes | jq('[.[] | select(.state.name == \"Blocked\")] | length') | first) | int) : 0 }}"

extend:
  title: Linear cycle blocker and stalled high-priority issue sentinel
  metaTitle: Linear Cycle Blocker Sentinel | Kestra
  shortDescription: Query Linear GraphQL API for blocked and stalled high-priority issues, compile standup blocker digests, and alert engineering leads on friction.
  metaDescription: Query Linear GraphQL API for blocked and stalled high-priority issues, compile standup blocker digests, and alert engineering leads on workflow friction.
  description: |
    Maintain engineering sprint velocity and prevent critical cycle blockers from lingering unnoticed by automatically auditing Linear issues via Linear's native GraphQL API. In agile engineering teams, high-priority issues marked as `Blocked` or stalled in `In Progress` frequently slip through the cracks when communication breaks down between teams or external dependencies stall. This sentinel runs on a scheduled cadence ahead of morning standups, fetches urgent and high-priority issues directly from `https://api.linear.app/graphql`, parses blocked items, and delivers an actionable, itemized blocker digest to Slack with assignees and direct issue links so engineering managers can intervene before cycle delivery is impacted.

    ## How it works
    1. A `Schedule` trigger runs the workflow Monday through Friday at 08:30 UTC ahead of team standups (shipped disabled by default).
    2. Task `query_blocked_issues` uses `io.kestra.plugin.graphql.Request` to connect to `https://api.linear.app/graphql` using `{{ secret('LINEAR_API_TOKEN') }}`. It queries the `issues` root field filtered by `priority: [1, 2]` (Urgent and High) and states `Blocked` or `In Progress`.
    3. Task `evaluate_blockers` (`io.kestra.plugin.core.flow.If`) counts all issues where `state.name == "Blocked"`:
       - If blockers exceed `inputs.max_allowed_blockers`: Task `alert_blocked_issues_digest` sends an itemized Slack message showing the issue identifier (e.g. `ENG-101`), title, assignee, and clickable URL.
       - If no blockers exist: Task `log_velocity_healthy` logs that the sprint cycle is on track.
    4. Task `log_audit_summary` records total evaluated and blocked issue counts for historical observability.
    5. Top-level `errors` handler catches network or API authentication failures.

    ## What you get
    - Proactive visibility into high-priority blocked issues delivered directly to team Slack channels before daily standup meetings.
    - Automated detection of unassigned blockers that lack ownership.
    - Consolidated reporting across multiple engineering teams and sub-projects without manual dashboard checking.
    - Centralized, version-controlled notification rules that evolve with your organization's workflow states.

    ## Who it's for
    - Engineering Managers and Team Leads looking to eliminate bottlenecks and unblock team members quickly.
    - Technical Program Managers (TPMs) tracking cross-team dependency commitments.
    - Product Operations and Scrum Masters monitoring sprint health and cycle completion rates.

    ## Why orchestrate this with Kestra
    Building custom cron scripts to poll Linear APIs creates fragile unmonitored scripts without error handling, secret governance, or execution history. Kestra provides declarative YAML orchestration with native GraphQL request handling, built-in retry and timeout policies, robust secrets integration, and out-of-the-box Slack alerts. With Kestra, engineering workflow observability is standardized, scheduled, and visible in a single dashboard alongside infrastructure pipelines.

    ## Prerequisites
    - An active Linear workspace with API access enabled.
    - Outbound internet access from the Kestra worker to connect to `https://api.linear.app/graphql`.

    ### Secrets
    - `LINEAR_API_TOKEN`: Linear personal API key or OAuth service token with read access to issues.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to post morning blocker digests and error alerts.

    ## Quick start
    1. Generate a Linear API key in Linear Settings under **API > Personal API keys**.
    2. Store your Linear token and Slack webhook URL in Kestra Secrets (`LINEAR_API_TOKEN` and `SLACK_WEBHOOK_URL`).
    3. Trigger a manual execution from the Kestra UI to verify that the query successfully connects and retrieves current team blockers.
    4. Enable the `daily_morning_standup_audit` trigger to establish automated morning alerts.

    ## How to extend
    - Add a stale issue filter comparing `updatedAt` timestamps to alert on issues stuck in `In Progress` without comments for >5 days.
    - Cross-reference Linear blockers with GitHub pull request review statuses to identify whether code review delays are the root cause.
    - Automatically post a comment to blocked Linear issues nudging assignees to update blocker details.

    ## Links
    - [Linear GraphQL API Documentation](https://developers.linear.app/docs/graphql/working-with-the-graphql-api)
    - [Kestra GraphQL Plugin Documentation](https://kestra.io/plugins/plugin-graphql)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Business
    - Infrastructure
  subTags:
    - Reporting & Digests
    - Monitoring & Alerting
  ee: false
  demo: false
