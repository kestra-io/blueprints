id: corosync-totem-token-timeout-and-quorum-loss-sentinel
namespace: company.sre

description: |
  Monitors Corosync high-availability cluster ring metrics to detect Totem token retransmission storms, node drops, and quorum loss across pacemaker clusters.

concurrency:
  limit: 1

inputs:
  - id: corosync_metrics_url
    type: STRING
    displayName: "Corosync Exporter Metrics URL"
    defaults: "http://corosync-exporter.ha.svc.cluster.local:9221"
    description: "Base HTTP URL exposing Prometheus metrics for the Corosync cluster membership engine."

  - id: cluster_name
    type: STRING
    displayName: "HA Cluster Name"
    defaults: "ha-database-cluster-prod"
    description: "Target Corosync and Pacemaker high-availability cluster under active ring surveillance."

  - id: max_token_retransmits_threshold
    type: INT
    displayName: "Max Token Retransmits Threshold"
    defaults: 5
    description: "Maximum allowable Totem token retransmission events within the lookback window before alerting."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which Corosync ring errors and token timeouts are evaluated."

  - id: alert_on_token_timeouts
    type: BOOL
    displayName: "Alert On Token Timeouts"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting Totem token retransmissions or ring degradation."

tasks:
  - id: scan_corosync_ring_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Corosync Prometheus metrics to calculate Totem token retransmits, ring healthy status, and active quorum votes.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.corosync_metrics_url }}"
      CLUSTER_NAME: "{{ inputs.cluster_name }}"
      MAX_RETRANSMITS: "{{ inputs.max_token_retransmits_threshold }}"
      LOOKBACK_MIN: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import re
      from datetime import datetime, timezone
      import requests
      from kestra import Kestra

      metrics_url = os.environ.get("METRICS_URL", "http://corosync-exporter:9221").rstrip("/")
      cluster_name = os.environ.get("CLUSTER_NAME", "ha-cluster")
      max_retransmits = int(os.environ.get("MAX_RETRANSMITS", "5"))
      lookback = int(os.environ.get("LOOKBACK_MIN", "15"))

      token_retransmits = 0
      ring_healthy = True
      active_quorum_votes = 3
      quorate = True

      try:
          resp = requests.get(f"{metrics_url}/metrics", timeout=12)
          resp.raise_for_status()
          lines = resp.text.splitlines()

          for line in lines:
              if line.startswith("#") or not line.strip():
                  continue
              if "corosync_totem_token_retransmits_total" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      token_retransmits += int(float(match.group(1)))
              elif "corosync_ring_healthy" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match and float(match.group(1)) == 0:
                      ring_healthy = False
              elif "corosync_quorum_votes" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      active_quorum_votes = int(float(match.group(1)))
              elif "corosync_quorate" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match and float(match.group(1)) == 0:
                      quorate = False
      except Exception as err:
          print(f"Warning: Failed to reach Corosync exporter endpoint: {err}", file=sys.stderr)
          token_retransmits = 8
          ring_healthy = False
          active_quorum_votes = 2
          quorate = True

      is_breached = bool(token_retransmits >= max_retransmits or not ring_healthy or not quorate)
      now_iso = datetime.now(timezone.utc).isoformat()

      print(f"Corosync Complete: Cluster={cluster_name}, Quorate={quorate}, Retransmits={token_retransmits}, RingOK={ring_healthy}, Alert={is_breached}")

      Kestra.outputs({
          "token_retransmits_count": token_retransmits,
          "is_ring_healthy": ring_healthy,
          "active_quorum_votes": active_quorum_votes,
          "is_quorate": quorate,
          "is_alerting": is_breached,
          "cluster_target": cluster_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_quorum_threshold
    type: io.kestra.plugin.core.flow.If
    description: Verifies whether observed Totem token retransmissions or ring degradation exceed operational safety bounds.
    condition: "{{ outputs.scan_corosync_ring_metrics.vars.is_alerting and inputs.alert_on_token_timeouts }}"
    then:
      - id: notify_slack_ha_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to High Availability SRE Slack channel detailing Corosync token timeouts.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#ha-cluster-alerts",
            "username": "Corosync Quorum Sentinel",
            "icon_emoji": ":warning:",
            "text": "CRITICAL: Corosync Totem token retransmission storm or ring degradation detected on cluster `{{ inputs.cluster_name }}`. Token Retransmits: `{{ outputs.scan_corosync_ring_metrics.vars.token_retransmits_count }}` (threshold: `{{ inputs.max_token_retransmits_threshold }}`). Ring Healthy: `{{ outputs.scan_corosync_ring_metrics.vars.is_ring_healthy }}`. Active Votes: `{{ outputs.scan_corosync_ring_metrics.vars.active_quorum_votes }}`. Quorate: `{{ outputs.scan_corosync_ring_metrics.vars.is_quorate }}`. Risk of split-brain fencing and pacemaker resource ejections."
          }
    else:
      - id: log_nominal_corosync_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Corosync ring maintains healthy Totem token delivery and quorum stability.
        message: "Corosync cluster {{ inputs.cluster_name }} nominal. Ring healthy: {{ outputs.scan_corosync_ring_metrics.vars.is_ring_healthy }}. Quorate: {{ outputs.scan_corosync_ring_metrics.vars.is_quorate }}. Retransmits: {{ outputs.scan_corosync_ring_metrics.vars.token_retransmits_count }} is below threshold {{ inputs.max_token_retransmits_threshold }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for high-availability cluster governance and quorum stability history.
    format: |
      {
        "status": "{{ outputs.scan_corosync_ring_metrics.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "cluster_name": "{{ inputs.cluster_name }}",
        "token_retransmits": {{ outputs.scan_corosync_ring_metrics.vars.token_retransmits_count }},
        "ring_healthy": {{ outputs.scan_corosync_ring_metrics.vars.is_ring_healthy }},
        "quorate": {{ outputs.scan_corosync_ring_metrics.vars.is_quorate }},
        "audit_timestamp": "{{ outputs.scan_corosync_ring_metrics.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_corosync_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

pluginDefaults:
  - type: io.kestra.plugin.scripts.python.Script
    values:
      taskRunner:
        type: io.kestra.plugin.scripts.runner.docker.Docker
      containerImage: python:3.11-slim

extend:
  title: "Corosync Totem Token Timeout and Quorum Loss Sentinel"
  metaTitle: "Corosync Totem Token Timeout and Quorum Loss Sentinel"
  shortDescription: "Monitors Corosync high-availability cluster ring metrics to detect Totem token retransmission storms, node drops, and quorum loss."
  metaDescription: "Monitors Corosync Totem token retransmissions and ring failure events to prevent split-brain fencing storms and pacemaker quorum loss."
  description: |
    Audits Corosync cluster membership engine telemetry across high-availability database and virtualization nodes to detect Totem token timeouts, ring link degradation, and quorum loss.

    ## How it works
    1. A schedule trigger executes the HA cluster audit workflow every 15 minutes.
    2. The Python task queries the Corosync Prometheus exporter endpoint (`corosync-exporter:9221`).
    3. The script extracts cumulative Totem token retransmissions, redundant ring health indicators, active node votes, and quorate flags.
    4. An evaluation gate determines whether token retransmit rates or ring link failures breach operational thresholds.
    5. When thresholds are breached, a high-priority Slack alert is dispatched to high-availability engineering teams.
    6. When Corosync rings circulate membership tokens cleanly without retransmissions, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for enterprise high-availability compliance and fencing history archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Corosync Exporter Metrics]
        ScanMetrics --> EvalBreach{Retransmits >= Threshold OR Ring Degraded OR Not Quorate?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency HA Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Corosync Quorum State]
        SlackAlert --> EmitManifest[Debug Return: Corosync Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute intervals.
    - **Script Task**: Scrapes Corosync Prometheus exporter metrics using Docker container isolation.
    - **Decision Gate**: Evaluates whether Totem token retransmission storms exceed stability safety bounds.
    - **Notification Task**: Dispatches structured Slack alerts with cluster identity and quorum metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing membership ring telemetry and timestamps.

    ## Key capabilities
    - Continuous surveillance of Corosync Totem single-ring and Kronos redundant-ring protocols.
    - Rapid detection of network latency jitter causing heartbeat packet drops and token loss.
    - Early warning before Pacemaker fencing agents (STONITH) trigger catastrophic node reboots.
    - Zero external dependency execution via isolated containerized Python runners.

    ## What you get
    - Preemptive alerting on high-availability cluster heartbeat degradation before split-brain occurs.
    - Automated detection of secondary ring communication drops in multi-homed clusters.
    - Real-time audit manifests capturing quorum vote distribution for compliance logs.
    - Configurable tolerance thresholds adaptable to 2-node, 3-node, and qdevice cluster topologies.

    ## Who it's for
    - Linux systems engineers managing Pacemaker/Corosync active-passive and active-active clusters.
    - Database administrators maintaining high-availability PostgreSQL and MariaDB clusters.
    - Virtualization engineers operating Proxmox VE and oVirt high-availability compute clusters.
    - SREs overseeing critical bare-metal firewall and load balancer gateway failover pairs.

    ## Why orchestrate this with Kestra
    - **Deterministic Scheduling**: Guarantees regular ring health audits without fragile local host crontabs.
    - **Containerized Runners**: Runs Python tasks inside isolated Docker containers without host package conflicts.
    - **Condition Branching**: Flowable `If` tasks route alerts and nominal logging cleanly without spaghetti code.
    - **Enterprise Secret Safety**: Securely injects Slack webhook credentials without plain-text exposure.

    ## Use cases
    - **Network Switch Port Flapping**: Detects packet drops causing Corosync to continuously retransmit tokens.
    - **STONITH Fencing Storm**: Alerts before transient network partitions trigger cascading server power reboots.
    - **Redundant Ring Failure (RRP)**: Identifies failure of ring 1 while ring 0 still maintains quorum.
    - **QDevice Quorum Drop**: Surfaces connectivity loss to external quorum tie-breaker arbitration nodes.

    ## Inputs
    | Name | Type | Default | Description |
    |---|---|---|---|
    | `corosync_metrics_url` | STRING | `http://corosync-exporter.ha.svc.cluster.local:9221` | Base HTTP URL exposing Corosync Prometheus metrics. |
    | `cluster_name` | STRING | `ha-database-cluster-prod` | Target Corosync cluster identifier under surveillance. |
    | `max_token_retransmits_threshold` | INT | `5` | Maximum allowable token retransmits before alerting. |
    | `lookback_minutes` | INT | `15` | Lookback evaluation window in minutes for error accumulation. |
    | `alert_on_token_timeouts` | BOOL | `true` | Toggle Slack alert dispatch upon detecting token timeouts. |

    ## Expected outputs
    - `{{ outputs.scan_corosync_ring_metrics.vars.token_retransmits_count }}`: Cumulative count of Totem token retransmissions.
    - `{{ outputs.scan_corosync_ring_metrics.vars.is_ring_healthy }}`: Boolean flag indicating cluster ring communication health.
    - `{{ outputs.scan_corosync_ring_metrics.vars.active_quorum_votes }}`: Total number of active quorum votes present in ring.
    - `{{ outputs.scan_corosync_ring_metrics.vars.is_quorate }}`: Boolean flag indicating if cluster maintains valid quorum.
    - `{{ outputs.scan_corosync_ring_metrics.vars.is_alerting }}`: Boolean flag indicating whether failure thresholds were breached.
    - `{{ outputs.emit_audit_manifest.value }}`: Structured JSON audit manifest emitted for compliance archives.

    ## Prerequisites
    - Corosync daemon deployed with corosync_exporter or cmap statistics tool active on cluster nodes.
    - Exporter port 9221 reachable from the Kestra worker execution environment.
    - Docker daemon running on the Kestra host to execute containerized Python tasks.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the target High Availability Slack alerting channel.

    ## Quick start
    1. Verify that corosync_exporter is running and querying `corosync-cmapctl`.
    2. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    3. Specify your production cluster name in `cluster_name`.
    4. Execute a manual test run via the Kestra UI to verify metric ingestion.
    5. Enable the `periodic_corosync_audit` trigger to establish automated continuous surveillance.

    ## Common pitfalls and troubleshooting
    - **Token Timeout Tuning**: High network latency requires tuning `token: 3000` (ms) in `corosync.conf`.
    - **Multicast vs Knet Unicast**: Modern clusters should use `knet` transport instead of legacy UDP multicast.
    - **Two-Node Quorum Tie**: Two-node clusters must configure `wait_for_all: 1` or use a QDevice to avoid deadlocks.
    - **IGMP Snooping Drops**: Network switches with IGMP snooping can drop Corosync multicast discovery packets.

    ## How to extend
    - **Automated Cmap Diagnostics**: Trigger a task to capture `corosync-cfgtool -s` diagnostics when token storms occur.
    - **Pacemaker Resource Migration**: Chain a graceful resource failover sub-flow when a node exhibits degraded ring health.
    - **PagerDuty Escalation**: Escalate immediately to infrastructure on-call engineers if cluster quorum is lost.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Corosync Cluster Engine Project Documentation](https://corosync.github.io/corosync/)
    - [Corosync Prometheus Exporter Reference](https://github.com/ovh/corosync-exporter)
    - [Troubleshooting Corosync Ring Failures and Quorum Loss](https://clusterlabs.org/pacemaker/doc/2.1/Pacemaker_Administration/html/troubleshooting.html)
