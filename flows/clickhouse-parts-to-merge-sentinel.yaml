id: clickhouse-parts-to-merge-sentinel
namespace: company.team

inputs:
  - id: clickhouse_host
    type: STRING
    defaults: clickhouse.internal
    description: Hostname of the ClickHouse server.
  - id: clickhouse_port
    type: INT
    defaults: 8123
    description: HTTP interface port for ClickHouse.
  - id: clickhouse_user
    type: STRING
    defaults: default
    description: ClickHouse database user.
  - id: max_parts_per_partition_threshold
    type: INT
    defaults: 150
    description: Maximum permissible active parts per partition before alerting (ClickHouse default limit is 300).

tasks:
  - id: query_parts_per_partition
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests
    env:
      CH_HOST: "{{ inputs.clickhouse_host }}"
      CH_PORT: "{{ inputs.clickhouse_port }}"
      CH_USER: "{{ inputs.clickhouse_user }}"
      CH_PASSWORD: "{{ secret('CLICKHOUSE_PASSWORD') }}"
      MAX_PARTS: "{{ inputs.max_parts_per_partition_threshold }}"
    outputFiles:
      - parts_summary.json
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      host = os.environ.get("CH_HOST", "clickhouse.internal")
      port = os.environ.get("CH_PORT", "8123")
      user = os.environ.get("CH_USER", "default")
      password = os.environ.get("CH_PASSWORD", "")
      max_parts = int(os.environ.get("MAX_PARTS", 150))

      query = "SELECT table, partition, count() as parts_count FROM system.parts WHERE active = 1 GROUP BY table, partition ORDER BY parts_count DESC LIMIT 10 FORMAT JSON"
      url = f"http://{host}:{port}/"
      auth = (user, password) if user or password else None

      try:
          resp = requests.post(url, auth=auth, data=query, timeout=12)
          resp.raise_for_status()
          data = resp.json().get("data", [])
      except Exception as e:
          print(f"ERROR: Failed to query system.parts from {url}: {e}", file=sys.stderr)
          sys.exit(1)

      high_parts = [p for p in data if int(p.get("parts_count", 0)) >= max_parts]
      alert_triggered = len(high_parts) > 0
      highest = data[0] if data else {}

      result = {
          "highest_parts_partition": highest,
          "breached_partitions": high_parts,
          "alert_triggered": alert_triggered
      }

      with open("parts_summary.json", "w", encoding="utf-8") as out:
          json.dump(result, out, indent=2)

      print(f"ClickHouse parts audit completed: {len(data)} partitions inspected, {len(high_parts)} breached threshold {max_parts}.")

      Kestra.outputs({
          "alert_triggered": alert_triggered,
          "breached_count": len(high_parts),
          "highest_table": highest.get("table", "none"),
          "highest_partition": highest.get("partition", "none"),
          "highest_parts_count": int(highest.get("parts_count", 0))
      })

  - id: evaluate_merge_delay
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_parts_per_partition.vars.alert_triggered }}"
    then:
      - id: alert_infrastructure_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": "🧩 *ClickHouse Partition Parts Alert*: Detected {{ outputs.query_parts_per_partition.vars.breached_count }} partition(s) exceeding {{ inputs.max_parts_per_partition_threshold }} parts on `{{ inputs.clickhouse_host }}`. Highest: `{{ outputs.query_parts_per_partition.vars.highest_table }}` partition `{{ outputs.query_parts_per_partition.vars.highest_partition }}` with {{ outputs.query_parts_per_partition.vars.highest_parts_count }} parts."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "⚠️ *ClickHouse Sentinel Execution Failure*: Failed to query MergeTree parts on {{ inputs.clickhouse_host }}."
      }

triggers:
  - id: scheduled_parts_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits ClickHouse table part counts to detect small-part accumulation and prevent 'Too many parts' write rejections."
  metaTitle: ClickHouse Parts to Merge and Table Merge Delay Sentinel with Kestra
  title: ClickHouse Parts to Merge and Table Merge Delay Sentinel
  shortDescription: Audits ClickHouse table part counts to detect small-part accumulation and prevent 'Too many parts' write rejections.
  description: |
    ## How it works
    This workflow queries the ClickHouse `system.parts` table to inspect the active part counts grouped by table and partition. It triggers alerts when small inserts accumulate faster than background merge threads can combine them, preventing `Too many parts in all data parts in table` write-rejection errors.

    ## What you get
    - Early warning against micro-batching and undersized streaming inserts.
    - Prevention of analytical write blockades and query degradation.
    - Automated Slack incident delivery indicating affected tables, partitions, and exact part counts.

    ## Who it's for
    - Data engineers designing high-frequency ingestion pipelines into ClickHouse.
    - Platform SREs maintaining analytical query and ingestion performance.

    ## Why orchestrate this with Kestra
    Kestra automates distributed data platform observability, running scheduled health checks with fine-grained error management and notification routing.

    ## Prerequisites
    - ClickHouse native port accessibility (default 9000).
    - Secrets `CLICKHOUSE_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure host, port, and credentials.
    3. Run manually to check current part counts.

    ## How to extend
    - Trigger `OPTIMIZE TABLE ... FINAL` selectively for non-production partitions during maintenance windows.
    - Monitor `system.merges` to evaluate background pool thread utilization.
    - Export part count metrics to Grafana for timeseries monitoring.

    ## Links
    - [ClickHouse System Parts Documentation](https://clickhouse.com/docs/en/operations/system-tables/parts)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
