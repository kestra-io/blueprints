id: aws-direct-connect-virtual-interface-sentinel
namespace: company.netops

inputs:
  - id: aws_region
    type: STRING
    defaults: us-east-1
    description: AWS region where Direct Connect connections terminate.

tasks:
  - id: audit_direct_connect_states
    type: io.kestra.plugin.aws.cli.AwsCLI
    runner: PROCESS
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        aws directconnect describe-connections --output json > dx_conns.json
        aws directconnect describe-virtual-interfaces --output json > dx_vifs.json
        python3 -c "
        import json
        with open('dx_conns.json') as f:
            conns = json.load(f).get('connections', [])
        with open('dx_vifs.json') as f:
            vifs = json.load(f).get('virtualInterfaces', [])
        down_conns = []
        for c in conns:
            state = c.get('connectionState', 'unknown')
            if state != 'available':
                down_conns.append({'id': c.get('connectionId'), 'name': c.get('connectionName'), 'state': state})
        down_vifs = []
        for v in vifs:
            v_state = v.get('virtualInterfaceState', 'unknown')
            if v_state != 'available':
                down_vifs.append({'id': v.get('virtualInterfaceId'), 'name': v.get('virtualInterfaceName'), 'state': v_state})
        alert_triggered = (len(down_conns) > 0) or (len(down_vifs) > 0)
        result = {
            'region': '{{ inputs.aws_region }}',
            'down_connections_count': len(down_conns),
            'down_connections': down_conns,
            'down_vifs_count': len(down_vifs),
            'down_vifs': down_vifs,
            'alert_triggered': alert_triggered
        }
        with open('dx_summary.json', 'w') as out:
            json.dump(result, out)
        print('Direct Connect audit:', result)
        "
    outputFiles:
      - dx_summary.json

  - id: evaluate_dx_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.audit_direct_connect_states.outputFiles['dx_summary.json'])).alert_triggered }}"
    then:
      - id: alert_network_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":rotating_light: *AWS Direct Connect Down Alert*: Detected degraded hybrid cloud connectivity in {{ inputs.aws_region }}. Down connections: {{ json(read(outputs.audit_direct_connect_states.outputFiles['dx_summary.json'])).down_connections_count }}, Down Virtual Interfaces: {{ json(read(outputs.audit_direct_connect_states.outputFiles['dx_summary.json'])).down_vifs_count }}."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Direct Connect Sentinel Failure*: Failed to describe connections in {{ inputs.aws_region }}."
      }

triggers:
  - id: scheduled_dx_pulse
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    disabled: true

extend:
  title: AWS Direct Connect Connection and Virtual Interface State Sentinel
  shortDescription: Audits AWS Direct Connect dedicated links and virtual interfaces to detect link flaps, physical port downs, and BGP session drops.
  description: |
    ## How it works
    This sentinel calls `aws directconnect describe-connections` and `describe-virtual-interfaces` using `AwsCLI`. It verifies that physical cross-connects and transit/private virtual interfaces maintain `available` operational states, firing emergency alerts when hybrid cloud connectivity drops.

    ## What you get
    - Continuous validation of dedicated on-premises-to-cloud network links.
    - Immediate detection of physical link failures, transceiver faults, or BGP peering drops.
    - Automated Slack delivery tracking degraded connection names, IDs, and states.

    ## Who it's for
    - Network engineers and hybrid cloud infrastructure architects.
    - SREs maintaining mission-critical enterprise interconnects.

    ## Why orchestrate this with Kestra
    Kestra runs automated scheduled operational health checks with native error handling, secret injection, and multi-channel alerting.

    ## Prerequisites
    - AWS IAM credentials with `directconnect:DescribeConnections` and `directconnect:DescribeVirtualInterfaces` permissions.
    - Secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `aws_region` and credentials.
    3. Run manually to check current Direct Connect link states.

    ## How to extend
    - Query CloudWatch metrics for `ConnectionBpsEgress` and `ConnectionErrorCount` for bandwidth monitoring.
    - Automatically fail over traffic to backup Site-to-Site VPN tunnels when Direct Connect goes down.
    - Forward network connectivity status to PagerDuty.

    ## Links
    - [Kestra AWS Plugin](https://kestra.io/plugins/plugin-aws)
    - [AWS Direct Connect Monitoring](https://docs.aws.amazon.com/directconnect/latest/UserGuide/monitoring-direct-connect.html)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
