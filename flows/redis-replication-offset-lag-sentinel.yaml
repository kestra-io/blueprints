id: redis-replication-offset-lag-sentinel
namespace: company.dataops

inputs:
  - id: redis_host
    type: STRING
    defaults: redis-primary.internal
    description: Hostname of the Redis primary instance.
  - id: redis_port
    type: INT
    defaults: 6379
    description: TCP port of the Redis primary instance.
  - id: max_replication_lag_bytes
    type: INT
    defaults: 1048576
    description: Maximum permissible replication offset lag in bytes before alerting (default 1MB).

tasks:
  - id: inspect_replication_offset
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - |
        redis-cli -h "{{ inputs.redis_host }}" -p {{ inputs.redis_port }} -a "{{ secret('REDIS_PASSWORD') }}" INFO replication > repl_info.txt
        python3 -c "
        import json, re
        with open('repl_info.txt') as f:
            lines = f.readlines()
        info = {}
        for l in lines:
            if ':' in l:
                k, v = l.strip().split(':', 1)
                info[k] = v
        master_offset = int(info.get('master_repl_offset', 0))
        connected_slaves = int(info.get('connected_slaves', 0))
        max_lag = 0
        lagged_slaves = []
        for k, v in info.items():
            if k.startswith('slave'):
                match = re.search(r'offset=(\d+)', v)
                if match:
                    s_offset = int(match.group(1))
                    lag = master_offset - s_offset
                    if lag > max_lag:
                        max_lag = lag
                    if lag > {{ inputs.max_replication_lag_bytes }}:
                        lagged_slaves.append({'slave': k, 'lag_bytes': lag})
        alert_triggered = (max_lag > {{ inputs.max_replication_lag_bytes }}) or (connected_slaves == 0)
        result = {
            'connected_slaves': connected_slaves,
            'master_repl_offset': master_offset,
            'max_lag_bytes': max_lag,
            'lagged_slaves': lagged_slaves,
            'alert_triggered': alert_triggered
        }
        with open('repl_summary.json', 'w') as out:
            json.dump(result, out)
        print('Redis replication audit:', result)
        "
    outputFiles:
      - repl_summary.json

  - id: evaluate_replication_lag
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.inspect_replication_offset.outputFiles['repl_summary.json'])).alert_triggered }}"
    then:
      - id: alert_database_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *Redis Replication Lag Alert*: Primary {{ inputs.redis_host }} detected replica offset lag of {{ json(read(outputs.inspect_replication_offset.outputFiles['repl_summary.json'])).max_lag_bytes }} bytes (threshold: {{ inputs.max_replication_lag_bytes }} bytes)."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Redis Sentinel Execution Failure*: Unable to query replication stats on {{ inputs.redis_host }}."
      }

triggers:
  - id: scheduled_replication_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true

extend:
  title: Redis Replica Replication Offset Lag and Sync Sentinel
  shortDescription: Audits Redis primary and replica replication offsets to detect synchronization stalls and failover risks.
  description: |
    ## How it works
    This workflow connects to the Redis primary node using `redis-cli` and evaluates the `INFO replication` payload. It computes the byte difference between `master_repl_offset` and connected replica synchronization points, triggering alerts when network congestion or disk IO causes replicas to fall behind.

    ## What you get
    - Continuous validation of in-memory cache and state store replication health.
    - Early warning before read replicas serve stale cache data to client microservices.
    - Real-time Slack notifications detailing exact byte lag and slave identifiers.

    ## Who it's for
    - Database administrators and SREs maintaining high-availability Redis topologies.
    - Backend engineers relying on read-heavy Redis replica pools.

    ## Why orchestrate this with Kestra
    Kestra automates distributed system health checks with fine-grained scheduling and native notification plugins, eliminating the need for dedicated monitoring microservices.

    ## Prerequisites
    - Network reachability to Redis server port (default 6379).
    - Secrets `REDIS_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `redis_host`, `redis_port`, and secret credentials.
    3. Trigger a manual execution to evaluate replication status.

    ## How to extend
    - Query `INFO memory` to correlate replication buffer bloat with memory fragmentation.
    - Trigger automated failover orchestration via Redis Sentinel or AWS ElastiCache APIs.
    - Export replication latency metrics to Prometheus or Datadog.

    ## Links
    - [Kestra Redis Plugin Documentation](https://kestra.io/plugins/plugin-redis)
    - [Redis Replication Documentation](https://redis.io/docs/management/replication/)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
