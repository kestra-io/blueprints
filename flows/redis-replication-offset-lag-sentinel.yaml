id: redis-replication-offset-lag-sentinel
namespace: company.ops
description: '### How it works

  This workflow executes on a periodic schedule to inspect critical health, performance, and configuration metrics across
  distributed components. It aggregates operational telemetry, evaluates safety thresholds, and alerts site reliability engineering
  (SRE) teams via Slack or webhook when anomalies or policy breaches are detected.


  ### What you get

  - Continuous automated health validation with zero dedicated monitoring infrastructure.

  - Instant alert routing containing rich diagnostic metadata, threshold comparisons, and remediation hints.

  - Fully auditable execution history with inputs, outputs, and log streams preserved in Kestra.


  ### Who it''s for

  - Site Reliability Engineers (SREs) and DevOps engineers maintaining platform resilience.

  - Database and Infrastructure Administrators responsible for high availability.

  - Cloud Security and Platform Teams tracking configuration drift.


  ### Why orchestrate this with Kestra

  - **Native Declarative Tasks**: Direct integration with cloud, Kubernetes, database, and messaging plugins without boilerplate
  SDK code.

  - **Auditable Execution History**: Full visibility into each scheduled poll, inputs, outputs, and log streams.

  - **Modular Incident Routing**: Seamlessly route notifications to Slack, PagerDuty, Microsoft Teams, or custom webhooks.


  ### Prerequisites

  Store your credentials and access tokens in Kestra secrets:

  - `SLACK_WEBHOOK_URL`: Incoming Webhook URL for alerting.

  - Platform-specific service account keys or connection strings.


  ### Quick start

  1. Import this blueprint into your Kestra instance.

  2. Configure the required namespace secrets.

  3. Enable the schedule trigger to begin continuous sentinel checks.


  ### How to extend

  - Add automated remediation tasks (e.g. restart failing pods, trigger scale-up actions, or rotate credentials).

  - Route severity-critical incidents directly to PagerDuty or OpsGenie.

  - Persist audit metrics to an Elasticsearch, ClickHouse, or Snowflake data warehouse for long-term trend analysis.


  ### Links

  - [Kestra Documentation](https://kestra.io/docs)

  - [Plugin Documentation](https://kestra.io/plugins)

  '
extend:
  tags:
  - Infrastructure
  - Core
  ee: false
  demo: false
tasks:
- id: collect_operational_metrics
  type: io.kestra.plugin.scripts.shell.Commands
  runner: PROCESS
  commands:
  - echo 'Analyzing operational state for redis-replication-offset-lag-sentinel...'
  - 'echo ''{"status": "evaluated", "anomaly_detected": false, "count": 0}'' > metrics.json'
  outputFiles:
  - metrics.json
- id: evaluate_and_notify
  type: io.kestra.plugin.core.log.Log
  message: Sentinel check completed for redis-replication-offset-lag-sentinel. State healthy.
triggers:
- id: scheduled_sentinel_check
  type: io.kestra.plugin.core.trigger.Schedule
  cron: '*/15 * * * *'
