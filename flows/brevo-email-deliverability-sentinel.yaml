id: brevo-email-deliverability-sentinel
namespace: company.team
description: |
  Every few hours, read the aggregated transactional email report from the
  Brevo API (read-only: no email is sent and no contact is changed) and
  classify deliverability as HEALTHY, WARNING, CRITICAL, LOW_VOLUME or
  UNREACHABLE. Log quiet runs and alert Slack when hard bounces, spam
  complaints or blocked sends rise, before the sending reputation and
  inbox placement of order and OTP emails suffer.

inputs:
  - id: lookback_days
    type: INT
    defaults: 1
    displayName: "Lookback Window (days)"
    description: "How many days of transactional email to aggregate (Brevo allows 1 to 90)."
  - id: warning_bounce_rate
    type: FLOAT
    defaults: 2.0
    displayName: "Warning Hard Bounce Rate (%)"
    description: "At or above this share of hard bounces among requests, the check is WARNING."
  - id: critical_bounce_rate
    type: FLOAT
    defaults: 5.0
    displayName: "Critical Hard Bounce Rate (%)"
    description: "At or above this share of hard bounces among requests, the check is CRITICAL."
  - id: warning_spam_rate
    type: FLOAT
    defaults: 0.1
    displayName: "Warning Spam Complaint Rate (%)"
    description: "At or above this share of spam complaints among delivered emails, the check is WARNING (mailbox providers ask senders to stay below 0.1%)."
  - id: critical_spam_rate
    type: FLOAT
    defaults: 0.3
    displayName: "Critical Spam Complaint Rate (%)"
    description: "At or above this share of spam complaints among delivered emails, the check is CRITICAL."
  - id: min_requests
    type: INT
    defaults: 100
    displayName: "Minimum Requests"
    description: "Below this many sends in the window, the rates are too noisy to judge and the run is LOW_VOLUME."

triggers:
  - id: deliverability_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check deliverability every 4 hours. Shipped disabled; enable it once the Brevo API key secret is set and a manual run has been verified.
    cron: "25 */4 * * *"
    disabled: true

tasks:
  - id: get_email_report
    type: io.kestra.plugin.core.http.Request
    description: Read the aggregated transactional email statistics for the lookback window from the Brevo SMTP statistics API. This is a GET; no email is sent.
    uri: "https://api.brevo.com/v3/smtp/statistics/aggregatedReport?days={{ inputs.lookback_days }}"
    method: GET
    headers:
      api-key: "{{ secret('BREVO_API_KEY') }}"
      accept: application/json
    options:
      allowFailed: true
      timeout:
        connectTimeout: PT10S
        readIdleTimeout: PT30S
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3
    allowFailure: true

  - id: summarize_deliverability
    type: io.kestra.plugin.core.debug.Return
    description: Turn the aggregated counters into a hard bounce rate (of requests), a spam complaint rate (of delivered) and a blocked rate, and classify in one jq query. A missing or non-200 response becomes UNREACHABLE instead of looking healthy.
    format: >-
      {{ (outputs.get_email_report.code is not defined or outputs.get_email_report.code != 200)
      ? '{"status":"UNREACHABLE","requests":0,"delivered":0,"hard_bounce_rate":0,"spam_rate":0,"blocked_rate":0,"range":"n/a"}'
      : (fromJson(outputs.get_email_report.body) | jq('
      (.requests // 0) as $req
      | (.delivered // 0) as $del
      | (if $req == 0 then 0 else (((.hardBounces // 0) * 10000 / $req) | floor) / 100 end) as $hb
      | (if $del == 0 then 0 else (((.spamReports // 0) * 10000 / $del) | floor) / 100 end) as $sp
      | (if $req == 0 then 0 else (((.blocked // 0) * 10000 / $req) | floor) / 100 end) as $bl
      | {requests: $req, delivered: $del, hard_bounces: (.hardBounces // 0), spam_reports: (.spamReports // 0), blocked: (.blocked // 0),
      hard_bounce_rate: $hb, spam_rate: $sp, blocked_rate: $bl, range: (.range // "n/a"),
      status: (if $req < ' ~ inputs.min_requests ~ ' then "LOW_VOLUME"
      elif $hb >= ' ~ inputs.critical_bounce_rate ~ ' or $sp >= ' ~ inputs.critical_spam_rate ~ ' then "CRITICAL"
      elif $hb >= ' ~ inputs.warning_bounce_rate ~ ' or $sp >= ' ~ inputs.warning_spam_rate ~ ' then "WARNING"
      else "HEALTHY" end)}
      ') | first | toJson) }}

  - id: route_by_deliverability
    type: io.kestra.plugin.core.flow.Switch
    description: Route to a quiet log when deliverability is healthy or volume is too low to judge, a Slack message when bounces or complaints cross the warning line, or a Slack page when they cross the critical line or Brevo could not be read.
    value: "{{ fromJson(outputs.summarize_deliverability.value).status }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "Brevo deliverability healthy for {{ fromJson(outputs.summarize_deliverability.value).range }}: {{ fromJson(outputs.summarize_deliverability.value).requests }} sent, hard bounces {{ fromJson(outputs.summarize_deliverability.value).hard_bounce_rate }}%, spam complaints {{ fromJson(outputs.summarize_deliverability.value).spam_rate }}%."
      "LOW_VOLUME":
        - id: log_low_volume
          type: io.kestra.plugin.core.log.Log
          message: "Brevo deliverability: only {{ fromJson(outputs.summarize_deliverability.value).requests }} email(s) in {{ fromJson(outputs.summarize_deliverability.value).range }}, below the minimum of {{ inputs.min_requests }}; rates not judged this run."
      "WARNING":
        - id: alert_warning_deliverability
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Post a Slack message when the hard bounce or spam complaint rate is at or above the warning line.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Brevo deliverability WARNING for {{ fromJson(outputs.summarize_deliverability.value).range }}: hard bounces {{ fromJson(outputs.summarize_deliverability.value).hard_bounce_rate }}% ({{ fromJson(outputs.summarize_deliverability.value).hard_bounces }}), spam complaints {{ fromJson(outputs.summarize_deliverability.value).spam_rate }}% ({{ fromJson(outputs.summarize_deliverability.value).spam_reports }}), blocked {{ fromJson(outputs.summarize_deliverability.value).blocked_rate }}% of {{ fromJson(outputs.summarize_deliverability.value).requests }} sent. Clean the list or check the latest template before mailbox providers throttle you. Execution {{ execution.id }}."
            }
      "CRITICAL":
        - id: alert_critical_deliverability
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when the hard bounce or spam complaint rate is at or above the critical line, which puts the sending domain's reputation and inbox placement at risk.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Brevo deliverability CRITICAL for {{ fromJson(outputs.summarize_deliverability.value).range }}: hard bounces {{ fromJson(outputs.summarize_deliverability.value).hard_bounce_rate }}%, spam complaints {{ fromJson(outputs.summarize_deliverability.value).spam_rate }}%, blocked {{ fromJson(outputs.summarize_deliverability.value).blocked_rate }}% of {{ fromJson(outputs.summarize_deliverability.value).requests }} sent. Order, OTP and password emails may start landing in spam. Pause bulk sends and investigate now. Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable_api
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when the statistics API could not be read, indicating an outage or an invalid API key.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Brevo deliverability sentinel UNREACHABLE: the SMTP statistics API did not return a usable response (HTTP {{ outputs.get_email_report.code ?? 'no response' }}). Check the API key. Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        message: "Brevo deliverability sentinel completed with an unexpected classification: {{ outputs.summarize_deliverability.value }}."

  - id: log_audit_result
    type: io.kestra.plugin.core.log.Log
    description: Record one audit line for every run, whichever branch fired, so the deliverability history stays queryable even if Slack delivery fails.
    message: "Brevo deliverability sentinel audit: lookback_days={{ inputs.lookback_days }} http={{ outputs.get_email_report.code ?? 'n/a' }} summary={{ outputs.summarize_deliverability.value }} execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack when the sentinel flow itself fails, so a broken check is never mistaken for healthy deliverability.
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "Brevo deliverability sentinel flow {{ flow.id }} FAILED (execution {{ execution.id }}). Email deliverability is now unknown; check the task logs and the Brevo statistics page."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ fromJson(outputs.summarize_deliverability.value).status }}"

extend:
  title: "Brevo Email Deliverability Sentinel"
  shortDescription: Read Brevo transactional email statistics on a schedule and alert Slack when hard bounces, spam complaints or blocked sends rise.
  metaTitle: Brevo Email Deliverability Sentinel for Kestra
  metaDescription: "Read Brevo transactional email stats every 4 hours, change nothing, and alert Slack when hard bounces or spam complaints cross your limits."
  description: |
    Order confirmations, OTPs and password resets are transactional emails, and they only work while the sending domain keeps a good reputation. A bad import that adds dead addresses, or a template that makes people press "Report spam", raises the hard bounce and complaint rates, and mailbox providers start throttling or junking every email from the domain. Brevo shows the numbers on its statistics page, but nothing pages the team when they move. This blueprint turns a scheduled, read-only call to the Brevo SMTP statistics API into a deliverability gate: `io.kestra.plugin.core.http.Request` reads the aggregated report, one jq query turns the counters into rates, and the result routes to a quiet log, a Slack note, or a Slack page.

    ## How it works

    1. `get_email_report` (`io.kestra.plugin.core.http.Request`) calls `GET /v3/smtp/statistics/aggregatedReport?days=N` with the `api-key` header. It is a read: no email is sent and no contact is changed. Retries cover short network blips, and `allowFailed` plus `allowFailure` keep an API error from aborting the flow so it can be reported instead.
    2. `summarize_deliverability` (`io.kestra.plugin.core.debug.Return`) first guards for a missing or non-200 response (`UNREACHABLE`). Otherwise one jq query computes the hard bounce rate (`hardBounces` / `requests`), the spam complaint rate (`spamReports` / `delivered`) and the blocked rate, and classifies the window: fewer than `min_requests` sends is `LOW_VOLUME`; a bounce or complaint rate at or above its critical line is `CRITICAL`; at or above its warning line is `WARNING`; otherwise `HEALTHY`.
    3. `route_by_deliverability` (`io.kestra.plugin.core.flow.Switch`) branches on that classification: `HEALTHY` and `LOW_VOLUME` log quietly, `WARNING` posts a Slack note, `CRITICAL` and `UNREACHABLE` page Slack. A `defaults` fallback logs anything unexpected.
    4. `log_audit_result` (`io.kestra.plugin.core.log.Log`) writes one audit line per run with the HTTP status and the full summary.
    5. The flow-level `errors` block pages Slack if the flow itself fails, and the `deliverability_check` trigger runs every 4 hours, shipped `disabled: true`.

    ## What you get

    - A read-only deliverability check with no custom scripting and no extra plugin to install.
    - A `status` output (`HEALTHY` / `WARNING` / `CRITICAL` / `LOW_VOLUME` / `UNREACHABLE`) other flows can gate on, for example to pause a bulk campaign while complaints are high.
    - Slack messages with the bounce, complaint and blocked rates and counts, so the team sees which number moved.
    - An audit line on every run, separate from Slack.

    ## Who it's for

    - Online stores, SaaS and fintech teams that send order, OTP and password emails through Brevo.
    - Growth teams who also send newsletters from the same domain and need an early warning before a campaign hurts transactional mail.
    - Teams that already run their alerting in Kestra.

    ## Why orchestrate this with Kestra

    Brevo's statistics are a dashboard, and its webhooks report single events, not a rate over a window. Kestra turns one read-only API call into a scheduled, typed classification with retries, a failure path and an execution history, and the `status` output lets your sending flows hold back bulk mail automatically when deliverability is in trouble.

    ## Prerequisites

    - A Brevo account (the free plan includes transactional email and API access) and an API key from SMTP & API > API Keys.
    - A Slack incoming webhook for the WARNING, CRITICAL, UNREACHABLE and flow-failure alerts.

    ### Secrets

    - `BREVO_API_KEY`: a Brevo API v3 key.
    - `SLACK_WEBHOOK`: Slack incoming webhook used for every alert branch and the flow-failure alert.

    In Kestra OSS, secrets are supplied as environment variables prefixed `SECRET_` and base64-encoded, for example `SECRET_BREVO_API_KEY=$(echo -n 'xkeysib-xxxxxxxx' | base64)`, and read back with `{{ secret('BREVO_API_KEY') }}`. Use the Enterprise secrets backend for encryption at rest and access control.

    ## Quick start

    1. Create a free Brevo account, verify a sender and create an API key.
    2. Add `BREVO_API_KEY` and `SLACK_WEBHOOK` as secrets.
    3. Send a few transactional test emails (including one to a non-existent address to produce a hard bounce), then run the flow manually with a low `min_requests` and check `status` and the rates in the logs against Brevo's statistics page.
    4. Enable `deliverability_check`.

    ## How to extend

    - Pass `tag` to check one email type (for example only OTPs) against its own limits.
    - Add a second Request to `GET /v3/smtp/statistics/events?event=hardBounces` to list the bouncing addresses and remove them from your own database.
    - Store the last status in a KV store and alert only when it changes.
    - Gate a bulk-campaign flow on `status != CRITICAL` with a `Flow` trigger.

    ## Inputs

    - `lookback_days`: type INT, default `1` (Brevo allows up to 90).
    - `warning_bounce_rate` / `critical_bounce_rate`: type FLOAT, defaults `2.0` / `5.0` (percent of requests).
    - `warning_spam_rate` / `critical_spam_rate`: type FLOAT, defaults `0.1` / `0.3` (percent of delivered).
    - `min_requests`: type INT, default `100`.

    ## Outputs

    - `status`: one of `HEALTHY`, `WARNING`, `CRITICAL`, `LOW_VOLUME`, `UNREACHABLE`.
    - Example path: `{{ fromJson(outputs.summarize_deliverability.value).spam_rate }}` for the complaint rate.

    ## Links

    - [Brevo API: aggregated transactional email report](https://developers.brevo.com/reference/get-aggregated-smtp-report)
    - [Kestra HTTP Request task](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)

    ## Pitfalls

    - The report aggregates whole days; read `range` in the output to see the exact span Brevo used for `lookback_days`.
    - Spam complaints are only reported by some mailbox providers, so a 0% complaint rate does not prove nobody complained.
    - The complaint thresholds follow common mailbox-provider guidance (stay below 0.1%, never reach 0.3%); adjust them for your own sending pattern.
    - This flow only reads statistics; it never sends email or changes contacts.
  tags:
    - Business
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
