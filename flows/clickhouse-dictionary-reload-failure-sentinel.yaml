id: clickhouse-dictionary-reload-failure-sentinel
namespace: company.team

inputs:
  - id: clickhouse_host
    type: STRING
    defaults: "clickhouse.internal"
    description: ClickHouse server hostname or IP address.
  - id: clickhouse_http_port
    type: INT
    defaults: 8123
    description: ClickHouse HTTP interface port.
  - id: clickhouse_user
    type: STRING
    defaults: "default"
    description: ClickHouse user name.

tasks:
  - id: query_dictionary_status
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - |
        set -euo pipefail
        python3 -c "
        import requests, json, sys

        host = '{{ inputs.clickhouse_host }}'
        port = {{ inputs.clickhouse_http_port }}
        user = '{{ inputs.clickhouse_user }}'
        pwd = '{{ secret('CLICKHOUSE_PASSWORD') }}'
        query = \"SELECT database, name, status, last_exception FROM system.dictionaries WHERE status != 'LOADED' FORMAT JSON\"

        try:
            resp = requests.get(f'http://{host}:{port}/', params={'query': query}, auth=(user, pwd), timeout=15)
            resp.raise_for_status()
            data = resp.json().get('data', [])
            failed_count = len(data)
            first_failed_name = data[0].get('name', '') if failed_count > 0 else ''

            result = {
                'failed_count': failed_count,
                'first_failed_name': first_failed_name
            }
            with open('ch_dict_summary.json', 'w') as out:
                json.dump(result, out)
            print('ClickHouse dictionary reload audit:', result)
        except Exception as err:
            sys.stderr.write(f'ClickHouse query error: {err}\n')
            sys.exit(1)
        "
    outputFiles:
      - ch_dict_summary.json

  - id: evaluate_dictionary_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.query_dictionary_status.outputFiles['ch_dict_summary.json'])).failed_count > 0 }}"
    then:
      - id: notify_data_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#clickhouse-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 ClickHouse External Dictionary Reload Failure Alert",
                "text": "ClickHouse node `{{ inputs.clickhouse_host }}` has *{{ fromJson(read(outputs.query_dictionary_status.outputFiles['ch_dict_summary.json'])).failed_count }}* external dictionaries failing periodic reloads (e.g. `{{ fromJson(read(outputs.query_dictionary_status.outputFiles['ch_dict_summary.json'])).first_failed_name }}`)! Impact: Remote MySQL, PostgreSQL, or HTTP dictionary sources are unreachable, causing `dictGet()` lookup queries to return stale cached values or crash with reload exceptions.",
                "footer": "Kestra Database Sentinel • ClickHouse"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#clickhouse-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ ClickHouse External Dictionary Reload Failure Sentinel Pipeline Failure",
            "text": "Failed to query ClickHouse system.dictionaries catalog. Check database credentials.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Monitors ClickHouse system.dictionaries to detect failed periodic dictionary reloads and stale cached lookup data."
  metaTitle: ClickHouse External Dictionary Reload Failure Sentinel with Kestra
  title: ClickHouse External Dictionary Reload Failure Sentinel
  shortDescription: Monitors ClickHouse system.dictionaries to detect failed periodic dictionary reloads and stale cached lookup data.
  description: |
    ## How it works
    This workflow inspects `system.dictionaries` for external dictionary sources where `status != 'LOADED'`. ClickHouse external dictionaries periodically pull reference data from PostgreSQL, MySQL, Redis, or HTTP endpoints into high-speed in-memory structures. When database credentials expire or remote sources become unreachable, dictionary reload threads fail. If failed dictionaries are detected, Slack is notified immediately.

    ## What you get
    - Real-time detection of broken external dictionary connections in ClickHouse.
    - Prevents stale dimension lookups and silent data enrichment corruption.
    - Captures specific dictionary names and underlying error exceptions.

    ## Who it's for
    - ClickHouse Administrators and Analytics Engineers managing dimensional modeling pipelines.
    - Platform teams integrating ClickHouse with transactional OLTP databases.

    ## Why orchestrate this with Kestra
    - **Native System Table Telemetry**: Query internal dictionary statuses via standard HTTP API.
    - **Continuous Data Freshness Assurance**: Run regular audits without external monitoring agents.
    - **Actionable Alerting**: Direct notifications accelerate credential renewal and network triage.

    ## Prerequisites
    - ClickHouse deployment using external dictionaries.
    - Secrets `CLICKHOUSE_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Configure ClickHouse host coordinates.
    3. Run the flow to audit external dictionary health.

    ## How to extend
    - Automatically trigger `SYSTEM RELOAD DICTIONARY <name>` upon transient network recovery.
    - Monitor `bytes_allocated` across in-memory dictionaries.

    ## Links
    - [ClickHouse External Dictionaries Documentation](https://clickhouse.com/docs/en/sql-reference/dictionaries/external-dictionaries/external-dicts)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
