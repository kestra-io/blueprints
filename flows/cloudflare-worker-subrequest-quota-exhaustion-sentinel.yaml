id: cloudflare-worker-subrequest-quota-exhaustion-sentinel
namespace: company.edge

description: Audits Cloudflare Workers for subrequest quota saturation and edge runtime termination risk.

concurrency:
  limit: 1

inputs:
  - id: cloudflareAccountId
    type: STRING
    displayName: Cloudflare Account ID
    defaults: 7ab8c90123456789abcdef0123456789
    description: Cloudflare 32-character hexadecimal account identifier.

  - id: workerScriptName
    type: STRING
    displayName: Worker Script Name
    defaults: edge-router-proxy
    description: Target Cloudflare Worker script name to evaluate.

  - id: maxSubrequestLimit
    type: INT
    displayName: Max Subrequest Limit
    defaults: 50
    description: Maximum subrequests allowed per invocation on the Worker plan.

  - id: subrequestThresholdPercent
    type: FLOAT
    displayName: Subrequest Threshold Percent
    defaults: 80.0
    description: Percentage of subrequest ceiling triggering proactive exhaustion alerts.

  - id: cloudflareApiToken
    type: SECRET
    displayName: Cloudflare API Token
    defaults: cloudflare_api_token_secret
    description: Encrypted Cloudflare API token with Analytics Read and Workers Read permissions.

  - id: slackWebhookUri
    type: SECRET
    displayName: Slack Webhook URI
    defaults: https://hooks.slack.com/services/T00/B00/XXXX
    description: Encrypted Slack Incoming Webhook endpoint for alerting Edge Infrastructure teams.

tasks:
  - id: evaluate_worker_subrequests
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Cloudflare GraphQL Analytics API for Worker subrequest telemetry.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    env:
      CF_ACCOUNT_ID: "{{ inputs.cloudflareAccountId }}"
      CF_API_TOKEN: "{{ inputs.cloudflareApiToken }}"
      SCRIPT_NAME: "{{ inputs.workerScriptName }}"
    script: |
      import os
      import json
      from datetime import datetime, timedelta, timezone
      import requests

      account_id = os.getenv('CF_ACCOUNT_ID')
      api_token = os.getenv('CF_API_TOKEN')
      script_name = os.getenv('SCRIPT_NAME')
      max_limit = {{ inputs.maxSubrequestLimit }}
      threshold_pct = {{ inputs.subrequestThresholdPercent }}

      headers = {
          "Authorization": f"Bearer {api_token}",
          "Content-Type": "application/json"
      }

      end_time = datetime.now(timezone.utc)
      start_time = end_time - timedelta(minutes=30)

      query = """
      query GetWorkerAnalytics($accountTag: String!, $datetimeStart: String!, $datetimeEnd: String!, $scriptName: String!) {
        viewer {
          accounts(filter: {accountTag: $accountTag}) {
            workersInvocationsAdaptive(
              filter: {
                datetime_geq: $datetimeStart,
                datetime_leq: $datetimeEnd,
                scriptName: $scriptName
              },
              limit: 10
            ) {
              sum {
                subrequests
                requests
                errors
              }
            }
          }
        }
      }
      """

      variables = {
          "accountTag": account_id,
          "datetimeStart": start_time.strftime("%Y-%m-%dT%H:%M:%SZ"),
          "datetimeEnd": end_time.strftime("%Y-%m-%dT%H:%M:%SZ"),
          "scriptName": script_name
      }

      resp = requests.post(
          "https://api.cloudflare.com/client/v4/graphql",
          headers=headers,
          json={"query": query, "variables": variables},
          timeout=15
      )

      data = resp.json() if resp.status_code == 200 else {}
      accounts = data.get("data", {}).get("viewer", {}).get("accounts", [])
      invocations = accounts[0].get("workersInvocationsAdaptive", []) if accounts else []

      total_subrequests = 0
      total_requests = 0
      for inv in invocations:
          s = inv.get("sum", {})
          total_subrequests += s.get("subrequests", 0)
          total_requests += s.get("requests", 0)

      avg_subrequests_per_req = (total_subrequests / total_requests) if total_requests > 0 else 0.0
      pct_used = (avg_subrequests_per_req / max_limit) * 100.0 if max_limit > 0 else 0.0
      is_quota_breached = pct_used >= threshold_pct

      report = {
          "account_id": account_id,
          "script_name": script_name,
          "total_invocations": total_requests,
          "total_subrequests": total_subrequests,
          "avg_subrequests_per_invocation": round(avg_subrequests_per_req, 2),
          "max_limit": max_limit,
          "quota_percent_used": round(pct_used, 1),
          "is_quota_breached": is_quota_breached,
          "recommended_action": f"Batch fetch calls or implement KV/Cache API caching in {script_name} to reduce subrequests." if is_quota_breached else "Subrequest usage is within nominal limits."
      }

      with open("subrequest_report.json", "w") as f:
          json.dump(report, f)

      print(f"Cloudflare Worker {script_name}: {avg_subrequests_per_req:.2f} avg subrequests ({pct_used:.1f}% of limit). Breached: {is_quota_breached}")

  - id: check_subrequest_quota
    type: io.kestra.plugin.core.flow.If
    description: Branch execution based on whether Worker subrequest quota utilization breached threshold.
    condition: "{{ json(read('subrequest_report.json')).is_quota_breached }}"
    then:
      - id: notify_slack_subrequest_quota
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority subrequest quota exhaustion warning to Slack.
        url: "{{ inputs.slackWebhookUri }}"
        payload: |
          {
            "text": "Cloudflare Worker Quota Alert: Script *{{ json(read('subrequest_report.json')).script_name }}* reached {{ json(read('subrequest_report.json')).quota_percent_used }}% of subrequest quota! Avg: {{ json(read('subrequest_report.json')).avg_subrequests_per_invocation }}/{{ inputs.maxSubrequestLimit }} subrequests per call. Runbook: {{ json(read('subrequest_report.json')).recommended_action }}"
          }
    else:
      - id: log_healthy_worker_quotas
        type: io.kestra.plugin.core.log.Log
        description: Logs nominal subrequest utilization when Worker scripts operate within safe limits.
        message: "Cloudflare Worker {{ json(read('subrequest_report.json')).script_name }} subrequest usage is nominal at {{ json(read('subrequest_report.json')).avg_subrequests_per_invocation }} subrequests per invocation."

  - id: export_subrequest_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Exports structured Cloudflare Worker subrequest telemetry report.
    format: "{{ json(read('subrequest_report.json')) }}"

triggers:
  - id: scheduled_subrequest_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled audit monitoring Cloudflare Worker subrequest utilization every fifteen minutes.
    cron: "*/15 * * * *"

extend:
  title: Cloudflare Worker Subrequest Quota Exhaustion Sentinel
  shortDescription: Monitors Cloudflare Workers for subrequest quota saturation to prevent edge script runtime termination.
  metaTitle: Cloudflare Worker Subrequest Quota Exhaustion Sentinel | Kestra
  metaDescription: Audits Cloudflare Worker subrequest telemetry, detects edge invocation quota exhaustion, and delivers actionable runbooks to edge engineers via Slack.
  description: |
    Audits Cloudflare Workers edge serverless scripts for subrequest volume spikes and execution quota exhaustion.

    ## How it works
    1. Triggers every 15 minutes on schedule to monitor edge execution telemetry.
    2. Runs a containerized Python script querying the Cloudflare GraphQL Analytics API for `workersInvocationsAdaptive`.
    3. Calculates aggregate invocation counts, total fetch subrequests, and average subrequests per request.
    4. Evaluates whether subrequest consumption approaches configured runtime limits using an `If` conditional task.
    5. Dispatches an incident alert to Slack with the worker script name and mitigation caching guidelines if thresholds are breached.
    6. Logs nominal execution telemetry and exports an audit manifest for edge platform capacity tracking.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[Schedule Trigger: Every 15 Minutes] --> B[Task: evaluate_worker_subrequests]
        B --> C{Task: check_subrequest_quota}
        C -- Quota Approaching Limit --> D[Task: notify_slack_subrequest_quota]
        C -- Nominal Operation --> E[Task: log_healthy_worker_quotas]
        D --> F[Task: export_subrequest_manifest]
        E --> F
    ```

    ## What you get
    - Proactive defense against Cloudflare Worker runtime crashes (Error 1101) caused by exceeding subrequest ceilings.
    - Real-time visibility into edge gateway fan-out patterns and origin traffic amplification.
    - Instant Slack alerts detailing average subrequest consumption per invocation with actionable mitigation guidance.
    - Exported JSON analytics manifest supporting edge capacity reporting and architectural review.

    ## Who it's for
    - Edge Infrastructure Engineers maintaining Cloudflare Workers, Pages Functions, and edge reverse proxies.
    - Platform and API Architects implementing distributed microservice routing at the edge.
    - FinOps teams monitoring third-party API consumption and origin egress costs.

    ## Why orchestrate this with Kestra
    Cloudflare executes Worker subrequests synchronously during request handling; once the plan limit (50 on Free, 1000 on Enterprise) is breached, subsequent fetch calls throw immediate unhandled runtime errors to clients. Cloudflare does not offer proactive threshold warning webhooks before limits are hit. Kestra runs an external, scheduled intelligence sentinel that queries GraphQL analytics, monitors utilization trends, and pages teams before traffic spikes trigger edge outages.

    ## Use cases
    - **Edge Runtime Outage Prevention**: Detect when complex edge gateway scripts approach the 50-subrequest ceiling before Cloudflare throws Error 1101 (Worker threw exception).
    - **API Gateway Cascade Amplification**: Identify when microservice proxy fan-out logic causes excessive downstream HTTP calls per user request.
    - **Edge FinOps Optimization**: Monitor high-subrequest scripts driving up origin compute costs and third-party SaaS egress charges.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `cloudflareAccountId` | `STRING` | `7ab8c9012...` | Cloudflare 32-character hexadecimal account identifier. |
    | `workerScriptName` | `STRING` | `edge-router-proxy` | Target Cloudflare Worker script name to evaluate. |
    | `maxSubrequestLimit` | `INT` | `50` | Maximum subrequests allowed per invocation on the Worker plan. |
    | `subrequestThresholdPercent` | `FLOAT` | `80.0` | Percentage of subrequest ceiling triggering proactive exhaustion alerts. |
    | `cloudflareApiToken` | `SECRET` | `None` | Encrypted Cloudflare API token with Analytics Read permissions. |
    | `slackWebhookUri` | `SECRET` | `None` | Encrypted Slack Incoming Webhook endpoint for alerting Edge Infrastructure teams. |

    ## Expected outputs
    Primary execution outputs exported by `export_subrequest_manifest`:
    - `script_name`: Evaluated Cloudflare Worker script identifier.
    - `total_invocations`: Total edge requests processed in evaluation window.
    - `avg_subrequests_per_invocation`: Mean subrequests issued per worker execution.
    - `quota_percent_used`: Percentage of allowed subrequest capacity consumed.
    - `is_quota_breached`: Boolean flag indicating whether quota threshold was breached.

    Example expression: `{{ outputs.export_subrequest_manifest.value.is_quota_breached }}`

    ## Prerequisites
    - An active Cloudflare account with deployed Workers.
    - An API Token with `Account.Analytics:Read` and `Workers Scripts:Read` permissions.
    - A Slack Incoming Webhook URL configured in Kestra secrets.

    ### Secrets
    - `CF_API_TOKEN`: Cloudflare API token.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL.

    ## Quick start
    1. Register your Cloudflare API token in Kestra secrets.
    2. Deploy this flow into your edge operations namespace.
    3. Configure `cloudflareAccountId` and `workerScriptName` with your worker properties.
    4. Run the workflow manually to verify GraphQL analytics querying and telemetry reporting.

    ## Common pitfalls and troubleshooting
    - **GraphQL Analytics Delay**: Cloudflare Analytics GraphQL nodes aggregate data with a 1 to 5-minute sampling delay.
    - **Worker Plan Differences**: Free plans enforce a limit of 50 subrequests per invocation, while Workers Paid supports up to 1,000 subrequests with appropriate configuration.
    - **Zero Invocations**: If a worker receives zero traffic in the 30-minute evaluation window, the sentinel records zero subrequests without triggering false alarms.

    ## How to extend
    - **Automated Cache Rule Deployment**: Trigger an API task to provision Cloudflare Cache Rules or KV namespaces when subrequest volume spikes.
    - **Multi-Worker Portfolio Audit**: Loop over an array of worker scripts deployed across different customer-facing edge zones.
    - **Jira Ticket Integration**: Automatically generate refactoring tickets for developer teams whose edge scripts repeatedly breach 80% quota limits.

    ## Links
    - [Cloudflare Workers Limits Documentation](https://developers.cloudflare.com/workers/platform/limits/)
    - [Cloudflare Analytics GraphQL API](https://developers.cloudflare.com/analytics/graphql-api/)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts/python/io.kestra.plugin.scripts.python.script)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
