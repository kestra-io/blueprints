id: redis-keyspace-hit-rate-sentinel
namespace: company.dataops

inputs:
  - id: redis_host
    type: STRING
    defaults: redis.internal
    description: Hostname of the Redis cache instance.
  - id: redis_port
    type: INT
    defaults: 6379
    description: TCP port of the Redis cache instance.
  - id: min_hit_rate_percent_threshold
    type: FLOAT
    defaults: 80.0
    description: Minimum acceptable cache hit rate percentage before alerting.

tasks:
  - id: inspect_keyspace_stats
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install redis kestra
    env:
      REDIS_HOST: "{{ inputs.redis_host }}"
      REDIS_PORT: "{{ inputs.redis_port }}"
      REDIS_PASSWORD: "{{ secret('REDIS_PASSWORD') }}"
      MIN_HIT_RATE_THRESHOLD: "{{ inputs.min_hit_rate_percent_threshold }}"
    script: |
      import os
      import sys
      import redis
      from kestra import Kestra

      host = os.environ.get("REDIS_HOST", "redis.internal")
      port = int(os.environ.get("REDIS_PORT", "6379"))
      password = os.environ.get("REDIS_PASSWORD") or None
      threshold = float(os.environ.get("MIN_HIT_RATE_THRESHOLD", "80.0"))

      try:
          r = redis.Redis(host=host, port=port, password=password, socket_connect_timeout=10, socket_timeout=10)
          info = r.info("stats")
      except Exception as e:
          print(f"Error querying Redis stats at {host}:{port}: {e}", file=sys.stderr)
          sys.exit(1)

      hits = int(info.get("keyspace_hits", 0))
      misses = int(info.get("keyspace_misses", 0))
      total = hits + misses
      hit_rate = (hits / total * 100.0) if total > 0 else 100.0
      alert_triggered = hit_rate < threshold

      print(f"Redis hit rate audit: hits={hits}, misses={misses}, total={total}, hit_rate={round(hit_rate, 2)}%, alert={alert_triggered}")
      Kestra.outputs({
          "keyspace_hits": hits,
          "keyspace_misses": misses,
          "total_lookups": total,
          "hit_rate_pct": round(hit_rate, 2),
          "alert_triggered": alert_triggered
      })

  - id: evaluate_cache_efficiency
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_keyspace_stats.vars.alert_triggered }}"
    then:
      - id: alert_cache_degradation
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":chart_with_downwards_trend: *Redis Cache Efficiency Alert*: Cache hit rate on {{ inputs.redis_host }} dropped to {{ outputs.inspect_keyspace_stats.vars.hit_rate_pct }}% (threshold: {{ inputs.min_hit_rate_percent_threshold }}%). Upstream databases may experience increased load."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Redis Sentinel Execution Failure*: Failed to query keyspace stats from {{ inputs.redis_host }}."
      }

triggers:
  - id: scheduled_hit_rate_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

outputs:
  - id: hit_rate_pct
    type: FLOAT
    value: "{{ outputs.inspect_keyspace_stats.vars.hit_rate_pct }}"
  - id: keyspace_hits
    type: INT
    value: "{{ outputs.inspect_keyspace_stats.vars.keyspace_hits }}"
  - id: keyspace_misses
    type: INT
    value: "{{ outputs.inspect_keyspace_stats.vars.keyspace_misses }}"
  - id: total_lookups
    type: INT
    value: "{{ outputs.inspect_keyspace_stats.vars.total_lookups }}"
  - id: alert_triggered
    type: BOOLEAN
    value: "{{ outputs.inspect_keyspace_stats.vars.alert_triggered }}"

extend:
  metaDescription: "Audits Redis keyspace stats and detects sudden drops in cache hit ratio to prevent database overload."
  metaTitle: Redis Keyspace Hit Rate and Cache Efficiency Sentinel with Kestra
  title: Redis Keyspace Hit Rate and Cache Efficiency Sentinel
  shortDescription: Audits Redis keyspace stats and detects sudden drops in cache hit ratio to prevent database overload.
  description: |
    ## How it works
    This sentinel evaluates Redis keyspace metrics via `redis-cli` by querying `INFO stats`. It extracts cumulative keyspace hits and misses, calculates the operational hit ratio percentage, and fires alerts when cache eviction or application misconfiguration leads to high miss rates.

    ## What you get
    - Continuous programmatic monitoring of caching layer performance.
    - Early warning against cache penetration, stamping, or premature key eviction.
    - Actionable Slack notifications including exact hit percentages and lookup counts.

    ## Who it's for
    - Application performance engineers and backend developers optimizing database caching.
    - SREs preventing cache-stampede incidents on downstream relational databases.

    ## Why orchestrate this with Kestra
    Kestra runs automated scheduled health sentinels across modern data stacks, providing declarative pipeline orchestration and unified incident notification in a single pane.

    ## Prerequisites
    - Redis server access on configured port.
    - Secrets `REDIS_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `redis_host` and threshold percentages.
    3. Run manually to evaluate current cache efficiency.

    ## How to extend
    - Query `INFO memory` to detect maxmemory eviction policies correlating with cache drops.
    - Inspect slowlog entries via `SLOWLOG GET 10` when hit rate drops suddenly.
    - Track key TTL distributions to optimize cache expiration windows.

    ## Links
    - [Kestra Redis Plugin Documentation](https://kestra.io/plugins/plugin-redis)
    - [Redis INFO Documentation](https://redis.io/commands/info/)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
