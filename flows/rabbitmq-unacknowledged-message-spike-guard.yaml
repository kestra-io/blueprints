id: rabbitmq-unacknowledged-message-spike-guard
namespace: company.team

inputs:
  - id: rabbitmq_host
    type: STRING
    defaults: "http://rabbitmq.internal:15672"
    description: "Base URL for the RabbitMQ Management HTTP API."

  - id: rabbitmq_vhost
    type: STRING
    defaults: "%2F"
    description: "Target URL-encoded virtual host name to inspect (default is %2F for /)."

  - id: unacked_message_threshold
    type: INT
    defaults: 500
    description: "Maximum allowable unacknowledged messages per queue before triggering an operational alert."

  - id: slack_webhook_url
    type: STRING
    defaults: "{{ secret('SLACK_WEBHOOK_URL') }}"
    description: "Slack Incoming Webhook URL for operational incident dispatch."

tasks:
  - id: fetch_queue_metrics
    type: io.kestra.plugin.core.http.Request
    uri: "{{ inputs.rabbitmq_host }}/api/queues/{{ inputs.rabbitmq_vhost }}"
    method: GET
    headers:
      Authorization: "Basic {{ secret('RABBITMQ_MANAGEMENT_BASIC_AUTH') }}"
      Accept: "application/json"

  - id: analyze_unacknowledged_spikes
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    inputFiles:
      queues.json: "{{ outputs.fetch_queue_metrics.body }}"
    outputFiles:
      - metrics_summary.json
    script: |
      import json
      from kestra import Kestra

      with open("queues.json", "r", encoding="utf-8") as f:
          queues = json.load(f)

      threshold = int("{{ inputs.unacked_message_threshold }}")
      spiked_queues = []
      total_unacked = 0

      for q in queues:
          name = q.get("name", "unknown")
          messages_unacknowledged = q.get("messages_unacknowledged", 0)
          messages_ready = q.get("messages_ready", 0)
          consumers = q.get("consumers", 0)
          memory = q.get("memory", 0)
          total_unacked += messages_unacknowledged

          if messages_unacknowledged > threshold:
              spiked_queues.append({
                  "queue": name,
                  "unacked_count": messages_unacknowledged,
                  "ready_count": messages_ready,
                  "active_consumers": consumers,
                  "memory_bytes": memory
              })

      spike_detected = len(spiked_queues) > 0

      summary = {
          "total_queues_scanned": len(queues),
          "total_unacknowledged_messages": total_unacked,
          "spiked_queues_count": len(spiked_queues),
          "spiked_queues": spiked_queues,
          "spike_detected": spike_detected
      }

      with open("metrics_summary.json", "w", encoding="utf-8") as f:
          json.dump(summary, f, indent=2)

      Kestra.outputs({
          "spike_detected": spike_detected,
          "spiked_count": len(spiked_queues),
          "total_unacked": total_unacked,
          "top_offender": spiked_queues[0]["queue"] if spiked_queues else "none"
      })

  - id: evaluate_spike_condition
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.analyze_unacknowledged_spikes.vars.spike_detected }}"
    then:
      - id: notify_slack_unacked_spike
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ inputs.slack_webhook_url }}"
        payload: |
          {
            "text": "RabbitMQ Unacknowledged Message Spike Alert: Found {{ outputs.analyze_unacknowledged_spikes.vars.spiked_count }} queues exceeding threshold (Total unacked: {{ outputs.analyze_unacknowledged_spikes.vars.total_unacked }}). Primary queue affected: {{ outputs.analyze_unacknowledged_spikes.vars.top_offender }}."
          }

  - id: log_broker_health_summary
    type: io.kestra.plugin.core.log.Log
    message: "RabbitMQ audit completed. Total unacked messages: {{ outputs.analyze_unacknowledged_spikes.vars.total_unacked }}. Offending queues count: {{ outputs.analyze_unacknowledged_spikes.vars.spiked_count }}."

triggers:
  - id: audit_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "RabbitMQ Unacknowledged Message Spike Guard"
  shortDescription: "Monitors RabbitMQ queues for stuck unacknowledged messages and alerts on consumer starvation."
  metaTitle: "RabbitMQ Unacknowledged Message Spike Guard | Kestra Blueprint"
  metaDescription: "Audits RabbitMQ Management API for unacknowledged message spikes and alerts engineering teams to hung worker consumers via Slack."
  tags:
    - Infrastructure
    - Cloud
    - System
  ee: false
  demo: false
  description: |
    ### What It Does
    This blueprint monitors RabbitMQ clusters via the Management HTTP API to identify queues with excessive unacknowledged messages. High counts of unacknowledged messages typically signal hung consumer processes, deadlocks in worker threads, or missing acknowledgments in worker logic, which eventually leads to broker memory exhaustion and pipeline backpressure.

    ### Prerequisites
    - RabbitMQ cluster with the Management plugin enabled (accessible over HTTP/HTTPS).
    - Basic Auth credentials configured as secret `RABBITMQ_MANAGEMENT_BASIC_AUTH` (base64-encoded `username:password`).
    - Slack Incoming Webhook configured as secret `SLACK_WEBHOOK_URL`.

    ### Quick Start
    1. Set the target RabbitMQ host and virtual host name in inputs.
    2. Adjust `unacked_message_threshold` according to your application queue SLA.
    3. Run manually or allow the 15-minute cron schedule to run continuously.

    ### Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `rabbitmq_host` | STRING | `http://rabbitmq.internal:15672` | Management HTTP API base endpoint |
    | `rabbitmq_vhost` | STRING | `%2F` | URL-encoded virtual host name |
    | `unacked_message_threshold` | INT | `500` | Alert threshold for unacknowledged count |
    | `slack_webhook_url` | STRING | `{{ secret('SLACK_WEBHOOK_URL') }}` | Slack alert destination |

    ### Expected Outputs
    - `outputs.analyze_unacknowledged_spikes.vars.spike_detected`: Boolean indicating whether any queue crossed the threshold.
    - `outputs.analyze_unacknowledged_spikes.vars.total_unacked`: Total count of unacknowledged messages across all scanned queues.
    - `outputs.analyze_unacknowledged_spikes.outputFiles['metrics_summary.json']`: Detailed JSON diagnostic report.

    ### Common Pitfalls
    - Virtual host names containing forward slashes must be URL-encoded (e.g., `%2F` for default root vhost).
    - RabbitMQ management API requires read-only or administrator tags on the authentication user account.
