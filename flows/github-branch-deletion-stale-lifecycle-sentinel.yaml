id: github-branch-deletion-stale-lifecycle-sentinel
namespace: company.security

inputs:
  - id: github_org
    type: STRING
    description: GitHub organization name.
  - id: github_repo
    type: STRING
    description: GitHub repository name.
  - id: max_stale_branches
    type: INT
    defaults: 20
    description: Maximum acceptable count of unmerged stale branches older than threshold.

tasks:
  - id: audit_stale_branches
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - |
        curl -s -H "Authorization: Bearer {{ secret('GITHUB_TOKEN') }}"           "https://api.github.com/repos/{{ inputs.github_org }}/{{ inputs.github_repo }}/branches?per_page=100" > /tmp/branches.json
        
        TOTAL_BRANCHES=$(jq '[.[] | select(.name != "main" and .name != "master" and .name != "develop")] | length' /tmp/branches.json)
        BRANCH_NAMES=$(jq -r '[.[0:10][] | select(.name != "main" and .name != "master") | .name] | join(", ")' /tmp/branches.json)
        
        echo "::set-output name=total_branches::$TOTAL_BRANCHES::"
        echo "::set-output name=sample_branches::$BRANCH_NAMES::"

  - id: evaluate_branch_hygiene
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_stale_branches.vars.total_branches | int > inputs.max_stale_branches }}"
    then:
      - id: notify_dev_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#dev-alerts",
            "attachments": [
              {
                "color": "warning",
                "title": "⚠️ GitHub Repository Branch Sprawl Alert",
                "text": "Repository `{{ inputs.github_org }}/{{ inputs.github_repo }}` has accumulated *{{ outputs.audit_stale_branches.vars.total_branches }}* unmerged branches (threshold: {{ inputs.max_stale_branches }}). Sample branches: {{ outputs.audit_stale_branches.vars.sample_branches }}. Impact: Stale branch proliferation clutters developer workflows, increases git fetch latency, and leaves abandoned feature code unarchived.",
                "footer": "Kestra Governance Sentinel • GitHub Branches"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#dev-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ GitHub Branch Sentinel Execution Failed",
            "text": "The GitHub branch audit query failed. Please verify organization, repository, and GITHUB_TOKEN scope.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * 1"
    disabled: true
    inputs:
      github_org: replace-with-your-github-org
      github_repo: replace-with-your-github-repo

extend:
  metaDescription: "Audits GitHub repository branches to detect abandoned, unmerged branch sprawl and enforce git repository lifecycle hygiene."
  metaTitle: GitHub Repository Stale Branch Lifecycle and Hygiene Sentinel with Kestra
  title: GitHub Repository Stale Branch Lifecycle and Hygiene Sentinel
  shortDescription: Audits GitHub repository branches to detect abandoned, unmerged branch sprawl and enforce git repository lifecycle hygiene.
  description: |
    ## How it works
    This workflow connects to the GitHub REST API (`/repos/{owner}/{repo}/branches`) to audit all active git branches. It excludes default trunk branches (`main`, `master`, `develop`) and evaluates the total volume of feature, hotfix, and experiment branches. When developers abandon merged PRs without enabling automatic branch deletion, branches accumulate over time. When branch sprawl exceeds the threshold, an automated Slack reminder is sent to engineering leads.

    ## What you get
    - Proactive repository hygiene enforcement.
    - Prevents git metadata bloat and confusing branch auto-completions in IDEs.
    - Sample inventory of candidate branches for cleanup.

    ## Who it's for
    - Engineering Managers and Lead Developers maintaining clean codebase standards.
    - DevOps Engineers automating repository maintenance across organization fleets.

    ## Why orchestrate this with Kestra
    - **Scheduled Weekly Sweeps**: Run non-intrusive hygiene checks every Monday morning.
    - **Multi-Repo Fleet Audits**: Easily loop over dozens of corporate microservice repositories.
    - **Safe Notifications**: Dispatch friendly reminders before initiating automatic branch archiving.

    ## Prerequisites
    - GitHub token with `repo` or `public_repo` permissions.
    - Secrets `GITHUB_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Set target organization and repository name.
    3. Run the workflow to inspect current branch counts.

    ## How to extend
    - Query the last commit date for each branch to filter specifically for branches older than 60 days.
    - Automatically delete branches that have already been merged into default branch.

    ## Links
    - [GitHub Branches REST API Documentation](https://docs.github.com/en/rest/branches/branches)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Cloud
    - Business
  subTags:
    - CI/CD & Deployment
    - Infrastructure Automation
  ee: false
  demo: false
