id: noaa-metar-weather-observation-delta-loader
namespace: company.data

description: |
  Poll the National Oceanic and Atmospheric Administration (NOAA) / National Weather Service (NWS)
  API for surface aviation weather observations (METAR) across key airfield stations,
  parse temperature, wind gusts, and barometric pressure anomalies into columnar Parquet using DuckDB,
  track station state in Kestra KV store, and route extreme weather conditions to operations.

inputs:
  - id: stations
    type: JSON
    description: List of ICAO weather station identifiers to monitor for surface conditions.
    defaults: |
      [
        {"station_id": "KORD", "name": "Chicago O'Hare Intl"},
        {"station_id": "KJFK", "name": "New York JFK Intl"},
        {"station_id": "KLAX", "name": "Los Angeles Intl"},
        {"station_id": "KDFW", "name": "Dallas Fort Worth Intl"},
        {"station_id": "KATL", "name": "Atlanta Hartsfield-Jackson"}
      ]

  - id: wind_gust_threshold_kmh
    type: INT
    defaults: 65
    description: Wind speed or gust velocity threshold in km/h triggering high-wind alerts.

  - id: state_key
    type: STRING
    defaults: noaa_metar_last_timestamp_state
    description: Kestra KV store key maintaining the latest observation timestamp per station.

concurrency:
  limit: 1
  behavior: CANCEL

triggers:
  - id: scheduled_observation_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    description: Poll station observations every 30 minutes.

tasks:
  - id: fetch_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_metar
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install duckdb requests
    env:
      STATIONS_JSON: "{{ inputs.stations }}"
      WIND_THRESHOLD: "{{ inputs.wind_gust_threshold_kmh }}"
      LAST_STATE: "{{ outputs.fetch_state.value ?? '{}' }}"
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import requests
        import duckdb

        stations = json.loads(os.environ.get("STATIONS_JSON", "[]"))
        wind_threshold = float(os.environ.get("WIND_THRESHOLD", 65))
        state = json.loads(os.environ.get("LAST_STATE", "{}"))

        headers = {"User-Agent": "Kestra-NOAA-Ingest/2.0 (contact@company.internal)"}
        observations = []
        new_state = dict(state)

        for s in stations:
            station_id = s.get("station_id")
            station_name = s.get("name", station_id)
            url = f"https://api.weather.gov/stations/{station_id}/observations/latest"
            try:
                resp = requests.get(url, headers=headers, timeout=20)
                if resp.status_code == 200:
                    data = resp.json()
                    props = data.get("properties", {})
                    ts = props.get("timestamp")
                    
                    temp = props.get("temperature", {}).get("value")
                    wind_speed = props.get("windSpeed", {}).get("value")
                    wind_gust = props.get("windGust", {}).get("value")
                    pressure = props.get("barometricPressure", {}).get("value")
                    visibility = props.get("visibility", {}).get("value")
                    desc = props.get("textDescription", "Normal")

                    effective_wind = wind_gust if wind_gust is not None else (wind_speed if wind_speed is not None else 0.0)

                    observations.append({
                        "station_id": station_id,
                        "station_name": station_name,
                        "observation_time": ts,
                        "temperature_c": temp,
                        "wind_speed_kmh": wind_speed,
                        "wind_gust_kmh": wind_gust,
                        "effective_wind_kmh": effective_wind,
                        "pressure_pa": pressure,
                        "visibility_m": visibility,
                        "weather_summary": desc
                    })
                    new_state[station_id] = ts
            except Exception as e:
                print(f"Warning: Failed to fetch observations for {station_id}: {e}")

        with open("observations.json", "w", encoding="utf-8") as f:
            json.dump(observations, f)

        con = duckdb.connect()
        if observations:
            con.execute("CREATE TABLE metar AS SELECT * FROM read_json_auto('observations.json')")
            con.execute("COPY metar TO 'observations.parquet' (FORMAT PARQUET)")
            con.execute("COPY metar TO 'observations.csv' (HEADER, DELIMITER ',')")
            
            severe_weather = con.execute(f"""
                SELECT station_id, station_name, effective_wind_kmh, weather_summary
                FROM metar
                WHERE effective_wind_kmh >= {wind_threshold}
            """).df()
            severe_alerts = severe_weather.to_dict(orient="records")
        else:
            con.execute("""
                CREATE TABLE metar (
                    station_id VARCHAR,
                    station_name VARCHAR,
                    observation_time VARCHAR,
                    temperature_c DOUBLE,
                    wind_speed_kmh DOUBLE,
                    wind_gust_kmh DOUBLE,
                    effective_wind_kmh DOUBLE,
                    pressure_pa DOUBLE,
                    visibility_m DOUBLE,
                    weather_summary VARCHAR
                )
            """)
            con.execute("COPY metar TO 'observations.parquet' (FORMAT PARQUET)")
            con.execute("COPY metar TO 'observations.csv' (HEADER, DELIMITER ',')")
            severe_alerts = []

        summary = {
            "stations_polled": len(observations),
            "severe_conditions_detected": len(severe_alerts),
            "severe_alerts": severe_alerts,
            "updated_state": new_state
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - observations.parquet
      - observations.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_metar.vars.updated_state | toJson }}"

  - id: check_severe_weather
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_metar.vars.severe_conditions_detected > 0 }}"
    then:
      - id: warn_operations
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "⚠️ Severe Aviation Weather Detected: {{ outputs.ingest_and_transform_metar.vars.severe_conditions_detected }} airfield station(s) recorded wind velocity exceeding {{ inputs.wind_gust_threshold_kmh }} km/h."

outputs:
  - id: polled_count
    type: INT
    value: "{{ outputs.ingest_and_transform_metar.vars.stations_polled }}"
  - id: severe_count
    type: INT
    value: "{{ outputs.ingest_and_transform_metar.vars.severe_conditions_detected }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_metar.outputFiles['observations.parquet'] }}"

extend:
  title: NOAA Surface Weather Observation Delta Loader with DuckDB
  metaTitle: NOAA METAR Weather Observation Delta Loader | Kestra
  shortDescription: Ingests NOAA/NWS surface weather observations across airfield stations into Parquet via DuckDB with high-wind alerts.
  metaDescription: Poll NOAA METAR observations, normalize temperature and wind into Parquet with DuckDB, maintain KV state, and alert on wind gusts.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Orchestrate automated, reliable synchronization of live surface weather observations (METAR)
    from the National Oceanic and Atmospheric Administration (NOAA) and National Weather Service (NWS)
    APIs directly into analytical Parquet storage using DuckDB.

    ## How it works

    1. **State Recovery**: Reads previous observation timestamps from Kestra KV store (`noaa_metar_last_timestamp_state`) to maintain ingestion state across runs.
    2. **Station Polling**: Concurrently queries the official NWS REST API endpoint (`api.weather.gov/stations/{id}/observations/latest`) for configured airfield stations.
    3. **DuckDB Lakehouse Normalization**: Converts raw JSON sensor observations (temperature, barometric pressure, wind speed, gust velocities) into standardized schemas.
    4. **Analytical Export**: Generates columnar Parquet and CSV dataset files ready for downstream lakehouse and analytics tooling.
    5. **Extreme Condition Triage**: Flags dangerous wind gust velocities exceeding operational thresholds and emits operational warnings.

    ## What you get

    - Automated recurring ingestion of verified federal meteorological observations without API keys or rate charges.
    - Columnar Parquet datasets optimized for historical weather trend analysis and flight dispatch planning.
    - Built-in threshold alerting directing operations teams to stations experiencing severe weather.

    ## Who it's for

    - Aviation and logistics operations teams tracking runway and shipping terminal wind hazards.
    - Weather analytics engineers compiling clean environmental feature stores.
    - Supply chain coordinators monitoring regional hub transit risks.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains observation timestamps across station networks without database infrastructure.
    - Ephemeral Docker runner keeps ingestion dependencies completely isolated and reproducible.
    - Declarative flow control and conditionals eliminate complex custom polling scripts.

    ## Prerequisites

    - Docker runtime configured for Kestra task runners.
    - Internet connectivity from the Kestra worker to `api.weather.gov`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for forwarding high-wind alert notifications.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Adjust the `stations` input array with desired airport ICAO identifiers.
    3. Click **Execute** to run an immediate observation harvest.
    4. Enable the `scheduled_observation_sync` trigger for 30-minute automated refreshes.

    ## How to extend

    - Add an S3 or Google Cloud Storage task to archive daily Parquet partitions.
    - Connect downstream BI tools to visualize station pressure and temperature differentials over time.

    ## Links

    - [National Weather Service API Documentation](https://www.weather.gov/documentation/services-web-api)
    - [DuckDB Parquet Export Documentation](https://duckdb.org/docs/data/parquet/overview.html)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
