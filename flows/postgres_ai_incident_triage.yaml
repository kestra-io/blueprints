id: postgres_ai_incident_triage
namespace: company.analytics

extend:
  title: Postgres Transaction Log Incident Triage Pipeline
  metaTitle: Automated Database Incident Triage & Slack Alerting | Kestra
  shortDescription: Extract failure logs, calculate error threshold severities via Python, and route between Slack alerts or health logging.
  metaDescription: Reusable Kestra blueprint for SQL database log extraction, Python anomaly detection, Slack webhook alerts, and flow control.
  tags: Data
  subTags: Monitoring & Alerting
  ee: false
  demo: false
  description: |
    Automated operational pipeline that extracts unverified failure logs from a PostgreSQL database, executes Python-based anomaly and error threshold analysis, and dynamically routes alerts via conditional branching.

    ## How it works
    1. **Trigger:** The flow runs on a scheduled hourly cron trigger (`io.kestra.plugin.core.trigger.Schedule`).
    2. **Extraction:** The PostgreSQL query task (`io.kestra.plugin.jdbc.postgresql.Query`) fetches pending error logs from the database table.
    3. **Python Processing:** An inline Python script evaluates log severity levels, counting critical error codes and returning structured output variables via `Kestra.outputs`.
    4. **Flow Control:** An `If` conditional task (`io.kestra.plugin.core.flow.If`) inspects the evaluated severity metric.
    5. **Branching Action:** If severity is marked critical, a webhook alert is dispatched to a Slack channel; otherwise, a clean status log is recorded.

    ## What you get
    - Elimination of silent failure risks through declarative scheduling and error tracking.
    - Automated severity scoring that filters out noise and flags critical incidents instantly.
    - Visual execution graph for debugging and audit logging in Kestra.

    ## Who it's for
    Analytics Engineers, Platform Reliability Engineers, and Backend Developers.

    ## Why orchestrate this with Kestra
    Replacing fragile shell scripts and cron jobs with Kestra provides built-in retries, secret masking, explicit state management, and an intuitive UI execution topology.

    ## Prerequisites
    * PostgreSQL database service containing operational log tables.
    * Active Slack workspace with an Incoming Webhook URL configured.

    ### Secrets
    * `DB_URL`: JDBC connection string for the target PostgreSQL database.
    * `DB_USER`: Authorized username for database connection.
    * `DB_PASSWORD`: Password credential for database authentication.
    * `SLACK_WEBHOOK_URL`: Target webhook URL for Slack incident alerts.

    ## Quick start
    1. Configure required connection secrets in your Kestra namespace settings.
    2. Import this blueprint YAML into your Kestra instance and click **Execute** with test inputs.
    3. Verify task execution logs and activate the hourly schedule trigger.

    ## How to extend
    * Add an S3 file upload task inside the `else` block to archive normal health reports.
    * Integrate PagerDuty or Microsoft Teams webhooks alongside Slack for multi-channel incident response.

    ## Links
    * [Kestra PostgreSQL Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-postgresql)
    * [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-script-python)
    * [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-notifications)

triggers:
  - id: hourly_triage_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"

tasks:
  - id: extract_pending_logs
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "{{ secret('DB_URL') }}"
    username: "{{ secret('DB_USER') }}"
    password: "{{ secret('DB_PASSWORD') }}"
    fetchType: FETCH
    sql: "SELECT id, status, error_message, created_at FROM system_logs WHERE status = 'ERROR' AND processed = FALSE LIMIT 50;"

  - id: compute_anomaly_metrics
    type: io.kestra.plugin.scripts.python.Script
    inputFiles:
      raw_logs.json: "{{ outputs.extract_pending_logs.rows }}"
    script: |
      import json
      from kestra import Kestra

      with open('raw_logs.json', 'r') as f:
          data = json.load(f)

      critical_count = sum(1 for row in data if "CRITICAL" in str(row.get("error_message", "")).upper())
      total_errors = len(data)

      severity = "CRITICAL" if critical_count > 0 or total_errors >= 10 else "NORMAL"

      Kestra.outputs({
          "total_errors": total_errors,
          "critical_count": critical_count,
          "severity": severity
      })

  - id: evaluate_severity_branch
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.compute_anomaly_metrics.vars.severity == 'CRITICAL' }}"
    then:
      - id: notify_slack_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🚨 *Critical Incident Alert*: {{ outputs.compute_anomaly_metrics.vars.critical_count }} critical errors detected out of {{ outputs.compute_anomaly_metrics.vars.total_errors }} raw logs."
          }
    else:
      - id: log_healthy_status
        type: io.kestra.plugin.core.log.Log
        message: "Pipeline completed cleanly. Operational metrics within safe bounds."