id: postgres_ai_incident_triage
namespace: company.ai

triggers:
  - id: hourly_triage_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"

tasks:
  - id: extract_pending_logs
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "{{ secret('DB_URL') }}"
    username: "{{ secret('DB_USER') }}"
    password: "{{ secret('DB_PASSWORD') }}"
    sql: "SELECT id, status, error_message, created_at FROM system_logs WHERE status = 'ERROR' AND processed = FALSE LIMIT 50;"

  - id: compute_anomaly_metrics
    type: io.kestra.plugin.scripts.python.Script
    inputFiles:
      raw_logs.json: "{{ outputs.extract_pending_logs.uri }}"
    script: |
      import json, sys
      with open('raw_logs.json') as f:
          logs = json.load(f)
      
      critical_count = sum(1 for l in logs if "CRITICAL" in l.get("error_message", ""))
      severity = "CRITICAL" if critical_count > 0 or len(logs) > 10 else "NORMAL"
      
      import io.kestra.Kestra as Kestra
      Kestra.outputs({"severity": severity, "critical_count": critical_count, "total_logs": len(logs)})

  - id: evaluate_severity_branch
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.compute_anomaly_metrics.vars.severity == 'CRITICAL' }}"
    then:
      - id: notify_slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🚨 *PostgreSQL Incident Detected!*\n*Severity:* CRITICAL\n*Unresolved Errors:* {{ outputs.compute_anomaly_metrics.vars.critical_count }}\n👉 Review & Approve Remediation in Kestra UI"
          }

      - id: wait_for_human_approval
        type: io.kestra.plugin.core.flow.Pause
        description: "Pause workflow execution to require operator approval before running database remediation."
        onResume:
          - id: approved
            type: BOOL
            description: "Approve executing automated database remediation query?"
            defaults: true
          - id: reason
            type: STRING
            description: "Operator reason or notes for the decision"

      - id: check_approval_decision
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.wait_for_human_approval.onResume.approved == true }}"
        then:
          - id: execute_remediation_query
            type: io.kestra.plugin.jdbc.postgresql.Query
            url: "{{ secret('DB_URL') }}"
            username: "{{ secret('DB_USER') }}"
            password: "{{ secret('DB_PASSWORD') }}"
            sql: "UPDATE system_logs SET processed = TRUE WHERE status = 'ERROR' AND processed = FALSE;"

          - id: log_remediation_success
            type: io.kestra.plugin.core.log.Log
            message: "Successfully executed remediation query. Incident logs marked as processed."
        else:
          - id: log_remediation_cancelled
            type: io.kestra.plugin.core.log.Log
            message: "Remediation aborted by operator. Reason: {{ outputs.wait_for_human_approval.onResume.reason }}"
    else:
      - id: log_normal_status
        type: io.kestra.plugin.core.log.Log
        message: "Operational logs are healthy. No incident remediation required."

extend:
  title: Automated Database Incident Triage & Human-in-the-Loop Remediation
  metaTitle: PostgreSQL AI Incident Triage & Human-in-the-Loop Remediation | Kestra
  shortDescription: Continuously polls PostgreSQL error logs, analyzes incident severity, routes alerts, and gates automated remediation on human approval.
  metaDescription: Automated PostgreSQL error log ingestion and Python anomaly scoring with Pause task approval gates for incident remediation.
  description: |
    Automated incident management workflow that bridges database telemetry monitoring with human-in-the-loop operational guardrails.
    
    ## How it works
    1. Scheduled hourly execution pulls up to 50 unprocessed database error records from PostgreSQL.
    2. Python script computes failure frequencies and flags critical anomalies.
    3. Conditional `If` task routes critical anomalies to Slack alerts and pauses workflow execution.
    4. Operator reviews the incident summary and approves or rejects the remediation in the Kestra UI.
    5. On approval, automated remediation updates database records; otherwise, execution logs the operator's rejection reason.
    
    ## What you get
    - Real-time incident alert routing to Slack.
    - Zero-risk automated remediation backed by human approval gates.
    - Complete execution audit trailing in Kestra.
    
    ## Who it's for
    - Database Administrators (DBAs)
    - Reliability Engineers & DevOps Teams
    - Platform Engineers
    
    ## Why orchestrate this with Kestra
    - Native `Pause` tasks provide declarative human-in-the-loop governance.
    - Full variable passing across SQL, Python, and webhook notifications.
    - Centralized secret management and visual execution lineage.
    
    ## Prerequisites
    - PostgreSQL database access.
    - Slack incoming webhook endpoint.
    
    ### Secrets
    `DB_URL`: PostgreSQL connection string.
    `DB_USER`: Database username.
    `DB_PASSWORD`: Database password.
    `SLACK_WEBHOOK_URL`: Incoming webhook for Slack alerting.
    
    ## Quick start
    1. Configure `DB_URL`, `DB_USER`, `DB_PASSWORD`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this blueprint and click **Execute**.
    3. When triggered, open the execution UI to review and respond to the approval prompt.
    
    ## How to extend
    - Add custom PagerDuty or Opsgenie webhook tasks alongside Slack alerts.
    - Extend the remediation step to cancel blocking PostgreSQL backend queries (`pg_cancel_backend`).
    
    ## Links
    - [Kestra PostgreSQL Plugin Docs](https://kestra.io/plugins/plugin-jdbc-postgresql)
    - [Kestra Pause Task Docs](https://kestra.io/plugins/core/tasks/flows/io.kestra.plugin.core.flow.pause)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false