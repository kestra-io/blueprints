id: cosmosdb-expired-document-retention-gate
namespace: company.team

description: |
  Query a Cosmos DB container for documents that should have expired by their own expiry_field
  but are still present, classify the run COMPLIANT, WARNING, CRITICAL or PROBE_FAILED from the
  real count returned, alert Slack with that count, and optionally delete the lingering
  documents one by one behind a dry_run gate, then re-query to verify they are gone.

inputs:
  - id: database_id
    type: STRING
    displayName: Cosmos database ID
    description: Target Cosmos database name. Maps to the Query and Delete tasks' databaseId field.
    defaults: "compliance_db"

  - id: container_id
    type: STRING
    displayName: Cosmos container ID
    description: Target container (collection) name inside the database. Maps to the Query and Delete tasks' containerId field. This blueprint assumes the container's partition key is /id.
    defaults: "customer_records"

  - id: expiry_field
    type: STRING
    displayName: Expiry field name
    description: Document field holding an ISO-8601 timestamp of when the document should have been purged, for example by application-level retention policy or a TTL that did not fire.
    defaults: "expiresAt"

  - id: grace_period_minutes
    type: INT
    displayName: Grace period in minutes
    description: Minutes past expiry_field a document is still tolerated before counting as a violation, to absorb normal purge latency.
    defaults: 60

  - id: violation_count_critical_threshold
    type: INT
    displayName: Critical violation count threshold
    description: Violation count at or above which the run is classified CRITICAL instead of WARNING.
    defaults: 50

  - id: remediation_action
    type: SELECT
    displayName: Remediation action
    description: What remediate_gate does with the violating documents when it runs. log_only never deletes anything, delete removes each violating document one by one.
    values:
      - "log_only"
      - "delete"
    defaults: "log_only"

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    description: When true, together with dry_run false and remediation_action delete, remove every violating document found.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate true, for a delete to actually run.
    defaults: true

tasks:
  - id: probe_violations
    type: io.kestra.plugin.azure.storage.cosmosdb.Query
    description: Read-only. Finds every document whose expiry_field is in the past by more than grace_period_minutes. allowFailure keeps the flow going so an unreachable account can still be classified as PROBE_FAILED below.
    allowFailure: true
    connectionString: "{{ secret('COSMOS_CONNECTION_STRING') }}"
    databaseId: "{{ inputs.database_id }}"
    containerId: "{{ inputs.container_id }}"
    query: |
      SELECT c.id, c.{{ inputs.expiry_field }} FROM c WHERE IS_DEFINED(c.{{ inputs.expiry_field }}) AND c.{{ inputs.expiry_field }} < "{{ now() | dateAdd(-inputs.grace_period_minutes, 'MINUTES') | date("yyyy-MM-dd'T'HH:mm:ss'Z'") }}"

  - id: classify_retention_status
    type: io.kestra.plugin.core.debug.Return
    description: PROBE_FAILED when the probe produced no output at all, CRITICAL or WARNING when it found violations past or under the threshold, COMPLIANT when it found none.
    format: "{{ outputs.probe_violations is not defined ? 'PROBE_FAILED' : ((outputs.probe_violations.queryResults | length) == 0 ? 'COMPLIANT' : ((outputs.probe_violations.queryResults | length) >= inputs.violation_count_critical_threshold ? 'CRITICAL' : 'WARNING')) }}"

  - id: route_by_retention_status
    type: io.kestra.plugin.core.flow.Switch
    description: Branch A logs a compliant container. Branch B alerts Slack when documents lingered past their own expiry or the probe itself failed.
    value: "{{ outputs.classify_retention_status.value }}"
    cases:
      "COMPLIANT":
        - id: log_compliant
          type: io.kestra.plugin.core.log.Log
          message: "No expired documents found in {{ inputs.database_id }}/{{ inputs.container_id }} past the {{ inputs.grace_period_minutes }} minute grace period."
      "WARNING":
        - id: alert_warning
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {{ {"text": "Cosmos retention WARNING on " ~ inputs.database_id ~ "/" ~ inputs.container_id ~ ". " ~ (outputs.probe_violations.queryResults | length) ~ " document(s) are past their " ~ inputs.expiry_field ~ " plus a " ~ inputs.grace_period_minutes ~ " minute grace period and are still present."} | toJson }}
      "CRITICAL":
        - id: alert_critical
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {{ {"text": "Cosmos retention CRITICAL on " ~ inputs.database_id ~ "/" ~ inputs.container_id ~ ". " ~ (outputs.probe_violations.queryResults | length) ~ " document(s) are past their " ~ inputs.expiry_field ~ " plus grace period, at or above the " ~ inputs.violation_count_critical_threshold ~ " threshold."} | toJson }}
      "PROBE_FAILED":
        - id: alert_probe_failed
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {{ {"text": "Cosmos retention probe on " ~ inputs.database_id ~ "/" ~ inputs.container_id ~ " produced no result. Check COSMOS_CONNECTION_STRING and that the database and container exist."} | toJson }}
    defaults:
      - id: log_unhandled_status
        type: io.kestra.plugin.core.log.Log
        message: "Unhandled retention status: {{ outputs.classify_retention_status.value }}"

  - id: remediate_gate
    type: io.kestra.plugin.core.flow.If
    description: Runs only when the probe found violations, auto_remediate is true, dry_run is false, and remediation_action is delete.
    condition: "{{ (outputs.classify_retention_status.value == 'WARNING' or outputs.classify_retention_status.value == 'CRITICAL') and inputs.auto_remediate and not inputs.dry_run and inputs.remediation_action == 'delete' }}"
    then:
      - id: delete_expired_documents
        type: io.kestra.plugin.core.flow.Loop
        description: Deletes each violating document one at a time, assuming the container's partition key is /id.
        concurrencyLimit: 1
        values: "{{ outputs.probe_violations.queryResults | toJson }}"
        tasks:
          - id: delete_expired_document
            type: io.kestra.plugin.azure.storage.cosmosdb.Delete
            allowFailure: true
            connectionString: "{{ secret('COSMOS_CONNECTION_STRING') }}"
            databaseId: "{{ inputs.database_id }}"
            containerId: "{{ inputs.container_id }}"
            item:
              id: "{{ fromJson(item.value).id }}"

      - id: reprobe_violations
        type: io.kestra.plugin.azure.storage.cosmosdb.Query
        allowFailure: true
        connectionString: "{{ secret('COSMOS_CONNECTION_STRING') }}"
        databaseId: "{{ inputs.database_id }}"
        containerId: "{{ inputs.container_id }}"
        query: |
          SELECT c.id, c.{{ inputs.expiry_field }} FROM c WHERE IS_DEFINED(c.{{ inputs.expiry_field }}) AND c.{{ inputs.expiry_field }} < "{{ now() | dateAdd(-inputs.grace_period_minutes, 'MINUTES') | date("yyyy-MM-dd'T'HH:mm:ss'Z'") }}"

      - id: reclassify_retention_status
        type: io.kestra.plugin.core.debug.Return
        format: "{{ outputs.reprobe_violations is not defined ? 'PROBE_FAILED' : ((outputs.reprobe_violations.queryResults | length) == 0 ? 'COMPLIANT' : 'WARNING') }}"

      - id: verify_remediation
        type: io.kestra.plugin.core.flow.If
        description: Fails the flow when violations still remain after the delete loop, so a partial delete is never silently reported as a fix.
        condition: "{{ outputs.reclassify_retention_status.value != 'COMPLIANT' }}"
        then:
          - id: remediation_failed
            type: io.kestra.plugin.core.execution.Fail
            errorMessage: "Delete loop ran, but {{ inputs.database_id }}/{{ inputs.container_id }} still has expired documents."
        else:
          - id: remediated
            type: io.kestra.plugin.core.log.Log
            message: "Deleted and verified. 0 expired documents remain in {{ inputs.database_id }}/{{ inputs.container_id }}."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Final audit log confirming the gate ran, regardless of the branch taken above.
    message: "Cosmos retention gate completed. database={{ inputs.database_id }} container={{ inputs.container_id }} status={{ outputs.classify_retention_status.value }} auto_remediate={{ inputs.auto_remediate }} dry_run={{ inputs.dry_run }}"

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {{ {"text": "Cosmos retention gate flow failed (execution " ~ execution.id ~ "). Check the execution logs."} | toJson }}

triggers:
  - id: six_hourly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled, and always in safe mode by default.
    cron: "0 */6 * * *"
    disabled: true
    inputs:
      database_id: "compliance_db"
      container_id: "customer_records"
      expiry_field: "expiresAt"
      grace_period_minutes: 60
      violation_count_critical_threshold: 50
      remediation_action: "log_only"
      auto_remediate: false
      dry_run: true

extend:
  title: Cosmos DB Expired Document Retention Gate
  shortDescription: Query a Cosmos DB container for documents that should have expired but are still present, classify the run by violation count, alert Slack, and optionally delete them and verify.
  metaTitle: Cosmos DB Expired Document Retention Gate with Kestra
  metaDescription: Audit Cosmos DB containers for documents past their own expiry field, alert Slack on retention violations, and optionally delete and verify.
  description: |
    Cosmos DB's container-level TTL deletes documents in the background, on its own schedule,
    and only if it is configured at all. An application that stamps every document with its own
    `expiresAt` field and assumes TTL will clean it up has no guarantee that actually happens,
    TTL can be disabled on the container, misconfigured, or simply lag under load, and the
    document, its PII, its stale state, just stays there. This blueprint turns that assumption
    into a Day 2 governance gate: it queries for documents whose own `expiresAt` field has
    passed, classifies the real count it finds, alerts Slack, and can delete the stragglers
    itself, then proves they are actually gone.

    ## How it works

    1. `probe_violations` (`io.kestra.plugin.azure.storage.cosmosdb.Query`) runs a cross-partition
       Cosmos SQL query: `SELECT c.id, c.<expiry_field> FROM c WHERE IS_DEFINED(c.<expiry_field>)
       AND c.<expiry_field> < "<now minus grace_period_minutes>"`, with `allowFailure: true` so
       an unreachable account does not stop the flow before it can be classified below.
    2. `classify_retention_status` (`io.kestra.plugin.core.debug.Return`) reads the task's own
       `queryResults` list. `PROBE_FAILED` when `probe_violations` produced no output at all
       (guarded with `is not defined`), `COMPLIANT` when the list is empty, `CRITICAL` when its
       length is at or above `violation_count_critical_threshold`, `WARNING` otherwise.
    3. `route_by_retention_status` (`io.kestra.plugin.core.flow.Switch`) branches on that status:
       - **COMPLIANT**: `log_compliant` logs it.
       - **WARNING**, **CRITICAL**, **PROBE_FAILED**: a `SlackIncomingWebhook` task alerts with
         the exact violation count from `queryResults`, never an invented number.
    4. `remediate_gate` (`io.kestra.plugin.core.flow.If`) runs only when there were violations,
       `auto_remediate` is true, `dry_run` is false, and `remediation_action` is `delete`:
       - `delete_expired_documents` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`)
         calls `io.kestra.plugin.azure.storage.cosmosdb.Delete` once per violating document,
         using only its `id` as the partition key, this blueprint assumes the container's
         partition key is `/id`.
       - `reprobe_violations` runs the identical query again, `reclassify_retention_status`
         reclassifies it, and `verify_remediation` (`io.kestra.plugin.core.flow.If`) fails the
         flow with `io.kestra.plugin.core.execution.Fail` if any violation remains, so a partial
         delete is never silently reported as a fix.
    5. `log_audit_summary` always runs last and logs the final classification.
    6. The `errors` block posts to Slack if the flow itself fails outside the gate logic above.

    ## What you get

    - A real answer to whether expired documents are actually leaving the container, not an
      assumption that TTL is doing its job.
    - A Slack alert carrying the exact violation count from the query itself, never an invented
      number.
    - A safe-by-default delete path: `dry_run: true` and `remediation_action: log_only` ship
      enabled, nothing is deleted until you explicitly set `auto_remediate: true`, `dry_run:
      false`, and `remediation_action: delete`.
    - A verified delete: the flow re-queries after deleting and fails loudly if any violation
      is still there.

    ## Who it's for

    - Data platform and data governance teams who need to prove, on a schedule, that documents
      past their own retention window are actually gone, not just scheduled to be.
    - Teams who stamp documents with an application-level expiry field and cannot fully rely on
      Cosmos container TTL to enforce it.
    - Teams evaluating the Cosmos DB plugin who want a working example of
      `io.kestra.plugin.azure.storage.cosmosdb.Query` and `.Delete` together, including the
      `connectionString` authentication path that works against the local emulator.

    ## Why orchestrate this with Kestra

    Cosmos DB's own TTL has no concept of an application-level expiry field, a violation
    threshold, or an alert explaining what it found. Kestra adds the schedule, the `WARNING`
    versus `CRITICAL` classification built from the query's own row count, the Slack alert, the
    gated delete, and the verification that the delete worked, all as one declarative YAML file
    you can version and review like code.

    ## Prerequisites

    - A Cosmos DB account (or the local emulator, see below) with a database and container
      whose documents carry an `expiry_field` such as `expiresAt`.
    - Local testing with the official Linux Cosmos DB emulator, no Azure account needed:

      ```
      docker run --detach --name cosmos-emulator \\
        --publish 8081:8081 --publish 8082:8080 --publish 1234:1234 \\
        mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest --protocol https
      ```

      This remaps the emulator's health probe from its default host port 8080, which otherwise
      collides with Kestra's own default UI port, to 8082. The real Cosmos gateway stays on
      8081, and the Data Explorer stays on 1234.
    - This plugin calls the Cosmos Java SDK directly from the Kestra worker process, there is
      no sub-container `taskRunner` to join a Docker network. If Kestra itself runs in a
      container, point `COSMOS_CONNECTION_STRING` at `https://host.docker.internal:8081/` (or
      run `docker network connect YOUR_KESTRA_NETWORK cosmos-emulator` and use the container
      name instead of `host.docker.internal`, check the exact network name first with
      `docker network ls`).
    - The Cosmos Java SDK does not support HTTP against the emulator, only HTTPS, hence
      `--protocol https` above. Export and trust the emulator's self-signed certificate in the
      JVM running your Kestra worker, following Microsoft's emulator certificate instructions,
      or Query and Delete will fail with a TLS trust error, which this blueprint reports as
      `PROBE_FAILED`, not a connectivity hint.
    - A Slack incoming webhook for alerts.

    ### Secrets

    - `COSMOS_CONNECTION_STRING`: `AccountEndpoint=<endpoint>;AccountKey=<key>;` format, used by
      `probe_violations`, `reprobe_violations`, and `delete_expired_document`. Against the
      emulator, `<endpoint>` is `https://localhost:8081/` (or `https://host.docker.internal:8081/`
      from inside a container) and `<key>` is the well-known emulator account key documented on
      Microsoft's Cosmos DB emulator page, never a production key.
    - `SLACK_WEBHOOK`: Slack incoming webhook URL used by the alert tasks and the `errors`
      block.

      In Kestra OSS, set both as base64-encoded environment variables:
      `SECRET_COSMOS_CONNECTION_STRING`, `SECRET_SLACK_WEBHOOK`.

    ### Inputs

    | Input | Type | Default | Allowed values |
    |---|---|---|---|
    | `database_id` | STRING | `compliance_db` | any Cosmos database name |
    | `container_id` | STRING | `customer_records` | any container with partition key `/id` |
    | `expiry_field` | STRING | `expiresAt` | any document field name holding an ISO-8601 timestamp |
    | `grace_period_minutes` | INT | `60` | any non-negative integer |
    | `violation_count_critical_threshold` | INT | `50` | any non-negative integer |
    | `remediation_action` | SELECT | `log_only` | `log_only`, `delete` |
    | `auto_remediate` | BOOL | `false` | `true`, `false` |
    | `dry_run` | BOOL | `true` | `true`, `false` |

    ## Quick start

    1. Start the Cosmos emulator (or point at a real account) and seed a container with a few
       documents carrying a past `expiresAt` timestamp.
    2. Add the `COSMOS_CONNECTION_STRING` and `SLACK_WEBHOOK` secrets.
    3. Run this flow manually with the defaults and read `log_audit_summary` for the result.
    4. Once you trust the query, set `remediation_action: delete`, `auto_remediate: true`, and
       `dry_run: false` and run it again to clean up and verify.
    5. Enable the `six_hourly` trigger, which always ships in safe mode.

    ## How to extend

    - Point this at a container whose partition key is not `/id` by adding the partition key
      field and value to the `item` map on `delete_expired_document`, built from the matching
      column `probe_violations` already selects.
    - Add a second `expiry_field` and a second probe/classify/switch chain to audit more than
      one retention policy per container in one flow.
    - Replace the fixed `violation_count_critical_threshold` with a comparison against
      yesterday's count stored in a Kestra KV entry, to catch a retention backlog that is
      growing rather than a static size.

    ## Pitfalls

    - This blueprint assumes the container's partition key is `/id`. Against a container
      partitioned on another field, `delete_expired_document`'s `item` map needs that field
      added, a document delete without the correct partition key fails even when the `id` is
      right.
    - The Cosmos Java SDK does not support HTTP against the emulator, start it with `--protocol
      https` and trust its certificate, or every probe reports `PROBE_FAILED` with a TLS error
      that looks identical to a real outage.
    - `IS_DEFINED(c.<expiry_field>)` matters: without it, a document that never had the field
      set at all compares `undefined < "<timestamp>"`, which Cosmos SQL does not treat as true,
      so those documents are silently excluded rather than counted, which is the desired
      behavior here but easy to assume is a bug on a first read.
    - `grace_period_minutes` should be at least as large as your container's configured TTL
      polling interval, otherwise this gate reports violations for documents Cosmos's own TTL
      was always going to delete on schedule.

    ## Links

    - [Cosmos DB plugin documentation](https://kestra.io/plugins/plugin-azure)
    - [Cosmos DB Linux emulator](https://learn.microsoft.com/en-us/azure/cosmos-db/emulator-linux)
    - [Cosmos DB SQL DATETIMEADD function](https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/query/datetimeadd)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Policy & Compliance
  ee: false
  demo: false
