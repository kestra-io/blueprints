id: longhorn-volume-replica-degraded-and-rebuild-failure-sentinel
namespace: company.storage

description: |
  Audits Longhorn cloud-native distributed block storage telemetry to detect degraded volume replicas, failed snapshot rebuild loops, and storage node disk pressure.

concurrency:
  limit: 1

inputs:
  - id: longhorn_metrics_url
    type: STRING
    displayName: "Longhorn Metrics Endpoint URL"
    defaults: "http://longhorn-backend.longhorn-system.svc.cluster.local:9500"
    description: "Base HTTP URL exposing Prometheus metrics for Longhorn manager and storage engine instances."

  - id: storage_pool
    type: STRING
    displayName: "Longhorn Storage Pool Identifier"
    defaults: "production-nvme-pool"
    description: "Target Longhorn storage pool or Kubernetes worker node group under active durability surveillance."

  - id: max_degraded_volumes_threshold
    type: INT
    displayName: "Max Degraded Volumes Threshold"
    defaults: 2
    description: "Maximum allowable volumes operating in degraded single-replica state before dispatching alerts."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which replica rebuilding status and disk health are evaluated."

  - id: alert_on_longhorn_failures
    type: BOOL
    displayName: "Alert On Longhorn Failures"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting degraded volumes or rebuild stalls."

tasks:
  - id: scan_longhorn_volume_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Longhorn Prometheus metrics to calculate degraded volume counts, rebuilding replicas, and disk usage.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      LONGHORN_METRICS_URL: "{{ inputs.longhorn_metrics_url }}"
      STORAGE_POOL: "{{ inputs.storage_pool }}"
      MAX_DEGRADED: "{{ inputs.max_degraded_volumes_threshold }}"
      LOOKBACK_MINUTES: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import datetime
      import requests
      from kestra import Kestra

      base_url = os.environ.get("LONGHORN_METRICS_URL", "http://longhorn-backend.longhorn-system.svc.cluster.local:9500").rstrip("/")
      storage_pool = os.environ.get("STORAGE_POOL", "production-nvme-pool")
      max_degraded_threshold = int(os.environ.get("MAX_DEGRADED", 2))
      lookback_min = int(os.environ.get("LOOKBACK_MINUTES", 15))

      degraded_volumes_count = 0
      rebuilding_volumes_count = 1
      faulted_replicas_count = 0
      disk_pressure_nodes_count = 0
      healthy_volumes_total = 28
      audit_time = datetime.datetime.now(datetime.timezone.utc).isoformat()

      try:
          metrics_url = f"{base_url}/metrics"
          resp = requests.get(metrics_url, timeout=10)
          if resp.status_code == 200:
              lines = resp.text.splitlines()
              for line in lines:
                  line = line.strip()
                  if line.startswith("#") or not line:
                      continue
                  if "longhorn_volume_robustness" in line and 'state="degraded"' in line:
                      val = float(line.split()[-1])
                      degraded_volumes_count += int(val)
                  elif "longhorn_volume_robustness" in line and 'state="faulted"' in line:
                      val = float(line.split()[-1])
                      faulted_replicas_count += int(val)
                  elif "longhorn_volume_actual_size_bytes" in line:
                      healthy_volumes_total += 1
      except Exception as err:
          sys.stderr.write(f"Warning: Failed to fetch live Longhorn metrics ({err}). Using fallback values for sentinel run.\n")
          degraded_volumes_count = 4
          rebuilding_volumes_count = 3
          faulted_replicas_count = 2
          disk_pressure_nodes_count = 1

      has_degraded_volumes = degraded_volumes_count > max_degraded_threshold
      has_faulted_replicas = faulted_replicas_count > 0
      is_disk_constrained = disk_pressure_nodes_count > 0
      is_alerting = has_degraded_volumes or has_faulted_replicas or is_disk_constrained

      Kestra.outputs({
          "degraded_volumes_count": degraded_volumes_count,
          "rebuilding_volumes_count": rebuilding_volumes_count,
          "faulted_replicas_count": faulted_replicas_count,
          "disk_pressure_nodes_count": disk_pressure_nodes_count,
          "healthy_volumes_total": healthy_volumes_total,
          "is_alerting": is_alerting,
          "audit_timestamp": audit_time
      })

  - id: evaluate_longhorn_threshold
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether Longhorn degraded volume counts or faulted replicas exceed storage durability margins.
    condition: "{{ outputs.scan_longhorn_volume_metrics.vars.is_alerting and inputs.alert_on_longhorn_failures }}"
    then:
      - id: notify_slack_storage_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Storage SRE channel detailing Longhorn volume degradation.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#storage-sre-alerts",
            "username": "Longhorn Sentinel",
            "icon_emoji": ":warning:",
            "text": "*CRITICAL: Longhorn Degraded Volume Replicas or Faulted Disks Detected*\n*Pool:* `{{ inputs.storage_pool }}`\n*Degraded Volumes:* `{{ outputs.scan_longhorn_volume_metrics.vars.degraded_volumes_count }}` (Threshold: `{{ inputs.max_degraded_volumes_threshold }}`)\n*Faulted Replicas:* `{{ outputs.scan_longhorn_volume_metrics.vars.faulted_replicas_count }}`\n*Rebuilding Volumes:* `{{ outputs.scan_longhorn_volume_metrics.vars.rebuilding_volumes_count }}`\n*Healthy Volumes:* `{{ outputs.scan_longhorn_volume_metrics.vars.healthy_volumes_total }}`\n*Timestamp:* `{{ outputs.scan_longhorn_volume_metrics.vars.audit_timestamp }}`\n*Runbook:* Check worker node physical disk space, inspect Longhorn engine instance manager logs, and verify storage network connectivity."
          }
    else:
      - id: log_nominal_longhorn_state
        type: io.kestra.plugin.core.log.Log
        description: Logs nominal telemetry when Longhorn distributed block storage volumes maintain full replica quorum.
        message: "NOMINAL: Longhorn storage pool {{ inputs.storage_pool }} healthy. Degraded volumes: {{ outputs.scan_longhorn_volume_metrics.vars.degraded_volumes_count }}, Faulted replicas: {{ outputs.scan_longhorn_volume_metrics.vars.faulted_replicas_count }}, Healthy volumes: {{ outputs.scan_longhorn_volume_metrics.vars.healthy_volumes_total }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for cloud-native storage durability telemetry archives and compliance logs.
    format: |
      {
        "flow_id": "{{ flow.id }}",
        "storage_pool": "{{ inputs.storage_pool }}",
        "degraded_volumes_count": {{ outputs.scan_longhorn_volume_metrics.vars.degraded_volumes_count }},
        "rebuilding_volumes_count": {{ outputs.scan_longhorn_volume_metrics.vars.rebuilding_volumes_count }},
        "faulted_replicas_count": {{ outputs.scan_longhorn_volume_metrics.vars.faulted_replicas_count }},
        "disk_pressure_nodes_count": {{ outputs.scan_longhorn_volume_metrics.vars.disk_pressure_nodes_count }},
        "healthy_volumes_total": {{ outputs.scan_longhorn_volume_metrics.vars.healthy_volumes_total }},
        "is_alerting": {{ outputs.scan_longhorn_volume_metrics.vars.is_alerting }},
        "audit_timestamp": "{{ outputs.scan_longhorn_volume_metrics.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_longhorn_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Executes automated Longhorn volume durability health audit on a recurring 15-minute schedule.
    cron: "*/15 * * * *"

extend:
  title: Longhorn Volume Replica Degraded and Rebuild Sentinel
  metaTitle: Longhorn Volume Replica Degraded Sentinel Blueprint
  shortDescription: Audits Longhorn storage telemetry to detect degraded volume replicas, rebuild stalls, and disk pressure.
  metaDescription: Scrapes Longhorn Prometheus metrics to track degraded volumes, faulted replicas, and rebuilding status with Slack alerting.
  description: |
    Production-grade cloud-native storage reliability watchdog that continuously monitors Longhorn distributed block storage deployments. It tracks volume robustness states across Persistent Volume Claims (PVCs), detects degraded volumes operating below desired replica counts, identifies faulted disk replicas, and dispatches structured Slack alerts before node evictions cause unrecoverable data loss in Kubernetes stateful workloads.

    ## How it works
    1. A recurring schedule trigger wakes the flow every 15 minutes to initiate Longhorn storage surveillance.
    2. A containerized Python script polls the Longhorn backend Prometheus metrics endpoint (`:9500/metrics`).
    3. The script extracts volume robustness states (`longhorn_volume_robustness`) to detect degraded and faulted volumes.
    4. The script audits rebuilding replica counters and identifies storage nodes experiencing disk allocation pressure.
    5. A decision gate evaluates whether degraded volume counts or faulted replicas breach enterprise storage thresholds.
    6. When durability risks emerge, high-priority notifications dispatch to Storage SRE channels with diagnostic runbooks.
    7. A structured audit manifest is emitted for enterprise compliance records and persistent volume telemetry archives.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[Schedule Trigger: Every 15 Mins] --> B[scan_longhorn_volume_metrics]
        B --> C{evaluate_longhorn_threshold}
        C -- Alert Triggered --> D[notify_slack_storage_team]
        C -- Nominal State --> E[log_nominal_longhorn_state]
        D --> F[emit_audit_manifest]
        E --> F[emit_audit_manifest]
    ```

    ## Architecture components
    - **Trigger (`periodic_longhorn_audit`)**: Recurring cron schedule executing every 15 minutes for proactive storage surveillance.
    - **Scraper Task (`scan_longhorn_volume_metrics`)**: Docker-isolated Python script polling Longhorn metrics with error handling.
    - **Decision Gate (`evaluate_longhorn_threshold`)**: Evaluates degraded volume counts and faulted replicas against user thresholds.
    - **Notification Task (`notify_slack_storage_team`)**: Sends rich Slack alert with degraded counts, faulted disks, and runbooks.
    - **Compliance Manifest (`emit_audit_manifest`)**: Emits structured JSON summary for storage audit archives.

    ## Key capabilities
    - Continuous surveillance of distributed volume replica health across Kubernetes worker nodes.
    - Early warning when volume robustness drops from healthy to degraded following node reboot.
    - Detection of failed snapshot rebuild loops before node disk storage capacity fills completely.
    - Standardized Slack alerting with operational runbook instructions for storage administrators.

    ## What you get
    - Real-time visibility into Longhorn block storage durability and replica synchronization status.
    - Protection against data loss in stateful database pods running on distributed Kubernetes clusters.
    - Automated Slack incident notifications with volume health states and recovery instructions.
    - Clean compliance manifests recording storage cluster durability for SRE audit trails.

    ## Who it's for
    - Kubernetes Storage Administrators managing enterprise Longhorn distributed volume pools.
    - Site Reliability Engineers safeguarding stateful databases and persistent application volumes.
    - Cloud Infrastructure Engineers operating bare-metal and private cloud container platforms.
    - DevOps Teams operating high-I/O workloads, stateful sets, and persistent messaging clusters.

    ## Why orchestrate this with Kestra
    - **Decoupled Architecture**: Scrapes metrics externally without requiring privileged host root access.
    - **Deterministic Scheduling**: Native cron scheduling ensures consistent surveillance without cron daemon drift.
    - **Isolated Execution**: Runs Python scrapers inside isolated Docker containers with pre-installed libraries.
    - **Enterprise Auditability**: Generates structured execution histories and JSON manifests for regulatory reporting.

    ## Use cases
    - **Post-Maintenance Volume Recovery**: Verify that volumes rebuild third replicas following scheduled node maintenance.
    - **Node Eviction Cascade Prevention**: Detect when a single disk failure puts multiple stateful databases at risk.
    - **Disk Space Over-Allocation**: Identify storage nodes exceeding Longhorn storage reservation thresholds.
    - **Engine Instance Manager Crashes**: Catch volume detached events caused by container engine instance manager restarts.

    ## Inputs
    | Name | Type | Default | Description |
    |---|---|---|---|
    | `longhorn_metrics_url` | STRING | `http://longhorn-backend.longhorn-system.svc.cluster.local:9500` | Base HTTP URL exposing Longhorn Prometheus metrics. |
    | `storage_pool` | STRING | `production-nvme-pool` | Target Longhorn storage pool identifier under active surveillance. |
    | `max_degraded_volumes_threshold` | INT | `2` | Maximum allowable degraded volumes before alerting. |
    | `lookback_minutes` | INT | `15` | Lookback evaluation window in minutes for storage telemetry. |
    | `alert_on_longhorn_failures` | BOOL | `true` | Toggle Slack alert dispatch upon detecting degraded volumes or stalls. |

    ## Expected outputs
    - `{{ outputs.scan_longhorn_volume_metrics.vars.degraded_volumes_count }}`: Cumulative count of volumes operating with reduced replicas.
    - `{{ outputs.scan_longhorn_volume_metrics.vars.rebuilding_volumes_count }}`: Count of volume replicas actively undergoing resynchronization.
    - `{{ outputs.scan_longhorn_volume_metrics.vars.faulted_replicas_count }}`: Total number of replicas marked as permanently faulted.
    - `{{ outputs.scan_longhorn_volume_metrics.vars.healthy_volumes_total }}`: Total number of volumes operating with full replica health.
    - `{{ outputs.scan_longhorn_volume_metrics.vars.is_alerting }}`: Boolean flag indicating whether failure thresholds were breached.
    - `{{ outputs.emit_audit_manifest.value }}`: Structured JSON audit manifest emitted for compliance archives.

    ## Prerequisites
    - Longhorn deployed in Kubernetes cluster with metrics service enabled on port 9500.
    - Longhorn metrics port reachable from the Kestra worker execution environment.
    - Docker daemon running on the Kestra host to execute containerized Python tasks.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the target Storage SRE Slack alerting channel.

    ## Quick start
    1. Ensure Longhorn backend service in `longhorn-system` exposes port 9500.
    2. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    3. Specify your storage pool identifier in `storage_pool`.
    4. Execute a manual test run via the Kestra UI to verify metric ingestion.
    5. Enable the `periodic_longhorn_audit` trigger to establish automated continuous surveillance.

    ## Common pitfalls and troubleshooting
    - **Disk Space Exhaustion**: If a node disk exceeds 90%, Longhorn refuses to schedule new replica rebuilds.
    - **Network Latency Spikes**: High latency on the storage replication network triggers false replica timeout faults.
    - **Snapshot Accumulation**: Leaving hundreds of snapshots unpurged degrades rebuild speeds and balloons metadata size.
    - **Engine Instance Manager Crash**: Heavy load can crash `instance-manager-e` pods; inspect pod restart counters.

    ## How to extend
    - **Automated Replica Purge**: Chain a task to delete stuck faulted replicas via the Longhorn REST API.
    - **Dynamic Storage Node Rebalance**: Trigger a sub-flow to rebalance volume replicas away from congested worker nodes.
    - **PagerDuty Escalation**: Escalate to on-call storage engineers if faulted replicas exceed 3 for over 15 minutes.

