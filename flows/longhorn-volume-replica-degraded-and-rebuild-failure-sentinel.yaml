    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Longhorn Official Documentation and Architecture Guide](https://longhorn.io/docs/)
    - [Longhorn Prometheus Metrics Reference and Monitoring Guide](https://longhorn.io/docs/latest/monitoring/prometheus-and-grafana-setup/)
    - [Troubleshooting Longhorn Volume Replica Degradation and Faults](https://longhorn.io/docs/latest/troubleshooting/)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Kubernetes Operations
  ee: false
  demo: false
