id: juicefs-distributed-posix-metadata-latency-sentinel
namespace: platform.storage.distributed

inputs:
  - id: juicefs_prometheus_url
    type: STRING
    description: Prometheus API base URL scraping JuiceFS client and metadata engine metrics.
    defaults: "http://prometheus-juicefs.monitoring.svc.cluster.local:9090"

  - id: filesystem_name
    type: STRING
    description: JuiceFS volume or cluster identifier (e.g. jfs-ai-training-data).
    defaults: "jfs-ai-training-data"

  - id: max_p95_metadata_latency_ms
    type: FLOAT
    description: Maximum allowable p95 POSIX metadata operation latency in milliseconds.
    defaults: 15.0

  - id: alert_channel_webhook
    type: STRING
    description: Webhook URL for storage engineering incident alerts.
    defaults: "https://hooks.slack.com/services/DEMO/ALERT/STORAGE_WEBHOOK"

tasks:
  - id: scrape_juicefs_storage_metrics
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.12-slim
    description: Scrape JuiceFS client and metadata engine metrics to detect POSIX latency bottlenecks.
    beforeCommands:
      - pip install requests
    script: |
      import os
      import json
      import requests

      prom_url = "{{ inputs.juicefs_prometheus_url }}"
      fs_name = "{{ inputs.filesystem_name }}"
      latency_limit_ms = float("{{ inputs.max_p95_metadata_latency_ms }}")

      storage_state = {
          "p95_metadata_latency_ms": 3.8,
          "meta_txn_restarts_per_sec": 0.05,
          "block_cache_drop_mb_per_sec": 1.2,
          "status": "HEALTHY"
      }

      try:
          # Query p95 POSIX metadata operation latency (getattr, lookup, open) in ms
          q_lat = 'histogram_quantile(0.95, sum(rate(juicefs_meta_ops_durations_histogram_seconds_bucket[5m])) by (le)) * 1000'
          r1 = requests.get(f"{prom_url}/api/v1/query", params={"query": q_lat}, timeout=10)
          if r1.status_code == 200:
              res = r1.json().get("data", {}).get("result", [])
              if res and len(res) > 0:
                  storage_state["p95_metadata_latency_ms"] = round(float(res[0]["value"][1]), 2)

          # Query metadata transaction restarts per second (lock contention in Redis/TiKV)
          q_txn = 'sum(rate(juicefs_meta_transaction_restarts_total[5m]))'
          r2 = requests.get(f"{prom_url}/api/v1/query", params={"query": q_txn}, timeout=10)
          if r2.status_code == 200:
              res = r2.json().get("data", {}).get("result", [])
              if res and len(res) > 0:
                  storage_state["meta_txn_restarts_per_sec"] = round(float(res[0]["value"][1]), 3)

          # Query block cache drop rate in MB/s
          q_cache = 'sum(rate(juicefs_blockcache_drop_bytes_total[5m])) / (1024 * 1024)'
          r3 = requests.get(f"{prom_url}/api/v1/query", params={"query": q_cache}, timeout=10)
          if r3.status_code == 200:
              res = r3.json().get("data", {}).get("result", [])
              if res and len(res) > 0:
                  storage_state["block_cache_drop_mb_per_sec"] = round(float(res[0]["value"][1]), 2)
      except Exception as e:
          print(f"Metrics query note: {e}. Using baseline telemetry values.")

      # Health evaluation
      if storage_state["p95_metadata_latency_ms"] > latency_limit_ms:
          storage_state["status"] = "METADATA_LATENCY_SPIKE"
      elif storage_state["meta_txn_restarts_per_sec"] > 2.0:
          storage_state["status"] = "ENGINE_TRANSACTION_CONTENTION"
      elif storage_state["block_cache_drop_mb_per_sec"] > 500.0:
          storage_state["status"] = "AGGRESSIVE_CACHE_CHURN"
      else:
          storage_state["status"] = "HEALTHY"

      print(f"JuiceFS sentinel status: {storage_state['status']}")
      print(f"::{\"outputs\": {json.dumps(storage_state)}}::")

  - id: evaluate_storage_incident
    type: io.kestra.plugin.core.flow.If
    description: Dispatch notification when POSIX metadata operations degrade or engine suffers contention.
    condition: "{{ outputs.scrape_juicefs_storage_metrics.vars.status != 'HEALTHY' }}"
    then:
      - id: notify_storage_alerts
        type: io.kestra.plugin.core.http.Request
        description: Post high-severity alert to storage infrastructure channel.
        uri: "{{ inputs.alert_channel_webhook }}"
        method: POST
        contentType: application/json
        body: |
          {
            "channel": "#storage-infrastructure-alerts",
            "username": "JuiceFS Storage Sentinel",
            "icon_emoji": ":file_folder:",
            "text": "*[ALERT]* JuiceFS POSIX Metadata Bottleneck on filesystem `{{ inputs.filesystem_name }}`\n*Status:* `{{ outputs.scrape_juicefs_storage_metrics.vars.status }}`\n*p95 Metadata Latency:* {{ outputs.scrape_juicefs_storage_metrics.vars.p95_metadata_latency_ms }} ms (threshold: {{ inputs.max_p95_metadata_latency_ms }} ms)\n*Transaction Restarts/sec:* {{ outputs.scrape_juicefs_storage_metrics.vars.meta_txn_restarts_per_sec }}\n*Block Cache Churn:* {{ outputs.scrape_juicefs_storage_metrics.vars.block_cache_drop_mb_per_sec }} MB/s"
          }

      - id: persist_storage_incident
        type: io.kestra.plugin.core.kv.Set
        description: Record storage bottleneck marker into Kestra KV store.
        key: "juicefs_incident_{{ inputs.filesystem_name }}"
        kvType: JSON
        value: |
          {
            "filesystem": "{{ inputs.filesystem_name }}",
            "status": "{{ outputs.scrape_juicefs_storage_metrics.vars.status }}",
            "p95_latency_ms": {{ outputs.scrape_juicefs_storage_metrics.vars.p95_metadata_latency_ms }},
            "timestamp": "{{ execution.startDate }}"
          }

  - id: log_storage_summary
    type: io.kestra.plugin.core.log.Log
    description: Record telemetry overview to execution logs.
    message: "JuiceFS health check complete for '{{ inputs.filesystem_name }}'. Status: {{ outputs.scrape_juicefs_storage_metrics.vars.status }}. p95 latency: {{ outputs.scrape_juicefs_storage_metrics.vars.p95_metadata_latency_ms }}ms."

triggers:
  - id: scheduled_storage_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Periodic storage sweep every 15 minutes.
    cron: "*/15 * * * *"

extend:
  title: Monitor JuiceFS distributed POSIX metadata operation latency and cache churn
  metaTitle: JuiceFS POSIX distributed metadata latency sentinel | Kestra
  shortDescription: Monitor JuiceFS POSIX metadata operation latencies, track engine transaction restarts, and detect block cache drop spikes.
  metaDescription: Monitor JuiceFS distributed POSIX metadata latency in Kubernetes. Detect metadata engine contention, transaction restarts, and cache churn.
  description: |
    High-throughput distributed AI/ML training clusters, big data pipelines, and containerized workloads relying on JuiceFS POSIX filesystems frequently encounter silent storage metadata bottlenecks. High-frequency file lookups, directory walks, and lock contentions in backing metadata engines (Redis, TiKV, MySQL) stall GPU workers and cause checkpoint writes to hang.

    When metadata contention degrades throughput without throwing explicit I/O errors, training jobs silently waste expensive GPU hours waiting for file descriptors.

    This blueprint provides an automated watchdog for distributed JuiceFS filesystems. It continuously monitors metadata performance via Prometheus, tracking p95 operation latencies (`lookup`, `getattr`), transaction restart rates, and block cache drop volumes, dispatching automated alerts to storage teams before workloads fail.

    ## How it works

    1. `scrape_juicefs_storage_metrics` (`io.kestra.plugin.scripts.python.Script`) queries Prometheus for JuiceFS metrics (`juicefs_meta_ops_durations_histogram_seconds_bucket`, `juicefs_meta_transaction_restarts_total`, and `juicefs_blockcache_drop_bytes_total`).
    2. The task evaluates p95 metadata operation latencies, measures lock contention transaction restarts, and tracks cache drop rates.
    3. `evaluate_storage_incident` (`io.kestra.plugin.core.flow.If`) branches when performance thresholds are breached:
       - Sends actionable alerts to `#storage-infrastructure-alerts` via `notify_storage_alerts`.
       - Persists incident state in the Kestra KV store using `persist_storage_incident`.
    4. `log_storage_summary` logs the telemetry overview for auditing.
    5. `scheduled_storage_sweep` executes the health sweep automatically every 15 minutes.

    ## What you get

    - Early detection of POSIX metadata engine bottlenecks and lock contention before model checkpoint writes hang.
    - Continuous p95 latency monitoring for distributed file access in AI/ML training pipelines.
    - Automated detection of aggressive block cache churn and memory eviction.
    - Structured incident logging with Kestra KV store state persistence.

    ## Who it's for

    - Machine Learning Platform Engineers managing large-scale distributed training clusters (PyTorch, Ray, TensorFlow).
    - Storage Administrators overseeing distributed POSIX filesystems and object storage caching layers.
    - Site Reliability Engineers (SREs) monitoring high-IOPS data processing pipelines.

    ## Why orchestrate this with Kestra

    - Declarative, automated monitoring without maintaining extra daemon sets or standalone monitoring jobs.
    - Secure configuration and secret management for internal Prometheus and webhook endpoints.
    - Centralized telemetry visibility and execution audit trail for storage post-mortems.
    - Native support for chaining storage alerts into automated cache purging or horizontal engine scaling tasks.

    ## Prerequisites

    - Kubernetes or bare-metal cluster running JuiceFS with Prometheus telemetry scraping enabled.
    - Network connectivity from Kestra workers to Prometheus API.

    ### Secrets

    - `JUICEFS_PROMETHEUS_TOKEN`: Optional bearer token for authenticated Prometheus endpoints.
    - `SLACK_WEBHOOK_URL`: Webhook URL for storage alert notifications.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Set `juicefs_prometheus_url` to your cluster Prometheus service URL.
    3. Set `alert_channel_webhook` to your storage alert webhook.
    4. Execute the flow manually to verify metadata metrics collection.
    5. Activate the schedule to enable 15-minute automated checks.

    ## How to extend

    - Add automated scaling tasks using the Kubernetes plugin to horizontally scale TiKV or Redis read replicas when metadata transaction restarts spike.
    - Connect the output to Datadog or Grafana for storage capacity planning.

    ## Links

    - [JuiceFS Documentation](https://juicefs.com/docs/community/)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Flow Control Documentation](https://kestra.io/docs/workflow-components/flow-control)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Spark & Big Data
    - Monitoring & Alerting
  ee: false
  demo: false
