id: juicefs-distributed-posix-metadata-latency-sentinel
namespace: company.sre

description: |
  Audits JuiceFS distributed POSIX filesystem metrics to detect metadata latency degradation, transaction retry storms, and cache churn in AI training clusters.

concurrency:
  limit: 1

inputs:
  - id: juicefs_metrics_url
    type: STRING
    displayName: "JuiceFS Metrics URL"
    defaults: "http://juicefs-csi.kube-system.svc.cluster.local:9567"
    description: "Internal Kubernetes HTTP endpoint exposing Prometheus metrics from the JuiceFS CSI driver or client daemon."

  - id: filesystem_name
    type: STRING
    displayName: "Filesystem Identifier"
    defaults: "jfs-ai-training-data"
    description: "Name of the target JuiceFS volume mounted across compute nodes for AI distributed training."

  - id: max_metadata_latency_ms
    type: INT
    displayName: "Max Metadata Latency Milliseconds"
    defaults: 25
    description: "Maximum acceptable latency for POSIX metadata operations before alerting on storage performance degradation."

  - id: max_tx_restart_rate
    type: INT
    displayName: "Max Transaction Restart Rate"
    defaults: 10
    description: "Threshold for metadata transaction restart counter increases indicating lock contention in backing metadata engine."

  - id: alert_on_cache_churn
    type: BOOL
    displayName: "Alert on Cache Churn"
    defaults: true
    description: "Toggle whether excessive block cache evictions and disk cache drop rates trigger an operational warning."

tasks:
  - id: scan_juicefs_metadata_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes JuiceFS Prometheus metrics endpoint to audit POSIX metadata operation latency, transaction restarts, and cache performance.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.juicefs_metrics_url }}"
      FILESYSTEM_NAME: "{{ inputs.filesystem_name }}"
      MAX_LATENCY_MS: "{{ inputs.max_metadata_latency_ms }}"
      MAX_TX_RESTARTS: "{{ inputs.max_tx_restart_rate }}"
      ALERT_CACHE_CHURN: "{{ inputs.alert_on_cache_churn }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METRICS_URL", "").rstrip("/")
      fs_name = os.environ.get("FILESYSTEM_NAME", "jfs-ai-training-data")
      max_latency_ms = float(os.environ.get("MAX_LATENCY_MS", "25"))
      max_tx_restarts = float(os.environ.get("MAX_TX_RESTARTS", "10"))
      alert_cache_churn = os.environ.get("ALERT_CACHE_CHURN", "true").lower() == "true"

      max_observed_latency_ms = 0.0
      worst_meta_op = "none"
      tx_restart_count = 0.0
      blockcache_drop_mb = 0.0
      total_ops_sampled = 0
      degraded_ops_count = 0

      metrics_endpoint = f"{base_url}/metrics"
      try:
          resp = requests.get(metrics_endpoint, timeout=12)
          resp.raise_for_status()
          raw_lines = resp.text.splitlines()
      except Exception as err:
          print(f"Error: Unable to connect to JuiceFS metrics endpoint at {metrics_endpoint}: {err}", file=sys.stderr)
          sys.exit(1)

      for line in raw_lines:
          line = line.strip()
          if not line or line.startswith("#"):
              continue
          match = re.search(r'([0-9.eE+-]+)\s*$', line)
          if not match:
              continue
          val = float(match.group(1))

          if "juicefs_meta_ops_durations_histogram_seconds" in line or "juicefs_meta_ops_durations_seconds" in line:
              total_ops_sampled += 1
              op_match = re.search(r'op="([^"]+)"', line)
              op_name = op_match.group(1) if op_match else "unknown"
              latency_ms = val * 1000.0
              if latency_ms > max_observed_latency_ms:
                  max_observed_latency_ms, worst_meta_op = latency_ms, op_name
              if latency_ms > max_latency_ms:
                  degraded_ops_count += 1
          elif "juicefs_transaction_restart_total" in line:
              tx_restart_count += val
          elif "juicefs_blockcache_drop_bytes_total" in line:
              blockcache_drop_mb += (val / (1024.0 * 1024.0))

      is_breached = bool((max_observed_latency_ms > max_latency_ms) or (tx_restart_count > max_tx_restarts) or (alert_cache_churn and blockcache_drop_mb > 500.0))
      now_iso = datetime.now(timezone.utc).isoformat()
      print(f"JuiceFS Audit: fs={fs_name}, worst_op={worst_meta_op}:{max_observed_latency_ms:.2f}ms, tx_restarts={tx_restart_count}, cache_drop={blockcache_drop_mb:.1f}MB, breached={is_breached}")

      Kestra.outputs({
          "peak_metadata_latency_ms": round(max_observed_latency_ms, 2),
          "worst_metadata_operation": worst_meta_op,
          "transaction_restarts_count": round(tx_restart_count, 0),
          "blockcache_dropped_mb": round(blockcache_drop_mb, 2),
          "total_ops_sampled": total_ops_sampled,
          "degraded_ops_count": degraded_ops_count,
          "is_alerting": is_breached,
          "audit_timestamp": now_iso
      })

  - id: evaluate_juicefs_metadata_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether POSIX metadata latency, transaction restart rates, or cache drop rates violate storage SLAs.
    condition: "{{ outputs.scan_juicefs_metadata_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_juicefs_metadata_latency
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority Slack notification when JuiceFS metadata operations degrade model training throughput.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#storage-sre-alerts",
            "text": "CRITICAL: JuiceFS Metadata Latency Degradation on Filesystem `{{ inputs.filesystem_name }}`. Worst Operation: `{{ outputs.scan_juicefs_metadata_telemetry.vars.worst_metadata_operation }}` at `{{ outputs.scan_juicefs_metadata_telemetry.vars.peak_metadata_latency_ms }}` ms (limit: `{{ inputs.max_metadata_latency_ms }}` ms). Tx Restarts: `{{ outputs.scan_juicefs_metadata_telemetry.vars.transaction_restarts_count }}` (limit: `{{ inputs.max_tx_restart_rate }}`). Block Cache Dropped: `{{ outputs.scan_juicefs_metadata_telemetry.vars.blockcache_dropped_mb }}` MB. Degraded Ops: `{{ outputs.scan_juicefs_metadata_telemetry.vars.degraded_ops_count }}`. Timestamp: `{{ outputs.scan_juicefs_metadata_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_juicefs_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when JuiceFS metadata latency and transaction rates remain well within SLA bounds.
        message: "JuiceFS metadata performance nominal for {{ inputs.filesystem_name }}: Peak latency is {{ outputs.scan_juicefs_metadata_telemetry.vars.peak_metadata_latency_ms }} ms, tx restarts {{ outputs.scan_juicefs_metadata_telemetry.vars.transaction_restarts_count }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for distributed storage governance, MLOps checkpoint health, and capacity planning.
    format: |
      {
        "status": "{{ outputs.scan_juicefs_metadata_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "filesystem_name": "{{ inputs.filesystem_name }}",
        "peak_metadata_latency_ms": {{ outputs.scan_juicefs_metadata_telemetry.vars.peak_metadata_latency_ms }},
        "worst_metadata_operation": "{{ outputs.scan_juicefs_metadata_telemetry.vars.worst_metadata_operation }}",
        "transaction_restarts_count": {{ outputs.scan_juicefs_metadata_telemetry.vars.transaction_restarts_count }},
        "blockcache_dropped_mb": {{ outputs.scan_juicefs_metadata_telemetry.vars.blockcache_dropped_mb }},
        "total_ops_sampled": {{ outputs.scan_juicefs_metadata_telemetry.vars.total_ops_sampled }},
        "degraded_ops_count": {{ outputs.scan_juicefs_metadata_telemetry.vars.degraded_ops_count }},
        "audit_timestamp": "{{ outputs.scan_juicefs_metadata_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_juicefs_metadata_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "JuiceFS Distributed POSIX Metadata Latency Sentinel"
  metaTitle: "JuiceFS POSIX Metadata Latency Sentinel Blueprint"
  shortDescription: "Audits JuiceFS distributed filesystem metrics to detect metadata latency spikes and transaction retries."
  metaDescription: "Audits JuiceFS distributed POSIX filesystem metrics to detect metadata latency degradation, transaction retry storms, and cache churn in AI training clusters."
  description: |
    Automates continuous health and latency surveillance for JuiceFS distributed cloud-native POSIX filesystems powering AI and distributed computing.

    ## How it works
    1. A schedule trigger initiates the JuiceFS filesystem audit workflow every 15 minutes.
    2. The Python task queries the JuiceFS Prometheus metrics endpoint exposed by the client or CSI node driver.
    3. The script extracts metadata operation latency distributions, transaction restart counts, and block cache evictions.
    4. An evaluation gate assesses whether lookup or getattr latencies exceed operational thresholds or indicate lock contention.
    5. When metadata degradation is detected, a high-urgency Slack incident alert is routed to the Storage Operations team.
    6. When metadata operations and cache efficiency remain within target SLAs, nominal status is logged.
    7. A structured JSON audit manifest is emitted for MLOps training checkpoint performance analysis and capacity reviews.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape JuiceFS Client Metrics]
        ScanMetrics --> EvalBreach{Latency > 25ms OR Tx Restarts > 10 OR Cache Drop > 500MB?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Priority Storage Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Storage Performance]
        SlackAlert --> EmitManifest[Debug Return: Storage Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes JuiceFS Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether POSIX metadata operation latencies or transaction restart rates violate storage SLAs.
    - **Notification Task**: Dispatches structured Slack alerts with filesystem name, worst operation, and latency millisecond details.
    - **Audit Manifest**: Emits JSON execution payloads containing metadata operation rates, cache metrics, and audit timestamps.

    ## Key capabilities
    - Continuous surveillance of POSIX metadata operation latencies including lookup, getattr, read, and write operations.
    - Early warning detection for metadata engine lock contention and transaction restarts in backing Redis or TiKV stores.
    - Automated tracking of block cache churn and disk cache eviction volume across distributed worker nodes.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Proactive detection of distributed storage bottlenecks that stall GPU model training loops and data loaders.
    - Early visibility into Redis or TiKV metadata cluster saturation before filesystem timeouts impact client applications.
    - Standardized audit records capturing peak metadata latency, worst-performing operations, and transaction retry metrics.
    - Actionable operational alerts routed directly to SRE and MLOps channels with exact diagnostic context.

    ## Who it's for
    - MLOps engineers managing distributed PyTorch and TensorFlow training pipelines on Kubernetes.
    - Storage administrators maintaining petabyte-scale cloud-native file systems with distributed object storage.
    - Site Reliability Engineers safeguarding POSIX filesystem responsiveness across compute clusters.
    - Platform engineers architecting shared persistent storage for multi-tenant batch analytics workloads.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages cluster storage surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical storage performance metrics in searchable Kestra execution logs.

    ## Use cases
    - **AI Model Checkpoint Stall Prevention**: Detects metadata lock contention before large distributed checkpoint writes hang.
    - **Data Loader Throughput Guardrail**: Identifies slow POSIX lookup operations starving GPU workers during dataset epoch iteration.
    - **Metadata Datastore Sizing Validation**: Highlights transaction restart spikes indicating the need to scale backing metadata instances.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `juicefs_metrics_url` | STRING | `http://juicefs-csi.kube-system.svc.cluster.local:9567` | Internal Kubernetes HTTP endpoint exposing Prometheus metrics from JuiceFS. |
    | `filesystem_name` | STRING | `jfs-ai-training-data` | Name of the target JuiceFS volume monitored for performance degradation. |
    | `max_metadata_latency_ms` | INT | `25` | Maximum acceptable latency for POSIX metadata operations in milliseconds. |
    | `max_tx_restart_rate` | INT | `10` | Threshold for metadata transaction restart counter increases indicating lock contention. |
    | `alert_on_cache_churn` | BOOL | `true` | Toggle whether excessive block cache evictions trigger an operational alert. |

    ## Expected outputs
    - `{{ outputs.scan_juicefs_metadata_telemetry.vars.peak_metadata_latency_ms }}`: Peak observed metadata operation latency in milliseconds.
    - `{{ outputs.scan_juicefs_metadata_telemetry.vars.worst_metadata_operation }}`: Name of the POSIX operation exhibiting highest latency.
    - `{{ outputs.scan_juicefs_metadata_telemetry.vars.transaction_restarts_count }}`: Cumulative metadata engine transaction restart count.
    - `{{ outputs.scan_juicefs_metadata_telemetry.vars.blockcache_dropped_mb }}`: Volume of block cache data evicted in megabytes.
    - `{{ outputs.scan_juicefs_metadata_telemetry.vars.degraded_ops_count }}`: Count of sampled metadata operations exceeding the latency limit.
    - `{{ outputs.scan_juicefs_metadata_telemetry.vars.is_alerting }}`: Boolean flag indicating if metadata performance violated SLAs.
    - `{{ outputs.scan_juicefs_metadata_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the JuiceFS audit execution.

    ## Prerequisites
    - JuiceFS client daemon or CSI driver deployed in the cluster with Prometheus metrics enabled on port 9567.
    - Network connectivity from the Kestra worker to the JuiceFS metrics service endpoint.
    - Configured Slack incoming webhook URL with permissions to post in platform storage alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing storage performance anomaly alerts to the team Slack channel.

    ## Quick start
    1. Confirm that JuiceFS CSI node pods are running and exposing metrics on port 9567.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your filesystem identifier in `filesystem_name`.
    4. Run a manual execution via the Kestra UI to verify metric ingestion.
    5. Enable the `periodic_juicefs_metadata_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **Port Accessibility**: Ensure firewall and NetworkPolicies allow ingress on port 9567 from the Kestra namespace.
    - **Metadata Backing Engine Latency**: High JuiceFS latency often stems from Redis CPU saturation or TiKV disk I/O bottlenecks.
    - **Client Cache Tuning**: Frequent cache drops may require increasing `--cache-size` or allocating faster NVMe cache directories.
    - **Multi-Mount Scraping**: In multi-client clusters, scrape the centralized Prometheus server or aggregate client metrics.

    ## How to extend
    - **Automated Metadata Scaling**: Trigger automated Redis replica scale-out or memory expansion when transaction restarts spike.
    - **Dynamic Cache Warming**: Initiate predictive dataset pre-loading into local SSD cache prior to scheduled training job starts.
    - **Automated Client Evacuation**: Safely unmount degraded client nodes and migrate batch tasks to healthy compute instances.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [JuiceFS Official Documentation](https://juicefs.com/docs/community/)
    - [JuiceFS Performance Monitoring and Metrics Reference](https://juicefs.com/docs/community/fault_diagnosis_and_analysis/)
    - [JuiceFS Kubernetes CSI Driver Repository](https://github.com/juicedata/juicefs-csi-driver)
