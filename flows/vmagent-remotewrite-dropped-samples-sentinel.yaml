id: vmagent-remotewrite-dropped-samples-sentinel
namespace: company.sentinel
description: Monitors VictoriaMetrics vmagent scraping agent Prometheus metrics to
  detect remote-write dropped samples and persistent buffer saturation.
inputs:
- id: vmagent_metrics_url
  type: STRING
  defaults: http://vmagent.internal:8429/metrics
- id: max_dropped_samples_threshold
  type: INT
  defaults: 0
tasks:
- id: audit_vmagent
  type: io.kestra.plugin.scripts.shell.Commands
  containerImage: ghcr.io/kestra-io/tools:latest
  commands:
  - set -euo pipefail
  - 'curl -sf "{{ inputs.vmagent_metrics_url }}" > /tmp/vmagent_raw.txt 2>/dev/null
    || true


    DROPPED=$(grep ''vmagent_remotewrite_dropped_samples_total'' /tmp/vmagent_raw.txt
    | awk ''{print $2}'' | tail -n 1 || echo 0)

    RETRIES=$(grep ''vmagent_remotewrite_retries_count_total'' /tmp/vmagent_raw.txt
    | awk ''{print $2}'' | tail -n 1 || echo 0)


    echo "{"dropped_samples": ${DROPPED%.*}, "retries": ${RETRIES%.*}}" > /tmp/vmagent_health.json

    '
  outputFiles:
  - '*.json'
- id: evaluate_and_alert
  type: io.kestra.plugin.core.flow.If
  condition: '{{ fromJson(outputs.audit_vmagent.outputFiles[''vmagent_health.json'']).dropped_samples
    > inputs.max_dropped_samples_threshold }}'
  then:
  - id: notify_slack
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: '{{ secret(''SLACK_WEBHOOK'') }}'
    payload: ':warning: *vmagent Remote Write Dropped Samples Spiked*\n*Metrics Endpoint:*
      {{ inputs.vmagent_metrics_url }}\n*Dropped Samples:* {{ fromJson(outputs.audit_vmagent.outputFiles[''vmagent_health.json'']).dropped_samples
      }}\n*Retry Count:* {{ fromJson(outputs.audit_vmagent.outputFiles[''vmagent_health.json'']).retries
      }}\n*Risk:* Metric telemetry loss. Remote storage target may be saturated or
      rejecting connections.'
errors:
- id: handle_inspection_failure
  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
  url: '{{ secret(''SLACK_WEBHOOK'') }}'
  payload: ':rotating_light: *Execution Failure: VictoriaMetrics vmagent Remote Write
    Dropped Samples Sentinel*\n*Execution ID:* `{ execution.id }`\n*State:* `{ execution.state.current
    }`\n*Error:* Sentinel inspection encountered an unhandled execution error.'
triggers:
- id: scheduled_monitor
  type: io.kestra.plugin.core.trigger.Schedule
  cron: '*/15 * * * *'
  disabled: true
extend:
  metaDescription: "Monitors VictoriaMetrics vmagent scraping agent Prometheus metrics to detect remote-write dropped samples and persistent buffer saturation."
  metaTitle: VictoriaMetrics vmagent Remote Write Dropped Samples Sentinel with Kestra
  title: VictoriaMetrics vmagent Remote Write Dropped Samples Sentinel
  shortDescription: Monitors VictoriaMetrics vmagent scraping agent Prometheus metrics
    to detect remote-write dropped samples and persistent buffer saturation.
  description: '## How it works

