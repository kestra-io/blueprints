id: nasa-neows-close-approaches-watch
namespace: company.team

description: |
  Ingests daily Near Earth Object (NEO) close approach telemetry from the NASA NeoWs open API,
  analyzes orbital miss distances, relative velocities, and hazardous asteroid classifications in
  DuckDB, persists columnar Parquet records in Kestra internal storage, and alerts on close lunar
  flybys or potentially hazardous asteroids via Slack.

inputs:
  - id: miss_distance_lunar_threshold
    type: FLOAT
    displayName: Lunar distance threshold (LD)
    description: Maximum miss distance in lunar distances (1 LD ~= 384,400 km) to classify an asteroid close approach as high interest.
    defaults: 20.0

  - id: state_key
    type: STRING
    displayName: KV state key
    description: Key in Kestra KV store used to record daily telemetry summaries and prevent duplicate alerts.
    defaults: nasa_neows_state

triggers:
  - id: daily_morning_scan
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * *"
    recoverMissedSchedules: LAST
    description: Triggers daily at 06:00 UTC to evaluate the day's predicted near-Earth asteroid approaches.

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: fetch_neo_feed
    type: io.kestra.plugin.core.http.Download
    description: Downloads today's NEO close-approach feed from the NASA NeoWs open REST API.
    uri: "https://api.nasa.gov/neo/rest/v1/feed?start_date={{ now() | date('yyyy-MM-dd') }}&end_date={{ now() | date('yyyy-MM-dd') }}&api_key=DEMO_KEY"

  - id: process_asteroid_telemetry
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Unpacks nested JSON asteroid records in DuckDB, evaluates orbital trajectories and diameters,
      exports columnar Parquet snapshots and hazardous candidate CSVs to Kestra internal storage.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      neo_feed.json: "{{ outputs.fetch_neo_feed.uri }}"
    outputFiles:
      - nasa_neo_snapshot.parquet
      - hazardous_asteroids.csv
    sql: |
      CREATE TABLE raw_feed AS
      SELECT * FROM read_json_auto('neo_feed.json');

      CREATE TABLE all_neos AS
      WITH dates AS (
          SELECT unnest(json_keys(near_earth_objects)) AS obs_date, near_earth_objects
          FROM raw_feed
      ),
      unpacked AS (
          SELECT 
              obs_date,
              unnest(from_json(near_earth_objects->obs_date, '["JSON"]')) AS neo
          FROM dates
      )
      SELECT 
          obs_date,
          neo->>'id' AS neo_id,
          neo->>'name' AS neo_name,
          ROUND(TRY_CAST(neo->'estimated_diameter'->'meters'->>'estimated_diameter_max' AS DOUBLE), 2) AS max_diameter_meters,
          TRY_CAST(neo->>'is_potentially_hazardous_asteroid' AS BOOLEAN) AS is_hazardous,
          ROUND(TRY_CAST(neo->'close_approach_data'->0->'miss_distance'->>'kilometers' AS DOUBLE), 2) AS miss_dist_km,
          ROUND(TRY_CAST(neo->'close_approach_data'->0->'miss_distance'->>'lunar' AS DOUBLE), 2) AS miss_dist_lunar,
          ROUND(TRY_CAST(neo->'close_approach_data'->0->'relative_velocity'->>'kilometers_per_hour' AS DOUBLE), 2) AS velocity_kmh,
          CURRENT_TIMESTAMP AS processed_at
      FROM unpacked
      ORDER BY miss_dist_lunar ASC;

      COPY all_neos TO 'nasa_neo_snapshot.parquet' (FORMAT PARQUET);

      CREATE TABLE alert_asteroids AS
      SELECT 
          obs_date,
          neo_id,
          neo_name,
          max_diameter_meters,
          is_hazardous,
          miss_dist_lunar,
          velocity_kmh
      FROM all_neos
      WHERE is_hazardous = true
         OR miss_dist_lunar <= {{ inputs.miss_distance_lunar_threshold }}
      ORDER BY miss_dist_lunar ASC;

      COPY alert_asteroids TO 'hazardous_asteroids.csv' (HEADER, DELIMITER ',');

      SELECT 
          (SELECT COUNT(*) FROM all_neos)::INTEGER AS total_neo_count,
          (SELECT COUNT(*) FROM alert_asteroids)::INTEGER AS alert_count,
          (SELECT neo_name FROM all_neos LIMIT 1) AS closest_neo_name,
          (SELECT miss_dist_lunar FROM all_neos LIMIT 1) AS closest_lunar_dist,
          (SELECT max_diameter_meters FROM all_neos LIMIT 1) AS closest_diameter_m;

  - id: check_hazardous_neo
    type: io.kestra.plugin.core.flow.If
    description: Checks whether any asteroids breach the close flyby threshold or are flagged hazardous.
    condition: "{{ outputs.process_asteroid_telemetry.row.alert_count > 0 }}"
    then:
      - id: notify_slack_neo
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: Emits an orbital close approach alert to the operations Slack channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "☄️ *NASA NeoWs Alert: Asteroid Close Approach Detected*",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*NASA Asteroid Close Approach Summary*\n• *Closest Object*: `{{ outputs.process_asteroid_telemetry.row.closest_neo_name }}`\n• *Miss Distance*: `{{ outputs.process_asteroid_telemetry.row.closest_lunar_dist }} Lunar Distances`\n• *Estimated Diameter*: `{{ outputs.process_asteroid_telemetry.row.closest_diameter_m }} meters`\n• *Total Objects Today*: `{{ outputs.process_asteroid_telemetry.row.total_neo_count }}`\n• *Flagged Objects*: `{{ outputs.process_asteroid_telemetry.row.alert_count }}`\n• *Snapshot Storage*: `{{ outputs.process_asteroid_telemetry.outputFiles['nasa_neo_snapshot.parquet'] }}`"
                }
              }
            ]
          }

  - id: persist_neo_state
    type: io.kestra.plugin.core.kv.Set
    description: Updates the latest asteroid observation metrics in the Kestra KV store.
    key: "{{ inputs.state_key }}"
    value:
      closest_asteroid: "{{ outputs.process_asteroid_telemetry.row.closest_neo_name }}"
      closest_dist_lunar: "{{ outputs.process_asteroid_telemetry.row.closest_lunar_dist }}"
      total_count: "{{ outputs.process_asteroid_telemetry.row.total_neo_count }}"
      updated_at: "{{ now() }}"

extend:
  title: NASA NeoWs Asteroid Close Approach Planetary Defense Watch
  metaTitle: NASA NeoWs Asteroid Planetary Defense Watch | Kestra
  shortDescription: Ingest NASA NeoWs asteroid telemetry, evaluate orbital miss distances in DuckDB, store Parquet, and alert in Slack.
  metaDescription: Ingest NASA NeoWs asteroid telemetry, evaluate orbital flyby distances in DuckDB, store Parquet, and alert on hazardous approaches.
  description: |
    ## What does this flow do?

    This blueprint tracks Near Earth Objects (asteroids and comets) making orbital close approaches to Earth using the official NASA NeoWs (Near Earth Object Web Service) REST API. Every morning at 06:00 UTC, the flow fetches the day's predicted asteroid trajectory feed.

    The flow unpacks the JSON data inside an embedded DuckDB instance, calculates estimated maximum diameters, relative velocities in kilometers per hour, and orbital miss distances in both kilometers and lunar distances ($1\text{ LD} \approx 384,400\text{ km}$). It exports columnar Parquet datasets and prioritized CSV reports to Kestra internal storage, maintains telemetry state in the Kestra KV store, and fires conditional Slack notifications when objects pass within configured proximity thresholds or carry the official NASA `is_potentially_hazardous_asteroid` designation.

    ## Why use this?

    Near-Earth asteroid surveillance provides essential situational awareness for aerospace organizations, astronomical observatories, and planetary defense research initiatives.

    Key advantages include:

    - **Official NASA Scientific API**: Queries NASA's authoritative Center for Near-Earth Object Studies (CNEOS) database with keyless demo access.
    - **Native Analytical Processing**: DuckDB transforms nested JSON arrays into structured relational tables, performs coordinate calculations, and generates compressed Parquet without external data pipelines.
    - **Dual Data Output**: Columnar Parquet preserves complete approach telemetry for longitudinal research while filtered CSV extracts highlight immediate flyby risks.
    - **Resilient Slack Delivery**: Notifications include `allowFailure: true` to prevent workflow interruption if messaging endpoints are temporarily unavailable.

    ## Architecture

    ```mermaid
    flowchart TD
      A["Schedule Trigger<br/>(Daily at 06:00 UTC)"] --> B["HTTP Download<br/>(NASA NeoWs Open REST API)"]
      B --> C["DuckDB Queries<br/>(Unpack Objects, Diameters & Miss Distances)"]
      C --> D["Kestra Internal Storage<br/>(nasa_neo_snapshot.parquet)"]
      C --> E["Kestra Internal Storage<br/>(hazardous_asteroids.csv)"]
      C --> F{"If Flagged Count > 0"}
      F -- Yes --> G["Slack Notification<br/>(Asteroid Approach Summary)"]
      F -- No --> H["Skip Alert"]
      G --> I["KV Set<br/>(Update Closest Asteroid State)"]
      H --> I
    ```

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB plugin (`io.kestra.plugin.jdbc.duckdb.Queries`) and the Slack notifications plugin (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).
    - Outbound HTTPS network connectivity to `api.nasa.gov`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Optional Slack incoming webhook endpoint for asteroid close-approach alert notifications.

    ## Quick start

    1. Import this flow into your Kestra instance.
    2. Click **Execute** using default inputs (`miss_distance_lunar_threshold: 20.0`).
    3. Review the outputs under the **Outputs** tab:
       - `nasa_neo_snapshot.parquet`: Columnar historical snapshot of all asteroids approaching Earth today.
       - `hazardous_asteroids.csv`: Tabular CSV listing all objects meeting the proximity threshold or flagged hazardous.
    4. View the KV store entry under `nasa_neows_state` to see the closest detected object and its lunar distance.
    5. Set `SLACK_WEBHOOK_URL` in your Kestra secrets and enable the schedule trigger.

    ## How to extend

    - **Custom NASA API Key**: Replace `DEMO_KEY` with a registered `NASA_API_KEY` secret for higher hourly request quotas.
    - **Multi-Day Lookahead**: Adjust the `start_date` and `end_date` query parameters to forecast asteroid approaches 7 days into the future.
    - **Data Warehouse Loading**: Add a downstream task using `io.kestra.plugin.aws.s3.Upload` or `io.kestra.plugin.snowflake.Load` to archive multi-year asteroid orbital data.

    ## Links

    - [Kestra HTTP Download Plugin](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download)
    - [Kestra DuckDB Plugin](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Kestra KV Store](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.set)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [NASA NeoWs API Documentation](https://api.nasa.gov/)
    - [NASA Center for Near-Earth Object Studies (CNEOS)](https://cneos.jpl.nasa.gov/)
  tags:
    - Data
  subTags:
    - ELT & Data Landing
    - Monitoring & Alerting
  ee: false
  demo: false
