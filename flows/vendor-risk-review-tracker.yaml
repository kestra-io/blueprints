id: vendor-risk-review-tracker
namespace: company.team

description: |
  Keeps third-party vendor security reviews from silently going stale, so
  critical suppliers are never months past their last assessment without a
  chase. A webhook starts the check whenever a new vendor intake arrives and a
  disabled monthly schedule stands ready as the fallback net; a shell step
  writes the vendor register as a CSV and a python step parses it with the csv
  module to flag every vendor whose next review date has passed, count the ones
  landing inside the due-soon window and tally the overdue ones sitting in the
  critical tier. When overdue reviews exist, each responsible owner gets a
  targeted chase email, one GitHub rollup issue is opened and the escalation
  channel gets a Slack summary; a clean register is logged as all current. Each
  run exposes the verdict, the overdue count, the overdue vendor array and the
  critical overdue count as typed outputs.

triggers:
  - id: new_vendor_intake
    type: io.kestra.plugin.core.trigger.Webhook
    description: Procurement posts here the moment a new vendor intake is filed, so the register is checked before onboarding moves ahead.
    key: "{{ secret('VENDOR_INTAKE_WEBHOOK_KEY') }}"
  - id: monthly_review_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Disabled monthly net that would sweep the whole register on the first morning of each month until someone switches it on.
    cron: "0 6 1 * *"
    disabled: true

inputs:
  - id: github_repository
    type: STRING
    defaults: acme-corp/vendor-risk-register
    description: Repository that receives the rollup tracking issue when overdue reviews are found.
  - id: due_soon_window_days
    type: INT
    defaults: 30
    description: Horizon in days inside which a future next review date counts as due soon rather than clear.

tasks:
  # --- 1. the vendor register and its verdict ---
  - id: workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One shared directory so the CSV written by the shell step is the exact file the python step reads.
    tasks:
      - id: write_vendors
        type: io.kestra.plugin.scripts.shell.Commands
        description: Writes vendors.csv from a heredoc of ten rows with vendor, owner email, tier, last review date and next review date, dated forward from today so four rows land overdue and two land inside the due-soon window.
        commands:
          - |
            cat > vendors.csv <<VENDORS_EOF
            vendor,owner_email,tier,last_review,next_review
            Acme Payments,governance@acme-pay.example.com,critical,$(date -d "-200 days" +%F),$(date -d "-25 days" +%F)
            BluePeak Logistics,risk@bluepeak-log.example.com,high,$(date -d "-190 days" +%F),$(date -d "-12 days" +%F)
            CloudNest Hosting,compliance@cloudnest.example.com,critical,$(date -d "-210 days" +%F),$(date -d "-40 days" +%F)
            Delta Data Brokers,ops@deltadata.example.com,standard,$(date -d "-150 days" +%F),$(date -d "-3 days" +%F)
            Everline Analytics,security@everline-analytics.example.com,high,$(date -d "-100 days" +%F),$(date -d "+15 days" +%F)
            Ferngate Staffing,people@ferngate-staff.example.com,standard,$(date -d "-90 days" +%F),$(date -d "+30 days" +%F)
            GreenArc Insurance,trust@greenarc-ins.example.com,critical,$(date -d "-80 days" +%F),$(date -d "+60 days" +%F)
            HarborPoint Travel,vendor@harborpoint-travel.example.com,standard,$(date -d "-70 days" +%F),$(date -d "+120 days" +%F)
            Indigo Cloud Backup,ops@indigo-backup.example.com,high,$(date -d "-60 days" +%F),$(date -d "+45 days" +%F)
            Juniper Legal Services,contracts@juniper-legal.example.com,standard,$(date -d "-50 days" +%F),$(date -d "+90 days" +%F)
            VENDORS_EOF
            wc -l vendors.csv

      - id: review_vendors
        type: io.kestra.plugin.scripts.python.Script
        description: Parses the CSV with the csv module, flags vendors whose next review date has passed, counts the ones inside the due-soon window and tallies critical tier overdue.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          DUE_SOON_WINDOW: "{{ inputs.due_soon_window_days }}"
        script: |
          import csv
          import json
          import os
          from datetime import date

          CSV_FILE = "vendors.csv"
          VALID_TIERS = ("critical", "high", "standard")

          try:
              window = int(os.environ.get("DUE_SOON_WINDOW", "30"))
          except ValueError:
              window = 30

          today = date.today()

          header = []
          rows = []
          if os.path.exists(CSV_FILE):
              with open(CSV_FILE, newline="", encoding="utf-8") as handle:
                  reader = csv.DictReader(handle)
                  header = list(reader.fieldnames or [])
                  rows = [row for row in reader]

          required = ("vendor", "owner_email", "tier", "last_review", "next_review")
          has_columns = all(name in header for name in required)

          overdue = []
          due_soon_count = 0
          critical_overdue = 0
          skipped = 0
          if has_columns:
              for row in rows:
                  vendor = (row.get("vendor") or "").strip()
                  owner = (row.get("owner_email") or "").strip()
                  tier = (row.get("tier") or "").strip().lower()
                  if not vendor or not owner:
                      skipped += 1
                      continue
                  if tier not in VALID_TIERS:
                      tier = "standard"
                  try:
                      next_review = date.fromisoformat((row.get("next_review") or "").strip())
                  except ValueError:
                      skipped += 1
                      continue
                  if next_review < today:
                      days_overdue = (today - next_review).days
                      overdue.append({
                          "vendor": vendor,
                          "owner": owner,
                          "tier": tier,
                          "days_overdue": days_overdue,
                      })
                      if tier == "critical":
                          critical_overdue += 1
                  elif (next_review - today).days <= window:
                      due_soon_count += 1

          overdue.sort(key=lambda item: item["days_overdue"], reverse=True)
          overdue_count = len(overdue)

          if not has_columns or not rows or (rows and skipped == len(rows)):
              verdict = "NO_DATA"
          elif overdue_count > 0:
              verdict = "ESCALATE"
          elif due_soon_count > 0:
              verdict = "DUE_SOON_ONLY"
          else:
              verdict = "ALL_CURRENT"

          print("vendor review sweep found %d overdue (%d critical) and %d due soon" % (overdue_count, critical_overdue, due_soon_count))
          print("::" + json.dumps({"outputs": {"verdict": verdict, "overdue_count": overdue_count, "vendors": overdue, "critical_overdue": critical_overdue}}, ensure_ascii=True) + "::")

  # --- 2. the overdue gate ---
  - id: overdue_gate
    type: io.kestra.plugin.core.flow.If
    description: Escalates only when at least one vendor has blown its next review date; a clean register just logs itself.
    condition: "{{ outputs.review_vendors.vars.overdue_count > 0 }}"
    then:
      - id: chase_owners
        type: io.kestra.plugin.core.flow.Loop
        description: Walks the overdue vendors one by one so each owner is chased about their own vendor instead of a generic list.
        values: "{{ outputs.review_vendors.vars.vendors }}"
        concurrencyLimit: 1
        tasks:
          - id: send_owner_chase
            type: io.kestra.plugin.email.MailSend
            description: Reminds a single owner that a named vendor is past its next review date, with the tier and days overdue in the subject.
            from: "{{ secret('SMTP_FROM') }}"
            to: "{{ item.value.owner }}"
            host: "{{ secret('SMTP_HOST') }}"
            username: "{{ secret('SMTP_USERNAME') }}"
            password: "{{ secret('SMTP_PASSWORD') }}"
            port: 465
            subject: "Overdue vendor security review for {{ item.value.vendor }} ({{ item.value.tier }}, {{ item.value.days_overdue }} days)"
            htmlTextContent: |
              <p>{{ item.value.owner }},</p>
              <p>The security review for <strong>{{ item.value.vendor }}</strong> (tier <strong>{{ item.value.tier }}</strong>) is <strong>{{ item.value.days_overdue }}</strong> days past its next review date.</p>
              <p>Schedule and complete the reassessment so this vendor drops off the overdue register.</p>
              <p>Execution {{ execution.id }}</p>

      - id: open_rollup_issue
        type: io.kestra.plugin.github.issues.Create
        description: Opens one labeled tracking issue listing every overdue vendor with tier, owner and days overdue, so the chase leaves a backlog record.
        jwtToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.github_repository }}"
        title: "Vendor security reviews overdue - {{ outputs.review_vendors.vars.overdue_count }} vendor(s), {{ outputs.review_vendors.vars.critical_overdue }} critical"
        body: |
          ## Overdue vendor security reviews

          **{{ outputs.review_vendors.vars.overdue_count }} vendor(s)** are past their next review date, **{{ outputs.review_vendors.vars.critical_overdue }}** of them in the critical tier.

          | Vendor | Tier | Owner | Days overdue |
          | --- | --- | --- | --- |
          {% for entry in outputs.review_vendors.vars.vendors %}| {{ entry.vendor }} | {{ entry.tier }} | {{ entry.owner }} | {{ entry.days_overdue }} |
          {% endfor %}

          Execution: {{ execution.id }}

          Schedule the reassessment with each owner, then close this issue once the register is clean again.
        labels:
          - vendor-risk
          - security-review

      - id: alert_slack
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Summarizes the overdue count, the critical tally and the worst offenders so the escalation channel sees the exposure at once.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": "Vendor review sweep found {{ outputs.review_vendors.vars.overdue_count }} overdue review(s), {{ outputs.review_vendors.vars.critical_overdue }} critical. {% for entry in outputs.review_vendors.vars.vendors %}{{ entry.vendor }} ({{ entry.tier }}, {{ entry.days_overdue }}d) owned by {{ entry.owner }}. {% endfor %}Rollup issue opened in {{ inputs.github_repository }}. Execution {{ execution.id }}."}
    else:
      - id: log_all_current
        type: io.kestra.plugin.core.log.Log
        description: Records the quiet outcome, where every vendor review is still inside its cycle and nothing needs chasing.
        message: "All vendor reviews current - verdict {{ outputs.review_vendors.vars.verdict }}, {{ outputs.review_vendors.vars.overdue_count }} overdue, {{ outputs.review_vendors.vars.critical_overdue }} critical overdue."

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Escalate any failure to the ops channel with the execution url.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "FAILED: {{ flow.id }} {{ execution.id }}"}

outputs:
  - id: verdict
    type: STRING
    value: "{{ outputs.review_vendors.vars.verdict }}"
  - id: overdue_count
    type: INT
    value: "{{ outputs.review_vendors.vars.overdue_count }}"
  - id: vendors
    type: ARRAY
    value: "{{ outputs.review_vendors.vars.vendors | toJson }}"
  - id: critical_overdue
    type: INT
    value: "{{ outputs.review_vendors.vars.critical_overdue }}"

extend:
  title: Keep third-party vendor security reviews on schedule and chase overdue owners
  metaTitle: Keep Vendor Security Reviews Current and Chase Overdue Owners
  shortDescription: Check the vendor register against next review dates, email each owner with an overdue review, open a GitHub rollup issue and ping Slack when reviews slip.
  metaDescription: Read the vendor register CSV, flag overdue security reviews by tier, email each owner, open a GitHub rollup issue and alert Slack when reviews slip.
  description: |
    Vendor security reviews rot quietly. A critical payments processor goes twelve months without a questionnaire because the owner changed jobs, nobody notices until the audit, and the finding lands on the company instead of the vendor. This flow runs on demand from the intake webhook, or on the first morning of each month once the disabled schedule is switched on, reads the vendor register CSV and flags every vendor whose next review date has passed, with special attention to the critical tier. When overdue reviews exist, each responsible owner receives a chase email naming their vendor, one GitHub rollup issue is opened for tracking and the escalation channel gets a Slack summary; a clean register is logged as all current instead.

    ## How it works

    1. `new_vendor_intake` (`io.kestra.plugin.core.trigger.Webhook`) lets procurement start the check the moment a new vendor intake is filed. `monthly_review_sweep` (`io.kestra.plugin.core.trigger.Schedule`, cron `0 6 1 * *`) sits disabled as the net to switch on for a first-of-month sweep.
    2. `workspace` (`io.kestra.plugin.core.flow.WorkingDirectory`) opens one shared directory for the fixture and for the parser that consumes it.
    3. `write_vendors` (`io.kestra.plugin.scripts.shell.Commands`) drops `vendors.csv` with a heredoc of ten rows, each carrying vendor name, owner email, tier, last review date and next review date, dated forward from today so the fixture always holds four overdue reviews and two inside the due-soon window.
    4. `review_vendors` (`io.kestra.plugin.scripts.python.Script`) reads the file with the `csv` module, flags every vendor whose `next_review` date is before today, counts the ones landing inside the `due_soon_window_days` horizon, tallies how many overdue vendors sit in the critical tier, and prints one `::{"outputs": ...}::` line carrying `verdict`, `overdue_count`, `vendors` and `critical_overdue`.
    5. `overdue_gate` (`io.kestra.plugin.core.flow.If`) escalates only when `overdue_count` is above zero.
    6. In the escalation branch `chase_owners` (`io.kestra.plugin.core.flow.Loop`) runs `send_owner_chase` (`io.kestra.plugin.email.MailSend`) once per overdue vendor against that owner's address, `open_rollup_issue` (`io.kestra.plugin.github.issues.Create`) files one labeled tracking issue with the full table, and `alert_slack` (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) posts the exposure summary. The other branch records the quiet outcome with `log_all_current` (`io.kestra.plugin.core.log.Log`).
    7. The `errors` handler pings Slack when the run itself breaks, because a silent failure looks exactly like a clean register.

    ## What you get

    - `verdict` (STRING): `ESCALATE` when one or more reviews are overdue, `DUE_SOON_ONLY` when nothing is overdue but something lands inside the due-soon window, `ALL_CURRENT` when every review is comfortably in the future, `NO_DATA` when the file carries no usable rows.
    - `overdue_count` (INT): vendors past their next review date, zero on a clean register.
    - `vendors` (ARRAY): one object per overdue vendor with `vendor`, `owner`, `tier` and `days_overdue`, sorted worst first so the loop chases the oldest lapse first.
    - `critical_overdue` (INT): how many of the overdue vendors sit in the critical tier, the number that should decide how loud the escalation is.
    - One chase email per owner plus one GitHub rollup issue and a Slack summary when escalation fires, and a log line only when it does not.

    ## Who it's for

    - Security and compliance teams who own the vendor risk register and need every third-party assessment renewed before the auditor asks.
    - Procurement and vendor managers who file new intakes and want an immediate answer on whether the register is already behind.
    - Operations leads who want the chase to leave a paper trail through email, a GitHub issue and Slack instead of living in a spreadsheet reminder.

    ## Why orchestrate this with Kestra

    A calendar reminder on a spreadsheet only works when somebody opens the spreadsheet. Kestra supplies the intake webhook and the disabled monthly schedule, the branch that separates a clean register from a lapsed one, the loop that turns one parse into one email per owner, and email, GitHub and Slack routing from a single versioned file. The verdict, the overdue count and the critical tally are typed outputs, so a dashboard or an onboarding gate can read the state without scraping logs, and the `errors` handler keeps a broken run visible.

    ## Prerequisites

    - A Kestra instance with the email, GitHub and Slack plugins available to the worker.
    - An SMTP relay reachable from the worker, with a sender address allowed to use it.
    - A GitHub personal access token able to open issues in the register repository.
    - A Slack incoming webhook for the escalation summary and for failure alerts.
    - A vendor register export shaped as `vendor, owner_email, tier, last_review, next_review`, supplied through the heredoc fixture or replaced with your own export task.

    ### Secrets

    - `VENDOR_INTAKE_WEBHOOK_KEY`: key segment guarding the webhook URL, so only your intake tool can start a check.
    - `SMTP_FROM`: sender address shown on every owner chase email.
    - `SMTP_HOST`, `SMTP_USERNAME`, `SMTP_PASSWORD`: SMTP relay and credentials used by `send_owner_chase`.
    - `GITHUB_TOKEN`: token used by `open_rollup_issue` to file the tracking issue.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used for the escalation summary and for failure alerts.

    ## Quick start

    1. Add the seven secrets to your namespace and import the flow.
    2. Point `github_repository` at the repo that should receive the rollup issues, and set `due_soon_window_days` if thirty days is not your warning horizon.
    3. Execute the flow once against the fixture and read `verdict`, `overdue_count`, `vendors` and `critical_overdue` in the outputs.
    4. Point your intake tool at `/api/v1/{tenant}/executions/webhook/{namespace}/vendor-risk-review-tracker/VENDOR_INTAKE_WEBHOOK_KEY`, then confirm one email per overdue owner, the GitHub rollup issue and the Slack summary.
    5. Switch on `monthly_review_sweep` when you want the whole register swept on the first morning of each month.

    ## How to extend

    - Replace the heredoc with an export from your GRC or procurement system, or a `jdbc` query against the vendor database, and keep the same python verdict.
    - Group overdue vendors by owner before the loop when one owner should get a single digest instead of one email per vendor.
    - Add a second gate on `critical_overdue` to page the security lead directly when a critical vendor is the one lapsing.
    - Feed `verdict` into an onboarding gate flow so a new contract cannot proceed while the register reads `ESCALATE`.

    ## Links

    - [Email MailSend task](https://kestra.io/plugins/plugin-email/io.kestra.plugin.email.mailsend)
    - [GitHub issues Create task](https://kestra.io/plugins/plugin-github/io.kestra.plugin.github.issues.create)
    - [Loop task documentation](https://kestra.io/docs/workflow-components/tasks/flow-control/loop)
    - [Kestra flow triggers](https://kestra.io/docs/concepts/triggers)
  tags:
    - Business
  subTags:
    - vendor-risk
    - security-review
    - compliance
    - notifications
  ee: false
  demo: false
