id: aws-rds-overprovisioned-iops-sentinel
namespace: company.finops

inputs:
  - id: aws_region
    type: STRING
    defaults: us-east-1
    description: AWS region to audit RDS database instances.
  - id: min_utilization_percent_threshold
    type: FLOAT
    defaults: 20.0
    description: Minimum acceptable provisioned IOPS utilization percentage over 7 days before alerting.

tasks:
  - id: audit_rds_provisioned_iops
    type: io.kestra.plugin.aws.cli.AwsCLI
    runner: PROCESS
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        aws rds describe-db-instances --output json > rds_instances.json
        python3 -c "
        import json, subprocess
        with open('rds_instances.json') as f:
            instances = json.load(f).get('DBInstances', [])
        overprovisioned = []
        for db in instances:
            iops = db.get('Iops', 0)
            storage_type = db.get('StorageType', '')
            db_id = db.get('DBInstanceIdentifier')
            if iops and iops > 1000 and ('io' in storage_type or 'gp3' in storage_type):
                cmd = f'aws cloudwatch get-metric-statistics --namespace AWS/RDS --metric-name ReadIOPS --dimensions Name=DBInstanceIdentifier,Value={db_id} --start-time $(date -u -v-7d +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d "7 days ago" +%Y-%m-%dT%H:%M:%SZ) --end-time $(date -u +%Y-%m-%dT%H:%M:%SZ) --period 86400 --statistics Average --output json'
                res = subprocess.run(cmd, shell=True, capture_output=True, text=True)
                avg_iops = 0.0
                if res.returncode == 0:
                    dps = json.loads(res.stdout).get('Datapoints', [])
                    if dps:
                        avg_iops = sum(dp['Average'] for dp in dps) / len(dps)
                utilization_pct = (avg_iops / iops) * 100.0 if iops > 0 else 100.0
                if utilization_pct < {{ inputs.min_utilization_percent_threshold }}:
                    overprovisioned.append({
                        'db_id': db_id,
                        'provisioned_iops': iops,
                        'avg_consumed_iops': round(avg_iops, 1),
                        'utilization_pct': round(utilization_pct, 1)
                    })
        result = {
            'total_audited': len(instances),
            'overprovisioned_count': len(overprovisioned),
            'instances': overprovisioned,
            'alert_triggered': len(overprovisioned) > 0
        }
        with open('rds_summary.json', 'w') as out:
            json.dump(result, out)
        print('RDS IOPS audit:', result)
        "
    outputFiles:
      - rds_summary.json

  - id: evaluate_iops_waste
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.audit_rds_provisioned_iops.outputFiles['rds_summary.json'])).alert_triggered }}"
    then:
      - id: alert_finops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":money_with_wings: *RDS FinOps Alert*: Found {{ json(read(outputs.audit_rds_provisioned_iops.outputFiles['rds_summary.json'])).overprovisioned_count }} RDS databases with provisioned IOPS utilization below {{ inputs.min_utilization_percent_threshold }}% in {{ inputs.aws_region }}."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *RDS Sentinel Execution Failure*: Failed to audit RDS instances in {{ inputs.aws_region }}."
      }

triggers:
  - id: weekly_iops_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * 1"
    disabled: true

extend:
  title: AWS RDS Overprovisioned IOPS Utilization Sentinel
  shortDescription: Audits Amazon RDS database instances and detects severely underutilized provisioned IOPS incurring unnecessary storage costs.
  description: |
    ## How it works
    This sentinel leverages `AwsCLI` to discover provisioned IOPS storage configurations across RDS instances, queries Amazon CloudWatch for 7-day average read and write operations, and calculates actual capacity utilization against allocated quotas.

    ## What you get
    - Continuous programmatic FinOps auditing across all relational database tiers.
    - Identification of high-cost `io1`/`io2`/`gp3` volumes provisioned above actual workload demands.
    - Automated Slack recommendations to right-size database storage tiers.

    ## Who it's for
    - FinOps analysts and cloud architects driving database optimization.
    - Database administrators seeking visibility into provisioned storage efficiency.

    ## Why orchestrate this with Kestra
    Kestra bridges infrastructure metrics and FinOps automation, allowing engineering teams to run scheduled multi-service audits without standing operational infrastructure.

    ## Prerequisites
    - AWS IAM credentials with `rds:DescribeDBInstances` and `cloudwatch:GetMetricStatistics` permissions.
    - Secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure AWS credentials and Slack webhook.
    3. Run a manual execution to audit database storage headroom.

    ## How to extend
    - Query CPU and memory metrics simultaneously to propose comprehensive instance right-sizing.
    - Trigger automated Terraform pull requests proposing IOPS downgrades.
    - Export findings to AWS Cost Hub dashboards.

    ## Links
    - [Kestra AWS Plugin](https://kestra.io/plugins/plugin-aws)
    - [Amazon RDS Provisioned IOPS Storage](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_Storage.html)
  tags:
    - Cloud
    - Business
  subTags:
    - FinOps & Cost Management
    - Monitoring & Alerting
  ee: false
  demo: false
