id: aviationweather-metar-taf-airport-ops-alert
namespace: company.team

description: |
  Flight-category watch for a list of airports, built on the keyless NOAA Aviation Weather
  Center Data API. Every 20 minutes the flow fetches the latest METAR and TAF for all airports
  in two requests, computes VFR/MVFR/IFR/LIFR from the ceiling and the visibility, cross-checks
  the result against the API's own `fltCat`, applies optional per-airport minimums, detects
  category transitions against the KV store with hysteresis, reads the TAF change groups for
  IFR expected in the next hours, and flags stale or missing reports. A Switch on the worst
  new condition picks the Slack message.

inputs:
  - id: airports
    type: JSON
    displayName: Airports and personal minimums
    description: |
      JSON array of airports. Each item is an ICAO id string, or an object with `icao` and the
      optional `min_ceiling_ft` and `min_visibility_sm` (your operating minimums). The defaults mix
      fog-prone and clear airports in North America and Europe so the first run shows several categories;
      PAHY is an automated Alaskan station without a visibility sensor, which the cross-check explains.
    defaults: |
      [
        {"icao": "KSFO", "min_ceiling_ft": 1500, "min_visibility_sm": 3},
        {"icao": "KMRY"},
        {"icao": "KJFK"},
        {"icao": "PANC", "min_ceiling_ft": 3000, "min_visibility_sm": 5},
        {"icao": "PABE"},
        {"icao": "CYYD"},
        {"icao": "EGLL"},
        "EGPF",
        "PAHY"
      ]

  - id: taf_lookahead_hours
    type: INT
    defaults: 6
    description: Warn when a TAF period starting within this many hours forecasts IFR, LIFR or conditions below your minimums.

  - id: stale_after_minutes
    type: INT
    defaults: 90
    description: A METAR older than this is STALE. Routine METARs are hourly (US stations at about :53), so 90 minutes means one report was missed.

  - id: improve_confirmations
    type: INT
    defaults: 2
    description: Hysteresis. A worse category alerts on the first report; a better one only after this many consecutive new reports agree, so a ceiling flapping around 1,000 ft does not alert every hour.

triggers:
  - id: every_20_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/20 * * * *"
    description: Routine METARs arrive hourly, SPECI reports at any time when conditions change; a 20-minute check catches a SPECI well before the next routine report.

tasks:
  - id: station_ids
    type: io.kestra.plugin.core.debug.Return
    description: Upper-cased, de-duplicated list of syntactically valid ICAO ids for the API calls. Invalid entries are kept out of the URL and reported by the evaluate task.
    format: "{{ inputs.airports | jq('[.[] | (if type == \"string\" then . else (.icao // \"\") end) | ascii_upcase | gsub(\" \"; \"\") | select(test(\"^[A-Z0-9]{4}$\"))] | unique | join(\",\")') | first }}"

  - id: require_ids
    type: io.kestra.plugin.core.execution.Fail
    condition: "{{ outputs.station_ids.value | trim == '' }}"
    errorMessage: "No valid 4-character ICAO id in the airports input."

  - id: fetch
    type: io.kestra.plugin.core.flow.Parallel
    description: METAR and TAF are separate endpoints; both take the whole comma-separated id list in one request.
    tasks:
      - id: fetch_metar
        type: io.kestra.plugin.core.http.Download
        description: |
          `hours=3` returns every report of the last three hours, so a station that missed its last report still
          appears (and is flagged STALE) instead of looking unknown. The API answers 204 with an empty body when no
          station matches, hence `failOnEmptyResponse: false`.
        uri: "https://aviationweather.gov/api/data/metar?ids={{ outputs.station_ids.value }}&format=json&hours=3"
        headers:
          User-Agent: "kestra-aviationweather-airport-ops-alert/1.0 (+https://kestra.io)"
          Accept: application/json
        failOnEmptyResponse: false
        retry:
          type: constant
          interval: PT20S
          maxAttempts: 3

      - id: fetch_taf
        type: io.kestra.plugin.core.http.Download
        description: Decoded TAFs; each `fcsts` item is one change group (base, FM, BECMG, TEMPO, PROB30/40) with its own time range.
        uri: "https://aviationweather.gov/api/data/taf?ids={{ outputs.station_ids.value }}&format=json"
        headers:
          User-Agent: "kestra-aviationweather-airport-ops-alert/1.0 (+https://kestra.io)"
          Accept: application/json
        failOnEmptyResponse: false
        retry:
          type: constant
          interval: PT20S
          maxAttempts: 3

  - id: previous_state
    type: io.kestra.plugin.core.kv.Get
    key: aviationweather_airport_ops_state
    errorOnMissing: false
    description: Per airport the confirmed category level, last processed observation time, pending improvement, reporting status and last TAF warning. Missing on the first run (BASELINE).

  - id: evaluate
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      All of the aviation logic, in SQL. Flight category uses the FAA thresholds: ceiling is the lowest BKN, OVC or
      vertical-visibility (VV, `OVX` in the API) layer; LIFR below 500 ft or 1 SM, IFR below 1,000 ft or 3 SM, MVFR
      up to 3,000 ft or 5 SM. Ceiling and visibility are rated separately so the cross-check can say which element
      the API's `fltCat` disagrees on or why it is missing. A level combines category and minimums
      (category * 2 + below_minimums) and drives the hysteresis. TAF change groups that omit visibility or sky
      (common for TEMPO and PROB) inherit them from the prevailing group before them.
    url: "jdbc:duckdb:"
    timeZoneId: UTC
    fetchType: FETCH_ONE
    inputFiles:
      metar.json: "{{ outputs.fetch_metar.uri }}"
      taf.json: "{{ outputs.fetch_taf.uri }}"
      state.json: "{{ outputs.previous_state.value ?? '[]' }}"
    outputFiles:
      - airports_csv
    parameters:
      airports: "{{ inputs.airports | toJson }}"
      stale_minutes: "{{ inputs.stale_after_minutes }}"
      lookahead_hours: "{{ inputs.taf_lookahead_hours }}"
      confirmations: "{{ inputs.improve_confirmations }}"
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE clock AS SELECT CAST(epoch(now()) AS BIGINT) AS now_e;
      CREATE MACRO ceil_rank(known, ceil) AS CASE WHEN NOT coalesce(known, false) THEN NULL WHEN ceil IS NULL THEN 0
        WHEN ceil < 500 THEN 3 WHEN ceil < 1000 THEN 2 WHEN ceil <= 3000 THEN 1 ELSE 0 END;
      CREATE MACRO vis_rank(vis) AS CASE WHEN vis IS NULL THEN NULL
        WHEN vis < 1 THEN 3 WHEN vis < 3 THEN 2 WHEN vis <= 5 THEN 1 ELSE 0 END;
      CREATE MACRO cat_name(r) AS CASE r WHEN 0 THEN 'VFR' WHEN 1 THEN 'MVFR' WHEN 2 THEN 'IFR' WHEN 3 THEN 'LIFR' ELSE 'UNKNOWN' END;
      CREATE MACRO zt(e) AS strftime(to_timestamp(e), '%d/%H%MZ');
      CREATE MACRO lowest_ceiling(clouds, vv) AS list_min(list_transform(
        list_filter(from_json(clouds, '["JSON"]'), x -> json_extract_string(x, '$.cover') IN ('BKN', 'OVC', 'OVX')),
        x -> coalesce(TRY_CAST(json_extract_string(x, '$.base') AS INTEGER), vv)));
      CREATE MACRO json_list(content) AS from_json(CASE WHEN trim(content) = '' THEN '[]' ELSE content END, '["JSON"]');

      CREATE TABLE ap AS
      SELECT pos, icao, regexp_full_match(coalesce(icao, ''), '[A-Z0-9]{4}') AS valid,
             TRY_CAST(a->>'$.min_ceiling_ft' AS INTEGER) AS min_ceiling_ft,
             TRY_CAST(a->>'$.min_visibility_sm' AS DOUBLE) AS min_visibility_sm
      FROM (SELECT a, row_number() OVER () AS pos,
                   replace(upper(CASE WHEN json_type(a) = 'VARCHAR' THEN a->>'$' ELSE a->>'$.icao' END), ' ', '') AS icao
            FROM (SELECT unnest(from_json(:airports, '["JSON"]')) AS a))
      QUALIFY row_number() OVER (PARTITION BY icao ORDER BY pos) = 1;

      -- Latest METAR or SPECI per station, METAR vertVis is in hundreds of feet
      CREATE TABLE obs AS
      SELECT *, coalesce(json_type(clouds) = 'ARRAY', false) AS sky_known,
             CASE WHEN json_type(clouds) = 'ARRAY' THEN lowest_ceiling(clouds, vert_vis * 100) END AS ceiling_ft
      FROM (SELECT m->>'$.icaoId' AS icao, m->>'$.name' AS name, m->>'$.metarType' AS metar_type, m->>'$.rawOb' AS raw_ob,
                   CAST(m->>'$.obsTime' AS BIGINT) AS obs_epoch, m->>'$.fltCat' AS api_cat, m->>'$.visib' AS vis_raw,
                   TRY_CAST(replace(nullif(m->>'$.visib', ''), '+', '') AS DOUBLE) AS vis_sm,
                   json_extract(m, '$.clouds') AS clouds, TRY_CAST(m->>'$.vertVis' AS INTEGER) AS vert_vis
            FROM (SELECT unnest(json_list(content)) AS m FROM read_text('metar.json')))
      QUALIFY row_number() OVER (PARTITION BY icao ORDER BY obs_epoch DESC) = 1;

      CREATE TABLE prev AS
      SELECT s->>'$.icao' AS icao, TRY_CAST(s->>'$.level' AS INTEGER) AS prev_level, TRY_CAST(s->>'$.obs_epoch' AS BIGINT) AS prev_obs,
             TRY_CAST(s->>'$.pending_level' AS INTEGER) AS pending_level, coalesce(TRY_CAST(s->>'$.pending_count' AS INTEGER), 0) AS pending_count,
             s->>'$.status' AS prev_status, s->>'$.taf_key' AS prev_taf_key
      FROM (SELECT unnest(json_list(content)) AS s FROM read_text('state.json'));

      CREATE TABLE cur AS
      SELECT a.*, o.name, o.metar_type, o.raw_ob, o.obs_epoch, o.api_cat, o.vis_raw, o.vis_sm, o.ceiling_ft, o.sky_known,
             CASE WHEN NOT a.valid THEN 'INVALID_ID' WHEN o.icao IS NULL THEN 'NO_REPORT'
                  WHEN k.now_e - o.obs_epoch > CAST(:stale_minutes AS INTEGER) * 60 THEN 'STALE' ELSE 'CURRENT' END AS status,
             CAST(round((k.now_e - o.obs_epoch) / 60.0) AS INTEGER) AS age_min,
             ceil_rank(o.sky_known, o.ceiling_ft) AS rc, vis_rank(o.vis_sm) AS rv
      FROM ap a CROSS JOIN clock k LEFT JOIN obs o ON o.icao = a.icao;

      CREATE TABLE cat AS
      SELECT *, CASE WHEN rk IS NOT NULL THEN rk * 2 + CAST(below_min AS INTEGER) END AS level
      FROM (SELECT *, CASE WHEN rc IS NULL AND rv IS NULL THEN NULL ELSE greatest(coalesce(rc, 0), coalesce(rv, 0)) END AS rk,
                   coalesce(ceiling_ft < min_ceiling_ft, false) OR coalesce(vis_sm < min_visibility_sm, false) AS below_min
            FROM cur);

      -- Hysteresis against the KV state, worse alerts at once, better needs N consecutive new reports
      CREATE TABLE tr AS
      SELECT *,
        CASE WHEN level IS NULL OR NOT new_report THEN 'NONE'
             WHEN prev_level IS NULL THEN 'BASELINE'
             WHEN level > prev_level THEN 'DEGRADED'
             WHEN level < prev_level AND pending_count + 1 >= CAST(:confirmations AS INTEGER) THEN 'IMPROVED'
             WHEN level < prev_level THEN 'PENDING_IMPROVEMENT'
             ELSE 'NONE' END AS cat_event
      FROM (SELECT c.*, p.prev_level, p.prev_obs, p.pending_level, coalesce(p.pending_count, 0) AS pending_count, p.prev_status, p.prev_taf_key,
                   p.icao IS NULL AS first_seen,
                   c.obs_epoch IS NOT NULL AND (p.prev_obs IS NULL OR c.obs_epoch > p.prev_obs) AS new_report
            FROM cat c LEFT JOIN prev p ON p.icao = c.icao WHERE c.valid);

      -- TAF change groups, vertVis is in feet here and TEMPO/PROB groups inherit what they omit
      CREATE TABLE taf AS
      SELECT t->>'$.icaoId' AS icao, t->>'$.issueTime' AS issue_time, CAST(t->>'$.validTimeTo' AS BIGINT) AS valid_to,
             json_extract(t, '$.fcsts') AS fcsts
      FROM (SELECT unnest(json_list(content)) AS t FROM read_text('taf.json'))
      QUALIFY row_number() OVER (PARTITION BY icao ORDER BY issue_time DESC) = 1;

      CREATE TABLE periods AS
      SELECT icao, valid_to, ord, coalesce(f->>'$.fcstChange', 'BASE') AS change, TRY_CAST(f->>'$.probability' AS INTEGER) AS prob,
             CAST(f->>'$.timeFrom' AS BIGINT) AS t_from, CAST(f->>'$.timeTo' AS BIGINT) AS t_to, f->>'$.wxString' AS wx,
             TRY_CAST(replace(nullif(f->>'$.visib', ''), '+', '') AS DOUBLE) AS vis_sm,
             json_array_length(json_extract(f, '$.clouds')) > 0 OR TRY_CAST(f->>'$.vertVis' AS INTEGER) IS NOT NULL AS sky,
             lowest_ceiling(json_extract(f, '$.clouds'), TRY_CAST(f->>'$.vertVis' AS INTEGER)) AS ceiling_ft
      FROM (SELECT icao, valid_to, ord, json_extract(fcsts, '$[' || ord || ']') AS f
            FROM (SELECT icao, valid_to, fcsts, unnest(range(CAST(json_array_length(fcsts) AS BIGINT))) AS ord FROM taf));

      CREATE TABLE fc AS
      SELECT *, rk * 2 + CAST(below_min AS INTEGER) AS level
      FROM (SELECT p.icao, p.change, p.prob, p.t_from, p.t_to, p.wx,
                   coalesce(p.vis_sm, b.vis_sm) AS eff_vis,
                   CASE WHEN p.sky THEN p.ceiling_ft ELSE b.ceiling_ft END AS eff_ceiling,
                   greatest(coalesce(ceil_rank(p.sky OR coalesce(b.sky, false), CASE WHEN p.sky THEN p.ceiling_ft ELSE b.ceiling_ft END), 0),
                            coalesce(vis_rank(coalesce(p.vis_sm, b.vis_sm)), 0)) AS rk,
                   coalesce((CASE WHEN p.sky THEN p.ceiling_ft ELSE b.ceiling_ft END) < a.min_ceiling_ft, false)
                     OR coalesce(coalesce(p.vis_sm, b.vis_sm) < a.min_visibility_sm, false) AS below_min
            FROM periods p
            JOIN ap a ON a.icao = p.icao
            CROSS JOIN clock k
            LEFT JOIN periods b ON b.icao = p.icao AND b.ord < p.ord AND b.change IN ('BASE', 'FM', 'BECMG')
            WHERE p.valid_to > k.now_e AND p.t_to > k.now_e AND p.t_from < k.now_e + CAST(:lookahead_hours AS INTEGER) * 3600
            QUALIFY row_number() OVER (PARTITION BY p.icao, p.ord ORDER BY b.ord DESC NULLS LAST) = 1);

      CREATE TABLE fc_worst AS
      SELECT icao, level AS fc_level, rk AS fc_rank, (rk >= 2 OR below_min) AS fc_bad, level || '@' || t_from AS taf_key,
             cat_name(rk) || CASE WHEN below_min THEN ' (below minimums)' ELSE '' END || ' in '
               || CASE WHEN prob IS NOT NULL THEN 'PROB' || prob || CASE WHEN change = 'TEMPO' THEN ' TEMPO' ELSE '' END ELSE change END
               || ' ' || zt(t_from) || '-' || zt(t_to) || ', vis ' || coalesce(CASE WHEN eff_vis >= 6 THEN '6+' ELSE CAST(eff_vis AS VARCHAR) END || ' SM', 'n/a')
               || ', ceiling ' || coalesce(CAST(eff_ceiling AS VARCHAR) || ' ft', 'none') || coalesce(', ' || wx, '') AS fc_detail
      FROM fc QUALIFY row_number() OVER (PARTITION BY icao ORDER BY level DESC, t_from) = 1;

      CREATE TABLE ev AS
      SELECT t.*, w.fc_level, w.fc_rank, w.fc_detail, w.taf_key, x.icao IS NOT NULL AS has_taf,
             CASE cat_event WHEN 'BASELINE' THEN level WHEN 'DEGRADED' THEN level
                  WHEN 'IMPROVED' THEN greatest(level, coalesce(pending_level, level)) ELSE prev_level END AS new_level,
             cat_event IN ('DEGRADED', 'IMPROVED') OR (cat_event = 'BASELINE' AND (rk >= 2 OR below_min)) AS cat_alert,
             CASE WHEN status IN ('STALE', 'NO_REPORT') AND coalesce(prev_status, '') <> status THEN status
                  WHEN status = 'CURRENT' AND prev_status IN ('STALE', 'NO_REPORT') THEN 'REPORTING_AGAIN' END AS status_event,
             coalesce(w.fc_bad, false) AND w.fc_level > coalesce(CASE cat_event WHEN 'BASELINE' THEN level WHEN 'DEGRADED' THEN level ELSE prev_level END, -1)
               AND w.taf_key IS DISTINCT FROM prev_taf_key AS taf_alert
      FROM tr t LEFT JOIN fc_worst w ON w.icao = t.icao LEFT JOIN taf x ON x.icao = t.icao;

      CREATE TABLE alerts AS
      SELECT icao, CASE WHEN cat_alert OR taf_alert THEN greatest(CASE WHEN cat_alert THEN rk ELSE -1 END, CASE WHEN taf_alert THEN fc_rank ELSE -1 END) END AS alert_rank,
             icao || coalesce(' ' || split_part(name, ',', 1), '') || ' - '
               || concat_ws('; ',
                    CASE WHEN cat_alert THEN CASE cat_event WHEN 'BASELINE' THEN 'now ' || cat_name(rk)
                         ELSE cat_name(CAST(floor(prev_level / 2) AS INTEGER)) || ' -> ' || cat_name(rk) || CASE cat_event WHEN 'IMPROVED' THEN ' (confirmed by ' || (pending_count + 1) || ' reports)' ELSE '' END END
                         || CASE WHEN below_min THEN ' BELOW YOUR MINIMUMS (' || coalesce(min_ceiling_ft || ' ft', '-') || ' / ' || coalesce(min_visibility_sm || ' SM', '-') || ')' ELSE '' END
                         || ', ceiling ' || coalesce(ceiling_ft || ' ft', 'none') || ', vis ' || coalesce(vis_raw || ' SM', 'n/a') || ', ' || metar_type || ' ' || zt(obs_epoch) END,
                    CASE status_event WHEN 'STALE' THEN 'METAR STALE, last report ' || age_min || ' min old'
                                      WHEN 'NO_REPORT' THEN 'NO METAR in the last 3 h (station not reporting, closed or unknown id)'
                                      WHEN 'REPORTING_AGAIN' THEN 'reporting again, ' || cat_name(rk) || ' at ' || zt(obs_epoch) END,
                    CASE WHEN taf_alert THEN 'TAF forecasts ' || fc_detail END)
               || CASE WHEN cat_alert THEN chr(10) || '    `' || raw_ob || '`' ELSE '' END AS line
      FROM ev WHERE cat_alert OR taf_alert OR status_event IS NOT NULL;

      COPY (
        SELECT c.icao, e.name, c.status, e.metar_type, zt(c.obs_epoch) AS obs_time, c.age_min, c.ceiling_ft, c.vis_raw AS visibility_sm,
               CASE WHEN c.obs_epoch IS NOT NULL THEN cat_name(c.rc) END AS ceiling_category,
               CASE WHEN c.obs_epoch IS NOT NULL THEN cat_name(c.rv) END AS visibility_category,
               CASE WHEN c.rk IS NULL THEN NULL ELSE cat_name(c.rk) END AS flight_category, c.api_cat AS api_flt_cat,
               CASE WHEN c.obs_epoch IS NULL THEN NULL WHEN c.api_cat IS NULL THEN 'API has no fltCat ('
                      || CASE WHEN c.rv IS NULL AND NOT c.sky_known THEN 'visibility and sky condition not reported' WHEN c.rv IS NULL THEN 'visibility not reported'
                              WHEN NOT c.sky_known THEN 'sky condition not reported' ELSE 'no reason given' END
                      || '), computed from ' || CASE WHEN c.rc IS NULL AND c.rv IS NULL THEN 'nothing, category UNKNOWN' WHEN c.rc IS NULL THEN 'visibility only' WHEN c.rv IS NULL THEN 'ceiling only' ELSE 'both' END
                      || CASE WHEN (c.rc IS NULL) <> (c.rv IS NULL) AND c.rk > 0 THEN ', so at least ' || cat_name(c.rk) ELSE '' END
                    WHEN c.api_cat = cat_name(c.rk) THEN 'match'
                    WHEN c.api_cat = cat_name(c.rc) THEN 'API matches ceiling alone, visibility ' || c.vis_raw || ' SM makes it ' || cat_name(c.rk)
                    WHEN c.api_cat = cat_name(c.rv) THEN 'API matches visibility alone, ceiling ' || coalesce(c.ceiling_ft || ' ft', 'none') || ' makes it ' || cat_name(c.rk)
                    ELSE 'API ' || c.api_cat || ' vs computed ' || cat_name(c.rk) || ', check the raw METAR' END AS cross_check,
               c.min_ceiling_ft, c.min_visibility_sm, c.below_min AS below_minimums,
               CASE WHEN e.prev_level IS NOT NULL THEN cat_name(CAST(floor(e.prev_level / 2) AS INTEGER)) END AS previous_category, e.cat_event, e.status_event,
               CASE WHEN e.cat_event = 'PENDING_IMPROVEMENT' THEN e.pending_count + 1 ELSE 0 END AS improving_reports,
               CASE WHEN NOT c.valid THEN NULL WHEN NOT e.has_taf THEN 'no TAF issued' ELSE e.fc_detail END AS taf_worst_in_window,
               e.taf_alert, c.raw_ob AS raw_metar
        FROM cat c LEFT JOIN ev e ON e.icao = c.icao ORDER BY c.pos
      ) TO '{{ outputFiles.airports_csv }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT count(*) FROM ap) AS airports,
        (SELECT count(*) FROM cat WHERE status = 'CURRENT') AS current,
        (SELECT count(*) FROM cat WHERE status = 'STALE') AS stale,
        (SELECT count(*) FROM cat WHERE status = 'NO_REPORT') AS no_report,
        (SELECT coalesce(string_agg(coalesce(nullif(icao, ''), '(empty)'), ', '), '') FROM ap WHERE NOT valid) AS invalid_ids,
        (SELECT coalesce(string_agg(icao || ' ' || cat_name(rk) || CASE WHEN below_min THEN '*' ELSE '' END, ', ' ORDER BY rk DESC, icao), '') FROM cat WHERE rk IS NOT NULL) AS categories,
        (SELECT count(*) FROM cat WHERE below_min) AS below_minimums,
        (SELECT count(*) FROM tr WHERE api_cat IS NOT NULL AND api_cat <> cat_name(rk)) AS fltcat_differences,
        (SELECT count(*) FROM tr WHERE obs_epoch IS NOT NULL AND api_cat IS NULL) AS fltcat_missing,
        (SELECT count(*) FROM prev) = 0 AS is_baseline,
        (SELECT count(*) FROM tr WHERE new_report) AS new_reports,
        (SELECT count(*) FROM tr WHERE cat_event = 'PENDING_IMPROVEMENT') AS pending_improvements,
        (SELECT count(*) FROM ev WHERE taf_alert) AS taf_warnings,
        (SELECT count(*) FROM alerts) AS alerts,
        (SELECT CASE WHEN max(alert_rank) IS NOT NULL THEN cat_name(max(alert_rank)) WHEN count(*) > 0 THEN 'UNKNOWN' ELSE 'NONE' END FROM alerts) AS worst_alert_category,
        (SELECT coalesce(string_agg(line, chr(10) ORDER BY coalesce(alert_rank, -1) DESC, icao), '') FROM alerts) AS alert_text,
        (SELECT coalesce(chr(10) || string_agg(line, chr(10) ORDER BY coalesce(alert_rank, -1) DESC, icao), '') FROM alerts) AS alert_body,
        (SELECT CAST(coalesce(json_group_array(o), '[]') AS VARCHAR) FROM (
           SELECT json_object('icao', icao, 'level', new_level, 'obs_epoch', coalesce(obs_epoch, prev_obs), 'status', status,
             'pending_level', CASE WHEN cat_event = 'PENDING_IMPROVEMENT' THEN greatest(level, coalesce(pending_level, level))
                                   WHEN cat_event = 'NONE' AND (NOT new_report OR level IS NULL) THEN pending_level END,
             'pending_count', CASE WHEN cat_event = 'PENDING_IMPROVEMENT' THEN pending_count + 1
                                   WHEN cat_event = 'NONE' AND (NOT new_report OR level IS NULL) THEN pending_count ELSE 0 END,
             'taf_key', CASE WHEN fc_level IS NOT NULL AND (fc_rank >= 2 OR fc_level % 2 = 1) THEN taf_key END) AS o
           FROM ev
           UNION ALL
           SELECT json_object('icao', icao, 'level', prev_level, 'obs_epoch', prev_obs, 'status', prev_status,
                              'pending_level', pending_level, 'pending_count', pending_count, 'taf_key', prev_taf_key)
           FROM prev WHERE icao NOT IN (SELECT icao FROM ev))) AS state_now;

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    key: aviationweather_airport_ops_state
    value: "{{ outputs.evaluate.outputs[0].row.state_now }}"
    description: One small JSON object per airport. Airports left out of a run keep their last state, so a one-off run on a different list does not reset the history.

  - id: log_alerts
    type: io.kestra.plugin.core.log.Log
    runIf: "{{ outputs.evaluate.outputs[0].row.alerts > 0 }}"
    level: WARN
    message: "{{ outputs.evaluate.outputs[0].row.alert_text }}"

  - id: warn_invalid
    type: io.kestra.plugin.core.log.Log
    runIf: "{{ outputs.evaluate.outputs[0].row.invalid_ids != '' }}"
    level: WARN
    message: "Skipped airports that are not 4-character ICAO ids: {{ outputs.evaluate.outputs[0].row.invalid_ids }}"

  - id: route_by_category
    type: io.kestra.plugin.core.flow.Switch
    description: Picks the message by the worst category among this run's alerts (colours follow the FAA chart convention). UNKNOWN means only reporting problems; NONE means nothing new.
    value: "{{ outputs.evaluate.outputs[0].row.worst_alert_category }}"
    cases:
      LIFR:
        - id: slack_lifr
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          allowFailure: true
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {"text": {{ ('<!here> :purple_circle: *LIFR at your airports* - ceiling below 500 ft or visibility below 1 SM' ~ outputs.evaluate.outputs[0].row.alert_body) | toJson }}}
      IFR:
        - id: slack_ifr
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          allowFailure: true
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {"text": {{ (':red_circle: *IFR at your airports* - ceiling below 1,000 ft or visibility below 3 SM' ~ outputs.evaluate.outputs[0].row.alert_body) | toJson }}}
      MVFR:
        - id: slack_mvfr
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          allowFailure: true
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {"text": {{ (':large_blue_circle: *Marginal VFR update*' ~ outputs.evaluate.outputs[0].row.alert_body) | toJson }}}
      VFR:
        - id: slack_vfr
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          allowFailure: true
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {"text": {{ (':large_green_circle: *Back to VFR*' ~ outputs.evaluate.outputs[0].row.alert_body) | toJson }}}
      UNKNOWN:
        - id: slack_reporting
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          allowFailure: true
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {"text": {{ (':grey_question: *METAR reporting problem* - no category can be trusted for these airports' ~ outputs.evaluate.outputs[0].row.alert_body) | toJson }}}
    defaults:
      - id: nothing_new
        type: io.kestra.plugin.core.log.Log
        message: "No category change, TAF warning or reporting change ({{ outputs.evaluate.outputs[0].row.new_reports }} new reports, {{ outputs.evaluate.outputs[0].row.pending_improvements }} improvements waiting for confirmation)."

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      {{ outputs.evaluate.outputs[0].row.airports }} airports{{ outputs.evaluate.outputs[0].row.is_baseline ? ' (BASELINE run)' : '' }}: {{ outputs.evaluate.outputs[0].row.current }} current, {{ outputs.evaluate.outputs[0].row.stale }} stale, {{ outputs.evaluate.outputs[0].row.no_report }} without report.
      Categories (* = below your minimums): {{ outputs.evaluate.outputs[0].row.categories }}
      fltCat cross-check: {{ outputs.evaluate.outputs[0].row.fltcat_differences }} differences, {{ outputs.evaluate.outputs[0].row.fltcat_missing }} missing in the API.
      New reports {{ outputs.evaluate.outputs[0].row.new_reports }}, alerts {{ outputs.evaluate.outputs[0].row.alerts }} (worst {{ outputs.evaluate.outputs[0].row.worst_alert_category }}), TAF warnings {{ outputs.evaluate.outputs[0].row.taf_warnings }}, improvements pending {{ outputs.evaluate.outputs[0].row.pending_improvements }}.

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.evaluate.outputs[0].row }}"
  - id: airports_csv
    type: FILE
    value: "{{ outputs.evaluate.outputFiles.airports_csv }}"

extend:
  title: Airport Flight Category and TAF IFR Alerts from NOAA Aviation Weather METARs
  metaTitle: METAR and TAF Airport Flight Category Alerts with NOAA Aviation Weather | Kestra
  shortDescription: Every 20 minutes, fetch METARs and TAFs for your airports from the NOAA Aviation Weather Center, compute VFR/MVFR/IFR/LIFR against your minimums, alert on category changes with hysteresis, warn about IFR in the TAF and flag stale or missing reports.
  metaDescription: NOAA Aviation Weather METAR and TAF check per airport with flight categories, personal minimums, hysteresis, TAF IFR warnings and Slack routing.
  description: |
    Dispatchers, drone and helicopter operators and FBOs care about one question per airport: is it VFR, MVFR, IFR or LIFR now, and will it be in the next few hours. The NOAA Aviation Weather Center (AWC) publishes every METAR, SPECI and TAF through a keyless JSON API that accepts many station ids in one request. This flow computes the flight category itself, cross-checks it against the API's `fltCat`, applies your minimums, remembers the confirmed category in the KV store, reads the TAF for IFR expected soon and flags stale or missing METARs. It works per airport on observations and forecasts, not on area warnings like the NWS public alerts.

    ## How it works

    1. A `Schedule` trigger runs every 20 minutes: routine METARs are hourly (about :53 in the US), SPECI reports come whenever conditions change.
    2. `station_ids` (Return, `jq`) upper-cases and de-duplicates the ICAO ids from the `airports` JSON input. `require_ids` (Fail) stops the run if none is valid.
    3. `fetch` (Parallel) downloads `/api/data/metar?ids=...&format=json&hours=3` and `/api/data/taf?ids=...&format=json`, one request each, with a User-Agent and retries. The three-hour window separates a station that missed a report (STALE) from one that sends nothing (NO_REPORT).
    4. `previous_state` (KV Get) reads the per-airport state. The first run is a BASELINE: airports already at IFR, LIFR or below minimums are reported once.
    5. `evaluate` (DuckDB) does the aviation logic:
       - Ceiling is the lowest BKN, OVC or vertical-visibility layer (`OVX`, from `VV`). Ceiling and visibility are rated separately with the FAA thresholds: LIFR below 500 ft or 1 SM, IFR below 1,000 ft or 3 SM, MVFR up to 3,000 ft or 5 SM.
       - The `fltCat` cross-check says `match`, which element the API agrees with, or why it has none: automated stations without a visibility sensor (`PWINO`) get a ceiling-only category, which is a lower bound.
       - Optional `min_ceiling_ft` and `min_visibility_sm` mark a report as below your minimums even at MVFR or VFR.
       - Hysteresis: a worse level alerts on the first new report, a better one only after `improve_confirmations` consecutive new reports. Re-reading the same METAR never counts.
       - TAF: change groups (base, FM, BECMG, TEMPO, PROB30/40) in the next `taf_lookahead_hours` are rated, TEMPO and PROB groups inherit omitted visibility or sky from the prevailing group, and a forecast worse than now warns once.
       - Stale (older than `stale_after_minutes`) and missing reports alert once, and again when the station is back.
    6. `save_state` (KV Set) stores the new state; airports left out of a run keep their history.
    7. `route_by_category` (Switch) picks the Slack message from the worst category in this run's alerts: LIFR, IFR, MVFR, VFR (recovery), UNKNOWN (reporting problems only) or nothing new. Slack tasks use `allowFailure`; alerts are also logged at WARN.

    ## What you get

    - A CSV per airport per run: status, report age, ceiling, visibility, per-element and overall category, API category and cross-check, minimums, event, worst TAF period and raw METAR.
    - Alerts only on change: degradations at once, confirmed improvements, new TAF warnings, stale or missing reports and recoveries.
    - Invalid ids (not four characters) are skipped with a warning; unknown ids show as NO_REPORT.

    ## Who it's for

    - Flight operations and dispatch teams at charter operators, flight schools and FBOs.
    - Drone (BVLOS) and helicopter EMS operators with their own ceiling and visibility minimums.

    ## Why orchestrate this with Kestra

    - Two retried requests per run, with the categorisation as readable SQL.
    - The KV store holds the confirmed category, which makes hysteresis and "alert once" work on a 20-minute schedule.
    - The Switch keeps the message choice declarative.

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB plugin and the Slack plugin.
    - Outbound HTTPS to `aviationweather.gov`; no API key. Keep one request per endpoint and the 20-minute schedule or slower, as AWC asks of API users.
    - This is situational awareness, not a weather briefing; it does not replace an official preflight briefing.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the alerts (optional; without it the Slack task warns and the run continues).

    ## Quick start

    1. Click **Execute** with the defaults: a BASELINE that reports airports at IFR or LIFR, PANC if below the example minimums (3,000 ft, 5 SM) and TAF warnings for 6 hours. PAHY shows a station without a visibility sensor.
    2. Execute again: nothing new, and the `nothing_new` branch logs the number of new reports.
    3. Add `"KXYZ"` and `"LAX"` to the list: the first is NO_REPORT, the second is skipped as invalid.
    4. Replace the list with your airports and minimums, add `SLACK_WEBHOOK_URL` and keep the schedule on.

    ## How to extend

    - Add wind and gust limits (the METAR and TAF include `wspd` and `wgst`) to the minimums.
    - Add PIREPs or SIGMETs from the same API for the airports in the list.
    - Load each run's CSV into a warehouse to build per-airport IFR statistics by hour and month.

    ## Links

    - [Aviation Weather Center Data API](https://aviationweather.gov/data/api/)
    - [FAA Aeronautical Information Manual, chapter 7 (meteorology)](https://www.faa.gov/air_traffic/publications/atpubs/aim_html/chap7_section_1.html)
    - [HTTP Download](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download) and [Parallel](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.parallel)
    - [Switch](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.switch)
    - [KV Get](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.get) and [KV Set](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.set)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
