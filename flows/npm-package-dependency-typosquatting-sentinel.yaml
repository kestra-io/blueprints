id: npm-package-dependency-typosquatting-sentinel
namespace: company.security
concurrency:
  limit: 1
inputs:
- id: package_json_url
  type: STRING
  displayName: Package Manifest URL
  description: URL pointing to the raw package.json manifest to inspect for suspicious
    dependencies.
  defaults: https://raw.githubusercontent.com/company/repo/main/package.json
- id: levenshtein_distance_threshold
  type: INT
  displayName: Max Edit Distance Threshold
  description: Levenshtein distance threshold for flagging near-identical package
    names against popular libraries.
  defaults: 1
- id: alert_on_typosquat_risk
  type: BOOL
  displayName: Alert on Typosquat Risk
  description: Whether to dispatch alerts when suspected impostor package dependencies
    are detected.
  defaults: true
- id: max_tolerated_suspicious_packages
  type: INT
  displayName: Max Tolerated Suspicious Packages
  description: Maximum permissible suspicious package count before triggering high-severity
    alerts.
  defaults: 0
tasks:
- id: scan_npm_dependencies
  type: io.kestra.plugin.scripts.python.Script
  description: Inspects package.json dependencies and computes edit distance against
    known high-profile NPM libraries to detect supply-chain attacks.
  containerImage: python:3.11-slim
  beforeCommands:
  - pip install requests kestra
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  env:
    MANIFEST_URL: '{{ inputs.package_json_url }}'
    MAX_DISTANCE: '{{ inputs.levenshtein_distance_threshold }}'
    GITHUB_TOKEN: '{{ secret(''GITHUB_READ_TOKEN'') }}'
  script: "import os\nimport sys\nimport json\nimport requests\nfrom kestra import\
    \ Kestra\n\nmanifest_url = os.environ.get(\"MANIFEST_URL\")\nmax_distance = int(os.environ.get(\"\
    MAX_DISTANCE\", \"1\"))\ntoken = os.environ.get(\"GITHUB_TOKEN\", \"\")\n\nPOPULAR_PACKAGES\
    \ = [\n    \"lodash\", \"express\", \"react\", \"react-dom\", \"axios\", \"moment\"\
    ,\n    \"chalk\", \"commander\", \"tslib\", \"webpack\", \"babel\", \"next\",\n\
    \    \"vue\", \"debug\", \"body-parser\", \"cors\", \"dotenv\", \"rxjs\"\n]\n\n\
    def levenshtein(s1, s2):\n    if len(s1) < len(s2):\n        return levenshtein(s2,\
    \ s1)\n    if len(s2) == 0:\n        return len(s1)\n    previous_row = range(len(s2)\
    \ + 1)\n    for i, c1 in enumerate(s1):\n        current_row = [i + 1]\n     \
    \   for j, c2 in enumerate(s2):\n            insertions = previous_row[j + 1]\
    \ + 1\n            deletions = current_row[j] + 1\n            substitutions =\
    \ previous_row[j] + (c1 != c2)\n            current_row.append(min(insertions,\
    \ deletions, substitutions))\n        previous_row = current_row\n    return previous_row[-1]\n\
    \nheaders = {}\nif token and token != \"mock-token\":\n    headers[\"Authorization\"\
    ] = f\"token {token}\"\n\nsuspicious = []\ntotal_deps = 0\n\ntry:\n    resp =\
    \ requests.get(manifest_url, headers=headers, timeout=15)\n    resp.raise_for_status()\n\
    \    data = resp.json()\n    deps = {**data.get(\"dependencies\", {}), **data.get(\"\
    devDependencies\", {})}\n    total_deps = len(deps)\n    for dep_name in deps.keys():\n\
    \        for popular in POPULAR_PACKAGES:\n            if dep_name != popular:\n\
    \                dist = levenshtein(dep_name.lower(), popular)\n             \
    \   if dist <= max_distance:\n                    suspicious.append({\n      \
    \                  \"dependency_name\": dep_name,\n                        \"\
    target_popular_package\": popular,\n                        \"edit_distance\"\
    : dist,\n                        \"severity\": \"HIGH\"\n                    })\n\
    except Exception as exc:\n    sys.stderr.write(f\"Error fetching package manifest\
    \ from {manifest_url}: {exc}\\n\")\n    sys.exit(1)\n\nsuspicious_count = len(suspicious)\n\
    print(f\"Scanned {total_deps} NPM dependencies. Found {suspicious_count} potential\
    \ typosquatting impostor packages.\")\n\nKestra.outputs({\n    \"total_dependencies_scanned\"\
    : total_deps,\n    \"suspicious_packages_count\": suspicious_count,\n    \"suspicious_packages_details\"\
    : json.dumps(suspicious)\n})\n"
- id: check_typosquat_findings
  type: io.kestra.plugin.core.flow.If
  description: Evaluates whether any suspicious typosquatting packages were identified
    in the scanned manifest.
  condition: '{{ outputs.scan_npm_dependencies.vars.suspicious_packages_count > inputs.max_tolerated_suspicious_packages
    }}'
  then:
  - id: notify_slack_appsec
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatches an alert to the Application Security channel detailing
      suspected supply-chain dependency typosquats.
    url: '{{ secret(''SLACK_WEBHOOK_URL'') }}'
    payload: "{\n  \"channel\": \"#appsec-alerts\",\n  \"username\": \"NPM-Typosquat-Sentinel\"\
      ,\n  \"text\": \"CRITICAL: Potential NPM dependency typosquatting detected in\
      \ manifest `{{ inputs.package_json_url }}`. Total scanned: `{{ outputs.scan_npm_dependencies.vars.total_dependencies_scanned\
      \ }}`, Suspicious packages: `{{ outputs.scan_npm_dependencies.vars.suspicious_packages_count\
      \ }}` within edit distance `{{ inputs.levenshtein_distance_threshold }}`.\"\n\
      }\n"
- id: log_typosquat_audit
  type: io.kestra.plugin.core.log.Log
  description: Records an operational audit trail of the dependency security review.
  message: 'NPM dependency typosquat audit finished. Total dependencies: {{ outputs.scan_npm_dependencies.vars.total_dependencies_scanned
    }}, suspicious packages: {{ outputs.scan_npm_dependencies.vars.suspicious_packages_count
    }}.'
- id: export_typosquat_manifest
  type: io.kestra.plugin.core.debug.Return
  description: Exports structured manifest containing flagged packages for supply-chain
    risk auditing.
  format:
    manifest_url: '{{ inputs.package_json_url }}'
    total_scanned: '{{ outputs.scan_npm_dependencies.vars.total_dependencies_scanned
      }}'
    suspicious_count: '{{ outputs.scan_npm_dependencies.vars.suspicious_packages_count
      }}'
    details: '{{ outputs.scan_npm_dependencies.vars.suspicious_packages_details }}'
triggers:
- id: daily_dependency_audit
  type: io.kestra.plugin.core.trigger.Schedule
  cron: 0 6 * * *
  disabled: true
extend:
  title: NPM Package Dependency Typosquatting Sentinel
  metaTitle: NPM Package Dependency Typosquatting Sentinel Blueprint
  shortDescription: Audits NPM package dependencies to detect typosquatting impostor
    packages and supply-chain threats.
  metaDescription: Audits NPM package dependencies to detect typosquatting impostor
    packages and prevent malicious software supply-chain compromises.
  description: "Software supply-chain attacks increasingly rely on typosquatting,\
    \ where attackers publish malicious packages with names nearly identical to popular\
    \ libraries (such as loadash for lodash or expres for express). When developers\
    \ make a typing error during package installation or automated dependency updates\
    \ pull in malicious clones, unauthorized code executes inside build pipelines\
    \ or production servers. This sentinel continuously parses application package\
    \ manifests, computes string edit distances against popular open-source libraries,\
    \ and alerts Application Security teams on Slack before malicious dependencies\
    \ reach production.\n\n## How it works\n1. **Scheduled triggering**: Executes\
    \ daily at 06:00 UTC using a cron schedule trigger (`0 6 * * *`) or triggers via\
    \ CI/CD commit webhooks.\n2. **Manifest ingestion**: Fetches the specified `package.json`\
    \ manifest via HTTP GET requests using optional repository authentication headers.\n\
    3. **Dependency parsing**: Combines `dependencies` and `devDependencies` into\
    \ a consolidated package catalog.\n4. **String similarity analysis**: Executes\
    \ Levenshtein distance calculations between each project dependency and a curated\
    \ database of popular NPM libraries.\n5. **Condition evaluation**: An `io.kestra.plugin.core.flow.If`\
    \ task evaluates whether `suspicious_packages_count` exceeds `max_tolerated_suspicious_packages`.\n\
    6. **Slack notification**: Sends high-priority incident details via `SlackIncomingWebhook`\
    \ listing flagged dependencies and target libraries.\n7. **Audit trail logging\
    \ and return**: Emits operational execution logs and returns a structured compliance\
    \ manifest for auditing.\n\n## Architecture diagram\n```mermaid\nflowchart TD\n\
    \  A[daily_dependency_audit Schedule Trigger] --> B[scan_npm_dependencies Python\
    \ Script]\n  B --> C[check_typosquat_findings Flowable If]\n  C -- Typosquats\
    \ Flagged --> D[notify_slack_appsec Webhook]\n  C -- Safe Dependencies --> E[log_typosquat_audit\
    \ Log]\n  D --> E\n  E --> F[export_typosquat_manifest Return]\n```\n\n## Use\
    \ cases\n- **Software supply-chain defense**: Detect and block accidental installation\
    \ of malicious impostor packages across enterprise codebases.\n- **CI/CD pre-merge\
    \ gating**: Trigger this workflow on pull requests modifying `package.json` to\
    \ reject PRs introducing suspicious libraries.\n- **Regulatory compliance**: Demonstrate\
    \ proactive open-source dependency auditing for NIST SP 800-218 and Executive\
    \ Order 14028 software supply chain standards.\n\n## Inputs\n| Name | Type | Default\
    \ | Description |\n| :--- | :--- | :--- | :--- |\n| `package_json_url` | `STRING`\
    \ | `https://raw.githubusercontent.com/company/repo/main/package.json` | URL pointing\
    \ to the raw package.json manifest to inspect for suspicious dependencies. |\n\
    | `levenshtein_distance_threshold` | `INT` | `1` | Levenshtein distance threshold\
    \ for flagging near-identical package names against popular libraries. |\n| `alert_on_typosquat_risk`\
    \ | `BOOL` | `true` | Whether to dispatch alerts when suspected impostor package\
    \ dependencies are detected. |\n| `max_tolerated_suspicious_packages` | `INT`\
    \ | `0` | Maximum permissible suspicious package count before triggering high-severity\
    \ alerts. |\n\n## Expected outputs\n- `{{ outputs.scan_npm_dependencies.vars.total_dependencies_scanned\
    \ }}`: Total number of dependencies analyzed in the manifest.\n- `{{ outputs.scan_npm_dependencies.vars.suspicious_packages_count\
    \ }}`: Count of flagged packages matching popular libraries within the distance\
    \ threshold.\n- `{{ outputs.scan_npm_dependencies.vars.suspicious_packages_details\
    \ }}`: Serialized JSON list of flagged dependencies and target libraries.\n- `{{\
    \ outputs.export_typosquat_manifest.value }}`: Structured dictionary containing\
    \ the consolidated security audit report.\n\n## Prerequisites\n- Outbound HTTPS\
    \ network access from Kestra execution workers to the manifest host (e.g., GitHub,\
    \ GitLab, or internal Git servers).\n- Optional read access token for private\
    \ source code repositories.\n- Slack Incoming Webhook configured for security\
    \ alerts.\n\n### Secrets\n- `GITHUB_READ_TOKEN`: Personal access token with read\
    \ permissions to private repository contents.\n- `SLACK_WEBHOOK_URL`: Slack Incoming\
    \ Webhook endpoint URL used for sending security alerts.\n\n## Quick start\n1.\
    \ Store `GITHUB_READ_TOKEN` and `SLACK_WEBHOOK_URL` in your Kestra Secret storage.\n\
    2. Deploy this flow under the `company.security` namespace.\n3. Configure `package_json_url`\
    \ to point to a target repository's raw `package.json`.\n4. Run a manual execution\
    \ to test dependency extraction and verify Slack alerts.\n\n## Common pitfalls\
    \ and troubleshooting\n- **Scoped packages**: Legitimate scoped packages (such\
    \ as `@types/lodash` or `@angular/core`) contain slashes and scope prefixes. Ensure\
    \ edit distance calculations evaluate root package names appropriately.\n- **Private\
    \ package namespaces**: Internal enterprise libraries may share names with open-source\
    \ forks. Adjust whitelist parameters or verify private registry scopes.\n- **Raw\
    \ URL authentication**: For GitHub private repositories, use raw API endpoints\
    \ (`api.github.com/repos/{owner}/{repo}/contents/package.json`) with an Authorization\
    \ header.\n\n## How to extend\n- **NPM registry download verification**: Interrogate\
    \ the official NPM registry API (`https://registry.npmjs.org/{pkg}`) to check\
    \ package age and weekly download counts; typosquats typically have low downloads\
    \ and recent publish dates.\n- **Automated PR blocker**: Integrate with GitHub\
    \ status checks to block merging pull requests containing unverified dependencies.\n\
    - **Multi-manifest scanning**: Expand to scan Monorepos containing multiple `package.json`\
    \ files via a Kestra ForEach task.\n\n## Links\n- [Kestra Python Script Plugin\
    \ Documentation](https://kestra.io/plugins/plugin-scripts-python)\n- [Kestra Slack\
    \ Plugin Documentation](https://kestra.io/plugins/plugin-slack)\n- [NPM Security\
    \ Best Practices](https://docs.npmjs.com/about-package-security)\n- [OpenSSF Typosquatting\
    \ Attack Analysis](https://openssf.org/)\n"
  tags:
  - Core
  - Infrastructure
  subTags:
  - Policy & Compliance
  - CI/CD & Deployment
  ee: false
  demo: false
outputs:
- id: total_dependencies_scanned
  type: INT
  value: '{{ outputs.scan_npm_dependencies.vars.total_dependencies_scanned }}'
- id: suspicious_packages_count
  type: INT
  value: '{{ outputs.scan_npm_dependencies.vars.suspicious_packages_count }}'
