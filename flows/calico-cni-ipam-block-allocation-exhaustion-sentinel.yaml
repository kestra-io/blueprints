id: calico-cni-ipam-block-allocation-exhaustion-sentinel
namespace: company.networking

inputs:
  - id: calico_metrics_url
    type: STRING
    defaults: "http://calico-node.kube-system:9091/metrics"
    description: Prometheus scrape endpoint for Calico node or felix daemon.

tasks:
  - id: scrape_calico_ipam
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        curl -s -f "{{ inputs.calico_metrics_url }}" > /tmp/calico_telemetry.txt
        
        # Scrape felix_ip_set_total or IPAM block metrics
        IPAM_TOTAL=$(grep -E "^felix_ip_set_total" /tmp/calico_telemetry.txt | awk '{sum+=$2} END {print sum+0}')
        echo "::set-output name=ipam_total::$IPAM_TOTAL::"

  - id: evaluate_ipam_state
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.scrape_calico_ipam.vars.ipam_total | int > 50000 }}"
    then:
      - id: notify_networking_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#networking-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Calico IPAM Pool Saturated Alert",
                "text": "Calico CNI at `{{ inputs.calico_metrics_url }}` recorded an IPAM set size of *{{ outputs.scrape_calico_ipam.vars.ipam_total }}*! IP pool CIDR blocks are nearing exhaustion, threatening pod creation failures.",
                "footer": "Kestra Networking Sentinel • Calico CNI"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#networking-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Calico Sentinel Failure",
            "text": "Failed to scrape Calico metrics endpoint. Verify felix metrics port accessibility.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Calico CNI IP Address Management (IPAM) for allocated block exhaustion to prevent pod creation failures."
  metaTitle: Calico CNI IPAM IP Address Block Pool Exhaustion Sentinel with Kestra
  title: Calico CNI IPAM IP Address Block Pool Exhaustion Sentinel
  shortDescription: Audits Calico CNI IP Address Management (IPAM) for allocated block exhaustion to prevent pod creation failures.
  description: |
    ## How it works
    This workflow connects to the Calico Felix metrics endpoint (`port 9091`) to monitor IP address allocations and IPAM pool sets (`felix_ip_set_total`). In large or churn-heavy Kubernetes clusters, Calico allocates /26 IP blocks per node from configured IPPools. When IPPool CIDR ranges become saturated or fragmented due to rapid pod scaling and deletion, Calico fails to assign IP addresses to new pods, leading to persistent `FailedCreatePodSandBox` errors and pod scheduling stalls. This workflow audits allocation levels and alerts network engineers before IP pools are depleted.

    ## What you get
    - Real-time detection of Calico IP pool and IPAM exhaustion risks.
    - Prevents `FailedCreatePodSandBox` container provisioning outages.
    - Quantitative metrics on cluster IPAM set sizes.

    ## Who it's for
    - Kubernetes Network Administrators and Platform Engineers running Calico CNI.
    - SREs responsible for cluster pod capacity and IP address management.

    ## Why orchestrate this with Kestra
    - **Continuous IPAM Auditing**: Automatically inspects network health without human intervention.
    - **Decoupled Monitoring**: Communicates directly with Prometheus endpoints.
    - **Instant Team Escalation**: Dispatches formatted Slack alerts when allocations threaten capacity.

    ## Prerequisites
    - Calico installed with Felix Prometheus metrics enabled (`felix.prometheusMetricsEnabled=true`).
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input Calico metrics URL.
    3. Run the workflow to inspect IPAM allocation state.

    ## How to extend
    - Inspect `calico_ipam_allocations_per_node` for uneven pod distribution.
    - Automatically create additional Calico IPPools via `calicoctl` when pools reach 85% capacity.

    ## Links
    - [Calico Felix Prometheus Metrics](https://docs.tigera.io/calico/latest/operations/monitor/metrics/felix-metrics)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Day 2 Operations
    - Infrastructure Automation
  ee: false
  verified: false
  demo: false
