id: weaviate-cluster-readiness-shards-sentinel
namespace: company.ai

inputs:
  - id: weaviate_host
    type: STRING
    defaults: "weaviate.internal"
    description: Hostname of the Weaviate instance.
  - id: weaviate_port
    type: INT
    defaults: 8080
    description: Weaviate HTTP port.

tasks:
  - id: query_node_status
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query Weaviate cluster nodes status
        curl -s -f "http://{{ inputs.weaviate_host }}:{{ inputs.weaviate_port }}/v1/nodes" > /tmp/weaviate_telemetry.json
        
        # Count nodes where status != HEALTHY
        UNHEALTHY_NODES=$(jq '[.nodes[]? | select(.status != "HEALTHY")] | length' /tmp/weaviate_telemetry.json)
        TOTAL_NODES=$(jq '.nodes | length // 0' /tmp/weaviate_telemetry.json)
        
        echo "::set-output name=unhealthy_nodes::$UNHEALTHY_NODES::"
        echo "::set-output name=total_nodes::$TOTAL_NODES::"

  - id: evaluate_node_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_node_status.vars.unhealthy_nodes | int > 0 }}"
    then:
      - id: notify_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#ai-platform",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Weaviate Cluster Unhealthy Node Alert",
                "text": "Weaviate cluster at `{{ inputs.weaviate_host }}` reported *{{ outputs.query_node_status.vars.unhealthy_nodes }} unhealthy node(s)* out of {{ outputs.query_node_status.vars.total_nodes }} total nodes! Vector shard replication and query routing are degraded.",
                "footer": "Kestra AI Sentinel • Weaviate"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#ai-platform",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Weaviate Sentinel Failure",
            "text": "Failed to query Weaviate nodes API. Verify host address and port.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Weaviate Vector Cluster Node Readiness and Shard Replication Sentinel
  shortDescription: Monitors Weaviate vector database cluster nodes and shard replication health to prevent semantic query dropouts.
  description: |
    ## How it works
    This workflow connects to the Weaviate REST API endpoint (`/v1/nodes`) to inspect the operational status of all cluster nodes and vector shards. Weaviate distributes multi-dimensional vectors and inverted index data across clustered shards with configurable replication factors. If a node transitions to `UNHEALTHY` or `INDEXING` lag occurs due to disk thrashing or network partition, GraphQL and vector similarity queries experience timeouts. This blueprint parses cluster node health and immediately notifies AI engineers if any node degrades.

    ## What you get
    - Real-time visibility into Weaviate vector cluster topology and node health.
    - Prevents semantic search outages and degraded LLM retrieval accuracy.
    - Actionable alerts identifying cluster node counts and failure states.

    ## Who it's for
    - MLOps Engineers and Infrastructure SREs operating Weaviate clusters.
    - Developers deploying production generative search and recommendation engines.

    ## Why orchestrate this with Kestra
    - **Automated Health Polling**: Periodically evaluates vector database topology without manual intervention.
    - **Standardized Incident Dispatch**: Routes structured notifications with node counts directly to Slack.
    - **Resilient Execution**: Top-level error blocks guarantee notification delivery on connection failures.

    ## Prerequisites
    - Running Weaviate cluster with REST API reachable.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Set your Weaviate host and port.
    3. Run the workflow to inspect node readiness.

    ## How to extend
    - Inspect shard-level metrics for individual vector classes (`/v1/nodes?output=verbose`).
    - Trigger automatic Kubernetes pod restarts for unhealthy Weaviate members.

    ## Links
    - [Weaviate Nodes API Documentation](https://weaviate.io/developers/weaviate/api/rest/nodes)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - AI
    - Infrastructure
  ee: false
  demo: false
