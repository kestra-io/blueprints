id: redis-memory-usage-alert
namespace: company.team
description: |
  Read Redis memory usage against maxmemory and alert Slack when the instance
  is running hot - before an OOM or eviction storm.

triggers:
  - id: every_fifteen_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    description: Frequent enough to catch a key leak before the on-call page.
    cron: "*/15 * * * *"
    disabled: true

inputs:
  - id: redis_host
    type: STRING
    defaults: "localhost"
    description: Redis hostname.
  - id: redis_port
    type: INT
    defaults: 6379
    description: Redis port.
  - id: threshold_percent
    type: INT
    defaults: 85
    description: Usage percentage of maxmemory that triggers the alert.

tasks:
  - id: check_memory
    type: io.kestra.plugin.scripts.shell.Commands
    description: redis-cli INFO memory, compute used vs maxmemory percent, emit both via the stdout outputs protocol. No maxmemory set or a failed call reports worst case.
    containerImage: redis:7-alpine
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    commands:
      - |
        set -u
        INFO=$(redis-cli -h "{{ inputs.redis_host }}" -p "{{ inputs.redis_port }}" INFO memory 2>/dev/null || true)
        USED=$(echo "$INFO" | grep '^used_memory:' | cut -d: -f2 | tr -d '\r')
        MAX=$(echo "$INFO" | grep '^maxmemory:' | cut -d: -f2 | tr -d '\r')
        if [ -z "${USED:-}" ] || [ -z "${MAX:-}" ] || [ "${MAX:-0}" = "0" ]; then
          echo "probe failed or no maxmemory; treating as breach"
          echo '::{"outputs": {"used_percent": 100}}::'
        else
          PCT=$(( USED * 100 / MAX ))
          echo "used_memory $USED of maxmemory $MAX ($PCT%)"
          echo "::{\"outputs\": {\"used_percent\": $PCT}}::"
        fi

  - id: over_threshold
    type: io.kestra.plugin.core.flow.If
    description: One branch for the threshold - breach alerts Slack, pass is logged.
    condition: "{{ outputs.check_memory.vars.used_percent >= inputs.threshold_percent }}"
    then:
      - id: alert_hot_memory
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: State the real percentage and the threshold.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":hot_pepper: Redis {{ inputs.redis_host }}:{{ inputs.redis_port }} is at {{ outputs.check_memory.vars.used_percent }}% of maxmemory (threshold {{ inputs.threshold_percent }}%). Check for a key leak or raise the cap. Execution {{ execution.id }}."
          }
    else:
      - id: log_ok
        type: io.kestra.plugin.core.log.Log
        description: Record the passing reading for the trend.
        message: "Redis at {{ outputs.check_memory.vars.used_percent }}% of maxmemory, under {{ inputs.threshold_percent }}%."

errors:
  - id: alert_check_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the check itself fails - a dead redis-cli is not healthy memory.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Redis memory check FAILED in flow {{ flow.id }} (execution {{ execution.id }}). Check connectivity to {{ inputs.redis_host }}:{{ inputs.redis_port }}."
      }

outputs:
  - id: memory_used_percent
    type: INT
    description: 'Used percent of maxmemory, e.g. 64.'
    value: "{{ outputs.check_memory.vars.used_percent }}"

extend:
  title: Alert on Redis Memory Usage
  shortDescription: Quarter-hourly Redis INFO memory check that pages Slack when usage crosses your ceiling.
  metaTitle: Redis Memory Usage Alert
  metaDescription: Monitor Redis memory against maxmemory and alert Slack before evictions or OOM.
  description: |
    Redis OOM pages at 3am are always a surprise. This blueprint polls `INFO memory` every 15 minutes and alerts Slack past your threshold. The schedule ships disabled so you can verify connectivity first.

    ## How it works

    1. `check_memory` (`io.kestra.plugin.scripts.shell.Commands` on the Redis image) reads used and max memory and emits the percent via the `::{"outputs": ...}::` protocol. No maxmemory or a failed call reports 100%.
    2. `over_threshold` (`io.kestra.plugin.core.flow.If`) branches: breach -> `alert_hot_memory`; pass -> `log_ok`.
    3. The `errors` block alerts on failure.
    4. Trigger: a disabled `*/15` `Schedule`.

    ## What you get

    - Early warning of key leaks or missing eviction policy.
    - A percent value in the execution history.

    ## Who it's for

    - Teams running shared Redis without managed alerts.
    - Anyone who learned about an eviction storm from a customer.

    ## Why orchestrate this with Kestra

    redis-cli prints numbers; the flow turns them into a decision on a schedule with alerts. The next step (flush a namespace, page on-call, send a `MEMORY DOCTOR` dump) is one task away.

    ## Prerequisites

    - Docker available on the Kestra Worker.
    - Network reachability to Redis and `maxmemory` set.
    - A Slack webhook.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: webhook for hot-memory and failure alerts.

    ## Quick start

    1. Add the Slack webhook secret.
    2. Set `redis_host`, `redis_port`, `threshold_percent`.
    3. Run once and read `memory_used_percent`.
    4. Enable the schedule.

    ## How to extend

    - Also check `mem_fragmentation_ratio` for RSS bloat.
    - Alert on evicted_keys growth.
    - Loop over several instances with a `ForEach`.

    ## Links

    - [Redis MEMORY DOCTOR](https://redis.io/docs/latest/commands/memory-doctor/)
    - This blueprint has been created by [yashspidey](https://github.com/yashspidey)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Redis
    - Monitoring
  ee: false
  demo: false
