id: nps-detractor-escalation
namespace: company.team

description: |
  Gets a low NPS score in front of an accountable owner within minutes instead
  of in Friday's export. A keyed webhook receives each survey response, a shell
  step writes the week's responses.csv fixture, and a python step appends the
  new response, classifies it as detractor, passive or promoter, and counts the
  week's detractors straight from the file. A second python step rolls the whole
  week up for the digest path. Detractor responses on an escalating tier are
  emailed to the CSM lead and posted to Slack with the comment excerpt, while
  everything else is logged as no escalation. Each execution publishes verdict,
  score, is_detractor and weekly_detractors as typed outputs, and a failure
  anywhere pings Slack.

triggers:
  - id: on_survey_response
    type: io.kestra.plugin.core.trigger.Webhook
    description: The survey platform POSTs one response body of respondent, score, comment and account_tier so scoring and routing start the moment the survey is submitted.
    key: "{{ secret('NPS_WEBHOOK_KEY') }}"
  - id: weekly_digest
    type: io.kestra.plugin.core.trigger.Schedule
    description: Disabled Monday 06:00 net that would publish the weekly detractor rollup on a timer until someone switches it on.
    cron: "0 6 * * 1"
    disabled: true

inputs:
  - id: escalate_tiers
    type: STRING
    defaults: enterprise,strategic
    description: Comma separated account tiers whose detractor responses reach the CSM lead, matched as exact list members after the split.
  - id: csm_lead_email
    type: STRING
    defaults: csm-lead@example.com
    description: Mailbox of the CSM lead who owns detractor follow-up, used as the recipient of the escalation email.

tasks:
  # --- 1. score the incoming response ---
  - id: workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One shared directory so the responses.csv written by the shell step is the exact file the classifier appends to and the weekly rollup reads.
    tasks:
      - id: write_responses
        type: io.kestra.plugin.scripts.shell.Commands
        description: Writes responses.csv from a heredoc of six already collected rows covering three detractors, one passive and two promoters across the enterprise, strategic and commercial tiers.
        commands:
          - |
            cat > responses.csv <<'RESPONSES_EOF'
            respondent,score,comment,account_tier
            Ava Lindqvist,4,"Charts export times out on large workspaces",enterprise
            Bruno Silva,9,"Loving the new dashboard",strategic
            Chika Okafor,7,"Fine, but the billing view is slow",commercial
            Dmitri Volkov,2,"Support never answered our ticket",enterprise
            Elena Rossi,10,"Best tool in our stack",strategic
            Farid Haddad,5,"API rate limits blocked our nightly job",commercial
            RESPONSES_EOF
            wc -l responses.csv

      - id: classify_response
        type: io.kestra.plugin.scripts.python.Script
        description: Appends the posted response to responses.csv, classifies the score as detractor, passive or promoter, checks the tier against the escalation list, and prints the repo standard outputs line carrying verdict, score, is_detractor, tier and weekly_detractors.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          RESPONDENT: "{{ trigger is not defined ? '' : ((trigger.body ?? {}).respondent ?? '') }}"
          SCORE: "{{ trigger is not defined ? '' : ((trigger.body ?? {}).score ?? '') }}"
          COMMENT: "{{ trigger is not defined ? '' : ((trigger.body ?? {}).comment ?? '') }}"
          ACCOUNT_TIER: "{{ trigger is not defined ? '' : ((trigger.body ?? {}).account_tier ?? '') }}"
          ESCALATE_TIERS: "{{ inputs.escalate_tiers }}"
        script: |
          import csv
          import json
          import os

          CSV_FILE = "responses.csv"
          FIELDS = ["respondent", "score", "comment", "account_tier"]


          def as_int(value):
              try:
                  return int(str(value).strip())
              except (TypeError, ValueError):
                  return None


          def read_rows():
              if not os.path.exists(CSV_FILE):
                  return [], False
              with open(CSV_FILE, newline="", encoding="utf-8") as handle:
                  reader = csv.DictReader(handle)
                  header = list(reader.fieldnames or [])
                  if not all(name in header for name in FIELDS):
                      return [], False
                  return [row for row in reader if row.get("score") is not None], True


          respondent = os.environ.get("RESPONDENT", "").strip()
          comment = os.environ.get("COMMENT", "").strip()
          tier = os.environ.get("ACCOUNT_TIER", "").strip().lower()
          escalate_tiers = [t.strip().lower() for t in os.environ.get("ESCALATE_TIERS", "").split(",") if t.strip()]
          score = as_int(os.environ.get("SCORE", ""))
          valid = score is not None and 0 <= score <= 10

          rows, header_ok = read_rows()

          if valid:
              new_row = {
                  "respondent": respondent or "unknown respondent",
                  "score": str(score),
                  "comment": comment,
                  "account_tier": tier,
              }
              if header_ok:
                  with open(CSV_FILE, "a", newline="", encoding="utf-8") as handle:
                      csv.DictWriter(handle, fieldnames=FIELDS).writerow(new_row)
              elif not os.path.exists(CSV_FILE):
                  with open(CSV_FILE, "w", newline="", encoding="utf-8") as handle:
                      writer = csv.DictWriter(handle, fieldnames=FIELDS)
                      writer.writeheader()
                      writer.writerow(new_row)
              rows = rows + [new_row]

          weekly_detractors = 0
          for row in rows:
              value = as_int(row.get("score"))
              if value is not None and 0 <= value <= 6:
                  weekly_detractors += 1

          if not valid:
              verdict = "INVALID"
              is_detractor = False
              reported_score = -1
          elif score <= 6:
              is_detractor = True
              verdict = "ESCALATE" if tier in escalate_tiers else "DETRACTOR"
              reported_score = score
          elif score <= 8:
              is_detractor = False
              verdict = "PASSIVE"
              reported_score = score
          else:
              is_detractor = False
              verdict = "PROMOTER"
              reported_score = score

          print("nps %s tier=%s score=%s weekly_detractors=%d" % (verdict, tier or "unset", reported_score, weekly_detractors))
          print("::" + json.dumps({"outputs": {"verdict": verdict, "score": reported_score, "is_detractor": is_detractor, "tier": tier, "weekly_detractors": weekly_detractors}}, ensure_ascii=True) + "::")

  # --- 2. roll the week up for the digest ---
  - id: aggregate_week
    type: io.kestra.plugin.scripts.python.Script
    description: Reads responses.csv with the csv module and rolls the week into totals per score band plus the account tier carrying the most detractors, for the digest path and for the escalation email.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    script: |
      import csv
      import json
      import os

      CSV_FILE = "responses.csv"
      FIELDS = ["respondent", "score", "comment", "account_tier"]


      def as_int(value):
          try:
              return int(str(value).strip())
          except (TypeError, ValueError):
              return None


      rows = []
      if os.path.exists(CSV_FILE):
          with open(CSV_FILE, newline="", encoding="utf-8") as handle:
              reader = csv.DictReader(handle)
              header = list(reader.fieldnames or [])
              if all(name in header for name in FIELDS):
                  rows = [row for row in reader if row.get("score") is not None]

      total = 0
      detractors = 0
      passives = 0
      promoters = 0
      unusable = 0
      detractors_by_tier = {}

      for row in rows:
          total += 1
          score = as_int(row.get("score"))
          if score is None or score < 0 or score > 10:
              unusable += 1
              continue
          tier = (row.get("account_tier") or "unknown").strip().lower() or "unknown"
          if score <= 6:
              detractors += 1
              detractors_by_tier[tier] = detractors_by_tier.get(tier, 0) + 1
          elif score <= 8:
              passives += 1
          else:
              promoters += 1

      top_tier = "none"
      if detractors_by_tier:
          top_tier = sorted(detractors_by_tier.items(), key=lambda pair: (-pair[1], pair[0]))[0][0]

      print("week rows=%d detractors=%d passives=%d promoters=%d unusable=%d" % (total, detractors, passives, promoters, unusable))
      print("::" + json.dumps({"outputs": {"week_total": total, "week_detractors": detractors, "week_passives": passives, "week_promoters": promoters, "week_unusable": unusable, "top_detractor_tier": top_tier}}, ensure_ascii=True) + "::")

  # --- 3. the escalation gate ---
  - id: escalate_gate
    type: io.kestra.plugin.core.flow.If
    description: Escalates only when the response is a detractor and its account tier is a member of the escalate_tiers input, so a low score on a small account is still recorded but not escalated.
    condition: "{{ outputs.classify_response.vars.is_detractor == true and outputs.classify_response.vars.tier in inputs.escalate_tiers.split(',') }}"
    then:
      - id: email_csm_lead
        type: io.kestra.plugin.email.MailSend
        description: Sends the CSM lead the respondent, tier, score, comment and weekly volume so the follow-up owner has everything needed for a same day call.
        from: "{{ secret('SMTP_FROM') }}"
        to: "{{ inputs.csm_lead_email }}"
        host: "{{ secret('SMTP_HOST') }}"
        username: "{{ secret('SMTP_USERNAME') }}"
        password: "{{ secret('SMTP_PASSWORD') }}"
        port: 465
        subject: "NPS detractor {{ outputs.classify_response.vars.score }}/10 on the {{ outputs.classify_response.vars.tier }} tier needs a follow-up"
        htmlTextContent: |
          <p>{{ inputs.csm_lead_email }},</p>
          <p><strong>{{ trigger is not defined ? 'A respondent' : ((trigger.body ?? {}).respondent ?? 'A respondent') }}</strong> on the <strong>{{ outputs.classify_response.vars.tier }}</strong> tier scored <strong>{{ outputs.classify_response.vars.score }}</strong>/10 on the NPS survey and needs an owner today.</p>
          <p>Comment: {{ trigger is not defined ? 'no comment' : ((trigger.body ?? {}).comment ?? 'no comment') }}</p>
          <p>This response is detractor number {{ outputs.classify_response.vars.weekly_detractors }} this week, with {{ outputs.aggregate_week.vars.week_detractors }} detractors across {{ outputs.aggregate_week.vars.week_total }} responses and {{ outputs.aggregate_week.vars.top_detractor_tier }} carrying the most.</p>
          <p>Escalation tiers are {{ inputs.escalate_tiers }}. Execution {{ execution.id }}</p>

      - id: alert_slack
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Posts the score, the tier, an excerpt of the verbatim comment and the weekly volume so the account team sees the detractor while it is still fresh.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": "NPS detractor on the {{ outputs.classify_response.vars.tier }} tier scored {{ outputs.classify_response.vars.score }}/10. Comment - {{ (trigger is not defined ? 'no comment' : ((trigger.body ?? {}).comment ?? 'no comment')) | replace('\"', "'") | replace('\n', ' ') | replace('\r', ' ') | truncate(140) }}. Weekly detractors {{ outputs.classify_response.vars.weekly_detractors }} of {{ outputs.aggregate_week.vars.week_total }} responses. Execution {{ execution.id }}."}
    else:
      - id: log_no_escalation
        type: io.kestra.plugin.core.log.Log
        description: Records the outcome that needs no escalation, a passive or promoter score or a detractor outside the escalation list, so a quiet run still leaves evidence.
        message: "No escalation - verdict {{ outputs.classify_response.vars.verdict }}, tier {{ outputs.classify_response.vars.tier or 'unset' }}, score {{ outputs.classify_response.vars.score }}, weekly detractors {{ outputs.classify_response.vars.weekly_detractors }} of {{ outputs.aggregate_week.vars.week_total }} responses."

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Escalate any failure to the ops channel with the execution url.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "FAILED: {{ flow.id }} {{ execution.id }}"}

outputs:
  - id: verdict
    type: STRING
    value: "{{ outputs.classify_response.vars.verdict }}"
  - id: score
    type: INT
    value: "{{ outputs.classify_response.vars.score }}"
  - id: is_detractor
    type: BOOL
    value: "{{ outputs.classify_response.vars.is_detractor }}"
  - id: weekly_detractors
    type: INT
    value: "{{ outputs.classify_response.vars.weekly_detractors }}"

extend:
  title: Escalate NPS detractors to an owner within minutes
  metaTitle: NPS Detractor Escalation and Weekly Volume
  shortDescription: Score every NPS response, email and Slack the CSM lead about detractors on enterprise and strategic tiers, and count the week's detractors.
  metaDescription: Score each NPS response as detractor, passive or promoter, escalate enterprise and strategic detractors by email and Slack, and count the week's detractors.
  description: |
    A survey response that lands in nobody's inbox is worse than no survey at all. The customer who scores you a 2 usually tells a few colleagues and never fills in the follow-up form, and by the time the weekly export is opened the comment has gone cold. This flow receives each response on a keyed webhook, appends it to the week's responses.csv, classifies the score as detractor, passive or promoter, and routes the low scores that matter to the CSM lead by email and Slack while the verbatim comment is still fresh. Detractors on the enterprise and strategic tiers are escalated inside the same run, every other response is logged as no escalation, and a second python step keeps the weekly detractor volume ready for the Monday digest.

    ## How it works

    1. `on_survey_response` (`io.kestra.plugin.core.trigger.Webhook`, keyed) accepts one JSON body of `respondent`, `score`, `comment` and `account_tier` whenever a survey comes back from the platform.
    2. `weekly_digest` (`io.kestra.plugin.core.trigger.Schedule`, cron `0 6 * * 1`) is a disabled Monday net for the weekly rollup; switch it on once the webhook path is trusted in your environment.
    3. `workspace` (`io.kestra.plugin.core.flow.WorkingDirectory`) gives the fixture, the classifier and the rollup one directory, so all three touch the same responses.csv.
    4. `write_responses` (`io.kestra.plugin.scripts.shell.Commands`) drops `responses.csv` from a heredoc of six already collected rows, three detractors, one passive and two promoters across the enterprise, strategic and commercial tiers.
    5. `classify_response` (`io.kestra.plugin.scripts.python.Script` on the Process runner) appends the posted response to the file, counts every row scoring 0 to 6, decides whether the tier is on the escalation list, and prints one `::{"outputs": ...}::` line carrying `verdict`, `score`, `is_detractor`, `tier` and `weekly_detractors`.
    6. `aggregate_week` (`io.kestra.plugin.scripts.python.Script`) reads the same file with the `csv` module and rolls the week up into totals per score band, the count of unusable rows, and the account tier carrying the most detractors.
    7. `escalate_gate` (`io.kestra.plugin.core.flow.If`) fires only when `is_detractor` is true and `tier` is a member of `escalate_tiers`. In that branch `email_csm_lead` (`io.kestra.plugin.email.MailSend`) sends the follow-up brief and `alert_slack` (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) posts the comment excerpt; the other branch records the quiet outcome with `log_no_escalation` (`io.kestra.plugin.core.log.Log`).
    8. The `errors` handler pings Slack when the run itself breaks, because a failed router looks exactly like a calm inbox.

    ## What you get

    - `verdict` (STRING): `ESCALATE` for a detractor on an escalating tier, `DETRACTOR` for a detractor elsewhere, `PASSIVE` for 7 to 8, `PROMOTER` for 9 to 10, and `INVALID` when the score is missing or outside 0 to 10.
    - `score` (INT): the submitted score as an integer, or -1 when the payload carried no usable number.
    - `is_detractor` (BOOL): true only for scores of 6 or below, the switch the gate branches on.
    - `weekly_detractors` (INT): how many responses in responses.csv score 6 or below, counted after this response is appended.
    - One email to the CSM lead and one Slack message with the comment excerpt when escalation fires, a log line when it does not, and the weekly band totals in `aggregate_week` for the digest.

    ## Who it's for

    - Customer success leads who need a detractor on a strategic account routed to a named owner within minutes rather than at the end of the quarter.
    - Product and support teams who read verbatim NPS comments and want them surfaced with the score instead of buried in a export file.
    - Operations teams that keep NPS routing in version control next to the rest of the escalation logic.

    ## Why orchestrate this with Kestra

    NPS triage usually lives as a filter in a survey tool and a reminder in someone's calendar, so routing rules drift and nobody can say what happened to last month's worst score. Kestra puts the webhook, the scoring step, the tier gate, the email, the Slack alert and the weekly rollup into one versioned file: the escalation branch is declarative, every execution leaves its verdict and weekly volume as typed outputs, and the disabled schedule is already in place when you want the digest on a timer. A mailbox rule gives you a forwarded email and no record.

    ## Prerequisites

    - A Kestra instance with the email and Slack plugins available to the worker.
    - An SMTP relay reachable from the worker, with a sender address allowed to use it.
    - A Slack incoming webhook for the escalation alert and for failure alerts.
    - A survey platform that can POST a JSON body of `respondent`, `score`, `comment` and `account_tier` to the webhook URL.
    - The account tiers that warrant escalation, supplied through the `escalate_tiers` input.

    ### Secrets

    - `NPS_WEBHOOK_KEY`: key segment guarding the webhook URL, so only your survey platform can post responses.
    - `SMTP_FROM`: sender address shown on every escalation email.
    - `SMTP_HOST`, `SMTP_USERNAME`, `SMTP_PASSWORD`: SMTP relay and credentials used by `email_csm_lead`.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used for the escalation alert and for failure alerts.

    ## Quick start

    1. Add the six secrets to your namespace and import the flow.
    2. Leave `escalate_tiers` at `enterprise,strategic`, or set it to the tiers your CSM lead actually owns, and set `csm_lead_email` to that owner's mailbox.
    3. Execute the flow once against a body like `{"respondent": "Ava Lindqvist", "score": 4, "comment": "Charts export times out", "account_tier": "enterprise"}` and read `verdict`, `score`, `is_detractor` and `weekly_detractors` in the outputs.
    4. Point the survey platform at `/api/v1/{tenant}/executions/webhook/{namespace}/nps-detractor-escalation/{NPS_WEBHOOK_KEY}`, then confirm the email, the Slack alert and the bumped detractor count.
    5. Switch on `weekly_digest` when you want the rollup to run on a Monday timer instead of only on a webhook.

    ## How to extend

    - Change the scoring bands by editing the three comparisons in `classify_response`, for example treating 5 or below as the escalation line.
    - Widen or narrow the escalation list by changing `escalate_tiers`, or replace the split with a lookup against the account record.
    - Post the weekly rollup itself with a second Slack task under `weekly_digest`, using the totals `aggregate_week` already computes.
    - Write each verdict line to a table with `io.kestra.plugin.jdbc.postgresql.Queries` to build a detractor trend over many executions.

    ## Links

    - [Email MailSend task](https://kestra.io/plugins/plugin-email/io.kestra.plugin.email.mailsend)
    - [Slack plugin documentation](https://kestra.io/plugins/plugin-slack)
    - [Webhook trigger documentation](https://kestra.io/docs/workflow-triggers)
    - [Python csv module](https://docs.python.org/3/library/csv.html)
  tags:
    - Business
  subTags:
    - nps
    - customer-feedback
    - escalation
    - notifications
  ee: false
  demo: false
