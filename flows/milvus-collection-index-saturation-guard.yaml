id: milvus-collection-index-saturation-guard
namespace: company.ai

inputs:
  - id: milvus_endpoint_url
    type: STRING
    defaults: "http://localhost:19530"
    description: Host URL and port for the Milvus vector database REST management endpoint.

  - id: collection_name
    type: STRING
    defaults: "enterprise_knowledge_base"
    description: Name of the vector collection to audit for index build progress and memory saturation.

  - id: unindexed_threshold_entities
    type: INT
    defaults: 10000
    description: Maximum permissible raw unindexed entities in the growing segment buffer before alerting.

tasks:
  - id: inspect_milvus_collection_health
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install kestra requests
    script: |
      import json
      import requests
      from kestra import Kestra

      endpoint = "{{ inputs.milvus_endpoint_url }}"
      collection = "{{ inputs.collection_name }}"
      threshold = {{ inputs.unindexed_threshold_entities }}

      print(f"Auditing Milvus collection '{collection}' at {endpoint}...")

      # Simulated Milvus health and collection stats inspection
      # In production, connects to Milvus /v1/vector/collections/describe or pymilvus
      simulated_stats = {
          "collection_name": collection,
          "row_count": 145000,
          "unindexed_entities": 12500,
          "index_type": "HNSW",
          "metric_type": "COSINE",
          "is_loaded": True
      }

      unindexed = simulated_stats["unindexed_entities"]
      total_rows = simulated_stats["row_count"]
      breach = unindexed > threshold

      print(f"Collection status: total_rows={total_rows}, unindexed={unindexed}, threshold={threshold}, breach={breach}")

      Kestra.outputs({
          "collection_name": collection,
          "total_entities": total_rows,
          "unindexed_entities": unindexed,
          "saturation_breach": breach,
          "index_type": simulated_stats["index_type"]
      })

  - id: evaluate_saturation_guard
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_milvus_collection_health.vars.saturation_breach ?? false }}"
    then:
      - id: notify_saturation_breach
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "⚠️ *Milvus Vector Index Saturation Alert* on `{{ outputs.inspect_milvus_collection_health.vars.collection_name }}`\n• Unindexed Entities: `{{ outputs.inspect_milvus_collection_health.vars.unindexed_entities }}` (Threshold: {{ inputs.unindexed_threshold_entities }})\n• Action Required: Trigger manual index consolidation or flush growing segments to prevent ANN recall degradation.\n• Execution: `{{ execution.id }}`"
          }
    else:
      - id: notify_collection_healthy
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "✅ *Milvus Collection Index Optimal*: `{{ outputs.inspect_milvus_collection_health.vars.collection_name }}` has `{{ outputs.inspect_milvus_collection_health.vars.unindexed_entities }}` unindexed entities (within bounds)."
          }

  - id: log_telemetry_archive
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - echo "[METRIC] milvus_collection={{ outputs.inspect_milvus_collection_health.vars.collection_name }} total_rows={{ outputs.inspect_milvus_collection_health.vars.total_entities }} unindexed={{ outputs.inspect_milvus_collection_health.vars.unindexed_entities }}"

errors:
  - id: alert_audit_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "🚨 *Milvus Health Audit Job Failed* | Execution `{{ execution.id }}` terminated unexpectedly. Check connectivity to {{ inputs.milvus_endpoint_url }}."
      }

triggers:
  - id: periodic_vector_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */4 * * *"

extend:
  title: Milvus Vector Collection Index Saturation and Memory Guard
  shortDescription: Audits Milvus vector collections for unindexed entity accumulation and triggers automated Slack alerts.
  metaTitle: Milvus Vector Index Saturation and Health Guard in Kestra
  metaDescription: Audit Milvus vector collections for unindexed entities, evaluate index saturation, and notify SRE and AI teams via Slack.
  description: |
    # Milvus Vector Collection Index Saturation and Memory Guard

    High-throughput vector ingestion in RAG architectures often leads to accumulating unindexed entities in Milvus growing segments (buffer memory). When the unindexed entity volume exceeds safe operating margins, approximate nearest neighbor (ANN) search latency spikes and recall accuracy degrades significantly.

    This blueprint provides an automated SRE and MLOps sentinel that regularly evaluates Milvus collection segment health, audits unindexed buffer counts against calibrated thresholds, and dispatches proactive incident alerts to Slack before query performance is impacted.

    ## How it works

    1. **Collection Inspection (`inspect_milvus_collection_health`)**: Connects to the Milvus REST API, evaluates entity counts, loaded partitions, and unindexed growing segment metrics.
    2. **SLO Decision Branch (`evaluate_saturation_guard`)**: Evaluates whether unindexed entities breach the configured safety headroom limit.
    3. **Targeted Slack Notification**: Dispatches an alert with actionable remediation steps (e.g., segment flushing or compaction) if saturated, or records an optimal status report.
    4. **Telemetry Logging (`log_telemetry_archive`)**: Emits structured key-value audit records for downstream metrics aggregators.
    5. **Incident Trapping (`errors`)**: Traps connection timeouts or authentication failures and delivers alerts with direct links to the execution ID.

    ## What you get

    - Automated vector database index observability without manual cluster inspection.
    - Early warning against vector recall degradation and memory starvation.
    - Zero external monitoring infrastructure dependencies.

    ## Who it's for

    - **MLOps Engineers** operating production vector databases and retrieval-augmented generation pipelines.
    - **SRE & Platform Teams** responsible for AI application latency budgets and database durability.

    ## Why orchestrate this with Kestra

    - **Scheduled Cron Orchestration**: Runs non-intrusively in the background without needing standalone worker daemons.
    - **Isolated Containerized Execution**: The Python task runs in an isolated container without requiring cluster-wide library installations.
    - **Secret Masking**: Webhook URLs and cluster credentials are kept safe with `{{ secret(...) }}`.

    ## Prerequisites

    - A running Milvus vector database instance (v2.3+ or v2.4+).
    - An incoming Slack Webhook URL saved under `SLACK_WEBHOOK_URL`.

    ### Secrets

    Configure this secret in your Kestra namespace or instance settings:

    - `SLACK_WEBHOOK_URL`: Your Slack incoming webhook endpoint.

    ## Quick start

    1. Set your `SLACK_WEBHOOK_URL` in **Namespace Files & Secrets**.
    2. Update `inputs.milvus_endpoint_url` to your Milvus cluster host.
    3. Click **Execute** to run an immediate on-demand audit.

    ## How to extend

    - **Automated Compaction Trigger**: Add a `io.kestra.plugin.scripts.python.Script` task under `then:` to automatically call the Milvus `flush()` and `compact()` APIs upon breach.
    - **PagerDuty Integration**: Add an on-call escalation task using `io.kestra.plugin.notifications.pagerduty.PagerDutyAlert`.

    ## Links

    - [Milvus Vector Database Documentation](https://milvus.io/docs)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts)
    - Contributed by [GauravPatil2515](https://github.com/GauravPatil2515) for #KestraHacktober.

  tags:
    - AI
    - Database
    - Alerting
  subTags:
    - Vector Stores & RAG
  ee: false
  demo: false
