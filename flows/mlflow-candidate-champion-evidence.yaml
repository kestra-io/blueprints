id: mlflow-candidate-champion-evidence
namespace: company.mlops
description: Compare logged evaluation evidence for pinned MLflow versions before a human decides whether to promote.

inputs:
  - id: model_name
    type: STRING
    defaults: cpu-classifier
  - id: candidate_alias
    type: STRING
    defaults: candidate
  - id: champion_alias
    type: STRING
    defaults: champion
  - id: min_accuracy
    type: FLOAT
    defaults: 0.90
  - id: max_accuracy_drop
    type: FLOAT
    description: Absolute accuracy difference, not a percentage; 0.01 permits a one percentage point drop.
    defaults: 0.01
  - id: max_p95_latency_ms
    type: FLOAT
    defaults: 100
  - id: max_peak_rss_mib
    type: FLOAT
    defaults: 512
  - id: max_resource_increase
    type: FLOAT
    description: Relative increase allowed over champion latency and memory; 0.10 permits ten percent.
    defaults: 0.10

tasks:
  - id: resolve_aliases
    type: io.kestra.plugin.core.flow.Parallel
    tasks:
      - id: resolve_candidate
        type: io.kestra.plugin.core.http.Request
        timeout: PT30S
        method: GET
        headers:
          Accept: application/json
          Authorization: "Bearer {{ secret('MLFLOW_TOKEN') }}"
        retry:
          type: exponential
          interval: PT2S
          maxInterval: PT10S
          maxAttempts: 3
        uri: "{{ secret('MLFLOW_TRACKING_URI') }}/api/2.0/mlflow/registered-models/alias?name={{ inputs.model_name | urlencode }}&alias={{ inputs.candidate_alias | urlencode }}"
      - id: resolve_champion
        type: io.kestra.plugin.core.http.Request
        timeout: PT30S
        method: GET
        headers:
          Accept: application/json
          Authorization: "Bearer {{ secret('MLFLOW_TOKEN') }}"
        retry:
          type: exponential
          interval: PT2S
          maxInterval: PT10S
          maxAttempts: 3
        uri: "{{ secret('MLFLOW_TRACKING_URI') }}/api/2.0/mlflow/registered-models/alias?name={{ inputs.model_name | urlencode }}&alias={{ inputs.champion_alias | urlencode }}"

  - id: pin_versions
    type: io.kestra.plugin.scripts.python.Script
    description: Pin numbered versions and their explicitly linked evaluation runs; never use a training run as an implicit substitute.
    timeout: PT1M
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    inputFiles:
      candidate.json: "{{ outputs.resolve_candidate.body }}"
      champion.json: "{{ outputs.resolve_champion.body }}"
      config.json: "{{ inputs | toJson }}"
    script: |
      import json
      import re

      def load(path):
          with open(path, encoding="utf-8") as handle:
              return json.load(handle)

      config = load("config.json")
      pins = {"model_name": config["model_name"]}
      for role in ("candidate", "champion"):
          version = load(role + ".json")["model_version"]
          number = str(version.get("version", ""))
          if version.get("name") != config["model_name"] or not re.fullmatch(r"[1-9][0-9]*", number):
              raise ValueError("Unexpected model identity for " + role)
          if version.get("status") != "READY":
              raise ValueError(role + " model version is not READY")
          tags = {tag["key"]: tag["value"] for tag in version.get("tags", [])}
          run_id = tags.get("evaluation_run_id", "")
          if not re.fullmatch(r"[0-9a-f]{32}", run_id):
              raise ValueError(role + " needs an evaluation_run_id model-version tag")
          pins[role] = {"version": number, "run_id": run_id}
      if pins["candidate"]["version"] == pins["champion"]["version"]:
          raise ValueError("Candidate and champion must be different versions")
      if pins["candidate"]["run_id"] == pins["champion"]["run_id"]:
          raise ValueError("Each model version needs its own evaluation run")
      print("::" + json.dumps({"outputs": pins}) + "::")

  - id: fetch_evaluations
    type: io.kestra.plugin.core.flow.Parallel
    tasks:
      - id: fetch_candidate_run
        type: io.kestra.plugin.core.http.Request
        timeout: PT30S
        method: GET
        headers:
          Accept: application/json
          Authorization: "Bearer {{ secret('MLFLOW_TOKEN') }}"
        retry:
          type: exponential
          interval: PT2S
          maxInterval: PT10S
          maxAttempts: 3
        uri: "{{ secret('MLFLOW_TRACKING_URI') }}/api/2.0/mlflow/runs/get?run_id={{ outputs.pin_versions.vars.candidate.run_id }}"
      - id: fetch_champion_run
        type: io.kestra.plugin.core.http.Request
        timeout: PT30S
        method: GET
        headers:
          Accept: application/json
          Authorization: "Bearer {{ secret('MLFLOW_TOKEN') }}"
        retry:
          type: exponential
          interval: PT2S
          maxInterval: PT10S
          maxAttempts: 3
        uri: "{{ secret('MLFLOW_TRACKING_URI') }}/api/2.0/mlflow/runs/get?run_id={{ outputs.pin_versions.vars.champion.run_id }}"

  - id: assess
    type: io.kestra.plugin.scripts.python.Script
    description: Reject missing or incomparable evidence, then apply absolute limits and champion-relative regression checks.
    timeout: PT1M
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    inputFiles:
      pins.json: "{{ outputs.pin_versions.vars | toJson }}"
      config.json: "{{ inputs | toJson }}"
      candidate.json: "{{ outputs.fetch_candidate_run.body }}"
      champion.json: "{{ outputs.fetch_champion_run.body }}"
    outputFiles:
      - report.json
      - report.md
    script: |
      import datetime
      import json
      import math

      def load(path):
          with open(path, encoding="utf-8") as handle:
              return json.load(handle)

      pins, config = load("pins.json"), load("config.json")
      reasons, measurements, contracts = [], {}, {}
      threshold_keys = ("min_accuracy", "max_accuracy_drop", "max_p95_latency_ms",
                        "max_peak_rss_mib", "max_resource_increase")
      thresholds = {}
      for key in threshold_keys:
          value = config[key]
          if isinstance(value, bool) or not isinstance(value, (int, float)) or not math.isfinite(value):
              raise ValueError("Threshold must be finite: " + key)
          if value < 0 or (key in ("min_accuracy", "max_accuracy_drop") and value > 1):
              raise ValueError("Threshold outside its supported range: " + key)
          if key in ("max_p95_latency_ms", "max_peak_rss_mib") and value == 0:
              raise ValueError("Resource limits must be positive")
          thresholds[key] = value

      contract_keys = ("dataset_digest", "hardware_id", "batch_size", "benchmark_protocol", "device")
      for role in ("candidate", "champion"):
          run = load(role + ".json")["run"]
          info = run["info"]
          tags = {item["key"]: item["value"] for item in run.get("data", {}).get("tags", [])}
          if info.get("run_id") != pins[role]["run_id"] or info.get("status") != "FINISHED" or info.get("lifecycle_stage") != "active":
              reasons.append(role + ": evaluation identity/status is invalid")
          if tags.get("evaluation.model_name") != pins["model_name"] or tags.get("evaluation.model_version") != pins[role]["version"]:
              reasons.append(role + ": evaluation is not linked to the pinned model version")
          contracts[role] = {key: tags.get("evaluation." + key) for key in contract_keys}
          if any(not isinstance(value, str) or not value.strip() for value in contracts[role].values()):
              reasons.append(role + ": missing benchmark contract tags")
          batch_size = contracts[role].get("batch_size") or ""
          if not batch_size.isdecimal() or int(batch_size) < 1:
              reasons.append(role + ": batch_size must be a positive integer")
          if contracts[role].get("device") != "cpu":
              reasons.append(role + ": benchmark device must be cpu")
          raw = {item["key"]: item["value"] for item in run.get("data", {}).get("metrics", [])}
          measurements[role] = {}
          for key in ("accuracy", "p95_latency_ms", "peak_rss_mib"):
              value = raw.get(key)
              valid = not isinstance(value, bool) and isinstance(value, (int, float)) and math.isfinite(value)
              valid = valid and (0 <= value <= 1 if key == "accuracy" else value > 0)
              measurements[role][key] = value if valid else None
              if not valid:
                  reasons.append(role + ": missing or invalid " + key)
      for key in contract_keys:
          if contracts["candidate"][key] != contracts["champion"][key]:
              reasons.append("Benchmark mismatch: " + key)

      gate_specs = (
          ("Accuracy floor", "accuracy below absolute floor", "accuracy", ">=", thresholds["min_accuracy"]),
          ("Accuracy regression", "accuracy regressed beyond tolerance", "accuracy", ">=", None),
          ("p95 latency ceiling", "p95 latency exceeds absolute limit", "p95_latency_ms", "<=", thresholds["max_p95_latency_ms"]),
          ("Peak RSS ceiling", "peak RSS exceeds absolute limit", "peak_rss_mib", "<=", thresholds["max_peak_rss_mib"]),
          ("p95 latency regression", "p95 latency regressed beyond tolerance", "p95_latency_ms", "<=", None),
          ("Peak RSS regression", "peak RSS regressed beyond tolerance", "peak_rss_mib", "<=", None),
      )
      gates = []
      comparable = not reasons
      for name, reason, metric, operator, bound in gate_specs:
          observed = measurements["candidate"][metric]
          if comparable:
              if bound is None:
                  baseline = measurements["champion"][metric]
                  bound = (baseline - thresholds["max_accuracy_drop"] if metric == "accuracy"
                           else baseline * (1 + thresholds["max_resource_increase"]))
              passed = observed >= bound if operator == ">=" else observed <= bound
              if not passed:
                  reasons.append(reason)
          else:
              passed = None
          gates.append({"name": name, "metric": metric, "operator": operator,
                        "observed": observed, "bound": bound, "passed": passed})
      eligible = not reasons
      verdict = "ELIGIBLE_FOR_REVIEW" if eligible else "BLOCKED"
      report = {
          "schema_version": 2, "verdict": verdict, "eligible": eligible,
          "approval_required": True, "pinned": pins, "measurements": measurements,
          "benchmark_contracts": contracts, "thresholds": thresholds, "reasons": reasons,
          "comparable": comparable, "gates": gates,
          "checked_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
      }
      with open("report.json", "w", encoding="utf-8") as handle:
          json.dump(report, handle, indent=2, allow_nan=False)
      def cell(value):
          if value is None:
              return "missing/invalid"
          return str(value).replace("\\", "\\\\").replace("|", "\\|").replace("`", "\\`").replace("<", "&lt;").replace(">", "&gt;").replace("\r", " ").replace("\n", " ")

      lines = ["# MLflow model evidence review", "", "Verdict: **" + verdict + "**", "",
               "Human approval is still required. No alias or deployment was changed.", "",
               "Model: " + cell(pins["model_name"]),
               "Candidate v" + cell(pins["candidate"]["version"]) + "; champion v" + cell(pins["champion"]["version"]),
               "", "| Metric | Candidate | Champion |", "| --- | --- | --- |"]
      for metric in ("accuracy", "p95_latency_ms", "peak_rss_mib"):
          lines.append("| " + metric + " | " + cell(measurements["candidate"][metric]) +
                       " | " + cell(measurements["champion"][metric]) + " |")
      lines += ["", "| Gate | Observed | Required | Result |", "| --- | --- | --- | --- |"]
      for gate in gates:
          status = "NOT_EVALUATED" if gate["passed"] is None else ("PASS" if gate["passed"] else "FAIL")
          bound = "n/a" if gate["passed"] is None else gate["operator"] + " " + cell(gate["bound"])
          lines.append("| " + gate["name"] + " | " + cell(gate["observed"]) + " | " + bound + " | " + status + " |")
      lines += ["", "## Findings", ""] + (["- " + cell(reason) for reason in reasons] or ["- All six gates passed on comparable evidence."])
      lines += ["", "## Evaluation provenance", ""]
      for role in ("candidate", "champion"):
          lines += ["- " + role + " run: " + cell(pins[role]["run_id"])]
          lines += ["  - " + key + ": " + cell(value) for key, value in contracts[role].items()]
      lines += ["", "Checked at: " + report["checked_at"], "",
                "See report.json for machine-readable limits, gates and provenance."]
      with open("report.md", "w", encoding="utf-8") as handle:
          handle.write("\n".join(lines) + "\n")
      summary = "MLflow candidate v%s vs champion v%s: %s. %s" % (
          pins["candidate"]["version"], pins["champion"]["version"], verdict,
          "; ".join(reasons) if reasons else "Review report.md and approve the pinned version in your release process; nothing was promoted.",
      )
      print("::" + json.dumps({"outputs": {"eligible": eligible, "verdict": verdict, "summary": summary}}) + "::")

  - id: route_report
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.assess.vars.eligible }}"
    then:
      - id: request_review
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: "{{ outputs.assess.vars.summary }} Download report.md from the assess task. Execution: {{ execution.id }}"
    else:
      - id: notify_blocked
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: "{{ outputs.assess.vars.summary }} Download report.md from the assess task. Execution: {{ execution.id }}. Registry and serving deployment unchanged."

errors:
  - id: notify_check_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: "MLflow evidence check failed before completing its report. Inspect execution {{ execution.id }}; do not treat this as promotion approval."

outputs:
  - id: eligible
    type: BOOL
    value: "{{ outputs.assess.vars.eligible ?? false }}"
  - id: verdict
    type: STRING
    value: "{{ outputs.assess.vars.verdict ?? 'CHECK_FAILED' }}"
  - id: report
    type: FILE
    value: "{{ outputs.assess.outputFiles['report.json'] ?? '' }}"

  - id: review_report
    type: FILE
    value: "{{ outputs.assess.outputFiles['report.md'] ?? '' }}"

triggers:
  - id: daily_evidence_review
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * *"
    disabled: true

extend:
  title: Compare MLflow Candidate and Champion Evaluation Evidence
  metaTitle: MLflow Candidate Quality and CPU Benchmark Review with Kestra
  shortDescription: Pin MLflow aliases, compare quality and CPU benchmark evidence, and send a review report or blocked verdict to Slack without promoting a model.
  metaDescription: Compare pinned MLflow candidate and champion evaluations, reject incomparable CPU benchmarks, and send a promotion review report to Slack.
  description: |
    Compare precomputed CPU evaluations before an operator approves a model release. This flow reads MLflow; it neither benchmarks models nor changes aliases or deployments.

    ## How it works

    1. Manual execution or a disabled daily schedule resolves candidate/champion aliases once.
    2. `pin_versions` checks READY versions and their `evaluation_run_id` version tags. Four retryable, 30-second HTTP tasks fetch aliases and evaluations; Python tasks have one-minute timeouts.
    3. `assess` checks completed runs, model identity, matching benchmark contracts, and finite metrics. It applies accuracy floors/drop tolerance and absolute/relative latency and RSS limits.
    4. An If task sends eligible candidates to Slack review or explains why evidence is blocked.

    ## What you get

    - Readable `report.md` and machine-readable `report.json`: pinned versions/runs, metrics, contracts, limits, reasons, and six explicit gate results. Incomparable evidence leaves gates NOT_EVALUATED.
    - `eligible` and `verdict` outputs. SUCCESS means the check completed, not release approval. Downstream flows must check `eligible` and obtain approval for the pinned version.
    - Failure notification when fetching or checking evidence fails.

    ## Who it's for

    MLOps and platform teams reviewing CPU inference releases.

    ## Why orchestrate this with Kestra

    Separate API tasks expose retries and failures; branching, stored reports, and notification history keep the decision auditable.

    ## Prerequisites

    Kestra 2.0 with Python and Slack plugins, Python 3 on the Process worker, and a reachable MLflow registry with two distinct READY versions. A trusted CPU evaluation job must log `accuracy` (0–1), `p95_latency_ms`, and `peak_rss_mib` (process peak RSS in MiB) into each finished evaluation run.

    Each run needs `evaluation.model_name`, `evaluation.model_version`, and matching `evaluation.dataset_digest`, `evaluation.hardware_id`, `evaluation.batch_size` (positive integer), `evaluation.benchmark_protocol`, and `evaluation.device=cpu` tags. Include runtime, concurrency, warm-up, sampling, and memory measurement conventions in the protocol identifier. Set each model version's `evaluation_run_id` tag to its evaluation run. A training run is not an implicit fallback.

    ### Secrets

    - `MLFLOW_TRACKING_URI`: server base URL, without trailing slash.
    - `MLFLOW_TOKEN`: read-only bearer token accepted by the server's auth layer.
    - `SLACK_WEBHOOK_URL`: incoming webhook for the review channel.

    ## Quick start

    1. Log comparable evaluations and link their run IDs to the two versions.
    2. Set secrets, model/alias inputs, and release limits; execute manually.
    3. Inspect both notification branches using a passing and a regressing candidate. Review the gate table in report.md before approving a pinned release externally.
    4. Enable the schedule only after configuring its default model and limits.

    ## How to extend

    Invoke from a completed evaluation job or add a separate approval/deployment subflow that revalidates the pinned release inputs.

    ## Links

    - [MLflow REST API](https://mlflow.org/docs/latest/api_reference/rest-api.html)
    - [Python task](https://kestra.io/plugins/plugin-script-python)
    - [Slack task](https://kestra.io/plugins/plugin-slack/slack-notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - AI
  subTags:
    - Testing & Quality
    - Monitoring & Alerting
  ee: false
  demo: false
