id: nats-leafnode-write-deadline-and-reconnect-storm-sentinel
namespace: company.sre
description: 'Audits NATS messaging system telemetry for leafnode connection write
  deadline timeouts, rapid reconnect storms, and socket buffer saturation.

  '
concurrency:
  limit: 1
inputs:
- id: nats_metrics_url
  type: STRING
  displayName: NATS Metrics Service URL
  defaults: http://nats.messaging.svc.cluster.local:7777
  description: Internal HTTP URL exposing Prometheus metrics for the NATS server and
    leafnode gateway.
- id: account_name
  type: STRING
  displayName: NATS Account Identifier
  defaults: enterprise-iot-account
  description: Identifier of the target multi-tenant NATS account under active leafnode
    surveillance.
- id: max_write_deadline_timeouts_threshold
  type: INT
  displayName: Max Write Deadline Timeouts Threshold
  defaults: 3
  description: Maximum allowable TCP write deadline expiration errors before raising
    an incident alert.
- id: max_reconnect_storm_rate_per_min
  type: INT
  displayName: Max Reconnect Rate (per min)
  defaults: 25
  description: Maximum allowable reconnect events per minute across edge leafnodes
    before flagging a reconnect storm.
- id: alert_on_leafnode_disconnect
  type: BOOL
  displayName: Alert on Leafnode Disconnect
  defaults: true
  description: Toggle whether sudden drop in connected edge leafnodes generates an
    immediate alert.
tasks:
- id: scan_nats_telemetry
  type: io.kestra.plugin.scripts.python.Script
  description: Scrapes NATS server Prometheus metrics to audit leafnode TCP write
    deadlines, reconnect rates, and socket buffer state.
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  beforeCommands:
  - pip install requests kestra
  env:
    NATS_URL: '{{ inputs.nats_metrics_url }}'
    ACCOUNT_NAME: '{{ inputs.account_name }}'
    MAX_TIMEOUTS: '{{ inputs.max_write_deadline_timeouts_threshold }}'
    MAX_RECONNECTS: '{{ inputs.max_reconnect_storm_rate_per_min }}'
    ALERT_DISCONNECT: '{{ inputs.alert_on_leafnode_disconnect }}'
  script: "import os\nimport sys\nimport re\nimport requests\nfrom datetime import\
    \ datetime, timezone\nfrom kestra import Kestra\n\nbase_url = os.environ.get(\"\
    NATS_URL\", \"\").rstrip(\"/\")\naccount_name = os.environ.get(\"ACCOUNT_NAME\"\
    , \"enterprise-iot-account\")\nmax_timeouts = int(os.environ.get(\"MAX_TIMEOUTS\"\
    , \"3\"))\nmax_reconnects = int(os.environ.get(\"MAX_RECONNECTS\", \"25\"))\n\
    alert_disconnect = os.environ.get(\"ALERT_DISCONNECT\", \"true\").lower() == \"\
    true\"\n\nmetrics_url = f\"{base_url}/metrics\"\ntry:\n    resp = requests.get(metrics_url,\
    \ timeout=12)\n    resp.raise_for_status()\nexcept Exception as err:\n    sys.stderr.write(f\"\
    Failed to scrape NATS metrics from {metrics_url}: {err}\\n\")\n    sys.exit(1)\n\
    \nwrite_deadline_timeouts = 0\nreconnect_rate = 0\nconnected_leafnodes = 0\npending_bytes\
    \ = 0\ndegraded_leafnodes = []\n\nfor line in resp.text.splitlines():\n    line\
    \ = line.strip()\n    if not line or line.startswith(\"#\"):\n        continue\n\
    \    match = re.search(r'([0-9.]+)\\s*$', line)\n    if not match:\n        continue\n\
    \    val = float(match.group(1))\n    if \"nats_leafnode_write_deadline_timeouts_total\"\
    \ in line:\n        write_deadline_timeouts += int(val)\n        if write_deadline_timeouts\
    \ > max_timeouts:\n            degraded_leafnodes.append(\"edge-factory-leaf-gateway\"\
    )\n    elif \"nats_leafnode_reconnects_rate_per_min\" in line:\n        reconnect_rate\
    \ = max(reconnect_rate, int(val))\n    elif \"nats_leafnode_connected_count\"\
    \ in line:\n        connected_leafnodes = int(val)\n    elif \"nats_leafnode_pending_bytes\"\
    \ in line:\n        pending_bytes = max(pending_bytes, int(val))\n\nis_breached\
    \ = bool(\n    (write_deadline_timeouts > max_timeouts) or\n    (reconnect_rate\
    \ > max_reconnects) or\n    (alert_disconnect and connected_leafnodes == 0)\n\
    )\nnow_iso = datetime.now(timezone.utc).isoformat()\n\nKestra.outputs({\n    \"\
    write_deadline_timeouts_count\": write_deadline_timeouts,\n    \"reconnect_rate_per_min\"\
    : reconnect_rate,\n    \"connected_leafnodes_count\": connected_leafnodes,\n \
    \   \"pending_bytes_total\": pending_bytes,\n    \"degraded_leafnodes\": list(set(degraded_leafnodes)),\n\
    \    \"is_alerting\": is_breached,\n    \"account_name\": account_name,\n    \"\
    audit_timestamp\": now_iso\n})\n"
  containerImage: python:3.11-slim
- id: evaluate_nats_health
  type: io.kestra.plugin.core.flow.If
  description: Evaluates whether observed NATS leafnode write deadlines, reconnect
    storms, or disconnects breach operational bounds.
  condition: '{{ outputs.scan_nats_telemetry.vars.is_alerting }}'
  then:
  - id: notify_slack_messaging_team
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatches high-urgency incident notification to Messaging SRE Slack
      channel detailing NATS leafnode connection degradation.
    url: '{{ secret(''SLACK_WEBHOOK_URL'') }}'
    payload: "{\n  \"channel\": \"#messaging-bus-alerts\",\n  \"text\": \"CRITICAL:\
      \ NATS Leafnode Degradation on Account `{{ inputs.account_name }}`. Write Timeouts:\
      \ `{{ outputs.scan_nats_telemetry.vars.write_deadline_timeouts_count }}` (threshold:\
      \ `{{ inputs.max_write_deadline_timeouts_threshold }}`). Reconnect Rate: `{{\
      \ outputs.scan_nats_telemetry.vars.reconnect_rate_per_min }}`/min (threshold:\
      \ `{{ inputs.max_reconnect_storm_rate_per_min }}`/min). Connected Leafnodes:\
      \ `{{ outputs.scan_nats_telemetry.vars.connected_leafnodes_count }}`. Audit\
      \ Timestamp: `{{ outputs.scan_nats_telemetry.vars.audit_timestamp }}`.\"\n}\n"
  else:
  - id: log_nominal_nats_state
    type: io.kestra.plugin.core.log.Log
    description: Records nominal telemetry when NATS leafnodes stream messages across
      edge networks without write stalls or reconnect churn.
    message: 'NATS leafnode mesh operating nominally: {{ outputs.scan_nats_telemetry.vars.write_deadline_timeouts_count
      }} write timeouts, {{ outputs.scan_nats_telemetry.vars.reconnect_rate_per_min
      }} reconnects/min, {{ outputs.scan_nats_telemetry.vars.connected_leafnodes_count
      }} connected leafnodes.'
- id: emit_audit_manifest
  type: io.kestra.plugin.core.debug.Return
  description: Emits structured audit manifest for distributed messaging governance
    and edge pub-sub availability records.
  format: "{\n  \"status\": \"{{ outputs.scan_nats_telemetry.vars.is_alerting ? 'ALERT'\
    \ : 'NOMINAL' }}\",\n  \"account_name\": \"{{ inputs.account_name }}\",\n  \"\
    write_timeouts\": {{ outputs.scan_nats_telemetry.vars.write_deadline_timeouts_count\
    \ }},\n  \"reconnect_rate\": {{ outputs.scan_nats_telemetry.vars.reconnect_rate_per_min\
    \ }},\n  \"connected_leafnodes\": {{ outputs.scan_nats_telemetry.vars.connected_leafnodes_count\
    \ }},\n  \"pending_bytes\": {{ outputs.scan_nats_telemetry.vars.pending_bytes_total\
    \ }},\n  \"audit_timestamp\": \"{{ outputs.scan_nats_telemetry.vars.audit_timestamp\
    \ }}\"\n}\n"
triggers:
- id: periodic_nats_audit
  type: io.kestra.plugin.core.trigger.Schedule
  cron: '*/15 * * * *'
  disabled: true
extend:
  title: NATS Leafnode Write Deadline and Reconnect Storm Sentinel
  metaTitle: NATS Leafnode Mesh Sentinel Blueprint
  shortDescription: Audits NATS messaging for leafnode write deadline timeouts, rapid
    reconnect storms, and socket buffer saturation.
  metaDescription: Audits NATS telemetry to detect leafnode TCP write deadline expirations,
    edge reconnect storms, and socket buffer saturation.
  description: "Automates continuous health and edge messaging surveillance for NATS\
    \ leafnode network architectures.\n\n## How it works\n1. A schedule trigger executes\
    \ the NATS leafnode audit workflow every 15 minutes.\n2. The Python task queries\
    \ the NATS server Prometheus metrics endpoint on port 7777.\n3. The script extracts\
    \ TCP write deadline expiration errors, edge reconnect rates, and pending socket\
    \ buffer bytes.\n4. An evaluation gate determines whether write timeouts, reconnect\
    \ storms, or disconnects breach operational bounds.\n5. When leafnode connection\
    \ degradation is detected, a high-priority Slack alert is dispatched to the Messaging\
    \ SRE team.\n6. When edge leafnodes stream pub/sub messages to the hub cluster\
    \ cleanly, nominal telemetry is logged.\n7. A structured JSON audit manifest is\
    \ emitted for messaging infrastructure governance and edge SLA records.\n\n##\
    \ Architecture diagram\n```mermaid\ngraph TD\n    Trigger[Schedule Trigger: 15m]\
    \ --> ScanMetrics[Python Script: Scrape NATS Metrics]\n    ScanMetrics --> EvalBreach{Write\
    \ Timeouts > 3 OR Reconnect Storm?}\n    EvalBreach -- Yes --> SlackAlert[Slack:\
    \ High-Urgency Messaging Alert]\n    EvalBreach -- No --> LogNominal[Log: Nominal\
    \ NATS State]\n    SlackAlert --> EmitManifest[Debug Return: Messaging Audit Manifest]\n\
    \    LogNominal --> EmitManifest\n```\n\n## Architecture components\n- **Trigger**:\
    \ Automated schedule polling at 15-minute recurring intervals.\n- **Script Task**:\
    \ Scrapes NATS server Prometheus metrics endpoints using Docker container runners.\n\
    - **Decision Gate**: Evaluates whether leafnode write deadline timeouts or reconnect\
    \ rates exceed limits.\n- **Notification Task**: Dispatches structured Slack alerts\
    \ with account name and reconnect rate metrics.\n- **Audit Manifest**: Emits JSON\
    \ execution payloads containing edge messaging health and timestamps.\n\n## Key\
    \ capabilities\n- Continuous surveillance of NATS leafnode TCP connections linking\
    \ edge devices, branch offices, and cloud hubs.\n- Early warning detection for\
    \ slow consumer socket buffer accumulation triggering `write_deadline` errors.\n\
    - Automated detection of edge reconnect storms following WAN link flapping or\
    \ DNS resolution outages.\n- Zero host dependency execution via isolated containerized\
    \ Python runners.\n\n## What you get\n- Real-time visibility into edge-to-cloud\
    \ messaging fabric stability, latency, and socket buffer health.\n- Proactive\
    \ alerts preventing edge message backlog dropouts caused by slow TCP consumer\
    \ writes.\n- Standardized audit manifests containing exact connected leafnode\
    \ totals and execution timestamps.\n- Zero-overhead deployment compatible with\
    \ NATS Core, JetStream, and multi-tenant Account architectures.\n\n## Who it's\
    \ for\n- Messaging and event streaming SREs maintaining distributed NATS and JetStream\
    \ clusters.\n- IoT and edge computing engineers deploying leafnodes in connected\
    \ vehicles, factories, and retail branches.\n- Cloud platform architects designing\
    \ hybrid on-premise to cloud pub/sub messaging topologies.\n- Distributed systems\
    \ developers validating zero-message-loss SLAs across constrained network links.\n\
    \n## Why orchestrate this with Kestra\n- **Serverless Docker Isolation**: Executes\
    \ telemetry scraping in ephemeral Docker environments without persistent workers.\n\
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using\
    \ encrypted namespace secrets.\n- **Declarative YAML Workflows**: Manages messaging\
    \ control plane surveillance as versioned code in Git repositories.\n- **Comprehensive\
    \ Audit History**: Preserves historical messaging telemetry in searchable Kestra\
    \ execution logs.\n\n## Use cases\n- **WAN Latency Degradation Detection**: Identifies\
    \ slow cross-region fiber connections before write queues fill up.\n- **Edge Reconnect\
    \ Throttling**: Alerts engineers when hundreds of IoT leafnodes hammer hub clusters\
    \ simultaneously.\n- **Account Resource Enforcement**: Monitors per-account pending\
    \ byte memory buffers before hitting server limits.\n\n## Inputs\n| Name | Type\
    \ | Default | Description |\n| --- | --- | --- | --- |\n| `nats_metrics_url` |\
    \ STRING | `http://nats.messaging.svc.cluster.local:7777` | Internal HTTP URL\
    \ exposing Prometheus metrics for NATS. |\n| `account_name` | STRING | `enterprise-iot-account`\
    \ | Identifier of the target NATS account under active surveillance. |\n| `max_write_deadline_timeouts_threshold`\
    \ | INT | `3` | Maximum allowable TCP write deadline errors before alerting. |\n\
    | `max_reconnect_storm_rate_per_min` | INT | `25` | Maximum allowable reconnect\
    \ events per minute across leafnodes. |\n| `alert_on_leafnode_disconnect` | BOOL\
    \ | `true` | Toggle whether complete leafnode disconnection triggers an alert.\
    \ |\n\n## Expected outputs\n- `{{ outputs.scan_nats_telemetry.vars.write_deadline_timeouts_count\
    \ }}`: Count of TCP write deadline timeout expirations.\n- `{{ outputs.scan_nats_telemetry.vars.reconnect_rate_per_min\
    \ }}`: Maximum observed reconnect events per minute.\n- `{{ outputs.scan_nats_telemetry.vars.connected_leafnodes_count\
    \ }}`: Total count of active connected edge leafnodes.\n- `{{ outputs.scan_nats_telemetry.vars.is_alerting\
    \ }}`: Boolean flag indicating if messaging SLA is breached.\n- `{{ outputs.scan_nats_telemetry.vars.audit_timestamp\
    \ }}`: ISO-8601 UTC timestamp of the messaging audit run.\n\n## Prerequisites\n\
    - NATS Server 2.9+ deployed with Prometheus metrics exporter enabled on port 7777.\n\
    - Network connectivity from the Kestra worker to the NATS metrics service.\n-\
    \ Configured Slack incoming webhook URL with permissions to post in messaging\
    \ alert channels.\n\n### Secrets\n- `SLACK_WEBHOOK_URL`: Secure webhook URL for\
    \ routing messaging alerts to the Messaging SRE Slack channel.\n\n## Quick start\n\
    1. Verify that NATS server exposes Prometheus metrics on HTTP port 7777.\n2. Add\
    \ the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.\n3. Specify\
    \ your NATS account identifier in `account_name`.\n4. Run a manual flow execution\
    \ via the Kestra UI to validate metric ingestion.\n5. Enable the `periodic_nats_audit`\
    \ schedule trigger to establish automated monitoring.\n\n## Common pitfalls and\
    \ troubleshooting\n- **Write Deadline Tuning**: Slow edge links require increasing\
    \ `write_deadline` (e.g. `10s`) in leafnode config blocks.\n- **TLS Handshake\
    \ Delays**: Outdated TLS cipher suites on edge devices can cause connection handshakes\
    \ to time out.\n- **Buffer Memory Exhaustion**: If edge consumers lag, ensure\
    \ `max_pending` byte limits are configured per account.\n- **NAT Gateway Port\
    \ Exhaustion**: Massive leafnode reconnect bursts can overwhelm outbound NAT connection\
    \ tables.\n\n## How to extend\n- **Automated Reconnect Backoff Enforcement**:\
    \ Trigger configuration updates to increase jitter and backoff intervals.\n- **PagerDuty\
    \ Escalation**: Escalate to on-call messaging engineers if critical leafnode hubs\
    \ disconnect completely.\n- **JetStream Stream Lag Correlation**: Correlate leafnode\
    \ write stalls with JetStream consumer lag metrics.\n\n## Links\n- [Kestra Python\
    \ Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)\n\
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)\n\
    - [NATS.io Official Documentation](https://docs.nats.io/)\n- [NATS Leafnode Architecture\
    \ and Configuration Guide](https://docs.nats.io/running-a-nats-service/configuration/leafnodes)\n\
    - [NATS Prometheus Monitoring Reference](https://docs.nats.io/running-a-nats-service/nats_admin/monitoring)\n"
  tags:
  - Infrastructure
  - Cloud
  subTags:
  - Monitoring & Alerting
  - Day 2 Operations
  ee: false
  demo: false
outputs:
- id: write_deadline_timeouts_count
  type: INT
  value: '{{ outputs.scan_nats_telemetry.vars.write_deadline_timeouts_count }}'
- id: reconnect_rate_per_min
  type: INT
  value: '{{ outputs.scan_nats_telemetry.vars.reconnect_rate_per_min }}'
- id: connected_leafnodes_count
  type: INT
  value: '{{ outputs.scan_nats_telemetry.vars.connected_leafnodes_count }}'
- id: pending_bytes_total
  type: INT
  value: '{{ outputs.scan_nats_telemetry.vars.pending_bytes_total }}'
- id: is_alerting
  type: BOOLEAN
  value: '{{ outputs.scan_nats_telemetry.vars.is_alerting }}'
