id: nats-jetstream-redelivery-ack-guard
namespace: company.team
description: |
  Inspect one durable JetStream consumer without fetching or acknowledging its messages.
  Alert once when redeliveries, unacknowledged work, or backlog crosses a threshold.
  An operator may approve a bounded five-minute delivery pause after a fresh recheck.

concurrency: {limit: 1, behavior: QUEUE}

triggers:
  - id: incident_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: nats-jetstream-guard-change-me
    description: "POST /api/v1/main/executions/webhook/company.team/nats-jetstream-redelivery-ack-guard/nats-jetstream-guard-change-me after a JetStream consumer advisory or on-call request. Replace the key before enabling."
  - id: periodic_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true
    description: Enable after setting the inputs and secrets; the sweep checks the durable consumer every five minutes.

inputs:
  - id: nats_url
    type: STRING
    defaults: nats://nats:4222
    description: NATS server address reachable from the Kestra worker; change the host for your cluster.
  - id: stream
    type: STRING
    defaults: ORDERS
    description: Exact JetStream stream name to inspect; the guard refuses names that could change the API subject.
  - id: consumer
    type: STRING
    defaults: workers
    description: Exact durable consumer name to inspect; the guard never creates or resets this consumer.
  - id: redelivery_threshold
    type: INT
    defaults: 1
    description: Alert when the current count of redelivered messages reaches this value; tune to your workload.
  - id: ack_pending_threshold
    type: INT
    defaults: 10
    description: Alert when at least this many deliveries still await explicit acknowledgment.
  - id: backlog_threshold
    type: INT
    defaults: 100
    description: Alert when at least this many stream messages await delivery to this consumer.
  - id: offer_pause
    type: BOOL
    defaults: true
    description: Offer a human-approved five-minute delivery pause on a newly degraded state; turn off for read-only monitoring.

tasks:
  - id: validate_scope
    type: io.kestra.plugin.core.flow.If
    description: Reject unsafe subject tokens and zero thresholds before contacting NATS.
    condition: >-
      {{ (inputs.stream | toJson | jq('test("^[A-Za-z0-9_-]{1,64}$")') | first)
         and (inputs.consumer | toJson | jq('test("^[A-Za-z0-9_-]{1,64}$")') | first)
         and (inputs.nats_url | toJson | jq('test("^nats://[A-Za-z0-9.-]+:[0-9]{1,5}$")') | first)
         and inputs.redelivery_threshold > 0
         and inputs.ack_pending_threshold > 0
         and inputs.backlog_threshold > 0 }}
    then:
      - id: scope_valid
        type: io.kestra.plugin.core.log.Log
        message: "Validated consumer scope and positive thresholds."
    else:
      - id: reject_scope
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Invalid JetStream guard scope: use nats://host:port without embedded credentials, 1-64 safe characters for stream/consumer, and positive thresholds."

  - id: inspect_consumer
    type: io.kestra.plugin.nats.core.Request
    description: Read the native JetStream consumer-info API; this never pulls or ACKs messages.
    url: "{{ inputs.nats_url }}"
    subject: "$JS.API.CONSUMER.INFO.{{ inputs.stream }}.{{ inputs.consumer }}"
    from:
      data: "{}"
    requestTimeout: PT5S
    retry: {type: exponential, interval: PT2S, maxInterval: PT30S, maxAttempts: 3}

  - id: check_info_reply
    type: io.kestra.plugin.core.flow.If
    description: JetStream errors arrive as JSON inside successful NATS replies, so reject them explicitly.
    condition: >-
      {{ (outputs.inspect_consumer.response ?? '') != ''
         and (fromJson(outputs.inspect_consumer.response).error ?? '') == ''
         and (fromJson(outputs.inspect_consumer.response).stream_name ?? '') == inputs.stream
         and (fromJson(outputs.inspect_consumer.response).name ?? '') == inputs.consumer }}
    then:
      - id: info_valid
        type: io.kestra.plugin.core.log.Log
        message: "JetStream consumer-info reply matches the requested durable."
    else:
      - id: reject_info_reply
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "JetStream consumer-info reply was empty, an API error, or named a different consumer. Check the stream, durable name, and NATS permissions."

  - id: snapshot
    type: io.kestra.plugin.core.output.OutputValues
    description: Expose the native counters so the alert and downstream flows use the same observed snapshot.
    values:
      stream: "{{ fromJson(outputs.inspect_consumer.response).stream_name }}"
      consumer: "{{ fromJson(outputs.inspect_consumer.response).name }}"
      ack_pending: "{{ fromJson(outputs.inspect_consumer.response).num_ack_pending ?? 0 }}"
      redelivered: "{{ fromJson(outputs.inspect_consumer.response).num_redelivered ?? 0 }}"
      backlog: "{{ fromJson(outputs.inspect_consumer.response).num_pending ?? 0 }}"
      max_ack_pending: "{{ fromJson(outputs.inspect_consumer.response).config.max_ack_pending ?? 0 }}"
      delivered_sequence: "{{ fromJson(outputs.inspect_consumer.response).delivered.consumer_seq ?? 0 }}"
      ack_floor_sequence: "{{ fromJson(outputs.inspect_consumer.response).ack_floor.consumer_seq ?? 0 }}"
      paused: "{{ fromJson(outputs.inspect_consumer.response).paused ?? false }}"

  - id: classify
    type: io.kestra.plugin.core.debug.Return
    description: Redelivery, in-flight ACK pressure, backlog, and hard max-ACK saturation each indicate a degraded durable consumer.
    format: >-
      {{ (outputs.snapshot.values.redelivered | number) >= inputs.redelivery_threshold
         or (outputs.snapshot.values.ack_pending | number) >= inputs.ack_pending_threshold
         or (outputs.snapshot.values.backlog | number) >= inputs.backlog_threshold
         or ((outputs.snapshot.values.max_ack_pending | number) > 0
             and (outputs.snapshot.values.ack_pending | number) >= (outputs.snapshot.values.max_ack_pending | number))
         ? 'DEGRADED' : 'HEALTHY' }}

  - id: previous_state
    type: io.kestra.plugin.core.debug.Return
    description: Capture the old state before the transition marker is updated.
    format: "{{ kv('NATS_GUARD_' ~ inputs.stream ~ '_' ~ inputs.consumer, errorOnMissing=false) ?? 'UNKNOWN' }}"

  - id: change_only
    type: io.kestra.plugin.core.flow.If
    description: Compare with a per-consumer KV marker so repeated sweeps do not page on unchanged pressure.
    condition: "{{ outputs.classify.value != outputs.previous_state.value }}"
    then:
      - id: alert_incident
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.classify.value == 'DEGRADED' }}"
        then:
          - id: notify_degraded
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            messageText: >-
              JetStream {{ inputs.stream }}/{{ inputs.consumer }} DEGRADED: {{ outputs.snapshot.values.redelivered }} redelivered,
              {{ outputs.snapshot.values.ack_pending }} awaiting ACK (limit {{ outputs.snapshot.values.max_ack_pending }}),
              {{ outputs.snapshot.values.backlog }} awaiting delivery. Inspect the worker and its ACK/error logs;
              do not ACK unprocessed messages. Review Kestra execution {{ execution.id }} for the current state and any pause approval.
            retry: {type: exponential, interval: PT2S, maxInterval: PT30S, maxAttempts: 3}
      - id: alert_recovery
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.classify.value == 'HEALTHY' and outputs.previous_state.value == 'DEGRADED' }}"
        then:
          - id: notify_recovered
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            messageText: "JetStream {{ inputs.stream }}/{{ inputs.consumer }} recovered: redelivered={{ outputs.snapshot.values.redelivered }}, awaiting ACK={{ outputs.snapshot.values.ack_pending }}, backlog={{ outputs.snapshot.values.backlog }}. Check that normal processing has resumed. Execution {{ execution.id }}."
            retry: {type: exponential, interval: PT2S, maxInterval: PT30S, maxAttempts: 3}
      - id: remember_state
        type: io.kestra.plugin.core.kv.Set
        key: "NATS_GUARD_{{ inputs.stream }}_{{ inputs.consumer }}"
        value: "{{ outputs.classify.value }}"
        kvType: STRING

  - id: propose_bounded_pause
    type: io.kestra.plugin.core.flow.If
    description: Ask only when an incident is new; the default is to take no action.
    condition: >-
      {{ inputs.offer_pause and outputs.classify.value == 'DEGRADED'
         and outputs.previous_state.value != 'DEGRADED' }}
    then:
      - id: approve_pause
        type: io.kestra.plugin.core.flow.Pause
        description: Pausing stops new deliveries for at most five minutes but leaves ACKs and stored messages intact.
        pauseDuration: PT15M
        behavior: WARN
        onResume:
          - id: action
            type: SELECT
            values: [REPORT_ONLY, PAUSE_5_MIN]
            defaults: REPORT_ONLY
            description: Choose PAUSE_5_MIN only after checking the worker; this does not ACK or delete messages.
      - id: act_on_approval
        type: io.kestra.plugin.core.flow.If
        condition: "{{ (outputs.approve_pause.onResume.action ?? 'REPORT_ONLY') == 'PAUSE_5_MIN' }}"
        then:
          - id: recheck_consumer
            type: io.kestra.plugin.nats.core.Request
            description: Re-read the same durable after the approval; refuse a stale decision if pressure cleared or another pause began.
            url: "{{ inputs.nats_url }}"
            subject: "$JS.API.CONSUMER.INFO.{{ inputs.stream }}.{{ inputs.consumer }}"
            from:
              data: "{}"
            requestTimeout: PT5S
            retry: {type: exponential, interval: PT2S, maxInterval: PT30S, maxAttempts: 3}
          - id: recheck_before_pause
            type: io.kestra.plugin.core.flow.If
            description: A bad or changed API response is not permission to mutate the consumer.
            condition: >-
              {{ (outputs.recheck_consumer.response ?? '') != ''
                 and (fromJson(outputs.recheck_consumer.response).error ?? '') == ''
                 and (fromJson(outputs.recheck_consumer.response).stream_name ?? '') == inputs.stream
                 and (fromJson(outputs.recheck_consumer.response).name ?? '') == inputs.consumer
                 and not (fromJson(outputs.recheck_consumer.response).paused ?? false)
                 and ((fromJson(outputs.recheck_consumer.response).num_redelivered ?? 0) >= inputs.redelivery_threshold
                      or (fromJson(outputs.recheck_consumer.response).num_ack_pending ?? 0) >= inputs.ack_pending_threshold
                      or (fromJson(outputs.recheck_consumer.response).num_pending ?? 0) >= inputs.backlog_threshold) }}
            then:
              - id: pause_deliveries
                type: io.kestra.plugin.nats.core.Request
                description: NATS itself auto-resumes at the timestamp; no ACK, reset, purge, or consumer deletion occurs.
                url: "{{ inputs.nats_url }}"
                subject: "$JS.API.CONSUMER.PAUSE.{{ inputs.stream }}.{{ inputs.consumer }}"
                from:
                  data: >-
                    {"pause_until":"{{ now() | dateAdd(5, 'MINUTES') }}"}
                requestTimeout: PT5S
                retry: {type: exponential, interval: PT2S, maxInterval: PT30S, maxAttempts: 3}
              - id: verify_pause_reply
                type: io.kestra.plugin.core.flow.If
                condition: >-
                  {{ (outputs.pause_deliveries.response ?? '') != ''
                     and (fromJson(outputs.pause_deliveries.response).error ?? '') == ''
                     and (fromJson(outputs.pause_deliveries.response).paused ?? false) }}
                then:
                  - id: pause_confirmed
                    type: io.kestra.plugin.core.log.Log
                    message: "NATS confirmed a bounded delivery pause."
                else:
                  - id: fail_pause_reply
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: "JetStream did not confirm the bounded pause. Inspect consumer info before attempting another action."
              - id: notify_paused
                type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                messageText: "JetStream {{ inputs.stream }}/{{ inputs.consumer }} deliveries paused until {{ fromJson(outputs.pause_deliveries.response).pause_until }} after approval in {{ execution.id }}. ACKs still work. Repair the worker now; NATS auto-resumes."
                retry: {type: exponential, interval: PT2S, maxInterval: PT30S, maxAttempts: 3}
            else:
              - id: log_stale_approval
                type: io.kestra.plugin.core.log.Log
                message: "Pause approval skipped for {{ inputs.stream }}/{{ inputs.consumer }}: pressure cleared, another pause exists, or consumer info changed/failed. No consumer mutation was requested."

errors:
  - id: alert_guard_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: >-
      JetStream guard FAILED for {{ inputs.stream }}/{{ inputs.consumer }} in Kestra {{ execution.id }}.
      The consumer was not acknowledged, reset, or deleted. Inspect the failed task and NATS API permissions;
      check consumer info directly before taking manual action.
      Failed task {{ (errorLogs() | first).taskId ?? 'unknown' }}. Possible causes: invalid scope,
      NATS connection/permission or API reply failure, or Slack delivery failure. Inspect the task log for the exact cause.

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.classify.value ?? 'UNKNOWN' }}"
  - id: counters
    type: JSON
    value: >-
      {{ (outputs.snapshot.values ?? {}) | toJson }}

extend:
  title: Guard JetStream Redeliveries and In-Flight Acknowledgments
  shortDescription: Inspect a durable NATS JetStream consumer, alert on redelivery or ACK pressure, and optionally pause deliveries for five minutes after approval.
  metaTitle: NATS JetStream Redelivery and ACK Guard with Kestra
  metaDescription: Monitor JetStream consumer redeliveries, ACK pressure and backlog with Kestra; approve a bounded pause without acknowledging or deleting messages.
  description: |
    A JetStream durable consumer can keep a backlog while its workers repeatedly receive the same unacknowledged messages. This flow reads consumer state through NATS request/reply, reports transitions once, and lets an operator briefly pause delivery to repair a worker. It never pulls, acknowledges, resets, purges, or deletes messages.

    ## How it works
    1. `validate_scope` (`If`) rejects unsafe stream/consumer tokens and nonpositive thresholds.
    2. `inspect_consumer` (`NATS Request`) queries `$JS.API.CONSUMER.INFO.<stream>.<consumer>`; `check_info_reply` rejects a JSON API error even when request/reply succeeded.
    3. `snapshot` exposes redelivered, ACK-pending, backlog, ACK limit, delivery/ACK floors, and paused state. `classify` marks pressure as `DEGRADED`.
    4. `change_only` compares a per-consumer Kestra KV marker, sends one Slack transition alert, and records the new status.
    5. On a new degraded state, `approve_pause` (`Pause`) offers `REPORT_ONLY` or `PAUSE_5_MIN`. If approved, `recheck_consumer` reads the durable again. Only still-degraded, not-already-paused consumers receive `$JS.API.CONSUMER.PAUSE` with a five-minute deadline. `verify_pause_reply` checks NATS confirmation.

    ## Error handling
    - NATS network requests retry with exponential backoff. A missing consumer, API error, empty response, or wrong identity fails before a pause request. `nats_url` must not contain embedded credentials.
    - The approval is bound to the named stream/consumer and a fresh health check. If conditions changed, the mutation is skipped.
    - A pause expires on the server after five minutes; ACKs for in-flight work remain possible. The flow never ACKs unprocessed messages.
    - The `errors` handler names the execution and points the operator to NATS consumer info and Kestra logs.

    ## What this blueprint teaches about Kestra
    - A non-core NATS Request task can query JetStream's native management subjects without introducing an HTTP monitoring port.
    - KV state suppresses repeated alerts while the flow's machine-readable counters remain available on every execution.
    - A `Pause` followed by a new NATS read prevents stale human approval from acting on recovered or already-paused state.

    ## Prerequisites
    - NATS Server 2.11 or later with JetStream enabled; a pre-existing durable consumer using explicit acknowledgments.
    - Kestra worker connectivity and NATS permissions to request consumer INFO and (if using approval) PAUSE subjects.
    - A Slack incoming webhook; replace the demo webhook trigger key.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: incoming webhook for state changes and failures. Add NATS credentials as `secret()` properties on both NATS Request tasks if your server requires authentication.

    ### Inputs
    - `nats_url` (STRING, default `nats://nats:4222`): worker-reachable NATS address.
    - `stream` (STRING, default `ORDERS`) and `consumer` (STRING, default `workers`): exact existing durable identity.
    - `redelivery_threshold` (INT, default 1), `ack_pending_threshold` (INT, default 10), `backlog_threshold` (INT, default 100): positive pressure limits.
    - `offer_pause` (BOOL, default true): allow an operator to approve a bounded delivery pause.

    ### Outputs
    - `status` (STRING): `HEALTHY`, `DEGRADED`, or `UNKNOWN` if the execution fails before classification.
    - `counters` (JSON): the observed consumer identity, counts, limits, sequence floors, and paused flag.

    ## Quick start
    1. Start NATS with `-js`; create `ORDERS` and an explicit-ACK durable named `workers`. Add `SLACK_WEBHOOK_URL` to Kestra secrets.
    2. Run with defaults after pointing `nats_url` at the server. With no messages, status is `HEALTHY` and all three pressure counts are zero.
    3. Deliver a message to the worker without ACKing it, then run again. At the default redelivery threshold, a redelivery produces a single `DEGRADED` alert and an optional approval.
    4. Enable the schedule only after changing the webhook key and tuning thresholds to your workload.

    ## Plugins used
    - [Kestra NATS Request](https://kestra.io/plugins/plugin-nats/nats-core/io.kestra.plugin.nats.core.request)
    - [Kestra Slack Incoming Webhook](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [Kestra Pause](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.pause)

    ## Links
    - [NATS JetStream API](https://docs.nats.io/reference/jetstream/api/)
    - [NATS consumer pause API](https://github.com/nats-io/nats.docs/blob/master/using-nats/jetstream/nats_api_reference.md)
    - This blueprint has been created by [ram0verflow](https://github.com/ram0verflow)
  tags: [Infrastructure, Data]
  subTags: [Monitoring & Alerting, Day 2 Operations]
  ee: false
  demo: false
