id: cpc-enso-oni-phase-change-commodity-alert
namespace: company.team

description: |
  Download the NOAA CPC Oceanic Nino Index (ONI), classify El Nino and La Nina episodes with the NOAA rule
  (five overlapping seasons at or beyond +/-0.5 C), and alert when the ENSO phase or strength changes or when
  CPC revises recent values across the threshold.

inputs:
  - id: threshold_c
    type: FLOAT
    defaults: 0.5
    min: 0.1
    max: 2.0
    description: ONI anomaly (C) that counts as warm or cold. NOAA uses 0.5, compared with the anomaly rounded to one decimal, like the CPC ONI table.

  - id: min_seasons
    type: INT
    defaults: 5
    min: 3
    max: 12
    description: Consecutive overlapping 3-month seasons beyond the threshold before conditions become an episode. NOAA uses 5.

  - id: revision_seasons
    type: INT
    defaults: 12
    min: 3
    max: 60
    description: How many of the latest seasons are snapshotted in KV and compared on the next run to detect CPC revisions.

  - id: alert_on_any_revision
    type: BOOL
    defaults: false
    description: By default only revisions that move a season across the threshold alert. Set to true to alert on every revised value.

triggers:
  - id: monthly_after_enso_discussion
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 15 15 * *"
    timezone: America/New_York
    description: CPC updates the ONI with the ENSO diagnostic discussion on the second Thursday of each month, so the 15th is always after it.

tasks:
  - id: download_oni
    type: io.kestra.plugin.core.http.Download
    uri: https://www.cpc.ncep.noaa.gov/data/indices/oni.ascii.txt
    headers:
      User-Agent: kestra-blueprint-cpc-enso-oni
    retry:
      type: constant
      interval: PT2M
      maxAttempts: 3

  - id: previous_state
    type: io.kestra.plugin.core.kv.Get
    key: cpc_enso_oni_state
    errorOnMissing: false
    description: "Format: status|strength|latest season|snapshot of recent anomalies. Missing on the first run, which is a BASELINE run that reports the current state and alerts on nothing."

  - id: classify
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Parses the whitespace-separated text file (one row per overlapping season since DJF 1950, the year is the
      year of the middle month). Each season is classified on the anomaly rounded to one decimal, so 0.46 counts
      as 0.5. Consecutive seasons with the same phase form a run; a run of min_seasons or more is an episode,
      a shorter one is reported as conditions. Strength uses the highest value held for three consecutive seasons
      (weak 0.5, moderate 1.0, strong 1.5, very strong 2.0), so one hot season does not upgrade an episode.
      The recent anomalies are compared with the KV snapshot to list CPC revisions.
    url: "jdbc:duckdb:"
    timeZoneId: UTC
    fetchType: FETCH_ONE
    inputFiles:
      oni.txt: "{{ outputs.download_oni.uri }}"
    outputFiles:
      - seasons_parquet
      - episodes_csv
    parameters:
      threshold: "{{ inputs.threshold_c }}"
      min_seasons: "{{ inputs.min_seasons }}"
      revision_seasons: "{{ inputs.revision_seasons }}"
      prev_state: "{{ outputs.previous_state.value ?? '' }}"
      today: "{{ now() | date('yyyy-MM-dd', timeZone='UTC') }}"
    sql: |
      CREATE TABLE lines AS
      SELECT unnest(range(1, len(l) + 1)) AS i, unnest(l) AS line
      FROM (SELECT string_split(content, chr(10)) AS l FROM read_text('oni.txt'));

      CREATE TABLE oni AS
      SELECT row_number() OVER (ORDER BY i) AS n, seas, yr, seas || ' ' || yr AS season, total, anom,
             round(anom, 1) AS anom_1dp, make_date(yr, center_m, 15) AS center_date
      FROM (SELECT i, p[1] AS seas, TRY_CAST(p[2] AS INTEGER) AS yr, TRY_CAST(p[3] AS DECIMAL(5,2)) AS total,
                   TRY_CAST(p[4] AS DECIMAL(5,2)) AS anom,
                   list_position(['DJF','JFM','FMA','MAM','AMJ','MJJ','JJA','JAS','ASO','SON','OND','NDJ'], p[1]) AS center_m
            FROM (SELECT i, regexp_split_to_array(trim(replace(line, chr(13), '')), '\s+') AS p FROM lines))
      WHERE yr IS NOT NULL AND anom IS NOT NULL AND center_m IS NOT NULL;

      CREATE TABLE sanity AS SELECT CASE WHEN count(*) < 600 THEN error('ONI file has only ' || count(*) || ' seasons, expected 900+') END AS ok FROM oni;

      CREATE TABLE seq AS
      SELECT *, n - row_number() OVER (PARTITION BY phase ORDER BY n) AS grp
      FROM (SELECT *, CASE WHEN anom_1dp >= CAST(:threshold AS DECIMAL(4,2)) THEN 'WARM'
                           WHEN anom_1dp <= -CAST(:threshold AS DECIMAL(4,2)) THEN 'COLD' ELSE 'NEUTRAL' END AS phase FROM oni);

      CREATE TABLE seq3 AS
      SELECT *, count(*) OVER w AS run_pos,
             CASE WHEN count(*) OVER w3 = 3 THEN min(abs(anom_1dp)) OVER w3 END AS held3
      FROM seq
      WINDOW w AS (PARTITION BY phase, grp ORDER BY n ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW),
             w3 AS (PARTITION BY phase, grp ORDER BY n ROWS BETWEEN 2 PRECEDING AND CURRENT ROW);

      CREATE TABLE runs AS
      SELECT phase, grp, min(n) AS start_n, count(*) AS seasons, arg_min(season, n) AS start_season, arg_max(season, n) AS end_season,
             max(n) = (SELECT max(n) FROM oni) AS ongoing, max(abs(anom_1dp)) AS peak_1dp, coalesce(max(held3), 0) AS peak_held3,
             CASE WHEN coalesce(max(held3), 0) >= 2.0 THEN 'VERY_STRONG' WHEN coalesce(max(held3), 0) >= 1.5 THEN 'STRONG'
                  WHEN coalesce(max(held3), 0) >= 1.0 THEN 'MODERATE' ELSE 'WEAK' END AS strength
      FROM seq3 GROUP BY phase, grp;

      CREATE TABLE cur AS
      SELECT s.season, s.seas, s.yr, s.anom, s.anom_1dp, s.phase, r.seasons AS run_len, r.start_season, r.peak_1dp, r.peak_held3,
             CASE WHEN s.phase = 'NEUTRAL' THEN 'NEUTRAL'
                  ELSE CASE s.phase WHEN 'WARM' THEN 'EL_NINO' ELSE 'LA_NINA' END
                       || CASE WHEN r.seasons >= CAST(:min_seasons AS INTEGER) THEN '' ELSE '_CONDITIONS' END END AS status,
             CASE WHEN s.phase = 'NEUTRAL' THEN 'NONE' ELSE r.strength END AS strength,
             datediff('month', s.center_date, CAST(:today AS DATE)) AS lag_months
      FROM seq3 s JOIN runs r USING (phase, grp) WHERE s.n = (SELECT max(n) FROM oni);

      CREATE TABLE prev AS
      SELECT nullif(split_part(:prev_state, '|', 1), '') AS status, split_part(:prev_state, '|', 2) AS strength,
             split_part(:prev_state, '|', 3) AS season;

      CREATE TABLE revisions AS
      SELECT o.season, p.anom AS old_anom, o.anom AS new_anom, o.anom - p.anom AS delta,
             sign(round(p.anom, 1)) * CAST(abs(round(p.anom, 1)) >= CAST(:threshold AS DECIMAL(4,2)) AS INTEGER)
               <> sign(o.anom_1dp) * CAST(abs(o.anom_1dp) >= CAST(:threshold AS DECIMAL(4,2)) AS INTEGER) AS crosses_threshold
      FROM (SELECT split_part(kv, '=', 1) AS k, TRY_CAST(split_part(kv, '=', 2) AS DECIMAL(5,2)) AS anom
            FROM (SELECT unnest(string_split(split_part(:prev_state, '|', 4), ';')) AS kv) WHERE kv <> '') p
      JOIN oni o ON o.seas || o.yr = p.k
      WHERE o.anom <> p.anom;

      COPY (SELECT season, seas, yr, total, anom, anom_1dp, phase, run_pos, held3 AS held_3_seasons FROM seq3 ORDER BY n)
        TO '{{ outputFiles.seasons_parquet }}' (FORMAT PARQUET);
      COPY (SELECT CASE phase WHEN 'WARM' THEN 'El Nino' ELSE 'La Nina' END AS episode, start_season, end_season, seasons,
                   peak_1dp, peak_held3, strength, ongoing
            FROM runs WHERE phase <> 'NEUTRAL' AND seasons >= CAST(:min_seasons AS INTEGER) ORDER BY start_n)
        TO '{{ outputFiles.episodes_csv }}' (HEADER, DELIMITER ',');

      CREATE TABLE result AS
      SELECT c.*, p.status IS NULL AS is_baseline, coalesce(p.status, '') AS prev_status, p.strength AS prev_strength,
             p.season AS prev_season, c.lag_months > 3 AS stale,
             CASE WHEN p.status IS NULL THEN 'BASELINE' WHEN p.status <> c.status THEN 'PHASE_CHANGE'
                  WHEN p.strength <> c.strength THEN 'STRENGTH_CHANGE' ELSE 'NONE' END AS transition,
             (SELECT count(*) FROM oni) AS seasons_loaded,
             (SELECT count(*) FROM runs WHERE phase = 'WARM' AND seasons >= CAST(:min_seasons AS INTEGER)) AS el_nino_episodes,
             (SELECT count(*) FROM runs WHERE phase = 'COLD' AND seasons >= CAST(:min_seasons AS INTEGER)) AS la_nina_episodes,
             (SELECT count(*) FROM revisions) AS revised_seasons,
             (SELECT count(*) FROM revisions WHERE crosses_threshold) AS threshold_revisions,
             (SELECT coalesce(string_agg(season || ' ' || old_anom || ' to ' || new_anom || CASE WHEN crosses_threshold THEN ' (crosses threshold)' ELSE '' END, ', '), 'none') FROM revisions) AS revision_detail,
             (SELECT string_agg(season || ' ' || anom, ', ' ORDER BY n) FROM oni WHERE n > (SELECT max(n) FROM oni) - 6) AS last_six,
             c.status || '|' || c.strength || '|' || c.season || '|'
               || (SELECT string_agg(seas || yr || '=' || anom, ';' ORDER BY n) FROM oni WHERE n > (SELECT max(n) FROM oni) - CAST(:revision_seasons AS INTEGER)) AS next_state
      FROM cur c CROSS JOIN prev p;

      SELECT *, 'ENSO update from the NOAA CPC ONI, ' || season || ' anomaly ' || anom || ' C' || chr(10)
               || 'Status ' || status || ' (' || strength || '), ' || run_len || ' seasons since ' || start_season
               || ', was ' || coalesce(nullif(prev_status, ''), 'n/a') || ' (' || coalesce(prev_strength, 'n/a') || ')' || chr(10)
               || 'Change ' || transition || ', peak held 3 seasons ' || peak_held3 || ', single-season peak ' || peak_1dp || chr(10)
               || 'Last six seasons ' || last_six || chr(10) || 'CPC revisions ' || revision_detail
               || CASE WHEN stale THEN chr(10) || 'WARNING the ONI file is ' || lag_months || ' months behind' ELSE '' END AS slack_text
      FROM result;

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    key: cpc_enso_oni_state
    value: "{{ outputs.classify.outputs[0].row.next_state }}"

  - id: alert_if_changed
    type: io.kestra.plugin.core.flow.If
    description: Alerts on a phase change (conditions starting, an episode confirmed or ending), a strength change, a revision that moves a season across the threshold (or any revision when enabled), or a file that CPC has not updated for over three months.
    condition: "{{ (not outputs.classify.outputs[0].row.is_baseline and (outputs.classify.outputs[0].row.transition != 'NONE' or outputs.classify.outputs[0].row.threshold_revisions > 0 or (inputs.alert_on_any_revision and outputs.classify.outputs[0].row.revised_seasons > 0))) or outputs.classify.outputs[0].row.stale }}"
    then:
      - id: warn
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "ENSO alert ({{ outputs.classify.outputs[0].row.transition }}): {{ outputs.classify.outputs[0].row.prev_status }} {{ outputs.classify.outputs[0].row.prev_strength }} -> {{ outputs.classify.outputs[0].row.status }} {{ outputs.classify.outputs[0].row.strength }} at {{ outputs.classify.outputs[0].row.season }} (ONI {{ outputs.classify.outputs[0].row.anom }}). Revisions: {{ outputs.classify.outputs[0].row.revision_detail }}. Stale: {{ outputs.classify.outputs[0].row.stale }}."
      - id: notify
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: allowFailure keeps the run green when the webhook secret is not configured.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": {{ (':ocean: ' ~ outputs.classify.outputs[0].row.slack_text) | toJson }}
          }

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      ONI {{ outputs.classify.outputs[0].row.seasons_loaded }} seasons, latest {{ outputs.classify.outputs[0].row.season }} = {{ outputs.classify.outputs[0].row.anom }} C ({{ outputs.classify.outputs[0].row.lag_months }} months behind){{ outputs.classify.outputs[0].row.is_baseline ? ', BASELINE run (no alerts)' : '' }}.
      Status {{ outputs.classify.outputs[0].row.status }} {{ outputs.classify.outputs[0].row.strength }}: {{ outputs.classify.outputs[0].row.run_len }} seasons since {{ outputs.classify.outputs[0].row.start_season }}, peak held 3 seasons {{ outputs.classify.outputs[0].row.peak_held3 }}, single-season peak {{ outputs.classify.outputs[0].row.peak_1dp }}. Transition {{ outputs.classify.outputs[0].row.transition }}.
      History: {{ outputs.classify.outputs[0].row.el_nino_episodes }} El Nino and {{ outputs.classify.outputs[0].row.la_nina_episodes }} La Nina episodes since 1950.
      Revised seasons: {{ outputs.classify.outputs[0].row.revised_seasons }} ({{ outputs.classify.outputs[0].row.threshold_revisions }} across the threshold): {{ outputs.classify.outputs[0].row.revision_detail }}.
      Last six: {{ outputs.classify.outputs[0].row.last_six }}

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.classify.outputs[0].row }}"
  - id: seasons_parquet
    type: FILE
    value: "{{ outputs.classify.outputFiles.seasons_parquet }}"
  - id: episodes_csv
    type: FILE
    value: "{{ outputs.classify.outputFiles.episodes_csv }}"

extend:
  title: NOAA CPC ENSO (ONI) Phase and Strength Change Alert
  metaTitle: NOAA ENSO El Nino and La Nina Phase Change Alert from the ONI | Kestra
  shortDescription: Download the NOAA CPC Oceanic Nino Index every month, classify El Nino and La Nina episodes with the official five-season rule, and alert when the ENSO phase or strength changes or CPC revises a recent season across the threshold.
  metaDescription: Classify El Nino and La Nina from the NOAA CPC ONI with the five-season rule, track strength and revisions in KV, and alert on phase changes in Kestra.
  description: |
    ENSO drives seasonal weather risk for crops, power and gas demand, so commodity and energy research teams track the official NOAA phase. The raw index needs care: the Oceanic Nino Index (ONI) is a 3-month running mean, an episode needs five overlapping seasons beyond +/-0.5 C, CPC compares one-decimal values (0.46 counts as 0.5), and CPC revises the latest seasons every month. On the October 2026 file, MAM 2026 is 0.46, so the warm run is five seasons long and counts as an El Nino episode; read with two decimals it would still be only conditions. This flow applies the rule in SQL and alerts once per change. All data comes from the live CPC file; no inputs are sample data.

    ## How it works

    1. A monthly `Schedule` runs on the 15th, after the CPC ENSO discussion (second Thursday) that updates the ONI.
    2. `download_oni` fetches `oni.ascii.txt` (one row per overlapping season since DJF 1950) with retries.
    3. `previous_state` reads the last status, strength, latest season and a snapshot of recent anomalies from KV. Without it the run is a `BASELINE` that reports the current state and alerts on nothing.
    4. `classify` (DuckDB) parses the file, rounds each anomaly to one decimal, groups consecutive seasons with the same phase into runs and marks runs of `min_seasons` or more as episodes; shorter runs are `EL_NINO_CONDITIONS` or `LA_NINA_CONDITIONS`. Strength is the highest value held for three consecutive seasons (weak 0.5, moderate 1.0, strong 1.5, very strong 2.0), so one hot season cannot upgrade an episode. The recent anomalies are diffed with the KV snapshot to list CPC revisions and those that move a season across the threshold.
    5. `save_state` writes the new state to KV.
    6. `alert_if_changed` (If) logs a WARN and posts to Slack on a phase change, a strength change, a revision across the threshold (or any revision when `alert_on_any_revision` is true), or a file more than three months behind.

    ## What you get

    - Current status, run length and start season, held and single-season peaks, last six seasons.
    - `episodes_csv`: every El Nino and La Nina episode since 1950 with start, end, length, peak and strength.
    - `seasons_parquet`: the full classified ONI series for a research warehouse.

    ## Who it's for

    - Agricultural commodity and energy trading research teams.
    - Crop insurers, utilities and planners who use the ENSO phase in seasonal outlooks.

    ## Why orchestrate this with Kestra

    - One download and one reviewable SQL task, with retries and range-checked inputs.
    - KV state makes re-runs idempotent and lets the flow notice when CPC rewrites recent history.

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB plugin and the Slack plugin.
    - Outbound HTTPS to `www.cpc.ncep.noaa.gov` (no API key).

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook (optional; without it the WARN log still records the alert).

    ## Quick start

    1. Execute with the defaults: a `BASELINE` run that reports the current ENSO status and writes the episode history.
    2. Execute again: nothing new and no alert.
    3. Add the Slack secret and enable the schedule.

    ## How to extend

    - Add the weekly Nino 3.4 SST index to watch for onset between monthly ONI updates.
    - Map each phase to your desk's crop or demand playbook and post it with the alert.
    - Use `episodes_csv` to pick analogue years for seasonal backtests.

    ## Links

    - [CPC ONI table and definition](https://www.cpc.ncep.noaa.gov/products/analysis_monitoring/ensostuff/ONI_v5.php)
    - [ONI text file](https://www.cpc.ncep.noaa.gov/data/indices/oni.ascii.txt)
    - [CPC ENSO diagnostic discussion](https://www.cpc.ncep.noaa.gov/products/analysis_monitoring/enso_advisory/ensodisc.shtml)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [If](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
