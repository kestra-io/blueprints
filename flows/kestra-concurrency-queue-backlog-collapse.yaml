id: kestra-concurrency-queue-backlog-collapse
namespace: company.platform

concurrency:
  limit: 1
  behavior: CANCEL

inputs:
  - id: namespace
    type: STRING
    defaults: company.team
    description: Namespace whose queued executions are checked.
  - id: dry_run
    type: BOOL
    defaults: true
    description: Only report the backlog and the plan. Set to false to kill the duplicate queued runs.
  - id: approval_above
    type: INT
    defaults: 20
    min: 0
    description: Wait for an approval when one run would kill more queued executions than this.
  - id: max_kills
    type: INT
    defaults: 100
    min: 1
    max: 1000
    description: Upper bound on kills per run, oldest duplicates first. The next run continues with the rest.
  - id: page_size
    type: INT
    defaults: 500
    min: 1
    max: 1000
    description: Number of queued executions read per run.
  - id: kestra_url
    type: URI
    defaults: http://localhost:8080
    description: Base URL of the Kestra API.

variables:
  tenant: main
  policy_key: queue-policy
  policy_value: deduplicate
  # Input: {flows, queued, running, key, value, max}. Groups the queued runs of opted-in flows by
  # inputs and trigger payload (a Schedule's own dates and webhook headers are ignored). Each group keeps
  # its oldest run, which is next in line; the rest are duplicates. The selected duplicates are the oldest
  # ones (bounded by max), listed newest first so the kills move away from the head of the queue.
  plan_program: |
    .key as $k | .value as $v | .max as $max
    | ([.flows[] | select([.labels[]? | select(.key == $k and .value == $v)] | length > 0) | .id]) as $optin
    | (.running | map({flow: .flowId, id, since: .state.startDate})) as $running
    | [.queued[] | {id, flow: .flowId, at: .state.startDate,
         work: ({inputs: ((.inputs // {}) | to_entries | sort_by(.key)),
                 trigger: (if (.trigger.type // "") | startswith("io.kestra.plugin.core.trigger.Schedule") then null else ((.trigger.variables // null) | if type == "object" then del(.headers) else . end) end)} | tojson)}]
    | group_by(.flow)
    | map(.[0].flow as $f
        | (($optin | map(select(. == $f)) | length) > 0) as $in
        | (group_by(.work) | map(sort_by(.at))) as $groups
        | {flow: $f, opted_in: $in, queued: length, distinct_work: ($groups | length),
           running: [$running[] | select(.flow == $f) | .id + " since " + .since],
           duplicates: (if $in then [$groups[] | .[0].id as $keep | .[1:][] | {id, kept: $keep, at}] else [] end)})
    | {flows: ., kills: ([.[].duplicates[]] | sort_by(.at) | .[:$max] | reverse)}

tasks:
  - id: flows
    type: io.kestra.plugin.kestra.flows.List
    description: Flows of the namespace, to find the ones labelled with the policy.
    kestraUrl: "{{ inputs.kestra_url }}"
    tenantId: "{{ vars.tenant }}"
    namespace: "{{ inputs.namespace }}"
    auth:
      username: "{{ secret('KESTRA_USERNAME') }}"
      password: "{{ secret('KESTRA_PASSWORD') }}"
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3

  - id: queued
    type: io.kestra.plugin.core.http.Request
    description: Queued executions of the namespace, oldest first, with their inputs and trigger.
    uri: "{{ inputs.kestra_url }}/api/v1/{{ vars.tenant }}/executions/search?page=1&size={{ inputs.page_size }}&sort=state.startDate:asc&filters%5Bstate%5D%5BEQUALS%5D=QUEUED&filters%5Bnamespace%5D%5BEQUALS%5D={{ inputs.namespace }}"
    options:
      auth:
        type: BASIC
        username: "{{ secret('KESTRA_USERNAME') }}"
        password: "{{ secret('KESTRA_PASSWORD') }}"
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3

  - id: running
    type: io.kestra.plugin.core.http.Request
    description: Running executions, reported as the runs that hold the concurrency slots.
    uri: "{{ inputs.kestra_url }}/api/v1/{{ vars.tenant }}/executions/search?page=1&size=1000&sort=state.startDate:asc&filters%5Bstate%5D%5BEQUALS%5D=RUNNING&filters%5Bnamespace%5D%5BEQUALS%5D={{ inputs.namespace }}"
    options:
      auth:
        type: BASIC
        username: "{{ secret('KESTRA_USERNAME') }}"
        password: "{{ secret('KESTRA_PASSWORD') }}"
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3

  - id: plan
    type: io.kestra.plugin.core.output.OutputValues
    values:
      result: "{{ {'flows': outputs.flows.flows, 'queued': fromJson(outputs.queued.body).results, 'running': fromJson(outputs.running.body).results, 'key': vars.policy_key, 'value': vars.policy_value, 'max': inputs.max_kills} | jq(vars.plan_program) | first | toJson }}"

  - id: report
    type: io.kestra.plugin.core.log.Log
    message: |-
      {{ fromJson(outputs.queued.body).total }} queued executions in {{ inputs.namespace }} ({{ fromJson(outputs.queued.body).results | length }} read), {{ fromJson(outputs.plan.values.result).kills | length }} duplicate runs to kill{{ inputs.dry_run ? ' (dry run)' : '' }}.
      {%- for f in fromJson(outputs.plan.values.result).flows %}
      {{ f.flow }}: {{ f.queued }} queued, {{ f.distinct_work }} distinct input sets, {{ f.opted_in ? (f.duplicates | length) ~ ' duplicates' : 'not opted in, left alone' }}, slot held by {{ f.running is empty ? 'nothing running' : f.running | join(', ') }}
      {%- endfor %}

  - id: collapse
    type: io.kestra.plugin.core.flow.If
    condition: "{{ not inputs.dry_run and (fromJson(outputs.plan.values.result).kills | length) > 0 }}"
    then:
      - id: approve
        type: io.kestra.plugin.core.flow.Pause
        description: Large collapses wait for a person. Without approval within 1 hour the run is cancelled and nothing changes.
        runIf: "{{ (fromJson(outputs.plan.values.result).kills | length) > inputs.approval_above }}"
        pauseDuration: PT1H
        behavior: CANCEL

      - id: kill_duplicates
        type: io.kestra.plugin.core.flow.Loop
        description: One duplicate at a time, newest first, so the kills stay away from the run that is next in line.
        values: "{{ fromJson(outputs.plan.values.result).kills | jq('[.[] | tojson]') | first }}"
        concurrencyLimit: 1
        tasks:
          - id: recheck
            type: io.kestra.plugin.core.http.Request
            uri: "{{ inputs.kestra_url }}/api/v1/{{ vars.tenant }}/executions/{{ fromJson(item.value).id }}"
            options:
              auth:
                type: BASIC
                username: "{{ secret('KESTRA_USERNAME') }}"
                password: "{{ secret('KESTRA_PASSWORD') }}"

          - id: still_queued
            type: io.kestra.plugin.core.flow.If
            condition: "{{ fromJson(outputs.recheck.body).state.current == 'QUEUED' }}"
            then:
              - id: kill
                type: io.kestra.plugin.kestra.executions.Kill
                description: Kill, not unqueue to CANCELLED. Kestra frees no concurrency slot for a run killed while queued, whereas a queued run moved to CANCELLED releases a slot it never held and lets another run start next to the running one.
                kestraUrl: "{{ inputs.kestra_url }}"
                tenantId: "{{ vars.tenant }}"
                executionId: "{{ fromJson(item.value).id }}"
                auth:
                  username: "{{ secret('KESTRA_USERNAME') }}"
                  password: "{{ secret('KESTRA_PASSWORD') }}"

              - id: wait_killed
                type: io.kestra.plugin.core.flow.LoopUntil
                condition: "{{ fromJson(outputs.killed_state.body).state.current == 'KILLED' }}"
                failOnMaxReached: true
                checkFrequency:
                  interval: PT1S
                  maxIterations: 30
                tasks:
                  - id: killed_state
                    type: io.kestra.plugin.core.http.Request
                    uri: "{{ inputs.kestra_url }}/api/v1/{{ vars.tenant }}/executions/{{ fromJson(item.value).id }}"
                    options:
                      auth:
                        type: BASIC
                        username: "{{ secret('KESTRA_USERNAME') }}"
                        password: "{{ secret('KESTRA_PASSWORD') }}"

              - id: mark
                type: io.kestra.plugin.core.http.Request
                description: Records which run it duplicated. The API replaces all non-system labels, so the existing ones are sent back too.
                uri: "{{ inputs.kestra_url }}/api/v1/{{ vars.tenant }}/executions/{{ fromJson(item.value).id }}/actions/labels"
                method: POST
                contentType: application/json
                body: "{{ {'labels': fromJson(outputs.killed_state.body).labels ?? [], 'kept': fromJson(item.value).kept} | jq('[.labels[] | select(.key | startswith(\"system.\") | not)] + [{key: \"queue-duplicate-of\", value: .kept}]') | first | toJson }}"
                options:
                  auth:
                    type: BASIC
                    username: "{{ secret('KESTRA_USERNAME') }}"
                    password: "{{ secret('KESTRA_PASSWORD') }}"
                retry:
                  type: constant
                  interval: PT5S
                  maxAttempts: 3

              - id: started_before_kill
                type: io.kestra.plugin.core.execution.Fail
                description: The run left the queue between the re-check and the kill. Fails loudly instead of reporting a clean collapse.
                condition: "{{ fromJson(outputs.killed_state.body).state.histories | jq('[.[] | select(.state == \"RUNNING\")] | length') | first > 0 }}"
                errorMessage: "{{ fromJson(item.value).id }} had started RUNNING before the kill landed; check its side effects."
            else:
              - id: left_alone
                type: io.kestra.plugin.core.log.Log
                level: WARN
                message: "{{ fromJson(item.value).id }} is {{ fromJson(outputs.recheck.body).state.current }}, not killed."

      - id: queued_after
        type: io.kestra.plugin.core.http.Request
        uri: "{{ inputs.kestra_url }}/api/v1/{{ vars.tenant }}/executions/search?page=1&size=1000&filters%5Bstate%5D%5BEQUALS%5D=QUEUED&filters%5Bnamespace%5D%5BEQUALS%5D={{ inputs.namespace }}"
        options:
          auth:
            type: BASIC
            username: "{{ secret('KESTRA_USERNAME') }}"
            password: "{{ secret('KESTRA_PASSWORD') }}"

      - id: verify
        type: io.kestra.plugin.core.execution.Assert
        description: No run the plan marked as a duplicate may still be queued.
        conditions:
          - "{{ {'after': fromJson(outputs.queued_after.body).results, 'kills': fromJson(outputs.plan.values.result).kills} | jq('[.after[].id] as $q | [.kills[] | select(.id as $i | $q | index($i))] | length') | first == 0 }}"
        errorMessage: "Duplicate runs are still queued: {{ {'after': fromJson(outputs.queued_after.body).results, 'kills': fromJson(outputs.plan.values.result).kills} | jq('[.after[].id] as $q | [.kills[] | select(.id as $i | $q | index($i)) | .id]') | first }}"

      - id: summary
        type: io.kestra.plugin.core.log.Log
        message: "Processed {{ fromJson(outputs.plan.values.result).kills | length }} duplicate queued runs; {{ fromJson(outputs.queued_after.body).total }} executions remain queued in {{ inputs.namespace }}."

outputs:
  - id: plan
    type: JSON
    value: "{{ outputs.plan.values.result ?? '{}' }}"

triggers:
  - id: every_15_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    inputs:
      dry_run: false

extend:
  title: Collapse Duplicate Queued Runs Behind a Kestra Concurrency Limit
  metaTitle: Collapse a Duplicate Kestra Concurrency Queue Backlog | Kestra
  shortDescription: When a run of a flow with a QUEUE concurrency limit hangs, its schedule piles up identical queued runs that later execute back to back. Keep one run per input set, kill the duplicates, and label what they duplicated.
  metaDescription: Kill duplicate QUEUED Kestra executions piled up behind a concurrency limit, keep one run per input set, and label each killed run with the one it duplicated.
  description: |
    A flow with `concurrency.behavior: QUEUE` queues every new run while its slot is busy. If one run hangs for two hours, a 5-minute schedule queues 24 identical runs. When the slot frees up, all 24 run one after another: a sync job does the same work 24 times, and a report is sent 24 times. This flow keeps one of them.

    ## How it works
    1. Flows opt in with the label `queue-policy: deduplicate`. Only these flows are touched.
    2. The Kestra plugin lists the flows of `namespace`, and the API returns its queued executions (oldest first) and running ones.
    3. Queued runs of a flow are grouped by inputs and trigger payload. A Schedule's own dates and webhook headers are ignored, so scheduled runs count as the same work, while different webhook bodies or Flow-trigger payloads stay apart. Each group keeps its oldest run, the one Kestra starts next, and the rest are duplicates.
    4. With `dry_run: false`, a `Loop` handles one duplicate at a time, newest first. It re-reads the run, kills it with the Kestra plugin if it is still `QUEUED`, waits for `KILLED` and labels it `queue-duplicate-of: <kept run>`, keeping its other labels. A run that started in the meantime is left alone. If one started between the re-check and the kill, the run fails and names it.
    5. A final query checks that no duplicate is still queued.

    The kill is deliberate. Kestra frees no concurrency slot for a run killed while queued, but a queued run moved to `CANCELLED` through the unqueue API releases a slot it never held, and another run then starts next to the running one.

    ## What you get
    - A report per flow: queued runs, distinct input sets, duplicates, and the running execution that holds the slot.
    - One queued run per flow and input set, the concurrency limit intact, and a repeat run that changes nothing.
    - An audit label on every killed run.

    ## Who it's for
    Platform teams running frequent schedules with concurrency limits, such as syncs, refreshes and exports.

    ## Why orchestrate this with Kestra
    It reads the same execution queue Kestra runs from, and the approval, bounded loop, retries and history are built in.

    ## Prerequisites
    - Kestra 2.x and an API user that can read flows and executions, kill executions and set labels.
    - The [Kestra plugin](https://kestra.io/plugins/plugin-kestra).

    ### Secrets
    - `KESTRA_USERNAME`: user for basic auth against the Kestra API (required).
    - `KESTRA_PASSWORD`: password of that user (required).

    ## Quick start
    1. Add the secrets and set `kestra_url` and `namespace`.
    2. Label flows whose identical queued runs are redundant with `queue-policy: deduplicate`.
    3. Run once with `dry_run: true` and read the report.
    4. Enable the 15-minute schedule. Runs that would kill more than `approval_above` executions wait for approval.

    ## How to extend
    - Add one schedule per namespace, or pair it with a reaper for runs stuck in `RUNNING`.
    - Alert when one flow keeps building a backlog.

    Do not opt in flows where each scheduled run handles its own date, such as partitioned loads.

    ## Links
    - [Flow concurrency](https://kestra.io/docs/workflow-components/concurrency)
    - [Kestra executions.Kill task](https://kestra.io/plugins/plugin-kestra/executions/io.kestra.plugin.kestra.executions.kill)
    - [Labels](https://kestra.io/docs/workflow-components/labels)
    - [Kestra API reference](https://kestra.io/docs/api-reference/open-source)
  tags:
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Incident Response
  ee: false
  demo: false
