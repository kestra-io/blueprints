id: kafka-consumer-rebalance-churn-storm-sentinel
namespace: company.ops

inputs:
  - id: kafka_broker_host
    type: STRING
    defaults: "kafka-0.internal"
    description: Apache Kafka broker hostname or IP address.
  - id: kafka_jmx_exporter_port
    type: INT
    defaults: 9404
    description: Prometheus JMX Exporter port exposing Kafka coordinator metrics.
  - id: rebalance_threshold
    type: INT
    defaults: 50
    description: Maximum acceptable consumer group rebalance count before alerting.

tasks:
  - id: scrape_coordinator_metrics
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests kestra
    script: |
      import sys
      import requests
      from kestra import Kestra

      url = f"http://{{ inputs.kafka_broker_host }}:{{ inputs.kafka_jmx_exporter_port }}/metrics"
      print(f"Scraping Kafka coordinator metrics from {url}...")
      try:
          resp = requests.get(url, timeout=15)
          resp.raise_for_status()
      except Exception as e:
          print(f"ERROR: Failed to scrape Prometheus metrics from {url}: {e}", file=sys.stderr)
          sys.exit(1)

      rebalance_count = None
      for line in resp.text.splitlines():
          line = line.strip()
          if not line or line.startswith('#'):
              continue
          if line.startswith('kafka_server_groupcoordinator_rebalancetime_count'):
              parts = line.split()
              if len(parts) >= 2:
                  try:
                      rebalance_count = float(parts[1])
                      break
                  except ValueError:
                      pass

      if rebalance_count is None:
          print(f"ERROR: kafka_server_groupcoordinator_rebalancetime_count metric not found in {url}", file=sys.stderr)
          sys.exit(1)

      print(f"Scraped rebalance count: {rebalance_count}")
      Kestra.outputs({"rebalance_count": rebalance_count})

  - id: evaluate_rebalance_churn
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.scrape_coordinator_metrics.vars.rebalance_count | int > inputs.rebalance_threshold }}"
    then:
      - id: notify_streaming_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#kafka-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Kafka Consumer Group Rebalance Storm Alert",
                "text": "Kafka broker `{{ inputs.kafka_broker_host }}` recorded excessive GroupCoordinator rebalance activity (*{{ outputs.scrape_coordinator_metrics.vars.rebalance_count }}* rebalances, threshold {{ inputs.rebalance_threshold }})! Impact: Consumer group rebalance storms halt consumer event consumption (Stop-The-World rebalance pauses), causing massive consumer lag and streaming pipeline stalls.",
                "footer": "Kestra Streaming Sentinel • Apache Kafka"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#kafka-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Apache Kafka Consumer Group Rebalance Churn Storm Sentinel Pipeline Failure",
            "text": "Failed to scrape Kafka GroupCoordinator metrics. Verify broker host and port.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

outputs:
  - id: rebalance_count
    type: FLOAT
    description: The scraped rebalance event count from Kafka GroupCoordinator.
    value: "{{ outputs.scrape_coordinator_metrics.vars.rebalance_count }}"

extend:
  metaDescription: "Monitors Kafka consumer group rebalance frequency and coordinator churn to detect rebalance loops."
  metaTitle: Apache Kafka Consumer Group Rebalance Churn Storm Sentinel with Kestra
  title: Apache Kafka Consumer Group Rebalance Churn Storm Sentinel
  shortDescription: Monitors Kafka consumer group rebalance frequency and coordinator churn to detect rebalance loops.
  description: |
    ## How it works
    This workflow scrapes the Kafka broker's Prometheus JMX endpoint for GroupCoordinator rebalance metrics (`kafka_server_groupcoordinator_rebalancetime_count`). When misbehaving consumers crash, experience long JVM garbage collection pauses exceeding `max.poll.interval.ms`, or dynamic scaling causes frequent joining/leaving, the group coordinator enters a rebalance storm. Stop-The-World partition reassignments halt message consumption entirely. Slack is alerted when rebalances spike.

    ## What you get
    - Real-time detection of debilitating Kafka consumer group rebalance storms.
    - Prevents streaming lag pileups and pipeline throughput drops.
    - Early warning to tune `max.poll.interval.ms` and adopt cooperative sticky assignors.

    ## Who it's for
    - Streaming Platform Engineers and Kafka Administrators.
    - Microservice developers consuming high-throughput Kafka topics.

    ## Why orchestrate this with Kestra
    - **Native JMX/Prometheus Scrape**: Extract group coordinator telemetry without external agent daemons.
    - **Continuous Health Auditing**: Periodic 15-minute verification of coordinator stability.
    - **Instant Alert Routing**: Dispatches formatted Slack diagnostics to on-call streaming teams.

    ## Prerequisites
    - Apache Kafka broker with Prometheus JMX exporter configured.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Configure broker host and JMX exporter port.
    3. Run the workflow to inspect consumer group rebalance frequency.

    ## How to extend
    - Query consumer group describe states via `kafka-consumer-groups.sh` for specific unstable groups.
    - Recommend migrating to `CooperativeStickyAssignor` automatically.

    ## Links
    - [Kafka Group Coordinator Documentation](https://kafka.apache.org/documentation/#monitoring)
    - [Kestra Python Plugin](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Realtime & Streaming
    - ELT & Data Landing
  ee: false
  demo: false
