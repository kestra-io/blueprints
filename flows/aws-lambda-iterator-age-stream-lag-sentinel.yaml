id: aws-lambda-iterator-age-stream-lag-sentinel
namespace: company.serverless
description: Audits AWS Lambda IteratorAge stream processing metrics via CloudWatch,
  detects stream consumer lag across Kinesis and DynamoDB streams, logs a GitHub issue,
  and alerts Slack.
inputs:
- id: aws_region
  type: STRING
  displayName: AWS Region
  defaults: us-east-1
- id: function_name
  type: STRING
  displayName: Lambda Function Name
  defaults: event-stream-processor
- id: iterator_age_ms_threshold
  type: INT
  displayName: Max IteratorAge (Milliseconds)
  defaults: 60000
- id: target_repository
  type: STRING
  displayName: Serverless Issue Repository
  defaults: my-org/serverless-operations
triggers:
- id: periodic_iterator_age_check
  type: io.kestra.plugin.core.trigger.Schedule
  cron: '*/15 * * * *'
  disabled: true
tasks:
- id: probe_iterator_age_metric
  type: io.kestra.plugin.aws.cli.AwsCLI
  description: Queries CloudWatch for Lambda IteratorAge metric over the last 15 minutes
  accessKeyId: '{{ secret(''AWS_ACCESS_KEY_ID'') }}'
  secretKeyId: '{{ secret(''AWS_SECRET_ACCESS_KEY'') }}'
  region: '{{ inputs.aws_region }}'
  commands:
  - aws cloudwatch get-metric-data --metric-data-queries '[{"Id":"m1","MetricStat":{"Metric":{"Namespace":"AWS/Lambda","MetricName":"IteratorAge","Dimensions":[{"Name":"FunctionName","Value":"{{
    inputs.function_name }}"}]},"Period":900,"Stat":"Maximum"},"ReturnData":true}]'
    --start-time $(date -u -v-15M +%Y-%m-%dT%H:%M:%SZ) --end-time $(date -u +%Y-%m-%dT%H:%M:%SZ)
    --output json | tr -d '\n' | xargs -0 -I {} echo '::{"outputs":{}}::'
- id: evaluate_stream_lag
  type: io.kestra.plugin.core.debug.Return
  description: Evaluates maximum iterator age against lag threshold
  format:
    function: '{{ inputs.function_name }}'
    max_iterator_age_ms: '{{ outputs.probe_iterator_age_metric.vars.MetricDataResults[0].Values[0]
      ?? 0 }}'
    threshold_ms: '{{ inputs.iterator_age_ms_threshold }}'
    is_lag_critical: '{{ (outputs.probe_iterator_age_metric.vars.MetricDataResults[0].Values[0]
      ?? 0) >= inputs.iterator_age_ms_threshold }}'
- id: branch_on_stream_lag
  type: io.kestra.plugin.core.flow.If
  description: Branches based on whether iterator age exceeded threshold
  condition: '{{ outputs.evaluate_stream_lag.value.is_lag_critical == true }}'
  then:
  - id: create_lambda_incident_issue
    type: io.kestra.plugin.github.issues.Create
    description: Logs a prioritized GitHub issue documenting stream processing lag
    oauthToken: '{{ secret(''GITHUB_TOKEN'') }}'
    repository: '{{ inputs.target_repository }}'
    title: '[Lambda Alert] High IteratorAge Stream Lag on {{ inputs.function_name
      }}'
    body: "## \U0001F6A8 AWS Lambda Stream Processing Latency (IteratorAge)\n\nThe\
      \ serverless sentinel detected elevated IteratorAge on streaming event source:\n\
      - **Function Name:** `{{ inputs.function_name }}`\n- **Peak IteratorAge:** **{{\
      \ outputs.evaluate_stream_lag.value.max_iterator_age_ms }} ms**\n- **Threshold:**\
      \ `{{ inputs.iterator_age_ms_threshold }} ms`\n\nPlease verify Lambda batch\
      \ size, concurrency throttling, and execution duration.\n*Generated automatically\
      \ by Kestra Lambda Sentinel.*"
  - id: alert_serverless_slack
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatches high-priority alert to serverless Slack channel
    url: '{{ secret(''SLACK_WEBHOOK'') }}'
    payload: "{{ {'text': '\U0001F6A8 *AWS Lambda Stream Lag Alert*\\n*Function:*\
      \ `' ~ inputs.function_name ~ '`\\n*IteratorAge:* *' ~ outputs.evaluate_stream_lag.value.max_iterator_age_ms\
      \ ~ 'ms* (Threshold: `' ~ inputs.iterator_age_ms_threshold ~ 'ms`)\\n*Incident\
      \ Ticket:* <' ~ (outputs.create_lambda_incident_issue.issueUrl ?? '#') ~ '|View\
      \ GitHub Issue>'} | toJson }}"
  else:
  - id: log_stream_healthy
    type: io.kestra.plugin.core.log.Log
    message: Lambda function {{ inputs.function_name }} stream processing is up to
      date ({{ outputs.evaluate_stream_lag.value.max_iterator_age_ms }}ms <= {{ inputs.iterator_age_ms_threshold
      }}ms).
- id: log_audit_complete
  type: io.kestra.plugin.core.log.Log
  description: Final audit status log
  message: 'Lambda stream lag audit complete for {{ inputs.function_name }}. Age:
    {{ outputs.evaluate_stream_lag.value.max_iterator_age_ms }}ms.'
errors:
- id: alert_flow_failure
  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
  description: Alerts Slack on execution failure
  url: '{{ secret(''SLACK_WEBHOOK'') }}'
  payload: "{{ {'text': '\u26A0\uFE0F *AWS Lambda Sentinel Failed* in execution `'\
    \ ~ execution.id ~ '`.'} | toJson }}"
extend:
  title: AWS Lambda IteratorAge Stream Processing Lag Sentinel
  shortDescription: Audit AWS Lambda IteratorAge metrics via CloudWatch, detect stream
    processing backlogs, open GitHub issues, and alert Slack.
  metaTitle: AWS Lambda IteratorAge Stream Lag Sentinel with Kestra
  metaDescription: Monitor AWS Lambda stream processing latency and IteratorAge with
    Kestra. Query CloudWatch, file GitHub issues, and alert Slack.
  description: 'Serverless architectures frequently stream events from Amazon Kinesis
    Data Streams or DynamoDB Streams into AWS Lambda functions. When incoming event
    volume exceeds function concurrency, batch processing times out, or unhandled
    exceptions trigger retries, the Lambda `IteratorAge` surges, indicating stream
    processing lag. This blueprint monitors CloudWatch IteratorAge metrics, identifies
    stream processing delays, files a GitHub incident ticket, and alerts engineering
    teams via Slack.


    ## How it works


    1. `periodic_iterator_age_check` runs every 15 minutes.

    2. `probe_iterator_age_metric` queries CloudWatch for Maximum IteratorAge.

    3. `evaluate_stream_lag` evaluates if lag exceeds threshold.

    4. `branch_on_stream_lag` logs a GitHub issue and alerts Slack if breached.

    5. `log_audit_complete` logs final outcome.

    6. `errors` block alerts Slack on execution failure.


    ## What you get


    - Automated monitoring of serverless stream lag.

    - Early warning before stream retention expires and records are dropped.

    - Consolidated GitHub incident tickets with function metrics.

    - Real-time Slack notifications.


    ## Who it''s for


    - Serverless Platform Engineers maintaining event-driven Lambda architectures.

    - Data Engineers processing streaming pipelines via Kinesis and DynamoDB.

    - SREs safeguarding real-time stream SLAs.


    ## Why orchestrate this with Kestra


    Kestra provides declarative automation connecting CloudWatch metrics, conditional
    evaluation, and chat notifications in a single auditable flow.


    ## Prerequisites


    - An AWS account with an active Lambda function.

    - IAM credentials with CloudWatch read permissions.

    - A GitHub Personal Access Token.

    - A Slack incoming webhook URL.


    ### Secrets


    - `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`: AWS credentials.

    - `GITHUB_TOKEN`: GitHub token.

    - `SLACK_WEBHOOK`: Slack webhook URL.


    ## Inputs


    - `aws_region`: Target region.

    - `function_name`: Lambda function name.

    - `iterator_age_ms_threshold`: Max age before alerting.

    - `target_repository`: GitHub repository.


    ## Outputs


    - `outputs.evaluate_stream_lag.value.max_iterator_age_ms`: Maximum IteratorAge.

    - `outputs.evaluate_stream_lag.value.is_lag_critical`: Boolean breach flag.


    ## Quick start


    1. Configure secrets.

    2. Set inputs to match target Lambda function.

    3. Run manually to verify metric retrieval.

    4. Enable schedule trigger.


    ## How to extend


    - Add automated shard splitting or concurrent batch scaling tasks.

    - Route urgent alerts to PagerDuty.


    ## Links


    - [AWS Lambda CloudWatch Metrics](https://docs.aws.amazon.com/lambda/latest/dg/monitoring-metrics.html)

    - [Kestra AWS Plugin](https://kestra.io/plugins/plugin-aws)'
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
