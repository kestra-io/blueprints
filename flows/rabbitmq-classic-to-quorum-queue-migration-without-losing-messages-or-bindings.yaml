id: rabbitmq-classic-to-quorum-queue-migration-without-losing-messages-or-bindings
namespace: company.team

description: |
  Move one RabbitMQ classic queue to a quorum queue while publishers keep sending. The flow checks the queue can be
  a quorum queue, creates the new queue with translated arguments, copies the bindings, unbinds the old queue, shovels
  the backlog across, and deletes the old queue only after it has been empty on two consecutive runs and no consumer
  is attached. Every destructive step waits for an operator.

concurrency:
  limit: 1
  behavior: CANCEL

variables:
  vhost_enc: "{{ inputs.vhost == '/' ? '%2F' : inputs.vhost }}"
  api: "{{ inputs.management_url }}/api"
  state_key: "rabbitmq_quorum_migration_{{ (inputs.vhost ~ '_' ~ inputs.queue) | slugify }}"
  shovel_name: "migrate-{{ inputs.queue }}-to-quorum"

inputs:
  - id: management_url
    type: STRING
    displayName: Management API URL
    description: Base URL of the RabbitMQ management plugin, reachable from the Kestra worker. The rabbitmq_shovel and rabbitmq_shovel_management plugins must be enabled.
    defaults: "http://localhost:15672"

  - id: amqp_host
    type: STRING
    defaults: "localhost"

  - id: amqp_port
    type: STRING
    defaults: "5672"

  - id: vhost
    type: STRING
    displayName: Virtual host
    defaults: "/"
    validator: '^(/|[A-Za-z0-9_.-]+)$'

  - id: queue
    type: STRING
    displayName: Classic queue to migrate
    defaults: "orders"
    validator: '^[A-Za-z0-9_.:-]+$'

  - id: new_queue_suffix
    type: STRING
    displayName: Suffix of the new queue
    description: The quorum queue is named after the old one plus this suffix, so consumers can be switched one deployment at a time.
    defaults: ".quorum"
    validator: '^[A-Za-z0-9_.:-]+$'

  - id: quorum_group_size
    type: INT
    displayName: Initial replica count
    description: Value for x-quorum-initial-group-size. 0 leaves the broker default.
    defaults: 0

  - id: delivery_limit
    type: INT
    displayName: Delivery limit
    description: Value for x-delivery-limit. 0 leaves the broker default, which in RabbitMQ 4.x is 20 redeliveries before a message is dropped or dead-lettered.
    defaults: 0

  - id: apply_after_approval
    type: BOOL
    displayName: Apply after approval
    description: When false the flow only plans and reports. When true it pauses for an operator before it changes the broker.
    defaults: true

triggers:
  - id: every_five_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    description: Each run advances the migration by one phase, then checks the drain until the old queue can be retired.
    cron: "*/5 * * * *"
    disabled: true

tasks:
  - id: inspect_queue
    type: io.kestra.plugin.core.http.Request
    description: Read the queue from the management API. A 404 is expected once the old queue has been deleted.
    uri: "{{ vars.api }}/queues/{{ vars.vhost_enc }}/{{ inputs.queue }}"
    method: GET
    headers:
      Authorization: "Basic {{ (secret('RABBITMQ_USERNAME') ~ ':' ~ secret('RABBITMQ_PASSWORD')) | base64encode }}"
    options:
      allowFailed: true

  - id: inspect_bindings
    type: io.kestra.plugin.core.http.Request
    description: Read the bindings of the queue, including the properties key needed to remove each of them.
    uri: "{{ vars.api }}/queues/{{ vars.vhost_enc }}/{{ inputs.queue }}/bindings"
    method: GET
    headers:
      Authorization: "Basic {{ (secret('RABBITMQ_USERNAME') ~ ':' ~ secret('RABBITMQ_PASSWORD')) | base64encode }}"
    options:
      allowFailed: true

  - id: inspect_shovels
    type: io.kestra.plugin.core.http.Request
    description: Read the shovels of the virtual host, to see whether the migration shovel is still running.
    uri: "{{ vars.api }}/shovels/{{ vars.vhost_enc }}"
    method: GET
    headers:
      Authorization: "Basic {{ (secret('RABBITMQ_USERNAME') ~ ':' ~ secret('RABBITMQ_PASSWORD')) | base64encode }}"
    options:
      allowFailed: true

  - id: plan_migration
    type: io.kestra.plugin.scripts.node.Script
    description: Decide the next phase from the queue, its bindings, the shovel and the migration state kept in KV. Translates classic arguments to quorum arguments and blocks anything a quorum queue cannot honour.
    containerImage: node:20-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    inputFiles:
      queue.json: "{{ outputs.inspect_queue.body | toJson }}"
      bindings.json: "{{ outputs.inspect_bindings.body | toJson }}"
      shovels.json: "{{ (outputs.inspect_shovels.code == 200 ? outputs.inspect_shovels.body : '[]') | toJson }}"
      state.json: "{{ (kv(vars.state_key, errorOnMissing=false) ?? '{}') | toJson }}"
    env:
      VHOST: "{{ inputs.vhost }}"
      QUEUE: "{{ inputs.queue }}"
      QUEUE_CODE: "{{ outputs.inspect_queue.code }}"
      NEW_SUFFIX: "{{ inputs.new_queue_suffix }}"
      GROUP_SIZE: "{{ inputs.quorum_group_size }}"
      DELIVERY_LIMIT: "{{ inputs.delivery_limit }}"
      MGMT_BASE: "{{ inputs.management_url }}"
      SHOVEL_NAME: "{{ vars.shovel_name }}"
    script: |
      const fs = require('fs');

      // Management API payloads arrive as JSON text, or as an already-decoded object; accept both.
      const load = (p) => {
        let d = JSON.parse(fs.readFileSync(p, 'utf8'));
        while (typeof d === 'string') d = d.trim() ? JSON.parse(d) : {};
        return d;
      };
      const emit = (outputs) => console.log('::' + JSON.stringify({ outputs }) + '::');
      const { VHOST, QUEUE } = process.env;

      const state = load('state.json') || {};
      const queueCode = Number(process.env.QUEUE_CODE);
      const q = queueCode === 200 ? load('queue.json') : null;
      const bindingsRaw = queueCode === 200 ? load('bindings.json') : [];
      const shovels = (() => { try { const s = load('shovels.json'); return Array.isArray(s) ? s : []; } catch (e) { return []; } })();
      const newQueue = QUEUE + process.env.NEW_SUFFIX;
      const shovelName = process.env.SHOVEL_NAME;
      const enc = encodeURIComponent;
      const mgmt = process.env.MGMT_BASE.replace(/\/$/, '');
      const amqpUri = `amqp:///${enc(VHOST)}`;

      // Arguments a classic queue can carry over to a quorum queue unchanged.
      const CARRY = ['x-message-ttl', 'x-max-length', 'x-max-length-bytes', 'x-expires', 'x-dead-letter-exchange', 'x-dead-letter-routing-key', 'x-single-active-consumer'];
      // Classic-only or mirroring-era arguments that quorum queues ignore or reject.
      const DROP = ['x-queue-mode', 'x-queue-master-locator', 'x-queue-version'];

      const blocked = [];
      const warnings = [];
      const newArgs = { 'x-queue-type': 'quorum' };
      let bindings = [];
      let unbindUris = [];

      if (queueCode !== 200) {
        if (state.phase === 'DONE') {
          // finished earlier; the old queue is expected to be gone
        } else {
          blocked.push(`queue ${QUEUE} in vhost ${VHOST} returned HTTP ${queueCode}`);
        }
      } else {
        const args = q.arguments || {};
        if (q.type === 'quorum') blocked.push('the queue is already a quorum queue');
        else if (q.type && q.type !== 'classic') blocked.push(`queue type ${q.type} is not a classic queue`);
        if (q.exclusive) blocked.push('exclusive queues cannot be quorum queues');
        if (q.auto_delete) blocked.push('auto-delete queues cannot be quorum queues');
        if (q.durable === false) blocked.push('transient (non-durable) queues cannot be quorum queues');
        if (args['x-max-priority'] !== undefined) blocked.push('x-max-priority: quorum queues do not give classic priority semantics, decide how consumers handle priority first');
        if (args['x-overflow'] !== undefined) {
          if (['drop-head', 'reject-publish'].includes(args['x-overflow'])) newArgs['x-overflow'] = args['x-overflow'];
          else blocked.push(`x-overflow=${args['x-overflow']} is not supported by quorum queues`);
        }
        for (const [k, v] of Object.entries(args)) {
          if (k === 'x-queue-type' || k === 'x-max-priority' || k === 'x-overflow') continue;
          if (CARRY.includes(k)) newArgs[k] = v;
          else if (DROP.includes(k)) warnings.push(`${k} is dropped, quorum queues do not use it`);
          else blocked.push(`unknown argument ${k}, it would silently change behaviour on the quorum queue`);
        }
        if (Number(process.env.GROUP_SIZE) > 0) newArgs['x-quorum-initial-group-size'] = Number(process.env.GROUP_SIZE);
        if (Number(process.env.DELIVERY_LIMIT) > 0) newArgs['x-delivery-limit'] = Number(process.env.DELIVERY_LIMIT);
        else warnings.push('no x-delivery-limit set: RabbitMQ 4.x applies a default of 20 redeliveries to quorum queues, a poison message is then dropped or dead-lettered');
        if (q.policy) warnings.push(`policy "${q.policy}" matches the old queue; check it does not also match ${newQueue} (ha-mode is ignored by quorum queues)`);

        // The implicit binding to the default exchange (source "") cannot be copied or removed.
        const explicit = bindingsRaw.filter((b) => b.source !== '' && b.destination_type === 'queue');
        bindings = explicit.map((b) => ({ source: b.source, routing_key: b.routing_key, arguments: b.arguments || {} }));
        unbindUris = explicit.map((b) => `${mgmt}/api/bindings/${enc(VHOST)}/e/${enc(b.source)}/q/${enc(QUEUE)}/${enc(b.properties_key)}`);
        if (!explicit.length) warnings.push('the queue has no bindings besides the default exchange, publishers address it by name and must be switched by hand');
      }

      const messages = q ? Number(q.messages || 0) : 0;
      const consumers = q && q.consumers !== undefined ? Number(q.consumers) : null;
      const shovel = shovels.find((s) => s.name === shovelName);
      let action = 'NONE';
      let reason = '';
      let stateNext = state;

      if (state.phase === 'DONE') {
        action = 'DONE';
        reason = `${QUEUE} was migrated to ${state.new_queue}`;
      } else if (state.phase === 'DRAINING') {
        const zero = messages === 0 ? Number(state.zero_observations || 0) + 1 : 0;
        const stagnant = messages > 0 && state.last_messages !== undefined && messages >= Number(state.last_messages) ? Number(state.stagnant_runs || 0) + 1 : 0;
        stateNext = { ...state, zero_observations: zero, stagnant_runs: stagnant, last_messages: messages, last_seen: new Date().toISOString() };
        if (zero >= 2) {
          action = 'RETIRE';
          reason = `${QUEUE} has been empty for ${zero} consecutive runs`;
        } else {
          action = 'DRAIN_WAIT';
          reason = messages === 0 ? 'empty once, waiting for a second empty observation' : `${messages} message(s) left on ${QUEUE}`;
        }
      } else if (blocked.length) {
        action = 'BLOCKED';
        reason = blocked.join('; ');
      } else {
        action = 'CUTOVER';
        reason = `${QUEUE} is a classic queue with ${messages} message(s) and ${bindings.length} binding(s)`;
      }

      const restartShovel = action === 'DRAIN_WAIT' && q && Number(q.messages_ready || 0) > 0 && (!shovel || String(shovel.state) !== 'running');
      const alertStagnant = action === 'DRAIN_WAIT' && stateNext.stagnant_runs === 3;
      const cutoverState = { phase: 'DRAINING', new_queue: newQueue, shovel: shovelName, cutover_at: new Date().toISOString(), binding_count: bindings.length, zero_observations: 0, stagnant_runs: 0, last_messages: messages };

      emit({
        action,
        reason,
        new_queue: newQueue,
        new_args: newArgs,
        bindings,
        unbind_uris: unbindUris,
        warnings,
        messages,
        consumers,
        restart_shovel: !!restartShovel,
        alert_stagnant: alertStagnant,
        vhost_enc: enc(VHOST),
        queue_enc: enc(QUEUE),
        new_queue_enc: enc(newQueue),
        shovel_enc: enc(shovelName),
        shovel_body: {
          value: {
            'src-protocol': 'amqp091', 'src-uri': amqpUri, 'src-queue': QUEUE,
            'dest-protocol': 'amqp091', 'dest-uri': amqpUri, 'dest-queue': newQueue,
            'ack-mode': 'on-confirm', 'src-delete-after': 'never', 'reconnect-delay': 5,
          },
        },
        state_cutover: cutoverState,
        state_next: stateNext,
        state_done: { phase: 'DONE', new_queue: newQueue, finished_at: new Date().toISOString() },
      });

  - id: dispatch_action
    type: io.kestra.plugin.core.flow.Switch
    description: CUTOVER creates, binds and starts draining. DRAIN_WAIT tracks the drain. RETIRE deletes the empty old queue. BLOCKED explains why the queue cannot be migrated.
    value: "{{ outputs.plan_migration.vars.action }}"
    cases:
      CUTOVER:
        - id: notify_cutover_plan
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          messageText: |
            Migrating `{{ inputs.vhost }}` / `{{ inputs.queue }}` to quorum queue `{{ outputs.plan_migration.vars.new_queue }}`: {{ outputs.plan_migration.vars.reason }}.
            Arguments: `{{ outputs.plan_migration.vars.new_args | toJson }}`
            {% for w in outputs.plan_migration.vars.warnings %}- {{ w }}
            {% endfor %}Steps: create and bind the new queue, unbind the old one (publishers may deliver a message to both for a moment, so consumers must tolerate duplicates), shovel the backlog across.
            {{ inputs.apply_after_approval ? 'Execution `' ~ execution.id ~ '` is waiting for approval.' : 'Report-only run, nothing was changed.' }}

        - id: gate_on_cutover
          type: io.kestra.plugin.core.flow.If
          condition: "{{ inputs.apply_after_approval }}"
          then:
            - id: cutover_approval_gate
              type: io.kestra.plugin.core.flow.Pause
              description: Operator approves the cutover. Not approving within 4 hours cancels the run; the next tick plans again.
              pauseDuration: PT4H
              behavior: CANCEL
              onResume:
                - id: approved
                  type: BOOL
                  defaults: false
                  description: Set to true to create the quorum queue, move the bindings and start the shovel.

            - id: gate_on_cutover_approval
              type: io.kestra.plugin.core.flow.If
              condition: "{{ outputs.cutover_approval_gate.onResume.approved == true or outputs.cutover_approval_gate.onResume.approved == 'true' }}"
              then:
                - id: create_quorum_queue
                  type: io.kestra.plugin.amqp.CreateQueue
                  description: Declare the durable quorum queue with the translated arguments. Declaring it again with the same arguments is harmless.
                  host: "{{ inputs.amqp_host }}"
                  port: "{{ inputs.amqp_port }}"
                  username: "{{ secret('RABBITMQ_USERNAME') }}"
                  password: "{{ secret('RABBITMQ_PASSWORD') }}"
                  virtualHost: "{{ inputs.vhost }}"
                  name: "{{ outputs.plan_migration.vars.new_queue }}"
                  durability: true
                  exclusive: false
                  autoDelete: false
                  args: "{{ outputs.plan_migration.vars.new_args }}"

                - id: gate_on_bindings
                  type: io.kestra.plugin.core.flow.If
                  condition: "{{ outputs.plan_migration.vars.bindings | length > 0 }}"
                  then:
                    - id: bind_new_queue
                      type: io.kestra.plugin.core.flow.Loop
                      description: Copy each binding of the old queue to the new queue, with its routing key and arguments.
                      values: "{{ outputs.plan_migration.vars.bindings }}"
                      parseValues: true
                      concurrencyLimit: 1
                      tasks:
                        - id: bind_one
                          type: io.kestra.plugin.amqp.QueueBind
                          host: "{{ inputs.amqp_host }}"
                          port: "{{ inputs.amqp_port }}"
                          username: "{{ secret('RABBITMQ_USERNAME') }}"
                          password: "{{ secret('RABBITMQ_PASSWORD') }}"
                          virtualHost: "{{ inputs.vhost }}"
                          exchange: "{{ item.value.source }}"
                          queue: "{{ outputs.plan_migration.vars.new_queue }}"
                          routingKey: "{{ item.value.routing_key }}"
                          args: "{{ item.value.arguments }}"

                - id: read_new_queue
                  type: io.kestra.plugin.core.http.Request
                  description: Read the new queue back from the management API.
                  uri: "{{ vars.api }}/queues/{{ vars.vhost_enc }}/{{ outputs.plan_migration.vars.new_queue }}"
                  method: GET
                  headers:
                    Authorization: "Basic {{ (secret('RABBITMQ_USERNAME') ~ ':' ~ secret('RABBITMQ_PASSWORD')) | base64encode }}"

                - id: read_new_bindings
                  type: io.kestra.plugin.core.http.Request
                  uri: "{{ vars.api }}/queues/{{ vars.vhost_enc }}/{{ outputs.plan_migration.vars.new_queue }}/bindings"
                  method: GET
                  headers:
                    Authorization: "Basic {{ (secret('RABBITMQ_USERNAME') ~ ':' ~ secret('RABBITMQ_PASSWORD')) | base64encode }}"

                - id: verify_new_queue_bound
                  type: io.kestra.plugin.scripts.node.Script
                  description: Fail before anything is unbound unless the new queue is a durable quorum queue holding every binding of the old one.
                  containerImage: node:20-slim
                  taskRunner:
                    type: io.kestra.plugin.scripts.runner.docker.Docker
                  inputFiles:
                    new_queue.json: "{{ outputs.read_new_queue.body | toJson }}"
                    new_bindings.json: "{{ outputs.read_new_bindings.body | toJson }}"
                    expected.json: "{{ outputs.plan_migration.vars.bindings | toJson }}"
                  env:
                    VHOST: "{{ inputs.vhost }}"
                    QUEUE: "{{ inputs.queue }}"
                    NEW_QUEUE: "{{ outputs.plan_migration.vars.new_queue }}"
                    MODE: BOUND
                  script: |
                    const fs = require('fs');

                    // Management API payloads arrive as JSON text, or as an already-decoded object; accept both.
                    const load = (p) => {
                      let d = JSON.parse(fs.readFileSync(p, 'utf8'));
                      while (typeof d === 'string') d = d.trim() ? JSON.parse(d) : {};
                      return d;
                    };
                    const emit = (outputs) => console.log('::' + JSON.stringify({ outputs }) + '::');
                    const { VHOST, QUEUE } = process.env;

                    const mode = process.env.MODE;
                    const problems = [];
                    const key = (b) => `${b.source}|${b.routing_key}|${JSON.stringify(Object.fromEntries(Object.entries(b.arguments || {}).sort()))}`;

                    if (mode === 'BOUND') {
                      const nq = load('new_queue.json');
                      const nb = load('new_bindings.json').map(key);
                      const expected = load('expected.json');
                      if (nq.type !== 'quorum') problems.push(`${process.env.NEW_QUEUE} has type ${nq.type}, expected quorum`);
                      if (nq.durable !== true) problems.push(`${process.env.NEW_QUEUE} is not durable`);
                      for (const b of expected) if (!nb.includes(key(b))) problems.push(`binding ${b.source} / "${b.routing_key}" is missing on ${process.env.NEW_QUEUE}`);
                    } else if (mode === 'UNBOUND') {
                      const left = load('old_bindings.json').filter((b) => b.source !== '');
                      for (const b of left) problems.push(`${QUEUE} is still bound to ${b.source} with key "${b.routing_key}"`);
                    } else {
                      problems.push('unknown MODE ' + mode);
                    }

                    emit({ ok: problems.length === 0, problems });
                    if (problems.length) {
                      console.error(problems.join('; '));
                      process.exitCode = 1;
                    }

                - id: gate_on_unbind
                  type: io.kestra.plugin.core.flow.If
                  condition: "{{ outputs.plan_migration.vars.unbind_uris | length > 0 }}"
                  then:
                    - id: unbind_old_queue
                      type: io.kestra.plugin.core.flow.Loop
                      description: Remove the old queue from its exchanges, so new messages only reach the quorum queue.
                      values: "{{ outputs.plan_migration.vars.unbind_uris }}"
                      concurrencyLimit: 1
                      tasks:
                        - id: unbind_one
                          type: io.kestra.plugin.core.http.Request
                          uri: "{{ item.value }}"
                          method: DELETE
                          headers:
                            Authorization: "Basic {{ (secret('RABBITMQ_USERNAME') ~ ':' ~ secret('RABBITMQ_PASSWORD')) | base64encode }}"

                - id: read_old_bindings_after
                  type: io.kestra.plugin.core.http.Request
                  uri: "{{ vars.api }}/queues/{{ vars.vhost_enc }}/{{ inputs.queue }}/bindings"
                  method: GET
                  headers:
                    Authorization: "Basic {{ (secret('RABBITMQ_USERNAME') ~ ':' ~ secret('RABBITMQ_PASSWORD')) | base64encode }}"

                - id: verify_old_queue_unbound
                  type: io.kestra.plugin.scripts.node.Script
                  description: Confirm the old queue keeps only its implicit default-exchange binding.
                  containerImage: node:20-slim
                  taskRunner:
                    type: io.kestra.plugin.scripts.runner.docker.Docker
                  inputFiles:
                    old_bindings.json: "{{ outputs.read_old_bindings_after.body | toJson }}"
                  env:
                    VHOST: "{{ inputs.vhost }}"
                    QUEUE: "{{ inputs.queue }}"
                    MODE: UNBOUND
                  script: |
                    const fs = require('fs');

                    // Management API payloads arrive as JSON text, or as an already-decoded object; accept both.
                    const load = (p) => {
                      let d = JSON.parse(fs.readFileSync(p, 'utf8'));
                      while (typeof d === 'string') d = d.trim() ? JSON.parse(d) : {};
                      return d;
                    };
                    const emit = (outputs) => console.log('::' + JSON.stringify({ outputs }) + '::');
                    const { VHOST, QUEUE } = process.env;

                    const mode = process.env.MODE;
                    const problems = [];
                    const key = (b) => `${b.source}|${b.routing_key}|${JSON.stringify(Object.fromEntries(Object.entries(b.arguments || {}).sort()))}`;

                    if (mode === 'BOUND') {
                      const nq = load('new_queue.json');
                      const nb = load('new_bindings.json').map(key);
                      const expected = load('expected.json');
                      if (nq.type !== 'quorum') problems.push(`${process.env.NEW_QUEUE} has type ${nq.type}, expected quorum`);
                      if (nq.durable !== true) problems.push(`${process.env.NEW_QUEUE} is not durable`);
                      for (const b of expected) if (!nb.includes(key(b))) problems.push(`binding ${b.source} / "${b.routing_key}" is missing on ${process.env.NEW_QUEUE}`);
                    } else if (mode === 'UNBOUND') {
                      const left = load('old_bindings.json').filter((b) => b.source !== '');
                      for (const b of left) problems.push(`${QUEUE} is still bound to ${b.source} with key "${b.routing_key}"`);
                    } else {
                      problems.push('unknown MODE ' + mode);
                    }

                    emit({ ok: problems.length === 0, problems });
                    if (problems.length) {
                      console.error(problems.join('; '));
                      process.exitCode = 1;
                    }

                - id: start_backlog_shovel
                  type: io.kestra.plugin.core.http.Request
                  description: Create a dynamic shovel that moves whatever is on the old queue into the quorum queue and keeps moving stragglers until the old queue is retired.
                  uri: "{{ vars.api }}/parameters/shovel/{{ vars.vhost_enc }}/{{ vars.shovel_name }}"
                  method: PUT
                  headers:
                    Authorization: "Basic {{ (secret('RABBITMQ_USERNAME') ~ ':' ~ secret('RABBITMQ_PASSWORD')) | base64encode }}"
                  body: "{{ outputs.plan_migration.vars.shovel_body | toJson }}"

                - id: save_cutover_state
                  type: io.kestra.plugin.core.kv.Set
                  description: Remember the phase, so later runs track the drain and know which queue and shovel to retire.
                  key: "{{ vars.state_key }}"
                  kvType: JSON
                  overwrite: true
                  value: "{{ outputs.plan_migration.vars.state_cutover | toJson }}"

                - id: notify_cutover_done
                  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                  url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                  messageText: "`{{ inputs.queue }}` is unbound and `{{ outputs.plan_migration.vars.new_queue }}` now receives new messages. The shovel is moving {{ outputs.plan_migration.vars.messages }} backlog message(s). Point consumers at `{{ outputs.plan_migration.vars.new_queue }}`; the old queue is deleted only after it is empty on two runs and has no consumers."
              else:
                - id: log_cutover_not_approved
                  type: io.kestra.plugin.core.log.Log
                  message: "Cutover was not approved; the broker was left unchanged."
          else:
            - id: log_report_only
              type: io.kestra.plugin.core.log.Log
              message: "Report-only run, nothing changed on the broker."

      DRAIN_WAIT:
        - id: save_drain_progress
          type: io.kestra.plugin.core.kv.Set
          description: Count consecutive empty observations and runs without progress.
          key: "{{ vars.state_key }}"
          kvType: JSON
          overwrite: true
          value: "{{ outputs.plan_migration.vars.state_next | toJson }}"

        - id: gate_on_shovel_restart
          type: io.kestra.plugin.core.flow.If
          description: Ready messages remain but the shovel is missing or not running, so put it back. The definition is idempotent.
          condition: "{{ outputs.plan_migration.vars.restart_shovel }}"
          then:
            - id: restart_backlog_shovel
              type: io.kestra.plugin.core.http.Request
              uri: "{{ vars.api }}/parameters/shovel/{{ vars.vhost_enc }}/{{ vars.shovel_name }}"
              method: PUT
              headers:
                Authorization: "Basic {{ (secret('RABBITMQ_USERNAME') ~ ':' ~ secret('RABBITMQ_PASSWORD')) | base64encode }}"
              body: "{{ outputs.plan_migration.vars.shovel_body | toJson }}"

        - id: gate_on_stagnation
          type: io.kestra.plugin.core.flow.If
          condition: "{{ outputs.plan_migration.vars.alert_stagnant }}"
          then:
            - id: notify_stagnant_drain
              type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
              url: "{{ secret('SLACK_WEBHOOK_URL') }}"
              messageText: "`{{ inputs.queue }}` has not shrunk for 3 runs ({{ outputs.plan_migration.vars.messages }} message(s), {{ outputs.plan_migration.vars.consumers }} consumer(s)). Unacknowledged messages held by consumers are not moved by the shovel; check the shovel `{{ vars.shovel_name }}` and the consumers."

      RETIRE:
        - id: notify_retire_ready
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          messageText: "`{{ inputs.queue }}` has been empty for two runs. {{ inputs.apply_after_approval ? 'Execution `' ~ execution.id ~ '` waits for approval to delete it. Confirm every consumer and publisher uses `' ~ outputs.plan_migration.vars.new_queue ~ '` first.' : 'Report-only run, nothing will be deleted.' }}"

        - id: gate_on_retire
          type: io.kestra.plugin.core.flow.If
          condition: "{{ inputs.apply_after_approval }}"
          then:
            - id: retire_approval_gate
              type: io.kestra.plugin.core.flow.Pause
              description: Operator confirms the application now uses the quorum queue, because the old queue and its shovel are deleted next.
              pauseDuration: PT4H
              behavior: CANCEL
              onResume:
                - id: approved
                  type: BOOL
                  defaults: false
                  description: Set to true to delete the shovel and the old queue.

            - id: gate_on_retire_approval
              type: io.kestra.plugin.core.flow.If
              condition: "{{ outputs.retire_approval_gate.onResume.approved == true or outputs.retire_approval_gate.onResume.approved == 'true' }}"
              then:
                - id: recheck_old_queue
                  type: io.kestra.plugin.core.http.Request
                  description: Read the queue again, because hours may have passed while waiting for approval.
                  uri: "{{ vars.api }}/queues/{{ vars.vhost_enc }}/{{ inputs.queue }}"
                  method: GET
                  headers:
                    Authorization: "Basic {{ (secret('RABBITMQ_USERNAME') ~ ':' ~ secret('RABBITMQ_PASSWORD')) | base64encode }}"

                - id: check_safe_to_delete
                  type: io.kestra.plugin.scripts.node.Script
                  description: Safe only when the queue is empty and the management API reports zero consumers.
                  containerImage: node:20-slim
                  taskRunner:
                    type: io.kestra.plugin.scripts.runner.docker.Docker
                  inputFiles:
                    queue.json: "{{ outputs.recheck_old_queue.body | toJson }}"
                  env:
                    VHOST: "{{ inputs.vhost }}"
                    QUEUE: "{{ inputs.queue }}"
                  script: |
                    const fs = require('fs');

                    // Management API payloads arrive as JSON text, or as an already-decoded object; accept both.
                    const load = (p) => {
                      let d = JSON.parse(fs.readFileSync(p, 'utf8'));
                      while (typeof d === 'string') d = d.trim() ? JSON.parse(d) : {};
                      return d;
                    };
                    const emit = (outputs) => console.log('::' + JSON.stringify({ outputs }) + '::');
                    const { VHOST, QUEUE } = process.env;

                    const q = load('queue.json');
                    const consumers = q.consumers === undefined ? null : Number(q.consumers);
                    const messages = Number(q.messages || 0);
                    let safe = true;
                    let why = 'queue is empty and has no consumers';
                    if (messages !== 0) { safe = false; why = `${messages} message(s) arrived or were left on ${QUEUE}`; }
                    else if (consumers === null) { safe = false; why = 'the management API did not report a consumer count'; }
                    else if (consumers !== 0) { safe = false; why = `${consumers} consumer(s) are still attached to ${QUEUE}, switch them to the quorum queue first`; }
                    emit({ safe, why });

                - id: gate_on_safe_delete
                  type: io.kestra.plugin.core.flow.If
                  condition: "{{ outputs.check_safe_to_delete.vars.safe == true }}"
                  then:
                    - id: delete_backlog_shovel
                      type: io.kestra.plugin.core.http.Request
                      description: Remove the shovel first so it cannot recreate traffic to a queue that is going away.
                      uri: "{{ vars.api }}/parameters/shovel/{{ vars.vhost_enc }}/{{ vars.shovel_name }}"
                      method: DELETE
                      headers:
                        Authorization: "Basic {{ (secret('RABBITMQ_USERNAME') ~ ':' ~ secret('RABBITMQ_PASSWORD')) | base64encode }}"
                      options:
                        allowFailed: true

                    - id: delete_old_queue
                      type: io.kestra.plugin.core.http.Request
                      description: Delete with if-empty and if-unused, so the broker itself refuses if a message or a consumer appeared in the meantime.
                      uri: "{{ vars.api }}/queues/{{ vars.vhost_enc }}/{{ inputs.queue }}?if-empty=true&if-unused=true"
                      method: DELETE
                      headers:
                        Authorization: "Basic {{ (secret('RABBITMQ_USERNAME') ~ ':' ~ secret('RABBITMQ_PASSWORD')) | base64encode }}"

                    - id: confirm_old_queue_gone
                      type: io.kestra.plugin.core.http.Request
                      uri: "{{ vars.api }}/queues/{{ vars.vhost_enc }}/{{ inputs.queue }}"
                      method: GET
                      headers:
                        Authorization: "Basic {{ (secret('RABBITMQ_USERNAME') ~ ':' ~ secret('RABBITMQ_PASSWORD')) | base64encode }}"
                      options:
                        allowFailed: true

                    - id: assert_old_queue_gone
                      type: io.kestra.plugin.core.execution.Assert
                      conditions:
                        - "{{ outputs.confirm_old_queue_gone.code == 404 }}"
                      errorMessage: "The old queue {{ inputs.queue }} still exists after the delete."

                    - id: save_done_state
                      type: io.kestra.plugin.core.kv.Set
                      key: "{{ vars.state_key }}"
                      kvType: JSON
                      overwrite: true
                      value: "{{ outputs.plan_migration.vars.state_done | toJson }}"

                    - id: notify_retired
                      type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                      url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                      messageText: "`{{ inputs.queue }}` and its shovel are deleted. `{{ outputs.plan_migration.vars.new_queue }}` is the only queue left."
                  else:
                    - id: notify_not_safe_to_delete
                      type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                      url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                      messageText: "`{{ inputs.queue }}` was not deleted: {{ outputs.check_safe_to_delete.vars.why }}. The shovel keeps running and the next run checks again."
              else:
                - id: log_retire_not_approved
                  type: io.kestra.plugin.core.log.Log
                  message: "Deletion was not approved; the old queue and the shovel stay."
          else:
            - id: log_retire_report_only
              type: io.kestra.plugin.core.log.Log
              message: "Report-only run, nothing deleted."

      BLOCKED:
        - id: notify_blocked
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          messageText: "`{{ inputs.vhost }}` / `{{ inputs.queue }}` cannot be migrated as it is: {{ outputs.plan_migration.vars.reason }}."
    defaults:
      - id: log_no_action
        type: io.kestra.plugin.core.log.Log
        message: "No action: {{ outputs.plan_migration.vars.reason }}."

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: "Quorum migration of `{{ inputs.queue }}` failed (execution `{{ execution.id }}`). Nothing is deleted before the last phase. If it failed during the cutover, check the bindings of `{{ inputs.queue }}` and `{{ inputs.queue }}{{ inputs.new_queue_suffix }}`; a message may be routed to both for a while, never to neither."

extend:
  title: Migrate a RabbitMQ Classic Queue to a Quorum Queue Without Losing Messages or Bindings
  metaTitle: RabbitMQ Classic to Quorum Queue Migration | Kestra
  shortDescription: Create the quorum queue, copy the bindings, unbind the classic queue, shovel the backlog, and delete the old queue only when it is empty and unused.
  metaDescription: Migrate a RabbitMQ classic queue to a quorum queue with copied bindings, a backlog shovel, verified steps and a guarded delete of the old queue.
  description: |
    RabbitMQ 4 removes classic mirrored queues, so every HA queue has to become a quorum queue, with its arguments, bindings and backlog, while publishers keep sending. This blueprint migrates one queue in phases, keeping the state between runs.

    ## How it works

    1. `inspect_queue`, `inspect_bindings` and `inspect_shovels` read the queue, its bindings and the shovels from the management API. `plan_migration` loads the migration state from Kestra KV and decides the phase.
    2. It rejects queues a quorum queue cannot honour (exclusive, auto-delete, non-durable, priority, unknown arguments), translates the rest, and flags that a missing `x-delivery-limit` means the 4.x default of 20 redeliveries.
    3. `CUTOVER`: after `cutover_approval_gate` (`Pause`), `create_quorum_queue` declares the quorum queue, `bind_new_queue` copies each binding, and `verify_new_queue_bound` stops the run unless every binding exists. `unbind_old_queue` removes the old bindings, `verify_old_queue_unbound` checks, and `start_backlog_shovel` moves the backlog. `save_cutover_state` records the phase.
    4. `DRAIN_WAIT` runs on later ticks: it counts empty observations, restarts a missing shovel, and alerts when the backlog has not shrunk for three runs.
    5. `RETIRE` needs two empty runs, then `retire_approval_gate`. `check_safe_to_delete` re-reads the queue, `delete_old_queue` uses `if-empty` and `if-unused`, and `assert_old_queue_gone` confirms the 404.

    ## What you get

    - Bindings are copied before they are removed, so a message is routed to both queues for a moment, never to neither.
    - The old queue is deleted by the broker only if it is empty and unused.

    ## Who it's for

    - Platform and SRE teams moving RabbitMQ from classic mirrored queues to quorum queues.

    ## Why orchestrate this with Kestra

    The migration spans several runs, needs two approvals and must remember its phase. Kestra keeps it in KV, waits with `Pause` and checks between broker changes.

    ## Prerequisites

    - RabbitMQ 3.13 or 4.x with `rabbitmq_management`, `rabbitmq_shovel` and `rabbitmq_shovel_management` enabled; Docker for the script tasks.
    - A user with the `policymaker` tag and configure, write and read permissions on the virtual host.

    ### Secrets

    - `RABBITMQ_USERNAME`: broker user name.
    - `RABBITMQ_PASSWORD`: broker password.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook.

    ## Quick start

    1. Run `rabbitmq:3.13-management`, enable the shovel plugins, declare a classic queue `orders` with a binding to an exchange, and publish a few messages.
    2. Create the three secrets and execute with `apply_after_approval: false` to read the plan.
    3. Execute again with it true, resume `cutover_approval_gate` with `approved` set, and check the new queue and its bindings.
    4. Point your consumers at `orders.quorum`, run again until the queue is empty twice, then approve the delete. Enable `every_five_minutes`.

    ## How to extend

    - Add a Kubernetes rollout task that restarts consumers with the new queue name before retirement.

    ## Links

    - [Quorum queues](https://www.rabbitmq.com/docs/quorum-queues)
    - [Dynamic shovels](https://www.rabbitmq.com/docs/shovel-dynamic)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Day 2 Operations
    - Approval Gates
  ee: false
  demo: false
