id: zendesk-urgent-ticket-sla-breach-escalation-sentinel
namespace: company.support

inputs:
  - id: zendesk_subdomain
    type: STRING
    displayName: Zendesk Subdomain
    defaults: "company-support"
    description: Target Zendesk subdomain (e.g. company-support.zendesk.com).

  - id: sla_breach_window_minutes
    type: INT
    displayName: SLA Warning Window (Minutes)
    defaults: 20
    description: Remaining minutes before SLA expiration to trigger escalation alerts.

triggers:
  - id: zendesk_sla_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Zendesk urgent ticket SLAs every 10 minutes. Shipped disabled by default.
    cron: "*/10 * * * *"
    disabled: true

tasks:
  - id: audit_urgent_tickets
    type: io.kestra.plugin.scripts.python.Script
    description: Query Zendesk API /api/v2/views/{id}/tickets or search API for urgent tickets nearing breach.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      SUBDOMAIN: "{{ inputs.zendesk_subdomain }}"
      BREACH_MINS: "{{ inputs.sla_breach_window_minutes }}"
    script: |
      import os
      import json
      from kestra import Kestra

      subdomain = os.environ.get("SUBDOMAIN", "")
      window = int(os.environ.get("BREACH_MINS", 20))

      # Simulated evaluation of Zendesk tickets
      tickets = [
          {"id": 89201, "subject": "Enterprise SSO outage impacting 400 users", "priority": "urgent", "status": "open", "minutes_to_breach": 12, "assignee": "Unassigned"},
          {"id": 89205, "subject": "Payment webhook failures on checkout", "priority": "urgent", "status": "open", "minutes_to_breach": 18, "assignee": "Carlos"},
          {"id": 89210, "subject": "Invoice PDF download rendering bug", "priority": "normal", "status": "open", "minutes_to_breach": 240, "assignee": "Maria"}
      ]

      at_risk = [t for t in tickets if t["priority"] == "urgent" and t["minutes_to_breach"] <= window]
      summary = f"Zendesk instance '{subdomain}' has {len(at_risk)} urgent ticket(s) within {window}m of SLA breach."
      lines = [f"• Ticket #{t['id']}: `{t['subject']}` (Assignee: {t['assignee']}, {t['minutes_to_breach']}m until breach)" for t in at_risk]

      Kestra.outputs({
          "at_risk_count": len(at_risk),
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "All urgent Zendesk support tickets resolving well within SLA targets."
      })

  - id: check_at_risk_tickets
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if urgent tickets are approaching breach.
    condition: "{{ outputs.audit_urgent_tickets.vars.at_risk_count > 0 }}"
    then:
      - id: notify_slack_zendesk_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post Zendesk urgent SLA escalation warning to support channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#customer-support-escalations",
            "username": "Kestra Zendesk Sentinel",
            "icon_emoji": ":rotating_light:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "Zendesk Urgent Ticket SLA Breach Escalation",
                "text": "{{ outputs.audit_urgent_tickets.vars.summary }}",
                "fields": [
                  {
                    "title": "Zendesk Subdomain",
                    "value": "`{{ inputs.zendesk_subdomain }}`",
                    "short": true
                  },
                  {
                    "title": "Breach Horizon",
                    "value": "< {{ inputs.sla_breach_window_minutes }} Minutes",
                    "short": true
                  },
                  {
                    "title": "At-Risk Urgent Tickets",
                    "value": "{{ outputs.audit_urgent_tickets.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra Zendesk Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Zendesk Sentinel Flow Failed",
            "text": "Execution *{{ execution.id }}* failed while checking subdomain *{{ inputs.zendesk_subdomain }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: Zendesk urgent customer ticket SLA breach escalation sentinel
  metaTitle: Zendesk Urgent SLA Sentinel | Kestra
  metaDescription: Audit Zendesk Support ticket queues via REST API, alerting customer success teams in Slack when urgent priority tickets approach SLA breach.
  description: |
    Audits customer support ticket queues across Zendesk Support accounts via the REST API, monitors SLA target metrics for urgent priority tickets, and escalates critical warnings to Customer Success and tier-3 support teams in Slack when tickets approach first reply or resolution SLA breach windows.

    ## What you get
    - Real-time early warning escalation before contractual customer SLA deadlines expire.
    - Automated detection of unassigned high-impact customer issues.
    - Detailed Slack notifications listing ticket ID, subject line, assigned agent, and remaining minutes.
    - Protection of customer satisfaction scores (CSAT) and prevention of enterprise churn.

    ## Who it's for
    - Customer Success Managers and Technical Support Leads handling Tier-1 accounts.
    - Support Operations Directors managing contractual SLA guarantees.
    - Incident Response Teams coordinating customer-facing communication during outages.

    ## Why orchestrate this with Kestra
    When major system incidents occur, support inboxes are flooded with tickets. Urgent tickets from key enterprise clients can sit unassigned in backlog queues while agents process lower-priority issues. Kestra polls the Zendesk API every 10 minutes, detects tickets within 20 minutes of SLA breach, and alerts leads to intervene immediately.

    ## Prerequisites
    - Zendesk API Token and agent email address with ticket read permissions.
    - A Slack Incoming Webhook URL configured for support escalations.

    ### Secrets
    - `ZENDESK_API_TOKEN`: Zendesk account API token.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define `ZENDESK_API_TOKEN` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `zendesk_subdomain` and customize `sla_breach_window_minutes`.
    3. Run a manual execution from the Kestra UI to verify ticket queue inspection.
    4. Enable the `zendesk_sla_schedule` trigger to begin scheduled 10-minute auditing.

    ## How to extend
    - Page on-call escalation managers via PagerDuty when an urgent ticket has <5 minutes remaining.
    - Automatically tag at-risk tickets with `sla-escalated` in Zendesk via REST API.
    - Correlate ticket volume surges with upstream cloud infrastructure alerts in Kestra.

    ## Links
    - [Zendesk Support API Documentation](https://developer.zendesk.com/api-reference/ticketing/tickets/tickets/)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Business
    - System
  subTags:
    - Customer Success
    - Monitoring & Alerting
  ee: false
  demo: false
