id: datadog-synthetic-test-assertion-regression-sentinel
namespace: company.team

concurrency:
  limit: 1

inputs:
  - id: datadogSite
    type: STRING
    displayName: Datadog Site
    defaults: datadoghq.com
    description: Datadog intake domain (e.g., datadoghq.com, datadoghq.eu, us3.datadoghq.com).

  - id: syntheticTestId
    type: STRING
    displayName: Synthetic Test Public ID
    defaults: abc-123-xyz
    description: Public ID of the Datadog Synthetic API or Browser test to evaluate.

  - id: maxConsecutiveFailures
    type: INT
    displayName: Max Consecutive Failures
    defaults: 3
    description: Threshold of consecutive failed test executions triggering regression alerts.

  - id: datadogApiKey
    type: SECRET
    displayName: Datadog API Key
    defaults: datadog_api_key_secret
    description: Encrypted Datadog API key for accessing Synthetic test telemetry.

  - id: datadogAppKey
    type: SECRET
    displayName: Datadog Application Key
    defaults: datadog_app_key_secret
    description: Encrypted Datadog Application key with read permissions.

  - id: slackWebhookUri
    type: SECRET
    displayName: Slack Webhook URI
    defaults: https://hooks.slack.com/services/T00/B00/XXXX
    description: Encrypted Slack Incoming Webhook endpoint for alerting QA and SRE teams.

tasks:
  - id: evaluate_synthetic_test_results
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Datadog API for recent Synthetic test execution results and failed assertions.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      DD_SITE: "{{ inputs.datadogSite }}"
      DD_API_KEY: "{{ inputs.datadogApiKey }}"
      DD_APP_KEY: "{{ inputs.datadogAppKey }}"
      TEST_ID: "{{ inputs.syntheticTestId }}"
      MAX_FAILURES: "{{ inputs.maxConsecutiveFailures }}"
    outputFiles:
      - synthetic_report.json
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      dd_site = os.getenv('DD_SITE', 'datadoghq.com')
      api_key = os.getenv('DD_API_KEY')
      app_key = os.getenv('DD_APP_KEY')
      test_id = os.getenv('TEST_ID')
      max_failures = int(os.getenv('MAX_FAILURES', '3'))

      if not api_key or not app_key:
          print("ERROR: Datadog API and Application keys must be provided.", file=sys.stderr)
          sys.exit(1)

      headers = {
          "DD-API-KEY": api_key,
          "DD-APPLICATION-KEY": app_key,
          "Accept": "application/json"
      }

      url = f"https://api.{dd_site}/api/v1/synthetics/tests/{test_id}/results"
      try:
          resp = requests.get(url, headers=headers, params={"count": 10}, timeout=20)
          resp.raise_for_status()
          results = resp.json().get("results", [])
      except Exception as exc:
          print(f"ERROR querying Datadog Synthetics API: {exc}", file=sys.stderr)
          sys.exit(1)

      consecutive_fails = 0
      failed_assertions = []

      for r in results:
          status = r.get("result", {}).get("eventType") or r.get("status")
          error_code = r.get("result", {}).get("errorCode")
          error_msg = r.get("result", {}).get("errorMessage", "Assertion failed")

          if error_code or status == 0 or status == "failed":
              consecutive_fails += 1
              failed_assertions.append({
                  "result_id": r.get("result_id"),
                  "check_time": r.get("check_time"),
                  "error_code": error_code,
                  "error_msg": error_msg
              })
          else:
              break

      has_regression = consecutive_fails >= max_failures

      report = {
          "test_id": test_id,
          "evaluated_runs": len(results),
          "consecutive_failures": consecutive_fails,
          "threshold": max_failures,
          "has_regression": has_regression,
          "recent_errors": failed_assertions[:3],
          "recommended_action": f"Inspect Datadog Synthetics UI at https://app.{dd_site}/synthetics/details/{test_id} and trigger redeploy or hotfix." if has_regression else "Synthetic assertions passing normally."
      }

      with open("synthetic_report.json", "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)

      print(f"Datadog Synthetic {test_id}: {consecutive_fails} consecutive failures. Regression: {has_regression}")

      Kestra.outputs({
          "test_id": test_id,
          "evaluated_runs": len(results),
          "consecutive_failures": consecutive_fails,
          "threshold": max_failures,
          "has_regression": has_regression,
          "recommended_action": report["recommended_action"]
      })

  - id: check_assertion_regression
    type: io.kestra.plugin.core.flow.If
    description: Branch execution based on whether synthetic test assertion failures exceeded threshold.
    condition: "{{ outputs.evaluate_synthetic_test_results.vars.has_regression }}"
    then:
      - id: notify_slack_synthetic_regression
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority synthetic test regression alert to Slack.
        url: "{{ inputs.slackWebhookUri }}"
        payload: |
          {
            "text": "Datadog Synthetics Alert: Test *{{ outputs.evaluate_synthetic_test_results.vars.test_id }}* experienced {{ outputs.evaluate_synthetic_test_results.vars.consecutive_failures }} consecutive assertion failures! Threshold: {{ inputs.maxConsecutiveFailures }}. Runbook: {{ outputs.evaluate_synthetic_test_results.vars.recommended_action }}"
          }
    else:
      - id: log_healthy_synthetic_tests
        type: io.kestra.plugin.core.log.Log
        description: Logs nominal test execution state when synthetic tests pass assertions.
        message: "Datadog Synthetic test {{ outputs.evaluate_synthetic_test_results.vars.test_id }} is passing assertions with zero critical regressions."

  - id: export_synthetic_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Exports structured Datadog synthetic test health report.
    format: "{{ outputs.evaluate_synthetic_test_results.vars }}"

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatches alert to Slack if the synthetic sentinel fails.
    url: "{{ inputs.slackWebhookUri }}"
    payload: |
      {
        "text": "Datadog Synthetics Sentinel Workflow Failed for test {{ inputs.syntheticTestId }} on execution {{ execution.id }}."
      }

triggers:
  - id: continuous_synthetic_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"

extend:
  title: Datadog Synthetic Test Assertion Regression Sentinel
  metaTitle: Datadog Synthetic Test Assertion Regression Sentinel Blueprint
  shortDescription: Audits Datadog Synthetic test runs for continuous assertion failures and regression spikes.
  metaDescription: Audits Datadog Synthetic test executions for assertion regressions and critical user journey failures.
  description: |
    Datadog Synthetic tests validate API and frontend user flows. When deployments break assertions across consecutive runs, teams must be notified immediately. This sentinel evaluates consecutive failure counts and notifies SRE teams on Slack.

    ## How it works
    1. Runs on a 10-minute schedule.
    2. Fetches recent results for the target test ID from Datadog API v1.
    3. Evaluates consecutive assertion failure counts against the configured threshold.
    4. Triggers Slack alerts on regression and emits structured output manifest.

    ## Prerequisites
    - Datadog API Key and Application Key.
    - Slack Incoming Webhook URL.
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
