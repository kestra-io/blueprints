id: postgres-autovacuum-work-mem-exhaustion-sentinel
namespace: company.database

inputs:
  - id: db_host
    type: STRING
    defaults: "postgres.internal"
    description: PostgreSQL database server hostname or IP.
  - id: db_port
    type: INT
    defaults: 5432
    description: PostgreSQL server port.
  - id: db_name
    type: STRING
    defaults: "postgres"
    description: PostgreSQL database name.
  - id: db_user
    type: STRING
    defaults: "postgres"
    description: PostgreSQL administrative user.
  - id: multi_index_cycle_threshold
    type: INT
    defaults: 2
    description: Number of index vacuum cycles indicating maintenance_work_mem starvation.

tasks:
  - id: query_autovacuum_progress
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "jdbc:postgresql://{{ inputs.db_host }}:{{ inputs.db_port }}/{{ inputs.db_name }}"
    username: "{{ inputs.db_user }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    sql: |
      SELECT 
          p.pid,
          c.relname,
          p.phase,
          p.index_vacuum_count,
          p.heap_blks_total,
          p.heap_blks_scanned,
          p.heap_blks_vacuumed
      FROM pg_stat_progress_vacuum p
      JOIN pg_class c ON c.oid = p.relid
      WHERE p.phase = 'vacuuming indexes'
        AND p.index_vacuum_count >= {{ inputs.multi_index_cycle_threshold }}
      ORDER BY p.index_vacuum_count DESC;
    fetchType: FETCH

  - id: evaluate_autovacuum_memory
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_autovacuum_progress.rows | length > 0 }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#dba-alerts",
            "attachments": [
              {
                "color": "warning",
                "title": "⚠️ PostgreSQL Autovacuum maintenance_work_mem Exhaustion Alert",
                "text": "Detected *{{ outputs.query_autovacuum_progress.rows | length }}* autovacuum worker(s) performing multiple index vacuum cycles (>={{ inputs.multi_index_cycle_threshold }} cycles). Workers: {{ outputs.query_autovacuum_progress.rows }}. Root Cause: Table dead tuples exceed `maintenance_work_mem` or `autovacuum_work_mem` capacity, forcing multi-pass index vacuuming and prolonged disk I/O spikes.",
                "footer": "Kestra Database Sentinel • Postgres Autovacuum"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#dba-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Postgres Autovacuum Sentinel Execution Error",
            "text": "The autovacuum memory sentinel query failed. Please verify PostgreSQL database credentials and host accessibility.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: PostgreSQL Autovacuum Work Memory Exhaustion and Multi-Cycle Index Sentinel
  shortDescription: Audits PostgreSQL active autovacuum workers to detect maintenance_work_mem starvation and multi-pass index vacuum disk thrashing.
  description: |
    ## How it works
    This workflow connects directly to PostgreSQL using the official JDBC PostgreSQL plugin and queries `pg_stat_progress_vacuum`. It identifies autovacuum workers in the `vacuuming indexes` phase with `index_vacuum_count` greater than or equal to the configured threshold. When dead tuple pointers exceed `autovacuum_work_mem`, autovacuum is forced to execute multiple costly passes over index b-trees, saturating storage I/O. Detected incidents trigger a detailed Slack alert.

    ## What you get
    - Proactive identification of memory-starved vacuum processes.
    - Prevents table bloat and transaction ID (XID) wraparound backlogs caused by sluggish vacuum workers.
    - Actionable recommendations to increase `autovacuum_work_mem` on specific hot tables.

    ## Who it's for
    - Database Administrators (DBAs) and SREs optimizing high-throughput PostgreSQL databases.
    - Backend engineers managing write-heavy operational tables with heavy update/delete churn.

    ## Why orchestrate this with Kestra
    - **Native Database Driver**: Uses official `io.kestra.plugin.jdbc.postgresql.Query` without external command-line dependencies.
    - **Reliable Scheduling**: Perform non-intrusive metadata sampling at regular intervals.
    - **Multi-Environment Ready**: Parameterize connection endpoints across staging, preprod, and production clusters.

    ## Prerequisites
    - PostgreSQL 12+ database with `pg_stat_progress_vacuum` accessible by the connecting user.
    - Secret `POSTGRES_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure the database host, user, and `POSTGRES_PASSWORD` secret.
    3. Trigger the flow to check active autovacuum progress.

    ## How to extend
    - Automatically generate `ALTER TABLE ... SET (autovacuum_work_mem = '512MB')` recommendations.
    - Correlate with AWS RDS CloudWatch IOPS metrics.

    ## Links
    - [PostgreSQL Vacuum Progress Reporting](https://www.postgresql.org/docs/current/progress-reporting.html#VACUUM-PROGRESS-REPORTING)
    - [Kestra PostgreSQL Plugin](https://kestra.io/plugins/plugin-jdbc-postgres)
  tags:
    - Data
    - Infrastructure
  ee: false
  demo: false
