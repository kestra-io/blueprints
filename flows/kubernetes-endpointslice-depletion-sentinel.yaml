id: kubernetes-endpointslice-depletion-sentinel
namespace: company.sre

inputs:
  - id: kube_context
    type: STRING
    required: false
    description: Optional Kubernetes context name.
  - id: empty_slice_threshold
    type: INT
    defaults: 0
    description: Maximum acceptable count of EndpointSlices with zero ready endpoints.

tasks:
  - id: audit_endpointslices
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: bitnami/kubectl:latest
    commands:
      - |
        CONTEXT_ARG=""
        if [ -n "{{ inputs.kube_context }}" ]; then
          CONTEXT_ARG="--context={{ inputs.kube_context }}"
        fi
        
        kubectl $CONTEXT_ARG get endpointslices -A -o json > /tmp/eps_all.json
        
        EMPTY_SLICES=$(jq '[.items[] | select((.endpoints // []) | map(select(.conditions.ready == true)) | length == 0) | {namespace: .metadata.namespace, name: .metadata.name, service: .metadata.labels."kubernetes.io/service-name", address_type: .addressType}]' /tmp/eps_all.json)
        EMPTY_COUNT=$(echo "$EMPTY_SLICES" | jq 'length')
        
        echo "::set-output name=empty_count::$EMPTY_COUNT::"
        echo "::set-output name=empty_slices::$EMPTY_SLICES::"

  - id: evaluate_endpointslice_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_endpointslices.vars.empty_count | int > inputs.empty_slice_threshold }}"
    then:
      - id: notify_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#infrastructure-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Kubernetes EndpointSlice Ready Endpoints Depletion Alert",
                "text": "Detected *{{ outputs.audit_endpointslices.vars.empty_count }}* EndpointSlice(s) with *zero ready backend endpoints*. Depleted slices: {{ outputs.audit_endpointslices.vars.empty_slices }}. Impact: Traffic routed to these services will fail with connection refused or 503 Service Unavailable, breaking inter-pod networking.",
                "footer": "Kestra SRE Sentinel • EndpointSlice Health"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#infrastructure-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ EndpointSlice Sentinel Execution Failed",
            "text": "The Kubernetes EndpointSlice audit workflow encountered an execution error. Please check cluster RBAC permissions and API reachability.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Kubernetes discovery.k8s.io EndpointSlices across all namespaces to detect zero-ready backend routing blackholes."
  metaTitle: Kubernetes EndpointSlice Ready Endpoints Depletion and Routing Sentinel with Kestra
  title: Kubernetes EndpointSlice Ready Endpoints Depletion and Routing Sentinel
  shortDescription: Audits Kubernetes discovery.k8s.io EndpointSlices across all namespaces to detect zero-ready backend routing blackholes.
  description: |
    ## How it works
    This workflow connects to the target Kubernetes cluster using `kubectl` to inspect all `discovery.k8s.io/v1` `EndpointSlice` resources cluster-wide. It inspects `.endpoints[].conditions.ready` for every slice. When deployments experience crash loops, failed liveness/readiness probes, or evicted pods, the corresponding EndpointSlice loses all ready endpoints. When empty slices exceed configured limits, a real-time incident alert is dispatched to Slack.

    ## What you get
    - Real-time detection of backend microservice routing blackholes.
    - Eliminates silent internal RPC connection refused failures.
    - Actionable inventory of affected service names, namespaces, and address types (IPv4/IPv6).

    ## Who it's for
    - SREs and Platform Engineers supporting Kubernetes service discovery and ingress routing.
    - Backend developers diagnosing intermittent HTTP 503 errors during pod redeployments.

    ## Why orchestrate this with Kestra
    - **Native Scheduling**: Run regular, automated cluster network audits without running dedicated daemons.
    - **Multi-Tenant Visibility**: Audits all namespaces simultaneously in a single lightweight execution.
    - **Flexible Alert Routing**: Route failure diagnostics directly to responsible service teams via Slack or Webhooks.

    ## Prerequisites
    - Cluster RBAC permissions allowing `get` and `list` on `endpointslices.discovery.k8s.io`.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Configure the `SLACK_WEBHOOK` secret.
    3. Run the workflow to inspect current EndpointSlice readiness across your cluster.

    ## How to extend
    - Add an automated task to describe unready pods belonging to the affected service.
    - Trigger an automated rollout restart if pods are hung in terminating states.

    ## Links
    - [Kubernetes EndpointSlices Documentation](https://kubernetes.io/docs/concepts/services-networking/endpoint-slices/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Kubernetes Operations
    - Day 2 Operations
  ee: false
  demo: false
