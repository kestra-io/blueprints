# SPDX-License-Identifier: Apache-2.0
id: couchbase-overprivileged-rbac-user-guard
namespace: company.team
description: Restore one Couchbase service user's declared bucket boundary without replacing its RBAC record.

concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: connection_string
    type: STRING
    defaults: couchbase://localhost
  - id: executor_user
    type: STRING
    defaults: "{{ secret('COUCHBASE_USERNAME') }}"
  - id: executor_password
    type: SECRET
    defaults: "{{ secret('COUCHBASE_PASSWORD') }}"
  - id: service_user
    type: STRING
    defaults: application_service
    description: One exact local service identity. Never the executor or a protected operator.
  - id: allowed_bucket
    type: STRING
    defaults: application
    description: Existing directly granted bucket_full_access permission that must survive.
  - id: denied_bucket
    type: STRING
    defaults: restricted
    description: One other bucket whose direct bucket_full_access permission must be removed.
  - id: protected_users
    type: ARRAY
    itemType: STRING
    defaults: [Administrator]
  - id: exclusive_role_writer
    type: BOOL
    defaults: false
    description: Confirm every RBAC editor suspends other changes to this user until verification finishes.
  - id: dry_run
    type: BOOL
    defaults: true
  - id: auto_remediate
    type: BOOL
    defaults: false
  - id: slack_webhook_url
    type: SECRET
    defaults: "{{ secret('SLACK_WEBHOOK_URL') }}"

variables:
  normalize: >-
    def norm: .roles |= (map(.origins |= sort_by(.type, .name)) | sort_by(.role, .bucket_name));
  policy: >-
    def norm: .roles |= (map(.origins |= sort_by(.type, .name)) | sort_by(.role, .bucket_name));
    . as $p | ($p.users | length) as $n |
    if $n != 1 then {valid:false, reason:"Expected exactly one local user", count:0, plan:[]}
    else ($p.users[0] | norm) as $u |
    ([ $u.roles[] | select(.role == "bucket_full_access" and .bucket_name == $p.allowed) ] | length) as $safe |
    ([ $u.roles[] | select((.role == "admin" and (.bucket_name // "") == "") or
       (.role == "bucket_full_access" and .bucket_name == $p.denied)) ] | sort_by(.role, .bucket_name)) as $risk |
    (($u.domain == "local") and (($u.uuid // "") | length) > 0 and $safe == 1 and
      ($u.roles | length) <= 3 and ($u.roles | length) == (1 + ($risk | length)) and
      (($u.groups // []) | length) == 0 and (($u.external_groups // []) | length) == 0 and
      all($u.roles[]; .origins == [{type:"user"}])) as $valid |
    {valid:$valid, reason:"Require direct allowed bucket grant, local UUID and only the declared removable roles",
     count:($risk | length), snapshot:$u, goal:($u | .roles -= $risk),
     plan:[range(0; ($risk | length)) as $i | $risk[$i] as $r |
       {sql:("REVOKE " + $r.role + (if $r.role == "admin" then "" else " ON `" +
          ($r.bucket_name | gsub("`"; "``")) + "`" end) + " FROM `" + ($u.id | gsub("`"; "``")) + "`"),
        before:($u | .roles -= $risk[0:$i]), after:($u | .roles -= $risk[0:($i+1)])}]} end

tasks:
  - id: validate_inputs
    type: io.kestra.plugin.core.execution.Assert
    conditions:
      - "{{ inputs.service_user != inputs.executor_user }}"
      - "{{ not (inputs.protected_users contains inputs.service_user) }}"
      - "{{ inputs.allowed_bucket != inputs.denied_bucket }}"
      - "{{ inputs.allowed_bucket != '*' and inputs.denied_bucket != '*' }}"
      - "{{ inputs.service_user | length > 0 and inputs.service_user | length <= 100 }}"
      - "{{ inputs.allowed_bucket | length > 0 and inputs.allowed_bucket | length <= 100 }}"
      - "{{ inputs.denied_bucket | length > 0 and inputs.denied_bucket | length <= 100 }}"
      - "{{ inputs.connection_string | length <= 512 }}"
    errorMessage: Invalid identity, protected user or bucket boundary.

  - id: audit
    type: io.kestra.plugin.couchbase.Query
    timeout: PT30S
    connectionString: "{{ inputs.connection_string }}"
    username: "{{ inputs.executor_user }}"
    password: "{{ inputs.executor_password }}"
    fetchType: FETCH
    query: >-
      SELECT RAW CASE WHEN ARRAY_LENGTH(u.roles) <= 3 THEN u
        ELSE {"id":u.id,"role_count":ARRAY_LENGTH(u.roles),"roles":[],"domain":u.domain} END
      FROM system:user_info AS u
      WHERE u.id = {{ inputs.service_user | toJson }} AND u.domain = "local" LIMIT 2

  - id: plan
    type: io.kestra.plugin.core.output.OutputValues
    values:
      policy: "{{ {'users': outputs.audit.rows, 'allowed': inputs.allowed_bucket, 'denied': inputs.denied_bucket} | toJson | jq(vars.policy) | first }}"

  - id: validate_policy
    type: io.kestra.plugin.core.execution.Assert
    conditions:
      - "{{ fromJson(outputs.plan.values.policy).valid ?? false }}"
    errorMessage: Unsupported user state. Keep all roles and review the user's UUID, direct grants and group membership.

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(outputs.plan.values.policy).count > 0 }}"
    then:
      - id: findings
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ inputs.slack_webhook_url }}"
        payload: >-
          {{ {'text': 'Couchbase service ' ~ inputs.service_user ~ ': ' ~ fromJson(outputs.plan.values.policy).count ~ ' direct excess role(s). Preserve ' ~ inputs.allowed_bucket ~ ', deny ' ~ inputs.denied_bucket ~ '. dry_run=' ~ inputs.dry_run ~ ', auto_remediate=' ~ inputs.auto_remediate} | toJson }}

      - id: mutate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: require_exclusive_writer
            type: io.kestra.plugin.core.execution.Assert
            conditions:
              - "{{ inputs.exclusive_role_writer }}"
            errorMessage: All RBAC editors must suspend other changes to this user until verification finishes.

          - id: approval
            type: io.kestra.plugin.core.flow.Pause
            timeout: PT15M
            description: Review the exact role plan. Confirm exclusive role editing for the full approval-to-verify window.
            onResume:
              - id: approved
                type: BOOL
                defaults: false

          - id: approved
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.approval.onResume.approved ?? false }}"
            then:
              - id: revoke_roles
                type: io.kestra.plugin.core.flow.Loop
                concurrencyLimit: 1
                values: "{{ fromJson(outputs.plan.values.policy).plan | toJson }}"
                tasks:
                  - id: reread
                    type: io.kestra.plugin.couchbase.Query
                    timeout: PT30S
                    connectionString: "{{ inputs.connection_string }}"
                    username: "{{ inputs.executor_user }}"
                    password: "{{ inputs.executor_password }}"
                    fetchType: FETCH
                    query: >-
                      SELECT RAW CASE WHEN ARRAY_LENGTH(u.roles) <= 3 THEN u
                        ELSE {"id":u.id,"role_count":ARRAY_LENGTH(u.roles),"roles":[],"domain":u.domain} END
                      FROM system:user_info AS u
                      WHERE u.id = {{ inputs.service_user | toJson }} AND u.domain = "local" LIMIT 2
                  - id: fence
                    type: io.kestra.plugin.core.execution.Assert
                    conditions:
                      - >-
                        {{ {'users': outputs.reread.rows, 'expected': fromJson(item.value).before} | toJson |
                           jq(vars.normalize ~ ' (.users | length) == 1 and ((.users[0] | norm) == .expected)') | first }}
                    errorMessage: User incarnation or role snapshot changed. Nothing further will be revoked.
                  - id: revoke
                    type: io.kestra.plugin.couchbase.Query
                    timeout: PT30S
                    connectionString: "{{ inputs.connection_string }}"
                    username: "{{ inputs.executor_user }}"
                    password: "{{ inputs.executor_password }}"
                    fetchType: NONE
                    query: "{{ fromJson(item.value).sql }}"

              - id: verify_user
                type: io.kestra.plugin.couchbase.Query
                timeout: PT30S
                connectionString: "{{ inputs.connection_string }}"
                username: "{{ inputs.executor_user }}"
                password: "{{ inputs.executor_password }}"
                fetchType: FETCH
                query: >-
                  SELECT RAW CASE WHEN ARRAY_LENGTH(u.roles) <= 3 THEN u
                    ELSE {"id":u.id,"role_count":ARRAY_LENGTH(u.roles),"roles":[],"domain":u.domain} END
                  FROM system:user_info AS u
                  WHERE u.id = {{ inputs.service_user | toJson }} AND u.domain = "local" LIMIT 2
              - id: verify_boundary
                type: io.kestra.plugin.core.execution.Assert
                conditions:
                  - >-
                    {{ {'users': outputs.verify_user.rows, 'expected': fromJson(outputs.plan.values.policy).goal} | toJson |
                       jq(vars.normalize ~ ' (.users | length) == 1 and ((.users[0] | norm) == .expected)') | first }}
                errorMessage: REVOKE did not restore the declared bucket boundary or unrelated user state changed.
              - id: restored
                type: io.kestra.plugin.core.log.Log
                message: "Verified {{ inputs.service_user }} retains only direct bucket_full_access on {{ inputs.allowed_bucket }}."
            else:
              - id: declined
                type: io.kestra.plugin.core.log.Log
                message: Approval declined. No roles changed.
        else:
          - id: dry_report
            type: io.kestra.plugin.core.log.Log
            message: "Report only. {{ fromJson(outputs.plan.values.policy).count }} excess direct role(s); no REVOKE executed."
    else:
      - id: healthy
        type: io.kestra.plugin.core.log.Log
        message: Declared bucket boundary is already present. No changes required.

errors:
  - id: failure_alert
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: >-
      {{ {'text': 'Couchbase bucket-boundary guard failed for ' ~ inputs.service_user ~ ' (execution ' ~ execution.id ~ '). Inspect applied REVOKEs and current roles before retrying.'} | toJson }}

triggers:
  - id: audit_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * *"
    disabled: true
    inputs:
      dry_run: true
      auto_remediate: false
      exclusive_role_writer: false

extend:
  title: Restore a Couchbase service user's declared bucket access
  metaTitle: Restore a Couchbase service user's declared bucket access
  shortDescription: Remove direct admin or one excess bucket grant from a declared service user after approval, preserving its required bucket role.
  metaDescription: Audit one Couchbase service UUID, preserve its required bucket grant and revoke direct excess roles after approval with snapshot checks.
  description: |
    ## How it works
    A service meant for one bucket acquired admin access or a second bucket grant during debugging. This flow reads its local RBAC record through native Query and removes only those declared excess roles. It requires the intended bucket grant to exist first.

    The plan includes the user's UUID and complete role snapshot. Approval defaults to false. Sequential writes re-read that snapshot immediately before each SQL++ REVOKE, then compare the exact remaining user record with the plan. A changed UUID, role, group, name or password timestamp fails the run.

    ## What you get
    One bounded user policy with approval history. Remove direct admin and bucket_full_access on one denied bucket while preserving the required grant and other user fields.

    ## Who it's for
    Teams using a dedicated one-bucket service account with a direct debugging grant left behind.

    ## Why orchestrate this with Kestra
    Kestra separates observation from approval, serializes this flow's executions and records each native REVOKE with its pre-write snapshot check. A failed partial pass is visible; a retry observes actual remaining roles instead of replaying an old statement list.

    ## Tested end to end
    50 final-runtime cases on Community 7.6.2: 30 on Kestra 2.0.6, 10 on 2.0.5 and 10 on a second fresh fixture. Remediation removed two direct excess roles, retained the service UUID and required bucket grant, preserved both canaries and denied the other bucket with error 13014. User administration changed from permitted to HTTP 403.

    | Case (2.0.6) | Execution | Result |
    |---|---|---|
    | Healthy | 4Iv1BE2Kipxb3Q9RUFKpnR | SUCCESS |
    | Dry run | 5BC6960lRebh3Q51ff2NMw | SUCCESS |
    | Declined | 55N6uu8bkPZLpJzWWmnoE4 | SUCCESS |
    | Remediation | 6ijm00LDKKpXTeL3lbb9Hy | SUCCESS |
    | Refused write | 5drFayyY2aqzct2Ct6rYoz | FAILED |
    | Repeat | 3zaSRbk5VUdT7plRCqLRCU | SUCCESS |
    | Changed user | 4Q04GXhf6sMP48birB1qrI | FAILED |

    ## Prerequisites
    Couchbase 7.6.2 with Query service and an exact local user UUID. SQL++ REVOKE needs Full Administrator. Unknown roles, inherited grants, wildcard buckets and group membership are refused. Community Edition uses bucket-level grants, not fine-grained scope permissions.

    The exclusive_role_writer input is a cooperative contract: every administrator must suspend other edits to this user until verification finishes. REVOKE and the prior read are not atomic. Flow concurrency does not lock console users, other flows or malicious editors. A non-cooperating editor can race within the final read/write interval. Do not use this flow without that contract.

    ### Secrets
    COUCHBASE_USERNAME and COUCHBASE_PASSWORD authenticate the executor. Password and Slack URL inputs use SECRET. SLACK_WEBHOOK_URL handles finding and failure alerts.

    ### Inputs
    service_user is one exact local application account. allowed_bucket names its required direct bucket_full_access grant; denied_bucket names one different bucket. protected_users excludes operators and the executor is always protected. dry_run defaults true, auto_remediate and exclusive_role_writer default false. Queries time out after 30 seconds and approval expires after 15 minutes.

    ## Quick start
    Store the secrets. Declare the user, both buckets and protected operators. Run in safe mode and check the allowed grant. Coordinate exclusive editing, enable remediation and disable dry run, then approve. Test required and denied access with fresh credentials. Enable the disabled schedule only with explicit user and bucket inputs; it forces safe mode.

    ## How to extend
    Add an application canary check outside this flow using fresh credentials. For Enterprise scope-level roles, define and test a separate exact role policy rather than treating every bucket role as excess.

    Limits: one local user, one required bucket and one denied bucket. Only direct admin and the declared denied-bucket grant are removed. This verifies RBAC storage, not every client's cached authorization state. It does not undo past reads or repair data changed while the user was overprivileged.

    ## Links
    - [SQL++ REVOKE](https://docs.couchbase.com/server/7.6/n1ql/n1ql-language-reference/revoke.html)
    - [Authorization](https://docs.couchbase.com/server/7.6/learn/security/authorization-overview.html)
    - [System user catalog](https://docs.couchbase.com/server/7.6/n1ql/n1ql-intro/sysinfo.html)

    This blueprint was created by [zkasuran](https://github.com/zkasuran).
  tags: [Data, Infrastructure]
  subTags: [Day 2 Operations, Approval Gates]
  ee: false
  demo: false
