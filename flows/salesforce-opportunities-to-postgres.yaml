    - [PostgreSQL Batch task](https://kestra.io/plugins/plugin-jdbc-postgres/io.kestra.plugin.jdbc.postgresql.batch)
    - [KV Store](https://kestra.io/docs/concepts/kv-store)
    - [Salesforce REST API query reference](https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/resources_query.htm)
    - [Salesforce OAuth client credentials flow](https://help.salesforce.com/s/articleView?id=sf.remoteaccess_oauth_client_credentials_flow.htm)
  tags:
    - Data
  subTags:
    - ELT & Data Landing
    - Scheduling
  ee: false
  verified: false
  demo: false
