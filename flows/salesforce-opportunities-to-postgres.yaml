id: salesforce-opportunities-to-postgres
namespace: company.analytics

inputs:
  - id: sobject
    type: STRING
    defaults: Opportunity
    description: Salesforce object to extract.

  - id: fields
    type: STRING
    defaults: Id, Name, StageName, Amount, CloseDate, AccountId, LastModifiedDate
    description: Comma-separated SOQL field list. Must match the columns bound in the load task.

  - id: batch_limit
    type: INT
    defaults: 200
    description: Maximum records pulled per run. Keep below 2000 so the SOQL response is never paginated.

  - id: target_table
    type: STRING
    defaults: sf_opportunity
    description: Destination table in Postgres.

tasks:
  - id: read_watermark
    type: io.kestra.plugin.core.kv.Get
    key: sf_opportunity_watermark
    errorOnMissing: false

  - id: get_access_token
    type: io.kestra.plugin.core.http.Request
    uri: "{{ secret('SF_DOMAIN') }}/services/oauth2/token"
    method: POST
    contentType: application/x-www-form-urlencoded
    formData:
      grant_type: client_credentials
      client_id: "{{ secret('SF_CLIENT_ID') }}"
      client_secret: "{{ secret('SF_CLIENT_SECRET') }}"

  - id: query_salesforce
    type: io.kestra.plugin.core.http.Request
    uri: "{{ secret('SF_DOMAIN') }}/services/data/v62.0/query"
    method: GET
    params:
      q: "SELECT {{ inputs.fields }} FROM {{ inputs.sobject }} WHERE LastModifiedDate > {{ outputs.read_watermark.value | default('1970-01-01T00:00:00Z') }} ORDER BY LastModifiedDate ASC LIMIT {{ inputs.batch_limit }}"
    headers:
      Authorization: "Bearer {{ fromJson(outputs.get_access_token.body).access_token }}"

  - id: has_new_records
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(outputs.query_salesforce.body).totalSize > 0 }}"
    then:
      - id: write_records
        type: io.kestra.plugin.core.storage.Write
        content: "{{ fromJson(outputs.query_salesforce.body).records | toJson }}"
        extension: .json

      - id: to_ion
        type: io.kestra.plugin.serdes.json.JsonToIon
        from: "{{ outputs.write_records.uri }}"
        newLine: false

      - id: load_batch
        type: io.kestra.plugin.jdbc.postgresql.Batch
        url: "{{ secret('POSTGRES_URL') }}"
        username: "{{ secret('POSTGRES_USERNAME') }}"
        password: "{{ secret('POSTGRES_PASSWORD') }}"
        from: "{{ outputs.to_ion.uri }}"
        columns: [Id, Name, StageName, Amount, CloseDate, AccountId, LastModifiedDate]
        sql: |
          INSERT INTO {{ inputs.target_table }}
            (id, name, stage_name, amount, close_date, account_id, last_modified_date)
          VALUES (?, ?, ?, ?::float8::numeric, ?::text::date, ?, ?::text::timestamptz)
          ON CONFLICT (id) DO UPDATE SET
            name               = EXCLUDED.name,
            stage_name         = EXCLUDED.stage_name,
            amount             = EXCLUDED.amount,
            close_date         = EXCLUDED.close_date,
            account_id         = EXCLUDED.account_id,
            last_modified_date = EXCLUDED.last_modified_date,
            synced_at          = now();

      - id: save_watermark
        type: io.kestra.plugin.core.kv.Set
        key: sf_opportunity_watermark
        value: "{{ (fromJson(outputs.query_salesforce.body).records | last).LastModifiedDate }}"
        overwrite: true

      - id: log_loaded
        type: io.kestra.plugin.core.log.Log
        message: "Loaded {{ fromJson(outputs.query_salesforce.body).totalSize }} {{ inputs.sobject }} record(s) into {{ inputs.target_table }}. Watermark advanced to {{ (fromJson(outputs.query_salesforce.body).records | last).LastModifiedDate }}."

    else:
      - id: nothing_to_sync
        type: io.kestra.plugin.core.log.Log
        message: "No {{ inputs.sobject }} records modified since {{ outputs.read_watermark.value | default('the beginning of time') }}."

errors:
  - id: report_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: |
      Salesforce to Postgres extract FAILED (execution {{ execution.id }}).
      The watermark was not advanced and remains at {{ outputs.read_watermark.value | default('(unset)') }}.
      The next run will retry the same records, so no changes have been lost.

triggers:
  - id: every_fifteen_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Extract Salesforce Opportunities into Postgres Incrementally
  metaTitle: Incremental Salesforce to Postgres Extract with Kestra
  metaDescription: Pull Salesforce records into Postgres on a schedule with Kestra. Watermarked incremental loads, idempotent upserts, and no Enterprise plugin required.
  shortDescription: Pulls Salesforce records into Postgres on a schedule using the REST API, loading only what changed since the last run and upserting so reruns never duplicate.
  description: |
    Most Salesforce extracts fail in one of two ways: they re-read the entire object on every run, or they insert rather than upsert and quietly fill the warehouse with duplicates. This blueprint does neither. It keeps a high-water mark in Kestra's KV Store, asks Salesforce only for records modified since that mark, and loads them with a batched `INSERT ... ON CONFLICT DO UPDATE` keyed on the Salesforce record id. It also uses only the open-source HTTP and JDBC plugins, so no Enterprise-tier Salesforce plugin is required.

    ## How it works

    1. The `every_fifteen_minutes` trigger (`io.kestra.plugin.core.trigger.Schedule`) starts the flow. It ships disabled so adding the blueprint never surprises you with traffic against your org.
    2. `read_watermark` (`io.kestra.plugin.core.kv.Get`) loads the newest `LastModifiedDate` from the previous successful run. `errorOnMissing: false` means the first run starts from scratch rather than failing.
    3. `get_access_token` exchanges a Connected App's client id and secret for an access token using the OAuth 2.0 client credentials grant, so the flow authenticates as a service and needs no interactive login.
    4. `query_salesforce` runs a SOQL query filtered on `LastModifiedDate > watermark`, ordered ascending and capped by `batch_limit`.
    5. `has_new_records` (`io.kestra.plugin.core.flow.If`) branches on `totalSize`. With nothing to do, the flow logs and exits rather than touching the database.
    6. `write_records` and `to_ion` stage the response as a file and convert it to Kestra's internal ION format, so the load streams instead of holding every record in the execution context.
    7. `load_batch` (`io.kestra.plugin.jdbc.postgresql.Batch`) performs one batched upsert with bound parameters.
    8. `save_watermark` advances the mark only after the load succeeds.
    9. The `errors` block reports a failure and states explicitly that the watermark did not move.

    ## What you get

    - Incremental loads: each run transfers only what changed, not the whole object.
    - Idempotent writes: reruns and replays update in place instead of duplicating, because the Salesforce record id is the primary key.
    - No data loss on failure: the watermark advances only after a successful load, so a failed run is simply retried.
    - Bound parameters rather than interpolated SQL, so nulls and apostrophes in record names are handled correctly.
    - One batched round-trip to Postgres per run instead of one statement per record.
    - No Enterprise plugin dependency: the Salesforce side is the public REST API over the core HTTP task.

    ## Who it's for

    - Analytics engineers who need CRM data in a warehouse alongside product and finance tables.
    - Revenue operations teams reporting on pipeline outside Salesforce dashboards.
    - Data platform teams on Kestra's open-source edition who need Salesforce ingestion without Enterprise plugins.

    ## Why orchestrate this with Kestra

    A cron'd script can call the Salesforce API, but it has nowhere durable to keep a watermark, no execution history when numbers look wrong, and no safe behaviour when a load half-fails. Kestra supplies the KV Store for cross-run state, a per-execution audit trail, retries, and an error path that tells an operator whether data was lost. The ordering guarantee that matters here, advancing the watermark only after a successful write, is expressed directly in the task graph.

    ## Prerequisites

    - A Salesforce org with an External Client App (or Connected App) configured for the OAuth client credentials flow, with a Run As user set.
    - A reachable PostgreSQL database.
    - A destination table. The default schema is:

      ```sql
      CREATE TABLE IF NOT EXISTS sf_opportunity (
        id                 TEXT PRIMARY KEY,
        name               TEXT,
        stage_name         TEXT,
        amount             NUMERIC,
        close_date         DATE,
        account_id         TEXT,
        last_modified_date TIMESTAMPTZ,
        synced_at          TIMESTAMPTZ NOT NULL DEFAULT now()
      );
      ```

    ### Secrets

    - `SF_DOMAIN`: your Salesforce instance URL, including the scheme, for example `https://example.my.salesforce.com`.
    - `SF_CLIENT_ID`: Consumer Key of the Connected or External Client App.
    - `SF_CLIENT_SECRET`: Consumer Secret of that app.
    - `POSTGRES_URL`: JDBC URL of the destination database, for example `jdbc:postgresql://postgres:5432/analytics`.
    - `POSTGRES_USERNAME`: Postgres user with insert and update rights on the target table.
    - `POSTGRES_PASSWORD`: that user's password.

    ## Quick start

    1. Create the destination table using the DDL above.
    2. Add the six secrets to your Kestra namespace.
    3. Execute the flow manually. The first run has no watermark, so it loads up to `batch_limit` records.
    4. Query the target table to confirm the rows landed, then execute again: the second run should take the `else` branch and report nothing to sync.
    5. Modify one record in Salesforce and execute once more. Exactly that record is re-fetched and upserted.
    6. Enable the `every_fifteen_minutes` trigger once you are satisfied with the cadence.

    ## How to extend

    - Point `sobject` and `fields` at Account, Case, or Lead, and adjust the `columns` list and target table to match. Running it once per object gives you one table each, joinable on the foreign keys Salesforce already returns: `SELECT o.name, a.name FROM sf_opportunity o LEFT JOIN sf_account a ON a.id = o.account_id`.
    - Raise `batch_limit` toward 2000. Above that the SOQL response paginates and you would need to follow `nextRecordsUrl`, which this flow does not do; for very large extracts use the Salesforce Bulk API 2.0 instead.
    - Capture deletions by querying `/services/data/v62.0/sobjects/{sobject}/deleted` and soft-deleting the matching rows.
    - Replace the Postgres load with Snowflake, BigQuery, or an object store: only the final task changes, since the watermark logic lives in Kestra rather than in the destination.
    - Add a `io.kestra.plugin.core.flow.Switch` after the load to notify a channel when high-value records change stage.

    ## Links

