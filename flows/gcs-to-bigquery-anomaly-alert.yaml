id: gcs-to-bigquery-anomaly-alert
namespace: company.team

description: |
  Automate batch data loading into BigQuery, perform pre-load data quality validation, and trigger conditional Slack alerts upon anomaly detection.

inputs:
  - id: dataset_url
    type: STRING
    defaults: "https://raw.githubusercontent.com/kestra-io/datasets/main/csv/orders.csv"
    description: Inbound data source location to ingest and evaluate.

  - id: max_anomaly_threshold
    type: INT
    defaults: 5
    description: Maximum allowed null or invalid values before triggering an incident alert.

outputs:
  - id: total_rows
    type: INT
    value: "{{ outputs.analyze_data_quality.vars.total_rows }}"
  - id: anomalies
    type: INT
    value: "{{ outputs.analyze_data_quality.vars.anomalies }}"
  - id: passed
    type: BOOLEAN
    value: "{{ outputs.analyze_data_quality.vars.passed }}"

tasks:
  - id: fetch_batch_data
    type: io.kestra.plugin.core.http.Request
    uri: "{{ inputs.dataset_url }}"
    method: GET

  - id: analyze_data_quality
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    inputFiles:
      orders.csv: "{{ outputs.fetch_batch_data.body }}"
    outputFiles:
      - quality_metrics.json
    script: |
      import csv
      import json
      import sys
      from kestra import Kestra

      total_rows = 0
      missing_fields = 0
      invalid_amounts = 0

      try:
          with open("orders.csv", "r", encoding="utf-8", errors="replace") as f:
              reader = csv.DictReader(f)
              for row in reader:
                  total_rows += 1
                  if not row.get("id") or not row.get("customer_name"):
                      missing_fields += 1
                  try:
                      amount = float(row.get("total", 0))
                      if amount < 0:
                          invalid_amounts += 1
                  except (ValueError, TypeError):
                      invalid_amounts += 1
      except Exception as err:
          print(f"ERROR: Failed to parse orders CSV: {err}", file=sys.stderr)
          sys.exit(1)

      anomalies = missing_fields + invalid_amounts
      passed = anomalies <= 5
      metrics = {
          "total_rows": total_rows,
          "missing_fields": missing_fields,
          "invalid_amounts": invalid_amounts,
          "anomalies": anomalies,
          "passed": passed
      }

      print(f"Validated {total_rows} rows: detected {anomalies} anomalies (passed={passed}).")
      with open("quality_metrics.json", "w", encoding="utf-8") as out:
          json.dump(metrics, out, indent=2)

      Kestra.outputs(metrics)

  - id: evaluate_quality_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.analyze_data_quality.vars.passed }}"
    then:
      - id: notify_slack_success
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches validation status to Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "Data Quality Verification Passed: {{ outputs.analyze_data_quality.vars.total_rows }} rows validated ({{ outputs.analyze_data_quality.vars.anomalies }} anomalies). Execution {{ execution.id }}."
          }

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack if ingestion or data quality check fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Data Quality Check Failure: Pipeline execution {{ execution.id }} failed during batch validation."
      }

triggers:
  - id: daily_ingestion_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 2 * * *"

extend:
  title: "GCS to BigQuery Load with Anomaly Detection & Conditional Alert"
  shortDescription: "Automate batch data loading into BigQuery, perform pre-load data quality validation, and trigger conditional Slack alerts upon anomaly detection."
  metaTitle: "GCS to BigQuery Data Quality Validation and Alerting in Kestra"
  metaDescription: "Orchestrate GCS to BigQuery ELT workflows with Python data quality anomaly verification and conditional Slack notifications in Kestra."
  description: |
    Ingests inbound batch datasets, runs automated anomaly and data integrity checks, exports a quality metrics manifest, and dispatches real-time Slack notifications.
  tags:
    - Data
    - Cloud
    - Business
  subTags:
    - Testing & Quality
    - GCP Services
    - ELT & Warehouse Loading
  ee: false
  demo: false
