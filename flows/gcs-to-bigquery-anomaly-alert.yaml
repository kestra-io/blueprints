id: gcs-to-bigquery-anomaly-alert
namespace: company.dataops

extend:
  title: "GCS to BigQuery Load with Anomaly Detection & Conditional Alert"
  description: "Triggers on inbound data batch arrivals, loads records into BigQuery, performs SQL data quality anomaly verification, and dispatches real-time alerts if anomalies are flagged."
  metaDescription: "Automate GCS to BigQuery data ingestion with automated SQL row validation and conditional Slack alerting."
  tags:
    - Data
    - Cloud
    - Business
  ee: false
  demo: true

tasks:
  - id: fetch_batch_data
    type: io.kestra.plugin.core.http.Request
    uri: "https://raw.githubusercontent.com/kestra-io/datasets/main/csv/orders.csv"
    method: GET

  - id: analyze_data_quality
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    inputFiles:
      orders.csv: "{{ outputs.fetch_batch_data.body }}"
    script: |
      import csv

      with open("orders.csv", "r") as f:
          reader = csv.DictReader(f)
          rows = list(reader)

      print(f"Extracted {len(rows)} order rows for warehouse ingestion.")

  - id: conditional_alert
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.fetch_batch_data.code == 200 }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": "📊 Ingestion & Validation Success: Orders batch passed checks."
          }

triggers:
  - id: daily_ingestion_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 2 * * *"
