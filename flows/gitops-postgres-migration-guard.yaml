      "risk_score": 10,
      "lock_level": "SHARE_UPDATE_EXCLUSIVE",
      "detected_anti_patterns": [],
      "has_breaking_changes": false,
      "safe_rewrites": [],
      "anti_pattern_count": 0,
      "statements_analyzed": 2
    }
    ```

    Slack notification dispatched:
    ```text
    PASSED: PostgreSQL Migration Certified Safe for PR #101
    Repository: company/core-backend
    Commit SHA: HEAD
    Risk Score: 10/100
    Lock Mode: SHARE_UPDATE_EXCLUSIVE
    Transactional Dry-Run: Succeeded with ROLLBACK
    Status: Approved for production deploy.
    ```

    ### High-Risk Migration (Blocked)

    When auditing migrations containing anti-patterns (such as retyping a column, non-concurrent index creation, unindexed foreign key, and circular RLS policy):

    ```json
