      "statements_analyzed": 4
    }
    ```

    ## GitHub Actions CI/CD Integration Runbook

    Add this GitHub Actions step to your pull request workflow (`.github/workflows/db-migration-check.yml`) to automatically trigger verification on every migration PR:

    ```yaml
    name: Database Migration Guard
    on:
      pull_request:
        paths:
          - 'migrations/**.sql'
          - 'db/migrations/**.sql'

    jobs:
      verify-migration:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Concatenate Migration SQL Changes
            id: extract_sql
            run: |
              MIGRATION_CONTENT=$(git diff origin/main...HEAD -- 'migrations/*.sql' | grep '^+[^+]' | sed 's/^+//' || cat migrations/*.sql)
              echo "migration_payload<<EOF" >> $GITHUB_ENV
              echo "$MIGRATION_CONTENT" >> $GITHUB_ENV
              echo "EOF" >> $GITHUB_ENV

          - name: Trigger Kestra Migration Guard Webhook
            run: |
              curl -X POST "https://kestra.example.com/api/v1/executions/webhook/company.team/gitops-postgres-migration-guard/${{ secrets.MIGRATION_WEBHOOK_KEY }}" \
                -H "Content-Type: application/json" \
                -d '{
                  "pr_number": ${{ github.event.pull_request.number }},
                  "repo_full_name": "${{ github.repository }}",
                  "commit_sha": "${{ github.sha }}",
                  "migration_sql": ${{ toJson(env.migration_payload) }},
                  "max_allowed_lock_level": "SHARE_UPDATE_EXCLUSIVE",
                  "alert_channel": "#database-ops"
                }'
    ```

    ## Quick Start

    1. Configure the three required secrets (`STAGING_POSTGRES_URL`, `SLACK_WEBHOOK_URL`, `MIGRATION_WEBHOOK_KEY`) in your Kestra namespace (`company.team`).
    2. Deploy this blueprint YAML file to your Kestra instance.
    3. Trigger a manual execution in the Kestra UI using the default inputs to test the happy path.
    4. Verify that the execution runs the static analyzer, performs the dry-run with rollback, and posts an approval certificate to Slack.
    5. Test a high-risk migration by passing `ALTER TABLE users DROP COLUMN email;` and verify that the gate blocks execution and dispatches an emergency Slack alert.

    ## How to Extend

    - **GitHub PR Status Checks:** Add an `io.kestra.plugin.core.http.Request` task in the `post_pr_review_approval` block to set GitHub Commit Status Check (`state: success`) or leave an automated review comment.
    - **Schema Diff Comparison:** Integrate `pg-dump` or `Atlas` CLI to generate a visual ERD diff artifact comparing pre-migration and post-migration staging catalogs.
    - **Lock Timeout Enforcement:** Prepend `SET lock_timeout = '2s';` to the migration payload in staging and production to guarantee statements fail fast instead of queuing up behind conflicting locks.
    - **Liquibase / Flyway Integration:** Connect to Flyway or Liquibase metadata tables (`schema_version`) to verify version number sequence ordering before executing DDL.

