      "risk_score": 100,
      "lock_level": "ACCESS_EXCLUSIVE",
      "detected_anti_patterns": [
        {
          "code": "COLUMN_RETYPE_ACCESS_EXCLUSIVE",
          "statement": "ALTER TABLE orders ALTER COLUMN amount TYPE NUMERIC(18, 4)",
          "severity": "CRITICAL",
          "description": "Altering column type acquires ACCESS EXCLUSIVE lock and forces complete table rewrite.",
          "remediation": "Add new column with target type, backfill asynchronously in batches, and switch application write paths."
        },
        {
          "code": "INDEX_MISSING_CONCURRENTLY",
          "statement": "CREATE INDEX idx_orders_customer ON orders(customer_id)",
          "severity": "HIGH",
          "description": "CREATE INDEX without CONCURRENTLY acquires SHARE lock, blocking concurrent INSERT, UPDATE, and DELETE operations.",
          "remediation": "Use CREATE INDEX CONCURRENTLY IF NOT EXISTS to build index online without blocking production writes."
        },
        {
          "code": "FOREIGN_KEY_UNINDEXED",
          "statement": "ALTER TABLE order_items ADD CONSTRAINT fk_order FOREIGN KEY (order_id) REFERENCES orders(id)",
          "severity": "HIGH",
          "description": "Foreign key on order_items(order_id) references orders without supporting index, risking table-level locks during parent deletions and updates.",
          "remediation": "Add supporting index: CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_order_items_order_id ON order_items(order_id);"
        },
        {
          "code": "CIRCULAR_RLS_RECURSION_RISK",
          "statement": "CREATE POLICY tenant_isolation_policy ON tenant_documents USING (tenant_id IN (SELECT id FROM accounts WHERE owner_id = current_user))",
          "severity": "HIGH",
          "description": "Policy tenant_isolation_policy on tenant_documents contains cross-table subquery without SECURITY DEFINER wrapper, risking circular RLS recursion.",
          "remediation": "Wrap authorization lookup in a SECURITY DEFINER function with strict search_path, or use session variables (current_setting)."
        },
        {
          "code": "LOCK_LEVEL_EXCEEDED",
          "statement": "Global Migration Lock Evaluation",
          "severity": "CRITICAL",
          "description": "Maximum detected lock level ACCESS_EXCLUSIVE exceeds allowed threshold SHARE_UPDATE_EXCLUSIVE.",
          "remediation": "Refactor migration DDL to acquire only SHARE_UPDATE_EXCLUSIVE or lower."
        }
      ],
      "has_breaking_changes": true,
      "safe_rewrites": [
        "Expand/contract: Add new typed column, backfill via batch UPDATEs, switch application dual-write.",
        "Replace CREATE INDEX with CREATE INDEX CONCURRENTLY IF NOT EXISTS.",
        "CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_order_items_order_id ON order_items(order_id);",
        "Encapsulate policy subqueries on tenant_documents inside a SECURITY DEFINER function."
      ],
