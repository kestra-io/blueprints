id: robots-txt-policy-audit
namespace: company.team
description: |
  Fetch robots.txt, verify required directives and disallowed paths, and keep
  a machine-readable compliance report with optional Slack notification.
triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * *"
    disabled: true
inputs:
  - id: robots_url
    type: STRING
    description: Full robots.txt URL to inspect.
    defaults: https://example.com/robots.txt
    required: true
  - id: required_directives
    type: JSON
    description: Directive strings that must appear in the file.
    defaults: '["User-agent: *", "Sitemap:"]'
    required: true
  - id: notify_slack
    type: BOOL
    description: Alert Slack when directives are missing or fetch fails.
    defaults: true
tasks:
  - id: audit_robots
    type: io.kestra.plugin.scripts.python.Script
    description: Download robots.txt and compare its content with required directives.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      URL: "{{ inputs.robots_url }}"
      REQUIRED: "{{ inputs.required_directives | toJson }}"
    script: |
      import json, os, urllib.error, urllib.request
      url = os.environ["URL"]
      required = json.loads(os.environ["REQUIRED"])
      error = None
      status = None
      content = ""
      try:
          with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "kestra-robots-policy-audit"}), timeout=20) as response:
              status, content = response.status, response.read(200000).decode("utf-8", errors="replace")
      except (urllib.error.URLError, TimeoutError, OSError) as exc:
          error = f"{type(exc).__name__}: {exc}"
      missing = [directive for directive in required if directive.lower() not in content.lower()]
      if error:
          missing.append(error)
      report = {"url": url, "status": status, "missing": missing, "passed": not missing}
      print("::" + json.dumps({"outputs": {"report": report, "failed_count": len(missing)}}) + "::")
  - id: write_report
    type: io.kestra.plugin.core.storage.Write
    description: Persist the robots policy result.
    content: "{{ outputs.audit_robots.vars.report | toJson }}"
    extension: ".json"
  - id: alert_if_failed
    type: io.kestra.plugin.core.flow.If
    description: Notify when robots.txt no longer matches the expected policy.
    condition: "{{ outputs.audit_robots.vars.failed_count > 0 and inputs.notify_slack }}"
    then:
      - id: alert_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: "robots.txt audit failed for {{ inputs.robots_url }}: {{ outputs.audit_robots.vars.report.missing | join(', ') }}. Evidence: {{ outputs.write_report.uri }}"
outputs:
  - id: report
    type: URI
    value: "{{ outputs.write_report.uri }}"
  - id: failed_count
    type: INT
    value: "{{ outputs.audit_robots.vars.failed_count }}"
extend:
  title: Robots.txt Policy Audit
  shortDescription: Validate robots.txt directives and sitemap presence on a schedule.
  metaTitle: Automated Robots.txt Policy and Sitemap Audit
  metaDescription: Fetch robots.txt, validate required directives, save evidence, and alert Slack on policy drift.
  description: |
    Prevent accidental SEO regressions by checking robots.txt as part of
    scheduled operations. Configure `robots_url` and the JSON list
    `required_directives`; matching is case-insensitive. A failed fetch is
    treated as a failed audit rather than a clean result.

    Prerequisites: outbound HTTPS access and `SLACK_WEBHOOK_URL` for alerts.
    Run manually before enabling the daily schedule. The `report` URI contains
    the response status and missing directives.

    Links: [Python Script](https://kestra.io/plugins/plugin-script-python),
    [Slack](https://kestra.io/plugins/plugin-notifications-slack).
  tags: [Infrastructure, Core]
  ee: false
  demo: true
