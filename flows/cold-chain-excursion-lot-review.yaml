id: cold-chain-excursion-lot-review
namespace: lotline.demo
description: >-
  Synthetic-first cold-chain review flow. Deterministic evaluation scopes candidate
  lots from supplied evidence, then pauses for a structured human sample decision.

inputs:
  - id: event_json
    type: JSON
    required: false
    description: Optional canonical JSON event. Use this or event_file for a manual execution; webhook requests take precedence.
  - id: event_file
    type: FILE
    required: false
    description: Optional canonical JSON file for a manual execution. The file must use schemaVersion 1.0.
  - id: ai_mode
    type: SELECT
    required: true
    defaults: template
    values:
      - template
      - external_synthetic
    description: external_synthetic is permitted only when the complete event matches the supplied sample fixture fingerprint.

tasks:
  - id: evaluate_event
    type: io.kestra.plugin.scripts.python.Script
    description: Validate and normalize the event, apply the supplied policy, retain data-quality gaps, and deterministically scope candidate lots.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.13-slim
    dependencies:
      - kestra
    inputFiles:
      source_event.json: "{{ inputs.event_file ?? '' }}"
    env:
      WEBHOOK_BODY: "{{ trigger is defined ? (trigger.body | toJson) : '' }}"
      INPUT_JSON: "{{ inputs.event_json | toJson }}"
    script: |
      import json
      import hashlib
      import math
      import os
      from datetime import datetime
      import re
      from kestra import Kestra

      def parse_timestamp(value, label):
          if not isinstance(value, str) or not re.search(r"(?:Z|[+-]\d{2}:\d{2})$", value):
              raise ValueError(f"{label} must include a UTC offset or Z timezone.")
          try:
              parsed = datetime.fromisoformat(value.replace("Z", "+00:00"))
          except ValueError as exc:
              raise ValueError(f"{label} is not a valid timestamp.") from exc
          if parsed.tzinfo is None:
              raise ValueError(f"{label} must include a timezone.")
          return parsed

      def celsius(value, unit, label):
          if not isinstance(value, (int, float)) or isinstance(value, bool) or not math.isfinite(value):
              raise ValueError(f"{label} must be numeric.")
          if unit == "C":
              return float(value)
          if unit == "F":
              return (float(value) - 32) * 5 / 9
          raise ValueError(f"Unsupported temperature unit for {label}: {unit}.")

      raw = os.environ.get("WEBHOOK_BODY", "")
      if not raw or raw == "null":
          raw = os.environ.get("INPUT_JSON", "")
      if not raw or raw == "null":
          try:
              with open("source_event.json", "r", encoding="utf-8") as source:
                  raw = source.read()
          except FileNotFoundError:
              raw = ""
      try:
          event = json.loads(raw) if raw else None
          if isinstance(event, str):
              event = json.loads(event)
      except json.JSONDecodeError as exc:
          raise ValueError("The event must be valid JSON.") from exc
      if not isinstance(event, dict):
          raise ValueError("Provide one canonical event through the webhook, event_json, or event_file input.")
      fixture_candidate = dict(event)
      fixture_candidate.pop("aiMode", None)
      fixture_fingerprint = hashlib.sha256(json.dumps(fixture_candidate, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")).hexdigest()
      synthetic_fixture_verified = (
          event.get("syntheticFixtureId") == "lotline-cold-chain-fixture-v1"
          and fixture_fingerprint == "57143c761da4a72a688c4e627d9a81b062b5ac15cff8a671dc1023aef028833d"
      )
      if event.get("schemaVersion") != "1.0":
          raise ValueError("Unsupported schemaVersion. This flow accepts 1.0.")
      if event.get("sourceAdapter") not in ("webhook", "file"):
          raise ValueError("sourceAdapter must be webhook or file.")
      event_id = event.get("eventId")
      sensor_id = event.get("sensorId")
      if not event_id or not sensor_id or not event.get("receivedAt"):
          raise ValueError("eventId, sensorId, and receivedAt are required.")
      if not event.get("shipmentId") and not event.get("containerId"):
          raise ValueError("At least one shipmentId or containerId is required for lot scope.")
      parse_timestamp(event["receivedAt"], "receivedAt")
      readings_in = event.get("readings")
      if not isinstance(readings_in, list) or not readings_in:
          raise ValueError("At least one reading is required.")
      if any(not isinstance(item, dict) for item in readings_in):
          raise ValueError("Every reading must be a JSON object.")
      source_policy = event.get("productPolicy")
      if not isinstance(source_policy, dict):
          raise ValueError("A supplied productPolicy is required; no policy is inferred.")
      if not source_policy.get("policyId") or not source_policy.get("version") or not source_policy.get("sourceRef"):
          raise ValueError("Policy ID, version, and sourceRef are required.")
      policy_unit = source_policy.get("unit")
      low = celsius(source_policy.get("lowerBound"), policy_unit, "policy lowerBound")
      high = celsius(source_policy.get("upperBound"), policy_unit, "policy upperBound")
      max_gap = source_policy.get("maxSampleGapMinutes")
      if low >= high or not isinstance(max_gap, (int, float)) or isinstance(max_gap, bool) or not math.isfinite(max_gap) or max_gap <= 0:
          raise ValueError("Policy bounds or maximum sample gap are invalid.")
      effective_from = parse_timestamp(source_policy.get("effectiveFrom"), "policy effectiveFrom")
      effective_to = parse_timestamp(source_policy.get("effectiveTo"), "policy effectiveTo")
      if effective_from >= effective_to:
          raise ValueError("Policy effective period is invalid.")

      warnings = []
      seen_ids, seen_times = set(), set()
      prior_time = None
      out_of_order = 0
      duplicate_count = 0
      readings = []
      for item in readings_in:
          reading_id = item.get("readingId")
          if not reading_id:
              raise ValueError("Every reading requires a source readingId.")
          observed = parse_timestamp(item.get("observedAt"), f"reading {reading_id} observedAt")
          timestamp = observed.timestamp()
          if reading_id in seen_ids or timestamp in seen_times:
              duplicate_count += 1
          if prior_time is not None and timestamp < prior_time:
              out_of_order += 1
          seen_ids.add(reading_id)
          seen_times.add(timestamp)
          prior_time = timestamp
          value_c = celsius(item.get("value"), item.get("unit"), f"reading {reading_id}")
          policy_applicable = effective_from <= observed <= effective_to
          if not policy_applicable:
              warnings.append(f"Reading {reading_id} falls outside the policy effective period.")
          band = "OUTSIDE_POLICY_PERIOD" if not policy_applicable else "LOW" if value_c < low else "HIGH" if value_c > high else "IN"
          readings.append({"readingId": reading_id, "observedAt": item["observedAt"], "sourceValue": item["value"], "sourceUnit": item["unit"], "normalizedCelsius": round(value_c, 4), "band": band, "policyApplicable": policy_applicable, "outOfRange": band in ("LOW", "HIGH")})
      if duplicate_count:
          warnings.append(f"{duplicate_count} duplicate reading ID or timestamp(s) remain visible.")
      if out_of_order:
          warnings.append(f"{out_of_order} out-of-order reading(s) remain visible.")
      ordered = sorted(readings, key=lambda item: parse_timestamp(item["observedAt"], "reading timestamp"))
      gaps = [(parse_timestamp(b["observedAt"], "reading timestamp") - parse_timestamp(a["observedAt"], "reading timestamp")).total_seconds() / 60 for a, b in zip(ordered, ordered[1:])]
      max_observed_gap = max(gaps, default=0)
      if max_observed_gap > max_gap:
          warnings.append(f"Observed gap {max_observed_gap:.0f} minutes exceeds the configured {max_gap}-minute limit; no values were interpolated.")

      excursions = []
      current = None
      for index, reading in enumerate(ordered):
          gap_too_large = index > 0 and gaps[index - 1] > max_gap
          if gap_too_large and current:
              excursions.append(current)
              current = None
          if not reading["policyApplicable"]:
              if current:
                  excursions.append(current)
                  current = None
              continue
          if not reading["outOfRange"]:
              if current:
                  current["endAt"] = reading["observedAt"]
                  current["endIsObservedOnly"] = False
                  excursions.append(current)
                  current = None
              continue
          if not current or current["kind"] != reading["band"]:
              if current:
                  current["endIsObservedOnly"] = True
                  excursions.append(current)
              current = {"kind": reading["band"], "startAt": reading["observedAt"], "endAt": reading["observedAt"], "peakCelsius": reading["normalizedCelsius"], "endIsObservedOnly": True, "evidenceIds": [reading["readingId"]]}
          else:
              current["endAt"] = reading["observedAt"]
              current["evidenceIds"].append(reading["readingId"])
              current["peakCelsius"] = max(current["peakCelsius"], reading["normalizedCelsius"]) if current["kind"] == "HIGH" else min(current["peakCelsius"], reading["normalizedCelsius"])
      if current:
          excursions.append(current)

      first_time, last_time = ordered[0]["observedAt"], ordered[-1]["observedAt"]
      shipment, container, location = event.get("shipmentId"), event.get("containerId"), event.get("locationId")
      inventory = event.get("inventorySnapshot") or []
      if not isinstance(inventory, list):
          raise ValueError("inventorySnapshot must be an array of supplied lot records.")
      for lot in inventory:
          if not isinstance(lot, dict) or not lot.get("lotId") or not lot.get("locationId") or not lot.get("sourceRef"):
              raise ValueError("Each inventory record requires lotId, locationId, and sourceRef.")
      candidate_lots = []
      for lot in inventory:
          lot_start, lot_end = parse_timestamp(lot.get("from"), f"inventory {lot.get('lotId')} from"), parse_timestamp(lot.get("to"), f"inventory {lot.get('lotId')} to")
          link_match = bool((shipment and lot.get("shipmentId") == shipment) or (container and lot.get("containerId") == container))
          location_match = bool(location and lot.get("locationId") == location)
          time_match = lot_start <= parse_timestamp(last_time, "last reading") and lot_end >= parse_timestamp(first_time, "first reading")
          if not link_match:
              scope, code, reason = "EXCLUDED", "NO_LINK_MATCH", "No shipment or container key matches the event."
          elif not location_match:
              scope, code, reason = "EXCLUDED", "LOCATION_MISMATCH", "The recorded location does not match the event."
          elif not time_match:
              scope, code, reason = "EXCLUDED", "OUTSIDE_EVENT_WINDOW", "The lot window does not overlap the observed event window."
          else:
              scope, code, reason = "CANDIDATE", "MATCHED_LINK_LOCATION_TIME", "Shipment or container, location, and observed event window match."
          candidate_lots.append({"lotId": lot.get("lotId"), "scope": scope, "reasonCode": code, "reason": reason, "sourceRef": lot.get("sourceRef")})

      evidence_ids = [event_id, source_policy["sourceRef"]]
      evidence_ids.extend(lot["sourceRef"] for lot in event.get("inventorySnapshot") or [] if lot.get("sourceRef"))
      calibration = event.get("calibrationReference") or {}
      if calibration.get("sourceRef"):
          evidence_ids.append(calibration["sourceRef"])
      unknowns = list(warnings)
      if not calibration.get("sourceRef"):
          unknowns.append("Calibration reference was not supplied.")
      if not location:
          unknowns.append("Location link is missing; candidate scope cannot be complete.")
      if not event.get("inventorySnapshot"):
          unknowns.append("Inventory snapshot is missing; candidate scope cannot be complete.")
      candidates = [lot for lot in candidate_lots if lot["scope"] == "CANDIDATE"]
      if not candidates:
          unknowns.append("No lot matched all required shipment or container, location, and time checks.")
      if any(item["endIsObservedOnly"] for item in excursions):
          unknowns.append("At least one excursion has no observed in-range recovery reading.")
      scope_incomplete = not location or not event.get("inventorySnapshot") or not candidates
      coverage_incomplete = bool(warnings) or len(readings) < 2
      state = "SCOPE_INCOMPLETE" if scope_incomplete else "REVIEW_REQUIRED" if unknowns or coverage_incomplete else "REVIEW_READY"
      applicable_readings = [item for item in readings if item["policyApplicable"]]
      peak = max((item["peakCelsius"] for item in excursions), default=max((item["normalizedCelsius"] for item in applicable_readings), default=None))
      if excursions:
          interval_text = "; ".join(f"{item['kind']} {item['startAt'][11:16]}–{item['endAt'][11:16]} UTC" for item in excursions)
      elif any(not item["policyApplicable"] for item in readings):
          interval_text = "policy coverage incomplete; readings fall outside the effective period"
      else:
          interval_text = "no out-of-range readings observed"
      candidate_names = [lot["lotId"] for lot in candidates]
      lot_text = " and ".join(candidate_names) if candidate_names else "no candidate lots matched the supplied records"
      calibration_text = "The calibration record was not supplied." if not calibration.get("sourceRef") else "A calibration reference was supplied; its validity still requires human review."
      peak_text = f", with an observed policy-applicable peak of {peak:.1f}°C." if peak is not None else ". No policy-applicable reading was available for a peak comparison."
      template = f"{event_id} records {interval_text}{peak_text} The supplied shipment, location, and time records identify {lot_text} as candidate lots. {calibration_text} This source-linked template is for human review and does not select a disposition."
      result = {
          "syntheticFixtureId": "lotline-cold-chain-fixture-v1" if synthetic_fixture_verified else "",
          "syntheticFixtureVerified": synthetic_fixture_verified,
          "eventId": event_id,
          "state": state,
          "assessment": "EXCURSION_OBSERVED" if excursions else "POLICY_COVERAGE_INCOMPLETE" if any(not item["policyApplicable"] for item in readings) else "NO_EXCURSION_OBSERVED",
          "policy": {"policyId": source_policy["policyId"], "version": source_policy["version"], "lowerBoundCelsius": low, "upperBoundCelsius": high, "sourceRef": source_policy["sourceRef"]},
          "readings": readings,
          "excursions": excursions,
          "candidateLots": candidate_lots,
          "evidenceIds": list(dict.fromkeys(evidence_ids)),
          "unknowns": unknowns,
          "warnings": warnings,
          "coverage": "INCOMPLETE" if coverage_incomplete else "COMPLETE",
          "maxObservedGapMinutes": round(max_observed_gap, 2),
          "templateDraft": template,
      }
      Kestra.outputs(result)

  - id: draft_mode
    type: io.kestra.plugin.core.flow.If
    description: Use the deterministic template by default. Only an explicitly requested Lotline synthetic fixture may reach the external model.
    condition: "{{ outputs.evaluate_event.vars.syntheticFixtureVerified == true and ((trigger is defined and trigger.body is defined and trigger.body.aiMode == 'external_synthetic') or (trigger is not defined and inputs.ai_mode == 'external_synthetic')) }}"
    then:
      - id: external_draft
        type: io.kestra.plugin.openai.ChatCompletion
        description: Draft source-linked wording from the already evaluated synthetic evidence; this task cannot alter policy, scope, or disposition.
        apiKey: "{{ secret('LOTLINE_AI_API_KEY') }}"
        model: gpt-4o-mini
        prompt: |
          Return JSON only with keys "text" and "citations" (an array of strings). Write a short, neutral draft for human review using only the supplied deterministic fields. Do not infer product safety, change policy, change candidate lot scope, or choose a disposition. Every citation must exactly match one of the allowed evidence IDs. If the evidence has unknowns, state that clearly.

          Allowed evidence IDs: {{ outputs.evaluate_event.vars.evidenceIds | toJson }}
          Deterministic evaluation: {{ outputs.evaluate_event.vars | toJson }}
      - id: validate_external_draft
        type: io.kestra.plugin.scripts.python.Script
        description: Reject unsupported citations and return a labelled template fallback when the model response is malformed or cites unknown evidence.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: python:3.13-slim
        dependencies:
          - kestra
        env:
          MODEL_TEXT: "{{ outputs.external_draft.choices | jq('.[].message.content') | first }}"
          EVALUATION_JSON: "{{ outputs.evaluate_event.vars | toJson }}"
        script: |
          import json
          import os
          from kestra import Kestra
          evaluation = json.loads(os.environ["EVALUATION_JSON"])
          text = evaluation["templateDraft"]
          citations = evaluation["evidenceIds"]
          mode = "template_fallback"
          try:
              model = json.loads(os.environ.get("MODEL_TEXT", ""))
              candidate_text = model.get("text")
              candidate_citations = model.get("citations")
              citations_are_valid = (
                  isinstance(candidate_citations, list)
                  and bool(candidate_citations)
                  and all(isinstance(item, str) and item.strip() and item in evaluation["evidenceIds"] for item in candidate_citations)
                  and len(set(candidate_citations)) == len(candidate_citations)
              )
              if isinstance(candidate_text, str) and candidate_text.strip() and citations_are_valid:
                  text = candidate_text.strip()
                  citations = candidate_citations
                  mode = "external_synthetic"
          except (json.JSONDecodeError, AttributeError, TypeError):
              pass
          Kestra.outputs({"draftMode": mode, "draftText": text, "draftCitations": citations})
    else:
      - id: deterministic_draft
        type: io.kestra.plugin.core.output.OutputValues
        description: Return the source-linked deterministic template without calling an external provider.
        values:
          draftMode: template
          draftText: "{{ outputs.evaluate_event.vars.templateDraft }}"
          draftCitations: "{{ outputs.evaluate_event.vars.evidenceIds }}"
    errors:
      - id: provider_error_fallback
        type: io.kestra.plugin.core.output.OutputValues
        description: Recover from a provider error with the deterministic template and label the fallback.
        values:
          draftMode: template_fallback
          draftText: "{{ outputs.evaluate_event.vars.templateDraft }}"
          draftCitations: "{{ outputs.evaluate_event.vars.evidenceIds }}"

  - id: prepare_review
    type: io.kestra.plugin.core.output.OutputValues
    description: Assemble the review payload from deterministic evaluation and the selected draft path.
    values:
      eventId: "{{ outputs.evaluate_event.vars.eventId }}"
      state: "{{ outputs.evaluate_event.vars.state }}"
      assessment: "{{ outputs.evaluate_event.vars.assessment }}"
      policy: "{{ outputs.evaluate_event.vars.policy }}"
      readings: "{{ outputs.evaluate_event.vars.readings }}"
      excursions: "{{ outputs.evaluate_event.vars.excursions }}"
      candidateLots: "{{ outputs.evaluate_event.vars.candidateLots }}"
      evidenceIds: "{{ outputs.evaluate_event.vars.evidenceIds }}"
      unknowns: "{{ outputs.evaluate_event.vars.unknowns }}"
      coverage: "{{ outputs.evaluate_event.vars.coverage }}"
      draftMode: "{{ outputs.validate_external_draft.vars.draftMode ?? outputs.deterministic_draft.values.draftMode ?? outputs.provider_error_fallback.values.draftMode ?? 'template' }}"
      draftText: "{{ outputs.validate_external_draft.vars.draftText ?? outputs.deterministic_draft.values.draftText ?? outputs.provider_error_fallback.values.draftText ?? outputs.evaluate_event.vars.templateDraft }}"
      draftCitations: "{{ outputs.validate_external_draft.vars.draftCitations ?? outputs.deterministic_draft.values.draftCitations ?? outputs.provider_error_fallback.values.draftCitations ?? outputs.evaluate_event.vars.evidenceIds }}"

  - id: await_human_review
    type: io.kestra.plugin.core.flow.Pause
    description: Stop for an explicit structured sample choice and rationale. No downstream system is called.
    onResume:
      - id: decision
        type: SELECT
        displayName: Simulated review choice
        description: Illustrative only; not an operational disposition.
        values:
          - hold
          - escalate
          - simulated_release
      - id: rationale
        type: STRING
        displayName: Reviewer rationale
        description: Brief synthetic sample rationale.

  - id: record_review_result
    type: io.kestra.plugin.core.output.OutputValues
    description: Record the human resume values in final execution outputs without invoking an inventory or quality system.
    values:
      eventId: "{{ outputs.prepare_review.values.eventId }}"
      evaluationState: "{{ outputs.prepare_review.values.state }}"
      draftMode: "{{ outputs.prepare_review.values.draftMode }}"
      draftText: "{{ outputs.prepare_review.values.draftText }}"
      draftCitations: "{{ outputs.prepare_review.values.draftCitations }}"
      decision: "{{ outputs.await_human_review.onResume.decision }}"
      rationale: "{{ outputs.await_human_review.onResume.rationale }}"
      resumedBy: "{{ outputs.await_human_review.resumed.by }}"
      resumedOn: "{{ outputs.await_human_review.resumed.on }}"
      downstreamAction: none

triggers:
  - id: synthetic_event_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('LOTLINE_KESTRA_WEBHOOK_KEY') }}"
    description: Accept a canonical JSON event. The included web demo sends only its built-in synthetic fixture.
    allowConcurrent: true

outputs:
  - id: review_result
    type: JSON
    value: "{{ outputs.record_review_result.values }}"

labels:
  project: lotline
  data_class: synthetic_only

extend:
  title: Cold-Chain Event to Evidence-Linked Lot Review
  metaTitle: Cold-Chain Event-to-Lot Evidence Review | Kestra
  shortDescription: Complement sensor-log monitoring with evidence-linked candidate-lot scope and a structured human review pause.
  metaDescription: Map synthetic cold-chain events to candidate lots, show evidence gaps, and pause for a human review decision.
  description: |
    Complements daily sensor-log checks by mapping events to evidence-linked lots and pausing for human review. Supplied policy and shipment/container, location, and time records drive scope; no inventory is changed.

    ## How it works
    1. The authenticated Webhook or manual `event_json` / `event_file` receives schema 1.0 JSON.
    2. `evaluate_event` validates timestamps, units, and policy; preserves source values, gaps, duplicates, and order; and matches each lot by shipment/container, location, and window overlap with an exclusion reason. It never fills gaps.
    3. `If` defaults to a deterministic draft. Optional OpenAI requires the complete sample SHA-256; citations must be unique, non-empty, and allowlisted. Errors fall back to a template.
    4. `Pause` records a human choice and rationale; it triggers no inventory or quality action.

    ## What you get
    - Normalized readings, excursions, evidence gaps, and reasoned candidate-lot scope.
    - A cited draft and a recorded human resume, without automated disposition.

    ## Who it's for
    Kestra builders prototyping evidence-linked cold-chain lot review.

    ## Why orchestrate this with Kestra
    One execution records validation, branching, pause/resume, and the review result.

    ## Prerequisites
    Kestra with the Python Script and OpenAI plugins, and a Docker-capable worker.

    ### Secrets
    - `LOTLINE_KESTRA_WEBHOOK_KEY`: webhook authentication.
    - `LOTLINE_AI_API_KEY`: optional OpenAI key for the exact sample only.

    ## Inputs
    `event_json` (JSON) or `event_file` (FILE) accepts one schema 1.0 event; Webhook accepts the same body. `ai_mode` (SELECT) is `template` by default or `external_synthetic` for the exact sample.

    ## Outputs
    `outputs.review_result` contains state, evidence, draft, human decision/rationale, resume metadata, and `downstreamAction: none` after resume.

    ## Quick start
    1. Set the Webhook secret; add the OpenAI key only for the optional sample path.
    2. Run the linked sample as `event_file` / `event_json`, or POST it to the Webhook.
    3. Confirm `PAUSED`, resume with a choice and rationale, inspect `review_result`.

    ## Safety boundary
    Synthetic prototype only; no safety, regulatory, validation, GxP, or compliance claim. A human decides. Candidate lots define review scope; no release, quarantine, recall, QMS, WMS, ERP, or inventory action runs.

    ## How to extend
    - Add reviewed source adapters and verifiable evidence links.
    - Add notifications before the human pause.

    ## Links
    - [Sample fixture](https://github.com/kestra-io/blueprints/blob/main/flows/cold-chain-excursion-lot-review.sample.json)
    - [Python Script](https://kestra.io/plugins/plugin-script-python/io.kestra.plugin.scripts.python.script)
    - [OpenAI ChatCompletion](https://kestra.io/plugins/plugin-openai/io.kestra.plugin.openai.chatcompletion)
    - [Core plugins](https://kestra.io/plugins/core)
    - Existing [cold-chain sensor-log blueprint](https://github.com/kestra-io/blueprints/blob/main/flows/cold-chain-temperature-excursions.yaml)
  tags:
    - Data
    - AI
  subTags:
    - Monitoring & Alerting
    - Policy & Compliance
  ee: false
  demo: false
