id: weaviate-stale-vector-eviction-guard
namespace: company.team

inputs:
  - id: weaviate_url
    type: STRING
    defaults: http://localhost:8080
    description: Weaviate endpoint, scheme and host with port. Example http://localhost:8080 or https://your-cluster.weaviate.network

  - id: anonymous
    type: BOOL
    defaults: false
    description: Set true for a cluster with anonymous access. When false the task reads WEAVIATE_API_KEY from secrets.

  - id: class_name
    type: STRING
    defaults: Document
    description: The Weaviate class to scan for stale objects.

  - id: retention_property
    type: STRING
    defaults: source
    description: A text property that tags each object with its origin or retention key, for example source, tenant, batchId or docId.

  - id: retention_value
    type: STRING
    defaults: deprecated
    description: Objects whose retention_property matches this value are stale and are evicted. Weaviate Like matching treats a plain value as an exact match.

  - id: reverify_timeout
    type: DURATION
    defaults: PT2M
    description: Upper bound on the eviction and re-verify loop. The run fails if stale objects still remain when this elapses.

  - id: dry_run
    type: BOOL
    defaults: true
    description: When true, report the candidate count and the filter without deleting anything.

  - id: auto_remediate
    type: BOOL
    defaults: false
    description: When true and dry_run is false, delete the stale objects and re-verify.

tasks:
  - id: detect
    type: io.kestra.plugin.weaviate.Query
    url: "{{ inputs.weaviate_url }}"
    apiKey: "{{ inputs.anonymous ? '' : secret('WEAVIATE_API_KEY') }}"
    fetchType: FETCH_ONE
    query: |
      { Aggregate { {{ inputs.class_name }}(where: {path: ["{{ inputs.retention_property }}"], operator: Like, valueText: "{{ inputs.retention_value }}"}) { meta { count } } } }

  - id: log_detect
    type: io.kestra.plugin.core.log.Log
    message: |
      Class {{ inputs.class_name }} on {{ inputs.weaviate_url }}: {{ (outputs.detect.row.meta.count ?? 0) | numberFormat('#') }} stale objects.
      Filter: {{ inputs.retention_property }} Like {{ inputs.retention_value }}.
      Mode: dry_run={{ inputs.dry_run }} auto_remediate={{ inputs.auto_remediate }}.

  - id: guard
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (outputs.detect.row.meta.count ?? 0) > 0 }}"
    then:
      - id: findings_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": "Weaviate stale vector guard: {{ (outputs.detect.row.meta.count ?? 0) | numberFormat('#') }} stale objects in class {{ inputs.class_name }} on {{ inputs.weaviate_url }} where {{ inputs.retention_property }} Like {{ inputs.retention_value }}. dry_run={{ inputs.dry_run }} auto_remediate={{ inputs.auto_remediate }}."}

      - id: mode
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: evict_until_clear
            type: io.kestra.plugin.core.flow.LoopUntil
            description: Remediation loop that deletes stale objects and re-counts until none remain.
            condition: "{{ (outputs.recount.row.meta.count ?? 0) < 1 }}"
            checkFrequency:
              interval: PT2S
              maxDuration: "{{ inputs.reverify_timeout }}"
            failOnMaxReached: true
            tasks:
              - id: purge
                type: io.kestra.plugin.weaviate.Delete
                url: "{{ inputs.weaviate_url }}"
                apiKey: "{{ inputs.anonymous ? '' : secret('WEAVIATE_API_KEY') }}"
                className: "{{ inputs.class_name }}"
                filter:
                  "{{ inputs.retention_property }}": "{{ inputs.retention_value }}"

              - id: log_purge
                type: io.kestra.plugin.core.log.Log
                message: "Deleted {{ outputs.purge.deletedCount | numberFormat('#') }} objects this pass. success={{ outputs.purge.success }}."

              - id: recount
                type: io.kestra.plugin.weaviate.Query
                url: "{{ inputs.weaviate_url }}"
                apiKey: "{{ inputs.anonymous ? '' : secret('WEAVIATE_API_KEY') }}"
                fetchType: FETCH_ONE
                query: |
                  { Aggregate { {{ inputs.class_name }}(where: {path: ["{{ inputs.retention_property }}"], operator: Like, valueText: "{{ inputs.retention_value }}"}) { meta { count } } } }

          - id: log_remediated
            type: io.kestra.plugin.core.log.Log
            message: "Eviction complete. Stale objects remaining in {{ inputs.class_name }}: {{ (outputs.recount.row.meta.count ?? 0) | numberFormat('#') }}."
        else:
          - id: log_report_only
            type: io.kestra.plugin.core.log.Log
            message: "Report only. {{ (outputs.detect.row.meta.count ?? 0) | numberFormat('#') }} stale objects would be deleted. Set auto_remediate true and dry_run false to evict."
    else:
      - id: log_clean
        type: io.kestra.plugin.core.log.Log
        message: "No stale objects in {{ inputs.class_name }} where {{ inputs.retention_property }} Like {{ inputs.retention_value }}. Nothing to evict."

errors:
  - id: alert_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "Weaviate stale vector guard FAILED for class {{ inputs.class_name }} on {{ inputs.weaviate_url }}. Execution {{ execution.id }}. Stale objects may still be present."}

triggers:
  - id: daily_scan
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 3 * * *"
    disabled: true
    inputs:
      dry_run: true
      auto_remediate: false

extend:
  title: Evict stale vectors from a Weaviate class and verify the store is clean
  shortDescription: Count Weaviate objects that match a retention key, delete them behind a safety gate, then re-query and fail if any stale object remains.
  metaTitle: Evict stale vectors from Weaviate with Kestra
  metaDescription: Count, delete and re-verify stale Weaviate objects by a retention key with Kestra behind dry-run and auto-remediate gates.
  description: |
    This blueprint keeps a Weaviate class free of stale vectors. In a retrieval store the vectors from a retired or re-ingested source keep matching queries they should no longer answer, which bloats the index and drags retrieval quality down. The flow counts the objects whose retention key matches a target value, deletes them behind a safety gate, then re-queries the store and fails if any stale object is left.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Safety

    The flow is read-only by default. It deletes only when `auto_remediate` is true and `dry_run` is false. In every other mode it reports the candidate count and the exact filter and changes nothing. After a delete it re-counts the stale objects and fails the run while any remain, so a partial clear never passes as success. The schedule ships disabled and pins both gates to safe mode.

    ## How it works

    1. `detect` runs a Weaviate GraphQL `Aggregate` query that counts objects whose `retention_property` matches `retention_value`.
    2. `log_detect` records the count, the filter and the current mode.
    3. `guard` acts only when the count is above zero. It posts a findings alert to Slack so the detection is visible even on a dry run.
    4. When `auto_remediate` is true and `dry_run` is false, `evict_until_clear` runs. It is a `LoopUntil` that batch-deletes the matching objects through `weaviate.Delete`, re-counts them, then repeats until the count reaches zero or `reverify_timeout` elapses. `failOnMaxReached` fails the run if the backlog is not cleared in time.
    5. In any other mode `log_report_only` records what would be deleted and the store is untouched.
    6. When nothing is stale, `log_clean` records that there is nothing to evict.
    7. Any task error routes to the `errors` block, which posts a Slack alert.

    A Weaviate batch delete removes at most `QUERY_MAXIMUM_RESULTS` objects per call, so a large backlog is cleared over several passes of the loop rather than in one call. The re-count after each delete is what makes a partial clear fail instead of reporting success.

    ## What you get

    - A retention guard for a Weaviate class, keyed on any text property you choose.
    - A dry-run mode that shows the candidate count and the exact filter before anyone deletes anything.
    - Automatic eviction that keeps deleting and re-counting until the class is clean or a time budget runs out.
    - A Slack findings alert on detection and a Slack alert on failure.
    - A disabled schedule you can turn on to run the scan every day in safe mode.

    ## Who it's for

    - AI and platform engineers who run a Weaviate store behind a RAG pipeline and need superseded content purged.
    - Data engineers who re-ingest a source and must drop its old vectors first.
    - Teams who want an erasure by subject or tenant key gated and verified rather than fired blind from a script.

    ## Why orchestrate this with Kestra

    Weaviate has no retention job and no scheduler. Left alone a class only grows and old vectors keep surfacing in results. Kestra adds the schedule, the dry-run and remediate gates, the retry on a transient API error, the Slack alerts and the execution history. The re-query after the delete is a first-class task, so the run proves the store is clean instead of assuming it.

    ## Tested end to end

    Run on Kestra 2.0.5 against a self-hosted Weaviate 1.39 instance with anonymous access. A `Document` class was seeded with 5 current objects and 7 stale objects tagged `source=deprecated`. The clean path reported 0 and skipped eviction. The detect path found 7. The dry-run path reported 7 and left the count at 7. With the server batch-delete cap set to 3 per call, the remediate path cleared the 7 stale objects over three loop passes (7 to 4 to 1 to 0), left the 5 current objects in place and re-verified 0 remaining. A run pointed at an unreachable endpoint failed and fired the Slack errors block. Every count was confirmed with a direct GraphQL `Aggregate` call against Weaviate, not only from the Kestra log.

    ## Prerequisites

    A reachable Weaviate cluster and a class whose objects carry a text property you can use as a retention key, for example `source`, `tenant`, `batchId` or `docId`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: incoming webhook for the findings and failure alerts.
    - `WEAVIATE_API_KEY`: bearer key for a hosted cluster. Read on every Weaviate task unless `anonymous` is true.

    ### Inputs

    - `weaviate_url`: the cluster endpoint, scheme and host with port.
    - `anonymous`: set true for a cluster with anonymous access, which skips the API key.
    - `class_name`: the class to scan.
    - `retention_property`: the text property that tags each object with its origin or retention key.
    - `retention_value`: the value that marks an object stale.
    - `reverify_timeout`: the time budget for the eviction and re-verify loop.
    - `dry_run`: report without deleting. Defaults to true.
    - `auto_remediate`: allow deletion. Defaults to false.

    ## Quick start

    1. Store `SLACK_WEBHOOK_URL` as a Kestra secret. Store `WEAVIATE_API_KEY` too or set the `anonymous` input to true for a cluster with open access.
    2. Set `weaviate_url`, `class_name`, `retention_property` and `retention_value` to match your store and run with the other defaults. It reports the stale count and deletes nothing.
    3. When the count looks right, set `auto_remediate` to true and `dry_run` to false to evict and re-verify.
    4. Enable the `daily_scan` trigger to run the safe-mode scan every day.

    ## How to extend

    - Point `retention_property` at `tenant` or `docId` to run an erasure by subject rather than by source.
    - Lower `reverify_timeout` on a small class or raise it when a very large backlog needs several passes.
    - Add a `Pause` before `evict_until_clear` to require human approval in production.
    - Fan the guard across many classes by wrapping it in a `Loop` over a list of class names.
    - Swap the Slack alert for any other Kestra notification plugin.

    ## Links

    - Weaviate plugin docs: https://kestra.io/plugins/plugin-weaviate
    - Weaviate batch delete limits: https://docs.weaviate.io/weaviate/manage-data/delete

  tags:
    - AI
    - Data
  subTags:
    - Vector Stores & RAG
    - Data Quality
    - Day 2 Operations
  ee: false
  demo: false
