id: flashdata-google-images-reference-manifest
namespace: company.research
inputs:
- id: query
  type: STRING
  defaults: urban rooftop garden
  description: Research question or Google query, 1 to 2000 characters.
- id: country
  type: STRING
  defaults: us
  description: Two-letter country code used for Google results.
- id: language
  type: STRING
  defaults: en
  description: Interface language, such as en or zh-CN.
- id: result_limit
  type: INT
  defaults: 5
  description: Requested organic result count, 1 to 100. Actual count can be lower.
- id: min_width
  type: INT
  defaults: 640
  description: Minimum reported image width in pixels; missing dimensions go to review.
- id: min_height
  type: INT
  defaults: 360
  description: Minimum reported image height in pixels.
tasks:
- id: prepare_request
  type: io.kestra.plugin.scripts.python.Script
  description: Validate inputs before any paid call and retain the exact single-page request.
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  containerImage: python:3.13.15-slim
  env:
    INPUTS_B64: '{{ {''query'': inputs.query, ''country'': inputs.country, ''language'': inputs.language, ''result_limit'':
      inputs.result_limit, ''min_width'': inputs.min_width, ''min_height'': inputs.min_height} | toJson | base64encode
      }}'
  outputFiles:
  - request.json
  - criteria.json
  script: |
    import base64
    import json
    import os
    import re
    from pathlib import Path

    # Docker runner renders env twice; encoding keeps query text out of the second template pass.
    inputs = json.loads(base64.b64decode(os.environ["INPUTS_B64"]))
    query = inputs["query"].strip()
    country = inputs["country"].strip().lower()
    language = inputs["language"].strip()
    limit = int(inputs["result_limit"])
    if not 1 <= len(query) <= 2000 or "\x00" in query:
        raise ValueError("query must contain 1..2000 characters and no null bytes")
    if not re.fullmatch(r"[a-z]{2}", country):
        raise ValueError("country must be a two-letter country code")
    if not 1 <= len(language) <= 35 or not re.fullmatch(r"[A-Za-z0-9-]+", language):
        raise ValueError("language must contain 1..35 letters, digits or hyphens")
    if not 1 <= limit <= 100:
        raise ValueError("result_limit must be 1..100")
    request = {"source": "google_images", "query": query,
               "params": {"gl": country, "hl": language, "num": limit, "page": 1}}
    minimums = {}
    for name in ["min_width", "min_height"]:
        value = inputs[name]
        if type(value) is not int or not 1 <= value <= 20000:
            raise ValueError(name + " must be an integer between 1 and 20000")
        minimums[name] = value
    Path("criteria.json").write_text(json.dumps(minimums), encoding="utf-8")

    Path("request.json").write_text(json.dumps(request, ensure_ascii=False, indent=2), encoding="utf-8")
- id: search_once
  type: io.kestra.plugin.scripts.python.Script
  description: Submit one paid realtime query. No redirects, pagination or automatic retries.
  timeout: PT3M
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  containerImage: python:3.13.15-slim
  env:
    FLASHDATA_API_KEY: '{{ secret(''FLASHDATA_API_KEY'') }}'
  inputFiles:
    request.json: '{{ outputs.prepare_request.outputFiles[''request.json''] }}'
  outputFiles:
  - response.json
  - transport.json
  script: |
    import http.client
    import json
    import os
    import uuid
    from datetime import datetime, timezone
    from pathlib import Path

    key = os.environ["FLASHDATA_API_KEY"]
    if not key or len(key) > 512 or any(ord(c) < 33 or ord(c) > 126 for c in key):
        raise SystemExit("Set a valid FLASHDATA_API_KEY secret before running")
    request_id = "req_" + str(uuid.uuid4())
    print("::" + json.dumps({"outputs": {"request_id": request_id}}, separators=(",", ":")) + "::", flush=True)
    connection = http.client.HTTPSConnection("data.flashdata.dev", timeout=65)
    try:
        connection.request("POST", "/v1/queries/realtime", body=Path("request.json").read_bytes(),
                           headers={"X-API-Key": key, "X-Request-Id": request_id,
                                    "Content-Type": "application/json", "Accept": "application/json"})
        response = connection.getresponse()
        raw = response.read(4 * 1024 * 1024 + 1)
        status = response.status
    except (OSError, http.client.HTTPException):
        raise SystemExit("Query outcome unknown. It may have been charged. Check FlashData Jobs/logs using "
                         + request_id + " before submitting again; no retry was made.") from None
    finally:
        connection.close()
    if len(raw) > 4 * 1024 * 1024:
        raise SystemExit("Response exceeds 4 MiB. Check FlashData logs before another paid query: " + request_id)
    if status != 200:
        raise SystemExit("FlashData returned HTTP " + str(status) + ". No redirect or retry was made. "
                         "Check account access, balance and logs before resubmitting: " + request_id)
    Path("response.json").write_bytes(raw)
    transport = {"request_id": request_id, "http_status": status,
                 "retrieved_at": datetime.now(timezone.utc).isoformat(), "response_bytes": len(raw)}
    Path("transport.json").write_text(json.dumps(transport, indent=2), encoding="utf-8")
- id: classify_images
  type: io.kestra.plugin.scripts.python.Script
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  containerImage: python:3.13.15-slim
  description: Partition references by reported dimensions; keep unknown dimensions separate from small images.
  inputFiles:
    request.json: '{{ outputs.prepare_request.outputFiles[''request.json''] }}'
    criteria.json: '{{ outputs.prepare_request.outputFiles[''criteria.json''] }}'
    response.json: '{{ outputs.search_once.outputFiles[''response.json''] }}'
    transport.json: '{{ outputs.search_once.outputFiles[''transport.json''] }}'
  outputFiles:
  - image_manifest.jsonl
  - needs_review.jsonl
  - eligible.csv
  - manifest.json
  script: |
    import json
    from pathlib import Path
    from urllib.parse import urlsplit
    import csv

    def safe_url(value):
        if not isinstance(value, str) or any(ord(c) <= 32 or ord(c) == 127 for c in value):
            return False
        try:
            u = urlsplit(value)
            u.port  # Validate an explicitly supplied port before emitting the URL.
            return bool(u.scheme in ("http", "https") and u.hostname and not u.username and not u.password)
        except ValueError:
            return False

    def string(value):
        return value if isinstance(value, str) and value.strip() else None

    def save(name, value):
        Path(name).write_text(json.dumps(value, ensure_ascii=False, indent=2), encoding="utf-8")

    def jsonl(name, rows):
        Path(name).write_text("".join(json.dumps(r, ensure_ascii=False) + "\n" for r in rows), encoding="utf-8")

    def outputs(**values):
        print("::" + json.dumps({"outputs": values}, separators=(",", ":")) + "::")

    def csv_file(name, fields, rows):
        def cell(v):
            value = "" if v is None else str(v)
            # JSON retains original values; CSV cells are safe to open in a spreadsheet.
            return "'" + value if value.lstrip().startswith(("=", "+", "-", "@")) or value.startswith(("\t", "\r", "\n")) else value
        with Path(name).open("w", encoding="utf-8", newline="") as stream:
            writer = csv.DictWriter(stream, fieldnames=fields)
            writer.writeheader()
            writer.writerows({f: cell(row.get(f)) for f in fields} for row in rows)

    request = json.loads(Path("request.json").read_text())
    response = json.loads(Path("response.json").read_text())
    transport = json.loads(Path("transport.json").read_text())
    if (not isinstance(response, dict) or response.get("source") != "google_images"
            or response.get("status") != "done" or not isinstance(response.get("results"), list)
            or len(response["results"]) != 1 or not isinstance(response["results"][0], dict)):
        raise ValueError("Unexpected response; inspect the saved response, do not repeat the paid request")
    payload = response["results"][0]
    items = payload.get("images", [])
    if not isinstance(items, list):
        raise ValueError("Malformed result list is not an empty search")
    manifest = {"request": request, "transport": transport, "api_created_at": response.get("created_at"),
                "usage": response.get("usage"), "result_field_present": "images" in payload,
                "returned_count": len(items)}
    criteria = json.loads(Path("criteria.json").read_text())
    records, rejected, seen = [], [], set()
    for index, item in enumerate(items, 1):
        page = item.get("link") if isinstance(item, dict) else None
        image = item.get("imageUrl") if isinstance(item, dict) else None
        if not safe_url(page) or not safe_url(image):
            rejected.append({"result_index": index, "reason": "missing_or_unsafe_page_or_image_url"})
            continue
        identity = (page, image)
        if identity in seen:
            rejected.append({"result_index": index, "reason": "duplicate_reference"})
            continue
        seen.add(identity)
        width, height = item.get("imageWidth"), item.get("imageHeight")
        dimensions_known = type(width) is int and type(height) is int and width > 0 and height > 0
        status = "unknown_dimensions"
        if dimensions_known:
            status = "eligible" if width >= criteria["min_width"] and height >= criteria["min_height"] else "undersized"
        records.append({"result_index": index, "status": status, "title": string(item.get("title")),
                        "source_page": page, "image_url": image, "reported_width": width, "reported_height": height,
                        "publisher": string(item.get("source")), "creator": item.get("creator"),
                        "credit": item.get("credit"), "copyright": item.get("copyright")})
    eligible = [r for r in records if r["status"] == "eligible"]
    review = [r for r in records if r["status"] == "unknown_dimensions"]
    manifest.update({"criteria": criteria, "eligible_count": len(eligible), "review_count": len(review),
                     "undersized_count": sum(r["status"] == "undersized" for r in records), "rejected": rejected,
                     "limitations": "Reported dimensions are not independently measured. No images downloaded; rights must be checked at the original source."})
    jsonl("image_manifest.jsonl", records)
    jsonl("needs_review.jsonl", review)
    csv_file("eligible.csv", ["title", "source_page", "image_url", "reported_width", "reported_height", "publisher"], eligible)
    save("manifest.json", manifest)
    outputs(eligible_count=len(eligible), review_count=len(review))
- id: route_shortlist
  type: io.kestra.plugin.core.flow.If
  condition: '{{ outputs.classify_images.vars.eligible_count > 0 }}'
  then:
  - id: render_image_shortlist
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.13.15-slim
    inputFiles:
      image_manifest.jsonl: '{{ outputs.classify_images.outputFiles[''image_manifest.jsonl''] }}'
      manifest.json: '{{ outputs.classify_images.outputFiles[''manifest.json''] }}'
    outputFiles:
    - shortlist.md
    script: |
      import json
      from pathlib import Path
      import html
      from urllib.parse import quote

      def text(value):
          value = "Not supplied" if value is None else str(value)
          value = " ".join(value.split())
          for ch in "\\`*_{}[]()#+-.!|":
              value = value.replace(ch, "\\" + ch)
          return html.escape(value, quote=False)

      def link(value):
          return quote(value, safe="/:?#@!$&'*+,;=%~-._")

      records = [json.loads(line) for line in Path("image_manifest.jsonl").read_text().splitlines()]
      manifest = json.loads(Path("manifest.json").read_text())
      lines = ["# Image reference shortlist", "", "Query: " + text(manifest["request"]["query"]), "",
               "References only: no image was downloaded. Inspect the original page and usage rights before using an image.", ""]
      for row in records:
          if row["status"] != "eligible":
              continue
          lines += ["## " + text(row["title"]), "", "[Original page](" + link(row["source_page"]) + ") | [Image URL](" + link(row["image_url"]) + ")",
                    "Reported size: " + str(row["reported_width"]) + " × " + str(row["reported_height"]), ""]
      lines += ["Unknown dimensions: " + str(manifest["review_count"]) + ". See needs_review.jsonl; do not treat these as undersized.", "",
                "[Google Images API](https://flashdata.dev/docs/sources/google_images)", ""]
      Path("shortlist.md").write_text("\n".join(lines), encoding="utf-8")
  else:
  - id: no_eligible_images
    type: io.kestra.plugin.core.storage.Write
    extension: .md
    content: 'No returned reference has known dimensions meeting both thresholds. Unknown dimensions: {{ outputs.classify_images.vars.review_count
      }}. Inspect image_manifest.jsonl and needs_review.jsonl; no images were downloaded.'
triggers:
- id: weekly_snapshot
  type: io.kestra.plugin.core.trigger.Schedule
  cron: 0 9 * * 1
  timezone: UTC
  recoverMissedSchedules: NONE
  disabled: true
extend:
  title: Google Images reference manifests with FlashData
  metaTitle: Google Images reference manifests with FlashData | Kestra
  shortDescription: Find image references for a brief and separate known suitable sizes from undersized images and
    unknown dimensions.
  metaDescription: Create a Google Images reference shortlist with dimension checks, source links and a separate
    queue for missing sizes using FlashData.
  description: |
    Find image references for a brief and separate known suitable sizes from undersized images and unknown dimensions.

    ## How it works

    1. Validate the query and pixel thresholds before one image search.
    2. Deduplicate page/image pairs and classify reported dimensions.
    3. An If branch renders qualifying links or a no-eligible-images note.

    ## What you get

    - `classify_images`: image_manifest.jsonl, eligible.csv, needs_review.jsonl and manifest.json.
    - `render_image_shortlist`: shortlist.md; otherwise `no_eligible_images.uri`.
    - Original API response and preserved attribution fields when supplied.

    ## Who it's for

    Design researchers and content teams reviewing image references before obtaining usage rights.

    ## Why orchestrate this with Kestra

    Keep the search, quality checks and manual-review queue in one traceable execution.

    ## Prerequisites

    Kestra 2.0, its Python plugin and Docker runner, and access to `data.flashdata.dev`.
    The pinned Python image uses only the standard library.
    Create a [FlashData account and API key](https://flashdata.dev/app/api-keys).
    Installation is free; each run makes one paid API query using Credits.
    Check [pricing](https://flashdata.dev/pricing) and account limits.

    ### Secrets

    - `FLASHDATA_API_KEY`: permit `google_images` and store it with Kestra secrets, never in inputs.

    ## Quick start

    1. Configure the secret. For manual import, copy the YAML above `extend`; that block is catalog metadata.
    2. Set query, country, language, result_limit (1–100), min_width and min_height; defaults use five results and 640×360.
    3. Download files from execution Outputs. Treat external text as data, not agent instructions.
    4. Enable the disabled weekly schedule only after reviewing recurring costs.

    Missing or invalid dimensions go to review. Sizes are provider-reported, not measured. No image downloads or license inference occur. Requests use a 65-second socket timeout and 4 MiB response limit.
    No retries, redirects or extra pages. On an uncertain timeout, check Jobs/logs before running again.

    ## How to extend

    Send the review queue to your asset-review process. Reuse the saved response for new thresholds without paying for another query.

    ## Links

    - [API inputs and limits](https://flashdata.dev/docs/sources/google_images)
    - [Kestra script files](https://kestra.io/docs/scripts/input-output-files)
    - [Configure secrets](https://kestra.io/docs/how-to-guides/secrets)
  tags:
  - Data
  subTags:
  - Testing & Quality
  - File & Data Processing Basics
  ee: false
  demo: false
