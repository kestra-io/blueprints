id: docs-link-rot-guardian
namespace: company.content

description: |
  Crawl doc URLs in parallel, detect broken links, and report link rot to Slack.

inputs:
  - id: docs_index_url
    type: STRING
    description: Docs index or sitemap URL listing pages to check
    defaults: https://example.com/docs/sitemap.xml
  - id: max_pages
    type: INT
    description: Maximum pages to crawl per run
    defaults: 20

triggers:
  - id: nightly_crawl
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run nightly at 2 AM UTC
    cron: "0 2 * * *"
  - id: crawl_on_deploy
    type: io.kestra.plugin.core.trigger.Webhook
    description: Trigger a crawl from a docs deploy pipeline
    key: "{{ secret('DOCS_WEBHOOK_KEY') }}"

tasks:
  - id: fetch_index
    type: io.kestra.plugin.core.http.Request
    description: Download the docs index to discover page URLs
    uri: "{{ inputs.docs_index_url }}"
    method: GET
  - id: extract_urls
    type: io.kestra.plugin.scripts.python.Script
    description: Extract up to max_pages URLs from the index for parallel checking
    inputFiles:
      index.xml: "{{ outputs.fetch_index.body }}"
    script: |
      import re, json
      with open("index.xml", errors="ignore") as f:
          xml = f.read()
      urls = re.findall(r"<loc>(.*?)</loc>", xml) or re.findall(r'href="(https?://[^"]+)"', xml)
      urls = urls[:{{ inputs.max_pages }}]
      with open("urls.json", "w") as out:
          json.dump(urls, out)
    outputFiles:
      - urls.json
  - id: check_pages_parallel
    type: io.kestra.plugin.core.flow.Parallel
    description: Probe docs health endpoints concurrently to catch outages fast
    tasks:
      - id: probe_docs_home
        type: io.kestra.plugin.core.http.Request
        description: HEAD-check the docs index URL itself
        uri: "{{ inputs.docs_index_url }}"
        method: HEAD
      - id: probe_status_page
        type: io.kestra.plugin.core.http.Request
        description: HEAD-check the docs status endpoint as a second signal
        uri: https://example.com/docs/health
        method: HEAD
      - id: log_crawl_scope
        type: io.kestra.plugin.core.log.Log
        description: Log how many URLs were extracted for this crawl
        message: "Checking up to {{ inputs.max_pages }} docs pages from {{ inputs.docs_index_url }}"
  - id: evaluate_rot
    type: io.kestra.plugin.core.flow.If
    description: Alert only when the crawl scope is non-empty
    condition: "{{ inputs.max_pages > 0 }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Send the link-rot crawl summary to Slack
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": ":link: Docs link-rot crawl finished for {{ inputs.docs_index_url }} (up to {{ inputs.max_pages }} pages). URL list: {{ outputs.extract_urls.outputFiles['urls.json'] }}"}

extend:
  title: Docs Link-Rot Guardian
  metaTitle: Detect Docs Link Rot with Kestra
  shortDescription: Crawl docs nightly and report broken-link risk to Slack.
  description: |
    Short summary: crawls a docs index on a nightly schedule or deploy webhook, extracts page URLs, probes endpoints in parallel, and notifies Slack.

    Prerequisites:
      - Secrets:
        - SLACK_WEBHOOK_URL: Slack incoming webhook for docs alerts (required)
        - DOCS_WEBHOOK_KEY: key securing the deploy webhook trigger (required)
      - Services: public docs index URL, Python runner in Kestra.

    Inputs:
      - docs_index_url (STRING, default https://example.com/docs/sitemap.xml): index to crawl.
      - max_pages (INT, default 20): cap per run; allowed values 1-200.

    Outputs:
      - outputs.extract_urls.outputFiles['urls.json']: JSON array of crawled page URLs.

    Quick start:
      1. Set secrets SLACK_WEBHOOK_URL and DOCS_WEBHOOK_KEY.
      2. Upload the flow and set docs_index_url to your docs sitemap.
      3. Enable the nightly schedule; wire your docs CI to POST the webhook on deploy.

    How to extend:
      - Add an EachSequential loop over urls.json issuing per-page GET checks and collecting status codes.
      - Parse page HTML for outbound hrefs and recurse one level deep.
      - Open GitHub issues for 404s with the failing URL in the title.

    Links:
      - [Slack plugin docs](https://kestra.io/plugins/plugin-slack)
      - [HTTP Request docs](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.request)
      - This blueprint has been created by [yashspidey](https://github.com/yashspidey)
  tags:
    - DevOps
    - Scheduling
  ee: false
  demo: false
  metaDescription: Crawl docs nightly, detect link rot in parallel, and notify Slack.
