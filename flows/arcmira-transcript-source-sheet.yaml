id: arcmira-transcript-source-sheet
namespace: company.team

inputs:
  - id: query
    type: STRING
    defaults: creator economy
    description: One topic or phrase to find in indexed transcripts.
  - id: published_after
    type: DATE
    required: false
    description: Inclusive UTC publication date. Omit to start 60 days before execution.
  - id: published_before
    type: DATE
    required: false
    description: Exclusive UTC publication date. Omit to end 31 days before execution.
  - id: limit
    type: INT
    defaults: 3
    description: Number of passages, from 1 to 20. Results past the first five use credits.

tasks:
  - id: build_query
    type: io.kestra.plugin.scripts.python.Script
    description: Validate the requested window and encode the query without interpolating user text into code.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.13.15-slim
    env:
      QUERY: "{{ inputs.query }}"
      AFTER: "{{ (inputs.published_after ?? ((trigger.date ?? execution.startDate) | dateAdd(-60, 'DAYS'))) | date('yyyy-MM-dd', timeZone='UTC') }}"
      BEFORE: "{{ (inputs.published_before ?? ((trigger.date ?? execution.startDate) | dateAdd(-31, 'DAYS'))) | date('yyyy-MM-dd', timeZone='UTC') }}"
      LIMIT: "{{ inputs.limit }}"
    outputFiles:
      - request.json
    script: |
      import json
      import os
      from datetime import date
      from pathlib import Path
      from urllib.parse import urlencode

      query = os.environ["QUERY"].strip()
      after = date.fromisoformat(os.environ["AFTER"])
      before = date.fromisoformat(os.environ["BEFORE"])
      limit = int(os.environ["LIMIT"])
      if len(query) < 2 or after >= before or not 1 <= limit <= 20:
          raise ValueError("Use a topic of at least two characters, after < before, and limit 1..20.")
      params = {"q": query, "after": after.isoformat(), "before": before.isoformat(), "limit": limit}
      request = {"uri": "https://api.arcmira.com/v1/search?" + urlencode(params), "params": params}
      Path("request.json").write_text(json.dumps(request, indent=2), encoding="utf-8")

  - id: search
    type: io.kestra.plugin.core.http.Request
    description: Make one authenticated search request. HTTP errors fail the flow without retries or fallback sources.
    uri: "{{ fromJson(read(outputs.build_query.outputFiles['request.json'])).uri }}"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('ARCMIRA_API_KEY') }}"
      Accept: application/json

  - id: has_matches
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(outputs.search.body).chunks | length > 0 }}"
    then:
      - id: source_sheet
        type: io.kestra.plugin.scripts.python.Script
        description: Export passages for human review and preserve the response with its search limitations.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: python:3.13.15-slim
        inputFiles:
          response.json: "{{ outputs.search.body }}"
          request.json: "{{ outputs.build_query.outputFiles['request.json'] }}"
        outputFiles:
          - source-sheet.csv
          - response.json
          - request.json
        script: |
          import csv
          import json
          from pathlib import Path

          response = json.loads(Path("response.json").read_text(encoding="utf-8"))
          columns = ["video_id", "published_at", "start_seconds", "watch_url", "text"]

          def spreadsheet_cell(value):
              if isinstance(value, str) and value.lstrip().startswith(("=", "+", "-", "@")):
                  return "'" + value
              return value

          with open("source-sheet.csv", "w", newline="", encoding="utf-8") as stream:
              writer = csv.DictWriter(stream, fieldnames=columns)
              writer.writeheader()
              for chunk in response["chunks"]:
                  writer.writerow({key: spreadsheet_cell(chunk[key]) for key in columns})
    else:
      - id: no_matches
        type: io.kestra.plugin.core.storage.Write
        description: Retain the empty response and its index or access notes. No source sheet is created.
        content: "{{ outputs.search.body }}"
        extension: .json

triggers:
  - id: weekly_research
    type: io.kestra.plugin.core.trigger.Schedule
    cron: 0 9 * * 1
    timezone: UTC
    recoverMissedSchedules: NONE
    disabled: true

extend:
  title: "Arcmira: YouTube Transcript Search to CSV"
  description: |
    Search indexed YouTube transcripts for one research topic and export the returned
    passages to a CSV with source links. Researchers and video editors can inspect the
    original recordings before selecting quotes or clips.

    Prerequisites:
      - An [Arcmira](https://arcmira.com) account and an API key with research read access.
      - The `ARCMIRA_API_KEY` secret supplies the Bearer token for the search request.
      - Kestra with the Python scripting plugin and a Docker task runner able to pull
        `python:3.13.15-slim`. The scripts use only the Python standard library.

    Quick start:
      1. Set the secret and import this flow into your namespace.
      2. Run manually with one `query`. It defaults to `creator economy`.
      3. Optionally set `published_after` and `published_before` as UTC dates. The start
         is inclusive and the end is exclusive. Omitted dates use a rolling window
         from 60 to 31 days before execution, outside the Free plan's freshness gate.
         To reproduce the documented example, use 2026-08-01 and 2026-09-01.
      4. `limit` defaults to 3 and accepts 1 to 20. The first five search passages per
         request are free; results after those use credits. A paid read uses credits
         from your plan, then any top-up credits, then your on-demand budget. Account limits still apply.
      5. Download `outputs.source_sheet.outputFiles['source-sheet.csv']` and inspect
         the `watch_url` for each passage before using it. Leading spreadsheet formula
         characters in text cells are escaped with an apostrophe. The JSON stays unchanged.

    Outputs and limits:
      - `outputs.source_sheet.outputFiles['response.json']` preserves the API response,
        including partial-result, index-health and access notes. Check it alongside the CSV.
      - `outputs.source_sheet.outputFiles['request.json']` records the exact query and window.
      - With no matches, `outputs.no_matches.uri` contains the response instead of a CSV.
        An empty result does not establish that a topic was never discussed.
      - The disabled Monday 09:00 UTC schedule uses the rolling window. Enable it only
        after a manual run. Consecutive windows overlap; outputs are separate per execution.
      - The flow makes one search call without pagination, retries, media downloads or
        transcript generation. API errors fail the HTTP task. It does not change plans
        or bypass access gates. Coverage depends on the index and the account's plan.
      - Results are research leads. Check context, attribution and reuse rights before
        quoting a passage or editing a recording. No video rights are supplied by this flow.

    References:
      - [Arcmira API docs](https://arcmira.com/docs)
      - [Search contract](https://arcmira.com/docs/search)
      - [Kestra Python tasks](https://kestra.io/docs/how-to-guides/python)
      - [Kestra HTTP Request](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.request)
  metaDescription: Search YouTube transcripts with Arcmira and export timestamped excerpts and source links to a CSV for research and video planning.
  tags:
    - Data
    - Business
  ee: false
  demo: false
