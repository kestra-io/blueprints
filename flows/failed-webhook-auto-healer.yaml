id: failed-webhook-auto-healer
namespace: company.ops

extend:
  title: Automated Webhook Dead-Letter Queue Healer
  metaTitle: Automated Webhook DLQ Retry and Recovery Pipeline | Kestra
  shortDescription: Ingests failed webhooks, checks system health in parallel, and replays payloads with Python backoff logic.
  metaDescription: Orchestrate webhook dead-letter queue recovery, parallel endpoint probes, and automated replay logic with Kestra.
  description: |
    Prevents dropped customer events when third-party webhooks fail due to transient timeouts by ingesting dead-letter queue payloads, verifying system health in parallel, and replaying requests with automated backoff logic.

    ## How it works
    1. A Webhook trigger or DLQ subscription captures failed webhook payloads.
    2. A Parallel block verifies target API and database availability before replay.
    3. A Python script simulates replay attempts and backoff timing.
    4. An If branch logs success upon recovery or alerts engineering on-call if permanent failure occurs.

    ## What you get
    - Automated recovery from transient server and network errors.
    - Zero dropped customer events without manual intervention.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Click Execute with default inputs to test the auto-healing path.

    ## Links
    - [Python Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Parallel Tasks](https://kestra.io/docs/workflow-components/flowable-tasks/parallel)
  tags:
    - DevOps
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false

inputs:
  - id: event_id
    type: STRING
    defaults: "evt_3MxyZ82eZvKYlo2C01"
  - id: source_service
    type: STRING
    defaults: "github-webhooks"
  - id: failure_reason
    type: STRING
    defaults: "HTTP 504 Gateway Timeout"
  - id: max_retry_attempts
    type: INT
    defaults: 3

triggers:
  - id: webhook_dlq_trigger
    type: io.kestra.plugin.core.trigger.Webhook
    key: "webhook-dlq-secret"

tasks:
  - id: log_failure_intake
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: "Ingested dead-letter event {{ inputs.event_id }} from {{ inputs.source_service }}. Reason: {{ inputs.failure_reason }}"

  - id: parallel_health_probe
    type: io.kestra.plugin.core.flow.Parallel
    description: "Verify that target API and database are healthy before attempting replay"
    tasks:
      - id: check_target_api
        type: io.kestra.plugin.core.http.Request
        uri: "https://jsonplaceholder.typicode.com/posts/1"
        method: GET

      - id: check_database_heartbeat
        type: io.kestra.plugin.core.http.Request
        uri: "https://jsonplaceholder.typicode.com/todos/1"
        method: GET

  - id: execute_replay_logic
    type: io.kestra.plugin.scripts.python.Script
    description: "Simulate replay backoff and determine if recovery succeeded"
    beforeCommands:
      - pip install kestra
    script: |
      from kestra import Kestra

      event_id = "{{ inputs.event_id }}"
      service = "{{ inputs.source_service }}"
      max_retries = {{ inputs.max_retry_attempts }}

      recovered = True
      attempts_taken = 2

      status = "REPLAY_SUCCESSFUL" if recovered else "PERMANENT_FAILURE"
      summary = f"Event {event_id} from {service} recovered after {attempts_taken} attempts." if recovered else f"Event {event_id} failed permanently."

      print(f"[{status}] {summary}")

      Kestra.outputs({
          'recovered': recovered,
          'attempts_taken': attempts_taken,
          'summary': summary
      })

  - id: route_recovery_outcome
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.execute_replay_logic.vars.recovered == true }}"
    then:
      - id: log_successful_heal
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "[HEALED] {{ outputs.execute_replay_logic.vars.summary }}"
    else:
      - id: alert_oncall_channel
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "[ALERT] Webhook auto-healer exhausted retries for {{ inputs.event_id }}. Manual intervention required."

  - id: finalize_dlq_ledger
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: "Completed auto-healer run for event {{ inputs.event_id }}."
