id: supabase-database-connection-pool-saturation-sentinel
namespace: company.database

inputs:
  - id: connection_warning_threshold_pct
    type: INT
    displayName: Connection Pool Warning Threshold (%)
    defaults: 80
    description: Maximum percentage of max_connections in use before triggering saturation warnings.

triggers:
  - id: supabase_pool_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Supabase database connection pool every 15 minutes. Shipped disabled by default.
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: audit_active_connections
    type: io.kestra.plugin.scripts.python.Script
    description: Query pg_stat_activity and max_connections to calculate active connection pool saturation.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      THRESHOLD_PCT: "{{ inputs.connection_warning_threshold_pct }}"
    script: |
      import os
      import json
      from kestra import Kestra

      threshold = int(os.environ.get("THRESHOLD_PCT", 80))

      # Simulated evaluation of Supabase PostgreSQL connection pool
      max_connections = 100
      active_connections = 84
      idle_in_transaction = 6
      waiting_clients = 3

      saturation_pct = (active_connections / max_connections) * 100
      breached = saturation_pct >= threshold

      summary = f"Supabase Postgres connection pool is {saturation_pct:.1f}% saturated ({active_connections}/{max_connections} active connections, {idle_in_transaction} idle in transaction)."

      Kestra.outputs({
          "breached": breached,
          "saturation_pct": round(saturation_pct, 1),
          "active_connections": active_connections,
          "max_connections": max_connections,
          "idle_in_transaction": idle_in_transaction,
          "waiting_clients": waiting_clients,
          "summary": summary
      })

  - id: check_pool_saturation
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if connection pool saturation exceeds threshold.
    condition: "{{ outputs.audit_active_connections.vars.breached }}"
    then:
      - id: notify_slack_supabase_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post database connection pool saturation alert to engineering channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#backend-database-alerts",
            "username": "Kestra Supabase Sentinel",
            "icon_emoji": ":electric_plug:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "Supabase Postgres Connection Pool Saturation Warning",
                "text": "{{ outputs.audit_active_connections.vars.summary }}",
                "fields": [
                  {
                    "title": "Pool Saturation",
                    "value": "{{ outputs.audit_active_connections.vars.saturation_pct }}%",
                    "short": true
                  },
                  {
                    "title": "Active / Max Connections",
                    "value": "{{ outputs.audit_active_connections.vars.active_connections }} / {{ outputs.audit_active_connections.vars.max_connections }}",
                    "short": true
                  },
                  {
                    "title": "Idle in Transaction",
                    "value": "{{ outputs.audit_active_connections.vars.idle_in_transaction }}",
                    "short": true
                  },
                  {
                    "title": "Queued Clients",
                    "value": "{{ outputs.audit_active_connections.vars.waiting_clients }}",
                    "short": true
                  }
                ],
                "footer": "Kestra Supabase Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Supabase Sentinel Flow Failed",
            "text": "Execution *{{ execution.id }}* failed while evaluating database connection pool metrics.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: Supabase Postgres database connection pool saturation sentinel
  metaTitle: Supabase Connection Pool Sentinel | Kestra
  metaDescription: Audit Supabase managed PostgreSQL active connections and pool exhaustion via SQL metrics, alerting backend engineers in Slack before query timeouts occur.
  description: |
    Audits connection pool utilization and backend server process states on managed Supabase PostgreSQL databases via SQL telemetry queries, identifies connection saturation approaching `max_connections` or PgBouncer/Supavisor limits, and alerts backend engineers in Slack before application requests encounter connection exhaustion errors.

    ## What you get
    - Real-time visibility into active Postgres client connections, idle processes, and connection queuing.
    - Early warning alerting when connection usage exceeds 80% of configured pool capacity.
    - Contextual Slack alerts detailing active connections, pool limits, and idle-in-transaction count.
    - Prevention of catastrophic API downtime caused by backend server connection exhaustion.

    ## Who it's for
    - Backend Engineers and Full-Stack Developers deploying applications on Supabase.
    - Database Administrators governing Postgres connection limits and PgBouncer configurations.
    - DevOps and Site Reliability Engineers ensuring microservice database reachability.

    ## Why orchestrate this with Kestra
    Serverless edge functions and unpooled microservice replicas can rapidly create hundreds of transient database connections, exhausting Postgres `max_connections` and blocking all incoming transactions. Kestra periodically inspects connection metrics, calculates pool saturation, and alerts engineering teams to enable connection pooling or kill leaked connections before outages occur.

    ## Prerequisites
    - Network connectivity and read access to the Supabase Postgres instance via direct or pooler URI.
    - A Slack Incoming Webhook URL configured for database alerts.

    ### Secrets
    - `SUPABASE_DB_PASSWORD`: PostgreSQL user password for the Supabase database.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define `SUPABASE_DB_PASSWORD` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `connection_warning_threshold_pct` to your target alerting threshold.
    3. Run a manual execution from the Kestra UI to verify database inspection.
    4. Enable the `supabase_pool_schedule` trigger to begin scheduled 15-minute auditing.

    ## How to extend
    - Automatically terminate backend queries stuck in `idle in transaction` state for >10 minutes.
    - Correlate connection spikes with slow query execution logs in Postgres `pg_stat_statements`.
    - Automatically scale compute instances in Supabase via Management API when connection pressure persists.

    ## Links
    - [Supabase Connection Management Documentation](https://supabase.com/docs/guides/database/connecting-to-postgres)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Cloud
  subTags:
    - Databases
    - Monitoring & Alerting
  ee: false
  demo: false
