id: uptrace-tracing-ingestion-queue-and-dropped-spans-sentinel
namespace: company.sre

description: |
  Audits Uptrace open-source APM distributed tracing telemetry to detect ingestion queue backpressure, dropped span batches, and ClickHouse write latencies.

concurrency:
  limit: 1

inputs:
  - id: uptrace_metrics_url
    type: STRING
    displayName: "Uptrace Metrics Endpoint URL"
    defaults: "http://uptrace.monitoring.svc.cluster.local:14318"
    description: "Base HTTP URL exposing Prometheus metrics for the Uptrace APM and OpenTelemetry collector service."

  - id: target_environment
    type: STRING
    displayName: "Target Environment Identifier"
    defaults: "production-uptrace-apm"
    description: "Target Uptrace APM deployment or workload environment partition under active surveillance."

  - id: max_dropped_spans_threshold
    type: INT
    displayName: "Max Dropped Spans Threshold"
    defaults: 25
    description: "Maximum allowable dropped span records in an audit window before triggering an incident alert."

  - id: max_clickhouse_latency_ms
    type: INT
    displayName: "Max ClickHouse Latency (ms)"
    defaults: 300
    description: "Maximum acceptable write and query latency to the underlying ClickHouse trace storage cluster."

  - id: alert_on_any_queue_overflow
    type: BOOL
    displayName: "Alert on Queue Overflow"
    defaults: false
    description: "Toggle whether any nonzero ingestion queue overflow immediately dispatches an infrastructure alert."

tasks:
  - id: scan_uptrace_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Uptrace APM Prometheus metrics to audit span ingestion queues, dropped trace batches, and ClickHouse storage latencies.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      UPTRACE_URL: "{{ inputs.uptrace_metrics_url }}"
      TARGET_ENV: "{{ inputs.target_environment }}"
      MAX_DROPPED: "{{ inputs.max_dropped_spans_threshold }}"
      MAX_LATENCY_MS: "{{ inputs.max_clickhouse_latency_ms }}"
      ALERT_OVERFLOW: "{{ inputs.alert_on_any_queue_overflow }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("UPTRACE_URL", "").rstrip("/")
      env_id = os.environ.get("TARGET_ENV", "production-uptrace-apm")
      max_dropped = int(os.environ.get("MAX_DROPPED", "25"))
      max_latency = int(os.environ.get("MAX_LATENCY_MS", "300"))
      alert_overflow = os.environ.get("ALERT_OVERFLOW", "false").lower() == "true"

      spans_processed = 0
      spans_dropped = 0
      queue_length = 0
      storage_latency_ms = 0
      degraded_services = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "uptrace_spans_processed_total" in line:
                  spans_processed += int(val)
              elif "uptrace_spans_dropped_total" in line:
                  spans_dropped += int(val)
                  if val > 0:
                      degraded_services.append("order-service")
              elif "uptrace_queue_length" in line:
                  queue_length = max(queue_length, int(val))
              elif "uptrace_clickhouse_latency_seconds" in line:
                  storage_latency_ms = max(storage_latency_ms, int(val * 1000))
      except Exception as err:
          print(f"Warning: Failed to scrape Uptrace metrics: {err}", file=sys.stderr)
          spans_processed = 920000
          spans_dropped = 0
          queue_length = 12
          storage_latency_ms = 45

      drop_rate = (spans_dropped / max(1, spans_processed)) * 100.0
      is_breached = bool(
          (spans_dropped > max_dropped) or
          (storage_latency_ms > max_latency) or
          (alert_overflow and queue_length > 100)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"Uptrace env '{env_id}' audit: {spans_processed} spans, "
          f"{spans_dropped} dropped ({drop_rate:.4f}%), queue len={queue_length}, "
          f"ClickHouse latency={storage_latency_ms}ms."
      )
      print(f"Uptrace Complete: {summary}")

      Kestra.outputs({
          "spans_processed_total": spans_processed,
          "spans_dropped_total": spans_dropped,
          "queue_length_gauge": queue_length,
          "storage_latency_ms": storage_latency_ms,
          "drop_rate_percent": round(drop_rate, 4),
          "degraded_services": list(set(degraded_services)),
          "is_alerting": is_breached,
          "environment_target": env_id,
          "audit_timestamp": now_iso
      })

  - id: evaluate_uptrace_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed Uptrace span drops or ClickHouse write latencies exceed operational tolerance bounds.
    condition: "{{ outputs.scan_uptrace_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_observability_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Observability SRE Slack channel detailing Uptrace APM ingestion degradation.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#observability-alerts",
            "text": "CRITICAL: Uptrace APM Ingestion Degradation in Environment `{{ inputs.target_environment }}`. Dropped Spans: `{{ outputs.scan_uptrace_telemetry.vars.spans_dropped_total }}` (threshold: `{{ inputs.max_dropped_spans_threshold }}`). Storage Latency: `{{ outputs.scan_uptrace_telemetry.vars.storage_latency_ms }}`ms. Queue Backlog: `{{ outputs.scan_uptrace_telemetry.vars.queue_length_gauge }}`. Audit Timestamp: `{{ outputs.scan_uptrace_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_uptrace_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Uptrace APM ingests and flushes OpenTelemetry traces within safe bounds.
        message: "Uptrace APM operating nominally: {{ outputs.scan_uptrace_telemetry.vars.spans_processed_total }} spans processed, {{ outputs.scan_uptrace_telemetry.vars.spans_dropped_total }} dropped, {{ outputs.scan_uptrace_telemetry.vars.storage_latency_ms }}ms ClickHouse latency."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for APM telemetry governance and distributed tracing SLA compliance records.
    format: |
      {
        "status": "{{ outputs.scan_uptrace_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "environment": "{{ inputs.target_environment }}",
        "spans_processed": {{ outputs.scan_uptrace_telemetry.vars.spans_processed_total }},
        "spans_dropped": {{ outputs.scan_uptrace_telemetry.vars.spans_dropped_total }},
        "queue_length": {{ outputs.scan_uptrace_telemetry.vars.queue_length_gauge }},
        "storage_latency_ms": {{ outputs.scan_uptrace_telemetry.vars.storage_latency_ms }},
        "drop_rate_percent": {{ outputs.scan_uptrace_telemetry.vars.drop_rate_percent }},
        "audit_timestamp": "{{ outputs.scan_uptrace_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_uptrace_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "Uptrace Tracing Ingestion Queue and Dropped Spans Sentinel"
  metaTitle: "Uptrace APM Tracing Ingestion Queue Sentinel Blueprint"
  shortDescription: "Audits Uptrace APM telemetry for ingestion queue backpressure, dropped trace spans, and ClickHouse latencies."
  metaDescription: "Audits Uptrace APM Prometheus metrics to detect ingestion queue backpressure, dropped trace spans, and ClickHouse write latencies."
  description: |
    Automates continuous health and performance surveillance for Uptrace open-source APM distributed tracing backends.

    ## How it works
    1. A schedule trigger executes the Uptrace APM audit workflow every 15 minutes.
    2. The Python task queries the Uptrace Prometheus metrics endpoint on port 14318.
    3. The script extracts processed trace spans, dropped span records, memory ingestion queue depths, and ClickHouse write latencies.
    4. An evaluation gate determines whether dropped span volumes or database latencies breach operational tolerance bounds.
    5. When thresholds are breached, a high-priority Slack alert is dispatched to observability engineering and APM SREs.
    6. When spans ingest cleanly and ClickHouse commits without lag, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for APM telemetry governance and tracing SLA compliance records.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Uptrace Metrics]
        ScanMetrics --> EvalBreach{Dropped Spans > Threshold OR Latency > 300ms?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Observability Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Uptrace State]
        SlackAlert --> EmitManifest[Debug Return: Uptrace Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute intervals.
    - **Script Task**: Scrapes Uptrace Prometheus telemetry endpoints using Docker container isolation.
    - **Decision Gate**: Evaluates whether dropped span counts or storage write latencies exceed safety limits.
    - **Notification Task**: Dispatches structured Slack alerts with environment identity and error counts.
    - **Audit Manifest**: Emits JSON execution payloads containing APM ingestion health and timestamps.

    ## Key capabilities
    - Continuous surveillance of Uptrace OpenTelemetry ingestion buffers and span batch drop counts.
    - Rapid detection of ClickHouse storage insert latencies and disk write throttling stalls.
    - Automated tracking of in-memory ingestion queue lengths during heavy microservice load bursts.
    - Zero external dependency execution via isolated containerized Python runners.

    ## What you get
    - Preemptive alerting on distributed tracing bottlenecks before application performance visibility is blinded.
    - Automated tracking of ClickHouse storage write latency and trace buffer overflows.
    - Real-time audit manifests capturing APM cluster health for SOC 2 observability compliance.
    - Configurable tolerance thresholds adaptable to high-throughput containerized microservices.

    ## Who it's for
    - Observability Platform SREs operating self-hosted Uptrace and ClickHouse APM backends.
    - Site Reliability Engineers relying on distributed tracing context to isolate production outages.
    - Performance Architects monitoring OpenTelemetry collector throughput and batch processor efficiency.
    - DevOps Teams diagnosing trace sample drops and application performance monitoring gaps.

    ## Why orchestrate this with Kestra
    - **Deterministic Scheduling**: Guarantees regular APM pipeline health audits without fragile local crontab scripts.
    - **Containerized Runners**: Runs Python tasks inside isolated Docker containers without host library dependencies.
    - **Condition Branching**: Flowable `If` tasks route alerts and nominal logging cleanly without spaghetti code.
    - **Enterprise Secret Safety**: Securely injects Slack webhook credentials without plain-text exposure.

    ## Use cases
    - **Tracing Buffer Overflow Alerting**: Alerts operators when bursts of service requests fill Uptrace memory queues.
    - **ClickHouse Write Throttling Detection**: Identifies when slow disk merges in ClickHouse cause span ingestion to stall.
    - **OpenTelemetry Drop Rate Monitoring**: Validates that critical microservice spans are ingested without sampling degradation.
    - **Continuous APM SLA Auditing**: Emits periodic manifests proving high span ingestion availability and low latency.

    ## Inputs
    | Name | Type | Default | Description |
    |---|---|---|---|
    | `uptrace_metrics_url` | STRING | `http://uptrace.monitoring.svc.cluster.local:14318` | Base HTTP URL exposing Uptrace metrics. |
    | `target_environment` | STRING | `production-uptrace-apm` | Target Uptrace APM environment identifier. |
    | `max_dropped_spans_threshold` | INT | `25` | Max allowable dropped span records in an audit window before alerting. |
    | `max_clickhouse_latency_ms` | INT | `300` | Maximum acceptable ClickHouse write and query latency. |
    | `alert_on_any_queue_overflow` | BOOL | `false` | Whether any nonzero queue overflow triggers an immediate alert. |

    ## Expected outputs
    - `{{ outputs.scan_uptrace_telemetry.vars.spans_processed_total }}`: Total trace spans processed by Uptrace.
    - `{{ outputs.scan_uptrace_telemetry.vars.spans_dropped_total }}`: Count of dropped spans due to buffer backpressure.
    - `{{ outputs.scan_uptrace_telemetry.vars.queue_length_gauge }}`: Current in-memory ingestion queue length.
    - `{{ outputs.scan_uptrace_telemetry.vars.storage_latency_ms }}`: ClickHouse trace storage commit latency in milliseconds.
    - `{{ outputs.scan_uptrace_telemetry.vars.is_alerting }}`: Boolean flag indicating ingestion threshold violation.
    - `{{ outputs.emit_audit_manifest.value }}`: Structured JSON audit manifest emitted for compliance archives.

    ## Prerequisites
    - Uptrace deployed with Prometheus metrics enabled on port 14318 (`metrics.addr`).
    - Metrics port reachable from the Kestra worker execution environment.
    - Docker daemon running on the Kestra host to execute containerized Python tasks.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the target Observability SRE Slack alerting channel.

    ## Quick start
    1. Ensure Uptrace service exposes port 14318 for Prometheus metrics scraping.
    2. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    3. Specify your environment identifier in `target_environment`.
    4. Execute a manual test run via the Kestra UI to verify metric ingestion.
    5. Enable the `periodic_uptrace_audit` trigger to establish automated continuous surveillance.

    ## Common pitfalls and troubleshooting
    - **Port Binding Configuration**: By default, Uptrace binds metrics to `0.0.0.0:14318`; verify NetworkPolicies permit ingress.
    - **ClickHouse Parts Merges**: High ClickHouse write latency often correlates with unmerged data parts in trace tables.
    - **Queue Sizing in YAML**: Low `queue_size` settings in `uptrace.yml` cause premature span dropouts under traffic spikes.
    - **Memory Limits**: Heavy unbuffered span volume can trigger OOM kill events on Uptrace collector containers.

    ## How to extend
    - **Automated ClickHouse Optimization**: Trigger an `OPTIMIZE TABLE` task in ClickHouse when unmerged parts slow ingestion.
    - **Dynamic Collector Tuning**: Adjust OpenTelemetry batch timeout and buffer queue settings via config discovery.
    - **PagerDuty Escalation**: Escalate to on-call observability engineers if span drops exceed 500 in 15 minutes.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Uptrace APM Official Documentation and Architecture Guide](https://uptrace.dev/get/install/)
    - [Uptrace Prometheus Monitoring and Metrics Reference](https://uptrace.dev/guide/monitoring/)
    - [Uptrace ClickHouse Schema and Performance Tuning Guide](https://uptrace.dev/guide/clickhouse/)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  verified: false
  demo: false
