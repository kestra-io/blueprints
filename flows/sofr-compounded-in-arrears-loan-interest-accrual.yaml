id: sofr-compounded-in-arrears-loan-interest-accrual
namespace: company.team

description: |
  Accrue SOFR loan interest compounded in arrears (ARRC lookback, no observation shift, actual/360) from New York
  Fed fixings, verify the engine against the published SOFR Index, and alert on revised fixings or restated accruals.

inputs:
  - id: loan_book
    type: STRING
    displayName: Loan book (CSV)
    description: >-
      Header `loan_id,borrower,principal,spread_bps,period_start,period_end`, one row per loan and current
      interest period (`period_end` exclusive, dates YYYY-MM-DD). The defaults are sample loans, not real
      facilities; only the SOFR fixings and SOFR Index come from the live API.
    defaults: |
      loan_id,borrower,principal,spread_bps,period_start,period_end
      L-1001,Atlas Logistics term loan,25000000,175,2026-07-15,2026-10-15
      L-1002,Birch Foods revolver,10000000,150,2026-09-30,2026-10-30
      L-1003,Cedar Health term loan B,50000000,225,2026-08-15,2026-09-15

  - id: lookback_days
    type: INT
    defaults: 5
    description: Lookback in US Government Securities business days (ARRC examples use 2 to 5). The rate for each business day is the SOFR fixing N business days earlier.

  - id: history_days
    type: INT
    defaults: 200
    description: Calendar days of fixings to fetch. Must cover the longest interest period plus the lookback.

triggers:
  - id: weekday_morning
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "30 8 * * 1-5"
    timezone: America/New_York
    description: The New York Fed publishes the previous business day's SOFR and today's SOFR Index at about 08:00 ET.

tasks:
  - id: fetch_rates
    type: io.kestra.plugin.core.http.Download
    description: One request to the secured-rates search endpoint returns SOFR fixings and the SOFR Index (type SOFRAI) for the window, plus TGCR and BGCR, which are ignored.
    uri: "https://markets.newyorkfed.org/api/rates/secured/all/search.json?startDate={{ now() | dateAdd(-inputs.history_days, 'DAYS') | date('yyyy-MM-dd', timeZone='America/New_York') }}&endDate={{ now() | date('yyyy-MM-dd', timeZone='America/New_York') }}"
    headers:
      Accept: application/json
    retry:
      type: constant
      interval: PT1M
      maxAttempts: 3

  - id: previous_fixings
    type: io.kestra.plugin.core.kv.Get
    key: sofr_fixings_snapshot
    errorOnMissing: false
    description: Internal-storage URI of the Parquet snapshot of every fixing seen so far. Missing on the first run.

  - id: previous_ledger
    type: io.kestra.plugin.core.kv.Get
    key: sofr_accrual_ledger
    errorOnMissing: false
    description: Internal-storage URI of the Parquet accrual ledger written by previous runs.

  - id: bootstrap
    type: io.kestra.plugin.core.flow.If
    description: First run only. Writes empty Parquet files with the right schema so the accrual query has one code path.
    condition: "{{ outputs.previous_fixings.value is not defined or outputs.previous_fixings.value is empty }}"
    then:
      - id: empty_state
        type: io.kestra.plugin.jdbc.duckdb.Queries
        url: "jdbc:duckdb:"
        outputFiles:
          - fixings
          - ledger
        sql: |
          COPY (SELECT CAST(NULL AS DATE) AS d, CAST(NULL AS DOUBLE) AS rate_pct, CAST(NULL AS VARCHAR) AS rev WHERE false) TO '{{ outputFiles.fixings }}' (FORMAT PARQUET);
          COPY (SELECT CAST(NULL AS VARCHAR) AS loan_id, CAST(NULL AS DATE) AS period_start, CAST(NULL AS DATE) AS accrued_through, CAST(NULL AS DOUBLE) AS principal, CAST(NULL AS DOUBLE) AS spread_bps, CAST(NULL AS INTEGER) AS lookback_days, CAST(NULL AS DOUBLE) AS compounded_sofr_pct, CAST(NULL AS DOUBLE) AS interest, CAST(NULL AS VARCHAR) AS execution_id WHERE false) TO '{{ outputFiles.ledger }}' (FORMAT PARQUET);

  - id: accrue
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Builds the business-day calendar from the dates the New York Fed published (SOFR fixings plus SOFR Index
      dates, so holidays fall out automatically), validates the loan book, and compounds per loan. Each
      business day b in the interest period covers the calendar days until the next business day (cut at the
      period start and end) and uses the fixing published N business days before b; the day weights come
      from the interest period itself (no observation shift). As a control, the same fixings are compounded
      over the shifted observation window and compared with the ratio of the published SOFR Index on those
      dates. Fixings are diffed against the KV snapshot, and accruals against the ledger.
    url: "jdbc:duckdb:"
    timeZoneId: UTC
    fetchType: FETCH_ONE
    inputFiles:
      rates.json: "{{ outputs.fetch_rates.uri }}"
      loans.csv: "{{ inputs.loan_book }}"
      previous_fixings.parquet: "{{ outputs.previous_fixings.value ?? outputs.empty_state.outputFiles.fixings }}"
      previous_ledger.parquet: "{{ outputs.previous_ledger.value ?? outputs.empty_state.outputFiles.ledger }}"
    outputFiles:
      - fixings
      - ledger
      - accruals_csv
    parameters:
      lookback: "{{ inputs.lookback_days }}"
      today: "{{ now() | date('yyyy-MM-dd', timeZone='America/New_York') }}"
      execution_id: "{{ execution.id }}"
    sql: |
      CREATE TABLE raw AS
      SELECT unnest(from_json(json_extract(content, '$.refRates'), '["JSON"]')) AS r FROM read_text('rates.json');

      CREATE TABLE fixings AS
      SELECT CAST(r->>'effectiveDate' AS DATE) AS d, CAST(r->>'percentRate' AS DOUBLE) AS rate_pct, coalesce(r->>'revisionIndicator', '') AS rev
      FROM raw WHERE r->>'type' = 'SOFR';

      CREATE TABLE sofr_index AS
      SELECT CAST(r->>'effectiveDate' AS DATE) AS d, CAST(r->>'index' AS DOUBLE) AS idx
      FROM raw WHERE r->>'type' = 'SOFRAI';

      -- Business-day calendar: every date with a fixing or an index value. lead() gives the next business day.
      CREATE TABLE cal AS
      SELECT c.d, row_number() OVER (ORDER BY c.d) AS rn, lead(c.d) OVER (ORDER BY c.d) AS next_d, f.rate_pct, i.idx
      FROM (SELECT d FROM fixings UNION SELECT d FROM sofr_index) c
      LEFT JOIN fixings f ON f.d = c.d
      LEFT JOIN sofr_index i ON i.d = c.d;

      CREATE TABLE bounds AS SELECT max(d) AS last_cal, (SELECT max(d) FROM fixings) AS last_fixing, min(d) AS first_cal FROM cal;

      CREATE TABLE loans AS
      SELECT nullif(trim(loan_id), '') AS loan_id, borrower,
             TRY_CAST(principal AS DOUBLE) AS principal, TRY_CAST(spread_bps AS DOUBLE) AS spread_bps,
             TRY_CAST(period_start AS DATE) AS s, TRY_CAST(period_end AS DATE) AS e,
             count(*) OVER (PARTITION BY trim(loan_id)) AS dup
      FROM read_csv('loans.csv', header = true, all_varchar = true);

      CREATE TABLE checked AS
      SELECT l.*,
             least(l.e, b.last_cal) AS e_eff,
             CASE
               WHEN l.loan_id IS NULL THEN 'missing loan_id'
               WHEN l.dup > 1 THEN 'duplicate loan_id'
               WHEN l.principal IS NULL OR l.principal <= 0 THEN 'principal must be a positive number'
               WHEN l.spread_bps IS NULL THEN 'spread_bps is not a number'
               WHEN l.s IS NULL OR l.e IS NULL THEN 'period dates must be YYYY-MM-DD'
               WHEN l.e <= l.s THEN 'period_end must be after period_start'
               WHEN l.s >= b.last_cal THEN 'period has not started yet'
               WHEN coalesce((SELECT max(rn) FROM cal WHERE cal.d <= l.s), 0) - CAST(:lookback AS INTEGER) < 1 THEN 'not enough fixing history for the lookback, raise history_days'
             END AS reject_reason
      FROM loans l, bounds b;

      -- One segment per business day b in the period, rate observed N business days earlier, weights from the interest period (no shift).
      CREATE TABLE seg AS
      SELECT l.loan_id, c.d AS b, lb.d AS observed_on, lb.rate_pct,
             datediff('day', greatest(c.d, l.s), least(c.next_d, l.e_eff)) AS days
      FROM checked l
      JOIN cal c ON c.d < l.e_eff AND c.next_d > l.s
      JOIN cal lb ON lb.rn = c.rn - CAST(:lookback AS INTEGER)
      WHERE l.reject_reason IS NULL;

      -- Control: same fixings over the shifted observation window versus the published SOFR Index ratio.
      CREATE TABLE obs AS
      SELECT l.loan_id,
             (SELECT min(rn) FROM cal WHERE cal.d >= l.s) - CAST(:lookback AS INTEGER) AS rn_s,
             (SELECT min(rn) FROM cal WHERE cal.d >= l.e_eff) - CAST(:lookback AS INTEGER) AS rn_e
      FROM checked l WHERE l.reject_reason IS NULL;

      CREATE TABLE control AS
      SELECT o.loan_id,
             (exp(sum(ln(1 + c.rate_pct / 100 * datediff('day', c.d, c.next_d) / 360))) - 1) * 360 / datediff('day', cs.d, ce.d) AS engine_rate,
             (ce.idx / cs.idx - 1) * 360 / datediff('day', cs.d, ce.d) AS index_rate
      FROM obs o
      JOIN cal cs ON cs.rn = o.rn_s
      JOIN cal ce ON ce.rn = o.rn_e
      JOIN cal c ON c.rn >= o.rn_s AND c.rn < o.rn_e
      GROUP BY o.loan_id, cs.d, ce.d, cs.idx, ce.idx;

      CREATE TABLE seg_agg AS
      SELECT loan_id, CAST(sum(days) AS INTEGER) AS days, count(*) AS business_days, count(*) - count(rate_pct) AS missing_fixings,
             exp(sum(ln(1 + rate_pct / 100 * days / 360))) AS cf
      FROM seg GROUP BY loan_id;

      CREATE TABLE accruals AS
      SELECT l.loan_id, l.borrower,
             CASE WHEN l.reject_reason IS NOT NULL THEN 'REJECTED' WHEN l.e <= l.e_eff THEN 'COMPLETE' ELSE 'IN_PROGRESS' END AS status,
             l.s AS period_start, l.e AS period_end,
             CASE WHEN l.reject_reason IS NULL THEN l.e_eff END AS accrued_through,
             g.days, g.business_days, g.missing_fixings,
             l.principal, l.spread_bps, CAST(:lookback AS INTEGER) AS lookback_days,
             round((g.cf - 1) * 360 / g.days * 100, 5) AS compounded_sofr_pct,
             round(((g.cf - 1) * 360 / g.days + l.spread_bps / 10000) * 100, 5) AS all_in_rate_pct,
             round(l.principal * ((g.cf - 1) + l.spread_bps / 10000 * g.days / 360), 2) AS interest,
             round(k.index_rate * 100, 5) AS shifted_index_rate_pct,
             round(abs(k.engine_rate - k.index_rate) * 10000, 4) AS index_check_bp,
             l.reject_reason
      FROM checked l
      LEFT JOIN seg_agg g ON g.loan_id = l.loan_id AND l.reject_reason IS NULL
      LEFT JOIN control k ON k.loan_id = l.loan_id AND l.reject_reason IS NULL;

      CREATE TABLE prev_fix AS SELECT * FROM read_parquet('previous_fixings.parquet');
      CREATE TABLE prev_ledger AS SELECT * FROM read_parquet('previous_ledger.parquet');

      CREATE TABLE revised AS
      SELECT f.d, p.rate_pct AS old_rate, f.rate_pct AS new_rate FROM fixings f JOIN prev_fix p ON p.d = f.d WHERE p.rate_pct IS DISTINCT FROM f.rate_pct;

      CREATE TABLE restated AS
      SELECT a.loan_id, p.interest AS old_interest, a.interest AS new_interest
      FROM accruals a JOIN prev_ledger p ON p.loan_id = a.loan_id AND p.period_start = a.period_start AND p.accrued_through = a.accrued_through AND p.lookback_days = a.lookback_days
      WHERE abs(p.interest - a.interest) >= 0.01;

      COPY (
        SELECT * FROM prev_fix WHERE d NOT IN (SELECT d FROM fixings)
        UNION ALL SELECT d, rate_pct, rev FROM fixings ORDER BY d
      ) TO '{{ outputFiles.fixings }}' (FORMAT PARQUET);

      -- Ledger: one row per loan, period, accrued-through date and lookback; the latest computation wins.
      COPY (
        SELECT p.* FROM prev_ledger p
        WHERE NOT EXISTS (SELECT 1 FROM accruals a WHERE a.status <> 'REJECTED' AND a.loan_id = p.loan_id AND a.period_start = p.period_start AND a.accrued_through = p.accrued_through AND a.lookback_days = p.lookback_days)
        UNION ALL
        SELECT loan_id, period_start, accrued_through, principal, spread_bps, lookback_days, compounded_sofr_pct, interest, :execution_id
        FROM accruals WHERE status <> 'REJECTED'
        ORDER BY loan_id, accrued_through
      ) TO '{{ outputFiles.ledger }}' (FORMAT PARQUET);

      COPY (SELECT * FROM accruals ORDER BY status, loan_id) TO '{{ outputFiles.accruals_csv }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT count(*) FROM prev_fix) = 0 AS is_baseline,
        b.last_fixing, (SELECT max(d) FROM sofr_index) AS last_index_date,
        (SELECT rate_pct FROM fixings WHERE d = b.last_fixing) AS last_sofr_pct,
        (SELECT count(*) FROM fixings) AS fixings_loaded,
        datediff('day', b.last_fixing, CAST(:today AS DATE)) > 4 AS stale,
        (SELECT coalesce(string_agg(strftime(x.d, '%Y-%m-%d'), ', ' ORDER BY x.d), '') FROM (SELECT CAST(g AS DATE) AS d FROM generate_series(CAST(b.first_cal AS TIMESTAMP), CAST(b.last_fixing AS TIMESTAMP), INTERVAL 1 DAY) t(g)) x WHERE isodow(x.d) <= 5 AND x.d NOT IN (SELECT d FROM fixings)) AS weekday_gaps,
        (SELECT count(*) FROM accruals WHERE status <> 'REJECTED') AS loans_accrued,
        (SELECT count(*) FROM accruals WHERE status = 'REJECTED') AS loans_rejected,
        (SELECT coalesce(string_agg(coalesce(loan_id, '(blank)') || ' (' || reject_reason || ')', '; '), '') FROM accruals WHERE status = 'REJECTED') AS rejected,
        (SELECT round(sum(interest), 2) FROM accruals) AS total_interest,
        (SELECT coalesce(string_agg(loan_id || ' ' || status || ' ' || compounded_sofr_pct || '% + ' || CAST(spread_bps AS INTEGER) || 'bp = ' || interest || ' through ' || strftime(accrued_through, '%Y-%m-%d'), '; ' ORDER BY loan_id), '') FROM accruals WHERE status <> 'REJECTED') AS loan_lines,
        (SELECT coalesce(max(index_check_bp), 0) FROM accruals) AS max_index_check_bp,
        (SELECT CAST(coalesce(sum(missing_fixings), 0) AS INTEGER) FROM accruals) AS missing_fixings,
        (SELECT count(*) FROM fixings WHERE rev <> '') AS flagged_fixings,
        (SELECT count(*) FROM revised) AS revised_fixings,
        (SELECT coalesce(string_agg(strftime(d, '%Y-%m-%d') || ' ' || old_rate || ' to ' || new_rate, ', ' ORDER BY d), '') FROM revised) AS revised_list,
        (SELECT count(*) FROM restated) AS restated_loans,
        (SELECT coalesce(string_agg(loan_id || ' ' || old_interest || ' to ' || new_interest, ', '), '') FROM restated) AS restated_list
      FROM bounds b;

  - id: save_fixings
    type: io.kestra.plugin.core.kv.Set
    key: sofr_fixings_snapshot
    value: "{{ outputs.accrue.outputFiles.fixings }}"

  - id: save_ledger
    type: io.kestra.plugin.core.kv.Set
    key: sofr_accrual_ledger
    value: "{{ outputs.accrue.outputFiles.ledger }}"

  - id: alert_if_needed
    type: io.kestra.plugin.core.flow.If
    description: Alerts on anything that changes booked interest or breaks the control - revised or flagged fixings, restated accruals, missing fixings, rejected loan rows, a last fixing older than four days, or the engine disagreeing with the SOFR Index by more than 0.01 bp.
    condition: "{{ outputs.accrue.outputs[0].row.revised_fixings > 0 or outputs.accrue.outputs[0].row.flagged_fixings > 0 or outputs.accrue.outputs[0].row.restated_loans > 0 or outputs.accrue.outputs[0].row.stale or outputs.accrue.outputs[0].row.max_index_check_bp > 0.01 or outputs.accrue.outputs[0].row.missing_fixings > 0 or outputs.accrue.outputs[0].row.loans_rejected > 0 }}"
    then:
      - id: warn
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "SOFR accrual needs review. Revised fixings {{ outputs.accrue.outputs[0].row.revised_fixings }} ({{ outputs.accrue.outputs[0].row.revised_list }}), flagged {{ outputs.accrue.outputs[0].row.flagged_fixings }}, restated loans {{ outputs.accrue.outputs[0].row.restated_loans }} ({{ outputs.accrue.outputs[0].row.restated_list }}), rejected rows {{ outputs.accrue.outputs[0].row.loans_rejected }} ({{ outputs.accrue.outputs[0].row.rejected }}), stale {{ outputs.accrue.outputs[0].row.stale }}, max index check {{ outputs.accrue.outputs[0].row.max_index_check_bp | numberFormat('0.0000') }} bp."
      - id: notify
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: allowFailure keeps the accrual green when the webhook is not configured.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":warning: SOFR loan accrual needs review (last fixing {{ outputs.accrue.outputs[0].row.last_fixing }}, stale {{ outputs.accrue.outputs[0].row.stale }})\nRevised fixings: {{ outputs.accrue.outputs[0].row.revised_fixings }} {{ outputs.accrue.outputs[0].row.revised_list }}\nFlagged by the NY Fed: {{ outputs.accrue.outputs[0].row.flagged_fixings }}\nRestated accruals: {{ outputs.accrue.outputs[0].row.restated_loans }} {{ outputs.accrue.outputs[0].row.restated_list }}\nSOFR Index control: max {{ outputs.accrue.outputs[0].row.max_index_check_bp | numberFormat('0.0000') }} bp\nExecution: {{ kestra.url ?? '' }}/ui/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"
          }
    else:
      - id: all_clear
        type: io.kestra.plugin.core.log.Log
        message: "No revised fixings, restated accruals or rejected rows; SOFR Index control within {{ outputs.accrue.outputs[0].row.max_index_check_bp | numberFormat('0.0000') }} bp."

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      SOFR {{ outputs.accrue.outputs[0].row.last_sofr_pct }}% on {{ outputs.accrue.outputs[0].row.last_fixing }} (index to {{ outputs.accrue.outputs[0].row.last_index_date }}), {{ outputs.accrue.outputs[0].row.fixings_loaded }} fixings{{ outputs.accrue.outputs[0].row.is_baseline ? ', BASELINE run' : '' }}. Weekdays without a fixing (treated as holidays): {{ outputs.accrue.outputs[0].row.weekday_gaps }}.
      Lookback {{ inputs.lookback_days }} business days, no shift, actual/360. {{ outputs.accrue.outputs[0].row.loans_accrued }} loans, total interest {{ outputs.accrue.outputs[0].row.total_interest }}.
      {{ outputs.accrue.outputs[0].row.loan_lines }}
      Rejected rows: {{ outputs.accrue.outputs[0].row.rejected is empty ? 'none' : outputs.accrue.outputs[0].row.rejected }}
      Accruals (CSV): {{ outputs.accrue.outputFiles.accruals_csv }}

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.accrue.outputs[0].row }}"
  - id: accruals_csv
    type: FILE
    value: "{{ outputs.accrue.outputFiles.accruals_csv }}"
  - id: ledger_parquet
    type: FILE
    value: "{{ outputs.accrue.outputFiles.ledger }}"

extend:
  title: Accrue SOFR Loan Interest Compounded in Arrears with a Lookback, Checked Against the SOFR Index
  metaTitle: SOFR Compounded in Arrears Loan Interest Accrual with DuckDB | Kestra
  shortDescription: Fetch SOFR fixings and the SOFR Index from the New York Fed each business morning, accrue interest for a loan book with ARRC compounding in arrears (lookback, no shift, actual/360) in DuckDB, verify the engine against the published Index and alert on revised fixings or restated accruals.
  metaDescription: Accrue SOFR loan interest compounded in arrears with a lookback in DuckDB, verified against the NY Fed SOFR Index, with alerts on revised fixings.
  description: |
    SOFR loan interest is daily SOFR compounded in arrears, usually with a lookback so the amount is known before payment. This flow accrues a loan book every business morning with the ARRC conventions: lookback of N business days, no observation shift, actual/360, spread added simply. The default loan book is sample data (three fictitious loans); the SOFR fixings and SOFR Index come from the live New York Fed API.

    ## How it works

    1. A `Schedule` trigger runs at 08:30 New York time on weekdays, after SOFR is published.
    2. `fetch_rates` (HTTP Download, retried) calls `/api/rates/secured/all/search.json` for the last `history_days`: SOFR and the SOFR Index (`SOFRAI`) together.
    3. Two KV Get tasks read the Parquet state of the last run; `bootstrap` (If) writes empty files on the first run.
    4. `accrue` (DuckDB) builds the business-day calendar from the published dates (no holiday table needed) and validates each loan row. Each business day covers the calendar days until the next one and takes the fixing N business days earlier. Interest = principal x (product of (1 + SOFR x days / 360) - 1 + spread x days / 360); open periods accrue through the latest Index date.
    5. Control: the fixings compounded over the shifted observation window are compared with the published SOFR Index ratio (`index_check_bp`).
    6. Fixings are diffed against the KV snapshot and checked for `revisionIndicator`; accruals are diffed against the ledger (loan, period, accrued-through date, lookback).
    7. `alert_if_needed` (If) warns and posts to Slack on revised or flagged fixings, restated accruals, rejected rows, a fixing older than four days or a control gap above 0.01 bp.

    ## What you get

    - Accrued interest per loan with compounded SOFR and all-in rate, as a CSV output.
    - A Parquet accrual ledger and a fixings snapshot behind KV keys.
    - A built-in check of the compounding engine against the New York Fed's own SOFR Index.

    ## Who it's for

    - Treasury, loan operations and agency teams that accrue or verify SOFR interest.
    - Finance engineers replacing a spreadsheet with an auditable calculation.

    ## Why orchestrate this with Kestra

    - The calculation is one reviewable SQL task; KV-backed Parquet state turns it into a revision detector.
    - Retries, a New York business-day schedule and alerting live in the flow, not in cron.

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB plugin and the Slack plugin.
    - Outbound HTTPS to `markets.newyorkfed.org` (no API key).

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook (optional; without it the WARN log still records the alert).

    ## Quick start

    1. Execute with the defaults: a `BASELINE` run over the three sample loans, `index_check_bp` below 0.001.
    2. Execute again: nothing is revised or restated.
    3. Replace `loan_book` (`period_end` exclusive), set `lookback_days` per your credit agreement and add the Slack secret.

    ## How to extend

    - Observation shift: weight each fixing by the days of the shifted observation period instead of the interest period. For a whole period this equals the SOFR Index ratio the flow already reports as `shifted_index_rate_pct`; use it for interest in `accruals`.
    - Add a per-loan `lookback_days` or floor column to the CSV and use it in the `seg` join.
    - Load the loan book with a JDBC task and post `ledger_parquet` to your GL.

    ## Links

    - [New York Fed Markets Data API](https://markets.newyorkfed.org/static/docs/markets-api.html)
    - [SOFR Averages and Index](https://www.newyorkfed.org/markets/reference-rates/sofr-averages-and-index)
    - [ARRC SOFR conventions](https://www.newyorkfed.org/arrc/sofr-transition)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Business
  subTags:
    - Reporting & Digests
    - Policy & Compliance
  ee: false
  demo: false
