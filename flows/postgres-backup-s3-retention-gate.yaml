id: postgres-backup-s3-retention-gate
namespace: company.team
description: |
  Automate PostgreSQL database logical backups with pg_dump and gzip, stream
  compressed archives directly to Amazon S3 with timestamped pathing, verify
  archive size and table count integrity, persist operational metadata to KV,
  and alert Slack immediately on anomalies or pipeline failures.

triggers:
  - id: daily_backup_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Runs daily database backup at 02:00 UTC. Shipped disabled; enable after your first successful manual verification.
    cron: "0 2 * * *"
    disabled: true

  - id: on_demand_webhook_backup
    type: io.kestra.plugin.core.trigger.Webhook
    description: Receives authenticated webhook calls for automated pre-deployment database snapshots.
    key: "{{ secret('BACKUP_WEBHOOK_KEY') }}"

inputs:
  - id: database_name
    type: STRING
    defaults: app_production
    description: Target PostgreSQL database name to back up.

  - id: min_backup_size_kb
    type: INT
    defaults: 10
    description: Minimum expected backup archive size in KB. Smaller archives trip the integrity alert.

  - id: s3_bucket
    type: STRING
    defaults: company-postgres-backups
    description: Amazon S3 bucket name designated for database archives.

  - id: aws_region
    type: STRING
    defaults: us-east-1
    description: AWS region hosting the destination S3 bucket.

tasks:
  - id: check_db_connectivity
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Verify PostgreSQL connectivity and fetch table count from the public schema prior to starting the dump.
    url: "jdbc:postgresql://{{ secret('POSTGRES_HOST') }}:5432/{{ inputs.database_name }}"
    username: "{{ secret('POSTGRES_USER') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    sql: |
      SELECT count(*) as table_count FROM information_schema.tables WHERE table_schema = 'public';
    fetchType: FETCH_ONE

  - id: generate_backup
    type: io.kestra.plugin.scripts.shell.Commands
    description: Execute pg_dump inside a postgres-client container, compress output with gzip, and calculate archive size.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      image: postgres:17-alpine
    env:
      PGHOST: "{{ secret('POSTGRES_HOST') }}"
      PGPORT: "5432"
      PGDATABASE: "{{ inputs.database_name }}"
      PGUSER: "{{ secret('POSTGRES_USER') }}"
      PGPASSWORD: "{{ secret('POSTGRES_PASSWORD') }}"
    outputFiles:
      - backup.sql.gz
    commands:
      - pg_dump -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" "$PGDATABASE" | gzip > backup.sql.gz
      - BACKUP_SIZE_KB=$(du -k backup.sql.gz | cut -f1)
      - echo "Generated backup size: ${BACKUP_SIZE_KB} KB"
      - echo "::{\"outputs\":{\"backup_size_kb\": ${BACKUP_SIZE_KB}}}::"

  - id: upload_to_s3
    type: io.kestra.plugin.aws.s3.Upload
    description: Stream the compressed database backup archive directly to Amazon S3 with ISO date partitioning.
    from: "{{ outputs.generate_backup.outputFiles['backup.sql.gz'] }}"
    bucket: "{{ inputs.s3_bucket }}"
    region: "{{ inputs.aws_region }}"
    key: "backups/{{ inputs.database_name }}/{{ now() | date('yyyy-MM-dd') }}/backup-{{ execution.startDate | date('yyyyMMdd-HHmmss') }}.sql.gz"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"

  - id: verify_backup_integrity
    type: io.kestra.plugin.core.flow.If
    description: Evaluate archive size against the minimum threshold to catch empty or partial dumps before acknowledging success.
    condition: "{{ outputs.generate_backup.vars.backup_size_kb >= inputs.min_backup_size_kb }}"
    then:
      - id: record_latest_backup_kv
        type: io.kestra.plugin.core.kv.Set
        description: Persist latest backup metadata into namespace KV for operational auditing and automated restore pipelines.
        key: POSTGRES_LAST_BACKUP_METADATA
        value: |
          {
            "database": "{{ inputs.database_name }}",
            "s3_key": "{{ outputs.upload_to_s3.key }}",
            "size_kb": {{ outputs.generate_backup.vars.backup_size_kb }},
            "table_count": {{ outputs.check_db_connectivity.row.table_count }},
            "completed_at": "{{ execution.startDate }}"
          }

      - id: log_backup_success
        type: io.kestra.plugin.core.log.Log
        description: Record structured operational log for audit tracking.
        message: "PostgreSQL backup SUCCESS: database '{{ inputs.database_name }}' ({{ outputs.generate_backup.vars.backup_size_kb }} KB, {{ outputs.check_db_connectivity.row.table_count }} tables) archived to s3://{{ inputs.s3_bucket }}/{{ outputs.upload_to_s3.key }}."
    else:
      - id: alert_underweight_backup
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alert Slack when backup archive size falls below threshold, indicating probable data omission.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":warning: *PostgreSQL Backup Anomaly*: Backup for database `{{ inputs.database_name }}` produced only {{ outputs.generate_backup.vars.backup_size_kb }} KB (threshold: {{ inputs.min_backup_size_kb }} KB). Execution {{ execution.id }}."
          }

      - id: fail_on_anomaly
        type: io.kestra.plugin.core.execution.Fail
        description: Fail execution to reflect abnormal backup size.
        errorMessage: "Backup size {{ outputs.generate_backup.vars.backup_size_kb }} KB is below minimum threshold {{ inputs.min_backup_size_kb }} KB."

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack immediately if any task in the backup pipeline encounters an unexpected failure.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": ":rotating_light: *PostgreSQL Backup Pipeline FAILED* in flow `{{ flow.id }}` (execution `{{ execution.id }}`). Database `{{ inputs.database_name }}` backup failed — inspect Kestra execution logs."
      }

outputs:
  - id: backup_summary
    type: JSON
    description: 'Comprehensive backup metadata including S3 key, size in KB, public table count, and database name.'
    value: |
      {
        "database": "{{ inputs.database_name }}",
        "s3_key": "{{ outputs.upload_to_s3.key }}",
        "size_kb": {{ outputs.generate_backup.vars.backup_size_kb }},
        "table_count": {{ outputs.check_db_connectivity.row.table_count }},
        "status": "COMPLETED"
      }

extend:
  title: Automated PostgreSQL Backup to S3 with Integrity Verification Gate
  shortDescription: Daily and on-demand PostgreSQL backup pipeline using pg_dump and gzip, streaming to Amazon S3 with size verification and Slack alerting.
  metaTitle: Automated PostgreSQL Backup to Amazon S3 with Kestra
  metaDescription: Automate PostgreSQL database backups with pg_dump and gzip, archive to Amazon S3, verify size integrity, track in KV, and alert Slack on failures.
  description: |
    Database backups often fail quietly: cron jobs exit without error while writing empty files, disks run out of space mid-dump, or credentials expire unnoticed until a recovery drill is attempted. This blueprint provides a production-grade, observable PostgreSQL disaster recovery pipeline. It queries database metadata, dumps and compresses tables with `pg_dump` inside an isolated container, streams the archive to Amazon S3 with structured date-partitioned keys, evaluates archive size against a safety threshold, updates the namespace KV store with the latest backup state, and notifies Slack on either size anomalies or pipeline errors.

    ## How it works

    1. `check_db_connectivity` (`io.kestra.plugin.jdbc.postgresql.Query`) connects using `POSTGRES_USER` and `POSTGRES_PASSWORD`, verifying database availability and counting tables in `public` schema via `fetchType: FETCH_ONE`.
    2. `generate_backup` (`io.kestra.plugin.scripts.shell.Commands` on the `io.kestra.plugin.scripts.runner.docker.Docker` runner) runs `pg_dump` with gzip compression in a lightweight `postgres:17-alpine` container, measures the compressed size with `du -k`, and emits `backup_size_kb` through Kestra's outputs protocol while capturing `backup.sql.gz` as an output file.
    3. `upload_to_s3` (`io.kestra.plugin.aws.s3.Upload`) streams the compressed archive to the configured Amazon S3 bucket under `backups/<database_name>/<yyyy-MM-dd>/backup-<timestamp>.sql.gz`.
    4. `verify_backup_integrity` (`io.kestra.plugin.core.flow.If`) compares `backup_size_kb` against `min_backup_size_kb`. If healthy, `record_latest_backup_kv` (`io.kestra.plugin.core.kv.Set`) publishes the backup metadata to `POSTGRES_LAST_BACKUP_METADATA` and `log_backup_success` records an audit entry. If underweight, `alert_underweight_backup` posts a warning to Slack and `fail_on_anomaly` flags the execution as failed.
    5. The `errors` block alerts Slack immediately if any connection, dump, or upload step fails.
    6. Dual triggers allow scheduled runs (`io.kestra.plugin.core.trigger.Schedule`, 02:00 UTC) and automated pre-deployment snapshots via `io.kestra.plugin.core.trigger.Webhook`.

    ## What you get

    - Automated, scheduled logical backups with zero local disk footprint on the host.
    - Timestamped and date-partitioned S3 storage keys enabling granular point-in-time recovery.
    - A post-dump size integrity gate preventing truncated or empty dumps from passing unnoticed.
    - A single authoritative KV key (`POSTGRES_LAST_BACKUP_METADATA`) exposing the latest valid backup URI and table count for downstream restore drills or status boards.
    - Multi-channel failure alerting with direct execution links for fast incident triage.

    ## Who it's for

    - DevOps and Site Reliability Engineers managing PostgreSQL production workloads.
    - Database Administrators requiring auditable disaster recovery pipelines.
    - Data Platform teams needing pre-deployment automated database snapshots.

    ## Why orchestrate this with Kestra

    Standalone cron scripts running `pg_dump` lack visibility: failed uploads leave silent gaps, error messages are lost in local mail queues, and credentials must be scattered across database nodes. Kestra orchestrates the entire lifecycle declaratively: secrets are managed centrally, containerized runners guarantee matching PostgreSQL client versions, retries handle transient network blips during S3 uploads, and execution history maintains an immutable audit trail of every snapshot taken.

    ## Prerequisites

    - A reachable PostgreSQL database (version 12 through 17).
    - An Amazon S3 bucket with an IAM identity allowed to put objects (`s3:PutObject`).
    - Docker daemon accessible to the Kestra worker for containerized task execution.
    - A Slack incoming webhook for notification delivery.

    ### Secrets

    - `POSTGRES_HOST`: Hostname or IP address of the PostgreSQL server.
    - `POSTGRES_USER`: Database username with read access to target schemas.
    - `POSTGRES_PASSWORD`: Database user password.
    - `AWS_ACCESS_KEY_ID`: AWS access key for S3 bucket upload.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key matching the access key.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for anomaly and failure alerts.
    - `BACKUP_WEBHOOK_KEY`: Secret authentication key for the on-demand webhook trigger.

    ## Quick start

    1. Add the seven required secrets to your Kestra namespace.
    2. Adjust `database_name` and `s3_bucket` inputs to reflect your environment.
    3. Trigger a manual execution to verify the dump, S3 upload, and KV registration.
    4. Inspect `outputs.backup_summary` and confirm the file is visible in your S3 bucket.
    5. Enable the `daily_backup_schedule` trigger by setting `disabled: false`.

    ## How to extend

    - **Automated Restore Drill:** Attach a downstream subflow that downloads the latest S3 archive, restores it into an ephemeral test container, and executes sanity checks.
    - **S3 Glacier Lifecycle:** Configure S3 bucket lifecycle rules to transition archives older than 30 days to S3 Glacier Flexible Retrieval.
    - **Schema Exclusion:** Add `-N schema_name` flags to `pg_dump` commands to omit temporary or cache tables from the backup archive.
    - **Multi-Database Fanout:** Wrap the flow in a `ForEachItem` task to back up multiple PostgreSQL databases across the cluster sequentially or in parallel.

    ## Links

    - [PostgreSQL pg_dump documentation](https://www.postgresql.org/docs/current/app-pgdump.html)
    - [Kestra PostgreSQL plugin](https://kestra.io/plugins/plugin-jdbc-postgres)
    - [Kestra AWS S3 plugin](https://kestra.io/plugins/plugin-aws)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)
    - This blueprint has been created by [Vedant817](https://github.com/Vedant817)
  tags:
    - Data
    - Cloud
  subTags:
    - Databases
    - Storage
  ee: false
  demo: false
