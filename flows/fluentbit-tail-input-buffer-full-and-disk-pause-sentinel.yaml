id: fluentbit-tail-input-buffer-full-and-disk-pause-sentinel
namespace: company.team

description: |
  Audits Fluent Bit log forwarder telemetry to detect input buffer memory saturation, filesystem pause throttling, and output record drop surges.

concurrency:
  limit: 1

inputs:
  - id: fluentbit_metrics_url
    type: STRING
    displayName: "Fluent Bit Metrics URL"
    defaults: "http://fluent-bit.logging.svc.cluster.local:2020"
    description: "Internal HTTP endpoint exposing Prometheus metrics for the Fluent Bit log processor daemonset."

  - id: input_plugin_name
    type: STRING
    displayName: "Tail Input Plugin Name"
    defaults: "tail.0"
    description: "Identifier of the target Fluent Bit tail input plugin instance under active backpressure surveillance."

  - id: max_dropped_records_threshold
    type: INT
    displayName: "Max Dropped Records Threshold"
    defaults: 5
    description: "Maximum allowable dropped log records caused by output buffer exhaustion or network rejection."

  - id: max_failed_retries_threshold
    type: INT
    displayName: "Max Failed Retries Threshold"
    defaults: 3
    description: "Maximum allowable output destination delivery retry exhaustion errors before dispatching alerts."

  - id: alert_on_output_drop
    type: BOOL
    displayName: "Alert on Output Drop"
    defaults: true
    description: "Toggle whether detected record drops on output sinks trigger an immediate high-urgency incident notification."

outputs:
  - id: records_input_total
    type: INT
    value: "{{ outputs.scan_fluentbit_telemetry.vars.records_input_total }}"
  - id: bytes_input_total
    type: INT
    value: "{{ outputs.scan_fluentbit_telemetry.vars.bytes_input_total }}"
  - id: dropped_records_total
    type: INT
    value: "{{ outputs.scan_fluentbit_telemetry.vars.dropped_records_total }}"
  - id: failed_retries_total
    type: INT
    value: "{{ outputs.scan_fluentbit_telemetry.vars.failed_retries_total }}"
  - id: is_alerting
    type: BOOLEAN
    value: "{{ outputs.scan_fluentbit_telemetry.vars.is_alerting }}"

tasks:
  - id: scan_fluentbit_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Fluent Bit Prometheus metrics to audit input record rates, output dropped records, and delivery retry failures.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.fluentbit_metrics_url }}"
      PLUGIN_NAME: "{{ inputs.input_plugin_name }}"
      MAX_DROPPED: "{{ inputs.max_dropped_records_threshold }}"
      MAX_RETRIES: "{{ inputs.max_failed_retries_threshold }}"
      ALERT_DROP: "{{ inputs.alert_on_output_drop }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METRICS_URL", "").rstrip("/")
      plugin_name = os.environ.get("PLUGIN_NAME", "tail.0")
      max_dropped = int(os.environ.get("MAX_DROPPED", "5"))
      max_retries = int(os.environ.get("MAX_RETRIES", "3"))
      alert_drop = os.environ.get("ALERT_DROP", "true").lower() == "true"

      records_input_total = 0
      bytes_input_total = 0
      dropped_records_total = 0
      failed_retries_total = 0
      degraded_plugins = []

      try:
          resp = requests.get(f"{base_url}/api/v1/metrics/prometheus", timeout=12)
          resp.raise_for_status()
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "fluentbit_input_records_total" in line and plugin_name in line:
                  records_input_total += int(val)
              elif "fluentbit_input_bytes_total" in line and plugin_name in line:
                  bytes_input_total += int(val)
              elif "fluentbit_output_dropped_records_total" in line:
                  dropped_records_total += int(val)
                  if dropped_records_total > max_dropped:
                      degraded_plugins.append("output-buffer-overflow")
              elif "fluentbit_output_retries_failed_total" in line:
                  failed_retries_total += int(val)
      except Exception as err:
          print(f"ERROR: Failed to scrape Fluent Bit metrics: {err}", file=sys.stderr)
          sys.exit(1)

      is_breached = bool(
          (dropped_records_total > max_dropped) or
          (failed_retries_total > max_retries) or
          (alert_drop and dropped_records_total > 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"Fluent Bit plugin '{plugin_name}' audit: {records_input_total} input records, "
          f"{bytes_input_total} bytes, {dropped_records_total} dropped records, "
          f"{failed_retries_total} failed retries."
      )
      print(f"Fluent Bit Complete: {summary}")

      Kestra.outputs({
          "records_input_total": records_input_total,
          "bytes_input_total": bytes_input_total,
          "dropped_records_total": dropped_records_total,
          "failed_retries_total": failed_retries_total,
          "degraded_plugins": list(set(degraded_plugins)),
          "is_alerting": is_breached,
          "plugin_name": plugin_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_fluentbit_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed Fluent Bit dropped log records or output delivery retry failures breach thresholds.
    condition: "{{ outputs.scan_fluentbit_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_observability_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Observability SRE Slack channel detailing Fluent Bit log record drop surge.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#logging-pipeline-alerts",
            "text": "CRITICAL: Fluent Bit Buffer Saturation on Plugin `{{ inputs.input_plugin_name }}`. Dropped Records: `{{ outputs.scan_fluentbit_telemetry.vars.dropped_records_total }}` (max allowable: `{{ inputs.max_dropped_records_threshold }}`). Failed Retries: `{{ outputs.scan_fluentbit_telemetry.vars.failed_retries_total }}` (threshold: `{{ inputs.max_failed_retries_threshold }}`). Ingested Records: `{{ outputs.scan_fluentbit_telemetry.vars.records_input_total }}`. Audit Timestamp: `{{ outputs.scan_fluentbit_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_fluentbit_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Fluent Bit tail inputs stream log records cleanly without buffer pauses or dropped lines.
        message: "Fluent Bit operating nominally: {{ outputs.scan_fluentbit_telemetry.vars.records_input_total }} records ingested, zero dropped records, all destination retries passing."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for enterprise log pipeline governance and telemetry ingestion compliance records.
    format: |
      {
        "status": "{{ outputs.scan_fluentbit_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "plugin_name": "{{ inputs.input_plugin_name }}",
        "records_input": {{ outputs.scan_fluentbit_telemetry.vars.records_input_total }},
        "bytes_input": {{ outputs.scan_fluentbit_telemetry.vars.bytes_input_total }},
        "dropped_records": {{ outputs.scan_fluentbit_telemetry.vars.dropped_records_total }},
        "failed_retries": {{ outputs.scan_fluentbit_telemetry.vars.failed_retries_total }},
        "audit_timestamp": "{{ outputs.scan_fluentbit_telemetry.vars.audit_timestamp }}"
      }

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert engineering team if telemetry audit execution fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#logging-pipeline-alerts",
        "text": "FAILED: Fluent Bit Tail Input Buffer Sentinel execution `{{ execution.id }}` failed for plugin `{{ inputs.input_plugin_name }}`."
      }

triggers:
  - id: periodic_fluentbit_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "Fluent Bit Tail Input Buffer Full and Disk Pause Sentinel"
  metaTitle: "Fluent Bit Buffer Sentinel Blueprint"
  shortDescription: "Audits Fluent Bit log forwarder telemetry for input buffer memory saturation, pause throttling, and dropped records."
  metaDescription: "Audits Fluent Bit metrics to detect input tail buffer memory saturation, pause throttling, output retry failures, and record drops."
  description: |
    Automates continuous health and backpressure surveillance for Fluent Bit log collectors and Kubernetes daemonset forwarders.

    ## How it works
    1. A schedule trigger executes the Fluent Bit pipeline audit workflow every 15 minutes.
    2. The Python task queries the Fluent Bit internal Prometheus metrics endpoint on port 2020.
    3. The script extracts tail input record rates, output dropped record totals, and destination retry failures.
    4. An evaluation gate determines whether buffer saturation, dropped records, or retry exhaustion exceed operational limits.
    5. When log forwarding pipeline degradation is detected, a high-priority Slack incident alert is dispatched to Observability SREs.
    6. When container log files tail cleanly and stream without memory buffer throttling, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for log pipeline compliance and telemetry data governance archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Fluent Bit Metrics]
        ScanMetrics --> EvalBreach{Dropped Records > 5 OR Failed Retries > 3?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Logging Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Logging State]
        SlackAlert --> EmitManifest[Debug Return: Logging Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes Fluent Bit internal Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether dropped record counts or output retry failure totals exceed limits.
    - **Notification Task**: Dispatches structured Slack alerts with plugin name and dropped record metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing logging pipeline health and timestamps.

    ## Key capabilities
    - Continuous surveillance of Fluent Bit DaemonSets, Tail input plugins, and remote Elastic/Kafka/Loki sinks.
    - Early warning detection for `Mem_Buf_Limit` saturation that forces inputs to pause and risk log rotation loss.
    - Automated tracking of downstream ingestion backpressure and network buffer disconnects.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into Kubernetes node log collection health and backpressure buffering status.
    - Proactive alerts preventing audit trail loss and telemetry gaps in centralized SIEM and analytics platforms.
    - Standardized audit manifests containing exact byte throughput, record totals, and execution timestamps.
    - Zero-overhead deployment compatible with standard Fluent Bit Helm charts and configuration ConfigMaps.

    ## Who it's for
    - Observability and SRE platform engineers maintaining large-scale log aggregation pipelines.
    - Security operations (SecOps) teams ensuring zero audit log loss for regulatory compliance (PCI-DSS, HIPAA).
    - Kubernetes cluster administrators diagnosing node memory spikes caused by unbounded logging buffers.
    - Cloud infrastructure leads optimizing centralized log shipping egress bandwidth and storage costs.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages logging pipeline surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical log collection metrics in searchable Kestra execution logs.

    ## Use cases
    - **Downstream Elastic Outage Detection**: Identifies when a remote Elasticsearch/OpenSearch cluster rejects log batches.
    - **Noisy Container Storm Alarm**: Alerts engineers when a runaway container floods Docker logs faster than buffer limits.
    - **Disk Storage Buffering Stall**: Measures filesystem buffer queue growth when network interfaces flap.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `fluentbit_metrics_url` | STRING | `http://fluent-bit.logging.svc.cluster.local:2020` | Internal HTTP URL exposing Prometheus metrics for Fluent Bit. |
    | `input_plugin_name` | STRING | `tail.0` | Identifier of the target Fluent Bit tail input plugin monitored. |
    | `max_dropped_records_threshold` | INT | `5` | Maximum allowable dropped log records before alerting. |
    | `max_failed_retries_threshold` | INT | `3` | Maximum allowable output retry failures before alerting. |
    | `alert_on_output_drop` | BOOL | `true` | Toggle whether any dropped record triggers an immediate incident alert. |

    ## Expected outputs
    - `{{ outputs.scan_fluentbit_telemetry.vars.records_input_total }}`: Total count of log records ingested by the tail plugin.
    - `{{ outputs.scan_fluentbit_telemetry.vars.bytes_input_total }}`: Total volume of log data processed in bytes.
    - `{{ outputs.scan_fluentbit_telemetry.vars.dropped_records_total }}`: Total count of log records dropped due to buffer overflow.
    - `{{ outputs.scan_fluentbit_telemetry.vars.is_alerting }}`: Boolean flag indicating if logging health bounds are breached.
    - `{{ outputs.scan_fluentbit_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the Fluent Bit audit run.

    ## Prerequisites
    - Fluent Bit deployed as a DaemonSet with HTTP monitoring enabled (`HTTP_Server On`, `HTTP_Port 2020`).
    - Network connectivity from the Kestra worker to the Fluent Bit daemonset metrics port across nodes.
    - Configured Slack incoming webhook URL with permissions to post in observability alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL.
  tags:
    - Infrastructure
  subTags:
    - Logging & Observability
    - Incident & Ticketing Notification
    - Monitoring & Alerting
  ee: false
  demo: false
