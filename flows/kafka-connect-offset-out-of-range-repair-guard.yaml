id: kafka-connect-offset-out-of-range-repair-guard
namespace: company.team
description: Repair retention-invalid sink offsets to the earliest retained position after explicit loss acceptance.
concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: connect_url
    type: STRING
    defaults: http://localhost:8083
  - id: connect_username
    type: STRING
    defaults: operator
  - id: connect_password
    type: SECRET
    defaults: "{{ secret('KAFKA_CONNECT_PASSWORD') }}"
  - id: bootstrap_servers
    type: STRING
    defaults: localhost:9092
  - id: broker_security
    type: SECRET
    description: Java client security properties, without bootstrap.servers. Use an empty secret for PLAINTEXT.
    defaults: "{{ secret('KAFKA_CLIENT_SECURITY') }}"
  - id: connector_name
    type: STRING
    defaults: orders-sink
  - id: topic
    type: STRING
    defaults: orders
  - id: max_partitions
    type: INT
    defaults: 16
  - id: auto_remediate
    type: BOOL
    defaults: false
  - id: dry_run
    type: BOOL
    defaults: true
  - id: finish_stopped_repair
    type: BOOL
    defaults: false
    description: Explicitly finish a previous repair whose offsets landed but whose resume was interrupted.
  - id: slack_url
    type: SECRET
    defaults: "{{ secret('SLACK_WEBHOOK_URL') }}"

variables:
  scan_script: |
    import json, os, re, subprocess
    from pathlib import Path
    def load(name):
        raw = Path(name).read_bytes()
        if len(raw) > 65536: raise ValueError('snapshot exceeds 64 KiB')
        return json.loads(raw)
    def offsets(rows):
        if not isinstance(rows, list) or len(rows) > 128: raise ValueError('offset inventory exceeds 128')
        result = {}
        for row in rows:
            p, o = row['partition'], row['offset']
            if set(p) != {'kafka_topic', 'kafka_partition'} or set(o) != {'kafka_offset'}:
                raise ValueError('not a sink offset shape')
            t, n, v = p['kafka_topic'], p['kafka_partition'], o['kafka_offset']
            if not isinstance(t, str) or type(n) is not int or type(v) is not int or n < 0 or v < 0:
                raise ValueError('invalid offset')
            if (t, n) in result: raise ValueError('duplicate partition')
            result[t, n] = v
        return result
    topic = os.environ['TOPIC']
    cap = int(os.environ['CAP'])
    config = load('config.json')
    status = load('status.json')
    current = offsets(load('offsets.json'))
    # Source connectors never reach the patch. Only explicit topic subscription is supported.
    if config.get('topics.regex') or topic not in config.get('topics', '').split(','):
        raise ValueError('target topic is not an explicit subscription')
    if config.get('consumer.override.bootstrap.servers') or config.get('consumer.override.group.id'):
        raise ValueError('consumer broker/group override unsupported')
    if config.get('consumer.override.auto.offset.reset') != 'none':
        raise ValueError('require auto.offset.reset=none to make loss explicit')
    def bounds(which):
        cmd = ['kafka-get-offsets', '--bootstrap-server', os.environ['BROKERS'], '--command-config', 'client.properties', '--topic', re.escape(topic), '--time', which]
        # File-backed bounded results avoid capturing arbitrary response bytes in memory.
        import resource
        resource.setrlimit(resource.RLIMIT_FSIZE, (65536, 65536))
        with open('bounds-'+which+'.txt', 'w+') as out, open('bounds-errors.txt', 'w') as err:
            r = subprocess.run(cmd, stdout=out, stderr=err, text=True, timeout=20)
            out.seek(0)
            text = out.read(65537)
        if r.returncode or len(text) > 65536: raise ValueError('broker bounds read failed')
        result = {}
        for line in text.splitlines():
            t, p, v = line.rsplit(':', 2)
            if t != topic or int(p) in result or int(v) < 0: raise ValueError('invalid broker bounds')
            result[int(p)] = int(v)
        if not result or len(result) > cap: raise ValueError('empty or oversized partition set')
        return result
    earliest, latest = bounds('earliest'), bounds('latest')
    if earliest.keys() != latest.keys(): raise ValueError('partition set changed')
    if any((topic, p) not in current for p in earliest): raise ValueError('uncommitted partition, no safe repair')
    if {p for t, p in current if t == topic} != earliest.keys(): raise ValueError('offset partition set differs')
    targets = []
    for p in sorted(earliest):
        v, lo, hi = current[topic, p], earliest[p], latest[p]
        if lo > hi or v > hi: raise ValueError('ahead-of-end or inconsistent bounds, refuse')
        if v < lo:
            targets.append({'partition': {'kafka_topic': topic, 'kafka_partition': p}, 'offset': {'kafka_offset': lo}, 'before': v, 'end': hi, 'lost_offset_span': lo-v})
    old = load('baseline.json')
    if old:
        if current != offsets(old['snapshot']) or config != old['config']:
            raise ValueError('stale approval: offsets or config changed')
        if targets != old['targets']: raise ValueError('retention bounds changed, request fresh loss approval')
        if status['connectorState'] != 'STOPPED' or status.get('tasks'):
            raise ValueError('connector has not fully stopped')
    result = {'snapshot': load('offsets.json'), 'config': config, 'targets': targets, 'ends': [{'partition': {'kafka_topic': topic, 'kafka_partition': p}, 'end': latest[p]} for p in sorted(latest)], 'patch': [{'partition': x['partition'], 'offset': x['offset']} for x in targets]}
    print('::'+json.dumps({'outputs': {'plan': result, 'count': len(targets)}})+'::')

tasks:
  - id: validate_inputs
    type: io.kestra.plugin.core.execution.Assert
    conditions:
      - "{{ inputs.max_partitions >= 1 and inputs.max_partitions <= 16 }}"
      - "{{ inputs.topic | length > 0 and inputs.topic | length <= 249 }}"
      - "{{ inputs.topic | replace({'[A-Za-z0-9._-]': ''}, regexp=true) | length == 0 }}"
      - "{{ inputs.topic != '.' and inputs.topic != '..' }}"
      - "{{ inputs.connector_name | length > 0 and inputs.connector_name | length <= 200 }}"
      - "{{ inputs.connector_name | replace({'[A-Za-z0-9._-]': ''}, regexp=true) | length == 0 }}"
      - "{{ inputs.bootstrap_servers | length > 0 and inputs.bootstrap_servers | length <= 1024 }}"
    errorMessage: Invalid bounded target inputs.
  - id: read_config
    type: io.kestra.plugin.kafka.ConnectorGetConfig
    timeout: PT30S
    connectUrl: "{{ inputs.connect_url }}"
    username: "{{ inputs.connect_username }}"
    password: "{{ inputs.connect_password }}"
    connectorName: "{{ inputs.connector_name }}"
  - id: read_status
    type: io.kestra.plugin.kafka.ConnectorGetStatus
    timeout: PT30S
    connectUrl: "{{ inputs.connect_url }}"
    username: "{{ inputs.connect_username }}"
    password: "{{ inputs.connect_password }}"
    connectorName: "{{ inputs.connector_name }}"
  - id: read_offsets
    type: io.kestra.plugin.kafka.ConnectorGetOffsets
    timeout: PT30S
    connectUrl: "{{ inputs.connect_url }}"
    username: "{{ inputs.connect_username }}"
    password: "{{ inputs.connect_password }}"
    connectorName: "{{ inputs.connector_name }}"
  - id: plan
    type: io.kestra.plugin.scripts.python.Script
    description: Kafka plugin has no earliest-offset task. Use Kafka's own bounded GetOffsetShell read.
    timeout: PT55S
    containerImage: confluentinc/cp-kafka-connect:7.9.0@sha256:535b1751f64af95bee4bf15ad2ab6b1ca2b369131711801c93e3ceac836dd2a1
    pythonVersion: '3.9'
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      user: root
      memory:
        memory: 536870912
    inputFiles:
      offsets.json: "{{ outputs.read_offsets.offsets | toJson }}"
      config.json: "{{ outputs.read_config.config | toJson }}"
      status.json: "{{ outputs.read_status | toJson }}"
      baseline.json: '{}'
      client.properties: "{{ inputs.broker_security }}"
    env:
      TOPIC: "{{ inputs.topic }}"
      CAP: "{{ inputs.max_partitions }}"
      BROKERS: "{{ inputs.bootstrap_servers }}"
      KAFKA_HEAP_OPTS: -Xms64m -Xmx192m
    script: "{{ vars.scan_script }}"
  - id: report
    type: io.kestra.plugin.core.log.Log
    message: >-
      {{ outputs.plan.vars.count }} retention-invalid partition(s).
      Lost offset intervals are not recoverable from this Kafka log.
      Proposed earliest-only changes: {{ outputs.plan.vars.plan.targets | toJson }}.
  - id: repair_gate
    type: io.kestra.plugin.core.flow.If
    condition: >-
      {{ inputs.auto_remediate and not inputs.dry_run and (outputs.plan.vars.count > 0 or
         (inputs.finish_stopped_repair and outputs.read_status.connectorState == 'STOPPED' and outputs.read_status.tasks | length == 0)) }}
    then:
      - id: approve_loss
        type: io.kestra.plugin.core.flow.Pause
        timeout: PT1H
        description: >-
          Accept the reported irrecoverable offset intervals. Confirm this execution is the exclusive
          admin for connector/config/group and topic identity until verification finishes. Suspend
          competing admin automation. Source topic retention may advance, but then this plan is refused.
        onResume:
          - id: approved
            type: BOOL
            defaults: false
          - id: exclusive_admin
            type: BOOL
            defaults: false
      - id: approval_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ (outputs.approve_loss.onResume.approved ?? false) and (outputs.approve_loss.onResume.exclusive_admin ?? false) }}"
        then:
          - id: fresh_config
            type: io.kestra.plugin.kafka.ConnectorGetConfig
            timeout: PT30S
            connectUrl: "{{ inputs.connect_url }}"
            username: "{{ inputs.connect_username }}"
            password: "{{ inputs.connect_password }}"
            connectorName: "{{ inputs.connector_name }}"
          - id: fresh_offsets
            type: io.kestra.plugin.kafka.ConnectorGetOffsets
            timeout: PT30S
            connectUrl: "{{ inputs.connect_url }}"
            username: "{{ inputs.connect_username }}"
            password: "{{ inputs.connect_password }}"
            connectorName: "{{ inputs.connector_name }}"
          - id: stale_gate
            type: io.kestra.plugin.core.execution.Assert
            conditions:
              - "{{ outputs.fresh_config.config == outputs.read_config.config }}"
              - "{{ outputs.fresh_offsets.offsets | toJson == outputs.read_offsets.offsets | toJson }}"
            errorMessage: Approval snapshot changed. No stop or patch attempted.
          - id: stop
            type: io.kestra.plugin.core.http.Request
            description: No Kafka ConnectorStop task exists. Use Connect PUT stop, never pause.
            timeout: PT30S
            uri: "{{ inputs.connect_url }}/connectors/{{ inputs.connector_name }}/stop"
            method: PUT
            options:
              timeout:
                connectTimeout: PT5S
                readIdleTimeout: PT15S
              auth:
                type: BASIC
                username: "{{ inputs.connect_username }}"
                password: "{{ inputs.connect_password }}"
          - id: stop_settle
            type: io.kestra.plugin.core.flow.Sleep
            duration: PT3S
          - id: stopped_status
            type: io.kestra.plugin.kafka.ConnectorGetStatus
            timeout: PT30S
            connectUrl: "{{ inputs.connect_url }}"
            username: "{{ inputs.connect_username }}"
            password: "{{ inputs.connect_password }}"
            connectorName: "{{ inputs.connector_name }}"
          - id: stopped_offsets
            type: io.kestra.plugin.kafka.ConnectorGetOffsets
            timeout: PT30S
            connectUrl: "{{ inputs.connect_url }}"
            username: "{{ inputs.connect_username }}"
            password: "{{ inputs.connect_password }}"
            connectorName: "{{ inputs.connector_name }}"
          - id: stopped_config
            type: io.kestra.plugin.kafka.ConnectorGetConfig
            timeout: PT30S
            connectUrl: "{{ inputs.connect_url }}"
            username: "{{ inputs.connect_username }}"
            password: "{{ inputs.connect_password }}"
            connectorName: "{{ inputs.connector_name }}"
          - id: final_plan
            type: io.kestra.plugin.scripts.python.Script
            timeout: PT55S
            containerImage: confluentinc/cp-kafka-connect:7.9.0@sha256:535b1751f64af95bee4bf15ad2ab6b1ca2b369131711801c93e3ceac836dd2a1
            pythonVersion: '3.9'
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
              user: root
              memory:
                memory: 536870912
            inputFiles:
              offsets.json: "{{ outputs.stopped_offsets.offsets | toJson }}"
              config.json: "{{ outputs.stopped_config.config | toJson }}"
              status.json: "{{ outputs.stopped_status | toJson }}"
              baseline.json: "{{ outputs.plan.vars.plan | toJson }}"
              client.properties: "{{ inputs.broker_security }}"
            env:
              TOPIC: "{{ inputs.topic }}"
              CAP: "{{ inputs.max_partitions }}"
              BROKERS: "{{ inputs.bootstrap_servers }}"
              KAFKA_HEAP_OPTS: -Xms64m -Xmx192m
            script: "{{ vars.scan_script }}"
          - id: patch_if_invalid
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.final_plan.vars.count > 0 }}"
            then:
              - id: patch
                type: io.kestra.plugin.kafka.ConnectorAlterOffsets
                timeout: PT30S
                connectUrl: "{{ inputs.connect_url }}"
                username: "{{ inputs.connect_username }}"
                password: "{{ inputs.connect_password }}"
                connectorName: "{{ inputs.connector_name }}"
                offsets: "{{ outputs.final_plan.vars.plan.patch }}"
          - id: patched_offsets
            type: io.kestra.plugin.kafka.ConnectorGetOffsets
            timeout: PT30S
            connectUrl: "{{ inputs.connect_url }}"
            username: "{{ inputs.connect_username }}"
            password: "{{ inputs.connect_password }}"
            connectorName: "{{ inputs.connector_name }}"
          - id: patch_verify
            type: io.kestra.plugin.core.execution.Assert
            conditions:
              - >-
                {{ {'old': outputs.read_offsets.offsets, 'patch': outputs.final_plan.vars.plan.patch, 'got': outputs.patched_offsets.offsets} | jq('def keyed: map({key: (.partition.kafka_topic + "/" + (.partition.kafka_partition | tostring)), value: .offset}) | from_entries; (.old | keyed) as $old | (.patch | keyed) as $p | (.got | keyed) == ($old + $p)') | first }}
            errorMessage: Patch did not land exactly or protected offsets changed. Connector remains stopped.
          - id: resume
            type: io.kestra.plugin.kafka.ConnectorResume
            timeout: PT30S
            connectUrl: "{{ inputs.connect_url }}"
            username: "{{ inputs.connect_username }}"
            password: "{{ inputs.connect_password }}"
            connectorName: "{{ inputs.connector_name }}"
          - id: recovery_settle
            type: io.kestra.plugin.core.flow.Sleep
            duration: PT15S
          - id: recovered_status
            type: io.kestra.plugin.kafka.ConnectorGetStatus
            timeout: PT30S
            connectUrl: "{{ inputs.connect_url }}"
            username: "{{ inputs.connect_username }}"
            password: "{{ inputs.connect_password }}"
            connectorName: "{{ inputs.connector_name }}"
          - id: recovered_offsets
            type: io.kestra.plugin.kafka.ConnectorGetOffsets
            timeout: PT30S
            connectUrl: "{{ inputs.connect_url }}"
            username: "{{ inputs.connect_username }}"
            password: "{{ inputs.connect_password }}"
            connectorName: "{{ inputs.connector_name }}"
          - id: recovery_verify
            type: io.kestra.plugin.core.execution.Assert
            conditions:
              - "{{ outputs.recovered_status.connectorState == 'RUNNING' }}"
              - "{{ outputs.recovered_status.tasks | length > 0 }}"
              - >-
                {{ outputs.recovered_status.tasks | jq('all(.[]; .state == "RUNNING")') | first }}
              - >-
                {{ {'want': outputs.final_plan.vars.plan.ends, 'got': outputs.recovered_offsets.offsets} | jq('.got as $g | all(.want[]; . as $w | any($g[]; .partition == $w.partition and .offset.kafka_offset >= $w.end))') | first }}
            errorMessage: Sink has not committed through the observed retained log end. Inspect the sink before retry.
          - id: repaired
            type: io.kestra.plugin.core.log.Log
            message: Retained log end reached. Deleted records were not restored.
        else:
          - id: declined
            type: io.kestra.plugin.core.log.Log
            message: No loss acceptance or exclusive-admin confirmation. No mutation performed.

errors:
  - id: failure_alert
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    timeout: PT20S
    url: "{{ inputs.slack_url }}"
    payload: >-
      {{ {'text': 'Kafka Connect retention repair failed. Execution ' ~ execution.id ~ '. Inspect actual offsets and connector state before retry. Deleted records cannot be restored by this flow.'} | toJson }}

triggers:
  - id: audit_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: '11 * * * *'
    disabled: true
    inputs:
      dry_run: true
      auto_remediate: false

extend:
  # SPDX-License-Identifier: Apache-2.0
  title: Repair Kafka Connect Offsets Invalidated by Retention
  metaTitle: Repair Kafka Connect Retention Invalid Offsets with Kestra
  shortDescription: Accept an irrecoverable retention gap then move only invalid sink partitions to their earliest retained offset and verify progress.
  metaDescription: Repair Kafka Connect sink offsets below retention bounds with loss approval, STOPPED checks and retained-log progress verification.
  tags: [Data, Infrastructure]
  subTags: [Realtime & Streaming, Day 2 Operations]
  ee: false
  demo: false
  description: |
    ## Safety

    Retention can remove unread records while a sink is stopped. With `auto.offset.reset=none`, its task fails on the old offset. Advancing to the earliest retained position accepts that loss. Deleted records are not restored.

    | Guard | What it stops |
    |---|---|
    | Dry run plus explicit loss approval | Unapproved offset movement |
    | Exclusive-admin confirmation | Cooperating admin automation overwriting the plan |
    | STOPPED, no tasks and fresh snapshot | Active consumers or stale approval |
    | Earliest-only narrow patch | Skipping retained records or changing other offsets |
    | Exact patch and progress checks | Reporting an ineffective repair as success |

    ## How it works

    1. `ConnectorGetConfig`, `ConnectorGetStatus` and `ConnectorGetOffsets` read one sink. Explicit topic subscription and reset policy `none` are required. Consumer broker/group overrides are refused.
    2. Kafka's `GetOffsetShell` reads bounds because the plugin has no earliest-offset task. Python joins sink offsets to bounds. Missing offsets, unknown shapes or ahead-of-end positions fail closed.
    3. `report` lists invalid partitions and lost offset spans. Live mode needs both mode inputs and `Pause` loss/exclusive-admin approval.
    4. Fresh snapshot checks precede REST stop. After STOPPED with no tasks, bounds must match approval. `ConnectorAlterOffsets` patches invalid entries. Whole-map readback verifies that narrow change.
    5. `ConnectorResume` starts the sink. After 15 seconds, every task must be RUNNING and target-topic offsets must reach the observed end. Failure alerts Slack. No automatic rollback runs.

    ## What you get

    An explicit loss interval, bounded retained-work recovery and protected-offset readback.

    ## Who it's for

    On-call streaming teams whose stopped sinks outlast topic retention.

    ## Why orchestrate this with Kestra

    Loss approval, native recovery and verification share one execution. QUEUE1 prevents this flow overlapping itself during approval.

    ## Tested end to end

    Kestra 2.0.6 and 2.0.5 with Kafka Connect 7.9.0. Real timed segment retention left committed offset 2 below earliest 9. Repair reached end 12 and delivered three retained markers. Independent Kafka CLI/API reads conserved protected offset 3, its three source records, connector config and five prior sink lines. A fresh fixture reproduced the same incident.

    | Case | Execution | Result |
    |---|---|---|
    | Healthy | `1GgsDKpVnLzTSnsnNE5lyg` | SUCCESS |
    | Dry | `1LBg1h4DusLkznhwzjoyKt` | SUCCESS |
    | Declined | `3nYvQLnJWBruX2YRVeXkQl` | SUCCESS |
    | Repair | `3t1620TRaGtpErxxv2A2Yl` | SUCCESS |
    | Refused patch | `5yiz3mW4qaPZMIe7oYaRFV` | FAILED |
    | Repeat | `2q00jE1E7irpTnn58qiB9E` | SUCCESS |
    | Stale offsets | `4eE5miZnElpfxsLuhL2VP7` | FAILED |

    ## Prerequisites

    Connect 3.6+ with an offset-alter-capable sink and Docker runner access. Target REST read/stop/patch/resume rights. Kafka topic DESCRIBE for bounds; Connect worker group/topic READ for offset writes. Use TLS and a target-only gateway with 64 KiB caps. Config reads persist: use credential-provider references, never literal config secrets.

    ### Secrets

    `KAFKA_CONNECT_PASSWORD`, `KAFKA_CLIENT_SECURITY` (Java client properties) and `SLACK_WEBHOOK_URL` feed SECRET inputs.

    ### Inputs

    Set Connect URL/user, brokers, connector and topic. `max_partitions` is 1..16. Defaults: `dry_run=true`, `auto_remediate=false`, `finish_stopped_repair=false`. The schedule is disabled and forces safe mode.

    ## Quick start

    Run dry. Review the lost intervals. Suspend competing admin jobs before approving live mode. A partial repair that landed but stayed STOPPED can be finished with `finish_stopped_repair=true` and fresh approval; already valid offsets are not patched.

    ## How to extend

    Add destination receipts. Limits: exclusive administration is cooperative, not CAS. No topic recreation or competing connector/config/group edits during the run. Breaking that contract leaves check/write races. Bound changes need a new plan. Ceilings: 20-second subprocesses, 64 KiB snapshots, 128 offsets and 512 MiB runners. A slow sink can fail progress after a valid write. At-least-once duplicates remain possible.

    ## Links

    [KIP-875](https://cwiki.apache.org/confluence/display/KAFKA/KIP-875:+First-class+offsets+support+in+Kafka+Connect), [Kafka plugin](https://kestra.io/plugins/plugin-kafka).

    This blueprint was created by [zkasuran](https://github.com/zkasuran).
