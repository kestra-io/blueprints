id: s3-incomplete-multipart-cleanup-audit
namespace: company.team
description: |
  Audit S3 buckets for incomplete multipart uploads older than a threshold,
  which silently accrue storage charges, and alert Slack with the offenders.

triggers:
  - id: weekly_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly sweep catches abandoned uploads from failed clients. Shipped disabled; enable after a manual run verifies AWS credentials.
    cron: "0 6 * * 1"
    disabled: true

inputs:
  - id: region
    type: STRING
    defaults: "us-east-1"
    description: Region to scope any regional checks.
  - id: older_than_days
    type: INT
    defaults: 7
    description: Incomplete uploads initiated more than this many days ago count as abandoned waste.

tasks:
  - id: audit_uploads
    type: io.kestra.plugin.scripts.shell.Commands
    description: List buckets then list-multipart-uploads per bucket, filter by Initiated age, and emit counts plus offender bucket/key list via the stdout outputs protocol.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    commands:
      - |
        pip install --quiet awscli 2>/dev/null
        cat > audit.py <<'PYEOF'
        import json, subprocess, datetime, os
        region = os.environ.get("AWS_REGION", "us-east-1")
        threshold = int(os.environ.get("OLDER_THAN_DAYS", "7"))
        cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=threshold)
        offenders = []
        checked_buckets = 0
        abandoned = 0
        try:
            buckets = json.loads(subprocess.run(["aws", "s3api", "list-buckets", "--query", "Buckets[].Name", "--output", "json"], capture_output=True, text=True, timeout=60).stdout or "[]")
        except Exception:
            buckets = []
        for b in buckets:
            checked_buckets += 1
            try:
                out = subprocess.run(["aws", "s3api", "list-multipart-uploads", "--bucket", b, "--region", region, "--output", "json"], capture_output=True, text=True, timeout=60)
                uploads = json.loads(out.stdout or "{}").get("Uploads", [])
            except Exception:
                continue
            for u in uploads:
                try:
                    initiated = datetime.datetime.fromisoformat(str(u.get("Initiated", "")).replace("Z", "+00:00"))
                except Exception:
                    continue
                if initiated < cutoff:
                    abandoned += 1
                    offenders.append(f"{b}/{u.get('Key', '?')}")
        print(f"checked {checked_buckets} bucket(s), {abandoned} abandoned upload(s)")
        print("::" + json.dumps({"outputs": {"buckets": checked_buckets, "abandoned": abandoned, "keys": ",".join(offenders[:50])}}) + "::")
        PYEOF
        python3 audit.py
    env:
      AWS_REGION: "{{ inputs.region }}"
      OLDER_THAN_DAYS: "{{ inputs.older_than_days }}"

  - id: waste_found
    type: io.kestra.plugin.core.flow.If
    description: One branch for waste - any abandoned upload goes to Slack.
    condition: "{{ outputs.audit_uploads.vars.abandoned > 0 }}"
    then:
      - id: alert_waste
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Name the abandoned uploads so cleanup starts with exact keys.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":money_with_wings: S3 multipart waste audit: {{ outputs.audit_uploads.vars.abandoned }} abandoned upload(s) older than {{ inputs.older_than_days }}d across {{ outputs.audit_uploads.vars.buckets }} bucket(s). Keys: {{ outputs.audit_uploads.vars.keys }}"
          }
    else:
      - id: log_clean
        type: io.kestra.plugin.core.log.Log
        description: Record the passing audit for the FinOps trail.
        message: "S3 multipart audit clean: {{ outputs.audit_uploads.vars.buckets }} bucket(s) with no abandoned uploads."

errors:
  - id: alert_audit_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the audit itself fails - no result must ever read as no waste.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "S3 multipart waste audit FAILED in flow {{ flow.id }} (execution {{ execution.id }}). Check AWS credentials and the task logs."
      }

outputs:
  - id: audit_summary
    type: JSON
    description: 'Audit result counts, e.g. {"buckets": 9, "abandoned": 2}'
    value: '{{ {"buckets": outputs.audit_uploads.vars.buckets, "abandoned": outputs.audit_uploads.vars.abandoned} | toJson }}'

extend:
  title: Audit Abandoned S3 Multipart Uploads for Hidden Storage Waste
  shortDescription: Weekly sweep of incomplete multipart uploads older than a threshold, alerting Slack with the abandoned keys.
  metaTitle: S3 Incomplete Multipart Upload Waste Audit
  metaDescription: Find abandoned S3 multipart uploads accruing storage charges and alert Slack with the keys.
  description: |
    A crashed uploader leaves its parts behind and S3 bills for them until the upload is aborted. This blueprint scans every bucket for incomplete multipart uploads older than `older_than_days` and alerts Slack with the exact abandoned keys. The schedule ships disabled so you can verify credentials first.

    ## How it works

    1. `audit_uploads` (`io.kestra.plugin.scripts.shell.Commands` on the AWS CLI) lists buckets and runs `list-multipart-uploads` per bucket, filters by `Initiated` age, and emits counts plus the offender list via the `::{"outputs": ...}::` protocol.
    2. `waste_found` (`io.kestra.plugin.core.flow.If`) branches: any abandoned upload -> `alert_waste`; clean -> `log_clean`.
    3. The `errors` block alerts when the audit itself fails.
    4. Triggers: a disabled weekly `Schedule`.

    ## What you get

    - Named list of abandoned bucket/key uploads past the threshold.
    - A weekly FinOps sweep with history in every execution.
    - Failure alerts so a dead credential never reads as "no waste".

    ## Who it's for

    - FinOps engineers trimming S3 spend.
    - Data teams with large interrupted uploads.
    - Anyone paying for parts of files that never finished.

    ## Why orchestrate this with Kestra

    The AWS CLI answers questions; the flow turns them into a verdict on a schedule, with an alert that names names. The next step (abort-multipart-upload, add a lifecycle abort rule, tag the owner) is one task away.

    ## Prerequisites

    - Docker available on the Kestra Worker.
    - AWS credentials with `s3:ListBucket`, `s3:ListBucketMultipartUploads` in the environment or an instance profile.
    - A Slack webhook.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: webhook for waste and failure alerts.

    ## Quick start

    1. Add the Slack webhook secret and AWS credentials.
    2. Run once to see `audit_summary`.
    3. Enable the weekly schedule.

    ## How to extend

    - Auto-abort with `abort-multipart-upload` after a second confirmation window.
    - Add a bucket lifecycle rule aborting incomplete uploads after N days.
    - Sum part sizes to estimate monthly savings.

    ## Links

    - [list-multipart-uploads](https://docs.aws.amazon.com/cli/latest/reference/s3api/list-multipart-uploads.html)
    - [S3 lifecycle abort rule](https://docs.aws.amazon.com/AmazonS3/latest/userguide/mpu-abort-incomplete-mpu-lifecycle-config.html)

    - This blueprint has been created by [yashspidey](https://github.com/yashspidey)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - AWS Services
    - FinOps & Cost Management
  ee: false
  demo: false
