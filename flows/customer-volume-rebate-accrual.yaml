id: customer-volume-rebate-accrual
namespace: company.team

description: |
  Monthly customer volume rebate accrual (IFRS 15 variable consideration, ASC 606): for each
  rebate agreement, project the customer's full-year purchases from the year to date, find
  the tier they will reach, and accrue the expected rebate on the sales to date, booking only
  the change since last month. Tiers are retroactive or incremental per agreement, returns
  reduce the qualifying volume, and customers close to the next tier are flagged for sales.

inputs:
  - id: period
    type: STRING
    displayName: Month (YYYY-MM)
    defaults: "2026-09"
    validator: ^\d{4}-(0[1-9]|1[0-2])$

  - id: near_tier_pct
    type: FLOAT
    displayName: Near the next tier (%)
    description: A customer projected within this percentage of the next tier is flagged as an upsell lead.
    defaults: 10.0

  - id: scenario
    type: SELECT
    displayName: Demo scenario
    description: ISSUES adds an agreement whose tiers overlap and sales to a customer with two agreements for the same year, which must stop the accrual.
    values:
      - CLEAN
      - ISSUES
    defaults: CLEAN

variables:
  state_key: rebate_accruals

concurrency:
  limit: 1

tasks:
  - id: state
    type: io.kestra.plugin.core.output.OutputValues
    values:
      booked: >-
        {{ (kv(vars.state_key, errorOnMissing=false) ?? {'months': {}}) | jq('.months | to_entries | map(select(.key < "' ~ inputs.period ~ '" and (.key | startswith("' ~ (inputs.period | slice(0, 4)) ~ '-")))) | sort_by(.key) | last | .value.balances // {}') | first | toJson }}

  - id: accrual
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: >
      One DuckDB session: rebate agreements and tiers, monthly invoiced sales and returns per
      customer (demo generator or your ERP), then the projection, the expected tier, the
      accrual balance per agreement and the journal for the change since last month.
    outputFiles:
      - agreements
      - journal
      - blockers
    fetchType: FETCH_ONE
    sql: |
      SET VARIABLE p = '{{ inputs.period }}';
      SET VARIABLE m = month(strptime(getvariable('p') || '-01', '%Y-%m-%d'))::INT;
      SET VARIABLE y = year(strptime(getvariable('p') || '-01', '%Y-%m-%d'))::INT;

      -- =======================================================================
      -- Agreements and tiers. Replace with your contract or pricing system.
      -- RETRO: the rate of the tier reached applies to all purchases.
      -- INCREMENTAL: each tier's rate applies only to the volume inside it.
      -- =======================================================================
      CREATE TABLE agreements (agreement VARCHAR, customer VARCHAR, year INT, kind VARCHAR, gl_account VARCHAR);
      INSERT INTO agreements VALUES
        ('RB-01', 'Northwind Retail', 2026, 'RETRO', '4910'), ('RB-02', 'Contoso Stores', 2026, 'RETRO', '4910'),
        ('RB-03', 'Fabrikam Wholesale', 2026, 'INCREMENTAL', '4910'), ('RB-04', 'Tailspin Hardware', 2026, 'RETRO', '4910'),
        ('RB-05', 'Litware Distribution', 2026, 'INCREMENTAL', '4910');
      CREATE TABLE tiers (agreement VARCHAR, tier INT, from_amount DOUBLE, to_amount DOUBLE, rate_pct DOUBLE);
      INSERT INTO tiers VALUES
        ('RB-01', 1, 0, 1000000, 0), ('RB-01', 2, 1000000, 2500000, 2.0), ('RB-01', 3, 2500000, NULL, 3.5),
        ('RB-02', 1, 0, 500000, 1.0), ('RB-02', 2, 500000, 1500000, 2.5), ('RB-02', 3, 1500000, NULL, 4.0),
        ('RB-03', 1, 0, 2000000, 0), ('RB-03', 2, 2000000, 4000000, 3.0), ('RB-03', 3, 4000000, NULL, 5.0),
        ('RB-04', 1, 0, 750000, 0), ('RB-04', 2, 750000, NULL, 3.0),
        ('RB-05', 1, 0, 1000000, 1.0), ('RB-05', 2, 1000000, 3000000, 2.0), ('RB-05', 3, 3000000, NULL, 3.0);
      {% if inputs.scenario == 'ISSUES' %}
      INSERT INTO agreements VALUES ('RB-06', 'Woodgrove Foods', 2026, 'RETRO', '4910'), ('RB-07', 'Contoso Stores', 2026, 'RETRO', '4910');
      INSERT INTO tiers VALUES ('RB-06', 1, 0, 800000, 0), ('RB-06', 2, 600000, NULL, 2.0), ('RB-07', 1, 0, NULL, 1.5);
      {% endif %}

      -- Net invoiced sales per month (after returns), fixed demo history for 2026.
      -- Northwind accelerates in the autumn; Contoso had a large return in August.
      CREATE TABLE sales AS
      SELECT c.customer, 2026 AS year, mth AS month,
             round(c.base * (1 + c.trend * (mth - 1)) * (1 + 0.15 * sin(mth)), 2) AS gross,
             CASE WHEN c.customer = 'Contoso Stores' AND mth = 8 THEN 95000 ELSE round(c.base * 0.01, 2) END AS returns
      FROM (VALUES ('Northwind Retail', 175000, 0.06), ('Contoso Stores', 127000, 0.01), ('Fabrikam Wholesale', 290000, 0.02),
                   ('Tailspin Hardware', 60000, 0.0), ('Litware Distribution', 205000, -0.01)) c(customer, base, trend),
           range(1, 13) t(mth);

      -- =======================================================================
      -- Checks.
      -- =======================================================================
      CREATE TABLE blockers AS
      SELECT 'TIER_OVERLAP' AS code, a.agreement AS ref, 'Tier ' || b.tier || ' starts at ' || b.from_amount || ', before tier ' || a.tier || ' ends at ' || a.to_amount AS detail
        FROM tiers a JOIN tiers b ON a.agreement = b.agreement AND b.tier = a.tier + 1 WHERE b.from_amount <> a.to_amount
      UNION ALL SELECT 'TWO_AGREEMENTS', customer, count(*) || ' agreements for ' || year FROM agreements GROUP BY customer, year HAVING count(*) > 1
      UNION ALL SELECT 'NO_SALES', customer, 'Agreement with no sales history' FROM agreements a WHERE NOT EXISTS (SELECT 1 FROM sales s WHERE s.customer = a.customer AND s.year = a.year);

      -- =======================================================================
      -- Projection: year to date + the remaining months at the run rate of the
      -- last three months. The expected rebate is computed on the projection,
      -- then accrued in proportion to the sales to date.
      -- =======================================================================
      CREATE TABLE ytd AS
      SELECT a.agreement, a.customer, a.kind, a.gl_account,
             sum(s.gross - s.returns) FILTER (WHERE s.month <= getvariable('m')) AS ytd_net,
             avg(s.gross - s.returns) FILTER (WHERE s.month BETWEEN getvariable('m') - 2 AND getvariable('m')) AS run_rate
      FROM agreements a JOIN sales s ON s.customer = a.customer AND s.year = a.year AND a.year = getvariable('y')
      GROUP BY a.agreement, a.customer, a.kind, a.gl_account;
      ALTER TABLE ytd ADD COLUMN projected DOUBLE;
      UPDATE ytd SET projected = round(ytd_net + run_rate * (12 - getvariable('m')), 2);

      -- Rebate on an amount, for both kinds.
      CREATE MACRO rebate_on(ag, amt) AS (
        SELECT CASE WHEN (SELECT kind FROM agreements WHERE agreement = ag) = 'RETRO'
                    THEN amt * (SELECT rate_pct FROM tiers t WHERE t.agreement = ag AND amt >= t.from_amount AND (t.to_amount IS NULL OR amt < t.to_amount)) / 100
                    ELSE (SELECT sum(greatest(0, least(amt, coalesce(t.to_amount, amt)) - t.from_amount) * t.rate_pct / 100) FROM tiers t WHERE t.agreement = ag) END);

      CREATE TABLE expected AS
      SELECT y.*,
             (SELECT tier FROM tiers t WHERE t.agreement = y.agreement AND y.projected >= t.from_amount AND (t.to_amount IS NULL OR y.projected < t.to_amount)) AS projected_tier,
             (SELECT tier FROM tiers t WHERE t.agreement = y.agreement AND y.ytd_net >= t.from_amount AND (t.to_amount IS NULL OR y.ytd_net < t.to_amount)) AS reached_tier,
             (SELECT min(from_amount) FROM tiers t WHERE t.agreement = y.agreement AND t.from_amount > y.projected) AS next_threshold,
             round(rebate_on(y.agreement, y.projected), 2) AS expected_full_year
      FROM ytd y;
      CREATE TABLE prev AS SELECT key AS agreement, value::DOUBLE AS booked FROM json_each('{{ outputs.state.values.booked }}');
      CREATE TABLE result AS
      SELECT e.*, round(e.expected_full_year * e.ytd_net / nullif(e.projected, 0), 2) AS accrual_balance,
             coalesce(p.booked, 0) AS booked_before,
             round(e.expected_full_year * e.ytd_net / nullif(e.projected, 0) - coalesce(p.booked, 0), 2) AS movement,
             round(100.0 * e.expected_full_year / nullif(e.projected, 0), 3) AS effective_rate_pct,
             CASE WHEN e.next_threshold IS NOT NULL AND e.projected >= e.next_threshold * (1 - {{ inputs.near_tier_pct }} / 100)
                  THEN round(e.next_threshold - e.projected, 0) END AS short_of_next_tier
      FROM expected e LEFT JOIN prev p USING (agreement);

      -- Journal for the movement: rebates reduce revenue (contra-revenue) against an accrued liability.
      CREATE TABLE journal AS
      SELECT '{{ inputs.period }}' AS period, agreement, customer, gl_account AS account, 'Volume rebate ' || agreement || ' ' || customer AS memo,
             CASE WHEN movement > 0 THEN movement ELSE 0 END AS debit, CASE WHEN movement < 0 THEN -movement ELSE 0 END AS credit
      FROM result WHERE movement <> 0
      UNION ALL
      SELECT '{{ inputs.period }}', agreement, customer, '2450', 'Accrued customer rebates ' || agreement,
             CASE WHEN movement < 0 THEN -movement ELSE 0 END, CASE WHEN movement > 0 THEN movement ELSE 0 END
      FROM result WHERE movement <> 0;

      COPY (SELECT agreement, customer, kind, round(ytd_net, 2) AS ytd_net, round(run_rate, 2) AS run_rate, projected, reached_tier, projected_tier,
                   expected_full_year, effective_rate_pct, accrual_balance, booked_before, movement, short_of_next_tier
            FROM result ORDER BY agreement) TO '{{ outputFiles.agreements }}' (HEADER, DELIMITER ',');
      COPY (SELECT * FROM journal ORDER BY agreement, account) TO '{{ outputFiles.journal }}' (HEADER, DELIMITER ',');
      COPY blockers TO '{{ outputFiles.blockers }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT count(*) FROM result)::INT AS agreements,
        (SELECT format('{:,.2f}', sum(accrual_balance)) FROM result) AS balance,
        (SELECT format('{:,.2f}', sum(booked_before)) FROM result) AS booked_before,
        (SELECT CASE WHEN sum(movement) >= 0 THEN '+' ELSE '-' END || format('{:,.2f}', abs(sum(movement))) FROM result) AS movement,
        (SELECT string_agg(agreement || ' tier ' || reached_tier || ' -> ' || projected_tier || ' (' || effective_rate_pct || '%)', ', ' ORDER BY agreement) FROM result) AS tiers,
        (SELECT coalesce(string_agg(customer || ' ' || format('{:,.0f}', short_of_next_tier) || ' short of tier ' || (projected_tier + 1), '; ' ORDER BY short_of_next_tier), '') FROM result WHERE short_of_next_tier IS NOT NULL) AS near_tier,
        (SELECT coalesce(string_agg(agreement || ' ' || movement, ', ' ORDER BY agreement), '') FROM result WHERE movement < 0) AS releases,
        (SELECT round(sum(debit) - sum(credit), 2) FROM journal) AS journal_imbalance,
        (SELECT json_group_object(agreement, accrual_balance) FROM result)::VARCHAR AS balances,
        (SELECT count(*) FROM blockers)::INT AS blockers,
        (SELECT coalesce(string_agg(code || ' ' || ref, ', ' ORDER BY code, ref), '') FROM blockers) AS blocker_detail;

  - id: result
    type: io.kestra.plugin.core.output.OutputValues
    values:
      r: "{{ (outputs.accrual.outputs | last).row | toJson }}"

  - id: log_accrual
    type: io.kestra.plugin.core.log.Log
    message: |
      Rebate accrual {{ inputs.period }} ({{ inputs.scenario }}): {{ outputs.result.values.r | jq('"\(.agreements) agreements. Balance \(.balance), booked before \(.booked_before), movement \(.movement)."') | first }}
      {{ outputs.result.values.r | jq('"Tier reached -> projected: \(.tiers)."') | first }}
      {{ outputs.result.values.r | jq('if .releases == "" then "" else "Released (projection fell): \(.releases)" end') | first }}
      {{ outputs.result.values.r | jq('if .near_tier == "" then "" else "Close to the next tier, for sales: \(.near_tier)" end') | first }}
      Blockers: {{ outputs.result.values.r | jq('.blockers') | first }} {{ outputs.result.values.r | jq('.blocker_detail') | first }}

  - id: evidence_blockers
    type: io.kestra.plugin.core.namespace.UploadFiles
    namespace: "{{ flow.namespace }}"
    filesMap:
      "rebates/{{ inputs.period }}/blockers.csv": "{{ outputs.accrual.outputFiles.blockers }}"

  - id: gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.result.values.r | jq('.blockers > 0 or .journal_imbalance != 0') | first }}"
    then:
      - id: blocked
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Rebate accrual not booked: {{ outputs.result.values.r | jq('if .blockers > 0 then .blocker_detail else \"journal does not balance\" end') | first }}"

  - id: evidence
    type: io.kestra.plugin.core.namespace.UploadFiles
    namespace: "{{ flow.namespace }}"
    filesMap:
      "rebates/{{ inputs.period }}/agreements.csv": "{{ outputs.accrual.outputFiles.agreements }}"
      "rebates/{{ inputs.period }}/journal.csv": "{{ outputs.accrual.outputFiles.journal }}"

  - id: save
    type: io.kestra.plugin.core.kv.Set
    description: The balance booked for the month. Next month books only the difference.
    key: "{{ vars.state_key }}"
    kvType: JSON
    value: >-
      {{ {'old': (kv(vars.state_key, errorOnMissing=false) ?? {'months': {}}), 'p': inputs.period, 'r': fromJson(outputs.result.values.r)}
         | jq('{months: (.old.months + {(.p): {balances: (.r.balances | fromjson), movement: .r.movement}})}') | first | toJson }}

triggers:
  - id: month_end
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 1 * *"
    disabled: true
    inputs:
      period: "{{ trigger.date | dateAdd(-1, 'MONTHS') | date('yyyy-MM') }}"

extend:
  title: Accrue customer volume rebates every month from the projected tier, booking only the change
  metaTitle: Customer volume rebate accrual under IFRS 15 and ASC 606 with Kestra and DuckDB
  shortDescription: Project each customer's full-year purchases, find the rebate tier they will reach, accrue the expected rebate on sales to date with retroactive or incremental tiers, and book only the month's movement.
  metaDescription: Volume rebate accrual in Kestra and DuckDB. Full-year projection, retro and incremental tiers, monthly true-up journal and near-tier sales leads.
  description: |
    Volume rebates are variable consideration under IFRS 15 and ASC 606. Revenue must be reduced every month by the rebate the customer is expected to earn, not by the one paid at year end. Finance teams usually compute it in a spreadsheet per customer:
    - project the year;
    - find the tier;
    - apply a retroactive or a stepped rate;
    - book the difference with last month.

    A large return in August changes the tier, and the accrual should come down.

    This flow does that every month for every agreement, and keeps the booked balance in KV, so each month books only its movement.

    It runs with no setup and no network. The demo has five customers with 2026 agreements:
    - retroactive and incremental tiers;
    - a customer accelerating in the autumn;
    - a 95,000 return in August that drops a customer back a tier.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## How the accrual is computed

    1. Projected full year = net sales to date + the average of the last three months × the months left.
    2. Expected rebate on the projection:

       | Kind | Rule |
       |---|---|
       | `RETRO` | The rate of the tier reached applies to all purchases from the first unit |
       | `INCREMENTAL` | Each tier's rate applies only to the volume inside that tier |

    3. Accrual balance = expected rebate × sales to date / projection, so the effective rate is spread evenly over the year.
    4. Movement = balance - balance booked last month. It is booked as contra-revenue against accrued customer rebates. A negative movement releases part of the accrual.

    A customer projected within `near_tier_pct` of the next tier is listed for sales: a small extra order can move the whole year to a higher rate.

    ## How it works

    1. `state` loads the balances booked in the latest earlier month of the same year.
    2. `accrual` (`io.kestra.plugin.jdbc.duckdb.Queries`) holds the agreements, tiers and monthly sales net of returns. It checks the data, then projects, applies the tiers through a macro, computes the balance and the movement, and writes the journal.
    3. `log_accrual` prints the balance, the movement, the tiers, the releases and the near-tier customers. `evidence_blockers` stores `blockers.csv`.
    4. `gate` stops before booking on:
       - tiers that overlap or leave a gap;
       - a customer with two agreements for the year;
       - an agreement with no sales;
       - a journal that does not balance.

       Otherwise `evidence` stores `agreements.csv` and `journal.csv`.
    5. `save` (`io.kestra.plugin.core.kv.Set`) stores the month's balances. A rerun of the month replaces them and books the same movement, not a second one.

    ## Tested end to end

    On Kestra 2.0.5 OSS.

    | Run | Month | Result |
    |---|---|---|
    | 1 | 2026-07 | Balance 138,723.84, all of it booked. Northwind and Contoso projected into tier 3. Tailspin 40,937 short of its first rebate tier |
    | 2 | 2026-08 | Contoso's 95,000 return drops it to tier 2: 12,226.73 released. Total movement +8,857.77. Tailspin now 6,909 short |
    | 3 | 2026-09 | Movement +22,220.40, balance 169,802.01. Tailspin 1,077 short, Contoso 25,655 short of tier 3 again |
    | 4 | 2026-09 again | Same movement against August's balance: nothing booked twice |
    | 5 | `ISSUES` | Blocked: overlapping tiers, two agreements for Contoso, an agreement with no sales |

    I recomputed the expected rebate, the balance, the brought-forward balance and the movement of the 15 agreement-months independently in Python, from the tier tables. Every value matches, and every journal balances.

    ## Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `period` | `2026-09` | Month closed |
    | `near_tier_pct` | `10.0` | Near-tier threshold for sales |
    | `scenario` | `CLEAN` | Demo only |

    ## Use it with your data

    - Replace `agreements`, `tiers` and `sales` with your contract or pricing system, and with monthly net sales per customer from the ERP.
    - Post `journal.csv` from a task after `save`, and replace accounts `4910` and `2450` with your chart of accounts.
    - Send the near-tier list to the account owners mid-quarter, when there is still time to act.

    ## Things to know

    - The run rate is a three-month average. Use your sales forecast if seasonality is strong.
    - IFRS 15 limits variable consideration to what is highly probable not to reverse. If a projection is uncertain, accrue on the tier already reached.

    ## Links

    - DuckDB macros: https://duckdb.org/docs/sql/statements/create_macro
    - DuckDB plugin: https://kestra.io/plugins/plugin-jdbc-duckdb
  tags:
    - Business
    - Data
  subTags:
    - Reporting & Digests
    - Scheduling
  ee: false
  demo: true
