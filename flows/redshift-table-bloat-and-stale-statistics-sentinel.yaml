id: redshift-table-bloat-and-stale-statistics-sentinel
namespace: company.dataops
description: |
  Audits tables in the target Amazon Redshift database for unsorted row bloat and stale query optimizer statistics.
  Queries SVV_TABLE_INFO to detect tables exceeding unsorted row or stale statistics thresholds,
  dispatching prioritized VACUUM SORT ONLY and ANALYZE operational remediation alerts to Slack.

inputs:
  - id: unsorted_pct_threshold
    type: INT
    displayName: Unsorted Row Threshold (%)
    description: Percentage of unsorted rows in a table triggering VACUUM alert recommendation (1-100%, applies to tables with defined sort keys).
    defaults: 20
    min: 1
    max: 100

  - id: stats_off_threshold
    type: INT
    displayName: Stale Statistics Threshold Score
    description: Query optimizer statistics staleness score (stats_off) triggering ANALYZE alert recommendation (10-100, matching Redshift default analyze_threshold_percent cutoff).
    defaults: 10
    min: 10
    max: 100

  - id: min_table_size_mb
    type: INT
    displayName: Minimum Table Size (MB)
    description: Minimum table size in megabytes to include in the operational hygiene audit.
    defaults: 100
    min: 1

  - id: limit_rows
    type: INT
    displayName: Maximum Tables Reported
    description: Maximum number of anomalous tables to highlight in the operational incident alert card (1-47, capped by Slack block limits).
    defaults: 10
    min: 1
    max: 47

triggers:
  - id: weekly_redshift_maintenance_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled weekly maintenance audit checking Amazon Redshift table unsorted bloat and stale statistics.
    cron: "0 2 * * 0"
    disabled: true

tasks:
  - id: fetch_database_context
    type: io.kestra.plugin.jdbc.redshift.Query
    description: Identifies the target Amazon Redshift database name using current_database().
    url: "{{ secret('REDSHIFT_JDBC_URL') }}"
    username: "{{ secret('REDSHIFT_USER') }}"
    password: "{{ secret('REDSHIFT_PASSWORD') }}"
    fetchType: FETCH_ONE
    sql: SELECT current_database() AS "database_name";

  - id: audit_table_hygiene
    type: io.kestra.plugin.jdbc.redshift.Query
    description: Queries Amazon Redshift SVV_TABLE_INFO for the connected database. Requires superuser privileges or sys:operator role on REDSHIFT_USER.
    url: "{{ secret('REDSHIFT_JDBC_URL') }}"
    username: "{{ secret('REDSHIFT_USER') }}"
    password: "{{ secret('REDSHIFT_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      SELECT
        "database" AS "database_name",
        "schema" AS "schema_name",
        "table" AS "table_name",
        "size" AS "size_mb",
        "pct_used" AS "pct_cluster_used",
        ROUND("unsorted", 2) AS "unsorted_pct",
        ROUND("stats_off", 2) AS "stats_off_score",
        "tbl_rows" AS "row_count",
        "sortkey_num",
        CASE
          WHEN "sortkey_num" > 0 AND "unsorted" >= {{ inputs.unsorted_pct_threshold }} AND "stats_off" >= {{ inputs.stats_off_threshold }} THEN 'VACUUM AND ANALYZE REQUIRED'
          WHEN "sortkey_num" > 0 AND "unsorted" >= {{ inputs.unsorted_pct_threshold }} THEN 'VACUUM SORT REQUIRED'
          WHEN "stats_off" >= {{ inputs.stats_off_threshold }} THEN 'ANALYZE REQUIRED'
          ELSE 'HEALTHY'
        END AS "recommended_action",
        COUNT(*) OVER() AS "total_anomalies"
      FROM SVV_TABLE_INFO
      WHERE (("sortkey_num" > 0 AND "unsorted" >= {{ inputs.unsorted_pct_threshold }}) OR "stats_off" >= {{ inputs.stats_off_threshold }})
        AND "size" >= {{ inputs.min_table_size_mb }}
      ORDER BY (CASE WHEN "sortkey_num" > 0 THEN "unsorted" ELSE 0 END) DESC, "stats_off" DESC
      LIMIT {{ inputs.limit_rows }};

  - id: evaluate_table_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether any monitored tables in the connected database violated unsorted or statistics thresholds.
    condition: "{{ outputs.audit_table_hygiene.rows is not empty and (outputs.audit_table_hygiene.rows | length) > 0 }}"
    then:
      - id: notify_slack_incident
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Delivers an operational triage card to Slack with bloated and stale tables and VACUUM/ANALYZE commands.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{
            {
              "channel": "#dataops-alerts",
              "text": "🚨 Amazon Redshift Table Hygiene Alert: Found " ~ (((outputs.audit_table_hygiene.rows[0].total_anomalies ?? outputs.audit_table_hygiene.rows[0].TOTAL_ANOMALIES) ?? (outputs.audit_table_hygiene.rows | length))) ~ " tables requiring VACUUM / ANALYZE maintenance in database `" ~ (outputs.fetch_database_context.row.database_name ?? outputs.fetch_database_context.row.DATABASE_NAME) ~ "`.",
              "blocks": ({ "db": (outputs.fetch_database_context.row.database_name ?? outputs.fetch_database_context.row.DATABASE_NAME), "rows": outputs.audit_table_hygiene.rows } | jq('[
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚨 Amazon Redshift Table Hygiene Alert"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Found *' ~ (((outputs.audit_table_hygiene.rows[0].total_anomalies ?? outputs.audit_table_hygiene.rows[0].TOTAL_ANOMALIES) ?? (outputs.audit_table_hygiene.rows | length))) ~ '* tables requiring VACUUM / ANALYZE maintenance in database *`' ~ (outputs.fetch_database_context.row.database_name ?? outputs.fetch_database_context.row.DATABASE_NAME) ~ '`*.\n\n*Thresholds Evaluated:*\n• Unsorted rows: `>= ' ~ inputs.unsorted_pct_threshold ~ '%` (requires sort keys)\n• Stale stats_off: `>= ' ~ inputs.stats_off_threshold ~ '`\n• Minimum table size: `>= ' ~ inputs.min_table_size_mb ~ ' MB`\n\n*Top Bloated & Stale Tables (Displaying up to ' ~ inputs.limit_rows ~ '):*"
                  }
                }
              ] + (.db as $db_fallback | .rows[0:47] | map({
                "type": "section",
                "text": {
                  "type": "plain_text",
                  "text": (
                    (.database_name // .DATABASE_NAME // $db_fallback // "") as $raw_d |
                    (.schema_name // .SCHEMA_NAME // "") as $raw_s |
                    (.table_name // .TABLE_NAME // "") as $raw_t |
                    ("\"" + ($raw_s | gsub("\""; "\"\"")) + "\".\"" + ($raw_t | gsub("\""; "\"\"")) + "\"") as $ident |
                    ((.sortkey_num // .SORTKEY_NUM // 0) | tonumber) as $sortkey_num |
                    ((.unsorted_pct // .UNSORTED_PCT // 0) | tonumber) as $unsorted |
                    ((.stats_off_score // .STATS_OFF_SCORE // 0) | tonumber) as $statsoff |
                    ((.size_mb // .SIZE_MB // 0) | tostring) as $size |
                    ((.row_count // .ROW_COUNT // 0) | tostring) as $rows |
                    ((.pct_cluster_used // .PCT_CLUSTER_USED // 0) | tostring) as $pctused |
                    ((.recommended_action // .RECOMMENDED_ACTION // "") | tostring) as $action |
                    (if $sortkey_num > 0 and $unsorted >= ' ~ inputs.unsorted_pct_threshold ~ ' then "VACUUM SORT ONLY " + $ident + " TO 100 PERCENT; " else "" end) as $vac |
                    (if $statsoff >= ' ~ inputs.stats_off_threshold ~ ' then "ANALYZE " + $ident + ";" else "" end) as $anz |
                    "• Database: " + $raw_d + " | Table: " + $ident + " (" + $size + " MB, " + $rows + " rows)\n  - Unsorted: " + ($unsorted | tostring) + "% | Stats Off: " + ($statsoff | tostring) + " | Cluster Space: " + $pctused + "%\n  - Recommended Action: " + $action + "\n  - Remediation: " + $vac + $anz
                  )
                }
              })) + [
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Database: `' ~ (outputs.fetch_database_context.row.database_name ?? outputs.fetch_database_context.row.DATABASE_NAME) ~ '` | Execution ID: `' ~ execution.id ~ '`"
                    }
                  ]
                }
              ]') | first)
            } | toJson
          }}
    else:
      - id: log_healthy_database
        type: io.kestra.plugin.core.log.Log
        description: Logs confirmation that all monitored tables in the connected database satisfy sort and query statistics health standards.
        message: "Amazon Redshift table hygiene audit clean: all monitored tables >= {{ inputs.min_table_size_mb }} MB in database '{{ outputs.fetch_database_context.row.database_name ?? outputs.fetch_database_context.row.DATABASE_NAME }}' are below unsorted threshold ({{ inputs.unsorted_pct_threshold }}%) and stats_off threshold ({{ inputs.stats_off_threshold }})."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Returns structured audit telemetry summarizing inspected Redshift table health metrics.
    format: |
      {{
        {
          "flowId": flow.id,
          "executionId": execution.id,
          "targetDatabase": outputs.fetch_database_context.row.database_name ?? outputs.fetch_database_context.row.DATABASE_NAME,
          "status": (outputs.audit_table_hygiene.rows is not empty and (outputs.audit_table_hygiene.rows | length) > 0) ? "ANOMALIES_DETECTED" : "HEALTHY",
          "unsortedThresholdPct": inputs.unsorted_pct_threshold,
          "statsOffThreshold": inputs.stats_off_threshold,
          "minTableSizeMb": inputs.min_table_size_mb,
          "totalAnomaliesDetected": (outputs.audit_table_hygiene.rows is not empty and (outputs.audit_table_hygiene.rows | length) > 0) ? (((outputs.audit_table_hygiene.rows[0].total_anomalies ?? outputs.audit_table_hygiene.rows[0].TOTAL_ANOMALIES) ?? (outputs.audit_table_hygiene.rows | length))) : 0,
          "flaggedTables": (outputs.audit_table_hygiene.rows is not empty ? (outputs.audit_table_hygiene.rows | jq('map({
            database: (.database_name // .DATABASE_NAME),
            schema: (.schema_name // .SCHEMA_NAME),
            table: (.table_name // .TABLE_NAME),
            sizeMb: (.size_mb // .SIZE_MB),
            pctClusterUsed: (.pct_cluster_used // .PCT_CLUSTER_USED),
            unsortedPct: (.unsorted_pct // .UNSORTED_PCT),
            statsOffScore: (.stats_off_score // .STATS_OFF_SCORE),
            rowCount: (.row_count // .ROW_COUNT),
            sortkeyNum: (.sortkey_num // .SORTKEY_NUM),
            action: (.recommended_action // .RECOMMENDED_ACTION)
          })') | first) : [])
        } | toJson
      }}

errors:
  - id: notify_workflow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts operational channels if the sentinel workflow encounters an unhandled execution error.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{
        {
          "channel": "#dataops-alerts",
          "text": "❌ *Amazon Redshift Sentinel Failure*: Table hygiene sentinel execution `" ~ execution.id ~ "` encountered an error. Please inspect execution task logs for failure details."
        } | toJson
      }}

extend:
  shortDescription: Audit Amazon Redshift database tables for unsorted row bloat and stale optimizer statistics, alerting Slack with VACUUM SORT and ANALYZE actions.
  title: Amazon Redshift Table Unsorted Bloat and Stale Statistics Sentinel
  metaTitle: Redshift Unsorted Bloat & Stale Statistics Sentinel | Kestra
  metaDescription: Audit Amazon Redshift database tables for unsorted rows and stale statistics with Kestra and SVV_TABLE_INFO. Send Slack alerts with VACUUM SORT and ANALYZE.
  tags:
    - Data
    - Cloud
    - Infrastructure
  ee: false
  demo: false
  description: |
    Amazon Redshift relies heavily on sorted data and accurate column statistics for high-throughput columnar analytics. When bulk `INSERT` or `COPY` operations append rows without sorting, tables suffer from severe performance degradation:

    1. **Unsorted Row Bloat**: As unsorted rows accumulate (`unsorted > 20%`), Redshift zone maps (min/max block ranges) lose their effectiveness. Queries are forced to scan entire disk blocks rather than pruning skipped slices, dramatically inflating I/O and query duration. Note that heap tables without sort keys report 100% unsorted by design; this sentinel automatically filters those out of sort alerts.
    2. **Stale Optimizer Statistics**: When table statistics age (`stats_off > 10`), the cost-based query optimizer makes poor join order decisions, hash join memory misallocations, and unnecessary table broadcasts across compute slices.

    This sentinel flow focuses specifically on unsorted row bloat (for tables with defined sort keys) and optimizer statistics staleness across tables in the target database. It establishes automated weekly operational governance for target Redshift databases by inspecting the `SVV_TABLE_INFO` system view, flagging tables requiring maintenance, and providing exact `VACUUM SORT ONLY "schema"."table" TO 100 PERCENT;` and `ANALYZE "schema"."table";` commands in Slack incident cards.

    ```mermaid
    flowchart TD
        ScheduleTrigger["Weekly Maintenance Trigger (Cron: 0 2 * * 0)"] --> GetDB["Fetch Database Context via current_database()"]
        ManualTrigger["Manual Execution / API"] --> GetDB

        GetDB --> QuerySVV["Query SVV_TABLE_INFO for Connected Database"]

        QuerySVV --> EvalHealth{"Anomalous Tables Detected?\n(sortkey_num > 0 AND unsorted >= 20% OR stats_off >= 10)"}

        EvalHealth -- "Yes (Anomalies Exist)" --> SlackAlert["Dispatch Operational Incident Card to Slack\n(Database, Table, Size, Unsorted %, Stats Off, Remediation)"]
        EvalHealth -- "No (Database Clean)" --> LogClean["Log Confirmed Healthy Database Status"]

        SlackAlert --> EmitManifest["Emit JSON Audit Manifest"]
        LogClean --> EmitManifest

        GetDB -. "Workflow Error" .-> ErrorSlack["Alert Slack: Sentinel Workflow Execution Failed"]
        QuerySVV -. "Workflow Error" .-> ErrorSlack
    ```

    ### Key Features
    - **Proactive Warehouse Optimization**: Catches unsorted row bloat and optimizer drift before mission-critical dashboards or ETL pipelines time out.
    - **Exact SQL Remediation**: Dynamically generates targeted `VACUUM SORT ONLY "schema"."table" TO 100 PERCENT;` and `ANALYZE "schema"."table";` syntax within Slack alerts.
    - **Sort Key Awareness**: Evaluates `sortkey_num > 0` before recommending sort maintenance, preventing intentional heap tables without sort keys from raising false-positive VACUUM alerts.
    - **Target Database Attribution**: Captures `current_database()` dynamically and passes it safely into downstream filters as structured data, ensuring alerts and healthy telemetry are attributed to the correct database instance even with delimited names.
    - **Delimited Identifier Safety**: Safely quotes and escapes schema and table identifiers to support case-sensitive, space-containing, and reserved-word table names.
    - **Bounded Slack Block Kit Layout**: Formats each flagged relation as its own dedicated `plain_text` section block, preventing Slack's 3,000-character section limit while preserving authentic table identifiers.
    - **Configurable Thresholds**: Fine-tune `unsorted_pct_threshold` (1–100%), `stats_off_threshold` (10–100, aligned with engine cutoffs), and `min_table_size_mb` to ignore staging or transient scratch tables.
    - **Slack Block Limit Protection**: Limits reported tables to 47 relations, ensuring the generated Block Kit payload strictly abides by Slack's 50-block ceiling.
    - **Production Security**: Connects using Kestra secret store (`REDSHIFT_JDBC_URL`, `REDSHIFT_USER`, `REDSHIFT_PASSWORD`, `SLACK_WEBHOOK_URL`).

    ### Permissions & Prerequisites
    - **Database Scope & Superuser Privileges**: Amazon Redshift scopes `SVV_TABLE_INFO` catalog metrics to the currently connected database and restricts access to superusers or roles granted `sys:operator`. Ensure the service account configured in `REDSHIFT_USER` has superuser or operator privileges on the target database specified in `REDSHIFT_JDBC_URL`.
    - **Remediation Execution**: Running the suggested `VACUUM` and `ANALYZE` commands requires table ownership or superuser status on the target Amazon Redshift cluster.
