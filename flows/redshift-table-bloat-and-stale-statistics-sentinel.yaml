id: redshift-table-bloat-and-stale-statistics-sentinel
namespace: company.dataops
description: |
  Audits Amazon Redshift cluster tables for unsorted rows and stale query optimizer statistics.
  Queries SVV_TABLE_INFO to detect tables exceeding unsorted row or stale statistics thresholds,
  dispatching prioritized VACUUM SORT ONLY and ANALYZE operational remediation alerts to Slack.

inputs:
  - id: unsorted_pct_threshold
    type: INT
    displayName: Unsorted Row Threshold (%)
    description: Percentage of unsorted rows in a table triggering VACUUM alert recommendation.
    defaults: 20

  - id: stats_off_threshold
    type: INT
    displayName: Stale Statistics Threshold Score
    description: Query optimizer statistics staleness score (stats_off) triggering ANALYZE alert recommendation.
    defaults: 10

  - id: min_table_size_mb
    type: INT
    displayName: Minimum Table Size (MB)
    description: Minimum table size in megabytes to include in the operational hygiene audit.
    defaults: 100

  - id: limit_rows
    type: INT
    displayName: Maximum Tables Reported
    description: Maximum number of anomalous tables to highlight in the operational incident alert card (minimum 1).
    defaults: 10
    min: 1

triggers:
  - id: weekly_redshift_maintenance_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled weekly maintenance audit checking Amazon Redshift table unsorted bloat and stale statistics.
    cron: "0 2 * * 0"
    disabled: true

tasks:
  - id: audit_table_hygiene
    type: io.kestra.plugin.jdbc.redshift.Query
    description: Queries Amazon Redshift SVV_TABLE_INFO system view. Requires superuser privileges or sys:operator role on REDSHIFT_USER.
    url: "{{ secret('REDSHIFT_JDBC_URL') }}"
    username: "{{ secret('REDSHIFT_USER') }}"
    password: "{{ secret('REDSHIFT_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      SELECT
        "database" AS "database_name",
        "schema" AS "schema_name",
        "table" AS "table_name",
        "size" AS "size_mb",
        "pct_used" AS "pct_cluster_used",
        ROUND("unsorted", 2) AS "unsorted_pct",
        ROUND("stats_off", 2) AS "stats_off_score",
        "tbl_rows" AS "row_count",
        CASE
          WHEN "unsorted" >= {{ inputs.unsorted_pct_threshold }} AND "stats_off" >= {{ inputs.stats_off_threshold }} THEN 'VACUUM AND ANALYZE REQUIRED'
          WHEN "unsorted" >= {{ inputs.unsorted_pct_threshold }} THEN 'VACUUM SORT REQUIRED'
          WHEN "stats_off" >= {{ inputs.stats_off_threshold }} THEN 'ANALYZE REQUIRED'
          ELSE 'HEALTHY'
        END AS "recommended_action",
        COUNT(*) OVER() AS "total_anomalies"
      FROM SVV_TABLE_INFO
      WHERE ("unsorted" >= {{ inputs.unsorted_pct_threshold }} OR "stats_off" >= {{ inputs.stats_off_threshold }})
        AND "size" >= {{ inputs.min_table_size_mb }}
      ORDER BY "unsorted" DESC, "stats_off" DESC
      LIMIT {{ inputs.limit_rows }};

  - id: evaluate_cluster_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether any Amazon Redshift tables violated unsorted or statistics thresholds.
    condition: "{{ outputs.audit_table_hygiene.rows is not empty and (outputs.audit_table_hygiene.rows | length) > 0 }}"
    then:
      - id: notify_slack_incident
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Delivers an operational triage card to Slack with bloated and stale tables and VACUUM/ANALYZE commands.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{
            {
              "channel": "#dataops-alerts",
              "text": "🚨 Amazon Redshift Table Hygiene Alert: Found " ~ (((outputs.audit_table_hygiene.rows[0].total_anomalies ?? outputs.audit_table_hygiene.rows[0].TOTAL_ANOMALIES) ?? (outputs.audit_table_hygiene.rows | length))) ~ " tables requiring VACUUM / ANALYZE maintenance.",
              "blocks": (outputs.audit_table_hygiene.rows | jq('[
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚨 Amazon Redshift Table Hygiene Alert"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Found *' ~ (((outputs.audit_table_hygiene.rows[0].total_anomalies ?? outputs.audit_table_hygiene.rows[0].TOTAL_ANOMALIES) ?? (outputs.audit_table_hygiene.rows | length))) ~ '* tables requiring VACUUM / ANALYZE maintenance.\n\n*Thresholds Evaluated:*\n• Unsorted rows: `>= ' ~ inputs.unsorted_pct_threshold ~ '%`\n• Stale stats_off: `>= ' ~ inputs.stats_off_threshold ~ '`\n• Minimum table size: `>= ' ~ inputs.min_table_size_mb ~ ' MB`\n\n*Top Bloated & Stale Tables (Displaying up to ' ~ inputs.limit_rows ~ '):*"
                  }
                }
              ] + (map({
                "type": "section",
                "text": {
                  "type": "plain_text",
                  "text": (
                    (.schema_name // .SCHEMA_NAME // "") as $raw_s |
                    (.table_name // .TABLE_NAME // "") as $raw_t |
                    ("\"" + ($raw_s | gsub("\""; "\"\"")) + "\".\"" + ($raw_t | gsub("\""; "\"\"")) + "\"") as $ident |
                    ((.unsorted_pct // .UNSORTED_PCT // 0) | tonumber) as $unsorted |
                    ((.stats_off_score // .STATS_OFF_SCORE // 0) | tonumber) as $statsoff |
                    ((.size_mb // .SIZE_MB // 0) | tostring) as $size |
                    ((.row_count // .ROW_COUNT // 0) | tostring) as $rows |
                    ((.pct_cluster_used // .PCT_CLUSTER_USED // 0) | tostring) as $pctused |
                    ((.recommended_action // .RECOMMENDED_ACTION // "") | tostring) as $action |
                    (if $unsorted >= ' ~ inputs.unsorted_pct_threshold ~ ' then "VACUUM SORT ONLY " + $ident + "; " else "" end) as $vac |
                    (if $statsoff >= ' ~ inputs.stats_off_threshold ~ ' then "ANALYZE " + $ident + ";" else "" end) as $anz |
                    "• " + $ident + " (" + $size + " MB, " + $rows + " rows)\n  - Unsorted: " + ($unsorted | tostring) + "% | Stats Off: " + ($statsoff | tostring) + " | Cluster Disk: " + $pctused + "%\n  - Recommended Action: " + $action + "\n  - Remediation: " + $vac + $anz
                  )
                }
              })) + [
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Execution ID: `' ~ execution.id ~ '`"
                    }
                  ]
                }
              ]') | first)
            } | toJson
          }}
    else:
      - id: log_healthy_cluster
        type: io.kestra.plugin.core.log.Log
        description: Logs confirmation that all monitored tables satisfy sort and query statistics health standards.
        message: "Amazon Redshift table hygiene audit clean: all monitored tables >= {{ inputs.min_table_size_mb }} MB are below unsorted threshold ({{ inputs.unsorted_pct_threshold }}%) and stats_off threshold ({{ inputs.stats_off_threshold }})."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Returns structured audit telemetry summarizing inspected Redshift table health metrics.
    format: |
      {{
        {
          "flowId": flow.id,
          "executionId": execution.id,
          "status": (outputs.audit_table_hygiene.rows is not empty and (outputs.audit_table_hygiene.rows | length) > 0) ? "ANOMALIES_DETECTED" : "HEALTHY",
          "unsortedThresholdPct": inputs.unsorted_pct_threshold,
          "statsOffThreshold": inputs.stats_off_threshold,
          "minTableSizeMb": inputs.min_table_size_mb,
          "totalAnomaliesDetected": (outputs.audit_table_hygiene.rows is not empty and (outputs.audit_table_hygiene.rows | length) > 0) ? (((outputs.audit_table_hygiene.rows[0].total_anomalies ?? outputs.audit_table_hygiene.rows[0].TOTAL_ANOMALIES) ?? (outputs.audit_table_hygiene.rows | length))) : 0,
          "flaggedTables": (outputs.audit_table_hygiene.rows is not empty ? (outputs.audit_table_hygiene.rows | jq('map({
            schema: (.schema_name // .SCHEMA_NAME),
            table: (.table_name // .TABLE_NAME),
            sizeMb: (.size_mb // .SIZE_MB),
            pctClusterUsed: (.pct_cluster_used // .PCT_CLUSTER_USED),
            unsortedPct: (.unsorted_pct // .UNSORTED_PCT),
            statsOffScore: (.stats_off_score // .STATS_OFF_SCORE),
            rowCount: (.row_count // .ROW_COUNT),
            action: (.recommended_action // .RECOMMENDED_ACTION)
          })') | first) : [])
        } | toJson
      }}

errors:
  - id: notify_connectivity_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts operational channels if the sentinel fails to query Amazon Redshift system tables.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{
        {
          "channel": "#dataops-alerts",
          "text": "❌ *Amazon Redshift Sentinel Failure*: Unable to complete table hygiene audit on execution `" ~ execution.id ~ "`. Please inspect Redshift cluster reachability, credentials, and network routing."
        } | toJson
      }}

extend:
  shortDescription: Audit Amazon Redshift tables for unsorted bloat and stale optimizer statistics, alerting Slack with VACUUM and ANALYZE actions.
  title: Amazon Redshift Table Bloat and Stale Statistics Sentinel
  metaTitle: Redshift Table Bloat & Stale Statistics Sentinel | Kestra
  metaDescription: Audit Amazon Redshift tables for unsorted rows and stale statistics with Kestra and SVV_TABLE_INFO. Send Slack alerts with VACUUM and ANALYZE remediation.
  tags:
    - Data
    - Cloud
    - Infrastructure
  ee: false
  demo: false
  description: |
    Amazon Redshift relies heavily on sorted data and accurate column statistics for high-throughput columnar analytics. When bulk `INSERT` or `COPY` operations append rows without sorting, or when frequent `UPDATE` and `DELETE` operations create dead rows, tables suffer from severe performance degradation:

    1. **Unsorted Row Bloat**: As unsorted rows accumulate (`unsorted > 20%`), Redshift zone maps (min/max block ranges) lose their effectiveness. Queries are forced to scan entire disk blocks rather than pruning skipped slices, dramatically inflating I/O and query duration.
    2. **Stale Optimizer Statistics**: When table statistics age (`stats_off > 10`), the cost-based query optimizer makes poor join order decisions, hash join memory misallocations, and unnecessary table broadcasts across compute slices.

    This sentinel flow establishes automated weekly operational governance for Amazon Redshift clusters by inspecting the `SVV_TABLE_INFO` system view, flagging tables requiring maintenance, and providing exact `VACUUM SORT ONLY "schema"."table";` and `ANALYZE "schema"."table";` commands in Slack incident cards.

    ```mermaid
    flowchart TD
        ScheduleTrigger["Weekly Maintenance Trigger (Cron: 0 2 * * 0)"] --> QuerySVV["Query SVV_TABLE_INFO via JDBC"]
        ManualTrigger["Manual Execution / API"] --> QuerySVV

        QuerySVV --> EvalHealth{"Anomalous Tables Detected?\n(unsorted >= 20% OR stats_off >= 10)"}

        EvalHealth -- "Yes (Anomalies Exist)" --> SlackAlert["Dispatch Operational Incident Card to Slack\n(Table, Size, Unsorted %, Stats Off, Remediation Syntax)"]
        EvalHealth -- "No (Cluster Clean)" --> LogClean["Log Confirmed Healthy Cluster Status"]

        SlackAlert --> EmitManifest["Emit JSON Audit Manifest"]
        LogClean --> EmitManifest

        QuerySVV -. "Connection / SQL Error" .-> ErrorSlack["Alert Slack: Redshift Sentinel Query Failed"]
    ```

    ### Key Features
    - **Proactive Warehouse Optimization**: Catches unsorted bloat and optimizer drift before mission-critical dashboards or ETL pipelines time out.
    - **Exact SQL Remediation**: Dynamically generates targeted `VACUUM SORT ONLY "schema"."table";` and `ANALYZE "schema"."table";` syntax within Slack alerts.
    - **Delimited Identifier Safety**: Safely quotes and escapes schema and table identifiers to support case-sensitive, space-containing, and reserved-word table names.
    - **Bounded Slack Block Kit Layout**: Formats each flagged relation as its own dedicated `plain_text` section block, preventing Slack's 3,000-character section limit while preserving authentic table identifiers.
    - **Configurable Thresholds**: Fine-tune `unsorted_pct_threshold`, `stats_off_threshold`, and `min_table_size_mb` to ignore staging or transient scratch tables.
    - **Production Security**: Connects using Kestra secret store (`REDSHIFT_JDBC_URL`, `REDSHIFT_USER`, `REDSHIFT_PASSWORD`, `SLACK_WEBHOOK_URL`).

    ### Permissions & Prerequisites
    - **Superuser Privileges for Catalog Inspection**: Amazon Redshift restricts access to the `SVV_TABLE_INFO` system view to superusers or roles granted `sys:operator`. Ensure the service account configured in `REDSHIFT_USER` has superuser or operator privileges to query cluster-wide storage metrics.
    - **Remediation Execution**: Running the suggested `VACUUM` and `ANALYZE` commands requires table ownership or superuser status on the target Amazon Redshift cluster.
