id: redshift-table-bloat-and-stale-statistics-sentinel
namespace: company.dataops
description: |
  Audits tables in the target Amazon Redshift database for unsorted row bloat and stale query optimizer statistics.
  Queries SVV_TABLE_INFO to detect tables exceeding unsorted row or stale statistics thresholds,
  dispatching prioritized VACUUM SORT ONLY and ANALYZE operational remediation alerts to Slack.

inputs:
  - id: unsorted_pct_threshold
    type: INT
    displayName: Unsorted Row Threshold (%)
    description: Percentage of unsorted rows in a table triggering VACUUM alert recommendation (1-100%, applies to tables with defined sort keys).
    defaults: 20
    min: 1
    max: 100

  - id: stats_off_threshold
    type: INT
    displayName: Stale Statistics Threshold Score
    description: Query optimizer statistics staleness score (stats_off) triggering ANALYZE alert recommendation (10-100, matching Redshift default analyze_threshold_percent cutoff).
    defaults: 10
    min: 10
    max: 100

  - id: min_table_size_mb
    type: INT
    displayName: Minimum Table Size (MB)
    description: Minimum table size in megabytes to include in the operational hygiene audit.
    defaults: 100
    min: 1

  - id: limit_rows
    type: INT
    displayName: Maximum Tables Reported
    description: Maximum number of anomalous tables to highlight in the operational incident alert card (1-47, capped by Slack block limits).
    defaults: 10
    min: 1
    max: 47

triggers:
  - id: weekly_redshift_maintenance_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled weekly maintenance audit checking Amazon Redshift table unsorted bloat and stale statistics.
    cron: "0 2 * * 0"
    timezone: "UTC"
    disabled: true

tasks:
  - id: fetch_database_context
    type: io.kestra.plugin.jdbc.redshift.Query
    description: Identifies the target Amazon Redshift database name using current_database().
    url: "{{ secret('REDSHIFT_JDBC_URL') }}"
    username: "{{ secret('REDSHIFT_USER') }}"
    password: "{{ secret('REDSHIFT_PASSWORD') }}"
    fetchType: FETCH_ONE
    sql: SELECT current_database() AS "database_name";

  - id: audit_table_hygiene
    type: io.kestra.plugin.jdbc.redshift.Query
    description: Queries Amazon Redshift SVV_TABLE_INFO for the connected database. Requires superuser privileges or sys:operator role on REDSHIFT_USER.
    url: "{{ secret('REDSHIFT_JDBC_URL') }}"
    username: "{{ secret('REDSHIFT_USER') }}"
    password: "{{ secret('REDSHIFT_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      SELECT
        "database" AS "database_name",
        "schema" AS "schema_name",
        "table" AS "table_name",
        "size" AS "size_mb",
        "pct_used" AS "pct_cluster_used",
        ROUND("unsorted", 2) AS "unsorted_pct",
        ROUND("stats_off", 2) AS "stats_off_score",
        "tbl_rows" AS "row_count",
        "sortkey_num",
        CASE
          WHEN "sortkey_num" > 0 AND "unsorted" >= {{ inputs.unsorted_pct_threshold }} AND "stats_off" >= {{ inputs.stats_off_threshold }} THEN 'VACUUM AND ANALYZE REQUIRED'
          WHEN "sortkey_num" > 0 AND "unsorted" >= {{ inputs.unsorted_pct_threshold }} THEN 'VACUUM SORT REQUIRED'
          WHEN "stats_off" >= {{ inputs.stats_off_threshold }} THEN 'ANALYZE REQUIRED'
          ELSE 'HEALTHY'
        END AS "recommended_action",
        COUNT(*) OVER() AS "total_anomalies"
      FROM SVV_TABLE_INFO
      WHERE (("sortkey_num" > 0 AND "unsorted" >= {{ inputs.unsorted_pct_threshold }}) OR "stats_off" >= {{ inputs.stats_off_threshold }})
        AND "size" >= {{ inputs.min_table_size_mb }}
        AND "schema" NOT LIKE 'pg!_temp!_%' ESCAPE '!'
        AND "schema" NOT LIKE 'pg!_toast%' ESCAPE '!'
        AND "schema" NOT IN ('pg_catalog', 'information_schema', 'pg_internal')
      ORDER BY (CASE WHEN "sortkey_num" > 0 THEN "unsorted" ELSE 0 END) DESC, "stats_off" DESC
      LIMIT {{ inputs.limit_rows }};

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Returns structured audit telemetry summarizing inspected Redshift table health metrics prior to notification.
    format: |
      {{
        {
          "flowId": flow.id,
          "executionId": execution.id,
          "targetDatabase": outputs.fetch_database_context.row.database_name ?? outputs.fetch_database_context.row.DATABASE_NAME,
          "status": (outputs.audit_table_hygiene.rows is not empty and (outputs.audit_table_hygiene.rows | length) > 0) ? "ANOMALIES_DETECTED" : "HEALTHY",
          "unsortedThresholdPct": inputs.unsorted_pct_threshold,
          "statsOffThreshold": inputs.stats_off_threshold,
          "minTableSizeMb": inputs.min_table_size_mb,
          "totalAnomaliesDetected": (outputs.audit_table_hygiene.rows is not empty and (outputs.audit_table_hygiene.rows | length) > 0) ? (((outputs.audit_table_hygiene.rows[0].total_anomalies ?? outputs.audit_table_hygiene.rows[0].TOTAL_ANOMALIES) ?? (outputs.audit_table_hygiene.rows | length))) : 0,
          "flaggedTables": (outputs.audit_table_hygiene.rows is not empty ? (outputs.audit_table_hygiene.rows | jq('map({
            database: (.database_name // .DATABASE_NAME),
            schema: (.schema_name // .SCHEMA_NAME),
            table: (.table_name // .TABLE_NAME),
            sizeMb: (.size_mb // .SIZE_MB),
            pctClusterUsed: (.pct_cluster_used // .PCT_CLUSTER_USED),
            unsortedPct: (.unsorted_pct // .UNSORTED_PCT),
            statsOffScore: (.stats_off_score // .STATS_OFF_SCORE),
            rowCount: (.row_count // .ROW_COUNT),
            sortkeyNum: (.sortkey_num // .SORTKEY_NUM),
            action: (.recommended_action // .RECOMMENDED_ACTION)
          })') | first) : [])
        } | toJson
      }}

  - id: evaluate_table_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether any monitored tables in the connected database violated unsorted or statistics thresholds.
    condition: "{{ outputs.audit_table_hygiene.rows is not empty and (outputs.audit_table_hygiene.rows | length) > 0 }}"
    then:
      - id: notify_slack_incident
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Delivers an operational triage card to Slack with bloated and stale tables and VACUUM/ANALYZE commands.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{
            ({
              "db": (outputs.fetch_database_context.row.database_name ?? outputs.fetch_database_context.row.DATABASE_NAME),
              "total": (((outputs.audit_table_hygiene.rows[0].total_anomalies ?? outputs.audit_table_hygiene.rows[0].TOTAL_ANOMALIES) ?? (outputs.audit_table_hygiene.rows | length))),
              "unsorted_pct_threshold": inputs.unsorted_pct_threshold,
              "stats_off_threshold": inputs.stats_off_threshold,
              "min_table_size_mb": inputs.min_table_size_mb,
              "limit_rows": inputs.limit_rows,
              "execution_id": execution.id,
              "rows": outputs.audit_table_hygiene.rows
            } | jq('
              (.db as $db_fallback |
               .unsorted_pct_threshold as $u_thresh |
               .stats_off_threshold as $s_thresh |
               {
                 "channel": "#dataops-alerts",
                 "blocks": ([
                   {
                     "type": "header",
                     "text": {
                       "type": "plain_text",
                       "text": "🚨 Amazon Redshift Table Hygiene Alert"
                     }
                   },
                   {
                     "type": "section",
                     "text": {
                       "type": "plain_text",
                       "text": ("Found " + (.total | tostring) + " tables requiring VACUUM / ANALYZE maintenance in database: " + (.db | tostring) + "\n\nThresholds Evaluated:\n• Unsorted rows: >= " + (.unsorted_pct_threshold | tostring) + "% (requires sort keys)\n• Stale stats_off: >= " + (.stats_off_threshold | tostring) + "\n• Minimum table size: >= " + (.min_table_size_mb | tostring) + " MB\n\nTop Bloated & Stale Tables (Displaying up to " + (.limit_rows | tostring) + "):")
                     }
                   }
                 ] + (.rows[0:47] | map({
                   "type": "section",
                   "text": {
                     "type": "plain_text",
                     "text": (
                       (.database_name // .DATABASE_NAME // $db_fallback // "") as $raw_d |
                       (.schema_name // .SCHEMA_NAME // "") as $raw_s |
                       (.table_name // .TABLE_NAME // "") as $raw_t |
                       ("\"" + ($raw_s | gsub("\""; "\"\"")) + "\".\"" + ($raw_t | gsub("\""; "\"\"")) + "\"") as $ident |
                       ((.sortkey_num // .SORTKEY_NUM // 0) | tonumber) as $sortkey_num |
                       ((.unsorted_pct // .UNSORTED_PCT // 0) | tonumber) as $unsorted |
                       ((.stats_off_score // .STATS_OFF_SCORE // 0) | tonumber) as $statsoff |
                       ((.size_mb // .SIZE_MB // 0) | tostring) as $size |
                       ((.row_count // .ROW_COUNT // 0) | tostring) as $rows |
                       ((.pct_cluster_used // .PCT_CLUSTER_USED // 0) | tostring) as $pctused |
                       ((.recommended_action // .RECOMMENDED_ACTION // "") | tostring) as $action |
                       (if $sortkey_num > 0 and $unsorted >= $u_thresh then "VACUUM SORT ONLY " + $ident + " TO 100 PERCENT; " else "" end) as $vac |
                       (if $statsoff >= $s_thresh then "ANALYZE " + $ident + " THRESHOLD 0 PERCENT;" else "" end) as $anz |
                       "• Database: " + $raw_d + " | Table: " + $ident + " (" + $size + " MB, " + $rows + " rows)\n  - Unsorted: " + ($unsorted | tostring) + "% | Stats Off: " + ($statsoff | tostring) + " | Cluster Space: " + $pctused + "%\n  - Recommended Action: " + $action + "\n  - Remediation: " + $vac + $anz
                     )
                   }
                 })) + [
                   {
                     "type": "context",
                     "elements": [
                       {
                         "type": "plain_text",
                         "text": ("Database: " + (.db | tostring) + " | Execution ID: " + (.execution_id | tostring))
                       }
                     ]
                   }
                 ])
               }
              )
            ') | first) | toJson
          }}
    else:
      - id: log_healthy_database
        type: io.kestra.plugin.core.log.Log
        description: Logs confirmation that all monitored tables in the connected database satisfy sort and query statistics health standards.
        message: "Amazon Redshift table hygiene audit clean: all monitored tables >= {{ inputs.min_table_size_mb }} MB in database '{{ outputs.fetch_database_context.row.database_name ?? outputs.fetch_database_context.row.DATABASE_NAME }}' are below unsorted threshold ({{ inputs.unsorted_pct_threshold }}%) and stats_off threshold ({{ inputs.stats_off_threshold }})."

errors:
  - id: notify_workflow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts operational channels if the sentinel workflow encounters an unhandled execution error.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{
        {
          "channel": "#dataops-alerts",
          "text": "❌ *Amazon Redshift Sentinel Failure*: Table hygiene sentinel execution `" ~ execution.id ~ "` encountered an error. Please inspect execution task logs for failure details."
        } | toJson
      }}

extend:
  title: Amazon Redshift Table Unsorted Bloat and Stale Statistics Sentinel
  shortDescription: Audit Amazon Redshift database tables for unsorted row bloat and stale optimizer statistics, alerting Slack with VACUUM SORT and ANALYZE actions.
  metaTitle: Redshift Unsorted Bloat & Stale Statistics Sentinel | Kestra
  metaDescription: Audit Amazon Redshift database tables for unsorted rows and stale statistics with Kestra and SVV_TABLE_INFO. Send Slack alerts with VACUUM SORT and ANALYZE.
  tags:
    - Data
    - Cloud
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Data Warehouses
  ee: false
  demo: false
  description: |
    Amazon Redshift relies heavily on sorted data and accurate column statistics for high-throughput columnar analytics. In fast-moving data architectures, two common issues severely degrade cluster performance:

    1. **Unsorted Row Bloat**: As unsorted rows accumulate (`unsorted > 20%`), Redshift zone maps (min/max block ranges) lose their effectiveness. Queries are forced to scan entire disk blocks rather than pruning skipped slices, dramatically inflating I/O and query duration. Note that heap tables without sort keys report 100% unsorted by design; this sentinel automatically filters those out of sort alerts.
    2. **Stale Optimizer Statistics**: When table statistics age (`stats_off > 10`), the cost-based query optimizer makes poor join order decisions, hash join memory misallocations, and unnecessary table broadcasts across compute slices.

    This sentinel flow focuses specifically on unsorted row bloat (for tables with defined sort keys) and optimizer statistics staleness across tables in the target database. It establishes automated weekly operational governance for target Redshift databases by inspecting the `SVV_TABLE_INFO` system view, flagging tables requiring maintenance, and providing exact `VACUUM SORT ONLY "schema"."table" TO 100 PERCENT;` and `ANALYZE "schema"."table" THRESHOLD 0 PERCENT;` commands in Slack incident cards.

    ## How it works

    1. **Scheduled Maintenance Audit**: The `weekly_redshift_maintenance_audit` trigger (`io.kestra.plugin.core.trigger.Schedule`) executes every Sunday at 02:00 UTC (`cron: "0 2 * * 0"`, `timezone: "UTC"`). It ships with `disabled: true` by default so manual verification can occur first.
    2. **Database Context Resolution**: `fetch_database_context` (`io.kestra.plugin.jdbc.redshift.Query`) queries `SELECT current_database() AS "database_name"` to dynamically resolve the connected catalog name for incident tagging.
    3. **System Catalog Inspection**: `audit_redshift_table_bloat_and_stats` (`io.kestra.plugin.jdbc.redshift.Query`) queries the Amazon Redshift `SVV_TABLE_INFO` catalog view. It flags relations exceeding `unsorted_pct_threshold` (for tables with `sortkey_num > 0`) or `stats_off_threshold` while filtering out tables smaller than `min_table_size_mb`. It explicitly excludes temporary schemas (`pg!_temp!_%`) and system catalogs (`pg_catalog`, `information_schema`, `pg_internal`).
    4. **Audit Telemetry Manifest**: `emit_audit_manifest` (`io.kestra.plugin.core.debug.Return`) returns a structured JSON manifest at `{{ outputs.emit_audit_manifest.value }}` containing audit evaluation timestamps, database metadata, anomaly totals, and table details before any external dispatch.
    5. **Health Evaluation Gate**: `evaluate_table_health` (`io.kestra.plugin.core.flow.If`) branches execution based on whether anomalous tables were returned.
    6. **Slack Incident Dispatch**: When anomalies are detected, `notify_slack_incident` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) delivers an operational triage card with database context, affected tables, size (MB), unsorted %, stats_off score, and exact `VACUUM` and `ANALYZE` commands.
    7. **Clean Cluster Confirmation**: When all audited tables satisfy hygiene thresholds, `log_clean_status` (`io.kestra.plugin.core.log.Log`) logs confirmed cluster health in execution logs.
    8. **Pipeline Error Handling**: The `errors` block alerts Slack if the sentinel flow itself fails to connect to Amazon Redshift.

    ```mermaid
    flowchart TD
        ScheduleTrigger["Weekly Maintenance Trigger (Cron: 0 2 * * 0 UTC)"] --> GetDB["Fetch Database Context via current_database()"]
        ManualTrigger["Manual Execution / API"] --> GetDB

        GetDB --> QuerySVV["Query SVV_TABLE_INFO for Connected Database"]
        QuerySVV --> EmitManifest["Emit JSON Audit Manifest (Structured Telemetry)"]

        EmitManifest --> EvalHealth{"Anomalous Tables Detected?\n(sortkey_num > 0 AND unsorted >= 20% OR stats_off >= 10)"}

        EvalHealth -- "Yes (Anomalies Exist)" --> SlackAlert["Dispatch Operational Incident Card to Slack\n(Database, Table, Size, Unsorted %, Stats Off, Remediation)"]
        EvalHealth -- "No (Database Clean)" --> LogClean["Log Confirmed Healthy Database Status"]

        GetDB -. "Workflow Error" .-> ErrorSlack["Alert Slack: Sentinel Workflow Execution Failed"]
        QuerySVV -. "Workflow Error" .-> ErrorSlack
    ```

    ## What you get

    - **Automated Bloat & Staleness Governance**: Proactive detection of unsorted row bloat and optimizer drift before mission-critical analytical queries or ETL jobs time out.
    - **Exact SQL Remediation with Forced Thresholds**: Targeted `VACUUM SORT ONLY "schema"."table" TO 100 PERCENT;` and `ANALYZE "schema"."table" THRESHOLD 0 PERCENT;` syntax generated directly in Slack alerts, forcing statistics recalculation even when customized session `analyze_threshold_percent` cutoffs exceed default sensitivity.
    - **Sort Key Awareness**: Evaluates `sortkey_num > 0` before recommending sort maintenance, preventing intentional heap tables without sort keys from raising false-positive VACUUM alerts.
    - **Session-Temporary & System Table Exclusion**: Explicitly filters out `pg_temp_*` session-scoped temporary tables and system catalog schemas (`pg_catalog`, `information_schema`, `pg_internal`) using escaped SQL patterns, ensuring short-lived ETL scratch tables do not generate false-positive operational incidents.
    - **Delimited-Safe Data Passing & Plain Text Labels**: Passes database context and thresholds as structured data into JQ and renders attribution in `plain_text`, immunizing alerts from syntax breaking or accidental Slack token mentions (`<!channel>`).
    - **Accessible Plain-Text Fallback Synthesis**: Omits top-level mrkdwn fallback so Slack synthesizes notifications directly from typed plain-text header, section, and context blocks.
    - **Bounded Slack Block Kit Layout**: Formats each flagged relation as its own dedicated section block, preventing Slack's 3,000-character section limit while abiding by Slack's 50-block ceiling (capped at 47 relations).
    - **Structured JSON Manifest**: Emits telemetry at `{{ outputs.emit_audit_manifest.value }}` for automated compliance tracking and downstream pipelines.

    ## Who it's for

    - **Data Platform & DataOps Engineers**: Maintaining Amazon Redshift clusters who need automated maintenance alerting without building complex Lambda monitors.
    - **Analytics Engineers**: Optimizing query performance, dbt build runtimes, and table health across large dimensional models and staging layers.
    - **Database Administrators (DBAs)**: Seeking prioritized, copy-paste `VACUUM` and `ANALYZE` commands delivered directly to operational triage channels.

    ## Why orchestrate this with Kestra

    Amazon Redshift provides internal auto-vacuum and auto-analyze routines, but in high-velocity workloads with continuous batch loads, automated background worker threads frequently defer maintenance during peak business hours. When statistics drift or bloat builds up between auto-vacuum windows, data platform teams have no native visibility into cluster-wide table degradation until end-user dashboards fail or queries spike in queue wait times.

    Orchestrating this sentinel with Kestra delivers:
    - **Declarative Governance**: A serverless, configuration-driven sentinel workflow that runs over standard JDBC without maintaining separate Python worker containers or AWS Lambda infrastructure.
    - **Integrated Observability**: Combines catalog metadata queries, conditional branching, Slack operational dispatch, and structured execution telemetry in a unified UI.
    - **Audit Trail & History**: Complete execution records and historical audit manifests stored directly in Kestra for Day 2 operations and compliance audits.

    ## Prerequisites

    - An active Amazon Redshift cluster accessible via JDBC.
    - A dedicated Redshift service account with superuser privileges or granted `sys:operator` role to query `SVV_TABLE_INFO`.
    - An incoming Slack webhook configured for your DataOps or database administration channel.

    ### Secrets

    Configure the following secrets in your Kestra namespace (Settings > Secrets):

    | Secret Name | Description & Purpose | Example / Format |
    | :--- | :--- | :--- |
    | `REDSHIFT_JDBC_URL` | JDBC connection URL pointing to the Amazon Redshift cluster and target database. | `jdbc:redshift://cluster-id.region.redshift.amazonaws.com:5439/analytics` |
    | `REDSHIFT_USER` | Dedicated Redshift user or service account with superuser or `sys:operator` privileges. | `kestra_sentinel_svc` |
    | `REDSHIFT_PASSWORD` | Password for the Redshift service account. | `********` |
    | `SLACK_WEBHOOK_URL` | Incoming Webhook URL to deliver operational alert cards to Slack (e.g., `#dataops-alerts`). | `https://hooks.slack.com/services/T00/B00/XXXX` |

    ## Quick start

    1. **Configure Secrets**: Navigate to **Administration > Secrets** in the Kestra UI (or configure namespace secrets via CI/CD) and add `REDSHIFT_JDBC_URL`, `REDSHIFT_USER`, `REDSHIFT_PASSWORD`, and `SLACK_WEBHOOK_URL`.
    2. **Import Blueprint**: Import this flow YAML into your Kestra instance.
    3. **Execute Initial Audit**: Click **Execute** in the UI to perform an immediate on-demand inspection of table hygiene in the connected database.
    4. **Enable Weekly Schedule**: Once verified, edit the flow under `triggers` and set `disabled: false`:
       ```yaml
       triggers:
         - id: weekly_redshift_maintenance_audit
           type: io.kestra.plugin.core.trigger.Schedule
           cron: "0 2 * * 0"
           timezone: "UTC"
           disabled: false
       ```
    5. **Consume Audit Output**: Access structured JSON telemetry in downstream flows or dashboards via `{{ outputs.emit_audit_manifest.value }}`.

    ## How to extend

    - **Automated Remediation Loop**: Add a downstream task iterating over `outputs.audit_redshift_table_bloat_and_stats.rows` to automatically run `VACUUM SORT ONLY` and `ANALYZE` during dedicated off-peak maintenance windows.
    - **Multi-Database Fanout**: Wrap this flow in a parent orchestration loop that queries `pg_database` and dynamically executes this sentinel across all databases in the Amazon Redshift cluster.
    - **Multi-Channel Dispatch**: Route incident cards to Microsoft Teams, PagerDuty, or Jira Service Management using Kestra's notification plugin ecosystem.

    ## Links

    - [Kestra Amazon Redshift JDBC Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-redshift)
    - [Kestra Slack Notification Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Kestra Schedule Trigger Documentation](https://kestra.io/docs/workflow-components/triggers/schedule-trigger)
    - [Amazon Redshift SVV_TABLE_INFO View Documentation](https://docs.aws.amazon.com/redshift/latest/dg/r_SVV_TABLE_INFO.html)
    - [Amazon Redshift ANALYZE Command Reference](https://docs.aws.amazon.com/redshift/latest/dg/r_ANALYZE.html)
    - [Amazon Redshift VACUUM Command Reference](https://docs.aws.amazon.com/redshift/latest/dg/r_VACUUM_command.html)
