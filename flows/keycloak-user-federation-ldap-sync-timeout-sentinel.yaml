id: keycloak-user-federation-ldap-sync-timeout-sentinel
namespace: company.sre

description: |
  Audits Keycloak IAM cluster telemetry to detect LDAP user federation sync timeouts, connection pool exhaustion, and background sync job dropouts.

concurrency:
  limit: 1

inputs:
  - id: keycloak_metrics_url
    type: STRING
    displayName: "Keycloak Metrics Base URL"
    defaults: "http://keycloak.auth.svc.cluster.local:8080"
    description: "Base HTTP URL exposing Micrometer and Prometheus telemetry for the Keycloak identity cluster."

  - id: realm_name
    type: STRING
    displayName: "Keycloak Realm Identifier"
    defaults: "enterprise"
    description: "Target enterprise authentication realm configured with LDAP and Active Directory user federation."

  - id: max_sync_failures_threshold
    type: INT
    displayName: "Max Sync Failures Threshold"
    defaults: 5
    description: "Maximum allowable LDAP user synchronization failures or timeout incidents before alerting."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which federation sync events and query latencies are evaluated."

  - id: alert_on_sync_failures
    type: BOOL
    displayName: "Alert On Sync Failures"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting elevated user federation sync failures."

tasks:
  - id: scan_keycloak_federation_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Keycloak Prometheus metrics to calculate user federation sync errors, query latencies, and LDAP pool timeouts.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      KEYCLOAK_URL: "{{ inputs.keycloak_metrics_url }}"
      REALM_NAME: "{{ inputs.realm_name }}"
      MAX_SYNC_FAILS: "{{ inputs.max_sync_failures_threshold }}"
      LOOKBACK_MINUTES: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("KEYCLOAK_URL", "").rstrip("/")
      realm = os.environ.get("REALM_NAME", "enterprise")
      max_sync_fails = int(os.environ.get("MAX_SYNC_FAILS", "5"))
      lookback_min = int(os.environ.get("LOOKBACK_MINUTES", "15"))

      metrics_endpoint = f"{base_url}/metrics"
      print(f"Scraping Keycloak metrics from {metrics_endpoint}...")
      try:
          resp = requests.get(metrics_endpoint, timeout=12)
          resp.raise_for_status()
      except Exception as err:
          print(f"ERROR: Failed to reach Keycloak metrics endpoint at {metrics_endpoint}: {err}", file=sys.stderr)
          sys.exit(1)

      sync_errors = 0
      total_sync_events = 0
      ldap_query_duration_p99_ms = 0.0
      connection_timeouts = 0

      for line in resp.text.splitlines():
          line = line.strip()
          if line.startswith("#") or not line:
              continue
          if "keycloak_user_federation_sync_errors_total" in line:
              match = re.search(r'([0-9\.]+)\s*$', line)
              if match:
                  sync_errors += int(float(match.group(1)))
          elif "keycloak_user_federation_sync_events_total" in line:
              match = re.search(r'([0-9\.]+)\s*$', line)
              if match:
                  total_sync_events += int(float(match.group(1)))
          elif "keycloak_ldap_query_duration_seconds" in line and "0.99" in line:
              match = re.search(r'([0-9\.]+)\s*$', line)
              if match:
                  ldap_query_duration_p99_ms = round(float(match.group(1)) * 1000.0, 2)
          elif "keycloak_ldap_connection_timeouts_total" in line:
              match = re.search(r'([0-9\.]+)\s*$', line)
              if match:
                  connection_timeouts += int(float(match.group(1)))

      is_alerting = sync_errors > max_sync_fails or connection_timeouts > 0
      print(f"Keycloak LDAP Sync: sync_errors={sync_errors}, total_events={total_sync_events}, p99_latency={ldap_query_duration_p99_ms}ms, timeouts={connection_timeouts}")

      Kestra.outputs({
          "sync_errors": sync_errors,
          "total_sync_events": total_sync_events,
          "ldap_query_duration_p99_ms": ldap_query_duration_p99_ms,
          "connection_timeouts": connection_timeouts,
          "is_alerting": is_alerting,
          "realm": realm
      })

  - id: evaluate_federation_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether LDAP synchronization failures or timeouts breach operational limits.
    condition: "{{ outputs.scan_keycloak_federation_metrics.vars.is_alerting and inputs.alert_on_sync_failures }}"
    then:
      - id: notify_slack_iam_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to IAM Slack channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#iam-security-alerts",
            "text": "CRITICAL: Keycloak User Federation LDAP Sync Failures for Realm `{{ inputs.realm_name }}`. Sync Failures: `{{ outputs.scan_keycloak_federation_metrics.vars.sync_errors }}` (threshold: `{{ inputs.max_sync_failures_threshold }}`). Connection Timeouts: `{{ outputs.scan_keycloak_federation_metrics.vars.connection_timeouts }}`. p99 LDAP Query Duration: `{{ outputs.scan_keycloak_federation_metrics.vars.ldap_query_duration_p99_ms }}`ms."
          }
    else:
      - id: log_nominal_federation_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when user federation executes cleanly.
        message: "Keycloak LDAP user federation operating nominally for realm {{ inputs.realm_name }}: {{ outputs.scan_keycloak_federation_metrics.vars.sync_errors }} sync errors, {{ outputs.scan_keycloak_federation_metrics.vars.connection_timeouts }} timeouts."

triggers:
  - id: periodic_ldap_sync_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

outputs:
  - id: sync_errors
    type: INT
    description: Count of LDAP user federation sync failures.
    value: "{{ outputs.scan_keycloak_federation_metrics.vars.sync_errors }}"
  - id: total_sync_events
    type: INT
    description: Total LDAP user federation sync events evaluated.
    value: "{{ outputs.scan_keycloak_federation_metrics.vars.total_sync_events }}"
  - id: ldap_query_duration_p99_ms
    type: FLOAT
    description: 99th percentile LDAP query duration in milliseconds.
    value: "{{ outputs.scan_keycloak_federation_metrics.vars.ldap_query_duration_p99_ms }}"
  - id: connection_timeouts
    type: INT
    description: Count of LDAP connection timeouts.
    value: "{{ outputs.scan_keycloak_federation_metrics.vars.connection_timeouts }}"
  - id: is_alerting
    type: BOOLEAN
    description: True if sync failures or timeouts breached operational threshold.
    value: "{{ outputs.scan_keycloak_federation_metrics.vars.is_alerting }}"

extend:
  title: "Keycloak User Federation LDAP Sync Timeout Sentinel"
  metaTitle: "Keycloak User Federation LDAP Sync Sentinel Blueprint"
  shortDescription: "Audits Keycloak IAM cluster telemetry to detect LDAP user federation sync timeouts, connection pool exhaustion, and background sync dropouts."
  metaDescription: "Audits Keycloak metrics to detect LDAP user federation sync timeouts, connection pool exhaustion, and background sync dropouts."
  description: |
    Automates continuous health and synchronization surveillance for Keycloak user federation with LDAP and Active Directory.

    ## How it works
    1. A schedule trigger executes the Keycloak LDAP federation audit workflow every 15 minutes.
    2. The Python task queries the Keycloak Prometheus metrics endpoint on port 8080.
    3. The script extracts user federation sync error totals, connection timeouts, and p99 query duration.
    4. When sync failures breach defined thresholds, Slack alerts are dispatched to IAM security teams.

    ## Prerequisites
    - Keycloak instance exposing Prometheus metrics.
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Add `SLACK_WEBHOOK_URL` secret.
    3. Configure `keycloak_metrics_url` and `realm_name`.
    4. Enable the schedule trigger for continuous sync monitoring.

    ## Links
    - [Keycloak Metrics Documentation](https://www.keycloak.org/server/configuration-metrics)
    - [Kestra Python Plugin](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Policy & Compliance
  ee: false
  demo: false
