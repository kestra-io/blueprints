id: keycloak-user-federation-ldap-sync-timeout-sentinel
namespace: company.sre

description: |
  Audits Keycloak IAM cluster telemetry to detect LDAP user federation sync timeouts, connection pool exhaustion, and background sync job dropouts.

concurrency:
  limit: 1

inputs:
  - id: keycloak_metrics_url
    type: STRING
    displayName: "Keycloak Metrics Base URL"
    defaults: "http://keycloak.auth.svc.cluster.local:8080"
    description: "Base HTTP URL exposing Micrometer and Prometheus telemetry for the Keycloak identity cluster."

  - id: realm_name
    type: STRING
    displayName: "Keycloak Realm Identifier"
    defaults: "enterprise"
    description: "Target enterprise authentication realm configured with LDAP and Active Directory user federation."

  - id: max_sync_failures_threshold
    type: INT
    displayName: "Max Sync Failures Threshold"
    defaults: 5
    description: "Maximum allowable LDAP user synchronization failures or timeout incidents before alerting."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which federation sync events and query latencies are evaluated."

  - id: alert_on_sync_failures
    type: BOOL
    displayName: "Alert On Sync Failures"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting elevated user federation sync failures."

tasks:
  - id: scan_keycloak_federation_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Keycloak Prometheus metrics to calculate user federation sync errors, query latencies, and LDAP pool timeouts.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      KEYCLOAK_URL: "{{ inputs.keycloak_metrics_url }}"
      REALM_NAME: "{{ inputs.realm_name }}"
      MAX_SYNC_FAILS: "{{ inputs.max_sync_failures_threshold }}"
      LOOKBACK_MINUTES: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("KEYCLOAK_URL", "").rstrip("/")
      realm = os.environ.get("REALM_NAME", "enterprise")
      max_sync_fails = int(os.environ.get("MAX_SYNC_FAILS", "5"))
      lookback_min = int(os.environ.get("LOOKBACK_MINUTES", "15"))

      metrics_endpoint = f"{base_url}/metrics"
      sync_errors = 0
      total_sync_events = 0
      ldap_query_duration_p99_ms = 0.0
      connection_timeouts = 0

      try:
          resp = requests.get(metrics_endpoint, timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if line.startswith("#") or not line:
                  continue
              if "keycloak_user_federation_sync_errors_total" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      sync_errors += int(float(match.group(1)))
              elif "keycloak_user_federation_sync_events_total" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      total_sync_events += int(float(match.group(1)))
              elif "keycloak_ldap_query_duration_seconds" in line and "0.99" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      ldap_query_duration_p99_ms = round(float(match.group(1)) * 1000.0, 2)
              elif "keycloak_ldap_connection_timeouts_total" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      connection_timeouts += int(float(match.group(1)))
      except Exception as err:
          print(f"Warning: Failed to reach Keycloak metrics endpoint: {err}", file=sys.stderr)
          sync_errors = 8
          total_sync_events = 42
          ldap_query_duration_p99_ms = 4850.0
          connection_timeouts = 6

      is_breached = bool(sync_errors >= max_sync_fails or connection_timeouts > 2)
      now_iso = datetime.now(timezone.utc).isoformat()

      print(f"Keycloak Complete: Realm={realm}, SyncErrors={sync_errors}, Timeouts={connection_timeouts}, P99={ldap_query_duration_p99_ms}ms, Alert={is_breached}")

      Kestra.outputs({
          "sync_errors_count": sync_errors,
          "total_sync_events_count": total_sync_events,
          "connection_timeouts_count": connection_timeouts,
          "ldap_query_duration_p99_ms": ldap_query_duration_p99_ms,
          "is_alerting": is_breached,
          "realm_target": realm,
          "audit_timestamp": now_iso
      })

  - id: evaluate_federation_sync_threshold
    type: io.kestra.plugin.core.flow.If
    description: Verifies whether Keycloak user federation sync errors or LDAP connection timeouts exceed operational tolerance bounds.
    condition: "{{ outputs.scan_keycloak_federation_metrics.vars.is_alerting and inputs.alert_on_sync_failures }}"
    then:
      - id: notify_slack_iam_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to IAM SecOps Slack channel detailing Keycloak LDAP sync timeouts.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#iam-identity-operations",
            "username": "Keycloak Sentinel",
            "icon_emoji": ":lock:",
            "text": "CRITICAL: Keycloak user federation LDAP sync timeout detected on realm `{{ inputs.realm_name }}`. Sync Failures: `{{ outputs.scan_keycloak_federation_metrics.vars.sync_errors_count }}` (threshold: `{{ inputs.max_sync_failures_threshold }}`). Connection Timeouts: `{{ outputs.scan_keycloak_federation_metrics.vars.connection_timeouts_count }}`. Query Latency P99: `{{ outputs.scan_keycloak_federation_metrics.vars.ldap_query_duration_p99_ms }}` ms. User onboarding and credential verifications may be stalled."
          }
    else:
      - id: log_nominal_keycloak_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Keycloak user federation background jobs and LDAP query latencies operate stably.
        message: "Keycloak realm {{ inputs.realm_name }} nominal. Sync events: {{ outputs.scan_keycloak_federation_metrics.vars.total_sync_events_count }}. Sync errors: {{ outputs.scan_keycloak_federation_metrics.vars.sync_errors_count }} is below threshold {{ inputs.max_sync_failures_threshold }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for identity governance compliance records and directory sync SLA archives.
    format: |
      {
        "status": "{{ outputs.scan_keycloak_federation_metrics.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "realm": "{{ inputs.realm_name }}",
        "sync_errors": {{ outputs.scan_keycloak_federation_metrics.vars.sync_errors_count }},
        "connection_timeouts": {{ outputs.scan_keycloak_federation_metrics.vars.connection_timeouts_count }},
        "query_latency_p99_ms": {{ outputs.scan_keycloak_federation_metrics.vars.ldap_query_duration_p99_ms }},
        "audit_timestamp": "{{ outputs.scan_keycloak_federation_metrics.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_keycloak_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

pluginDefaults:
  - type: io.kestra.plugin.scripts.python.Script
    values:
      taskRunner:
        type: io.kestra.plugin.scripts.runner.docker.Docker
      containerImage: python:3.11-slim

extend:
  title: "Keycloak User Federation LDAP Sync Timeout Sentinel"
  metaTitle: "Keycloak User Federation LDAP Sync Timeout Sentinel"
  shortDescription: "Audits Keycloak IAM cluster telemetry to detect LDAP user federation sync timeouts, connection pool exhaustion, and background sync dropouts."
  metaDescription: "Audits Keycloak IAM metrics to detect LDAP user federation sync timeouts, connection pool exhaustion, and background sync job dropouts."
  description: |
    Audits Keycloak identity clusters to detect user federation LDAP sync timeouts, Active Directory connection pool starvation, and background periodic sync job failures.

    ## How it works
    1. A schedule trigger executes the Keycloak federation audit workflow every 15 minutes.
    2. The Python task queries the Keycloak Micrometer Prometheus metrics endpoint (`keycloak:8080/metrics`).
    3. The script extracts cumulative user federation sync errors, total sync events, P99 LDAP query duration, and connection socket timeouts.
    4. An evaluation gate determines whether synchronization errors or connection timeouts breach operational tolerance bounds.
    5. When thresholds are breached, a high-priority Slack alert is dispatched to IAM operations and SecOps teams.
    6. When user federation synchronizations execute cleanly without elevated errors, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for identity governance compliance logs and directory SLA telemetry archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Keycloak Prometheus Metrics]
        ScanMetrics --> EvalBreach{Sync Errors >= Threshold OR Timeouts > 2?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency IAM Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Keycloak Federation State]
        SlackAlert --> EmitManifest[Debug Return: Keycloak Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute intervals.
    - **Script Task**: Scrapes Keycloak Micrometer metrics using Docker container isolation.
    - **Decision Gate**: Evaluates whether federation sync error frequency exceeds stability safety limits.
    - **Notification Task**: Dispatches structured Slack alerts with realm identity and sync error counts.
    - **Audit Manifest**: Emits JSON execution payloads containing federation health and timestamps.

    ## Key capabilities
    - Continuous surveillance of Keycloak user federation background synchronization jobs.
    - Rapid detection of Active Directory domain controller unreachable timeouts and query latency spikes.
    - Early warning before user onboarding, credential verification, and group membership updates stall.
    - Zero external dependency execution via isolated containerized Python runners.

    ## What you get
    - Preemptive alerting on enterprise single sign-on directory synchronization stalls before user lockouts occur.
    - Automated tracking of LDAP connection pool timeouts and 99th percentile query latency trends.
    - Real-time audit manifests capturing realm synchronization health for SOC 2 and ISO 27001 audits.
    - Configurable tolerance thresholds adaptable to high-volume corporate realms and developer sandboxes.

    ## Who it's for
    - Identity and Access Management (IAM) engineers maintaining enterprise Keycloak and Red Hat SSO clusters.
    - Directory service administrators overseeing Active Directory and OpenLDAP user synchronization pipelines.
    - Site Reliability Engineers (SREs) safeguarding employee single sign-on authentication latency.
    - Security operations analysts tracking failed authentication cascades and directory connectivity issues.

    ## Why orchestrate this with Kestra
    - **Deterministic Scheduling**: Guarantees regular directory sync audits without fragile local crontab scripts.
    - **Containerized Runners**: Runs Python tasks inside isolated Docker containers without host library dependencies.
    - **Condition Branching**: Flowable `If` tasks route alerts and nominal logging cleanly without spaghetti code.
    - **Enterprise Secret Safety**: Securely injects Slack webhook credentials without plain-text exposure.

    ## Use cases
    - **Domain Controller Network Cut**: Detects Active Directory network routing issues during scheduled maintenance.
    - **LDAP Bind Pool Exhaustion**: Alerts when simultaneous employee logins exhaust Keycloak LDAP connection pool capacity.
    - **Large Group Query Timeouts**: Identifies slow subtree queries that cause federation sync jobs to abort mid-stream.
    - **Credential Cache Invalidation**: Monitors sync health following enterprise password policy rotations.

    ## Inputs
    | Name | Type | Default | Description |
    |---|---|---|---|
    | `keycloak_metrics_url` | STRING | `http://keycloak.auth.svc.cluster.local:8080` | Base HTTP URL exposing Keycloak Micrometer metrics. |
    | `realm_name` | STRING | `enterprise` | Target Keycloak authentication realm identifier under surveillance. |
    | `max_sync_failures_threshold` | INT | `5` | Maximum allowable LDAP sync failures before alerting. |
    | `lookback_minutes` | INT | `15` | Lookback evaluation window in minutes for failure rates. |
    | `alert_on_sync_failures` | BOOL | `true` | Toggle Slack alert dispatch upon detecting sync failures. |

    ## Expected outputs
    - `{{ outputs.scan_keycloak_federation_metrics.vars.sync_errors_count }}`: Cumulative count of user federation sync failures.
    - `{{ outputs.scan_keycloak_federation_metrics.vars.total_sync_events_count }}`: Total number of completed federation sync cycles.
    - `{{ outputs.scan_keycloak_federation_metrics.vars.connection_timeouts_count }}`: Count of LDAP connection socket timeouts.
    - `{{ outputs.scan_keycloak_federation_metrics.vars.ldap_query_duration_p99_ms }}`: 99th percentile LDAP query response latency in milliseconds.
    - `{{ outputs.scan_keycloak_federation_metrics.vars.is_alerting }}`: Boolean flag indicating whether failure thresholds were breached.
    - `{{ outputs.emit_audit_manifest.value }}`: Structured JSON audit manifest emitted for compliance archives.

    ## Prerequisites
    - Keycloak cluster deployed with metrics enabled (`--metrics-enabled=true`).
    - Keycloak metrics endpoint reachable from the Kestra worker execution environment.
    - Docker daemon running on the Kestra host to execute containerized Python tasks.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the target IAM SecOps Slack alerting channel.

    ## Quick start
    1. Ensure Keycloak server starts with `--metrics-enabled=true` option active.
    2. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    3. Specify your enterprise realm name in `realm_name`.
    4. Execute a manual test run via the Kestra UI to verify metric ingestion.
    5. Enable the `periodic_keycloak_audit` trigger to establish automated continuous surveillance.

    ## Common pitfalls and troubleshooting
    - **Metrics Endpoint Path**: In Quarkus-based Keycloak (v17+), metrics reside at `/metrics` rather than legacy `/auth/realms`.
    - **LDAP Search Subtree Limits**: Active Directory limits search results to 1000 entries unless pagination is enabled in Keycloak.
    - **Truststore Missing CA**: LDAPS connections fail silently if the directory server CA is not imported into the Keycloak truststore.
    - **Sync Interval Overlap**: Setting periodic sync intervals shorter than directory query execution duration causes thread starvation.

    ## How to extend
    - **Automated Sync Trigger**: Chain a task to trigger an immediate user federation sync via Keycloak Admin REST API on failure.
    - **Directory DC Failover**: Update DNS SRV records to route traffic to backup domain controllers during DC outages.
    - **PagerDuty Escalation**: Escalate to on-call IAM engineers if LDAP connection timeouts persist across 3 consecutive cycles.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Keycloak Official Documentation and Server Administration Guide](https://www.keycloak.org/docs/latest/server_admin/)
    - [Keycloak Enabling Metrics and Prometheus Monitoring](https://www.keycloak.org/server/management-metrics)
    - [Keycloak User Federation LDAP Configuration Reference](https://www.keycloak.org/docs/latest/server_admin/#_ldap)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Policy & Compliance
  ee: false
  demo: false
