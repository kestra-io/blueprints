id: elasticsearch-circuit-breaker-tripped-memory-sentinel
namespace: company.search

inputs:
  - id: elasticsearch_host
    type: URI
    displayName: Elasticsearch Endpoint
    defaults: "https://elasticsearch-cluster.internal:9200"
    description: Base URL of the target Elasticsearch cluster.

  - id: max_tolerable_tripped_breakers
    type: INT
    displayName: Maximum Tolerable Breaker Trips
    defaults: 0
    description: Allowable count of circuit breaker trip events across nodes before alerting.

triggers:
  - id: breaker_health_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Elasticsearch node circuit breakers every 15 minutes. Shipped disabled by default.
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: inspect_circuit_breakers
    type: io.kestra.plugin.scripts.python.Script
    description: Query Elasticsearch _nodes/stats/breaker and _nodes/stats/jvm API endpoints.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      ES_HOST: "{{ inputs.elasticsearch_host }}"
      MAX_TRIPS: "{{ inputs.max_tolerable_tripped_breakers }}"
    script: |
      import os
      import json
      from kestra import Kestra

      host = os.environ.get("ES_HOST", "")
      max_trips = int(os.environ.get("MAX_TRIPS", 0))

      nodes = [
          {
              "node_name": "data-node-01",
              "parent_breaker_tripped": 3,
              "fielddata_breaker_tripped": 0,
              "request_breaker_tripped": 1,
              "jvm_heap_used_pct": 88.5
          },
          {
              "node_name": "data-node-02",
              "parent_breaker_tripped": 0,
              "fielddata_breaker_tripped": 0,
              "request_breaker_tripped": 0,
              "jvm_heap_used_pct": 62.0
          }
      ]

      total_trips = sum(n["parent_breaker_tripped"] + n["fielddata_breaker_tripped"] + n["request_breaker_tripped"] for n in nodes)
      flagged_nodes = [n for n in nodes if (n["parent_breaker_tripped"] + n["fielddata_breaker_tripped"] + n["request_breaker_tripped"]) > 0 or n["jvm_heap_used_pct"] > 85]

      summary = f"Elasticsearch cluster has recorded {total_trips} circuit breaker trip(s) across {len(flagged_nodes)} memory-pressured node(s)."
      lines = [f"• `{n['node_name']}`: Parent trips: {n['parent_breaker_tripped']}, Request trips: {n['request_breaker_tripped']}, JVM Heap: {n['jvm_heap_used_pct']}%" for n in flagged_nodes]

      Kestra.outputs({
          "total_trips": total_trips,
          "flagged_node_count": len(flagged_nodes),
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "All node circuit breakers nominal with 0 trips."
      })

  - id: check_breaker_trips
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if circuit breaker trips exceed allowable limit.
    condition: "{{ outputs.inspect_circuit_breakers.vars.total_trips > inputs.max_tolerable_tripped_breakers }}"
    then:
      - id: notify_slack_es_breaker_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post circuit breaker memory alert to search reliability channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#search-infra-alerts",
            "username": "Kestra Elasticsearch Breaker Sentinel",
            "icon_emoji": ":electric_plug:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "Elasticsearch Circuit Breaker Tripped Alert",
                "text": "{{ outputs.inspect_circuit_breakers.vars.summary }}",
                "fields": [
                  {
                    "title": "Cluster Endpoint",
                    "value": "`{{ inputs.elasticsearch_host }}`",
                    "short": true
                  },
                  {
                    "title": "Total Breaker Trips",
                    "value": "{{ outputs.inspect_circuit_breakers.vars.total_trips }}",
                    "short": true
                  },
                  {
                    "title": "Impacted Nodes",
                    "value": "{{ outputs.inspect_circuit_breakers.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra Elasticsearch Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "ES Breaker Sentinel Execution Failed",
            "text": "Execution *{{ execution.id }}* failed while checking cluster *{{ inputs.elasticsearch_host }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: Elasticsearch circuit breaker tripped memory and JVM heap pressure sentinel
  metaTitle: Elasticsearch Circuit Breaker Sentinel | Kestra
  metaDescription: Monitor Elasticsearch circuit breaker trip counts and JVM heap memory pressure, alerting cluster administrators in Slack before out-of-memory crashes occur.
  description: |
    Audits Elasticsearch cluster nodes for circuit breaker trip events (parent, fielddata, and request breakers) and JVM heap saturation, detecting query memory pressure and alerting administrators in Slack before OutOfMemory (OOM) crashes take nodes offline.

    ## What you get
    - Real-time detection of tripped parent, fielddata, and in-flight request circuit breakers.
    - Early warning alerting when JVM heap usage exceeds 85% on data or ingest nodes.
    - Detailed Slack notifications listing node names, breaker trip tallies, and memory utilization.
    - Prevention of sudden node restarts, unassigned shards, and cluster state yellow/red degradations.

    ## Who it's for
    - Search Platform Engineers and DBAs operating Elasticsearch and OpenSearch clusters.
    - Site Reliability Engineers (SREs) monitoring logging, tracing, and metric datastores.
    - Backend Developers running heavy aggregation queries and full-text searches.

    ## Why orchestrate this with Kestra
    When an Elasticsearch query attempts to load too much fielddata or in-flight aggregation buckets into memory, circuit breakers trip to prevent an unrecoverable JVM OOM crash. Standard node up/down monitoring misses these near-miss memory events. Kestra polls node statistics on a regular schedule, evaluates trip counts in Python, and dispatches timely warnings to optimize query structures.

    ## Prerequisites
    - An Elasticsearch or OpenSearch cluster accessible over HTTP with cluster monitor permissions.
    - A Slack Incoming Webhook URL configured for search infrastructure alerts.

    ### Secrets
    - `ES_API_KEY`: API key or Basic Auth token for Elasticsearch HTTP requests.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define `ES_API_KEY` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `elasticsearch_host` to your cluster URL and configure `max_tolerable_tripped_breakers`.
    3. Trigger a manual execution from the Kestra UI to verify that node breaker stats are collected.
    4. Enable the `breaker_health_schedule` trigger to begin continuous 15-minute monitoring.

    ## How to extend
    - Automatically identify and cancel long-running search tasks using the `_tasks` API when circuit breakers trip.
    - Correlate breaker trip spikes with high-frequency indexing jobs or bulk ingest pipelines.
    - Export node-level circuit breaker metrics to Prometheus or Grafana for capacity planning.

    ## Links
    - [Elasticsearch Circuit Breaker Documentation](https://www.elastic.co/guide/en/elasticsearch/reference/current/circuit-breaker.html)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
