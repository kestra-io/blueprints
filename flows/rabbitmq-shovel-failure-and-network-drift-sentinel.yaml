id: rabbitmq-shovel-failure-and-network-drift-sentinel
namespace: company.messaging

description: |
  Audits RabbitMQ dynamic shovel statuses via management HTTP API,
  identifies stopped or erroring shovels across cross-region clusters,
  creates an automated GitHub SRE incident ticket, and alerts Slack.

inputs:
  - id: rabbitmq_host
    type: STRING
    displayName: RabbitMQ Management Host
    defaults: "rabbitmq.internal.company.com:15672"

  - id: vhost
    type: STRING
    displayName: Target Virtual Host
    defaults: "%2F"

  - id: github_repository
    type: STRING
    displayName: Messaging Infrastructure GitHub Repository
    defaults: my-org/messaging-platform

triggers:
  - id: check_shovel_status_periodic
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_shovel_states
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates RabbitMQ Management API for dynamic shovel component statuses
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests kestra
    script: |
      import os
      import requests
      from kestra import Kestra

      host = "{{ inputs.rabbitmq_host }}"
      vhost = "{{ inputs.vhost }}"
      user = os.environ.get("RABBITMQ_USER")
      pwd = os.environ.get("RABBITMQ_PASSWORD")

      url = f"http://{host}/api/shovels/{vhost}"
      response = requests.get(url, auth=(user, pwd), timeout=30)
      if response.status_code != 200:
          print(f"RabbitMQ API error {response.status_code}: {response.text}")
          response.raise_for_status()

      shovels = response.json()
      # Normal healthy shovel states are 'running'
      failed_shovels = [
          {
              "name": s.get("name"),
              "vhost": s.get("vhost"),
              "state": s.get("state"),
              "timestamp": s.get("timestamp")
          }
          for s in shovels if s.get("state") not in ["running"]
      ]

      failed_count = len(failed_shovels)
      print(f"Total shovels: {len(shovels)}, Failed/Degraded shovels: {failed_count}")

      Kestra.outputs({
          "total_shovels": len(shovels),
          "failed_count": failed_count,
          "has_failed_shovels": failed_count > 0,
          "failed_shovels": failed_shovels
      })

  - id: branch_on_shovel_failures
    type: io.kestra.plugin.core.flow.If
    description: Branches based on whether any shovels are in a non-running or degraded state
    condition: "{{ outputs.probe_shovel_states.vars.has_failed_shovels == true }}"
    then:
      - id: create_shovel_incident_issue
        type: io.kestra.plugin.github.issues.Create
        description: Logs a prioritized GitHub issue tracking failed RabbitMQ dynamic shovels
        oauthToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.github_repository }}"
        title: "[Messaging Alert] Degraded RabbitMQ Shovel Discovered ({{ outputs.probe_shovel_states.vars.failed_count }} Shovels Down)"
        body: |
          ## 🚨 RabbitMQ Cross-Cluster Shovel Outage

          The messaging reliability sentinel detected **{{ outputs.probe_shovel_states.vars.failed_count }}** shovels in a degraded or stopped state on `{{ inputs.rabbitmq_host }}`.

          ### Impacted Shovels:
          {% for s in outputs.probe_shovel_states.vars.failed_shovels %}
          - **Shovel Name:** `{{ s.name }}` (State: `{{ s.state }}`)
          {% endfor %}

          Please verify network routing between source and destination brokers.
          *Generated automatically by Kestra RabbitMQ Sentinel.*

      - id: alert_messaging_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority alert to the messaging operations Slack channel
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {{ {
            "text": "🚨 *RabbitMQ Dynamic Shovel Failure Detected*\n*Host:* `" ~ inputs.rabbitmq_host ~ "`\n*Failed Shovels:* *" ~ outputs.probe_shovel_states.vars.failed_count ~ "*\n*Incident Ticket:* <" ~ (outputs.create_shovel_incident_issue.issueUrl ?? "#") ~ "|View GitHub Issue>"
          } | toJson }}

    else:
      - id: log_shovels_healthy
        type: io.kestra.plugin.core.log.Log
        message: "All {{ outputs.probe_shovel_states.vars.total_shovels }} RabbitMQ shovels are in healthy 'running' state."

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: Audit trail summarizing the shovel inspection execution
    message: "RabbitMQ shovel health check complete for {{ inputs.rabbitmq_host }}. Failed shovels: {{ outputs.probe_shovel_states.vars.failed_count }}."

errors:
  - id: alert_flow_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts Slack when RabbitMQ API queries or issue creation encounters an error
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {{ {
        "text": "⚠️ *RabbitMQ Shovel Sentinel Failed* in execution `" ~ execution.id ~ "`. Unable to reach management endpoint on `" ~ inputs.rabbitmq_host ~ "`."
      } | toJson }}

extend:
  title: "RabbitMQ Dynamic Shovel Failure and Cross-Cluster Sentinel"
  shortDescription: "Audit RabbitMQ dynamic shovel component states, detect broken cross-cluster replication, file GitHub issues, and alert Slack."
  metaTitle: "RabbitMQ Shovel Replication Failure Sentinel with Kestra"
  metaDescription: "Monitor RabbitMQ dynamic shovels and cross-cluster replication with Kestra. Query management endpoints, create GitHub incident issues, and alert Slack."
  description: |
    RabbitMQ shovels reliably forward messages between geographically distributed broker clusters, isolated VPC networks, or distinct virtual hosts. However, transient network partitions, credential expirations, or target broker resource exhaustion can silently place shovels into a `terminated` or `stopped` state, causing massive queue backlog accumulation on source brokers. This blueprint polls RabbitMQ's Management API periodically, detects non-running dynamic shovels, logs a prioritized GitHub investigation ticket, and alerts on-call messaging SREs via Slack.

    ## How it works

    1. `check_shovel_status_periodic` (`io.kestra.plugin.core.trigger.Schedule`) initiates the audit every 15 minutes (shipped disabled for safe verification).
    2. `probe_shovel_states` (`io.kestra.plugin.scripts.python.Script`) queries RabbitMQ's Management REST API (`GET /api/shovels/{vhost}`) and identifies any shovel whose status is not `running`.
    3. `branch_on_shovel_failures` (`io.kestra.plugin.core.flow.If`) evaluates whether degraded shovels exist (`has_failed_shovels == true`):
       - `then`: Automatically files a GitHub tracking issue via `create_shovel_incident_issue` (`io.kestra.plugin.github.issues.Create`) and alerts the Slack channel via `alert_messaging_slack` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).
       - `else`: Emits an informational log entry (`log_shovels_healthy`) confirming normal message movement.
    4. `log_audit_complete` (`io.kestra.plugin.core.log.Log`) records the audit outcome.
    5. The `errors` block alerts Slack if management API authentication fails or the host is unreachable.

    ## What you get

    - Automated, continuous visibility into cross-cluster message replication pipelines.
    - Zero silent queue accumulation on upstream producer clusters.
    - Consolidated GitHub incident tickets with broken shovel names and current states.
    - Real-time Slack notifications with direct ticket hyperlinks.

    ## Who it's for

    - Platform Engineers and Messaging SREs maintaining RabbitMQ architectures.
    - Distributed systems developers relying on cross-region message replication.
    - Cloud Infrastructure architects governing event-driven message backbones.

    ## Why orchestrate this with Kestra

    Kestra coordinates external API polling, JSON parsing, conditional logic, GitHub issue tracking, and team alerting in a single declarative workflow. It manages broker credentials securely, provides auditability for every check, and eliminates the need for separate standalone monitoring daemons.

    ## Prerequisites

    - A RabbitMQ cluster with the `rabbitmq_shovel_management` plugin enabled.
    - A RabbitMQ user with monitoring or administrator permissions on the management API.
    - A GitHub Personal Access Token with repository issue creation permissions.
    - A Slack incoming webhook URL for notifications.

    ### Secrets

    - `RABBITMQ_USER`, `RABBITMQ_PASSWORD`: Authentication credentials for the RabbitMQ Management API.
    - `GITHUB_TOKEN`: GitHub token used to open messaging incident issues.
    - `SLACK_WEBHOOK`: Incoming Webhook URL for alerting.

    ## Inputs

    - `rabbitmq_host` (STRING, default `rabbitmq.internal.company.com:15672`): Management API hostname and port.
    - `vhost` (STRING, default `%2F`): URL-encoded virtual host name hosting the dynamic shovels.
    - `github_repository` (STRING, default `my-org/messaging-platform`): Target GitHub repository for logging incident issues.

    ## Outputs

    - `outputs.probe_shovel_states.vars.total_shovels`: Total number of dynamic shovels discovered.
    - `outputs.probe_shovel_states.vars.failed_count`: Number of shovels in a degraded or stopped state.
    - `outputs.probe_shovel_states.vars.failed_shovels`: List of failed shovel objects (`name`, `vhost`, `state`, `timestamp`).

    ## Quick start

    1. Configure `RABBITMQ_USER`, `RABBITMQ_PASSWORD`, `GITHUB_TOKEN`, and `SLACK_WEBHOOK` in your Kestra namespace.
    2. Import this flow and set `rabbitmq_host` and `vhost` to match your cluster.
    3. Run the flow manually to verify shovel status extraction and Slack notification delivery.
    4. Enable the `check_shovel_status_periodic` trigger for continuous message replication monitoring.

    ## How to extend

    - Add an automated shovel restart API call (`POST /api/shovels/{vhost}/{name}/restart`) to attempt self-healing.
    - Pull unacknowledged message counts from upstream queues alongside shovel states.
    - Route critical alerts to PagerDuty or Opsgenie if high-priority shovels remain stopped for over 30 minutes.

    ## Links

    - [RabbitMQ Shovel Plugin Documentation](https://www.rabbitmq.com/docs/shovel)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra GitHub Plugin](https://kestra.io/plugins/plugin-github)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)

  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
