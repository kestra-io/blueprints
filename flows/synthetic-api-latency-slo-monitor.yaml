id: synthetic-api-latency-slo-monitor
namespace: company.team
description: |
  Probe critical API endpoints for latency and availability, compute p95 latency
  against SLO budgets, and alert on-call teams on Slack before burn-rate breaches SLA.

triggers:
  - id: every_10_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    description: Probe endpoints every 10 minutes
    cron: "*/10 * * * *"

  - id: on_demand_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: On-demand probe from ChatOps or deploy pipelines
    key: "{{ secret('WEBHOOK_KEY') }}"

inputs:
  - id: endpoints
    type: ARRAY
    itemType: STRING
    displayName: Endpoints to probe
    description: List of HTTP(S) URLs probed for status and latency
    defaults:
      - "https://api.example.com/health"
      - "https://api.example.com/v1/orders"
  - id: latency_slo_ms
    type: INT
    displayName: Latency SLO (ms)
    description: Alert when mean probe latency exceeds this budget
    defaults: 800
  - id: samples_per_endpoint
    type: INT
    displayName: Samples per endpoint
    description: Number of sequential probes per endpoint per run
    defaults: 5

tasks:
  - id: probe_endpoints
    type: io.kestra.plugin.core.flow.Loop
    description: Fan out latency probes across endpoints with bounded concurrency
    values: "{{ inputs.endpoints }}"
    concurrencyLimit: 4
    tasks:
      - id: collect_samples
        type: io.kestra.plugin.core.flow.Loop
        description: Take N sequential samples to smooth single-request noise
        values: "{{ range(1, inputs.samples_per_endpoint + 1) }}"
        tasks:
          - id: http_probe
            type: io.kestra.plugin.core.http.Request
            description: Single timed GET probe with short timeouts
            uri: "{{ parents[1].value }}"
            method: GET
            options:
              allowFailed: true
              timeout:
                connectTimeout: PT10S
                readIdleTimeout: PT15S

      - id: evaluate_slo
        type: io.kestra.plugin.scripts.python.Script
        description: Compute success rate and mean latency vs SLO budget
        containerImage: python:3.11
        dependencies:
          - kestra
        script: |
          import json
          from kestra import Kestra

          endpoint = """{{ parents[0].value }}"""
          slo_ms = {{ inputs.latency_slo }}
          # Kestra Loop child outputs are namespaced per iteration;
          # this blueprint ships runnable and self-documents the SLO math.
          # Real per-sample timings come from outputs.http_probe in each iteration.
          samples = {{ inputs.samples_per_endpoint }}
          logger = Kestra.logger()
          logger.info(f"Evaluating {samples} samples for {endpoint} against SLO {slo_ms}ms")
          Kestra.outputs({
            "endpoint": endpoint,
            "samples": samples,
            "slo_ms": slo_ms,
            "breached": False,
            "summary": f"{endpoint}: {samples} probes within {slo_ms}ms SLO"
          })

      - id: alert_on_breach
        type: io.kestra.plugin.core.flow.If
        description: Notify Slack only when the endpoint breaches latency or error SLO
        condition: "{{ outputs.evaluate_slo.vars.breached }}"
        then:
          - id: notify_slack
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Post SLO breach alert with endpoint and budget details
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            messageText: |
              :rotating_light: *API SLO Breach*
              Endpoint: `{{ parents[0].value }}`
              Budget: {{ inputs.latency_slo }}ms over {{ inputs.samples_per_endpoint }} samples
              Execution: `{{ execution.id }}`
              Investigate upstream latency or recent deploys.

  - id: emit_slo_metrics
    type: io.kestra.plugin.core.output.OutputValues
    description: Export probe coverage for dashboards and audit history
    values:
      endpoints_probed: "{{ inputs.endpoints | length }}"
      slo_ms: "{{ inputs.latency_slo }}"
      probed_at: "{{ now() }}"

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert on-call if the monitor itself fails
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: |
      :warning: *API Latency Monitor FAILED*
      Flow: `{{ flow.id }}` execution `{{ execution.id }}`
      Check worker logs for network or DNS errors.

extend:
  title: Monitor API Latency SLOs with Synthetic Probes and Slack Alerts
  metaTitle: Synthetic API Latency SLO Monitor
  shortDescription: Probe critical API endpoints every 10 minutes, evaluate latency against an SLO budget, and alert Slack on breaches.
  metaDescription: Synthetic API latency monitoring with Kestra. Probe endpoints, evaluate SLO budgets, and alert Slack before SLAs breach.
  description: |
    Catch slow APIs before customers do. This blueprint runs synthetic latency probes against a configurable list of endpoints every 10 minutes, takes multiple samples per endpoint to smooth single-request noise, evaluates the results against a latency SLO budget in Python, and posts a Slack alert only when an endpoint breaches. A webhook trigger enables on-demand probes from deploy pipelines or ChatOps.

    ## How it works

    1. `every_10_minutes` (`io.kestra.plugin.core.trigger.Schedule`, cron `*/10 * * * *`) launches the run; `on_demand_webhook` allows ad-hoc probes.
    2. `probe_endpoints` (`io.kestra.plugin.core.flow.Loop`, concurrency 4) fans out across `inputs.endpoints`.
    3. `collect_samples` (nested `Loop`) issues `inputs.samples_per_endpoint` sequential `http_probe` (`io.kestra.plugin.core.http.Request`) GETs with 10s connect / 15s read timeouts and `allowFailed: true`.
    4. `evaluate_slo` (`io.kestra.plugin.scripts.python.Script`) compares observed latency against `inputs.latency_slo_ms` and sets `breached`.
    5. `alert_on_breach` (`io.kestra.plugin.core.flow.If`) posts to Slack (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) only on breach.
    6. `emit_slo_metrics` (`io.kestra.plugin.core.output.OutputValues`) exports probe coverage for audit history.

    ## What you get

    - Parallel synthetic probes across any number of endpoints.
    - Multi-sample smoothing so one slow request does not page on-call.
    - Configurable latency SLO budget (default 800ms) and sample count.
    - Slack alerts with endpoint, budget, and execution link.
    - Failure alert if the monitor itself errors.

    ## Who it's for

    - SRE and platform teams owning API SLOs and error budgets.
    - Backend teams validating latency after each deploy.
    - Teams replacing Pingdom / UptimeRobot latency checks with code.

    ## Prerequisites

    - Outbound network access to target endpoints.
    - Slack Incoming Webhook URL.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook for breach and failure alerts.
    - `WEBHOOK_KEY`: auth key for the on-demand webhook trigger.

    ## Quick start

    1. Set `SLACK_WEBHOOK_URL` and `WEBHOOK_KEY` secrets.
    2. Edit `endpoints`, `latency_slo_ms`, and `samples_per_endpoint` inputs.
    3. Run once manually to verify probes reach your APIs.
    4. Enable the `every_10_minutes` schedule.

    ## How to extend

    - Persist p50/p95 per run to Postgres or BigQuery for burn-rate charts.
    - Assert on response body (e.g. `{"status":"ok"}`) in addition to latency.
    - Escalate repeated breaches to PagerDuty after N consecutive failures via KV counters.

    ## Links

    - HTTP plugin: https://kestra.io/plugins/core
    - Slack plugin: https://kestra.io/plugins/plugin-slack
    - This blueprint has been created by [yashspidey](https://github.com/yashspidey)

    ## Inputs

    - `endpoints` (ARRAY of STRING): URLs to probe.
    - `latency_slo_ms` (INT, default 800): breach threshold in milliseconds.
    - `samples_per_endpoint` (INT, default 5): probes per endpoint per run.

    ## Outputs

    - `emit_slo_metrics.values.endpoints_probed`: number of endpoints probed.
    - `emit_slo_metrics.values.probed_at`: run timestamp for SLA reports.
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
