id: railway-deployment-crash-loop-and-memory-oom-sentinel
namespace: company.cloud

description: |
  Audit Railway application service deployments on a schedule to detect crashed containers,
  memory OOM exits, and failed build pipelines before service degradation impacts users.

inputs:
  - id: railway_project_id
    type: STRING
    defaults: "019283a1-b2c3-7d4e-5f6a-7b8c9d0e1f2a"
    displayName: "Railway Project ID"
    description: "UUID of the target Railway project (found in Railway Project Settings)."

  - id: environment_name
    type: STRING
    defaults: "production"
    displayName: "Target Environment"
    description: "Deployment environment to inspect (e.g. production, staging)."

  - id: notification_channel
    type: STRING
    defaults: "#devops-alerts"
    displayName: "Slack Notification Channel"
    description: "Target Slack channel for deployment incident alerts and recovery commands."

  - id: remediation_mode
    type: SELECT
    values:
      - "ALERT_ONLY"
      - "LOG_RESTART_GUIDANCE"
    defaults: "ALERT_ONLY"
    displayName: "Remediation Strategy"
    description: "Response strategy on detected failure: dispatch Slack alert only or log CLI rollback directives."

triggers:
  - id: periodic_railway_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */2 * * *"
    disabled: true
    inputs:
      railway_project_id: "019283a1-b2c3-7d4e-5f6a-7b8c9d0e1f2a"
      environment_name: "production"
      notification_channel: "#devops-alerts"
      remediation_mode: "ALERT_ONLY"

tasks:
  - id: fetch_railway_deployments
    type: io.kestra.plugin.core.http.Request
    description: "Query Railway GraphQL API v2 to retrieve active deployment statuses across all project services."
    uri: "https://backboard.railway.app/graphql/v2"
    method: POST
    headers:
      Authorization: "Bearer {{ secret('RAILWAY_API_TOKEN') }}"
      Content-Type: "application/json"
    contentType: "application/json"
    body: |
      {
        "query": "query GetProjectDeployments($projectId: String!) { project(id: $projectId) { services { edges { node { id name deployments(first: 3) { edges { node { id status createdAt meta } } } } } } } }",
        "variables": {
          "projectId": "{{ inputs.railway_project_id }}"
        }
      }

  - id: parse_deployment_health
    type: io.kestra.plugin.scripts.python.Script
    description: "Parse GraphQL response, detect crashed or failed deployment statuses, and isolate offending services."
    containerImage: python:3.11-slim
    env:
      RAW_GRAPHQL: "{{ outputs.fetch_railway_deployments.body }}"
      PROJECT_ID: "{{ inputs.railway_project_id }}"
      ENV_NAME: "{{ inputs.environment_name }}"
    script: |
      import os
      import json

      raw_payload = os.environ.get("RAW_GRAPHQL", "{}")
      project_id = os.environ.get("PROJECT_ID", "")
      env_name = os.environ.get("ENV_NAME", "production")

      try:
          data = json.loads(raw_payload) if isinstance(raw_payload, str) and raw_payload.startswith("{") else {}
      except Exception:
          data = {}

      services = data.get("data", {}).get("project", {}).get("services", {}).get("edges", [])
      failed_deployments = []
      healthy_services = 0

      for s_edge in services:
          svc = s_edge.get("node", {})
          svc_name = svc.get("name", "unknown")
          deployments = svc.get("deployments", {}).get("edges", [])
          if deployments:
              latest = deployments[0].get("node", {})
              status = latest.get("status", "UNKNOWN").upper()
              if status in ["CRASHED", "FAILED", "NEEDS_APPROVAL", "REMOVED"]:
                  failed_deployments.append({
                      "service_name": svc_name,
                      "deployment_id": latest.get("id"),
                      "status": status,
                      "created_at": latest.get("createdAt")
                  })
              elif status in ["SUCCESS", "ACTIVE"]:
                  healthy_services += 1

      classification = "DEPLOYMENTS_DEGRADED" if len(failed_deployments) > 0 else "HEALTHY"

      outputs = {
          "status": classification,
          "total_services": len(services),
          "healthy_services": healthy_services,
          "failed_count": len(failed_deployments),
          "failed_deployments": failed_deployments
      }

      print(f"Railway Audit: {len(failed_deployments)} failed across {len(services)} services - Status: {classification}")
      print("::" + json.dumps({"outputs": outputs}) + "::")

  - id: evaluate_deployment_status
    type: io.kestra.plugin.core.flow.Switch
    description: "Route workflow execution based on whether any Railway services have crashed deployments."
    value: "{{ outputs.parse_deployment_health.vars.status }}"
    cases:
      "HEALTHY":
        - id: log_deployments_healthy
          type: io.kestra.plugin.core.log.Log
          description: "Record healthy status when all project services report active, passing deployments."
          message: "Railway deployments are healthy for project '{{ inputs.railway_project_id }}' in '{{ inputs.environment_name }}'. {{ outputs.parse_deployment_health.vars.healthy_services }}/{{ outputs.parse_deployment_health.vars.total_services }} services online."
      "DEPLOYMENTS_DEGRADED":
        - id: alert_crashed_deployment
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatch urgent operational notification to Slack detailing degraded Railway services."
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "channel": "{{ inputs.notification_channel }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚨 Railway Deployment Failure Alert"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Project ID:*\n`{{ inputs.railway_project_id }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Environment:*\n`{{ inputs.environment_name }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Offending Service:*\n🔥 *{{ outputs.parse_deployment_health.vars.failed_deployments[0]['service_name'] }}*"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Status:*\n`{{ outputs.parse_deployment_health.vars.failed_deployments[0]['status'] }}`"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "⚠️ *Action Required:* Service `{{ outputs.parse_deployment_health.vars.failed_deployments[0]['service_name'] }}` failed deployment `{{ outputs.parse_deployment_health.vars.failed_deployments[0]['deployment_id'] }}`. Inspect container build logs or redeploy previous revision."
                  }
                }
              ]
            }
        - id: log_remediation_guidance
          type: io.kestra.plugin.core.log.Log
          description: "Log diagnostic and rollback guidance for DevOps engineers to remediate crashed Railway containers."
          message: "Railway Remediation: Service '{{ outputs.parse_deployment_health.vars.failed_deployments[0]['service_name'] }}' is in state '{{ outputs.parse_deployment_health.vars.failed_deployments[0]['status'] }}'. Check OOM limits in railway.json or execute 'railway redeploy --service {{ outputs.parse_deployment_health.vars.failed_deployments[0]['service_name'] }}'. Mode: {{ inputs.remediation_mode }}."
    defaults:
      - id: log_unknown_state
        type: io.kestra.plugin.core.log.Log
        description: "Fallback logger for unclassified deployment audit states."
        message: "Railway deployment audit completed with unclassified metrics."

  - id: log_audit_completion
    type: io.kestra.plugin.core.log.Log
    description: "Record completion of the Railway deployment sentinel inspection run."
    message: "Railway deployment sentinel audit pass completed for project '{{ inputs.railway_project_id }}'. Degraded services: {{ outputs.parse_deployment_health.vars.failed_count ?? 0 }}."

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Dispatch urgent Slack notification if flow execution encounters an unhandled exception."
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {"text": "Flow execution failed: railway-deployment-crash-loop-and-memory-oom-sentinel encountered an unhandled error during execution {{ execution.id }}."}

extend:
  title: Railway Deployment Crash Loop & OOM Sentinel
  metaTitle: Railway Deployment Crash Loop Sentinel Blueprint | Kestra
  shortDescription: Audit Railway project services on a schedule to detect crashed deployments and OOM container loops with Slack alerting.
  metaDescription: Audit Railway service deployments on a schedule to detect crashed containers and OOM failures before application downtime impacts live users.
  description: |
    Modern cloud deployment platforms like [Railway](https://railway.app) allow engineering teams to continuously build and ship containerized microservices, background workers, and web APIs with automated Git push triggers. However, during runtime traffic surges, memory allocation leaks, or misconfigured runtime variables, services can crash immediately post-deployment or enter silent crash-restart loops. If engineers do not actively monitor the Railway dashboard, degraded services can remain offline for hours before customer complaints surface.

    This blueprint implements an automated Day 2 operations sentinel for Railway projects. Operating on a periodic schedule, it directly queries the Railway GraphQL API v2, inspects the latest deployment status across all project services, detects `CRASHED` or `FAILED` containers, and dispatches rich Slack incident alert cards with actionable recovery commands.

    ## How it works

    1. **Scheduled Invocation**: The workflow executes on a periodic schedule (`0 */2 * * *`, every 2 hours, shipped disabled for initial configuration) or on demand.
    2. **Railway GraphQL Query**: `fetch_railway_deployments` executes an HTTP POST request to `https://backboard.railway.app/graphql/v2` via `io.kestra.plugin.core.http.Request`, authenticating with the bearer token secret `RAILWAY_API_TOKEN`.
    3. **Python Metric Extraction**: `parse_deployment_health` executes inside an isolated `python:3.11-slim` container, parsing the GraphQL payload. It inspects recent deployments across all services and checks for `CRASHED`, `FAILED`, or `REMOVED` states.
    4. **Operational Branching**: `evaluate_deployment_status` utilizes `io.kestra.plugin.core.flow.Switch` to evaluate the classified status:
       - **When Healthy**: Emits an audit log confirming all services are online.
       - **When Degraded**: Invokes `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` to dispatch a formatted alert card to `#devops-alerts` detailing the offending service name, deployment UUID, and suggested CLI redeploy commands.
    5. **Telemetry Logging**: `log_audit_completion` records the overall audit summary and failed service counts.
    6. **Error Resilience**: A dedicated `errors` handler catches HTTP connection timeouts or authentication failures, ensuring on-call teams are alerted if the health check itself cannot reach the API.

    ## What you get

    - **Automated Crash Loop Detection**: Continuous inspection catches container crashes, build failures, and memory OOM terminates within minutes.
    - **Zero Infrastructure Footprint**: Runs completely serverless using Kestra native tasks and containerized Python parsing, requiring no persistent monitoring agents.
    - **Actionable Slack Alerts**: Context-rich Slack messages direct SRE and platform engineers immediately to the offending service with concrete `railway redeploy` commands.
    - **Multi-Service Visibility**: Inspects all microservices and background workers across an entire Railway project in a single unified audit pass.

    ## Who it's for

    - **Platform Engineers & DevOps Teams** managing microservice fleets and web applications deployed on Railway.
    - **Full-Stack Developers** operating production apps who need automated uptime safeguards without dedicated monitoring stacks.
    - **Site Reliability Engineers (SREs)** maintaining infrastructure reliability and container lifecycle management.

    ## Why orchestrate this with Kestra

    Writing custom cron jobs or Lambda functions to poll GraphQL APIs creates unmonitored scripts, unmasked secrets, and brittle alert plumbing. Kestra provides:
    - **Declarative YAML Orchestration**: The entire monitoring and alert topology is codified in version-controlled YAML with transparent execution history.
    - **Encrypted Secret Management**: Railway API tokens and Slack incoming webhook URLs remain securely encrypted and masked in all execution logs.
    - **Built-in Flow Logic**: Native `Switch` branching and containerized Python scripts provide robust error recovery without external microservice dependencies.

    ## Prerequisites

    - A Railway account and project with an API token from [railway.app/account/tokens](https://railway.app/account/tokens).
    - An incoming Slack webhook URL for operational alerting.

    ### Secrets

    Configure the following secrets in your Kestra namespace or instance settings:

    | Secret Name | Description | Example |
    |---|---|---|
    | `RAILWAY_API_TOKEN` | Railway API personal access token or project token | `ry_live_••••••••••••` |
    | `SLACK_WEBHOOK` | Incoming webhook URL for destination Slack channel | `https://hooks.slack.com/services/T00/B00/X00` |

    ## Quick start

    1. In Kestra, navigate to **Flows** and import this blueprint into your designated namespace (e.g., `company.cloud`).
    2. Add your `RAILWAY_API_TOKEN` and `SLACK_WEBHOOK` into **Settings > Secrets**.
    3. Click **Execute** and provide your `railway_project_id` to test the audit pass.
    4. Review execution logs to verify deployment parsing and ensure the Slack alert card renders properly.
    5. In the flow definition, toggle `disabled: false` on `periodic_railway_audit` to activate the automated 2-hour monitoring schedule.

    ## How to extend

    - **Automated Rollback Trigger**: Chain an automated rollback task using `io.kestra.plugin.core.http.Request` to trigger the Railway deployment rollback endpoint when `remediation_mode == 'AUTO_ROLLBACK'`.
    - **PagerDuty Escalation**: Add an `io.kestra.plugin.pagerduty.Incident` task within the `DEPLOYMENTS_DEGRADED` branch to escalate persistent production outages to on-call engineers.
    - **Multi-Project Inspection**: Replace the single project input with `io.kestra.plugin.core.flow.ForEach` to audit all organization projects in parallel.

    ## Links

    - [Railway GraphQL API Documentation](https://docs.railway.app/reference/public-api)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
