id: kafka-producer-compression-ratio-sentinel
namespace: company.team
description: |
  Automated Apache Kafka topic compression efficiency auditor. Samples message batches across high-throughput topics,
  calculates payload compressibility, and alerts when uncompressed streams cause network and broker storage bloat.

concurrency:
  limit: 1

inputs:
  - id: bootstrap_servers
    type: STRING
    displayName: Kafka Bootstrap Servers
    defaults: "kafka.internal:9092"
    description: "Comma-separated list of Kafka broker host and port pairs."

  - id: topic_name
    type: STRING
    displayName: Kafka Topic
    defaults: "telemetry-events-raw"
    description: "Target Apache Kafka topic to sample and analyze for batch compression efficiency."

  - id: group_id
    type: STRING
    displayName: Consumer Group ID
    defaults: "kestra-compression-sentinel"
    description: "Consumer group ID used for non-intrusive metadata and payload sampling."

  - id: min_compression_ratio_threshold
    type: FLOAT
    displayName: Compression Threshold
    defaults: 1.5
    description: "Minimum expected compression ratio (uncompressed size / compressed size). Values below this threshold trigger an advisory alert."

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#data-platform"
    description: "Slack channel destination for topic bandwidth efficiency alerts."

triggers:
  - id: periodic_compression_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Audits topic compression efficiency every 4 hours."
    cron: "0 */4 * * *"

tasks:
  - id: sample_kafka_messages
    type: io.kestra.plugin.kafka.Consume
    description: "Samples a representative batch of records from the target Kafka topic."
    topic: "{{ inputs.topic_name }}"
    properties:
      bootstrap.servers: "{{ inputs.bootstrap_servers }}"
      group.id: "{{ inputs.group_id }}"
      auto.offset.reset: "latest"
      enable.auto.commit: "false"
    maxRecords: 50

  - id: evaluate_compression_efficiency
    type: io.kestra.plugin.scripts.python.Script
    description: "Measures raw payload bytes vs compressed zlib bytes to estimate producer batch compression efficiency."
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    inputFiles:
      messages.json: "{{ outputs.sample_kafka_messages.messages | default('[]') | json }}"
    outputFiles:
      - compression_report.json
    script: |
      import json
      import zlib
      from kestra import Kestra

      with open("messages.json", "r", encoding="utf-8") as f:
          records = json.load(f)

      total_records = len(records)
      total_payload_bytes = 0
      total_zlib_compressed_bytes = 0

      for r in records:
          val = r.get("value", "")
          if isinstance(val, (dict, list)):
              raw_bytes = json.dumps(val).encode("utf-8")
          elif isinstance(val, str):
              raw_bytes = val.encode("utf-8")
          else:
              raw_bytes = str(val).encode("utf-8")

          raw_len = len(raw_bytes)
          total_payload_bytes += raw_len
          total_zlib_compressed_bytes += len(zlib.compress(raw_bytes))

      threshold = float("{{ inputs.min_compression_ratio_threshold }}")
      
      if total_zlib_compressed_bytes > 0:
          estimated_ratio = round(total_payload_bytes / total_zlib_compressed_bytes, 2)
      else:
          estimated_ratio = 1.0

      is_inefficient = (total_records > 0) and (estimated_ratio < threshold)

      report = {
          "topic": "{{ inputs.topic_name }}",
          "sampled_records": total_records,
          "total_uncompressed_bytes": total_payload_bytes,
          "estimated_compressed_bytes": total_zlib_compressed_bytes,
          "compression_ratio": estimated_ratio,
          "target_threshold": threshold,
          "is_inefficient": is_inefficient
      }

      with open("compression_report.json", "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "sampled_count": total_records,
          "compression_ratio": estimated_ratio,
          "is_inefficient": is_inefficient,
          "raw_bytes_kb": round(total_payload_bytes / 1024, 2)
      })

  - id: evaluate_inefficiency_condition
    type: io.kestra.plugin.core.flow.If
    description: "Evaluates whether topic throughput exhibits substandard compression ratios."
    condition: "{{ outputs.evaluate_compression_efficiency.vars.is_inefficient }}"
    then:
      - id: notify_slack_compression_gap
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Dispatches bandwidth optimization guidance to data platform engineers via Slack."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "*Apache Kafka Topic Compression Inefficiency Advisory*\n• *Topic Name*: `{{ inputs.topic_name }}`\n• *Broker Cluster*: `{{ inputs.bootstrap_servers }}`\n• *Measured Compression Ratio*: `{{ outputs.evaluate_compression_efficiency.vars.compression_ratio }}x` (Target Threshold: {{ inputs.min_compression_ratio_threshold }}x)\n• *Sampled Batch Volume*: {{ outputs.evaluate_compression_efficiency.vars.sampled_count }} records ({{ outputs.evaluate_compression_efficiency.vars.raw_bytes_kb }} KB)\n• *Operational Impact*: Uncompressed message streams waste cross-AZ network egress bandwidth and rapidly exhaust broker NVMe storage.\n• *Recommended Remediation*: Configure upstream producer applications with `compression.type=lz4` or `zstd` and tune `linger.ms=20` to enable multi-record batch compression."
          }

    else:
      - id: log_efficient_compression_status
        type: io.kestra.plugin.core.log.Log
        description: "Logs confirmation of healthy topic compression efficiency."
        message: "Kafka topic {{ inputs.topic_name }} compression audit compliant. Estimated ratio: {{ outputs.evaluate_compression_efficiency.vars.compression_ratio }}x."

  - id: export_compression_manifest
    type: io.kestra.plugin.core.debug.Return
    description: "Outputs structured JSON compression manifest for cluster observability."
    format: |
      {
        "pipeline": "kafka-producer-compression-ratio-sentinel",
        "audited_at": "{{ execution.startDate }}",
        "topic": "{{ inputs.topic_name }}",
        "compression_ratio": {{ outputs.evaluate_compression_efficiency.vars.compression_ratio }},
        "status": "{{ outputs.evaluate_compression_efficiency.vars.is_inefficient ? 'INEFFICIENT' : 'OPTIMIZED' }}"
      }

extend:
  shortDescription: "Audits Kafka topics for uncompressed payload streams and alerts on network bandwidth waste."
  title: "Kafka Producer Compression Ratio Sentinel"
  metaTitle: "Kafka Producer Compression Ratio Sentinel | Kestra Blueprint"
  metaDescription: "Audits Apache Kafka topics for batch compression efficiency, alerting engineering teams when producers emit uncompressed high-bandwidth payloads."
  description: |
    In high-scale event streaming pipelines powered by Apache Kafka, network egress fees and broker storage costs are directly tied to payload sizes. High-throughput producers emitting JSON or Avro events without compression saturate cross-availability-zone (AZ) network links and cause premature broker disk exhaustion.

    While Kafka natively supports high-performance codecs like `lz4`, `zstd`, and `snappy`, misconfigured producer clients often default to `compression.type=none` or omit `linger.ms`, producing uncompressed single-record packets that waste significant infrastructure spend.

    This blueprint implements an automated compression sentinel that connects to target Kafka brokers, samples active message batches, evaluates payload compressibility using in-memory compression analysis, and alerts data platform engineers when topics fall below the efficiency threshold.

    ## How it works

    1. **Scheduled Inspection**: The `periodic_compression_audit` trigger (`io.kestra.plugin.core.trigger.Schedule`) runs every 4 hours.
    2. **Message Batch Sampling**: The `sample_kafka_messages` task (`io.kestra.plugin.kafka.Consume`) consumes up to 50 records from the latest offsets without advancing consumer commit offsets.
    3. **Python Compressibility Scoring**: The `evaluate_compression_efficiency` task (`io.kestra.plugin.scripts.python.Script`) measures uncompressed bytes versus zlib-compressed size and derives the effective compression ratio.
    4. **Condition Branching**: The `evaluate_inefficiency_condition` flowable task (`io.kestra.plugin.core.flow.If`) evaluates if the ratio is below `min_compression_ratio_threshold`.
    5. **Slack Advisory**: When inefficient compression is detected, `notify_slack_compression_gap` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches actionable tuning recommendations.
    6. **Audit Manifest**: The `export_compression_manifest` task records topic metrics for long-term reporting.

    ## What you get

    - Automated audit of Kafka producer batch compression efficiency without broker downtime.
    - Early warning of uncompressed high-throughput topics causing cloud egress cost spikes.
    - Actionable Slack notifications with exact producer tuning recommendations (`compression.type`, `linger.ms`).
    - Non-intrusive consumer implementation with `enable.auto.commit=false`.

    ## Who it is for

    - Data Platform Engineers managing enterprise Apache Kafka or AWS MSK clusters.
    - Cloud FinOps practitioners optimizing network egress and storage spend.
    - Software Architects designing resilient event streaming schemas.

    ## Why orchestrate this with Kestra

    Monitoring topic compression usually requires deploying custom Kafka Connect audit plugins or running external monitoring services. Kestra unifies native Kafka connectivity, isolated container execution, and workflow alerting into a declarative YAML flow that runs reliably on schedule.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `bootstrap_servers` | STRING | `kafka.internal:9092` | Kafka broker connection endpoint. |
    | `topic_name` | STRING | `telemetry-events-raw` | Topic name to inspect. |
    | `group_id` | STRING | `kestra-compression-sentinel` | Consumer group identifier. |
    | `min_compression_ratio_threshold` | FLOAT | `1.5` | Minimum acceptable compression ratio (e.g. 1.5x). |
    | `slack_channel` | STRING | `#data-platform` | Slack channel destination for alerts. |

    ## Expected outputs

    - `{{ outputs.evaluate_compression_efficiency.vars.compression_ratio }}`: Calculated compression ratio of sampled messages.
    - `{{ outputs.evaluate_compression_efficiency.vars.is_inefficient }}`: Boolean flag indicating if ratio failed threshold.
    - `{{ outputs.evaluate_compression_efficiency.vars.raw_bytes_kb }}`: Total uncompressed batch size in kilobytes.
    - `{{ outputs.evaluate_compression_efficiency.outputFiles['compression_report.json'] }}`: Complete JSON diagnostic report.

    ## Prerequisites

    - Network access to target Apache Kafka brokers (standard port 9092 or 9094).
    - Read permissions on the specified topic.
    - Slack Incoming Webhook configured in Kestra secrets.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra instance.
    3. Click **Execute** in the UI to run an initial topic compression test.
    4. Review execution outputs to check the calculated compression ratio.

    ## Common pitfalls and troubleshooting

    - **Offset Reset**: If `auto.offset.reset` is set to `latest` and no new messages arrive during the sampling window, the sampled message array will be empty; test on topics with steady message ingress.
    - **SASL/SSL Security**: For managed clusters like AWS MSK or Confluent Cloud, add required SASL/SSL credentials to the task properties block.
    - **Small Payloads**: Very small payloads (< 100 bytes) may have low compression ratios due to fixed compression headers; adjust `min_compression_ratio_threshold` accordingly.

    ## How to extend

    - Scan multiple topics in parallel using `io.kestra.plugin.core.flow.EachParallel` to audit entire cluster namespaces.
    - Correlate compression ratios with Prometheus broker network metrics via `io.kestra.plugin.core.http.Request`.
    - Automatically track average message sizes over time to spot payload schema bloat.

    ## Links

    - Kestra Kafka Plugin Documentation: https://kestra.io/plugins/plugin-kafka/io.kestra.plugin.kafka.Consume
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - Apache Kafka Compression Documentation: https://kafka.apache.org/documentation/#producerconfigs_compression.type
  tags:
    - Data
    - Infrastructure
  subTags:
    - Realtime & Streaming
    - Monitoring & Alerting
  ee: false
  demo: false
