id: kafka-producer-compression-ratio-sentinel
namespace: company.team

inputs:
  - id: bootstrap_servers
    type: STRING
    defaults: "kafka.internal:9092"
    description: "Comma-separated list of Kafka broker host and port pairs."

  - id: topic_name
    type: STRING
    defaults: "telemetry-events-raw"
    description: "Target Apache Kafka topic to sample and analyze for batch compression efficiency."

  - id: group_id
    type: STRING
    defaults: "kestra-compression-sentinel"
    description: "Consumer group ID used for non-intrusive metadata and payload sampling."

  - id: min_compression_ratio_threshold
    type: FLOAT
    defaults: 1.5
    description: "Minimum expected compression ratio (uncompressed size / compressed size). Values below this threshold trigger an advisory alert."

  - id: slack_webhook_url
    type: STRING
    defaults: "{{ secret('SLACK_WEBHOOK_URL') }}"
    description: "Slack Incoming Webhook URL for alerting on uncompressed topic traffic."

tasks:
  - id: sample_kafka_messages
    type: io.kestra.plugin.kafka.Consume
    topic: "{{ inputs.topic_name }}"
    properties:
      bootstrap.servers: "{{ inputs.bootstrap_servers }}"
      group.id: "{{ inputs.group_id }}"
      auto.offset.reset: "latest"
      enable.auto.commit: "false"
    maxRecords: 50

  - id: evaluate_compression_efficiency
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    inputFiles:
      messages.json: "{{ outputs.sample_kafka_messages.messages | default('[]') | json }}"
    outputFiles:
      - compression_report.json
    script: |
      import json
      import zlib
      from kestra import Kestra

      with open("messages.json", "r", encoding="utf-8") as f:
          records = json.load(f)

      total_records = len(records)
      total_payload_bytes = 0
      total_zlib_compressed_bytes = 0

      for r in records:
          val = r.get("value", "")
          if isinstance(val, (dict, list)):
              raw_bytes = json.dumps(val).encode("utf-8")
          elif isinstance(val, str):
              raw_bytes = val.encode("utf-8")
          else:
              raw_bytes = str(val).encode("utf-8")

          raw_len = len(raw_bytes)
          total_payload_bytes += raw_len
          total_zlib_compressed_bytes += len(zlib.compress(raw_bytes))

      threshold = float("{{ inputs.min_compression_ratio_threshold }}")
      
      # Calculate effective compression ratio
      if total_zlib_compressed_bytes > 0:
          estimated_ratio = round(total_payload_bytes / total_zlib_compressed_bytes, 2)
      else:
          estimated_ratio = 1.0

      # Flag as inefficient if records exist and ratio is lower than target threshold
      is_inefficient = (total_records > 0) and (estimated_ratio < threshold)

      report = {
          "topic": "{{ inputs.topic_name }}",
          "sampled_records": total_records,
          "total_uncompressed_bytes": total_payload_bytes,
          "estimated_compressed_bytes": total_zlib_compressed_bytes,
          "compression_ratio": estimated_ratio,
          "target_threshold": threshold,
          "is_inefficient": is_inefficient
      }

      with open("compression_report.json", "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "sampled_count": total_records,
          "compression_ratio": estimated_ratio,
          "is_inefficient": is_inefficient,
          "raw_bytes_kb": round(total_payload_bytes / 1024, 2)
      })

  - id: evaluate_inefficiency_condition
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.evaluate_compression_efficiency.vars.is_inefficient }}"
    then:
      - id: notify_slack_compression_gap
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ inputs.slack_webhook_url }}"
        payload: |
          {
            "text": "Kafka Compression Efficiency Alert: Topic `{{ inputs.topic_name }}` exhibits low compression efficiency (Ratio: {{ outputs.evaluate_compression_efficiency.vars.compression_ratio }}x vs threshold {{ inputs.min_compression_ratio_threshold }}x). Sampled {{ outputs.evaluate_compression_efficiency.vars.sampled_count }} records ({{ outputs.evaluate_compression_efficiency.vars.raw_bytes_kb }} KB). Recommended action: Verify producer `compression.type` is set to `lz4` or `zstd`."
          }

  - id: log_compression_summary
    type: io.kestra.plugin.core.log.Log
    message: "Kafka compression audit finished for {{ inputs.topic_name }}. Records sampled: {{ outputs.evaluate_compression_efficiency.vars.sampled_count }}, Ratio: {{ outputs.evaluate_compression_efficiency.vars.compression_ratio }}x."

triggers:
  - id: periodic_compression_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */4 * * *"

extend:
  title: "Kafka Producer Compression Ratio Sentinel"
  shortDescription: "Audits Kafka topics for uncompressed payload streams and alerts on network bandwidth waste."
  metaTitle: "Kafka Producer Compression Ratio Sentinel | Kestra Blueprint"
  metaDescription: "Audits Apache Kafka topics for batch compression efficiency, alerting engineering teams when producers emit uncompressed high-bandwidth payloads."
  tags:
    - Data
    - Infrastructure
    - System
  ee: false
  demo: false
  description: |
    ### What It Does
    This blueprint connects to Apache Kafka clusters to sample message batches across high-volume topics, evaluates payload size compressibility, and verifies that upstream producers are utilizing efficient batch compression (such as `lz4` or `zstd`). Uncompressed message streams waste network egress bandwidth and increase broker disk I/O load.

    ### Prerequisites
    - Network connectivity to target Apache Kafka brokers.
    - Read permissions on the specified topic.
    - Slack Incoming Webhook configured as secret `SLACK_WEBHOOK_URL`.

    ### Quick Start
    1. Set your broker addresses in `bootstrap_servers`.
    2. Provide the target topic name in `topic_name`.
    3. Specify your minimum acceptable compression threshold in `min_compression_ratio_threshold`.
    4. Run manually or on schedule to track topic throughput efficiency.

    ### Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `bootstrap_servers` | STRING | `kafka.internal:9092` | Kafka broker connection endpoint |
    | `topic_name` | STRING | `telemetry-events-raw` | Topic name to inspect |
    | `group_id` | STRING | `kestra-compression-sentinel` | Consumer group identifier |
    | `min_compression_ratio_threshold` | FLOAT | `1.5` | Compression ratio alert threshold |
    | `slack_webhook_url` | STRING | `{{ secret('SLACK_WEBHOOK_URL') }}` | Slack notification destination |

    ### Expected Outputs
    - `outputs.evaluate_compression_efficiency.vars.compression_ratio`: Estimated compression ratio across sampled records.
    - `outputs.evaluate_compression_efficiency.vars.is_inefficient`: Boolean flag indicating whether compression failed to meet threshold.
    - `outputs.evaluate_compression_efficiency.outputFiles['compression_report.json']`: JSON report with detailed payload statistics.

    ### Common Pitfalls
    - If `auto.offset.reset` is set to `latest` and no new messages arrive during the sampling window, the sampled message array will be empty.
    - In SASL/SSL secured clusters, include required security protocol properties in the consumer configuration.
