# SPDX-License-Identifier: Apache-2.0
id: mongodb-abandoned-job-lease-requeue-guard
namespace: company.team
description: Recover expired running jobs under an embedded lease and result-publication contract while quarantining exhausted attempts.

concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: mongodb_uri
    type: SECRET
    defaults: "{{ secret('MONGODB_URI') }}"
    description: Primary reads, acknowledged writes and finite connection, selection and socket timeouts are required.
  - id: database
    type: STRING
    defaults: appdata
  - id: collection
    type: STRING
    defaults: jobs
  - id: queue
    type: STRING
    defaults: result-workers
  - id: expiry_grace_seconds
    type: INT
    defaults: 60
    min: 0
    max: 86400
  - id: max_jobs
    type: INT
    defaults: 10
    min: 1
    max: 25
  - id: dry_run
    type: BOOL
    defaults: true
  - id: auto_remediate
    type: BOOL
    defaults: false

variables:
  literal_queue: "{{ inputs.queue | toJson | replace({'{': '\\u007b', '}': '\\u007d'}) }}"
  literal_id: "{{ fromJson(item.value)._id | toJson | replace({'{': '\\u007b', '}': '\\u007d'}) }}"
  literal_owner: "{{ fromJson(item.value).ownerToken | toJson | replace({'{': '\\u007b', '}': '\\u007d'}) }}"
  next_state: "{{ fromJson(item.value).attempt < fromJson(item.value).maxAttempts ? 'queued' : 'failed' }}"
  eligible: >-
    {"contract":{"$eq":"embedded-job-result-v1"},"queue":{"$eq":{{ render(vars.literal_queue) }}},"state":{"$eq":"running"},"result":{"$exists":false},"leaseUntil":{"$type":"date"},"attempt":{"$type":"int","$gte":1,"$lte":100},"maxAttempts":{"$type":"int","$gte":1,"$lte":100},"fence":{"$type":"long","$gte":0,"$lte":9007199254740989},"$expr":{"$and":[{"$eq":[{"$type":"$contract"},"string"]},{"$eq":[{"$type":"$queue"},"string"]},{"$eq":[{"$type":"$state"},"string"]},{"$eq":[{"$type":"$leaseUntil"},"date"]},{"$eq":[{"$type":"$attempt"},"int"]},{"$eq":[{"$type":"$maxAttempts"},"int"]},{"$eq":[{"$type":"$fence"},"long"]},{"$eq":[{"$type":"$_id"},"string"]},{"$eq":[{"$type":"$ownerToken"},"string"]},{"$lte":["$attempt","$maxAttempts"]},{"$lt":["$leaseUntil",{"$subtract":["$$NOW",{{ inputs.expiry_grace_seconds * 1000 }}]}]},{"$gte":[{"$strLenBytes":{"$cond":[{"$eq":[{"$type":"$_id"},"string"]},"$_id",""]}},1]},{"$lte":[{"$strLenBytes":{"$cond":[{"$eq":[{"$type":"$_id"},"string"]},"$_id",""]}},256]},{"$gte":[{"$strLenBytes":{"$cond":[{"$eq":[{"$type":"$ownerToken"},"string"]},"$ownerToken",""]}},1]},{"$lte":[{"$strLenBytes":{"$cond":[{"$eq":[{"$type":"$ownerToken"},"string"]},"$ownerToken",""]}},256]}]}}
  observed: >-
    {"$and":[{{ render(vars.eligible) }},{"_id":{"$eq":{{ render(vars.literal_id) }}},"ownerToken":{"$eq":{{ render(vars.literal_owner) }}},"leaseUntil":{"$eq":{"$date":{{ fromJson(item.value).leaseUntil | toJson }}}},"fence":{"$eq":{"$numberLong":{{ (fromJson(item.value).fence ~ '') | toJson }}}},"attempt":{"$eq":{{ fromJson(item.value).attempt }}},"maxAttempts":{"$eq":{{ fromJson(item.value).maxAttempts }}}}]}

tasks:
  - id: validate_scope
    type: io.kestra.plugin.core.execution.Assert
    conditions:
      - "{{ inputs.database | length > 0 and inputs.database | length <= 64 }}"
      - "{{ inputs.collection | length > 0 and inputs.collection | length <= 120 }}"
      - "{{ inputs.database | replace({'[A-Za-z0-9_-]': ''}, regexp=true) | length == 0 }}"
      - "{{ inputs.collection | replace({'[A-Za-z0-9_-]': ''}, regexp=true) | length == 0 }}"
      - "{{ inputs.queue | length > 0 and inputs.queue | length <= 128 }}"
      - "{{ inputs.expiry_grace_seconds >= 0 and inputs.expiry_grace_seconds <= 86400 }}"
      - "{{ inputs.max_jobs >= 1 and inputs.max_jobs <= 25 }}"
    errorMessage: Invalid scope or bounds. No MongoDB operation was attempted.

  - id: find_expired_jobs
    type: io.kestra.plugin.mongodb.Find
    timeout: PT30S
    connection:
      uri: "{{ inputs.mongodb_uri }}"
    database: "{{ inputs.database }}"
    collection: "{{ inputs.collection }}"
    filter: "{{ render(vars.eligible) }}"
    projection:
      _id: 1
      ownerToken: 1
      leaseUntil: 1
      fence: 1
      attempt: 1
      maxAttempts: 1
    sort:
      leaseUntil: 1
      _id: 1
    limit: "{{ inputs.max_jobs }}"
    store: false

  - id: findings
    type: io.kestra.plugin.core.log.Log
    message: >-
      Expired running jobs={{ outputs.find_expired_jobs.size }}; page_limit={{ inputs.max_jobs }}.
      A full page may leave more jobs. Unsupported schemas are excluded, not certified healthy.

  - id: candidates
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.find_expired_jobs.size > 0 }}"
    then:
      - id: notify_candidates
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: >-
          {{ {'text': 'MongoDB job recovery: ' ~ outputs.find_expired_jobs.size ~ ' expired running jobs. Confirm embedded lease/result fencing before approving execution ' ~ execution.id ~ '. Exhausted jobs will be marked failed.'} | toJson }}
      - id: write_mode
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: approve_recovery
            type: io.kestra.plugin.core.flow.Pause
            description: Confirm workers renew and publish results conditionally in the job document. External non-idempotent effects are unsupported.
            pauseDuration: PT1H
            behavior: FAIL
            onResume:
              - id: approved
                type: BOOL
                defaults: false
          - id: explicit_approval
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.approve_recovery.onResume.approved ?? false }}"
            then:
              - id: recover_jobs
                type: io.kestra.plugin.core.flow.Loop
                values: "{{ outputs.find_expired_jobs.rows }}"
                concurrencyLimit: 1
                tasks:
                  - id: reread_job
                    type: io.kestra.plugin.mongodb.Find
                    timeout: PT30S
                    connection:
                      uri: "{{ inputs.mongodb_uri }}"
                    database: "{{ inputs.database }}"
                    collection: "{{ inputs.collection }}"
                    filter: "{{ render(vars.observed) }}"
                    projection:
                      _id: 1
                    limit: 1
                    store: false
                  - id: unchanged_job
                    type: io.kestra.plugin.core.execution.Assert
                    conditions:
                      - "{{ outputs.reread_job.size == 1 }}"
                    errorMessage: Job changed or disappeared after approval. Build a fresh plan, preserving any earlier recovery.
                  - id: recover_with_fence
                    type: io.kestra.plugin.mongodb.Update
                    timeout: PT30S
                    connection:
                      uri: "{{ inputs.mongodb_uri }}"
                    database: "{{ inputs.database }}"
                    collection: "{{ inputs.collection }}"
                    operation: UPDATE_ONE
                    filter: "{{ render(vars.observed) }}"
                    document: >-
                      {"$set":{"state":{{ render(vars.next_state) | toJson }},"recoveryExecution":{{ execution.id | toJson }}},"$inc":{"fence":{"$numberLong":"1"}},"$currentDate":{"recoveredAt":true}}
                  - id: acknowledged_recovery
                    type: io.kestra.plugin.core.execution.Assert
                    conditions:
                      - "{{ outputs.recover_with_fence.wasAcknowledged and outputs.recover_with_fence.matchedCount == 1 and outputs.recover_with_fence.modifiedCount == 1 }}"
                    errorMessage: Conditional recovery did not modify exactly one job. Never retry the old snapshot.
                  - id: verify_transition
                    type: io.kestra.plugin.mongodb.Find
                    timeout: PT30S
                    connection:
                      uri: "{{ inputs.mongodb_uri }}"
                    database: "{{ inputs.database }}"
                    collection: "{{ inputs.collection }}"
                    filter: >-
                      {"_id":{"$eq":{{ render(vars.literal_id) }}},"state":{"$eq":{{ render(vars.next_state) | toJson }}},"attempt":{"$eq":{{ fromJson(item.value).attempt }}},"maxAttempts":{"$eq":{{ fromJson(item.value).maxAttempts }}},"fence":{"$eq":{"$numberLong":{{ ((fromJson(item.value).fence + 1) ~ '') | toJson }}}},"recoveryExecution":{"$eq":{{ execution.id | toJson }}},"recoveredAt":{"$type":"date"},"result":{"$exists":false}}
                    projection:
                      _id: 1
                    limit: 1
                    store: false
                  - id: recovered
                    type: io.kestra.plugin.core.execution.Assert
                    conditions:
                      - "{{ outputs.verify_transition.size == 1 }}"
                    errorMessage: Expected queue or failed transition was not observed. A fast consumer or ineffective recovery requires reconciliation.
              - id: recovery_summary
                type: io.kestra.plugin.core.log.Log
                message: Verified {{ outputs.find_expired_jobs.size }} job transitions. Confirm replacement worker progress independently.
            else:
              - id: declined
                type: io.kestra.plugin.core.log.Log
                message: Approval declined or omitted. No job changed.
        else:
          - id: report_only
            type: io.kestra.plugin.core.log.Log
            message: Safe mode. No recovery attempted.
    else:
      - id: no_candidates
        type: io.kestra.plugin.core.log.Log
        message: No supported expired running job matched the queue.

errors:
  - id: notify_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: >-
      {{ {'text': 'MongoDB job recovery failed in execution ' ~ execution.id ~ '. Inspect jobs and replacement workers before a fresh plan. Earlier transitions may remain.'} | toJson }}

triggers:
  - id: inspect_jobs
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      dry_run: true
      auto_remediate: false

extend:
  title: Requeue abandoned MongoDB jobs without replaying exhausted attempts
  metaTitle: Recover expired MongoDB worker jobs with Kestra
  shortDescription: Conditionally requeue expired running jobs or mark exhausted attempts failed while preserving payload and fencing stale result publication.
  metaDescription: Recover expired MongoDB job leases after approval. Requeue retryable work, quarantine exhausted attempts and verify each conditional state transition.
  description: |
    ## Safety

    Requires embedded-job-result-v1 workers: renewal/result publication match a live lease, token and fence in the job document. This flow does not install the contract. External non-idempotent effects are unsupported.

    | Guard | What it stops |
    | --- | --- |
    | Server-time expiry | Recovering a fresh lease |
    | Observed tuple CAS | Overriding renewal or replacement |
    | Immutable attempt cap | Endless poison-job replay |
    | Safe inputs and BOOL approval | Unapproved writes |

    ## How it works

    1. MongoDB `Find` selects a page of expired running jobs without results, projecting the recovery tuple.
    2. Slack reports candidates. Write mode pauses for approval. A sequential Loop re-reads each tuple.
    3. MongoDB `Update` repeats tuple/expiry atomically. Retryable jobs become queued; exhausted jobs become failed. Fence advances; attempts/payload remain.
    4. Native readback asserts state, fence, attempts and recovery marker. Changed plans, refused writes and unobserved transitions fail. Errors alert Slack.

    ## What you get

    Claimable stranded work and exhausted jobs quarantined in place. No deletion. Candidate count: `outputs.find_expired_jobs.size`.

    ## Who it's for

    MongoDB consumers that claim queued jobs and publish fenced results in the job document.

    ## Why orchestrate this with Kestra

    Approval and checked writes share an execution. Concurrency queues this ID only; predicates coordinate with other clients.

    ## Tested end to end

    MongoDB 7.0.45: 26 cases on Kestra 2.0.6 (plugin 1.4.11), eight on 2.0.5 (1.4.9) and eight on a fresh fixture. Mongosh confirmed 25 jobs survived and 23 protected jobs stayed unchanged. One replacement published result 42 once; stale-token renewal/result and capped claims failed. A real claim process exited and its lease expired naturally before requeue. Partial retry kept the first transition. Template-shaped IDs and 256-byte UTF-8 IDs passed; 257-byte IDs stayed unchanged.

    | Case | Execution | Result |
    | --- | --- | --- |
    | Healthy | `2HUcP55xqgZWBvAxC0jR3J` | SUCCESS |
    | Dry | `2KuBtyL12S0nugqyFmHRjj` | SUCCESS, unchanged |
    | Declined | `6S2ToN5sjeFVA9AvJFHlxn` | SUCCESS, unchanged |
    | Recovery | `6LTRGYJ5yGpPgvv9YVNgrN` | SUCCESS |
    | Refused | `3kpS8Wb01nsfhQAlYa4lJa` | FAILED |
    | Renewed | `52W6F5MGFcnmlW9pLbxKtY` | FAILED, spared |

    ## Prerequisites

    MongoDB 7.0, simple collation and collection-scoped find/update. Require primary reads, acknowledged writes and finite URI serverSelectionTimeoutMS, connectTimeoutMS and socketTimeoutMS. Database tasks time out after 30 seconds.

    Contract embedded-job-result-v1: permanent string _id and ownerToken (1..256 UTF-8 bytes), immutable queue/payload and BSON int maxAttempts (1..100). Running attempt is BSON int 1..maxAttempts; fence is BSON long 0..9007199254740989; leaseUntil is BSON date. Result absent until completion. States: queued/running/done/failed.

    Claim queued jobs below cap, increment attempt/fence and assign a unique token atomically. Renewal/completion require running state, token/fence and unexpired server-time lease. Write result and done together. Never recreate IDs, reuse tokens or rewind counters/caps. Computation may repeat. No external-effect exactly-once guarantee.

    ### Secrets

    - MONGODB_URI: SECRET connection.
    - SLACK_WEBHOOK_URL: candidate/failure notices.

    ### Inputs

    | Input | Default | Purpose |
    | --- | --- | --- |
    | database, collection | appdata, jobs | STRING, ASCII letters/digits/_/- |
    | queue | result-workers | STRING, exact scope, 1..128 characters |
    | expiry_grace_seconds | 60 | INT, extra delay, 0..86400 |
    | max_jobs | 10 | INT, page/write bound, 1..25 |
    | dry_run, auto_remediate | true, false | BOOL safe defaults |

    ## Quick start

    1. Confirm contract, configure secrets/scope and run defaults.
    2. Review candidates, set dry_run false and auto_remediate true, then approve.
    3. Check results and failed jobs. Reconcile with a fresh plan.

    ## How to extend

    Add result progress checks or failed-job notices. Index queue, contract, state and leaseUntil.

    Limits: one page, no multi-job transaction or blanket retry. Unsupported documents excluded. Fast consumers can fail readback conservatively. Partial transitions remain. No TTL deletion or resource-lock release.

    ## Links

    - [MongoDB single-document atomicity](https://www.mongodb.com/docs/v7.0/core/write-operations-atomicity/)
    - [MongoDB plugin](https://kestra.io/plugins/plugin-mongodb)

    This blueprint was created by [zkasuran](https://github.com/zkasuran).
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
