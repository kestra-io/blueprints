id: openfda-medical-device-adverse-event-lakehouse-loader
namespace: company.analytics
description: Ingests medical device adverse event reports, recall classifications, and manufacturer telemetry from openFDA API into DuckDB, exports Parquet and analytics datasets, and manages sync state with Kestra KV store.

inputs:
  - id: limit
    type: INT
    description: Number of medical device adverse event records to ingest per sync run.
    defaults: 50

  - id: state_key
    type: STRING
    description: Kestra KV store key tracking processed openFDA report numbers.
    defaults: openfda_device_adverse_events_state

variables:
  default_state: "[]"

triggers:
  - id: weekly_fda_device_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 7 * * 2"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_device_events
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'PYEOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime, timezone

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_ids = set(json.loads(raw_state))
        except Exception:
            seen_ids = set()

        url = "https://api.fda.gov/device/event.json"
        headers = {"User-Agent": "KestraLakehouseLoader/1.0 (kestra-data-pipeline; contact@company.internal)"}
        params = {"limit": {{ inputs.limit }}}

        resp = requests.get(url, headers=headers, params=params, timeout=30)
        resp.raise_for_status()
        data = resp.json()
        results = data.get("results", [])

        records = []
        now_iso = datetime.now(timezone.utc).isoformat()
        current_report_ids = []

        for item in results:
            report_number = item.get("report_number", "UNKNOWN")
            current_report_ids.append(report_number)
            event_type = item.get("event_type", "UNKNOWN")
            date_received = item.get("date_received", "UNKNOWN")
            event_key = item.get("event_key", "UNKNOWN")

            device_list = item.get("device", [])
            brand_name = "UNKNOWN"
            generic_name = "UNKNOWN"
            manufacturer_name = item.get("manufacturer_name", "UNKNOWN")

            if device_list and isinstance(device_list, list):
                d0 = device_list[0]
                brand_name = d0.get("brand_name", brand_name)
                generic_name = d0.get("generic_name", generic_name)
                manufacturer_name = d0.get("manufacturer_d_name", manufacturer_name)

            records.append({
                "report_number": str(report_number),
                "event_key": str(event_key),
                "event_type": str(event_type),
                "date_received": str(date_received),
                "brand_name": str(brand_name),
                "generic_name": str(generic_name),
                "manufacturer_name": str(manufacturer_name),
                "is_new": bool(report_number not in seen_ids),
                "ingestion_timestamp": now_iso
            })

        con = duckdb.connect(database=":memory:")
        con.execute("""
            CREATE TABLE fda_device_events (
                report_number VARCHAR,
                event_key VARCHAR,
                event_type VARCHAR,
                date_received VARCHAR,
                brand_name VARCHAR,
                generic_name VARCHAR,
                manufacturer_name VARCHAR,
                is_new BOOLEAN,
                ingestion_timestamp VARCHAR
            );
        """)

        if records:
            con.execute("INSERT INTO fda_device_events SELECT * FROM read_json_auto(?)", [json.dumps(records)])

        con.execute("COPY fda_device_events TO 'fda_device_adverse_events.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);")
        con.execute("""
            COPY (
                SELECT
                    event_type,
                    COUNT(*) AS event_count
                FROM fda_device_events
                GROUP BY 1
                ORDER BY event_count DESC
            ) TO 'device_events_summary_by_type.csv' (HEADER, DELIMITER ',');
        """)

        new_count = con.execute("SELECT count(*) FROM fda_device_events WHERE is_new = true").fetchone()[0]
        total_count = con.execute("SELECT count(*) FROM fda_device_events").fetchone()[0]

        updated_ids = list(seen_ids.union(current_report_ids))
        with open("updated_state.json", "w") as f:
            json.dump(updated_ids, f)

        metrics = {
            "total_extracted": total_count,
            "new_device_events": new_count,
            "synced_at": now_iso
        }
        with open("metrics.json", "w") as f:
            json.dump(metrics, f)

        print(f"Lakehouse sync complete. Processed {total_count} device adverse events ({new_count} newly observed).")
        PYEOF
    outputFiles:
      - fda_device_adverse_events.parquet
      - device_events_summary_by_type.csv
      - updated_state.json
      - metrics.json

  - id: update_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ read(outputs.ingest_and_transform_device_events.outputFiles['updated_state.json']) }}"

  - id: analyze_and_notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_device_events.outputFiles['fda_device_adverse_events.parquet'] != null }}"
    then:
      - id: log_metrics
        type: io.kestra.plugin.core.log.Log
        message: "openFDA Medical Device Adverse Events sync succeeded. Metrics: {{ read(outputs.ingest_and_transform_device_events.outputFiles['metrics.json']) }}"
