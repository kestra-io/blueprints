id: estuary-cdc-streaming-replication-lag-and-backpressure-gate
namespace: company.data

concurrency:
  limit: 1

inputs:
  - id: estuary_api_url
    type: STRING
    defaults: "https://api.estuary.dev"
    displayName: "Estuary Flow API Base URL"
    description: "Base URL for the Estuary Flow Control Plane or self-hosted Gazelle streaming runtime API endpoint."

  - id: capture_id
    type: STRING
    defaults: "cap_postgres_production_transactions"
    displayName: "Estuary Capture Identifier"
    description: "Unique identifier of the real-time CDC capture connector ingesting database change streams."

  - id: materialization_id
    type: STRING
    defaults: "mat_snowflake_customer_analytics"
    displayName: "Estuary Materialization Identifier"
    description: "Target warehouse materialization pipeline receiving real-time streaming CDC updates."

  - id: max_acceptable_lag_seconds
    type: INT
    defaults: 60
    displayName: "Maximum Acceptable CDC Lag (Seconds)"
    description: "Maximum allowable replication lag in seconds before triggering operational backoff and downstream gating."

  - id: max_consecutive_sync_failures
    type: INT
    defaults: 3
    displayName: "Max Consecutive Sync Failures"
    description: "Number of consecutive connector stream failure attempts allowed before tripping the circuit breaker."

  - id: verification_max_lag_seconds
    type: INT
    defaults: 20
    displayName: "Verification Max Allowable Lag (Seconds)"
    description: "Target replication lag threshold required to certify post-remediation recovery before releasing downstream jobs."

tasks:
  - id: ingest_estuary_capture_telemetry
    type: io.kestra.plugin.core.http.Request
    description: "Queries the Estuary Flow API to retrieve live CDC capture replication lag, sync state, and throughput metrics."
    uri: "{{ inputs.estuary_api_url }}/v1/captures/{{ inputs.capture_id }}/status"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('ESTUARY_API_TOKEN') }}"
      Accept: "application/json"
    timeout: PT30S

  - id: ingest_estuary_materialization_metrics
    type: io.kestra.plugin.core.http.Request
    description: "Fetches target materialization backpressure metrics, buffer byte accumulation, and rejected event counts."
    uri: "{{ inputs.estuary_api_url }}/v1/materializations/{{ inputs.materialization_id }}/metrics"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('ESTUARY_API_TOKEN') }}"
      Accept: "application/json"
    timeout: PT30S

  - id: analyze_streaming_lag_and_backpressure
    type: io.kestra.plugin.scripts.python.Script
    description: "Evaluates CDC streaming lag, detect connector stalls or warehouse backpressure, and determines remediation necessity."
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    script: |
      import json
      import sys
      from kestra import Kestra

      raw_capture = """{{ outputs.ingest_estuary_capture_telemetry.body }}"""
      raw_mat = """{{ outputs.ingest_estuary_materialization_metrics.body }}"""

      try:
          cap_data = json.loads(raw_capture) if raw_capture.strip() else {}
          mat_data = json.loads(raw_mat) if raw_mat.strip() else {}
      except Exception as err:
          sys.stderr.write(f"FATAL: Malformed JSON received from Estuary Flow API: {err}\n")
          sys.exit(1)

      if not cap_data or not mat_data:
          sys.stderr.write("FATAL: Estuary Flow status or materialization metrics payload is empty or unreachable.\n")
          sys.exit(1)

      capture_id = cap_data.get("capture_id", "{{ inputs.capture_id }}")
      sync_status = str(cap_data.get("status", "UNKNOWN")).upper()
      current_lag_seconds = int(cap_data.get("lag_seconds", 0))
      consecutive_errors = int(cap_data.get("consecutive_errors", 0))
      source_read_bytes_per_sec = float(cap_data.get("read_bytes_per_sec", 0.0))
      
      mat_backpressure = bool(mat_data.get("backpressure_detected", False))
      buffer_depth_bytes = int(mat_data.get("buffer_depth_bytes", 0))
      target_http_status = int(mat_data.get("target_endpoint_status", 200))

      max_lag = int("{{ inputs.max_acceptable_lag_seconds }}")
      max_errors = int("{{ inputs.max_consecutive_sync_failures }}")

      requires_remediation = False
      incident_reasons = []

      if current_lag_seconds > max_lag:
          requires_remediation = True
          incident_reasons.append(f"Replication lag {current_lag_seconds}s exceeds SLA {max_lag}s")

      if consecutive_errors >= max_errors:
          requires_remediation = True
          incident_reasons.append(f"Consecutive connector errors ({consecutive_errors}) exceed limit ({max_errors})")

      if sync_status in ["DEGRADED", "STALLED", "FAILED", "SUSPENDED"]:
          requires_remediation = True
          incident_reasons.append(f"Capture connector entered critical status '{sync_status}'")

      if mat_backpressure:
          requires_remediation = True
          incident_reasons.append(f"Downstream materialization target backpressure detected (Buffer: {buffer_depth_bytes} bytes)")

      incident_type = "NOMINAL"
      if requires_remediation:
          if target_http_status == 429:
              incident_type = "WAREHOUSE_RATE_LIMIT_BACKPRESSURE"
          elif current_lag_seconds > max_lag and mat_backpressure:
              incident_type = "STREAMING_BUFFER_SATURATION"
          elif consecutive_errors >= max_errors:
              incident_type = "CONNECTOR_HEARTBEAT_TIMEOUT"
          else:
              incident_type = "PERSISTENT_CDC_LAG_SPIKE"

      summary = "; ".join(incident_reasons) if incident_reasons else "Estuary CDC pipeline operating nominally within SLA."

      print(f"Estuary Flow Analysis Complete: Capture='{capture_id}', Status='{sync_status}', Lag={current_lag_seconds}s")
      print(f"Incident Classification: {incident_type} | Details: {summary}")

      Kestra.outputs({
          "capture_id": capture_id,
          "sync_status": sync_status,
          "current_lag_seconds": current_lag_seconds,
          "consecutive_errors": consecutive_errors,
          "buffer_depth_bytes": buffer_depth_bytes,
          "requires_remediation": requires_remediation,
          "incident_type": incident_type,
          "summary": summary
      })

  - id: evaluate_incident_severity
    type: io.kestra.plugin.core.flow.If
    description: "Branches execution based on whether Estuary CDC lag or backpressure violated enterprise SLAs."
    condition: "{{ outputs.analyze_streaming_lag_and_backpressure.vars.requires_remediation }}"
    then:
      - id: log_incident_detected
        type: io.kestra.plugin.core.log.Log
        description: "Logs the detected Estuary CDC replication lag spike and prepares the automated backpressure relief plan."
        level: WARN
        message: "CRITICAL: Estuary CDC capture '{{ inputs.capture_id }}' degraded. Incident Type: {{ outputs.analyze_streaming_lag_and_backpressure.vars.incident_type }}. Details: {{ outputs.analyze_streaming_lag_and_backpressure.vars.summary }}"

      - id: operator_remediation_approval_gate
        type: io.kestra.plugin.core.flow.Pause
        description: "Human-in-the-loop operational gate requiring on-call SRE or data engineer authorization before pausing stream capture and tuning backpressure limits."
        onResume:
          - id: approved
            type: BOOL
            defaults: true
            displayName: "Approve CDC Backpressure Remediation"
            description: "Authorize automated pause, batch throttling re-configuration, and pipeline resume."

          - id: remediation_strategy
            type: STRING
            defaults: "THROTTLE_AND_DRAIN"
            displayName: "Remediation Strategy"
            description: "Select operational recovery action: THROTTLE_AND_DRAIN, TEMPORARY_PAUSE, or RESTART_WORKERS."

          - id: operator_email
            type: STRING
            defaults: "data-sre-oncall@company.com"
            displayName: "Authorizing Operator Email"
            description: "Corporate identity of the on-call engineer approving this production intervention."

          - id: change_ticket_id
            type: STRING
            defaults: "INC-85921"
            displayName: "Incident Change Ticket ID"
            description: "ITSM incident or change ticket tracking this production remediation."

      - id: evaluate_operator_decision
        type: io.kestra.plugin.core.flow.If
        description: "Validates operator authorization decision to proceed with automated remediation. Strict fail-closed policy defaults to false if unset."
        condition: "{{ taskvar.approved ?? false }}"
        then:
          - id: pause_capture_connector
            type: io.kestra.plugin.core.http.Request
            description: "Active mutation: Temporarily pauses upstream database change capture to halt event floods during target rebalancing."
            uri: "{{ inputs.estuary_api_url }}/v1/captures/{{ inputs.capture_id }}/pause"
            method: POST
            headers:
              Authorization: "Bearer {{ secret('ESTUARY_API_TOKEN') }}"
              Content-Type: "application/json"
            body: |
              {
                "reason": "Automated backpressure relief triggered by Kestra incident {{ execution.id }}",
                "authorized_by": "{{ taskvar.operator_email }}",
                "ticket_id": "{{ taskvar.change_ticket_id }}"
              }
            timeout: PT30S

          - id: tune_materialization_batch_parameters
            type: io.kestra.plugin.core.http.Request
            description: "Active mutation: Reconfigures materialization batch duration and memory limits to relieve downstream warehouse backpressure."
            uri: "{{ inputs.estuary_api_url }}/v1/materializations/{{ inputs.materialization_id }}/config"
            method: PATCH
            headers:
              Authorization: "Bearer {{ secret('ESTUARY_API_TOKEN') }}"
              Content-Type: "application/json"
            body: |
              {
                "flush_interval_ms": 5000,
                "max_batch_records": 1000,
                "backoff_multiplier": 2.0,
                "circuit_breaker_error_threshold": 5
              }
            timeout: PT30S

          - id: resume_capture_connector
            type: io.kestra.plugin.core.http.Request
            description: "Active mutation: Resumes CDC streaming capture with tuned micro-batching parameters."
            uri: "{{ inputs.estuary_api_url }}/v1/captures/{{ inputs.capture_id }}/resume"
            method: POST
            headers:
              Authorization: "Bearer {{ secret('ESTUARY_API_TOKEN') }}"
              Content-Type: "application/json"
            body: |
              {
                "resumed_by": "{{ taskvar.operator_email }}",
                "reason": "Post-reconfiguration automated pipeline resume"
              }
            timeout: PT30S

          - id: streaming_drain_stabilization_delay
            type: io.kestra.plugin.scripts.shell.Commands
            description: "Awaits 20 seconds for Estuary streaming workers to flush queued micro-batches through the newly tuned backoff pipeline."
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            commands:
              - "echo 'Waiting 20 seconds for Estuary CDC workers to flush backlog...'"
              - "sleep 20"

          - id: post_remediation_telemetry_probe
            type: io.kestra.plugin.core.http.Request
            description: "Re-queries Estuary Flow API to inspect post-remediation CDC lag and confirm recovery."
            uri: "{{ inputs.estuary_api_url }}/v1/captures/{{ inputs.capture_id }}/status"
            method: GET
            headers:
              Authorization: "Bearer {{ secret('ESTUARY_API_TOKEN') }}"
              Accept: "application/json"
            timeout: PT30S

          - id: verify_lag_recovery_and_buffer_drain
            type: io.kestra.plugin.scripts.python.Script
            description: "Performs strict programmatic verification on post-remediation metrics to certify that CDC lag has dropped below tolerance."
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            script: |
              import json
              import sys
              from kestra import Kestra

              raw_probe = """{{ outputs.post_remediation_telemetry_probe.body }}"""

              try:
                  data = json.loads(raw_probe) if raw_probe.strip() else {}
              except Exception as err:
                  sys.stderr.write(f"FATAL: Malformed post-remediation JSON from Estuary API: {err}\n")
                  sys.exit(1)

              if not data:
                  sys.stderr.write("FATAL: Post-remediation status payload is empty or unreachable.\n")
                  sys.exit(1)

              remaining_lag_seconds = int(data.get("lag_seconds", 0))
              sync_state = str(data.get("status", "UNKNOWN")).upper()
              consecutive_errors = int(data.get("consecutive_errors", 0))

              max_target_lag = int("{{ inputs.verification_max_lag_seconds }}")

              recovered = True
              unresolved_issues = []

              if remaining_lag_seconds > max_target_lag:
                  recovered = False
                  unresolved_issues.append(f"Post-remediation lag ({remaining_lag_seconds}s) exceeds verification limit ({max_target_lag}s)")

              if sync_state in ["DEGRADED", "STALLED", "FAILED", "SUSPENDED"]:
                  recovered = False
                  unresolved_issues.append(f"Connector sync state remains in '{sync_state}'")

              if consecutive_errors > 0:
                  recovered = False
                  unresolved_issues.append(f"Connector reports {consecutive_errors} active errors")

              print(f"Post-Remediation Verification Result: Recovered={recovered}")
              if not recovered:
                  print(f"Verification Failure Reasons: {'; '.join(unresolved_issues)}")

              Kestra.outputs({
                  "recovered": recovered,
                  "remaining_lag_seconds": remaining_lag_seconds,
                  "post_sync_state": sync_state,
                  "unresolved_issues": unresolved_issues
              })

          - id: gate_downstream_data_warehouse_pipelines
            type: io.kestra.plugin.core.flow.If
            description: "Protects downstream dbt models, reverse-ETL jobs, and analytics exports by halting execution if CDC lag failed to recover."
            condition: "{{ not outputs.verify_lag_recovery_and_buffer_drain.vars.recovered }}"
            then:
              - id: fail_unrecovered_cdc_stream
                type: io.kestra.plugin.core.execution.Fail
                description: "Halts workflow execution with hard failure to prevent downstream models from ingesting stale or partial CDC datasets."
                errorMessage: "CRITICAL: Estuary CDC capture '{{ inputs.capture_id }}' failed post-remediation verification. Remaining lag: {{ outputs.verify_lag_recovery_and_buffer_drain.vars.remaining_lag_seconds }}s. Downstream data warehouse pipelines halted to protect data integrity."

          - id: record_incident_audit_kv
            type: io.kestra.plugin.core.kv.Set
            description: "Persists incident resolution metrics and operational metadata into Kestra KV store for compliance auditability."
            key: "estuary_incident_{{ inputs.capture_id }}_{{ execution.id }}"
            value: |
              {
                "capture_id": "{{ inputs.capture_id }}",
                "materialization_id": "{{ inputs.materialization_id }}",
                "incident_type": "{{ outputs.analyze_streaming_lag_and_backpressure.vars.incident_type }}",
                "operator_email": "{{ taskvar.operator_email }}",
                "change_ticket_id": "{{ taskvar.change_ticket_id }}",
                "remediation_strategy": "{{ taskvar.remediation_strategy }}",
                "pre_remediation_lag_seconds": {{ outputs.analyze_streaming_lag_and_backpressure.vars.current_lag_seconds }},
                "post_remediation_lag_seconds": {{ outputs.verify_lag_recovery_and_buffer_drain.vars.remaining_lag_seconds }},
                "remediation_timestamp": "{{ now() }}",
                "status": "RECOVERED"
              }

          - id: notify_slack_remediation_success
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: "Emits structured Slack alert summarizing the successful Estuary CDC remediation, lag resolution, and operator metadata."
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "channel": "#data-engineering-alerts",
                "text": "Estuary CDC Lag Remediation Succeeded: {{ inputs.capture_id }}",
                "blocks": [
                  {
                    "type": "header",
                    "text": {
                      "type": "plain_text",
                      "text": "Estuary CDC Streaming Lag Resolved"
                    }
                  },
                  {
                    "type": "section",
                    "fields": [
                      {
                        "type": "mrkdwn",
                        "text": "*Capture Connector:*\n`{{ inputs.capture_id }}`"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Target Materialization:*\n`{{ inputs.materialization_id }}`"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Authorizing Operator:*\n{{ taskvar.operator_email }} (`{{ taskvar.change_ticket_id }}`)"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Replication Lag:*\n{{ outputs.analyze_streaming_lag_and_backpressure.vars.current_lag_seconds }}s -> {{ outputs.verify_lag_recovery_and_buffer_drain.vars.remaining_lag_seconds }}s"
                      }
                    ]
                  },
                  {
                    "type": "context",
                    "elements": [
                      {
                        "type": "mrkdwn",
                        "text": "Execution ID: `{{ execution.id }}` | Verified via Kestra Streaming Sentinel"
                      }
                    ]
                  }
                ]
              }
        else:
          - id: fail_on_operator_rejection
            type: io.kestra.plugin.core.execution.Fail
            description: "Terminates execution if on-call engineer rejects automated remediation, preventing unsanctioned pipeline mutations."
            errorMessage: "Remediation for Estuary CDC capture '{{ inputs.capture_id }}' was rejected by operator {{ taskvar.operator_email }}. Downstream analytics execution aborted."
    else:
      - id: log_capture_healthy
        type: io.kestra.plugin.core.log.Log
        description: "Logs that the Estuary CDC pipeline is operating nominally and clears downstream data warehouse models to run."
        level: INFO
        message: "Estuary CDC capture '{{ inputs.capture_id }}' is healthy. Current Lag: {{ outputs.analyze_streaming_lag_and_backpressure.vars.current_lag_seconds }}s, Buffer Depth: {{ outputs.analyze_streaming_lag_and_backpressure.vars.buffer_depth_bytes }} bytes. Downstream data warehouse pipelines cleared to execute."

triggers:
  - id: schedule_periodic_cdc_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Periodically inspects Estuary CDC capture lag and materialization health every 15 minutes."
    cron: "*/15 * * * *"

extend:
  title: "Estuary CDC Streaming Replication Lag and Backpressure Gate"
  metaTitle: "Estuary CDC Streaming Replication Lag and Backpressure Gate"
  shortDescription: "Inspects Estuary Flow CDC replication lag, authorizes automated backoff, relieves warehouse backpressure, and gates downstream data pipelines."
  metaDescription: "Monitor Estuary Flow CDC streaming lag, relieve target warehouse backpressure with automated throttling, and gate downstream analytics pipelines."
  description: |
    ## How it works
    This blueprint establishes an active, closed-loop operational resilience workflow for enterprise **Estuary Flow** real-time Change Data Capture (CDC) and streaming ETL pipelines. In modern real-time lakehouses, Estuary captures live change streams from transactional databases (such as PostgreSQL, MySQL, and MongoDB) and materializes them into analytical destinations (Snowflake, BigQuery, ClickHouse, and Apache Iceberg). When high transaction write volumes or downstream target rate limits create ingestion backpressure, replication lag spikes, risking data divergence and query stalls. Rather than functioning as a passive notification script, this blueprint interacts directly with the Estuary Flow Control Plane and Gazelle runtime APIs:

    1. **Ingest Capture & Materialization Telemetry**: Queries the Estuary Flow API (`GET /v1/captures/{capture_id}/status` and `GET /v1/materializations/{materialization_id}/metrics`) using bearer authentication to collect real-time replication lag, connector error counts, target endpoint HTTP status codes, and streaming buffer depths.
    2. **In-Memory Lag & Backpressure Analysis**: Executes an isolated Python inspection task that computes current replication lag against enterprise SLAs, detects target warehouse throttling (HTTP 429) or connector timeouts, and classifies the failure mode. It enforces strict loud failure (`sys.exit(1)`) on malformed or empty API responses.
    3. **Human-in-the-Loop Operational Gate**: When telemetry reveals SLA degradation or buffer saturation, execution enters a `Pause` approval state. On-call data platform engineers or SREs inspect telemetry metrics, choose an authorized recovery strategy (`THROTTLE_AND_DRAIN`, `TEMPORARY_PAUSE`, or `RESTART_WORKERS`), and provide a corporate change ticket ID.
    4. **Active Operational Remediation (Tool Mutations)**:
       - Temporarily pauses incoming change capture streaming (`POST /v1/captures/{capture_id}/pause`) to stop event floods and prevent runaway buffer accumulation.
       - Reconfigures materialization batch durations and flush intervals (`PATCH /v1/materializations/{materialization_id}/config`) with exponential backoff to relieve downstream endpoint rate-limiting.
       - Resumes change capture delivery (`POST /v1/captures/{capture_id}/resume`) under relaxed micro-batch parameters.
    5. **Post-Remediation Verification Probe**: Re-queries the Estuary telemetry endpoint following a worker stabilization delay, programmatically asserting that the replication lag has dropped below the certified verification ceiling (`verification_max_lag_seconds`).
    6. **Downstream Pipeline Protection Gate**: If the replication lag fails to recover or the operator rejects remediation, an explicit `Fail` task aborts the execution. This halts downstream dbt modeling, reverse-ETL, and BI cache warming jobs from running against partial or stale CDC snapshots.
    7. **Audit & Incident State Tracking**: Saves full incident remediation metadata, operator attribution, pre/post lag durations, and ticket identifiers into the Kestra Key-Value (KV) store for compliance audits.
    8. **Runbook Alerting**: Emits a structured Slack notification detailing incident resolution metrics, lag reductions, and operational actions taken.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[Schedule Trigger: Every 15 Min] --> B[Ingest Estuary Capture Status]
        B --> C[Ingest Materialization Metrics]
        C --> D[Analyze CDC Lag & Backpressure in Python]
        D --> E{Lag or Backpressure Breach?}
        E -- No --> F[Log Healthy Status & Clear Downstream Jobs]
        E -- Yes --> G[Log Incident & Pause for Operator Approval]
        G --> H{Operator Approved?}
        H -- No --> I[Fail Workflow: Abort Downstream Transformations]
        H -- Yes --> J[Active Mutation: Pause Estuary CDC Capture]
        J --> K[Active Mutation: Reconfigure Batch & Flush Limits]
        K --> L[Active Mutation: Resume Estuary CDC Capture]
        L --> M[Stabilization Delay: Worker Flush Window]
        M --> N[Probe Post-Remediation Capture Telemetry]
        N --> O[Verify Lag Recovery in Python]
        O --> P{Replication Lag Recovered?}
        P -- No --> Q[Fail Task: Halt Downstream Data Pipelines]
        P -- Yes --> R[Record Audit Metadata in Kestra KV Store]
        R --> S[Notify SRE Team via Slack Incoming Webhook]
    ```

    ## What you get
    - **Active Operational Self-Healing**: Executes real HTTP mutations (`POST`, `PATCH`) into the Estuary Flow Control Plane to pause streaming, tune flush parameters, and resume workers without requiring manual CLI interventions.
    - **Downstream Data Corruption Prevention**: Eliminates silent data divergence in downstream data warehouses (Snowflake, BigQuery, ClickHouse) by gating executions when CDC replication lag breaches tolerance.
    - **Fail-Closed Change Management**: Implements strict fail-closed authorization where missing operator signoff automatically rejects mutations, safeguarding production pipelines.
    - **Automated Lag Recovery Verification**: Programmatically confirms that rebalanced streaming workers have drained backlogs before releasing downstream dependencies.
    - **Auditable Historical Log**: Records complete pre- and post-remediation metrics into the Kestra KV store for compliance and post-mortem analysis.

    ## Who it's for
    - **Data Platform Engineers**: Managing real-time CDC ingestion pipelines, Estuary Flow connectors, and streaming infrastructure.
    - **Site Reliability Engineers (SREs)**: Tasked with maintaining database replication SLAs, mitigating warehouse endpoint throttling, and enforcing automated circuit breakers.
    - **Analytics Engineers**: Ensuring that downstream customer data models and audience activations only run against synchronized, zero-loss CDC tables.

    ## Why orchestrate this with Kestra
    - **Native Flow Control & Approval Gates**: Kestra provides built-in `Pause` tasks with structured `onResume` schemas, enabling seamless human authorization without external webhook listeners or custom microservices.
    - **Zero-Dependency Core Execution**: Integrates native HTTP request plugins, process execution runners, and KV storage directly within a declarative YAML workflow.
    - **Strict Fail-Closed Mechanics**: The native `Fail` task ensures that stalling or degraded replication streams immediately prevent downstream tasks from processing incomplete datasets.
    - **Built-in Key-Value State Management**: Tracks incident history, recovery timestamps, and ticket IDs across workflow executions natively using Kestra KV store without requiring external Redis or database instances.

    ## Use cases
    - **Downstream Warehouse Rate-Limiting (HTTP 429)**: When high-volume transaction surges trigger rate limits on warehouse ingestion endpoints, this blueprint pauses streaming, relaxes batch sizes, and resumes ingestion with exponential backoff.
    - **End-of-Month Database High-Write Bursts**: Protects analytics pipelines during heavy billing or transaction close windows by actively pacing CDC capture workers.
    - **Downstream dbt Model Protection**: Gates scheduled batch transformation flows until real-time CDC connectors certify that replication lag has dropped below 20 seconds.

    ## Inputs
    | Parameter | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `estuary_api_url` | STRING | `https://api.estuary.dev` | Base URL for the Estuary Flow Control Plane or self-hosted Gazelle streaming runtime API endpoint. |
    | `capture_id` | STRING | `cap_postgres_production_transactions` | Unique identifier of the real-time CDC capture connector ingesting database change streams. |
    | `materialization_id` | STRING | `mat_snowflake_customer_analytics` | Target warehouse materialization pipeline receiving real-time streaming CDC updates. |
    | `max_acceptable_lag_seconds` | INT | `60` | Maximum allowable replication lag in seconds before triggering operational backoff. |
    | `max_consecutive_sync_failures` | INT | `3` | Number of consecutive connector stream failure attempts allowed before tripping circuit breaker. |
    | `verification_max_lag_seconds` | INT | `20` | Target replication lag threshold required to certify post-remediation recovery. |

    ## Expected outputs
    - `outputs.analyze_streaming_lag_and_backpressure.vars.requires_remediation`: Boolean indicating whether CDC lag or backpressure breached enterprise SLAs.
    - `outputs.analyze_streaming_lag_and_backpressure.vars.incident_type`: Classification of the failure mode (`WAREHOUSE_RATE_LIMIT_BACKPRESSURE`, `STREAMING_BUFFER_SATURATION`, `CONNECTOR_HEARTBEAT_TIMEOUT`, or `NOMINAL`).
    - `outputs.analyze_streaming_lag_and_backpressure.vars.current_lag_seconds`: Initial measured replication lag in seconds.
    - `outputs.verify_lag_recovery_and_buffer_drain.vars.recovered`: Boolean certifying whether replication lag successfully dropped below verification threshold.
    - `outputs.verify_lag_recovery_and_buffer_drain.vars.remaining_lag_seconds`: Final measured replication lag following the remediation probe.

    ## Prerequisites
    - **Estuary Flow Account or Self-Hosted Cluster**: An operational Estuary Flow workspace or self-hosted Gazelle engine.
    - **API Token**: An Estuary Flow personal access token or service account key with capture and materialization management permissions (`captures:read`, `captures:write`, `materializations:read`, `materializations:write`).
    - **Configured CDC Pipeline**: An active capture connector (e.g., PostgreSQL, MySQL) connected to a target materialization (e.g., Snowflake, BigQuery, ClickHouse).
    - **Kestra 2.0+ Instance**: Running Kestra with network access to the Estuary API endpoint and Slack webhook URL.

    ## Secrets
    Configure the following secrets in your Kestra secret manager:
    - `ESTUARY_API_TOKEN`: The bearer authentication token used to query the Estuary Flow API and execute operational pause, patch, and resume requests.
    - `SLACK_WEBHOOK_URL`: The incoming webhook URL for transmitting automated incident resolution alerts to the data engineering channel.

    ## Quick start
    1. Import this blueprint into your Kestra workspace under namespace `company.data`.
    2. Add the `ESTUARY_API_TOKEN` and `SLACK_WEBHOOK_URL` secrets to your Kestra namespace or global secret configuration.
    3. Update the `inputs` section with your specific `estuary_api_url`, `capture_id`, and `materialization_id`.
    4. Execute the flow manually with `Execution` -> `Execute` to perform an initial CDC health audit.
    5. When a test degradation is detected, inspect the `operator_remediation_approval_gate` task in the Kestra UI, supply your operator email and incident ticket ID, and click **Resume** to watch the automated pause, reconfigure, resume, and verification cycle execute.

    ## Common pitfalls and troubleshooting
    - **Estuary API 401 Unauthorized**: Ensure the `ESTUARY_API_TOKEN` secret is defined accurately in Kestra and that the token possesses administrative permissions over the specified capture and materialization.
    - **Premature Verification Probe Failure**: If post-remediation verification fails due to high residual lag, increase the `streaming_drain_stabilization_delay` sleep duration from 20 to 60 seconds to grant workers adequate time to flush buffers.
    - **Persistent Downstream Rate Limiting**: If downstream endpoints continue returning HTTP 429 after resume, decrease the `max_batch_records` in `tune_materialization_batch_parameters` from 1000 to 250 and increase `flush_interval_ms` to 10000.
    - **Downstream Flow Gating**: When `gate_downstream_data_warehouse_pipelines` fails, check execution logs to verify whether the incident was rejected by an operator or failed programmatic lag assertions.

    ## How to extend
    - **Multi-Capture Matrix Inspection**: Wrap the health check and remediation tasks within an `io.kestra.plugin.core.flow.ForEach` loop to monitor and remediate an array of critical CDC pipelines simultaneously.
    - **Automated Downstream Subflow Triggering**: Add a downstream trigger task (`io.kestra.plugin.core.flow.SubflowExecution`) to trigger warehouse dbt transformations only after post-remediation verification succeeds.
    - **Dynamic Incident Ticket Creation**: Integrate Jira Service Management or ServiceNow via HTTP Request before the pause gate to create an incident ticket automatically and populate `change_ticket_id`.

