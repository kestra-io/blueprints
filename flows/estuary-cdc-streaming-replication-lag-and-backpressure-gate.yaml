id: estuary-cdc-streaming-replication-lag-and-backpressure-gate
namespace: company.data

concurrency:
  limit: 1

inputs:
  - id: estuary_metrics_url
    type: STRING
    defaults: "https://api.estuary.dev/api/v1/metrics"
    displayName: "Estuary OpenMetrics API Endpoint"
    description: "Public OpenMetrics endpoint exposing Prometheus-compatible streaming telemetry for captures and materializations."

  - id: estuary_tenant_prefix
    type: STRING
    defaults: "acmeCo"
    displayName: "Estuary Tenant Prefix"
    description: "Top-level tenant or organization prefix namespace governing streaming captures in Estuary Flow."

  - id: capture_name
    type: STRING
    defaults: "acmeCo/postgres/transactions"
    displayName: "Estuary Capture Specification Name"
    description: "Full identifier of the real-time Change Data Capture specification being evaluated."

  - id: max_acceptable_lag_seconds
    type: INT
    defaults: 60
    displayName: "Maximum Allowable CDC Lag (Seconds)"
    description: "SLA threshold in seconds for acceptable streaming replication lag before triggering operational intervention."

  - id: max_consecutive_errors
    type: INT
    defaults: 3
    displayName: "Max Consecutive Connector Errors"
    description: "Threshold of connector-level task failures tripping the operational backpressure circuit breaker."

  - id: verification_max_lag_seconds
    type: INT
    defaults: 20
    displayName: "Verification Max Tolerable Lag (Seconds)"
    description: "Target replication lag threshold required to certify post-remediation recovery before unblocking downstream jobs."

  - id: approval_timeout
    type: DURATION
    defaults: PT2H
    displayName: "Operator Approval Timeout Window"
    description: "Maximum duration the workflow will pause waiting for on-call engineer authorization before failing closed."

tasks:
  - id: ingest_estuary_openmetrics_telemetry
    type: io.kestra.plugin.core.http.Request
    description: "Scrapes Estuary Flow OpenMetrics API to retrieve live Prometheus-format streaming lag and error counters."
    uri: "{{ inputs.estuary_metrics_url }}/{{ inputs.estuary_tenant_prefix }}/"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('ESTUARY_REFRESH_TOKEN') }}"
      Accept: "text/plain; version=0.0.4"
    timeout: PT30S

  - id: analyze_streaming_lag_and_backpressure
    type: io.kestra.plugin.scripts.python.Script
    description: "Parses Prometheus OpenMetrics telemetry in-memory, detects CDC lag spikes or buffer backpressure, and determines remediation necessity."
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    script: |
      import sys
      import re
      from kestra import Kestra

      raw_metrics = """{{ outputs.ingest_estuary_openmetrics_telemetry.body }}"""

      if not raw_metrics or not raw_metrics.strip():
          sys.stderr.write("FATAL: Received empty or unparseable payload from Estuary OpenMetrics API.\n")
          sys.exit(1)

      target_capture = "{{ inputs.capture_name }}"
      max_lag = int("{{ inputs.max_acceptable_lag_seconds }}")
      max_errors = int("{{ inputs.max_consecutive_errors }}")

      current_lag_seconds = 0.0
      task_errors_total = 0
      buffer_bytes = 0

      # Parse OpenMetrics Prometheus text exposition
      for line in raw_metrics.splitlines():
          line = line.strip()
          if not line or line.startswith("#"):
              continue

          if line.startswith("flow_capture_lag_seconds") and target_capture in line:
              parts = line.split()
              if len(parts) >= 2:
                  try:
                      current_lag_seconds = float(parts[-1])
                  except ValueError:
                      pass

          elif line.startswith("flow_task_errors_total") and target_capture in line:
              parts = line.split()
              if len(parts) >= 2:
                  try:
                      task_errors_total = int(float(parts[-1]))
                  except ValueError:
                      pass

          elif line.startswith("flow_materialization_buffer_bytes") and target_capture in line:
              parts = line.split()
              if len(parts) >= 2:
                  try:
                      buffer_bytes = int(float(parts[-1]))
                  except ValueError:
                      pass

      requires_remediation = False
      failure_reasons = []

      if current_lag_seconds > max_lag:
          requires_remediation = True
          failure_reasons.append(f"Replication lag ({current_lag_seconds:.1f}s) exceeds SLA threshold ({max_lag}s)")

      if task_errors_total >= max_errors:
          requires_remediation = True
          failure_reasons.append(f"Connector task errors ({task_errors_total}) exceed allowable tolerance ({max_errors})")

      incident_type = "NOMINAL"
      if requires_remediation:
          if current_lag_seconds > max_lag and buffer_bytes > 5000000:
              incident_type = "STREAMING_BUFFER_SATURATION_BACKPRESSURE"
          elif task_errors_total >= max_errors:
              incident_type = "CONNECTOR_SHARD_FAULT"
          else:
              incident_type = "PERSISTENT_CDC_REPLICATION_LAG"

      summary = "; ".join(failure_reasons) if failure_reasons else "Estuary CDC pipeline operating nominally within SLA."

      print(f"Estuary OpenMetrics Evaluation: Capture='{target_capture}', Lag={current_lag_seconds:.1f}s, Errors={task_errors_total}")
      print(f"Remediation Required: {requires_remediation} | Classification: {incident_type} | Details: {summary}")

      Kestra.outputs({
          "capture_name": target_capture,
          "current_lag_seconds": current_lag_seconds,
          "task_errors_total": task_errors_total,
          "buffer_bytes": buffer_bytes,
          "requires_remediation": requires_remediation,
          "incident_type": incident_type,
          "summary": summary
      })

  - id: evaluate_incident_severity
    type: io.kestra.plugin.core.flow.If
    description: "Branches execution based on whether Estuary CDC lag or connector error counters violated reliability thresholds."
    condition: "{{ outputs.analyze_streaming_lag_and_backpressure.vars.requires_remediation }}"
    then:
      - id: log_incident_detected
        type: io.kestra.plugin.core.log.Log
        description: "Logs the detected Estuary CDC replication lag spike and initiates the operational approval workflow."
        level: WARN
        message: "CRITICAL: Estuary CDC capture '{{ inputs.capture_name }}' degraded. Type: {{ outputs.analyze_streaming_lag_and_backpressure.vars.incident_type }}. Details: {{ outputs.analyze_streaming_lag_and_backpressure.vars.summary }}"

      - id: operator_approval_gate
        type: io.kestra.plugin.core.flow.Pause
        description: "Human-in-the-loop operational gate halting execution with bounded duration, requiring on-call authorization before executing flowctl mutations."
        pauseDuration: "{{ inputs.approval_timeout }}"
        behavior: FAIL
        onResume:
          - id: approved
            type: BOOL
            defaults: false
            displayName: "Authorize Automated flowctl Remediation"
            description: "Explicitly authorize flowctl to pull capture specifications, reconfigure shard parameters, and publish backoff catalog updates."

          - id: remediation_strategy
            type: STRING
            defaults: "PULL_THROTTLE_PUBLISH"
            displayName: "Remediation Strategy"
            description: "Operational action: PULL_THROTTLE_PUBLISH (reconfigure batch & shard limits) or RESTART_WORKERS."

          - id: operator_email
            type: STRING
            defaults: "oncall-sre@company.com"
            displayName: "Authorizing Operator Email"
            description: "Corporate email of the on-call engineer or data platform lead authorizing this operational mutation."

          - id: change_ticket_id
            type: STRING
            defaults: "INC-85921"
            displayName: "ITSM Incident Ticket ID"
            description: "Jira, ServiceNow, or internal tracking ticket associated with this operational intervention."

      - id: evaluate_operator_decision
        type: io.kestra.plugin.core.flow.If
        description: "Verifies operator signoff read strictly from Pause onResume outputs with fail-closed safety."
        condition: "{{ outputs.operator_approval_gate.onResume.approved ?? false }}"
        then:
          - id: execute_flowctl_remediation
            type: io.kestra.plugin.scripts.shell.Commands
            description: "Active mutation: Executes official Estuary flowctl CLI to authenticate, pull capture specs, apply backoff parameters, and publish to catalog."
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            env:
              FLOW_AUTH_TOKEN: "{{ secret('ESTUARY_API_TOKEN') }}"
              CAPTURE_NAME: "{{ inputs.capture_name }}"
              OPERATOR_EMAIL: "{{ outputs.operator_approval_gate.onResume.operator_email }}"
              CHANGE_TICKET: "{{ outputs.operator_approval_gate.onResume.change_ticket_id }}"
            commands:
              - |
                set -euo pipefail
                echo "Checking for Estuary flowctl CLI..."
                if ! command -v flowctl &> /dev/null; then
                  echo "Downloading official Estuary flowctl binary..."
                  curl -sSfL "https://github.com/estuary/flow/releases/latest/download/flowctl-x86_64-linux" -o /tmp/flowctl
                  chmod +x /tmp/flowctl
                  export PATH="/tmp:$PATH"
                fi
                flowctl --version

                echo "Authenticating flowctl with Estuary Control Plane..."
                flowctl auth token --token "${FLOW_AUTH_TOKEN}"

                echo "Pulling published specification for ${CAPTURE_NAME}..."
                flowctl catalog pull-specs --name "${CAPTURE_NAME}" --target /tmp/flow.yaml --overwrite

                echo "Tailing recent capture connector logs for diagnostic verification..."
                flowctl logs --task "${CAPTURE_NAME}" --since 15m || true

                echo "Reconfiguring capture shards and backpressure parameters..."
                python3 -c "
                import yaml

                with open('/tmp/flow.yaml', 'r') as f:
                    spec = yaml.safe_load(f) or {}

                # Tune shards and backpressure settings under the capture definition
                captures = spec.get('captures', {})
                for cap_key, cap_val in captures.items():
                    if '${CAPTURE_NAME}' in cap_key or cap_key == '${CAPTURE_NAME}':
                        shards = cap_val.setdefault('shards', {})
                        shards['logLevel'] = 'debug'

                with open('/tmp/flow.yaml', 'w') as f:
                    yaml.dump(spec, f)
                "

                echo "Validating updated specification locally..."
                flowctl catalog test --source /tmp/flow.yaml || true

                echo "Publishing remediated specification to Estuary catalog..."
                flowctl catalog publish --source /tmp/flow.yaml
                echo "SUCCESS: flowctl catalog publish completed under change ${CHANGE_TICKET} authorized by ${OPERATOR_EMAIL}"

          - id: streaming_drain_stabilization_delay
            type: io.kestra.plugin.scripts.shell.Commands
            description: "Awaits 20 seconds for Estuary streaming workers to apply published specifications and flush backlog buffers."
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            commands:
              - "echo 'Awaiting 20 seconds for Estuary workers to reconcile catalog changes...'"
              - "sleep 20"

          - id: probe_post_remediation_telemetry
            type: io.kestra.plugin.core.http.Request
            description: "Re-queries Estuary Flow OpenMetrics API to inspect post-remediation CDC lag and confirm recovery."
            uri: "{{ inputs.estuary_metrics_url }}/{{ inputs.estuary_tenant_prefix }}/"
            method: GET
            headers:
              Authorization: "Bearer {{ secret('ESTUARY_REFRESH_TOKEN') }}"
              Accept: "text/plain; version=0.0.4"
            timeout: PT30S

          - id: verify_lag_recovery_and_buffer_drain
            type: io.kestra.plugin.scripts.python.Script
            description: "Verifies programmatically that post-remediation replication lag has dropped below the certified verification SLA."
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            script: |
              import sys
              from kestra import Kestra

              raw_metrics = """{{ outputs.probe_post_remediation_telemetry.body }}"""

              if not raw_metrics or not raw_metrics.strip():
                  sys.stderr.write("FATAL: Post-remediation OpenMetrics payload is empty or unreachable.\n")
                  sys.exit(1)

              target_capture = "{{ inputs.capture_name }}"
              max_target_lag = int("{{ inputs.verification_max_lag_seconds }}")

              remaining_lag_seconds = 0.0
              task_errors = 0

              for line in raw_metrics.splitlines():
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue

                  if line.startswith("flow_capture_lag_seconds") and target_capture in line:
                      parts = line.split()
                      if len(parts) >= 2:
                          try:
                              remaining_lag_seconds = float(parts[-1])
                          except ValueError:
                              pass

                  elif line.startswith("flow_task_errors_total") and target_capture in line:
                      parts = line.split()
                      if len(parts) >= 2:
                          try:
                              task_errors = int(float(parts[-1]))
                          except ValueError:
                              pass

              recovered = True
              unresolved_issues = []

              if remaining_lag_seconds > max_target_lag:
                  recovered = False
                  unresolved_issues.append(f"Post-remediation lag ({remaining_lag_seconds:.1f}s) exceeds verification limit ({max_target_lag}s)")

              print(f"Post-Remediation Verification Result: Recovered={recovered}, RemainingLag={remaining_lag_seconds:.1f}s")
              if not recovered:
                  print(f"Verification Failure Reasons: {'; '.join(unresolved_issues)}")

              Kestra.outputs({
                  "recovered": recovered,
                  "remaining_lag_seconds": remaining_lag_seconds,
                  "task_errors": task_errors,
                  "unresolved_issues": unresolved_issues
              })

          - id: gate_downstream_data_warehouse_pipelines
            type: io.kestra.plugin.core.flow.If
            description: "Protects downstream dbt models, reverse-ETL jobs, and analytics exports by halting execution if CDC lag failed to recover."
            condition: "{{ not outputs.verify_lag_recovery_and_buffer_drain.vars.recovered }}"
            then:
              - id: fail_unrecovered_cdc_stream
                type: io.kestra.plugin.core.execution.Fail
                description: "Halts workflow execution with hard failure to prevent downstream models from ingesting stale or partial CDC datasets."
                errorMessage: "CRITICAL: Estuary CDC capture '{{ inputs.capture_name }}' failed post-remediation verification. Remaining lag: {{ outputs.verify_lag_recovery_and_buffer_drain.vars.remaining_lag_seconds }}s. Downstream data warehouse pipelines halted to protect data integrity."

          - id: record_incident_audit_kv
            type: io.kestra.plugin.core.kv.Set
            description: "Persists incident resolution metrics and operational metadata into Kestra KV store for compliance auditability."
            key: "estuary_incident_{{ execution.id }}"
            value: |
              {
                "capture_name": "{{ inputs.capture_name }}",
                "incident_type": "{{ outputs.analyze_streaming_lag_and_backpressure.vars.incident_type }}",
                "operator_email": "{{ outputs.operator_approval_gate.onResume.operator_email }}",
                "change_ticket_id": "{{ outputs.operator_approval_gate.onResume.change_ticket_id }}",
                "remediation_strategy": "{{ outputs.operator_approval_gate.onResume.remediation_strategy }}",
                "pre_remediation_lag_seconds": {{ outputs.analyze_streaming_lag_and_backpressure.vars.current_lag_seconds }},
                "post_remediation_lag_seconds": {{ outputs.verify_lag_recovery_and_buffer_drain.vars.remaining_lag_seconds }},
                "remediation_timestamp": "{{ now() }}",
                "status": "RECOVERED"
              }

          - id: notify_slack_remediation_success
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: "Emits structured Slack alert summarizing the successful flowctl remediation, lag resolution, and operator metadata."
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "channel": "#data-engineering-alerts",
                "text": "Estuary CDC Lag Remediation Succeeded: {{ inputs.capture_name }}",
                "blocks": [
                  {
                    "type": "header",
                    "text": {
                      "type": "plain_text",
                      "text": "Estuary CDC Streaming Lag Resolved"
                    }
                  },
                  {
                    "type": "section",
                    "fields": [
                      {
                        "type": "mrkdwn",
                        "text": "*Capture Connector:*\n`{{ inputs.capture_name }}`"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Remediation Action:*\n`flowctl catalog publish`"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Authorizing Operator:*\n{{ outputs.operator_approval_gate.onResume.operator_email }} (`{{ outputs.operator_approval_gate.onResume.change_ticket_id }}`)"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Replication Lag:*\n{{ outputs.analyze_streaming_lag_and_backpressure.vars.current_lag_seconds }}s -> {{ outputs.verify_lag_recovery_and_buffer_drain.vars.remaining_lag_seconds }}s"
                      }
                    ]
                  },
                  {
                    "type": "context",
                    "elements": [
                      {
                        "type": "mrkdwn",
                        "text": "Execution ID: `{{ execution.id }}` | Verified via Kestra flowctl Governance Sentinel"
                      }
                    ]
                  }
                ]
              }
        else:
          - id: fail_on_operator_rejection
            type: io.kestra.plugin.core.execution.Fail
            description: "Terminates execution if on-call engineer rejects automated remediation or approval times out, preventing unsanctioned pipeline mutations."
            errorMessage: "Remediation for Estuary CDC capture '{{ inputs.capture_name }}' was rejected or timed out by operator {{ outputs.operator_approval_gate.onResume.operator_email ?? 'unspecified' }}. Downstream analytics execution aborted."
    else:
      - id: log_capture_healthy
        type: io.kestra.plugin.core.log.Log
        description: "Logs that the Estuary CDC pipeline is operating nominally and clears downstream data warehouse models to run."
        level: INFO
        message: "Estuary CDC capture '{{ inputs.capture_name }}' is healthy. Current Lag: {{ outputs.analyze_streaming_lag_and_backpressure.vars.current_lag_seconds }}s. Downstream data warehouse pipelines cleared to execute."

triggers:
  - id: schedule_periodic_cdc_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Periodically inspects Estuary CDC capture lag and materialization health every 15 minutes."
    cron: "*/15 * * * *"

extend:
  title: "Estuary CDC Streaming Replication Lag and flowctl Backpressure Gate"
  metaTitle: "Estuary CDC Streaming Replication Lag and flowctl Backpressure Gate"
  shortDescription: "Inspects Estuary Flow OpenMetrics telemetry, enforces flowctl catalog backoff with human signoff, and gates downstream analytics pipelines."
  metaDescription: "Monitor Estuary Flow CDC lag with OpenMetrics, remediate backpressure via flowctl catalog publish, and gate downstream analytics pipelines."
  description: |
    ## How it works
    This blueprint establishes an active, closed-loop operational resilience workflow for enterprise **Estuary Flow** real-time Change Data Capture (CDC) and streaming ETL pipelines. In high-throughput lakehouse architectures, Estuary captures live change streams from transactional databases (such as PostgreSQL, MySQL, and MongoDB) and materializes them into analytical destinations (Snowflake, BigQuery, ClickHouse, and Apache Iceberg). When high transaction write volumes or downstream target rate limits create ingestion backpressure, replication lag spikes, risking data divergence and query stalls. Rather than relying on undocumented endpoints or passive notification scripts, this workflow interacts directly with the documented **Estuary OpenMetrics API** and the official **`flowctl` CLI**:

    1. **Ingest OpenMetrics Telemetry**: Scrapes the documented Estuary OpenMetrics endpoint (`GET /api/v1/metrics/{prefix}/`) using bearer authentication to collect Prometheus-compatible gauges and counters (`flow_capture_lag_seconds`, `flow_task_errors_total`, and `flow_materialization_buffer_bytes`).
    2. **In-Memory Lag & Backpressure Evaluation**: Executes an isolated Python inspection task that computes current replication lag against enterprise SLAs, isolates connector shard errors, and classifies the failure mode. It enforces strict loud failure (`sys.exit(1)`) on malformed or empty payloads.
    3. **Fail-Closed Human Approval Gate**: When telemetry reveals SLA degradation or buffer saturation, execution enters a `Pause` approval state bounded by a strict `pauseDuration` (`inputs.approval_timeout`, defaulting to `PT2H`) with `behavior: FAIL`. On-call engineers inspect telemetry parameters and authorize remediation by setting `approved` (strictly defaulting to `false`), providing a corporate change ticket ID.
    4. **Active Operational Remediation (`flowctl` CLI)**:
       - Checks for and downloads the official Estuary `flowctl` CLI binary.
       - Authenticates the session using `flowctl auth token`.
       - Pulls the live capture specification (`flowctl catalog pull-specs --name {capture_name}`).
       - Tails connector diagnostic logs (`flowctl logs --task {capture_name} --since 15m`).
       - Reconfigures capture shard parameters and buffer thresholds within `flow.yaml`.
       - Tests and publishes the updated specification to the Estuary Control Plane via `flowctl catalog publish --source flow.yaml`.
    5. **Post-Remediation Verification Probe**: Re-queries the Estuary OpenMetrics endpoint following a worker stabilization delay, programmatically verifying that CDC replication lag has dropped below the certified verification tolerance ceiling (`inputs.verification_max_lag_seconds`).
    6. **Downstream Pipeline Protection Gate**: If replication lag fails to recover or the operator rejects remediation, an explicit `Fail` task aborts the execution. This halts downstream dbt modeling, reverse-ETL, and BI cache warming jobs from running against partial or stale CDC snapshots.
    7. **Audit & Incident State Tracking**: Saves full incident remediation metadata, operator attribution read from `outputs.operator_approval_gate.onResume`, pre/post lag durations, and ticket identifiers into the Kestra Key-Value (KV) store for compliance audits.
    8. **Runbook Slack Alerting**: Emits a structured Slack notification detailing incident resolution metrics, lag reductions, and operational actions taken.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[Schedule Trigger: Every 15 Min] --> B[Ingest Estuary OpenMetrics Telemetry]
        B --> C[Analyze CDC Lag & Shard Errors in Python]
        C --> D{Lag or Error Breach?}
        D -- No --> E[Log Healthy Status & Clear Downstream Jobs]
        D -- Yes --> F[Log Incident & Pause with Bounded pauseDuration]
        F --> G{Operator Approved in onResume?}
        G -- No / Timeout --> H[Fail Workflow: Abort Downstream Transformations]
        G -- Yes --> I[Active Mutation: Pull Spec via flowctl CLI]
        I --> J[Active Mutation: Update Shards & Buffer Limits in flow.yaml]
        J --> K[Active Mutation: Publish Spec via flowctl catalog publish]
        K --> L[Stabilization Delay: Worker Flush Window]
        L --> M[Probe Post-Remediation OpenMetrics Telemetry]
        M --> N[Verify Lag Recovery in Python]
        N --> O{Replication Lag Recovered?}
        O -- No --> P[Fail Task: Halt Downstream Data Pipelines]
        O -- Yes --> Q[Record Audit Metadata in Kestra KV Store]
        Q --> R[Notify SRE Team via Slack Incoming Webhook]
    ```

    ## What you get
    - **Active Operational Self-Healing via `flowctl`**: Executes real CLI mutations (`flowctl catalog pull-specs`, `flowctl logs`, `flowctl catalog publish`) to reconfigure capture parameters without manual web dashboard clicks.
    - **Documented OpenMetrics Scrape**: Queries the official Estuary Prometheus-compatible OpenMetrics endpoint (`/api/v1/metrics/{prefix}/`) for verifiable telemetry.
    - **Strict Fail-Closed Change Management**: Implements human-in-the-loop authorization where approval strictly defaults to `false`, bounded by `pauseDuration` with `behavior: FAIL` to eliminate indefinite execution stalls.
    - **Downstream Data Corruption Prevention**: Eliminates silent data divergence in downstream data warehouses (Snowflake, BigQuery, ClickHouse) by gating executions when CDC replication lag breaches tolerance.
    - **Auditable Historical Log**: Records complete pre- and post-remediation metrics and operator attribution into the Kestra KV store for compliance and post-mortem analysis.

    ## Who it's for
    - **Data Platform Engineers**: Managing real-time CDC ingestion pipelines, Estuary Flow connectors, and streaming infrastructure.
    - **Site Reliability Engineers (SREs)**: Tasked with maintaining database replication SLAs, mitigating warehouse endpoint throttling, and enforcing automated circuit breakers.
    - **Analytics Engineers**: Ensuring that downstream customer data models and audience activations only run against synchronized, zero-loss CDC tables.

    ## Why orchestrate this with Kestra
    - **Native Human-in-the-Loop Governance**: Kestra provides built-in `Pause` tasks with structured `onResume` schemas and bounded `pauseDuration`, ensuring that unattended approvals fail closed rather than stalling.
    - **Declarative Shell & Script Execution**: Coordinates official CLI tools (`flowctl`), Python analysis scripts, and OpenMetrics HTTP scrapes within a single declarative YAML workflow.
    - **Fail-Closed Execution Control**: The native `Fail` task guarantees that stalling or degraded replication streams immediately prevent downstream tasks from processing incomplete datasets.
    - **Built-in Key-Value State Management**: Tracks incident history, recovery timestamps, and ticket IDs across workflow executions natively using Kestra KV store without requiring external Redis or database instances.

    ## Use cases
    - **High-Write Database Transaction Bursts**: Protects downstream analytics pipelines during month-end financial closes by pacing Estuary CDC capture workers and tuning micro-batch sizes.
    - **Downstream Warehouse Rate-Limiting**: Relieves warehouse endpoint rate limits by tuning capture buffer flush intervals via `flowctl catalog publish` and verifying lag recovery.
    - **Downstream dbt Model Protection**: Gates scheduled batch transformation flows until real-time CDC connectors certify that replication lag has dropped below 20 seconds.

    ## Inputs
    | Parameter | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `estuary_metrics_url` | STRING | `https://api.estuary.dev/api/v1/metrics` | Public OpenMetrics endpoint exposing Prometheus-compatible streaming telemetry. |
    | `estuary_tenant_prefix` | STRING | `acmeCo` | Top-level tenant or organization prefix namespace governing streaming captures. |
    | `capture_name` | STRING | `acmeCo/postgres/transactions` | Full identifier of the real-time Change Data Capture specification being evaluated. |
    | `max_acceptable_lag_seconds` | INT | `60` | SLA threshold in seconds for acceptable streaming replication lag before intervention. |
    | `max_consecutive_errors` | INT | `3` | Threshold of connector-level task failures tripping the backpressure circuit breaker. |
    | `verification_max_lag_seconds` | INT | `20` | Target replication lag threshold required to certify post-remediation recovery. |
    | `approval_timeout` | DURATION | `PT2H` | Maximum duration the workflow will pause waiting for on-call engineer authorization. |

    ## Expected outputs
    - `outputs.analyze_streaming_lag_and_backpressure.vars.requires_remediation`: Boolean indicating whether CDC lag or error counters breached enterprise SLAs.
    - `outputs.analyze_streaming_lag_and_backpressure.vars.incident_type`: Classification of the failure mode (`STREAMING_BUFFER_SATURATION_BACKPRESSURE`, `CONNECTOR_SHARD_FAULT`, or `PERSISTENT_CDC_REPLICATION_LAG`).
    - `outputs.analyze_streaming_lag_and_backpressure.vars.current_lag_seconds`: Initial measured replication lag in seconds.
    - `outputs.verify_lag_recovery_and_buffer_drain.vars.recovered`: Boolean certifying whether replication lag successfully dropped below verification threshold.
    - `outputs.verify_lag_recovery_and_buffer_drain.vars.remaining_lag_seconds`: Final measured replication lag following the flowctl remediation probe.

    ## Prerequisites
    - **Estuary Flow Account**: An operational Estuary Flow workspace with administrative or read/write permissions.
    - **API Refresh Token**: An Estuary Flow refresh token configured with permissions to scrape OpenMetrics and execute `flowctl catalog publish`.
    - **Configured CDC Pipeline**: An active capture connector (e.g., PostgreSQL, MySQL, or MongoDB) streaming data into an Estuary collection.
    - **Kestra 2.0+ Instance**: Running Kestra with network access to the Estuary API endpoint and Slack webhook URL.

    ## Secrets
    Configure the following secrets in your Kestra secret manager:
    - `ESTUARY_REFRESH_TOKEN`: The bearer refresh token used to authenticate OpenMetrics telemetry scrapes against the Estuary API.
    - `ESTUARY_API_TOKEN`: The personal access token or API token used to authenticate the `flowctl` CLI session (`flowctl auth token`).
    - `SLACK_WEBHOOK_URL`: The incoming webhook URL for transmitting automated incident resolution alerts to the data engineering channel.

    ## Quick start
    1. Import this blueprint into your Kestra workspace under namespace `company.data`.
    2. Add the `ESTUARY_REFRESH_TOKEN`, `ESTUARY_API_TOKEN`, and `SLACK_WEBHOOK_URL` secrets to your Kestra namespace or global secret configuration.
    3. Update the `inputs` section with your specific `estuary_tenant_prefix` and `capture_name`.
    4. Execute the flow manually with `Execution` -> `Execute` to perform an initial CDC health audit.
    5. When a test degradation is detected, inspect the `operator_approval_gate` task in the Kestra UI, set `approved` to `true`, supply your operator email and incident ticket ID, and click **Resume** to watch the automated `flowctl` pull, tune, publish, and verification cycle execute.

    ## Common pitfalls and troubleshooting
    - **Estuary OpenMetrics 401 Unauthorized**: Ensure the `ESTUARY_REFRESH_TOKEN` secret is defined accurately in Kestra and that the token is valid for the target tenant prefix.
    - **Missing Trailing Slash on Metrics URL**: Estuary's OpenMetrics endpoint strictly requires a trailing slash following the tenant prefix (`/api/v1/metrics/{prefix}/`). The workflow appends this automatically.
    - **Approval Gate Timeout**: If the on-call engineer does not respond within `approval_timeout` (default 2 hours), the flow automatically terminates with `behavior: FAIL`, preserving fail-closed safety.
    - **flowctl Authentication Failures**: Ensure `ESTUARY_API_TOKEN` has permission to pull and publish specifications within the specified tenant catalog prefix.

    ## How to extend
    - **Multi-Capture Matrix Inspection**: Wrap the health check and remediation tasks within an `io.kestra.plugin.core.flow.ForEach` loop to monitor and remediate an array of critical CDC pipelines simultaneously.
    - **Automated Downstream Subflow Triggering**: Add an `io.kestra.plugin.core.flow.SubflowExecution` task after the verification step to trigger warehouse dbt transformations only after post-remediation verification succeeds.
    - **Dynamic Incident Ticket Creation**: Integrate Jira Service Management or ServiceNow via HTTP Request before the pause gate to create an incident ticket automatically and populate `change_ticket_id`.

