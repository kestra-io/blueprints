id: kafka-compacted-topic-cleaner-stall-and-dirty-ratio-guard
namespace: company.streaming

description: |
  Audits Apache Kafka compacted topics for log cleaner thread stalls and dirty ratio runaway, evaluates
  differential on-disk byte growth against Kestra KV store baselines, executes guarded dynamic compaction
  tuning behind human approval gates, emits an audit canary, and verifies disk reclamation.

inputs:
  - id: bootstrap_servers
    type: STRING
    displayName: Kafka Bootstrap Servers
    description: Comma-separated list of Kafka broker endpoints (e.g. kafka-broker-1:9092,kafka-broker-2:9092).
    defaults: "localhost:9092"

  - id: topic_name
    type: STRING
    displayName: Compacted Topic Name
    description: Target Kafka topic configured with cleanup.policy=compact (e.g. changelog, CDC, or entity cache).
    defaults: "customer-account-state"

  - id: consumer_group_id
    type: STRING
    displayName: Consumer Group ID
    description: Associated downstream consumer group ID used to evaluate committed offset progression and lag.
    defaults: "account-state-indexer"

  - id: max_growth_rate_pct
    type: INT
    displayName: Max Growth Rate Percentage Threshold
    description: Maximum permissible percentage increase in on-disk byte size between runs before flagging dirty ratio runaway.
    defaults: 25

  - id: max_topic_size_mb
    type: INT
    displayName: Max Topic Size Threshold (MB)
    description: Soft storage headroom ceiling in megabytes beyond which uncompacted dirty segments must be remediated.
    defaults: 10240

  - id: consecutive_bloat_threshold
    type: INT
    displayName: Consecutive Bloat Threshold
    description: Number of consecutive diagnostic runs that log bloat must persist without cleaner compaction before escalating.
    defaults: 2

  - id: target_dirty_ratio
    type: STRING
    displayName: Target Cleanable Dirty Ratio
    description: Aggressive min.cleanable.dirty.ratio applied during remediation to force cleaner thread scheduling.
    defaults: "0.1"

  - id: target_segment_ms
    type: STRING
    displayName: Target Segment Duration (ms)
    description: Topic-level segment.ms applied during remediation to force rolling of active segments into cleanable ones.
    defaults: "3600000"

  - id: auto_remediate
    type: BOOL
    displayName: Auto Remediate
    description: When true and dry_run is false, automatically applies dynamic topic configuration overrides to force compaction.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry Run Mode
    description: When true, simulates diagnostic inspection and plans config changes without altering cluster state.
    defaults: true

  - id: require_human_approval
    type: BOOL
    displayName: Require Human Approval
    description: When true and dry_run is false, pauses workflow execution for SRE confirmation before applying config alterations.
    defaults: true

triggers:
  - id: periodic_compaction_guard
    type: io.kestra.plugin.core.trigger.Schedule
    description: Periodic scheduled audit running every 4 hours to detect uncompacted dirty segment bloat.
    cron: "0 */4 * * *"
    disabled: true

tasks:
  - id: describe_broker_log_dirs
    type: io.kestra.plugin.kafka.DescribeLogDirs
    description: Queries all cluster brokers via Kafka AdminClient to retrieve exact per-partition on-disk byte sizes.
    properties:
      bootstrap.servers: "{{ inputs.bootstrap_servers }}"
      security.protocol: "PLAINTEXT"

  - id: describe_topic_metadata
    type: io.kestra.plugin.kafka.TopicDescribe
    description: Inspects current topic configuration overrides, cleanup.policy, min.cleanable.dirty.ratio, and partition layout.
    properties:
      bootstrap.servers: "{{ inputs.bootstrap_servers }}"
      security.protocol: "PLAINTEXT"
    topic: "{{ inputs.topic_name }}"

  - id: describe_consumer_group
    type: io.kestra.plugin.kafka.ConsumerGroupDescribe
    description: Describes downstream consumer group offsets and high watermarks to evaluate record update throughput.
    properties:
      bootstrap.servers: "{{ inputs.bootstrap_servers }}"
      security.protocol: "PLAINTEXT"
    groupIds:
      - "{{ inputs.consumer_group_id }}"

  - id: get_previous_compaction_state
    type: io.kestra.plugin.core.kv.Get
    description: Retrieves previous run on-disk byte size, record high watermarks, and bloat counters from Kestra KV store.
    key: "kafka_compaction_tracker_{{ inputs.topic_name }}"
    errorOnMissing: false

  - id: triage_compaction_health
    type: io.kestra.plugin.scripts.python.Script
    description: Analyzes log directory byte sizes, evaluates differential growth rates against KV history, and builds a remediation plan.
    containerImage: python:3.11-slim
    outputFiles:
      - "compaction_triage_manifest.json"
    env:
      TOPIC_NAME: "{{ inputs.topic_name }}"
      TOPIC_SIZES: "{{ outputs.describe_broker_log_dirs.topicSizes | toJson }}"
      LOG_DIRS: "{{ outputs.describe_broker_log_dirs.logDirs | toJson }}"
      TOPIC_CONFIGS: "{{ outputs.describe_topic_metadata.configs | toJson }}"
      CONSUMER_GROUPS: "{{ outputs.describe_consumer_group.groups | toJson }}"
      PREVIOUS_STATE: "{{ outputs.get_previous_compaction_state.value ?? '{}' }}"
      MAX_GROWTH_PCT: "{{ inputs.max_growth_rate_pct }}"
      MAX_SIZE_MB: "{{ inputs.max_topic_size_mb }}"
      BLOAT_THRESHOLD: "{{ inputs.consecutive_bloat_threshold }}"
    script: |
      import json
      import os
      from kestra import Kestra

      topic_name = os.environ.get("TOPIC_NAME", "")
      topic_sizes = json.loads(os.environ.get("TOPIC_SIZES") or "{}")
      log_dirs = json.loads(os.environ.get("LOG_DIRS") or "[]")
      topic_configs = json.loads(os.environ.get("TOPIC_CONFIGS") or "{}")
      consumer_groups = json.loads(os.environ.get("CONSUMER_GROUPS") or "[]")
      prev_raw = os.environ.get("PREVIOUS_STATE", "{}")
      prev_state = json.loads(prev_raw) if prev_raw and prev_raw != "{}" else {}

      max_growth_pct = float(os.environ.get("MAX_GROWTH_PCT", 25))
      max_size_mb = float(os.environ.get("MAX_SIZE_MB", 10240))
      bloat_threshold = int(os.environ.get("BLOAT_THRESHOLD", 2))

      # Calculate current total topic byte size
      current_size_bytes = topic_sizes.get(topic_name, 0)
      current_size_mb = current_size_bytes / (1024 * 1024)

      # Per-partition breakdown
      partition_sizes = {}
      for log_dir in log_dirs:
          for part in log_dir.get("partitions", []):
              if part.get("topic") == topic_name:
                  pid = part.get("partition")
                  size = part.get("size", 0)
                  partition_sizes[pid] = partition_sizes.get(pid, 0) + size

      # Calculate consumer group end offsets
      total_end_offset = 0
      total_committed_offset = 0
      for g in consumer_groups:
          for off in g.get("offsets", []):
              if off.get("topic") == topic_name:
                  total_end_offset += off.get("endOffset", 0)
                  total_committed_offset += off.get("currentOffset", 0)

      # Historical diffing against KV store
      prev_size_bytes = prev_state.get("topic_size_bytes", current_size_bytes)
      prev_end_offset = prev_state.get("total_end_offset", total_end_offset)
      prev_bloat_count = prev_state.get("consecutive_bloats", 0)

      growth_rate_pct = 0.0
      if prev_size_bytes > 0:
          growth_rate_pct = round(((current_size_bytes - prev_size_bytes) / prev_size_bytes) * 100, 2)

      record_delta = total_end_offset - prev_end_offset

      cleanup_policy = topic_configs.get("cleanup.policy", "")
      current_dirty_ratio = topic_configs.get("min.cleanable.dirty.ratio", "0.5")
      current_segment_ms = topic_configs.get("segment.ms", "604800000")

      is_compacted = "compact" in cleanup_policy
      size_exceeded = current_size_mb >= max_size_mb
      rapid_growth = growth_rate_pct >= max_growth_pct and record_delta > 0

      if (size_exceeded or rapid_growth) and is_compacted:
          consecutive_bloats = prev_bloat_count + 1
      else:
          consecutive_bloats = 0

      remediation_required = (consecutive_bloats >= bloat_threshold) or (not is_compacted)

      status_label = "HEALTHY"
      if not is_compacted:
          status_label = "CRITICAL_POLICY_MISCONFIGURED"
      elif consecutive_bloats >= bloat_threshold:
          status_label = "WARNING_LOG_CLEANER_STALLED"

      manifest = {
          "topic": topic_name,
          "status": status_label,
          "remediation_required": remediation_required,
          "current_size_bytes": current_size_bytes,
          "current_size_mb": round(current_size_mb, 2),
          "previous_size_bytes": prev_size_bytes,
          "growth_rate_pct": growth_rate_pct,
          "consecutive_bloats": consecutive_bloats,
          "record_delta": record_delta,
          "cleanup_policy": cleanup_policy,
          "current_dirty_ratio": current_dirty_ratio,
          "current_segment_ms": current_segment_ms,
          "partition_sizes_bytes": partition_sizes
      }

      with open("compaction_triage_manifest.json", "w") as f:
          json.dump(manifest, f, indent=2)

      updated_state = {
          "topic_size_bytes": current_size_bytes,
          "total_end_offset": total_end_offset,
          "consecutive_bloats": consecutive_bloats,
          "last_status": status_label
      }

      Kestra.outputs({
          "remediation_required": remediation_required,
          "status": status_label,
          "current_size_mb": round(current_size_mb, 2),
          "growth_rate_pct": growth_rate_pct,
          "consecutive_bloats": consecutive_bloats,
          "cleanup_policy": cleanup_policy,
          "updated_state_json": json.dumps(updated_state)
      })

  - id: persist_compaction_state
    type: io.kestra.plugin.core.kv.Set
    description: Stores the updated on-disk storage baseline and bloat progression counters in Kestra KV store.
    key: "kafka_compaction_tracker_{{ inputs.topic_name }}"
    value: "{{ outputs.triage_compaction_health.vars.updated_state_json }}"

  - id: gate_remediation
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether log cleaner stagnation or dirty ratio runaway mandates administrative intervention.
    condition: "{{ outputs.triage_compaction_health.vars.remediation_required == true }}"
    then:
      - id: dispatch_slack_incident
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches detailed incident triage alert with storage growth and partition metrics to Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: >-
          {{ {
            "attachments": [
              {
                "color": "danger",
                "title": ":warning: Kafka Compacted Topic Cleaner Stall Detected",
                "text": "Topic `" ~ inputs.topic_name ~ "` has uncompacted dirty segment bloat.\n*Status:* `" ~ outputs.triage_compaction_health.vars.status ~ "`\n*Current Size:* " ~ outputs.triage_compaction_health.vars.current_size_mb ~ " MB\n*Growth Rate:* " ~ outputs.triage_compaction_health.vars.growth_rate_pct ~ "%\n*Consecutive Stalls:* " ~ outputs.triage_compaction_health.vars.consecutive_bloats ~ "\n*Cleanup Policy:* `" ~ outputs.triage_compaction_health.vars.cleanup_policy ~ "`\n*Execution ID:* `" ~ execution.id ~ "`"
              }
            ]
          } | toJson }}

      - id: evaluate_live_mutation
        type: io.kestra.plugin.core.flow.If
        description: Determines whether live topic configuration overrides should be applied or bypassed in dry-run mode.
        condition: "{{ inputs.auto_remediate == true and inputs.dry_run == false }}"
        then:
          - id: evaluate_approval_requirement
            type: io.kestra.plugin.core.flow.If
            description: Checks if manual operator confirmation is mandated prior to altering topic configs.
            condition: "{{ inputs.require_human_approval == true }}"
            then:
              - id: pause_for_operator_approval
                type: io.kestra.plugin.core.flow.Pause
                description: Pauses workflow execution for SRE confirmation before applying dynamic compaction tuning.

          - id: tune_compaction_thresholds
            type: io.kestra.plugin.kafka.TopicUpdate
            description: Dynamically lowers min.cleanable.dirty.ratio and segment.ms to force immediate segment rolling and cleaner scheduling.
            properties:
              bootstrap.servers: "{{ inputs.bootstrap_servers }}"
              security.protocol: "PLAINTEXT"
            topic: "{{ inputs.topic_name }}"
            configs:
              cleanup.policy: "compact"
              min.cleanable.dirty.ratio: "{{ inputs.target_dirty_ratio }}"
              segment.ms: "{{ inputs.target_segment_ms }}"
              max.compaction.lag.ms: "86400000"

          - id: emit_compaction_canary
            type: io.kestra.plugin.kafka.Produce
            description: Publishes an audit tombstone sync record with sentinel key to stimulate partition cleaner evaluation.
            properties:
              bootstrap.servers: "{{ inputs.bootstrap_servers }}"
              security.protocol: "PLAINTEXT"
            topic: "{{ inputs.topic_name }}"
            from:
              key: "__kestra_cleaner_canary__"
              value: "{{ {'audit_timestamp': now(), 'execution_id': execution.id, 'action': 'TRIGGER_COMPACTION_ROLL'} | toJson }}"

          - id: verify_topic_configs
            type: io.kestra.plugin.kafka.TopicDescribe
            description: Post-remediation verification re-querying topic metadata to confirm dynamic configuration overrides took effect.
            properties:
              bootstrap.servers: "{{ inputs.bootstrap_servers }}"
              security.protocol: "PLAINTEXT"
            topic: "{{ inputs.topic_name }}"

          - id: assert_compaction_tuned
            type: io.kestra.plugin.core.execution.Assert
            description: Asserts that topic-level min.cleanable.dirty.ratio override matches the target remediation threshold.
            conditions:
              - "{{ outputs.verify_topic_configs.configs['min.cleanable.dirty.ratio'] == inputs.target_dirty_ratio }}"
              - "{{ outputs.verify_topic_configs.configs['cleanup.policy'] == 'compact' }}"
            errorMessage: "Topic configuration overrides failed to apply cleanly to the cluster."

          - id: record_recovery_telemetry
            type: io.kestra.plugin.core.kv.Set
            description: Persists recovery completion manifest in Kestra KV store for compliance and trend tracking.
            key: "kafka_compaction_audit_{{ inputs.topic_name }}"
            value: "{{ {'remediation_execution': execution.id, 'tuned_topic': inputs.topic_name, 'applied_dirty_ratio': inputs.target_dirty_ratio, 'timestamp': now()} | toJson }}"

          - id: notify_slack_recovery
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Dispatches recovery success confirmation to Slack.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: >-
              {{ {
                "attachments": [
                  {
                    "color": "good",
                    "title": ":white_check_mark: Kafka Topic Compaction Thresholds Successfully Tuned",
                    "text": "Compaction tuning applied for topic `" ~ inputs.topic_name ~ "`.\n*Verified min.cleanable.dirty.ratio:* `" ~ outputs.verify_topic_configs.configs['min.cleanable.dirty.ratio'] ~ "`\n*Verified segment.ms:* `" ~ outputs.verify_topic_configs.configs['segment.ms'] ~ "`\n*Canary Status:* Emitted to force segment roll.\n*Execution ID:* `" ~ execution.id ~ "`"
                  }
                ]
              } | toJson }}
        else:
          - id: log_dry_run_simulation
            type: io.kestra.plugin.core.log.Log
            description: Logs planned dynamic configuration overrides when running in simulated dry-run mode.
            message: "DRY-RUN SIMULATION: Stalled compaction detected for {{ inputs.topic_name }}. Planned overrides: min.cleanable.dirty.ratio={{ inputs.target_dirty_ratio }}, segment.ms={{ inputs.target_segment_ms }}. Live updates skipped because dry_run=true or auto_remediate=false."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Records final diagnostic telemetry summary for the execution.
    message: "Completed Kafka compacted topic audit for {{ inputs.topic_name }}. Overall Status: {{ outputs.triage_compaction_health.vars.status }} | Current Size: {{ outputs.triage_compaction_health.vars.current_size_mb }} MB | Growth Rate: {{ outputs.triage_compaction_health.vars.growth_rate_pct }}% | Consecutive Stalls: {{ outputs.triage_compaction_health.vars.consecutive_bloats }}."

errors:
  - id: alert_on_flow_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts on-call engineering if an unhandled failure halts workflow execution.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: >-
      {{ {
        "attachments": [
          {
            "color": "danger",
            "title": ":fire: Kafka Compacted Topic Guard Execution Crash",
            "text": "Workflow `kafka-compacted-topic-cleaner-stall-and-dirty-ratio-guard` crashed during execution `" ~ execution.id ~ "`. Check Kafka broker connectivity or AdminClient credentials."
          }
        ]
      } | toJson }}

extend:
  title: Kafka Compacted Topic Cleaner Stall & Dirty Ratio Runaway Guard
  metaTitle: Kafka Compacted Topic Cleaner Stall & Dirty Ratio Guard | Kestra
  shortDescription: Audit Kafka compacted topic disk bloat, detect stalled log cleaner threads and dirty ratio runaway, dynamically tune compaction configs, and verify reclamation.
  metaDescription: Audit Kafka compacted topics for log cleaner stalls and dirty ratio runaway, dynamically tune compaction thresholds with human approval, and verify recovery.
  description: |
    Apache Kafka topics configured with `cleanup.policy=compact` (or `compact,delete`) are foundational components for CDC change-data capture, event-sourced database backends, and in-memory state store changelogs. Rather than retaining messages purely by age or size, log compaction retains only the most recent record value for each unique message key. Compaction is executed asynchronously by background broker `log.cleaner` threads that scan closed log segments, deduplicate keys, and purge tombstone records.

    In production environments, log compaction frequently stalls or experiences dirty ratio runaway. When producers emit high update volumes or large batch payloads, the uncompacted dirty portion of partition logs expands rapidly. If the dirty ratio remains below broker defaults (`min.cleanable.dirty.ratio: 0.5`), or if active log segments never roll because `segment.ms` or `segment.bytes` thresholds are too high, cleaner threads will never schedule those segments for cleaning. Even worse, if cleaner threads experience thread death or deadlock, uncompacted log segments accumulate unchecked across broker disks, threatening broker storage watermark exhaustion and cluster-wide read-only throttling.

    This blueprint implements an automated Day 2 operational guard that continuously inspects broker log directories, correlates on-disk byte growth against consumer offset throughput and Kestra KV store history, isolates log cleaner stalls, executes guarded dynamic topic configuration tuning (`min.cleanable.dirty.ratio`, `segment.ms`, `max.compaction.lag.ms`) behind human approval gates, emits an audit canary record, and verifies post-remediation configuration convergence.

    ## How it works

    1. The `describe_broker_log_dirs` task queries all cluster brokers via `io.kestra.plugin.kafka.DescribeLogDirs` to fetch exact per-partition physical on-disk byte footprints.
    2. The `describe_topic_metadata` task invokes `io.kestra.plugin.kafka.TopicDescribe` to retrieve effective topic configurations, including `cleanup.policy`, `min.cleanable.dirty.ratio`, `segment.ms`, and `delete.retention.ms`.
    3. The `describe_consumer_group` task retrieves partition high watermarks and committed offsets via `io.kestra.plugin.kafka.ConsumerGroupDescribe` to evaluate producer write volume and consumer lag.
    4. The `get_previous_compaction_state` task retrieves historical storage baselines, record progression deltas, and consecutive bloat counters from the Kestra Key-Value store under key `kafka_compaction_tracker_{topic}`.
    5. The `triage_compaction_health` task (`io.kestra.plugin.scripts.python.Script`) analyzes the diagnostic payloads:
       - Computes the differential storage growth rate percentage across runs.
       - Correlates byte growth with record key updates: if topic storage continues to grow across consecutive runs without cleaner compaction, or exceeds `max_topic_size_mb`, a log cleaner stall is diagnosed.
       - Validates that `cleanup.policy` correctly includes `compact` to catch misconfigured topics.
       - Formulates a structured remediation plan (`compaction_triage_manifest.json`), assigns operational status (`HEALTHY`, `WARNING_LOG_CLEANER_STALLED`, or `CRITICAL_POLICY_MISCONFIGURED`), and updates state tracking.
    6. The `persist_compaction_state` task (`io.kestra.plugin.core.kv.Set`) stores the updated storage baseline and bloat progression counters back into Kestra KV.
    7. When remediation is required, `dispatch_slack_incident` delivers an actionable triage alert to Slack detailing current topic size, growth rate, and consecutive stall counts.
    8. In live mode (`auto_remediate: true` and `dry_run: false`), if `require_human_approval` is enabled, `pause_for_operator_approval` (`io.kestra.plugin.core.flow.Pause`) halts execution for SRE confirmation.
    9. Upon approval, `tune_compaction_thresholds` (`io.kestra.plugin.kafka.TopicUpdate`) dynamically overrides topic configuration parameters:
       - Lowers `min.cleanable.dirty.ratio` to `0.1` (or user target) to force cleaner thread scheduling.
       - Lowers `segment.ms` to force active log segments to roll into cleanable closed segments.
       - Lowers `max.compaction.lag.ms` to force compaction of delayed messages.
    10. The `emit_compaction_canary` task publishes an auditable sync message to the topic via `io.kestra.plugin.kafka.Produce`, and `verify_topic_configs` asserts that configuration overrides were successfully applied to the cluster, notifying Slack of recovery.

    ## What you get

    - Automated continuous observability into Kafka compacted topic disk bloat and cleaner thread performance.
    - Historical trend analysis in Kestra KV store distinguishing benign append-only traffic from uncompacted key-update bloat.
    - Non-disruptive dynamic configuration tuning (`min.cleanable.dirty.ratio`, `segment.ms`) forcing broker cleaner threads to act without cluster restarts.
    - Human approval gates and dry-run simulation modes protecting production broker stability.
    - Post-remediation verification assertions ensuring dynamic topic overrides were committed by the cluster controller.
    - Complete recovery audit records stored in Kestra namespace KV store for compliance and capacity planning.

    ## Who it's for

    - Streaming Data Platform Engineers managing stateful Kafka topics, Kafka Streams changelogs, or Debezium CDC pipelines.
    - Site Reliability Engineers (SREs) triaging broker disk watermark alarms (`log.dirs` disk full) caused by uncompacted topics.
    - Data Engineers relying on compacted lookup tables and caches for real-time stream enrichment.

    ## Why orchestrate this with Kestra

    Kafka brokers manage log cleaning internally, but expose no native self-healing or cross-run trend analysis when cleaner threads stall or dirty ratios fail to trigger compaction. Shell scripts running on cron lack persistent state tracking across runs, require manual credential management, and cannot coordinate operator approval gates.

    Orchestrating this guard with Kestra delivers a declarative workflow with native Kafka AdminClient plugin tasks, atomic state tracking in Kestra KV store, built-in pause-and-resume approval gates, credential encryption, and real-time multi-channel incident notifications.

    ## Prerequisites

    - Reachable Apache Kafka cluster (version 2.4+ or 3.x) accessible over plaintext or SASL/SSL from the Kestra worker.
    - A target compacted topic configured with message keys.
    - Kafka AdminClient permissions: `DESCRIBE_CONFIGS`, `ALTER_CONFIGS`, `DESCRIBE_CLUSTER`, and `WRITE`.
    - A Slack Incoming Webhook URL for incident and recovery notifications.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL used for incident alerts and recovery summaries.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this blueprint and set `bootstrap_servers`, `topic_name`, and `consumer_group_id` to match your Kafka environment.
    3. Run a manual execution with default parameters (`dry_run: true`) to record an initial storage baseline and review diagnostic reports.
    4. Verify the generated `compaction_triage_manifest.json` artifact in the execution output tab.
    5. Enable the `periodic_compaction_guard` schedule trigger to monitor topic compaction health continuously every 4 hours.

    ## How to extend

    - **Disk Watermark Correlation**: Query Prometheus metrics (`kafka_log_Log_Size` and `jvm_memory_bytes_used`) via `io.kestra.plugin.prometheus.Query` to trigger compaction tuning automatically when broker disk headroom dips below 15%.
    - **Multi-Topic Fleet Sweep**: Wrap the diagnostic inspection in `io.kestra.plugin.core.flow.Loop` over a list of critical compacted topics or CDC streams.
    - **PagerDuty Escalation**: Route `CRITICAL_POLICY_MISCONFIGURED` alerts to PagerDuty via `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert` for 24/7 on-call paging.

    ## Links

    - [Apache Kafka Log Compaction Architecture](https://kafka.apache.org/documentation/#compaction)
    - [Kestra Kafka Plugin Documentation](https://kestra.io/plugins/plugin-kafka)
    - [Kestra Key-Value Store Documentation](https://kestra.io/plugins/core/tasks/kv/io.kestra.plugin.core.kv.set)
    - [Kestra Slack Notifications Plugin](https://kestra.io/plugins/plugin-slack)

  tags:
    - Data
    - Infrastructure
  subTags:
    - Realtime & Streaming
    - Monitoring & Alerting
  ee: false
  demo: false
