id: usdm-county-drought-escalation-ag-portfolio
namespace: company.team

description: |
  Weekly drought check for an agricultural loan or crop-insurance book. After the U.S. Drought Monitor
  publishes its Thursday map, the flow pulls county drought statistics for every county in the book in one
  request, computes the drought category, D2+ coverage and the Drought Severity and Coverage Index (DSCI)
  week over week, and posts escalations, relief and the exposure in severe drought to Slack once per map.

inputs:
  - id: loan_book
    type: JSON
    displayName: Loan book by county
    description: >-
      One object per county exposure: `fips` (5-digit county FIPS; numbers like 6019 are padded to 06019),
      `borrower` and `exposure_usd`. The default borrowers and amounts are sample data; drought statistics
      come from the live USDM API.
    defaults: |
      [
        {"fips": "29209", "borrower": "Table Rock Cattle Co.", "exposure_usd": 2400000},
        {"fips": "29167", "borrower": "Polk County Dairy LLC", "exposure_usd": 1800000},
        {"fips": "40089", "borrower": "McCurtain Timber & Hay", "exposure_usd": 950000},
        {"fips": "48071", "borrower": "Chambers Rice Growers", "exposure_usd": 3100000},
        {"fips": "48497", "borrower": "Wise County Ranch Partners", "exposure_usd": 1250000},
        {"fips": "20055", "borrower": "Finney Wheat Cooperative", "exposure_usd": 4200000},
        {"fips": "06019", "borrower": "Fresno Almond Holdings", "exposure_usd": 5600000},
        {"fips": "19169", "borrower": "Story Corn & Soy", "exposure_usd": 2750000},
        {"fips": "17113", "borrower": "McLean Grain Farms", "exposure_usd": 3300000}
      ]

  - id: severe_threshold_pct
    type: FLOAT
    displayName: Severe drought threshold (% of county area in D2+)
    description: A county counts as in severe drought when at least this share of its area is D2 (severe) or worse. Crossing it either way alerts.
    defaults: 50

  - id: dsci_rise
    type: INT
    displayName: DSCI week-over-week rise that alerts
    description: DSCI runs from 0 (no drought) to 500 (all of the county in D4). A rise of this many points in one week alerts even if no threshold was crossed.
    defaults: 50

  - id: state_key
    type: STRING
    displayName: KV state key
    description: Holds the last USDM map date already reported, so each weekly map alerts once. Use one key per loan book.
    defaults: usdm_ag_portfolio_last_map

triggers:
  - id: thursday_after_release
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 15 * * 4"
    description: The map is released on Thursdays at 8:30 a.m. Eastern (statistics valid from the Tuesday before); 15:00 UTC leaves margin for late updates.

tasks:
  - id: normalise_book
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Pads FIPS codes to five digits (JSON numbers drop the leading zero, and the API silently returns nothing for 4-digit codes), drops invalid and duplicate rows, and builds the comma-separated `aoi` list for one batch request.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      book.json: "{{ inputs.loan_book | toJson }}"
    outputFiles:
      - book_parquet
    sql: |
      CREATE TABLE raw AS
      SELECT row_number() OVER () AS ord, regexp_replace(trim(CAST(b->>'$.fips' AS VARCHAR)), '\.0+$', '') AS fips_in,
             coalesce(b->>'$.borrower', 'unnamed') AS borrower, coalesce(TRY_CAST(b->>'$.exposure_usd' AS DOUBLE), 0) AS exposure_usd
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS b FROM read_text('book.json'));
      CREATE TABLE book AS
      SELECT *, CASE WHEN regexp_full_match(fips_in, '[0-9]{4,5}') THEN lpad(fips_in, 5, '0') END AS fips FROM raw;
      COPY (SELECT ord, fips, borrower, exposure_usd FROM book WHERE fips IS NOT NULL ORDER BY ord)
        TO '{{ outputFiles.book_parquet }}' (FORMAT PARQUET);
      SELECT count(*) FILTER (WHERE fips IS NOT NULL) AS valid_rows,
             coalesce(string_agg(borrower || ' (' || coalesce(fips_in, 'no fips') || ')', ', ') FILTER (WHERE fips IS NULL), '') AS invalid_rows,
             coalesce(string_agg(DISTINCT fips, ','), '') AS aoi
      FROM book;

  - id: require_counties
    type: io.kestra.plugin.core.execution.Fail
    runIf: "{{ outputs.normalise_book.outputs[0].row.valid_rows == 0 }}"
    errorMessage: "No valid county FIPS in the loan book. Invalid rows: {{ outputs.normalise_book.outputs[0].row.invalid_rows }}"

  - id: fetch_usdm
    type: io.kestra.plugin.core.http.Download
    description: |
      County statistics as percent of area, `statisticsType=1` (cumulative: D1 includes D2-D4, so D2 is the
      D2+ share). One request for all counties; 36 days returns at least the last five weekly maps. The API
      returns JSON with `Accept: application/json` and drops unknown FIPS without an error.
    uri: https://usdmdataservices.unl.edu/api/CountyStatistics/GetDroughtSeverityStatisticsByAreaPercent
    params:
      aoi: "{{ outputs.normalise_book.outputs[0].row.aoi }}"
      startdate: "{{ now() | dateAdd(-36, 'DAYS') | date('yyyy-MM-dd') }}"
      enddate: "{{ now() | date('yyyy-MM-dd') }}"
      statisticsType: "1"
    headers:
      Accept: application/json
      User-Agent: kestra-usdm-county-drought-escalation/1.0 (https://kestra.io)
    retry:
      type: exponential
      interval: PT30S
      maxInterval: PT5M
      maxAttempts: 4

  - id: previous_map
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false
    description: Last map date already reported. Missing on the first run (BASELINE), which reports the latest map as-is.

  - id: evaluate
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Compares the latest map with the previous week and with four weeks earlier. The category is the worst
      level covering at least half the county. DSCI = D0 + D1 + D2 + D3 + D4 of the cumulative percentages.
      Escalation = worse category, D2+ crossing the threshold upward, first D3 or D4 area, or a DSCI jump;
      relief = better category or D2+ falling below the threshold.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      book.parquet: "{{ outputs.normalise_book.outputFiles.book_parquet }}"
      usdm.json: "{{ outputs.fetch_usdm.uri }}"
    outputFiles:
      - drought_csv
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE book AS SELECT * FROM read_parquet('book.parquet');
      CREATE TABLE s AS
      SELECT CAST(x->>'$.fips' AS VARCHAR) AS fips, x->>'$.county' AS county, x->>'$.state' AS state,
             CAST(left(x->>'$.mapDate', 10) AS DATE) AS map_date,
             CAST(x->>'$.d0' AS DOUBLE) AS d0, CAST(x->>'$.d1' AS DOUBLE) AS d1, CAST(x->>'$.d2' AS DOUBLE) AS d2,
             CAST(x->>'$.d3' AS DOUBLE) AS d3, CAST(x->>'$.d4' AS DOUBLE) AS d4
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS x FROM read_text('usdm.json'));
      CREATE TABLE w AS
      SELECT *, round(d0 + d1 + d2 + d3 + d4) AS dsci,
             CASE WHEN d4 >= 50 THEN 5 WHEN d3 >= 50 THEN 4 WHEN d2 >= 50 THEN 3 WHEN d1 >= 50 THEN 2 WHEN d0 >= 50 THEN 1 ELSE 0 END AS lvl,
             dense_rank() OVER (ORDER BY map_date DESC) AS wk
      FROM s;
      CREATE TABLE c AS
      SELECT b.ord, b.fips, b.borrower, b.exposure_usd, n.county, n.state, n.map_date,
             n.d2, n.d3, n.d4, n.dsci, n.lvl, p.d2 AS prev_d2, p.d3 AS prev_d3, p.d4 AS prev_d4, p.dsci AS prev_dsci, p.lvl AS prev_lvl,
             f.dsci AS dsci_4w_ago
      FROM book b
      LEFT JOIN w n ON n.fips = b.fips AND n.wk = 1
      LEFT JOIN w p ON p.fips = b.fips AND p.wk = 2
      LEFT JOIN w f ON f.fips = b.fips AND f.wk = 5;
      CREATE TABLE r AS
      SELECT *, ['None', 'D0', 'D1', 'D2', 'D3', 'D4'][lvl + 1] AS category, ['None', 'D0', 'D1', 'D2', 'D3', 'D4'][prev_lvl + 1] AS prev_category,
             concat_ws('; ',
               CASE WHEN lvl > prev_lvl THEN 'category worsened' END,
               CASE WHEN d2 >= {{ inputs.severe_threshold_pct }} AND prev_d2 < {{ inputs.severe_threshold_pct }} THEN 'entered severe drought' END,
               CASE WHEN d4 > 0 AND prev_d4 = 0 THEN 'first D4 area' WHEN d3 > 0 AND prev_d3 = 0 THEN 'first D3 area' END,
               CASE WHEN dsci - prev_dsci >= {{ inputs.dsci_rise }} THEN 'DSCI +' || CAST(CAST(dsci - prev_dsci AS INT) AS VARCHAR) END) AS escalation,
             concat_ws('; ',
               CASE WHEN lvl < prev_lvl THEN 'category improved' END,
               CASE WHEN d2 < {{ inputs.severe_threshold_pct }} AND prev_d2 >= {{ inputs.severe_threshold_pct }} THEN 'left severe drought' END) AS relief
      FROM c WHERE county IS NOT NULL;
      COPY (
        SELECT fips, county, state, borrower, exposure_usd, map_date, category, prev_category, d2 AS d2_plus_pct, prev_d2 AS prev_d2_plus_pct,
               d3 AS d3_plus_pct, d4 AS d4_pct, dsci, prev_dsci, dsci_4w_ago, nullif(escalation, '') AS escalation, nullif(relief, '') AS relief
        FROM r ORDER BY ord
      ) TO '{{ outputFiles.drought_csv }}' (HEADER, DELIMITER ',');
      SELECT CAST(max(map_date) AS VARCHAR) AS map_date, CAST(strftime(max(map_date), '%Y%m%d') AS BIGINT) AS map_int, count(*) AS counties,
             (SELECT count(*) FROM c WHERE county IS NULL) AS not_found_count,
             coalesce((SELECT string_agg(borrower || ' (' || fips || ')', ', ') FROM c WHERE county IS NULL), '') AS not_found,
             count(*) FILTER (WHERE escalation <> '') AS escalations, count(*) FILTER (WHERE relief <> '') AS reliefs,
             count(*) FILTER (WHERE d2 >= {{ inputs.severe_threshold_pct }}) AS severe_counties,
             CAST(coalesce(sum(exposure_usd) FILTER (WHERE d2 >= {{ inputs.severe_threshold_pct }}), 0) AS BIGINT) AS severe_exposure_usd,
             CAST(coalesce(sum(exposure_usd) FILTER (WHERE prev_d2 >= {{ inputs.severe_threshold_pct }}), 0) AS BIGINT) AS prev_severe_exposure_usd,
             round(100 * coalesce(sum(exposure_usd) FILTER (WHERE d2 >= {{ inputs.severe_threshold_pct }}), 0) / nullif(sum(exposure_usd), 0), 1) AS severe_share_pct,
             coalesce(CAST(to_json(list(json_object('county', county || ', ' || state, 'borrower', borrower, 'exposure', CAST(exposure_usd AS BIGINT),
               'cat', category, 'prev_cat', prev_category, 'd2', d2, 'prev_d2', prev_d2, 'd4', d4, 'dsci', CAST(dsci AS INT),
               'prev_dsci', CAST(prev_dsci AS INT), 'dsci_4w', CAST(dsci_4w_ago AS INT), 'why', CASE WHEN escalation <> '' THEN escalation ELSE relief END,
               'up', escalation <> '') ORDER BY escalation = '', exposure_usd DESC) FILTER (WHERE escalation <> '' OR relief <> '')) AS VARCHAR), '[]') AS changes
      FROM r;

  - id: on_new_map
    type: io.kestra.plugin.core.flow.If
    description: The USDM publishes one map a week, so a re-run in the same week (or a late Thursday retry) reports nothing new.
    condition: "{{ outputs.evaluate.outputs[0].row.map_int > (outputs.previous_map.value ?? 0) }}"
    then:
      - id: compose
        type: io.kestra.plugin.core.debug.Return
        format: |-
          *U.S. Drought Monitor, map of {{ outputs.evaluate.outputs[0].row.map_date }}*{{ (outputs.previous_map.value ?? 0) == 0 ? ' (baseline)' : '' }}: {{ outputs.evaluate.outputs[0].row.escalations }} escalation(s), {{ outputs.evaluate.outputs[0].row.reliefs }} relief.
          {% for c in fromJson(outputs.evaluate.outputs[0].row.changes) %}{{ c.up ? ':warning:' : ':white_check_mark:' }} *{{ c.county }}* ({{ c.borrower }}, ${{ c.exposure | numberFormat('#,##0') }}): {{ c.prev_cat }} -> *{{ c.cat }}*, D2+ {{ c.prev_d2 }}% -> {{ c.d2 }}%{% if c.d4 > 0 %}, D4 {{ c.d4 }}%{% endif %}, DSCI {{ c.prev_dsci }} -> {{ c.dsci }} (4 weeks ago {{ c.dsci_4w ?? 'n/a' }}). {{ c.why }}.
          {% endfor %}Exposure in severe drought (D2+ >= {{ inputs.severe_threshold_pct }}% of area): ${{ outputs.evaluate.outputs[0].row.severe_exposure_usd | numberFormat('#,##0') }} in {{ outputs.evaluate.outputs[0].row.severe_counties }} counties ({{ outputs.evaluate.outputs[0].row.severe_share_pct }}% of mapped exposure), last week ${{ outputs.evaluate.outputs[0].row.prev_severe_exposure_usd | numberFormat('#,##0') }}.
      - id: alert_if_changed
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.evaluate.outputs[0].row.escalations + outputs.evaluate.outputs[0].row.reliefs > 0 }}"
        then:
          - id: slack
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            allowFailure: true
            description: allowFailure keeps the run green when `SLACK_WEBHOOK_URL` is not set; the message is still logged and the CSV written.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            messageText: "{{ outputs.compose.value }}"
          - id: log_alert
            type: io.kestra.plugin.core.log.Log
            level: WARN
            message: "{{ outputs.compose.value }}"
        else:
          - id: log_quiet_week
            type: io.kestra.plugin.core.log.Log
            message: "{{ outputs.compose.value }}"
      - id: save_map_date
        type: io.kestra.plugin.core.kv.Set
        key: "{{ inputs.state_key }}"
        value: "{{ outputs.evaluate.outputs[0].row.map_int }}"
    else:
      - id: log_already_reported
        type: io.kestra.plugin.core.log.Log
        message: "Map of {{ outputs.evaluate.outputs[0].row.map_date }} was already reported; nothing new."

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      Map {{ outputs.evaluate.outputs[0].row.map_date }}: {{ outputs.evaluate.outputs[0].row.counties }} counties,
      {{ outputs.evaluate.outputs[0].row.escalations }} escalations, {{ outputs.evaluate.outputs[0].row.reliefs }} relief,
      {{ outputs.evaluate.outputs[0].row.severe_counties }} in severe drought ({{ outputs.evaluate.outputs[0].row.severe_share_pct }}% of exposure).
      {% if outputs.evaluate.outputs[0].row.not_found_count > 0 %}Not returned by USDM: {{ outputs.evaluate.outputs[0].row.not_found }}.{% endif %}
      {% if outputs.normalise_book.outputs[0].row.invalid_rows != '' %}Invalid rows skipped: {{ outputs.normalise_book.outputs[0].row.invalid_rows }}.{% endif %}

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.evaluate.outputs[0].row | toJson }}"
  - id: drought_csv
    type: FILE
    value: "{{ outputs.evaluate.outputFiles.drought_csv }}"

extend:
  title: U.S. Drought Monitor County Escalation Alert for an Agricultural Loan Book
  metaTitle: USDM County Drought Escalation Alert for Ag Portfolios with DuckDB | Kestra
  shortDescription: Every Thursday after the U.S. Drought Monitor release, pull county drought statistics for every county in an ag loan or crop-insurance book in one request, detect escalations and relief week over week, and post the exposure in severe drought to Slack once per map.
  metaDescription: Weekly U.S. Drought Monitor check for an ag loan book. Detects county drought escalation and relief, sums exposure in D2+ and alerts Slack once per map.
  description: |
    Ag lenders and crop insurers check the U.S. Drought Monitor (USDM) every Thursday for borrowers moving into severe drought. This flow automates that check by county: one request to the USDM data services API returns the last five weekly maps for every county in the book, DuckDB compares the latest map with the week before, and Slack gets one message per new map listing escalations, relief and the exposure in severe drought. The default borrowers and exposure amounts are sample data; the drought statistics come from the live USDM API.

    ## How it works

    1. A `Schedule` trigger runs on Thursdays at 15:00 UTC, after the 8:30 a.m. Eastern map release.
    2. `normalise_book` (DuckDB) pads FIPS codes to five digits (a JSON number like `6019` loses its leading zero, and the API returns nothing for 4-digit codes), skips invalid rows with a reason and builds one comma-separated `aoi` list. `require_counties` fails the run if no row is valid.
    3. `fetch_usdm` makes one request to `CountyStatistics/GetDroughtSeverityStatisticsByAreaPercent` with `statisticsType=1` (cumulative: D2 is the share of the county in D2 or worse) over the last 36 days, as JSON.
    4. `evaluate` (DuckDB) computes per county the category (worst level covering at least half the area), the D2+ share and the Drought Severity and Coverage Index (DSCI, 0 to 500) for this week, last week and four weeks ago. Escalation means a worse category, D2+ crossing `severe_threshold_pct` upward, the first D3 or D4 area, or a DSCI rise of `dsci_rise` points. Relief means a better category or D2+ falling back below the threshold. Unknown FIPS codes, which the API drops silently, are listed.
    5. `on_new_map` (If) compares the map date with the one in KV, so a re-run in the same week reports nothing. On a new map a nested `If` posts the escalations and relief to Slack (or logs a quiet week), then `save_map_date` stores the map date. The first run is the BASELINE and reports the latest map against the week before.

    ## What you get

    - One Slack message per map with each changed county, borrower, exposure, category, D2+ share, DSCI trend and reason.
    - Total exposure in severe drought this week and last week, and its share of the mapped book.
    - A per-county CSV and a JSON summary as flow outputs.

    ## Who it's for

    - Agricultural lenders, Farm Credit associations and community banks with farm loan books.
    - Crop insurance, reinsurance and ag commodity risk analysts.

    ## Why orchestrate this with Kestra

    - The loan book and thresholds are inputs, so each portfolio is a different set of inputs, not a code change.
    - KV state keeps the weekly alert to one message per map even when the run is retried or re-run; HTTP retries cover API outages.

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB and Slack plugins.
    - Outbound HTTPS to `usdmdataservices.unl.edu`. No API key is needed.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the weekly alert (optional; without it the Slack task warns and the alert is still logged at WARN level).

    ## Quick start

    1. Import the flow and click **Execute**. The first run is the baseline and reports the latest map.
    2. Execute again: `Map of ... was already reported; nothing new.`
    3. Replace `loan_book` with your counties and exposures, add `SLACK_WEBHOOK_URL` and enable the schedule.

    ## How to extend

    - Weight exposure by crop or acreage, or add USDM area statistics in square miles.
    - Load the CSV into your warehouse to track drought exposure for credit reviews.

    ## Links

    - [U.S. Drought Monitor data services](https://droughtmonitor.unl.edu/DmData/DataDownload/WebServiceInfo.aspx)
    - [Drought Severity and Coverage Index](https://droughtmonitor.unl.edu/About/AbouttheData/DSCI.aspx)
    - [DuckDB Queries task](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [If task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if)
    - [Slack incoming webhook task](https://kestra.io/plugins/plugin-slack/slack-notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
