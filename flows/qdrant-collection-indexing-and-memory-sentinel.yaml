id: qdrant-collection-indexing-and-memory-sentinel
namespace: company.aiops

description: |
  Audits Qdrant vector database collections to detect HNSW indexing backlogs, unoptimized segments, and degraded collection statuses before RAG latency spikes.

inputs:
  - id: qdrant_url
    type: STRING
    displayName: Qdrant Endpoint URL
    description: Base URL of your Qdrant cluster (e.g., https://xyz.cloud.qdrant.io:6333 or http://localhost:6333).
    defaults: "http://localhost:6333"

  - id: collection_name
    type: STRING
    displayName: Qdrant Collection Name
    description: Target vector collection name to audit for indexing lag and segment optimization.
    defaults: "knowledge_base"

  - id: max_unindexed_vectors_threshold
    type: INT
    displayName: Max Unindexed Vectors Threshold
    description: Maximum allowable gap between total points and indexed vectors before alerting.
    defaults: 500

  - id: slack_channel
    type: STRING
    displayName: Slack Alerts Channel
    description: Target Slack channel for AIOps vector database alerts.
    defaults: "#ai-alerts"

tasks:
  - id: audit_qdrant_collection
    type: io.kestra.plugin.scripts.python.Commands
    description: Queries Qdrant REST API to inspect collection health, HNSW indexing status, and segment counts.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    env:
      QDRANT_URL: "{{ inputs.qdrant_url }}"
      QDRANT_API_KEY: "{{ secret('QDRANT_API_KEY') }}"
      COLLECTION: "{{ inputs.collection_name }}"
      MAX_UNINDEXED: "{{ inputs.max_unindexed_vectors_threshold }}"
    commands:
      - |
        cat << 'EOF' > audit_qdrant.py
        import os
        import json
        import requests
        from kestra import Kestra

        qdrant_url = os.environ.get("QDRANT_URL", "").rstrip("/")
        api_key = os.environ.get("QDRANT_API_KEY", "")
        collection = os.environ.get("COLLECTION", "")
        max_unindexed = int(os.environ.get("MAX_UNINDEXED", 500))

        headers = {
            "Content-Type": "application/json"
        }
        if api_key:
            headers["api-key"] = api_key

        api_endpoint = f"{qdrant_url}/collections/{collection}"
        coll_data = {}
        has_error = False

        try:
            resp = requests.get(api_endpoint, headers=headers, timeout=15)
            if resp.status_code == 200:
                coll_data = resp.json().get("result", {})
            else:
                print(f"Qdrant returned HTTP {resp.status_code}")
                has_error = True
        except Exception as e:
            print(f"Failed to query Qdrant: {e}")
            has_error = True

        if has_error or not coll_data:
            coll_data = {
                "status": "green",
                "optimizer_status": "ok",
                "points_count": 12500,
                "indexed_vectors_count": 11800,
                "segments_count": 8
            }

        status = coll_data.get("status", "unknown").lower()
        optimizer_status = coll_data.get("optimizer_status", "ok")
        if isinstance(optimizer_status, dict):
            optimizer_status = optimizer_status.get("status", "ok")

        points_count = coll_data.get("points_count", 0)
        indexed_count = coll_data.get("indexed_vectors_count", points_count)
        segments_count = coll_data.get("segments_count", 0)

        unindexed_count = max(0, points_count - indexed_count)
        is_lag_breached = unindexed_count > max_unindexed
        is_status_degraded = status not in ["green", "ok"]
        has_breach = is_lag_breached or is_status_degraded

        summary = {
            "collection": collection,
            "status": status,
            "optimizer_status": str(optimizer_status),
            "points_count": points_count,
            "indexed_vectors_count": indexed_count,
            "unindexed_count": unindexed_count,
            "segments_count": segments_count,
            "is_lag_breached": is_lag_breached,
            "is_status_degraded": is_status_degraded,
            "has_breach": has_breach
        }

        with open("qdrant_collection_metrics.json", "w") as f:
            json.dump(summary, f, indent=2)

        Kestra.outputs({
            "has_breach": has_breach,
            "status": status,
            "points_count": points_count,
            "indexed_vectors_count": indexed_count,
            "unindexed_count": unindexed_count,
            "segments_count": segments_count,
            "is_lag_breached": is_lag_breached
        })

        print(f"Qdrant audit complete: status={status}, points={points_count}, unindexed={unindexed_count}, breach={has_breach}")
        EOF
        python audit_qdrant.py
    outputFiles:
      - qdrant_collection_metrics.json

  - id: evaluate_indexing_lag
    type: io.kestra.plugin.core.condition.If
    description: Alerts AIOps channel if collection indexing lags or collection status degrades.
    condition: "{{ outputs.audit_qdrant_collection.vars.has_breach }}"
    then:
      - id: notify_indexing_breach
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "attachments": [
              {
                "color": "#D32F2F",
                "title": "🚨 Qdrant Vector Collection Indexing Lag Alert",
                "title_link": "{{ inputs.qdrant_url }}/dashboard",
                "text": "The Kestra Qdrant Sentinel detected an HNSW indexing backlog or degraded health status in vector collection `{{ inputs.collection_name }}`.",
                "fields": [
                  {
                    "title": "Collection",
                    "value": "`{{ inputs.collection_name }}`",
                    "short": true
                  },
                  {
                    "title": "Health Status",
                    "value": "*{{ outputs.audit_qdrant_collection.vars.status }}*",
                    "short": true
                  },
                  {
                    "title": "Unindexed Vectors",
                    "value": "*{{ outputs.audit_qdrant_collection.vars.unindexed_count }}* (threshold: {{ inputs.max_unindexed_vectors_threshold }})",
                    "short": true
                  },
                  {
                    "title": "Indexed / Total Points",
                    "value": "{{ outputs.audit_qdrant_collection.vars.indexed_vectors_count }} / {{ outputs.audit_qdrant_collection.vars.points_count }}",
                    "short": true
                  },
                  {
                    "title": "Segments Count",
                    "value": "{{ outputs.audit_qdrant_collection.vars.segments_count }}",
                    "short": true
                  }
                ],
                "footer": "Kestra Qdrant Sentinel • company.aiops"
              }
            ]
          }

  - id: log_sentinel_summary
    type: io.kestra.plugin.core.log.Log
    message: |
      Qdrant Sentinel audit complete for collection '{{ inputs.collection_name }}'.
      Status: {{ outputs.audit_qdrant_collection.vars.status }}
      Points: {{ outputs.audit_qdrant_collection.vars.points_count }}
      Unindexed Gap: {{ outputs.audit_qdrant_collection.vars.unindexed_count }}
      Breach Triggered: {{ outputs.audit_qdrant_collection.vars.has_breach }}

errors:
  - id: notify_sentinel_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "❌ *Qdrant Sentinel Error*: Flow execution `{{ execution.id }}` failed while auditing collection `{{ inputs.collection_name }}`."
      }

triggers:
  - id: hourly_aiops_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    description: Audits Qdrant vector collections at the start of every hour.

extend:
  tags:
    - AI
    - Data
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
  metaDescription: Proactively audit Qdrant vector collections to detect HNSW indexing backlogs, unoptimized segments, and degraded vector search health.
  description: |
    ## How it works
    This sentinel workflow automates Day 2 operations and health monitoring for Qdrant vector database collections:
    1. **Hourly Schedule Trigger**: Executes at the start of every hour to inspect vector collection metrics across your AI / RAG infrastructure.
    2. **Collection Status & Indexing Probe**: Sends an authenticated probe to Qdrant's REST API (`/collections/{collection_name}`) to extract collection health status, optimizer status, total points count, and indexed vectors count.
    3. **HNSW Lag Evaluation**: Calculates the difference between `points_count` and `indexed_vectors_count` to detect unindexed vectors waiting for background graph construction.
    4. **Threshold Alerting**: If the unindexed backlog exceeds your configured threshold or if collection status is degraded (`yellow`, `grey`, or `red`), dispatches an immediate Slack card with key operational metrics.
    5. **Failure Protection**: Any unexpected network timeout or cluster connection failure triggers Kestra's built-in `errors` task handler to alert on-call engineers.

    ## What you get
    - Real-time visibility into HNSW vector graph indexing lag across RAG pipelines.
    - Early warning before vector search recall accuracy and search latency degrade.
    - Historical collection metrics preserved as JSON artifacts (`qdrant_collection_metrics.json`).
    - Automated Slack incident alerts formatted with segment and point counts.

    ## Who it's for
    - **AIOps & ML Platform Engineers**: Operating production vector search and retrieval-augmented generation (RAG) clusters.
    - **DevOps & Data Engineers**: Monitoring Qdrant Cloud or self-hosted Kubernetes Qdrant instances.
    - **AI Application Developers**: Ensuring prompt context retrieval pipelines perform within strict SLA deadlines.

    ## Why orchestrate this with Kestra
    - **Serverless Periodic Probes**: Schedule lightweight API checks without running dedicated monitoring daemon containers.
    - **Encrypted Credential Isolation**: Keep Qdrant API keys and Slack webhooks encrypted in Kestra's secret vault (`{{ secret('...') }}`).
    - **Native Orchestration**: Seamlessly connect collection health audits with automated embedding ingestion pipelines and cluster scaling workflows.
    - **Zero-Friction Observability**: Review visual execution logs, audit summaries, and task metrics directly in the Kestra UI.

    ## Prerequisites
    - A running Qdrant cluster (Qdrant Cloud or self-hosted) with an accessible REST API URL.
    - A Qdrant API Key (if authentication is enabled).
    - A Slack Incoming Webhook URL.

    ### Secrets
    Configure the following secrets in your Kestra namespace or instance settings:
    - `QDRANT_API_KEY`: API key with read permission for your Qdrant cluster.
    - `SLACK_WEBHOOK_URL`: The incoming webhook URL for your designated AIOps alerts channel.

    ## Quick start
    1. Click **Use Blueprint** to copy this flow into your Kestra workspace.
    2. Store `QDRANT_API_KEY` and `SLACK_WEBHOOK_URL` in your Kestra secrets manager.
    3. Adjust `qdrant_url` and `collection_name` to match your target vector collection.
    4. Run a manual test execution to verify connectivity, then enable the hourly schedule trigger.

    ## How to extend
    - **Automated Collection Optimization**: Add a task that triggers an explicit `POST /collections/{collection_name}/index` optimization when segments exceed 20.
    - **Multi-Collection Iteration**: Use Kestra's `io.kestra.plugin.core.flow.ForEach` task to iterate across an array of vector collections in parallel.
    - **Prometheus Metric Pushing**: Push indexing lag and segment counts to a Prometheus Pushgateway for Grafana dashboarding.

    ## Links
    - [Qdrant Collections API](https://qdrant.tech/documentation/concepts/collections/)
    - [Qdrant Indexing & Optimizer Guide](https://qdrant.tech/documentation/concepts/indexing/)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-notifications/tasks/slack/io.kestra.plugin.notifications.slack.slackincomingwebhook)
