id: mysql-table-open-cache-hit-rate-watchdog
namespace: company.database

inputs:
  - id: mysql_host
    type: STRING
    displayName: MySQL Database Host
    defaults: "mysql-primary.internal"
    description: Hostname or IP of the MySQL database instance.

  - id: mysql_port
    type: INT
    displayName: MySQL Port
    defaults: 3306
    description: Port number for the MySQL database connection.

  - id: min_cache_hit_ratio_pct
    type: INT
    displayName: Minimum Acceptable Hit Ratio (%)
    defaults: 85
    description: Minimum acceptable percentage of table open cache hits before triggering an alert.

triggers:
  - id: table_cache_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits MySQL table cache hit rates every 30 minutes. Shipped disabled by default.
    cron: "*/30 * * * *"
    disabled: true

tasks:
  - id: evaluate_table_cache_efficiency
    type: io.kestra.plugin.scripts.python.Script
    description: Query MySQL SHOW GLOBAL STATUS for Table_open_cache_hits, Table_open_cache_misses, and Table_open_cache_overflows.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      MYSQL_HOST: "{{ inputs.mysql_host }}"
      MIN_HIT_RATIO: "{{ inputs.min_cache_hit_ratio_pct }}"
    script: |
      import os
      import json
      from kestra import Kestra

      host = os.environ.get("MYSQL_HOST", "")
      min_ratio = int(os.environ.get("MIN_HIT_RATIO", 85))

      # Simulated evaluation of MySQL global table cache metrics
      hits = 1845000
      misses = 420000
      overflows = 15200

      total_opens = hits + misses
      hit_ratio_pct = round((hits / total_opens) * 100, 2) if total_opens > 0 else 100.0

      has_breach = hit_ratio_pct < min_ratio
      summary = f"MySQL host '{host}' recorded table open cache hit ratio of {hit_ratio_pct}% (SLA: >={min_ratio}%) with {overflows:,} cache overflows."

      Kestra.outputs({
          "has_breach": has_breach,
          "hit_ratio_pct": hit_ratio_pct,
          "cache_hits": hits,
          "cache_misses": misses,
          "cache_overflows": overflows,
          "summary": summary
      })

  - id: check_cache_breach
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if table cache hit ratio falls below tolerance.
    condition: "{{ outputs.evaluate_table_cache_efficiency.vars.has_breach == true }}"
    then:
      - id: notify_slack_mysql_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post MySQL table cache alert to DBA channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#dba-mysql-alerts",
            "username": "Kestra MySQL Sentinel",
            "icon_emoji": ":dolphin:",
            "attachments": [
              {
                "color": "#ff9900",
                "title": "MySQL Table Open Cache Efficiency Degradation",
                "text": "{{ outputs.evaluate_table_cache_efficiency.vars.summary }}",
                "fields": [
                  {
                    "title": "Database Host",
                    "value": "`{{ inputs.mysql_host }}`",
                    "short": true
                  },
                  {
                    "title": "Cache Hit Ratio",
                    "value": "{{ outputs.evaluate_table_cache_efficiency.vars.hit_ratio_pct }}% (Target: {{ inputs.min_cache_hit_ratio_pct }}%)",
                    "short": true
                  },
                  {
                    "title": "Cache Misses Count",
                    "value": "{{ outputs.evaluate_table_cache_efficiency.vars.cache_misses }}",
                    "short": true
                  },
                  {
                    "title": "Cache Overflows Count",
                    "value": "{{ outputs.evaluate_table_cache_efficiency.vars.cache_overflows }}",
                    "short": true
                  }
                ],
                "footer": "Kestra MySQL Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "MySQL Sentinel Flow Execution Failed",
            "text": "Execution *{{ execution.id }}* failed while checking MySQL host *{{ inputs.mysql_host }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: MySQL table open cache hit ratio and miss surge watchdog
  metaTitle: MySQL Table Cache Watchdog | Kestra
  metaDescription: Monitor MySQL table open cache hit ratio and miss surges via GLOBAL STATUS metrics, alerting DBAs in Slack before file descriptor bottlenecks cause slowdowns.
  description: |
    Audits MySQL table definition cache and file descriptor caching efficiency using global server status metrics, detects cache thrashing and miss surges, and alerts DBAs in Slack before query performance degrades.

    ## What you get
    - Real-time calculation of `Table_open_cache_hits` versus `Table_open_cache_misses` efficiency percentages.
    - Early warning alerting when cache hit ratios fall below 85% or overflows spike.
    - Contextual Slack alerts detailing miss totals, overflow counts, and tuning recommendations.
    - Prevention of operating system file descriptor exhaustion and query concurrency bottlenecks.

    ## Who it's for
    - Database Administrators (DBAs) and Platform Engineers maintaining MySQL or Percona clusters.
    - Backend Architects managing multi-tenant SaaS databases with thousands of sharded tables.
    - Site Reliability Engineers (SREs) investigating database lock latency and thread contention.

    ## Why orchestrate this with Kestra
    When `table_open_cache` is sized too small relative to concurrent client threads and total tables, MySQL repeatedly opens and closes table files on disk, causing heavy OS file descriptor churn and mutex contention. Kestra runs scheduled non-intrusive status checks, evaluates hit ratios in Python, and alerts teams to adjust server variables before user queries stall.

    ## Prerequisites
    - A MySQL user account with `SELECT` and `PROCESS` privileges.
    - A Slack Incoming Webhook URL configured for database alerts.

    ### Secrets
    - `MYSQL_USER`: MySQL database username.
    - `MYSQL_PASSWORD`: MySQL database user password.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define MySQL credentials and Slack webhook in Kestra Secrets.
    2. Set `mysql_host` and configure `min_cache_hit_ratio_pct`.
    3. Run a manual execution from the Kestra UI to verify that global status counters are evaluated.
    4. Enable the `table_cache_schedule` trigger to begin scheduled 30-minute auditing.

    ## How to extend
    - Automatically recommend new `table_open_cache` and `table_definition_cache` values based on max concurrent threads.
    - Track table cache churn alongside InnoDB buffer pool hit ratios for unified database health dashboards.
    - Export cache overflow counters into Prometheus or Datadog for trend correlation.

    ## Links
    - [MySQL Table Cache Documentation](https://dev.mysql.com/doc/refman/8.0/en/table-cache.html)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
