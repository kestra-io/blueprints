    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Spinnaker Official Documentation and Architecture Guide](https://spinnaker.io/docs/)
    - [Spinnaker Monitoring Daemon and Prometheus Integration Reference](https://spinnaker.io/docs/setup/monitoring/)
    - [Troubleshooting Spinnaker Orca Task Queues and Pipeline Execution](https://spinnaker.io/docs/guides/operator/troubleshooting/)
