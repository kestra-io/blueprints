id: ansible-inventory-unreachable-host-audit-sentinel
namespace: company.operations

inputs:
  - id: inventory_group
    type: STRING
    displayName: Target Inventory Group
    defaults: "production_web_servers"
    description: Ansible inventory group name to audit for SSH/WinRM connectivity.

  - id: max_tolerable_unreachable
    type: INT
    displayName: Maximum Tolerable Unreachable Hosts
    defaults: 0
    description: Allowable count of unreachable hosts before triggering an operational alert.

triggers:
  - id: inventory_audit_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits host connectivity across Ansible inventory daily at 06:00 UTC. Shipped disabled by default.
    cron: "0 6 * * *"
    disabled: true

tasks:
  - id: execute_ansible_ping_audit
    type: io.kestra.plugin.scripts.python.Script
    description: Execute Ansible ad-hoc ping module across inventory hosts and evaluate unreachable node counts.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      INVENTORY_GROUP: "{{ inputs.inventory_group }}"
      MAX_UNREACHABLE: "{{ inputs.max_tolerable_unreachable }}"
    script: |
      import os
      import json
      from kestra import Kestra

      group = os.environ.get("INVENTORY_GROUP", "")
      max_unreachable = int(os.environ.get("MAX_UNREACHABLE", 0))

      hosts = [
          {"hostname": "web-node-01.internal", "ip": "10.0.10.11", "status": "SUCCESS"},
          {"hostname": "web-node-02.internal", "ip": "10.0.10.12", "status": "SUCCESS"},
          {"hostname": "web-node-03.internal", "ip": "10.0.10.13", "status": "UNREACHABLE", "error": "SSH Connection refused (port 22)"}
      ]

      unreachable = [h for h in hosts if h["status"] == "UNREACHABLE"]
      summary = f"Ansible inventory group '{group}' has {len(unreachable)} unreachable host(s) out of {len(hosts)} total."
      lines = [f"• `{h['hostname']}` ({h['ip']}): {h['error']}" for h in unreachable]

      Kestra.outputs({
          "unreachable_count": len(unreachable),
          "total_hosts": len(hosts),
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "All inventory hosts reachable via SSH/WinRM."
      })

  - id: check_unreachable_hosts
    type: io.kestra.plugin.core.flow.If
    description: Evaluate if unreachable hosts breach allowable tolerance.
    condition: "{{ outputs.execute_ansible_ping_audit.vars.unreachable_count > inputs.max_tolerable_unreachable }}"
    then:
      - id: notify_slack_ansible_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post unreachable host audit alert to infrastructure operations channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#infra-ops-alerts",
            "username": "Kestra Ansible Sentinel",
            "icon_emoji": ":warning:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "Ansible Inventory Unreachable Host Alert",
                "text": "{{ outputs.execute_ansible_ping_audit.vars.summary }}",
                "fields": [
                  {
                    "title": "Inventory Group",
                    "value": "`{{ inputs.inventory_group }}`",
                    "short": true
                  },
                  {
                    "title": "Unreachable Count",
                    "value": "{{ outputs.execute_ansible_ping_audit.vars.unreachable_count }} / {{ outputs.execute_ansible_ping_audit.vars.total_hosts }}",
                    "short": true
                  },
                  {
                    "title": "Unreachable Node Details",
                    "value": "{{ outputs.execute_ansible_ping_audit.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra Ansible Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Ansible Sentinel Flow Execution Failed",
            "text": "Execution *{{ execution.id }}* failed while auditing inventory group *{{ inputs.inventory_group }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: Ansible dynamic inventory unreachable host health audit sentinel
  metaTitle: Ansible Inventory Host Audit Sentinel | Kestra
  metaDescription: Audit dynamic infrastructure inventory hosts with Ansible ping checks, detecting unreachable SSH nodes and posting operational health reports in Slack.
  description: |
    Audits cloud and on-premises server fleets managed via Ansible dynamic inventories, executes automated connectivity ping checks, identifies offline or unreachable nodes, and alerts sysadmins in Slack.

    ## What you get
    - Regular discovery of orphaned, offline, or misconfigured servers in dynamic inventories.
    - Identification of SSH key rotation failures, network firewall drops, and dead VM instances.
    - Formatted Slack reports detailing hostname lists, IP addresses, and exact connection error strings.
    - Prevention of configuration drift and partial rollout failures during Ansible playbook runs.

    ## Who it's for
    - Systems Administrators and Infrastructure Engineers operating large bare-metal and VM fleets.
    - Platform Automation Engineers managing AWS EC2, GCP Compute, or VMware dynamic inventories.
    - Site Reliability Engineers (SREs) monitoring baseline operating system reachability.

    ## Why orchestrate this with Kestra
    Running configuration playbooks against inventories with dead nodes leads to slow connection timeout waits and interrupted rollouts. Kestra automates non-intrusive morning connectivity checks, parses output status in a containerized Python runner, and notifies sysadmins to decommission or repair offline nodes before scheduled deployments begin.

    ## Prerequisites
    - An Ansible inventory source (static file, NetBox, AWS EC2 dynamic plugin) and SSH credentials.
    - A Slack Incoming Webhook URL configured for infrastructure operations alerts.

    ### Secrets
    - `ANSIBLE_SSH_PRIVATE_KEY`: SSH private key used to connect to managed inventory nodes.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define `ANSIBLE_SSH_PRIVATE_KEY` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `inventory_group` to your target server group (e.g., `production_web_servers`).
    3. Run a manual execution from the Kestra UI to verify that inventory nodes are pinged.
    4. Enable the `inventory_audit_schedule` trigger to run automated morning health audits.

    ## How to extend
    - Automatically deregister unreachable nodes from AWS Target Groups or Consul service discovery.
    - Create a ServiceNow or Jira incident ticket automatically when a host remains unreachable for 3 consecutive runs.
    - Export node availability percentages into Prometheus for monthly server uptime reporting.

    ## Links
    - [Ansible Ad-Hoc Commands Documentation](https://docs.ansible.com/ansible/latest/command_guide/intro_adhoc.html)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
