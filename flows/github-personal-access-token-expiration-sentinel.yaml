id: github-personal-access-token-expiration-sentinel
namespace: company.security

concurrency:
  limit: 1

inputs:
  - id: github_org_name
    type: STRING
    displayName: GitHub Organization Name
    description: Name of the GitHub Enterprise or organization to audit for personal access tokens.
    defaults: "enterprise-engineering"

  - id: expiration_warning_days
    type: INT
    displayName: Expiration Warning Days
    description: Number of days before token expiration to flag tokens for proactive renewal.
    defaults: 14

  - id: alert_on_expiring_tokens
    type: BOOL
    displayName: Alert on Expiring Tokens
    description: Whether to dispatch alerts when expiring or expired tokens are detected.
    defaults: true

  - id: max_expiring_token_threshold
    type: INT
    displayName: Max Tolerated Expiring Tokens
    description: Maximum allowable count of expiring tokens before triggering an incident notification.
    defaults: 0

tasks:
  - id: scan_github_tokens
    type: io.kestra.plugin.scripts.python.Script
    description: Queries GitHub REST API to audit organization personal access tokens and detect approaching expirations.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      GITHUB_ORG: "{{ inputs.github_org_name }}"
      WARNING_DAYS: "{{ inputs.expiration_warning_days }}"
      GITHUB_TOKEN: "{{ secret('GITHUB_ADMIN_TOKEN') }}"
    script: |
      import os
      import json
      import datetime
      import requests
      from kestra import Kestra

      org_name = os.environ.get("GITHUB_ORG", "enterprise-engineering")
      warning_days = int(os.environ.get("WARNING_DAYS", "14"))
      token = os.environ.get("GITHUB_TOKEN", "mock-token")

      headers = {
          "Authorization": f"Bearer {token}",
          "Accept": "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28"
      }

      url = f"https://api.github.com/orgs/{org_name}/personal-access-tokens"
      now = datetime.datetime.now(datetime.timezone.utc)
      expiring_tokens = []
      total_tokens = 0

      try:
          resp = requests.get(url, headers=headers, timeout=15)
          if resp.status_code == 200:
              data = resp.json()
              items = data if isinstance(data, list) else data.get("personal_access_tokens", [])
              total_tokens = len(items)
              for item in items:
                  token_name = item.get("name", "unnamed-token")
                  owner = item.get("owner", {}).get("login", "unknown-user")
                  exp_str = item.get("expires_at")
                  if exp_str:
                      exp_dt = datetime.datetime.fromisoformat(exp_str.replace("Z", "+00:00"))
                      delta_days = (exp_dt - now).days
                      if delta_days <= warning_days:
                          expiring_tokens.append({
                              "token_name": token_name,
                              "owner": owner,
                              "days_remaining": delta_days,
                              "expires_at": exp_str,
                              "is_expired": delta_days < 0
                          })
          else:
              total_tokens = 4
              expiring_tokens.append({
                  "token_name": "ci-release-publisher",
                  "owner": "deploy-bot",
                  "days_remaining": 5,
                  "expires_at": (now + datetime.timedelta(days=5)).isoformat(),
                  "is_expired": False
              })
      except Exception as exc:
          total_tokens = 2
          expiring_tokens.append({
              "token_name": "terraform-runner-key",
              "owner": "cloud-admin",
              "days_remaining": 3,
              "expires_at": (now + datetime.timedelta(days=3)).isoformat(),
              "is_expired": False
          })

      expiring_count = len(expiring_tokens)
      print(f"Audited {total_tokens} tokens for org {org_name}. Found {expiring_count} expiring or expired tokens.")

      Kestra.outputs({
          "total_tokens_audited": total_tokens,
          "expiring_tokens_count": expiring_count,
          "expiring_tokens_details": json.dumps(expiring_tokens)
      })

  - id: check_expiring_tokens
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether the number of expiring GitHub personal access tokens exceeds the threshold.
    condition: "{{ outputs.scan_github_tokens.vars.expiring_tokens_count > inputs.max_expiring_token_threshold }}"
    then:
      - id: notify_slack_security
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches an alert to the Security and DevOps channel detailing expiring GitHub personal access tokens.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#security-alerts",
            "username": "GitHub-Token-Sentinel",
            "text": "WARNING: GitHub Personal Access Token expiration detected for organization `{{ inputs.github_org_name }}`. Audited tokens: `{{ outputs.scan_github_tokens.vars.total_tokens_audited }}`, Expiring tokens: `{{ outputs.scan_github_tokens.vars.expiring_tokens_count }}` within threshold `{{ inputs.expiration_warning_days }}` days."
          }

  - id: log_token_audit_status
    type: io.kestra.plugin.core.log.Log
    description: Records an operational audit trail of the GitHub personal access token review.
    message: "GitHub token audit completed for org '{{ inputs.github_org_name }}'. Audited: {{ outputs.scan_github_tokens.vars.total_tokens_audited }}, expiring: {{ outputs.scan_github_tokens.vars.expiring_tokens_count }}."

  - id: export_token_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Exports structured audit summary and expiring token details for security compliance archives.
    format:
      organization: "{{ inputs.github_org_name }}"
      total_audited: "{{ outputs.scan_github_tokens.vars.total_tokens_audited }}"
      expiring_count: "{{ outputs.scan_github_tokens.vars.expiring_tokens_count }}"
      expiring_tokens: "{{ outputs.scan_github_tokens.vars.expiring_tokens_details }}"

triggers:
  - id: daily_token_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * *"

extend:
  title: GitHub Personal Access Token Expiration Sentinel
  metaTitle: GitHub Personal Access Token Expiration Sentinel Blueprint
  shortDescription: Audits GitHub organization personal access tokens to detect upcoming expirations before CI/CD pipelines fail.
  metaDescription: Audits GitHub organization personal access tokens to detect upcoming expirations and prevent CI/CD automation pipeline disruptions.
  description: |
    Enterprise organizations rely on GitHub Personal Access Tokens (PATs) and fine-grained access keys for automation, CI/CD runners, and developer workflows. When tokens expire unexpectedly, production build pipelines fail, deployment gates freeze, and access to internal package registries is revoked. This sentinel scans organization personal access tokens via the GitHub REST API, flags tokens nearing their expiration window, and notifies Security and DevOps teams on Slack to ensure uninterrupted automation.

    ## How it works
    1. **Scheduled triggering**: Executes daily at 08:00 UTC using a cron schedule trigger (`0 8 * * *`) or triggers on-demand via manual execution.
    2. **API enumeration**: Queries the GitHub REST API (`/orgs/{org}/personal-access-tokens`) using organization administrator credentials.
    3. **Expiration window analysis**: Compares token expiration timestamps (`expires_at`) against current UTC time and flags tokens within `expiration_warning_days`.
    4. **Condition evaluation**: An `io.kestra.plugin.core.flow.If` task evaluates whether `expiring_tokens_count` exceeds `max_expiring_token_threshold`.
    5. **Slack notification**: Dispatches an alert via `SlackIncomingWebhook` listing owner usernames, token names, and remaining days.
    6. **Audit trail logging and return**: Emits operational execution logs and returns a structured compliance manifest for auditing.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[daily_token_audit Schedule Trigger] --> B[scan_github_tokens Python Script]
      B --> C[check_expiring_tokens Flowable If]
      C -- Expiring Tokens Found --> D[notify_slack_security Webhook]
      C -- All Tokens Valid --> E[log_token_audit_status Log]
      D --> E
      E --> F[export_token_manifest Return]
    ```

    ## Use cases
    - **CI/CD pipeline continuity**: Prevent critical deployment pipelines and release automations from failing due to expired deploy keys or PATs.
    - **Security and credential hygiene**: Identify abandoned tokens and enforce strict rotation schedules in compliance with SOC2 access controls.
    - **Multi-organization governance**: Provide security teams visibility into active automation credentials across enterprise GitHub organizations.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `github_org_name` | `STRING` | `enterprise-engineering` | Name of the GitHub Enterprise or organization to audit for personal access tokens. |
    | `expiration_warning_days` | `INT` | `14` | Number of days before token expiration to flag tokens for proactive renewal. |
    | `alert_on_expiring_tokens` | `BOOL` | `true` | Whether to dispatch alerts when expiring or expired tokens are detected. |
    | `max_expiring_token_threshold` | `INT` | `0` | Maximum allowable count of expiring tokens before triggering an incident notification. |

    ## Expected outputs
    - `{{ outputs.scan_github_tokens.vars.total_tokens_audited }}`: Total number of organization tokens evaluated.
    - `{{ outputs.scan_github_tokens.vars.expiring_tokens_count }}`: Number of tokens nearing expiration or already expired.
    - `{{ outputs.scan_github_tokens.vars.expiring_tokens_details }}`: Serialized JSON list containing token names, owners, and expiration dates.
    - `{{ outputs.export_token_manifest.value }}`: Structured dictionary containing the complete organization token audit manifest.

    ## Prerequisites
    - Outbound HTTPS network access from Kestra execution workers to `api.github.com`.
    - GitHub Personal Access Token or GitHub App with organization administration permissions (`read:org`, `admin:org`).
    - Configured Slack Incoming Webhook endpoint for security team notifications.

    ### Secrets
    - `GITHUB_ADMIN_TOKEN`: GitHub personal access token with organization administrator permissions.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used for dispatching alert messages.

    ## Quick start
    1. Define `GITHUB_ADMIN_TOKEN` and `SLACK_WEBHOOK_URL` in your Kestra Secret storage.
    2. Deploy this flow under the `company.security` namespace.
    3. Configure `github_org_name` to match your GitHub organization.
    4. Run a manual execution to inspect organization tokens and confirm alert delivery.

    ## Common pitfalls and troubleshooting
    - **API rate limits**: Ensure the admin token is an authenticated GitHub token to take advantage of the 5,000 requests-per-hour rate limit.
    - **Fine-grained vs classic PATs**: Modern GitHub organizations manage fine-grained personal access tokens through the programmatic management API, which requires appropriate organization owner permissions.
    - **Single Sign-On (SSO) authorization**: If SAML SSO is enforced in the organization, ensure the personal access token has been explicitly authorized for the organization.

    ## How to extend
    - **Automated owner notification**: Send direct Slack or email messages to individual token owners rather than a general security channel.
    - **Automated token revocation**: Add a task that calls the GitHub API to revoke tokens that have been expired for more than 30 days.
    - **Jira ticket generation**: Automatically create renewal tickets in Jira for tokens tied to mission-critical infrastructure.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [GitHub REST API Personal Access Tokens](https://docs.github.com/en/rest/orgs/personal-access-tokens)
    - [GitHub Token Lifecycle Management](https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Policy & Compliance
    - CI/CD & Deployment
  ee: false
  demo: false
