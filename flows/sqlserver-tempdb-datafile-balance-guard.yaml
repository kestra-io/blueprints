id: sqlserver-tempdb-datafile-balance-guard
namespace: company.team

description: |
  Find a SQL Server instance whose tempdb data files have drifted to different
  sizes. It also flags a tempdb still running on fewer files than you want. tempdb spreads
  its allocations across its data files in proportion to free space, so unequal
  sizes send most of the allocation traffic back to one file and show up as PFS
  and GAM page latch contention. The audit reads every tempdb data file from
  tempdb.sys.database_files, alerts Slack, then behind a safe-by-default gate and a human
  approval it grows the small files up to one common size with ALTER DATABASE
  tempdb MODIFY FILE and adds files to reach the floor. It re-reads
  tempdb.sys.database_files afterwards and fails the run if the sizes are still
  skewed or the file count is still short. Only tempdb is read, so no user
  database is ever read or changed.

inputs:
  - id: url
    type: STRING
    displayName: JDBC URL
    description: Points at the SQL Server instance. The audit reads instance wide catalog views, so connecting to master is enough.
    defaults: "jdbc:sqlserver://localhost:1433"

  - id: user
    type: STRING
    displayName: SQL Server login
    defaults: sa

  - id: password
    type: STRING
    displayName: SQL Server password
    description: Defaults to the SQLSERVER_PASSWORD secret. Override only for local testing.
    defaults: "{{ secret('SQLSERVER_PASSWORD') }}"

  - id: skew_tolerance_pct
    type: INT
    displayName: Size skew tolerance in percent
    description: Flag tempdb once the gap between its largest data file and its smallest reaches this share of the largest. 0 demands exactly equal files.
    defaults: 20

  - id: min_file_count
    type: INT
    displayName: Minimum tempdb data file count
    description: Flag tempdb when it has fewer data files than this. A common starting point is one file per logical core up to eight. At most 16 files are added in one run.
    defaults: 4

  - id: min_file_size_mb
    type: INT
    displayName: Minimum size per file in MB
    description: Floor for the common size the files are equalised to. It never triggers detection on its own, it only stops the run from levelling every file down at a tiny size.
    defaults: 64

  - id: growth_mb
    type: INT
    displayName: Fixed FILEGROWTH per file in MB
    description: The fixed growth increment left on every tempdb data file. Equal increments are what keep the files the same size, because tempdb grows its data files together.
    defaults: 64

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    description: Allow the ALTER DATABASE tempdb statements to run.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, before any statement runs.
    defaults: true

variables:
  state_sql: |
    SELECT
      mf.file_id,
      mf.name AS file_name,
      CAST(mf.size AS BIGINT) * 8 / 1024 AS size_mb,
      CASE WHEN mf.is_percent_growth = 1 THEN NULL ELSE CAST(mf.growth AS BIGINT) * 8 / 1024 END AS growth_mb,
      mf.is_percent_growth,
      COUNT(*) OVER () AS file_count,
      MIN(CAST(mf.size AS BIGINT) * 8 / 1024) OVER () AS min_mb,
      MAX(CAST(mf.size AS BIGINT) * 8 / 1024) OVER () AS max_mb,
      CASE
        WHEN MAX(CAST(mf.size AS BIGINT) * 8 / 1024) OVER () = 0 THEN 0
        ELSE (MAX(CAST(mf.size AS BIGINT) * 8 / 1024) OVER () - MIN(CAST(mf.size AS BIGINT) * 8 / 1024) OVER ()) * 100 / MAX(CAST(mf.size AS BIGINT) * 8 / 1024) OVER ()
      END AS skew_pct,
      mf.physical_name
    FROM tempdb.sys.database_files mf
    WHERE mf.type_desc = 'ROWS'
    ORDER BY mf.file_id

  audit_sql: |
    WITH f AS (
      SELECT
        mf.file_id,
        mf.name,
        mf.physical_name,
        CAST(mf.size AS BIGINT) * 8 / 1024 AS size_mb,
        CASE WHEN mf.is_percent_growth = 1 THEN NULL ELSE CAST(mf.growth AS BIGINT) * 8 / 1024 END AS growth_mb,
        mf.is_percent_growth
      FROM tempdb.sys.database_files mf
      WHERE mf.type_desc = 'ROWS'
    ),
    agg AS (
      SELECT COUNT(*) AS file_count, MIN(size_mb) AS min_mb, MAX(size_mb) AS max_mb
      FROM f
    ),
    t AS (
      SELECT
        a.file_count,
        a.min_mb,
        a.max_mb,
        CASE WHEN a.max_mb >= {{ inputs.min_file_size_mb }} THEN a.max_mb ELSE {{ inputs.min_file_size_mb }} END AS target_mb,
        CASE WHEN a.max_mb = 0 THEN 0 ELSE (a.max_mb - a.min_mb) * 100 / a.max_mb END AS skew_pct
      FROM agg a
    ),
    pdir AS (
      SELECT TOP 1
        LEFT(f.physical_name, LEN(f.physical_name) - CHARINDEX(CASE WHEN CHARINDEX('\', f.physical_name) > 0 THEN '\' ELSE '/' END, REVERSE(f.physical_name)) + 1) AS dir
      FROM f
      ORDER BY f.file_id
    ),
    nums AS (
      SELECT 1 AS i UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4
      UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8
      UNION ALL SELECT 9 UNION ALL SELECT 10 UNION ALL SELECT 11 UNION ALL SELECT 12
      UNION ALL SELECT 13 UNION ALL SELECT 14 UNION ALL SELECT 15 UNION ALL SELECT 16
    )
    SELECT
      'grow' AS action_kind,
      f.name AS file_name,
      f.size_mb AS current_mb,
      t.target_mb,
      t.skew_pct,
      t.file_count,
      CONCAT(
        'ALTER DATABASE tempdb MODIFY FILE (NAME = ', QUOTENAME(f.name),
        CASE WHEN f.size_mb < t.target_mb THEN CONCAT(', SIZE = ', t.target_mb, 'MB') ELSE '' END,
        ', FILEGROWTH = {{ inputs.growth_mb }}MB)') AS action_sql
    FROM f
    CROSS JOIN t
    WHERE (t.skew_pct > {{ inputs.skew_tolerance_pct }} OR t.file_count < {{ inputs.min_file_count }})
      AND (f.size_mb < t.target_mb OR f.is_percent_growth = 1 OR f.growth_mb <> {{ inputs.growth_mb }})
    UNION ALL
    SELECT
      'add' AS action_kind,
      CONCAT('tempdev_bal', t.file_count + n.i) AS file_name,
      CAST(0 AS BIGINT) AS current_mb,
      t.target_mb,
      t.skew_pct,
      t.file_count,
      CONCAT(
        'ALTER DATABASE tempdb ADD FILE (NAME = ', QUOTENAME(CONCAT('tempdev_bal', t.file_count + n.i)),
        ', FILENAME = ', CHAR(39), p.dir, 'tempdb_bal', t.file_count + n.i, '.ndf', CHAR(39),
        ', SIZE = ', t.target_mb, 'MB, FILEGROWTH = {{ inputs.growth_mb }}MB)') AS action_sql
    FROM t
    CROSS JOIN nums n
    CROSS JOIN pdir p
    WHERE t.file_count + n.i <= {{ inputs.min_file_count }}
    ORDER BY action_kind DESC, file_name

  verify_sql: |
    SELECT
      a.file_count,
      a.min_mb,
      a.max_mb,
      a.bad_growth,
      CASE WHEN a.max_mb = 0 THEN 0 ELSE (a.max_mb - a.min_mb) * 100 / a.max_mb END AS skew_pct
    FROM (
      SELECT
        COUNT(*) AS file_count,
        MIN(CAST(mf.size AS BIGINT) * 8 / 1024) AS min_mb,
        MAX(CAST(mf.size AS BIGINT) * 8 / 1024) AS max_mb,
        SUM(CASE WHEN mf.is_percent_growth = 1 OR CAST(mf.growth AS BIGINT) * 8 / 1024 <> {{ inputs.growth_mb }} THEN 1 ELSE 0 END) AS bad_growth
      FROM tempdb.sys.database_files mf
      WHERE mf.type_desc = 'ROWS'
    ) a
    WHERE a.file_count < {{ inputs.min_file_count }}
      OR a.bad_growth > 0
      OR (CASE WHEN a.max_mb = 0 THEN 0 ELSE (a.max_mb - a.min_mb) * 100 / a.max_mb END) > {{ inputs.skew_tolerance_pct }}

tasks:
  - id: state_before
    type: io.kestra.plugin.jdbc.sqlserver.Query
    description: Read-only. Lists every tempdb data file with its size, growth increment and physical path, plus the instance wide file count and size skew as window aggregates. Reads tempdb.sys.database_files filtered to type_desc ROWS, so the log file and every user database are out of range.
    url: "{{ inputs.url }}"
    username: "{{ inputs.user }}"
    password: "{{ inputs.password }}"
    trustServerCertificate: true
    fetchType: FETCH
    sql: "{{ render(vars.state_sql) }}"

  - id: audit
    type: io.kestra.plugin.jdbc.sqlserver.Query
    description: Read-only. Returns one row per planned action. No rows at all when the size skew is inside tolerance and the file count is at or above the floor. Every statement is built in T-SQL with QUOTENAME so identifiers are quoted by the server.
    url: "{{ inputs.url }}"
    username: "{{ inputs.user }}"
    password: "{{ inputs.password }}"
    trustServerCertificate: true
    fetchType: FETCH
    sql: "{{ render(vars.audit_sql) }}"

  - id: targets
    type: io.kestra.plugin.core.output.OutputValues
    description: The plan, split into the files to grow and the files to add, with the common target size the run levels up to.
    values:
      plan: "{{ outputs.audit.rows | jq('map({kind: .action_kind, file: .file_name, current: .current_mb, target: .target_mb, sql: .action_sql})') | first | toJson }}"
      grow_count: "{{ outputs.audit.rows | jq('map(select(.action_kind == \"grow\")) | length') | first }}"
      add_count: "{{ outputs.audit.rows | jq('map(select(.action_kind == \"add\")) | length') | first }}"
      target_mb: "{{ outputs.audit.rows | jq('map(.target_mb) | (.[0] // 0)') | first }}"
      skew_pct: "{{ outputs.state_before.rows | jq('map(.skew_pct) | (.[0] // 0)') | first }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      tempdb data file balance on {{ inputs.url }}. {{ outputs.state_before.size }} data file(s), {{ outputs.targets.values.skew_pct }} percent size skew against a {{ inputs.skew_tolerance_pct }} percent tolerance, file count floor {{ inputs.min_file_count }}.
      Files: {{ outputs.state_before.rows | jq('map("\(.file_name) size=\(.size_mb)MB growth=\(.growth_mb // "percent")") | join("; ")') | first }}.
      {% if outputs.audit.size > 0 %}Planned: {{ outputs.targets.values.grow_count }} to grow, {{ outputs.targets.values.add_count }} to add, at a common target of {{ outputs.targets.values.target_mb }}MB.{% else %}No action planned.{% endif %}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit.size > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'SQL Server ' ~ inputs.url ~ ' tempdb is unbalanced: ' ~ outputs.targets.values.skew_pct ~ ' percent size skew across ' ~ outputs.state_before.size ~ ' data file(s), ' ~ outputs.targets.values.grow_count ~ ' to grow to ' ~ outputs.targets.values.target_mb ~ 'MB and ' ~ outputs.targets.values.add_count ~ ' to add.' ~ (inputs.auto_remediate and not inputs.dry_run ? ' Waiting for approval to run ALTER DATABASE tempdb.' : ' No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: approval_gate
            type: io.kestra.plugin.core.flow.Pause
            description: Hold the run until a human approves. Growing tempdb data files writes and zeroes real disk. Adding a file changes the instance layout. Neither starts on its own.
            pauseDuration: PT2H
            behavior: FAIL
            onResume:
              - id: approved
                type: BOOL
                required: false
                description: Set true to grow the listed tempdb data files to one size and add the missing ones. Anything else leaves tempdb alone.

          - id: apply
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.approval_gate.onResume.approved ?? false }}"
            then:
              - id: remediate
                type: io.kestra.plugin.core.flow.Loop
                description: Serial on purpose. concurrencyLimit 1 keeps two file changes off tempdb at once. Each statement runs as its own autocommitting Query, because ALTER DATABASE cannot run inside an explicit transaction.
                concurrencyLimit: 1
                values: "{{ outputs.targets.values.plan }}"
                tasks:
                  - id: apply_one
                    type: io.kestra.plugin.jdbc.sqlserver.Query
                    description: >-
                      One ALTER DATABASE tempdb statement. Raising SIZE with MODIFY FILE takes effect at once and needs no restart. ADD FILE also takes effect at once, but the new file only takes its share of allocations made from that point on.
                    url: "{{ inputs.url }}"
                    username: "{{ inputs.user }}"
                    password: "{{ inputs.password }}"
                    trustServerCertificate: true
                    fetchType: NONE
                    sql: "{{ fromJson(item.value).sql }}"

              - id: after_state
                type: io.kestra.plugin.jdbc.sqlserver.Query
                description: Read every tempdb data file back, whatever the outcome.
                url: "{{ inputs.url }}"
                username: "{{ inputs.user }}"
                password: "{{ inputs.password }}"
                trustServerCertificate: true
                fetchType: FETCH
                sql: "{{ render(vars.state_sql) }}"

              - id: state_log
                type: io.kestra.plugin.core.log.Log
                message: >-
                  Before: {{ outputs.state_before.rows | jq('map("\(.file_name) size=\(.size_mb)MB growth=\(.growth_mb // "percent")") | join("; ")') | first }}.
                  After: {{ outputs.after_state.rows | jq('map("\(.file_name) size=\(.size_mb)MB growth=\(.growth_mb // "percent")") | join("; ")') | first }}.

              - id: reverify
                type: io.kestra.plugin.jdbc.sqlserver.Query
                description: Re-read tempdb.sys.database_files and return a row only while the size skew is still over tolerance, the file count is still under the floor or a file still carries a different growth increment. This read drops the per file filter the plan used, so levelling only some of the files can never report success.
                url: "{{ inputs.url }}"
                username: "{{ inputs.user }}"
                password: "{{ inputs.password }}"
                trustServerCertificate: true
                fetchType: FETCH
                sql: "{{ render(vars.verify_sql) }}"

              - id: verify_result
                type: io.kestra.plugin.core.flow.If
                condition: "{{ outputs.reverify.size > 0 }}"
                then:
                  - id: remediation_failed
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: "tempdb is still unbalanced: {{ outputs.reverify.rows | jq('map(\"files=\\(.file_count) min=\\(.min_mb)MB max=\\(.max_mb)MB skew=\\(.skew_pct)pct offgrowth=\\(.bad_growth)\") | join(\", \")') | first }}. Either a file grew again between the audit and the change, so the plan levelled up to a size that is no longer the largest. Or a statement was rejected. Re-read tempdb.sys.database_files, then run again so the plan is built on the current sizes."
                else:
                  - id: remediated
                    type: io.kestra.plugin.core.log.Log
                    message: "tempdb data files are level: {{ outputs.targets.values.grow_count }} grown to {{ outputs.targets.values.target_mb }}MB and {{ outputs.targets.values.add_count }} added, all on a fixed {{ inputs.growth_mb }} MB growth increment. Size skew is now inside the {{ inputs.skew_tolerance_pct }} percent tolerance with at least {{ inputs.min_file_count }} data files. The size changes are live. The new files only take their share of allocations made from now on, they do not rebalance what tempdb already allocated, so keep watching PFS and GAM latch waits until the next restart recreates tempdb on this layout."
            else:
              - id: declined
                type: io.kestra.plugin.core.log.Log
                message: "Approval was not given, so no tempdb file was grown or added. The findings stand: {{ fromJson(outputs.targets.values.plan) | jq('map(\"\\(.kind) \\(.file) \\(.current)MB to \\(.target)MB\") | join(\", \")') | first }}."
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: >-
          tempdb looks balanced on {{ inputs.url }}: {{ outputs.state_before.size }} data file(s) at {{ outputs.targets.values.skew_pct }} percent size skew, inside the {{ inputs.skew_tolerance_pct }} percent tolerance, at or above the floor of {{ inputs.min_file_count }} files.
          Nothing to grow or add. The per file growth increments are listed above. They are levelled to one value only when a size finding or a file count finding fires.

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'SQL Server tempdb data file balance guard failed on ' ~ inputs.url ~ ' (execution ' ~ execution.id ~ '). The audit could not run, an ALTER DATABASE tempdb statement was rejected or tempdb is still unbalanced after the change. Check the logs.'} | toJson }}

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled. Always runs in safe mode (audit only).
    cron: "0 5 * * 0"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: SQL Server tempdb Data File Balance Guard
  shortDescription: Find tempdb data files that have drifted to different sizes or a tempdb running on too few files, alert Slack, then level the sizes up with ALTER DATABASE behind an approval and re-read tempdb.sys.database_files.
  metaTitle: SQL Server tempdb Data File Balance Guard with Kestra
  metaDescription: Detect skewed tempdb data file sizes behind PFS and GAM page latch contention, level them up with ALTER DATABASE behind an approval, then re-read.
  description: |
    tempdb does not round robin its allocations. It picks the data file with the
    most free space, proportionally, which is the whole reason several files help
    at all. The moment the files are different sizes that proportional choice
    collapses back onto one file. A single 20 GB data file behaves the same way
    under load as eight files where one is 20 GB and the rest are 8 MB. The
    allocation bitmaps in that one file become the hot pages.

    What you see is sessions queueing on `PAGELATCH_UP` against pages like
    `2:1:1`, `2:1:3` or `2:3:905768`, which are the PFS, GAM and SGAM pages of
    tempdb file 1. Throughput falls as concurrency rises. No query plan shows it
    and no index will fix it, because the wait is on a latch, not a lock.

    The fix has been the same advice for twenty years, several equally sized
    tempdb data files, so almost nobody checks whether the instance in front of
    them still matches it. Files drift apart after a one off manual grow. A
    restore or a migration lands tempdb on one file. Someone raises autogrowth on
    file 1 only.

    This blueprint reads every tempdb data file from `tempdb.sys.database_files`,
    which holds the current size (`sys.master_files` keeps only the startup size
    for tempdb), measures the size skew between the largest file
    and the smallest, compares the file count against a floor, then alerts Slack.
    When you allow it and a human approves the run, it grows every smaller file
    up to one common size with `ALTER DATABASE tempdb MODIFY FILE`, adds files
    with `ADD FILE` to reach the floor, leaves one fixed `FILEGROWTH` on all of
    them, then reads `tempdb.sys.database_files` again and fails the run if tempdb is
    still skewed or still short of files.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Safety

    - Only tempdb is read and only tempdb is changed. Every query reads
      `tempdb.sys.database_files` filtered to `type_desc = 'ROWS'`. Every statement names `tempdb`
      explicitly. No user database and no other system database is in range. The
      tempdb log file is out of range too.
    - Read-only by default. `dry_run` is `true` and `auto_remediate` is `false`,
      so a normal run only measures and alerts.
    - A change happens only when `auto_remediate` is `true`, `dry_run` is `false`
      **and** a human resumes the `Pause` with `approved: true`. A pause resumed
      without an answer reads as a refusal.
    - **Files are only ever grown, never shrunk.** Reaching one common size by
      raising the small files is online and reversible at the next restart.
      Shrinking a tempdb data file is a different operation with a different risk
      profile: it may release nothing at all while the file is in use. It also
      needs `DBCC SHRINKFILE` rather than `MODIFY FILE`. So the target size is
      the largest current file, floored at `min_file_size_mb`.
    - Growing a file writes and zeroes real disk at the moment the statement
      runs. Check free space on the tempdb volume first. Prefer a quiet window on
      a large jump.
    - The remediation loop has `concurrencyLimit: 1`, so two file changes never
      overlap on tempdb.
    - Each statement runs as its own autocommitting
      `io.kestra.plugin.jdbc.sqlserver.Query`. `ALTER DATABASE` cannot run inside
      an explicit transaction, so this is never a `Queries` task with
      `transaction: true`.

    ## What applies immediately and what waits for a restart

    - **Immediate, no restart.** `ALTER DATABASE tempdb MODIFY FILE (SIZE = ...)`
      that raises a file takes effect as soon as it commits. The file is larger
      on disk and tempdb starts weighing it by its new free space straight away.
      A changed `FILEGROWTH` is immediate as well.
    - **Immediate, but only for new allocations.** `ADD FILE` puts the file in
      service at once. It does not move a single existing allocation, so a
      workload that already filled file 1 keeps its pages there and the
      proportional fill only improves as that space is freed and re-taken.
    - **Only at the next restart.** tempdb is recreated from the `master` catalog
      every time the instance starts, which is when the new layout becomes the
      starting layout rather than the current one. A size you set below a file's
      current size is also only honoured then.
    - **What the re-verify does and does not prove.** It re-reads
      `tempdb.sys.database_files`, which is the live state: file count, per file
      size and per file growth increment. It proves the change landed. It cannot
      prove the contention is gone, because allocation latch waits live in
      `sys.dm_os_wait_stats` and `sys.dm_exec_requests` under real load, not in a
      settings read. Watch `PAGELATCH_UP` waits on tempdb pages for that, which
      is listed under How to extend.

    ## How it works

    1. `state_before` (`io.kestra.plugin.jdbc.sqlserver.Query`, read-only) lists
       every tempdb data file from `tempdb.sys.database_files` with its size in MB, its
       growth increment, whether that growth is a percentage and its physical
       path, plus the file count and the size skew as window aggregates.
    2. `audit` (`io.kestra.plugin.jdbc.sqlserver.Query`, read-only) returns one
       row per planned action, exposed as `outputs.audit.size` plus
       `outputs.audit.rows`. It returns zero rows when the skew is inside
       `skew_tolerance_pct` and the file count is at or above `min_file_count`.
       A `grow` row carries an `ALTER DATABASE tempdb MODIFY FILE` statement that
       raises the file to the common target and sets the fixed growth. An `add`
       row carries an `ALTER DATABASE tempdb ADD FILE` statement, with the new
       file placed in the same directory as file 1. Statements are built in T-SQL
       with `QUOTENAME`.
    3. `targets` (`io.kestra.plugin.core.output.OutputValues`) splits the plan
       into the grow count, the add count and the target size. `summary`
       (`io.kestra.plugin.core.log.Log`) logs every file with its size and growth.
    4. `route` (`io.kestra.plugin.core.flow.If`):
       - **clean:** logs that tempdb is balanced and at or above the file floor.
       - **findings:** `alert` posts the skew, the file count and the plan to Slack.
         - `remediate_gate` runs only when `auto_remediate` is `true` and
           `dry_run` is `false`.
         - `approval_gate` (`io.kestra.plugin.core.flow.Pause`) holds the run
           until a human resumes it.
         - `remediate` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`)
           runs the grow statements first, then the add statements, one at a time.
         - `after_state` reads every tempdb data file back and `state_log` logs
           the before and after side by side.
         - `reverify` re-reads `tempdb.sys.database_files` and returns a row only while
           tempdb is still skewed, still short of files or still carrying a
           different growth increment on a file. `verify_result` branches on
           `outputs.reverify.size` and fails the run through
           `io.kestra.plugin.core.execution.Fail` if it is not zero.
         - `declined` logs the findings untouched when the approval was refused.
    5. `errors` posts a Slack alert when the audit cannot run, a statement is
       rejected or the re-read fails the run.

    ## What you get

    - A size skew percentage across the real tempdb data files, which is the
      number behind an allocation latch problem that no query plan exposes.
    - The file count against a floor you set, so a tempdb that was restored or
      migrated onto one file is caught as well as one that drifted.
    - A fix that only grows, so nothing depends on a shrink releasing space while
      tempdb is in use.
    - One fixed `FILEGROWTH` left on every file. tempdb grows its data files
      together by default since SQL Server 2016, so unequal increments pull the
      sizes apart again by themselves.
    - A second read of `tempdb.sys.database_files` that fails the run when the layout did
      not land, with an honest statement of what that read covers.
    - A Slack alert on the findings plus a separate alert on failure.

    ## Who it's for

    - DBAs chasing a slowdown that only shows under concurrency, where the top
      wait is `PAGELATCH_UP` on a tempdb page rather than anything in a plan.
    - Platform teams who inherited instances built by someone else or
      restored onto new hardware, where nobody has checked the tempdb layout
      since.

    ## Why orchestrate this with Kestra

    This is a check nobody remembers to run and a change nobody wants to run
    blind. The target size depends on what the files look like right now, so the
    plan has to be built from a live read rather than written down once. The
    statements have to go one at a time against one database. A human has to say
    yes before real disk is written. Then somebody has to prove the layout
    actually changed, which is the step that gets skipped by hand. Kestra reads
    `tempdb.sys.database_files`, builds the plan from it, gates the change behind two
    inputs plus an approval, runs the statements serially, reads the catalog again
    and fails loudly when the layout did not land. The Slack alert says what was
    found and whether anything changed. The run history keeps every before and
    after.

    ## Tested end to end

    On Kestra 2.0.5 against SQL Server 2022 (16.0.4295.3) on Linux, with a local
    HTTP sink standing in for Slack. The container starts tempdb with 8 data
    files of 8 MB each on a 64 MB growth increment, which is already balanced, so
    it served as the healthy case. tempdb was then degraded with
    `ALTER DATABASE tempdb MODIFY FILE` to push file 1 well above the rest. A
    user database `w35app` was kept on the instance throughout with two
    deliberately mismatched data files (8 MB and 48 MB) on 10 percent growth, as
    the control for the `database_id = 2` scoping. Every number below was read
    back with `sqlcmd` against `sys.master_files`, not from the flow log.
    Those runs used `sys.master_files` for the audit and the re-read. A later audit
    switched both to `tempdb.sys.database_files` and did not re-run them.

    | Run | What was run | Result |
    |---|---|---|
    | 1 | `tempdev` grown to 32 MB first, then the defaults plus `min_file_size_mb: 8` | 7 flagged to grow to 32 MB at 75 percent skew. Slack said "No change applied". `sqlcmd` still read 32, 8, 8, 8, 8, 8, 8, 8 |
    | 2 | `auto_remediate: true`, `dry_run: true` | the same 7 findings, still "No change applied". `sqlcmd` unchanged |
    | 3 | `auto_remediate: true`, `dry_run: false`, pause resumed `approved: false` | `declined` listed all 7. `sqlcmd` unchanged |
    | 4 | the same, resumed `approved: true` | 7 `MODIFY FILE` statements ran, `reverify` returned 0 rows. `sqlcmd`: **all 8 files 32 MB, skew 75 to 0 percent**, growth 64 MB on every file |
    | 5 | the same inputs on the fixed instance | 0 actions, `clean` branch, 0 percent skew |
    | 6 | `min_file_count: 10`, approved | 2 `ADD FILE` statements ran. `sqlcmd`: **8 to 10 data files**, both new ones 32 MB on 64 MB growth, `reverify` 0 rows |
    | 7 | `tempdev` grown to 48 MB, then `skew_tolerance_pct: 90` | 0 actions on a tempdb at 33 percent skew, which proves the tolerance gates detection |
    | 8 | the same state at tolerance 20, approved, with `tempdev` grown to 96 MB by another session during the pause | the 9 planned grows landed at 48 MB, then `reverify` returned `files=10 min=48MB max=96MB skew=50pct` and `remediation_failed` **failed the run**. The `errors` block posted to Slack |
    | 9 | unreachable host | `state_before` failed on the TCP connection and the `errors` block posted to Slack |
    | 10 | `FILEGROWTH` set to 10 percent on one file, tolerance 90 | 0 actions. That file was reported as `growth=percent`, which shows a growth increment on its own never triggers detection |
    | 11 | the same state at tolerance 20 | 9 flagged at a common target of 96 MB |
    | 12 | run 11 approved | 9 `MODIFY FILE` statements ran. `sqlcmd`: **all 10 files 96 MB, skew 50 to 0 percent**, the percent growth file converted to a fixed 64 MB increment, `reverify` 0 rows |

    Across all twelve runs `w35app` held its mismatched 8 MB and 48 MB data files
    on 10 percent growth, unchanged, which is the proof that the
    `database_id = 2` scoping held.

    ## Prerequisites

    - A SQL Server instance you can reach over JDBC. The audit reads instance
      wide catalog views, so any database context works.
    - A login that can read `tempdb.sys.database_files`, which needs the `public`
      role in tempdb. Remediation needs `ALTER` on tempdb. `sysadmin` covers both.
    - Free space on the tempdb volume for the growth the plan reports. The flow
      reports the target size before anything runs.
    - A Slack incoming webhook.

    ### Secrets

    - `SQLSERVER_PASSWORD`: password for the login in `user`. The `password` input
      defaults to this secret.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook, used by `alert` and the
      `errors` block.
    - In Kestra OSS, provide each one as a base64-encoded environment variable
      prefixed `SECRET_`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `url` | `jdbc:sqlserver://localhost:1433` | SQL Server instance to check |
    | `user` | `sa` | SQL Server login |
    | `password` | `{{ secret('SQLSERVER_PASSWORD') }}` | Password for the login |
    | `skew_tolerance_pct` | `20` | Flag tempdb at or over this size skew |
    | `min_file_count` | `4` | Flag tempdb below this data file count |
    | `min_file_size_mb` | `64` | Floor for the common target size |
    | `growth_mb` | `64` | Fixed `FILEGROWTH` left on every data file |
    | `auto_remediate` | `false` | Allow the statements to run |
    | `dry_run` | `true` | Must be `false` for a statement to run |

    ## Quick start

    1. Add the `SQLSERVER_PASSWORD` and `SLACK_WEBHOOK_URL` secrets.
    2. Import the flow, set `url` and `user`, then run it once with the defaults
       and read the skew and the file count out of the log.
    3. Set `min_file_count` from the instance. One file per logical core up to
       eight is the usual starting point.
    4. Set `min_file_size_mb` to the size each file should hold, then check free
       space on the tempdb volume against the target the log reports.
    5. Run with `auto_remediate: true` and `dry_run: false` and approve the
       pause. Plan a restart later if you want the new layout to also be the
       starting layout.
    6. Enable the `weekly` trigger, which always runs in safe mode.

    ## How to extend

    - Join `sys.dm_os_wait_stats` into the audit and report the `PAGELATCH_UP`
      wait time next to the skew, so the report carries the symptom as well as
      the configuration.
    - Read `sys.dm_db_file_space_usage` to split tempdb usage into user objects,
      internal objects and the version store, which says whether more files is
      even the right answer for this workload.
    - Add a free space check on the tempdb volume from
      `sys.dm_os_volume_stats` and refuse the plan when the growth would not fit.
    - Drive many instances from one run by making `url` a list and looping the
      audit, keeping the remediation loop serial per instance.
    - Fold in a `REMOVE FILE` path for an instance that has too many tempdb
      files, remembering that it needs the file emptied first with
      `DBCC SHRINKFILE ... EMPTYFILE` and usually a restart.

