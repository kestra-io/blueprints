id: elasticsearch-unassigned-shards-auto-reroute
namespace: company.team

description: |
  Monitors Elasticsearch cluster shard allocations, identifies unassigned or retry-exhausted
  replica/primary shards causing yellow or red cluster health, executes an automated reroute
  with retry_failed=true, waits for peer-recovery allocation to complete, verifies cluster health
  restoration, and alerts Slack on recovery or escalates if shards remain unassigned.

inputs:
  - id: elasticsearch_url
    type: STRING
    displayName: Elasticsearch Endpoint URL
    description: Base URL of the Elasticsearch or OpenSearch cluster REST API.
    defaults: "https://elasticsearch.internal:9200"

  - id: cluster_auth_secret
    type: STRING
    displayName: Basic Auth / Token Secret Name
    description: Name of Kestra secret containing HTTP Basic auth header value (e.g. Basic dXNlcjpwYXNz).
    defaults: "ELASTICSEARCH_AUTH_HEADER"

  - id: max_unassigned_threshold
    type: INT
    displayName: Unassigned Shards Threshold
    description: Threshold of unassigned shards required to trigger automated reroute remediation.
    defaults: 1
    min: 1
    max: 100

  - id: peer_recovery_wait_seconds
    type: INT
    displayName: Peer Recovery Wait (seconds)
    description: Seconds to wait after triggering reroute before evaluating cluster health recovery.
    defaults: 30
    min: 10
    max: 300

  - id: dry_run
    type: BOOL
    displayName: Dry Run
    description: When true, audits unassigned shards and root causes without triggering reroute.
    defaults: true

variables:
  slack_webhook: "{{ secret('SLACK_WEBHOOK_URL') }}"

tasks:
  - id: check_cluster_health
    type: io.kestra.plugin.scripts.shell.Commands
    description: Query Elasticsearch _cluster/health and _cat/shards to detect unassigned shards.
    commands:
      - |
        set -e
        ES_URL="{{ inputs.elasticsearch_url }}"
        AUTH_HEADER="{{ secret(inputs.cluster_auth_secret) }}"

        # Probe cluster health
        HEALTH_RESP=$(curl -sk -H "Authorization: ${AUTH_HEADER}" -H "Content-Type: application/json" "${ES_URL}/_cluster/health" 2>/dev/null || echo "{}")
        STATUS=$(echo "${HEALTH_RESP}" | grep -o '"status":"[^"]*"' | cut -d'"' -f4 || echo "unknown")
        UNASSIGNED=$(echo "${HEALTH_RESP}" | grep -o '"unassigned_shards":[0-9]*' | cut -d':' -f2 || echo "0")

        if [ -z "${UNASSIGNED}" ]; then
          UNASSIGNED=0
        fi

        echo "Elasticsearch cluster status is [${STATUS}] with ${UNASSIGNED} unassigned shard(s)."

        # Fetch detailed unassigned shards if count > 0
        UNASSIGNED_DETAILS=""
        if [ "${UNASSIGNED}" -gt 0 ]; then
          UNASSIGNED_DETAILS=$(curl -sk -H "Authorization: ${AUTH_HEADER}" "${ES_URL}/_cat/shards?h=index,shard,prirep,state,unassigned.reason" 2>/dev/null | grep -i "UNASSIGNED" | head -n 10 || true)
          echo "Sample unassigned shards:"
          echo "${UNASSIGNED_DETAILS}"
        fi

        echo "::{ \"outputs\": { \"cluster_status\": \"${STATUS}\", \"unassigned_shards\": ${UNASSIGNED} } }::"

  - id: check_remediation_needed
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.check_cluster_health.vars.unassigned_shards | int >= inputs.max_unassigned_threshold }}"
    then:
      - id: evaluate_dry_run
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.dry_run == false }}"
        then:
          - id: trigger_reroute_retry
            type: io.kestra.plugin.scripts.shell.Commands
            description: Trigger Elasticsearch cluster reroute with retry_failed=true to re-allocate shards.
            commands:
              - |
                set -e
                ES_URL="{{ inputs.elasticsearch_url }}"
                AUTH_HEADER="{{ secret(inputs.cluster_auth_secret) }}"

                echo "Issuing POST _cluster/reroute?retry_failed=true to kick off shard allocations..."
                REROUTE_RESP=$(curl -sk -X POST -H "Authorization: ${AUTH_HEADER}" -H "Content-Type: application/json" "${ES_URL}/_cluster/reroute?retry_failed=true" 2>/dev/null)
                ACK=$(echo "${REROUTE_RESP}" | grep -o '"acknowledged":true' || echo "")

                if [ -n "${ACK}" ]; then
                  echo "Reroute command acknowledged successfully by master node."
                else
                  echo "Reroute response: ${REROUTE_RESP}"
                fi

          - id: wait_for_peer_recovery
            type: io.kestra.plugin.core.flow.Sleep
            duration: "PT{{ inputs.peer_recovery_wait_seconds }}S"

          - id: verify_shard_allocation
            type: io.kestra.plugin.scripts.shell.Commands
            description: Query cluster health again to verify whether all unassigned shards cleared.
            commands:
              - |
                set -e
                ES_URL="{{ inputs.elasticsearch_url }}"
                AUTH_HEADER="{{ secret(inputs.cluster_auth_secret) }}"

                POST_HEALTH=$(curl -sk -H "Authorization: ${AUTH_HEADER}" -H "Content-Type: application/json" "${ES_URL}/_cluster/health" 2>/dev/null || echo "{}")
                POST_STATUS=$(echo "${POST_HEALTH}" | grep -o '"status":"[^"]*"' | cut -d'"' -f4 || echo "unknown")
                STILL_UNASSIGNED=$(echo "${POST_HEALTH}" | grep -o '"unassigned_shards":[0-9]*' | cut -d':' -f2 || echo "0")

                if [ -z "${STILL_UNASSIGNED}" ]; then
                  STILL_UNASSIGNED=0
                fi

                echo "Post-reroute cluster status: [${POST_STATUS}] with ${STILL_UNASSIGNED} unassigned shard(s)."
                echo "::{ \"outputs\": { \"post_status\": \"${POST_STATUS}\", \"remaining_unassigned\": ${STILL_UNASSIGNED} } }::"

          - id: notify_remediation_outcome
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.verify_shard_allocation.vars.remaining_unassigned | int == 0 }}"
            then:
              - id: notify_remediation_success
                type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
                url: "{{ vars.slack_webhook }}"
                payload: |
                  {"text": "✅ *Elasticsearch cluster self-healing succeeded* — all `{{ outputs.check_cluster_health.vars.unassigned_shards }}` unassigned shards successfully allocated via automated reroute. Cluster status restored to `{{ outputs.verify_shard_allocation.vars.post_status }}`."}
            else:
              - id: notify_shard_escalation
                type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
                url: "{{ vars.slack_webhook }}"
                payload: |
                  {"text": "🔴 *Elasticsearch shard escalation required* — `{{ outputs.verify_shard_allocation.vars.remaining_unassigned }}` shard(s) remain unassigned after reroute retry. Disk watermark limits, corrupt translogs, or missing primary copies require cluster administrator inspection."}
        else:
          - id: notify_dry_run_findings
            type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
            url: "{{ vars.slack_webhook }}"
            payload: |
              {"text": "⚠️ *Elasticsearch unassigned shards detected (dry run)* — `{{ outputs.check_cluster_health.vars.unassigned_shards }}` shard(s) in unassigned state (cluster status: `{{ outputs.check_cluster_health.vars.cluster_status }}`). Run with `dry_run=false` to execute automated `_cluster/reroute?retry_failed=true`."}
    else:
      - id: notify_cluster_healthy
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ vars.slack_webhook }}"
        payload: |
          {"text": "✅ *Elasticsearch shard health OK* — cluster status is `{{ outputs.check_cluster_health.vars.cluster_status }}` with 0 unassigned shards."}

errors:
  - id: alert_flow_error
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    url: "{{ vars.slack_webhook }}"
    payload: |
      {"text": "🔴 *Elasticsearch auto-reroute flow failed* — execution `{{ execution.id }}` encountered an error connecting to cluster endpoint. Check Kestra logs."}

triggers:
  - id: periodic_shard_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    disabled: true

extend:
  title: "Elasticsearch Unassigned Shards Auto-Reroute and Recovery"
  description: |
    Monitors Elasticsearch cluster health, detects unassigned primary or replica shards,
    automatically triggers cluster reroute with retry_failed=true to clear transient allocation
    locks, pauses for peer recovery, confirms shard resolution, and alerts Slack.

    ## How it works

    1. `check_cluster_health` queries the `GET /_cluster/health` API endpoint to parse cluster
       status (`green`, `yellow`, `red`) and count total unassigned shards. If unassigned shards
       are detected, it samples diagnostic failure reasons from `GET /_cat/shards`.
    2. `check_remediation_needed` tests whether unassigned count is greater than or equal to
       `inputs.max_unassigned_threshold`.
       - If zero unassigned shards exist, `notify_cluster_healthy` confirms healthy cluster state.
       - If unassigned shards exist and `dry_run=true`, `notify_dry_run_findings` issues a warning
         with diagnostic counts.
       - If unassigned shards exist and `dry_run=false`, `trigger_reroute_retry` calls
         `POST /_cluster/reroute?retry_failed=true` to reset maximum allocation retry counters
         and instruct the master node to attempt immediate shard placement.
    3. `wait_for_peer_recovery` pauses execution for `peer_recovery_wait_seconds` to give nodes
       time to transfer shard data over the internal transport network.
    4. `verify_shard_allocation` re-queries `GET /_cluster/health` to confirm whether unassigned
       shards were reduced to 0.
    5. `notify_remediation_outcome` branches on post-reroute shard counts:
       - If count is 0, `notify_remediation_success` reports successful self-healing to Slack.
       - If shards remain unassigned, `notify_shard_escalation` flags persistent issues (such as
         high disk watermark saturation, missing nodes, or index corrupted segments).
    6. `alert_flow_error` catches execution failures with direct execution context.
    7. `periodic_shard_audit` runs on a 10-minute cron interval, shipped disabled by default.

    ## What you get

    - Automated resolution of transient shard allocation failures following node restarts,
      network blips, or master elections.
    - Shorter Mean Time to Recovery (MTTR) preventing yellow clusters from degenerating into red outages.
    - Closed-loop verification distinguishing temporary allocation stalls from permanent disk/index corruption.
    - Non-disruptive dry-run mode for pre-production validation.

    ## Who it's for

    - Data Platform, Database, and Search Infrastructure engineers managing self-hosted Elasticsearch or OpenSearch clusters.

    ## Why orchestrate this with Kestra

    - Declarative workflow replacing brittle cron bash scripts with auditable execution histories.
    - Built-in credential masking protecting Elasticsearch administrative tokens.
    - Reliable branching for automated remediation and human escalation.

    ## Prerequisites

    - Network connectivity from Kestra workers to the Elasticsearch cluster REST API.
    - Administrative permissions to call `_cluster/health`, `_cat/shards`, and `_cluster/reroute`.
    - A Slack incoming webhook configured as a secret.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alerting.
    - The secret specified by `cluster_auth_secret` (default `ELASTICSEARCH_AUTH_HEADER`):
      `Basic <base64-encoded user:password>` or `ApiKey <base64-encoded api-key>`.

    ## Quick start

    1. Store your Elasticsearch credentials in the designated secret.
    2. Import this blueprint and execute with `dry_run=true` to verify connectivity.
    3. Enable the scheduled trigger once verified.

    ## How to extend

    - Add an Elasticsearch index allocation explain task (`GET /_cluster/allocation/explain`)
      to attach full JSON diagnostic traces to Slack escalation payloads.
    - Integrate with PagerDuty for high-priority incidents when cluster status drops to `red`.

    ## Links

    - [Elasticsearch Cluster Reroute Documentation](https://www.elastic.co/guide/en/elasticsearch/reference/current/cluster-reroute.html)
    - [Elasticsearch Cluster Health API](https://www.elastic.co/guide/en/elasticsearch/reference/current/cluster-health.html)

  tags:
    - Data
    - Infrastructure
  subTags:
    - Self-Healing
    - Database Operations
  ee: false
  demo: false
