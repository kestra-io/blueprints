id: kubernetes-orphaned-headless-endpoints-sentinel
namespace: company.sre

inputs:
  - id: kube_context
    type: STRING
    required: false
    description: Optional Kubernetes context name.
  - id: orphaned_threshold
    type: INT
    defaults: 0
    description: Maximum acceptable count of headless services with zero ready backend endpoints.

tasks:
  - id: audit_headless_endpoints
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: bitnami/kubectl:latest
    commands:
      - |
        CONTEXT_ARG=""
        if [ -n "{{ inputs.kube_context }}" ]; then
          CONTEXT_ARG="--context={{ inputs.kube_context }}"
        fi
        
        kubectl $CONTEXT_ARG get services -A -o json > /tmp/services.json
        kubectl $CONTEXT_ARG get endpoints -A -o json > /tmp/endpoints.json
        
        HEADLESS_SERVICES=$(jq '[.items[] | select(.spec.clusterIP == "None" and (.spec.selector | length > 0)) | {namespace: .metadata.namespace, name: .metadata.name}]' /tmp/services.json)
        
        ORPHANED_LIST=$(jq -n --argjson svc "$HEADLESS_SERVICES" --slurpfile ep /tmp/endpoints.json '
          [ $svc[] | . as $s | 
            ($ep[0].items[] | select(.metadata.namespace == $s.namespace and .metadata.name == $s.name)) as $e |
            select(($e.subsets // []) | map(.addresses // [] | length) | add // 0 == 0) |
            {namespace: $s.namespace, service: $s.name, reason: "Zero ready endpoint addresses"}
          ]
        ')
        
        ORPHANED_COUNT=$(echo "$ORPHANED_LIST" | jq 'length')
        
        echo "::set-output name=orphaned_count::$ORPHANED_COUNT::"
        echo "::set-output name=orphaned_details::$ORPHANED_LIST::"

  - id: evaluate_endpoint_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_headless_endpoints.vars.orphaned_count | int > inputs.orphaned_threshold }}"
    then:
      - id: notify_network_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#infrastructure-alerts",
            "attachments": [
              {
                "color": "warning",
                "title": "⚠️ Kubernetes Orphaned Headless Service Endpoints Alert",
                "text": "Detected *{{ outputs.audit_headless_endpoints.vars.orphaned_count }}* headless Service(s) with *zero ready backend endpoints*. Orphaned services: {{ outputs.audit_headless_endpoints.vars.orphaned_details }}. Impact: DNS lookups for these headless services will return NXDOMAIN or empty SRV/A records, breaking internal RPC routing.",
                "footer": "Kestra SRE Orchestrator • Endpoints Sentinel"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#infrastructure-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Headless Endpoints Sentinel Execution Failed",
            "text": "The Kubernetes headless service audit encountered an execution error. Please check cluster RBAC permissions for services and endpoints.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true

extend:
  title: Kubernetes Headless Service Orphaned Endpoints and DNS Resolution Sentinel
  shortDescription: Audits Kubernetes headless services to detect orphaned endpoints with zero healthy backend pods breaking internal DNS discovery.
  description: |
    ## How it works
    This workflow audits all Kubernetes Services configured as headless (`clusterIP: None` with active pod selectors) across all namespaces. It cross-references them against corresponding `Endpoints` objects to ensure backend pods are registered and ready. Headless services with zero addresses cause CoreDNS resolution failures for peer discovery in distributed systems (e.g., Elasticsearch, ZooKeeper, Redis Sentinel). Violations trigger a formatted Slack alert.

    ## What you get
    - Proactive auditing of service discovery routing tables.
    - Rapid identification of misconfigured pod label selectors or completely crashed daemon pods.
    - Prevents catastrophic internal RPC and peer gossip network partitions.

    ## Who it's for
    - Kubernetes Network Engineers and SREs supporting service meshes and internal microservice communication.
    - Developers deploying clustered stateful services relying on headless service DNS discovery.

    ## Why orchestrate this with Kestra
    - **Reliable Automation**: Schedule continuous health checks without manual intervention.
    - **Rich Tooling Integration**: Combine native shell tools like `kubectl` and `jq` with complete workflow logging and monitoring.
    - **Enterprise Extensibility**: Easily route alerts to PagerDuty or Opsgenie.

    ## Prerequisites
    - Cluster RBAC permissions allowing `get` and `list` on `services` and `endpoints`.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Add the `SLACK_WEBHOOK` secret.
    3. Execute the workflow to identify orphaned headless services in your cluster.

    ## How to extend
    - Add a step to inspect the associated Deployment or StatefulSet spec to verify if pod replicas were scaled to zero intentionally.
    - Generate Prometheus metrics from output variables.

    ## Links
    - [Kubernetes Headless Services Documentation](https://kubernetes.io/docs/concepts/services-networking/service/#headless-services)
    - [Kestra Workflow Concepts](https://kestra.io/docs/workflow-components)
  tags:
    - Infrastructure
    - Cloud
  ee: false
  demo: false
