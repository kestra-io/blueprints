id: aws-s3-bucket-lifecycle-expiration-audit-sentinel
namespace: company.team

inputs:
  - id: bucket_name
    type: STRING
    description: Amazon S3 bucket name to audit for lifecycle rules.

tasks:
  - id: audit_s3_lifecycle
    type: io.kestra.plugin.aws.cli.AwsCLI
    region: "us-east-1"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        set -euo pipefail

        ERR_FILE=/tmp/s3_err.txt
        if ! aws s3api get-bucket-lifecycle-configuration --bucket "{{ inputs.bucket_name }}" --output json > /tmp/s3_lifecycle.json 2> "$ERR_FILE"; then
          if grep -q "NoSuchLifecycleConfiguration" "$ERR_FILE"; then
            echo '{"Rules":[]}' > /tmp/s3_lifecycle.json
          else
            echo "ERROR: Failed to query S3 lifecycle configuration for bucket {{ inputs.bucket_name }}:" >&2
            cat "$ERR_FILE" >&2
            exit 1
          fi
        fi

        RULES_COUNT=$(jq '.Rules | length // 0' /tmp/s3_lifecycle.json)
        ACTIVE_EXPIRATIONS=$(jq '[.Rules[]? | select(.Status == "Enabled" and (.Expiration != null or .NoncurrentVersionExpiration != null))] | length // 0' /tmp/s3_lifecycle.json)

        echo "::set-output name=rules_count::${RULES_COUNT:-0}::"
        echo "::set-output name=active_expirations::${ACTIVE_EXPIRATIONS:-0}::"

  - id: evaluate_lifecycle_compliance
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_s3_lifecycle.vars.active_expirations | int == 0 }}"
    then:
      - id: notify_finops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#finops-cost-alerts",
            "attachments": [
              {
                "color": "warning",
                "title": "⚠️ AWS S3 Bucket Missing Lifecycle Expiration Rules Alert",
                "text": "S3 bucket `{{ inputs.bucket_name }}` has *no active object expiration or version cleanup lifecycle rules* (active expirations: {{ outputs.audit_s3_lifecycle.vars.active_expirations }}). Impact: Old object versions, aborted multipart uploads, and expired temporary files accumulate indefinitely, incurring mounting monthly storage costs.",
                "footer": "Kestra FinOps Sentinel • AWS S3 Lifecycle"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#finops-cost-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ S3 Lifecycle Sentinel Execution Failed",
            "text": "The S3 bucket lifecycle audit query encountered an error. Please verify AWS credentials and s3:GetLifecycleConfiguration permissions.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * 1"
    disabled: true

extend:
  metaDescription: "Audits Amazon S3 bucket configurations to detect missing lifecycle expiration rules and unmanaged historical storage bloat."
  metaTitle: AWS S3 Bucket Lifecycle Expiration Policy and Storage Cost Sentinel with Kestra
  title: AWS S3 Bucket Lifecycle Expiration Policy and Storage Cost Sentinel
  shortDescription: Audits Amazon S3 bucket configurations to detect missing lifecycle expiration rules and unmanaged historical storage bloat.
  description: |
    ## How it works
    This workflow uses the official AWS CLI plugin to query `aws s3api get-bucket-lifecycle-configuration` for target S3 storage buckets. It audits whether active object expiration rules or noncurrent version expiration policies are in place. Buckets storing unmanaged log files, staging data, or versioned artifacts without lifecycle rules accumulate indefinite data volume over time. Missing policies trigger an automated FinOps alert to Slack.

    ## What you get
    - Proactive storage lifecycle compliance verification.
    - Prevents runaway AWS S3 Standard storage billing overruns.
    - Actionable recommendations to configure automatic transition to S3 Glacier or delete expired objects.

    ## Who it's for
    - FinOps Managers and Cloud Storage Engineers optimizing AWS storage spending.
    - DevOps and Data Platform teams governing data retention across data lake buckets.

    ## Why orchestrate this with Kestra
    - **Native AWS Integration**: Uses official `io.kestra.plugin.aws.cli.AwsCLI` with secure credentials injection.
    - **Scheduled Compliance Audits**: Automate weekly or monthly retention verifications without manual spreadsheets.
    - **Extensible Workflows**: Chain with automated S3 lifecycle configuration updates.

    ## Prerequisites
    - AWS IAM credentials with `s3:GetLifecycleConfiguration` permissions for target buckets.
    - Secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Provide your target S3 bucket name and AWS credentials.
    3. Run the workflow to inspect bucket lifecycle rule compliance.

    ## How to extend
    - Iterate across all account S3 buckets using `aws s3api list-buckets`.
    - Apply standard lifecycle templates automatically using `aws s3api put-bucket-lifecycle-configuration`.

    ## Links
    - [Amazon S3 Lifecycle Management Documentation](https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lifecycle-mgmt.html)
    - [Kestra AWS Plugin](https://kestra.io/plugins/plugin-aws)
  tags:
    - Cloud
    - Business
  subTags:
    - Policy & Compliance
    - AWS Services
  ee: false
  demo: false
