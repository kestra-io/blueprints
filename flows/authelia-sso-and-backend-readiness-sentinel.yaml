id: authelia-sso-and-backend-readiness-sentinel
namespace: company.team

description: |
  Continuously monitors Authelia Single Sign-On (SSO) and Multi-Factor Authentication (MFA) instances by probing API health and authentication engine state, validating Redis session storage and backend database connectivity, classifying operational posture, routing real-time Slack incident alerts, and logging compliance audit records.

inputs:
  - id: authelia_host
    type: STRING
    displayName: Authelia Host
    description: Hostname or IP address of the Authelia instance reachable by the Kestra worker.
    defaults: "localhost"

  - id: authelia_port
    type: INT
    displayName: Authelia Port
    description: HTTP port of the Authelia service (defaults to 9091).
    defaults: 9091

  - id: authelia_scheme
    type: STRING
    displayName: Protocol Scheme
    description: URI protocol scheme (http or https).
    defaults: "http"

  - id: expected_status
    type: STRING
    displayName: Expected Health Status
    description: Expected string value of the status attribute in Authelia /api/health response JSON.
    defaults: "ok"

tasks:
  - id: probe_health_endpoint
    type: io.kestra.plugin.core.http.Request
    description: Queries Authelia /api/health to audit process liveness and backend storage connectivity (Redis session store, PostgreSQL/MySQL/SQLite user storage).
    uri: "{{ inputs.authelia_scheme }}://{{ inputs.authelia_host }}:{{ inputs.authelia_port }}/api/health"
    method: GET
    headers:
      Accept: "application/json"
    options:
      allowFailed: true
    allowFailure: true

  - id: probe_state_endpoint
    type: io.kestra.plugin.core.http.Request
    description: Queries Authelia /api/state to verify authentication engine readiness and session provider state.
    uri: "{{ inputs.authelia_scheme }}://{{ inputs.authelia_host }}:{{ inputs.authelia_port }}/api/state"
    method: GET
    headers:
      Accept: "application/json"
    options:
      allowFailed: true
    allowFailure: true

  - id: classify_authelia_posture
    type: io.kestra.plugin.core.debug.Return
    description: Evaluates HTTP status codes and health JSON response attributes to classify cluster operational posture into HEALTHY_COMPLIANT, STORAGE_OR_BACKEND_DEGRADED, AUTH_ENGINE_UNREADY, or INSTANCE_UNREACHABLE.
    format: |
      {{ outputs.probe_health_endpoint.code is not defined or outputs.probe_state_endpoint.code is not defined ? 'INSTANCE_UNREACHABLE' : (outputs.probe_health_endpoint.code != 200 or not (((outputs.probe_health_endpoint.body | json | jq('.status') | first) ?? '') == inputs.expected_status) ? 'STORAGE_OR_BACKEND_DEGRADED' : (outputs.probe_state_endpoint.code != 200 ? 'AUTH_ENGINE_UNREADY' : 'HEALTHY_COMPLIANT')) }}

  - id: route_by_posture
    type: io.kestra.plugin.core.flow.Switch
    description: Routes alerts and logs based on the classified Authelia operational posture.
    value: "{{ outputs.classify_authelia_posture.value }}"
    cases:
      "HEALTHY_COMPLIANT":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "Authelia SSO instance at {{ inputs.authelia_scheme }}://{{ inputs.authelia_host }}:{{ inputs.authelia_port }} is HEALTHY_COMPLIANT. /api/health status: {{ outputs.probe_health_endpoint.code }} ({{ outputs.probe_health_endpoint.body | json | jq('.status') | first }}). /api/state: {{ outputs.probe_state_endpoint.code }}."

      "STORAGE_OR_BACKEND_DEGRADED":
        - id: alert_storage_degraded_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {"text": "Authelia Sentinel CRITICAL ALERT: Backend storage degraded on " ~ inputs.authelia_host ~ ":" ~ inputs.authelia_port ~ "! /api/health returned HTTP " ~ (outputs.probe_health_endpoint.code ?? 'NONE') ~ " (payload: " ~ (outputs.probe_health_endpoint.body ?? 'EMPTY') ~ "). Redis session storage, SQL database, or LDAP user provider connection failed. User logins blocked! Execution: " ~ execution.id ~ "."} | toJson }}

        - id: log_storage_degraded
          type: io.kestra.plugin.core.log.Log
          message: "CRITICAL: Authelia /api/health returned non-200 or degraded status: {{ outputs.probe_health_endpoint.code }}."

      "AUTH_ENGINE_UNREADY":
        - id: alert_auth_engine_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {"text": "Authelia Sentinel WARNING: Authentication engine unready on " ~ inputs.authelia_host ~ ":" ~ inputs.authelia_port ~ "! /api/state returned HTTP " ~ (outputs.probe_state_endpoint.code ?? 'NONE') ~ ". Portal is responding but authentication pipeline is unready. Execution: " ~ execution.id ~ "."} | toJson }}

        - id: log_auth_engine_unready
          type: io.kestra.plugin.core.log.Log
          message: "WARNING: Authelia /api/state returned non-200 code: {{ outputs.probe_state_endpoint.code }}."

      "INSTANCE_UNREACHABLE":
        - id: alert_unreachable_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {"text": "Authelia Sentinel OUTAGE: Cannot reach Authelia SSO at " ~ inputs.authelia_scheme ~ "://" ~ inputs.authelia_host ~ ":" ~ inputs.authelia_port ~ ". Container offline, network partitioned, or reverse-proxy connection refused. Execution: " ~ execution.id ~ "."} | toJson }}

        - id: log_unreachable
          type: io.kestra.plugin.core.log.Log
          message: "OUTAGE: Authelia instance unreachable at {{ inputs.authelia_scheme }}://{{ inputs.authelia_host }}:{{ inputs.authelia_port }}."

  - id: audit_summary
    type: io.kestra.plugin.core.output.OutputValues
    description: Exports structured telemetry attributes and endpoint verification metrics for compliance audit reporting.
    values:
      target_instance: "{{ inputs.authelia_scheme }}://{{ inputs.authelia_host }}:{{ inputs.authelia_port }}"
      health_http_code: "{{ outputs.probe_health_endpoint.code ?? 0 }}"
      health_payload_status: "{{ outputs.probe_health_endpoint.body | json | jq('.status') | first ?? 'NONE' }}"
      state_http_code: "{{ outputs.probe_state_endpoint.code ?? 0 }}"
      operational_posture: "{{ outputs.classify_authelia_posture.value }}"

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts on unexpected workflow runtime execution failure.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {"text": "Authelia Sentinel workflow failed unexpectedly during execution " ~ execution.id ~ " in namespace " ~ flow.namespace ~ "."} | toJson }}

triggers:
  - id: hourly_canary
    type: io.kestra.plugin.core.trigger.Schedule
    description: Executes automated Authelia health and readiness audit at the top of every hour. Shipped disabled.
    cron: "0 * * * *"
    disabled: true
    inputs:
      authelia_host: "localhost"
      authelia_port: 9091
      authelia_scheme: "http"
      expected_status: "ok"

extend:
  title: Authelia SSO Access Portal and Backend Readiness Sentinel
  metaTitle: Authelia SSO Access Portal and Backend Readiness Sentinel | Kestra
  shortDescription: Continuous health and readiness monitoring for Authelia SSO, Redis session storage, and automated Slack escalation.
  metaDescription: Audit Authelia SSO portal health, validate Redis session storage and backend database readiness, classify posture, and route Slack alerts via Kestra.
  description: |
    Continuously audits Authelia Single Sign-On (SSO) and Multi-Factor Authentication (MFA) portals by probing system health and authentication engine state, validating backend database and Redis session storage connectivity, classifying operational posture, and dispatching real-time incident escalation alerts to Slack.

    This blueprint was created by [Mohit Jeswani](https://github.com/mohitjeswani01).

    ## How it works

    1. `probe_health_endpoint` (`io.kestra.plugin.core.http.Request`) queries `/api/health` to verify that the Authelia server process is live and that its underlying session storage (Redis) and authentication database (PostgreSQL, MySQL, SQLite, or LDAP) are responsive.
    2. `probe_state_endpoint` (`io.kestra.plugin.core.http.Request`) queries `/api/state` to confirm that the authentication engine is fully initialized and serving user requests.
    3. `classify_authelia_posture` (`io.kestra.plugin.core.debug.Return`) evaluates endpoint response codes and JSON payload attributes using a declarative Pebble expression:
       - Classifies as `INSTANCE_UNREACHABLE` if endpoints cannot be reached over the network.
       - Classifies as `STORAGE_OR_BACKEND_DEGRADED` if `/api/health` returns non-200 or the JSON `status` attribute does not equal `expected_status` (indicates Redis session pool failure or database disconnection).
       - Classifies as `AUTH_ENGINE_UNREADY` if `/api/state` returns a non-200 status code.
       - Classifies as `HEALTHY_COMPLIANT` when both endpoints return HTTP 200 with matching status attributes.
    4. `route_by_posture` (`io.kestra.plugin.core.flow.Switch`) routes execution based on the classification:
       - `HEALTHY_COMPLIANT`: Logs successful audit confirmation with endpoint status codes.
       - `STORAGE_OR_BACKEND_DEGRADED`: Dispatches a critical Slack alert warning that Redis session storage or user databases are down and authentication is blocked.
       - `AUTH_ENGINE_UNREADY`: Alerts Slack that the authentication engine is in an unready state.
       - `INSTANCE_UNREACHABLE`: Notifies on-call teams of total portal unavailability.
    5. `audit_summary` (`io.kestra.plugin.core.output.OutputValues`) exports structured metrics capturing endpoint HTTP status codes and operational posture for compliance logging.
    6. `errors` sends a priority failure notification to Slack if unhandled workflow execution errors occur.

    ## What you get

    - Automated, continuous validation of critical SSO and MFA portals without relying on manual user login tests.
    - Early warning of Redis session store connection exhaustion and database outages before users are locked out of internal applications.
    - Protection against reverse-proxy forward-auth cascade failures across Traefik, NGINX, Envoy, and Caddy.
    - Contextual Slack alerts detailing exact endpoint failure codes, payload statuses, and target hostnames.
    - Auditable execution history satisfying SOC2 and ISO27001 identity and access management controls.

    ## Who it's for

    - Platform Engineers and SREs responsible for uptime and reliability of SSO authentication gateways.
    - Security Operations (SecOps) teams maintaining high-availability perimeter authentication.
    - DevOps Engineers managing self-hosted Docker or Kubernetes Authelia deployments.

    ## Why orchestrate this with Kestra

    Authelia acts as the security gateway for all internal web services, dashboards, and APIs. When Authelia or its session store fails, every reverse proxy forward-auth check fails, causing total company-wide access lockouts. Standard TCP port checks cannot verify whether Authelia's Redis session cache is operational or whether backend LDAP/SQL queries are succeeding. Kestra orchestrates multi-stage HTTP inspection, declarative Pebble classification, failure escalation to Slack, and centralized compliance audit trails in a single workflow.

    ## Prerequisites

    - A running Authelia instance (Docker container or Kubernetes pod).
    - An incoming Slack webhook URL for incident notifications.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Incoming Slack webhook URL used by `alert_storage_degraded_slack`, `alert_auth_engine_slack`, `alert_unreachable_slack`, and `alert_flow_failure`.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Start a local Authelia instance using Docker:
       ```bash
       docker run -d --name authelia -p 9091:9091 authelia/authelia:latest
       ```
    3. Import this blueprint into Kestra and click **Execute** with default inputs (`authelia_host: "localhost"`).
    4. Confirm that `classify_authelia_posture` classifies `HEALTHY_COMPLIANT` and inspect the structured telemetry in `audit_summary`.
    5. Enable the `hourly_canary` schedule to automate continuous SSO health monitoring.

    ## How to extend

    - Add simulated user authentication testing using `io.kestra.plugin.core.http.Request` to perform a mock 1FA credential submission.
    - Integrate PagerDuty or Opsgenie alerts for out-of-hours on-call paging during `INSTANCE_UNREACHABLE` or `STORAGE_OR_BACKEND_DEGRADED` incidents.
    - Expand multi-cluster monitoring by looping over an array of Authelia edge instances using `io.kestra.plugin.core.flow.ForEach`.

    ## Links

    - [Authelia Documentation](https://www.authelia.com/docs/)
    - [Authelia GitHub Repository](https://github.com/authelia/authelia)
    - [Authelia Health Check Reference](https://www.authelia.com/reference/guides/health-checks/)
    - [Kestra HTTP Plugin](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Business
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  demo: false
