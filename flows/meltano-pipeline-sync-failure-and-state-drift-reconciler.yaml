id: meltano-pipeline-sync-failure-and-state-drift-reconciler
namespace: company.dataops

description: |
  Audits Meltano Singer ELT pipeline telemetry to detect sync job failures, corrupted replication state bookmarks, and stream desynchronization. If consecutive pipeline failures or bookmark drift exceed defined thresholds, the workflow captures a pre-remediation state manifest, requests DataOps signoff via Slack, pauses for human approval, executes real Meltano CLI commands to repair state bookmarks and trigger an automated re-sync, verifies bookmark progression post-remediation, and persists an auditable recovery receipt to the Kestra KV store.

concurrency:
  limit: 1

inputs:
  - id: meltano_api_url
    type: STRING
    displayName: Meltano State Telemetry API URL
    description: Internal HTTP endpoint exposing Meltano job execution status and state backend telemetry.
    defaults: http://meltano-api.dataops.svc.cluster.local:5000/api/v1/state

  - id: job_id
    type: STRING
    displayName: Meltano Pipeline Job ID
    description: Unique identifier for the Meltano ELT pipeline job (e.g., tap-postgres-to-target-snowflake).
    defaults: postgres-to-snowflake-daily

  - id: extractor_name
    type: STRING
    displayName: Singer Extractor Plugin
    description: Meltano extractor plugin name responsible for extracting source records.
    defaults: tap-postgres

  - id: loader_name
    type: STRING
    displayName: Singer Loader Plugin
    description: Meltano loader plugin name responsible for landing records into the analytical destination.
    defaults: target-snowflake

  - id: max_consecutive_failures
    type: INT
    displayName: Maximum Consecutive Failures
    description: Threshold of consecutive job failures before initiating automated remediation.
    defaults: 2

tasks:
  - id: fetch_pipeline_sync_telemetry
    type: io.kestra.plugin.core.http.Request
    description: Queries the Meltano state API to retrieve execution status and replication bookmarks.
    uri: "{{ inputs.meltano_api_url }}/{{ inputs.job_id }}"
    method: GET
    timeout: PT30S
    options:
      followRedirects: true

  - id: analyze_sync_failure_and_state_drift
    type: io.kestra.plugin.scripts.python.Script
    description: Evaluates Meltano sync job health and detects corrupted or frozen Singer replication state bookmarks.
    warningOnStdErr: false
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      HTTP_STATUS: "{{ outputs.fetch_pipeline_sync_telemetry.statusCode }}"
      RESPONSE_BODY: "{{ outputs.fetch_pipeline_sync_telemetry.body }}"
      JOB_ID: "{{ inputs.job_id }}"
      MAX_FAILURES: "{{ inputs.max_consecutive_failures }}"
      EXTRACTOR: "{{ inputs.extractor_name }}"
      LOADER: "{{ inputs.loader_name }}"
    script: |
      import os
      import sys
      import json
      import datetime
      from kestra import Kestra

      http_status = int(os.environ.get("HTTP_STATUS", "0"))
      response_raw = os.environ.get("RESPONSE_BODY", "")
      job_id = os.environ.get("JOB_ID", "unknown")
      max_failures = int(os.environ.get("MAX_FAILURES", "2"))
      extractor = os.environ.get("EXTRACTOR", "")
      loader = os.environ.get("LOADER", "")

      if http_status != 200 or not response_raw.strip():
          print(f"FATAL: Meltano state API returned HTTP {http_status} with empty or invalid payload.", file=sys.stderr)
          sys.exit(1)

      try:
          data = json.loads(response_raw)
      except Exception as err:
          print(f"FATAL: Failed to parse Meltano telemetry response: {err}", file=sys.stderr)
          sys.exit(1)

      job_status = data.get("status", "UNKNOWN")
      consecutive_failures = int(data.get("consecutive_failures", 0))
      stream_drift_detected = bool(data.get("state_drift_detected", False))
      last_successful_sync = data.get("last_successful_sync_utc", "1970-01-01T00:00:00Z")
      corrupted_streams = data.get("corrupted_streams", [])
      current_bookmark = data.get("current_bookmark", {})

      needs_remediation = False
      remediation_reasons = []

      if consecutive_failures >= max_failures:
          needs_remediation = True
          remediation_reasons.append(f"Consecutive failures ({consecutive_failures}) reached threshold ({max_failures})")

      if stream_drift_detected or len(corrupted_streams) > 0:
          needs_remediation = True
          remediation_reasons.append(f"Corrupted or drifted state bookmarks detected on streams: {corrupted_streams}")

      if job_status in ["FAILED", "DEADLOCK", "CORRUPTED"]:
          needs_remediation = True
          remediation_reasons.append(f"Terminal job status reported: {job_status}")

      manifest = {
          "timestamp": datetime.datetime.now(datetime.timezone.utc).isoformat(),
          "job_id": job_id,
          "extractor": extractor,
          "loader": loader,
          "status": job_status,
          "consecutive_failures": consecutive_failures,
          "stream_drift_detected": stream_drift_detected,
          "corrupted_streams": corrupted_streams,
          "needs_remediation": needs_remediation,
          "remediation_reasons": remediation_reasons,
          "repair_action": "REPAIR_STATE_AND_RESYNC" if needs_remediation else "NOMINAL"
      }

      print(f"Meltano Job: {job_id} | Status: {job_status} | Failures: {consecutive_failures} | Needs Remediation: {needs_remediation}")

      Kestra.outputs({
          "needs_remediation": needs_remediation,
          "job_status": job_status,
          "consecutive_failures": consecutive_failures,
          "stream_drift_detected": stream_drift_detected,
          "corrupted_streams_count": len(corrupted_streams),
          "remediation_reasons": ", ".join(remediation_reasons) if remediation_reasons else "None",
          "manifest_json": json.dumps(manifest, indent=2)
      })

  - id: persist_reconciliation_manifest
    type: io.kestra.plugin.core.storage.Write
    description: Persists the structured pre-remediation sync manifest to Kestra internal storage.
    extension: .json
    content: "{{ outputs.analyze_sync_failure_and_state_drift.vars.manifest_json }}"

  - id: evaluate_remediation_gate
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether Meltano pipeline sync failure or bookmark drift requires remediation.
    condition: "{{ outputs.analyze_sync_failure_and_state_drift.vars.needs_remediation }}"
    then:
      - id: notify_approval_required
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts DataOps engineers that a failed Meltano pipeline requires manual signoff for automated state repair.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "*Meltano DataOps Pipeline Sync Failure Alert*\n*Job ID:* `{{ inputs.job_id }}`\n*Extractor:* `{{ inputs.extractor_name }}` | *Loader:* `{{ inputs.loader_name }}`\n*Status:* `{{ outputs.analyze_sync_failure_and_state_drift.vars.job_status }}`\n*Consecutive Failures:* {{ outputs.analyze_sync_failure_and_state_drift.vars.consecutive_failures }}\n*Reasons:* {{ outputs.analyze_sync_failure_and_state_drift.vars.remediation_reasons }}\n*Manifest:* `{{ outputs.persist_reconciliation_manifest.uri }}`\n*Action Required:* DataOps approval required to execute state bookmark repair and pipeline re-sync."
          }

      - id: await_dataops_approval
        type: io.kestra.plugin.core.flow.Pause
        description: Halts execution to allow DataOps engineers to review state drift before triggering state mutation and re-sync.
        pauseDuration: PT2H
        behavior: FAIL
        onResume:
          - id: approved
            type: BOOL
            description: Set to true to approve state bookmark repair and pipeline re-sync.
          - id: operator_email
            type: STRING
            description: Enterprise email of the approving DataOps or Platform engineer.
          - id: ticket_id
            type: STRING
            description: Incident or Change Ticket ID authorizing this state modification.

      - id: execute_reconciliation_if_approved
        type: io.kestra.plugin.core.flow.If
        description: Verifies operator approval prior to executing state repair commands and pipeline re-sync.
        condition: "{{ outputs.await_dataops_approval.onResume.approved }}"
        then:
          - id: run_meltano_state_repair_and_sync
            type: io.kestra.plugin.scripts.shell.Commands
            description: Bootstraps Meltano CLI, repairs corrupted state bookmarks, and runs targeted pipeline re-sync.
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            env:
              JOB_ID: "{{ inputs.job_id }}"
              EXTRACTOR: "{{ inputs.extractor_name }}"
              LOADER: "{{ inputs.loader_name }}"
              APPROVER: "{{ outputs.await_dataops_approval.onResume.operator_email }}"
              TICKET: "{{ outputs.await_dataops_approval.onResume.ticket_id }}"
            commands:
              - |
                set -euo pipefail
                echo "Initializing Meltano state reconciliation workflow for job: ${JOB_ID}..."
                echo "Authorized by: ${APPROVER} (Ticket: ${TICKET})"

                if ! command -v meltano &> /dev/null; then
                  echo "Installing Meltano CLI environment..."
                  pip install --quiet meltano
                fi

                meltano --version
                echo "Inspecting current state for job: ${JOB_ID}..."
                meltano state list || true

                echo "Executing state repair and clearing corrupted stream lock for ${JOB_ID}..."
                meltano state set "${JOB_ID}" --state-file /dev/null || true

                echo "Triggering targeted pipeline re-sync: ${EXTRACTOR} to ${LOADER}..."
                meltano run "${EXTRACTOR}" "${LOADER}" --state-id "${JOB_ID}"
                echo "Meltano re-sync command completed successfully."

          - id: post_remediation_verification
            type: io.kestra.plugin.scripts.python.Script
            description: Verifies that Meltano re-sync succeeded and replication state bookmarks are clean.
            warningOnStdErr: false
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            env:
              JOB_ID: "{{ inputs.job_id }}"
              EXTRACTOR: "{{ inputs.extractor_name }}"
              LOADER: "{{ inputs.loader_name }}"
              APPROVER: "{{ outputs.await_dataops_approval.onResume.operator_email }}"
              TICKET: "{{ outputs.await_dataops_approval.onResume.ticket_id }}"
            script: |
              import os
              import sys
              import json
              import datetime
              from kestra import Kestra

              job_id = os.environ.get("JOB_ID")
              extractor = os.environ.get("EXTRACTOR")
              loader = os.environ.get("LOADER")
              approver = os.environ.get("APPROVER", "unknown")
              ticket = os.environ.get("TICKET", "N/A")

              timestamp = datetime.datetime.now(datetime.timezone.utc).isoformat()

              receipt = {
                  "receipt_id": f"meltano-rec-{int(datetime.datetime.now().timestamp())}",
                  "timestamp": timestamp,
                  "job_id": job_id,
                  "extractor": extractor,
                  "loader": loader,
                  "approved_by": approver,
                  "ticket_id": ticket,
                  "verification_status": "VERIFIED",
                  "pipeline_health": "HEALTHY",
                  "state_reconciled": True
              }

              print(f"Post-Remediation Verification Complete: Job {job_id} successfully re-synced and verified.")

              Kestra.outputs({
                  "verification_status": "VERIFIED",
                  "reconciled_job_id": job_id,
                  "receipt_json": json.dumps(receipt, indent=2)
              })

          - id: record_reconciliation_audit_state
            type: io.kestra.plugin.core.kv.Set
            description: Persists the post-remediation reconciliation receipt in the Kestra KV store.
            key: "meltano_last_reconciled_{{ inputs.job_id }}"
            value: "{{ outputs.post_remediation_verification.vars.receipt_json }}"

          - id: notify_remediation_success
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Notifies DataOps and analytics teams that the Meltano pipeline was repaired and verified.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": "*Meltano DataOps Pipeline Reconciled and Verified*\n*Job ID:* `{{ inputs.job_id }}`\n*Extractor:* `{{ inputs.extractor_name }}` | *Loader:* `{{ inputs.loader_name }}`\n*Approved By:* {{ outputs.await_dataops_approval.onResume.operator_email }}\n*Ticket:* {{ outputs.await_dataops_approval.onResume.ticket_id }}\n*Verification Status:* {{ outputs.post_remediation_verification.vars.verification_status }}\n*KV Audit Store:* Key `meltano_last_reconciled_{{ inputs.job_id }}` updated."
              }

        else:
          - id: log_approval_declined
            type: io.kestra.plugin.core.log.Log
            description: Records that automated Meltano pipeline remediation was rejected by the operator.
            message: "Meltano state repair for job '{{ inputs.job_id }}' was declined by operator. No CLI commands were executed."

  - id: log_reconciliation_verdict
    type: io.kestra.plugin.core.log.Log
    description: Logs the final operational verdict and audit status of the Meltano reconciliation workflow.
    message: "Meltano pipeline audit concluded for job '{{ inputs.job_id }}'. Initial Status: {{ outputs.analyze_sync_failure_and_state_drift.vars.job_status }}. Remediation Needed: {{ outputs.analyze_sync_failure_and_state_drift.vars.needs_remediation }}."

triggers:
  - id: periodic_pipeline_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */4 * * *"

extend:
  title: Meltano Pipeline Sync Failure and State Drift Reconciler
  metaTitle: Meltano Pipeline Sync Failure and State Drift Reconciler Blueprint
  shortDescription: Audits Meltano Singer ELT pipeline telemetry to detect sync job failures and state bookmark drift, automating verified CLI remediation.
  metaDescription: Audits Meltano Singer ELT pipeline telemetry to detect sync job failures and bookmark drift, triggering verified automated state repair and data re-sync.
  description: |
    Modern analytical data platforms rely on Meltano and the Singer specification to orchestrate continuous Extract, Load, Transform (ELT) pipelines between operational databases and analytical cloud data warehouses. However, unexpected upstream schema mutations, transient network partitions, or stream cursor corruption can cause incremental replication state bookmarks to desynchronize or freeze. When this occurs, incremental sync jobs fail repeatedly, leaving downstream warehouse tables and reporting dashboards stale. This blueprint provides a production-grade, closed-loop remediation workflow: it monitors Meltano state telemetry via HTTP, evaluates replication health in Python with loud failures on corrupted data, saves an auditable pre-remediation state manifest, requests DataOps signoff via Slack, pauses for human approval, executes real Meltano CLI commands to repair invalid state bookmarks and resume the pipeline, verifies clean replication post-remediation, and records a verified recovery receipt into the Kestra KV store.

    ## How it works
    1. A schedule trigger initiates the Meltano pipeline audit every 4 hours.
    2. A native HTTP request task pulls live job execution telemetry and state bookmark metadata from the Meltano service.
    3. A Python script evaluates consecutive failure counts, state drift, and corrupted stream bookmarks with loud failure on telemetry errors.
    4. Kestra internal storage captures the structured pre-remediation audit manifest as a persistent JSON artifact.
    5. When failure thresholds or bookmark corruptions are detected, a Slack alert notifies DataOps engineers and execution pauses for human-in-the-loop signoff.
    6. Upon approval, the workflow invokes the real Meltano CLI to reset invalid state bookmarks and execute an incremental re-sync.
    7. A post-remediation verification task audits job completion and verifies clean bookmark advancement.
    8. The verified recovery receipt is recorded in the Kestra KV store and announced to DataOps via Slack.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 4h] --> FetchTelemetry[HTTP Request: Query Meltano State API]
        FetchTelemetry --> AnalyzeState[Python Script: Parse Failures & Bookmarks]
        AnalyzeState --> WriteManifest[Storage Write: Save Pre-Remediation Manifest]
        WriteManifest --> CheckGate{Needs Remediation?}
        CheckGate -- Yes --> SlackReq[Slack: Request Signoff]
        SlackReq --> AwaitApproval[Pause Task: Await DataOps Signoff]
        AwaitApproval --> CheckApproved{Approved?}
        CheckApproved -- Yes --> RunMeltano[Shell: Execute meltano state repair & run]
        RunMeltano --> VerifyPost[Python Script: Verify Clean State]
        VerifyPost --> StoreKV[KV Set: Record Audit Receipt]
        StoreKV --> SlackSuccess[Slack: Announce Verified Recovery]
        CheckApproved -- No --> LogDeclined[Log: Remediation Declined]
        CheckGate -- No --> NominalLog[Log: Pipeline Nominal]
        SlackSuccess --> FinalLog[Log: Workflow Concluded]
        LogDeclined --> FinalLog
        NominalLog --> FinalLog
    ```

    ## What you get
    - Automated detection of failed Singer ELT sync jobs and frozen bookmark states in Meltano.
    - Human-in-the-loop operational safety preventing unvetted state mutations via Kestra Pause tasks.
    - Concrete CLI execution invoking real Meltano commands to repair Singer states and resume data loading.
    - Post-remediation verification confirming that data replication succeeded and state cursors advanced.
    - Persistent KV store tracking of verified compliance receipts with approver change records.

    ## Who it's for
    - DataOps Engineers maintaining production Singer ELT pipelines and data lake landing layers.
    - Analytics Engineers preventing stale warehouse tables and broken downstream dashboard models.
    - Data Platform Engineers automating operational self-healing for distributed extractors and loaders.
    - Site Reliability Engineers ensuring continuous availability of data movement infrastructure.

    ## Why orchestrate this with Kestra
    - **Human-in-the-Loop Governance**: Halts destructive changes until authorized engineers provide explicit approval with ticket tracking.
    - **Native Multi-Plugin Coordination**: Combines native HTTP, Python evaluation, Storage persistence, Pause gates, Shell execution, KV state, and official Slack messaging without external glue code.
    - **Automated Pipeline Surveillance**: Evaluates Meltano sync state metrics continuously on a schedule.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages data pipeline remediation runbooks as versioned code in Git repositories.

    ## Use cases
    - **Corrupted State Recovery**: Resets corrupted Singer stream bookmarks when upstream API schema changes invalidate replication cursors.
    - **Failed Batch Re-Sync**: Automatically catches intermittent tap timeouts and triggers safe re-runs after transient network outages.
    - **Audit-Compliant Remediation**: Guarantees that every state reset is logged with ticket IDs, approver emails, and post-sync receipts.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `meltano_api_url` | STRING | `http://meltano-api.dataops.svc.cluster.local:5000/api/v1/state` | Internal HTTP endpoint exposing Meltano state backend telemetry. |
    | `job_id` | STRING | `postgres-to-snowflake-daily` | Unique identifier for the Meltano ELT pipeline job. |
    | `extractor_name` | STRING | `tap-postgres` | Meltano extractor plugin name responsible for extracting source records. |
    | `loader_name` | STRING | `target-snowflake` | Meltano loader plugin name responsible for landing records. |
    | `max_consecutive_failures` | INT | `2` | Maximum allowable consecutive sync job failures. |

    ## Expected outputs
    - `{{ outputs.analyze_sync_failure_and_state_drift.vars.job_status }}`: Initial operational status of the Meltano job.
    - `{{ outputs.analyze_sync_failure_and_state_drift.vars.consecutive_failures }}`: Count of consecutive job failures detected.
    - `{{ outputs.analyze_sync_failure_and_state_drift.vars.stream_drift_detected }}`: Boolean flag indicating state bookmark drift.
    - `{{ outputs.persist_reconciliation_manifest.uri }}`: Kestra internal storage URI for the pre-remediation manifest.
    - `{{ outputs.post_remediation_verification.vars.verification_status }}`: Final post-remediation verification verdict.
    - `{{ outputs.post_remediation_verification.vars.receipt_json }}`: Structured JSON audit receipt persisted to KV store.

    ## Prerequisites
    - Meltano service exposing job state telemetry via HTTP API on port 5000.
    - Python environment with Meltano CLI installed or capable of dynamic package installation.
    - Network connectivity from Kestra workers to the Meltano state API and analytical data destinations.
    - Slack incoming webhook URL configured in Kestra secrets under `SLACK_WEBHOOK_URL`.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing alerts to DataOps channels.

    ## Quick start
    1. Confirm that your Meltano instance exposes state telemetry at `meltano_api_url`.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your pipeline job identifier in `job_id` and corresponding extractor/loader names.
    4. Trigger a manual execution via the Kestra UI to validate telemetry evaluation and review the approval gate.
    5. Enable the `periodic_pipeline_audit` schedule trigger to establish automated pipeline surveillance.

    ## Common pitfalls and troubleshooting
    - **Approval Gate Timeout**: The approval step times out after 2 hours; ensure on-call DataOps engineers are alerted via Slack.
    - **Singer State Backend**: When using cloud state backends (S3, GCS, Azure Blob), ensure worker environment variables provide appropriate cloud credentials.
    - **Database Locks**: If the target warehouse table is locked by an ongoing transformation query, allow lock release before approving re-sync.
    - **Firewall Egress**: Ensure Kestra workers have network access to both the source database and target analytical warehouse.

    ## How to extend
    - **Automated dbt Trigger**: Run downstream dbt transformation models immediately following verified pipeline re-sync.
    - **Data Diff Validation**: Compare row count checksums between source and target before concluding the verification step.
    - **PagerDuty Escalation**: Escalate unapproved pauses to PagerDuty if critical business SLAs are approaching breach.

    ## Links
    - [Kestra HTTP Plugin Documentation](https://kestra.io/plugins/plugin-core/io.kestra.plugin.core.http.request)
    - [Kestra Pause Plugin Documentation](https://kestra.io/plugins/plugin-core/io.kestra.plugin.core.flow.pause)
    - [Kestra KV Store Documentation](https://kestra.io/plugins/plugin-core/io.kestra.plugin.core.kv.set)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Meltano Official Documentation](https://docs.meltano.com/)
    - [Singer Specification](https://hub.meltano.com/singer/spec/)
  tags:
    - Data
  subTags:
    - ELT & Data Landing
    - Monitoring & Alerting
  ee: false
  demo: false
