id: cloudflare-firewall-event-burst-sentinel
namespace: company.team

inputs:
  - id: zone_id
    type: STRING
    description: Cloudflare Zone ID.
  - id: blocked_events_threshold
    type: INT
    defaults: 500
    description: Maximum acceptable count of blocked firewall events over the 15-minute evaluation window.

tasks:
  - id: query_firewall_events
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - |
        set -euo pipefail
        GRAPHQL_QUERY='{"query":"{ viewer { zones(filter: {zoneTag: "{{ inputs.zone_id }}"}) { firewallEventsAdaptive(filter: {datetime_geq: "{{ now() | dateAdd(-15, '''MINUTES''') | isoDate }}", action: "block"}, limit: 100) { count action clientIP } } } }"}'
        
        BLOCKED_COUNT=$(curl -fsSL -X POST "https://api.cloudflare.com/client/v4/graphql" \
          -H "Authorization: Bearer {{ secret('CLOUDFLARE_API_TOKEN') }}" \
          -H "Content-Type: application/json" \
          --data-raw "$GRAPHQL_QUERY" | jq '[.data.viewer.zones[0].firewallEventsAdaptive[]? | .count] | add // 0')
        
        echo "::{\"outputs\": {\"blocked_count\": $BLOCKED_COUNT}}::"
  - id: evaluate_firewall_burst
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_firewall_events.vars.blocked_count | int >= inputs.blocked_events_threshold }}"
    then:
      - id: notify_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#security-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Cloudflare WAF Security Event Burst Alert",
                "text": "Cloudflare Zone `{{ inputs.zone_id }}` recorded *{{ outputs.query_firewall_events.vars.blocked_count }}* blocked firewall events over the last 15 minutes! Impact: High-volume application layer attack (SQLi, XSS, credential stuffing, or Layer 7 HTTP flood) detected at edge ingress.",
                "footer": "Kestra Edge Security Sentinel • Cloudflare"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#security-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Cloudflare WAF and Firewall Event Burst Anomaly Sentinel Pipeline Failure",
            "text": "Failed to query Cloudflare GraphQL firewall analytics. Verify API token and zone ID.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Queries Cloudflare GraphQL Analytics API to detect sudden bursts of blocked malicious requests and DDoS attacks."
  metaTitle: Cloudflare WAF and Firewall Event Burst Anomaly Sentinel with Kestra
  title: Cloudflare WAF and Firewall Event Burst Anomaly Sentinel
  shortDescription: Queries Cloudflare GraphQL Analytics API to detect sudden bursts of blocked malicious requests and DDoS attacks.
  description: |
    ## How it works
    This workflow connects to the Cloudflare GraphQL Analytics API (`firewallEventsAdaptive`) to aggregate security events where `action = 'block'` over the trailing 15 minutes. When cyber threats launch distributed credential stuffing, vulnerability exploit probes, or Layer 7 floods, Cloudflare's WAF blocks malicious traffic at the edge. A sudden surge in blocked events indicates an active targeted attack. Slack is alerted with the blocked count.

    ## What you get
    - Real-time detection of Layer 7 application attacks and vulnerability probing.
    - Instant visibility into blocked threat volumes at Cloudflare edge locations.
    - Prevents origin server overload by monitoring perimeter security health.

    ## Who it's for
    - SOC Analysts and Cloud Security Engineers guarding web application perimeter defenses.
    - SREs maintaining origin server availability and traffic integrity.

    ## Why orchestrate this with Kestra
    - **GraphQL Telemetry Extraction**: Query high-resolution edge analytics natively.
    - **Automated Incident Triage**: Trigger instant Slack alerts during active security events.
    - **Defensive Playbook Automation**: Seamlessly trigger Cloudflare Under Attack Mode when thresholds breach.

    ## Prerequisites
    - Cloudflare API token with `Zone.Analytics:Read` permissions.
    - Secrets `CLOUDFLARE_API_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Provide Cloudflare Zone ID.
    3. Run the workflow to inspect edge firewall activity.

    ## How to extend
    - Automatically toggle Cloudflare Under Attack mode (`security_level: "under_attack"`) upon severe bursts.
    - Break down events by specific WAF rule ID and source country.

    ## Links
    - [Cloudflare Firewall Events GraphQL API](https://developers.cloudflare.com/analytics/graphql-api/features/filtering/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Infrastructure Automation
    - Day 2 Operations
  ee: false
  demo: false