id: s3-intelligent-tiering-advisor
namespace: company.finops

description: |
  Finds S3 buckets overpaying on storage: objects sitting in S3 Standard for
  30+ days with no Intelligent-Tiering lifecycle rule pay $0.023/GB-month while
  Infrequent Access would cost $0.0125/GB. Advisory only — it reports the waste
  with a ready-to-apply lifecycle rule snippet instead of changing anything.

inputs:
  - id: bucket_names
    "type": ARRAY
    "itemType": STRING
    defaults: []
    description: Buckets to audit. Empty (default) discovers all buckets via list-buckets.
  - id: age_days
    "type": INT
    defaults: 30
    description: Objects in S3 Standard older than this many days count as overpaying.
  - id: aws_region
    "type": STRING
    defaults: us-east-1
    description: Region used for the bucket discovery call (S3 is a global namespace).
  - id: savings_per_gb_month
    "type": STRING
    defaults: "0.0105"
    description: Estimated savings per GB/month moving Standard ($0.023) to Infrequent Access ($0.0125).

tasks:
  - id: discover_buckets
    type: io.kestra.plugin.aws.cli.AwsCLI
    description: Resolve the bucket list — use the input or discover all buckets.
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        PROVIDED='{{ inputs.bucket_names | toJson }}'
        if [ "$PROVIDED" != "[]" ] && [ -n "$PROVIDED" ]; then
          echo "Using provided bucket list"
          echo "::{\"outputs\": {\"buckets\": $PROVIDED}}::"
        else
          echo "Discovering all buckets"
          LIST=$(aws s3api list-buckets --region {{ inputs.aws_region }} --query 'Buckets[].Name' --output json)
          echo "::{\"outputs\": {\"buckets\": $LIST}}::"
        fi
  - id: check_buckets
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit each bucket for missing Intelligent-Tiering and stale Standard objects.
    values: "{{ outputs.discover_buckets.buckets }}"
    tasks:
      - id: audit_bucket
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: Check lifecycle rules, then size S3 Standard objects older than the cutoff.
        region: "{{ inputs.aws_region }}"
        accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
        commands:
          - |
            BUCKET="{{ taskrun.value }}"
            CUTOFF=$(date -u -d "{{ inputs.age_days }} days ago" +%Y-%m-%dT%H:%M:%SZ)
            echo "Auditing s3://$BUCKET (objects in Standard older than $CUTOFF)"
            if aws s3api get-bucket-lifecycle-configuration --bucket "$BUCKET" > /tmp/lifecycle.json 2>/dev/null; then
              IT_RULES=$(python3 -c "
            import json
            rules = json.load(open('/tmp/lifecycle.json')).get('Rules', [])
            hits = [r.get('ID', 'unnamed') for r in rules for t in r.get('Transitions', []) if t.get('StorageClass') == 'INTELLIGENT_TIERING']
            print(','.join(hits))")
              if [ -n "$IT_RULES" ]; then
                echo "BUCKET=$BUCKET"
                echo "Bucket $BUCKET already transitions to Intelligent-Tiering (rule: $IT_RULES) - nothing to do."
                echo "ALREADY_INTELLIGENT_TIERING"
                exit 0
              fi
            fi
            OBJ_JSON=$(aws s3api list-objects-v2 --bucket "$BUCKET" \
              --query "Contents[?LastModified<='$CUTOFF' && StorageClass=='STANDARD'].Size" --output json)
            STATS=$(echo "$OBJ_JSON" | python3 -c "
            import json, sys
            sizes = json.loads(sys.stdin.read()) or []
            gb = sum(sizes) / 1073741824
            print(len(sizes), '{:.2f}'.format(gb), '{:.2f}'.format(gb * float('{{ inputs.savings_per_gb_month }}')))")
            COUNT=$(echo "$STATS" | cut -d' ' -f1)
            GB=$(echo "$STATS" | cut -d' ' -f2)
            SAVINGS=$(echo "$STATS" | cut -d' ' -f3)
            echo "BUCKET=$BUCKET"
            echo "OLD_COUNT=$COUNT"
            echo "OLD_GB=$GB"
            echo "EST_MONTHLY_SAVINGS=$SAVINGS"
            if [ "$COUNT" -gt 0 ]; then
              echo "Found $COUNT objects ($GB GB) older than {{ inputs.age_days }} days in S3 Standard - about \$$SAVINGS/mo savable with Intelligent-Tiering"
              echo "FINDINGS_FOUND"
            else
              echo "No stale Standard objects in $BUCKET - nothing to report."
            fi
      - id: notify_findings
        type: io.kestra.plugin.core.flow.If
        description: Report buckets missing Intelligent-Tiering, stay quiet on clean ones.
        condition: "{{ outputs.audit_bucket.stdout contains 'FINDINGS_FOUND' }}"
        then:
          - id: slack_report
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":floppy_disk: *S3 Intelligent-Tiering advisor* — `s3://{{ outputs.audit_bucket.vars.BUCKET }}` has *{{ outputs.audit_bucket.vars.OLD_COUNT }}* objects (*{{ outputs.audit_bucket.vars.OLD_GB }}* GB) in S3 Standard older than {{ inputs.age_days }} days.\nEstimated waste: ~*${{ outputs.audit_bucket.vars.EST_MONTHLY_SAVINGS }}/mo* (Standard $0.023/GB vs Infrequent Access $0.0125/GB).\nAdd this lifecycle rule to stop the bleed:\n```json\n{\n  \"Rules\": [{\n    \"ID\": \"intelligent-tiering-{{ inputs.age_days }}d\",\n    \"Status\": \"Enabled\",\n    \"Filter\": {\"Prefix\": \"\"},\n    \"Transitions\": [{\"Days\": {{ inputs.age_days }}, \"StorageClass\": \"INTELLIGENT_TIERING\"}]\n  }]\n}\n```\n`aws s3api put-bucket-lifecycle-configuration --bucket {{ outputs.audit_bucket.vars.BUCKET }} --lifecycle-configuration file://rule.json`"
              }
        else:
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            message: "s3://{{ outputs.audit_bucket.vars.BUCKET }} has no stale Standard-class objects ({{ inputs.age_days }}d cutoff) — nothing to save."
      - id: log_skipped
        type: io.kestra.plugin.core.flow.If
        description: Note buckets that already use Intelligent-Tiering.
        condition: "{{ outputs.audit_bucket.stdout contains 'ALREADY_INTELLIGENT_TIERING' }}"
        then:
          - id: log_skip
            type: io.kestra.plugin.core.log.Log
            message: "s3://{{ outputs.audit_bucket.vars.BUCKET }} already transitions to Intelligent-Tiering — skipped."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Monday at 09:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 9 * * 1"
    disabled: true

extend:
  title: S3 Intelligent-Tiering Advisor
  metaTitle: Find S3 Buckets Overpaying Without Intelligent-Tiering | Kestra
  shortDescription: Audit S3 buckets for objects stuck in S3 Standard for 30+ days, estimate the overpayment, and get a Slack report with a ready-to-apply lifecycle rule.
  metaDescription: S3 Standard costs ~46% more than Infrequent Access. This weekly flow finds buckets missing Intelligent-Tiering and estimates your savings.
  description: |
    A large share of S3 spend is data nobody touches sitting in S3 Standard at $0.023/GB-month. Intelligent-Tiering moves untouched objects to Infrequent Access ($0.0125/GB) automatically — but only when a lifecycle rule exists. This blueprint finds the buckets that never got the rule, sizes the stale data, and hands you the exact JSON to fix it. Advisory only: it never changes a bucket.

    ## How it works

    1. A Schedule trigger fires weekly on Monday at 09:00 UTC (shipped disabled).
    2. A discovery task resolves the bucket list: `bucket_names` if you set it, otherwise all buckets via `list-buckets`.
    3. A ForEach audits each bucket. First it reads the lifecycle configuration — buckets already transitioning to `INTELLIGENT_TIERING` are skipped with a log line.
    4. For the rest, it lists objects still in `STANDARD` older than `age_days` (default 30) and totals their size.
    5. An `If` task posts a Slack report with counts, GB, estimated monthly savings, and a copy-paste lifecycle rule snippet only when stale objects exist.

    ## What you get

    - A per-bucket report of stale Standard-class objects with counts and GB.
    - A dollar estimate of monthly overpayment per bucket.
    - A ready-to-apply `put-bucket-lifecycle-configuration` JSON snippet per finding.
    - Automatic skip of buckets already on Intelligent-Tiering, with a log line for the record.

    ## Who it's for

    FinOps teams and platform engineers paying S3 bills for data lakes, backups, and log archives that stopped being hot months ago.

    ## Why orchestrate this with Kestra

    One audit becomes stale the moment someone creates a new bucket. As a scheduled flow the check repeats weekly, the age cutoff is an input anyone can tune, every run is logged for audit, and adding buckets is a list entry — not a new script.

    ## Prerequisites

    - AWS credentials with `s3:ListAllMyBuckets`, `s3:GetBucketLifecycleConfiguration`, and `s3:ListBucket` permissions.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the S3 API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the S3 API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the savings report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Run manually once and review the Slack report (or the clean log lines).
    3. Enable the weekly schedule trigger.

    ## How to extend

    - For buckets with millions of objects, replace `list-objects-v2` with S3 Inventory manifest reads.
    - Add an opt-in auto-apply path (gated by a `DRY_RUN=false` input) that writes the lifecycle rule.
    - Also analyze Glacier/Deep Archive transition opportunities for 90-day-plus objects.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [S3 Intelligent-Tiering](https://docs.aws.amazon.com/AmazonS3/latest/userguide/intelligent-tiering-overview.html)
    - [S3 storage pricing](https://aws.amazon.com/s3/pricing/)
  tags:
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Monitoring & Alerting
  ee: false
  demo: false
