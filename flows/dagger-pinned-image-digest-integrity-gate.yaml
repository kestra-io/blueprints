id: dagger-pinned-image-digest-integrity-gate
namespace: company.team
description: |
  Use a containerized Dagger pipeline to verify, on a schedule, that a
  production-pinned container image digest is still resolvable from its
  registry, classify the result as PINNED_DIGEST_INTACT, DIGEST_MISSING, or
  PROBE_FAILED, log clean passes, and alert Slack the moment a pinned digest
  has been garbage-collected, revoked, or otherwise become unpullable.

inputs:
  - id: pinned_image_digest_ref
    type: STRING
    defaults: "<your-registry>/<your-image>@sha256:<your-pinned-digest>"
    displayName: "Pinned Image Digest Reference"
    description: "Fully qualified OCI image reference including the exact digest that production manifests are pinned to, for example cgr.dev/chainguard/wolfi-base@sha256:<digest>. Replace the placeholder before running."

  - id: dagger_container_image
    type: STRING
    defaults: "curlimages/curl:latest"
    displayName: "Dagger Runner Container Image"
    description: "Docker image the Dagger CLI is installed into before the pipeline runs. Must provide curl, tar, uname, and sha256sum for the pinned-version install step."

  - id: alert_on_missing_digest
    type: STRING
    defaults: "true"
    displayName: "Send Slack Alert"
    description: "When set to true, dispatch a Slack notification when the pinned digest can no longer be resolved from the registry; when false, only log the breach."

triggers:
  - id: digest_integrity_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Verify the pinned digest is still resolvable every 6 hours."
    cron: "0 */6 * * *"
    disabled: true
    inputs:
      pinned_image_digest_ref: "<your-registry>/<your-image>@sha256:<your-pinned-digest>"
      dagger_container_image: "curlimages/curl:latest"
      alert_on_missing_digest: "true"

tasks:
  - id: verify_pinned_digest
    type: io.kestra.plugin.dagger.Commands
    description: "Pull the exact pinned digest and run a trivial command inside it. A zero exit proves the registry still serves that digest; a non-zero exit means it was garbage-collected, deleted, or is otherwise unreachable."
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: "{{ inputs.dagger_container_image }}"
    commands:
      - "container | from {{ inputs.pinned_image_digest_ref }} | with-exec echo pinned-digest-resolved | stdout"
    allowFailure: true

  - id: classify_digest_integrity
    type: io.kestra.plugin.core.debug.Return
    description: "Classify as PROBE_FAILED when the task produced no output at all (Dagger install, Docker runner, or engine startup failure), DIGEST_MISSING when it ran but exited non-zero (registry rejected the pinned digest), otherwise PINNED_DIGEST_INTACT."
    format: "{{ (outputs.verify_pinned_digest.exitCode is not defined) ? 'PROBE_FAILED' : ((outputs.verify_pinned_digest.exitCode == 0) ? 'PINNED_DIGEST_INTACT' : 'DIGEST_MISSING') }}"

  - id: route_by_digest_status
    type: io.kestra.plugin.core.flow.Switch
    description: "Branch on the classification: page Slack when the pinned digest is missing or the probe fails, otherwise log a healthy audit line."
    value: "{{ outputs.classify_digest_integrity.value }}"
    cases:
      "DIGEST_MISSING":
        - id: evaluate_alert_toggle
          type: io.kestra.plugin.core.flow.If
          description: "Only call the Slack webhook when alert_on_missing_digest is true; otherwise log the breach without paging."
          condition: "{{ inputs.alert_on_missing_digest == 'true' }}"
          then:
            - id: dispatch_digest_missing_alert
              type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
              description: "Page the platform/security channel that a pinned digest is no longer resolvable."
              url: "{{ secret('SLACK_WEBHOOK') }}"
              payload: |
                {
                  "text": "Pinned image digest missing: '{{ inputs.pinned_image_digest_ref }}' could not be pulled from its registry. Exit code {{ outputs.verify_pinned_digest.exitCode }}. Any deployment still referencing this digest will fail to pull. Execution {{ execution.id }}."
                }
          else:
            - id: log_alert_suppressed
              type: io.kestra.plugin.core.log.Log
              description: "Record the breach even when Slack paging is disabled, so the execution history still shows it."
              message: "Pinned digest {{ inputs.pinned_image_digest_ref }} is missing (exit code {{ outputs.verify_pinned_digest.exitCode }}) but Slack alert suppressed by alert_on_missing_digest=false."
      "PINNED_DIGEST_INTACT":
        - id: log_digest_healthy
          type: io.kestra.plugin.core.log.Log
          description: "Record a healthy audit result when the pinned digest still resolves."
          message: "Pinned image digest {{ inputs.pinned_image_digest_ref }} is still resolvable from its registry."
      "PROBE_FAILED":
        - id: alert_probe_failure
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Page the channel when the probe itself could not run, since digest integrity is now unknown."
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Dagger pinned digest sentinel could not run for '{{ inputs.pinned_image_digest_ref }}'. Check that the Docker-based task runner can reach the Docker daemon and that dagger_container_image provides curl, tar, uname, and sha256sum. Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        description: "Fallback branch; reached only if classify_digest_integrity produces a value outside the three known cases."
        message: "Dagger pinned digest sentinel produced an unclassified status for {{ inputs.pinned_image_digest_ref }}: {{ outputs.classify_digest_integrity.value }}."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: "Final post-audit status line recorded on every run regardless of branch."
    message: "Pinned digest integrity audit completed for '{{ inputs.pinned_image_digest_ref }}'. Status: {{ outputs.classify_digest_integrity.value }}. Execution ID: {{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Flow-level error handler: page the channel when the sentinel flow itself fails outright."
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "CRITICAL: Dagger pinned image digest integrity gate failed during audit of '{{ inputs.pinned_image_digest_ref }}'. Execution ID: {{ execution.id }}."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.classify_digest_integrity.value }}"

extend:
  title: "Dagger Pinned Image Digest Integrity Gate"
  shortDescription: Use a Dagger pipeline to verify a pinned container image digest is still resolvable from its registry, classify integrity status, and alert Slack on breach.
  metaTitle: Dagger Pinned Image Digest Integrity Gate for Kestra
  metaDescription: Verify a pinned container image digest still resolves from its registry with Dagger, classify integrity status, and alert Slack on breach.
  description: |
    A deployment manifest pinned to an exact image digest is supposed to be immutable, but the registry side is not: digests get garbage-collected, images get deleted for licensing or security reasons, and retention policies silently expire old manifests. The first sign is usually a failed deploy at the worst possible time. This blueprint uses plugin-dagger's native Commands task as the probe, running a containerized Dagger pipeline that attempts to pull the exact pinned digest and classifies whether the registry still serves it.

    ## How it works

    1. `verify_pinned_digest` (`io.kestra.plugin.dagger.Commands`) runs `container | from <pinned_image_digest_ref> | with-exec echo pinned-digest-resolved | stdout` via `dagger shell -c` on a Docker-based task runner. The task's own install step pulls a pinned Dagger CLI release and verifies it against the official checksums file before use. `allowFailure: true` lets the flow continue instead of aborting when the pull or exec fails.
    2. `classify_digest_integrity` (`io.kestra.plugin.core.debug.Return`) checks `outputs.verify_pinned_digest.exitCode`. If it is not defined at all (the task never produced output, for example a Docker runner or Dagger install failure), the classification is `PROBE_FAILED`. If it is defined and non-zero, the classification is `DIGEST_MISSING`, meaning Dagger ran but the registry rejected the pinned digest. If it is exactly zero, the classification is `PINNED_DIGEST_INTACT`.
    3. `route_by_digest_status` (`io.kestra.plugin.core.flow.Switch`) branches on that string. `DIGEST_MISSING` runs `evaluate_alert_toggle` (`io.kestra.plugin.core.flow.If`), which pages Slack via `dispatch_digest_missing_alert` only when `alert_on_missing_digest` is `true`, logging a suppressed-alert line otherwise. `PINNED_DIGEST_INTACT` logs a clean audit line. `PROBE_FAILED` pages Slack directly since integrity is now unknown. The `defaults` branch logs a fallback line that is unreachable under normal operation.
    4. `log_audit_summary` records a status line on every run regardless of branch, so execution history reads as a continuous digest-integrity trend.
    5. The flow-level `errors` block pages Slack separately if the sentinel flow itself fails outright.
    6. The `digest_integrity_schedule` trigger polls every 6 hours with explicit input overrides, shipped `disabled: true` until pointed at a real pinned digest.

    ## What you get

    - A scheduled, containerized verification that a specific pinned image digest is still pullable from its registry, with zero custom pipeline code beyond the one Dagger shell command.
    - A three-way `status` output (`PINNED_DIGEST_INTACT` / `DIGEST_MISSING` / `PROBE_FAILED`) other flows can gate on, for example before promoting a release that references the same digest.
    - A Slack page naming the exact pinned reference and exit code on breach or probe failure.
    - A separate failure channel for the sentinel flow itself, plus a standing per-run audit log line.

    ## Who it's for

    - Platform and release engineers who pin deployment manifests to image digests (not mutable tags) and need to know before a deploy, not during one, that the digest has disappeared.
    - Security and supply-chain teams auditing whether approved, scanned image digests remain available as registries apply retention or garbage-collection policies.
    - SRE teams standardizing Day 2 container supply-chain governance across services inside Kestra.

    ## Why orchestrate this with Kestra

    A one-off `docker pull` from a laptop proves a digest is resolvable for one instant and leaves no record. This flow keeps every check in Kestra's execution history, turns the result into a typed `status` output other flows (release gates, promotion pipelines) can depend on, and gives you an `If`/`Switch` branch to grow into real remediation (re-pinning to a new approved digest, opening a ticket) without rewriting the probe itself.

    ## Prerequisites

    - A Kestra Worker with access to a Docker daemon, since `verify_pinned_digest` runs on the `io.kestra.plugin.scripts.runner.docker.Docker` task runner.
    - Outbound network access from that Docker daemon to the image registry holding the pinned digest.
    - A real pinned digest reference to audit; the shipped default is a placeholder and must be replaced.
    - A Slack incoming webhook for the breach, probe-failure, and flow-failure alerts.

    ## Quick start

    1. Add the `SLACK_WEBHOOK` secret.
    2. Replace `pinned_image_digest_ref` with a real `registry/image@sha256:digest` your deployments depend on.
    3. Run the flow once and confirm `status` reads `PINNED_DIGEST_INTACT`.
    4. Enable `digest_integrity_schedule`.

    ## How to extend

    - Record each confirmed-intact digest in a KV store alongside its tag, then compare a freshly resolved tag-to-digest mapping against that record to detect silent tag-to-digest drift, not just outright digest loss.
    - Fan the probe out to every digest referenced by your current production manifests with a `Loop` task to audit a whole fleet in one run.
    - On `DIGEST_MISSING`, automatically open a ticket or trigger a re-pin workflow instead of only alerting.
    - Push `status` into a KV store to alert only on state transitions instead of every run.

    ## Secrets

    - `SLACK_WEBHOOK`: Slack incoming webhook used for the breach, probe-failure, and flow-failure alerts.
    - OSS note: if your Kestra instance reads secrets from environment variables instead of a secrets backend, set `SECRET_SLACK_WEBHOOK` as base64, for example `echo -n "<your-webhook-url>" | base64`.

    ## Inputs

    - `pinned_image_digest_ref` (STRING, default `<your-registry>/<your-image>@sha256:<your-pinned-digest>`): fully qualified pinned image reference to audit.
    - `dagger_container_image` (STRING, default `curlimages/curl:latest`): base image the Dagger CLI installs into.
    - `alert_on_missing_digest` (STRING, default `"true"`): when `"true"`, page Slack on a missing digest; when `"false"`, only log it.

    ## Outputs

    - `{{ outputs.verify_pinned_digest.exitCode }}`: exit code of the Dagger pipeline invocation.
    - `{{ outputs.classify_digest_integrity.value }}`: classification string, one of `PINNED_DIGEST_INTACT`, `DIGEST_MISSING`, `PROBE_FAILED`.
    - `{{ outputs.status }}`: flow-level alias of the same classification.

    ## Pitfalls

    - `image-ref`, the Dagger Container API function that returns a resolved reference, can only be called immediately after a `from()` call; it is not used here because chaining it with a comparison inside the same pipeline is not something this blueprint asserts without having executed it. The probe instead proves resolvability indirectly through `with-exec`, which is the mechanism actually verified against plugin-dagger's source and documented CLI examples.
    - `plugin-dagger`'s `ScriptOutput` does not expose raw stdout text as a queryable field, only `vars` (populated solely via Kestra's `::{"outputs":...}::` marker convention), `exitCode`, and `outputFiles`. This blueprint classifies on `exitCode` alone for that reason; it does not attempt to parse the Dagger pipeline's printed output.
    - The Docker-based task runner needs a reachable Docker daemon from the Kestra Worker; without one, every run classifies as `PROBE_FAILED`, not `DIGEST_MISSING`.
    - `dagger_container_image` must provide `curl`, `tar`, `uname`, and `sha256sum`, since the task's install step downloads and checksum-verifies the pinned Dagger CLI release on first use.
    - A mutable tag (for example `:latest`) always "resolves" to whatever it currently points at; this gate is only meaningful against a true `@sha256:` digest reference, not a tag.

    ## Local Container Setup

    This flow needs a Docker daemon reachable from the Kestra Worker, not a separate broker container. If Kestra itself runs in Docker, confirm the Worker container can reach the host's Docker socket, and that the Worker's Docker network can resolve the image registry you are auditing:

    docker network connect YOUR_KESTRA_NETWORK <kestra-worker-container-name>

    (Run docker network ls to verify your active Kestra network name.)

    ## Links

    - [Kestra Dagger plugin](https://kestra.io/plugins/plugin-dagger)
    - [Kestra Slack notifications plugin](https://kestra.io/plugins/plugin-notifications)
    - [Dagger CLI and Dagger Shell documentation](https://docs.dagger.io/api/cli)
  tags:
    - Infrastructure
  subTags:
    - Policy & Compliance
    - Day 2 Operations
    - Infrastructure Automation
  ee: false
  demo: false
