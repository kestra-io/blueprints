id: getting-started-ai-enrichment
namespace: tutorial
description: |
  # AI enrichment example
  Fetches a public quote and logs it.

labels:
  name: "Example: AI Enrichment"

tasks:
  - id: extract
    type: io.kestra.plugin.core.http.Request
    uri: https://dummyjson.com/quotes/1

  - id: preview
    type: io.kestra.plugin.core.log.Log
    message: "\"{{ fromJson(outputs.extract.body).quote }}\" ({{ fromJson(outputs.extract.body).author }})"

  - id: enrich # create an OPENAI_API_KEY secret, then enable this task and ai_result
    type: io.kestra.plugin.ai.completion.ChatCompletion
    disabled: true
    provider: # other providers: https://kestra.io/blueprints?tags=AI
      type: io.kestra.plugin.ai.provider.OpenAI
      apiKey: "{{ secret('OPENAI_API_KEY') }}"
      modelName: gpt-6-luna
    messages:
      - type: USER
        content: "Is this quote POSITIVE, NEUTRAL or NEGATIVE? {{ fromJson(outputs.extract.body).quote }}"

  - id: ai_result
    type: io.kestra.plugin.core.log.Log
    disabled: true
    message: "{{ outputs.enrich.textOutput }}"

triggers:
  - id: every_morning
    type: io.kestra.plugin.core.trigger.Schedule
    disabled: true
    cron: "0 8 * * *"

extend:
  shortDescription: Fetch a public quote and log it, then plug in an LLM (OpenAI by default, or Anthropic or Gemini) to classify its sentiment.
  title: "AI enrichment example: Getting started with Kestra"
  metaTitle: Getting started AI enrichment flow with Kestra
  metaDescription: A green-on-first-run AI example. Fetch a public quote and log it, then add an OpenAI (or Anthropic or Gemini) key to classify its sentiment.
  description: |
    A getting started AI enrichment flow that runs successfully on the very first execution with zero secrets. It fetches a public quote over HTTP and logs it, so a new user sees a real result immediately. To make it yours, add one LLM API key and enable a provider task to classify the sentiment of the quote. It is the quickest way to see the fetch, then enrich with an LLM pattern working in Kestra before wiring in your own model and data.

    ## How it works
    1. The `extract` task (`io.kestra.plugin.core.http.Request`) fetches one quote from a public API. No authentication is required.
    2. The `preview` task (`io.kestra.plugin.core.log.Log`) logs the quote and its author so the first run shows real data.
    3. The optional `enrich` task (`io.kestra.plugin.ai.completion.ChatCompletion`) sends the data to your chosen LLM provider with a one-line prompt, asking whether the quote is POSITIVE, NEUTRAL or NEGATIVE.
    4. The optional `ai_result` task logs the model's `textOutput`.

    ## What you get
    - A working AI-shaped run on the first click, with no keys to configure.
    - A ready-to-enable `ChatCompletion` task you swap between OpenAI, Anthropic, and Gemini.
    - A one-line prompt you can rewrite for your own data.
    - An optional schedule trigger.

    ## Who it's for
    - Teams evaluating Kestra for AI and LLM-backed data enrichment.
    - Anyone new to Kestra who wants a green first run before adding a model key.
    - Engineers building fetch and enrich pipelines over their own data.

    ## Why orchestrate this with Kestra
    Calling an LLM from a script is easy; operating that call is not. Kestra wraps the model call in a declarative pipeline with retries, full input and output logging, secret management for the API key, and the ability to trigger on a schedule or an event. Swapping OpenAI for Anthropic or Gemini is a single `provider` change, and the enriched output flows into downstream tasks (Slack, a warehouse, another flow) with tracked lineage a bare API call cannot give you.

    ## Prerequisites
    - A running Kestra instance with the AI plugin available.
    - (Optional) An API key for OpenAI, Anthropic, or Google Gemini to enable enrichment.

    ### Secrets
    The default green path uses no secrets. Optional steps use:

    - `OPENAI_API_KEY` (or `ANTHROPIC_API_KEY` / `GEMINI_API_KEY`): the key for whichever provider you enable on the `enrich` task. OpenAI is the default.

    ## Quick start
    1. Add this flow to your Kestra instance and Execute it. It runs green with no setup.
    2. To enrich with an LLM, add your provider key as a secret in the `tutorial` namespace (Namespaces > tutorial > Secrets).
    3. Remove `disabled: true` from the `enrich` task and from `ai_result` to see the model output. The default provider is OpenAI; to use Anthropic or Gemini instead, replace the `provider` block (the flow description links to examples).
    4. (Optional) Enable the schedule trigger to run it automatically.

    ## How to extend
    - Swap the provider from OpenAI to Anthropic (`io.kestra.plugin.ai.provider.Anthropic`) or Google Gemini (`io.kestra.plugin.ai.provider.GoogleGemini`) by replacing the `provider` block.
    - Point `extract` at your own data source instead of the public sample.
    - Use structured output to get typed JSON back instead of free text.
    - Route the result to Slack, a warehouse, a ticket, or another flow.

    ## Links
    - [AI plugin](https://kestra.io/plugins/plugin-ai)
    - [ChatCompletion task](https://kestra.io/plugins/plugin-ai/completion/io.kestra.plugin.ai.completion.chatcompletion)
  tags:
    - Getting Started
    - AI
  subTags:
    - Agents & Structured Output
  ee: false
  demo: false
