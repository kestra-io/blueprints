id: third-party-vendor-risk-review
namespace: company.team

description: |
  Monthly third-party risk review (ISO 27001 A.5.19-5.22, SOC 2 CC9.2, DORA ICT register):
  tier every vendor on the data it holds, its spend and how critical it is to operations,
  then check what each tier requires: an assessment within its cycle, a current SOC 2 or
  ISO certificate with no gap in coverage, a signed DPA for personal data, and no high
  finding past its due date. Each vendor gets a risk score and a status, and the overdue
  items go to their owner. Repeated misses escalate to the CISO.

inputs:
  - id: as_of
    type: STRING
    displayName: Review date
    defaults: "2026-10-01"
    validator: ^\d{4}-\d{2}-\d{2}$

  - id: escalate_after
    type: INT
    displayName: Escalate after (reviews)
    description: A vendor non-compliant for this many reviews in a row goes to the CISO.
    defaults: 2

  - id: scenario
    type: SELECT
    displayName: Demo scenario
    description: ISSUES adds a vendor with no owner and a certificate that ends before it starts, which must stop the review.
    values:
      - CLEAN
      - ISSUES
    defaults: CLEAN

variables:
  state_key: vendor_risk_history
  pack_dir: "vendor-risk/{{ inputs.as_of }}"

concurrency:
  limit: 1

tasks:
  - id: state
    type: io.kestra.plugin.core.output.OutputValues
    values:
      streaks: >-
        {{ (kv(vars.state_key, errorOnMissing=false) ?? {'reviews': {}}) | jq('.reviews | to_entries | map(select(.key < "' ~ inputs.as_of ~ '")) | sort_by(.key) | last | .value.streaks // {}') | first | toJson }}

  - id: review
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: >
      One DuckDB session: vendor inventory, assessments, certificates, contracts and findings
      (demo generator or your GRC tool and contract repository), then the tier, the checks,
      the score, the status and the escalation streak per vendor.
    outputFiles:
      - vendors
      - actions
      - blockers
    fetchType: FETCH_ONE
    sql: |
      SET VARIABLE d = DATE '{{ inputs.as_of }}';
      -- The demo history is fixed so every review date sees the same vendors.
      SET VARIABLE anchor = DATE '2026-10-01';

      -- =======================================================================
      -- Vendor inventory. Replace with your GRC tool or procurement master.
      -- data_class: NONE, INTERNAL, PERSONAL, SENSITIVE (health, payment card, biometrics)
      -- =======================================================================
      CREATE TABLE vendors (vendor VARCHAR, service VARCHAR, owner VARCHAR, data_class VARCHAR, annual_spend DOUBLE, critical_ops BOOLEAN, subprocessor_of_customer_data BOOLEAN);
      INSERT INTO vendors VALUES
        ('Cloudhost', 'Production hosting', 'cto@example.com', 'SENSITIVE', 1450000, true, true),
        ('PayBridge', 'Card payments', 'cfo@example.com', 'SENSITIVE', 380000, true, true),
        ('MailFleet', 'Transactional email', 'eng-lead@example.com', 'PERSONAL', 42000, true, true),
        ('PeopleDesk', 'HRIS', 'hr-dir@example.com', 'SENSITIVE', 96000, false, false),
        ('Ticketly', 'Support desk', 'support-lead@example.com', 'PERSONAL', 61000, false, true),
        ('Ledgerly', 'Accounting', 'cfo@example.com', 'INTERNAL', 54000, true, false),
        ('SignFast', 'E-signature', 'legal@example.com', 'PERSONAL', 18000, false, true),
        ('ChartBoard', 'BI dashboards', 'data-lead@example.com', 'INTERNAL', 24000, false, false),
        ('SnackBox', 'Office snacks', 'office@example.com', 'NONE', 9000, false, false),
        ('LogStream', 'Log management', 'sre-lead@example.com', 'PERSONAL', 130000, true, true),
        ('TransLingo', 'Translation', 'marketing@example.com', 'INTERNAL', 6000, false, false);
      {% if inputs.scenario == 'ISSUES' %}
      INSERT INTO vendors VALUES ('ShadowAI', 'AI note taker', NULL, 'PERSONAL', 3000, false, true);
      {% endif %}

      -- Last completed security assessment, per vendor.
      CREATE TABLE assessments (vendor VARCHAR, completed_on DATE, result VARCHAR);
      INSERT INTO assessments VALUES
        ('Cloudhost', getvariable('anchor') - 200, 'PASS'), ('PayBridge', getvariable('anchor') - 400, 'PASS'),
        ('MailFleet', getvariable('anchor') - 90, 'PASS_WITH_FINDINGS'), ('PeopleDesk', getvariable('anchor') - 300, 'PASS'),
        ('Ticketly', getvariable('anchor') - 700, 'PASS'), ('Ledgerly', getvariable('anchor') - 150, 'PASS'),
        ('ChartBoard', getvariable('anchor') - 1200, 'PASS'), ('LogStream', getvariable('anchor') - 120, 'PASS_WITH_FINDINGS'),
        ('TransLingo', getvariable('anchor') - 500, 'PASS');
      -- SignFast and SnackBox were never assessed.

      -- Assurance reports: SOC 2 Type II covers a period, ISO 27001 a certificate validity.
      CREATE TABLE certificates (vendor VARCHAR, kind VARCHAR, period_start DATE, period_end DATE);
      INSERT INTO certificates VALUES
        ('Cloudhost', 'SOC2_TYPE2', getvariable('anchor') - 400, getvariable('anchor') - 35),
        ('Cloudhost', 'SOC2_TYPE2', getvariable('anchor') - 765, getvariable('anchor') - 400),
        ('PayBridge', 'PCI_DSS_AOC', getvariable('anchor') - 300, getvariable('anchor') + 65),
        ('PayBridge', 'SOC2_TYPE2', getvariable('anchor') - 610, getvariable('anchor') - 245),
        ('MailFleet', 'SOC2_TYPE2', getvariable('anchor') - 300, getvariable('anchor') + 65),
        ('PeopleDesk', 'ISO27001', getvariable('anchor') - 900, getvariable('anchor') + 195),
        ('Ticketly', 'SOC2_TYPE2', getvariable('anchor') - 380, getvariable('anchor') - 15),
        ('Ledgerly', 'SOC2_TYPE2', getvariable('anchor') - 200, getvariable('anchor') + 165),
        ('LogStream', 'SOC2_TYPE2', getvariable('anchor') - 330, getvariable('anchor') + 35),
        ('LogStream', 'SOC2_TYPE2', getvariable('anchor') - 760, getvariable('anchor') - 395);
      {% if inputs.scenario == 'ISSUES' %}
      INSERT INTO certificates VALUES ('SignFast', 'ISO27001', getvariable('anchor') + 10, getvariable('anchor') - 300);
      {% endif %}

      -- Contracts: DPA signed and the right to audit.
      CREATE TABLE contracts (vendor VARCHAR, dpa_signed BOOLEAN, audit_right BOOLEAN, renewal_on DATE);
      INSERT INTO contracts VALUES
        ('Cloudhost', true, true, getvariable('anchor') + 240), ('PayBridge', true, true, getvariable('anchor') + 75),
        ('MailFleet', true, false, getvariable('anchor') + 40), ('PeopleDesk', true, true, getvariable('anchor') + 300),
        ('Ticketly', false, false, getvariable('anchor') + 20), ('Ledgerly', true, true, getvariable('anchor') + 130),
        ('SignFast', false, false, getvariable('anchor') + 200), ('ChartBoard', false, false, getvariable('anchor') + 90),
        ('SnackBox', false, false, getvariable('anchor') + 30), ('LogStream', true, true, getvariable('anchor') + 400),
        ('TransLingo', false, false, getvariable('anchor') + 60);

      -- Open findings from assessments and pen test reports, with the remediation date agreed.
      CREATE TABLE findings (vendor VARCHAR, finding_id VARCHAR, severity VARCHAR, due_on DATE, closed_on DATE);
      INSERT INTO findings VALUES
        ('MailFleet', 'F-101', 'HIGH', getvariable('anchor') - 20, NULL),
        ('MailFleet', 'F-102', 'MEDIUM', getvariable('anchor') + 40, NULL),
        ('LogStream', 'F-201', 'HIGH', getvariable('anchor') + 25, NULL),
        ('LogStream', 'F-202', 'HIGH', getvariable('anchor') - 60, getvariable('anchor') - 70),
        ('Cloudhost', 'F-301', 'LOW', getvariable('anchor') - 10, NULL);

      -- =======================================================================
      -- Data checks: an unowned vendor cannot be chased, an inverted period
      -- would count as coverage.
      -- =======================================================================
      CREATE TABLE blockers AS
      SELECT 'NO_OWNER' AS code, vendor AS ref, 'No business owner to send the actions to' AS detail FROM vendors WHERE owner IS NULL OR owner = ''
      UNION ALL SELECT 'CERT_PERIOD_INVERTED', vendor || ' ' || kind, 'Ends ' || period_end || ' before it starts ' || period_start FROM certificates WHERE period_end < period_start
      UNION ALL SELECT 'UNKNOWN_DATA_CLASS', vendor, 'Data class ' || data_class || ' is not NONE, INTERNAL, PERSONAL or SENSITIVE' FROM vendors WHERE data_class NOT IN ('NONE', 'INTERNAL', 'PERSONAL', 'SENSITIVE');

      -- =======================================================================
      -- Tier. Tier 1 = sensitive data, or critical to operations with spend over 100k.
      -- =======================================================================
      CREATE TABLE tiered AS
      SELECT v.*,
             CASE WHEN data_class = 'SENSITIVE' OR (critical_ops AND annual_spend >= 100000) THEN 1
                  WHEN data_class = 'PERSONAL' OR critical_ops THEN 2
                  WHEN data_class = 'INTERNAL' OR annual_spend >= 25000 THEN 3
                  ELSE 4 END AS tier
      FROM vendors v;
      -- What each tier requires.
      CREATE TABLE tier_rules (tier INT, reassess_days INT, needs_assurance BOOLEAN);
      INSERT INTO tier_rules VALUES (1, 365, true), (2, 365, true), (3, 730, false), (4, NULL, false);

      -- Assurance coverage on the review date, and the gap since the last report ended.
      CREATE TABLE assurance AS
      SELECT vendor, max(period_end) AS covered_until,
             bool_or(getvariable('d') BETWEEN period_start AND period_end) AS covered_now
      FROM certificates WHERE period_end >= period_start GROUP BY vendor;

      CREATE TABLE checks AS
      SELECT t.vendor, t.tier, 'ASSESSMENT_OVERDUE' AS check_code, 'HIGH' AS severity,
             CASE WHEN a.completed_on IS NULL THEN 'Never assessed' ELSE 'Last assessed ' || a.completed_on || ', due ' || (a.completed_on + r.reassess_days) END AS detail,
             coalesce(a.completed_on + r.reassess_days, getvariable('d')) AS due_on
        FROM tiered t JOIN tier_rules r USING (tier) LEFT JOIN assessments a USING (vendor)
        WHERE r.reassess_days IS NOT NULL AND (a.completed_on IS NULL OR a.completed_on + r.reassess_days < getvariable('d'))
      UNION ALL
      SELECT t.vendor, t.tier, 'ASSURANCE_EXPIRED', 'HIGH',
             CASE WHEN s.vendor IS NULL THEN 'No SOC 2, ISO 27001 or PCI report on file' ELSE 'Coverage ended ' || s.covered_until || ', gap of ' || date_diff('day', s.covered_until, getvariable('d')) || ' days' END,
             coalesce(s.covered_until, getvariable('d'))
        FROM tiered t JOIN tier_rules r USING (tier) LEFT JOIN assurance s USING (vendor)
        WHERE r.needs_assurance AND coalesce(s.covered_now, false) = false
      UNION ALL
      SELECT t.vendor, t.tier, 'ASSURANCE_EXPIRING', 'MEDIUM', 'Coverage ends ' || s.covered_until || ': request the bridge letter or next report', s.covered_until
        FROM tiered t JOIN tier_rules r USING (tier) JOIN assurance s USING (vendor)
        WHERE r.needs_assurance AND s.covered_now AND s.covered_until <= getvariable('d') + 45
      UNION ALL
      SELECT t.vendor, t.tier, 'NO_DPA', 'HIGH', 'Processes ' || lower(t.data_class) || ' data with no signed DPA', getvariable('d')
        FROM tiered t LEFT JOIN contracts c USING (vendor)
        WHERE t.data_class IN ('PERSONAL', 'SENSITIVE') AND NOT coalesce(c.dpa_signed, false)
      UNION ALL
      SELECT t.vendor, t.tier, 'NO_AUDIT_RIGHT', 'MEDIUM', 'Tier 1 contract without a right to audit, renews ' || c.renewal_on, c.renewal_on
        FROM tiered t JOIN contracts c USING (vendor) WHERE t.tier = 1 AND NOT c.audit_right
      UNION ALL
      SELECT f.vendor, t.tier, 'FINDING_OVERDUE', CASE WHEN f.severity IN ('HIGH', 'CRITICAL') THEN 'HIGH' ELSE 'MEDIUM' END,
             f.finding_id || ' (' || f.severity || ') past its remediation date ' || f.due_on, f.due_on
        FROM findings f JOIN tiered t USING (vendor) WHERE f.closed_on IS NULL AND f.due_on < getvariable('d') AND f.severity <> 'LOW'
      UNION ALL
      SELECT t.vendor, t.tier, 'RENEWAL_WITH_GAPS', 'MEDIUM', 'Contract renews ' || c.renewal_on || ' with open gaps: fix them before signing', c.renewal_on
        FROM tiered t JOIN contracts c USING (vendor)
        WHERE c.renewal_on <= getvariable('d') + 60 AND t.tier <= 2;
      -- A renewal is only an action if the vendor has something else to fix.
      DELETE FROM checks WHERE check_code = 'RENEWAL_WITH_GAPS' AND vendor NOT IN (SELECT vendor FROM checks WHERE check_code <> 'RENEWAL_WITH_GAPS' AND severity = 'HIGH');

      -- Score: inherent risk by tier, plus 25 per high gap and 10 per medium one, capped at 100.
      CREATE TABLE prev AS SELECT key AS vendor, value::INT AS streak FROM json_each('{{ outputs.state.values.streaks }}');
      CREATE TABLE scored AS
      SELECT t.vendor, t.service, t.owner, t.tier, t.data_class, t.annual_spend,
             least(100, [40, 25, 10, 0][t.tier] + 25 * count(c.check_code) FILTER (WHERE c.severity = 'HIGH') + 10 * count(c.check_code) FILTER (WHERE c.severity = 'MEDIUM'))::INT AS risk_score,
             count(c.check_code) FILTER (WHERE c.severity = 'HIGH')::INT AS high_gaps,
             count(c.check_code) FILTER (WHERE c.severity = 'MEDIUM')::INT AS medium_gaps,
             coalesce(string_agg(c.check_code, ', ' ORDER BY c.check_code), '') AS gaps
      FROM tiered t LEFT JOIN checks c USING (vendor)
      GROUP BY t.vendor, t.service, t.owner, t.tier, t.data_class, t.annual_spend;
      CREATE TABLE result AS
      SELECT s.*, CASE WHEN high_gaps > 0 THEN 'NON_COMPLIANT' WHEN medium_gaps > 0 THEN 'ATTENTION' ELSE 'COMPLIANT' END AS status,
             CASE WHEN high_gaps > 0 THEN coalesce(p.streak, 0) + 1 ELSE 0 END AS streak
      FROM scored s LEFT JOIN prev p USING (vendor);
      ALTER TABLE result ADD COLUMN escalate BOOLEAN; UPDATE result SET escalate = streak >= {{ inputs.escalate_after }};

      COPY (SELECT vendor, service, owner, tier, data_class, annual_spend, risk_score, status, streak, escalate, gaps FROM result ORDER BY risk_score DESC, vendor) TO '{{ outputFiles.vendors }}' (HEADER, DELIMITER ',');
      COPY (SELECT r.owner, c.vendor, c.tier, c.check_code, c.severity, c.detail, c.due_on, r.escalate FROM checks c JOIN result r USING (vendor) ORDER BY r.owner, c.severity, c.vendor) TO '{{ outputFiles.actions }}' (HEADER, DELIMITER ',');
      COPY blockers TO '{{ outputFiles.blockers }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT count(*) FROM result)::INT AS vendors,
        (SELECT string_agg('tier ' || tier || ': ' || n, ', ' ORDER BY tier) FROM (SELECT tier, count(*) AS n FROM result GROUP BY tier)) AS tiers,
        (SELECT string_agg(status || ' ' || n, ', ' ORDER BY status DESC) FROM (SELECT status, count(*) AS n FROM result GROUP BY status)) AS statuses,
        (SELECT coalesce(string_agg(vendor || ' ' || risk_score || ' (' || gaps || ')', '; ' ORDER BY risk_score DESC, vendor), '') FROM result WHERE status = 'NON_COMPLIANT') AS non_compliant,
        (SELECT count(*) FROM checks)::INT AS actions,
        (SELECT count(DISTINCT owner) FROM result WHERE gaps <> '')::INT AS owners,
        (SELECT coalesce(string_agg(vendor || ' (' || streak || ' reviews)', ', ' ORDER BY vendor), '') FROM result WHERE escalate) AS escalations,
        (SELECT count(*) FROM result WHERE escalate)::INT AS escalation_count,
        (SELECT json_group_object(vendor, streak) FROM result WHERE streak > 0)::VARCHAR AS streaks,
        (SELECT count(*) FROM blockers)::INT AS blockers,
        (SELECT coalesce(string_agg(code || ' ' || ref, ', ' ORDER BY code, ref), '') FROM blockers) AS blocker_detail;

  - id: result
    type: io.kestra.plugin.core.output.OutputValues
    values:
      r: "{{ (outputs.review.outputs | last).row | toJson }}"

  - id: log_review
    type: io.kestra.plugin.core.log.Log
    message: |
      Vendor risk review {{ inputs.as_of }} ({{ inputs.scenario }}): {{ outputs.result.values.r | jq('"\(.vendors) vendors, \(.tiers). \(.statuses)."') | first }}
      Non-compliant: {{ outputs.result.values.r | jq('.non_compliant') | first }}
      {{ outputs.result.values.r | jq('"\(.actions) actions for \(.owners) owners. Escalations: \(if .escalations == "" then "none" else .escalations end)."') | first }}
      Blockers: {{ outputs.result.values.r | jq('.blockers') | first }} {{ outputs.result.values.r | jq('.blocker_detail') | first }}

  - id: evidence
    type: io.kestra.plugin.core.namespace.UploadFiles
    namespace: "{{ flow.namespace }}"
    filesMap:
      "{{ render(vars.pack_dir) }}/vendors.csv": "{{ outputs.review.outputFiles.vendors }}"
      "{{ render(vars.pack_dir) }}/actions.csv": "{{ outputs.review.outputFiles.actions }}"
      "{{ render(vars.pack_dir) }}/blockers.csv": "{{ outputs.review.outputFiles.blockers }}"

  - id: gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.result.values.r | jq('.blockers > 0') | first }}"
    then:
      - id: blocked
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Vendor risk review stopped, fix the inventory first: {{ outputs.result.values.r | jq('.blocker_detail') | first }}"

  - id: save
    type: io.kestra.plugin.core.kv.Set
    key: "{{ vars.state_key }}"
    kvType: JSON
    value: >-
      {{ {'old': (kv(vars.state_key, errorOnMissing=false) ?? {'reviews': {}}), 'at': inputs.as_of, 'r': fromJson(outputs.result.values.r)}
         | jq('{reviews: (.old.reviews + {(.at): {streaks: (.r.streaks | fromjson), statuses: .r.statuses, actions: .r.actions}})}') | first | toJson }}

  - id: escalation_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.result.values.r | jq('.escalation_count > 0') | first }}"
    then:
      - id: escalate
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "To the CISO, non-compliant {{ inputs.escalate_after }} reviews in a row or more: {{ outputs.result.values.r | jq('.escalations') | first }}. Actions in {{ render(vars.pack_dir) }}/actions.csv."

triggers:
  - id: monthly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 1 * *"
    disabled: true
    inputs:
      as_of: "{{ trigger.date | date('yyyy-MM-dd') }}"

extend:
  title: Review third-party vendor risk every month with tiering, assurance coverage and CISO escalation
  metaTitle: Third-party vendor risk review and TPRM tiering with Kestra and DuckDB
  shortDescription: Tier every vendor on data, spend and criticality, check assessments, SOC 2 and ISO coverage, DPAs and overdue findings, score the risk, send each owner their actions and escalate repeat offenders to the CISO.
  metaDescription: Third-party risk review in Kestra and DuckDB. Vendor tiering, SOC 2 and ISO coverage gaps, DPAs, overdue findings, risk score and escalation.
  description: |
    Auditors and regulators ask the same question about vendors: do you know which ones hold your data, and can you show each one was checked? ISO 27001 (A.5.19 to A.5.22), SOC 2 (CC9.2) and the EU DORA register of ICT providers all expect the evidence. In practice the vendor list lives in a spreadsheet, SOC 2 reports expire unnoticed, and the e-signature tool that holds every customer contract was never assessed because procurement bought it on a card.

    This flow runs the review every month. It tiers each vendor, checks what its tier requires, scores the risk, writes the action list per owner, and escalates vendors that stay non-compliant.

    It runs with no setup and no network. The demo has 11 vendors:
    - from production hosting and card payments down to office snacks;
    - an expired SOC 2, a report expiring next month, vendors never assessed or with no DPA;
    - an overdue high finding, and a contract renewing with gaps still open.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Tiers

    | Tier | Rule | Reassess every | Needs SOC 2, ISO 27001 or PCI |
    |---|---|---|---|
    | 1 | Sensitive data, or critical to operations with spend of 100,000 or more | 365 days | Yes |
    | 2 | Personal data, or critical to operations | 365 days | Yes |
    | 3 | Internal data, or spend of 25,000 or more | 730 days | No |
    | 4 | Anything else | Never | No |

    ## Checks

    | Check | Severity | Rule |
    |---|---|---|
    | `ASSESSMENT_OVERDUE` | High | Never assessed, or past the tier's cycle |
    | `ASSURANCE_EXPIRED` | High | No report covers the review date: none on file, or a gap since the last one ended |
    | `ASSURANCE_EXPIRING` | Medium | Coverage ends within 45 days: ask for the bridge letter |
    | `NO_DPA` | High | Personal or sensitive data with no signed DPA |
    | `NO_AUDIT_RIGHT` | Medium | Tier 1 contract without a right to audit |
    | `FINDING_OVERDUE` | High or medium | Open finding past its agreed remediation date. Low findings are not chased |
    | `RENEWAL_WITH_GAPS` | Medium | Tier 1 or 2 contract renewing within 60 days while a high gap is open, the best time to get it fixed |

    The risk score is the inherent risk of the tier (40, 25, 10, 0), plus 25 per high gap and 10 per medium gap, capped at 100. A vendor with a high gap is `NON_COMPLIANT`; with only medium gaps, `ATTENTION`.

    ## Escalation

    The number of reviews in a row each vendor has been non-compliant is kept in KV. At `escalate_after` (2 by default) the vendor goes to the CISO, and its actions are marked as escalated. A vendor that fixes its gaps starts again at zero.

    ## How it works

    1. `state` loads the streaks of the previous review.
    2. `review` (`io.kestra.plugin.jdbc.duckdb.Queries`) holds the inventory, assessments, certificates, contracts and findings. It checks the data, then tiers, checks, scores and counts the streaks.
    3. `log_review` prints the result. `evidence` stores `vendors.csv` (tier, score, status, streak, gaps), `actions.csv` (per owner, with due dates) and `blockers.csv`.
    4. `gate` stops on blockers before the history is written: a vendor with no owner (no one to send the actions to), a certificate that ends before it starts (it would count as coverage), an unknown data class.
    5. `save` (`io.kestra.plugin.core.kv.Set`) stores the streaks and the summary of the review.
    6. `escalation_gate` warns with the vendors for the CISO.

    ## Tested end to end

    On Kestra 2.0.3 OSS.

    | Run | Review date | Result |
    |---|---|---|
    | 1 | 2026-09-01 | 11 vendors (tiers 4, 4, 2, 1). 5 non-compliant: SignFast 100 (never assessed, no report, no DPA), Ticketly 95, Cloudhost 65 (SOC 2 ended 2026-08-27), PayBridge 65, ChartBoard 35. 10 actions for 5 owners, no escalation |
    | 2 | 2026-10-01 | 6 non-compliant: Ticketly's SOC 2 has now expired, MailFleet's high finding is past due and its contract renews in 40 days. LogStream `ATTENTION` (report ends in 35 days). 13 actions for 7 owners. 5 vendors escalated to the CISO after 2 reviews |
    | 3 | `ISSUES` | Blocked: an AI note taker with no owner, a SignFast ISO certificate that ends before it starts |

    I recomputed the tier, score, status and streak of the 22 vendor-reviews independently in Python from the inventory and the action lists: every value matches.

    ## Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `as_of` | `2026-10-01` | Review date |
    | `escalate_after` | `2` | Reviews in a row before escalation |
    | `scenario` | `CLEAN` | Demo only |

    ## Use it with your data

    - Replace `vendors`, `assessments`, `certificates`, `contracts` and `findings` with your GRC tool, contract repository and procurement master. Card-paid SaaS from expense reports is where the unknown vendors are.
    - Enable the `monthly` trigger, send each owner their part of `actions.csv`, and open a ticket for each escalation.
    - Adjust `tier_rules` and the tier thresholds to your policy.

    ## Things to know

    - Coverage is taken from the report period, not from the date you received it. A SOC 2 Type II report for last year leaves the months since then uncovered, which is what the bridge letter is for.
    - Fourth parties (your vendors' subprocessors) are not tiered here. Add them as vendors if your policy requires it.

    ## Links

    - DuckDB plugin: https://kestra.io/plugins/plugin-jdbc-duckdb
    - KV store: https://kestra.io/docs/concepts/kv-store
  tags:
    - Business
    - Data
  subTags:
    - Policy & Compliance
    - Reporting & Digests
  ee: false
  demo: true
