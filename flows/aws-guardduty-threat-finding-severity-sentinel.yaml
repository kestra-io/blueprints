id: aws-guardduty-threat-finding-severity-sentinel
namespace: company.ops

inputs:
  - id: aws_region
    type: STRING
    defaults: us-east-1
    description: AWS region where GuardDuty is enabled.
  - id: severity_threshold
    type: FLOAT
    defaults: 7.0
    description: Minimum GuardDuty finding severity to alert on (0–10 scale).

tasks:
  - id: query_guardduty_findings
    type: io.kestra.plugin.aws.cli.AwsCLI
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    region: "{{ inputs.aws_region }}"
    commands:
      - |
        DETECTOR_IDS=$(aws guardduty list-detectors --output json | jq -r '.DetectorIds[]')
        FINDINGS_SUMMARY=""
        HIGH_COUNT=0
        for DETECTOR_ID in $DETECTOR_IDS; do
          FINDING_IDS=$(aws guardduty list-findings \
            --detector-id "$DETECTOR_ID" \
            --finding-criteria "{\"Criterion\":{\"severity\":{\"Gte\":{{ inputs.severity_threshold | int }}}}}" \
            --output json | jq -r '.FindingIds[]' 2>/dev/null || true)
          if [ -n "$FINDING_IDS" ]; then
            IDS_JSON=$(echo $FINDING_IDS | tr ' ' '\n' | head -5 | jq -R . | jq -s .)
            FINDINGS=$(aws guardduty get-findings \
              --detector-id "$DETECTOR_ID" \
              --finding-ids $FINDING_IDS \
              --output json 2>/dev/null || echo '{"Findings":[]}')
            COUNT=$(echo "$FINDINGS" | jq '.Findings | length')
            HIGH_COUNT=$((HIGH_COUNT + COUNT))
            TYPES=$(echo "$FINDINGS" | jq -r '[.Findings[].Type] | unique | join(", ")')
            FINDINGS_SUMMARY="$FINDINGS_SUMMARY DetectorId=$DETECTOR_ID Count=$COUNT Types=$TYPES;"
          fi
        done
        if [ $HIGH_COUNT -gt 0 ]; then
          echo "{\"high_severity_found\": true, \"high_count\": $HIGH_COUNT, \"summary\": \"$FINDINGS_SUMMARY\"}"
        else
          echo "{\"high_severity_found\": false, \"high_count\": 0, \"summary\": \"No high severity findings\"}"
        fi

  - id: evaluate_findings
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_guardduty_findings.vars.high_severity_found | default(false) }}"
    then:
      - id: alert_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":rotating_light: *AWS GuardDuty High Severity Findings Detected*\n• Total high-severity findings: `{{ outputs.query_guardduty_findings.vars.high_count }}`\n• Summary: `{{ outputs.query_guardduty_findings.vars.summary }}`\n• Severity threshold: `{{ inputs.severity_threshold }}`\n• Region: `{{ inputs.aws_region }}`"
          }
    else:
      - id: log_ok
        type: io.kestra.plugin.core.log.Log
        message: "No high-severity GuardDuty findings detected. Region: {{ inputs.aws_region }}"

errors:
  - id: error_alert
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":x: *AWS GuardDuty Sentinel failed*\nExecution `{{ execution.id }}` encountered an error: `{{ error.message }}`"
      }

triggers:
  - id: scheduled_sentinel_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: AWS GuardDuty High Severity Threat Finding Sentinel
  shortDescription: Poll AWS GuardDuty for high-severity threat findings and alert Slack with finding types and resource details.
  description: |
    This sentinel runs on a schedule to detect high-severity security threats reported by AWS GuardDuty. It enumerates
    all active GuardDuty detectors, queries findings above a configurable severity threshold (default 7.0), and sends
    a Slack alert listing the finding types and affected resources when any high-severity finding exists.

    ## How it works

    1. `io.kestra.plugin.aws.cli.AwsCLI` calls `aws guardduty list-detectors` to retrieve all detector IDs in the
       target region.
    2. For each detector, `aws guardduty list-findings` is called with a severity filter using `Gte` (greater than or
       equal to) the configured `severity_threshold` input.
    3. If finding IDs are returned, `aws guardduty get-findings` retrieves the full finding details. The finding types
       are de-duplicated and collected with the detector ID and count.
    4. `io.kestra.plugin.core.flow.If` branches on `high_severity_found`. When `true`, a Slack alert is sent with the
       total count, finding types, and detector summary. When `false`, the flow logs a clean result.
    5. A top-level `errors` block fires a Slack alert on any unhandled exception.

    ## What you get

    - Automated polling of all GuardDuty detectors for high-severity findings every 15 minutes.
    - Slack alerts with finding count, types, and detector-level summary.
    - A configurable severity threshold input so teams can tune alert sensitivity.
    - Full Kestra execution history for every sentinel check.

    ## Who it's for

    - Security operations engineers triaging active threat findings.
    - Cloud security teams running continuous threat detection across AWS accounts.
    - Incident response teams needing immediate Slack notifications for high-severity events.

    ## Why orchestrate this with Kestra

    GuardDuty has native EventBridge integration, but it requires configuring rules, targets, and SNS topics separately.
    Kestra consolidates the detector enumeration, findings query, severity filtering, and Slack alert into one
    declarative flow with retries, execution history, and namespace-scoped secrets — no EventBridge or SNS setup needed.

    ## Prerequisites

    - An AWS IAM identity with `guardduty:ListDetectors`, `guardduty:ListFindings`, and `guardduty:GetFindings`
      permissions.
    - GuardDuty enabled in the target region.
    - A Slack incoming webhook.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key ID.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret access key.
    - `SLACK_WEBHOOK`: Slack incoming webhook URL.

    ## Quick start

    1. Add `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` to your Kestra namespace secrets.
    2. Set `aws_region` to the region where GuardDuty is enabled.
    3. Adjust `severity_threshold` (default: `7.0`) to match your alerting policy.
    4. Enable the schedule trigger or execute manually.

    ## How to extend

    - Loop over multiple regions by using Kestra `ForEach` with a list of region inputs.
    - Add an automated response step that isolates an EC2 instance when a specific finding type is detected.
    - Route findings to PagerDuty for on-call escalation alongside the Slack alert.
    - Persist finding details to S3 or a SIEM for long-term threat analysis.

    ## Links

    - [AWS GuardDuty documentation](https://docs.aws.amazon.com/guardduty/latest/ug/what-is-guardduty.html)
    - [Kestra AWS CLI plugin](https://kestra.io/plugins/plugin-aws)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-notifications)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - AWS Services
  ee: false
  demo: false
