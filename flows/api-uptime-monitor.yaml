id: api-uptime-monitor
namespace: company.team
description: |
  Check a list of APIs and websites on a schedule and alert the on-call
  team the moment one stops answering the way it should. Every endpoint
  on the list gets a real HTTP request. If the status code that comes
  back is not the one you expect, the run logs the outage in plain words
  and, when a Slack webhook is configured, posts the alert to the
  on-call channel in the same run. Healthy endpoints log one UP line
  each, so the execution history is the uptime record.

triggers:
  - id: quarter_hour_uptime_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Every 15 minutes, so an outage is caught within one interval instead of at the next deploy or the first customer complaint.
    cron: "*/15 * * * *"

inputs:
  - id: endpoints
    type: ARRAY
    itemType: STRING
    defaults:
      - "https://example.com"
      - "https://www.google.com"
      - "https://kestra.io"
    description: The APIs and websites to watch — your production endpoints, health-check URLs, and the third-party services your stack depends on.
  - id: expected_status
    type: INT
    defaults: 200
    description: The HTTP status code a healthy endpoint returns. Anything else counts as down.
  - id: slack_webhook_url
    type: STRING
    defaults: ""
    description: Optional. A Slack incoming-webhook URL for the on-call channel. When set, every down endpoint posts an alert there during the run. When left empty, outages are still logged in the execution — just not posted to Slack.

tasks:
  # --- 1. check every endpoint, one at a time ---
  - id: check_each_endpoint
    type: io.kestra.plugin.core.flow.Loop
    description: Walk the endpoint list one at a time and run the check-and-verdict steps for each URL.
    values: "{{ inputs.endpoints}}"
    concurrencyLimit: 1
    tasks:
      # --- 2. one endpoint's check, isolated so its failure can't kill the run ---
      - id: check_one
        type: io.kestra.plugin.core.flow.Sequential
        description: Check one endpoint and record its verdict. A failed request (error status, timeout, unreachable host) is caught by this block's error handler and recorded as DOWN; allowFailure on the block means one dead endpoint never stops the remaining checks or the run summary.
        allowFailure: true
        tasks:
          # --- 3. make the real request ---
          - id: check_endpoint
            type: io.kestra.plugin.core.http.Request
            description: Send a GET request to the endpoint. Kestra's HTTP task itself errors on error statuses (4xx/5xx) and connection failures — that error is the down signal, and the error handler below turns it into the DOWN record.
            uri: "{{ item.value}}"
            method: GET

          # --- 4. verdict when the request completed ---
          - id: endpoint_gate
            type: io.kestra.plugin.core.flow.If
            description: The request completed with a status code. Anything other than the expected code (for example a 204 when 200 is expected) is down; the expected code is up.
            condition: "{{ outputs.check_endpoint.code!= inputs.expected_status}}"
            then:
              # --- 5. the outage record (completed request, wrong code) ---
              - id: log_down
                type: io.kestra.plugin.core.log.Log
                description: Log the outage in plain words with the expected and actual codes, so the execution log alone tells the on-call story.
                level: ERROR
                message: "DOWN: {{ item.value}} returned {{ outputs.check_endpoint.code}} (expected {{ inputs.expected_status}})"

              # --- 6. alert the on-call channel, if one is configured ---
              - id: alert_gate
                type: io.kestra.plugin.core.flow.If
                description: Post to Slack only when a webhook URL was supplied, so the blueprint runs clean with zero setup and alerts for real once the channel is wired in.
                condition: "{{ inputs.slack_webhook_url!= ''}}"
                then:
                  - id: alert_oncall
                    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
                    description: Post the outage to the on-call Slack channel — endpoint, actual code, expected code.
                    url: "{{ inputs.slack_webhook_url}}"
                    payload: |
                      {"text": ":red_circle: UPTIME ALERT — {{ item.value}} is DOWN. It returned {{ outputs.check_endpoint.code}}, expected {{ inputs.expected_status}}. Caught by the Kestra uptime monitor."}
            else:
              # --- 7. the healthy record ---
              - id: log_up
                type: io.kestra.plugin.core.log.Log
                description: Log the healthy result so a quiet run still proves every endpoint was actually checked.
                message: "UP: {{ item.value}} — {{ outputs.check_endpoint.code}}"
        errors:
          # --- 8. the outage record (request failed outright) ---
          - id: log_down_failed_request
            type: io.kestra.plugin.core.log.Log
            description: The request errored — an error status such as 404/500, a timeout, or an unreachable host. No status code survives a failed request, so the record says so instead of inventing one.
            level: ERROR
            message: "DOWN: {{ item.value}} — the request failed (error status, timeout, or unreachable host). Expected a {{ inputs.expected_status}} response."

          # --- 9. alert the on-call channel on a failed request, if configured ---
          - id: alert_gate_failed_request
            type: io.kestra.plugin.core.flow.If
            description: Same Slack gate as the wrong-code path — alert only when a webhook URL was supplied.
            condition: "{{ inputs.slack_webhook_url!= ''}}"
            then:
              - id: alert_oncall_failed_request
                type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
                description: Post the outage to the on-call Slack channel — endpoint and the fact that the request failed.
                url: "{{ inputs.slack_webhook_url}}"
                payload: |
                  {"text": ":red_circle: UPTIME ALERT — {{ item.value}} is DOWN. The request failed (error status, timeout, or unreachable host); expected a {{ inputs.expected_status}} response. Caught by the Kestra uptime monitor."}

  # --- 10. run summary ---
  - id: log_summary
    type: io.kestra.plugin.core.log.Log
    description: Close the run. Any endpoint that did not return the expected code was logged as DOWN above and alerted in the same run.
    message: "Uptime check complete: every configured endpoint was requested. Endpoints not returning {{ inputs.expected_status}} are logged as DOWN above."

extend:
  shortDescription: Check your APIs and websites every 15 minutes and alert the on-call team in Slack the moment one returns the wrong status code.
  title: API Uptime Monitor — Check Endpoints and Alert the On-Call Team
  metaTitle: API Uptime Monitor Blueprint — Scheduled Health Checks with Kestra
  metaDescription: A Kestra blueprint that requests each of your APIs and websites on a schedule, logs UP/DOWN verdicts per endpoint, and posts Slack alerts to the on-call channel when one goes down.
  description: |
    Uptime monitoring is usually a separate paid service or a cron job on a server somebody forgot. This blueprint makes it a flow you own: a list of endpoints, a schedule, a verdict per endpoint, and an alert to the on-call channel in the same run that finds the problem.

    ## How it works

    1. The `io.kestra.plugin.core.trigger.Schedule` trigger fires every 15 minutes (run it manually any time).
    2. A `io.kestra.plugin.core.flow.Loop` walks the `endpoints` input — an array of URLs — one at a time.
    3. Each URL is checked inside its own `io.kestra.plugin.core.flow.Sequential` block set to `allowFailure`, because a dead endpoint is the finding this flow exists for, not a reason to abort the remaining checks.
    4. Inside the block, an `io.kestra.plugin.core.http.Request` sends a real GET request. If the request completes, an `io.kestra.plugin.core.flow.If` compares the returned status code with the `expected_status` input (default 200): a match logs an `UP:` line, a different code logs a `DOWN:` error line with both codes.
    5. Kestra's HTTP task errors on error statuses (4xx/5xx), timeouts, and unreachable hosts — and a failed request produces no status code to compare. Those cases land in the block's `errors` handler, which logs the `DOWN:` record (stating the request failed rather than inventing a code) and runs the same alert path.
    6. On either down path, an `If` checks whether a Slack webhook was configured. If so, `io.kestra.plugin.notifications.slack.SlackIncomingWebhook` (the non-core notifications plugin) posts the outage to the on-call channel during the same run. If not, the execution log is the alert record.
    7. A final log task closes the run, so the execution history reads as a complete uptime record — every check, every verdict, timestamped.

    ## What you get

    - A real check, not a ping: an actual HTTP request and status-code verdict per endpoint, every 15 minutes.
    - Per-incident alerting: each down endpoint alerts on its own, in the run that caught it, with the endpoint and the code it returned.
    - An honest quiet state: healthy endpoints log an `UP:` line each, so a green run is proof the checks ran — never silence mistaken for health.
    - Zero setup for a first run: the defaults check three public sites, so you can watch a full pass immediately, then swap in your own endpoints.

    ## Who it's for

    - Small teams and solo builders running APIs or services without a dedicated monitoring tool.
    - On-call rotations that want outage alerts in the Slack channel they already watch.
    - Anyone learning Kestra who wants one flow that combines a schedule, a loop over real data, branching, and a notification plugin.

    ## Prerequisites

    - A Kestra instance. No Docker, no script runtime, no external monitoring account — the checks use Kestra's core HTTP task.
    - Optional: a Slack incoming webhook URL for the on-call channel, if you want alerts posted to Slack.

    ### Secrets

    The Slack webhook URL is a credential — anyone with it can post to your channel. For real use, store it as a Kestra secret and reference it from the input instead of typing it into the flow, and never commit a live webhook URL to a public repository.

    ## Quick start

    1. Create the flow and run it with the defaults — the three sample endpoints return 200, so you see a clean all-UP run.
    2. Run it again with one endpoint replaced by a URL that returns a different code (any 404 page works) and watch the DOWN path log — and alert, if a webhook is set.
    3. Replace the `endpoints` input with your own APIs and health-check URLs, set `slack_webhook_url`, and let the 15-minute schedule take over.

    ## How to extend

    - Tighten or loosen the cadence — change the trigger's cron to every 5 minutes for production APIs, hourly for low-stakes sites.
    - Check authenticated endpoints by adding headers (an API key or bearer token) to the request task, stored as secrets.
    - Swap or add alert channels — email or PagerDuty notification tasks drop into the same down-path branch next to the Slack alert.
    - Keep a history: append each run's verdicts to a database or a metrics store instead of only the execution log.

    ## Links

    - [Notifications plugin (Slack)](https://kestra.io/plugins/plugin-notifications)
  subTags:
    - Scheduling
  ee: false
  demo: false
