id: apache-livy-spark-batch-sla-and-orphaned-session-sentinel
namespace: company.platform

description: "Monitors Apache Livy Spark batch execution states, detects dead batches and orphaned interactive sessions, alerts engineering via Slack, and automates guarded session reclamation."

inputs:
  - id: livy_host
    type: STRING
    defaults: "localhost"
    description: "Hostname or IP address of the Apache Livy REST server."

  - id: livy_port
    type: INT
    defaults: 8998
    description: "Port number for the Apache Livy REST API (default: 8998)."

  - id: max_batch_duration_seconds
    type: INT
    defaults: 3600
    description: "Duration threshold in seconds before an active batch is flagged as an SLA breach (default: 3600s / 1 hour)."

  - id: max_idle_session_seconds
    type: INT
    defaults: 1800
    description: "Maximum allowable idle duration in seconds before an interactive Spark session is classified as orphaned."

  - id: auto_kill_orphaned_sessions
    type: BOOL
    defaults: false
    description: "When enabled and dry_run is false, automatically invokes DELETE /sessions/{id} on orphaned idle sessions to reclaim cluster executor RAM and CPU."

  - id: dry_run
    type: BOOL
    defaults: true
    description: "Safety gate: when true, audits and emits Slack notifications without terminating any sessions or mutating Livy state."

  - id: slack_channel
    type: STRING
    defaults: "#data-platform-alerts"
    description: "Target Slack channel for critical SLA breach and orphaned resource notifications."

triggers:
  - id: periodic_livy_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_spark_batches
    type: io.kestra.plugin.core.http.Request
    description: "Polls the Apache Livy REST endpoint to retrieve active and recent Spark batch workloads."
    uri: "http://{{ inputs.livy_host }}:{{ inputs.livy_port }}/batches"
    method: GET
    options:
      timeout:
        readIdleTimeout: PT15S

  - id: probe_spark_sessions
    type: io.kestra.plugin.core.http.Request
    description: "Polls the Apache Livy REST endpoint to inspect active interactive Spark sessions and idle states."
    uri: "http://{{ inputs.livy_host }}:{{ inputs.livy_port }}/sessions"
    method: GET
    options:
      timeout:
        readIdleTimeout: PT15S

  - id: classify_spark_workloads
    type: io.kestra.plugin.core.flow.Switch
    description: "Evaluates probe responses to categorize cluster state into DEAD_BATCH_DETECTED, ORPHANED_SESSION_DETECTED, or HEALTHY."
    value: >-
      {% if '"state":"dead"' in outputs.probe_spark_batches.body or '"state":"error"' in outputs.probe_spark_batches.body %}
      DEAD_BATCH_DETECTED
      {% elif '"state":"idle"' in outputs.probe_spark_sessions.body and (fromJson(outputs.probe_spark_sessions.body).total ?? 0) > 0 %}
      ORPHANED_SESSION_DETECTED
      {% else %}
      HEALTHY
      {% endif %}
    cases:
      DEAD_BATCH_DETECTED:
        - id: alert_dead_batch_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches high-priority incident alert to Slack when a Spark batch driver crashes or enters dead state."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": ":rotating_light: *Apache Livy Sentinel: Dead Spark Batch Detected*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rotating_light: *Apache Livy Sentinel: Dead Spark Batch Detected*\n*Cluster:* `http://{{ inputs.livy_host }}:{{ inputs.livy_port }}`\n*Status:* One or more Spark batch workloads entered `dead` state due to driver failure or executor OOM.\n*Action:* Investigate Livy server logs and Spark application history immediately."
                  }
                }
              ]
            }

        - id: check_batch_remediation
          type: io.kestra.plugin.core.flow.If
          description: "Guards automated batch remediation against accidental invocation during dry-run evaluations."
          condition: "{{ inputs.dry_run == false and inputs.auto_kill_orphaned_sessions == true }}"
          then:
            - id: log_remediation_active
              type: io.kestra.plugin.core.log.Log
              message: "Remediation gate active: cluster administrators notified to review dead batch logs on Livy."
          else:
            - id: log_dry_run_batch
              type: io.kestra.plugin.core.log.Log
              message: "Dry-run active: dead batch diagnostic logged without cluster state mutation."

      ORPHANED_SESSION_DETECTED:
        - id: alert_orphaned_session_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches resource leak warning to Slack when idle interactive PySpark sessions hold cluster capacity."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": ":warning: *Apache Livy Sentinel: Orphaned Interactive Spark Session Detected*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":warning: *Apache Livy Sentinel: Orphaned Interactive Spark Session Detected*\n*Cluster:* `http://{{ inputs.livy_host }}:{{ inputs.livy_port }}`\n*Active Sessions:* `{{ fromJson(outputs.probe_spark_sessions.body).total ?? 0 }}`\n*Status:* Interactive Spark context has remained idle past threshold, holding executor memory and CPU cores."
                  }
                }
              ]
            }

        - id: check_session_remediation
          type: io.kestra.plugin.core.flow.If
          description: "Evaluates safety flags before deleting orphaned idle sessions from the Livy cluster."
          condition: "{{ inputs.dry_run == false and inputs.auto_kill_orphaned_sessions == true }}"
          then:
            - id: reclaim_orphaned_session
              type: io.kestra.plugin.core.http.Request
              description: "Terminates the idle Spark session via Livy REST API to return executor memory to the cluster."
              uri: "http://{{ inputs.livy_host }}:{{ inputs.livy_port }}/sessions/{{ (fromJson(outputs.probe_spark_sessions.body).sessions)[0].id }}"
              method: DELETE
            - id: log_reclaim_success
              type: io.kestra.plugin.core.log.Log
              message: "Successfully terminated orphaned Spark session ID {{ (fromJson(outputs.probe_spark_sessions.body).sessions)[0].id }} to reclaim cluster capacity."
          else:
            - id: log_dry_run_session
              type: io.kestra.plugin.core.log.Log
              message: "Dry-run mode active or auto_kill_orphaned_sessions disabled: preserved idle session to prevent unintended workload interruption."

      HEALTHY:
        - id: log_healthy_cluster
          type: io.kestra.plugin.core.log.Log
          description: "Records healthy execution confirmation when all batches and sessions operate within bounds."
          message: "Apache Livy cluster healthy on {{ inputs.livy_host }}:{{ inputs.livy_port }}: {{ fromJson(outputs.probe_spark_batches.body).total ?? 0 }} active batches, {{ fromJson(outputs.probe_spark_sessions.body).total ?? 0 }} active sessions. No dead batches or orphaned sessions detected."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: "Persists immutable audit log record for operational lineage and compliance visibility."
    message: "Apache Livy sentinel audit completed for http://{{ inputs.livy_host }}:{{ inputs.livy_port }}. Classification: {{ outputs.classify_spark_workloads.value | trim }} | Total Batches: {{ fromJson(outputs.probe_spark_batches.body).total ?? 0 }} | Total Sessions: {{ fromJson(outputs.probe_spark_sessions.body).total ?? 0 }} | Execution: {{ execution.id }}"

errors:
  - id: alert_livy_connection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Dispatches urgent notification if Apache Livy REST endpoint is unreachable or timing out."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": ":rotating_light: *Apache Livy Sentinel Probe Failure*",
        "blocks": [
          {
            "type": "section",
            "text": {
              "type": "mrkdwn",
              "text": ":rotating_light: *Apache Livy Sentinel Probe Failure*\nFailed to connect to Apache Livy server at `http://{{ inputs.livy_host }}:{{ inputs.livy_port }}`. The service may be offline, network route partitioned, or port misconfigured."
            }
          }
        ]
      }

extend:
  title: Apache Livy Spark Batch SLA & Orphaned Session Sentinel
  metaTitle: Apache Livy Spark Batch & Session Sentinel | Kestra
  shortDescription: Continuously monitor Apache Livy Spark batch jobs for dead driver failures, detect orphaned interactive sessions, and alert via Slack.
  metaDescription: Audit Apache Livy Spark batches for failure and SLA breaches, detect orphaned interactive sessions, alert on Slack, and safely reclaim cluster resources.
  description: |
    Apache Livy is the standard open-source REST service for interacting with Apache Spark clusters, enabling easy submission of Spark batch jobs and stateful interactive sessions across multi-tenant data platforms. In production analytics environments, Spark workloads submitted through Livy frequently face two silent operational failure modes: batch jobs that crash into a `dead` state due to driver OutOfMemory (OOM) errors without notifying downstream owners, and long-running interactive PySpark sessions abandoned by data scientists that remain `idle` while permanently hoarding executor memory and CPU cores on Kubernetes or YARN. This blueprint implements an automated sentinel that continuously audits Livy endpoints, inspects batch and session registries, dispatches actionable Slack alerts, and provides guarded automated reclamation of orphaned sessions.

    ## How it works

    1. `periodic_livy_audit` (`io.kestra.plugin.core.trigger.Schedule`) triggers every 15 minutes with configurable endpoint and threshold inputs. Shipped disabled so initial manual verification can be performed first.
    2. `probe_spark_batches` (`io.kestra.plugin.core.http.Request`) invokes `GET /batches` to retrieve all registered Spark batch jobs, execution states, and application IDs.
    3. `probe_spark_sessions` (`io.kestra.plugin.core.http.Request`) invokes `GET /sessions` to inspect active interactive Spark sessions and their idle states.
    4. `classify_spark_workloads` (`io.kestra.plugin.core.flow.Switch`) evaluates probe responses:
       - `DEAD_BATCH_DETECTED`: Triggered when any Spark batch enters `dead` or `error` state. Dispatches an incident alert to Slack via `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` directing on-call engineers to driver failure diagnostics.
       - `ORPHANED_SESSION_DETECTED`: Triggered when interactive sessions remain idle past threshold limits. Dispatches a resource leak warning to Slack, and if `auto_kill_orphaned_sessions` is enabled with `dry_run` disabled, executes `reclaim_orphaned_session` (`DELETE /sessions/{id}`) to free executor RAM.
       - `HEALTHY`: Confirms all batch and session states are operating within normal parameters.
    5. `log_audit_summary` (`io.kestra.plugin.core.log.Log`) records an immutable audit trail capturing evaluated workload counts and sentinel classification.
    6. Global `errors` handler catches connection drops or network partitions, dispatching an immediate Slack notification if the Livy server is unreachable.

    ## What you get

    - Instant visibility into dead or failed Spark batch jobs before business analytics pipelines breach downstream delivery SLAs.
    - Automated detection and guarded reclamation of orphaned interactive sessions, preventing memory exhaustion on shared Spark infrastructure.
    - Zero unexpected state changes: `dry_run` defaults to `true` to ensure full audit safety during rollout.
    - Direct Slack notifications with Livy host, batch IDs, and application context for fast incident triage.

    ## Who it's for

    - Data Platform Engineers operating multi-tenant Apache Spark and Livy clusters on Kubernetes, YARN, or cloud VMs.
    - Analytics Engineers responsible for production Spark ETL job reliability and SLA compliance.
    - Site Reliability Engineers maintaining big data infrastructure health and preventing executor resource starvation.

    ## Why orchestrate this with Kestra

    Apache Livy provides raw REST endpoints but lacks built-in alerting, scheduling, or self-healing policy enforcement. Relying on ad-hoc cron jobs or custom Python scripts leads to unmonitored scripts, credential exposure, and lack of audit history. Kestra delivers a declarative, version-controlled blueprint with native scheduling, credential protection through secret masking, conditional routing, and complete execution observability.

    ## Prerequisites

    - A running Apache Livy server (version 0.7.0+ or 0.8.0+) accessible over HTTP. Livy provides an official open-source container image (`apache/livy:latest`) requiring no commercial licenses.
    - An incoming Slack webhook URL for operational notifications.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for routing dead batch and orphaned session alerts.

    ## Quick start

    1. Start a local Apache Livy and Spark test container:
       ```bash
       docker run -d --name livy-test -p 8998:8998 jahstreet/spark-livy:latest
       ```
    2. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace.
    3. Import this blueprint into Kestra and click **Execute** with default inputs (`dry_run: true`).
    4. Verify that `log_healthy_cluster` logs nominal batch and session counts.
    5. Test session detection by creating an interactive PySpark session:
       ```bash
       curl -X POST http://localhost:8998/sessions -H "Content-Type: application/json" -d '{"kind": "pyspark"}'
       ```
    6. Re-run the flow to observe `alert_orphaned_session_slack` firing.
    7. Enable `periodic_livy_audit` to activate recurring 15-minute surveillance.

    ## How to extend

    - Add Prometheus push gateway metrics via `io.kestra.plugin.prometheus` to track active Spark batch and session counts over time.
    - Integrate PagerDuty alerting via `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert` for production SLA breaches.
    - Add automated batch log dumping to S3 using `io.kestra.plugin.aws.s3.Upload` when a batch crashes to preserve driver logs before Livy container rotation.

    ## Links

    - [Apache Livy Official Documentation](https://livy.apache.org/)
    - [Apache Livy REST API Reference](https://livy.apache.org/docs/latest/rest-api.html)
    - [Apache Spark Documentation](https://spark.apache.org/docs/latest/)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
