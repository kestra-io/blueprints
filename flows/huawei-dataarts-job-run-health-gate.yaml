id: huawei-dataarts-job-run-health-gate
namespace: company.team

description: |
  Fetch the latest run of a Huawei Cloud DataArts Factory job, classify it OK, STUCK (still
  waiting or running past a duration threshold), STALE (no run created recently, the job's own
  schedule may have stopped firing), NEEDS_ATTENTION (paused, frozen, skipped, awaiting manual
  confirmation) or CRITICAL (failed, or no run ever found), alert Slack on anything but OK, and
  log a governance audit trail either way.

inputs:
  - id: region
    type: STRING
    displayName: Huawei Cloud region
    description: Region identifier used to sign DataArts Studio requests, for example eu-west-101.
    defaults: "eu-west-101"

  - id: project_id
    type: STRING
    displayName: Huawei Cloud project ID
    description: Required by every DataArts Factory API call, the project ID of the region the DataArts workspace is deployed in.
    defaults: "<your-huawei-project-id>"

  - id: workspace_id
    type: STRING
    displayName: DataArts Studio workspace ID
    description: Leave empty to use the account's default workspace. Required when the account has more than one.
    defaults: ""

  - id: job_name
    type: STRING
    displayName: DataArts Factory job name
    description: Must match the job name exactly as defined in the DataArts Studio console.
    defaults: "my_etl_job"

  - id: max_run_minutes
    type: INT
    displayName: Max run duration in minutes
    description: A run still waiting or running longer than this, measured from its own startTime, is reported STUCK.
    defaults: 60

  - id: max_staleness_hours
    type: INT
    displayName: Max staleness in hours
    description: No run created within this many hours, measured from the latest instance's planTime, is reported STALE.
    defaults: 26

tasks:
  - id: get_run
    type: io.kestra.plugin.huawei.dataarts.GetJobRun
    description: Read-only single fetch of the most recent run instance for job_name. allowFailure lets a job with no run at all (the task throws rather than returning) fall through to evaluate as CRITICAL instead of failing the flow outright.
    allowFailure: true
    accessKeyId: "{{ secret('HUAWEI_AK') }}"
    secretAccessKey: "{{ secret('HUAWEI_SK') }}"
    region: "{{ inputs.region }}"
    projectId: "{{ inputs.project_id }}"
    workspaceId: "{{ inputs.workspace_id != '' ? inputs.workspace_id : null }}"
    jobName: "{{ inputs.job_name }}"

  - id: evaluate
    type: io.kestra.plugin.core.output.OutputValues
    description: Classifies the fetched run. A missing get_run output (the allowFailure case) is treated as CRITICAL, the same as a status of fail.
    values:
      status: "{{ outputs.get_run is defined and outputs.get_run.status != null ? outputs.get_run.status : 'unknown' }}"
      instance_id: "{{ outputs.get_run is defined and outputs.get_run.instanceId != null ? outputs.get_run.instanceId : 'n/a' }}"
      job_instance_name: "{{ outputs.get_run is defined and outputs.get_run.jobInstanceName != null ? outputs.get_run.jobInstanceName : 'n/a' }}"
      severity: "{{ outputs.get_run is not defined ? 'CRITICAL' : (outputs.get_run.status == 'fail' ? 'CRITICAL' : ((outputs.get_run.status == 'running' or outputs.get_run.status == 'waiting') and outputs.get_run.startTime is defined and outputs.get_run.startTime != null and (now() | timestamp) - (outputs.get_run.startTime | timestamp) > inputs.max_run_minutes * 60 ? 'STUCK' : (outputs.get_run.planTime is defined and outputs.get_run.planTime != null and (now() | timestamp) - (outputs.get_run.planTime | timestamp) > inputs.max_staleness_hours * 3600 ? 'STALE' : (outputs.get_run.status == 'success' ? 'OK' : 'NEEDS_ATTENTION')))) }}"

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.evaluate.values.severity != 'OK' }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': outputs.evaluate.values.severity ~ ': DataArts Factory job ' ~ inputs.job_name ~ ' (instance ' ~ outputs.evaluate.values.instance_id ~ ' / ' ~ outputs.evaluate.values.job_instance_name ~ ') status=' ~ outputs.evaluate.values.status ~ '. max_run_minutes=' ~ inputs.max_run_minutes ~ ', max_staleness_hours=' ~ inputs.max_staleness_hours ~ '.'} | toJson }}
    else:
      - id: compliant
        type: io.kestra.plugin.core.log.Log
        message: "DataArts Factory job {{ inputs.job_name }} (instance {{ outputs.evaluate.values.instance_id }}) is healthy: status={{ outputs.evaluate.values.status }}."

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: "DataArts job run health gate complete for {{ inputs.job_name }}: severity {{ outputs.evaluate.values.severity }}, status {{ outputs.evaluate.values.status }}, instance {{ outputs.evaluate.values.instance_id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Huawei DataArts job run health gate failed (execution ' ~ execution.id ~ '). Check the logs.'} | toJson }}

triggers:
  - id: schedule_hourly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled. Enable once HUAWEI_AK, HUAWEI_SK and SLACK_WEBHOOK_URL are set and project_id/job_name point at a real DataArts Factory job.
    cron: "0 * * * *"
    disabled: true
    inputs:
      region: "eu-west-101"
      project_id: "<your-huawei-project-id>"
      workspace_id: ""
      job_name: "my_etl_job"
      max_run_minutes: 60
      max_staleness_hours: 26

extend:
  title: Huawei DataArts Factory Job Run Health Gate
  shortDescription: Fetch the latest Huawei DataArts Factory job run, classify it OK, STUCK, STALE, NEEDS_ATTENTION or CRITICAL, alert Slack on anything but OK, and log an audit trail.
  metaTitle: Huawei DataArts Factory Job Run Health Gate with Kestra
  metaDescription: Fetch the latest Huawei DataArts Factory job run, classify it by status and age, alert Slack on failure or staleness, and log the result.
  description: |
    DataArts Studio's own Monitor Instance view shows a job's last run if someone opens it, but
    nothing pages anyone when a critical ETL job fails at 3am, gets stuck in `waiting` behind a
    cluster resource limit, or quietly stops firing because its schedule was disabled by mistake.
    This blueprint reads the single most recent run instance of a named job with
    `io.kestra.plugin.huawei.dataarts.GetJobRun`, classifies it, and alerts on anything that is not
    a clean, timely success.

    This blueprint was created by [Mohit Jeswani](https://github.com/mohitjeswani01).

    ## How it works

    1. `get_run` (`io.kestra.plugin.huawei.dataarts.GetJobRun`) fetches the most recently created
       run instance for `job_name`. Read-only, no job is started or modified. `allowFailure: true`
       covers the one case the task itself throws on: a job with no run instance at all.
    2. `evaluate` (`io.kestra.plugin.core.output.OutputValues`) classifies the result:
       - `CRITICAL`: `status` is `fail`, or `get_run` itself failed (no run ever found).
       - `STUCK`: `status` is `running` or `waiting` and the elapsed time since `startTime` exceeds
         `max_run_minutes`.
       - `STALE`: the latest instance's own `planTime` is older than `max_staleness_hours`, the
         signal that the job's schedule may have stopped firing rather than that this particular
         run is unhealthy.
       - `OK`: `status` is `success`.
       - `NEEDS_ATTENTION`: anything else (`manual`, `pause`, `freeze`, `skip`).
    3. `route` (`io.kestra.plugin.core.flow.If`):
       - **compliant:** logs the healthy status.
       - **alert:** posts the severity, status, and instance identifiers to Slack.
    4. `summary` logs the severity, status and instance ID, closing the governance cycle.
    5. `errors` alerts Slack if the flow itself fails outside the handled cases, for example an
       expired AK/SK or an unreachable DataArts Studio endpoint.

    ## What you get

    - A single Slack alert that distinguishes an outright failure from a job stuck behind a
      resource limit from a schedule that silently stopped firing, three different problems a
      plain "last run failed" check cannot tell apart.
    - A health check with zero side effects: it never starts, stops, or backfills the job it is
      watching, unlike using `StartJobRun` itself as the monitor.
    - A record, in Kestra's own execution history, of every classification this job received over
      time.

    ## Who it's for

    - Data platform teams running ETL in Huawei Cloud DataArts Factory who want a critical job
      watched for failure and for staleness, not just failure.
    - On-call engineers who want one Slack message naming the instance ID and status instead of
      opening the DataArts Studio console's Monitor Instance view to check.
    - Teams evaluating the Huawei Cloud plugin who want a worked example of `GetJobRun` read alone,
      distinct from `StartJobRun`'s own documented supplement-data workflow.

    ## Why orchestrate this with Kestra

    DataArts Factory has no native alerting on job staleness, and its own run history is a console
    view someone has to remember to open. Kestra supplies the schedule, keeps `max_run_minutes` and
    `max_staleness_hours` as flow inputs instead of buried configuration, and turns a silent status
    field into a Slack page with a severity attached, backed by a full history of every check.

    ## Prerequisites

    - A Huawei Cloud account with DataArts Studio enabled and at least one DataArts Factory job
      already created, with a cron schedule, HTTP trigger, or parent job configured (DataArts
      requires one of these before any instance can ever be created).
    - An AK/SK pair (IAM access key and secret key) with DataArts Factory read permission.
    - The Huawei Cloud project ID for the region the DataArts workspace lives in, and the
      workspace ID if the account has more than one workspace.
    - A Slack incoming webhook URL.

    This flow calls the Huawei Cloud DataArts Studio API directly over HTTPS; there is no official
    local DataArts emulator, so `get_run` cannot be exercised against a local Docker container.
    Point `job_name` at a real job with at least one run in a trial account to test it end to end.

    ### Secrets

    - `HUAWEI_AK`: the IAM access key used by `get_run`. In Kestra OSS, provide it as the
      base64-encoded environment variable `SECRET_HUAWEI_AK`.
    - `HUAWEI_SK`: the IAM secret key paired with `HUAWEI_AK`. In Kestra OSS, provide it as the
      base64-encoded environment variable `SECRET_HUAWEI_SK`.
    - `SLACK_WEBHOOK_URL`: used by `alert` and the `errors` block. In Kestra OSS, provide it as the
      base64-encoded environment variable `SECRET_SLACK_WEBHOOK_URL`.

    ### Inputs

    | Input | Type | Default | Purpose |
    |---|---|---|---|
    | `region` | STRING | `eu-west-101` | Huawei Cloud region used to sign DataArts requests |
    | `project_id` | STRING | `<your-huawei-project-id>` | Required by every DataArts Factory API call |
    | `workspace_id` | STRING | empty | DataArts Studio workspace, empty for the default one |
    | `job_name` | STRING | `my_etl_job` | Job watched by this gate |
    | `max_run_minutes` | INT | `60` | Elapsed running/waiting time reported as STUCK |
    | `max_staleness_hours` | INT | `26` | Age of the latest run's planTime reported as STALE |

    ### Outputs

    - `{{ outputs.get_run.status }}`: `waiting`, `running`, `success`, `fail`, `manual`, `pause`,
      `skip` or `freeze`. Present only when a run instance was found.
    - `{{ outputs.get_run.instanceId }}` / `.jobInstanceName`: identify the exact instance, as shown
      in the console's Monitor Instance list.
    - `{{ outputs.evaluate.values.severity }}`: `OK`, `STUCK`, `STALE`, `NEEDS_ATTENTION` or
      `CRITICAL`.

    ### Pitfalls

    - `GetJobRun` with `instanceId` omitted resolves the single most recent instance only; it is not
      a history query. A job run that failed three runs ago and has since succeeded will not be seen.
    - `allowFailure: true` on `get_run` means an auth error, a typo in `job_name`, or a genuinely
      missing job all surface the same way, as `CRITICAL` with `status: unknown`. Check the task's
      own log on a `CRITICAL` result before assuming the job itself is the problem.
    - `max_staleness_hours` should be set wider than the job's own schedule interval; setting it
      equal to or narrower than the schedule makes every run look STALE right before the next one
      fires.
    - `planTime` and `startTime` can differ from each other by more than the job's schedule interval
      if the job was queued behind a busy cluster; `STUCK` and `STALE` can both fire on the same
      instance when that happens, and `STUCK` is checked first.
    - DataArts requires the watched job to already have a schedule, HTTP trigger, or parent job
      configured in the console. A purely manual job with no trigger of any kind will never produce
      a run instance for `get_run` to find.

    ## Quick start

    1. Add the `HUAWEI_AK`, `HUAWEI_SK` and `SLACK_WEBHOOK_URL` secrets.
    2. Set `project_id`, `workspace_id` (if applicable) and `job_name` to a real DataArts Factory
       job that has already run at least once.
    3. Run the flow manually and confirm `summary` logs `OK` for a healthy job.
    4. Lower `max_staleness_hours` below the job's actual last-run age to confirm `alert` fires with
       `STALE`.
    5. Enable the `schedule_hourly` trigger once the thresholds match the job's real schedule.

    ## How to extend

    - Loop this flow over a list of `job_name` values with `io.kestra.plugin.core.flow.Loop` to
      watch an entire DataArts Factory workspace in one scheduled run.
    - Add a remediation branch that calls `io.kestra.plugin.huawei.dataarts.StartJobRun` with a
      single scheduling period when `severity` is `STALE`, gated behind the same
      `auto_remediate`/`dry_run` pair used elsewhere in this repo's guard blueprints.
    - Replace the Slack `alert` task with a Huawei Cloud SMN `Publish` task to page through Huawei's
      own notification service instead.

    ## Links

    - [Huawei Cloud plugin documentation](https://kestra.io/plugins/plugin-huawei)
    - [Huawei Cloud DataArts Studio API Reference](https://support.huaweicloud.com/intl/en-us/api-dataartsstudio/dataartsstudio_02_0199.html)
    - [Slack Incoming Webhooks](https://api.slack.com/messaging/webhooks)
