id: telemetry_etl_audit_workflow
namespace: prod.data.engineering
description: |
  Autonomous ETL & Quality Audit Pipeline. Generates raw metric batches,
  computes anomaly scores with Python, stores structured artifacts locally,
  and executes downstream data validation rules.

labels:
  environment: local-sandbox
  project: telemetry-metrics
  maintainer: data-team

inputs:
  - id: batch_size
    type: INT
    description: "Number of metric events to generate and validate"
    defaults: 50

  - id: anomaly_threshold
    type: FLOAT
    description: "Standard deviation cutoff for anomaly flagging"
    defaults: 2.0

tasks:
  - id: generate_and_score_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: "Generate synthetic telemetry and calculate z-scores"
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install pandas numpy
    outputFiles:
      - telemetry_scored.json
      - summary_report.json
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    script: |
      import json
      import random
      import numpy as np
      import pandas as pd

      batch_size = int("{{ inputs.batch_size }}")
      threshold = float("{{ inputs.anomaly_threshold }}")

      # Generate synthetic sensor data
      records = []
      for i in range(1, batch_size + 1):
          # Base temperature around 25C with variance
          val = random.gauss(25.0, 3.0)
          # Inject random spikes
          if i % 15 == 0:
              val += 45.0

          records.append({
              "record_id": f"rec_{i:04d}",
              "device_id": f"sensor-node-0{random.randint(1, 5)}",
              "metric_name": "temperature_celsius",
              "value": round(val, 2)
          })

      df = pd.DataFrame(records)

      mean = df['value'].mean()
      std = df['value'].std() or 1.0

      df['z_score'] = ((df['value'] - mean).abs() / std).round(3)
      df['is_anomaly'] = df['z_score'] >= threshold

      total = len(df)
      anomalies = int(df['is_anomaly'].sum())

      # Export data
      df.to_json("telemetry_scored.json", orient="records", indent=2)

      summary = {
          "total_records": total,
          "anomalies_detected": anomalies,
          "mean_value": round(float(mean), 2),
          "std_deviation": round(float(std), 2),
          "threshold_used": threshold
      }

      with open("summary_report.json", "w") as f:
          json.dump(summary, f, indent=2)

      print(f"Generated {total} records. Flagged {anomalies} anomalies.")

  - id: log_metrics_summary
    type: io.kestra.plugin.core.log.Log
    description: "Print audit metrics to the execution console"
    message: |
      Batch Processing Complete:
      - Execution ID: {{ execution.id }}
      - Total Records: {{ fromJson(read(outputs.generate_and_score_metrics.outputFiles['summary_report.json'])).total_records }}
      - Anomalies: {{ fromJson(read(outputs.generate_and_score_metrics.outputFiles['summary_report.json'])).anomalies_detected }}
      - Mean: {{ fromJson(read(outputs.generate_and_score_metrics.outputFiles['summary_report.json'])).mean_value }} C
      - Std Dev: {{ fromJson(read(outputs.generate_and_score_metrics.outputFiles['summary_report.json'])).std_deviation }}

  - id: evaluate_quality_gate
    type: io.kestra.plugin.core.flow.If
    description: "Branch workflow based on data quality status"
    condition: "{{ fromJson(read(outputs.generate_and_score_metrics.outputFiles['summary_report.json'])).anomalies_detected > 0 }}"
    then:
      - id: warn_on_anomalies
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "Quality Gate Alert: {{ fromJson(read(outputs.generate_and_score_metrics.outputFiles['summary_report.json'])).anomalies_detected }} anomalous data points detected in batch."
    else:
      - id: confirm_healthy_batch
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Quality Gate Passed: All metrics are within expected normal tolerances."