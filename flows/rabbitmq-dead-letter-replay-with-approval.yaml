extend:
  title: Replay RabbitMQ Dead Letters by x-death Reason After Approval
  metaTitle: RabbitMQ Dead-Letter Replay with Approval | Kestra
  shortDescription: Group a RabbitMQ dead-letter queue by x-death reason, wait for an operator, then replay the approved messages in rate-limited batches with replay headers.
  metaDescription: Group RabbitMQ dead letters by x-death reason, approve in Kestra, and replay them to their source queue in rate-limited batches with a replay limit.
  description: |
    Group a dead-letter backlog by cause and replay only what an operator approves.

    ## How it works

    1. A schedule starts the flow each hour in working hours.
    2. Three management API `Download` tasks run in `Parallel`. The snapshot uses `ack_requeue_true`, so no message leaves the queue.
    3. A Python script groups messages by the latest `x-death` reason and source queue. It blocks a message at the `x-replay-count` limit, when its route is gone, or when the payload is binary.
    4. Slack and a `Pause` show the summary. The operator selects reasons and resumes with REPLAY or KEEP. At `approval_timeout`, Kestra cancels the run.
    5. On REPLAY, AMQP `Consume` drains the snapshot. A script matches messages by id and payload hash. Approved messages get replay headers. Other reasons go back to the queue with `x-dlq-*` headers. Blocked messages go to the parking queue.
    6. A `Loop` publishes one batch at a time and waits `batch_interval`.
    7. The flow reads the live queue depth, writes a KV summary and reports.

    ## What you get

    - A grouped backlog view before any change.
    - Replay to the source queue only (QUEUE) or to the original exchange and routing key (EXCHANGE).
    - Headers `x-replay-count`, `x-replayed-by`, `x-replayed-at` and `x-replay-reason`.
    - A replay limit, a parking queue, a bounded rate and a failure alert.

    ## Who it's for

    - Platform and SRE teams that operate RabbitMQ.
    - Owners of consumers that dead-letter messages.

    ## Why orchestrate this with Kestra

    - Approval, replay and audit record are in one execution.
    - Retries, timeouts and concurrency are in YAML.

    ## Prerequisites

    - RabbitMQ 3.8 or later with the management plugin, and a dead-letter exchange to `dlq_queue`.
    - A user with the `management` tag and configure, write and read permissions on the virtual host.
    - Text payloads, and a Docker task runner.
    - A classic `dlq_queue`. Snapshot requeues can count toward a quorum queue delivery limit.

    ### Secrets

    - `RABBITMQ_USERNAME`: RabbitMQ user for AMQP and the management API.
    - `RABBITMQ_PASSWORD`: Password of that user.
    - `SLACK_WEBHOOK_URL`: Slack webhook for all notifications.

    ## Quick start

    1. Add the secrets.
    2. Set `rabbitmq_host` and `management_url` in `variables`.
    3. Execute the flow and read the summary.
    4. Resume with KEEP to test, or with REPLAY.

    ## How to extend

    - Upload drained messages to object storage first.
    - Send the approval request to Microsoft Teams.

    ## Links

    - [AMQP Consume](https://kestra.io/plugins/plugin-amqp/io.kestra.plugin.amqp.consume)
    - [AMQP Publish](https://kestra.io/plugins/plugin-amqp/io.kestra.plugin.amqp.publish)
    - [Pause](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.pause)
    - [Loop](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop)
    - [HTTP Download](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download)
    - [RabbitMQ dead letter exchanges](https://www.rabbitmq.com/docs/dlx)
    - [RabbitMQ HTTP API](https://www.rabbitmq.com/docs/http-api-reference)
  tags:
    - Infrastructure
  subTags:
    - Approval Gates
    - Day 2 Operations
