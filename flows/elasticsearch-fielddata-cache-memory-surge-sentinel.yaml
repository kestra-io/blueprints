id: elasticsearch-fielddata-cache-memory-surge-sentinel
namespace: company.team

inputs:
  - id: es_host
    type: STRING
    defaults: "elasticsearch.internal"
    description: Elasticsearch cluster hostname or IP address.
  - id: es_port
    type: INT
    defaults: 9200
    description: Elasticsearch HTTP port.
  - id: es_user
    type: STRING
    defaults: "elastic"
    description: Elasticsearch username.
  - id: max_fielddata_mb_threshold
    type: INT
    defaults: 2048
    description: Maximum acceptable fielddata memory consumption in Megabytes before alerting.

tasks:
  - id: query_fielddata_metrics
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests
    env:
      ES_HOST: "{{ inputs.es_host }}"
      ES_PORT: "{{ inputs.es_port }}"
      ES_USER: "{{ inputs.es_user }}"
      ES_PASSWORD: "{{ secret('ES_PASSWORD') }}"
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      host = os.environ.get("ES_HOST", "elasticsearch.internal")
      port = os.environ.get("ES_PORT", "9200")
      user = os.environ.get("ES_USER", "elastic")
      password = os.environ.get("ES_PASSWORD", "")

      auth = (user, password) if user and password else None
      url = f"http://{host}:{port}/_nodes/stats/indices/fielddata"

      try:
          resp = requests.get(url, auth=auth, timeout=15)
          resp.raise_for_status()
          data = resp.json()
      except Exception as e:
          print(f"CRITICAL: Failed to query Elasticsearch fielddata stats at {url}: {e}", file=sys.stderr)
          sys.exit(1)

      nodes = data.get("nodes", {})
      total_bytes = 0
      total_evictions = 0

      for node_id, node_data in nodes.items():
          fd = node_data.get("indices", {}).get("fielddata", {})
          total_bytes += fd.get("memory_size_in_bytes", 0)
          total_evictions += fd.get("evictions", 0)

      fielddata_mb = int(total_bytes / (1024 * 1024))

      report = {
          "fielddata_mb": fielddata_mb,
          "evictions": total_evictions,
          "total_bytes": total_bytes
      }

      with open("fielddata_report.json", "w") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "fielddata_mb": fielddata_mb,
          "evictions": total_evictions
      })
      print(f"Fielddata metrics: {fielddata_mb} MB, {total_evictions} evictions")
    outputFiles:
      - fielddata_report.json

  - id: evaluate_fielddata_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_fielddata_metrics.vars.fielddata_mb | int > inputs.max_fielddata_mb_threshold or outputs.query_fielddata_metrics.vars.evictions | int > 0 }}"
    then:
      - id: notify_search_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#elasticsearch-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Elasticsearch Fielddata Cache Surge Alert",
                "text": "Elasticsearch cluster on `{{ inputs.es_host }}` recorded *{{ outputs.query_fielddata_metrics.vars.fielddata_mb }} MB* of JVM heap consumed by fielddata cache (*{{ outputs.query_fielddata_metrics.vars.evictions }}* evictions)! Impact: Unbounded aggregations on text fields are consuming heap memory, threatening OutOfMemory (OOM) cluster crashes.",
                "footer": "Kestra Search Sentinel • Elasticsearch"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#elasticsearch-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Elasticsearch Fielddata Cache Memory Surge Sentinel Pipeline Failure",
            "text": "Failed to scrape Elasticsearch fielddata cache metrics. Verify cluster network connectivity. Execution ID: {{ execution.id }}",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Elasticsearch fielddata cache memory usage and evictions to prevent JVM heap exhaustion and OOM crashes."
  metaTitle: Elasticsearch Fielddata Cache Memory Surge Sentinel with Kestra
  title: Elasticsearch Fielddata Cache Memory Surge Sentinel
  shortDescription: Audits Elasticsearch fielddata cache memory usage and evictions to prevent JVM heap exhaustion and OOM crashes.
  description: |
    ## How it works
    This workflow queries `GET /_nodes/stats/indices/fielddata` across the Elasticsearch cluster. Fielddata is loaded into the JVM heap on demand when executing aggregations or sorting on `text` fields. Unbounded fielddata caches trigger high JVM garbage collection pauses and eventually OutOfMemory (OOM) fatal crashes. When cache memory exceeds configured thresholds or evictions are detected, the search engineering team is alerted.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[periodic_schedule Schedule Trigger] --> B[query_fielddata_metrics Python Script]
      B --> C{Memory Exceeds Limit or Evictions Occurred?}
      C -- Yes --> D[notify_search_team Slack Webhook]
      C -- No --> E[Fielddata Healthy]
    ```

    ## Prerequisites
    - Elasticsearch cluster (7.x / 8.x) accessible via REST.
    - Secrets `ES_PASSWORD` and `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure cluster host, port, and fielddata memory threshold.
    3. Run manually to evaluate cluster fielddata allocation.

    ## Links
    - [Elasticsearch Fielddata Documentation](https://www.elastic.co/guide/en/elasticsearch/reference/current/text.html#fielddata-mapping-param)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
