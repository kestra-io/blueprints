id: elasticsearch-fielddata-cache-memory-surge-sentinel
namespace: company.data

inputs:
  - id: es_host
    type: STRING
    defaults: "elasticsearch.internal"
    description: Elasticsearch cluster hostname or IP address.
  - id: es_port
    type: INT
    defaults: 9200
    description: Elasticsearch HTTP port.
  - id: es_user
    type: STRING
    defaults: "elastic"
    description: Elasticsearch username.
  - id: max_fielddata_mb_threshold
    type: INT
    defaults: 2048
    description: Maximum acceptable fielddata memory consumption in Megabytes before alerting.

tasks:
  - id: query_fielddata_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - |
        curl -s -u "{{ inputs.es_user }}:{{ secret('ES_PASSWORD') }}" \
          "http://{{ inputs.es_host }}:{{ inputs.es_port }}/_nodes/stats/indices/fielddata" > /tmp/es_fielddata.json
        
        TOTAL_FIELDDATA_BYTES=$(jq '[.nodes | to_entries[].value.indices.fielddata.memory_size_in_bytes] | add // 0' /tmp/es_fielddata.json)
        TOTAL_FIELDDATA_MB=$(( TOTAL_FIELDDATA_BYTES / 1024 / 1024 ))
        TOTAL_EVICTIONS=$(jq '[.nodes | to_entries[].value.indices.fielddata.evictions] | add // 0' /tmp/es_fielddata.json)
        
        echo "::set-output name=fielddata_mb::$TOTAL_FIELDDATA_MB::"
        echo "::set-output name=evictions::$TOTAL_EVICTIONS::"

  - id: evaluate_fielddata_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_fielddata_metrics.vars.fielddata_mb | int > inputs.max_fielddata_mb_threshold or outputs.query_fielddata_metrics.vars.evictions | int > 0 }}"
    then:
      - id: notify_search_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#elasticsearch-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Elasticsearch Fielddata Cache Surge Alert",
                "text": "Elasticsearch cluster on `{{ inputs.es_host }}` recorded *{{ outputs.query_fielddata_metrics.vars.fielddata_mb }} MB* of JVM heap consumed by fielddata cache (*{{ outputs.query_fielddata_metrics.vars.evictions }}* evictions)! Impact: Unbounded aggregations on text fields are consuming heap memory, threatening OutOfMemory (OOM) cluster crashes.",
                "footer": "Kestra Search Sentinel • Elasticsearch"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#elasticsearch-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Elasticsearch Fielddata Cache Memory Surge Sentinel Pipeline Failure",
            "text": "Failed to scrape Elasticsearch fielddata cache metrics. Verify cluster network connectivity.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Elasticsearch Fielddata Cache Memory Surge Sentinel
  shortDescription: Monitors Elasticsearch fielddata cache memory and evictions to prevent unconstrained JVM heap exhaustion.
  description: |
    ## How it works
    This workflow monitors `_nodes/stats/indices/fielddata` across all cluster nodes. Unlike doc values, fielddata is loaded into JVM heap memory when aggregations or sorting occur on text fields. Because fielddata is expensive to build, once loaded it remains in memory until evicted or until circuit breakers trip. If fielddata size or eviction count spikes, Slack is notified immediately.

    ## What you get
    - Immediate detection of abusive text-field aggregations and sorts.
    - Prevents circuit breaker trips (`Data too large`) and JVM OOM crashes.
    - Clear visibility into heap memory pressure caused by search queries.

    ## Who it's for
    - Elasticsearch Administrators and SREs guarding cluster stability.
    - Application Developers running search and analytics queries against Elasticsearch.

    ## Why orchestrate this with Kestra
    - **Targeted Cache Visibility**: Track fielddata separately from OS filesystem page cache.
    - **Early OOM Prevention**: Alert engineers before JVM garbage collection pauses cascade.
    - **Operational Best Practices**: Encourages migration to keyword subfields and doc values.

    ## Prerequisites
    - Elasticsearch cluster with REST access.
    - Secrets `ES_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import blueprint into Kestra.
    2. Configure cluster host and fielddata threshold.
    3. Run the workflow to audit fielddata heap usage.

    ## How to extend
    - Automatically clear fielddata cache via `POST /_cache/clear?fielddata=true` upon emergency surge.
    - Identify specific abusive queries via slow logs.

    ## Links
    - [Elasticsearch Fielddata Documentation](https://www.elastic.co/guide/en/elasticsearch/reference/current/text.html#fielddata-mapping-param)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Data
    - Infrastructure
  ee: false
  demo: false
