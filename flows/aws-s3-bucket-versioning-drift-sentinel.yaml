id: aws-s3-bucket-versioning-drift-sentinel
namespace: company.sre

description: |
  Audits AWS S3 bucket versioning configuration via AWS CLI to catch disabled versioning, unversioned object overwrites, and compliance drift.

concurrency:
  limit: 1

inputs:
  - id: bucket_name
    type: STRING
    displayName: "Bucket Name"
    defaults: "production-data-lake-raw"
    description: "Target S3 bucket name to audit."

triggers:
  - id: scheduled_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: amazon/aws-cli:latest
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      BUCKET_NAME: "{{ inputs.bucket_name }}"
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
      AWS_DEFAULT_REGION: "us-east-1"
    commands:
      - |
        STATUS=$(aws s3api get-bucket-versioning --bucket "$BUCKET_NAME" --query "Status" --output text 2>/dev/null || echo "Disabled")
        IS_ALERT=false
        if [ "$STATUS" != "Enabled" ]; then IS_ALERT=true; fi
        cat <<JSON > output.json
        {"bucket": "$BUCKET_NAME", "versioning_status": "$STATUS", "is_alert": $IS_ALERT}
        JSON
    outputFiles:
      - output.json

  - id: evaluate_threshold
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.probe_metrics.outputFiles['output.json'])).is_alert }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#infrastructure-alerts",
            "text": "🚨 *AWS S3 Versioning Drift Detected: `{{ inputs.bucket_name }}`*\n- *Status*: `{{ json(read(outputs.probe_metrics.outputFiles['output.json'])).versioning_status }}`"
          }

errors:
  - id: notify_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#infrastructure-alerts",
        "text": "❌ *Sentinel probe execution failed for aws-s3-bucket-versioning-drift-sentinel*"
      }

