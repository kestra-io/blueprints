id: postgres-role-timeout-guard
namespace: company.team

description: |
  Check that every PostgreSQL login role used by applications runs with statement_timeout,
  idle_in_transaction_session_timeout and lock_timeout set, by resolving the value each role
  really gets in each database (role in database, then role, then database, then server). A
  role with a timeout at 0 can hold locks or a transaction open forever. Alert Slack, and
  optionally set the missing timeouts with ALTER ROLE at the scope that currently wins, then
  audit again to verify.

inputs:
  - id: jdbc_url
    type: STRING
    displayName: JDBC URL
    defaults: "jdbc:postgresql://localhost:5432/app"

  - id: excluded_roles
    type: ARRAY
    itemType: STRING
    displayName: Roles not checked
    description: Login roles allowed to run without timeouts, for example migration or backup roles.
    defaults:
      - migration_bot

  - id: statement_timeout
    type: STRING
    displayName: statement_timeout to apply
    defaults: "30s"

  - id: idle_in_transaction_session_timeout
    type: STRING
    displayName: idle_in_transaction_session_timeout to apply
    defaults: "60s"

  - id: lock_timeout
    type: STRING
    displayName: lock_timeout to apply
    defaults: "10s"

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, for ALTER ROLE to run.
    defaults: true

variables:
  audit_sql: |
    WITH wanted(name, value, severity) AS (
      VALUES ('statement_timeout', {{ {'v': inputs.statement_timeout} | jq('.v | "\u0027" + gsub("\u0027"; "\u0027\u0027") + "\u0027"') | first }}, 'MEDIUM'),
             ('idle_in_transaction_session_timeout', {{ {'v': inputs.idle_in_transaction_session_timeout} | jq('.v | "\u0027" + gsub("\u0027"; "\u0027\u0027") + "\u0027"') | first }}, 'HIGH'),
             ('lock_timeout', {{ {'v': inputs.lock_timeout} | jq('.v | "\u0027" + gsub("\u0027"; "\u0027\u0027") + "\u0027"') | first }}, 'MEDIUM')
    ), roles AS (
      SELECT oid, rolname FROM pg_roles
       WHERE rolcanlogin AND NOT rolsuper AND rolname !~ '^pg_'
         AND rolname NOT IN ({{ inputs.excluded_roles | jq('if length == 0 then "\u0027\u0027" else map("\u0027" + gsub("\u0027"; "\u0027\u0027") + "\u0027") | join(",") end') | first }})
    ), dbs AS (
      SELECT oid, datname FROM pg_database WHERE datallowconn AND NOT datistemplate
    ), cfg AS (
      SELECT s.setrole, s.setdatabase, split_part(c, '=', 1) AS name, substr(c, length(split_part(c, '=', 1)) + 2) AS value
        FROM pg_db_role_setting s, unnest(s.setconfig) c
    ), server AS (
      SELECT w.name, coalesce((SELECT f.setting FROM pg_file_settings f WHERE f.name = w.name AND f.applied ORDER BY f.seqno DESC LIMIT 1),
                              (SELECT boot_val FROM pg_settings p WHERE p.name = w.name)) AS value
        FROM wanted w
    ), eff AS (
      SELECT r.rolname, d.datname, w.name, w.value AS wanted, w.severity,
             coalesce(rd.value, ro.value, db.value, sv.value) AS value,
             CASE WHEN rd.value IS NOT NULL THEN 'ROLE_IN_DATABASE' WHEN ro.value IS NOT NULL THEN 'ROLE'
                  WHEN db.value IS NOT NULL THEN 'DATABASE' ELSE 'SERVER' END AS source
        FROM roles r CROSS JOIN dbs d CROSS JOIN wanted w
        LEFT JOIN cfg rd ON rd.setrole = r.oid AND rd.setdatabase = d.oid AND rd.name = w.name
        LEFT JOIN cfg ro ON ro.setrole = r.oid AND ro.setdatabase = 0 AND ro.name = w.name
        LEFT JOIN cfg db ON db.setrole = 0 AND db.setdatabase = d.oid AND db.name = w.name
        LEFT JOIN server sv ON sv.name = w.name
       WHERE has_database_privilege(r.oid, d.oid, 'CONNECT')
    )
    SELECT 'NO_' || upper(name) AS finding, severity, rolname AS role, datname AS database, name AS setting, value, source, wanted,
           CASE WHEN source = 'ROLE_IN_DATABASE' THEN format('ALTER ROLE %I IN DATABASE %I SET %s = %L', rolname, datname, name, wanted)
                ELSE format('ALTER ROLE %I SET %s = %L', rolname, name, wanted) END AS fix_sql
      FROM eff
     WHERE (CASE WHEN value ~ '^[0-9]+$' THEN value || 'ms' ELSE value END)::interval = interval '0'
     ORDER BY severity, role, database, setting

tasks:
  - id: audit
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Read-only. Resolves the effective value per role and database from pg_db_role_setting, pg_file_settings and pg_settings.
    url: "{{ inputs.jdbc_url }}"
    username: "{{ secret('POSTGRES_USERNAME') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH
    sql: "{{ render(vars.audit_sql) }}"

  - id: fixes
    type: io.kestra.plugin.core.output.OutputValues
    description: A role-level fix covers every database, so identical statements are applied once.
    values:
      sql: "{{ outputs.audit.rows | jq('map(.fix_sql) | unique') | first | toJson }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      Timeout audit on {{ inputs.jdbc_url }}: {{ outputs.audit.size }} role, database and setting combinations with no timeout.
      {{ outputs.audit.rows | jq('group_by(.role) | map("\(.[0].role): " + (group_by(.setting) | map("\(.[0].setting)=0 in \(map(.database) | join("+")) (from \(map(.source) | unique | join("/")))") | join(", "))) | join("; ")') | first }}.

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit.size > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'PostgreSQL ' ~ inputs.jdbc_url ~ ': login roles running without timeouts, which can hold locks or transactions open forever: ' ~ (outputs.audit.rows | jq('group_by(.role) | map("\(.[0].role): \(map(.setting) | unique | join(", "))") | join("; ")') | first) ~ '.' ~ (inputs.auto_remediate and not inputs.dry_run ? ' Setting them now.' : ' No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: remediate
            type: io.kestra.plugin.core.flow.Loop
            description: Sequential on purpose. Concurrent ALTER ROLE ... SET on the same role collide in pg_db_role_setting (tuple concurrently updated).
            concurrencyLimit: 1
            values: "{{ outputs.fixes.values.sql }}"
            tasks:
              - id: fix
                type: io.kestra.plugin.jdbc.postgresql.Query
                allowFailure: true
                url: "{{ inputs.jdbc_url }}"
                username: "{{ secret('POSTGRES_USERNAME') }}"
                password: "{{ secret('POSTGRES_PASSWORD') }}"
                fetchType: NONE
                sql: "{{ item.value }}"

          - id: reaudit
            type: io.kestra.plugin.jdbc.postgresql.Query
            url: "{{ inputs.jdbc_url }}"
            username: "{{ secret('POSTGRES_USERNAME') }}"
            password: "{{ secret('POSTGRES_PASSWORD') }}"
            fetchType: FETCH
            sql: "{{ render(vars.audit_sql) }}"

          - id: verify_result
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.reaudit.size > 0 }}"
            then:
              - id: remediation_failed
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: "Some roles still run without a timeout: {{ outputs.reaudit.rows | jq('map(\"\\(.role)/\\(.database) \\(.setting)\") | join(\", \")') | first }}. The connecting role needs CREATEROLE."
            else:
              - id: remediated
                type: io.kestra.plugin.core.log.Log
                message: "Set and verified: {{ fromJson(outputs.fixes.values.sql) | join('; ') }}. New sessions of these roles get the timeouts, existing sessions keep their values until they reconnect."
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "Every checked login role has the three timeouts in every database it can connect to."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'PostgreSQL role timeout guard failed on ' ~ inputs.jdbc_url ~ ' (execution ' ~ execution.id ~ '). Check the logs.'} | toJson }}

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled, and always in safe mode.
    cron: "30 5 * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: PostgreSQL Role Timeout Guard
  shortDescription: Resolve the statement, idle-in-transaction and lock timeouts each PostgreSQL login role really gets in each database, alert Slack on roles running without them, and optionally set them with ALTER ROLE and verify.
  metaTitle: PostgreSQL Role Timeout Guard with Kestra
  metaDescription: Find PostgreSQL login roles running without statement, idle-in-transaction or lock timeouts, alert Slack, set them with ALTER ROLE and verify.
  description: |
    PostgreSQL ships with `statement_timeout`, `idle_in_transaction_session_timeout` and `lock_timeout` all at 0, meaning no limit. Three things follow:
    - an application that opens a transaction and waits on an HTTP call keeps its locks, and blocks vacuum, until someone kills it;
    - a migration waiting for a lock queues every query behind it;
    - a report with a bad plan runs for hours.

    Setting the timeouts per role is the usual fix. Knowing which value a role really gets is harder: a role-in-database setting overrides the role, which overrides the database, which overrides the server.

    This blueprint resolves that order for every login role and every database it can connect to, and reports the combinations where a timeout is 0. It alerts Slack, and can set the missing timeouts with `ALTER ROLE` at the scope that currently wins, then audit again to verify.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Findings

    | Finding | Severity | Effect of a 0 value |
    |---|---|---|
    | `NO_IDLE_IN_TRANSACTION_SESSION_TIMEOUT` | High | An idle transaction keeps its locks and its snapshot forever, blocking vacuum |
    | `NO_STATEMENT_TIMEOUT` | Medium | A runaway query runs until killed |
    | `NO_LOCK_TIMEOUT` | Medium | A statement waits for a lock forever, and queues everything behind it |

    The effective value is resolved like PostgreSQL does at login:
    1. `ALTER ROLE ... IN DATABASE`;
    2. `ALTER ROLE`;
    3. `ALTER DATABASE`;
    4. the server configuration (`pg_file_settings`, else the built-in default).

    Superusers, `pg_*` roles and `excluded_roles` are not checked.

    ## How it works

    1. `audit` (`io.kestra.plugin.jdbc.postgresql.Query`, read-only) crosses every checked login role with every database it can connect to and the three settings. It resolves the effective value from `pg_db_role_setting`, and returns the combinations at 0 with their source and a fix. The fix is built with `format('%I')` and `%L`, at the role-in-database scope when that is the one setting 0, otherwise at the role scope.
    2. `fixes` removes duplicates, since a role-level fix covers every database. `summary` logs the findings grouped by role.
    3. `route` (`io.kestra.plugin.core.flow.If`):
       - **clean:** logs it.
       - **findings:** `alert` posts to Slack.
         - `remediate_gate` runs only when `auto_remediate` is true and `dry_run` is false.
         - `remediate` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) runs each `ALTER ROLE` in turn. Concurrent `ALTER ROLE ... SET` on one role collide in `pg_db_role_setting`.
         - `reaudit` and `verify_result` fail if any combination is still at 0.
    4. `errors` alerts Slack when the audit cannot run.

    ## What you get

    - The timeout every application role really runs with, per database, and where that value comes from.
    - Fixes at the right scope, so an explicit 0 set for one database is replaced rather than left winning.
    - A second audit as proof, and roles you exclude on purpose left alone.

    ## Who it's for

    - Teams whose applications hold transactions open across network calls.
    - DBAs who have had to kill `idle in transaction` sessions blocking vacuum or migrations.
    - Teams evaluating the PostgreSQL plugin who want an example of a catalog query driving `ALTER ROLE`.

    ## Why orchestrate this with Kestra

    The settings are spread across four levels, and new roles arrive with every service. Kestra resolves them on a schedule, sends the roles at risk to Slack, applies the fix only behind `auto_remediate` and `dry_run`, one statement at a time, verifies the result, and keeps a history of every change.

    ## Tested end to end

    On Kestra 2.0.5 OSS against PostgreSQL 16 (databases `app` and `postgres`), with a local HTTP sink standing in for Slack. Seeded settings:
    - `app_rw`: `statement_timeout=15s`;
    - `reporting`: an explicit `idle_in_transaction_session_timeout=0` at role level;
    - `etl_nopass`: `lock_timeout=10s` only in `app`;
    - database `app`: `idle_in_transaction_session_timeout=5min`;
    - `migration_bot`: excluded.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | defaults | 28 combinations at 0 over 6 roles, each with its source. `app_rw` statement timeout and the database-level idle timeout in `app` are correctly seen as set. `reporting`'s explicit 0 is reported with source `ROLE`. Alert sent |
    | 2 | `auto_remediate: true`, `dry_run: true` | Same report. `pg_db_role_setting` unchanged |
    | 3 | `auto_remediate: true`, `dry_run: false`, before `concurrencyLimit: 1` | `verify_result` failed on 3 combinations. The PostgreSQL log shows `tuple concurrently updated`: parallel `ALTER ROLE` on the same role. The flow now runs them one at a time |
    | 4 | same, sequential | The 3 remaining fixes applied and verified. A new `reporting` session shows `30s`, `1min`, `10s`. A new `app_rw` session keeps its own `15s`, and `pg_sleep(40)` as `app_rw` is cancelled by the timeout |
    | 5 | defaults | Clean. `migration_bot` still runs with no timeout, as excluded |
    | 6 | unreachable database | `errors` alert sent |

    ## Prerequisites

    - For the audit, a role that can read `pg_db_role_setting` and `pg_file_settings` (superuser or `pg_read_all_settings`). For remediation, a role with `CREATEROLE`.
    - Local testing:
      - `docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=pg postgres:16`;
      - create a few login roles, and set timeouts on some of them with `ALTER ROLE ... SET`.

    ### Secrets

    - `POSTGRES_USERNAME` / `POSTGRES_PASSWORD`: credentials used by every query.
    - `SLACK_WEBHOOK_URL`: used by `alert` and the `errors` block.
    - In Kestra OSS, provide each one as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `jdbc_url` | `jdbc:postgresql://localhost:5432/app` | Server to audit, through any database |
    | `excluded_roles` | `[migration_bot]` | Roles allowed to run without timeouts |
    | `statement_timeout` | `30s` | Value applied |
    | `idle_in_transaction_session_timeout` | `60s` | Value applied |
    | `lock_timeout` | `10s` | Value applied |
    | `auto_remediate` | `false` | Allow `ALTER ROLE` |
    | `dry_run` | `true` | Must be `false` for a statement to run |

    ## Quick start

    1. Add the `POSTGRES_USERNAME`, `POSTGRES_PASSWORD` and `SLACK_WEBHOOK_URL` secrets.
    2. Import the flow, set `jdbc_url`, and list in `excluded_roles` the roles that legitimately run long statements.
    3. Run it once and read the findings per role.
    4. Agree the values with the application owners, then run with `auto_remediate: true` and `dry_run: false`.
    5. Enable the `daily` trigger, which always runs in safe mode.

    ## How to extend

    - Flag timeouts that are set but too high, such as a `statement_timeout` of a day.
    - Apply different values per role from a map, for example longer for reporting roles.
    - Also check `transaction_timeout` on PostgreSQL 17.
    - Loop over a list of servers to check every cluster.

    ## Links

    - Client connection defaults: https://www.postgresql.org/docs/current/runtime-config-client.html
    - PostgreSQL plugin: https://kestra.io/plugins/plugin-jdbc-postgres
  tags:
    - Data
    - Infrastructure
  subTags:
    - Policy & Compliance
    - Day 2 Operations
  ee: false
  demo: false
