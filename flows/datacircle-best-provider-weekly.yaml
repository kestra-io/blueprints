id: datacircle-best-provider-weekly
namespace: company.team

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: 0 9 * * 1

inputs:
  - id: api
    type: STRING
    description: An API slug from https://api.datacircle.dev/v1/apis
    defaults: linkedin-profile

tasks:
  - id: best
    type: io.kestra.plugin.core.http.Request
    uri: "https://api.datacircle.dev/v1/apis/{{ inputs.api }}/best?limit=3"

  - id: log_best
    type: io.kestra.plugin.core.log.Log
    message: >-
      Best {{ fromJson(outputs.best.body).api }} provider this week:
      {{ fromJson(outputs.best.body).plans[0].provider }}.
      Full ranking: {{ fromJson(outputs.best.body).bestPage }}

extend:
  shortDescription: Every Monday, read who is the best provider for an API from the Datacircle benchmark and log it.
  title: Find the best provider for an API every week with Datacircle
  metaTitle: Best API Provider Check with Datacircle in Kestra
  metaDescription: Call the open Datacircle API from Kestra on a schedule to see which provider ranks first for an API, with no key.
  description: |
    Datacircle benchmarks GTM APIs and publishes the results. This blueprint reads the top providers for one API every Monday and logs the winner.

    ## How it works
    1. A `io.kestra.plugin.core.trigger.Schedule` trigger fires every Monday at 09:00.
    2. The `best` task (`io.kestra.plugin.core.http.Request`) calls `GET /apis/{slug}/best` on the open Datacircle API. No key is needed.
    3. The `log_best` task (`io.kestra.plugin.core.log.Log`) writes the first provider and a link to the full ranking.

    ## Prerequisites
    - A running Kestra instance.

    ## Quick start
    1. Import this flow into a namespace.
    2. Set the `api` input to a slug from the list of APIs.
    3. Run it once by hand to see the log line.

    ## How to extend
    - Send the log line to Slack or email when the first provider changes.
    - Loop over several API slugs in one flow.

    ## Links
    - [Datacircle API spec](https://api.datacircle.dev/v1/openapi.json)
    - [Datacircle](https://datacircle.dev)
  tags:
    - Core
  subTags:
    - Scheduling
  ee: false
  demo: false
