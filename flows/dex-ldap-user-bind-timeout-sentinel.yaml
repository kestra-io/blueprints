id: dex-ldap-user-bind-timeout-sentinel
namespace: company.team

description: |
  Audits Dex identity provider telemetry to detect LDAP connector bind timeouts, connection pool exhaustion, and Active Directory authentication stalls.

concurrency:
  limit: 1

inputs:
  - id: dex_metrics_url
    type: STRING
    displayName: "Dex Metrics Endpoint"
    defaults: "http://dex.auth.svc.cluster.local:5558/metrics"
    description: "Base HTTP URL exposing Prometheus metrics for the Dex identity provider service."

  - id: ldap_connector_id
    type: STRING
    displayName: "LDAP Connector ID"
    defaults: "corp-active-directory"
    description: "Identifier of the configured Dex LDAP connector under active surveillance."

  - id: max_failed_binds_threshold
    type: INT
    displayName: "Max Failed Binds"
    defaults: 10
    description: "Maximum allowable failed LDAP bind attempts within the audit window before triggering alerts."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which Dex LDAP connector authentication metrics are evaluated."

  - id: alert_on_timeouts
    type: BOOL
    displayName: "Alert On Bind Timeouts"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting elevated LDAP bind failures."

tasks:
  - id: scan_dex_ldap_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Dex Prometheus metrics to calculate LDAP connector bind failures, connection pool saturation, and login errors.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.dex_metrics_url }}"
      CONNECTOR_ID: "{{ inputs.ldap_connector_id }}"
      MAX_FAILS: "{{ inputs.max_failed_binds_threshold }}"
      LOOKBACK_MIN: "{{ inputs.lookback_minutes }}"
    outputFiles:
      - dex_ldap_metrics.json
    script: |
      import os
      import sys
      import re
      import json
      from datetime import datetime, timezone
      import requests
      from kestra import Kestra

      metrics_url = os.environ.get("METRICS_URL", "http://dex.auth:5558/metrics")
      connector_id = os.environ.get("CONNECTOR_ID", "corp-ldap")
      max_fails = int(os.environ.get("MAX_FAILS", "10"))
      lookback = int(os.environ.get("LOOKBACK_MIN", "15"))

      failed_binds = 0
      successful_logins = 0

      try:
          resp = requests.get(metrics_url, timeout=15)
          resp.raise_for_status()
          lines = resp.text.splitlines()

          for line in lines:
              if line.startswith("#") or not line.strip():
                  continue
              if "dex_login_failed_total" in line and f'connector="{connector_id}"' in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      failed_binds += int(float(match.group(1)))
              elif "dex_login_successful_total" in line and f'connector="{connector_id}"' in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      successful_logins += int(float(match.group(1)))
      except Exception as err:
          print(f"ERROR: Failed to reach Dex metrics endpoint '{metrics_url}': {err}", file=sys.stderr)
          sys.exit(1)

      total_attempts = successful_logins + failed_binds
      denominator = total_attempts if total_attempts > 0 else (failed_binds + 50)
      failure_pct = round((float(failed_binds) / float(denominator)) * 100.0, 3)
      is_breached = bool(failed_binds >= max_fails)
      now_iso = datetime.now(timezone.utc).isoformat()

      print(f"Dex LDAP Audit Complete: Attempts={denominator}, FailedBinds={failed_binds}, FailPct={failure_pct}%, Alert={is_breached}")

      report = {
          "failed_binds_count": failed_binds,
          "successful_logins_count": successful_logins,
          "total_login_attempts": denominator,
          "bind_failure_percent": failure_pct,
          "is_alerting": is_breached,
          "connector_id": connector_id,
          "audit_timestamp": now_iso
      }
      with open("dex_ldap_metrics.json", "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs(report)

  - id: evaluate_bind_threshold
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed LDAP connector bind failures exceed configured enterprise security bounds.
    condition: "{{ outputs.scan_dex_ldap_metrics.vars.is_alerting and inputs.alert_on_timeouts }}"
    then:
      - id: notify_slack_iam_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to IAM SecOps Slack channel detailing Dex LDAP connector failures.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#iam-security-alerts",
            "username": "Dex LDAP Sentinel",
            "icon_emoji": ":lock:",
            "text": "CRITICAL: Dex LDAP connector authentication failures detected on `{{ inputs.ldap_connector_id }}`. Failed Binds: `{{ outputs.scan_dex_ldap_metrics.vars.failed_binds_count }}` (threshold: `{{ inputs.max_failed_binds_threshold }}`). Success Logins: `{{ outputs.scan_dex_ldap_metrics.vars.successful_logins_count }}`. Failure Rate: `{{ outputs.scan_dex_ldap_metrics.vars.bind_failure_percent }}%`. Upstream Active Directory or OpenLDAP domain controllers may be unreachable or experiencing connection pool exhaustion."
          }
    else:
      - id: log_nominal_ldap_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Dex LDAP connector authentication functions within safety margins.
        message: "Dex LDAP connector {{ inputs.ldap_connector_id }} nominal. Failed binds {{ outputs.scan_dex_ldap_metrics.vars.failed_binds_count }} is below threshold {{ inputs.max_failed_binds_threshold }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured JSON audit payload for identity governance archives, SOC2 compliance, and audit records.
    format: |
      {
        "sentinel_id": "dex-ldap-user-bind-timeout-sentinel",
        "connector_id": "{{ inputs.ldap_connector_id }}",
        "failed_binds": {{ outputs.scan_dex_ldap_metrics.vars.failed_binds_count }},
        "successful_logins": {{ outputs.scan_dex_ldap_metrics.vars.successful_logins_count }},
        "total_attempts": {{ outputs.scan_dex_ldap_metrics.vars.total_login_attempts }},
        "failure_percent": {{ outputs.scan_dex_ldap_metrics.vars.bind_failure_percent }},
        "breached": {{ outputs.scan_dex_ldap_metrics.vars.is_alerting }}
      }

errors:
  - id: notify_ldap_sentinel_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatches alert to Slack when Dex LDAP Sentinel fails execution.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#iam-security-alerts",
        "username": "Dex LDAP Sentinel",
        "icon_emoji": ":warning:",
        "text": "CRITICAL: Dex LDAP Sentinel execution failed for connector `{{ inputs.ldap_connector_id }}` on execution `{{ execution.id }}`. Check Dex metrics endpoint reachability."
      }

triggers:
  - id: periodic_ldap_auth_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Dex LDAP User Bind Timeout & Auth Stall Sentinel
  metaTitle: Dex LDAP User Bind Timeout Sentinel Blueprint
  shortDescription: Audits Dex identity provider metrics for LDAP bind failures, connection pool stalls, and active directory timeouts.
  metaDescription: Audits Dex identity provider metrics for LDAP bind failures, connection pool stalls, and active directory timeouts with automated Slack alerting.
  description: |
    Dex acts as an OIDC identity provider proxying authentication requests to downstream directory services like OpenLDAP and Active Directory. When LDAP connection pools exhaust or network latency spikes, user binds stall, blocking single sign-on across the organization. This sentinel interrogates Dex Prometheus metrics, evaluates bind failure thresholds, and alerts IAM teams via Slack.

    ## How it works
    1. Interrogates Dex Prometheus metrics endpoint using a containerized Python script.
    2. Parses `dex_login_failed_total` and `dex_login_successful_total` for the specified connector.
    3. Triggers Slack alert if failed binds breach threshold.
    4. Emits structured compliance manifest for identity governance auditing.

    ## Prerequisites
    - Reachable Dex metrics endpoint.
    - Slack Incoming Webhook secret configured.
  tags:
    - Infrastructure
    - Security
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
