id: rds-manual-snapshot-rotation-guard
namespace: company.team
description: |
  Automate the Amazon RDS manual snapshot lifecycle: create a timestamped
  snapshot for every listed DB instance, prune snapshots older than the
  retention window to stop snapshot sprawl from eating storage budget, and
  post a run summary to Slack. Solves the classic ops pain where manual
  snapshots pile up forever because nobody remembers to delete them , 
  you always keep exactly N days of restore points, nothing more.

triggers:
  - id: nightly_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Runs nightly at 01:00 UTC. Shipped disabled; enable it after your first successful manual run.
    cron: "0 1 * * *"
    disabled: true

inputs:
  - id: db_instance_identifiers
    type: ARRAY
    itemType: STRING
    defaults: ["app-production"]
    description: RDS DB instance identifiers to snapshot every night.
  - id: retention_days
    type: INT
    defaults: 7
    description: Number of days of manual snapshots to keep. Older snapshots are deleted.
  - id: aws_region
    type: STRING
    defaults: us-east-1
    description: AWS region hosting the RDS instances.

tasks:
  - id: create_snapshots
    type: io.kestra.plugin.core.flow.Loop
    description: Create one timestamped manual snapshot per DB instance.
    values: "{{ inputs.db_instance_identifiers }}"
    tasks:
      - id: create_snapshot
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: Create a manual snapshot named <instance>-yyyyMMdd-HHmm.
        region: "{{ inputs.aws_region }}"
        accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
        commands:
          - aws rds create-db-snapshot --db-instance-identifier "{{ item.value }}" --db-snapshot-identifier "{{ item.value }}-{{ execution.startDate | date('yyyyMMdd-HHmm') }}" --region "{{ inputs.aws_region }}"

  - id: prune_old_snapshots
    type: io.kestra.plugin.aws.cli.AwsCLI
    description: Delete manual snapshots older than the retention window.
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        CUTOFF=$(date -u -d "{{ inputs.retention_days }} days ago" +%Y-%m-%dT%H:%M:%SZ)
        echo "Pruning manual snapshots older than $CUTOFF"
        for DB in {{ inputs.db_instance_identifiers | join(' ') }}; do
          echo "Checking $DB ..."
          aws rds describe-db-snapshots --db-instance-identifier "$DB" --snapshot-type manual \
            --query "DBSnapshots[?SnapshotCreateTime<'$CUTOFF'].DBSnapshotIdentifier" \
            --output text --region "{{ inputs.aws_region }}" | tr '\t' '\n' | while read -r SNAP; do
            if [ -n "$SNAP" ] && [ "$SNAP" != "None" ]; then
              aws rds delete-db-snapshot --db-snapshot-identifier "$SNAP" --region "{{ inputs.aws_region }}"
              echo "deleted $SNAP"
            fi
          done
        done

  - id: notify_slack
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Post the snapshot rotation summary to Slack.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": ":database: RDS snapshot rotation finished for `{{ inputs.db_instance_identifiers | join(', ') }}` (retention: {{ inputs.retention_days }} days).\n```{{ outputs.prune_old_snapshots.stdout }}```"
      }

extend:
  title: RDS Manual Snapshot Rotation Guard
  metaTitle: Automate RDS Snapshot Lifecycle and Retention | Kestra
  shortDescription: Create nightly timestamped RDS snapshots, automatically prune anything older than your retention window, and get a Slack summary after every run.
  metaDescription: Automate Amazon RDS manual snapshots with Kestra, nightly creation, retention-based pruning to cut storage costs, and Slack reporting.
  description: |
    Manual RDS snapshots are the safety net every team wants and nobody maintains. Someone creates them before a migration, then they pile up for months, quietly adding to the AWS bill while nobody knows which ones are still needed. This blueprint turns snapshot hygiene into a scheduled, auditable flow.

    ## How it works

    1. A Schedule trigger fires nightly at 01:00 UTC (shipped disabled so you can test first).
    2. A ForEach loop iterates over your `db_instance_identifiers` and creates one timestamped manual snapshot per instance via the AWS CLI.
    3. A pruning task lists manual snapshots per instance, compares `SnapshotCreateTime` against the retention cutoff, and deletes anything older.
    4. A Slack webhook posts the full run log so the team sees exactly what was created and deleted.

    ## What you get

    - Exactly N days of restore points, never more, never fewer.
    - Lower RDS snapshot storage spend with zero manual cleanup.
    - A nightly audit trail in Slack showing every snapshot created and pruned.
    - Timestamped snapshot names (`instance-20261017-0100`) that sort chronologically.

    ## Who it's for

    Platform engineers, DBAs, and DevOps teams running Amazon RDS in production who are tired of paying for forgotten snapshots.

    ## Why orchestrate this with Kestra

    A cron job on one EC2 instance is invisible and unmonitored. As a Kestra flow you get retries on transient AWS API failures, per-task logs, execution history, and a single place where the whole team can see last night's rotation, plus inputs like `retention_days` editable without touching code.

    ## Prerequisites

    - AWS credentials with `rds:CreateDBSnapshot`, `rds:DeleteDBSnapshot`, and `rds:DescribeDBSnapshots` permissions.
    - A Slack incoming webhook URL for the summary notification.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the RDS API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the RDS API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the run summary.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `db_instance_identifiers` to your RDS instances and `retention_days` to your policy (default 7).
    3. Run the flow manually once and check the Slack message.
    4. Enable the schedule trigger for nightly runs.

    ## How to extend

    - Add a wait step (`rds wait db-snapshot-available`) before pruning for strict ordering.
    - Copy snapshots to a second region for disaster recovery with `rds copy-db-snapshot`.
    - Route failures to PagerDuty instead of Slack.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [RDS create-db-snapshot API](https://docs.aws.amazon.com/cli/latest/reference/rds/create-db-snapshot.html)
    - [RDS delete-db-snapshot API](https://docs.aws.amazon.com/cli/latest/reference/rds/delete-db-snapshot.html)
  tags:
    - Infrastructure
  subTags:
    - Day 2 Operations
    - FinOps & Cost Management
  ee: false
  demo: false
