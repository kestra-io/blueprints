id: rds-manual-snapshot-rotation-guard
namespace: company.team
description: |
  Automate the Amazon RDS manual snapshot lifecycle: create a timestamped
  snapshot for every listed DB instance, prune snapshots older than the
  retention window to stop snapshot sprawl from eating storage budget, and
  post a run summary to Slack. Solves the classic ops pain where manual
  snapshots pile up forever because nobody remembers to delete them —
  you always keep exactly N days of restore points, nothing more.

triggers:
  - id: nightly_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Runs nightly at 01:00 UTC. Shipped disabled; enable it after your first successful manual run.
    cron: "0 1 * * *"
    disabled: true

inputs:
  - id: db_instance_identifiers
    type: ARRAY
    itemType: STRING
    defaults: ["app-production"]
    description: RDS DB instance identifiers to snapshot every night.
  - id: retention_days
    type: INT
    defaults: 7
    description: Number of days of manual snapshots to keep. Older snapshots are deleted.
  - id: aws_region
    type: STRING
    defaults: us-east-1
    description: AWS region hosting the RDS instances.

tasks:
  - id: create_snapshots
    type: io.kestra.plugin.core.flow.ForEach
    description: Create one timestamped manual snapshot per DB instance.
    values: "{{ inputs.db_instance_identifiers }}"
    tasks:
      - id: create_snapshot
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: Create a manual snapshot named <instance>-yyyyMMdd-HHmm.
        region: "{{ inputs.aws_region }}"
        accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
        commands:
          - aws rds create-db-snapshot --db-instance-identifier "{{ taskrun.value }}" --db-snapshot-identifier "{{ taskrun.value }}-{{ execution.startDate | date('yyyyMMdd-HHmm') }}" --region "{{ inputs.aws_region }}"

  - id: prune_old_snapshots
    type: io.kestra.plugin.aws.cli.AwsCLI
    description: Delete manual snapshots older than the retention window.
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        CUTOFF=$(date -u -d "{{ inputs.retention_days }} days ago" +%Y-%m-%dT%H:%M:%SZ)
        echo "Pruning manual snapshots older than $CUTOFF"
        for DB in {{ inputs.db_instance_identifiers | join(' ') }}; do
          echo "Checking $DB ..."
          aws rds describe-db-snapshots --db-instance-identifier "$DB" --snapshot-type manual \
            --query "DBSnapshots[?SnapshotCreateTime<'$CUTOFF'].DBSnapshotIdentifier" \
            --output text --region "{{ inputs.aws_region }}" | tr '\t' '\n' | while read -r SNAP; do
            if [ -n "$SNAP" ] && [ "$SNAP" != "None" ]; then
              aws rds delete-db-snapshot --db-snapshot-identifier "$SNAP" --region "{{ inputs.aws_region }}"
              echo "deleted $SNAP"
            fi
          done
        done

  - id: notify_slack
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Post the snapshot rotation summary to Slack.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": ":database: RDS snapshot rotation finished for `{{ inputs.db_instance_identifiers | join(', ') }}` (retention: {{ inputs.retention_days }} days).\n```{{ outputs.prune_old_snapshots.stdout }}```"
      }
