id: autobahn-roadworks-closure-route-watch
namespace: company.team

description: |
  Closure and narrow-roadworks watch for German motorways, built on the keyless Autobahn GmbH traffic API.
  Every two hours the flow reads the closures and roadworks of the motorways your trucks use, keeps carriageway
  closures (and optionally ramp closures) that are active or start within the look-ahead window, plus roadworks
  that squeeze the passage below your widest load, and posts only the ones it has not reported before to Slack.

inputs:
  - id: roads
    type: ARRAY
    itemType: STRING
    displayName: Watched motorways
    description: Autobahn numbers (A1, A7, A100...). Case and spaces are ignored; numbers the API does not know are named in the summary.
    defaults: ["A1", "A2", "A3", "A7"]

  - id: lookahead_hours
    type: INT
    defaults: 72
    description: Closures and roadworks that are active now or start within this many hours are watched.

  - id: include_ramp_closures
    type: BOOL
    defaults: false
    description: |
      Also report closed entries and exits (`CLOSURE_ENTRY_EXIT`). Off by default because there are about thirty per
      motorway at any time; carriageway closures (`CLOSURE`) are always reported.

  - id: max_load_width_m
    type: FLOAT
    defaults: 3.0
    description: |
      Roadworks whose posted maximum passage width ("Maximale Durchfahrtsbreite") is below this value are reported,
      which matters for wide loads and oversize permits. 0 turns the roadworks check off.

triggers:
  - id: every_2_hours
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "15 */2 * * *"

tasks:
  - id: fetch_road_list
    type: io.kestra.plugin.core.http.Download
    description: The list of motorways the API knows, used to flag typos such as `A 7` or roads without data.
    uri: https://verkehr.autobahn.de/o/autobahn/
    retry:
      type: constant
      interval: PT30S
      maxAttempts: 3

  - id: each_road
    type: io.kestra.plugin.core.flow.Loop
    description: Two requests per motorway (closures, roadworks), two motorways at a time. An unknown number returns an empty list.
    values: "{{ inputs.roads | toJson }}"
    concurrencyLimit: 2
    outputs:
      - id: closures
        type: STRING
        value: "{{ outputs.fetch_closures.uri }}"
      - id: roadworks
        type: STRING
        value: "{{ outputs.fetch_roadworks.uri }}"
    tasks:
      - id: fetch_closures
        type: io.kestra.plugin.core.http.Download
        uri: "https://verkehr.autobahn.de/o/autobahn/{{ item.value | upper | replace({' ': ''}) | urlencode }}/services/closure"
        retry:
          type: exponential
          interval: PT20S
          maxInterval: PT2M
          maxAttempts: 4

      - id: fetch_roadworks
        type: io.kestra.plugin.core.http.Download
        uri: "https://verkehr.autobahn.de/o/autobahn/{{ item.value | upper | replace({' ': ''}) | urlencode }}/services/roadworks"
        retry:
          type: exponential
          interval: PT20S
          maxInterval: PT2M
          maxAttempts: 4

  - id: previous_state
    type: io.kestra.plugin.core.kv.Get
    description: Keys of the closures and roadworks already reported. Missing on the first run, which is then the BASELINE.
    key: autobahn_closure_watch_seen
    errorOnMissing: false

  - id: analyse
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Flattens both feeds per motorway. The start time comes from `startTimestamp` when the API sends it, otherwise from
      the first date and time in the German description ("23.10.26 von 00:00 bis 05:15 Uhr"); items whose start cannot
      be read stay in scope. `isBlocked` is "false" on every item, so carriageway closures are recognised by
      `display_type = CLOSURE`. The maximum passage width is read from the roadworks description.
    timeZoneId: UTC
    fetchType: FETCH
    inputFiles: |
      {
        "roads.json": "{{ outputs.fetch_road_list.uri }}"{% for it in outputs.each_road.outputs %},
        "cl_{{ it.item.iteration }}.json": "{{ it.outputs.closures }}",
        "rw_{{ it.item.iteration }}.json": "{{ it.outputs.roadworks }}"{% endfor %}
      }
    parameters:
      roads: "{{ inputs.roads | toJson }}"
      seen: "{{ outputs.previous_state.value ?? '[]' }}"
      baseline: "{{ outputs.previous_state.value is not defined or outputs.previous_state.value is empty }}"
      lookahead: "{{ inputs.lookahead_hours }}"
      ramps: "{{ inputs.include_ramp_closures }}"
      width: "{{ inputs.max_load_width_m }}"
    sql: |
      -- Start times in the descriptions are German local time
      SET TimeZone = 'Europe/Berlin';

      CREATE TEMP TABLE watch AS
      SELECT CAST(generate_subscripts(l, 1) AS INTEGER) - 1 AS idx, upper(replace(unnest(l), ' ', '')) AS road
      FROM (SELECT from_json(:roads, '["VARCHAR"]') AS l);

      CREATE TEMP TABLE known AS
      SELECT trim(unnest(from_json(content->'$.roads', '["VARCHAR"]'))) AS road FROM read_text('roads.json');

      CREATE TEMP TABLE items AS
      WITH raw AS (
        SELECT CAST(regexp_extract(filename, '(cl|rw)_([0-9]+)\.json$', 2) AS INTEGER) AS idx,
               CASE WHEN regexp_extract(filename, '(cl|rw)_([0-9]+)\.json$', 1) = 'cl' THEN 'closure' ELSE 'roadworks' END AS service,
               unnest(from_json(coalesce(content->'$.closure', content->'$.roadworks'), '["JSON"]')) AS j
        FROM read_text(['cl_*.json', 'rw_*.json']))
      SELECT w.road, service, j->>'$.identifier' AS identifier, j->>'$.display_type' AS kind,
             CAST(j->>'$.future' AS BOOLEAN) AS future, trim(j->>'$.title') AS title, trim(j->>'$.subtitle') AS direction,
             j->>'$.coordinate.lat' AS lat, j->>'$.coordinate.long' AS lon,
             array_to_string(from_json(j->'$.description', '["VARCHAR"]'), ' | ') AS descr,
             CAST(j->>'$.startTimestamp' AS TIMESTAMPTZ) AS start_ts
      FROM raw JOIN watch w USING (idx);

      CREATE TEMP TABLE parsed AS
      SELECT *,
             coalesce(start_ts, try_strptime(
               regexp_extract(descr, '([0-9]{2}\.[0-9]{2}\.[0-9]{2})[^0-9]{1,40}?([0-9]{2}' || chr(58) || '[0-9]{2})', 1) || ' ' ||
               regexp_extract(descr, '([0-9]{2}\.[0-9]{2}\.[0-9]{2})[^0-9]{1,40}?([0-9]{2}' || chr(58) || '[0-9]{2})', 2),
               '%d.%m.%y %H' || chr(58) || '%M')) AS starts,
             TRY_CAST(replace(regexp_extract(descr, 'Durchfahrtsbreite[^0-9]*([0-9]+[.,]?[0-9]*) m', 1), ',', '.') AS DOUBLE) AS width_m,
             nullif(regexp_extract(descr, 'L.nge[^0-9|]*([0-9]+[.,]?[0-9]* km)', 1), '') AS length_km,
             nullif(trim(CASE WHEN descr LIKE '%Beginn%' THEN regexp_extract(descr, '(Beginn[^|]*[|][^|]*Ende[^|]*)', 1)
                              ELSE regexp_extract(descr, '([0-9]{2}[.][0-9]{2}[.][0-9]{2}[^|]*)', 1) END), '') AS timing
      FROM items;

      CREATE TEMP TABLE scoped AS
      SELECT road || '/' || service || '/' || identifier AS key,
             CASE WHEN kind = 'CLOSURE' THEN 'CARRIAGEWAY CLOSED'
                  WHEN kind = 'CLOSURE_ENTRY_EXIT' THEN 'RAMP CLOSED'
                  ELSE 'NARROW ' || width_m || ' m' END AS reason, *
      FROM parsed
      WHERE (kind = 'CLOSURE'
             OR (kind = 'CLOSURE_ENTRY_EXIT' AND CAST(:ramps AS BOOLEAN))
             OR (service = 'roadworks' AND width_m < CAST(:width AS DOUBLE)))
        AND (NOT future OR starts IS NULL OR starts <= now() + to_hours(CAST(:lookahead AS INTEGER)));

      CREATE TEMP TABLE seen AS SELECT k AS key, split_part(k, '/', 1) AS road FROM (SELECT unnest(from_json(:seen, '["VARCHAR"]')) AS k);

      CREATE TEMP TABLE fresh AS
      SELECT *, '[' || road || '] ' || reason || ' - ' || title || coalesce(' (' || nullif(direction, '') || ')', '')
             || CASE WHEN starts > now() THEN ' - starts ' || strftime(starts, '%a %d.%m. %H') || 'h'
                     WHEN starts IS NULL AND future THEN ' - upcoming, start not given' ELSE ' - active' END
             || coalesce(' (' || replace(timing, ' | ', ', ') || ')', '') || coalesce(', ' || length_km, '')
             || ' - https://www.openstreetmap.org/?mlat=' || round(CAST(lat AS DOUBLE), 5) || '&mlon=' || round(CAST(lon AS DOUBLE), 5) || '&zoom=14' AS line
      FROM scoped WHERE key NOT IN (SELECT key FROM seen);

      SELECT road, reason, title, direction, starts, timing, width_m, length_km, lat, lon, identifier, line FROM fresh ORDER BY road, reason, starts;

      SELECT CAST(:baseline AS BOOLEAN) AS is_baseline,
             (SELECT count(*) FROM items) AS feed_items,
             (SELECT count(*) FROM scoped) AS in_scope,
             (SELECT count(*) FROM scoped WHERE reason = 'CARRIAGEWAY CLOSED') AS carriageway_closures,
             (SELECT count(*) FROM scoped WHERE reason = 'RAMP CLOSED') AS ramp_closures,
             (SELECT count(*) FROM scoped WHERE service = 'roadworks') AS narrow_roadworks,
             (SELECT count(*) FROM fresh) AS new_items,
             (SELECT count(*) FROM seen WHERE road IN (SELECT road FROM watch) AND key NOT IN (SELECT key FROM scoped)) AS no_longer_in_scope,
             (SELECT coalesce(string_agg(road, ', '), '') FROM watch WHERE road NOT IN (SELECT road FROM known)) AS unknown_roads,
             (SELECT coalesce(string_agg(line, chr(10) ORDER BY road, reason, starts), '') FROM fresh) AS alert_text,
             (SELECT CAST(coalesce(to_json(list(key ORDER BY key)), '[]') AS VARCHAR)
              FROM (SELECT key FROM scoped UNION SELECT key FROM seen WHERE road NOT IN (SELECT road FROM watch))) AS keys;

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    description: |
      The keys in scope now replace the old set for the watched motorways (a closure that is lifted and announced again is
      reported again). Keys of motorways left out of this run are kept, so a one-off narrower run does not re-alert them later.
    key: autobahn_closure_watch_seen
    kvType: STRING
    value: "{{ outputs.analyse.outputs[1].rows[0].keys }}"

  - id: notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ not outputs.analyse.outputs[1].rows[0].is_baseline and outputs.analyse.outputs[1].rows[0].new_items > 0 }}"
    then:
      - id: log_new
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "{{ outputs.analyse.outputs[1].rows[0].alert_text }}"

      - id: slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": {{ ('*New Autobahn closures on your routes* (next ' ~ inputs.lookahead_hours ~ ' h)\n' ~ outputs.analyse.outputs[1].rows[0].alert_text) | toJson }}}

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      {{ outputs.analyse.outputs[1].rows[0].feed_items }} closures and roadworks on {{ inputs.roads | join(', ') }};
      {{ outputs.analyse.outputs[1].rows[0].in_scope }} in scope ({{ outputs.analyse.outputs[1].rows[0].carriageway_closures }} carriageway closures,
      {{ outputs.analyse.outputs[1].rows[0].ramp_closures }} ramp closures, {{ outputs.analyse.outputs[1].rows[0].narrow_roadworks }} roadworks narrower than {{ inputs.max_load_width_m }} m);
      {{ outputs.analyse.outputs[1].rows[0].is_baseline ? 'BASELINE run, nothing alerted' : outputs.analyse.outputs[1].rows[0].new_items ~ ' new' }},
      {{ outputs.analyse.outputs[1].rows[0].no_longer_in_scope }} no longer in scope (lifted, or filtered out by the current inputs).{{ outputs.analyse.outputs[1].rows[0].unknown_roads != '' ? ' Unknown motorways: ' ~ outputs.analyse.outputs[1].rows[0].unknown_roads ~ '.' : '' }}

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.analyse.outputs[1].rows[0] | jq('del(.keys)') | first }}"
  - id: new_items
    type: JSON
    value: "{{ outputs.analyse.outputs[0].rows }}"

extend:
  title: Autobahn Closure and Narrow Roadworks Route Watch for Haulage
  metaTitle: Autobahn Closure and Roadworks Route Watch | Kestra
  shortDescription: Every two hours, read closures and roadworks on your German motorways from the Autobahn GmbH API and alert on new carriageway closures and roadworks too narrow for your loads.
  metaDescription: Watch German Autobahn closures and roadworks with the keyless Autobahn GmbH API and get Slack alerts for new full closures and narrow passages.
  description: |
    Autobahn GmbH, the federal motorway operator, publishes every roadworks site and closure on the German Autobahn network in a keyless JSON API, with direction, coordinates and the posted time windows. This flow watches it for the two things a dispatcher needs: carriageway closures on the motorways the trucks use, and roadworks too narrow for a wide load, and reports only what is new.

    ## How it works

    1. A `Schedule` trigger runs every two hours.
    2. `fetch_road_list` (HTTP Download) reads the motorways the API knows. `each_road` (Loop, two at a time) downloads `/services/closure` and `/services/roadworks` per watched motorway, with retries.
    3. `previous_state` (KV Get) reads the keys already reported. Missing means BASELINE: everything in scope is stored and nothing is alerted.
    4. `analyse` (DuckDB) flattens both feeds and keeps:
       - carriageway closures (`display_type = CLOSURE`; `isBlocked` is "false" on every item, so it cannot be used),
       - ramp closures (`CLOSURE_ENTRY_EXIT`) when `include_ramp_closures` is on,
       - roadworks whose "Maximale Durchfahrtsbreite" in the description is below `max_load_width_m`.
       Items must be active or start within `lookahead_hours`. The start comes from `startTimestamp`, or from the German description ("23.10.26 von 00:00 bis 05:15 Uhr", "Beginn: 10.04.26 um 18:00 Uhr") when the API leaves it out; items without a readable start stay in scope.
    5. `save_state` (KV Set) stores the keys in scope for the watched motorways and keeps those of motorways left out of the run.
    6. `notify` (If) logs the new items at WARN and posts them to Slack: motorway, reason, section and direction, active or start time, the posted time window, length and an OpenStreetMap link.

    ## What you get

    - One Slack line per new closure or narrow passage.
    - Motorway numbers the API does not know (`A999`) are named in the summary, since the API answers them with an empty list.
    - Flow outputs `summary` (counts) and `new_items` (rows with timing, width, length and coordinates).

    ## Who it's for

    - Haulage dispatchers, heavy and oversize transport planners, field-service and logistics teams driving German motorways.

    ## Why orchestrate this with Kestra

    - Retried downloads, a bounded parallel loop and KV state instead of a cron script; Slack is optional (`allowFailure`).

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB and Slack plugins, and outbound HTTPS to `verkehr.autobahn.de` (no API key).
    - Descriptions are in German and come from the operator; they are not a legal route permit.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the alerts (optional; without it the Slack task warns and the run continues).

    ## Quick start

    1. Click **Execute** with the defaults (A1, A2, A3, A7): a BASELINE that stores what is in scope now.
    2. Execute again: nothing new.
    3. Set your motorways and widest load, add `SLACK_WEBHOOK_URL` and keep the schedule on. Newly announced closures show up in the next run.

    ## How to extend

    - Clip items to your tour corridors with the `lat`/`lon` columns instead of whole motorways.
    - Add the API's `warning` service for live incidents, or `/services/parking_lorry` for truck parking.

    ## Links

    - [Autobahn API documentation](https://autobahn.api.bund.dev/) and [Autobahn GmbH traffic map](https://www.autobahn.de/verkehr)
    - [HTTP Download](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download), [Loop](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop), [If](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if) and [KV Set](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.set)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
