id: pgbench-performance-regression-gate
namespace: company.team
description: |
  After a database change reaches staging (a migration, a new index, a Postgres
  upgrade or a configuration change), replay a fixed workload with pgbench,
  compare throughput and p95 latency with the rolling baseline of the last
  accepted runs kept in the KV store, and block the release when performance
  regresses beyond the allowed budget.

inputs:
  - id: pg_host
    type: STRING
    defaults: "postgres.staging.internal"
    displayName: "Postgres Host"
    description: "Staging Postgres host. Never point this at production: pgbench writes to its own tables."
  - id: pg_port
    type: INT
    defaults: 5432
    displayName: "Postgres Port"
  - id: database
    type: STRING
    defaults: "shop"
    displayName: "Database"
    description: "Database that holds the pgbench tables (created once with `pgbench -i`)."
  - id: pg_user
    type: STRING
    defaults: "pgbench"
    displayName: "Postgres User"
  - id: target
    type: STRING
    defaults: "shop_staging"
    displayName: "Baseline Key"
    description: "Lowercase key for the baseline in the KV store (`pgbench_baseline_<target>`)."
  - id: clients
    type: INT
    defaults: 8
    displayName: "Clients"
    description: "Concurrent pgbench clients."
  - id: duration_seconds
    type: INT
    defaults: 60
    displayName: "Measured Duration (s)"
  - id: min_baseline_runs
    type: INT
    defaults: 3
    displayName: "Minimum Baseline Runs"
    description: "Runs accepted into the baseline before the gate starts blocking, so one noisy run can't become the reference."
  - id: max_tps_drop_pct
    type: FLOAT
    defaults: 25
    displayName: "Max TPS Drop (%)"
    description: "Block when throughput falls more than this below the baseline median."
  - id: max_p95_increase_pct
    type: FLOAT
    defaults: 40
    displayName: "Max p95 Latency Increase (%)"
    description: "Block when p95 latency rises more than this above the baseline median."

triggers:
  - id: after_staging_migration
    type: io.kestra.plugin.core.trigger.Flow
    description: Benchmark every time the staging migration flow succeeds. Shipped disabled; point it at your own flow and enable it after a manual run.
    disabled: true
    dependsOn:
      - namespace: company.team
        flowId: migrate_staging_db
        states: [SUCCESS]

tasks:
  - id: run_pgbench
    type: io.kestra.plugin.scripts.shell.Commands
    description: Warm up for 10 seconds, then run the measured TPC-B-like workload and keep both the summary and the per-transaction latency log.
    containerImage: postgres:16
    env:
      PGPASSWORD: "{{ secret('STAGING_PG_PASSWORD') }}"
    commands:
      - >-
        pgbench -h '{{ inputs.pg_host }}' -p {{ inputs.pg_port }} -U '{{ inputs.pg_user }}'
        -c {{ inputs.clients }} -j 2 -T 10 -n '{{ inputs.database }}' > warmup.txt
      - >-
        pgbench -h '{{ inputs.pg_host }}' -p {{ inputs.pg_port }} -U '{{ inputs.pg_user }}'
        -c {{ inputs.clients }} -j 2 -T {{ inputs.duration_seconds }} -n -l --log-prefix=txlog
        '{{ inputs.database }}' > summary.txt
      - cat txlog* > latencies.log
    outputFiles:
      - summary.txt
      - latencies.log
    timeout: PT30M

  - id: compare_with_baseline
    type: io.kestra.plugin.scripts.python.Script
    description: Read TPS and failed transactions from the summary, compute p95 latency from the per-transaction log, and compare both with the median of the accepted runs in the KV store.
    containerImage: python:3.12-slim
    inputFiles:
      summary.txt: "{{ outputs.run_pgbench.outputFiles['summary.txt'] }}"
      latencies.log: "{{ outputs.run_pgbench.outputFiles['latencies.log'] }}"
      baseline.json: "{{ kv('pgbench_baseline_' ~ inputs.target, errorOnMissing=false) ?? '[]' }}"
    outputFiles:
      - history.json
    script: |
      import json, re, statistics

      summary = open("summary.txt", encoding="utf-8").read()
      tps = float(re.search(r"tps = ([\d.]+)", summary).group(1))
      done = int(re.search(r"number of transactions actually processed: (\d+)", summary).group(1))
      failed_match = re.search(r"number of failed transactions: (\d+)", summary)
      failed = int(failed_match.group(1)) if failed_match else 0

      latencies = sorted(int(line.split()[2]) / 1000 for line in open("latencies.log", encoding="utf-8") if line.strip())
      p95 = latencies[max(0, int(round(0.95 * len(latencies))) - 1)]

      history = json.load(open("baseline.json", encoding="utf-8")) or []
      run = {"tps": round(tps, 1), "p95_ms": round(p95, 3), "transactions": done, "failed": failed}
      result = {**run, "baseline_runs": len(history), "regressed": False, "reasons": []}

      if len(history) >= int("{{ inputs.min_baseline_runs }}"):
          base_tps = statistics.median(h["tps"] for h in history)
          base_p95 = statistics.median(h["p95_ms"] for h in history)
          tps_drop = (base_tps - tps) / base_tps * 100
          p95_rise = (p95 - base_p95) / base_p95 * 100
          result.update(base_tps=round(base_tps, 1), base_p95_ms=round(base_p95, 3),
                        tps_change_pct=round(-tps_drop, 1), p95_change_pct=round(p95_rise, 1))
          if tps_drop > float("{{ inputs.max_tps_drop_pct }}"):
              result["reasons"].append(f"TPS {tps:.0f} is {tps_drop:.1f}% below the baseline {base_tps:.0f}")
          if p95_rise > float("{{ inputs.max_p95_increase_pct }}"):
              result["reasons"].append(f"p95 {p95:.2f} ms is {p95_rise:.1f}% above the baseline {base_p95:.2f} ms")
      if failed:
          result["reasons"].append(f"{failed} transaction(s) failed")
      result["regressed"] = bool(result["reasons"])

      json.dump((history + [run])[-5:], open("history.json", "w", encoding="utf-8"))
      print("::" + json.dumps({"outputs": result}) + "::")

  - id: log_result
    type: io.kestra.plugin.core.log.Log
    message: >-
      pgbench on {{ inputs.target }} ({{ inputs.clients }} clients, {{ inputs.duration_seconds }} s):
      {{ outputs.compare_with_baseline.vars.tps }} TPS, p95 {{ outputs.compare_with_baseline.vars.p95_ms }} ms,
      {{ outputs.compare_with_baseline.vars.failed }} failed.
      {% if outputs.compare_with_baseline.vars.base_tps is defined %}Baseline median of {{ outputs.compare_with_baseline.vars.baseline_runs }} run(s):
      {{ outputs.compare_with_baseline.vars.base_tps }} TPS, p95 {{ outputs.compare_with_baseline.vars.base_p95_ms }} ms
      (TPS {{ outputs.compare_with_baseline.vars.tps_change_pct }}%, p95 {{ outputs.compare_with_baseline.vars.p95_change_pct }}%).{% else %}Collecting the baseline ({{ outputs.compare_with_baseline.vars.baseline_runs + 1 }} of {{ inputs.min_baseline_runs }} runs), not gating yet.{% endif %}

  - id: gate
    type: io.kestra.plugin.core.flow.If
    description: Block the release on a regression; otherwise add this run to the rolling baseline (last 5 accepted runs).
    condition: "{{ outputs.compare_with_baseline.vars.regressed }}"
    then:
      - id: block_release
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Performance regression on {{ inputs.target }}: {{ outputs.compare_with_baseline.vars.reasons | join('; ') }}. The baseline is unchanged."
    else:
      - id: update_baseline
        type: io.kestra.plugin.core.kv.Set
        key: "pgbench_baseline_{{ inputs.target }}"
        value: "{{ read(outputs.compare_with_baseline.outputFiles['history.json']) }}"
        kvType: JSON

outputs:
  - id: tps
    type: FLOAT
    value: "{{ outputs.compare_with_baseline.vars.tps }}"
  - id: p95_ms
    type: FLOAT
    value: "{{ outputs.compare_with_baseline.vars.p95_ms }}"

extend:
  title: "Postgres pgbench Performance Regression Gate"
  shortDescription: Replay a fixed pgbench workload on staging after every database change, compare TPS and p95 latency with a rolling baseline in the KV store, and block releases that make Postgres slower.
  metaTitle: Postgres pgbench Performance Regression Gate | Kestra
  metaDescription: "Run pgbench after each staging DB change, compare TPS and p95 latency with a rolling KV baseline, and block releases that slow Postgres down."
  description: |
    A dropped index, a migration that rewrites a hot table, a changed `work_mem` or a major-version upgrade can make Postgres several times slower without any test failing, and the first sign is production latency. This blueprint makes database performance a release gate: after every change reaches staging it replays a fixed [pgbench](https://www.postgresql.org/docs/current/pgbench.html) workload, measures throughput and p95 latency, compares them with the median of the last accepted runs kept in the Kestra KV store, and blocks the release when the change made the database meaningfully slower.

    ## How it works

    1. `after_staging_migration` (`io.kestra.plugin.core.trigger.Flow`) starts the gate when `migrate_staging_db` succeeds. It ships `disabled: true`.
    2. `run_pgbench` (`io.kestra.plugin.scripts.shell.Commands`, official `postgres:16` image) warms up for 10 seconds, then runs the measured workload with `-l` so every transaction's latency is logged, and keeps the summary and the latency log as output files.
    3. `compare_with_baseline` (`io.kestra.plugin.scripts.python.Script`) reads TPS and failed transactions from the summary, computes p95 latency from the per-transaction log, reads the accepted runs from `pgbench_baseline_<target>` with `kv()`, and compares against their median. Until `min_baseline_runs` runs have been accepted it only collects the baseline, so a single noisy run never becomes the reference.
    4. `log_result` logs the run, the baseline and the change in percent.
    5. `gate` (`io.kestra.plugin.core.flow.If`): a regression beyond `max_tps_drop_pct` or `max_p95_increase_pct`, or any failed transaction, runs `block_release` (`io.kestra.plugin.core.execution.Fail`) and leaves the baseline untouched; otherwise `update_baseline` (`io.kestra.plugin.core.kv.Set`) adds the run to the rolling baseline of the last 5 accepted runs.

    ## What you get

    - A performance check on every database change, measured the same way each time.
    - A baseline that adapts to the hardware and the data size (median of the last accepted runs) instead of a hard-coded number.
    - A failed execution that states the throughput and latency change, so the change that caused it is easy to find.
    - TPS and p95 latency as flow outputs for dashboards.

    ## Who it's for

    - Platform and database teams that own Postgres migrations, upgrades and configuration.
    - Application teams that want performance regressions caught in staging rather than in production.

    ## Why orchestrate this with Kestra

    A benchmark is only useful when it runs at the right moment and its result decides something. Kestra runs it right after the migration flow with a Flow trigger, keeps the rolling baseline in the KV store between runs, and turns the comparison into a release decision with `If` and `Fail`, with every run's numbers in the execution history.

    ## Prerequisites

    - A staging Postgres reachable from the worker, with a database initialized once with `pgbench -i -s <scale>` (or your own tables if you switch to a custom pgbench script). Never point it at production: pgbench writes to its own tables.
    - A Kestra worker that can run containers (Docker or Kubernetes task runner) and pull `postgres:16` and `python:3.12-slim`.
    - A quiet, dedicated runner when you need budgets tighter than the defaults: shared machines add noise between runs.

    ### Secrets

    - `STAGING_PG_PASSWORD`: password of the `pg_user` role on the staging database.

    ## Quick start

    1. Initialize the benchmark tables on staging: `pgbench -i -s 10 shop`.
    2. Add the `STAGING_PG_PASSWORD` secret and set `pg_host`, `database`, `pg_user` and `target`.
    3. Execute the flow three times to build the baseline (`min_baseline_runs`), then once more: from now on it gates.
    4. Point `after_staging_migration` at your migration flow and enable it.

    ## How to extend

    - Replace the TPC-B-like workload with a custom pgbench script (`-f`) that replays your application's hot queries.
    - Run the gate for several targets (one `target` key each) or several client counts.
    - Ask for a DBA approval with `io.kestra.plugin.core.flow.Pause` instead of failing, for intentional trade-offs.
    - Send the TPS and p95 outputs to your metrics system to chart performance across releases.

    ## Links

    - [pgbench documentation](https://www.postgresql.org/docs/current/pgbench.html)
    - [Kestra Flow trigger](https://kestra.io/plugins/core/triggers/io.kestra.plugin.core.trigger.flow)
    - [Kestra KV store](https://kestra.io/docs/concepts/kv-store)
    - [Kestra If task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.if)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Testing & Quality
  ee: false
  demo: false
