id: openapi-breaking-change-guardian
namespace: company.platform
description: |
  Guard a GitHub pull request against breaking OpenAPI changes. The flow checks out the exact
  base and head commits, runs oasdiff with a configurable compatibility policy, preserves JSON
  and Markdown evidence, updates one PR comment and commit status, and fails the release gate.

inputs:
  - id: mode
    type: SELECT
    displayName: Run mode
    description: Use either demo to try the gate without credentials, or GITHUB_PR for a real pull request.
    values:
      - DEMO_BREAKING
      - DEMO_COMPATIBLE
      - GITHUB_PR
    defaults: DEMO_BREAKING

  - id: repository
    type: STRING
    displayName: GitHub repository
    description: Base repository in owner/name form. The webhook payload must name this same repository.
    defaults: your-org/your-api
    validator: '^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?/[A-Za-z0-9_.-]{1,100}$'

  - id: pr_number
    type: INT
    displayName: Pull request number
    description: Used for manual GITHUB_PR runs. Webhook runs map the number from the GitHub event.
    defaults: 1
    min: 1

  - id: spec_path
    type: STRING
    displayName: Proposed specification path
    description: OpenAPI YAML or JSON file at the PR head, relative to the repository root.
    defaults: openapi.yaml
    validator: '^(?!/)(?!.*(?:^|/)\.\.?(?:/|$))[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)*\.(?:yaml|yml|json)$'

  - id: base_spec_path
    type: STRING
    displayName: Baseline specification path
    description: Optional old path when the PR renames the spec. Empty means the same value as spec_path.
    defaults: ""
    validator: '^(?:|(?!/)(?!.*(?:^|/)\.\.?(?:/|$))[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)*\.(?:yaml|yml|json))$'

  - id: baseline_strategy
    type: SELECT
    displayName: Baseline selection
    description: Compare with the PR base SHA, the latest target branch, or an explicit branch, tag, or SHA.
    values:
      - PR_BASE
      - TARGET_BRANCH_HEAD
      - CUSTOM_REF
    defaults: PR_BASE

  - id: baseline_ref
    type: STRING
    displayName: Custom baseline ref
    description: Used only with CUSTOM_REF. May be a branch, tag, or full commit SHA in the base repository.
    defaults: ""
    validator: '^[A-Za-z0-9._/-]{0,200}$'

  - id: fail_on
    type: SELECT
    displayName: Gate threshold
    description: ERR blocks definite breaks only. WARN also blocks potential breaking changes.
    values:
      - ERR
      - WARN
    defaults: ERR

  - id: stability_level
    type: SELECT
    displayName: Minimum API stability
    description: ALL checks every operation. Other values use oasdiff stability extensions to limit the gate.
    values:
      - ALL
      - draft
      - alpha
      - beta
      - stable
    defaults: ALL

  - id: stable_deprecation_days
    type: INT
    displayName: Stable API deprecation window
    description: Minimum days a stable operation must be deprecated before removal. Zero disables the grace rule.
    defaults: 0
    min: 0

  - id: beta_deprecation_days
    type: INT
    displayName: Beta API deprecation window
    description: Minimum days a beta operation must be deprecated before removal. Zero disables the grace rule.
    defaults: 0
    min: 0

  - id: flatten_allof
    type: BOOL
    displayName: Flatten allOf schemas
    description: Merge allOf branches before comparison to make inherited-schema findings exact.
    defaults: true

  - id: use_repository_policy
    type: BOOL
    displayName: Use repository .oasdiff.yaml
    description: Apply .oasdiff.yaml from the PR head when present, including custom severities and ignore files.
    defaults: true

  - id: publish_to_github
    type: BOOL
    displayName: Publish GitHub feedback
    description: In GITHUB_PR mode, update one PR comment and set the head commit status.
    defaults: true

  - id: service_id
    type: STRING
    displayName: Service identifier
    description: Stable key used to record the latest compatibility result in Kestra KV storage.
    defaults: petstore
    validator: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'

concurrency:
  limit: 2
  behavior: QUEUE

tasks:
  - id: relevant_event
    type: io.kestra.plugin.core.flow.If
    description: Run manual executions and GitHub PR events that can change mergeability; ignore close, label and review noise.
    condition: "{{ ['manual', 'opened', 'reopened', 'synchronize', 'ready_for_review'] contains (trigger.body.action ?? 'manual') }}"
    then:
      - id: guardian
        type: io.kestra.plugin.core.flow.WorkingDirectory
        description: A shared, ephemeral workspace holds the exact checkouts and both downloadable reports.
        tasks:
          - id: write_breaking_demo
            type: io.kestra.plugin.scripts.python.Script
            runIf: "{{ inputs.mode == 'DEMO_BREAKING' }}"
            description: Create a baseline and a revision that removes GET /pets/{petId} and a required response property.
            containerImage: python:3.13-alpine
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
            script: |
              import json
              from pathlib import Path

              base = '''openapi: 3.0.3
              info:
                title: Guardian demo
                version: 1.0.0
              paths:
                /pets:
                  get:
                    operationId: listPets
                    responses:
                      "200":
                        description: Pets
                        content:
                          application/json:
                            schema:
                              type: array
                              items:
                                $ref: "#/components/schemas/Pet"
                /pets/{petId}:
                  get:
                    operationId: getPet
                    parameters:
                      - in: path
                        name: petId
                        required: true
                        schema:
                          type: string
                    responses:
                      "200":
                        description: Pet
                        content:
                          application/json:
                            schema:
                              $ref: "#/components/schemas/Pet"
              components:
                schemas:
                  Pet:
                    type: object
                    required: [id, name]
                    properties:
                      id:
                        type: string
                      name:
                        type: string
              '''
              revision = '''openapi: 3.0.3
              info:
                title: Guardian demo
                version: 1.1.0
              paths:
                /pets:
                  get:
                    operationId: listPets
                    responses:
                      "200":
                        description: Pets
                        content:
                          application/json:
                            schema:
                              type: array
                              items:
                                $ref: "#/components/schemas/Pet"
              components:
                schemas:
                  Pet:
                    type: object
                    required: [id]
                    properties:
                      id:
                        type: string
                      name:
                        type: string
              '''
              for side, text in (("base", base), ("candidate", revision)):
                  Path(side).mkdir()
                  Path(side, "openapi.yaml").write_text(text, encoding="utf-8")
              context = {
                  "mode": "DEMO_BREAKING", "repository": "demo/petstore", "pr_number": 0,
                  "title": "Remove pet lookup contract", "url": "", "base_sha": "demo-base",
                  "head_sha": "demo-breaking", "base_clone_url": "", "head_clone_url": "",
                  "base_ref": "v1.0.0", "head_ref": "feature/break-api",
                  "base_spec_path": "openapi.yaml", "spec_path": "openapi.yaml"
              }
              Path("context.json").write_text(json.dumps(context), encoding="utf-8")

          - id: write_compatible_demo
            type: io.kestra.plugin.scripts.python.Script
            runIf: "{{ inputs.mode == 'DEMO_COMPATIBLE' }}"
            description: Create a baseline and a compatible revision that only adds an optional response property.
            containerImage: python:3.13-alpine
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
            script: |
              import json
              from pathlib import Path

              base = '''openapi: 3.0.3
              info:
                title: Guardian demo
                version: 1.0.0
              paths:
                /pets:
                  get:
                    operationId: listPets
                    responses:
                      "200":
                        description: Pets
                        content:
                          application/json:
                            schema:
                              type: array
                              items:
                                $ref: "#/components/schemas/Pet"
              components:
                schemas:
                  Pet:
                    type: object
                    required: [id, name]
                    properties:
                      id:
                        type: string
                      name:
                        type: string
              '''
              revision = '''openapi: 3.0.3
              info:
                title: Guardian demo
                version: 1.1.0
              paths:
                /pets:
                  get:
                    operationId: listPets
                    responses:
                      "200":
                        description: Pets
                        content:
                          application/json:
                            schema:
                              type: array
                              items:
                                $ref: "#/components/schemas/Pet"
              components:
                schemas:
                  Pet:
                    type: object
                    required: [id, name]
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      avatarUrl:
                        type: string
                        format: uri
              '''
              for side, text in (("base", base), ("candidate", revision)):
                  Path(side).mkdir()
                  Path(side, "openapi.yaml").write_text(text, encoding="utf-8")
              context = {
                  "mode": "DEMO_COMPATIBLE", "repository": "demo/petstore", "pr_number": 0,
                  "title": "Add an optional pet avatar", "url": "", "base_sha": "demo-base",
                  "head_sha": "demo-compatible", "base_clone_url": "", "head_clone_url": "",
                  "base_ref": "v1.0.0", "head_ref": "feature/add-avatar",
                  "base_spec_path": "openapi.yaml", "spec_path": "openapi.yaml"
              }
              Path("context.json").write_text(json.dumps(context), encoding="utf-8")

          - id: resolve_pull_request
            type: io.kestra.plugin.scripts.python.Script
            runIf: "{{ inputs.mode == 'GITHUB_PR' }}"
            description: Fetch canonical PR metadata from GitHub, reject repository spoofing, and resolve the selected baseline to an immutable SHA.
            containerImage: python:3.13-alpine
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
            env:
              GITHUB_TOKEN: "{{ secret('GITHUB_TOKEN') }}"
              REPOSITORY: "{{ inputs.repository }}"
              PR_NUMBER: "{{ inputs.pr_number }}"
              EVENT_REPOSITORY: "{{ trigger.body.repository.full_name ?? '' }}"
              BASELINE_STRATEGY: "{{ inputs.baseline_strategy }}"
              BASELINE_REF: "{{ inputs.baseline_ref }}"
              SPEC_PATH: "{{ inputs.spec_path }}"
              BASE_SPEC_PATH: "{{ inputs.base_spec_path }}"
            script: |
              import json
              import os
              import urllib.error
              import urllib.parse
              import urllib.request
              from pathlib import Path

              repo = os.environ["REPOSITORY"]
              event_repo = os.environ.get("EVENT_REPOSITORY", "")
              if event_repo and event_repo.lower() != repo.lower():
                  raise SystemExit(f"Webhook repository {event_repo!r} does not match configured repository {repo!r}")

              token = os.environ["GITHUB_TOKEN"]
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "kestra-openapi-breaking-change-guardian",
              }

              def get(path):
                  request = urllib.request.Request("https://api.github.com" + path, headers=headers)
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as error:
                      detail = error.read(1000).decode("utf-8", "replace")
                      raise SystemExit(f"GitHub API {error.code} for {path}: {detail}") from error

              pr_number = int(os.environ["PR_NUMBER"])
              pr = get(f"/repos/{repo}/pulls/{pr_number}")
              strategy = os.environ["BASELINE_STRATEGY"]
              if strategy == "PR_BASE":
                  base_sha = pr["base"]["sha"]
              else:
                  ref = pr["base"]["ref"] if strategy == "TARGET_BRANCH_HEAD" else os.environ.get("BASELINE_REF", "")
                  if not ref:
                      raise SystemExit("baseline_ref is required when baseline_strategy is CUSTOM_REF")
                  encoded_ref = urllib.parse.quote(ref, safe="")
                  base_sha = get(f"/repos/{repo}/commits/{encoded_ref}")["sha"]

              context = {
                  "mode": "GITHUB_PR",
                  "repository": repo,
                  "pr_number": pr_number,
                  "title": pr["title"],
                  "url": pr["html_url"],
                  "base_sha": base_sha,
                  "head_sha": pr["head"]["sha"],
                  "base_clone_url": pr["base"]["repo"]["clone_url"],
                  "head_clone_url": pr["head"]["repo"]["clone_url"],
                  "base_ref": pr["base"]["ref"] if strategy != "CUSTOM_REF" else os.environ["BASELINE_REF"],
                  "head_ref": pr["head"]["label"],
                  "base_spec_path": os.environ.get("BASE_SPEC_PATH") or os.environ["SPEC_PATH"],
                  "spec_path": os.environ["SPEC_PATH"],
              }
              Path("context.json").write_text(json.dumps(context), encoding="utf-8")
              print("::" + json.dumps({"outputs": context}) + "::")

          - id: clone_baseline
            type: io.kestra.plugin.git.Clone
            runIf: "{{ inputs.mode == 'GITHUB_PR' }}"
            description: Check out the immutable baseline SHA from the PR's base repository, without submodules.
            timeout: PT10M
            url: "{{ outputs.resolve_pull_request.vars.base_clone_url }}"
            commit: "{{ outputs.resolve_pull_request.vars.base_sha }}"
            username: "{{ secret('GITHUB_TOKEN') }}"
            password: "{{ secret('GITHUB_TOKEN') }}"
            cloneSubmodules: false
            directory: base

          - id: clone_candidate
            type: io.kestra.plugin.git.Clone
            runIf: "{{ inputs.mode == 'GITHUB_PR' }}"
            description: Check out the immutable head SHA from the actual head repository, including forked pull requests.
            timeout: PT10M
            url: "{{ outputs.resolve_pull_request.vars.head_clone_url }}"
            commit: "{{ outputs.resolve_pull_request.vars.head_sha }}"
            username: "{{ secret('GITHUB_TOKEN') }}"
            password: "{{ secret('GITHUB_TOKEN') }}"
            cloneSubmodules: false
            directory: candidate

          - id: verify_material
            type: io.kestra.plugin.scripts.python.Script
            description: Verify exact Git SHAs and safe spec paths, remove symlinks and Git metadata, and expose no credentials to the comparison container.
            containerImage: python:3.13-alpine
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
              networkMode: none
            script: |
              import json
              import pathlib
              import shutil

              context = json.loads(pathlib.Path("context.json").read_text(encoding="utf-8"))
              for side, path_key, sha_key in (("base", "base_spec_path", "base_sha"), ("candidate", "spec_path", "head_sha")):
                  root = pathlib.Path(side).resolve(strict=True)
                  if context["mode"] == "GITHUB_PR":
                      actual = pathlib.Path(side, ".git", "HEAD").read_text(encoding="utf-8").strip()
                      if actual != context[sha_key]:
                          raise SystemExit(f"{side} checkout is {actual}, expected {context[sha_key]}")
                  for link in pathlib.Path(side).rglob("*"):
                      if link.is_symlink():
                          link.unlink()
                  target = pathlib.Path(side, context[path_key]).resolve(strict=True)
                  if root not in target.parents or not target.is_file():
                      raise SystemExit(f"{path_key} does not resolve to a regular file inside {side}")
                  shutil.rmtree(pathlib.Path(side, ".git"), ignore_errors=True)
              print("Verified immutable inputs and removed Git metadata and symlinks")

          - id: compare_contracts
            type: io.kestra.plugin.scripts.shell.Commands
            description: Run pinned oasdiff offline, capture its semantic findings as JSON, and preserve exit 1 as a gate decision instead of a task crash.
            timeout: PT5M
            containerImage: tufin/oasdiff:v1.32.1
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
              networkMode: none
              cpu:
                cpus: 1
              memory:
                memory: 512MB
            env:
              FAIL_ON: "{{ inputs.fail_on }}"
              STABILITY: "{{ inputs.stability_level }}"
              STABLE_DAYS: "{{ inputs.stable_deprecation_days }}"
              BETA_DAYS: "{{ inputs.beta_deprecation_days }}"
              FLATTEN_ALLOF: "{{ inputs.flatten_allof }}"
              USE_REPO_POLICY: "{{ inputs.use_repository_policy }}"
            commands:
              - |
                set -u
                BASE_PATH=$(sed -n 's/.*"base_spec_path": *"\([^"]*\)".*/\1/p' context.json)
                HEAD_PATH=$(sed -n 's/.*"spec_path": *"\([^"]*\)".*/\1/p' context.json)
                set -- breaking --fail-on "$FAIL_ON" --format json --allow-external-refs=false
                if [ "$FLATTEN_ALLOF" = "true" ]; then set -- "$@" --flatten-allof; fi
                if [ "$STABILITY" != "ALL" ]; then set -- "$@" --stability-level "$STABILITY"; fi
                if [ "$STABLE_DAYS" -gt 0 ]; then set -- "$@" --deprecation-days-stable "$STABLE_DAYS"; fi
                if [ "$BETA_DAYS" -gt 0 ]; then set -- "$@" --deprecation-days-beta "$BETA_DAYS"; fi
                if [ "$USE_REPO_POLICY" = "true" ] && [ -f candidate/.oasdiff.yaml ]; then set -- "$@" --config candidate/.oasdiff.yaml; fi
                set -- "$@" -- "base/$BASE_PATH" "candidate/$HEAD_PATH"
                set +e
                oasdiff "$@" > oasdiff-findings.json 2> oasdiff-error.log
                code=$?
                set -e
                if [ "$code" -gt 1 ]; then
                  cat oasdiff-error.log >&2
                  exit "$code"
                fi
                echo "oasdiff completed with policy exit code $code"
                echo "::{\"outputs\":{\"policy_exit\":$code}}::"
            outputFiles:
              - oasdiff-findings.json

          - id: build_evidence
            type: io.kestra.plugin.scripts.python.Script
            description: Convert structured findings into a versioned JSON artifact and a concise Markdown review with exact methods, paths, rules and source lines.
            containerImage: python:3.13-alpine
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
              networkMode: none
            env:
              POLICY_EXIT: "{{ outputs.compare_contracts.vars.policy_exit }}"
              FAIL_ON: "{{ inputs.fail_on }}"
              STABILITY: "{{ inputs.stability_level }}"
              FLATTEN_ALLOF: "{{ inputs.flatten_allof }}"
              EXECUTION_ID: "{{ execution.id }}"
            outputFiles:
              - compatibility-report.json
              - compatibility-report.md
            script: |
              import json
              import os
              from pathlib import Path

              context = json.loads(Path("context.json").read_text(encoding="utf-8"))
              raw = Path("oasdiff-findings.json").read_text(encoding="utf-8").strip()
              findings = json.loads(raw or "[]")
              if not isinstance(findings, list):
                  raise SystemExit("Unexpected oasdiff JSON: expected a list of findings")

              names = {3: "error", 2: "warning", 1: "info"}
              counts = {"errors": 0, "warnings": 0, "info": 0}
              for item in findings:
                  level = int(item.get("level", 0))
                  key = {3: "errors", 2: "warnings", 1: "info"}.get(level, "info")
                  counts[key] += 1

              policy_exit = int(os.environ["POLICY_EXIT"])
              verdict = "BLOCK" if policy_exit == 1 else ("WARN" if findings else "PASS")
              report = {
                  "schema": "kestra-openapi-breaking-change-guardian/1.0",
                  "verdict": verdict,
                  "policy": {
                      "failOn": os.environ["FAIL_ON"],
                      "stabilityLevel": os.environ["STABILITY"],
                      "flattenAllOf": os.environ["FLATTEN_ALLOF"].lower() == "true",
                      "externalRefsAllowed": False,
                  },
                  "repository": context["repository"],
                  "pullRequest": context["pr_number"],
                  "base": {"ref": context["base_ref"], "sha": context["base_sha"], "path": context["base_spec_path"]},
                  "candidate": {"ref": context["head_ref"], "sha": context["head_sha"], "path": context["spec_path"]},
                  "counts": counts,
                  "findings": findings,
                  "executionId": os.environ["EXECUTION_ID"],
              }
              Path("compatibility-report.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")

              badge = {"BLOCK": "\u274c BLOCK", "WARN": "\u26a0\ufe0f PASS WITH WARNINGS", "PASS": "\u2705 PASS"}[verdict]
              lines = [
                  f"## OpenAPI compatibility: {badge}", "",
                  "| | |", "|---|---|",
                  f"| Repository | `{context['repository']}` |",
                  f"| Compared | `{context['base_sha'][:12]}` `{context['base_spec_path']}` \u2192 `{context['head_sha'][:12]}` `{context['spec_path']}` |",
                  f"| Policy | block on `{os.environ['FAIL_ON']}`; stability `{os.environ['STABILITY']}`; flatten `allOf`: `{os.environ['FLATTEN_ALLOF'].lower()}` |",
                  f"| Findings | {counts['errors']} error(s), {counts['warnings']} warning(s) |", "",
              ]
              if not findings:
                  lines += ["No breaking changes were detected.", ""]
              else:
                  lines += ["| Severity | Operation | Location | Evidence | Rule |", "|---|---|---|---|---|"]
                  for item in findings[:50]:
                      severity = names.get(int(item.get("level", 0)), "info").upper()
                      operation = str(item.get("operation") or "\u2014")
                      location = str(item.get("path") or item.get("section") or "\u2014").replace("|", "\\|")
                      text = str(item.get("text") or "").replace("|", "\\|").replace("\n", " ")
                      rule = str(item.get("id") or "\u2014")
                      source = item.get("baseSource") or item.get("revisionSource") or {}
                      line = f" (line {source['line']})" if source.get("line") else ""
                      lines.append(f"| {severity} | `{operation}` | `{location}` | {text}{line} | `{rule}` |")
                  if len(findings) > 50:
                      lines += ["", f"Showing 50 of {len(findings)} findings. Download the JSON report for the complete list."]
                  lines.append("")
              if verdict == "BLOCK":
                  lines += ["The compatibility policy rejected this revision. Restore the contract, introduce a versioned endpoint, or document an intentional exception in `.oasdiff.yaml`.", ""]
              lines.append(f"<sub>Generated by Kestra execution `{os.environ['EXECUTION_ID']}` with oasdiff v1.32.1. Full JSON and Markdown reports are attached to the execution.</sub>")
              markdown = "\n".join(lines) + "\n"
              Path("compatibility-report.md").write_text(markdown, encoding="utf-8")

              record = {
                  "verdict": verdict, "repository": context["repository"], "pr": context["pr_number"],
                  "baseSha": context["base_sha"], "headSha": context["head_sha"], "counts": counts,
                  "executionId": os.environ["EXECUTION_ID"]
              }
              outputs = {
                  "verdict": verdict, "errors": counts["errors"], "warnings": counts["warnings"],
                  "findings": len(findings), "repository": context["repository"],
                  "pr_number": context["pr_number"], "head_sha": context["head_sha"],
                  "record_json": json.dumps(record, separators=(",", ":")),
              }
              print(f"{verdict}: {counts['errors']} error(s), {counts['warnings']} warning(s)")
              print("::" + json.dumps({"outputs": outputs}) + "::")

      - id: record_latest_result
        type: io.kestra.plugin.core.kv.Set
        description: Record the latest verdict per service so dashboards and later release flows can query it without scraping logs.
        key: "openapi_guardian_{{ inputs.service_id }}"
        kvType: JSON
        overwrite: true
        value: "{{ outputs.build_evidence.vars.record_json }}"

      - id: publish_github_feedback
        type: io.kestra.plugin.core.flow.If
        description: GitHub side effects are isolated from both demo modes and can be disabled while evaluating the flow.
        condition: "{{ inputs.mode == 'GITHUB_PR' and inputs.publish_to_github }}"
        then:
          - id: set_commit_status
            type: io.kestra.plugin.core.http.Request
            description: Set a mergeable commit status on the exact PR head SHA after all evidence has been persisted.
            method: POST
            uri: "https://api.github.com/repos/{{ outputs.build_evidence.vars.repository }}/statuses/{{ outputs.build_evidence.vars.head_sha }}"
            contentType: application/json
            headers:
              Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
              Accept: application/vnd.github+json
              X-GitHub-Api-Version: "2022-11-28"
            body: |
              {
                "state": "{{ outputs.build_evidence.vars.verdict == 'BLOCK' ? 'failure' : 'success' }}",
                "context": "kestra/openapi-compatibility",
                "description": "{{ outputs.build_evidence.vars.verdict }}: {{ outputs.build_evidence.vars.errors }} error(s), {{ outputs.build_evidence.vars.warnings }} warning(s)"
              }

          - id: comment_on_pull_request
            type: io.kestra.plugin.github.issues.Comment
            description: Keep one evidence comment per spec path and update it on every PR synchronize event instead of creating noise.
            oauthToken: "{{ secret('GITHUB_TOKEN') }}"
            repository: "{{ outputs.build_evidence.vars.repository }}"
            issueNumber: "{{ outputs.build_evidence.vars.pr_number }}"
            updateTag: "openapi-guardian:{{ inputs.service_id }}"
            body: "{{ read(outputs.build_evidence.outputFiles['compatibility-report.md']) }}"

      - id: enforce_gate
        type: io.kestra.plugin.core.flow.If
        description: Fail only after the evidence, KV record, commit status and PR comment have been published.
        condition: "{{ outputs.build_evidence.vars.verdict == 'BLOCK' }}"
        then:
          - id: block_release
            type: io.kestra.plugin.core.execution.Fail
            errorMessage: "OpenAPI compatibility blocked: {{ outputs.build_evidence.vars.errors }} error(s) and {{ outputs.build_evidence.vars.warnings }} warning(s). Download compatibility-report.json for exact evidence."
        else:
          - id: pass_release
            type: io.kestra.plugin.core.log.Log
            message: "OpenAPI compatibility {{ outputs.build_evidence.vars.verdict }}: {{ outputs.build_evidence.vars.errors }} error(s), {{ outputs.build_evidence.vars.warnings }} warning(s)."
    else:
      - id: ignored_event
        type: io.kestra.plugin.core.log.Log
        message: "Ignored GitHub pull_request action {{ trigger.body.action }}."

outputs:
  - id: verdict
    type: STRING
    description: PASS, WARN or BLOCK. Ignored webhook events return SKIPPED.
    value: "{{ outputs.build_evidence.vars.verdict ?? 'SKIPPED' }}"
  - id: json_report
    type: FILE
    description: Versioned machine-readable report with policy, commits, counts and every oasdiff finding.
    value: "{{ outputs.build_evidence.outputFiles['compatibility-report.json'] ?? '' }}"
  - id: markdown_report
    type: FILE
    description: Reviewer-friendly report also used as the GitHub pull request comment.
    value: "{{ outputs.build_evidence.outputFiles['compatibility-report.md'] ?? '' }}"

triggers:
  - id: github_pull_request
    type: io.kestra.plugin.core.trigger.Webhook
    description: Configure a GitHub repository webhook for Pull requests with JSON content. The repository remains pinned in the flow; only mode and PR number come from the event.
    key: "{{ secret('OPENAPI_GUARDIAN_WEBHOOK_KEY') }}"
    inputs:
      mode: GITHUB_PR
      pr_number: "{{ trigger.body.number }}"

extend:
  title: Block breaking OpenAPI changes before they merge
  shortDescription: Compare exact PR commits with oasdiff, apply compatibility policy, attach evidence, update one GitHub comment and commit status, and fail the gate.
  metaTitle: OpenAPI Breaking-Change Guardian with Kestra and oasdiff
  metaDescription: Gate GitHub pull requests on semantic OpenAPI compatibility with oasdiff, exact evidence, PR feedback, commit status and configurable baselines.
  description: |
    An OpenAPI file can remain valid YAML while silently breaking every generated client. This blueprint turns API compatibility into a release gate. A GitHub pull-request webhook starts the flow, Kestra resolves immutable base and head commits (including forked PRs), [oasdiff](https://github.com/oasdiff/oasdiff) performs semantic comparison, and the flow publishes exact evidence before it passes or blocks the release.

    This is more than a CLI wrapper. Kestra owns baseline selection, policy, immutable checkout, artifact lifecycle, GitHub feedback, status gating and result history. The same comparison can be replayed later from the recorded SHAs.

    ## Try the two-act demo

    No secrets are needed for demo mode.

    1. Run with `mode: DEMO_BREAKING`. The candidate removes `GET /pets/{petId}` and makes the response property `name` optional. The report names the exact operations, paths and oasdiff rules, and the execution ends **FAILED** only after both artifacts and the KV result exist.
    2. Run again with `mode: DEMO_COMPATIBLE`. The endpoint is restored and the only change is a new optional `avatarUrl` response property. The gate returns **PASS**.
    3. Download `json_report` for automation or `markdown_report` for review evidence. The latest summary is also stored at `openapi_guardian_petstore` in namespace KV storage.

    ## How the GitHub flow works

    1. `github_pull_request` accepts GitHub `pull_request` events. `relevant_event` processes `opened`, `reopened`, `synchronize` and `ready_for_review`; label, review and close noise is ignored.
    2. `resolve_pull_request` calls the GitHub API instead of trusting webhook SHAs. It verifies that the event repository matches the configured `repository`, resolves the selected baseline, and records the actual base and fork-aware head clone URLs.
    3. `clone_baseline` and `clone_candidate` use the Git plugin to check out exact immutable commits without submodules. `verify_material` checks each detached HEAD, confines both spec paths to their clone, removes symlinks and strips `.git` before analysis.
    4. `compare_contracts` runs `tufin/oasdiff:v1.32.1` in a networkless Docker container. Exit code `1` is captured as a policy decision; parser or infrastructure errors still fail immediately. Remote `$ref` resolution is disabled to prevent SSRF.
    5. `build_evidence` parses oasdiff JSON and writes `compatibility-report.json` plus `compatibility-report.md`. Findings include severity, HTTP method, API path, explanation, rule ID and source line.
    6. `record_latest_result` stores the verdict in Kestra KV. In `GITHUB_PR` mode, `set_commit_status` writes `kestra/openapi-compatibility` on the exact head SHA and `comment_on_pull_request` updates one stable comment rather than adding one per push.
    7. `enforce_gate` runs last. Incompatible changes fail the execution only after the evidence and feedback are durable; compatible changes pass.

    ## Compatibility policy

    - `baseline_strategy: PR_BASE` compares with the base SHA recorded by GitHub for the PR. `TARGET_BRANCH_HEAD` re-resolves the latest target branch, and `CUSTOM_REF` supports a release tag, branch or SHA.
    - `fail_on: ERR` blocks definite breaks. `WARN` is stricter and also blocks changes oasdiff classifies as potentially breaking.
    - `stability_level` can limit enforcement to draft, alpha, beta or stable operations when your specs use oasdiff stability extensions.
    - `stable_deprecation_days` and `beta_deprecation_days` encode removal grace periods.
    - `flatten_allof` normalizes inherited schemas before comparing them.
    - `use_repository_policy` automatically uses `.oasdiff.yaml` from the PR head for custom severity mappings and documented exceptions. Keep referenced ignore files in the repository.

    ## Inputs

    - `mode` (SELECT, default `DEMO_BREAKING`): self-contained breaking demo, compatible demo, or real GitHub PR.
    - `repository` (STRING): configured base repository in `owner/name` form. It is never accepted from an untrusted payload.
    - `pr_number` (INT): manual PR number; webhook runs map this from `trigger.body.number`.
    - `spec_path` / `base_spec_path` (STRING): candidate and optional differently named baseline spec paths.
    - `baseline_strategy` / `baseline_ref`: how the immutable baseline SHA is selected.
    - `fail_on`, `stability_level`, deprecation windows, `flatten_allof`, `use_repository_policy`: compatibility policy controls.
    - `publish_to_github` (BOOL, default `true`): switch off GitHub writes while testing a real PR.
    - `service_id` (STRING): scopes the latest-result KV key and PR comment update tag.

    ## Prerequisites

    - Kestra with Docker available to the Worker and the Git, GitHub and Scripts plugins.
    - For real PRs, set `repository` in the flow and create a GitHub repository webhook for **Pull requests**. Use JSON content and point it to `/api/v1/main/executions/webhook/company.platform/openapi-breaking-change-guardian/<key>`.
    - The Docker comparison is deliberately offline. Bundle local `$ref` files in the repository; remote HTTP `$ref` values are rejected.

    ### Secrets

    - `OPENAPI_GUARDIAN_WEBHOOK_KEY`: long random key in the Kestra webhook URL.
    - `GITHUB_TOKEN`: fine-grained token with **Contents: read**, **Pull requests: read**, **Issues: write**, and **Commit statuses: write** on the base repository and read access to any private fork. Public fork PRs only need base-repository permissions.

    ## Expected outputs

    - `outputs.verdict`: `PASS`, `WARN`, `BLOCK` or `SKIPPED`.
    - `outputs.json_report`: downloadable `compatibility-report.json`, schema `kestra-openapi-breaking-change-guardian/1.0`.
    - `outputs.markdown_report`: downloadable Markdown evidence and the body of the upserted PR comment.
    - Namespace KV `openapi_guardian_<service_id>`: latest verdict, SHAs, counts and execution ID.

    ## GitHub setup

    Protect the target branch with the required status check `kestra/openapi-compatibility`. On every relevant PR update, the flow replaces the status for the new head SHA and updates the existing report comment. A failed Kestra execution and a failing GitHub status then represent the same policy decision.

    ## Links

    - [oasdiff breaking-change documentation](https://github.com/oasdiff/oasdiff/blob/main/docs/BREAKING-CHANGES.md)
    - [oasdiff configuration files](https://github.com/oasdiff/oasdiff/blob/main/docs/CONFIG-FILES.md)
    - [Kestra Git plugin](https://kestra.io/plugins/plugin-git)
    - [Kestra GitHub plugin](https://kestra.io/plugins/plugin-github)
    - This blueprint was created by [Rohan Malhotra](https://github.com/rohanmalhotracodes).
  tags:
    - Infrastructure
    - Core
  subTags:
    - CI/CD & Deployment
    - Testing & Quality
    - GitOps & Flow Sync
  ee: false
  demo: true
