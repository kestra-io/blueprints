id: confluence-stale-documentation-audit-sentinel
namespace: company.team

description: |
  List Confluence pages across one or more spaces, flag the ones whose last edit is older than
  a retention threshold you set, alert Slack with the exact titles when any are found, and log a
  governance audit trail either way. Read-only: this flow never edits or archives a page.

inputs:
  - id: confluence_server_url
    type: STRING
    displayName: Confluence server URL
    description: Base Confluence site URL, for example https://your-domain.atlassian.net, without a trailing slash.
    defaults: "https://your-domain.atlassian.net"

  - id: space_ids
    type: ARRAY
    itemType: INT
    displayName: Space IDs to scan
    description: Confluence space IDs to audit. Leave empty to scan across every space the account can see, within limit.
    defaults: []

  - id: limit
    type: INT
    displayName: Max pages per scan
    description: Maximum pages fetched per run. API max is 250.
    defaults: 100

  - id: stale_after_days
    type: INT
    displayName: Stale after days
    description: A page whose latest version was created this many days ago or more is reported stale.
    defaults: 180

  - id: max_stale_count
    type: INT
    displayName: Max stale count
    description: Alert when this many or more pages are found stale.
    defaults: 1

tasks:
  - id: list_pages
    type: io.kestra.plugin.confluence.pages.List
    description: Read-only. Fetches current and archived pages, optionally scoped to space_ids, with each page's version metadata.
    allowFailure: true
    serverUrl: "{{ inputs.confluence_server_url }}"
    username: "{{ secret('CONFLUENCE_USERNAME') }}"
    apiToken: "{{ secret('CONFLUENCE_API_TOKEN') }}"
    spaceIds: "{{ inputs.space_ids }}"
    limit: "{{ inputs.limit }}"

  - id: evaluate
    type: io.kestra.plugin.core.output.OutputValues
    description: Compares each page's version.createdAt (its latest edit timestamp) against the stale_after_days cutoff, by date only, computed here so the comparison never depends on wall-clock time inside jq.
    values:
      stale_count: >-
        {{ outputs.list_pages is not defined ? -1 : (({'children': outputs.list_pages.children, 'cutoff': (now() | dateAdd(-inputs.stale_after_days, 'DAYS') | date('yyyy-MM-dd'))} | jq('.cutoff as $c | [(.children // [])[] | select(((.versionInfo.createdAt // "")[0:10]) as $d | $d != "" and $d <= $c)] | length')) | first | number) }}
      stale_titles: >-
        {{ outputs.list_pages is not defined ? '' : (({'children': outputs.list_pages.children, 'cutoff': (now() | dateAdd(-inputs.stale_after_days, 'DAYS') | date('yyyy-MM-dd'))} | jq('.cutoff as $c | [(.children // [])[] | select(((.versionInfo.createdAt // "")[0:10]) as $d | $d != "" and $d <= $c) | .title] | join("; ")')) | first) }}
      severity: >-
        {{ outputs.list_pages is not defined ? 'CRITICAL' : (((({'children': outputs.list_pages.children, 'cutoff': (now() | dateAdd(-inputs.stale_after_days, 'DAYS') | date('yyyy-MM-dd'))} | jq('.cutoff as $c | [(.children // [])[] | select(((.versionInfo.createdAt // "")[0:10]) as $d | $d != "" and $d <= $c)] | length')) | first | number) >= inputs.max_stale_count) ? 'STALE_DOCS_FOUND' : 'OK') }}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.evaluate.values.severity != 'OK' }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': outputs.evaluate.values.severity ~ ': ' ~ outputs.evaluate.values.stale_count ~ ' Confluence page(s) have not been edited in ' ~ inputs.stale_after_days ~ ' day(s) or more: ' ~ outputs.evaluate.values.stale_titles ~ '.'} | toJson }}
    else:
      - id: compliant
        type: io.kestra.plugin.core.log.Log
        message: "No scanned Confluence page is older than {{ inputs.stale_after_days }} day(s) since its last edit."

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: "Confluence stale documentation audit sentinel complete: {{ outputs.evaluate.values.stale_count }} stale page(s), severity {{ outputs.evaluate.values.severity }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Confluence stale documentation audit sentinel failed (execution ' ~ execution.id ~ '). Check the logs.'} | toJson }}

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled. Enable once CONFLUENCE_USERNAME, CONFLUENCE_API_TOKEN, and SLACK_WEBHOOK_URL are set and confluence_server_url/space_ids point at a real site.
    cron: "0 7 * * 1"
    disabled: true
    inputs:
      confluence_server_url: "https://your-domain.atlassian.net"
      space_ids: []
      limit: 100
      stale_after_days: 180
      max_stale_count: 1

extend:
  title: Confluence Stale Documentation Audit Sentinel
  metaTitle: Confluence Stale Documentation Audit Sentinel with Kestra
  shortDescription: List Confluence pages across one or more spaces, alert Slack when any page's last edit is older than your retention threshold, and log a governance audit trail.
  metaDescription: List Confluence pages, alert Slack on documentation older than your retention threshold, and log the result for platform and docs teams.
  description: |
    A Confluence space accumulates runbooks, onboarding guides, and incident postmortems that
    nobody revisits once the page stops being urgent. Confluence has no built-in schedule that
    flags a page nobody has touched in months, so outdated instructions sit at the top of search
    results looking exactly as current as the page updated yesterday. This blueprint reads each
    page's real last-edit timestamp and reports what has actually gone stale, not a guess.

    This blueprint was created by [Mohit Jeswani](https://github.com/mohitjeswani01).

    ## How it works

    1. `list_pages` (`io.kestra.plugin.confluence.pages.List`) fetches current and archived
       pages, optionally scoped to `space_ids`, each with its `version` metadata. Read-only;
       nothing in Confluence is changed. `allowFailure: true` covers an API or auth error without
       failing the flow outright.
    2. `evaluate` (`io.kestra.plugin.core.output.OutputValues`) compares each page's
       `versionInfo.createdAt` (the timestamp of its latest edit, not when the page was first
       created) against `stale_after_days`, with a `jq` filter.
    3. `route` (`io.kestra.plugin.core.flow.If`):
       - **compliant:** logs that nothing scanned is stale.
       - **alert:** posts the count and titles to Slack.
    4. `summary` logs the count and severity, closing the governance cycle.
    5. `errors` alerts Slack if the flow itself fails, for example an expired API token.

    ## What you get

    - A real last-edit timestamp per page, not an assumption that an old page title means old
      content, and not the other way around.
    - The exact stale page titles in the Slack alert, not just a count.
    - A read-only check with zero risk of editing or archiving a real page.

    ## Who it's for

    - Platform, docs, and knowledge-management teams who own a Confluence space and have no
      process catching a runbook or onboarding guide nobody has touched in a year.
    - Teams evaluating the Confluence plugin who want a worked example of `pages.List` used as a
      standing retention audit, distinct from this repo's existing Confluence blueprint, which
      writes a weekly recap page rather than auditing page age.

    ## Why orchestrate this with Kestra

    Confluence shows a page's last-modified date one page at a time; it does not compare that
    date across a whole space against a retention policy you declare, or notify anyone. Kestra
    keeps `stale_after_days` as a flow input, turns the scan into a Slack page naming the actual
    stale titles, and keeps a full execution history of every run.

    ## Prerequisites

    - A Confluence Cloud site with a user account and an Atlassian API token.
    - At least one page in the target space(s) old enough to confirm the filter logic against.
    - A Slack incoming webhook URL.

    Confluence is a hosted Atlassian Cloud product with no official standalone Docker image, so
    `list_pages` cannot be exercised against a local container; validate against a real,
    low-traffic space or Atlassian's free Confluence tier first.

    ### Secrets

    - `CONFLUENCE_USERNAME`: the Confluence account email used by `list_pages`. In Kestra OSS,
      provide it as the base64-encoded environment variable `SECRET_CONFLUENCE_USERNAME`.
    - `CONFLUENCE_API_TOKEN`: the Atlassian API token for that account. In Kestra OSS, provide it
      as the base64-encoded environment variable `SECRET_CONFLUENCE_API_TOKEN`.
    - `SLACK_WEBHOOK_URL`: used by `alert` and the `errors` block. In Kestra OSS, provide it as
      the base64-encoded environment variable `SECRET_SLACK_WEBHOOK_URL`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `space_ids` | `[]` | Spaces to scan; empty scans every space the account can see |
    | `limit` | `100` | Max pages fetched per run (API max 250) |
    | `stale_after_days` | `180` | Days since last edit past which a page is reported stale |
    | `max_stale_count` | `1` | Stale-page count that triggers the Slack alert |

    ### Outputs

    - `{{ outputs.list_pages.children }}`: every scanned page (`title`, `markdown`,
      `versionInfo`, `rawResponse`).
    - `{{ outputs.evaluate.values.stale_count }}` / `.stale_titles`: how many pages are stale and
      their titles, semicolon-joined.
    - `{{ outputs.evaluate.values.severity }}`: `OK`, `STALE_DOCS_FOUND`, or `CRITICAL`.

    ### Pitfalls

    - `versionInfo.createdAt` is the latest edit timestamp, not the page's original creation
      date; a page created five years ago but edited last week is correctly not stale.
    - `limit` bounds how many pages `list_pages` even considers per run (API max 250); a space
      larger than that needs `cursor`-based pagination this blueprint does not yet implement, so
      a very large space is only partially scanned per run.
    - The default `status` filter on `pages.List` covers `current` and `archived` pages;
      `deleted` and `trashed` pages are never scanned, which is correct for a retention audit
      since both are already effectively gone.

    ## Quick start

    1. Add the `CONFLUENCE_USERNAME`, `CONFLUENCE_API_TOKEN`, and `SLACK_WEBHOOK_URL` secrets.
    2. Set `confluence_server_url` and, optionally, `space_ids` to your real site.
    3. Run the flow manually and confirm `summary` logs a count.
    4. Raise `stale_after_days` above every scanned page's age, or lower it below a known old
       page's age, to confirm both `compliant` and `alert` fire correctly.
    5. Enable the `weekly` trigger once `stale_after_days` matches your real retention policy.

    ## How to extend

    - Add pagination with the `cursor` property to scan a space larger than 250 pages in one run.
    - Chain `io.kestra.plugin.confluence.pages.Update` on each stale page to prepend a
      "needs review" label to its title, gated behind an explicit `confirm_tag` input so tagging
      never runs by accident.
    - Group `stale_titles` by `spaceId` from `rawResponse` in a downstream task to route each
      space's stale pages to that space's own owning team.

    ## Links

    - Confluence plugin: https://kestra.io/plugins/plugin-confluence
    - Confluence REST API v2 pages reference: https://developer.atlassian.com/cloud/confluence/rest/v2/api-group-page/
    - Slack incoming webhooks: https://api.slack.com/messaging/webhooks
  tags:
    - Business
  subTags:
    - Policy & Compliance
    - Reporting & Digests
  ee: false
  demo: false
