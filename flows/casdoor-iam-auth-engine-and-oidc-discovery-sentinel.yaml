id: casdoor-iam-auth-engine-and-oidc-discovery-sentinel
namespace: company.security

description: "Continuously audits Casdoor open-source IAM authentication engine health, validates OpenID Connect discovery endpoints, and dispatches incident alerts on identity provider degradation."

inputs:
  - id: casdoor_host
    type: STRING
    defaults: "localhost"
    description: "Hostname or IP address of the Casdoor server instance."

  - id: casdoor_port
    type: INT
    defaults: 8000
    description: "HTTP port for Casdoor REST API and authentication web UI (default: 8000)."

  - id: slack_channel
    type: STRING
    defaults: "#security-alerts"
    description: "Target Slack channel for authentication outages and IAM degradation alerts."

triggers:
  - id: periodic_iam_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_casdoor_health
    type: io.kestra.plugin.core.http.Request
    description: "Queries Casdoor system health endpoint to verify application daemon responsiveness and database connection pool state."
    uri: "http://{{ inputs.casdoor_host }}:{{ inputs.casdoor_port }}/api/health"
    method: GET
    options:
      timeout: PT15S

  - id: probe_oidc_discovery
    type: io.kestra.plugin.core.http.Request
    description: "Validates the standard OpenID Connect discovery endpoint to ensure authorization server metadata and signing key references remain accessible."
    uri: "http://{{ inputs.casdoor_host }}:{{ inputs.casdoor_port }}/.well-known/openid-configuration"
    method: GET
    options:
      timeout: PT15S

  - id: classify_iam_state
    type: io.kestra.plugin.core.flow.Switch
    description: "Evaluates health status and OIDC discovery responses to classify Casdoor state into AUTH_ENGINE_OFFLINE, OIDC_DISCOVERY_DEGRADED, or HEALTHY."
    value: >-
      {% if outputs.probe_casdoor_health.code != 200 %}
        AUTH_ENGINE_OFFLINE
      {% elseif outputs.probe_oidc_discovery.code != 200 or outputs.probe_oidc_discovery.body.issuer is not defined %}
        OIDC_DISCOVERY_DEGRADED
      {% else %}
        HEALTHY
      {% endif %}
    cases:
      AUTH_ENGINE_OFFLINE:
        - id: alert_engine_offline
          type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
          description: "Notifies security and platform on-call when the Casdoor authentication engine fails health probes."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          channel: "{{ inputs.slack_channel }}"
          payload: |
            {
              "text": "[CRITICAL] Casdoor IAM Authentication Engine Offline",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "[ALERT] Casdoor IAM Service Unavailable"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Target Host:*\n`{{ inputs.casdoor_host }}:{{ inputs.casdoor_port }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*HTTP Status:*\n`{{ outputs.probe_casdoor_health.code }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Execution ID:*\n`{{ execution.id }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Severity:*\n`CRITICAL`"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Immediate action required: Check Casdoor container logs, database connectivity, and reverse proxy routing."
                    }
                  ]
                }
              ]
            }

        - id: fail_on_engine_offline
          type: io.kestra.plugin.core.execution.Fail
          description: "Fails the workflow execution to enforce SLA breach tracking."

      OIDC_DISCOVERY_DEGRADED:
        - id: alert_oidc_degraded
          type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
          description: "Dispatches high-priority alert when OIDC discovery endpoint is broken, preventing single sign-on federations."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          channel: "{{ inputs.slack_channel }}"
          payload: |
            {
              "text": "[WARNING] Casdoor OIDC Discovery Metadata Corrupted or Incomplete",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "[WARNING] Casdoor OIDC Federation Degraded"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Host:*\n`{{ inputs.casdoor_host }}:{{ inputs.casdoor_port }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*OIDC Status Code:*\n`{{ outputs.probe_oidc_discovery.code }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Issue:*\n`Missing or Invalid Issuer in Metadata`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Severity:*\n`HIGH`"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Action required: Inspect Casdoor domain certificate, public origin configuration, and JWKS endpoints."
                    }
                  ]
                }
              ]
            }

        - id: fail_on_oidc_degraded
          type: io.kestra.plugin.core.execution.Fail
          description: "Fails the execution to halt downstream dependent workflows."

      HEALTHY:
        - id: log_iam_healthy
          type: io.kestra.plugin.core.log.Log
          description: "Logs verified health indicators when Casdoor authentication and OIDC endpoints are operating nominally."
          message: "[OK] Casdoor IAM at {{ inputs.casdoor_host }}:{{ inputs.casdoor_port }} is fully operational. Health endpoint returned HTTP {{ outputs.probe_casdoor_health.code }} and OIDC issuer '{{ outputs.probe_oidc_discovery.body.issuer ?? 'verified' }}' is active."

  - id: audit_sentinel_run
    type: io.kestra.plugin.core.log.Log
    description: "Final audit log recording execution ID, verified issuer, and IAM health status."
    message: "[AUDIT] Casdoor IAM sentinel completed execution {{ execution.id }}. Target server: {{ inputs.casdoor_host }}:{{ inputs.casdoor_port }}. OIDC issuer: {{ outputs.probe_oidc_discovery.body.issuer ?? 'N/A' }}."

extend:
  title: Casdoor IAM Auth Engine and OIDC Discovery Sentinel
  metaTitle: Casdoor IAM Auth Engine & OIDC Discovery Sentinel | Kestra
  shortDescription: Continuously audit Casdoor authentication engine availability, verify OIDC metadata endpoints, and alert on identity provider degradation.
  metaDescription: Audit Casdoor IAM single sign-on engine health, verify OIDC discovery endpoints and signing keys, and dispatch Slack alerts on authentication degradation.
  description: |
    Casdoor is an open-source, UI-first Identity and Access Management (IAM) and Single Sign-On (SSO) platform supporting OAuth 2.0, OpenID Connect (OIDC), SAML, CAS, and LDAP federations. In production architectures, Casdoor governs user authentication, JWT token issuance, and authorization policies across microservices, internal dashboards, and customer-facing portals.

    If the Casdoor daemon hangs, database connection pools exhaust, or the OpenID Connect discovery document (`/.well-known/openid-configuration`) becomes unavailable, all downstream applications fail to validate tokens or authenticate new logins. This blueprint implements an automated Sentinel that audits Casdoor core health, validates OIDC discovery metadata, and alerts engineering teams via Slack before login outages propagate.

    ## How it works

    1. **Scheduled Audit Trigger**: Runs on a configurable 15-minute interval (`*/15 * * * *`), disabled by default for controlled onboarding and ad-hoc manual validation.
    2. **Core Health Probe**: Dispatches an HTTP GET request to `/api/health` to confirm the Go application runtime is responsive and backend database connectivity is intact.
    3. **OIDC Federation Verification**: Queries the OpenID Connect discovery endpoint (`/.well-known/openid-configuration`) to verify the issuer URI, authorization endpoints, and JSON Web Key Sets (JWKS).
    4. **Condition Classification**: Evaluates HTTP response codes and metadata integrity within an `io.kestra.plugin.core.flow.Switch` task, routing executions into `AUTH_ENGINE_OFFLINE`, `OIDC_DISCOVERY_DEGRADED`, or `HEALTHY` pathways.
    5. **Slack Incident Alerting**: Issues formatted incident notifications via `io.kestra.plugin.notifications.slack.SlackIncomingWebhook` with host coordinates, status codes, and triage runbooks.
    6. **Deterministic Failure & Audit**: Terminates anomalous executions with `io.kestra.plugin.core.execution.Fail` to enforce SLA tracking, and emits a final audit log capturing execution telemetry.

    ## What you get

    - **Automated IAM Outage Detection**: Early warning when authentication APIs fail, preventing silent login disruptions across all connected apps.
    - **OIDC Metadata Integrity Auditing**: Verifies that public discovery endpoints and token signing keys remain accessible for federated clients.
    - **Triage-Ready Incident Notifications**: Formatted Slack alerts providing hostname coordinates, status codes, and immediate operational remediation steps.
    - **Declarative Security Automation**: Eliminates unmanaged cron jobs and fragile shell scripts with auditable, version-controlled YAML.

    ## Who it's for

    - **Security & IAM Engineers**: Managing central identity providers, user directories, and single sign-on federations.
    - **DevOps & Platform Teams**: Responsible for zero-trust authentication infrastructure uptime and service availability.
    - **Site Reliability Engineers**: Monitoring critical path dependency health across internal and customer authentication layers.

    ## Why orchestrate this with Kestra

    - **Multi-Endpoint Health Probing**: Chains core process checks and OpenID Connect protocol validation in a single declarative flow.
    - **Stateful Flow Routing**: Evaluates complex responses with Pebble expressions without requiring custom monitoring microservices.
    - **Secure Credential Injection**: Injects webhook URLs and secrets dynamically using native namespace secret management.
    - **Execution History & Replay**: Stores an immutable timeline of health audit outcomes for compliance and SOC 2 security reporting.

    ## Prerequisites

    - A running Casdoor instance with HTTP access enabled.
    - Network connectivity from the Kestra worker to the Casdoor service port (`8000`).
    - An incoming webhook URL configured in your target Slack workspace.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Target Slack incoming webhook URL for operational alerts and incident escalation (required).

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    2. Start a local Casdoor container for testing: `docker run -d --name casdoor -p 8000:8000 casbin/casdoor:latest`.
    3. Import this blueprint into Kestra and trigger an execution with default inputs.
    4. Confirm that the health probe and OIDC discovery tasks succeed, and verify execution logs in the Kestra UI.
    5. Enable the schedule trigger to establish automated 15-minute continuous monitoring.

    ## How to extend

    - **Synthetic User Authentication**: Add tasks to simulate user login via OAuth 2.0 Resource Owner Password Credentials (ROPC) grant.
    - **LDAP Federation Testing**: Chain `io.kestra.plugin.core.http.Request` tasks to test sync status with upstream enterprise LDAP directories.
    - **PagerDuty Escalation**: Add `io.kestra.plugin.notifications.pagerduty.PagerDutyAlert` for high-severity authentication outages.

    ## Links

    - [Kestra HTTP Plugin Documentation](https://kestra.io/plugins/core/http/request)
    - [Kestra Slack Notification Plugin Documentation](https://kestra.io/plugins/plugin-notifications)
    - [Casdoor Official Documentation](https://casdoor.org/docs/overview)
    - [OpenID Connect Discovery Specification](https://openid.net/specs/openid-connect-discovery-1_0.html)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  demo: false
