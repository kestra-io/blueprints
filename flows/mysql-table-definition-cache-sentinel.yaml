id: mysql-table-definition-cache-sentinel
namespace: company.dataops

inputs:
  - id: mysql_host
    type: STRING
    defaults: mysql.internal
    description: Hostname of the MySQL database instance.
  - id: mysql_port
    type: INT
    defaults: 3306
    description: TCP port of the MySQL database instance.
  - id: mysql_database
    type: STRING
    defaults: mysql
    description: Database name to connect to.
  - id: mysql_username
    type: STRING
    defaults: kestra_monitor
    description: MySQL monitoring username.
  - id: max_opened_definitions_threshold
    type: INT
    defaults: 1000
    description: Maximum opened table definitions count before warning of metadata cache thrashing.

tasks:
  - id: query_table_definition_metrics
    type: io.kestra.plugin.jdbc.mysql.Query
    url: "jdbc:mysql://{{ inputs.mysql_host }}:{{ inputs.mysql_port }}/{{ inputs.mysql_database }}"
    username: "{{ inputs.mysql_username }}"
    password: "{{ secret('MYSQL_PASSWORD') }}"
    sql: |
      SELECT 
        VARIABLE_NAME, 
        CAST(VARIABLE_VALUE AS UNSIGNED) AS METRIC_VALUE 
      FROM performance_schema.global_status 
      WHERE VARIABLE_NAME = 'Opened_table_definitions';
    fetchType: FETCH_ONE

  - id: evaluate_metadata_cache_thrashing
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_table_definition_metrics.row.METRIC_VALUE > inputs.max_opened_definitions_threshold }}"
    then:
      - id: alert_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *MySQL Table Definition Cache Alert*: Database {{ inputs.mysql_host }} reported {{ outputs.query_table_definition_metrics.row.METRIC_VALUE }} opened table definitions. Consider increasing `table_definition_cache` to reduce metadata lock overhead and disk lookups."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *MySQL Sentinel Execution Failure*: Failed to query table definition metrics on {{ inputs.mysql_host }}."
      }

triggers:
  - id: daily_cache_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * *"
    disabled: true

extend:
  title: MySQL Table Definition Cache Miss Ratio Sentinel
  shortDescription: Audits MySQL table definition cache efficiency to prevent table metadata thrashing and disk dictionary lookups.
  description: |
    ## How it works
    This flow evaluates `Opened_table_definitions` against MySQL `performance_schema.global_status`. It tracks how often MySQL must read `.frm`/dictionary metadata from disk due to table definition cache evictions, warning DBAs before metadata lock contention stalls query execution.

    ## What you get
    - Real-time detection of table definition cache undersizing across multi-tenant schemas.
    - Prevention of metadata lock (MDL) wait spikes.
    - Clear Slack recommendations to increase `table_definition_cache`.

    ## Who it's for
    - Database administrators managing schemas with thousands of partitioned tables.
    - Platform engineers scaling high-density multi-tenant MySQL databases.

    ## Why orchestrate this with Kestra
    Kestra runs automated scheduled health checks natively using the JDBC plugin suite, combining SQL telemetry with declarative conditional logic and notification dispatching.

    ## Prerequisites
    - MySQL database instance with `performance_schema` accessible to the monitoring user.
    - Secrets `MYSQL_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure database host, port, and credentials.
    3. Run manually to check current table definition counts.

    ## How to extend
    - Monitor `Opened_tables` alongside `Opened_table_definitions` for open table cache sizing.
    - Check metadata locks via `performance_schema.metadata_locks`.
    - Forward cache metrics to Datadog or Prometheus.

    ## Links
    - [Kestra MySQL Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-mysql)
    - [MySQL Table Definition Cache](https://dev.mysql.com/doc/refman/8.0/en/server-system-variables.html#sysvar_table_definition_cache)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
