id: lancedb-serverless-vector-compaction-and-s3-backup
namespace: company.ai

concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: lancedb_s3_uri
    type: STRING
    displayName: LanceDB S3 Storage URI
    required: true
    defaults: "s3://production-lancedb-tables/embeddings_v1"
    description: "S3 URI where the LanceDB table storage files are persisted."

  - id: table_name
    type: STRING
    displayName: Vector Table Name
    required: true
    defaults: "semantic_search_vectors"
    description: "The targeted LanceDB table to compact and back up."

  - id: max_fragment_threshold
    type: INT
    displayName: Fragment Compaction Threshold
    required: true
    defaults: 10
    description: "Trigger compaction if table has more than this number of data fragments."

  - id: s3_region
    type: STRING
    displayName: AWS S3 Region
    required: true
    defaults: "us-east-1"
    description: "AWS region hosting the LanceDB storage bucket."

tasks:
  - id: log_start
    type: io.kestra.plugin.core.log.Log
    message: "📦 Inspecting LanceDB serverless table '{{ inputs.table_name }}' at '{{ inputs.lancedb_s3_uri }}'"

  - id: inspect_and_compact_lancedb
    type: io.kestra.plugin.scripts.python.Script
    description: "Connect to LanceDB on S3, inspect fragment fragmentation, execute native compaction and cleanup old versions"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    dependencies:
      - lancedb==0.13.0
      - pyarrow==17.0.0
      - kestra
    env:
      LANCEDB_URI: "{{ inputs.lancedb_s3_uri }}"
      TABLE_NAME: "{{ inputs.table_name }}"
      FRAGMENT_THRESHOLD: "{{ inputs.max_fragment_threshold }}"
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
      AWS_DEFAULT_REGION: "{{ inputs.s3_region }}"
    script: |
      import os
      import lancedb
      from kestra import Kestra

      db_uri = os.environ["LANCEDB_URI"]
      table_name = os.environ["TABLE_NAME"]
      threshold = int(os.environ["FRAGMENT_THRESHOLD"])

      print(f"Connecting to LanceDB storage: {db_uri}")
      db = lancedb.connect(db_uri)

      if table_name not in db.table_names():
          raise ValueError(f"Table '{table_name}' does not exist in LanceDB at {db_uri}")

      tbl = db.open_table(table_name)
      stats = tbl.stats()
      num_fragments = stats.num_fragments if hasattr(stats, "num_fragments") else len(tbl.to_lance().get_fragments())
      total_rows = tbl.count_rows()

      print(f"LanceDB Table '{table_name}': {total_rows} rows, {num_fragments} fragments.")

      compacted = False
      if num_fragments >= threshold:
          print(f"Fragment count {num_fragments} >= threshold {threshold}. Running native table compaction...")
          tbl.compact_files()
          tbl.cleanup_old_versions()
          compacted = True
          print("Compaction and version cleanup completed successfully.")
      else:
          print(f"Fragment count {num_fragments} below threshold {threshold}. Skipping compaction.")

      Kestra.outputs({
          "total_rows": total_rows,
          "initial_fragments": num_fragments,
          "was_compacted": compacted
      })

  - id: record_compaction_state
    type: io.kestra.plugin.core.kv.Set
    description: "Store LanceDB maintenance and fragment metrics in Kestra KV store"
    key: "lancedb_maintenance_{{ inputs.table_name }}"
    value: |
      {
        "table_name": "{{ inputs.table_name }}",
        "total_rows": {{ outputs.inspect_and_compact_lancedb.vars.total_rows }},
        "initial_fragments": {{ outputs.inspect_and_compact_lancedb.vars.initial_fragments }},
        "was_compacted": {{ outputs.inspect_and_compact_lancedb.vars.was_compacted }},
        "timestamp": "{{ execution.startDate }}",
        "execution_id": "{{ execution.id }}"
      }

  - id: notify_slack_completion
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Notify AI and search platform engineers of table maintenance status"
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "blocks": [
          {
            "type": "header",
            "text": {
              "type": "plain_text",
              "text": "🗄️ LanceDB Vector Table Maintenance Complete",
              "emoji": true
            }
          },
          {
            "type": "section",
            "fields": [
              {
                "type": "mrkdwn",
                "text": "*Table:* `{{ inputs.table_name }}`"
              },
              {
                "type": "mrkdwn",
                "text": "*Total Vectors:* `{{ outputs.inspect_and_compact_lancedb.vars.total_rows }}`"
              },
              {
                "type": "mrkdwn",
                "text": "*Fragments:* `{{ outputs.inspect_and_compact_lancedb.vars.initial_fragments }}`"
              },
              {
                "type": "mrkdwn",
                "text": "*Compacted:* `{{ outputs.inspect_and_compact_lancedb.vars.was_compacted }}`"
              }
            ]
          }
        ]
      }

errors:
  - id: alert_maintenance_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Dead-letter alert for LanceDB connection or compaction errors"
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "blocks": [
          {
            "type": "header",
            "text": {
              "type": "plain_text",
              "text": "🚨 LanceDB Maintenance FAILED",
              "emoji": true
            }
          },
          {
            "type": "section",
            "text": {
              "type": "mrkdwn",
              "text": "LanceDB maintenance failed for table `{{ inputs.table_name }}` on execution `{{ execution.id }}`."
            }
          }
        ]
      }

extend:
  title: LanceDB Serverless Vector Storage Compaction and Maintenance Pipeline
  metaTitle: LanceDB S3 Vector Table Compaction and Health Sentinel
  shortDescription: Inspects LanceDB table fragments on S3, executes automated file compaction, purges old versions, and logs state.
  metaDescription: Inspect serverless LanceDB tables on AWS S3, enforce fragment compaction thresholds, prune obsolete versions, and record telemetry in Kestra KV store.
  tags:
    - AI
    - Cloud
    - Data
  subTags:
    - AWS
    - Python
    - Docker
    - Slack
  ee: false
  demo: false
  description: |
    ## How it works
    1. **S3 Connection & Metadata Inspection**: Connects to the serverless LanceDB table hosted on AWS S3 and reads table statistics, vector counts, and fragment metadata.
    2. **Compaction Threshold Evaluation**: Compares the number of small data fragments against the configured fragmentation threshold.
    3. **Containerized File Compaction & Pruning**: When fragmented, triggers `tbl.compact_files()` to consolidate small Parquet/Lance files into optimized chunks and runs `cleanup_old_versions()` to reclaim S3 storage.
    4. **Audit State Tracking**: Writes the compaction status, row counts, and timestamp into the Kestra KV Store (`io.kestra.plugin.core.kv.Set`).
    5. **Slack Notification & Dead-Letter Catching**: Dispatches structured reports to Slack and captures unexpected failures via top-level `errors`.

    ## What you get
    - Substantially reduced query latency and S3 read requests for LanceDB vector search.
    - Automated garbage collection of unreferenced version snapshots to optimize storage costs.
    - Zero infrastructure management running inside ephemeral Python Docker containers.
    - Real-time visibility and audit history in Kestra KV store.

    ## Who it's for
    - AI and Search Engineers deploying LanceDB for multimodal RAG and vector retrieval.
    - SRE and Data Platform teams seeking automated storage maintenance and cost optimization.

    ## Why orchestrate this with Kestra
    - Coordinates containerized Python data operations (`io.kestra.plugin.scripts.runner.docker.Docker`) with cloud storage credentials.
    - Provides native state tracking, secret masking, retry logic, and multi-channel alerting.

    ## Prerequisites
    - AWS S3 bucket with LanceDB tables.
    - Slack webhook URL for notifications.

    ### Secrets
    - `AWS_ACCESS_KEY_ID`: AWS IAM access key with S3 read/write permissions.
    - `AWS_SECRET_ACCESS_KEY`: AWS IAM secret key.
    - `SLACK_WEBHOOK_URL`: Webhook URL for alerting.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Configure AWS credentials and Slack webhook in your namespace secrets.
    3. Schedule this workflow to run nightly or weekly to maintain optimal index performance.

    ## How to extend
    - Add an automated query test step that benchmarks ANN vector search latency before and after compaction.
    - Connect to AWS CloudWatch to publish fragment counts and latency metrics.

    ## Links
    - [LanceDB Documentation](https://lancedb.github.io/lancedb/)
    - [Kestra Docker Script Plugin](https://kestra.io/plugins/plugin-scripts-docker)
