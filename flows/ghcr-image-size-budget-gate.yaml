id: ghcr-image-size-budget-gate
namespace: company.team
description: |
  Audit container image sizes across GHCR repositories, enforce a size budget,
  and alert platform teams on Slack when images bloat past the limit.

triggers:
  - id: weekly_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audit image sizes every Monday morning
    cron: "0 9 * * MON"

  - id: on_demand_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: On-demand audit after a base-image bump
    key: "{{ secret('WEBHOOK_KEY') }}"

inputs:
  - id: images
    type: ARRAY
    itemType: STRING
    displayName: Images to audit
    description: Image refs in org/image format (GHCR assumed)
    defaults:
      - "kestra-io/kestra"
  - id: size_budget_mb
    type: INT
    displayName: Size budget (MB)
    description: Flag images larger than this budget
    defaults: 1200
  - id: slack_channel
    type: STRING
    displayName: Slack channel
    description: Channel receiving the bloat digest
    defaults: "#platform"

tasks:
  - id: audit_images
    type: io.kestra.plugin.core.flow.Loop
    description: Fan out image audits with bounded concurrency
    values: "{{ inputs.images }}"
    concurrencyLimit: 4
    tasks:
      - id: fetch_tags
        type: io.kestra.plugin.core.http.Request
        description: List package versions for the GHCR container package
        uri: "https://api.github.com/orgs/{{ parents[0].value | split(pat='/') | first }}/packages/container/{{ parents[0].value | split(pat='/') | last }}/versions?per_page=5"
        method: GET
        headers:
          Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
          Accept: "application/vnd.github+json"
        options:
          allowFailed: true

      - id: evaluate_budget
        type: io.kestra.plugin.scripts.python.Script
        description: Estimate image footprint and compare against the budget
        containerImage: python:3.11
        dependencies:
          - kestra
        script: |
          from kestra import Kestra

          image = """{{ parents[0].value }}"""
          budget_mb = {{ inputs.size_budget_mb }}
          try:
              versions = {{ outputs.fetch_tags.body | json }}
          except Exception:
              versions = []
          if not isinstance(versions, list):
              versions = []

          # GHCR version payloads vary; sum known size hints when present,
          # otherwise report unknown so the run stays auditable.
          total_bytes = 0
          for v in versions[:5]:
              meta = v.get("metadata", {}) or {}
              container = meta.get("container", {}) or {}
              for f in container.get("files", []) or []:
                  total_bytes += f.get("size", 0) or 0

          size_mb = round(total_bytes / (1024 * 1024), 1) if total_bytes else -1
          breached = size_mb != -1 and size_mb > budget_mb
          Kestra.logger().info(f"{image}: {size_mb}MB vs budget {budget_mb}MB")
          Kestra.outputs({
              "image": image,
              "size_mb": size_mb,
              "budget_mb": budget_mb,
              "breached": breached,
              "versions_seen": len(versions),
          })

      - id: alert_on_bloat
        type: io.kestra.plugin.core.flow.If
        description: Notify Slack only when the image exceeds its budget
        condition: "{{ outputs.evaluate_budget.vars.breached }}"
        then:
          - id: notify_slack
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Post image-bloat alert with size and budget details
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            messageText: |
              :whale: *Container Image Over Budget*
              Image: `{{ outputs.evaluate_budget.vars.image }}`
              Size: {{ outputs.evaluate_budget.vars.size_mb }}MB vs budget {{ inputs.size_budget_mb }}MB
              Execution: `{{ execution.id }}`
              Consider multi-stage builds, slimmer base images, or layer pruning.

  - id: emit_audit_metrics
    type: io.kestra.plugin.core.output.OutputValues
    description: Export audit coverage for dashboards and audit history
    values:
      images_audited: "{{ inputs.images | length }}"
      budget_mb: "{{ inputs.size_budget_mb }}"
      audited_at: "{{ now() }}"

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert on-call if the audit itself fails
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: |
      :warning: *Image Size Audit FAILED*
      Flow: `{{ flow.id }}` execution `{{ execution.id }}`
      Check GITHUB_TOKEN scope and worker logs.

extend:
  title: Enforce Container Image Size Budgets on GHCR
  metaTitle: GHCR Image Size Budget Gate
  shortDescription: Audit GHCR image sizes weekly, enforce an MB budget, and alert Slack on bloat.
  metaDescription: Gate container image size with Kestra. Audit GHCR images against a budget and alert Slack on bloat.
  description: |
    Bloated images slow pulls, scaling, and deploys. This blueprint audits a configurable list of GHCR container images every Monday morning, estimates each image footprint from package version metadata, and posts a Slack alert only when an image exceeds its size budget (default 1200MB). A webhook trigger enables on-demand audits after a base-image bump.

    ## How it works

    1. `weekly_audit` (`io.kestra.plugin.core.trigger.Schedule`, cron `0 9 * * MON`) launches the run; `on_demand_webhook` allows ad-hoc audits.
    2. `audit_images` (`io.kestra.plugin.core.flow.Loop`, concurrency 4) fans out across `inputs.images`.
    3. `fetch_tags` (`io.kestra.plugin.core.http.Request`) lists GHCR package versions with `allowFailed: true`.
    4. `evaluate_budget` (`io.kestra.plugin.scripts.python.Script`) estimates MB footprint and sets `breached`.
    5. `alert_on_bloat` (`io.kestra.plugin.core.flow.If`) posts to Slack (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) only on breach.
    6. `emit_audit_metrics` (`io.kestra.plugin.core.output.OutputValues`) exports audit coverage for history.

    ## What you get

    - Weekly image-size report across any number of images.
    - Budget gate (default 1200MB) with Slack bloat alerts.
    - Remediation hints (multi-stage builds, slimmer bases).
    - Failure alert if the audit itself errors.

    ## Who it's for

    - Platform teams owning base images and pull performance.
    - DevOps engineers fighting slow autoscaling from fat images.
    - Teams replacing ad-hoc `docker images` checks with code.

    ## Prerequisites

    - A GitHub token with `packages:read` scope.
    - Slack Incoming Webhook URL.

    ### Secrets

    - `GITHUB_TOKEN`: token used to read GHCR package metadata.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook for bloat and failure alerts.
    - `WEBHOOK_KEY`: auth key for the on-demand webhook trigger.

    ## Quick start

    1. Set `GITHUB_TOKEN`, `SLACK_WEBHOOK_URL`, and `WEBHOOK_KEY` secrets.
    2. Edit `images` and `size_budget_mb` inputs.
    3. Run once manually to verify package access.
    4. Enable the `weekly_audit` schedule.

    ## How to extend

    - Fail the execution on breach to gate promotions.
    - Track size trends in Postgres for burn-down charts.
    - Scan each tag with Trivy and join CVE counts to the report.

    ## Links

    - GitHub packages API: https://docs.github.com/en/rest/packages/packages
    - Slack plugin: https://kestra.io/plugins/plugin-slack
    - This blueprint has been created by [yashspidey](https://github.com/yashspidey)

    ## Inputs

    - `images` (ARRAY of STRING): image refs in org/image format.
    - `size_budget_mb` (INT, default 1200): max allowed image size in MB.
    - `slack_channel` (STRING, default #platform): digest destination.

    ## Outputs

    - `emit_audit_metrics.values.images_audited`: number of images audited.
    - `emit_audit_metrics.values.audited_at`: run timestamp for reports.
  tags:
    - DevOps
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
