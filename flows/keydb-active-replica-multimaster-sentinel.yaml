id: keydb-active-replica-multimaster-sentinel
namespace: company.data

inputs:
  - id: keydb_host
    type: STRING
    displayName: KeyDB Host
    defaults: "keydb-node-1.internal"
    description: Hostname or IP address of the primary KeyDB instance to interrogate.

  - id: keydb_port
    type: INT
    displayName: KeyDB Port
    defaults: 6379
    description: Port number for the Redis wire protocol interface on KeyDB (default 6379).

  - id: peer_host
    type: STRING
    displayName: Active Replica Peer Host
    defaults: "keydb-node-2.internal"
    description: Hostname of the companion active-replica peer node used for automated re-pairing.

  - id: peer_port
    type: INT
    displayName: Active Replica Peer Port
    defaults: 6379
    description: Port number of the companion active-replica peer node (default 6379).

  - id: use_password
    type: BOOL
    displayName: Use Password Authentication
    defaults: false
    description: Authenticate using the KEYDB_PASSWORD secret when connecting via RedisCLI.

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#data-platform-alerts"
    description: Slack channel destination for operational replication incident cards.

  - id: auto_reconnect
    type: BOOL
    displayName: Auto Reconnect Dropped Peering
    defaults: true
    description: Dispatch REPLICAOF command to re-establish active replication when links enter down state.

  - id: dry_run
    type: BOOL
    displayName: Dry Run Mode
    defaults: false
    description: When true, audits replication health and dispatches notifications but skips remediation commands.

triggers:
  - id: every_fifteen_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

tasks:
  - id: probe_replication_info
    type: io.kestra.plugin.redis.cli.RedisCLI
    host: "{{ inputs.keydb_host }}"
    port: "{{ inputs.keydb_port }}"
    password: "{{ inputs.use_password ? secret('KEYDB_PASSWORD') : null }}"
    commands:
      - INFO replication

  - id: route_by_replication_health
    type: io.kestra.plugin.core.flow.Switch
    value: >-
      {% if outputs.probe_replication_info.vars.command_1 is null %}
      PROBE_FAILED
      {% else %}
        {% set info = outputs.probe_replication_info.vars.command_1 %}
        {% if "master_link_status:down" in info or "master_global_link_status:down" in info %}
        CRITICAL
        {% elseif "master_sync_in_progress:1" in info %}
        WARNING
        {% elseif "role:active-replica" in info or "role:master" in info %}
        HEALTHY
        {% else %}
        UNKNOWN
        {% endif %}
      {% endif %}
    cases:
      CRITICAL:
        - id: alert_critical_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "[CRITICAL] KeyDB Active-Replica Peering Link Down - Multi-Master State Diverging",
              "attachments": [
                {
                  "color": "#D32F2F",
                  "title": "KeyDB Active-Replica Replication Link Failure",
                  "fields": [
                    {
                      "title": "Local Node",
                      "value": "{{ inputs.keydb_host }}:{{ inputs.keydb_port }}",
                      "short": true
                    },
                    {
                      "title": "Companion Peer",
                      "value": "{{ inputs.peer_host }}:{{ inputs.peer_port }}",
                      "short": true
                    },
                    {
                      "title": "Severity",
                      "value": "CRITICAL - Active-Replica Link Down",
                      "short": true
                    },
                    {
                      "title": "Remediation Status",
                      "value": "{{ (inputs.auto_reconnect and not inputs.dry_run) ? 'Dispatching REPLICAOF Reconnection' : 'Remediation Skipped (Dry Run or Disabled)' }}",
                      "short": true
                    }
                  ],
                  "footer": "Kestra KeyDB Sentinel | Execution ID: {{ execution.id }}"
                }
              ]
            }

        - id: check_remediation
          type: io.kestra.plugin.core.flow.If
          condition: "{{ inputs.auto_reconnect == true and inputs.dry_run == false }}"
          then:
            - id: execute_reconnect
              type: io.kestra.plugin.redis.cli.RedisCLI
              host: "{{ inputs.keydb_host }}"
              port: "{{ inputs.keydb_port }}"
              password: "{{ inputs.use_password ? secret('KEYDB_PASSWORD') : null }}"
              commands:
                - REPLICAOF {{ inputs.peer_host }} {{ inputs.peer_port }}

            - id: notify_remediation_slack
              type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
              url: "{{ secret('SLACK_WEBHOOK_URL') }}"
              payload: |
                {
                  "channel": "{{ inputs.slack_channel }}",
                  "text": "[REMEDIATION] KeyDB REPLICAOF command dispatched to re-establish active-replica peering link."
                }

      WARNING:
        - id: alert_warning_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "[WARNING] KeyDB Active-Replica Sync In Progress - Initial Handshake or Resync Active",
              "attachments": [
                {
                  "color": "#F57C00",
                  "title": "KeyDB Replication Synchronization Warning",
                  "fields": [
                    {
                      "title": "Local Node",
                      "value": "{{ inputs.keydb_host }}:{{ inputs.keydb_port }}",
                      "short": true
                    },
                    {
                      "title": "Status",
                      "value": "master_sync_in_progress: 1",
                      "short": true
                    },
                    {
                      "title": "Severity",
                      "value": "WARNING - Background Syncing",
                      "short": true
                    },
                    {
                      "title": "Auto Reconnect",
                      "value": "{{ inputs.auto_reconnect ? 'Enabled' : 'Disabled' }}",
                      "short": true
                    }
                  ],
                  "footer": "Kestra KeyDB Sentinel | Execution ID: {{ execution.id }}"
                }
              ]
            }

      PROBE_FAILED:
        - id: alert_probe_failure
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "[CRITICAL] KeyDB Sentinel Probe Failed - Unable to execute INFO replication via RedisCLI. Verify network routing and credentials."
            }

      HEALTHY:
        - id: log_replication_healthy
          type: io.kestra.plugin.core.log.Log
          message: "KeyDB active-replica replication health is normal. Peering link status is UP."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "KeyDB replication health audit completed. Status: {{ outputs.route_by_replication_health.value ?? 'PROCESSED' }}."

errors:
  - id: on_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "[ERROR] KeyDB Active-Replica Sentinel flow execution aborted unexpectedly. Execution ID: {{ execution.id }}."
      }

extend:
  title: KeyDB Active-Replica Multi-Master Peering Sentinel
  metaTitle: KeyDB Active-Replica Sentinel | Kestra
  shortDescription: Audits KeyDB INFO replication for active-replica link dropouts and automates REPLICAOF healing.
  metaDescription: Audit KeyDB active-replica multi-master replication links, detect peering dropouts, dispatch Slack alerts, and automate REPLICAOF healing.
  description: |
    KeyDB is an open-source, multithreaded alternative to Redis engineered for high-throughput caching and in-memory key-value processing. A cornerstone capability of KeyDB is Active-Replica (multi-master) replication, wherein two or more instances are configured with `active-replica yes` to accept concurrent write and read operations while synchronizing mutations bidirectionally. In production, transient cross-datacenter network partitions, high CPU thread starvation, or peer process restarts can sever the active peering connection, flipping `master_link_status` or `master_global_link_status` to `down`. When an active-replica link drops, both nodes continue serving independent application writes, resulting in diverging key state and potential reconciliation conflicts. This blueprint provides automated continuous surveillance over `INFO replication`, detects severed peering links, alerts operations via Slack, and automates safe remediation using `REPLICAOF` reconnection commands.

    ## How it works

    1. Scheduled trigger (`every_fifteen_minutes`) initiates diagnostic health verification every 15 minutes, with manual runs supported via customizable inputs.
    2. Diagnostic probe (`probe_replication_info`) connects to the local KeyDB instance over the Redis wire protocol (`port 6379`) via `io.kestra.plugin.redis.cli.RedisCLI` and executes `INFO replication`.
    3. Classification logic evaluates the command output using Pebble templating, discerning whether any peering links are down (`CRITICAL`), if synchronization is in progress (`WARNING`), if all links are up (`HEALTHY`), or if the instance connection failed (`PROBE_FAILED`).
    4. Routing task (`route_by_replication_health`) switches execution along dedicated paths according to the classified severity.
    5. On `CRITICAL` or `WARNING` states, structured Slack incident cards notify operations channels with local node endpoints, companion peer addresses, and remediation statuses.
    6. Guarded remediation (`check_remediation`) checks whether `auto_reconnect` is enabled and `dry_run` is disabled. If confirmed, `execute_reconnect` dispatches `REPLICAOF <peer_host> <peer_port>` via `RedisCLI` to re-establish active-replica synchronization.
    7. On `PROBE_FAILED`, dedicated alerts notify administrators of unreachable ports or authentication failures.
    8. Audit log task (`log_audit_summary`) writes execution metadata and classified status to task logs.

    ## What you get

    - Automated continuous surveillance of KeyDB active-replica multi-master peering health.
    - Early detection of severed bidirectional replication links before data divergence widens.
    - Automated self-healing reconnection executing `REPLICAOF` commands without manual administrator intervention.
    - Differentiated incident routing separating active network disconnections from transient background syncs.
    - Full execution traceability and audit logging without leaking database credentials in logs or alert payloads.

    ## Who it's for

    - Platform Engineers and SREs maintaining high-availability KeyDB active-active caching clusters.
    - Database Administrators managing multithreaded in-memory data tiers and real-time session stores.
    - Backend Architects relying on multi-master low-latency key-value stores for distributed microservices.

    ## Why orchestrate this with Kestra

    - Declarative YAML definition unifies distributed cache peering surveillance, conditional severity triage, and automated self-healing into version-controlled GitOps workflows.
    - Native Redis CLI plugin connectivity communicates directly with KeyDB's native wire protocol without external agent daemons or Python container overhead.
    - Built-in conditional routing and dry-run safety gates isolate discovery from remediation commands.
    - Immutable execution history provides operational evidence documenting peering recovery timelines and network degradation intervals.
    - Cloud-native scheduling and flow-level error-trapping ensure continuous sentinel operation independent of external cron infrastructure.

    ## Prerequisites

    - KeyDB cluster running with `active-replica yes` enabled (default port 6379).
    - Network connectivity permitting TCP communication from Kestra to KeyDB instances.
    - Slack incoming webhook URL for operational incident dispatch.

    ### Secrets

    - `KEYDB_PASSWORD`: Password for authenticating to the KeyDB instance via RedisCLI (optional if protected mode disabled).
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for posting incident cards to Slack.

    ## Quick start

    1. Configure `KEYDB_PASSWORD` (if applicable) and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Deploy this blueprint to your Kestra instance and trigger an initial run with `dry_run: true` to verify connectivity against your KeyDB server.
    3. Review the execution log in the Kestra UI to verify `INFO replication` output parsing.
    4. Enable the `every_fifteen_minutes` schedule trigger to activate automated continuous monitoring and remediation.

    ## How to extend

    - Add companion node inspection to probe both multi-master nodes simultaneously and compare replication offsets.
    - Integrate PagerDuty alerting via `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert` for persistent multi-master split-brain outages.
    - Attach memory fragmentation checks using `INFO memory` to identify allocator pressure across worker threads.

    ## Links

    - [KeyDB Active-Replica Documentation](https://docs.keydb.dev/docs/active-rep/)
    - [KeyDB Multi-Threading Architecture](https://docs.keydb.dev/docs/multithreading/)
    - [Kestra Redis Plugin Documentation](https://kestra.io/plugins/plugin-redis)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-notifications)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
