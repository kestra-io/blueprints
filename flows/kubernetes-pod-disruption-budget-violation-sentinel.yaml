id: kubernetes-pod-disruption-budget-violation-sentinel
namespace: company.sre

inputs:
  - id: kube_context
    type: STRING
    required: false
    description: Optional Kubernetes context name.
  - id: zero_disruption_threshold
    type: INT
    defaults: 0
    description: Maximum acceptable count of PodDisruptionBudgets with zero allowed disruptions.

tasks:
  - id: audit_pdb_disruptions
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: bitnami/kubectl:latest
    commands:
      - |
        CONTEXT_ARG=""
        if [ -n "{{ inputs.kube_context }}" ]; then
          CONTEXT_ARG="--context={{ inputs.kube_context }}"
        fi
        
        kubectl $CONTEXT_ARG get pdb -A -o json > /tmp/pdb_all.json
        
        BLOCKED_COUNT=$(jq '[.items[] | select(.status.disruptionsAllowed == 0 and .status.expectedPods > 0)] | length' /tmp/pdb_all.json)
        BLOCKED_DETAILS=$(jq '[.items[] | select(.status.disruptionsAllowed == 0 and .status.expectedPods > 0) | {namespace: .metadata.namespace, name: .metadata.name, current_healthy: .status.currentHealthy, desired_healthy: .status.desiredHealthy, expected_pods: .status.expectedPods}]' /tmp/pdb_all.json)
        
        echo "::set-output name=blocked_count::$BLOCKED_COUNT::"
        echo "::set-output name=blocked_details::$BLOCKED_DETAILS::"

  - id: evaluate_pdb_violations
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_pdb_disruptions.vars.blocked_count | int > inputs.zero_disruption_threshold }}"
    then:
      - id: notify_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#infrastructure-alerts",
            "attachments": [
              {
                "color": "warning",
                "title": "⚠️ Kubernetes PodDisruptionBudget Node Drain Lock Alert",
                "text": "Detected *{{ outputs.audit_pdb_disruptions.vars.blocked_count }}* PDB(s) with *0 allowed disruptions*. Violating PDBs: {{ outputs.audit_pdb_disruptions.vars.blocked_details }}. Impact: Cluster autoscaler and node drains (upgrades, security patches) will be blocked indefinitely.",
                "footer": "Kestra SRE Orchestrator • PDB Sentinel"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#infrastructure-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ PDB Sentinel Workflow Execution Failed",
            "text": "The Kubernetes PDB audit workflow failed unexpectedly. Please verify cluster RBAC, kubeconfig secrets, and API server reachability.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Kubernetes PodDisruptionBudget Zero Allowed Disruptions Lock Sentinel
  shortDescription: Audits Kubernetes PodDisruptionBudgets to detect zero-disruption locks that stall cluster upgrades and node drains.
  description: |
    ## How it works
    This workflow queries all `PodDisruptionBudget` (PDB) objects across all cluster namespaces using `kubectl`. It inspects `.status.disruptionsAllowed` alongside `.status.expectedPods`. Any PDB where `disruptionsAllowed` is `0` while workloads exist will deadlock Kubernetes node draining, preventing cluster maintenance or autoscaling. When violations exceed the threshold, an automated Slack alert is dispatched.

    ## What you get
    - Continuous proactive detection of deadlocked PodDisruptionBudgets before maintenance windows.
    - Rapid visibility into unhealthy microservices preventing cluster node drains.
    - Contextual alerting detailing current vs. desired healthy pod counts.

    ## Who it's for
    - SREs and Infrastructure Engineers responsible for Kubernetes version upgrades and node lifecycle management.
    - Platform teams troubleshooting stuck cluster autoscaler downscales or maintenance drain timeouts.

    ## Why orchestrate this with Kestra
    - **Proactive Scheduling**: Detect disruption deadlocks days before scheduled maintenance instead of encountering stuck drains during a production upgrade window.
    - **Multi-Cluster Orchestration**: Run this identical workflow across dozens of clusters using dynamic loop iterations.
    - **Actionable Routing**: Route alerts directly to service owners via Slack, Microsoft Teams, or Webhooks.

    ## Prerequisites
    - Cluster RBAC permissions allowing `get` and `list` on `poddisruptionbudgets.policy`.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Set up the `SLACK_WEBHOOK` secret.
    3. Trigger the workflow manually to audit existing PDB definitions across your cluster.

    ## How to extend
    - Chain with automated pod restart checks or deployment scaling verifications.
    - Send metrics to Datadog or Prometheus via webhook tasks.

    ## Links
    - [Kubernetes Pod Disruption Budgets](https://kubernetes.io/docs/tasks/run-application/configure-pdb/)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  ee: false
  demo: false
