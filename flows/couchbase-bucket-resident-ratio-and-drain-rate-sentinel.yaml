    - [Couchbase Server Official Documentation and Architecture Guide](https://docs.couchbase.com/server/current/introduction/intro.html)
    - [Couchbase Prometheus Metrics and Exporter Reference](https://docs.couchbase.com/server/current/manage/manage-statistics/manage-statistics.html)
    - [Tuning Couchbase Memory Quotas and Sizing Guidelines](https://docs.couchbase.com/server/current/install/sizing-general.html)
