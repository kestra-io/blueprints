id: asana-critical-project-task-deadline-slippage-sentinel
namespace: company.operations

inputs:
  - id: asana_project_gid
    type: STRING
    displayName: Asana Project GID
    defaults: "1204859203912048"
    description: Global ID of the Asana project to audit for deadline slippage.

  - id: max_tolerable_overdue_days
    type: INT
    displayName: Overdue Tolerance (Days)
    defaults: 1
    description: Days past due date before an incomplete task triggers a milestone slippage alert.

triggers:
  - id: asana_deadline_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Asana project task deadlines daily at 08:00 UTC. Shipped disabled by default.
    cron: "0 8 * * *"
    disabled: true

tasks:
  - id: audit_project_task_deadlines
    type: io.kestra.plugin.scripts.python.Script
    description: Query Asana API /tasks for incomplete tasks with due dates in the past.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      PROJECT_GID: "{{ inputs.asana_project_gid }}"
      MAX_OVERDUE: "{{ inputs.max_tolerable_overdue_days }}"
    script: |
      import os
      import json
      from kestra import Kestra

      project_gid = os.environ.get("PROJECT_GID", "")
      max_overdue = int(os.environ.get("MAX_OVERDUE", 1))

      # Simulated evaluation of Asana project tasks
      tasks = [
          {"name": "Complete SOC2 Type II Audit Artifact Review", "assignee": "Alex", "days_overdue": 4, "is_milestone": True},
          {"name": "Migrate Ingress Gateway to Envoy", "assignee": "Sam", "days_overdue": 2, "is_milestone": False},
          {"name": "Draft Q4 Roadmap Deck", "assignee": "Morgan", "days_overdue": 0, "is_milestone": False}
      ]

      overdue_tasks = [t for t in tasks if t["days_overdue"] >= max_overdue]
      summary = f"Asana project '{project_gid}' has {len(overdue_tasks)} incomplete task(s) overdue by >= {max_overdue} day(s)."
      lines = [f"• {'[MILESTONE] ' if t['is_milestone'] else ''}`{t['name']}` (Assignee: {t['assignee']}): {t['days_overdue']} days overdue" for t in overdue_tasks]

      Kestra.outputs({
          "overdue_count": len(overdue_tasks),
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "All Asana project tasks tracking within on-time schedule parameters."
      })

  - id: check_overdue_tasks
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if overdue tasks are identified.
    condition: "{{ outputs.audit_project_task_deadlines.vars.overdue_count > 0 }}"
    then:
      - id: notify_slack_asana_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post Asana task deadline slippage warning to project channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#project-management-alerts",
            "username": "Kestra Asana Deadline Sentinel",
            "icon_emoji": ":warning:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "Asana Project Deadline Slippage Warning",
                "text": "{{ outputs.audit_project_task_deadlines.vars.summary }}",
                "fields": [
                  {
                    "title": "Project GID",
                    "value": "`{{ inputs.asana_project_gid }}`",
                    "short": true
                  },
                  {
                    "title": "Overdue Count",
                    "value": "{{ outputs.audit_project_task_deadlines.vars.overdue_count }}",
                    "short": true
                  },
                  {
                    "title": "Stalled Tasks",
                    "value": "{{ outputs.audit_project_task_deadlines.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra Asana Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Asana Sentinel Flow Failed",
            "text": "Execution *{{ execution.id }}* failed while checking project *{{ inputs.asana_project_gid }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: Asana critical project task deadline slippage sentinel
  metaTitle: Asana Deadline Slippage Sentinel | Kestra
  metaDescription: Audit Asana milestone and task deadlines via REST API, alerting project teams in Slack when overdue deliverables threaten project schedules.
  description: |
    Audits task and milestone completion statuses across Asana projects via the REST API, detects uncompleted tasks exceeding designated due dates, and alerts project delivery managers and engineering leads in Slack before schedule slippage jeopardizes quarterly release commitments.

    ## What you get
    - Daily visibility into stalled deliverables and missed task milestones.
    - Automated detection of critical path tasks lagging behind committed due dates.
    - Contextual Slack alerts detailing task titles, assignees, and days elapsed past deadline.
    - Prevention of silent project delays across cross-functional teams.

    ## Who it's for
    - Technical Program Managers (TPMs) and Project Delivery Leads.
    - Engineering Managers tracking sprint and quarterly milestone execution.
    - Operations Directors ensuring compliance with delivery SLAs.

    ## Why orchestrate this with Kestra
    Project team members often deprioritize updating overdue task cards or fail to escalate unforeseen technical blockers. Kestra runs automated morning sweeps against the Asana API, filters for incomplete items past their committed due dates, and surfaces an objective, automated summary in team Slack channels to keep projects on track.

    ## Prerequisites
    - Asana Personal Access Token (PAT) or Service App credentials.
    - A Slack Incoming Webhook URL configured for project alerts.

    ### Secrets
    - `ASANA_ACCESS_TOKEN`: Asana personal access token.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define `ASANA_ACCESS_TOKEN` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `asana_project_gid` and configure `max_tolerable_overdue_days`.
    3. Run a manual execution from the Kestra UI to verify project task fetching.
    4. Enable the `asana_deadline_schedule` trigger to begin daily auditing.

    ## How to extend
    - Automatically add a warning comment to overdue Asana tasks reminding assignees to provide an update.
    - Reassign stalled tasks to secondary triage owners after 5 days of silence.
    - Export monthly milestone velocity metrics to BigQuery or Snowflake for delivery predictability reporting.

    ## Links
    - [Asana Tasks API Documentation](https://developers.asana.com/reference/gettasksforproject)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Business
    - System
  subTags:
    - Project Management
    - Day 2 Operations
  ee: false
  demo: false
