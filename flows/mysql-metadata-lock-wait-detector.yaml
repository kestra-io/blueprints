id: mysql-metadata-lock-wait-detector
namespace: company.database

description: Monitors MySQL for blocking metadata locks and long-waiting DDL operations, alerting DBAs before connection pool saturation disrupts application traffic.

concurrency:
  limit: 1

inputs:
  - id: mysql_host
    type: STRING
    defaults: mysql-primary.internal
    description: Hostname or IP address of the MySQL database server.

  - id: mysql_port
    type: INT
    defaults: 3306
    description: MySQL communication port.

  - id: max_lock_wait_seconds_warning
    type: INT
    defaults: 15
    description: Threshold in seconds for metadata lock waits before triggering an alert.

  - id: slack_channel
    type: STRING
    defaults: "#mysql-dba-alerts"
    description: Slack channel destination for MySQL metadata lock alerts.

tasks:
  - id: inspect_metadata_locks
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    dependencies:
      - pymysql==1.1.1
      - kestra==2.0.0
    env:
      MYSQL_HOST: "{{ inputs.mysql_host }}"
      MYSQL_PORT: "{{ inputs.mysql_port }}"
      MYSQL_USER: "{{ secret('MYSQL_USER') }}"
      MYSQL_PASSWORD: "{{ secret('MYSQL_PASSWORD') }}"
      LOCK_WAIT_LIMIT: "{{ inputs.max_lock_wait_seconds_warning }}"
    script: |
      import os
      import sys
      import json
      import pymysql
      from kestra import Kestra

      host = os.getenv('MYSQL_HOST', '127.0.0.1')
      port = int(os.getenv('MYSQL_PORT', 3306))
      user = os.getenv('MYSQL_USER')
      password = os.getenv('MYSQL_PASSWORD')
      wait_limit = int(os.getenv('LOCK_WAIT_LIMIT', 15))

      try:
          conn = pymysql.connect(
              host=host,
              port=port,
              user=user,
              password=password,
              cursorclass=pymysql.cursors.DictCursor,
              connect_timeout=10
          )
          cursor = conn.cursor()

          query = """
          SELECT 
              waiting_thread_id,
              waiting_pid,
              waiting_account,
              waiting_lock_type,
              waiting_lock_duration,
              waiting_query,
              waiting_query_secs,
              blocking_thread_id,
              blocking_pid,
              blocking_account,
              blocking_lock_type,
              blocking_lock_duration
          FROM sys.schema_table_lock_waits
          WHERE waiting_query_secs >= %s;
          """
          try:
              cursor.execute(query, (wait_limit,))
              rows = cursor.fetchall()
          except Exception:
              fallback_query = """
              SELECT 
                  OBJECT_TYPE,
                  OBJECT_SCHEMA,
                  OBJECT_NAME,
                  LOCK_TYPE,
                  LOCK_DURATION,
                  LOCK_STATUS
              FROM performance_schema.metadata_locks
              WHERE LOCK_STATUS = 'PENDING';
              """
              cursor.execute(fallback_query)
              rows = cursor.fetchall()

          conn.close()

          flagged_locks = []
          for r in rows:
              flagged_locks.append({k: str(v) for k, v in r.items()})

          flagged_count = len(flagged_locks)
          has_blocking_locks = flagged_count > 0

          print(f"Blocked threads count: {flagged_count}")

          Kestra.outputs({
              'blocked_threads_count': flagged_count,
              'has_metadata_lock_contention': has_blocking_locks,
              'flagged_locks': flagged_locks[:5]
          })

          report = {
              'server': f"{host}:{port}",
              'blocked_count': flagged_count,
              'has_blocking_locks': has_blocking_locks,
              'lock_details': flagged_locks
          }

          with open('mysql_metadata_lock_report.json', 'w') as f:
              json.dump(report, f, indent=2)

      except Exception as e:
          print(f"Error inspecting MySQL metadata locks: {e}", file=sys.stderr)
          sys.exit(1)

    outputFiles:
      - mysql_metadata_lock_report.json

  - id: check_lock_contention
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_metadata_locks.vars.has_metadata_lock_contention }}"
    then:
      - id: notify_slack_dba
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "MySQL Metadata Lock Contention Alert: Detected {{ outputs.inspect_metadata_locks.vars.blocked_threads_count }} blocked operations waiting on metadata locks on `{{ inputs.mysql_host }}` (Threshold: >{{ inputs.max_lock_wait_seconds_warning }}s).\n• Remediation: Inspect long-running uncommitted transactions or DDL operations (`ALTER TABLE`) blocking schema lock acquisition."
          }
    else:
      - id: log_locks_nominal
        type: io.kestra.plugin.core.log.Log
        message: "No blocking metadata locks detected on {{ inputs.mysql_host }}."

triggers:
  - id: periodic_lock_probe
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true

outputs:
  - id: blocked_threads_count
    type: INT
    value: "{{ outputs.inspect_metadata_locks.vars.blocked_threads_count }}"
  - id: has_metadata_lock_contention
    type: BOOLEAN
    value: "{{ outputs.inspect_metadata_locks.vars.has_metadata_lock_contention }}"

extend:
  title: MySQL Metadata Lock Wait Detector
  metaTitle: MySQL Metadata Lock Wait Detector
  shortDescription: Monitors MySQL for blocking metadata locks and long-waiting DDL operations to prevent connection pool exhaustion.
  metaDescription: Monitors MySQL for blocking metadata locks and long-waiting DDL operations, alerting DBAs on Slack before connection pool saturation disrupts application traffic.
  description: |
    This blueprint acts as an automated lock contention sentinel for MySQL production databases. Scheduled every 5 minutes, it inspects metadata lock wait views in the `sys` or `performance_schema` catalog, detects queries waiting on table definition locks longer than safe thresholds, and alerts DBAs on Slack before blocked threads saturate connection pools.

    ## How it works

    1. **Recurring 5-Minute Probe**: The `periodic_lock_probe` trigger fires periodically.
    2. **Metadata Lock Inspection**: The `inspect_metadata_locks` task connects to MySQL via PyMySQL in Docker to query `sys.schema_table_lock_waits`.
    3. **Threshold Gate**: The `check_lock_contention` flowable task evaluates whether blocked threads were detected.
    4. **Slack Alert Dispatch**: When blocking metadata locks are found, `notify_slack_dba` dispatches an alert with details.

    ## Prerequisites

    - MySQL database user with permissions to query `sys.schema_table_lock_waits` and `performance_schema.metadata_locks`.
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ### Secrets

    - `MYSQL_USER`: MySQL authentication username.
    - `MYSQL_PASSWORD`: MySQL authentication password.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure secrets in Kestra.
    2. Import this flow YAML.
    3. Run manually or enable schedule.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.Script
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
