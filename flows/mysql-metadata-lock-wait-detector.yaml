id: mysql-metadata-lock-wait-detector
namespace: company.database

description: Monitors MySQL for blocking metadata locks and long-waiting DDL operations, alerting DBAs before connection pool saturation disrupts application traffic.

concurrency:
  limit: 1

inputs:
  - id: mysql_host
    type: STRING
    defaults: mysql-primary.internal
    description: Hostname or IP address of the MySQL database server.

  - id: mysql_port
    type: INT
    defaults: 3306
    description: MySQL communication port.

  - id: max_lock_wait_seconds_warning
    type: INT
    defaults: 15
    description: Threshold in seconds for metadata lock waits before triggering an alert.

  - id: slack_channel
    type: STRING
    defaults: "#mysql-dba-alerts"
    description: Slack channel destination for MySQL metadata lock alerts.

tasks:
  - id: inspect_metadata_locks
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install pymysql
    env:
      MYSQL_HOST: "{{ inputs.mysql_host }}"
      MYSQL_PORT: "{{ inputs.mysql_port }}"
      MYSQL_USER: "{{ secret('MYSQL_USER') }}"
      MYSQL_PASSWORD: "{{ secret('MYSQL_PASSWORD') }}"
      LOCK_WAIT_LIMIT: "{{ inputs.max_lock_wait_seconds_warning }}"
    script: |
      import os
      import json
      import pymysql
      from kestra import Kestra

      host = os.getenv('MYSQL_HOST', '127.0.0.1')
      port = int(os.getenv('MYSQL_PORT', 3306))
      user = os.getenv('MYSQL_USER')
      password = os.getenv('MYSQL_PASSWORD')
      wait_limit = int(os.getenv('LOCK_WAIT_LIMIT', 15))

      conn = pymysql.connect(
          host=host,
          port=port,
          user=user,
          password=password,
          cursorclass=pymysql.cursors.DictCursor,
          connect_timeout=10
      )
      cursor = conn.cursor()

      # Query metadata lock waits from sys schema or performance_schema
      query = """
      SELECT 
          waiting_thread_id,
          waiting_pid,
          waiting_account,
          waiting_lock_type,
          waiting_lock_duration,
          waiting_query,
          waiting_query_secs,
          blocking_thread_id,
          blocking_pid,
          blocking_account,
          blocking_lock_type,
          blocking_lock_duration
      FROM sys.schema_table_lock_waits
      WHERE waiting_query_secs >= %s;
      """
      try:
          cursor.execute(query, (wait_limit,))
          rows = cursor.fetchall()
      except Exception:
          # Fallback query if sys schema views are disabled
          fallback_query = """
          SELECT 
              OBJECT_TYPE,
              OBJECT_SCHEMA,
              OBJECT_NAME,
              LOCK_TYPE,
              LOCK_DURATION,
              LOCK_STATUS
          FROM performance_schema.metadata_locks
          WHERE LOCK_STATUS = 'PENDING';
          """
          cursor.execute(fallback_query)
          rows = cursor.fetchall()

      conn.close()

      flagged_locks = []
      for r in rows:
          flagged_locks.append({k: str(v) for k, v in r.items()})

      flagged_count = len(flagged_locks)
      has_blocking_locks = flagged_count > 0

      Kestra.outputs({
          'blocked_threads_count': flagged_count,
          'has_metadata_lock_contention': has_blocking_locks,
          'flagged_locks': flagged_locks[:5]
      })

      report = {
          'server': f"{host}:{port}",
          'blocked_count': flagged_count,
          'has_blocking_locks': has_blocking_locks,
          'lock_details': flagged_locks
      }

      with open('mysql_metadata_lock_report.json', 'w') as f:
          json.dump(report, f, indent=2)

    outputFiles:
      - mysql_metadata_lock_report.json

  - id: check_lock_contention
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_metadata_locks.vars.has_metadata_lock_contention }}"
    then:
      - id: notify_slack_dba
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "MySQL Metadata Lock Alert: {{ outputs.inspect_metadata_locks.vars.blocked_threads_count }} thread(s) waiting on metadata locks on `{{ inputs.mysql_host }}`.\n• Wait Threshold: {{ inputs.max_lock_wait_seconds_warning }} seconds\n• Remediation: Inspect blocking transaction thread ID and terminate uncommitted transactions blocking DDL migrations."
          }
    else:
      - id: log_locks_nominal
        type: io.kestra.plugin.core.log.Log
        message: "MySQL server {{ inputs.mysql_host }} has zero threads blocked on metadata lock waits."

  - id: export_db_manifest
    type: io.kestra.plugin.core.execution.Labels
    labels:
      mysql_host: "{{ inputs.mysql_host }}"
      blocked_threads: "{{ outputs.inspect_metadata_locks.vars.blocked_threads_count | string }}"
      concurrency_status: "{{ outputs.inspect_metadata_locks.vars.has_metadata_lock_contention ? 'BLOCKED_MDL' : 'NOMINAL' }}"

triggers:
  - id: periodic_mdl_probe
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"

extend:
  title: MySQL Metadata Lock Wait Detector
  metaTitle: MySQL Metadata Lock Wait Detector
  shortDescription: Monitors MySQL for blocking metadata locks and long-waiting DDL operations to prevent connection pool exhaustion.
  metaDescription: Monitors MySQL for blocking metadata lock waits and uncommitted DDL operations, alerting DBAs on Slack before connection pools saturate.
  description: |
    This blueprint acts as an automated concurrency sentinel for MySQL production database clusters. Scheduled every 5 minutes, it queries `sys.schema_table_lock_waits` and `performance_schema.metadata_locks` to identify queries blocked behind Metadata Locks (MDL), alerting database administrators on Slack before connection queues saturate `max_connections` and cause application-wide outages.

    ## How it works

    1. **Recurring 5-Minute Probe**: The `periodic_mdl_probe` trigger (`io.kestra.plugin.core.trigger.Schedule`) fires every 5 minutes.
    2. **Metadata Lock Query**: The `inspect_metadata_locks` task (`io.kestra.plugin.scripts.python.Script`) connects to MySQL via PyMySQL, queries lock wait relationships, and extracts blocking and waiting thread identifiers.
    3. **Condition Gate**: The `check_lock_contention` flowable task (`io.kestra.plugin.core.flow.If`) branches based on whether any threads are stuck waiting for metadata locks.
    4. **Slack Alert Dispatch**: When lock waits exceed the threshold, `notify_slack_dba` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches an urgent incident card with thread IDs.
    5. **Nominal Confirmation**: When no blocking locks exist, `log_locks_nominal` records confirmed health.
    6. **Manifest Export**: The `export_db_manifest` task tags the execution with searchable status labels.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Every 5 Minutes] --> B[inspect_metadata_locks: MySQL sys.schema_table_lock_waits]
        B --> C{Blocked Threads Found?}
        C -- Yes --> D[notify_slack_dba: Slack Webhook]
        C -- No --> E[log_locks_nominal: Log]
        D --> F[export_db_manifest: Execution Labels]
        E --> F
    ```

    ## Use cases

    - **Prevent Connection Pool Saturation**: Stop long-waiting `ALTER TABLE` migrations from queuing behind an uncommitted transaction and piling up hundreds of incoming user connections.
    - **Identify Blocking Long Transactions**: Pinpoint forgotten developer transactions or dangling analytics queries holding shared metadata locks.
    - **Database Migration Safety Monitoring**: Actively guard automated CI/CD schema migration rollouts against deadlock-inducing lock queues.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `mysql_host` | STRING | `mysql-primary.internal` | Hostname or IP address of the MySQL database server. |
    | `mysql_port` | INT | `3306` | MySQL communication port. |
    | `max_lock_wait_seconds_warning` | INT | `15` | Threshold in seconds for metadata lock waits before triggering an alert. |
    | `slack_channel` | STRING | `#mysql-dba-alerts` | Slack channel destination for MySQL metadata lock alerts. |

    ## Expected outputs

    - `{{ outputs.inspect_metadata_locks.vars.blocked_threads_count }}`: Number of threads blocked waiting on metadata locks.
    - `{{ outputs.inspect_metadata_locks.vars.has_metadata_lock_contention }}`: Boolean flag indicating active lock contention.
    - `{{ outputs.inspect_metadata_locks.vars.flagged_locks }}`: Sample of blocking and waiting thread records.
    - `{{ outputs.inspect_metadata_locks.outputFiles['mysql_metadata_lock_report.json'] }}`: Full JSON metadata lock diagnostic report.

    ## Prerequisites

    - MySQL database user with `PROCESS` and `SELECT` privileges on `sys` and `performance_schema` tables.
    - Incoming Webhook URL configured for your database administrator Slack channel.

    ### Secrets

    - `MYSQL_USER`: MySQL authentication username.
    - `MYSQL_PASSWORD`: MySQL authentication password.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure `MYSQL_USER`, `MYSQL_PASSWORD`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Specify your MySQL database hostname in `mysql_host`.
    4. Click **Execute** in the UI to perform an immediate metadata lock inspection.

    ## Common pitfalls and troubleshooting

    - **Performance Schema Setup**: Ensure `performance_schema` is enabled in `my.cnf` (`performance_schema = ON`); modern MySQL 5.7+ and 8.0+ enable this by default.
    - **Non-Privileged Accounts**: If the connecting user lacks `PROCESS` privileges, queries against `sys.schema_table_lock_waits` may return empty results even when contention exists.

    ## How to extend

    - Add automated termination of blocking threads via `KILL <blocking_pid>` upon human approval via Kestra Pause tasks.
    - Track lock wait history across read replicas to diagnose replication lag bottlenecks.
    - Route critical alerts to PagerDuty when blocked thread count breaches 20.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.Script
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - MySQL Metadata Locking: https://dev.mysql.com/doc/refman/8.0/en/metadata-locking.html
  tags:
    - Data
    - Infrastructure
  subTags:
    - Databases
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
