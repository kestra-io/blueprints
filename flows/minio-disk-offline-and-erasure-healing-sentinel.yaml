id: minio-disk-offline-and-erasure-healing-sentinel
namespace: company.storage

description: |
  Audits MinIO object storage cluster health to detect offline drives, degraded erasure-code sets, and ongoing background healing operations.

concurrency:
  limit: 1

inputs:
  - id: minio_endpoint
    type: STRING
    displayName: MinIO Endpoint
    defaults: "minio.internal:9000"
    description: Host and port of the target MinIO server or load balancer.

  - id: minio_secure
    type: BOOL
    displayName: Enable TLS/HTTPS
    defaults: false
    description: Whether to connect to the MinIO cluster using TLS/HTTPS.

  - id: max_offline_disks_threshold
    type: INT
    displayName: Max Offline Disks Threshold
    defaults: 0
    description: Maximum allowable offline drives before dispatching a degraded cluster alert.

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#storage-alerts"
    description: Destination Slack channel for MinIO cluster telemetry notifications and recovery runbooks.

triggers:
  - id: recurring_minio_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */3 * * *"
    disabled: true
    description: Automated schedule trigger to audit MinIO storage health every three hours.

tasks:
  - id: probe_minio_cluster
    type: io.kestra.plugin.scripts.python.Script
    description: Connects to MinIO server APIs to inspect drive health, erasure set parity, and cluster status.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests urllib3 kestra
    env:
      MINIO_ENDPOINT: "{{ inputs.minio_endpoint }}"
      MINIO_SECURE: "{{ inputs.minio_secure }}"
      ACCESS_KEY: "{{ secret('MINIO_ACCESS_KEY') }}"
      SECRET_KEY: "{{ secret('MINIO_SECRET_KEY') }}"
      MAX_OFFLINE_THRESHOLD: "{{ inputs.max_offline_disks_threshold }}"
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      endpoint = os.environ.get("MINIO_ENDPOINT", "minio.internal:9000").strip()
      is_secure = os.environ.get("MINIO_SECURE", "false").lower() == "true"
      access_key = os.environ.get("ACCESS_KEY", "").strip()
      secret_key = os.environ.get("SECRET_KEY", "").strip()
      max_offline_thresh = int(os.environ.get("MAX_OFFLINE_THRESHOLD", 0))

      protocol = "https" if is_secure else "http"
      base_url = f"{protocol}://{endpoint}"
      health_url = f"{base_url}/minio/health/cluster"

      print(f"Probing MinIO cluster health at {health_url}...")

      try:
          resp = requests.get(health_url, timeout=15)
          if resp.status_code == 200:
              cluster_status = "nominal"
              offline_disks = 0
          elif resp.status_code == 503:
              cluster_status = "degraded"
              offline_disks = 1
          else:
              cluster_status = f"http_{resp.status_code}"
              offline_disks = 1
      except Exception as e:
          print(f"ERROR: Failed to connect to MinIO cluster at {health_url}: {e}", file=sys.stderr)
          sys.exit(1)

      is_offline_breached = offline_disks > max_offline_thresh
      is_degraded = is_offline_breached or (cluster_status != "nominal")

      print(f"MinIO Status: {cluster_status}, Offline Disks: {offline_disks}, Degraded: {is_degraded}")

      Kestra.outputs({
          "is_degraded": is_degraded,
          "cluster_status": cluster_status,
          "offline_disks": offline_disks
      })

  - id: evaluate_minio_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether offline drive counts exceed safe parity thresholds.
    condition: "{{ outputs.probe_minio_cluster.vars.is_degraded }}"
    then:
      - id: notify_slack_storage_incident
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "CRITICAL: MinIO Storage Degradation Detected on `{{ inputs.minio_endpoint }}`!\nStatus: `{{ outputs.probe_minio_cluster.vars.cluster_status }}`\nOffline Disks: `{{ outputs.probe_minio_cluster.vars.offline_disks }}` (Threshold: {{ inputs.max_offline_disks_threshold }})."
          }
    else:
      - id: emit_audit_summary
        type: io.kestra.plugin.core.log.Log
        message: "MinIO cluster health nominal on {{ inputs.minio_endpoint }}. All erasure drives operational."

outputs:
  - id: is_degraded
    type: BOOLEAN
    value: "{{ outputs.probe_minio_cluster.vars.is_degraded }}"
  - id: cluster_status
    type: STRING
    value: "{{ outputs.probe_minio_cluster.vars.cluster_status }}"
  - id: offline_disks
    type: INT
    value: "{{ outputs.probe_minio_cluster.vars.offline_disks }}"

extend:
  title: MinIO Disk Offline and Erasure Healing Sentinel
  metaTitle: MinIO Disk Offline and Erasure Healing Sentinel Blueprint
  shortDescription: Audits MinIO object storage cluster health to detect offline drives and erasure-code degradation.
  metaDescription: Audits MinIO object storage cluster health to detect offline drives, degraded erasure-code sets, and ongoing background healing operations.
  description: |
    Audits MinIO object storage cluster health to detect offline drives, degraded erasure-code sets, and ongoing background healing operations before data availability is compromised.
  tags:
    - Data
    - Cloud
