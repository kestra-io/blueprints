id: github-environment-deployment-rejection-sentinel
namespace: company.security

inputs:
  - id: github_org
    type: STRING
    description: GitHub organization name.
  - id: github_repo
    type: STRING
    description: GitHub repository name.
  - id: environment_name
    type: STRING
    defaults: "production"
    description: GitHub deployment environment name.

tasks:
  - id: audit_deployments
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - |
        curl -s -H "Authorization: Bearer {{ secret('GITHUB_TOKEN') }}"           "https://api.github.com/repos/{{ inputs.github_org }}/{{ inputs.github_repo }}/deployments?environment={{ inputs.environment_name }}&per_page=10" > /tmp/deployments.json
        
        RECENT_DEPLOYMENT_ID=$(jq '.[0].id // empty' /tmp/deployments.json)
        
        STATUS="unknown"
        if [ -n "$RECENT_DEPLOYMENT_ID" ]; then
          curl -s -H "Authorization: Bearer {{ secret('GITHUB_TOKEN') }}"             "https://api.github.com/repos/{{ inputs.github_org }}/{{ inputs.github_repo }}/deployments/$RECENT_DEPLOYMENT_ID/statuses" > /tmp/statuses.json
          
          STATUS=$(jq -r '.[0].state // "unknown"' /tmp/statuses.json)
        fi
        
        echo "::set-output name=deployment_status::$STATUS::"

  - id: evaluate_deployment_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_deployments.vars.deployment_status == 'failure' or outputs.audit_deployments.vars.deployment_status == 'error' }}"
    then:
      - id: notify_devops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#production-deployments",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 GitHub Environment Deployment Failure Alert",
                "text": "Latest deployment to `{{ inputs.environment_name }}` environment on `{{ inputs.github_org }}/{{ inputs.github_repo }}` reported status *{{ outputs.audit_deployments.vars.deployment_status }}*. Impact: Production deployment failed or was rejected by deployment branch protection rules, stalling production releases.",
                "footer": "Kestra CI/CD Sentinel • GitHub Deployments"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#production-deployments",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ GitHub Deployment Sentinel Execution Failed",
            "text": "The GitHub deployment audit query encountered an execution error. Please verify repository and token credentials.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      github_org: replace-with-your-github-org
      github_repo: replace-with-your-github-repo

extend:
  metaDescription: "Audits GitHub deployment statuses across target environments to detect failed or rejected production software releases."
  metaTitle: GitHub Environment Deployment Status and Release Failure Sentinel with Kestra
  title: GitHub Environment Deployment Status and Release Failure Sentinel
  shortDescription: Audits GitHub deployment statuses across target environments to detect failed or rejected production software releases.
  description: |
    ## How it works
    This workflow connects to the GitHub REST API (`/repos/{owner}/{repo}/deployments`) to query recent deployments targeting mission-critical environments (such as `production` or `staging`). It inspects the latest deployment status (`success`, `failure`, `error`). When deployments fail smoke tests, fail required approval gates, or crash during rollback procedures, an immediate incident alert is routed to the release channel on Slack.

    ## What you get
    - Real-time detection of failed production deployments.
    - Prevents stalled releases from going unnoticed by engineering leads.
    - Immediate link to offending deployment IDs and environment targets.

    ## Who it's for
    - Release Managers, DevOps Engineers, and SREs overseeing automated CI/CD deployments.
    - Software Developers tracking production rollouts after merging pull requests.

    ## Why orchestrate this with Kestra
    - **Reliable Automation**: Continuously audit deployment health without standing up custom webhook servers.
    - **Multi-Environment Tracking**: Monitor across staging, canary, and production environments seamlessly.
    - **Fast Rollback Orchestration**: Can be chained directly to automated rollback workflows upon deployment failure.

    ## Prerequisites
    - GitHub token with `repo:status` and `repo_deployment` permissions.
    - Secrets `GITHUB_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure target repository and environment name.
    3. Run the workflow to inspect latest deployment outcomes.

    ## How to extend
    - Query deployment description and commit SHA to correlate with git changes.
    - Automatically rollback to the previous successful deployment SHA.

    ## Links
    - [GitHub Deployments API Documentation](https://docs.github.com/en/rest/deployments/deployments)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Cloud
    - Business
  subTags:
    - CI/CD & Deployment
    - Infrastructure Automation
  ee: false
  verified: false
  demo: false
