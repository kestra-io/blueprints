id: ldap-stale-account-lockout-guard
namespace: company.team

description: |
  Find LDAP accounts whose shadowExpire date has passed but that still carry no lock attribute, then lock each one and re-search to prove the lock landed.

inputs:
  - id: dry_run
    type: BOOL
    defaults: true
    description: When true the flow only reports expired unlocked accounts and never writes to the directory.
  - id: auto_remediate
    type: BOOL
    defaults: false
    description: When true (and dry_run is false) the flow builds an LDIF modify and locks the accounts after approval.
  - id: ldap_host
    type: STRING
    defaults: ldap.example.com
    description: Hostname of the LDAP server.
  - id: ldap_port
    type: INT
    defaults: 389
    description: LDAP port.
  - id: bind_dn
    type: STRING
    defaults: cn=admin,dc=example,dc=org
    description: Bind DN with permission to search and modify accounts.
  - id: base_dn
    type: STRING
    defaults: dc=example,dc=org
    description: Base DN to search under.
  - id: ldap_password
    type: STRING
    defaults: "{{ secret('LDAP_PASSWORD') }}"
    description: Bind password. Defaults to the LDAP_PASSWORD secret.
  - id: lock_attribute
    type: STRING
    defaults: pwdAccountLockedTime
    description: Attribute that marks an account as locked. pwdAccountLockedTime for the OpenLDAP ppolicy overlay, nsAccountLock for 389 Directory Server.
  - id: lock_value
    type: STRING
    defaults: 000001010000Z
    description: Value written to the lock attribute. 000001010000Z is the ppolicy permanent-lock sentinel.
  - id: inactive_grace_days
    type: INT
    defaults: 0
    description: Only lock accounts whose expiry passed at least this many days ago.

tasks:
  - id: detect
    type: io.kestra.plugin.ldap.Search
    description: Search for shadowAccount entries that have a shadowExpire value and no lock attribute. The date threshold is applied in the next step because shadowExpire has no ordering rule for a server-side range filter.
    hostname: "{{ inputs.ldap_host }}"
    port: "{{ inputs.ldap_port }}"
    userDn: "{{ inputs.bind_dn }}"
    password: "{{ inputs.ldap_password }}"
    baseDn: "{{ inputs.base_dn }}"
    filter: "(&(objectClass=shadowAccount)(shadowExpire=*)(!({{ inputs.lock_attribute }}=*)))"
    attributes:
      - uid
      - shadowExpire

  - id: parse_detect
    type: io.kestra.plugin.scripts.python.Script
    description: Read the candidate entries, keep the ones whose shadowExpire is a day in the past (minus the grace window) then build an LDIF modify that locks each target.
    containerImage: python:3.12-slim
    inputFiles:
      candidates.ldif: "{{ outputs.detect.uri }}"
    outputFiles:
      - remediate.ldif
    script: |
      import time, json, re, base64
      GRACE = {{ inputs.inactive_grace_days }}
      LOCK_ATTR = "{{ inputs.lock_attribute }}"
      LOCK_VALUE = "{{ inputs.lock_value }}"
      today = int(time.time() // 86400)
      cutoff = today - GRACE
      raw = open("candidates.ldif", "r", encoding="utf-8", errors="replace").read()
      unfolded = re.sub(r"\n[ ]", "", raw)
      targets = []
      dn = None
      sx = None
      def flush(dn, sx):
          if dn is None or sx is None:
              return
          try:
              v = int(sx)
          except ValueError:
              return
          if 1 <= v <= cutoff:
              targets.append(dn)
      for line in unfolded.splitlines():
          if not line.strip():
              flush(dn, sx)
              dn, sx = None, None
              continue
          if line.startswith("#") or ":" not in line:
              continue
          key, _, val = line.partition(":")
          key = key.strip().lower()
          val = val.lstrip()
          if val.startswith(":"):
              val = base64.b64decode(val[1:].strip()).decode("utf-8", "replace")
          if key == "dn":
              dn = val
          elif key == "shadowexpire":
              sx = val
      flush(dn, sx)
      lines = []
      for d in targets:
          lines.append("dn: " + d)
          lines.append("changetype: modify")
          lines.append("replace: " + LOCK_ATTR)
          lines.append(LOCK_ATTR + ": " + LOCK_VALUE)
          lines.append("-")
          lines.append("")
      open("remediate.ldif", "w", encoding="utf-8").write("\n".join(lines) + "\n")
      count = len(targets)
      print("DETECT today={} cutoff={} grace={} candidates_parsed targets={}".format(today, cutoff, GRACE, count))
      for d in targets:
          print("TARGET " + d)
      out = {"count": count, "has_targets": "yes" if count else "no", "target_dns": ", ".join(targets)}
      print("::" + json.dumps({"outputs": out}) + "::")

  - id: findings_alert
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.parse_detect.vars.has_targets == 'yes' }}"
    then:
      - id: log_findings
        type: io.kestra.plugin.core.log.Log
        message: "Expired unlocked accounts: {{ outputs.parse_detect.vars.count }}. DNs: {{ outputs.parse_detect.vars.target_dns }}."
      - id: notify_findings
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post the detection result to Slack so an operator sees stale accounts even on a read-only run.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "LDAP stale account guard found {{ outputs.parse_detect.vars.count }} expired account(s) still unlocked under {{ inputs.base_dn }}. DNs: {{ outputs.parse_detect.vars.target_dns }}. dry_run={{ inputs.dry_run }} auto_remediate={{ inputs.auto_remediate }}."
          }

  - id: remediate_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.auto_remediate and not inputs.dry_run and outputs.parse_detect.vars.has_targets == 'yes' }}"
    then:
      - id: approval_hold
        type: io.kestra.plugin.core.flow.Pause
        description: >-
          Locking accounts can log people out, so the write waits for a human. Resume with approved set to true to apply the lock. Set it false to cancel.
        onResume:
          - id: approved
            type: BOOL
            defaults: false
            description: Set true to lock the accounts listed by the detection step.
      - id: apply_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.approval_hold.onResume.approved ?? false }}"
        then:
          - id: remediate
            type: io.kestra.plugin.ldap.Modify
            description: Apply the LDIF modify that sets the lock attribute on every target DN. The plugin logs a rejected record and keeps going, so the re-search below is the real gate.
            hostname: "{{ inputs.ldap_host }}"
            port: "{{ inputs.ldap_port }}"
            userDn: "{{ inputs.bind_dn }}"
            password: "{{ inputs.ldap_password }}"
            inputs:
              - "{{ outputs.parse_detect.outputFiles['remediate.ldif'] }}"
          - id: verify
            type: io.kestra.plugin.ldap.Search
            description: Re-run the detection search after the modify.
            hostname: "{{ inputs.ldap_host }}"
            port: "{{ inputs.ldap_port }}"
            userDn: "{{ inputs.bind_dn }}"
            password: "{{ inputs.ldap_password }}"
            baseDn: "{{ inputs.base_dn }}"
            filter: "(&(objectClass=shadowAccount)(shadowExpire=*)(!({{ inputs.lock_attribute }}=*)))"
            attributes:
              - uid
              - shadowExpire
          - id: parse_verify
            type: io.kestra.plugin.scripts.python.Script
            description: Apply the same past-expiry test to the re-search output. Any account still here is still unlocked.
            containerImage: python:3.12-slim
            inputFiles:
              candidates.ldif: "{{ outputs.verify.uri }}"
            outputFiles:
              - remediate.ldif
            script: |
              import time, json, re, base64
              GRACE = {{ inputs.inactive_grace_days }}
              LOCK_ATTR = "{{ inputs.lock_attribute }}"
              LOCK_VALUE = "{{ inputs.lock_value }}"
              today = int(time.time() // 86400)
              cutoff = today - GRACE
              raw = open("candidates.ldif", "r", encoding="utf-8", errors="replace").read()
              unfolded = re.sub(r"\n[ ]", "", raw)
              targets = []
              dn = None
              sx = None
              def flush(dn, sx):
                  if dn is None or sx is None:
                      return
                  try:
                      v = int(sx)
                  except ValueError:
                      return
                  if 1 <= v <= cutoff:
                      targets.append(dn)
              for line in unfolded.splitlines():
                  if not line.strip():
                      flush(dn, sx)
                      dn, sx = None, None
                      continue
                  if line.startswith("#") or ":" not in line:
                      continue
                  key, _, val = line.partition(":")
                  key = key.strip().lower()
                  val = val.lstrip()
                  if val.startswith(":"):
                      val = base64.b64decode(val[1:].strip()).decode("utf-8", "replace")
                  if key == "dn":
                      dn = val
                  elif key == "shadowexpire":
                      sx = val
              flush(dn, sx)
              lines = []
              for d in targets:
                  lines.append("dn: " + d)
                  lines.append("changetype: modify")
                  lines.append("replace: " + LOCK_ATTR)
                  lines.append(LOCK_ATTR + ": " + LOCK_VALUE)
                  lines.append("-")
                  lines.append("")
              open("remediate.ldif", "w", encoding="utf-8").write("\n".join(lines) + "\n")
              count = len(targets)
              print("VERIFY today={} cutoff={} grace={} still_unlocked={}".format(today, cutoff, GRACE, count))
              for d in targets:
                  print("STILL_UNLOCKED " + d)
              out = {"count": count, "has_targets": "yes" if count else "no", "target_dns": ", ".join(targets)}
              print("::" + json.dumps({"outputs": out}) + "::")
          - id: assert_locked
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.parse_verify.vars.has_targets == 'yes' }}"
            then:
              - id: still_unlocked
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: "Remediation did not lock every target. Still unlocked: {{ outputs.parse_verify.vars.target_dns }}."

triggers:
  - id: daily_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Daily audit. Disabled by default and pinned to safe mode so enabling it never writes without a deliberate change.
    cron: "0 6 * * *"
    disabled: true
    inputs:
      dry_run: true
      auto_remediate: false

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert on any failure, including a run that failed because an account was still unlocked after remediation.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "LDAP stale account lockout guard FAILED (execution {{ execution.id }}). Some expired accounts may still be unlocked. Check the directory and the run logs."
      }

extend:
  title: Lock Expired LDAP Accounts That Slipped Through Offboarding
  shortDescription: Find LDAP accounts whose shadowExpire date has passed but that are still unlocked, lock them with an LDIF modify then re-search to confirm.
  metaTitle: LDAP Stale Account Lockout Guard with Kestra
  metaDescription: Find expired LDAP accounts that are still unlocked, lock them with an LDIF modify, then re-search to confirm the lock before the run passes.
  description: |
    An account whose `shadowExpire` date has passed is meant to be dead, but expiry alone does not lock it. If the directory has a password policy, the account stays usable until something sets the lock attribute. These are the accounts that outlive an offboarding: expired on paper, still able to bind in practice. This blueprint finds them and locks them.

    ## How it works

    1. `detect` (`io.kestra.plugin.ldap.Search`) searches under the base DN for `shadowAccount` entries that have a `shadowExpire` value and do not yet carry the lock attribute. The search writes the matching entries to an LDIF file.
    2. `parse_detect` (`io.kestra.plugin.scripts.python.Script`) reads that file and keeps only the entries whose `shadowExpire` day is in the past, minus an optional grace window. The date test runs here on purpose: `shadowExpire` has an equality rule but no ordering rule, so a server-side `shadowExpire<=N` filter matches nothing. The step writes an LDIF `changetype: modify` record for each target and reports the count.
    3. `findings_alert` (`io.kestra.plugin.core.flow.If`) posts the count and the DNs to Slack whenever at least one stale account is found, so a read-only run still surfaces the problem.
    4. `remediate_gate` runs only when `auto_remediate` is true, `dry_run` is false and there is something to fix. It pauses for human approval, then `remediate` (`io.kestra.plugin.ldap.Modify`) applies the LDIF and sets the lock attribute on each target.
    5. `verify` (`io.kestra.plugin.ldap.Search`) runs the same search again and `parse_verify` re-applies the past-expiry test. If any target is still unlocked, `assert_locked` fails the run so the gap cannot pass silently. The `errors` block then alerts Slack.

    ## What you get

    - A list of accounts that are expired by `shadowExpire` but still unlocked, the ones most likely to be a forgotten offboarding.
    - A read-only default: the flow reports and never writes unless two inputs are flipped and a human approves.
    - A lock applied through a plain LDIF modify, so it works with whatever attribute your schema uses for lockout.
    - A re-search that fails the run when a lock did not land, because the Modify task logs a rejected record rather than failing on it.
    - A Slack alert on detection and a second alert on failure.

    ## Who it's for

    - IT and identity teams running OpenLDAP or 389 Directory Server who track account expiry with `shadowExpire`.
    - Security teams that need expired accounts locked, not just flagged, with proof the lock took.
    - Platform teams who want a scheduled audit that is safe to leave on because it defaults to read-only.

    ## Why orchestrate this with Kestra

    Locking stale accounts by hand means an `ldapsearch`, eyeballing dates, writing LDIF then running `ldapmodify`, with nothing checking the result. Kestra turns that into one audited flow: the detection, the date logic, the approval, the write and the re-check all run in order with logs and a Slack trail. The read-only default and the approval pause make it safe to schedule.

    ## Tested end to end

    Run against OpenLDAP (osixia/openldap) with the ppolicy overlay loaded. Five seeded accounts: two expired and unlocked, one expired and already locked, one with a future expiry, one with no expiry. Detection found exactly the two expired unlocked accounts. A `dry_run` pass reported them and left the directory untouched (confirmed with `ldapsearch`). A remediation pass locked both and the re-search returned zero. The failure path was exercised with a bad bind password, which fired the `errors` block.

    ## Prerequisites

    An LDAP directory reachable from Kestra, with a bind account allowed to search and modify entries plus a lock attribute your schema accepts (`pwdAccountLockedTime` with the OpenLDAP ppolicy overlay or `nsAccountLock` on 389 Directory Server).

    ### Secrets

    - `LDAP_PASSWORD`: bind password for the account named in `bind_dn`.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the findings and failure alerts.

    ### Inputs

    - `dry_run` (default true) and `auto_remediate` (default false): both guard every write.
    - `ldap_host`, `ldap_port`, `bind_dn`, `base_dn`: connection and search scope.
    - `lock_attribute` (default `pwdAccountLockedTime`) and `lock_value` (default `000001010000Z`): what marks an account locked.
    - `inactive_grace_days` (default 0): lock only accounts whose expiry passed at least this many days ago.

    ## Quick start

    1. Add the `LDAP_PASSWORD` and `SLACK_WEBHOOK_URL` secrets to your namespace.
    2. Run with the defaults. The flow reports expired unlocked accounts and writes nothing.
    3. When the report looks right, run with `dry_run` false and `auto_remediate` true, then approve the pause to lock the accounts.
    4. Enable the schedule once you trust the report. It stays in read-only mode until you change its inputs.

    ## How to extend

    - Point `base_dn` at a specific OU to scope the audit to one part of the tree.
    - Set `inactive_grace_days` to leave freshly expired accounts alone for a few days.
    - Swap `lock_attribute` and `lock_value` for the convention your directory uses, for example `nsAccountLock` set to `true`.
    - Add a step that moves locked accounts into an archive OU after a retention period.

    ## Links

    - LDAP plugin docs: https://kestra.io/plugins/plugin-ldap
    - This blueprint was created by [zkasuran](https://github.com/zkasuran).
  tags:
    - Infrastructure
    - System
  subTags:
    - Security & Compliance
    - Day 2 Operations
  ee: false
  demo: false
