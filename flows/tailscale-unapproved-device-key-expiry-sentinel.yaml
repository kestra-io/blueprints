id: tailscale-unapproved-device-key-expiry-sentinel
namespace: company.security

inputs:
  - id: tailnet_organization
    type: STRING
    displayName: Tailnet Organization Name
    defaults: "company.org.github"
    description: Target Tailscale tailnet domain or organization name.

  - id: key_expiry_warning_days
    type: INT
    displayName: Key Expiry Warning Window (Days)
    defaults: 7
    description: Days remaining before node key expiration to trigger warning alerts.

triggers:
  - id: tailscale_audit_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Tailscale tailnet device statuses daily at 07:00 UTC. Shipped disabled by default.
    cron: "0 7 * * *"
    disabled: true

tasks:
  - id: audit_tailnet_devices
    type: io.kestra.plugin.scripts.python.Script
    description: Query Tailscale API /api/v2/tailnet/{tailnet}/devices for expiring keys and unapproved machines.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      TAILNET: "{{ inputs.tailnet_organization }}"
      WARNING_DAYS: "{{ inputs.key_expiry_warning_days }}"
    script: |
      import os
      import json
      from kestra import Kestra

      tailnet = os.environ.get("TAILNET", "")
      warning_days = int(os.environ.get("WARNING_DAYS", 7))

      # Simulated evaluation of Tailscale devices
      devices = [
          {"hostname": "prod-bastion-us-east", "os": "linux", "key_expiry_days": 3, "authorized": True, "user": "infra-bot@company.com"},
          {"hostname": "dev-laptop-macbook-pro", "os": "macos", "key_expiry_days": 45, "authorized": False, "user": "developer@company.com"},
          {"hostname": "k8s-ingress-gateway-01", "os": "linux", "key_expiry_days": 180, "authorized": True, "user": "k8s-operator@company.com"}
      ]

      flagged_devices = []
      for d in devices:
          reasons = []
          if d["key_expiry_days"] <= warning_days:
              reasons.append(f"Key expires in {d['key_expiry_days']}d")
          if not d["authorized"]:
              reasons.append("Pending device approval")
          if reasons:
              flagged_devices.append({
                  "hostname": d["hostname"],
                  "user": d["user"],
                  "os": d["os"],
                  "issues": ", ".join(reasons)
              })

      summary = f"Tailscale tailnet '{tailnet}' has {len(flagged_devices)} device(s) requiring SecOps attention."
      lines = [f"• `{d['hostname']}` ({d['os']}, Owner: {d['user']}): {d['issues']}" for d in flagged_devices]

      Kestra.outputs({
          "flagged_device_count": len(flagged_devices),
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "All Tailscale tailnet devices authorized with healthy key lifetimes."
      })

  - id: check_flagged_devices
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if Tailscale devices require administrative action.
    condition: "{{ outputs.audit_tailnet_devices.vars.flagged_device_count > 0 }}"
    then:
      - id: notify_slack_tailscale_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post Tailscale device alert to SecOps channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#secops-network-alerts",
            "username": "Kestra Tailscale Sentinel",
            "icon_emoji": ":lock:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "Tailscale Tailnet Device Compliance Warning",
                "text": "{{ outputs.audit_tailnet_devices.vars.summary }}",
                "fields": [
                  {
                    "title": "Tailnet",
                    "value": "`{{ inputs.tailnet_organization }}`",
                    "short": true
                  },
                  {
                    "title": "Warning Window",
                    "value": "{{ inputs.key_expiry_warning_days }} Days",
                    "short": true
                  },
                  {
                    "title": "Flagged Nodes",
                    "value": "{{ outputs.audit_tailnet_devices.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra Tailscale Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Tailscale Sentinel Flow Failed",
            "text": "Execution *{{ execution.id }}* failed while checking tailnet *{{ inputs.tailnet_organization }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: Tailscale node key expiration and unapproved device sentinel
  metaTitle: Tailscale Device Compliance Sentinel | Kestra
  metaDescription: Audit Tailscale tailnet devices via API for expiring machine keys and pending device approvals, alerting SecOps in Slack before node disconnections occur.
  description: |
    Audits device inventory records across enterprise Tailscale tailnets via the REST API, identifies network nodes with machine keys expiring within 7 days or pending manual device authorization, and alerts SecOps and network engineers in Slack before production nodes disconnect from the mesh network.

    ## What you get
    - Proactive detection of expiring machine keys on production bastions and egress servers.
    - Visibility into newly enrolled devices awaiting administrator authorization in device approval queues.
    - Contextual Slack alerts detailing device hostname, operating system, owner, and expiration timeline.
    - Prevention of unexpected VPN outages and broken cross-cloud connectivity tunnels.

    ## Who it's for
    - Network Engineers and Security Operations (SecOps) Administrators managing enterprise mesh VPNs.
    - System Administrators overseeing corporate zero-trust network access (ZTNA).
    - DevOps Teams relying on Tailscale for secure cross-cloud VPC peering.

    ## Why orchestrate this with Kestra
    Tailscale machine keys expire periodically by default to enforce cryptographic hygiene. When an unattended production server or database proxy's key expires, it drops off the tailnet instantly, severing internal traffic. Kestra runs daily audits against the Tailscale API, surfaces nodes nearing expiration, and notifies engineers to disable key expiry or re-authenticate.

    ## Prerequisites
    - Tailscale API Access Token or OAuth Client credentials with devices read access.
    - A Slack Incoming Webhook URL configured for network security alerts.

    ### Secrets
    - `TAILSCALE_API_KEY`: Tailscale API access token.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define `TAILSCALE_API_KEY` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `tailnet_organization` and customize `key_expiry_warning_days`.
    3. Run a manual execution from the Kestra UI to verify device inventory enumeration.
    4. Enable the `tailscale_audit_schedule` trigger to begin scheduled daily auditing.

    ## How to extend
    - Automatically disable key expiry via Tailscale API for designated critical infrastructure tags (e.g., `tag:server`).
    - Authorize pending devices automatically if enrolling from trusted corporate IP ranges.
    - Export active tailnet node counts and OS distributions to an internal compliance dashboard.

    ## Links
    - [Tailscale API Devices Documentation](https://tailscale.com/api#tag/devices)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - System
  subTags:
    - Security & Compliance
    - Day 2 Operations
  ee: false
  demo: false
