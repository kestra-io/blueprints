id: redis-blocked-clients-headroom-sentinel
namespace: company.caching

inputs:
  - id: redis_host
    type: STRING
    defaults: "redis.internal"
    description: Hostname of the Redis server.
  - id: redis_port
    type: INT
    defaults: 6379
    description: Port of the Redis server.
  - id: max_blocked_clients
    type: INT
    defaults: 50
    description: "Maximum allowable blocked client connections before alerting (default 50)."

tasks:
  - id: inspect_blocked_clients
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query Redis client stats
        redis-cli -h "{{ inputs.redis_host }}" -p {{ inputs.redis_port }} -a "{{ secret('REDIS_PASSWORD') }}" INFO clients > /tmp/redis_clients.txt

        python3 -c "
        try:
            with open('/tmp/redis_clients.txt') as f:
                lines = f.readlines()
            blocked = 0
            connected = 0
            for line in lines:
                if line.startswith('blocked_clients:'):
                    blocked = int(line.strip().split(':')[1])
                elif line.startswith('connected_clients:'):
                    connected = int(line.strip().split(':')[1])
            is_breach = 1 if blocked > {{ inputs.max_blocked_clients }} else 0
            print(f'{is_breach}|{blocked}|{connected}')
        except Exception:
            print('0|0|0')
        " > /tmp/redis_summary.txt

        IS_BREACH=$(cut -d '|' -f 1 /tmp/redis_summary.txt)
        BLOCKED_COUNT=$(cut -d '|' -f 2 /tmp/redis_summary.txt)
        CONNECTED_COUNT=$(cut -d '|' -f 3 /tmp/redis_summary.txt)
        
        echo "::set-output name=is_breach::${IS_BREACH:-0}::"
        echo "::set-output name=blocked_count::$BLOCKED_COUNT::"
        echo "::set-output name=connected_count::$CONNECTED_COUNT::"

  - id: evaluate_client_deadlock
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_blocked_clients.vars.is_breach | int == 1 }}"
    then:
      - id: notify_caching_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#caching-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Redis Blocked Clients Spike Warning",
                "text": "Redis instance {{ inputs.redis_host }} has {{ outputs.inspect_blocked_clients.vars.blocked_count }} blocked client connections (out of {{ outputs.inspect_blocked_clients.vars.connected_count }} connected clients). Blocking commands like BLPOP, BRPOP, or XREADGROUP are stalling.",
                "footer": "Kestra Caching Sentinel • Redis"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#caching-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Redis Sentinel Failure",
            "text": "Failed to communicate with Redis instance at {{ inputs.redis_host }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true

extend:
  ee: false
  demo: false
  title: Redis Blocked Client Connections and Blocking Call Sentinel
  shortDescription: Audits Redis server client connections for blocked calls to detect task queue stalls and worker deadlocks.
  description: |
    ## How it works
    This workflow connects to a Redis instance via `redis-cli` and queries `INFO clients` to audit the `blocked_clients` metric. In Redis-backed job queues (such as Celery, BullMQ, or Sidekiq) and streaming consumer groups, worker threads execute blocking commands (`BLPOP`, `BRPOP`, `BZPOPMIN`, `XREAD BLOCK`). When upstream publishers fail or connection pools leak idle blocked threads without timeouts, blocked client connections surge, tying up client file descriptors and exhaustion memory. This sentinel monitors blocked connections and dispatches Slack notifications before threadpools saturate.

    ## What you get
    - Continuous surveillance of Redis blocked client connections.
    - Early detection of stalled job queues and consumer starvation.
    - Automated Slack incident notifications detailing blocked and total connected clients.

    ## Who it's for
    - Backend Engineers maintaining distributed job queues and task workers.
    - Database Administrators operating high-throughput Redis instances.
    - SREs ensuring sub-millisecond caching tier responsiveness.

    ## Why orchestrate this with Kestra
    - **High-Frequency Health Checks**: Executes lightweight cluster audits every 5 minutes.
    - **Native Command Execution**: Queries standard Redis interfaces securely with encrypted password injection.
    - **Incident Orchestration**: Links Redis connection health directly to microservice scaling workflows.

    ## Prerequisites
    - Redis instance accessible over network (`6379`).
    - Redis CLI tool installed in the runner container.
    - Secrets `REDIS_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Add `REDIS_PASSWORD` and `SLACK_WEBHOOK` secrets.
    3. Specify `redis_host`, `redis_port`, and `max_blocked_clients`.
    4. Enable the schedule trigger for continuous blocked client monitoring.

    ## How to extend
    - Query `CLIENT LIST` to identify the exact client IP addresses and blocking command names.
    - Trigger an automated kill of idle blocked connections via `CLIENT KILL`.
    - Route critical alerts to PagerDuty or Opsgenie.

    ## Links
    - [Redis INFO Clients Documentation](https://redis.io/docs/latest/commands/info/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
