id: quickwit-source-checkpoint-reset-recovery-guard
namespace: company.team

description: |
  Detect a Quickwit Kafka source that is enabled but no longer produces documents newer
  than the freshness watermark. Read the index checkpoint and source state, pause for
  approval, reset the checkpoint, resume the source and prove that both the checkpoint
  and search freshness advanced.

inputs:
  - id: quickwit_url
    type: STRING
    displayName: Quickwit URL
    description: Quickwit REST API base URL reachable by the Kestra worker.
    defaults: "http://localhost:7280"

  - id: index_id
    type: STRING
    displayName: Index ID
    description: One Quickwit index whose Kafka source is being guarded.
    defaults: "logs"

  - id: source_id
    type: STRING
    displayName: Source ID
    description: The named Kafka source attached to index_id. The flow never selects a source implicitly.
    defaults: "source"

  - id: freshness_minutes
    type: INT
    displayName: Freshness budget in minutes
    description: Documents newer than now minus this many minutes must be searchable.
    defaults: 5

  - id: wait_seconds
    type: INT
    displayName: Recovery wait in seconds
    description: Bounded time to let the resumed source consume after the reset.
    defaults: 20

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    description: Must be true together with dry_run false to reach the approval gate.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Safe mode. No Quickwit write runs while this is true.
    defaults: true

tasks:
  - id: list_indexes
    type: io.kestra.plugin.quickwit.index.List
    description: Lists indexes so a missing target is distinguished from a healthy target.
    allowFailure: true
    url: "{{ inputs.quickwit_url }}"

  - id: read_index
    type: io.kestra.plugin.quickwit.index.Get
    description: Reads the target source list and source checkpoint before classification.
    allowFailure: true
    url: "{{ inputs.quickwit_url }}"
    index: "{{ inputs.index_id }}"

  - id: read_index_state
    type: io.kestra.plugin.core.http.Request
    description: Reads the raw Quickwit metadata because the typed index plugin intentionally omits the source enabled flag.
    allowFailure: true
    uri: "{{ inputs.quickwit_url }}/api/v1/indexes/{{ inputs.index_id }}"
    method: GET

  - id: read_latest
    type: io.kestra.plugin.quickwit.search.Search
    description: Reads the newest document candidate from the target index.
    allowFailure: true
    url: "{{ inputs.quickwit_url }}"
    index: "{{ inputs.index_id }}"
    query: "*"
    maxHits: 1
    sortBy:
      - "+ts"
    fetchType: FETCH_ONE

  - id: set_watermark
    type: io.kestra.plugin.core.output.OutputValues
    description: Captures one detection watermark so verification does not move the freshness goalpost while recovery runs.
    values:
      watermark: "{{ (now() | timestamp) - (inputs.freshness_minutes * 60) }}"

  - id: read_fresh
    type: io.kestra.plugin.quickwit.search.Search
    description: Counts documents at or beyond the freshness watermark using Quickwit search itself.
    allowFailure: true
    url: "{{ inputs.quickwit_url }}"
    index: "{{ inputs.index_id }}"
    query: "*"
    startTimestamp: "{{ outputs.set_watermark.values.watermark }}"
    maxHits: 1
    fetchType: NONE

  - id: classify
    type: io.kestra.plugin.core.output.OutputValues
    description: Records the bounded detector result, checkpoint snapshot, source state and search counts.
    values:
      index_count: "{{ outputs.list_indexes is defined ? outputs.list_indexes.size : -1 }}"
      target_present: "{{ outputs.list_indexes is defined and ((outputs.list_indexes.indexes | jq('any(.[]; .index_config.index_id == \"' ~ inputs.index_id ~ '\")') | first)) }}"
      source_present: "{{ outputs.read_index is defined and ((outputs.read_index.metadata.sources | jq('any(.[]; .source_id == \"' ~ inputs.source_id ~ '\")') | first)) }}"
      source_enabled: "{{ outputs.read_index_state is defined and ((fromJson(outputs.read_index_state.body).sources | jq('any(.[]; .source_id == \"' ~ inputs.source_id ~ '\" and .enabled == true)') | first)) }}"
      checkpoint_json: "{{ outputs.read_index is defined ? (outputs.read_index.metadata.checkpoint | toJson) : '{}' }}"
      source_checkpoint_json: "{{ outputs.read_index is defined ? ((outputs.read_index.metadata.checkpoint[inputs.source_id] | default({})) | toJson) : '{}' }}"
      latest_total: "{{ outputs.read_latest is defined ? outputs.read_latest.total : -1 }}"
      latest_ts: "{{ outputs.read_latest is defined and outputs.read_latest.row is defined ? outputs.read_latest.row.ts : '' }}"
      fresh_total: "{{ outputs.read_fresh is defined ? outputs.read_fresh.total : -1 }}"
      watermark: "{{ outputs.set_watermark.values.watermark }}"
      degraded: "{{ outputs.read_index is defined and outputs.read_index_state is defined and outputs.read_fresh is defined and outputs.read_latest is defined and (outputs.read_fresh.total == 0) and ((fromJson(outputs.read_index_state.body).sources | jq('any(.[]; .source_id == \"' ~ inputs.source_id ~ '\" and .enabled == true)') | first)) and (outputs.read_index.metadata.checkpoint[inputs.source_id] is defined) }}"

  - id: report_detection
    type: io.kestra.plugin.core.flow.If
    description: Reports a stale enabled source and alerts Slack or records the healthy/protected result.
    condition: "{{ outputs.classify.values.degraded == 'true' }}"
    then:
      - id: alert_stale_source
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'Quickwit source checkpoint guard detected stale data: index=' ~ inputs.index_id ~ ', source=' ~ inputs.source_id ~ ', latest_ts=' ~ outputs.classify.values.latest_ts ~ ', fresh_hits=' ~ outputs.classify.values.fresh_total ~ ', checkpoint=' ~ outputs.classify.values.source_checkpoint_json ~ '. Execution ' ~ execution.id ~ '.'} | toJson }}
    else:
      - id: log_healthy_or_protected
        type: io.kestra.plugin.core.log.Log
        message: "Quickwit source checkpoint guard spared index={{ inputs.index_id }} source={{ inputs.source_id }}: target_present={{ outputs.classify.values.target_present }}, source_present={{ outputs.classify.values.source_present }}, source_enabled={{ outputs.classify.values.source_enabled }}, latest_ts={{ outputs.classify.values.latest_ts }}, fresh_hits={{ outputs.classify.values.fresh_total }}, checkpoint={{ outputs.classify.values.source_checkpoint_json }}."

  - id: remediation_mode
    type: io.kestra.plugin.core.flow.If
    description: Enters remediation only for a degraded source with both safety inputs enabled.
    condition: "{{ outputs.classify.values.degraded == 'true' and inputs.auto_remediate and not inputs.dry_run }}"
    then:
      - id: approval_gate
        type: io.kestra.plugin.core.flow.Pause
        description: Human approval is required before disabling, resetting or re-enabling the named source.
        onResume:
          - id: approved
            type: BOOL
            required: false
            description: Set true only after reviewing the named index, source, checkpoint and freshness evidence.

      - id: approved_branch
        type: io.kestra.plugin.core.flow.If
        description: An unanswered or declined approval stops without a Quickwit write.
        condition: "{{ outputs.approval_gate.onResume.approved ?? false }}"
        then:
          - id: read_before_disable
            type: io.kestra.plugin.quickwit.index.Get
            description: Re-reads the source and checkpoint immediately before the first write.
            allowFailure: true
            url: "{{ inputs.quickwit_url }}"
            index: "{{ inputs.index_id }}"

          - id: read_before_disable_state
            type: io.kestra.plugin.core.http.Request
            description: Re-reads raw source enabled state immediately before the first write.
            allowFailure: true
            uri: "{{ inputs.quickwit_url }}/api/v1/indexes/{{ inputs.index_id }}"
            method: GET

          - id: reject_stale_plan_before_disable
            type: io.kestra.plugin.core.flow.If
            description: Refuses the plan if the named source or checkpoint changed during approval.
            condition: "{{ outputs.read_before_disable is not defined or outputs.read_before_disable_state is not defined or outputs.read_before_disable.metadata.checkpoint | toJson != outputs.classify.values.checkpoint_json or not ((fromJson(outputs.read_before_disable_state.body).sources | jq('any(.[]; .source_id == \"' ~ inputs.source_id ~ '\" and .enabled == true)') | first)) }}"
            then:
              - id: stale_plan_before_disable
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: "Refusing stale Quickwit remediation plan: source {{ inputs.source_id }} or its checkpoint changed during approval."
            else:
              - id: disable_source
                type: io.kestra.plugin.quickwit.source.Toggle
                description: Disables only the approved source before resetting its checkpoint.
                url: "{{ inputs.quickwit_url }}"
                index: "{{ inputs.index_id }}"
                source: "{{ inputs.source_id }}"
                enable: false

              - id: read_before_reset
                type: io.kestra.plugin.quickwit.index.Get
                description: Re-reads immediately after disable and before ResetCheckpoint.
                allowFailure: true
                url: "{{ inputs.quickwit_url }}"
                index: "{{ inputs.index_id }}"

              - id: read_before_reset_state
                type: io.kestra.plugin.core.http.Request
                description: Re-reads raw source state immediately after disable and before ResetCheckpoint.
                allowFailure: true
                uri: "{{ inputs.quickwit_url }}/api/v1/indexes/{{ inputs.index_id }}"
                method: GET

              - id: reject_changed_source_before_reset
                type: io.kestra.plugin.core.flow.If
                description: Stops before reset if the source disappeared or its disabled snapshot is not readable.
                condition: "{{ outputs.read_before_reset is not defined or outputs.read_before_reset_state is not defined or not ((fromJson(outputs.read_before_reset_state.body).sources | jq('any(.[]; .source_id == \"' ~ inputs.source_id ~ '\" and .enabled == false)') | first)) }}"
                then:
                  - id: reset_plan_refused
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: "Refusing Quickwit checkpoint reset: source {{ inputs.source_id }} was not observed disabled immediately before the write."
                else:
                  - id: reset_checkpoint
                    type: io.kestra.plugin.quickwit.source.ResetCheckpoint
                    description: Clears the stranded checkpoint so the source can consume from the recreated topic again.
                    url: "{{ inputs.quickwit_url }}"
                    index: "{{ inputs.index_id }}"
                    source: "{{ inputs.source_id }}"

                  - id: read_before_enable
                    type: io.kestra.plugin.quickwit.index.Get
                    description: Re-reads immediately after reset and before re-enabling the source.
                    allowFailure: true
                    url: "{{ inputs.quickwit_url }}"
                    index: "{{ inputs.index_id }}"

                  - id: read_before_enable_state
                    type: io.kestra.plugin.core.http.Request
                    description: Re-reads raw source state immediately after reset and before re-enable.
                    allowFailure: true
                    uri: "{{ inputs.quickwit_url }}/api/v1/indexes/{{ inputs.index_id }}"
                    method: GET

                  - id: reject_missing_source_before_enable
                    type: io.kestra.plugin.core.flow.If
                    description: Stops before re-enable if reset left no named source to resume.
                    condition: "{{ outputs.read_before_enable is not defined or outputs.read_before_enable_state is not defined or not ((fromJson(outputs.read_before_enable_state.body).sources | jq('any(.[]; .source_id == \"' ~ inputs.source_id ~ '\" and .enabled == false)') | first)) }}"
                    then:
                      - id: enable_plan_refused
                        type: io.kestra.plugin.core.execution.Fail
                        errorMessage: "Refusing Quickwit source re-enable: source {{ inputs.source_id }} was not present and disabled after checkpoint reset."
                    else:
                      - id: enable_source
                        type: io.kestra.plugin.quickwit.source.Toggle
                        description: Re-enables the same source after checkpoint reset.
                        url: "{{ inputs.quickwit_url }}"
                        index: "{{ inputs.index_id }}"
                        source: "{{ inputs.source_id }}"
                        enable: true

                      - id: wait_for_recovery
                        type: io.kestra.plugin.core.flow.Sleep
                        description: Bounded wait for the Kafka consumer and indexer to commit new documents.
                        duration: "PT{{ inputs.wait_seconds }}S"

                      - id: verify_index
                        type: io.kestra.plugin.quickwit.index.Get
                        description: Reads the source checkpoint after recovery.
                        allowFailure: true
                        url: "{{ inputs.quickwit_url }}"
                        index: "{{ inputs.index_id }}"

                      - id: verify_freshness
                        type: io.kestra.plugin.quickwit.search.Search
                        description: Requires at least one searchable document at or beyond the original freshness watermark.
                        allowFailure: true
                        url: "{{ inputs.quickwit_url }}"
                        index: "{{ inputs.index_id }}"
                        query: "*"
                        startTimestamp: "{{ outputs.set_watermark.values.watermark }}"
                        maxHits: 1
                        fetchType: NONE

                      - id: verify_recovery
                        type: io.kestra.plugin.core.flow.If
                        description: Fails unless the checkpoint changed and search freshness recovered.
                        condition: "{{ outputs.verify_index is not defined or outputs.verify_freshness is not defined or outputs.verify_freshness.total == 0 or (outputs.verify_index.metadata.checkpoint | toJson == outputs.classify.values.checkpoint_json) }}"
                        then:
                          - id: recovery_not_confirmed
                            type: io.kestra.plugin.core.execution.Fail
                            errorMessage: "Quickwit recovery was not confirmed: fresh_hits={{ outputs.verify_freshness is defined ? outputs.verify_freshness.total : -1 }}, checkpoint_after={{ outputs.verify_index is defined ? (outputs.verify_index.metadata.checkpoint | toJson) : 'missing' }}, checkpoint_before={{ outputs.classify.values.checkpoint_json }}."
                        else:
                          - id: recovery_confirmed
                            type: io.kestra.plugin.core.log.Log
                            message: "Quickwit source recovery confirmed: fresh_hits={{ outputs.verify_freshness.total }}, checkpoint_before={{ outputs.classify.values.checkpoint_json }}, checkpoint_after={{ outputs.verify_index.metadata.checkpoint | toJson }}."
        else:
          - id: remediation_declined
            type: io.kestra.plugin.core.log.Log
            message: "Quickwit remediation declined or unanswered for index={{ inputs.index_id }} source={{ inputs.source_id }}. No Toggle or ResetCheckpoint task ran."
    else:
      - id: report_only
        type: io.kestra.plugin.core.log.Log
        message: "Quickwit report-only result: degraded={{ outputs.classify.values.degraded }}, auto_remediate={{ inputs.auto_remediate }}, dry_run={{ inputs.dry_run }}. No source write ran."

  - id: audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Records the detector outcome and safety mode in every successful execution.
    message: "Quickwit source checkpoint guard complete: index={{ inputs.index_id }}, source={{ inputs.source_id }}, degraded={{ outputs.classify.values.degraded }}, latest_ts={{ outputs.classify.values.latest_ts }}, fresh_hits={{ outputs.classify.values.fresh_total }}, auto_remediate={{ inputs.auto_remediate }}, dry_run={{ inputs.dry_run }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Quickwit source checkpoint guard failed for index=' ~ inputs.index_id ~ ', source=' ~ inputs.source_id ~ ' in execution ' ~ execution.id ~ '. Check Kestra logs.'} | toJson }}

triggers:
  - id: every_15_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled and pinned to safe mode.
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      quickwit_url: "http://localhost:7280"
      index_id: "logs"
      source_id: "source"
      freshness_minutes: 5
      wait_seconds: 20
      auto_remediate: false
      dry_run: true

extend:
  demo: false
  ee: false
  title: Quickwit Source Checkpoint Reset Recovery Guard
  shortDescription: Detect stale Quickwit Kafka data and safely reset a stranded source checkpoint after approval.
  metaTitle: Quickwit Source Checkpoint Reset Recovery Guard with Kestra
  metaDescription: Detect stale Quickwit Kafka indexing and verify recovery after an approved checkpoint reset.
  tags:
    - Data
  subTags:
    - Realtime & Streaming
    - Day 2 Operations
  description: |
    ## Safety

    Resetting a source checkpoint can replay a Kafka topic into an index. This flow names one
    index and one source, reads the checkpoint again after approval, disables the source before
    resetting it and re-reads the source before every write. It reports recovery only when the
    checkpoint changed and Quickwit search returns a document newer than the original freshness
    budget.

    | Guard | What it stops |
    | --- | --- |
    | `auto_remediate` plus `dry_run` | Any source write in the default schedule mode |
    | `Pause` with `approved ?? false` | An unapproved Toggle or ResetCheckpoint |
    | Checkpoint and source re-read before each write | Acting on a source that changed during approval or an earlier write |
    | Named `index_id` and `source_id` | A bulk reset across unrelated indexes or sources |
    | Post-write checkpoint and search checks | Reporting success when reset or indexing did not recover |

    ## How it works

    1. `list_indexes` (`io.kestra.plugin.quickwit.index.List`) confirms the target index exists, while
       `read_index` (`io.kestra.plugin.quickwit.index.Get`) reads its attached sources and checkpoint.
    2. `read_latest` and `read_fresh` (`io.kestra.plugin.quickwit.search.Search`) read the newest
       document and count documents at the freshness watermark. An enabled named source with zero
       fresh hits and a checkpoint is classified as degraded. Healthy, missing-source, disabled,
       and missing-index cases are spared.
    3. `approval_gate` (`io.kestra.plugin.core.flow.Pause`) runs only when `auto_remediate` is true
       and `dry_run` is false. A declined or unanswered pause logs and performs no write.
    4. After approval, `read_before_disable` checks the checkpoint and enabled source state. The
       flow calls `source.Toggle` with `enable: false`, reads again, calls `source.ResetCheckpoint`,
       reads again, then calls `source.Toggle` with `enable: true`.
    5. `wait_for_recovery` (`io.kestra.plugin.core.flow.Sleep`) bounds the recovery window.
       `verify_index` (`index.Get`) and `verify_freshness` (`search.Search`) require a changed
       checkpoint and at least one fresh searchable document or fail the execution.
    6. The `errors` block sends the execution id to Slack on an unhandled failure.

    ## What you get

    - A detector for the silent failure mode where old Quickwit results still look healthy.
    - A scoped, approval-gated reset that handles a recreated or trimmed Kafka topic.
    - A post-change proof based on Quickwit checkpoint state and searchable document freshness.
    - Healthy, disabled-source, missing-source and stale-plan cases recorded in Kestra history.

    ## Who it's for

    Search and data platform teams running Quickwit Kafka sources that must keep dashboards and
    operational searches within a freshness budget after topic maintenance.

    ## Why orchestrate this with Kestra

    Quickwit's REST API can toggle and reset a source, but it does not provide an approval record,
    stale-plan protection, bounded recovery wait, Slack failure path or an auditable before and
    after execution. Kestra supplies those controls while every read and write still uses the
    Quickwit plugin.

    ## Tested end to end

    The test fixture uses Quickwit 0.8.2, Kafka 7.6.1, Kestra 2.0.5 and Quickwit plugin 1.0.0.
    See the evidence packet for execution ids, independent REST assertions and the second-fixture
    audit.

    | Case | Execution | Result |
    | --- | --- | --- |
    | Healthy control | `UYqh96SbuNjBgcvQhQ3Ms` | SUCCESS, one fresh hit, no writes |
    | Degraded dry run | `3Cf1iBe6f5jK6OnO7ftNRY` | SUCCESS, zero fresh hits, no writes |
    | Declined approval | `2vdohVf4xD7kHs9T9YmvKF` | SUCCESS, no writes |
    | Approved recovery | `7K2HDM4IRrKnxkgGbKqWdD` | SUCCESS, checkpoint 18 to 19, one fresh hit |
    | Repeat | `7ikjFo1RIIsVfNG21dwvXm` | SUCCESS, healthy and no writes |
    | Disabled source | `3xFk6R7vDKeUrFoyqvToEy` | SUCCESS, source spared |
    | Approval race | `5KnQlBHsTL62FICwNxAf3s` | FAILED before Toggle |
    | Partial interruption | `5004v6AVbCwJrMYBHqF03m` | FAILED after Toggle and before reset |

    ## Prerequisites

    - Kestra 2.0.5 with `io.kestra.plugin:plugin-quickwit:1.0.0` loaded.
    - Quickwit 0.8.x with a Kafka source and an index timestamp field named `ts`.
    - Kafka permissions to read the named topic and Quickwit permissions to read index metadata,
      search, toggle the source and reset its checkpoint.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook used by `errors` and the stale detector alert.

    ### Inputs

    | Input | Default | Purpose |
    | --- | --- | --- |
    | `quickwit_url` | `http://localhost:7280` | Quickwit REST base URL |
    | `index_id` | `logs` | One target index |
    | `source_id` | `source` | One named Kafka source |
    | `freshness_minutes` | `5` | Freshness watermark window |
    | `wait_seconds` | `20` | Bounded post-reset wait |
    | `auto_remediate` | `false` | Enables the approval branch |
    | `dry_run` | `true` | Keeps writes disabled |

    ## Quick start

    1. Load the Quickwit plugin into the Kestra 2.0.5 runner and set `SLACK_WEBHOOK_URL`.
    2. Set `quickwit_url`, `index_id` and `source_id` to the real target.
    3. Run with `auto_remediate: false` and `dry_run: true` to inspect the detector.
    4. If the named source is degraded, rerun with `auto_remediate: true`, `dry_run: false`,
       approve the Pause and wait for the recovery proof.

    ## How to extend

    Add a per-index freshness budget only when the index timestamp semantics are equivalent to
    `ts` and keep each source reset behind its own approval. The flow does not prove Kafka broker
    health or guarantee that every historical document is replayed before the wait expires.

    Limits: a source whose checkpoint is already advancing but whose documents are malformed can
    still fail the freshness check; the flow reports that failure and leaves the source enabled.

    ## Links

    - [Quickwit source checkpoint reset API](https://quickwit.io/docs/reference/rest-api#reset-source-checkpoint)
    - [Kestra Quickwit plugin](https://github.com/kestra-io/plugin-quickwit)

    This blueprint was created by [zkasuran](https://github.com/zkasuran).
