id: kestra-upgrade-compatibility-gate
namespace: company.team

description: |
  Compare every live flow in a Kestra namespace with a candidate Kestra version before an upgrade.
  The gate validates the current and candidate representations, reports only regressions and can
  quarantine candidate-invalid schedules after an approval by disabling their triggers and recording
  the prior state in KV for reversal.

concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: kestra_url
    type: STRING
    displayName: Current Kestra URL
    description: Base URL of the running Kestra instance whose flows and triggers are checked.
    defaults: "http://localhost:8080"

  - id: candidate_url
    type: STRING
    displayName: Candidate Kestra URL
    description: Base URL of the second Kestra instance running the candidate image.
    defaults: "http://localhost:8080"

  - id: namespace
    type: STRING
    displayName: Flow namespace
    description: Exact namespace exported and checked.
    defaults: company.team

  - id: tenant_id
    type: STRING
    displayName: Tenant id
    defaults: main

  - id: kestra_user
    type: STRING
    displayName: Kestra API username
    defaults: admin@kestra.io

  - id: kestra_password
    type: SECRET
    displayName: Kestra API password
    defaults: "{{ secret('KESTRA_PASSWORD') }}"

  - id: record_namespace
    type: STRING
    displayName: KV record namespace
    description: Namespace where quarantine records are written.
    defaults: company.team

  - id: auto_remediate
    type: BOOL
    displayName: Quarantine candidate-invalid flows
    description: Permit trigger disabling after approval. Keep false for an audit-only run.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Keep true to report regressions without changing trigger state.
    defaults: true

tasks:
  - id: inventory
    type: io.kestra.plugin.kestra.flows.List
    description: Read every deployed flow with the Kestra plugin so trigger ids and task types stay tied to live state.
    kestraUrl: "{{ inputs.kestra_url }}"
    tenantId: "{{ inputs.tenant_id }}"
    namespace: "{{ inputs.namespace }}"
    auth:
      username: "{{ inputs.kestra_user }}"
      password: "{{ inputs.kestra_password }}"

  - id: export
    type: io.kestra.plugin.kestra.flows.Export
    description: Export the complete namespace to Kestra internal storage as the source snapshot used by the audit.
    kestraUrl: "{{ inputs.kestra_url }}"
    tenantId: "{{ inputs.tenant_id }}"
    namespace: "{{ inputs.namespace }}"
    auth:
      username: "{{ inputs.kestra_user }}"
      password: "{{ inputs.kestra_password }}"

  - id: unzip
    type: io.kestra.plugin.compress.ArchiveDecompress
    description: Decompress the exported source snapshot so each validation uses the exact deployed YAML.
    algorithm: ZIP
    from: "{{ outputs.export.flowsZip }}"

  - id: scan
    type: io.kestra.plugin.core.flow.Loop
    description: Validate each live flow against both versions and emit one regression row.
    concurrencyLimit: 1
    values: "{{ outputs.unzip.files | keys }}"
    tasks:
      - id: validate_current
        type: io.kestra.plugin.core.http.Request
        description: Validate the live flow against the current Kestra API.
        uri: "{{ inputs.kestra_url }}/api/v1/{{ inputs.tenant_id }}/flows/validate"
        method: POST
        contentType: application/x-yaml
        body: "{{ read(outputs.unzip.files[item.value]) }}"
        options:
          auth:
            type: BASIC
            username: "{{ inputs.kestra_user }}"
            password: "{{ inputs.kestra_password }}"

      - id: validate_candidate
        type: io.kestra.plugin.core.http.Request
        description: Validate the same live flow against the candidate Kestra API.
        uri: "{{ inputs.candidate_url }}/api/v1/{{ inputs.tenant_id }}/flows/validate"
        method: POST
        contentType: application/x-yaml
        body: "{{ read(outputs.unzip.files[item.value]) }}"
        options:
          auth:
            type: BASIC
            username: "{{ inputs.kestra_user }}"
            password: "{{ inputs.kestra_password }}"

      - id: facts
        type: io.kestra.plugin.core.output.OutputValues
        values:
          current_constraints: "{{ outputs.validate_current.body | jq('.[0].constraints // \"\"') | first }}"
          candidate_constraints: "{{ outputs.validate_candidate.body | jq('.[0].constraints // \"\"') | first }}"
          current_deprecations: "{{ outputs.validate_current.body | jq('.[0].deprecationPaths // []') | first | toJson }}"
          candidate_deprecations: "{{ outputs.validate_candidate.body | jq('.[0].deprecationPaths // []') | first | toJson }}"
          current_warnings: "{{ outputs.validate_current.body | jq('.[0].warnings // []') | first | toJson }}"
          candidate_warnings: "{{ outputs.validate_candidate.body | jq('.[0].warnings // []') | first | toJson }}"
          candidate_infos: "{{ outputs.validate_candidate.body | jq('.[0].infos // []') | first | toJson }}"

      - id: classify
        type: io.kestra.plugin.core.output.OutputValues
        values:
          class: "{{ {'current_constraints': outputs.facts.values.current_constraints, 'candidate_constraints': outputs.facts.values.candidate_constraints, 'current_deprecations': outputs.facts.values.current_deprecations, 'candidate_deprecations': outputs.facts.values.candidate_deprecations, 'current_warnings': outputs.facts.values.current_warnings, 'candidate_warnings': outputs.facts.values.candidate_warnings, 'candidate_infos': outputs.facts.values.candidate_infos} | toJson | jq('if ((.candidate_constraints | length) > 0 and .candidate_constraints != .current_constraints) or ((.candidate_infos | fromjson) | any(contains(\"replaced\"))) then \"INVALID\" elif (((.candidate_deprecations | fromjson) - (.current_deprecations | fromjson)) | length) > 0 then \"NEW_DEPRECATION\" elif (((.candidate_warnings | fromjson) - (.current_warnings | fromjson)) | length) > 0 then \"NEW_WARNING\" else \"UNCHANGED\" end') | first }}"
          new_deprecations: "{{ {'current': outputs.facts.values.current_deprecations, 'candidate': outputs.facts.values.candidate_deprecations} | toJson | jq('(.candidate | fromjson) - (.current | fromjson)') | first | toJson }}"
          new_warnings: "{{ {'current': outputs.facts.values.current_warnings, 'candidate': outputs.facts.values.candidate_warnings} | toJson | jq('(.candidate | fromjson) - (.current | fromjson)') | first | toJson }}"

      - id: row
        type: io.kestra.plugin.core.log.Log
        message: "{{ inputs.namespace }}/{{ item.value | replace({(inputs.namespace ~ '-'): ''}) | replace({'.yml': ''}) }} | {{ outputs.classify.values.class }} | current_constraints={{ outputs.facts.values.current_constraints | default('none') }} | candidate_constraints={{ outputs.facts.values.candidate_constraints | default('none') }} | new_deprecations={{ outputs.classify.values.new_deprecations }} | new_warnings={{ outputs.classify.values.new_warnings }}"

      - id: record_invalid
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.classify.values.class == 'INVALID' }}"
        then:
          - id: save_finding
            type: io.kestra.plugin.core.kv.Set
            description: Record the candidate-invalid flow and its trigger ids before any approval or write.
            namespace: "{{ inputs.record_namespace }}"
            key: "kestra-compat-{{ execution.id }}-invalid-{{ inputs.namespace | replace({'.': '-'}) }}-{{ item.value | replace({(inputs.namespace ~ '-'): ''}) | replace({'/': '-'}) | replace({':': '-'}) | replace({'.': '-'}) | replace({' ': '-'}) }}"
            value: "{{ {'namespace': inputs.namespace, 'flow_id': item.value | replace({(inputs.namespace ~ '-'): ''}) | replace({'.yml': ''}), 'kestra_url': inputs.kestra_url, 'tenant_id': inputs.tenant_id, 'triggers': (outputs.inventory.flows | toJson | jq('[.[] | select(.id == \"' ~ (item.value | replace({(inputs.namespace ~ '-'): ''}) | replace({'.yml': ''})) ~ '\") | .triggers[]]') | first | toJson), 'reason': outputs.facts.values.candidate_constraints | default('candidate plugin type is replaced or unavailable')} | toJson }}"
            kvType: STRING
            overwrite: true
        else:
          - id: no_invalid_record
            type: io.kestra.plugin.core.log.Log
            message: "{{ item.value | replace({(inputs.namespace ~ '-'): ''}) | replace({'.yml': ''}) }} is {{ outputs.classify.values.class }}; no quarantine record was created."

  - id: finding_keys
    type: io.kestra.plugin.core.kv.GetKeys
    description: Read the findings written by the scan so approval sees the exact snapshot.
    namespace: "{{ inputs.record_namespace }}"
    prefix: "kestra-compat-{{ execution.id }}-invalid-"

  - id: remediation_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.auto_remediate and not inputs.dry_run and (outputs.finding_keys.keys | length) > 0 }}"
    then:
      - id: approval
        type: io.kestra.plugin.core.flow.Pause
        description: Approve disabling triggers for flows that became invalid on the candidate.
        pauseDuration: PT1H
        behavior: RESUME
        onResume:
          - id: approved
            type: BOOL
            required: false
            description: Set true to quarantine the recorded candidate-invalid triggers.
          - id: note
            type: STRING
            required: false
            description: Optional reason for the quarantine record.

      - id: approved_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.approval.onResume.approved ?? false }}"
        then:
          - id: quarantine_flows
            type: io.kestra.plugin.core.flow.Loop
            description: Reconcile every recorded flow and disable its still-enabled triggers serially.
            concurrencyLimit: 1
            values: "{{ outputs.finding_keys.keys }}"
            tasks:
              - id: read_finding
                type: io.kestra.plugin.core.kv.Get
                namespace: "{{ inputs.record_namespace }}"
                key: "{{ item.value }}"
                errorOnMissing: true

              - id: recheck_source
                type: io.kestra.plugin.core.http.Request
                description: Read the flow source again after the approval so a fix made during the Pause is seen.
                uri: "{{ inputs.kestra_url }}/api/v1/{{ inputs.tenant_id }}/flows/{{ fromJson(outputs.read_finding.value).namespace }}/{{ fromJson(outputs.read_finding.value).flow_id }}?source=true"
                method: GET
                options:
                  auth:
                    type: BASIC
                    username: "{{ inputs.kestra_user }}"
                    password: "{{ inputs.kestra_password }}"

              - id: recheck_candidate
                type: io.kestra.plugin.core.http.Request
                description: Validate the current source against the candidate again immediately before any write.
                uri: "{{ inputs.candidate_url }}/api/v1/{{ inputs.tenant_id }}/flows/validate"
                method: POST
                contentType: application/x-yaml
                body: "{{ outputs.recheck_source.body | jq('.source') | first }}"
                options:
                  auth:
                    type: BASIC
                    username: "{{ inputs.kestra_user }}"
                    password: "{{ inputs.kestra_password }}"

              - id: recheck_gate
                type: io.kestra.plugin.core.flow.If
                description: Disable triggers only for a flow that still has a candidate constraint or a replacement notice.
                condition: "{{ outputs.recheck_candidate.body | jq('((.[0].constraints // \"\") | length) > 0 or ((.[0].infos // []) | any(contains(\"replaced\")))') | first }}"
                then:
                    - id: prewrite_inventory
                      type: io.kestra.plugin.core.http.Request
                      description: Read runtime trigger state because flows.List exposes source triggers but not the persisted disabled flag.
                      uri: "{{ fromJson(outputs.read_finding.value).kestra_url }}/api/v1/{{ fromJson(outputs.read_finding.value).tenant_id }}/triggers/{{ fromJson(outputs.read_finding.value).namespace }}/{{ fromJson(outputs.read_finding.value).flow_id }}"
                      method: GET
                      options:
                        auth:
                          type: BASIC
                          username: "{{ inputs.kestra_user }}"
                          password: "{{ inputs.kestra_password }}"

                    - id: prewrite_gate
                      type: io.kestra.plugin.core.flow.If
                      description: Write only when a trigger is still enabled in the runtime state and in the flow source.
                      condition: "{{ outputs.prewrite_inventory.body | jq('[.results[] | select(.disabled != true and .sourceDisabled != true)] | length > 0') | first }}"
                      then:
                        - id: save_original
                          type: io.kestra.plugin.core.kv.Set
                          description: Save the trigger ids that were enabled so the quarantine can be reversed.
                          namespace: "{{ inputs.record_namespace }}"
                          key: "kestra-compat-{{ execution.id }}-disabled-{{ fromJson(outputs.read_finding.value).namespace | replace({'.': '-'}) }}-{{ fromJson(outputs.read_finding.value).flow_id }}"
                          value: "{{ {'namespace': fromJson(outputs.read_finding.value).namespace, 'flow_id': fromJson(outputs.read_finding.value).flow_id, 'enabled_before': (outputs.prewrite_inventory.body | jq('[.results[] | select(.disabled != true and .sourceDisabled != true) | .triggerId]') | first)} | toJson }}"
                          kvType: STRING
                          overwrite: true

                        - id: disable_trigger
                          type: io.kestra.plugin.kestra.triggers.Toggle
                          kestraUrl: "{{ fromJson(outputs.read_finding.value).kestra_url }}"
                          tenantId: "{{ fromJson(outputs.read_finding.value).tenant_id }}"
                          namespace: "{{ fromJson(outputs.read_finding.value).namespace }}"
                          flowId: "{{ fromJson(outputs.read_finding.value).flow_id }}"
                          enabled: false
                          auth:
                            username: "{{ inputs.kestra_user }}"
                            password: "{{ inputs.kestra_password }}"

                        - id: settle_toggle
                          type: io.kestra.plugin.core.flow.Sleep
                          description: Allow Kestra's asynchronous trigger disable operation to settle before verification.
                          duration: PT3S

                        - id: verify_inventory
                          type: io.kestra.plugin.core.http.Request
                          description: Re-read runtime trigger state after Toggle.
                          uri: "{{ fromJson(outputs.read_finding.value).kestra_url }}/api/v1/{{ fromJson(outputs.read_finding.value).tenant_id }}/triggers/{{ fromJson(outputs.read_finding.value).namespace }}/{{ fromJson(outputs.read_finding.value).flow_id }}"
                          method: GET
                          options:
                            auth:
                              type: BASIC
                              username: "{{ inputs.kestra_user }}"
                              password: "{{ inputs.kestra_password }}"

                        - id: verify_gate
                          type: io.kestra.plugin.core.flow.If
                          condition: "{{ outputs.verify_inventory.body | jq('[.results[] | select(.disabled != true and .sourceDisabled != true)] | length == 0') | first }}"
                          then:
                            - id: quarantined
                              type: io.kestra.plugin.core.log.Log
                              message: "Disabled and verified every trigger of {{ fromJson(outputs.read_finding.value).namespace }}/{{ fromJson(outputs.read_finding.value).flow_id }}."
                          else:
                            - id: verify_failed
                              type: io.kestra.plugin.core.execution.Fail
                              errorMessage: "A trigger of {{ fromJson(outputs.read_finding.value).flow_id }} did not remain disabled after Toggle."
                      else:
                        - id: stale_or_protected
                          type: io.kestra.plugin.core.log.Log
                          message: "Skipped {{ fromJson(outputs.read_finding.value).flow_id }} because every trigger was already disabled or changed after approval."
                else:
                  - id: fixed_during_pause
                    type: io.kestra.plugin.core.log.Log
                    message: "{{ fromJson(outputs.read_finding.value).namespace }}/{{ fromJson(outputs.read_finding.value).flow_id }} is no longer invalid on the candidate after the approval. No trigger was changed."
        else:
          - id: declined
            type: io.kestra.plugin.core.log.Log
            message: "Approval was not granted. No candidate-invalid trigger was changed."
    else:
      - id: safe_mode
        type: io.kestra.plugin.core.log.Log
        message: "Compatibility report complete. No trigger changes were permitted (auto_remediate={{ inputs.auto_remediate }}, dry_run={{ inputs.dry_run }}, candidate-invalid flows={{ outputs.finding_keys.keys | length }})."

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Kestra upgrade compatibility gate failed for ' ~ inputs.namespace ~ ' against ' ~ inputs.candidate_url ~ ' (execution ' ~ execution.id ~ '). Review validation, quarantine and verification logs.'} | toJson }}

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: Disabled by default and forced to audit-only inputs.
    cron: "30 6 * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: Gate a Kestra upgrade against every live flow
  metaTitle: Kestra upgrade compatibility gate
  shortDescription: Validate live Kestra flows against a candidate version, report only regressions and quarantine candidate-invalid triggers after approval.
  metaDescription: Validate live Kestra flows against a candidate Kestra version and quarantine triggers for new invalid flows before upgrade.
  tags:
    - Infrastructure
    - Core
  subTags:
    - CI/CD & Deployment
    - Day 2 Operations
  ee: false
  demo: false
  description: |
    ## Safety

    A Kestra upgrade can leave a deployed flow accepted by the current server but rejected when its
    next trigger runs. This gate makes the candidate validation result explicit before the rollout and
    disables only triggers on flows that become invalid on the candidate.

    | Guard | What it stops |
    | --- | --- |
    | Current versus candidate validation | Existing problems are not misreported as upgrade regressions. |
    | Candidate constraint and replacement detection | A missing plugin type or invalid constraint is classified as `INVALID`. |
    | `Pause` after the report | Trigger writes require a human decision and a fresh state read. |
    | KV rollback records | Every flow whose triggers are disabled has the trigger ids that were enabled recorded. The record holds no credential. |
    | Post-write trigger read | The run fails if any enabled trigger is still enabled after `Toggle`. |
    | Flow-level queue and candidate revalidation | Two executions never write together and a flow fixed during the Pause is revalidated and skipped. |

    ## How it works

    1. `inventory` (`io.kestra.plugin.kestra.flows.List`) reads the live namespace and `export` (`io.kestra.plugin.kestra.flows.Export`) stores a complete source snapshot in Kestra internal storage.
    2. `scan` (`io.kestra.plugin.core.flow.Loop`) sends each flow representation to the current and candidate `/flows/validate` endpoints with `io.kestra.plugin.core.http.Request`.
    3. `facts` and `classify` (`io.kestra.plugin.core.output.OutputValues`) subtract current deprecation paths and warnings from candidate results. A candidate constraint that differs from the current constraint or a replacement notice, is `INVALID`; a new deprecation is `NEW_DEPRECATION`; a new warning is `NEW_WARNING`; all else is `UNCHANGED`.
    4. Each `INVALID` result is recorded with `io.kestra.plugin.core.kv.Set`. The dry-run report is emitted as one table row per flow in the execution log.
    5. When `auto_remediate` is true and `dry_run` is false, `approval` (`io.kestra.plugin.core.flow.Pause`) holds the finding keys. After the approval each flow is handled on its own: `recheck_source` and `recheck_candidate` read its source again and validate it on the candidate and a flow that no longer has a candidate constraint or replacement notice is skipped. `prewrite_inventory` reads the runtime trigger state and the write goes ahead only when a trigger is enabled both at runtime and in the flow source. `save_original` stores the enabled trigger ids in KV, `io.kestra.plugin.kestra.triggers.Toggle` disables the flow's triggers and after a short wait `verify_inventory` fails the run if an enabled trigger remains. The trigger reads use `core.http.Request` because the Kestra flow inventory task exposes source triggers but not the persisted runtime flag. The flow runs one execution at a time (`concurrency` limit 1 with `QUEUE`), so two runs never write together.

    ## What you get

    A per-flow classification table, candidate-only deprecation and warning deltas and auditable KV records for every trigger quarantined before an upgrade.

    ## Who it's for

    Platform teams that run Kestra in production and need a pre-upgrade decision with a bounded, reversible quarantine action.

    ## Why orchestrate this with Kestra

    The same instance that owns the live flows can export them, validate them through both Kestra APIs, pause for an operator and record every trigger change in its execution history. The plugin tasks keep selection and writes tied to Kestra identifiers instead of a separately maintained inventory script.

    ## Tested end to end

    Kestra 2.0.6 ran the gate. A Kestra 2.0.5 server held the live flows and a second Kestra 2.0.6 server was the candidate, all on disposable containers. The fixture holds a healthy control, a flow that uses a task type the candidate no longer ships, a flow whose dbt Cloud task uses two properties the candidate newly deprecates and an invalid flow whose only trigger is already disabled in the flow source. Trigger state was read from the current server's own trigger API after every case, separately from the flow's reads.

    The approved run disabled exactly one trigger and left the other three flows alone. The password is a `SECRET` input; it was absent from every execution, child execution, log and KV record the run produced. Each flow is revalidated on the candidate right before its write, so a flow fixed during the Pause keeps its trigger.

    | Case | Execution | Result |
    | --- | --- | --- |
    | Clean namespace | `cB18atBsf4qRUl9VnQIQw` | SUCCESS. One `UNCHANGED` row, no record, no write |
    | Dry run | `4ljJuhitgm4a4SyzjLD3V9` | SUCCESS. `INVALID` x2, `NEW_DEPRECATION` x1, `UNCHANGED` x1; no trigger changed |
    | Declined approval | `2Iz2XucH7ZnIVt3CC0oxHH` | SUCCESS. No `Toggle`, every trigger state unchanged |
    | Approved quarantine | `nAhgkak7WuANT0fwtDKWC` | SUCCESS. Only the candidate-invalid flow with an enabled trigger was disabled and verified; healthy, deprecated and source-disabled flows untouched; one rollback record and no password stored anywhere |
    | Repeat | `QCZGfJPq55gY4LMmFBx1R` | SUCCESS. Trigger already disabled, no second `Toggle` |
    | Trigger re-enabled during the settle window | `64pZSRoRnAvWvh07uKJbSY` | FAILED as intended. `Toggle` reported success, the read-back found the trigger enabled |
    | Flow fixed during the Pause | `3co5uNCy8OCKlI3P5io7Av` | SUCCESS. Revalidation found no candidate problem, trigger left enabled |
    | Trigger disabled during the Pause | `4xkhqYQHfJGJEUfcmFdhIH` | SUCCESS. Skipped as stale, no `Toggle` |
    | Current server stopped during the Pause | `2jklmoQFyC28nvZjLEYOpW` | FAILED as intended at the source re-read, no `Toggle` |
    | Fresh servers: clean namespace | `i8hz7TtUhO2OncTX94N7K` | SUCCESS |
    | Fresh servers: dry run | `1RZsu0Ta8hT4X1PMFfKvJG` | SUCCESS. Same four classifications |
    | Fresh servers: declined | `1rf1Et4IYkUAmo9KXti94O` | SUCCESS |
    | Fresh servers: approved quarantine | `6crDNERlpCvhj9JIzcbqfp` | SUCCESS. Same single trigger disabled |
    | Fresh servers: repeat | `7XD1soLkXszJurcPlKNXWM` | SUCCESS |
    | Fresh servers: trigger re-enabled during settle | `1NlRTiMizP89pAAF73L92C` | FAILED as intended |
    | Fresh servers: flow fixed during the Pause | `5F0lTzXsj9KyUUHsnfzWmB` | SUCCESS |
    | Fresh servers: trigger disabled during the Pause | `3x2mtuFQE40bjVwufzkI1d` | SUCCESS |
    | Fresh servers: current server stopped | `AWRrWWAOig8i0oD1g0okp` | FAILED as intended |

    The classifier ran on synthetic validation results, through the same `classify` task copied unchanged into a probe flow, to cover boundaries a stored flow cannot reach (the current server refuses to store a flow that is invalid for it):


    | Classifier check | Execution | Class |
    | --- | --- | --- |
    | candidate adds first constraint | `7dI3X5Qxt9iP5sOiUtp5Qx` | `INVALID` |
    | candidate changes existing constraint | `7YggGbhBakkzjNVs5yt8Kj` | `INVALID` |
    | same constraint on both | `2A1eru7q5SQY1UnX1edSjY` | `UNCHANGED` |
    | candidate fixes constraint | `3eVbAAcmoBLuWLkmsdYGP8` | `UNCHANGED` |
    | replacement notice | `1sYo4Syv6TGPiythYBVNj1` | `INVALID` |
    | new deprecation only | `4mEt18PwbUgEKsABYwABLn` | `NEW_DEPRECATION` |
    | deprecation already on current | `4FeV8bg1Dj9v0tnuVnIlps` | `UNCHANGED` |
    | new warning only | `6RA8mllDObFY31wawF12mJ` | `NEW_WARNING` |

    ## Prerequisites

    Kestra OSS 2.0.6 with the Kestra and core plugins, an API account that can list and export flows, validate flows, set KV values and toggle triggers and a second Kestra URL running the candidate image. The worker must be able to reach both URLs.

    ### Secrets

    - `KESTRA_PASSWORD`: password for the Kestra API account.
    - `SLACK_WEBHOOK_URL`: Slack-compatible incoming webhook for the `errors` handler.

    ### Inputs

    | Input | Purpose | Safe default |
    | --- | --- | --- |
    | `kestra_url` | Current flow and trigger API base URL | `http://localhost:8080` |
    | `kestra_user` | API account name | `admin@kestra.io` |
    | `kestra_password` | `SECRET` input filled from `KESTRA_PASSWORD`; never written to KV | none |
    | `candidate_url` | Candidate validation API base URL | `http://localhost:8080` |
    | `namespace` | Exact namespace to export and scan | `company.team` |
    | `tenant_id` | API tenant segment | `main` |
    | `auto_remediate` | Allow trigger quarantine after approval | `false` |
    | `dry_run` | Prevent writes when true | `true` |
    | `record_namespace` | KV namespace for audit and rollback records | `company.team` |

    ## Quick start

    1. Deploy this flow to the current Kestra instance and leave the schedule disabled.
    2. Run it with `dry_run: true`, `auto_remediate: false`, the target `namespace` and the candidate URL.
    3. Review the per-flow table and the candidate-only deprecation and warning deltas.
    4. Re-run with `auto_remediate: true` and `dry_run: false` only when the listed candidate-invalid triggers are approved in the Pause form.
    5. Reverse a quarantine after the candidate is fixed: the KV record `kestra-compat-<execution-id>-disabled-<namespace>-<flow>` lists the trigger ids that were enabled; enable those with the `Toggle` task.

    ## How to extend

    Add a candidate image URL or a tenant-aware API authentication block when the deployment uses a different network. To quarantine a narrower set, add a namespace or label filter to `inventory` and `export`, then keep the post-toggle verification unchanged.

    Limits: The validation endpoint can report only what the candidate image knows about; custom plugins must be installed in the candidate worker before this gate can clear them. `Toggle` has no conditional write, so another operator who changes a trigger between the final read and the write is caught only by the read-back that follows. The queue serializes executions of this flow, not other writers. `Toggle` without a trigger id disables every trigger of the flow and the record lists only the ones that were enabled. The gate does not re-enable triggers on its own.

