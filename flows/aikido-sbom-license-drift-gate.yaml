id: aikido-sbom-license-drift-gate
namespace: company.security

inputs:
  - id: repository_id
    type: STRING
    defaults: "101"
    description: Aikido code repository whose SBOM is exported and compared against the last approved baseline.

  - id: release_tag
    type: STRING
    defaults: 2026.09.1
    description: Release being gated. Recorded in the baseline so you can tell which release last moved the licence set.

  - id: blocked_licenses
    type: ARRAY
    itemType: STRING
    defaults: ["AGPL-3.0", "AGPL-1.0", "SSPL-1.0", "GPL-3.0", "BUSL-1.1"]
    description: Licences that must never appear in a shipped artifact without an explicit exception.

tasks:
  - id: export_sbom
    type: io.kestra.plugin.aikido.repositories.ExportSbom
    description: Pull the CycloneDX SBOM for the repository, excluding dev dependencies so the gate reflects what actually ships.
    clientId: "{{ secret('AIKIDO_CLIENT_ID') }}"
    clientSecret: "{{ secret('AIKIDO_CLIENT_SECRET') }}"
    repositoryId: "{{ inputs.repository_id }}"
    format: SBOM
    scope: EXCLUDE_DEV_DEPS
    includeRiskReason: true
    includeVex: true

  - id: supply_chain_issues
    type: io.kestra.plugin.aikido.issues.Export
    description: Pull the malware and licence findings Aikido already raised, so the gate sees more than the raw licence strings.
    clientId: "{{ secret('AIKIDO_CLIENT_ID') }}"
    clientSecret: "{{ secret('AIKIDO_CLIENT_SECRET') }}"
    filterCodeRepoId: "{{ inputs.repository_id }}"
    filterStatus: open
    format: JSON
    fetchType: FETCH

  - id: read_baseline
    type: io.kestra.plugin.core.kv.Get
    description: Read the last approved component set for this repository. A first run has no baseline and everything counts as pre-existing.
    key: "sbom_baseline_{{ inputs.repository_id }}"
    errorOnMissing: false

  - id: assess
    type: io.kestra.plugin.scripts.python.Script
    description: Diff the SBOM against the baseline and separate newly introduced licence risk from what was already accepted.
    containerImage: python:3.12-slim
    inputFiles:
      sbom.json: "{{ outputs.export_sbom.uri }}"
      baseline.json: "{{ outputs.read_baseline.value ?? '{}' }}"
      blocked.json: "{{ inputs.blocked_licenses | toJson }}"
    script: |
      import json

      with open("sbom.json") as fh:
          sbom = json.load(fh)
      with open("baseline.json") as fh:
          raw = fh.read().strip()
          baseline = json.loads(raw) if raw else {}
      with open("blocked.json") as fh:
          blocked = {b.upper() for b in json.load(fh)}

      known = set(baseline.get("components", []))
      first_run = not known

      current = {}
      for component in sbom.get("components", []):
          name = component.get("name")
          version = component.get("version", "")
          if not name:
              continue
          licenses = []
          for entry in component.get("licenses", []) or []:
              lic = entry.get("license") or {}
              ident = lic.get("id") or lic.get("name")
              if ident:
                  licenses.append(ident)
          current[f"{name}@{version}"] = licenses

      new_components = [] if first_run else sorted(set(current) - known)

      violations = []
      for key in new_components:
          for lic in current[key]:
              if lic.upper() in blocked:
                  violations.append({"component": key, "license": lic})

      pre_existing = []
      for key, licenses in current.items():
          if key in new_components:
              continue
          for lic in licenses:
              if lic.upper() in blocked:
                  pre_existing.append({"component": key, "license": lic})

      def summarize(items):
          if not items:
              return "none"
          return "; ".join(f"{i['component']} ({i['license']})" for i in items).replace('"', "'")

      verdict = {
          "total_components": len(current),
          "component_keys": sorted(current),
          "new_components": new_components,
          "new_violations": violations,
          "pre_existing_violations": pre_existing,
          "new_violations_text": summarize(violations),
          "pre_existing_text": summarize(pre_existing),
          "first_run": first_run,
          "blocked": len(violations) > 0,
      }

      print("::" + json.dumps({"outputs": verdict}) + "::")
      print(f"first_run={first_run} components={len(current)} new={len(new_components)} new_violations={len(violations)} pre_existing={len(pre_existing)}")

  - id: gate
    type: io.kestra.plugin.core.flow.If
    description: A newly introduced blocked licence stops the release. Pre-existing ones are reported but do not block, so the gate is adoptable on day one.
    condition: "{{ outputs.assess.vars.blocked }}"
    then:
      - id: announce_block
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": "Release {{ inputs.release_tag }} blocked by a new licence violation",
            "blocks": [
              {"type": "header", "text": {"type": "plain_text", "text": "Release blocked: new licence risk"}},
              {"type": "section", "text": {"type": "mrkdwn", "text": "*Release* {{ inputs.release_tag }}\n*Repository id* {{ inputs.repository_id }}\n*New components* {{ outputs.assess.vars.new_components | length }} of {{ outputs.assess.vars.total_components }} total"}},
              {"type": "section", "text": {"type": "mrkdwn", "text": "*Newly introduced violations*\n{{ outputs.assess.vars.new_violations_text }}"}},
              {"type": "section", "text": {"type": "mrkdwn", "text": "*Pre-existing, not blocking*\n{{ outputs.assess.vars.pre_existing_text }}"}},
              {"type": "section", "text": {"type": "mrkdwn", "text": "Execution {{ execution.id }}. The baseline was not advanced, so the next run compares against the same approved set."}}
            ]
          }

      - id: fail_release
        type: io.kestra.plugin.core.execution.Fail
        description: Fail the execution so an upstream release pipeline waiting on this flow stops too.
        errorMessage: "Release {{ inputs.release_tag }} introduces a blocked licence. See the Slack notice and the verdict output."

    else:
      - id: advance_baseline
        type: io.kestra.plugin.core.kv.Set
        description: Only a clean run advances the baseline, so a blocked release cannot quietly become the new normal.
        key: "sbom_baseline_{{ inputs.repository_id }}"
        kvType: JSON
        overwrite: true
        value: |
          {
            "release_tag": "{{ inputs.release_tag }}",
            "recorded_at": "{{ now() }}",
            "components": {{ outputs.assess.vars.component_keys | toJson }}
          }

      - id: report_clean
        type: io.kestra.plugin.core.log.Log
        message: "GATE passed for release {{ inputs.release_tag }}: {{ outputs.assess.vars.total_components }} components, {{ outputs.assess.vars.new_components | length }} new, {{ outputs.assess.vars.pre_existing_violations | length }} pre-existing violations carried forward."

  - id: supply_chain_summary
    type: io.kestra.plugin.core.log.Log
    message: "Aikido reports {{ outputs.supply_chain_issues.size }} open issues for repository {{ inputs.repository_id }} alongside the SBOM check."

errors:
  - id: gate_failed
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: SBOM licence gate could not complete for repository {{ inputs.repository_id }}, release {{ inputs.release_tag }}. Treat the release as ungated until this is resolved. Execution {{ execution.id }}."
      }

outputs:
  - id: blocked
    type: BOOL
    value: "{{ outputs.assess.vars.blocked }}"

  - id: new_violations
    type: JSON
    value: "{{ outputs.assess.vars.new_violations }}"

extend:
  shortDescription: Export a CycloneDX SBOM from Aikido, diff it against the last approved baseline, and block the release only when a new copyleft or blocked licence appears.
  title: Gate Releases on New Licence Risk with an Aikido SBOM Diff Instead of a Full Backlog Scan
  metaTitle: SBOM Licence Drift Gate with Aikido and Kestra
  metaDescription: Export CycloneDX SBOMs from Aikido, compare against a stored baseline in Kestra KV, and fail the release only on newly introduced blocked licences.
  description: |
    Licence scanning usually fails for a boring reason: turn it on, get four hundred violations that predate everyone in the room, and switch it off again. This blueprint makes the check adoptable by comparing against a baseline instead of against zero. It exports the CycloneDX SBOM from Aikido, diffs the component set against the last approved release, and blocks only when a newly introduced dependency carries a blocked licence. Pre-existing violations are still reported, so the debt stays visible, but they do not stop today's release. The baseline advances only on a clean run, which means a blocked release can never quietly become the new normal.

    ## How it works
    1. The `export_sbom` task (`io.kestra.plugin.aikido.repositories.ExportSbom`) pulls the CycloneDX SBOM with `scope: EXCLUDE_DEV_DEPS`, so the gate reflects what ships rather than what the test suite pulls in. `includeVex: true` carries exploitability context alongside the components.
    2. The `supply_chain_issues` task (`io.kestra.plugin.aikido.issues.Export`) pulls the open findings Aikido already raised for the same repository, including malware and licence issues, so the gate has scanner context and not just licence strings.
    3. The `read_baseline` task (`io.kestra.plugin.core.kv.Get`) loads the previously approved component set with `errorOnMissing: false`, so the very first run treats everything as pre-existing instead of blocking the world.
    4. The `assess` task (`io.kestra.plugin.scripts.python.Script`) does the diff in plain Python with no third-party dependencies. It splits findings into `new_violations` and `pre_existing_violations` and writes a `verdict.json` output file.
    5. The `gate` task (`io.kestra.plugin.core.flow.If`) branches on that verdict. The blocking path posts a structured Slack notice and then calls `io.kestra.plugin.core.execution.Fail`, so a release pipeline waiting on this execution stops too.
    6. The clean path advances the baseline through `io.kestra.plugin.core.kv.Set` and logs how much debt was carried forward.

    ## What you get
    - A licence gate you can switch on today without a four hundred item backlog blocking the first release.
    - A real distinction between new risk and inherited risk, with both reported.
    - A baseline that only moves on a clean run, stored in Kestra KV rather than in a file someone has to remember to commit.
    - CycloneDX SBOMs exported straight from Aikido, with VEX context included.
    - Flow outputs (`blocked`, `new_violations`) that a parent release flow can branch on.

    ## Who it's for
    - Release engineers who need a supply chain gate that does not halt every deploy on day one.
    - Open source programme offices tracking copyleft exposure across many repositories.
    - Teams answering customer security questionnaires who need a defensible, dated licence position.

    ## Why orchestrate this with Kestra
    The hard part of a licence gate is not parsing an SBOM, it is the state. You need last release's component set, a decision about what counts as new, a place to keep that memory, and a way to stop the pipeline without leaving the baseline corrupted. Kestra supplies the durable KV store for the baseline, the branch that only advances it on success, typed flow outputs a parent pipeline can read, and an execution record showing exactly which components entered the artifact on which release. In a CI script this becomes a cache file nobody trusts and a gate everyone bypasses.

    ## Prerequisites
    - An Aikido workspace with API credentials carrying the `repositories:read` and `issues:read` scopes.
    - The numeric Aikido repository id, visible in the repository URL in the Aikido UI or from `io.kestra.plugin.aikido.repositories.List`.
    - A Slack incoming webhook for block notices.
    - Docker available to the Kestra worker for the Python assessment step, or swap `taskRunner` to the process runner if Python is installed on the host.

    ### Secrets
    - `AIKIDO_CLIENT_ID`, `AIKIDO_CLIENT_SECRET`: OAuth2 credentials for the Aikido public API.
    - `SLACK_WEBHOOK`: incoming webhook used for block notices and gate failures.

    ## Quick start
    1. Add the secrets above to your Kestra namespace.
    2. Run `io.kestra.plugin.aikido.repositories.List` once to find the numeric id of the repository you want to gate.
    3. Execute this flow once to record the starting baseline. The first run always passes.
    4. Adjust `blocked_licenses` to your own policy. The shipped list covers the common copyleft and source-available cases.
    5. Call the flow from your release pipeline with the real `release_tag`, and branch on the `blocked` output.

    ## How to extend
    - Fan the gate across every repository by wrapping it in a parent flow that calls `io.kestra.plugin.aikido.repositories.List` and then a `Subflow` per repository.
    - Add a `Pause` task on the blocking branch so a licence exception can be granted in-flow and recorded against a named approver.
    - Open a Jira issue per new violation with `io.kestra.plugin.jira.issues.Create` and store the component name in the summary.
    - Switch `format` to `SBOM_SPDX` when your downstream tooling expects SPDX rather than CycloneDX.
    - Archive each SBOM to object storage with `io.kestra.plugin.aws.s3.Upload` so you can reconstruct the exact dependency set of any past release.
    - Extend the Python assessment to flag components whose Aikido issue export marks them as malware, not just those with a blocked licence.

    ## Links
    - Aikido plugin docs: https://kestra.io/plugins/plugin-aikido
    - Kestra KV store: https://kestra.io/docs/concepts/kv-store
    - CycloneDX specification: https://cyclonedx.org/specification/overview/
  tags:
    - Infrastructure
    - Core
  subTags:
    - Policy & Compliance
    - CI/CD & Deployment
  ee: false
  demo: false
