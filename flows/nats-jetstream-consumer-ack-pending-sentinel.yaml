id: nats-jetstream-consumer-ack-pending-sentinel
namespace: company.streaming
inputs:
- id: nats_monitor_url
  type: STRING
  defaults: http://nats.internal:8222
  description: Base URL of NATS server monitoring endpoint.
- id: stream_name
  type: STRING
  description: JetStream stream name to audit.
- id: consumer_name
  type: STRING
  description: JetStream consumer name to audit.
- id: max_pending_ack
  type: INT
  defaults: 500
  description: Maximum allowable unacknowledged pending messages before alerting (default
    500).
tasks:
- id: query_consumer_info
  type: io.kestra.plugin.scripts.python.Script
  containerImage: python:3.11-slim
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  beforeCommands:
  - pip install requests kestra
  env:
    NATS_MONITOR_URL: '{{ inputs.nats_monitor_url }}'
    STREAM_NAME: '{{ inputs.stream_name }}'
    CONSUMER_NAME: '{{ inputs.consumer_name }}'
  script: "import os\nimport sys\nimport requests\nfrom kestra import Kestra\n\nnats_url\
    \ = os.environ.get(\"NATS_MONITOR_URL\", \"http://nats.internal:8222\").rstrip(\"\
    /\")\nstream_name = os.environ.get(\"STREAM_NAME\", \"\")\nconsumer_name = os.environ.get(\"\
    CONSUMER_NAME\", \"\")\n\nendpoint = f\"{nats_url}/jsz?streams=1&consumers=1\"\
    \ntry:\n    resp = requests.get(endpoint, timeout=10)\n    resp.raise_for_status()\n\
    \    payload = resp.json()\nexcept Exception as err:\n    sys.stderr.write(f\"\
    Failed to query NATS JetStream endpoint {endpoint}: {err}\\n\")\n    sys.exit(1)\n\
    \nstreams_list = payload.get(\"streams\", [])\nif not streams_list and \"account_details\"\
    \ in payload:\n    for acc in payload.get(\"account_details\", []):\n        streams_list.extend(acc.get(\"\
    streams\", []))\n\nnum_ack_pending = 0\nnum_waiting = 0\nfound = False\n\nfor\
    \ stream in streams_list:\n    if stream.get(\"name\") == stream_name:\n     \
    \   for consumer in stream.get(\"consumer_detail\", []):\n            if consumer.get(\"\
    name\") == consumer_name:\n                num_ack_pending = int(consumer.get(\"\
    num_ack_pending\", 0))\n                num_waiting = int(consumer.get(\"num_waiting\"\
    , 0))\n                found = True\n                break\n\nif not found:\n\
    \    sys.stderr.write(f\"Consumer '{consumer_name}' or stream '{stream_name}'\
    \ not found in NATS telemetry.\\n\")\n    sys.exit(1)\n\nKestra.outputs({\n  \
    \  \"num_ack_pending\": num_ack_pending,\n    \"num_waiting\": num_waiting\n})\n"
- id: evaluate_consumer_lag
  type: io.kestra.plugin.core.flow.If
  condition: '{{ outputs.query_consumer_info.vars.num_ack_pending > inputs.max_pending_ack
    }}'
  then:
  - id: notify_streaming_team
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: '{{ secret(''SLACK_WEBHOOK'') }}'
    payload: "{\n  \"channel\": \"#streaming-alerts\",\n  \"attachments\": [\n   \
      \ {\n      \"color\": \"danger\",\n      \"title\": \"\U0001F6A8 NATS JetStream\
      \ Consumer Ack Backlog Alert\",\n      \"text\": \"Consumer `{{ inputs.consumer_name\
      \ }}` on stream `{{ inputs.stream_name }}` has *{{ outputs.query_consumer_info.vars.num_ack_pending\
      \ }} unacknowledged pending messages* (threshold {{ inputs.max_pending_ack }})!\
      \ Consumer microservice instances are failing or processing tasks too slowly,\
      \ reaching `max_ack_pending` limits.\",\n      \"footer\": \"Kestra Streaming\
      \ Sentinel \u2022 NATS JetStream\"\n    }\n  ]\n}"
errors:
- id: alert_pipeline_failure
  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
  url: '{{ secret(''SLACK_WEBHOOK'') }}'
  payload: "{\n  \"channel\": \"#streaming-alerts\",\n  \"attachments\": [\n    {\n\
    \      \"color\": \"danger\",\n      \"title\": \"\u26A0\uFE0F NATS JetStream\
    \ Sentinel Failure\",\n      \"text\": \"Failed to query NATS JetStream monitoring\
    \ endpoint. Verify server address and port.\",\n      \"footer\": \"Kestra Workflow\
    \ Failure Sentinel\"\n    }\n  ]\n}\n"
triggers:
- id: periodic_schedule
  type: io.kestra.plugin.core.trigger.Schedule
  cron: '*/15 * * * *'
  disabled: true
extend:
  metaDescription: Monitors NATS JetStream stream consumers for unacknowledged pending
    message accumulation to prevent processing stalls.
  metaTitle: NATS JetStream Consumer Unacknowledged Pending Message Sentinel with
    Kestra
  title: NATS JetStream Consumer Unacknowledged Pending Message Sentinel
  shortDescription: Monitors NATS JetStream stream consumers for unacknowledged pending
    message accumulation to prevent processing stalls.
  description: '## How it works

    This workflow connects to the NATS HTTP monitoring interface (`/jsz`) to audit
    the `num_ack_pending` metric for target JetStream durable consumers. In NATS JetStream,
    consumers configure `max_ack_pending` (default 20,000) to control in-flight concurrency.
    When consumer worker instances encounter slow database calls, unhandled exceptions,
    or thread starvation, messages stay in the unacknowledged pending state. Once
    `max_ack_pending` is saturated, NATS stops delivering messages to the consumer
    group entirely. This workflow audits in-flight messages and alerts streaming engineers
    before delivery stalls.


    ## What you get

    - Real-time visibility into in-flight message processing backlogs in NATS JetStream.

    - Prevents stream consumer delivery freezing caused by unacknowledged limits.

    - Quantitative metrics on pending messages and waiting pull requests.


    ## Who it''s for

    - Event-Driven Architecture Specialists and NATS Platform Engineers.

    - SREs maintaining high-throughput messaging topologies.


    ## Why orchestrate this with Kestra

    - **Continuous Health Auditing**: Regularly polls NATS monitoring metrics without
    daemon agents.

    - **Native Command Execution**: Queries standard JSON endpoints with zero dependencies.

    - **Direct Incident Escalation**: Delivers structured notifications with stream
    and consumer names directly to Slack.


    ## Prerequisites

    - NATS Server with monitoring port enabled (default port `8222`).

    - Secret `SLACK_WEBHOOK` configured in Kestra.


    ## Quick start

    1. Import the blueprint.

    2. Input NATS monitoring URL, stream name, and consumer name.

    3. Run the workflow to inspect pending message counts.


    ## How to extend

    - Query stream storage byte utilization via `/jsz?streams=1`.

    - Automatically scale consumer worker deployment replicas in Kubernetes.


    ## Links

    - [NATS Server Monitoring Endpoint Documentation](https://docs.nats.io/running-a-nats-service/monitoring)

    - [Kestra Documentation](https://kestra.io/docs)

    '
  tags:
  - Data
  - Infrastructure
  subTags:
  - Realtime & Streaming
  - ELT & Data Landing
  ee: false
  demo: false
outputs:
- id: num_ack_pending
  type: INT
  value: '{{ outputs.query_consumer_info.vars.num_ack_pending }}'
- id: num_waiting
  type: INT
  value: '{{ outputs.query_consumer_info.vars.num_waiting }}'
