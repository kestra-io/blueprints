id: nats-jetstream-consumer-ack-pending-sentinel
namespace: company.streaming

inputs:
  - id: nats_monitor_url
    type: STRING
    defaults: "http://nats.internal:8222"
    description: Base URL of NATS server monitoring endpoint.
  - id: stream_name
    type: STRING
    description: JetStream stream name to audit.
  - id: consumer_name
    type: STRING
    description: JetStream consumer name to audit.
  - id: max_pending_ack
    type: INT
    defaults: 500
    description: "Maximum allowable unacknowledged pending messages before alerting (default 500)."

tasks:
  - id: query_consumer_info
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query NATS JetStream consumer info endpoint
        curl -s -f "{{ inputs.nats_monitor_url }}/jsz?streams=1&consumers=1" > /tmp/nats_telemetry.json
        
        NUM_ACK_PENDING=$(jq '[.account_details[]?.streams[]? | select(.name=="{{ inputs.stream_name }}") | .consumer_detail[]? | select(.name=="{{ inputs.consumer_name }}") | .num_ack_pending // 0] | add // 0' /tmp/nats_telemetry.json)
        NUM_WAITING=$(jq '[.account_details[]?.streams[]? | select(.name=="{{ inputs.stream_name }}") | .consumer_detail[]? | select(.name=="{{ inputs.consumer_name }}") | .num_waiting // 0] | add // 0' /tmp/nats_telemetry.json)
        
        echo "::set-output name=num_ack_pending::$NUM_ACK_PENDING::"
        echo "::set-output name=num_waiting::$NUM_WAITING::"

  - id: evaluate_consumer_lag
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_consumer_info.vars.num_ack_pending | int > inputs.max_pending_ack }}"
    then:
      - id: notify_streaming_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#streaming-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 NATS JetStream Consumer Ack Backlog Alert",
                "text": "Consumer `{{ inputs.consumer_name }}` on stream `{{ inputs.stream_name }}` has *{{ outputs.query_consumer_info.vars.num_ack_pending }} unacknowledged pending messages* (threshold {{ inputs.max_pending_ack }})! Consumer microservice instances are failing or processing tasks too slowly, reaching `max_ack_pending` limits.",
                "footer": "Kestra Streaming Sentinel • NATS JetStream"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#streaming-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ NATS JetStream Sentinel Failure",
            "text": "Failed to query NATS JetStream monitoring endpoint. Verify server address and port.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: NATS JetStream Consumer Unacknowledged Pending Message Sentinel
  shortDescription: Monitors NATS JetStream stream consumers for unacknowledged pending message accumulation to prevent processing stalls.
  description: |
    ## How it works
    This workflow connects to the NATS HTTP monitoring interface (`/jsz`) to audit the `num_ack_pending` metric for target JetStream durable consumers. In NATS JetStream, consumers configure `max_ack_pending` (default 20,000) to control in-flight concurrency. When consumer worker instances encounter slow database calls, unhandled exceptions, or thread starvation, messages stay in the unacknowledged pending state. Once `max_ack_pending` is saturated, NATS stops delivering messages to the consumer group entirely. This workflow audits in-flight messages and alerts streaming engineers before delivery stalls.

    ## What you get
    - Real-time visibility into in-flight message processing backlogs in NATS JetStream.
    - Prevents stream consumer delivery freezing caused by unacknowledged limits.
    - Quantitative metrics on pending messages and waiting pull requests.

    ## Who it's for
    - Event-Driven Architecture Specialists and NATS Platform Engineers.
    - SREs maintaining high-throughput messaging topologies.

    ## Why orchestrate this with Kestra
    - **Continuous Health Auditing**: Regularly polls NATS monitoring metrics without daemon agents.
    - **Native Command Execution**: Queries standard JSON endpoints with zero dependencies.
    - **Direct Incident Escalation**: Delivers structured notifications with stream and consumer names directly to Slack.

    ## Prerequisites
    - NATS Server with monitoring port enabled (default port `8222`).
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input NATS monitoring URL, stream name, and consumer name.
    3. Run the workflow to inspect pending message counts.

    ## How to extend
    - Query stream storage byte utilization via `/jsz?streams=1`.
    - Automatically scale consumer worker deployment replicas in Kubernetes.

    ## Links
    - [NATS Server Monitoring Endpoint Documentation](https://docs.nats.io/running-a-nats-service/monitoring)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Data
    - Infrastructure
  ee: false
  demo: false
