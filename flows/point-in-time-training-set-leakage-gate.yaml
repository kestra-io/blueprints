id: point-in-time-training-set-leakage-gate
namespace: company.team

inputs:
  - id: join_strategy
    type: SELECT
    displayName: Feature join strategy
    description: >
      ASOF takes each feature as it was known before the label cutoff, which is correct.
      LATEST takes the newest feature value whatever its time, the common mistake that
      leaks the future into training. Pick LATEST to watch the gate block it.
    values:
      - ASOF
      - LATEST
    defaults: ASOF

  - id: embargo_days
    type: INT
    displayName: Embargo (days)
    description: Features must be at least this many days older than the label time. A gap covers the delay between an event and the moment it is really available.
    defaults: 7

  - id: min_coverage
    type: FLOAT
    displayName: Minimum feature coverage
    description: Share of labels that must get a feature value. Labels with no feature history before their cutoff count against it.
    defaults: 0.95

  - id: max_leakage_lift
    type: FLOAT
    displayName: Max leakage lift
    description: >
      Largest allowed gap between the feature/label correlation of the published set and of a
      known-correct point-in-time set. A large gap means the set predicts the label with
      information from after the cutoff.
    defaults: 0.05

variables:
  dataset_path: ml/churn/training_set.parquet
  manifest_kv: churn_training_set_manifest

tasks:
  - id: build_and_audit
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: >
      Generate a churn dataset (labels with a cutoff time plus weekly feature snapshots that
      keep changing after the cutoff), build the training set with the chosen join, then
      audit it: rows whose feature is newer than the cutoff, duplicate labels, coverage, and
      how much more the feature correlates with the label than it does in a correct
      point-in-time set. Writes the candidate as Parquet.
    outputFiles:
      - training
    fetchType: FETCH_ONE
    sql: |
      SELECT setseed(0.42);

      -- Labels: churn is decided at a per-customer cutoff between June and August.
      CREATE TABLE labels AS
      SELECT customer_id,
             TIMESTAMP '2026-06-01' + to_days(CAST(floor(random() * 60) AS INTEGER)) AS label_time,
             random() < 0.25 AS churned
      FROM range(1, 2001) t(customer_id);

      -- Weekly feature snapshots from April to the end of August. Churned customers file a few
      -- more tickets before the cutoff (weak, real signal) and many cancellation tickets after
      -- it (strong signal that does not exist yet at prediction time).
      CREATE TABLE feature_snapshots AS
      SELECT l.customer_id,
             TIMESTAMP '2026-04-01' + to_days(CAST(w * 7 AS INTEGER)) AS feature_time,
             CAST(floor(random() * 3) AS INTEGER)
               + CASE
                   WHEN l.churned AND TIMESTAMP '2026-04-01' + to_days(CAST(w * 7 AS INTEGER)) >= l.label_time
                     THEN 4 + CAST(floor(random() * 3) AS INTEGER)
                   WHEN l.churned THEN CAST(floor(random() * 2) AS INTEGER)
                   ELSE 0
                 END AS open_tickets_30d
      FROM labels l, range(0, 22) w(w);

      -- The reference point-in-time set, always built, so any candidate can be compared to it.
      CREATE TABLE pit_reference AS
      SELECT l.customer_id, l.label_time, l.churned, f.feature_time, f.open_tickets_30d
      FROM labels l
      ASOF LEFT JOIN feature_snapshots f
        ON l.customer_id = f.customer_id
       AND f.feature_time <= l.label_time - to_days({{ inputs.embargo_days }});

      CREATE TABLE training AS
      {% if inputs.join_strategy == 'ASOF' %}
      SELECT * FROM pit_reference;
      {% else %}
      SELECT l.customer_id, l.label_time, l.churned, f.feature_time, f.open_tickets_30d
      FROM labels l
      LEFT JOIN (
        SELECT * FROM feature_snapshots
        QUALIFY row_number() OVER (PARTITION BY customer_id ORDER BY feature_time DESC) = 1
      ) f ON l.customer_id = f.customer_id;
      {% endif %}

      COPY training TO '{{ outputFiles.training }}' (FORMAT PARQUET);

      SELECT
        (SELECT count(*) FROM training) AS rows,
        (SELECT count(*) FROM training WHERE feature_time > label_time - to_days({{ inputs.embargo_days }})) AS leaked_rows,
        (SELECT count(*) - count(DISTINCT customer_id) FROM training) AS duplicate_labels,
        round((SELECT avg(CASE WHEN feature_time IS NULL THEN 0 ELSE 1 END) FROM training), 4) AS coverage,
        round((SELECT corr(open_tickets_30d, CAST(churned AS INTEGER)) FROM training), 4) AS candidate_corr,
        round((SELECT corr(open_tickets_30d, CAST(churned AS INTEGER)) FROM pit_reference), 4) AS reference_corr,
        (SELECT strftime(max(feature_time), '%Y-%m-%d') FROM training) AS newest_feature,
        (SELECT strftime(min(label_time), '%Y-%m-%d') FROM training) AS earliest_label;

  - id: audit
    type: io.kestra.plugin.core.output.OutputValues
    description: The audit row, plus the lift of the candidate correlation over the point-in-time reference.
    values:
      rows: "{{ (outputs.build_and_audit.outputs | last).row.rows }}"
      leaked_rows: "{{ (outputs.build_and_audit.outputs | last).row.leaked_rows }}"
      duplicate_labels: "{{ (outputs.build_and_audit.outputs | last).row.duplicate_labels }}"
      coverage: "{{ (outputs.build_and_audit.outputs | last).row.coverage }}"
      candidate_corr: "{{ (outputs.build_and_audit.outputs | last).row.candidate_corr }}"
      reference_corr: "{{ (outputs.build_and_audit.outputs | last).row.reference_corr }}"
      leakage_lift: "{{ ((outputs.build_and_audit.outputs | last).row.candidate_corr - (outputs.build_and_audit.outputs | last).row.reference_corr) | numberFormat('0.0000') }}"

  - id: log_audit
    type: io.kestra.plugin.core.log.Log
    message: >-
      {{ inputs.join_strategy }} training set: {{ outputs.audit.values.rows }} labels,
      {{ outputs.audit.values.leaked_rows }} rows with a feature newer than cutoff minus {{ inputs.embargo_days }} days,
      {{ outputs.audit.values.duplicate_labels }} duplicate labels, coverage {{ outputs.audit.values.coverage }}.
      Feature/label correlation {{ outputs.audit.values.candidate_corr }} vs {{ outputs.audit.values.reference_corr }}
      in the point-in-time reference (lift {{ outputs.audit.values.leakage_lift }}).

  - id: leakage_gate
    type: io.kestra.plugin.core.flow.If
    description: Publish only a set with no future rows, no duplicate labels, enough coverage and no correlation lift over the point-in-time reference.
    condition: >-
      {{ (outputs.audit.values.leaked_rows | number) == 0
      and (outputs.audit.values.duplicate_labels | number) == 0
      and (outputs.audit.values.coverage | number) >= inputs.min_coverage
      and (outputs.audit.values.leakage_lift | number) <= inputs.max_leakage_lift }}
    then:
      - id: publish_training_set
        type: io.kestra.plugin.core.namespace.UploadFiles
        description: The audited set is the only one a training job should read.
        namespace: "{{ flow.namespace }}"
        filesMap:
          "{{ vars.dataset_path }}": "{{ outputs.build_and_audit.outputFiles.training }}"

      - id: record_manifest
        type: io.kestra.plugin.core.kv.Set
        description: What was published and the audit it passed, for the training job and for lineage.
        key: "{{ vars.manifest_kv }}"
        kvType: JSON
        value: |
          {"path": "{{ vars.dataset_path }}", "join": "{{ inputs.join_strategy }}", "embargo_days": {{ inputs.embargo_days }},
           "rows": {{ outputs.audit.values.rows }}, "coverage": {{ outputs.audit.values.coverage }},
           "feature_label_corr": {{ outputs.audit.values.candidate_corr }}, "execution_id": "{{ execution.id }}"}
    else:
      - id: block_publication
        type: io.kestra.plugin.core.execution.Fail
        description: The set would teach the model information it will not have in production. Nothing is published.
        errorMessage: >-
          Leakage gate failed for the {{ inputs.join_strategy }} set: {{ outputs.audit.values.leaked_rows }} rows use a feature
          newer than the label cutoff, correlation {{ outputs.audit.values.candidate_corr }} vs
          {{ outputs.audit.values.reference_corr }} point-in-time (lift {{ outputs.audit.values.leakage_lift }}, max {{ inputs.max_leakage_lift }}),
          coverage {{ outputs.audit.values.coverage }} (min {{ inputs.min_coverage }}), {{ outputs.audit.values.duplicate_labels }} duplicate labels.

triggers:
  - id: nightly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Rebuild the training set every night before the training job.
    cron: "0 2 * * *"

extend:
  title: Build a point-in-time correct training set and block feature leakage
  metaTitle: Point-in-time correct ML training set with a leakage gate in Kestra
  shortDescription: Join features to labels as they were known at each label's cutoff with a DuckDB ASOF join, audit the set for future rows and correlation lift, then publish it or block it.
  metaDescription: Build ML training sets with DuckDB ASOF joins in Kestra, audit for future feature rows and correlation lift, publish only leak-free data.
  description: |
    The most common way to ship a model that looks great offline and fails in production is **feature leakage**: the training set uses a feature value from after the moment the prediction would have been made. A "join to the latest snapshot" does it silently. Every row looks fine, the model learns from the future, and nobody notices until live accuracy collapses.

    This flow builds the training set **point-in-time correct** with a DuckDB `ASOF JOIN`: each label gets the newest feature value that was known at least `embargo_days` before its cutoff. It then audits the result before anything is published:
    - **Future rows**: rows whose feature is newer than the label cutoff minus the embargo. This must be 0.
    - **Correlation lift**: how much more the feature correlates with the label than in a point-in-time reference set. Leakage shows up as an implausibly strong signal.
    - **Coverage** and **duplicate labels**.

    It runs with no setup and no network. DuckDB generates a churn dataset of 2,000 customers with weekly ticket snapshots that keep changing after each customer's cutoff, the way real feature tables do. Run it with `join_strategy: LATEST` to watch the gate block the leaky set: the feature/label correlation jumps from 0.23 to 0.92.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## How it works

    1. `build_and_audit` (`io.kestra.plugin.jdbc.duckdb.Queries`) does everything in one DuckDB session:
       - generates `labels` (customer, cutoff time, churned) and `feature_snapshots` (customer, snapshot time, `open_tickets_30d`),
       - builds `pit_reference` with `ASOF LEFT JOIN ... ON f.feature_time <= l.label_time - embargo`,
       - builds the candidate `training` set with the chosen strategy: `ASOF` (the reference) or `LATEST` (newest snapshot, the leaky pattern),
       - writes the candidate to Parquet and returns one audit row.
    2. `audit` (`io.kestra.plugin.core.output.OutputValues`) collects the numbers and computes the lift.
    3. `log_audit` prints the audit on every run.
    4. `leakage_gate` (`io.kestra.plugin.core.flow.If`) checks 0 future rows, 0 duplicate labels, coverage of at least `min_coverage` and lift of at most `max_leakage_lift`.
       - Pass: `publish_training_set` (`io.kestra.plugin.core.namespace.UploadFiles`) writes `ml/churn/training_set.parquet`, and `record_manifest` (`io.kestra.plugin.core.kv.Set`) stores what was published and its audit.
       - Fail: `block_publication` (`io.kestra.plugin.core.execution.Fail`) explains which check failed. Nothing is published.
    5. `nightly` (`io.kestra.plugin.core.trigger.Schedule`) rebuilds the set before the training job.

    ## Inputs

    - `join_strategy` (SELECT `ASOF` or `LATEST`, default `ASOF`).
    - `embargo_days` (INT, default `7`): minimum age of a feature at the label cutoff.
    - `min_coverage` (FLOAT, default `0.95`): share of labels that must have a feature.
    - `max_leakage_lift` (FLOAT, default `0.05`): allowed correlation gap to the point-in-time reference.

    ## Quick start

    | Run | Input | Result |
    |---|---|---|
    | 1 | defaults | Published: 2,000 labels, 0 future rows, coverage 1.0, correlation 0.2311 |
    | 2 | `join_strategy: LATEST` | Blocked: 2,000 future rows, correlation 0.9218 vs 0.2311 (lift 0.69) |
    | 3 | `embargo_days: 70` | Blocked: no leakage, but coverage 0.86. The earliest labels have no feature history that old |

    ## Expected outputs

    - `outputs.audit.values`: `rows`, `leaked_rows`, `duplicate_labels`, `coverage`, `candidate_corr`, `reference_corr`, `leakage_lift`.
    - Namespace file `ml/churn/training_set.parquet`.
    - KV `churn_training_set_manifest`: path, join, embargo, rows, coverage, correlation and execution id.

    ## Using it with your own data

    - Replace the two generator statements with `read_parquet()` on your label and feature tables, or attach Postgres or a lake with the DuckDB extensions.
    - Add one `ASOF LEFT JOIN` per feature table. Each one keeps its own `feature_time` column, so the future-rows check can cover all of them.
    - Write the published set to S3, GCS or Azure instead of namespace files.

    ## Links

    - DuckDB ASOF join: https://duckdb.org/docs/sql/query_syntax/from#as-of-joins
    - DuckDB plugin: https://kestra.io/plugins/plugin-jdbc-duckdb
    - Namespace files: https://kestra.io/docs/concepts/namespace-files
  tags:
    - AI
    - Data
  subTags:
    - Data Quality
  ee: false
  demo: true
