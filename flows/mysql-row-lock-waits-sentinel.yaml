id: mysql-row-lock-waits-sentinel
namespace: company.dataops

inputs:
  - id: mysql_host
    type: STRING
    defaults: mysql.internal
    description: Hostname of the MySQL database instance.
  - id: mysql_port
    type: INT
    defaults: 3306
    description: TCP port of the MySQL database instance.
  - id: mysql_database
    type: STRING
    defaults: mysql
    description: Database name to connect to.
  - id: mysql_username
    type: STRING
    defaults: kestra_monitor
    description: MySQL monitoring username.
  - id: max_current_row_lock_waits
    type: INT
    defaults: 5
    description: Maximum permissible concurrent row lock waits before alerting.

tasks:
  - id: query_row_lock_waits
    type: io.kestra.plugin.jdbc.mysql.Query
    url: "jdbc:mysql://{{ inputs.mysql_host }}:{{ inputs.mysql_port }}/{{ inputs.mysql_database }}"
    username: "{{ inputs.mysql_username }}"
    password: "{{ secret('MYSQL_PASSWORD') }}"
    sql: |
      SELECT 
        VARIABLE_NAME, 
        CAST(VARIABLE_VALUE AS UNSIGNED) AS METRIC_VALUE 
      FROM performance_schema.global_status 
      WHERE VARIABLE_NAME = 'Innodb_row_lock_current_waits';
    fetchType: FETCH_ONE

  - id: evaluate_row_locks
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_row_lock_waits.row.METRIC_VALUE > inputs.max_current_row_lock_waits }}"
    then:
      - id: alert_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":lock: *MySQL Row Lock Contention Alert*: Database {{ inputs.mysql_host }} has {{ outputs.query_row_lock_waits.row.METRIC_VALUE }} active transactions waiting on InnoDB row locks (threshold: {{ inputs.max_current_row_lock_waits }}). Immediate transaction inspection recommended."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *MySQL Sentinel Execution Failure*: Failed to query row lock metrics on {{ inputs.mysql_host }}."
      }

triggers:
  - id: scheduled_lock_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true

extend:
  title: MySQL InnoDB Row Lock Current Waits Contention Sentinel
  shortDescription: Audits MySQL InnoDB row lock waits to identify uncommitted blocking transactions, hot record contention, and impending lock timeouts.
  description: |
    ## How it works
    This sentinel connects to MySQL using the JDBC plugin to evaluate `Innodb_row_lock_current_waits` from `performance_schema.global_status`. It tracks active transactions blocked waiting for row locks, triggering immediate alerts when conflicting transactions stall downstream operations.

    ## What you get
    - Real-time detection of uncommitted blocking transactions and deadlocks.
    - Prevention of cascading lock wait timeout errors (`Lock wait timeout exceeded`).
    - Immediate Slack alerts indicating database host and current blocked transaction count.

    ## Who it's for
    - Database administrators and backend developers managing high-concurrency transactional databases.
    - SREs troubleshooting transactional bottlenecks and latency spikes.

    ## Why orchestrate this with Kestra
    Kestra runs scheduled operational checks with native database connectivity, automating infrastructure telemetry and alert dispatching without custom monitoring agents.

    ## Prerequisites
    - MySQL database instance with InnoDB storage engine.
    - Secrets `MYSQL_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure database host, port, and credentials.
    3. Run a manual execution to test row lock evaluation.

    ## How to extend
    - Query `sys.innodb_lock_waits` to extract the exact blocking SQL statement and blocking transaction ID.
    - Automatically dispatch thread kill signals for blocking transactions idle longer than 120 seconds.
    - Log lock wait spikes to an observability dashboard in Grafana or Datadog.

    ## Links
    - [Kestra MySQL Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-mysql)
    - [MySQL InnoDB Lock Waits](https://dev.mysql.com/doc/refman/8.0/en/innodb-locking-reads.html)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
