id: cassandra-compaction-partition-size-sentinel
namespace: company.team

inputs:
  - id: cassandra_metrics_url
    type: STRING
    defaults: "http://cassandra.internal:7070/metrics"
    description: Prometheus scrape endpoint for Cassandra JMX metrics exporter.

tasks:
  - id: scrape_cassandra_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Prometheus JMX exporter endpoint to extract Cassandra pending compaction tasks.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.cassandra_metrics_url }}"
    script: |
      import os
      import sys
      import re
      import requests
      from kestra import Kestra

      url = os.environ.get("METRICS_URL", "").rstrip("/")
      try:
          resp = requests.get(url, timeout=12)
          resp.raise_for_status()
      except Exception as err:
          print(f"CRITICAL: Failed to scrape Cassandra metrics from {url}: {err}", file=sys.stderr)
          sys.exit(1)

      pending = 0
      for line in resp.text.splitlines():
          if line.startswith("#") or not line.strip():
              continue
          if "org_apache_cassandra_metrics_compaction_pending_tasks" in line:
              match = re.search(r'([0-9\.]+)\s*$', line)
              if match:
                  pending = int(float(match.group(1)))
                  break

      print(f"Cassandra Compaction Audit: PendingTasks={pending}")
      Kestra.outputs({
          "pending_tasks": pending
      })

  - id: evaluate_compaction_lag
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.scrape_cassandra_metrics.vars.pending_tasks | int > 20 }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#dba-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Apache Cassandra Compaction Lag Alert",
                "text": "Cassandra node at `{{ inputs.cassandra_metrics_url }}` has *{{ outputs.scrape_cassandra_metrics.vars.pending_tasks }} pending compaction tasks*! SSTables are accumulating faster than disk compaction threads can merge them, leading to read latency spikes.",
                "footer": "Kestra Database Sentinel • Apache Cassandra"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#dba-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Cassandra Sentinel Failure",
            "text": "Failed to scrape Cassandra metrics endpoint. Verify JMX exporter port accessibility.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Apache Cassandra cluster metrics for oversized partition warnings and compaction backlog growth."
  metaTitle: Apache Cassandra SSTable Large Partition and Compaction Lag Sentinel with Kestra
  title: Apache Cassandra SSTable Large Partition and Compaction Lag Sentinel
  shortDescription: Audits Apache Cassandra cluster metrics for oversized partition warnings and compaction backlog growth.
  description: |
    ## How it works
    This workflow scrapes the Prometheus JMX exporter endpoint on Apache Cassandra nodes (default port `7070`) to audit `org_apache_cassandra_metrics_compaction_pending_tasks`. In Cassandra's LSM-tree architecture, writes append immediately to commitlogs and memtables, then flush to immutable SSTable files. Background compaction merges SSTables to discard tombstones and optimize reads. When pending compaction tasks backlog (> 20), read queries must scan dozens of SSTable files per partition key, drastically increasing p99 read latency. This workflow identifies compaction debt before read SLAs are violated.

    ## What you get
    - Real-time detection of SSTable compaction backlogs in Apache Cassandra.
    - Prevents read latency degradation and disk storage bloat.
    - Quantitative metrics on pending background compaction tasks.

    ## Who it's for
    - Cassandra DBAs and Distributed Database Engineers.
    - SREs maintaining high-throughput NoSQL clusters.

    ## Why orchestrate this with Kestra
    - **Continuous Health Auditing**: Periodically polls JMX metrics without local node agents.
    - **Proactive Latency Guard**: Flags SSTable sprawl before read requests timeout.
    - **Direct Team Alerts**: Delivers formatted incident alerts directly to database channels.

    ## Prerequisites
    - Apache Cassandra cluster running with JMX/Prometheus exporter enabled.
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input Cassandra metrics endpoint URL.
    3. Run the workflow to inspect compaction pending tasks.

    ## How to extend
    - Query `org_apache_cassandra_metrics_table_max_partition_size` to detect partition keys exceeding 100MB.
    - Dynamically increase `concurrent_compactors` via `nodetool setconcurrentcompactors`.

    ## Links
    - [Cassandra Compaction Metrics Documentation](https://cassandra.apache.org/doc/latest/cassandra/operating/metrics.html#compaction-metrics)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
