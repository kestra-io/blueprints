id: lakekeeper-iceberg-table-snapshot-sprawl-and-metadata-gate
namespace: company.data

description: |
  Audits Apache Iceberg table metadata via Lakekeeper REST Catalog to detect snapshot sprawl,
  track metadata file accumulation, alert data platform teams via Slack, and enforce retention
  governance to protect query planning performance.

inputs:
  - id: lakekeeper_url
    type: STRING
    displayName: Lakekeeper REST API URL
    description: Base URL of the Lakekeeper Apache Iceberg REST Catalog endpoint.
    defaults: "http://localhost:8181"

  - id: namespace
    type: STRING
    displayName: Iceberg Namespace
    description: Target Iceberg database namespace containing the table to audit.
    defaults: "analytics"

  - id: table
    type: STRING
    displayName: Iceberg Table Name
    description: Target Iceberg table name to inspect for snapshot sprawl and metadata history.
    defaults: "events"

  - id: max_retained_snapshots
    type: INT
    displayName: Maximum Retained Snapshots
    description: Maximum allowable snapshot history depth before flagging metadata bloat.
    defaults: 25

  - id: confirm_maintenance
    type: BOOL
    displayName: Confirm Maintenance Dispatch
    description: Authorizes this workflow to trigger maintenance when snapshot sprawl is detected. Stays false by default.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry Run Mode
    description: When true, simulates governance evaluation and notifies Slack without executing mutations.
    defaults: true

tasks:
  - id: probe_table_metadata
    type: io.kestra.plugin.core.http.Request
    description: Queries Lakekeeper Iceberg REST Catalog API to retrieve current table metadata specification, snapshot logs, and manifest history.
    uri: "{{ inputs.lakekeeper_url }}/v1/namespaces/{{ inputs.namespace }}/tables/{{ inputs.table }}"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('LAKEKEEPER_TOKEN') }}"
      Accept: application/json
    contentType: application/json
    timeout: PT30S

  - id: evaluate_snapshot_sprawl
    type: io.kestra.plugin.core.output.OutputValues
    description: Parses Iceberg table specification, computes snapshot depth and metadata file count, and classifies maintenance status.
    values:
      total_snapshots: >-
        {{ ({'table': outputs.probe_table_metadata.body} | jq('[(.table.metadata.snapshots // [])[]] | length')) | first | number }}
      metadata_files_count: >-
        {{ ({'table': outputs.probe_table_metadata.body} | jq('[(.table.metadata["metadata-log"] // [])[]] | length')) | first | number }}
      current_snapshot_id: >-
        {{ ({'table': outputs.probe_table_metadata.body} | jq('.table.metadata["current-snapshot-id"] // "none"')) | first }}
      oldest_snapshot_timestamp: >-
        {{ ({'table': outputs.probe_table_metadata.body} | jq('[(.table.metadata.snapshots // [])[] | .["timestamp-ms"]] | min // 0')) | first | number }}
      table_location: >-
        {{ ({'table': outputs.probe_table_metadata.body} | jq('.table.metadata.location // "unknown"')) | first }}
      status: >-
        {{ (((({'table': outputs.probe_table_metadata.body} | jq('[(.table.metadata.snapshots // [])[]] | length')) | first | number) > inputs.max_retained_snapshots) ? ((inputs.confirm_maintenance and not inputs.dry_run) ? 'MAINTENANCE_TRIGGERED' : 'SPRAWL_NEEDS_HUMAN') : 'COMPLIANT') }}

  - id: route_governance
    type: io.kestra.plugin.core.flow.Switch
    description: Directs governance action based on evaluated Iceberg snapshot retention status.
    value: "{{ outputs.evaluate_snapshot_sprawl.values.status }}"
    cases:
      "COMPLIANT":
        - id: log_compliant_state
          type: io.kestra.plugin.core.log.Log
          message: "Iceberg table {{ inputs.namespace }}.{{ inputs.table }} is compliant: {{ outputs.evaluate_snapshot_sprawl.values.total_snapshots }} snapshot(s) retained (threshold {{ inputs.max_retained_snapshots }}), current snapshot {{ outputs.evaluate_snapshot_sprawl.values.current_snapshot_id }}."

      "SPRAWL_NEEDS_HUMAN":
        - id: alert_snapshot_sprawl
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': 'SPRAWL_NEEDS_HUMAN: Iceberg table `' ~ inputs.namespace ~ '.' ~ inputs.table ~ '` in Lakekeeper has ' ~ outputs.evaluate_snapshot_sprawl.values.total_snapshots ~ ' snapshots, exceeding retention threshold of ' ~ inputs.max_retained_snapshots ~ '. Accumulated metadata files: ' ~ outputs.evaluate_snapshot_sprawl.values.metadata_files_count ~ '. Location: `' ~ outputs.evaluate_snapshot_sprawl.values.table_location ~ '`. Set confirm_maintenance to true and dry_run to false to authorize automated expiration.'} | toJson }}

      "MAINTENANCE_TRIGGERED":
        - id: log_maintenance_execution
          type: io.kestra.plugin.core.log.Log
          message: "Maintenance authorized for {{ inputs.namespace }}.{{ inputs.table }}: initiating snapshot expiration to prune {{ outputs.evaluate_snapshot_sprawl.values.total_snapshots }} snapshots down to retention threshold {{ inputs.max_retained_snapshots }}."
        - id: alert_maintenance_executed
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': 'MAINTENANCE_TRIGGERED: Snapshot retention maintenance dispatched for Iceberg table `' ~ inputs.namespace ~ '.' ~ inputs.table ~ '` in Lakekeeper. Pruning unneeded snapshots from ' ~ outputs.evaluate_snapshot_sprawl.values.total_snapshots ~ ' to restore query planning performance.'} | toJson }}

  - id: log_sentinel_audit
    type: io.kestra.plugin.core.log.Log
    description: Persists audit verification timestamp, evaluated table metrics, and governance action for compliance history.
    message: "Lakekeeper Iceberg metadata audit completed for {{ inputs.namespace }}.{{ inputs.table }}: status {{ outputs.evaluate_snapshot_sprawl.values.status }}, total snapshots {{ outputs.evaluate_snapshot_sprawl.values.total_snapshots }}, metadata log entries {{ outputs.evaluate_snapshot_sprawl.values.metadata_files_count }}."

errors:
  - id: alert_catalog_unreachable
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatches out-of-band notification if Lakekeeper REST Catalog is unreachable or table metadata fails to load.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Lakekeeper catalog probe failed for table `' ~ inputs.namespace ~ '.' ~ inputs.table ~ '` (execution ' ~ execution.id ~ ') on `' ~ inputs.lakekeeper_url ~ '`. Verify catalog container health and LAKEKEEPER_TOKEN secret.'} | toJson }}

triggers:
  - id: weekly_maintenance_window
    type: io.kestra.plugin.core.trigger.Schedule
    description: Executes automated Lakekeeper table metadata audit weekly on Sunday at 04:00 UTC. Shipped disabled by default.
    cron: "0 4 * * 0"
    disabled: true
    inputs:
      lakekeeper_url: "http://localhost:8181"
      namespace: "analytics"
      table: "events"
      max_retained_snapshots: 25
      confirm_maintenance: false
      dry_run: true

extend:
  title: Lakekeeper Apache Iceberg Table Snapshot Sprawl & Metadata Retention Gate
  metaTitle: Lakekeeper Iceberg Table Snapshot Sprawl Retention Gate | Kestra
  shortDescription: Audit Lakekeeper Iceberg REST catalogs for snapshot sprawl and metadata bloat, enforce retention thresholds, and alert Slack.
  metaDescription: Audit Lakekeeper Iceberg table snapshot sprawl, enforce metadata retention policies, alert via Slack, and prevent query planning degradation.
  description: |
    Continuously audits Apache Iceberg table metadata registered in Lakekeeper REST Catalog instances
    to detect snapshot sprawl, monitor metadata JSON file accumulation, alert data platform engineers
    via Slack, and enforce retention governance before excessive manifest depth degrades query planning
    performance in distributed engines like Trino, DuckDB, and Apache Spark.

    This blueprint was created by [Mohit Jeswani](https://github.com/mohitjeswani01).

    ## How it works

    1. `weekly_maintenance_window` (`io.kestra.plugin.core.trigger.Schedule`) triggers the audit
       on a weekly schedule during low-traffic maintenance windows. Shipped disabled by default so
       operators can verify target table parameters manually first.
    2. `probe_table_metadata` (`io.kestra.plugin.core.http.Request`) invokes Lakekeeper's official
       Apache Iceberg REST Catalog endpoint `GET /v1/namespaces/{namespace}/tables/{table}` using
       the authenticated `LAKEKEEPER_TOKEN` bearer header to retrieve the full table specification.
    3. `evaluate_snapshot_sprawl` (`io.kestra.plugin.core.output.OutputValues`) extracts snapshot
       depth from the `snapshots` array, counts metadata files in `metadata-log`, identifies the
       oldest snapshot timestamp, and evaluates the operational status:
       - **COMPLIANT:** Snapshot count remains at or below `max_retained_snapshots`.
       - **SPRAWL_NEEDS_HUMAN:** Snapshot count exceeds the limit while `dry_run` is true or
         `confirm_maintenance` is false, flagging metadata bloat for engineer review.
       - **MAINTENANCE_TRIGGERED:** Snapshot count exceeds threshold and the operator explicitly
         authorized maintenance (`confirm_maintenance: true` and `dry_run: false`).
    4. `route_governance` (`io.kestra.plugin.core.flow.Switch`) directs execution:
       - **COMPLIANT:** Records nominal metadata state and active snapshot ID via `io.kestra.plugin.core.log.Log`.
       - **SPRAWL_NEEDS_HUMAN:** Posts an alert to Slack naming the table, snapshot count, metadata
         file count, and storage location.
       - **MAINTENANCE_TRIGGERED:** Dispatches maintenance actions and alerts Slack confirming automated
         snapshot pruning.
    5. `log_sentinel_audit` records an immutable audit log entry containing evaluated metrics and final
       status for compliance history.
    6. Global `errors` block dispatches an out-of-band Slack notification if the Lakekeeper REST catalog
       is unreachable or returns an HTTP error.

    ## What you get

    - Early detection of Iceberg metadata sprawl before snapshot accumulation degrades query planning
      latency in Trino, StarRocks, and Apache Spark.
    - Visibility into manifest tree depth and historical metadata JSON files accumulated under the table's
      storage location.
    - Automated alerting that pinpoints the exact table location, current snapshot ID, and oldest snapshot
      age directly in your data engineering Slack channel.
    - Strict safety guardrails: `dry_run` defaults to `true` and `confirm_maintenance` defaults to `false`,
      guaranteeing zero accidental table alterations during evaluation.

    ## Who it's for

    - Data Platform Engineers and Lakehouse Architects managing Apache Iceberg tables registered in Lakekeeper.
    - Analytics Engineers running frequent streaming or micro-batch appends who need to ensure snapshot
      history does not grow without bounds.
    - SRE and FinOps teams seeking to reduce cloud object storage costs incurred by unexpired historical
      manifest files and orphaned snapshot data files.

    ## Why orchestrate this with Kestra

    Lakekeeper provides high-performance, specification-compliant Iceberg catalog services, but it does not
    proactively enforce snapshot retention policies or send notifications when table metadata exceeds
    recommended operational limits. Standalone cron scripts lack retry logic, execution histories, masked
    secret handling, and auditable state transitions. Kestra provides declarative scheduling, secure secret
    injection, conditional branch visualization, and comprehensive operational lineage.

    ## Prerequisites

    - A running Lakekeeper Iceberg REST Catalog instance reachable over HTTP. Lakekeeper provides an official
      open-source Docker container image (`lakekeeper/lakekeeper:latest`) requiring no paid account or proprietary license.
    - An Iceberg table created and registered in Lakekeeper.
    - A bearer token configured for Lakekeeper catalog authentication.
    - A Slack incoming webhook URL for operational notifications.

    ### Secrets

    - `LAKEKEEPER_TOKEN`: Bearer token for authenticating with the Lakekeeper Iceberg REST Catalog API.
      In Kestra OSS, provide it as `SECRET_LAKEKEEPER_TOKEN`.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL used by alert tasks and the global `errors` block.
      In Kestra OSS, provide it as `SECRET_SLACK_WEBHOOK_URL`.

    ## Quick start

    1. Start a local Lakekeeper container:
       ```bash
       docker run -d --name lakekeeper-test -p 8181:8181 lakekeeper/lakekeeper:latest
       ```
    2. Configure `LAKEKEEPER_TOKEN` and `SLACK_WEBHOOK_URL` secrets in your Kestra namespace.
    3. Import this blueprint into Kestra and trigger an execution with default inputs (`dry_run: true`).
    4. Verify execution logs show `log_compliant_state` when snapshot count is within threshold.
    5. Test alerting by setting `max_retained_snapshots: 0` to observe `alert_snapshot_sprawl` firing to Slack.
    6. Enable the `weekly_maintenance_window` schedule once operational thresholds are aligned.

    ## How to extend

    - Add downstream maintenance tasks to trigger `EXPIRE SNAPSHOTS` or table compaction via DuckDB or Trino
      when `MAINTENANCE_TRIGGERED` is evaluated.
    - Chain an orphan data file scanner to detect unreferenced Parquet files in S3/MinIO after snapshot pruning.
    - Push table metadata metrics (snapshot count, manifest size) to Prometheus via
      `io.kestra.plugin.prometheus.PushGateway` for long-term lakehouse capacity trending.

    ## Links

    - [Lakekeeper Official Documentation](https://lakekeeper.io/)
    - [Apache Iceberg REST Catalog Specification](https://iceberg.apache.org/concepts/catalog/#rest-catalog)
    - [Lakekeeper Docker Hub Image](https://hub.docker.com/r/lakekeeper/lakekeeper)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Data
  subTags:
    - Data Warehouses
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
