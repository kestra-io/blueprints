id: hts-import-duty-landed-cost-estimator
namespace: company.team

description: |
  Estimate US import duty and landed cost for purchase-order lines from the live Harmonized Tariff
  Schedule (USITC HTS REST API). One keyless search per distinct 8-digit subheading, rate text parsed
  into ad valorem, specific and compound duties, special-program and Column 2 rates, MPF and HMF,
  Chapter 98/99 references surfaced for review, and a KV snapshot that flags rate changes between runs.
  The estimate is not customs advice and does not apply Section 232, Section 301, IEEPA or other
  Chapter 99 measures unless you pass them per line as `additional_duty_pct`.

inputs:
  - id: po_lines
    type: JSON
    description: |
      SAMPLE purchase-order lines (synthetic, replace with your own or POST them to the webhook). Fields per line:
      `po`, `line`, `sku`, `hts` (8 or 10 digits, dots optional), `origin` (ISO 3166 alpha-2), optional `program`
      (HTS special program code such as `KR`, `MA`, `S`), `customs_value_usd`, `freight_usd`, `insurance_usd`,
      `quantity`, `unit` (`No.`, `kg`, `liters`, `doz.`), optional `net_kg`, optional `additional_duty_pct`.
    defaults: |
      [
        {"po": "PO-4471", "line": 1, "sku": "LAPTOP-14", "hts": "8471.30.0100", "origin": "CN", "customs_value_usd": 48000, "freight_usd": 900, "insurance_usd": 120, "quantity": 80, "unit": "No."},
        {"po": "PO-4471", "line": 2, "sku": "TSHIRT-COTTON-M", "hts": "6109.10.0012", "origin": "VN", "customs_value_usd": 15600, "freight_usd": 420, "insurance_usd": 40, "quantity": 1300, "unit": "doz."},
        {"po": "PO-4471", "line": 3, "sku": "CLEMENTINES", "hts": "0805.22.0000", "origin": "MA", "program": "MA", "customs_value_usd": 8200, "freight_usd": 1100, "insurance_usd": 25, "quantity": 18000, "unit": "kg"},
        {"po": "PO-4471", "line": 4, "sku": "MILK-POWDER", "hts": "0402.99.9000", "origin": "NZ", "customs_value_usd": 22000, "freight_usd": 760, "insurance_usd": 55, "quantity": 9000, "unit": "kg"},
        {"po": "PO-4471", "line": 5, "sku": "WINE-RED-750", "hts": "2204.21.5005", "origin": "FR", "customs_value_usd": 9600, "freight_usd": 380, "insurance_usd": 30, "quantity": 2250, "unit": "liters"},
        {"po": "PO-4471", "line": 6, "sku": "LI-ION-PACK", "hts": "8507.60.0010", "origin": "KR", "program": "KR", "customs_value_usd": 31000, "freight_usd": 650, "insurance_usd": 80, "quantity": 400, "unit": "No.", "net_kg": 2200},
        {"po": "PO-4471", "line": 7, "sku": "WATCH-GOLDPLATE", "hts": "9102.11.10", "origin": "CH", "customs_value_usd": 5400, "freight_usd": 60, "insurance_usd": 20, "quantity": 120, "unit": "No."},
        {"po": "PO-4471", "line": 8, "sku": "DOCK-USB-C", "hts": "8471.3", "origin": "CN", "customs_value_usd": 2400, "freight_usd": 40, "insurance_usd": 6, "quantity": 200, "unit": "No."}
      ]

  - id: transport_mode
    type: SELECT
    values: [ocean, air, truck]
    defaults: ocean
    description: Harbor Maintenance Fee (0.125% of value) applies to ocean shipments only.

  - id: mpf
    type: JSON
    defaults: '{"rate_pct": 0.3464, "min_usd": 33.58, "max_usd": 651.50}'
    description: Merchandise Processing Fee for one formal entry per run. Defaults are CBP's FY2026 values; CBP adjusts them every 1 October, so update them for the current fiscal year.

  - id: state_key
    type: STRING
    defaults: hts_rate_snapshot
    description: KV key holding the last seen rate text per subheading, used to flag rate changes.

triggers:
  - id: po_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('HTS_WEBHOOK_KEY') }}"
    description: "POST a JSON body with a po_lines array from the ERP or procurement tool when a PO is created or changed."

  - id: weekly_recheck
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * 1"
    description: Re-prices the default (standing) lines every Monday so a tariff revision shows up as a rate change.

tasks:
  - id: lines
    type: io.kestra.plugin.core.debug.Return
    description: PO lines from the webhook body when there is one, otherwise from the `po_lines` input.
    format: "{{ (trigger.body.po_lines ?? inputs.po_lines) | toJson }}"

  - id: previous_rates
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: lookup
    type: io.kestra.plugin.core.flow.Loop
    description: |
      One HTS search per distinct 8-digit subheading (10-digit statistical lines carry no rate; it sits on the
      8-digit line). Codes with fewer than 8 digits are skipped here and reported as INVALID.
    values: >-
      {{ fromJson(outputs.lines.value) | jq('[.[] | (.hts // "" | tostring | gsub("[^0-9]"; "")) | select(length == 8 or length == 10) | .[0:4] + "." + .[4:6] + "." + .[6:8]] | unique') | first | toJson }}
    concurrencyLimit: 2
    tasks:
      - id: search
        type: io.kestra.plugin.core.http.Request
        uri: "https://hts.usitc.gov/reststop/search?keyword={{ item.value }}"
        headers:
          User-Agent: "kestra-hts-landed-cost-estimator/1.0 (https://kestra.io)"
          Accept: application/json
        options:
          retryOnStatusCodes: [429, 500, 502, 503, 504]
          retry:
            type: exponential
            interval: PT5S
            maxInterval: PT1M
            maxAttempts: 4
    outputs:
      - id: code
        type: STRING
        value: "{{ item.value }}"
      - id: body
        type: STRING
        value: "{{ outputs.search.body }}"

  - id: estimate
    type: io.kestra.plugin.scripts.python.Script
    description: |
      Picks the rate line for each PO line, parses the rate text, computes duty, fees and landed cost, and diffs
      the rate text against the KV snapshot. Standard library only.
    containerImage: python:3.13-slim
    inputFiles:
      lines.json: "{{ outputs.lines.value }}"
      lookups.json: "{{ outputs.lookup.outputs | jq('[.[].outputs]') | first | toJson }}"
      previous.json: "{{ outputs.previous_rates.value ?? '{}' }}"
      mpf.json: "{{ inputs.mpf | toJson }}"
    env:
      TRANSPORT_MODE: "{{ inputs.transport_mode }}"
    outputFiles:
      - landed_cost.csv
      - rate_snapshot.json
    script: |
      import csv, json, os, re
      def load(name, empty):  # JSON inputs can arrive as a JSON-encoded string (webhook runs use raw defaults)
          v = json.loads(open(name, encoding="utf-8").read().strip() or empty)
          return json.loads(v or empty) if isinstance(v, str) else v
      lines, prev, mpf = load("lines.json", "[]"), load("previous.json", "{}"), load("mpf.json", "{}")
      results = {x["code"]: json.loads(x["body"] or "[]") for x in json.load(open("lookups.json", encoding="utf-8"))}
      mode = os.environ["TRANSPORT_MODE"]
      COLUMN2 = {"CU", "KP", "RU", "BY"}  # Column 2 countries (RU and BY since 2022)
      UNIT = {"kg": "kg", "liter": "liters", "doz.": "doz.", "each": "No."}
      digits = lambda s: re.sub(r"\D", "", s or "")

      def parse(rate):
          """Rate text -> (ad valorem %, [(amount USD, unit)]) or None if not machine-computable."""
          t = re.sub(r"\s+", " ", rate.replace("/ ", "/")).strip()
          if t.lower() == "free": return 0.0, []
          adv, spec = 0.0, []
          for term in t.split(" + "):
              m = re.fullmatch(r"([\d.]+)%", term)
              if m: adv += float(m[1]); continue
              m = re.fullmatch(r"(\$)?([\d.]+)(¢)?(?: ?/(kg|liter|doz\.)| each)", term)
              if not m or bool(m[1]) == bool(m[3]): return None
              spec.append((float(m[2]) / (1 if m[1] else 100), UNIT[m[4] or "each"]))
          return adv, spec

      def specials(text):
          """'Free (AU,BH) 2.8¢/liter (JO) See 9822.04.25 (AU)' -> {code: rate text}"""
          out = {}
          for rate, codes in re.findall(r"([^()]+?)\s*\(([^)]*)\)", re.sub(r"\s+", " ", text or "")):
              for c in codes.split(","):
                  out.setdefault(c.strip(), rate.strip())
          return out

      rows_out, snapshot, changes = [], dict(prev), []
      for ln in lines:
          d = digits(str(ln.get("hts", "")))
          r = {k: ln.get(k) for k in ("po", "line", "sku", "hts", "origin", "program")}
          r.update(status="OK", notes=[], rate_column="general", rate_text="", duty_usd=None, landed_cost_usd=None)
          value = float(ln.get("customs_value_usd") or 0)
          if len(d) not in (8, 10) or value <= 0:
              r.update(status="INVALID", notes=["HTS code must have 8 or 10 digits" if len(d) not in (8, 10) else "customs_value_usd must be > 0"])
              rows_out.append(r); continue
          code8 = f"{d[:4]}.{d[4:6]}.{d[6:8]}"
          hits = results.get(code8, [])
          rated = [h for h in hits if h.get("general") and digits(h["htsno"])[:8] == d[:8]]
          own = sorted([h for h in rated if d.startswith(digits(h["htsno"]))], key=lambda h: -len(digits(h["htsno"])))
          row = own[0] if own else (rated[0] if len(rated) == 1 else None)  # 8471.30.01.00: 8+2 digits on one line
          if row is None:
              r.update(status="NOT_FOUND", notes=[f"{code8} has no rate line in the current HTS"]); rows_out.append(r); continue
          if len(d) == 10 and not any(digits(h["htsno"]) == d for h in hits):
              r["notes"].append(f"statistical suffix {d[8:]} not in the HTS under {code8}")
          r["rate_line"] = row["htsno"]
          r["description"] = re.sub(r"<[^>]+>", "", row["description"])[:120]
          snapshot[code8] = {k: row.get(k) or "" for k in ("general", "special", "other")}
          if code8 in prev and prev[code8] != snapshot[code8]:
              changes.append({"code": code8, "before": prev[code8], "after": snapshot[code8]})
          rate = row["general"]
          origin, prog = (ln.get("origin") or "").upper(), (ln.get("program") or "").strip()
          if origin in COLUMN2:
              rate, r["rate_column"] = row.get("other") or rate, "column 2"
          elif prog:
              sp = specials(row.get("special"))
              if prog not in sp:
                  r["notes"].append(f"program {prog} not listed for this line, general rate used")
              elif sp[prog].startswith("See"):
                  r["notes"].append(f"program {prog}: {sp[prog]}, general rate used")
              else:
                  rate, r["rate_column"] = sp[prog], f"special ({prog})"
          r["rate_text"] = rate
          refs = sorted({h["htsno"] for h in hits if h["htsno"][:2] in ("98", "99")} |
                        {m for f in (row.get("footnotes") or []) for m in re.findall(r"9[89]\d\d\.\d\d(?:\.\d\d)?", f.get("value", ""))
                         if "general" in f.get("columns", []) or "desc" in f.get("columns", [])})
          if refs: r["notes"].append("Chapter 98/99 provisions cite this code, not applied: " + ", ".join(refs))
          for f in row.get("footnotes") or []:
              if "general" in f.get("columns", []) and not re.search(r"9[89]\d\d\.", f["value"]):
                  r["notes"].append(f["value"].strip())
          parsed = parse(rate)
          if parsed is None:
              r.update(status="UNSUPPORTED_RATE"); r["notes"].append("rate needs manual calculation"); rows_out.append(r); continue
          adv, spec = parsed
          qty = {"No.": None, "kg": ln.get("net_kg"), "liters": None, "doz.": None}
          qty[ln.get("unit")] = qty.get(ln.get("unit")) or ln.get("quantity")
          duty = value * adv / 100
          for amount, unit in spec:
              if not qty.get(unit):
                  r.update(status="MISSING_QUANTITY"); r["notes"].append(f"specific rate needs quantity in {unit}"); break
              duty += amount * float(qty[unit])
          if r["status"] != "OK": rows_out.append(r); continue
          extra = value * float(ln.get("additional_duty_pct") or 0) / 100
          r.update(customs_value_usd=value, duty_usd=round(duty, 2), additional_duty_usd=round(extra, 2),
                   freight_usd=float(ln.get("freight_usd") or 0), insurance_usd=float(ln.get("insurance_usd") or 0),
                   hmf_usd=round(value * 0.00125, 2) if mode == "ocean" else 0.0, quantity=ln.get("quantity"), unit=ln.get("unit"))
          if r["notes"]: r["status"] = "REVIEW"
          rows_out.append(r)

      priced = [r for r in rows_out if r["duty_usd"] is not None]
      total_value = sum(r["customs_value_usd"] for r in priced)
      mpf_total = min(max(total_value * mpf["rate_pct"] / 100, mpf["min_usd"]), mpf["max_usd"]) if total_value else 0
      for r in priced:
          r["mpf_usd"] = round(mpf_total * r["customs_value_usd"] / total_value, 2)
          r["landed_cost_usd"] = round(sum(r[k] for k in ("customs_value_usd", "duty_usd", "additional_duty_usd", "freight_usd", "insurance_usd", "hmf_usd", "mpf_usd")), 2)
          r["landed_per_unit_usd"] = round(r["landed_cost_usd"] / float(r["quantity"]), 4) if r.get("quantity") else None
          r["effective_duty_pct"] = round(100 * (r["duty_usd"] + r["additional_duty_usd"]) / r["customs_value_usd"], 2)

      cols = ["po", "line", "sku", "hts", "rate_line", "origin", "program", "status", "rate_column", "rate_text", "customs_value_usd",
              "duty_usd", "additional_duty_usd", "effective_duty_pct", "mpf_usd", "hmf_usd", "freight_usd", "insurance_usd",
              "landed_cost_usd", "quantity", "unit", "landed_per_unit_usd", "description", "notes"]
      with open("landed_cost.csv", "w", newline="", encoding="utf-8") as f:
          w = csv.DictWriter(f, fieldnames=cols, extrasaction="ignore"); w.writeheader()
          for r in rows_out: w.writerow({**r, "notes": " | ".join(r["notes"])})
      json.dump(snapshot, open("rate_snapshot.json", "w", encoding="utf-8"))

      attention = [r for r in rows_out if r["status"] != "OK"]
      for r in rows_out:
          print(f'{r["po"]}/{r["line"]} {r["sku"]} {r["status"]} {r["rate_column"]} "{r["rate_text"]}" duty={r["duty_usd"]} landed={r["landed_cost_usd"]} {" | ".join(r["notes"])}')
      text = f"*HTS landed cost estimate* ({len(rows_out)} lines, {mode}): value ${total_value:,.2f}, duty ${sum(r['duty_usd'] + r['additional_duty_usd'] for r in priced):,.2f}, landed ${sum(r['landed_cost_usd'] for r in priced):,.2f}"
      text += "".join(f"\n:rotating_light: rate change {c['code']}: general `{c['before']['general']}` -> `{c['after']['general']}`" for c in changes)
      text += "".join(f"\n- {r['po']}/{r['line']} {r['sku']} `{r['hts']}`: {r['status']} {'; '.join(r['notes'])}" for r in attention)
      text += "\n_Estimate only, not customs advice. Section 232/301/IEEPA and other Chapter 99 duties are not included unless set per line._"
      summary = {"lines": len(rows_out), "priced": len(priced), "attention": len(attention), "rate_changes": len(changes),
                 "baseline": not prev, "codes_looked_up": len(results), "total_value_usd": round(total_value, 2),
                 "total_duty_usd": round(sum(r["duty_usd"] + r["additional_duty_usd"] for r in priced), 2),
                 "mpf_usd": round(mpf_total, 2), "total_landed_usd": round(sum(r["landed_cost_usd"] for r in priced), 2)}
      print("::" + json.dumps({"outputs": {"summary": summary, "slack_text": text}}) + "::")

  - id: save_snapshot
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ read(outputs.estimate.outputFiles['rate_snapshot.json']) }}"

  - id: notify
    type: io.kestra.plugin.core.flow.If
    description: Slack only when a rate changed since the last snapshot or a line needs a human (unsupported rate, Chapter 99 reference, bad code).
    condition: "{{ outputs.estimate.vars.summary.rate_changes > 0 or outputs.estimate.vars.summary.attention > 0 }}"
    then:
      - id: slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: "{{ {'text': outputs.estimate.vars.slack_text} | toJson }}"
    else:
      - id: all_clear
        type: io.kestra.plugin.core.log.Log
        message: All lines priced from the HTS with no rate change and nothing to review.

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: "{{ outputs.estimate.vars.summary | toJson }}"

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.estimate.vars.summary }}"
  - id: landed_cost_csv
    type: FILE
    value: "{{ outputs.estimate.outputFiles['landed_cost.csv'] }}"

extend:
  title: Estimate US Import Duty and Landed Cost for PO Lines from the Live HTS
  metaTitle: HTS Import Duty and Landed Cost Estimator with USITC API | Kestra
  shortDescription: Look up each purchase-order line in the USITC Harmonized Tariff Schedule, compute ad valorem, specific and compound duty, MPF and HMF, and flag lines and rate changes that need a human.
  metaDescription: Price PO lines against the live USITC HTS. Ad valorem, specific and compound duty, FTA and Column 2 rates, MPF, HMF, landed cost CSV and rate-change alerts.
  description: |
    This flow prices each purchase-order line against the live Harmonized Tariff Schedule (USITC HTS REST API, keyless), writes a landed-cost CSV and flags subheadings whose rate changed since the last run. **The default PO lines are sample data; the rates come from the live API.** The result is an estimate, not customs advice. Section 232, Section 301, IEEPA and other Chapter 99 duties are **not** applied unless you set them per line in `additional_duty_pct`. The HTS lists them in Chapter 99 notes, not on the tariff lines.

    ## How it works

    1. `po_webhook` (Webhook) receives `{"po_lines": [...]}` from an ERP. `weekly_recheck` (Schedule) re-prices the standing lines in `po_lines`.
    2. `lookup` (Loop) sends one `reststop/search?keyword=XXXX.XX.XX` per distinct 8-digit subheading, with retries. Rates sit on the 8-digit line; 10-digit statistical lines have an empty `general` column.
    3. `estimate` (Python, standard library) picks the rate line (including 8471.30.01.00-style merged lines) and flags unknown statistical suffixes. It uses the special rate when the line's `program` (e.g. `KR`, `MA`) is listed, and Column 2 for CU, KP, RU and BY. It parses `Free`, `16.5%`, `1.9¢/kg`, `$1.03/kg`, `6.3¢/liter`, `44¢ each` and compounds like `46.3¢/kg + 14.9%`; watch-component, sugar-degree and proof-liter rates become `UNSUPPORTED_RATE`. MPF (rate, min, max) is charged per entry and split by value; HMF applies to ocean. Chapter 98/99 subheadings citing the code (quotas, 9902 suspensions) and excise footnotes are noted, not applied.
    4. `save_snapshot` (KV Set) stores the rate text per subheading. `notify` (If) posts to Slack when a rate changed or a line needs review.

    ## What you get

    - A CSV with rate line and column, duty, MPF, HMF, landed cost per line and per unit, effective duty rate, status (`OK`, `REVIEW`, `UNSUPPORTED_RATE`, `MISSING_QUANTITY`, `NOT_FOUND`, `INVALID`) and notes.
    - A rate-change alert after an HTS revision (the first run is the baseline).
    - Typos, unknown codes and specific rates without a quantity are reported, never priced as zero.

    ## Who it's for

    - Trade compliance analysts, procurement and FP&A teams, and engineers wiring tariff data into an ERP.

    ## Why orchestrate this with Kestra

    - One flow serves both the ERP webhook and the weekly re-price. Retries, KV state, secrets and outputs are declared in YAML, not hidden in a cron script.

    ## Prerequisites

    - Outbound HTTPS to `hts.usitc.gov` (no key) and a Docker task runner for `python:3.13-slim`.
    - Customs values in USD; quantities in the HTS unit (`No.`, `kg`, `liters`, `doz.`, or `net_kg`).

    ### Secrets

    - `HTS_WEBHOOK_KEY`: key in the webhook URL (required for the webhook trigger).
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook (optional; without it the result is in the logs and the CSV).

    ## Quick start

    1. Click **Execute** with the sample lines. Six lines are priced; the watch is `UNSUPPORTED_RATE` and `8471.3` is `INVALID`.
    2. Execute again: no rate change is reported.
    3. Update `mpf` to CBP's values for the current fiscal year, then POST real PO lines to the webhook.

    ## How to extend

    - Map origin and HTS chapter to the Section 301, 232 or IEEPA rate your broker confirms, and fill `additional_duty_pct` from it.
    - Write the CSV back to the ERP, or into DuckDB or a warehouse for margin reports.

    ## Links

    - [USITC HTS search](https://hts.usitc.gov/) and [USITC tariff information](https://www.usitc.gov/harmonized_tariff_information)
    - [CBP Merchandise Processing Fee](https://www.cbp.gov/trade/basic-import-export/user-fee-table)
    - [Loop](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop), [HTTP Request](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.request), [Python Script](https://kestra.io/plugins/plugin-script-python/io.kestra.plugin.scripts.python.script)
    - [Webhook trigger](https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.webhook), [Slack Incoming Webhook](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Business
  subTags:
    - Policy & Compliance
    - Reporting & Digests
  ee: false
  demo: false
