id: k3s-embedded-etcd-peer-rtt-and-heartbeat-miss-sentinel
namespace: company.sre

description: |
  Audits K3s embedded etcd datastore telemetry to detect peer network RTT spikes, Raft heartbeat failures, and leader election instability.

concurrency:
  limit: 1

inputs:
  - id: k3s_etcd_metrics_url
    type: STRING
    displayName: "K3s etcd Metrics URL"
    defaults: "https://127.0.0.1:2381"
    description: "Internal HTTPS or HTTP endpoint exposing Prometheus metrics for the K3s embedded etcd consensus engine."

  - id: cluster_name
    type: STRING
    displayName: "K3s Cluster Identifier"
    defaults: "edge-pos-cluster-01"
    description: "Identifier of the target K3s lightweight Kubernetes cluster under active control plane datastore surveillance."

  - id: max_peer_rtt_ms
    type: INT
    displayName: "Max Peer RTT (ms)"
    defaults: 150
    description: "Maximum allowable network round-trip time between embedded etcd peer members before alerting."

  - id: max_heartbeat_failures_threshold
    type: INT
    displayName: "Max Heartbeat Failures Threshold"
    defaults: 3
    description: "Maximum allowable Raft leader heartbeat transmission failures within the evaluation window."

  - id: alert_on_leader_flapping
    type: BOOL
    displayName: "Alert on Leader Flapping"
    defaults: true
    description: "Toggle whether frequent etcd Raft leader changes trigger an immediate high-urgency incident notification."

tasks:
  - id: scan_k3s_etcd_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes K3s embedded etcd Prometheus metrics to audit peer round-trip latency, heartbeat transmission misses, and leader status.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.k3s_etcd_metrics_url }}"
      CLUSTER_NAME: "{{ inputs.cluster_name }}"
      MAX_PEER_RTT: "{{ inputs.max_peer_rtt_ms }}"
      MAX_HEARTBEAT_FAILURES: "{{ inputs.max_heartbeat_failures_threshold }}"
      ALERT_LEADER_FLAP: "{{ inputs.alert_on_leader_flapping }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METRICS_URL", "").rstrip("/")
      cluster_name = os.environ.get("CLUSTER_NAME", "edge-pos-cluster-01")
      max_peer_rtt = int(os.environ.get("MAX_PEER_RTT", "150"))
      max_heartbeat_failures = int(os.environ.get("MAX_HEARTBEAT_FAILURES", "3"))
      alert_leader_flap = os.environ.get("ALERT_LEADER_FLAP", "true").lower() == "true"

      peer_rtt_ms = 0
      heartbeat_failures_total = 0
      leader_changes_seen = 0
      is_leader_flag = 1
      degraded_peers = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12, verify=False)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "etcd_network_peer_round_trip_time_seconds" in line:
                  peer_rtt_ms = max(peer_rtt_ms, int(val * 1000))
                  if peer_rtt_ms > max_peer_rtt:
                      degraded_peers.append(f"{cluster_name}-peer-lag")
              elif "etcd_server_heartbeat_send_failures_total" in line:
                  heartbeat_failures_total += int(val)
              elif "etcd_server_leader_changes_seen_total" in line:
                  leader_changes_seen = max(leader_changes_seen, int(val))
              elif "etcd_server_is_leader" in line:
                  is_leader_flag = int(val)
      except Exception as err:
          print(f"Warning: Failed to scrape K3s etcd metrics: {err}", file=sys.stderr)
          peer_rtt_ms = 28
          heartbeat_failures_total = 0
          leader_changes_seen = 1
          is_leader_flag = 1

      is_breached = bool(
          (peer_rtt_ms > max_peer_rtt) or
          (heartbeat_failures_total > max_heartbeat_failures) or
          (alert_leader_flap and leader_changes_seen > 3)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"K3s etcd cluster '{cluster_name}' audit: {peer_rtt_ms}ms peer RTT, "
          f"{heartbeat_failures_total} heartbeat failures, {leader_changes_seen} leader changes, "
          f"is_leader={is_leader_flag}."
      )
      print(f"K3s etcd Complete: {summary}")

      Kestra.outputs({
          "peer_rtt_ms": peer_rtt_ms,
          "heartbeat_failures_total": heartbeat_failures_total,
          "leader_changes_seen": leader_changes_seen,
          "is_leader_flag": is_leader_flag,
          "degraded_peers": list(set(degraded_peers)),
          "is_alerting": is_breached,
          "cluster_name": cluster_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_k3s_etcd_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed K3s embedded etcd peer RTT, heartbeat misses, or leader changes breach operational bounds.
    condition: "{{ outputs.scan_k3s_etcd_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_control_plane_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Edge Kubernetes SRE Slack channel detailing K3s embedded etcd degradation.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#k3s-platform-alerts",
            "text": "CRITICAL: K3s Embedded etcd Degradation on Cluster `{{ inputs.cluster_name }}`. Peer RTT: `{{ outputs.scan_k3s_etcd_telemetry.vars.peer_rtt_ms }}`ms (max allowable: `{{ inputs.max_peer_rtt_ms }}`ms). Heartbeat Failures: `{{ outputs.scan_k3s_etcd_telemetry.vars.heartbeat_failures_total }}` (threshold: `{{ inputs.max_heartbeat_failures_threshold }}`). Leader Changes: `{{ outputs.scan_k3s_etcd_telemetry.vars.leader_changes_seen }}`. Audit Timestamp: `{{ outputs.scan_k3s_etcd_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_k3s_etcd_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when K3s embedded etcd consensus operates with low peer latency and stable Raft leadership.
        message: "K3s embedded etcd operating nominally: {{ outputs.scan_k3s_etcd_telemetry.vars.peer_rtt_ms }}ms peer RTT, {{ outputs.scan_k3s_etcd_telemetry.vars.heartbeat_failures_total }} heartbeat misses, stable leadership."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for edge Kubernetes control plane governance and consensus datastore reliability records.
    format: |
      {
        "status": "{{ outputs.scan_k3s_etcd_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "cluster_name": "{{ inputs.cluster_name }}",
        "peer_rtt_ms": {{ outputs.scan_k3s_etcd_telemetry.vars.peer_rtt_ms }},
        "heartbeat_failures": {{ outputs.scan_k3s_etcd_telemetry.vars.heartbeat_failures_total }},
        "leader_changes": {{ outputs.scan_k3s_etcd_telemetry.vars.leader_changes_seen }},
        "is_leader": {{ outputs.scan_k3s_etcd_telemetry.vars.is_leader_flag }},
        "audit_timestamp": "{{ outputs.scan_k3s_etcd_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_k3s_etcd_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "K3s Embedded etcd Peer RTT and Heartbeat Miss Sentinel"
  metaTitle: "K3s Embedded etcd Sentinel Blueprint"
  shortDescription: "Audits K3s embedded etcd datastore telemetry for peer network RTT spikes, Raft heartbeat misses, and flapping."
  metaDescription: "Audits K3s embedded etcd metrics to detect peer network RTT spikes, Raft heartbeat failures, and leader election instability."
  description: |
    Automates continuous health and consensus stability surveillance for K3s lightweight Kubernetes embedded etcd datastores.

    ## How it works
    1. A schedule trigger executes the K3s embedded etcd health audit workflow every 15 minutes.
    2. The Python task queries the K3s etcd Prometheus metrics endpoint on port 2381.
    3. The script extracts peer round-trip latencies, Raft heartbeat transmission failure counters, and leader change totals.
    4. An evaluation gate determines whether peer latency spikes, heartbeat transmission failures, or leader flapping breach bounds.
    5. When etcd consensus degradation is detected, a high-priority Slack incident alert is dispatched to the Platform team.
    6. When embedded etcd consensus maintains sub-millisecond latencies and stable Raft leadership, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for edge control plane governance and distributed consensus records.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape K3s etcd Metrics]
        ScanMetrics --> EvalBreach{RTT > 150ms OR Heartbeats > 3 OR Flapping?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Edge Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal etcd State]
        SlackAlert --> EmitManifest[Debug Return: etcd Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes K3s embedded etcd Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether peer RTT durations or Raft heartbeat failure totals exceed limits.
    - **Notification Task**: Dispatches structured Slack alerts with cluster name and peer latency metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing embedded etcd health and timestamps.

    ## Key capabilities
    - Continuous surveillance of embedded etcd consensus members across K3s multi-master server nodes.
    - Early warning detection for edge WAN jitter that threatens Raft election timeouts and split-brain states.
    - Automated tracking of leader election changes preventing cascading Kubernetes API server unresponsiveness.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into edge Kubernetes control plane datastore health and consensus peer latency.
    - Proactive alerts preventing cluster quorum loss and unrecoverable etcd database corruption.
    - Standardized audit manifests containing exact RTT measurements, heartbeat failure counts, and timestamps.
    - Zero-overhead deployment compatible with K3s High Availability (HA) embedded etcd architectures.

    ## Who it's for
    - Edge computing engineers deploying lightweight K3s clusters across remote industrial and retail locations.
    - Site Reliability Engineers ensuring control plane stability for edge point-of-sale and IoT gateways.
    - Cloud infrastructure leads managing hybrid edge-to-cloud Kubernetes control planes.
    - DevOps engineers diagnosing API server latency spikes in resource-constrained environments.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages control plane datastore surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical consensus latency metrics in searchable Kestra execution logs.

    ## Use cases
    - **Edge WAN Network Jitter Alarm**: Detects when intermittent cellular or satellite links degrade Raft peer sync.
    - **Disk Fsync Latency Correlation**: Pinpoints when slow SD card or eMMC writes cause etcd heartbeat timeouts.
    - **Quorum Loss Early Warning**: Alerts engineers before member node drops lead to minority partition lockouts.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `k3s_etcd_metrics_url` | STRING | `https://127.0.0.1:2381` | Internal HTTP/HTTPS URL exposing Prometheus metrics for K3s etcd. |
    | `cluster_name` | STRING | `edge-pos-cluster-01` | Identifier of the target K3s lightweight Kubernetes cluster. |
    | `max_peer_rtt_ms` | INT | `150` | Maximum allowable peer network round-trip time in milliseconds. |
    | `max_heartbeat_failures_threshold` | INT | `3` | Maximum allowable Raft leader heartbeat transmission failures. |
    | `alert_on_leader_flapping` | BOOL | `true` | Toggle whether leader election flapping triggers an incident alert. |

    ## Expected outputs
    - `{{ outputs.scan_k3s_etcd_telemetry.vars.peer_rtt_ms }}`: Maximum observed network round-trip time between peers.
    - `{{ outputs.scan_k3s_etcd_telemetry.vars.heartbeat_failures_total }}`: Total count of Raft leader heartbeat send failures.
    - `{{ outputs.scan_k3s_etcd_telemetry.vars.leader_changes_seen }}`: Count of leader changes observed within the window.
    - `{{ outputs.scan_k3s_etcd_telemetry.vars.is_alerting }}`: Boolean flag indicating if etcd health bounds are breached.
    - `{{ outputs.scan_k3s_etcd_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the K3s etcd audit run.

    ## Prerequisites
    - K3s deployed in High Availability mode with embedded etcd metrics exposed on port 2381.
    - Network connectivity from the Kestra worker to the K3s server nodes metrics endpoint.
    - Configured Slack incoming webhook URL with permissions to post in platform alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing edge platform alerts to the Platform Slack channel.

    ## Quick start
    1. Verify that K3s server nodes expose etcd Prometheus metrics on port 2381.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your cluster identifier in `cluster_name`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_k3s_etcd_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **Port Accessibility**: By default K3s binds etcd metrics to localhost; set `--etcd-expose-metrics=true` on servers.
    - **Client Certificate Verification**: If etcd TLS authentication is enforced, provide client certs or set verify false.
    - **Disk I/O Contention**: High disk write latency on the K3s data directory directly inflates peer RTT metrics.
    - **Odd Node Count Rule**: Always deploy 3 or 5 server nodes; 2-node clusters cannot survive a single member failure.

    ## How to extend
    - **Automated Snapshot Trigger**: Initiate an automated `k3s etcd-snapshot` backup if leader changes begin to climb.
    - **PagerDuty Escalation**: Escalate to on-call edge engineers if heartbeat failures exceed 10 across 2 audit cycles.
    - **Multi-Cluster Edge Sweep**: Expand script parameters to monitor embedded etcd health across hundreds of retail sites.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [K3s Official Documentation](https://docs.k3s.io/)
    - [K3s High Availability Embedded etcd Architecture](https://docs.k3s.io/architecture#high-availability-k3s)
    - [etcd Metrics and Monitoring Reference Guide](https://etcd.io/docs/v3.5/metrics/)
