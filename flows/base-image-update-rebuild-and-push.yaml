id: base-image-update-rebuild-and-push
namespace: company.team
description: |
  Watch the digest of the base image your Dockerfile builds FROM (for example node:22-alpine) on Docker
  Hub. When the maintainers republish that tag, usually to ship OS and security patches, rebuild your
  image from Git with a fresh pull of the base, push it to your registry and tell the team in Slack.

inputs:
  - id: base_repository
    type: STRING
    displayName: Base image repository
    description: Docker Hub repository of the base image. Official images use the library/ prefix.
    defaults: library/node

  - id: base_tag
    type: STRING
    displayName: Base image tag
    description: The exact tag your Dockerfile uses in its FROM line.
    defaults: 22-alpine

  - id: git_url
    type: STRING
    displayName: Git repository
    description: Repository that contains your Dockerfile and build context.
    defaults: https://github.com/docker/welcome-to-docker

  - id: git_branch
    type: STRING
    displayName: Git branch
    defaults: main

  - id: dockerfile_path
    type: STRING
    displayName: Dockerfile path
    description: Path of the Dockerfile inside the repository. The repository root is the build context.
    defaults: Dockerfile

  - id: image
    type: STRING
    displayName: Image to push
    description: Image reference to build and push, without a tag. Pushed as latest and as a tag that names the base digest.
    defaults: ghcr.io/my-org/welcome-to-docker

tasks:
  - id: registry_token
    type: io.kestra.plugin.core.http.Request
    description: Anonymous pull token for the base repository on Docker Hub (no account needed).
    uri: "https://auth.docker.io/token?service=registry.docker.io&scope=repository:{{ inputs.base_repository }}:pull"
    method: GET

  - id: base_manifest
    type: io.kestra.plugin.core.http.Request
    description: HEAD request for the tag's manifest. Docker Hub does not count HEAD requests against the pull rate limit.
    uri: "https://registry-1.docker.io/v2/{{ inputs.base_repository }}/manifests/{{ inputs.base_tag }}"
    method: HEAD
    headers:
      Authorization: "Bearer {{ fromJson(outputs.registry_token.body).token }}"
      Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json

  - id: current
    type: io.kestra.plugin.core.output.OutputValues
    description: The current base digest, and the short form used in the image tag.
    values:
      digest: "{{ outputs.base_manifest.headers['docker-content-digest'] | first }}"
      short: "{{ outputs.base_manifest.headers['docker-content-digest'] | first | replace({'sha256:': ''}) | slice(0, 12) }}"

  - id: load_digest
    type: io.kestra.plugin.core.kv.Get
    description: The base image digest of the last successful build. Missing on the first run.
    key: "base_image_digest_{{ inputs.image | slugify }}"
    errorOnMissing: false

  - id: if_base_changed
    type: io.kestra.plugin.core.flow.If
    description: Rebuild only when the base tag points to a new digest. The first run records the digest without building.
    condition: "{{ (outputs.load_digest.value ?? '') != '' and (outputs.load_digest.value ?? '') != outputs.current.values.digest }}"
    then:
      - id: rebuild
        type: io.kestra.plugin.core.flow.WorkingDirectory
        description: Clone the source and build in the same working directory.
        tasks:
          - id: clone
            type: io.kestra.plugin.git.Clone
            description: Check out the Dockerfile and build context. Add username and password for a private repository.
            url: "{{ inputs.git_url }}"
            branch: "{{ inputs.git_branch }}"

          - id: build_and_push
            type: io.kestra.plugin.docker.cli.Build
            description: Build with a fresh pull of the base image, label the image with the base digest and push both tags.
            dockerfile: "{{ inputs.dockerfile_path }}"
            pull: true
            push: true
            tags:
              - "{{ inputs.image }}:latest"
              - "{{ inputs.image }}:base-{{ outputs.current.values.short }}"
            labels:
              org.opencontainers.image.base.name: "docker.io/{{ inputs.base_repository }}:{{ inputs.base_tag }}"
              org.opencontainers.image.base.digest: "{{ outputs.current.values.digest }}"
              org.opencontainers.image.source: "{{ inputs.git_url }}"
            credentials:
              registry: "{{ secret('REGISTRY_HOST') }}"
              username: "{{ secret('REGISTRY_USERNAME') }}"
              password: "{{ secret('REGISTRY_PASSWORD') }}"

      - id: notify_rebuilt
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Tell the team the image was rebuilt and why.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: |
          :whale: *{{ inputs.image }}* was rebuilt because `{{ inputs.base_repository | replace({'library/': ''}) }}:{{ inputs.base_tag }}` was republished.
          Base digest: `{{ outputs.load_digest.value | abbreviate(22) }}` -> `{{ outputs.current.values.digest | abbreviate(22) }}`
          Pushed `{{ inputs.image }}:latest` and `:base-{{ outputs.current.values.short }}` (image id `{{ outputs.build_and_push.imageId }}`) from {{ inputs.git_url }} ({{ inputs.git_branch }}).
          Roll it out to pick up the base image's patches.

  - id: remember_digest
    type: io.kestra.plugin.core.kv.Set
    description: Store the digest that was built. Runs after the push, so a failed build is retried on the next run.
    key: "base_image_digest_{{ inputs.image | slugify }}"
    overwrite: true
    value: "{{ outputs.current.values.digest }}"

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: A failed rebuild leaves the old, unpatched image in place, so say so.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: ":warning: Base image rebuild for {{ inputs.image }} failed in execution {{ execution.id }} ({{ flow.namespace }}.{{ flow.id }}). The image was not updated; the next run retries."

triggers:
  - id: every_six_hours
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check the base tag every six hours. Disabled until the secrets are set.
    cron: "0 */6 * * *"
    disabled: true

extend:
  title: Rebuild and Push Your Docker Image When Its Base Image Is Republished
  shortDescription: Watch the Docker Hub digest of your base image tag and, when it changes, rebuild your image from Git with the patched base, push it and notify Slack.
  metaTitle: Rebuild Docker Images on Base Image Updates with Kestra
  metaDescription: Detect when a Docker Hub base image tag such as node:22-alpine is republished, then rebuild your image from Git, push it and notify Slack.
  description: |
    Tags like `node:22-alpine` or `python:3.12-slim` are rebuilt by their maintainers every time
    the underlying OS packages get security fixes, but your own image only picks those fixes up
    when it is rebuilt. Images of quiet services can sit on a months-old base. This blueprint
    watches the digest behind your base tag on Docker Hub and, when the tag is republished,
    rebuilds your image from Git with a fresh pull of the base, pushes it and posts to Slack.

    ## How it works

    1. `registry_token` gets an anonymous pull token from Docker Hub (no account needed).
    2. `base_manifest` sends a HEAD request for the tag's manifest and reads the
       `Docker-Content-Digest` header (`current` keeps it, plus a 12-character short form). HEAD
       requests do not count against Docker Hub's pull rate limit.
    3. `load_digest` reads the base digest of the last build from the Kestra KV store.
    4. `if_base_changed` continues only when a digest was stored and the tag now points to a
       different one. The first run only records the current digest.
    5. `rebuild` (WorkingDirectory) clones the repository with `clone` and runs `build_and_push`,
       which builds with `pull: true` so the new base is used, adds the OCI
       `org.opencontainers.image.base.digest` label and pushes `latest` plus a `base-<digest>` tag.
    6. `notify_rebuilt` posts the old and new digests and the pushed tags to Slack.
    7. `remember_digest` stores the new digest, after the push.

    If the build or push fails, the digest is not stored, the `errors` branch posts to Slack and
    the next run tries again.

    ## Prerequisites

    - Docker available to the Kestra worker (the Docker socket mounted, as in the standard
      Kestra docker compose file), because `io.kestra.plugin.docker.cli.Build` talks to the Docker daemon.
    - A container registry you can push to (GHCR, Docker Hub, ECR, a self-hosted registry).
    - A Slack Incoming Webhook.

    ### Secrets

    - `REGISTRY_HOST`: registry to push to, for example `ghcr.io` or `https://index.docker.io/v1/`.
    - `REGISTRY_USERNAME` and `REGISTRY_PASSWORD`: push credentials. For GHCR, a GitHub token
      with the `write:packages` scope.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for rebuild notices and failures.

    In the open-source edition, secrets are environment variables on the Kestra container,
    prefixed with `SECRET_` and base64-encoded. See
    [how to manage secrets](https://kestra.io/docs/concepts/secret).

    ## Inputs

    - `base_repository` (STRING, default `library/node`) and `base_tag` (STRING, default `22-alpine`):
      the base image exactly as it appears in your `FROM` line. Official images use `library/`.
    - `git_url`, `git_branch` (STRING): where the Dockerfile lives. Public by default; add
      `username`/`password` to `clone` for a private repository.
    - `dockerfile_path` (STRING, default `Dockerfile`): relative to the repository root, which is the
      build context.
    - `image` (STRING): the image to push, without a tag.

    The defaults build Docker's public `welcome-to-docker` sample, which uses `node:22-alpine`.

    ## Quick start

    1. Add the secrets and set `image` to a repository you can push to.
    2. Execute the flow: the current base digest is recorded and nothing is built.
    3. Execute it again: still nothing to do until the maintainers republish the tag.
    4. Enable `every_six_hours`. To force a rebuild, set the KV entry `base_image_digest_<image>`
       to any other value and execute the flow.

    One flow checks one image. To watch several, add one `Schedule` trigger per image with its own
    `inputs`, or call this flow from a `Loop` with a `Subflow` task.

    ## Outputs

    - `{{ outputs.current.values.digest }}`: the current base digest.
    - `{{ outputs.build_and_push.imageId }}`: id of the rebuilt image.
    - KV entry `base_image_digest_<image>`: the base digest of the last successful build.

    ## Links

    - [Docker Registry HTTP API, manifests](https://distribution.github.io/distribution/spec/api/#pulling-an-image-manifest)
    - [Docker Hub pull rate limits](https://docs.docker.com/docker-hub/usage/pulls/)
    - [OCI image annotations](https://github.com/opencontainers/image-spec/blob/main/annotations.md)
    - [Kestra Docker Build task](https://kestra.io/plugins/plugin-docker/cli/io.kestra.plugin.docker.cli.build)
    - [Kestra Git Clone task](https://kestra.io/plugins/plugin-git/io.kestra.plugin.git.clone)
    - [Slack Incoming Webhook task](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)

    - This blueprint has been created by [StarKnightt](https://github.com/StarKnightt)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - CI/CD & Deployment
    - Day 2 Operations
  ee: false
  demo: false
