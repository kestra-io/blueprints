id: playwright-synthetic-login-journey-and-auth-session-gate
namespace: company.qa

inputs:
  - id: base_url
    type: STRING
    displayName: Web Application Base URL
    description: Base URL of the target web application to audit (e.g., https://app.example.com or http://localhost:8080).
    defaults: "https://example.com"

  - id: login_path
    type: STRING
    displayName: Login Path
    description: Relative path to the login entry point.
    defaults: "/login"

  - id: expected_dashboard_url
    type: STRING
    displayName: Expected Dashboard URL
    description: Expected page URL following successful authentication.
    defaults: "https://example.com/dashboard"

  - id: action_timeout_seconds
    type: INT
    displayName: Action Timeout (seconds)
    description: Maximum duration allowed for each individual Playwright action or assertion before failing.
    defaults: 15

  - id: enforce_gate
    type: BOOL
    displayName: Enforce Deployment Gate
    description: When true, halts execution on synthetic authentication failure to block deployment or promotion pipelines.
    defaults: true

triggers:
  - id: scheduled_journey_canary
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

tasks:
  - id: run_synthetic_login_journey
    type: io.kestra.plugin.playwright.Check
    description: Executes a headless browser synthetic journey navigating to login, submitting credentials, asserting post-auth URL, and capturing dashboard artifacts.
    allowFailed: true
    serverUrl: "{{ secret('PLAYWRIGHT_SERVER_URL') }}"
    baseUrl: "{{ inputs.base_url }}"
    actionTimeout: "PT{{ inputs.action_timeout_seconds }}S"
    actions:
      - action: NAVIGATE
        url: "{{ inputs.base_url ~ inputs.login_path }}"
      - action: WAIT_FOR
        selector: "input[name='username']"
      - action: FILL
        selector: "input[name='username']"
        value: "{{ secret('TEST_USER_USERNAME') }}"
      - action: FILL
        selector: "input[name='password']"
        value: "{{ secret('TEST_USER_PASSWORD') }}"
      - action: CLICK
        selector: "button[type='submit']"
      - action: WAIT_FOR
        selector: "[data-testid='dashboard-content']"
      - action: ASSERT_URL
        url: "{{ inputs.expected_dashboard_url }}"
      - action: ASSERT_VISIBLE
        selector: "[data-testid='dashboard-content']"
      - action: SCREENSHOT
        name: authenticated_session.png
        fullPage: true

  - id: evaluate_journey_outcome
    type: io.kestra.plugin.core.output.OutputValues
    description: Evaluates browser assertion outcomes, screenshot existence, and classifies the authentication journey health.
    values:
      journey_status: "{{ outputs.run_synthetic_login_journey is not defined or outputs.run_synthetic_login_journey.screenshots is not defined or outputs.run_synthetic_login_journey.screenshots['authenticated_session.png'] is not defined ? 'AUTH_FAILED' : 'HEALTHY' }}"
      screenshot_uri: "{{ outputs.run_synthetic_login_journey is defined and outputs.run_synthetic_login_journey.screenshots is defined ? (outputs.run_synthetic_login_journey.screenshots['authenticated_session.png'] ?? 'NONE') : 'NONE' }}"

  - id: route_journey_findings
    type: io.kestra.plugin.core.flow.If
    description: Evaluates the synthetic journey health to alert on authentication regression or log audit success.
    condition: "{{ outputs.evaluate_journey_outcome.values.journey_status == 'AUTH_FAILED' }}"
    then:
      - id: alert_auth_regression
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts QA, DevOps, and on-call engineers when synthetic login journey fails.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "attachments": [
              {
                "color": "#E53935",
                "title": "[ALERT] Synthetic Login Journey Assertion Failed",
                "text": "Headless Playwright authentication verification failed for `{{ inputs.base_url }}`.\n*Login Endpoint:* `{{ inputs.base_url ~ inputs.login_path }}`\n*Expected Dashboard:* `{{ inputs.expected_dashboard_url }}`\n*Journey Status:* `{{ outputs.evaluate_journey_outcome.values.journey_status }}`\n*Artifact Captured:* `{{ outputs.evaluate_journey_outcome.values.screenshot_uri }}`\nReview browser timeout logs and verify SSO/Identity provider availability.",
                "footer": "Kestra Sentinel | Playwright User Journey Gate"
              }
            ]
          }

      - id: gate_enforcement
        type: io.kestra.plugin.core.flow.If
        description: Enforces pipeline failure when enforce_gate is enabled.
        condition: "{{ inputs.enforce_gate }}"
        then:
          - id: fail_on_auth_failure
            type: io.kestra.plugin.core.execution.Fail
            description: Fails execution to halt downstream deployment or promotion steps.

    else:
      - id: log_successful_journey
        type: io.kestra.plugin.core.log.Log
        description: Records audit receipt of successful synthetic user authentication journey.
        message: "[OK] Synthetic user journey and authentication verified for '{{ inputs.base_url }}'. Dashboard artifact: {{ outputs.evaluate_journey_outcome.values.screenshot_uri }}."

extend:
  title: Playwright Synthetic Login Journey and Auth Session Gate
  metaTitle: Playwright Synthetic Login Journey and Auth Session Gate | Kestra
  shortDescription: Audits critical user login and authentication journeys using headless Playwright browser checks, asserting post-auth UI states and alerting on regression.
  metaDescription: Execute synthetic browser login journeys with headless Playwright, assert authenticated dashboard reachability, and alert Slack on frontend session failures.
  description: |
    Automate synthetic end-to-end user authentication journeys across web applications using headless Playwright, validating that login flows, credential submissions, session tokens, and post-authentication dashboards remain operational after every deployment.

    Traditional HTTP endpoint health checks only verify that an HTTP 200 response is returned by a web server. They completely miss client-side JavaScript bundle crashes, broken OAuth/SSO redirects, expired frontend API tokens, or CSS layout breakages that prevent real users from logging in. This blueprint orchestrates real browser automation via Kestra's official `io.kestra.plugin.playwright.Check` task. It drives headless Chromium to load the login page, fills credentials into form fields, triggers submission, asserts that the authenticated dashboard URL loads, verifies visible UI components, and captures full-page visual evidence into Kestra internal storage.

    ## How it works

    1. `scheduled_journey_canary` (`io.kestra.plugin.core.trigger.Schedule`) triggers synthetic browser verification runs every 15 minutes.
    2. `run_synthetic_login_journey` (`io.kestra.plugin.playwright.Check`) connects over WebSocket to a remote Playwright browser instance, sequentially executing `NAVIGATE`, `WAIT_FOR`, `FILL` (with masked secrets), `CLICK`, `ASSERT_URL`, `ASSERT_VISIBLE`, and `SCREENSHOT` actions.
    3. `evaluate_journey_outcome` (`io.kestra.plugin.core.output.OutputValues`) examines task outcomes and generated screenshot artifacts, classifying the session as `HEALTHY` or `AUTH_FAILED`.
    4. `route_journey_findings` (`io.kestra.plugin.core.flow.If`) evaluates the classified outcome:
       - If authentication or assertion failed, `alert_auth_regression` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches a high-priority alert to Slack with endpoint details and failure context.
       - If `enforce_gate` is enabled, `fail_on_auth_failure` (`io.kestra.plugin.core.execution.Fail`) marks the execution failed to block downstream deployment pipelines.
       - If successful, `log_successful_journey` (`io.kestra.plugin.core.log.Log`) writes the dashboard screenshot artifact URI to the execution audit log.

    ## What you get

    - True end-to-end browser verification of mission-critical user authentication and session creation flows.
    - Automatic capture of authenticated full-page screenshots stored in Kestra internal storage for visual auditability.
    - Immediate Slack alerting on frontend regressions, expired certificates, broken identity providers, or failed selectors.
    - A strict deployment quality gate that halts continuous delivery pipelines before broken login flows reach production users.

    ## Who it's for

    - QA Automation and Quality Engineers maintaining continuous smoke testing and regression suites.
    - DevOps and Platform Engineers validating frontend availability following blue/green or canary deployments.
    - Site Reliability Engineers (SREs) monitoring critical customer authentication paths for synthetic availability SLAs.

    ## Why orchestrate this with Kestra

    - **Remote Browser Decoupling**: Browser execution runs against dedicated Playwright container instances, keeping heavy Chromium memory footprints isolated from Kestra workers.
    - **Native Secret Protection**: Sensitive credentials passed into form fields via `{{ secret('TEST_USER_PASSWORD') }}` are rendered dynamically and masked from logs.
    - **Storage Integration**: Screenshots and failure traces are automatically indexed in Kestra internal storage and accessible through execution artifacts.
    - **Unified Deployment Gates**: Embed browser smoke tests as subflows directly inside existing CI/CD orchestration workflows.

    ## Prerequisites

    - A running Playwright server reachable over WebSocket (`ws://` or `wss://`), launchable via Docker:
      ```bash
      docker run --rm -p 3000:3000 mcr.microsoft.com/playwright:v1.63.0-noble npx -y playwright@1.63.0 run-server --port 3000 --host 0.0.0.0
      ```
    - A dedicated test user account with stable credentials in your target web application.
    - A Slack incoming webhook URL for incident alerting.

    ### Secrets

    - `PLAYWRIGHT_SERVER_URL`: The WebSocket endpoint of the Playwright server (e.g., `ws://playwright:3000/` or `wss://playwright.internal/`).
    - `TEST_USER_USERNAME`: The username or email address for the synthetic test account.
    - `TEST_USER_PASSWORD`: The password for the synthetic test account (masked in all task logs).
    - `SLACK_WEBHOOK_URL`: The Slack incoming webhook URL for frontend regression alerts.

    ## Quick start

    1. Deploy the Playwright server container using the standard `mcr.microsoft.com/playwright:v1.63.0-noble` image.
    2. Configure namespace secrets `PLAYWRIGHT_SERVER_URL`, `TEST_USER_USERNAME`, `TEST_USER_PASSWORD`, and `SLACK_WEBHOOK_URL`.
    3. Import this blueprint into your Kestra instance under namespace `company.qa`.
    4. Adjust `base_url`, `login_path`, and `expected_dashboard_url` to match your application's routes, then click **Execute**.
    5. Review the captured `authenticated_session.png` screenshot artifact in the execution outputs tab.

    ## How to extend

    - **Multi-Factor Authentication (MFA) Verification**: Extend the `actions` array with TOTP token generation tasks or bypass headers for staging environments.
    - **Visual Regression Baseline**: Compare captured screenshots against an approved baseline image using Python image-diffing scripts.
    - **Multi-Browser Testing**: Parameterize the `browser` property across `CHROMIUM`, `FIREFOX`, and `WEBKIT` matrices to verify cross-browser compatibility.

    ## Links

    - [Kestra Playwright Plugin Documentation](https://kestra.io/plugins/plugin-playwright)
    - [Playwright Official Documentation](https://playwright.dev/)
    - [Kestra Slack Notifications Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
  subTags:
    - Approval Gates
    - Monitoring & Alerting
  ee: false
  demo: false
