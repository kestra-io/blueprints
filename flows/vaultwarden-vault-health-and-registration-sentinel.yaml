id: vaultwarden-vault-health-and-registration-sentinel
namespace: company.team

description: |
  Continuously monitors self-hosted Vaultwarden password vault instances by probing web server liveness endpoints, auditing API clock synchronization timestamps, verifying public registration security policies, classifying operational posture, routing real-time Slack security alerts, and logging compliance audit records.

inputs:
  - id: vaultwarden_host
    type: STRING
    displayName: Vaultwarden Host
    description: Hostname or IP address of the Vaultwarden instance reachable by the Kestra worker.
    defaults: "localhost"

  - id: vaultwarden_port
    type: INT
    displayName: Vaultwarden Port
    description: HTTP port of the Vaultwarden service (defaults to 80).
    defaults: 80

  - id: vaultwarden_scheme
    type: STRING
    displayName: Protocol Scheme
    description: URI protocol scheme (http or https).
    defaults: "http"

  - id: enforce_signups_disabled
    type: BOOL
    displayName: Enforce Signups Disabled
    description: When true, triggers a security violation alert if public account registration is enabled on the vault.
    defaults: true

tasks:
  - id: probe_alive_endpoint
    type: io.kestra.plugin.core.http.Request
    description: Queries Vaultwarden /alive endpoint to verify core HTTP server liveness and container responsiveness.
    uri: "{{ inputs.vaultwarden_scheme }}://{{ inputs.vaultwarden_host }}:{{ inputs.vaultwarden_port }}/alive"
    method: GET
    options:
      allowFailed: true
    allowFailure: true

  - id: probe_api_alive_endpoint
    type: io.kestra.plugin.core.http.Request
    description: Queries Vaultwarden /api/alive endpoint to verify API engine liveness and extract server UTC timestamp for clock synchronization auditing.
    uri: "{{ inputs.vaultwarden_scheme }}://{{ inputs.vaultwarden_host }}:{{ inputs.vaultwarden_port }}/api/alive"
    method: GET
    headers:
      Accept: "application/json"
    options:
      allowFailed: true
    allowFailure: true

  - id: probe_vault_config
    type: io.kestra.plugin.core.http.Request
    description: Queries Vaultwarden /api/config to inspect public vault settings and audit the signups_allowed security posture.
    uri: "{{ inputs.vaultwarden_scheme }}://{{ inputs.vaultwarden_host }}:{{ inputs.vaultwarden_port }}/api/config"
    method: GET
    headers:
      Accept: "application/json"
    options:
      allowFailed: true
    allowFailure: true

  - id: classify_vault_posture
    type: io.kestra.plugin.core.debug.Return
    description: Evaluates HTTP status codes across liveness, clock sync, and config probes to classify vault operational and security posture.
    format: |
      {{ outputs.probe_alive_endpoint.code is not defined or outputs.probe_api_alive_endpoint.code is not defined ? 'INSTANCE_UNREACHABLE' : (outputs.probe_alive_endpoint.code != 200 or outputs.probe_api_alive_endpoint.code != 200 ? 'API_ENGINE_UNHEALTHY' : (outputs.probe_vault_config.code != 200 ? 'VAULT_CONFIG_UNAVAILABLE' : (inputs.enforce_signups_disabled and (((outputs.probe_vault_config.body | json | jq('.signups_allowed') | first) ?? false) == true) ? 'SIGNUPS_POLICY_VIOLATION' : 'HEALTHY_COMPLIANT'))) }}

  - id: route_by_posture
    type: io.kestra.plugin.core.flow.Switch
    description: Routes alerts and logs based on the classified Vaultwarden operational and security posture.
    value: "{{ outputs.classify_vault_posture.value }}"
    cases:
      "HEALTHY_COMPLIANT":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "Vaultwarden vault at {{ inputs.vaultwarden_scheme }}://{{ inputs.vaultwarden_host }}:{{ inputs.vaultwarden_port }} is HEALTHY_COMPLIANT. /alive status: {{ outputs.probe_alive_endpoint.code }}. /api/alive status: {{ outputs.probe_api_alive_endpoint.code }} (server time: {{ outputs.probe_api_alive_endpoint.body ?? 'N/A' }}). Config status: {{ outputs.probe_vault_config.code }} (signups_allowed: {{ outputs.probe_vault_config.body | json | jq('.signups_allowed') | first ?? false }})."

      "SIGNUPS_POLICY_VIOLATION":
        - id: alert_signups_violation_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {"text": "Vaultwarden Sentinel SECURITY VIOLATION: Public account registration is ENABLED on " ~ inputs.vaultwarden_host ~ ":" ~ inputs.vaultwarden_port ~ "! /api/config returned 'signups_allowed: true'. Unauthorized users can create accounts on the corporate password vault! Set SIGNUPS_ALLOWED=false immediately. Execution: " ~ execution.id ~ "."} | toJson }}

        - id: log_signups_violation
          type: io.kestra.plugin.core.log.Log
          message: "CRITICAL SECURITY POLICY BREACH: Vaultwarden public signups are enabled on {{ inputs.vaultwarden_host }}."

      "VAULT_CONFIG_UNAVAILABLE":
        - id: alert_config_unavailable_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {"text": "Vaultwarden Sentinel WARNING: Vault configuration endpoint unavailable on " ~ inputs.vaultwarden_host ~ ":" ~ inputs.vaultwarden_port ~ "! /api/config returned HTTP " ~ (outputs.probe_vault_config.code ?? 'NONE') ~ ". Internal database lock or configuration parse failure. Execution: " ~ execution.id ~ "."} | toJson }}

        - id: log_config_unavailable
          type: io.kestra.plugin.core.log.Log
          message: "WARNING: Vaultwarden /api/config returned non-200 code: {{ outputs.probe_vault_config.code }}."

      "API_ENGINE_UNHEALTHY":
        - id: alert_api_unhealthy_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {"text": "Vaultwarden Sentinel CRITICAL: API engine unhealthy on " ~ inputs.vaultwarden_host ~ ":" ~ inputs.vaultwarden_port ~ "! /alive code: " ~ (outputs.probe_alive_endpoint.code ?? 'NONE') ~ ", /api/alive code: " ~ (outputs.probe_api_alive_endpoint.code ?? 'NONE') ~ ". Vault client synchronization and credential lookups blocked! Execution: " ~ execution.id ~ "."} | toJson }}

        - id: log_api_unhealthy
          type: io.kestra.plugin.core.log.Log
          message: "CRITICAL: Vaultwarden /alive or /api/alive returned non-200 code."

      "INSTANCE_UNREACHABLE":
        - id: alert_unreachable_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {"text": "Vaultwarden Sentinel OUTAGE: Cannot reach password vault at " ~ inputs.vaultwarden_scheme ~ "://" ~ inputs.vaultwarden_host ~ ":" ~ inputs.vaultwarden_port ~ ". Container offline, network partitioned, or reverse-proxy connection refused. ALL EMPLOYEES BLOCKED FROM CREDENTIAL VAULTS! Execution: " ~ execution.id ~ "."} | toJson }}

        - id: log_unreachable
          type: io.kestra.plugin.core.log.Log
          message: "OUTAGE: Vaultwarden instance unreachable at {{ inputs.vaultwarden_scheme }}://{{ inputs.vaultwarden_host }}:{{ inputs.vaultwarden_port }}."

  - id: audit_summary
    type: io.kestra.plugin.core.output.OutputValues
    description: Exports structured telemetry attributes and endpoint verification metrics for compliance audit reporting.
    values:
      target_instance: "{{ inputs.vaultwarden_scheme }}://{{ inputs.vaultwarden_host }}:{{ inputs.vaultwarden_port }}"
      alive_http_code: "{{ outputs.probe_alive_endpoint.code ?? 0 }}"
      api_alive_code: "{{ outputs.probe_api_alive_endpoint.code ?? 0 }}"
      server_timestamp: "{{ outputs.probe_api_alive_endpoint.body ?? 'NONE' }}"
      config_http_code: "{{ outputs.probe_vault_config.code ?? 0 }}"
      signups_allowed: "{{ outputs.probe_vault_config.body | json | jq('.signups_allowed') | first ?? false }}"
      vault_posture: "{{ outputs.classify_vault_posture.value }}"

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts on unexpected workflow runtime execution failure.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {"text": "Vaultwarden Sentinel workflow failed unexpectedly during execution " ~ execution.id ~ " in namespace " ~ flow.namespace ~ "."} | toJson }}

triggers:
  - id: hourly_canary
    type: io.kestra.plugin.core.trigger.Schedule
    description: Executes automated Vaultwarden health, clock synchronization, and signup policy audit at the top of every hour. Shipped disabled.
    cron: "0 * * * *"
    disabled: true
    inputs:
      vaultwarden_host: "localhost"
      vaultwarden_port: 80
      vaultwarden_scheme: "http"
      enforce_signups_disabled: true

extend:
  title: Vaultwarden Password Vault Health, Clock Sync, and Registration Policy Sentinel
  metaTitle: Vaultwarden Password Vault Health, Clock Sync, and Registration Policy Sentinel | Kestra
  shortDescription: Continuous health, server clock synchronization, and signup policy monitoring for self-hosted Vaultwarden password vaults.
  metaDescription: Audit Vaultwarden password vault health, validate server clock sync and signup security policies, classify operational posture, and alert Slack via Kestra.
  description: |
    Continuously audits self-hosted Vaultwarden password vault instances by probing web server liveness endpoints, auditing API clock synchronization timestamps, validating public registration security policies, classifying operational posture, and dispatching real-time incident escalation alerts to Slack.

    This blueprint was created by [Mohit Jeswani](https://github.com/mohitjeswani01).

    ## How it works

    1. `probe_alive_endpoint` (`io.kestra.plugin.core.http.Request`) queries `/alive` to verify that the Vaultwarden Rust web server process is responsive and accepting HTTP requests.
    2. `probe_api_alive_endpoint` (`io.kestra.plugin.core.http.Request`) queries `/api/alive` to extract the server's UTC ISO timestamp, validating that the API engine is operational and that clock drift does not cause TOTP or WebAuthn cryptographic failures.
    3. `probe_vault_config` (`io.kestra.plugin.core.http.Request`) queries `/api/config` to verify that public vault configuration metadata is accessible and that the `signups_allowed` setting matches corporate security policy.
    4. `classify_vault_posture` (`io.kestra.plugin.core.debug.Return`) evaluates endpoint response codes and JSON attributes using a declarative Pebble expression:
       - Classifies as `INSTANCE_UNREACHABLE` if endpoints cannot be reached over the network.
       - Classifies as `API_ENGINE_UNHEALTHY` if `/alive` or `/api/alive` return non-200 status codes.
       - Classifies as `VAULT_CONFIG_UNAVAILABLE` if `/api/config` fails (indicates configuration lock or database migration issues).
       - Classifies as `SIGNUPS_POLICY_VIOLATION` if `enforce_signups_disabled` is true and `signups_allowed` is true (exposes corporate vaults to unauthorized registrations).
       - Classifies as `HEALTHY_COMPLIANT` when all probes succeed and registration policies are enforced.
    5. `route_by_posture` (`io.kestra.plugin.core.flow.Switch`) routes execution based on the classification:
       - `HEALTHY_COMPLIANT`: Logs successful audit confirmation with server time and configuration attributes.
       - `SIGNUPS_POLICY_VIOLATION`: Dispatches an urgent security incident alert to Slack notifying SecOps that public registrations are enabled.
       - `VAULT_CONFIG_UNAVAILABLE`: Alerts Slack that vault configuration is failing.
       - `API_ENGINE_UNHEALTHY` / `INSTANCE_UNREACHABLE`: Dispatches critical outage notifications warning that all employees and CI/CD pipelines are locked out of credential vaults.
    6. `audit_summary` (`io.kestra.plugin.core.output.OutputValues`) exports structured metrics capturing endpoint HTTP status codes and operational posture for compliance logging.
    7. `errors` sends a priority failure notification to Slack if unhandled workflow execution errors occur.

    ## What you get

    - Automated, continuous validation of critical enterprise password vaults without relying on employee lockout reports.
    - Active enforcement of vault registration policies to prevent unauthorized external account creation.
    - Server clock synchronization auditing to safeguard against TOTP verification and session expiration failures.
    - Contextual Slack alerts detailing exact endpoint failure codes, server timestamps, and target hostnames.
    - Auditable execution history satisfying SOC2, ISO27001, and NIST 800-63B credential and secret management controls.

    ## Who it's for

    - Security Operations (SecOps) teams enforcing password manager access policies and sign-up controls.
    - Platform Engineers and SREs responsible for uptime and reliability of self-hosted credential backbones.
    - IT Administrators managing Bitwarden and Vaultwarden deployments across enterprise environments.

    ## Why orchestrate this with Kestra

    Password vault outages are catastrophic Sev-0 incidents that prevent engineers from accessing cloud consoles, database credentials, and production SSH keys. Simple TCP port checks only confirm that port 80 is listening; they cannot detect whether the SQLite/PostgreSQL backend is locked or whether unauthorized public signups have been accidentally enabled. Kestra orchestrates multi-stage HTTP inspection, declarative Pebble classification, failure escalation to Slack, and centralized compliance audit trails in a single workflow.

    ## Prerequisites

    - A running Vaultwarden instance (Docker container or Kubernetes pod).
    - An incoming Slack webhook URL for incident notifications.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Incoming Slack webhook URL used by `alert_signups_violation_slack`, `alert_config_unavailable_slack`, `alert_api_unhealthy_slack`, `alert_unreachable_slack`, and `alert_flow_failure`.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Start a local Vaultwarden instance using Docker:
       ```bash
       docker run -d --name vaultwarden -e SIGNUPS_ALLOWED=false -p 8080:80 vaultwarden/server:latest
       ```
    3. Import this blueprint into Kestra and click **Execute** with default inputs (`vaultwarden_host: "localhost"`, `vaultwarden_port: 8080`).
    4. Confirm that `classify_vault_posture` classifies `HEALTHY_COMPLIANT` and inspect the structured telemetry in `audit_summary`.
    5. Enable the `hourly_canary` schedule to automate continuous password vault monitoring.

    ## How to extend

    - Add automated backup verification by checking S3 or local volume snapshot timestamps using `io.kestra.plugin.aws.s3.List`.
    - Integrate PagerDuty or Opsgenie alerts for out-of-hours on-call paging during `INSTANCE_UNREACHABLE` or `SIGNUPS_POLICY_VIOLATION` incidents.
    - Expand multi-vault monitoring by looping over an array of internal Vaultwarden mirror instances using `io.kestra.plugin.core.flow.ForEach`.

