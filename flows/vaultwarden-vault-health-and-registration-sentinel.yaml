    - [Vaultwarden GitHub Repository](https://github.com/dani-garcia/vaultwarden)
    - [Vaultwarden Docker Guide](https://github.com/dani-garcia/vaultwarden/wiki/Starting-a-Container)
    - [Kestra HTTP Plugin](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Business
  subTags:
    - Monitoring & Alerting
    - Policy & Compliance
  ee: false
  demo: false
