id: partner-feed-contract-validator-and-quarantine-pipeline
namespace: company.integration

description: |
  Ingest incoming B2B partner inventory and product feeds, enforce schema contracts in DuckDB,
  split valid rows into optimized Parquet while isolating malformed rows into quarantined dead-letter
  records, and trip an execution circuit breaker if quarantine rates exceed partner SLA thresholds.

inputs:
  - id: partner_id
    type: STRING
    displayName: Partner Identifier
    defaults: "acme-retail-partner"
    description: Unique slug identifying the external vendor or data provider.

  - id: feed_payload
    type: JSON
    displayName: Incoming Partner Feed Records
    description: Array of JSON product and inventory records to validate and ingest.
    defaults:
      - sku: "PROD-101"
        title: "Industrial Metric Pressure Gauge"
        price: 49.95
        quantity: 120
        currency: "USD"
      - sku: "PROD-102"
        title: "High-Torque AC Servo Motor"
        price: 189.50
        quantity: 45
        currency: "EUR"
      - sku: "PROD-103"
        title: "Precision Temperature Sensor Probe"
        price: -10.00
        quantity: 15
        currency: "USD"
      - sku: ""
        title: "Missing SKU Cable Assembly"
        price: 12.00
        quantity: 50
        currency: "USD"
      - sku: "PROD-105"
        title: "Armored Fiber Optic Patch Lead"
        price: 8.50
        quantity: 350
        currency: "GBP"
      - sku: "PROD-106"
        title: "Sealed Hydraulic Quick Coupling"
        price: 74.20
        quantity: 80
        currency: "JPY"
      - sku: "PROD-107"
        title: "Stainless Steel Fastener Assortment"
        price: 15.00
        quantity: 300
        currency: "USD"
      - sku: "PROD-108"
        title: "Silicone Thermal Interface Pad"
        price: 4.25
        quantity: 500
        currency: "EUR"

  - id: max_quarantine_rate_percent
    type: INT
    displayName: Maximum Acceptable Quarantine Rate (%)
    defaults: 20
    min: 0
    max: 100
    description: Maximum percentage of quarantined records before the circuit breaker trips.

  - id: dry_run
    type: BOOL
    displayName: Dry Run Mode
    defaults: true
    description: When true, isolates and validates records and outputs artifacts without writing to warehouse tables.

tasks:
  - id: stage_raw_feed
    type: io.kestra.plugin.core.storage.Write
    description: Stages incoming partner feed JSON into Kestra internal storage.
    extension: ".json"
    content: "{{ inputs.feed_payload | json }}"

  - id: contract_validation_and_quarantine
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Evaluates feed records against schema contracts in DuckDB, generating Parquet clean data and JSON dead-letter records.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      feed.json: "{{ outputs.stage_raw_feed.uri }}"
    outputFiles:
      - clean_records
      - quarantined_records
      - contract_summary
    sql: |
      CREATE TABLE raw_feed AS 
      SELECT 
        COALESCE(sku, '') AS sku,
        COALESCE(title, '') AS title,
        TRY_CAST(price AS DOUBLE) AS price,
        TRY_CAST(quantity AS BIGINT) AS quantity,
        COALESCE(currency, '') AS currency
      FROM read_json_auto('feed.json');

      CREATE TABLE evaluated_records AS
      SELECT 
        sku,
        title,
        price,
        quantity,
        currency,
        '{{ inputs.partner_id }}' AS partner_id,
        CURRENT_TIMESTAMP AS ingested_at,
        CASE 
          WHEN sku IS NULL OR trim(sku) = '' THEN 'SCHEMA_VIOLATION_MISSING_SKU'
          WHEN price IS NULL OR price <= 0.0 THEN 'SCHEMA_VIOLATION_INVALID_PRICE'
          WHEN quantity IS NULL OR quantity < 0 THEN 'SCHEMA_VIOLATION_NEGATIVE_QUANTITY'
          WHEN currency NOT IN ('USD', 'EUR', 'GBP') THEN 'SCHEMA_VIOLATION_UNSUPPORTED_CURRENCY'
          ELSE NULL
        END AS quarantine_reason
      FROM raw_feed;

      COPY (
        SELECT 
          sku,
          title,
          price,
          quantity,
          currency,
          partner_id,
          ingested_at
        FROM evaluated_records 
        WHERE quarantine_reason IS NULL
        ORDER BY sku
      ) TO '{{ outputFiles.clean_records }}' (FORMAT PARQUET, COMPRESSION ZSTD);

      COPY (
        SELECT 
          sku,
          title,
          price,
          quantity,
          currency,
          partner_id,
          quarantine_reason,
          ingested_at
        FROM evaluated_records 
        WHERE quarantine_reason IS NOT NULL
        ORDER BY quarantine_reason, sku
      ) TO '{{ outputFiles.quarantined_records }}' (FORMAT JSON);

      COPY (
        SELECT 
          '{{ inputs.partner_id }}' AS partner_id,
          COUNT(*) AS total_records,
          COUNT(*) FILTER (WHERE quarantine_reason IS NULL) AS clean_count,
          COUNT(*) FILTER (WHERE quarantine_reason IS NOT NULL) AS quarantine_count,
          ROUND(COUNT(*) FILTER (WHERE quarantine_reason IS NOT NULL) * 100.0 / NULLIF(COUNT(*), 0), 2) AS quarantine_rate_pct
        FROM evaluated_records
      ) TO '{{ outputFiles.contract_summary }}' (HEADER, DELIMITER ',');

      SELECT 
        COUNT(*) AS total_records,
        COUNT(*) FILTER (WHERE quarantine_reason IS NULL) AS clean_count,
        COUNT(*) FILTER (WHERE quarantine_reason IS NOT NULL) AS quarantine_count,
        COALESCE(ROUND(COUNT(*) FILTER (WHERE quarantine_reason IS NOT NULL) * 100.0 / NULLIF(COUNT(*), 0), 2), 0.0) AS quarantine_rate_pct,
        CASE 
          WHEN COALESCE(ROUND(COUNT(*) FILTER (WHERE quarantine_reason IS NOT NULL) * 100.0 / NULLIF(COUNT(*), 0), 2), 0.0) > {{ inputs.max_quarantine_rate_percent }} THEN true 
          ELSE false 
        END AS circuit_breaker_tripped
      FROM evaluated_records;

  - id: evaluate_sla_and_route
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether quarantine rates exceed partner SLA thresholds and trips the circuit breaker.
    condition: "{{ outputs.contract_validation_and_quarantine.row.circuit_breaker_tripped }}"
    then:
      - id: log_sla_breach
        type: io.kestra.plugin.core.log.Log
        description: Logs quarantine rate breach exceeding partner SLA ceiling.
        message: "CRITICAL: Partner '{{ inputs.partner_id }}' quarantine rate {{ outputs.contract_validation_and_quarantine.row.quarantine_rate_pct }}% exceeded allowable ceiling {{ inputs.max_quarantine_rate_percent }}% (Quarantined: {{ outputs.contract_validation_and_quarantine.row.quarantine_count }}/{{ outputs.contract_validation_and_quarantine.row.total_records }}). Quarantined artifact: {{ outputs.contract_validation_and_quarantine.outputFiles.quarantined_records }}"

      - id: notify_sla_breach_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Sends SLA violation card to partner engineering Slack channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: |
          :rotating_light: *Partner Feed SLA Violation - Quarantine Limit Exceeded*
          • Partner: `{{ inputs.partner_id }}`
          • Total Records: `{{ outputs.contract_validation_and_quarantine.row.total_records }}`
          • Quarantined: `{{ outputs.contract_validation_and_quarantine.row.quarantine_count }}` (`{{ outputs.contract_validation_and_quarantine.row.quarantine_rate_pct }}%`)
          • SLA Ceiling: `{{ inputs.max_quarantine_rate_percent }}%`
          • Quarantined Records URI: `{{ outputs.contract_validation_and_quarantine.outputFiles.quarantined_records }}`

      - id: enforce_circuit_breaker
        type: io.kestra.plugin.core.execution.Fail
        description: Fails execution to prevent downstream warehouse ingestion of contract-violating feed.
    else:
      - id: log_successful_ingestion
        type: io.kestra.plugin.core.log.Log
        description: Logs compliant partner feed landing metrics.
        message: "SUCCESS: Partner '{{ inputs.partner_id }}' feed processed within SLA. Clean: {{ outputs.contract_validation_and_quarantine.row.clean_count }}/{{ outputs.contract_validation_and_quarantine.row.total_records }} rows landed as ZSTD Parquet. Clean URI: {{ outputs.contract_validation_and_quarantine.outputFiles.clean_records }}"

      - id: notify_success_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches ingestion confirmation card to operations Slack channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: |
          :white_check_mark: *Partner Feed Ingestion Completed*
          • Partner: `{{ inputs.partner_id }}`
          • Clean Records Landed: `{{ outputs.contract_validation_and_quarantine.row.clean_count }}`
          • Quarantined Records: `{{ outputs.contract_validation_and_quarantine.row.quarantine_count }}`
          • Clean Parquet URI: `{{ outputs.contract_validation_and_quarantine.outputFiles.clean_records }}`

triggers:
  - id: hourly_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

  - id: partner_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('PARTNER_FEED_WEBHOOK_KEY') }}"

errors:
  - id: alert_on_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: |
      :x: *Execution {{ execution.id }} failed in flow {{ flow.id }}*

extend:
  title: Partner Feed Contract Validator and Quarantine Pipeline
  metaTitle: Partner Feed Contract Validator & Quarantine Pipeline | Kestra
  shortDescription: Validate incoming partner feeds against schema contracts, isolate malformed rows into quarantined dead-letter files, and land verified Parquet data.
  metaDescription: Enforce schema contracts on incoming partner data feeds, quarantine malformed records, and land clean Parquet in analytical storage.
  tags:
    - Data
  subTags:
    - Testing & Quality
    - ELT & Data Landing
  ee: false
  demo: false
  description: |
    B2B partner integrations and third-party vendor feeds frequently suffer from unannounced schema changes, missing mandatory attributes, and invalid data formats. In traditional data pipelines, these schema contract violations either cause the entire batch ingestion job to crash or corrupt downstream data warehouses with dirty values.

    This blueprint implements an automated contract enforcement and quarantine pipeline powered by DuckDB. As partner data feeds arrive via webhook or scheduled batches, every record is validated against strict domain contracts. Valid rows are materialized into compressed, date-partitioned Parquet files ready for warehouse landing, while non-compliant records are segregated into a structured dead-letter quarantine artifact with exact violation reasons annotated on each row. An operational circuit breaker calculates real-time quarantine error rates and aborts downstream ingestion if the partner feed exceeds acceptable SLA thresholds.

    ## How it works

    1. `stage_raw_feed` (`io.kestra.plugin.core.storage.Write`) persists incoming partner payload data into Kestra internal storage as a JSON buffer.
    2. `contract_validation_and_quarantine` (`io.kestra.plugin.jdbc.duckdb.Queries`) mounts the JSON buffer into an in-memory DuckDB instance, evaluates required field constraints (non-empty SKUs, positive prices, valid quantity bounds, and whitelisted currency codes), exports compliant records to ZSTD-compressed Parquet, writes quarantined records with rejection reasons to JSON, and computes aggregate feed quality metrics.
    3. `evaluate_sla_and_route` (`io.kestra.plugin.core.flow.If`) evaluates the aggregate quarantine percentage against `max_quarantine_rate_percent`.
    4. If the quarantine rate exceeds the SLA ceiling, `notify_sla_breach_slack` alerts the integration team with direct links to the dead-letter records, and `enforce_circuit_breaker` (`io.kestra.plugin.core.execution.Fail`) trips the circuit breaker to prevent warehouse pollution.
    5. When feed quality remains within SLA limits, `notify_success_slack` delivers an operational summary to Slack with record counts and artifact paths.

    ## What you get

    - Automated bifurcated routing separating clean analytical records from malformed partner data.
    - Zero downstream data warehouse contamination caused by unexpected partner schema drift.
    - Exported ZSTD-compressed Parquet files for immediate query performance in BigQuery, Snowflake, or DuckDB.
    - Actionable dead-letter quarantine artifacts detailing the exact field constraint violated for each malformed row.
    - Automated SLA circuit breaker tripping before corrupt batches can cascade across downstream models.

    ## Who it's for

    - Data Platform Engineers building resilient B2B integration hubs and Data Mesh ingestion pipelines.
    - Analytics Engineers responsible for maintaining data warehouse contracts and upstream vendor feed quality.
    - Integration Architects replacing brittle custom Python ingestion scripts with declarative orchestration.

    ## Why orchestrate this with Kestra

    - **Declarative Isolation**: Ingests, validates, splits, and lands data using declarative YAML without managing custom virtual environments or Airflow worker dependencies.
    - **Native In-Memory Relational Engine**: Leverages embedded DuckDB for high-throughput vectorized SQL contract evaluation directly inside the orchestration engine.
    - **Internal Storage Lineage**: Stores raw payloads, clean Parquet files, and quarantine files with built-in execution lineage and UI artifact download capabilities.
    - **Automated Flow Control**: Combines conditional routing, circuit breakers, and webhook triggers natively without custom state glue code.

    ## Pitfalls

    - **Feed Size Limits**: Extremely large single-batch feeds (multiple gigabytes) should be chunked into streaming files or landed in object storage (S3/GCS) prior to DuckDB processing to avoid memory pressure on constrained worker nodes.
    - **SLA Threshold Tuning**: Setting `max_quarantine_rate_percent` too low on volatile third-party feeds may trigger false-positive circuit breaker trips; adjust thresholds to reflect vendor reliability agreements.

    ## Prerequisites

    - A running Kestra 2.0 instance.
    - Access to Slack incoming webhooks for operational notifications.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alerting on successful runs, contract violations, and pipeline failures.
    - `PARTNER_FEED_WEBHOOK_KEY`: Authentication secret key protecting the partner ingestion webhook endpoint.

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` and `PARTNER_FEED_WEBHOOK_KEY` secrets in your Kestra namespace.
    2. Import this blueprint into your Kestra instance.
    3. Run a manual execution with default inputs (`dry_run: true`) to observe the 8-sample feed validation, Parquet artifact generation, and quarantine split.
    4. Activate the `hourly_schedule` trigger or configure your external partner to post JSON feeds to the webhook URL.

    ## How to extend

    - Add an Amazon S3 or Google Cloud Storage upload task downstream of `evaluate_sla_and_route` to copy `clean_records` directly into an external lakehouse bucket.
    - Chain a downstream dbt Cloud or MotherDuck transformation job that triggers only when `clean_records` count is greater than zero.
    - Add an automated Zendesk or Jira ticket creation step when the circuit breaker trips to notify vendor support representatives.

    ## Links

    - [Kestra DuckDB Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [Kestra Storage Write Documentation](https://kestra.io/plugins/core/storage/io.kestra.plugin.core.storage.write)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
