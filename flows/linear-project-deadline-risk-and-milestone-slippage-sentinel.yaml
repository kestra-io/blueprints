id: linear-project-deadline-risk-and-milestone-slippage-sentinel
namespace: company.operations

inputs:
  - id: min_progress_percent
    type: INT
    displayName: Minimum Expected Progress Percentage
    defaults: 50
    description: Minimum completion percentage expected for approaching projects before flagging as at-risk.

  - id: days_ahead_horizon
    type: INT
    displayName: Deadline Lookahead Horizon (Days)
    defaults: 14
    description: Number of days ahead to inspect project target dates for milestone slippage risk.

  - id: project_batch_limit
    type: INT
    displayName: Project Batch Limit
    defaults: 25
    description: Maximum number of active projects to inspect per execution.

triggers:
  - id: weekly_project_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Monday morning project health audit at 08:30 UTC to alert on approaching milestones at risk of slipping. Shipped disabled by default.
    cron: "30 8 * * 1"
    disabled: true

tasks:
  - id: fetch_active_projects
    type: io.kestra.plugin.graphql.Request
    description: Query Linear GraphQL API for active roadmap projects with target dates, progress percentages, and leads.
    uri: "https://api.linear.app/graphql"
    headers:
      Authorization: "{{ secret('LINEAR_API_KEY') }}"
      Content-Type: "application/json"
      User-Agent: "Kestra-Linear-Slippage-Sentinel/1.0"
    failOnGraphQLErrors: false
    allowFailed: true
    query: |
      query GetActiveProjects {
        projects(filter: { state: { in: ["started", "planned"] } }, first: {{ inputs.project_batch_limit }}) {
          nodes {
            id
            name
            state
            progress
            targetDate
            url
            lead {
              name
            }
          }
        }
      }

  - id: evaluate_deadline_risks
    type: io.kestra.plugin.scripts.python.Script
    description: Parse project deadlines and identify projects where completion lags behind schedule.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      PROJECTS_DATA: "{{ outputs.fetch_active_projects.body | toJson }}"
      DAYS_AHEAD: "{{ inputs.days_ahead_horizon }}"
      MIN_PROGRESS: "{{ inputs.min_progress_percent }}"
    script: |
      import os
      import json
      from datetime import datetime, timezone, timedelta

      raw_data = json.loads(os.environ.get("PROJECTS_DATA", "{}"))
      days_ahead = int(os.environ.get("DAYS_AHEAD", 14))
      min_progress = int(os.environ.get("MIN_PROGRESS", 50))

      projects = (raw_data.get("projects") or {}).get("nodes") or []
      now = datetime.now(timezone.utc)
      horizon = now + timedelta(days=days_ahead)

      at_risk = []
      for p in projects:
          target_str = p.get("targetDate")
          if not target_str:
              continue

          try:
              target_dt = datetime.fromisoformat(target_str.replace("Z", "+00:00"))
          except Exception:
              continue

          progress_pct = int(round((p.get("progress") or 0.0) * 100))
          lead_name = (p.get("lead") or {}).get("name") or "Unassigned"

          # Check if target date is within horizon and progress is below threshold
          if now <= target_dt <= horizon and progress_pct < min_progress:
              days_remaining = (target_dt - now).days
              at_risk.append({
                  "name": p.get("name"),
                  "url": p.get("url"),
                  "progress_pct": progress_pct,
                  "days_remaining": days_remaining,
                  "target_date": target_str[:10],
                  "lead": lead_name
              })

      summary_lines = [
          f"• *{item['name']}* ({item['progress_pct']}% complete, due in {item['days_remaining']} days on {item['target_date']}) - Lead: {item['lead']} - <{item['url']}|View Project>"
          for item in at_risk
      ]
      summary_text = "\\n".join(summary_lines) if summary_lines else "All approaching projects meet progress thresholds."

      output_payload = {
          "at_risk_count": len(at_risk),
          "at_risk_projects": at_risk,
          "summary_text": summary_text
      }

      print(f'::{"outputs": {json.dumps(output_payload)}}::')

  - id: evaluate_risk_threshold
    type: io.kestra.plugin.core.flow.If
    description: Evaluate whether any projects are identified as at risk of missing target deadlines.
    condition: "{{ outputs.evaluate_deadline_risks.vars.at_risk_count > 0 }}"
    then:
      - id: alert_project_risks
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch high-priority Slack briefing to Product Leadership and Engineering Leads itemizing at-risk milestones.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "⚠️ *LINEAR ROADMAP RISK: Approaching Milestones with Slippage Risk* ⚠️\n\n*At-Risk Projects Count:* {{ outputs.evaluate_deadline_risks.vars.at_risk_count }}\n*Evaluation Horizon:* Next {{ inputs.days_ahead_horizon }} days (Threshold: < {{ inputs.min_progress_percent }}% complete)\n\n*Projects Requiring Scope or Resource Adjustments:*\n{{ outputs.evaluate_deadline_risks.vars.summary_text }}\n\n*Execution ID:* {{ execution.id }}\n*Action Required:* Product Managers and Leads please review project scope, resolve blockers, or adjust target milestones."
          }
    else:
      - id: log_projects_on_track
        type: io.kestra.plugin.core.log.Log
        description: Log clean status when all approaching roadmap projects are healthy.
        message: "HEALTHY: All approaching Linear projects within {{ inputs.days_ahead_horizon }} days meet or exceed the {{ inputs.min_progress_percent }}% progress threshold."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Record final audit metrics for roadmap delivery governance.
    message: "Linear milestone slippage audit finished. Total projects at risk: {{ outputs.evaluate_deadline_risks.vars.at_risk_count }}."

errors:
  - id: alert_on_linear_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Engineering Operations if Linear GraphQL API returns an error or authentication fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *Linear Roadmap Sentinel Error*: Execution `{{ execution.id }}` failed to query Linear projects API. Verify LINEAR_API_KEY validity."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.evaluate_deadline_risks.vars.at_risk_count > 0 ? 'PROJECTS_AT_RISK' : 'HEALTHY' }}"
  - id: at_risk_count
    type: INT
    value: "{{ outputs.evaluate_deadline_risks.vars.at_risk_count }}"

extend:
  title: Linear project deadline risk and milestone slippage sentinel
  metaTitle: Linear Project Deadline Risk Sentinel | Kestra
  shortDescription: Weekly governance sentinel that queries Linear GraphQL API for approaching project milestones at risk of deadline slippage, alerting product leads.
  metaDescription: Audit Linear project milestones via GraphQL API for approaching target dates with low completion rates and alert product managers to prevent release slips.
  description: |
    Prevent unexpected release slips and maintain predictability across product roadmaps. In fast-moving engineering and product teams using Linear, roadmap projects frequently approach their target delivery dates with significant outstanding work remaining because dependencies, unexpected technical debt, or team blockers were not surfaced early enough to adjust scope. This blueprint executes a weekly audit every Monday morning via Linear's GraphQL API (`io.kestra.plugin.graphql.Request`), compares target milestone dates against actual issue completion percentages using a Python evaluation step, and delivers an executive briefing to Slack highlighting at-risk initiatives.

    ## How it works
    1. A `Schedule` trigger initiates a project deadline audit every Monday morning at 08:30 UTC (shipped disabled by default).
    2. Task `fetch_active_projects` queries `https://api.linear.app/graphql` authenticated with `LINEAR_API_KEY`. It fetches active projects in `started` or `planned` state, extracting project names, target dates, completion progress percentages, URLs, and assigned project leads.
    3. Task `evaluate_deadline_risks` (`io.kestra.plugin.scripts.python.Script`) calculates date deltas between current UTC time and each project's `targetDate`:
       - If a project is due within `inputs.days_ahead_horizon` (e.g. 14 days) and its progress is below `inputs.min_progress_percent` (e.g. 50%), it is classified as at-risk.
       - The task formats an itemized summary string and emits output metrics via Kestra's stdout protocol.
    4. Task `evaluate_risk_threshold` (`io.kestra.plugin.core.flow.If`) posts an executive Slack alert if any projects are at risk, or logs a healthy message if all initiatives are tracking on schedule.
    5. Top-level `errors` handler catches API connectivity or authentication failures.

    ## What you get
    - Proactive early warning of projects at risk of missing published quarterly or sprint deadlines.
    - Automated visibility into completion percentages versus remaining days to ship.
    - Direct Slack notifications routing project managers straight to affected Linear initiatives.
    - Data-driven alignment between engineering throughput and product commitments.

    ## Who it's for
    - Product Managers (PMs) and Engineering Managers tracking roadmap commitments.
    - Technical Program Managers (TPMs) coordinating multi-team release milestones.
    - VP of Engineering and CTOs requiring high-level visibility into delivery predictability.

    ## Why orchestrate this with Kestra
    Manual roadmap reviews in Monday morning planning meetings often rely on subjective gut feeling or outdated slide decks. Kestra provides an automated, objective, code-defined pipeline that queries the source of truth (Linear's GraphQL schema) directly, computes mathematical deadline vs progress thresholds, and ensures risks are addressed before release commitments are breached.

    ## Prerequisites
    - A Linear workspace with active projects and defined `targetDate` values.
    - A Linear API Key with read permissions.
    - A Slack Incoming Webhook URL.

    ### Secrets
    - `LINEAR_API_KEY`: Linear API key passed in the `Authorization` header.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to post project risk briefings.

    ## Quick start
    1. Generate a Linear personal API key under **Settings > My Account > Security & Access**.
    2. Store `LINEAR_API_KEY` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    3. Adjust `days_ahead_horizon` (e.g. `14` days) and `min_progress_percent` (e.g. `50`%) as desired.
    4. Execute the flow manually in Kestra to confirm that active projects are retrieved and evaluated.
    5. Enable the `weekly_project_audit` schedule to establish weekly Monday morning roadmap audits.

    ## How to extend
    - Integrate with Jira or Asana to run unified roadmap risk audits across multi-tool engineering organizations.
    - Automatically create an emergency sync issue in Linear when a critical tier-1 project breaches the risk threshold.
    - Post metrics to a Datadog or Grafana dashboard to track milestone accuracy trends over fiscal quarters.

    ## Links
    - [Linear GraphQL API: Project](https://developers.linear.app/docs/graphql/working-with-the-graphql-api#projects)
    - [Kestra GraphQL Plugin](https://kestra.io/plugins/plugin-graphql)
    - [Kestra Python Script Task](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Business
    - Infrastructure
  subTags:
    - Reporting & Digests
    - Incident Response
  ee: false
  demo: false
