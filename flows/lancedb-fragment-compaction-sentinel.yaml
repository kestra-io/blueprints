id: lancedb-fragment-compaction-sentinel
namespace: company.ai

description: |
  Audits LanceDB vector tables for fragmented files and alerts MLOps teams on Slack when compaction is required.

concurrency:
  limit: 1

inputs:
  - id: dataset_uri
    type: STRING
    defaults: "data/vector_kb.lance"
    description: Storage path or S3/GCS URI pointing to the LanceDB dataset directory.

  - id: max_fragment_threshold
    type: INT
    defaults: 20
    description: Maximum permissible fragmented data files before compaction optimization is required.

tasks:
  - id: inspect_lancedb_fragment_health
    type: io.kestra.plugin.scripts.python.Script
    description: Inspects LanceDB dataset table metadata and fragment fragmentation status.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install kestra pylance pyarrow
    env:
      DATASET_URI: "{{ inputs.dataset_uri }}"
      MAX_FRAGMENT_THRESHOLD: "{{ inputs.max_fragment_threshold }}"
    script: |
      import os
      import sys
      import json
      from kestra import Kestra

      dataset_path = os.environ.get("DATASET_URI", "data/vector_kb.lance").strip()
      threshold = int(os.environ.get("MAX_FRAGMENT_THRESHOLD", "20"))

      print(f"Inspecting LanceDB table fragment layout at '{dataset_path}'...")

      if not os.path.exists(dataset_path):
          print(f"ERROR: Dataset path '{dataset_path}' does not exist or is inaccessible.", file=sys.stderr)
          sys.exit(1)

      try:
          import lance
          ds = lance.dataset(dataset_path)
          fragments = len(ds.get_fragments())
          total_rows = ds.count_rows()
          total_size = sum(os.path.getsize(os.path.join(dirpath, f)) for dirpath, _, filenames in os.walk(dataset_path) for f in filenames)
          disk_size_mb = round(total_size / (1024 * 1024), 2)
      except Exception as e:
          print(f"ERROR: Failed to inspect LanceDB dataset at {dataset_path}: {e}", file=sys.stderr)
          sys.exit(1)

      breach = fragments > threshold
      print(f"LanceDB fragments: {fragments}, threshold: {threshold}, compaction_needed: {breach}")

      Kestra.outputs({
          "dataset_uri": dataset_path,
          "active_fragments": fragments,
          "total_rows": total_rows,
          "compaction_needed": breach,
          "disk_size_mb": disk_size_mb
      })

  - id: evaluate_compaction_guard
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether fragment count exceeds compaction threshold.
    condition: "{{ outputs.inspect_lancedb_fragment_health.vars.compaction_needed ?? false }}"
    then:
      - id: notify_compaction_needed
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "⚠️ *LanceDB Fragment Saturated Alert* on `{{ outputs.inspect_lancedb_fragment_health.vars.dataset_uri }}`\n• Active Fragments: `{{ outputs.inspect_lancedb_fragment_health.vars.active_fragments }}` (Threshold: {{ inputs.max_fragment_threshold }})\n• Dataset Size: `{{ outputs.inspect_lancedb_fragment_health.vars.disk_size_mb }} MB`\n• Action: Fragment compaction recommended to maintain low retrieval latency and minimize small file overhead.\n• Execution ID: `{{ execution.id }}`"
          }
    else:
      - id: notify_dataset_healthy
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "✅ *LanceDB Dataset Optimal*: `{{ outputs.inspect_lancedb_fragment_health.vars.dataset_uri }}` has `{{ outputs.inspect_lancedb_fragment_health.vars.active_fragments }}` fragments (under threshold {{ inputs.max_fragment_threshold }})."
          }

  - id: log_telemetry_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    description: Logs telemetry metrics for observability pipelines.
    containerImage: ghcr.io/kestra-io/tools:latest
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    commands:
      - echo "[METRIC] lancedb_dataset={{ outputs.inspect_lancedb_fragment_health.vars.dataset_uri }} fragments={{ outputs.inspect_lancedb_fragment_health.vars.active_fragments }} total_rows={{ outputs.inspect_lancedb_fragment_health.vars.total_rows }}"

outputs:
  - id: active_fragments
    type: INT
    value: "{{ outputs.inspect_lancedb_fragment_health.vars.active_fragments }}"
  - id: total_rows
    type: INT
    value: "{{ outputs.inspect_lancedb_fragment_health.vars.total_rows }}"
  - id: compaction_needed
    type: BOOLEAN
    value: "{{ outputs.inspect_lancedb_fragment_health.vars.compaction_needed }}"

errors:
  - id: alert_audit_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "🚨 *LanceDB Storage Audit Job Failed* | Execution `{{ execution.id }}` failed accessing {{ inputs.dataset_uri }}."
      }

triggers:
  - id: periodic_fragment_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */6 * * *"

extend:
  title: LanceDB Vector Table Fragment Compaction and Storage Sentinel
  shortDescription: Audits LanceDB vector tables for fragmented files and alerts MLOps teams when compaction is needed.
  metaTitle: LanceDB Vector Fragment Compaction Sentinel in Kestra
  metaDescription: Audit LanceDB vector datasets for small file fragments, evaluate compaction thresholds, and alert MLOps via Slack in Kestra.
  description: |
    # LanceDB Vector Table Fragment Compaction and Storage Sentinel

    LanceDB is a serverless, columnar vector database engineered for AI and multimodal workflows. During continuous append or streaming vector ingestion, tables accumulate dozens of small fragment files. Over time, excessive fragments degrade scan speed, increase metadata overhead, and slow down vector similarity queries.

    This blueprint implements an automated SRE and MLOps sentinel that continuously tracks LanceDB table fragment counts, compares them against configured operational thresholds, and alerts teams via Slack when compaction or index rebuilding is required.
  tags:
    - AI
    - Core
