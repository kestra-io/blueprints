id: sec-insider-buying-monitor
namespace: company.team

inputs:
  - id: tickers
    type: ARRAY
    itemType: STRING
    displayName: Watchlist
    description: Tickers of the companies to monitor. Keep the trigger's `tickers` in sync for automatic runs.
    defaults:
      - PFE
      - INTC
      - NKE
      - TGT
      - CRM

  - id: lookback_days
    type: INT
    displayName: Lookback (days)
    description: Form 4 filings filed in this many days are read. Insiders file within two business days of a trade.
    defaults: 30

  - id: min_purchase_usd
    type: FLOAT
    displayName: Large purchase (USD)
    description: Alert when one insider's open-market purchases in a single Form 4 add up to at least this amount.
    defaults: 250000

  - id: cluster_min_insiders
    type: INT
    displayName: Cluster size
    description: Alert when at least this many different insiders buy the same company's stock within the cluster window.
    defaults: 3

  - id: cluster_window_days
    type: INT
    displayName: Cluster window (days)
    description: Length of the window, in days of transaction date, for the cluster rule.
    defaults: 14

tasks:
  - id: companies
    type: io.kestra.plugin.edgar.company.Lookup
    description: Resolves the watchlist to SEC CIKs and company names.
    # SEC requires a User-Agent with your name or company and a contact email. Set it once in the KV store.
    userAgent: "{{ kv('SEC_EDGAR_USER_AGENT', errorOnMissing=false) ?? '' }}"
    tickers: "{{ inputs.tickers }}"
    fetchType: FETCH

  - id: each_company
    type: io.kestra.plugin.core.flow.Loop
    values: "{{ inputs.tickers }}"
    # One at a time: SEC allows 10 requests per second across all your tools.
    concurrencyLimit: 1
    outputs:
      - id: filings
        type: JSON
        value: >-
          {{ outputs.filings.rows | jq('[.[] | .cik + ";" + .accessionNumber + ";" + .filingDate + ";" + .form]') | first | toJson }}
    tasks:
      - id: filings
        type: io.kestra.plugin.edgar.filings.List
        description: The company's Form 4 filings and amendments in the lookback window.
        userAgent: "{{ kv('SEC_EDGAR_USER_AGENT', errorOnMissing=false) ?? '' }}"
        ticker: "{{ item.value }}"
        forms:
          - "4"
          - 4/A
        startDate: "{{ now() | dateAdd(-inputs.lookback_days, 'DAYS') | date('yyyy-MM-dd') }}"
        maxResults: 1000

  - id: each_filing
    type: io.kestra.plugin.core.flow.Loop
    # A Form 4 can be listed under two watched companies (Berkshire Hathaway buying Lennar stock is in both
    # filing lists): download each filing once.
    values: "{{ outputs.each_company.outputs | jq('[.[].outputs.filings[]] | unique_by(split(\";\")[1])') | first }}"
    concurrencyLimit: 1
    outputs:
      - id: xml
        type: STRING
        value: "{{ outputs.download.primaryDocument.uri }}"
    tasks:
      - id: download
        type: io.kestra.plugin.edgar.filings.Download
        description: The Form 4 XML (the primary document of the filing).
        userAgent: "{{ kv('SEC_EDGAR_USER_AGENT', errorOnMissing=false) ?? '' }}"
        cik: "{{ item.value | split(';') | first }}"
        accessionNumber: "{{ (item.value | split(';'))[1] }}"

  - id: parse
    type: io.kestra.plugin.scripts.python.Script
    description: One row per transaction reported in the downloaded Form 4s (standard library only).
    containerImage: python:3.13-slim
    # Each Form 4 is saved as <CIK>_<accession number>_<filing date>_<form>.xml, with 4/A written as 4-A.
    inputFiles: |
      {
      {%- for f in outputs.each_filing.outputs ?? [] %}
        "{{ f.item.value | replace({';': '_', '/': '-'}) }}.xml": "{{ f.outputs.xml }}"{{ loop.last ? '' : ',' }}
      {%- endfor %}
      }
    script: |
      import csv, glob
      import xml.etree.ElementTree as ET

      def text(node, path):
          el = node.find(path)
          return el.text.strip() if el is not None and el.text and el.text.strip() else None

      def flag(node, path):
          return text(node, path) in ("1", "true")

      def number(node, path):
          value = text(node, path)
          return float(value) if value else None

      FIELDS = ["issuer_cik", "issuer_ticker", "issuer_name", "accession_number", "form", "filing_date",
                "owner_cik", "owner_name", "owner_role", "joint_filers", "plan_10b5_1", "security",
                "transaction_date", "code", "acquired_disposed", "shares", "price", "value_usd",
                "shares_owned_after", "ownership"]
      with open("transactions.csv", "w", newline="") as out:
          writer = csv.DictWriter(out, FIELDS)
          writer.writeheader()
          for path in sorted(glob.glob("*.xml")):
              cik, accession, filing_date, form = path[:-4].split("_")
              form = form.replace("-", "/")
              root = ET.parse(path).getroot()
              owners = root.findall("reportingOwner")
              # Joint filers (a fund and its general partner, say) report the same trades: the first owner
              # stands for all of them, so they count as one insider.
              owner = owners[0]
              relationship = owner.find("reportingOwnerRelationship")
              role = text(relationship, "officerTitle") or ", ".join(
                  label for path, label in (("isDirector", "Director"), ("isTenPercentOwner", "10% owner"),
                                            ("isOfficer", "Officer"), ("isOther", "Other"))
                  if flag(relationship, path)) or None
              for tx in root.findall("nonDerivativeTable/nonDerivativeTransaction"):
                  shares = number(tx, "transactionAmounts/transactionShares/value")
                  price = number(tx, "transactionAmounts/transactionPricePerShare/value")
                  writer.writerow({
                      "issuer_cik": text(root, "issuer/issuerCik").lstrip("0"),
                      "issuer_ticker": text(root, "issuer/issuerTradingSymbol"),
                      "issuer_name": text(root, "issuer/issuerName"),
                      "accession_number": accession, "form": form, "filing_date": filing_date,
                      "owner_cik": text(owner, "reportingOwnerId/rptOwnerCik").lstrip("0"),
                      "owner_name": text(owner, "reportingOwnerId/rptOwnerName"),
                      "owner_role": role, "joint_filers": len(owners) - 1,
                      "plan_10b5_1": flag(root, "aff10b5One"),
                      "security": text(tx, "securityTitle/value"),
                      "transaction_date": text(tx, "transactionDate/value")[:10],
                      "code": text(tx, "transactionCoding/transactionCode"),
                      "acquired_disposed": text(tx, "transactionAmounts/transactionAcquiredDisposedCode/value"),
                      "shares": shares,
                      # A price given only in a footnote (a purchase from the company, say) stays empty.
                      "price": price,
                      "value_usd": round(shares * price, 2) if shares is not None and price else None,
                      "shares_owned_after": number(tx, "postTransactionAmounts/sharesOwnedFollowingTransaction/value"),
                      "ownership": text(tx, "ownershipNature/directOrIndirectOwnership/value"),
                  })
    outputFiles:
      - transactions.csv

  - id: alerts
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: Open-market purchases above the threshold, and clusters of insiders buying the same stock.
    inputFiles:
      transactions.csv: "{{ outputs.parse.outputFiles['transactions.csv'] }}"
    fetchType: FETCH
    sql: |
      WITH companies(ticker, cik, name) AS (
          VALUES {% for c in outputs.companies.rows %}('{{ c.ticker }}', ltrim('{{ c.cik }}', '0'), '{{ c.name | replace({"'": "''"}) }}'){{ loop.last ? '' : ', ' }}{% endfor %}
      ),
      transactions AS (
          SELECT * FROM read_csv('{{ workingDir }}/transactions.csv', header = true, auto_detect = true,
                                 types = {'issuer_cik': 'VARCHAR', 'owner_cik': 'VARCHAR', 'transaction_date': 'DATE', 'filing_date': 'DATE',
                                          'joint_filers': 'INTEGER', 'plan_10b5_1': 'BOOLEAN', 'shares': 'DOUBLE', 'price': 'DOUBLE',
                                          'value_usd': 'DOUBLE', 'shares_owned_after': 'DOUBLE'})
      ),
      purchases AS (
          -- Code P: open-market or private purchase. Grants, option exercises and tax withholding are left out.
          -- A company can itself file Form 4s as an owner of another company: keep only trades in the company's own stock.
          SELECT t.*, c.ticker FROM transactions t
          JOIN companies c ON c.cik = t.issuer_cik
          WHERE t.code = 'P' AND t.acquired_disposed = 'A'
          -- An amendment restates the original: keep only the latest filing for each insider, day and security.
          QUALIFY t.filing_date = max(t.filing_date) OVER (PARTITION BY t.issuer_cik, t.owner_cik, t.transaction_date, t.security)
      ),
      per_filing AS (
          SELECT ticker, any_value(issuer_name) AS issuer_name, owner_cik, any_value(owner_name) AS owner_name,
                 any_value(owner_role) AS owner_role, accession_number, any_value(filing_date) AS filing_date,
                 bool_or(plan_10b5_1) AS plan_10b5_1, min(transaction_date) AS first_date, max(transaction_date) AS last_date,
                 sum(shares) AS shares,
                 CASE WHEN count(value_usd) = count(*) THEN sum(value_usd) END AS value_usd
          FROM purchases GROUP BY ticker, owner_cik, accession_number
      ),
      large AS (
          SELECT ticker, issuer_name, last_date AS as_of, 'large purchase' AS rule,
                 [accession_number] AS accession_numbers,
                 format('{} ({}) bought {:,.0f} shares for ${:,.0f} (average ${:,.2f}) on {}{}{}', owner_name, coalesce(owner_role, 'insider'),
                        shares, value_usd, value_usd / shares, first_date,
                        CASE WHEN last_date > first_date THEN ' to ' || last_date ELSE '' END,
                        CASE WHEN plan_10b5_1 THEN ', under a 10b5-1 trading plan' ELSE '' END) AS finding
          FROM per_filing WHERE value_usd >= {{ inputs.min_purchase_usd }}
      ),
      windows AS (
          -- Each purchase date closes a window: the insiders who bought in the window_days ending that day.
          SELECT e.ticker, e.issuer_name, e.last_date AS window_end,
                 count(DISTINCT p.owner_cik) AS insiders, min(p.first_date) AS window_start,
                 string_agg(DISTINCT p.owner_name || ' (' || coalesce(p.owner_role, 'insider') || ')', ', ' ORDER BY p.owner_name || ' (' || coalesce(p.owner_role, 'insider') || ')') AS buyers,
                 sum(p.value_usd) AS known_value_usd, count(*) FILTER (WHERE p.value_usd IS NULL) AS unknown_price,
                 list(DISTINCT p.accession_number) AS accession_numbers
          FROM per_filing e
          JOIN per_filing p ON p.ticker = e.ticker
                           AND p.last_date > e.last_date - {{ inputs.cluster_window_days }} AND p.first_date <= e.last_date
          GROUP BY e.ticker, e.issuer_name, e.last_date
      ),
      clusters AS (
          SELECT ticker, issuer_name, window_end AS as_of, 'cluster' AS rule, accession_numbers,
                 format('{} insiders bought between {} and {}: {} (${:,.0f} in total{})', insiders, window_start, window_end, buyers,
                        coalesce(known_value_usd, 0), CASE WHEN unknown_price > 0 THEN ', plus ' || unknown_price || ' purchase(s) with no price stated' ELSE '' END) AS finding
          FROM windows WHERE insiders >= {{ inputs.cluster_min_insiders }}
          -- Report the largest cluster per company, the latest one on a tie.
          QUALIFY row_number() OVER (PARTITION BY ticker ORDER BY insiders DESC, window_end DESC) = 1
      ),
      findings AS (SELECT * FROM large UNION ALL SELECT * FROM clusters)
      SELECT ticker, issuer_name, as_of, rule, finding,
             format('{} ({}): {}', ticker, issuer_name, finding) AS message
      FROM findings
      {%- if trigger is defined and trigger.filings is defined %}
      -- On a filing-triggered run, report only findings that include one of the new filings.
      WHERE len(list_intersect(accession_numbers, [{% for f in trigger.filings %}'{{ f.accessionNumber }}'{{ loop.last ? '' : ', ' }}{% endfor %}])) > 0
      {%- endif %}
      ORDER BY ticker, rule, as_of

  - id: report
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.alerts.size > 0 }}"
    then:
      - id: log_alerts
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: |
          {{ outputs.alerts.size }} insider buying alert(s):
          {% for a in outputs.alerts.rows %}- {{ a.message }}
          {% endfor %}
      - id: slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Optional. Without the SLACK_WEBHOOK_URL secret this step fails as a warning; the alerts above are already logged.
        allowFailure: true
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        # A full JSON payload: `messageText` starting with a number is cut to that number (kestra-io/plugin-slack#103).
        payload: >-
          {{ outputs.alerts.rows | jq('{text: ((length | tostring) + " insider buying alert(s):\n" + (map("• " + .message) | join("\n")))}') | first | toJson }}
    else:
      - id: all_clear
        type: io.kestra.plugin.core.log.Log
        message: No insider purchase crossed a threshold.

outputs:
  - id: transactions
    type: FILE
    description: Every transaction in the Form 4s read, with its code (P is a purchase), price and value (CSV).
    value: "{{ outputs.parse.outputFiles['transactions.csv'] }}"
  - id: alert_count
    type: INT
    value: "{{ outputs.alerts.size ?? 0 }}"

triggers:
  - id: new_form_4
    type: io.kestra.plugin.edgar.filings.Trigger
    description: Runs when an insider of a watched company files a Form 4. Enable after setting SEC_EDGAR_USER_AGENT.
    userAgent: "{{ kv('SEC_EDGAR_USER_AGENT', errorOnMissing=false) ?? '' }}"
    tickers:
      - PFE
      - INTC
      - NKE
      - TGT
      - CRM
    forms:
      - "4"
      - 4/A
    interval: PT30M
    disabled: true

extend:
  title: Monitor Insider Buying from SEC Form 4 Filings with DuckDB and Slack Alerts
  shortDescription: When an insider of a company you follow files a Form 4, parse the trades from SEC EDGAR, and alert on large open-market purchases and on several insiders buying within days of each other.
  metaTitle: SEC Form 4 Insider Buying Monitor with Kestra, DuckDB and Slack
  metaDescription: Parse SEC Form 4 filings, find large open-market insider purchases and clusters of insiders buying, and get alerts in Slack and the logs.
  description: |
    Alert on insider buying from the Form 4s that officers, directors and 10% owners file within two
    business days of a trade. No API key or paid data feed.

    ## How it works

    1. `new_form_4` (EDGAR trigger) runs the flow when an insider of a watched company files a Form 4.
    2. `each_company` lists each ticker's Form 4s and amendments filed in `lookback_days`, and
       `each_filing` downloads each Form 4's XML once, even when two watched companies list it.
    3. `parse` (Python, standard library) writes one row per transaction. Joint filers (a fund and its
       general partner) count as one insider.
    4. `alerts` (DuckDB) keeps open-market purchases (code `P`) in the company's own stock, replaces
       amended trades with the latest filing, and flags:
       - large purchase: one insider's purchases in a Form 4 reach `min_purchase_usd`
       - cluster: `cluster_min_insiders` different insiders buy within `cluster_window_days`
       On a triggered run, only findings that include a new filing are reported.

    ## What you get

    - Alerts at WARN in the logs and in Slack, naming each insider, role, shares, value and dates.
    - A `transactions` CSV of every trade read, sales and grants included.
    - A purchase whose price is only in a footnote counts toward a cluster, never the dollar rule.

    ## Who it's for

    Equity and credit analysts, portfolio managers and investor relations teams.

    ## Why orchestrate this with Kestra

    The EDGAR trigger replaces a polling script and keeps its own watermark; every run keeps its files
    and logs, and the rules are one SQL query versioned with the flow.

    ## Prerequisites

    Kestra 2.0 with plugin-edgar 1.0.0 (auto-installed on save in a local OSS instance, otherwise
    `kestra plugins install io.kestra.plugin:plugin-edgar:1.0.0`), and Docker for the Python task.

    ### Secrets

    - `SLACK_WEBHOOK_URL` (optional): without it the Slack step ends in a warning; alerts stay logged.

    ## Quick start

    1. **Namespaces** > `company.team` > **KV Store**: key `SEC_EDGAR_USER_AGENT`, type `STRING`, value
       your name and email (`Example Co admin@example.com`). SEC rejects requests without one.
    2. Execute with `lookback_days` set to 90, then check the logs and `transactions`.
    3. Copy the watchlist into the trigger's `tickers` (a trigger can't read inputs) and enable it.

    ## How to extend

    - Alert on sales too: add a rule on code `S`, leaving out trades under a 10b5-1 plan.
    - Known limits: Form 4 doesn't separate open-market buys from private purchases (both are `P`), and
      derivative trades such as option exercises are left out.

    ## Links

    - [SEC Form 4 guide](https://www.sec.gov/files/forms-3-4-5.pdf),
      [EDGAR Download](https://kestra.io/plugins/plugin-edgar/filings/io.kestra.plugin.edgar.filings.download),
      [EDGAR Trigger](https://kestra.io/plugins/plugin-edgar/filings/io.kestra.plugin.edgar.filings.trigger),
      [DuckDB Query](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.query),
      [Loop](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop)
  tags:
    - Data
    - Business
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
