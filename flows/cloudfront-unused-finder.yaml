id: cloudfront-unused-finder
namespace: company.finops

description: |
  Finds CloudFront distributions serving zero traffic. A distribution costs
  ~$1/month plus request charges, but the real cost is the forgotten S3 origins,
  WAF rules, and certificates attached to dead projects. This flow checks 30
  days of CloudWatch requests per distribution and reports the idle ones.

inputs:
  - id: traffic_window_days
    type: INT
    defaults: 30
    description: Lookback window in days for the request check.
  - id: monthly_cost_usd
    type: STRING
    defaults: "1.00"
    description: Monthly base cost of one distribution in USD (before request charges).

tasks:
  - id: find_unused
    type: io.kestra.plugin.aws.cli.AwsCLI
    description: List distributions and check 30-day CloudWatch request counts.
    commands:
      - |
        DAYS={{ inputs.traffic_window_days }}
        PRICE="{{ inputs.monthly_cost_usd }}"
        END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        START=$(date -u -d "$DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
        PERIOD=$((DAYS * 86400))
        echo "Checking CloudFront distributions (traffic window: last $DAYS days)"
        aws cloudfront list-distributions \
          --query 'DistributionList.Items[].[Id,DomainName,Status]' \
          --output text > /tmp/cf.txt || true
        IDLE_COUNT=0
        IDLE_LIST=""
        while read -r DIST DOMAIN STATUS; do
          [ -z "$DIST" ] && continue
          REQ=$(aws cloudwatch get-metric-statistics --region us-east-1 \
            --namespace AWS/CloudFront \
            --metric-name Requests \
            --dimensions Name=DistributionId,Value="$DIST" Name=Region,Value=Global \
            --start-time "$START" --end-time "$END" \
            --period "$PERIOD" --statistics Sum \
            --query 'Datapoints[0].Sum' --output text 2>/dev/null)
          case "$REQ" in ''|'None') REQ=0;; esac
          REQ_INT=${REQ%.*}
          echo "distribution $DIST ($DOMAIN): ${REQ_INT} requests in ${DAYS}d"
          if [ "$REQ_INT" -eq 0 ]; then
            IDLE_LIST="${IDLE_LIST}${DIST} (${DOMAIN}), "
            IDLE_COUNT=$((IDLE_COUNT + 1))
          fi
        done < /tmp/cf.txt
        SAVINGS=$(python3 -c "print('{:.2f}'.format($IDLE_COUNT * float('$PRICE')))")
        if [ "$IDLE_COUNT" -gt 0 ]; then HAS_IDLE=true; else HAS_IDLE=false; fi
        echo "HAS_IDLE=$HAS_IDLE"
        echo "IDLE_COUNT=$IDLE_COUNT"
        echo "IDLE_DISTS=$IDLE_LIST"
        echo "EST_MONTHLY_SAVINGS=$SAVINGS"
    env:
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
  - id: notify
    type: io.kestra.plugin.core.flow.If
    description: Report idle distributions for teardown review.
    condition: "{{ outputs.find_unused.vars.HAS_IDLE == 'true' }}"
    then:
      - id: slack_idle
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":money_with_wings: Idle CloudFront distributions — *{{ outputs.find_unused.vars.IDLE_COUNT }}* with zero requests in 30 days, ~${{ outputs.find_unused.vars.EST_MONTHLY_SAVINGS }}/mo base waste (plus attached origins/WAF).\n`{{ outputs.find_unused.vars.IDLE_DISTS }}`\nDisable first, delete after a week — check S3 origins and ACM certs attached to them."
          }
    else:
      - id: log_busy
        type: io.kestra.plugin.core.log.Log
        message: "No idle CloudFront distributions — every distribution served requests in the window."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Sunday at 02:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 2 * * 0"
    disabled: true

extend:
  title: Unused CloudFront Distribution Finder
  metaTitle: Find Idle CloudFront Distributions | Kestra
  shortDescription: Audit CloudFront distributions, check 30 days of CloudWatch requests per distribution, and get a Slack report of the idle ones with teardown guidance.
  metaDescription: Dead CloudFront distributions hide forgotten origins and certs. This flow finds zero-traffic distributions and reports them weekly.
  description: |
    A CloudFront distribution is cheap on its own — about a dollar a month — but it's never alone. Behind every forgotten distribution sits an S3 origin still billing, WAF rules still charging, and an ACM certificate up for renewal. Killed projects leave their distributions behind because "it's just a dollar." This blueprint finds them with real traffic data.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 02:00 UTC (shipped disabled).
    2. The flow lists every CloudFront distribution in the account.
    3. Per distribution, it pulls the full-window `Requests` CloudWatch metric (CloudFront metrics live in us-east-1, handled automatically).
    4. Distributions with zero requests in the window are flagged idle, and base waste is estimated.
    5. An `If` task posts a Slack report with teardown guidance — disable first, delete after a week — only when something is actually idle.

    ## What you get

    - A weekly list of distributions serving zero traffic, with domains for context.
    - A nudge to clean the attached resources — origins, WAF rules, certificates — where the real money hides.
    - Safe teardown guidance: disable before delete, so a mistake is reversible.
    - Silence when everything serves traffic — alerts only on real findings.

    ## Who it's for

    Platform engineers with a CloudFront estate that grew organically, where nobody remembers which distribution belongs to which dead project.

    ## Why orchestrate this with Kestra

    A one-off console session finds today's dead distributions and is forgotten by next month. As a scheduled Kestra flow the audit runs itself, the window is an input anyone can tune, every run is logged for audit, and the report includes the teardown checklist — not just a list.

    ## Prerequisites

    - AWS credentials with `cloudfront:ListDistributions` and `cloudwatch:GetMetricStatistics` permissions.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the CloudFront and CloudWatch API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the CloudFront and CloudWatch API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the teardown report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Run manually once and review the Slack report (or the clean log line).
    3. Enable the weekly schedule trigger.

    ## How to extend

    - Also check `BytesDownloaded` to catch distributions serving tiny health-check traffic.
    - List attached origins and WAF web ACLs per idle distribution for a full teardown checklist.
    - Auto-disable (not delete) distributions idle for 90+ days as a safe first step.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [CloudFront pricing](https://aws.amazon.com/cloudfront/pricing/)
    - [CloudFront list-distributions API](https://docs.aws.amazon.com/cli/latest/reference/cloudfront/list-distributions.html)
  tags:
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Monitoring & Alerting
  ee: false
  demo: false
