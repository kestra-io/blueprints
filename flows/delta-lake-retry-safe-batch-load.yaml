id: delta-lake-retry-safe-batch-load
namespace: company.team

concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: batches
    type: INT
    displayName: Number of demo batches
    description: How many numbered batches of 200 payment rows the demo creates.
    defaults: 6
    min: 2

  - id: crash_after_batch
    type: INT
    displayName: Interrupt the first load after this batch
    description: The first load stops right after this batch is committed, like a worker killed before it could report success. Keep it lower than the number of batches.
    defaults: 3
    min: 1

  - id: idempotency_guard
    type: BOOL
    displayName: Idempotency guard
    description: When true, the loader reads the batch number recorded in the Delta log and skips batches already applied. Turn it off to see what the guard prevents. The loader then reloads from batch 1 on every run and the final check fails with duplicate rows.
    defaults: true

triggers:
  - id: hourly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Disabled. In a real pipeline each tick would apply only the batches that are new. In this demo every execution builds a fresh table, so enabling it only repeats the demo.
    cron: "0 * * * *"
    disabled: true

tasks:
  - id: work
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One directory holds the loader, the batch files, the expected totals and the demo table. Every execution gets a new directory, so each run starts from an empty table.
    inputFiles:
      loader.py: |
        """Retry-safe batch loader for a Delta Lake table (delta-rs).

        Usage: python loader.py prepare | apply | verify

        The idea: every Delta commit that loads batch N also records (APP_ID, N) as a
        Delta transaction identifier, in the same atomic commit as the data. Before it
        loads anything, the loader reads the last recorded number and skips every batch
        up to it. A rerun after a crash therefore resumes instead of appending twice.
        """
        import glob
        import json
        import os
        import random
        import re
        import sys

        APP_ID = "kestra-payments-ledger"
        TABLE = "ledger"
        BATCH_DIR = "batches"
        ROWS_PER_BATCH = 200


        def env_bool(name, default):
            return os.environ.get(name, default).strip().lower() == "true"


        def batch_numbers():
            nums = []
            for path in glob.glob(BATCH_DIR + "/batch_*.jsonl"):
                nums.append(int(re.search(r"batch_(\d+)\.jsonl$", path).group(1)))
            return sorted(nums)


        def prepare():
            """Write numbered batch files plus an expected.json computed in plain Python."""
            n_batches = int(os.environ.get("BATCHES", "6"))
            rng = random.Random(42)
            os.makedirs(BATCH_DIR, exist_ok=True)
            expected = {"rows": 0, "amount_cents": 0, "rows_per_batch": {}}
            payment = 0
            for n in range(1, n_batches + 1):
                rows = []
                for _ in range(ROWS_PER_BATCH):
                    payment += 1
                    rows.append({
                        "payment_id": "P-%06d" % payment,
                        "account_id": rng.randint(1, 50),
                        "amount_cents": rng.randint(100, 50000),
                        "batch_no": n,
                    })
                with open("%s/batch_%04d.jsonl" % (BATCH_DIR, n), "w") as f:
                    for row in rows:
                        f.write(json.dumps(row) + "\n")
                expected["rows"] += len(rows)
                expected["amount_cents"] += sum(r["amount_cents"] for r in rows)
                expected["rows_per_batch"][str(n)] = len(rows)
            with open("expected.json", "w") as f:
                json.dump(expected, f)
            print("Prepared %d batches, %d rows, expected total %d cents."
                  % (n_batches, expected["rows"], expected["amount_cents"]))


        def read_batch(n):
            import pyarrow as pa
            schema = pa.schema([
                ("payment_id", pa.string()),
                ("account_id", pa.int64()),
                ("amount_cents", pa.int64()),
                ("batch_no", pa.int64()),
            ])
            with open("%s/batch_%04d.jsonl" % (BATCH_DIR, n)) as f:
                rows = [json.loads(line) for line in f if line.strip()]
            return pa.Table.from_pylist(rows, schema=schema)


        def apply():
            from deltalake import CommitProperties, DeltaTable, Transaction, write_deltalake
            from kestra import Kestra

            guard = env_bool("IDEMPOTENCY_GUARD", "true")
            crash_after = int(os.environ.get("CRASH_AFTER_BATCH", "0") or 0)

            available = batch_numbers()
            if not available:
                sys.exit("No batch files found in %s/." % BATCH_DIR)

            last = 0
            if guard and DeltaTable.is_deltatable(TABLE):
                last = DeltaTable(TABLE).transaction_version(APP_ID) or 0
            if guard:
                print("Last batch recorded in the Delta log: %d" % last)
            else:
                print("Idempotency guard is OFF: the loader ignores the Delta log and starts at batch 1.")

            if last > available[-1]:
                sys.exit("The table has batch %d recorded but the source only goes up to %d. "
                         "Refusing to continue." % (last, available[-1]))
            skipped = [n for n in available if n <= last]
            pending = [n for n in available if n > last]
            if pending != list(range(last + 1, last + 1 + len(pending))):
                sys.exit("Gap in the source batches: expected %d next, found %s. "
                         "Refusing to load out of order." % (last + 1, pending[:5]))
            if skipped:
                print("Skipping already applied batches: %s" % skipped)

            applied = []
            interrupted = False
            for n in pending:
                kwargs = {}
                if guard:
                    kwargs["commit_properties"] = CommitProperties(
                        app_transactions=[Transaction(app_id=APP_ID, version=n)])
                table = read_batch(n)
                write_deltalake(TABLE, table, mode="append", **kwargs)
                applied.append(n)
                print("Batch %d committed (%d rows)." % (n, table.num_rows))
                if crash_after and n == crash_after:
                    interrupted = True
                    print("SIMULATED INTERRUPTION: stopping after the commit of batch %d, "
                          "as if the worker had been killed before it could report success." % n)
                    break

            print("Applied %s, skipped %s." % (applied, skipped))
            Kestra.outputs({
                "applied": applied,
                "skipped": skipped,
                "applied_count": len(applied),
                "interrupted": interrupted,
            })


        def verify():
            import pyarrow.compute as pc
            from deltalake import DeltaTable
            from kestra import Kestra

            guard = env_bool("IDEMPOTENCY_GUARD", "true")
            with open("expected.json") as f:
                expected = json.load(f)
            dt = DeltaTable(TABLE)
            data = dt.to_pyarrow_table()

            rows = data.num_rows
            total = pc.sum(data["amount_cents"]).as_py() or 0
            duplicates = rows - len(pc.unique(data["payment_id"]))
            grouped = data.group_by("batch_no").aggregate([("payment_id", "count")]).to_pylist()
            per_batch = {str(g["batch_no"]): g["payment_id_count"] for g in grouped}

            results = []

            def check(name, got, want):
                ok = got == want
                results.append(ok)
                print("%s  %s: got %s, expected %s" % ("PASS" if ok else "FAIL", name, got, want))

            check("row count", rows, expected["rows"])
            check("sum of amount_cents", total, expected["amount_cents"])
            check("duplicate payment_id values", duplicates, 0)
            check("rows per batch", per_batch, expected["rows_per_batch"])
            if guard:
                check("last batch recorded in the Delta log", dt.transaction_version(APP_ID),
                      len(expected["rows_per_batch"]))
                replay = os.environ.get("REPLAY_APPLIED", "")
                if replay != "":
                    check("batches applied by the replay run", int(replay), 0)

            Kestra.outputs({"rows": rows, "duplicates": duplicates, "passed": all(results)})
            if not all(results):
                sys.exit("Verification failed: the table does not match the expected totals.")
            print("Verification passed: %d rows, no duplicates, totals match." % rows)


        if __name__ == "__main__":
            modes = {"prepare": prepare, "apply": apply, "verify": verify}
            if len(sys.argv) != 2 or sys.argv[1] not in modes:
                sys.exit("Usage: python loader.py prepare | apply | verify")
            modes[sys.argv[1]]()

    tasks:
      - id: prepare_batches
        type: io.kestra.plugin.scripts.python.Commands
        description: Write numbered batch files and an expected.json with the row count and amount total, computed in plain Python and not read back from Delta.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: python:3.12-slim
        env:
          BATCHES: "{{ inputs.batches }}"
        commands:
          - python loader.py prepare

      - id: load_interrupted
        type: io.kestra.plugin.scripts.python.Commands
        description: Load the batches in order, then stop after the chosen batch is committed, as a killed worker would. The script exits cleanly here only so the demo can carry on.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: python:3.12-slim
        beforeCommands:
          - pip install -q deltalake==1.6.6 pyarrow==25.0.1 kestra==2.0.0
        env:
          IDEMPOTENCY_GUARD: "{{ inputs.idempotency_guard }}"
          CRASH_AFTER_BATCH: "{{ inputs.crash_after_batch }}"
        commands:
          - python loader.py apply

      - id: load_rerun
        type: io.kestra.plugin.scripts.python.Commands
        description: What a Kestra retry or restart would run. It reads the last batch recorded in the Delta log, skips what is already there and loads the rest.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: python:3.12-slim
        beforeCommands:
          - pip install -q deltalake==1.6.6 pyarrow==25.0.1 kestra==2.0.0
        env:
          IDEMPOTENCY_GUARD: "{{ inputs.idempotency_guard }}"
          CRASH_AFTER_BATCH: "0"
        commands:
          - python loader.py apply

      - id: load_replay
        type: io.kestra.plugin.scripts.python.Commands
        description: Run the loader once more, as a duplicate delivery or a manual restart would. With the guard on it applies nothing.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: python:3.12-slim
        beforeCommands:
          - pip install -q deltalake==1.6.6 pyarrow==25.0.1 kestra==2.0.0
        env:
          IDEMPOTENCY_GUARD: "{{ inputs.idempotency_guard }}"
          CRASH_AFTER_BATCH: "0"
        commands:
          - python loader.py apply

      - id: verify_ledger
        type: io.kestra.plugin.scripts.python.Commands
        description: Compare the table with expected.json and fail the run on any mismatch.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: python:3.12-slim
        beforeCommands:
          - pip install -q deltalake==1.6.6 pyarrow==25.0.1 kestra==2.0.0
        env:
          IDEMPOTENCY_GUARD: "{{ inputs.idempotency_guard }}"
          REPLAY_APPLIED: "{{ outputs.load_replay.vars.applied_count }}"
        commands:
          - python loader.py verify

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      Interrupted load applied {{ outputs.load_interrupted.vars.applied }}.
      Rerun skipped {{ outputs.load_rerun.vars.skipped }} and applied {{ outputs.load_rerun.vars.applied }}.
      Replay skipped {{ outputs.load_replay.vars.skipped }} and applied {{ outputs.load_replay.vars.applied }}.
      Verified {{ outputs.verify_ledger.vars.rows }} rows with {{ outputs.verify_ledger.vars.duplicates }} duplicates.

errors:
  - id: report_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: "Delta batch load failed in {{ flow.id }}, execution {{ execution.id }}. Read the verify_ledger log first: a FAIL line shows which total differs. With idempotency_guard turned off this is the expected result. Otherwise check that the container can reach PyPI for the pip install, and that the batch files have no gap."

extend:
  title: Retry-safe batch loads into Delta Lake with transaction identifiers
  metaTitle: Retry-Safe Delta Lake Batch Load with Kestra
  shortDescription: Load numbered batches into a Delta table so a rerun after a crash resumes instead of duplicating rows, and check the result against independent totals.
  metaDescription: Kestra flow that loads numbered batches into Delta Lake with transaction identifiers, so a rerun after a crash skips committed batches and adds no duplicates.
  description: |
    A task that commits to a Delta table and then dies before it reports success gets rerun. A plain append then writes the same rows a second time, and delta-rs does not notice. This flow loads numbered batches so that a rerun resumes where the table left off, and it checks the final table against totals computed outside Delta. Everything runs offline on a local table, with no credentials.

    ## How it works
    1. `prepare_batches` writes six numbered batch files of payment rows, and an `expected.json` with the row count and amount total. Both come from plain Python, not from Delta.
    2. `load_interrupted` loads the batches in order. Each commit records a Delta transaction identifier, the pair (app id, batch number), in the same atomic commit as the data. After batch 3 the script stops, the way a killed worker would. It exits cleanly only so the demo can carry on.
    3. `load_rerun` is what a Kestra retry or restart would run. It reads the last batch number recorded in the table, skips batches 1 to 3 and loads 4 to 6. If the source has a gap, or the table is ahead of the source, it fails instead of loading.
    4. `load_replay` runs the loader a third time, like a duplicate delivery. It has to apply nothing.
    5. `verify_ledger` compares the table with `expected.json`: row count, amount total, duplicate `payment_id` values, rows per batch, the last recorded batch and the result of the replay. Any mismatch fails the run.
    6. `summary` logs what each load applied and skipped. The `hourly` Schedule is disabled.

    ## The pattern
    The whole idea is two calls. Read the marker before loading, and write it in the same commit as the data.

    ```python
    last = DeltaTable(path).transaction_version(APP_ID) or 0

    write_deltalake(
        path, batch, mode="append",
        commit_properties=CommitProperties(
            app_transactions=[Transaction(app_id=APP_ID, version=n)]
        ),
    )
    ```

    delta-rs 1.6.6 does not skip a write whose version was already recorded, so the check on `last` is the loader's job. In a replay test it appended the rows again.

    ## Prerequisites
    - A worker that can run Docker, to start `python:3.12-slim`.
    - Network access to pull the image and install `deltalake`, `pyarrow` and `kestra` from PyPI. The versions are pinned.
    - Secrets: none required.

    ## Quick start
    1. Import the flow into the `company.team` namespace, or paste it into the editor.
    2. Execute it with the default inputs. Nothing else needs to be set up.
    3. Open the `load_rerun` logs. They show which batches were skipped and which were loaded.
    4. Open the `verify_ledger` logs for the PASS lines.
    5. Optional: execute again with `idempotency_guard` turned off and read the FAIL lines in `verify_ledger`.
    6. The `hourly` Schedule stays disabled. Enabling it only repeats the demo, because every execution builds a new table.

    ## Inputs
    - `batches` (INT, default 6, minimum 2): number of demo batches of 200 rows.
    - `crash_after_batch` (INT, default 3, minimum 1): the first load stops after this batch is committed. Keep it lower than `batches`.
    - `idempotency_guard` (BOOL, default true, allowed values true or false): with false the loader ignores the Delta log. With the defaults the table then holds 3000 rows instead of 1200 and `verify_ledger` fails. That failure is the point of the switch.

    ## Outputs
    The flow produces no files. Each load task and the check expose values through `vars`:
    - `outputs.load_rerun.vars.applied`, for example `[4, 5, 6]`
    - `outputs.load_rerun.vars.skipped`, for example `[1, 2, 3]`
    - `outputs.load_replay.vars.applied_count`, `0` when the guard works
    - `outputs.load_interrupted.vars.interrupted`, `true` for the first load
    - `outputs.verify_ledger.vars.rows`, `duplicates` and `passed`

    ## Expected result
    With the defaults the execution ends in SUCCESS. `load_rerun` logs `Skipping already applied batches: [1, 2, 3]` and commits batches 4, 5 and 6. `load_replay` logs `Applied [], skipped [1, 2, 3, 4, 5, 6]`. `verify_ledger` ends with `Verification passed: 1200 rows, no duplicates, totals match.`

    With `idempotency_guard` turned off the execution ends in FAILED at `verify_ledger`, with 3000 rows against 1200 expected and 1800 duplicate `payment_id` values.

    ## Limits
    - Batches must be numbered 1, 2, 3 and so on, without gaps.
    - A batch delivered again with the same number but different content is skipped, not compared.
    - One app id covers one table and one source. Two sources loading the same table need two ids.
    - Two runs committing with the same app id at the same time: delta-rs 1.6.6 rejects the second commit with `CommitFailedError`. The flow also queues runs with `concurrency`.
    - The Delta docs list a table property, `delta.setTransactionRetentionDuration`, that lets old transaction identifiers expire. It has no default. Leave it unset on a table loaded this way, or an old batch could be applied twice.

    ## How to extend
    - Replace `prepare_batches` with your own extract step that writes `batch_0001.jsonl`, `batch_0002.jsonl` and so on, and adjust the schema in `read_batch`.
    - Point `TABLE` at a table that outlives the run, for example on object storage, and pass storage credentials through `env` with `{{ secret('NAME') }}`. This flow does not exercise that path.
    - Once the table lives outside the run, add `retry` (`type: constant`, `interval`, `maxAttempts`) to the load task.
    - For upserts, `DeltaTable.merge` accepts the same `commit_properties`.

    ## Links
    - [plugin-script-python](https://kestra.io/plugins/plugin-script-python)
    - [Delta table properties](https://docs.delta.io/table-properties/)
    - [Delta protocol, transaction identifiers](https://github.com/delta-io/delta/blob/master/PROTOCOL.md)
  tags:
    - Data
  subTags:
    - ELT & Data Landing
    - Data Quality
  ee: false
  demo: true