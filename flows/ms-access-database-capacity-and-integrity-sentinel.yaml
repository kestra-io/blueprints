id: ms-access-database-capacity-and-integrity-sentinel
namespace: company.data

inputs:
  - id: database_path
    type: STRING
    defaults: "finance_ledger.accdb"
    description: Local or working directory filename for the target Microsoft Access database.

  - id: access_file_uri
    type: STRING
    defaults: ""
    description: Optional Kestra internal storage URI to an existing Access .accdb or .mdb database file.

  - id: max_unposted_threshold
    type: INT
    defaults: 10
    description: Maximum tolerable count of pending or unverified ledger transactions before raising an alert.

  - id: max_balance_discrepancy
    type: INT
    defaults: 0
    description: Maximum allowable numerical variance between total debits and total credits.

  - id: auto_flag_discrepancies
    type: BOOL
    defaults: false
    description: When true, updates unposted records to append an AUDIT_HOLD tag in the account code.

  - id: dry_run
    type: BOOL
    defaults: false
    description: When true, simulates remediation without modifying records in the Access database.

  - id: slack_channel
    type: STRING
    defaults: "#finance-ops-alerts"
    description: Slack destination channel for operational and reconciliation notifications.

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * *"
    disabled: true
    inputs:
      database_path: "finance_ledger.accdb"
      access_file_uri: ""
      max_unposted_threshold: 10
      max_balance_discrepancy: 0
      auto_flag_discrepancies: false
      dry_run: false
      slack_channel: "#finance-ops-alerts"

tasks:
  - id: setup_test_database
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.access_file_uri == '' }}"
    then:
      - id: create_seed_ledger
        type: io.kestra.plugin.jdbc.access.Query
        url: "jdbc:ucanaccess:///{{ inputs.database_path }}"
        outputDbFile: true
        sql: |
          CREATE TABLE ledger_entries (
            entry_id AUTOINCREMENT PRIMARY KEY,
            account_code VARCHAR(30),
            debit DOUBLE,
            credit DOUBLE,
            posted BIT,
            entry_date TIMESTAMP
          );
          INSERT INTO ledger_entries (account_code, debit, credit, posted, entry_date) VALUES ('1010-CASH', 15000.00, 0.00, true, NOW());
          INSERT INTO ledger_entries (account_code, debit, credit, posted, entry_date) VALUES ('2010-AP', 0.00, 15000.00, true, NOW());
          INSERT INTO ledger_entries (account_code, debit, credit, posted, entry_date) VALUES ('1020-RECEIVABLES', 4500.00, 0.00, false, NOW());
          INSERT INTO ledger_entries (account_code, debit, credit, posted, entry_date) VALUES ('4010-REVENUE', 0.00, 4200.00, false, NOW());
        fetchType: NONE
        description: Bootstraps an operational test Access database with seeded transactions if no external file URI is provided.

  - id: probe_ledger_integrity
    type: io.kestra.plugin.jdbc.access.Query
    url: "jdbc:ucanaccess:///{{ inputs.database_path }}"
    accessFile: "{{ outputs.create_seed_ledger.databaseUri ?? (inputs.access_file_uri != '' ? inputs.access_file_uri : null) }}"
    outputDbFile: true
    sql: |
      SELECT
        COUNT(*) AS total_entries,
        SUM(IIF(posted = false, 1, 0)) AS unposted_count,
        ROUND(SUM(debit), 2) AS total_debits,
        ROUND(SUM(credit), 2) AS total_credits,
        ROUND(ABS(SUM(debit) - SUM(credit)), 2) AS balance_delta
      FROM ledger_entries;
    fetchType: FETCH_ONE
    allowFailure: true
    description: Queries the Access database to audit ledger balances, unposted transaction counts, and debit/credit reconciliation parity.

  - id: classify_database_health
    type: io.kestra.plugin.core.debug.Return
    format: >-
      {{
        (outputs.probe_ledger_integrity is not defined or outputs.probe_ledger_integrity.row is not defined) ? 'PROBE_FAILED' :
        (outputs.probe_ledger_integrity.row.balance_delta > inputs.max_balance_discrepancy) ? 'CRITICAL_LEDGER_MISMATCH' :
        (outputs.probe_ledger_integrity.row.unposted_count >= inputs.max_unposted_threshold) ? 'WARNING_UNPOSTED_BACKLOG' :
        'HEALTHY_RECONCILED'
      }}
    description: Evaluates transaction audit metrics against financial governance and balance parity thresholds.

  - id: route_by_health_status
    type: io.kestra.plugin.core.flow.Switch
    value: "{{ outputs.classify_database_health.value }}"
    cases:
      CRITICAL_LEDGER_MISMATCH:
        - id: alert_ledger_mismatch_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "[CRITICAL] Microsoft Access Ledger Discrepancy Detected\n• Target Database: {{ inputs.database_path }}\n• Total Debits: ${{ outputs.probe_ledger_integrity.row.total_debits }}\n• Total Credits: ${{ outputs.probe_ledger_integrity.row.total_credits }}\n• Balance Delta: ${{ outputs.probe_ledger_integrity.row.balance_delta }} (Limit: ${{ inputs.max_balance_discrepancy }})\n• Unposted Entries: {{ outputs.probe_ledger_integrity.row.unposted_count }}\n• Execution ID: {{ execution.id }}\nAction Required: Debits and credits fail reconciliation parity. Audit unposted batches before monthly close."
            }

        - id: check_remediation
          type: io.kestra.plugin.core.flow.If
          condition: "{{ inputs.auto_flag_discrepancies == true and inputs.dry_run == false }}"
          then:
            - id: flag_unbalanced_records
              type: io.kestra.plugin.jdbc.access.Query
              url: "jdbc:ucanaccess:///{{ inputs.database_path }}"
              accessFile: "{{ outputs.probe_ledger_integrity.databaseUri ?? outputs.create_seed_ledger.databaseUri }}"
              outputDbFile: true
              sql: "UPDATE ledger_entries SET account_code = account_code & '-AUDIT_HOLD' WHERE posted = false;"
              fetchType: NONE

            - id: notify_remediation_slack
              type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
              url: "{{ secret('SLACK_WEBHOOK_URL') }}"
              payload: |
                {
                  "channel": "{{ inputs.slack_channel }}",
                  "text": "[REMEDIATION] Unposted transactions have been marked with AUDIT_HOLD in {{ inputs.database_path }} to prevent premature posting."
                }

      WARNING_UNPOSTED_BACKLOG:
        - id: alert_backlog_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "[WARNING] Microsoft Access Pending Transaction Backlog\n• Target Database: {{ inputs.database_path }}\n• Unposted Count: {{ outputs.probe_ledger_integrity.row.unposted_count }} (Threshold: {{ inputs.max_unposted_threshold }})\n• Execution ID: {{ execution.id }}\nBatch entries require operator posting approval."
            }

      HEALTHY_RECONCILED:
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "Microsoft Access ledger healthy on {{ inputs.database_path }}. Debits (${{ outputs.probe_ledger_integrity.row.total_debits }}) and credits (${{ outputs.probe_ledger_integrity.row.total_credits }}) balance with zero delta."

      PROBE_FAILED:
        - id: alert_probe_failed_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "[ALERT] Microsoft Access Database Connection Failure\n• Target File: {{ inputs.database_path }}\n• Execution ID: {{ execution.id }}\nUnable to connect to Access database via UCanAccess driver. Inspect file permissions and lock states."
            }
    description: Routes operational notifications and guarded remediation based on ledger reconciliation health.

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "Access sentinel cycle {{ execution.id }} completed. Verdict: {{ outputs.classify_database_health.value }}, Total rows: {{ outputs.probe_ledger_integrity.row.total_entries ?? 0 }}, Balance delta: ${{ outputs.probe_ledger_integrity.row.balance_delta ?? 0 }}."
    description: Records an immutable audit log entry documenting execution metrics and remediation decisions.

errors:
  - id: alert_flow_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "[ERROR] Microsoft Access Sentinel Workflow Failure\nFlow execution {{ execution.id }} encountered an unhandled error against {{ inputs.database_path }}. Review Kestra task logs."
      }

extend:
  title: Microsoft Access Database Capacity & Ledger Integrity Sentinel
  metaTitle: Microsoft Access Database Integrity Sentinel | Kestra
  shortDescription: Audits Microsoft Access databases for transaction ledger mismatches, unposted backlogs, and automates audit hold remediation.
  metaDescription: Audit Microsoft Access databases for debit-credit reconciliation deltas, detect unposted transaction backlogs, alert Slack, and automate audit isolation.
  description: |
    Across financial institutions, insurance carriers, manufacturing plants, and healthcare organizations, critical departmental operations still rely on legacy Microsoft Access (`.accdb` and `.mdb`) desktop databases for operational bookkeeping, journal entries, policy underwriting logs, and inventory tracking. Because desktop Access lacks enterprise-grade server monitoring, these databases suffer from silent operational failures: unposted batch transactions accumulate, debit/credit ledger imbalances develop without warning, and unchecked file inflation approaches Access's fatal 2 GB file ceiling, causing catastrophic file corruption.

    This blueprint establishes an automated Day 2 operations sentinel for Microsoft Access databases using Kestra's embedded pure-Java UCanAccess JDBC driver. It connects to local or storage-backed Access files, audits financial ledgers for reconciliation parity, detects unposted transaction backlogs, routes urgent alerts to Slack, and safely flags out-of-balance entries to prevent erroneous monthly financial closures.

    ## How it works

    1. Scheduled trigger (`periodic_schedule`) initiates the diagnostic audit daily at 06:00 UTC, with manual on-demand execution supported via configurable inputs.
    2. Bootstrap check (`setup_test_database`) dynamically seeds a self-contained test Access database with sample ledger transactions when no external file URI is supplied, ensuring out-of-the-box testability.
    3. Diagnostic probe (`probe_ledger_integrity`) executes an aggregate SQL query via `io.kestra.plugin.jdbc.access.Query` using pure-Java UCanAccess JDBC, computing total debits, total credits, net balance delta, and pending unposted row counts.
    4. Classification logic (`classify_database_health`) evaluates query outputs using Pebble templating to assign an operational status: `CRITICAL_LEDGER_MISMATCH` if debit/credit variance exceeds threshold, `WARNING_UNPOSTED_BACKLOG` if pending entries accumulate, `HEALTHY_RECONCILED` when balances match, or `PROBE_FAILED` on corrupt files or lock errors.
    5. Flow router (`route_by_health_status`) directs execution along dedicated branches according to classified severity.
    6. On `CRITICAL_LEDGER_MISMATCH`, a structured Slack incident card alerts financial operations with exact debit/credit figures and discrepancy amounts.
    7. Guarded remediation (`check_remediation`) evaluates `auto_flag_discrepancies` and `dry_run` toggles. If enabled, `flag_unbalanced_records` issues an update query appending `-AUDIT_HOLD` to unposted account codes, isolating discrepancies before ledger posting.
    8. Audit log task (`log_audit_summary`) commits an immutable summary entry capturing execution ID, row counts, and evaluated balance deltas.

    ## What you get

    - Automated continuous surveillance of departmental Microsoft Access databases without requiring a Windows host or Microsoft Office runtime.
    - Early warning alerting when debits and credits fail double-entry bookkeeping balance parity.
    - Detection of unposted batch transaction backlogs before end-of-month financial closing deadlines.
    - Automated self-healing isolation that flags suspicious entries with audit holds to prevent ledger corruption.
    - Safe dry-run testing modes enabling accounting teams to verify audit queries before modifying live database files.

    ## Who it's for

    - Financial Operations and Accounting Technology Teams maintaining departmental Access bookkeeping ledgers.
    - ERP Migration Engineers auditing legacy Access data structures prior to cloud warehouse migration.
    - Compliance and Risk Officers enforcing double-entry bookkeeping integrity and segregation of duties.
    - IT Systems Administrators managing shared network drive Access databases for business units.

    ## Why orchestrate this with Kestra

    Legacy Access databases are typically managed with fragile desktop macros or local Visual Basic for Applications (VBA) scripts that fail silently when client machines disconnect or users lock files. Kestra runs the UCanAccess engine directly inside containerized Linux workers, enabling declarative scheduled execution, atomic secret masking, centralized execution logs, and multi-channel alerting without external Windows Server virtual machines or manual desktop oversight.

    ## Prerequisites

    - A Kestra instance with the `plugin-jdbc-access` plugin installed.
    - A Microsoft Access `.accdb` or `.mdb` file accessible on the worker filesystem or uploaded to Kestra internal storage.
    - An incoming Slack Webhook URL configured in Kestra secrets.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Webhook URL for posting operational incident notifications to Slack.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this blueprint into Kestra.
    3. Click **Execute** with default inputs (`database_path: finance_ledger.accdb`, `access_file_uri: ""`) to verify the automated seed, probe, and classification cycle.
    4. To audit an existing production Access database, set `access_file_uri` to the Kestra storage URI (`kestra:///...`) or provide the worker filesystem path in `database_path`.
    5. Enable `periodic_schedule` to activate daily background reconciliation surveillance.

    ## How to extend

    - Add automated database compaction by invoking UCanAccess `COMPACT=TRUE` connection properties to prevent databases from exceeding the 2 GB Access file limit.
    - Integrate downstream cloud lakehouse replication (`io.kestra.plugin.jdbc.duckdb` or `io.kestra.plugin.snowflake`) to sync reconciled Access tables directly into analytical warehouses.
    - Connect email digest tasks (`io.kestra.plugin.email.MailSend`) to email daily reconciliation certificates to controllers and finance managers.

    ## Links

    - [Kestra Microsoft Access Plugin Documentation](https://kestra.io/plugins/plugin-jdbc/access/io.kestra.plugin.jdbc.access.query)
    - [UCanAccess JDBC Driver Documentation](https://ucanaccess.sourceforge.net/site.html)
    - [Kestra Flow Control Documentation](https://kestra.io/docs/workflow-components/tasks)
  tags:
    - Data
  subTags:
    - Day 2 Operations
    - Testing & Quality
  ee: false
  demo: false
