id: dapr-sidecar-health-and-state-store-sentinel
namespace: company.platform

description: |
  Continuously audits Dapr (Distributed Application Runtime) sidecar availability, validates runtime metadata and registered components, checks state store connectivity, and dispatches actionable Slack incident notifications upon runtime degradation.

inputs:
  - id: dapr_http_endpoint
    type: STRING
    displayName: Dapr Sidecar Endpoint
    defaults: "http://localhost:3500"
    description: "Base HTTP URL of the Dapr sidecar runtime API."

  - id: target_state_store
    type: STRING
    displayName: Target State Store Name
    defaults: "statestore"
    description: "Name of the configured Dapr state store component to evaluate."

  - id: health_check_key
    type: STRING
    displayName: State Health Check Key
    defaults: "health-canary"
    description: "State store key queried to verify datastore read responsiveness."

  - id: slack_channel
    type: STRING
    displayName: Operations Slack Channel
    defaults: "#platform-alerts"
    description: "Target Slack channel for Dapr sidecar and component alerts."

triggers:
  - id: scheduled_sentinel_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */2 * * *"
    disabled: true
    inputs:
      dapr_http_endpoint: "http://localhost:3500"
      target_state_store: "statestore"
      health_check_key: "health-canary"

tasks:
  - id: probe_sidecar_health
    type: io.kestra.plugin.core.http.Request
    description: "Queries the Dapr sidecar healthz endpoint to verify core runtime readiness."
    uri: "{{ inputs.dapr_http_endpoint }}/v1.0/healthz"
    method: GET

  - id: probe_dapr_metadata
    type: io.kestra.plugin.core.http.Request
    description: "Retrieves runtime metadata to inspect loaded components, subscriptions, and actor configurations."
    uri: "{{ inputs.dapr_http_endpoint }}/v1.0/metadata"
    method: GET

  - id: probe_state_store
    type: io.kestra.plugin.core.http.Request
    description: "Probes the specified state store component to verify that the backing datastore is responding to queries."
    uri: "{{ inputs.dapr_http_endpoint }}/v1.0/state/{{ inputs.target_state_store }}/{{ inputs.health_check_key }}"
    method: GET

  - id: evaluate_dapr_status
    type: io.kestra.plugin.core.flow.Switch
    description: "Evaluates Dapr probe results using Pebble conditionals and branches to alert channels or compliance logging."
    value: |
      {% if outputs.probe_sidecar_health.code != 200 and outputs.probe_sidecar_health.code != 204 %}
      SIDECAR_UNHEALTHY
      {% elseif outputs.probe_dapr_metadata.code != 200 %}
      METADATA_UNAVAILABLE
      {% elseif outputs.probe_state_store.code != 200 and outputs.probe_state_store.code != 204 %}
      STATE_STORE_ERROR
      {% else %}
      COMPLIANT
      {% endif %}
    cases:
      COMPLIANT:
        - id: log_compliant_state
          type: io.kestra.plugin.core.log.Log
          level: INFO
          message: "Dapr sidecar at {{ inputs.dapr_http_endpoint }} is healthy, runtime metadata is accessible, and state store '{{ inputs.target_state_store }}' is fully operational."

      SIDECAR_UNHEALTHY:
        - id: alert_sidecar_down
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "attachments": [
                {
                  "color": "#D32F2F",
                  "title": "Dapr Sidecar Health Alert",
                  "text": "CRITICAL: Dapr sidecar at `{{ inputs.dapr_http_endpoint }}` returned non-healthy HTTP status `{{ outputs.probe_sidecar_health.code }}`.\nMicroservice state management and service invocation are at risk.",
                  "footer": "Kestra Sentinel | Platform Operations"
                }
              ]
            }
        - id: log_sidecar_failure
          type: io.kestra.plugin.core.log.Log
          level: WARN
          message: "CRITICAL: Dapr sidecar health probe failed with HTTP status code {{ outputs.probe_sidecar_health.code }}."

      METADATA_UNAVAILABLE:
        - id: alert_metadata_failure
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "attachments": [
                {
                  "color": "#E65100",
                  "title": "Dapr Metadata API Failure",
                  "text": "WARNING: Unable to query Dapr runtime metadata from `{{ inputs.dapr_http_endpoint }}/v1.0/metadata` (HTTP `{{ outputs.probe_dapr_metadata.code }}`). Check sidecar configuration and endpoint access.",
                  "footer": "Kestra Sentinel | Platform Operations"
                }
              ]
            }

      STATE_STORE_ERROR:
        - id: alert_statestore_failure
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "attachments": [
                {
                  "color": "#F57C00",
                  "title": "Dapr State Store Component Degradation",
                  "text": "WARNING: State store component `{{ inputs.target_state_store }}` responded with HTTP status `{{ outputs.probe_state_store.code }}` when querying key `{{ inputs.health_check_key }}`.\nBacking database connectivity or component credentials may have drifted.",
                  "footer": "Kestra Sentinel | Platform Operations"
                }
              ]
            }
        - id: log_statestore_failure
          type: io.kestra.plugin.core.log.Log
          level: WARN
          message: "State store component '{{ inputs.target_state_store }}' failed canary probe with HTTP status {{ outputs.probe_state_store.code }}."

  - id: record_audit_log
    type: io.kestra.plugin.core.log.Log
    description: "Emits a permanent execution audit log tracking Dapr runtime status."
    level: INFO
    message: "Completed Dapr sentinel audit on {{ inputs.dapr_http_endpoint }}. Sidecar code={{ outputs.probe_sidecar_health.code }}, Metadata code={{ outputs.probe_dapr_metadata.code }}, StateStore code={{ outputs.probe_state_store.code }}."

extend:
  title: Dapr Sidecar Health and State Store Component Sentinel
  metaTitle: Dapr Sidecar Health and State Store Sentinel | Kestra
  shortDescription: Audits Dapr sidecar runtime health, verifies component metadata, evaluates state store access, and dispatches Slack incident alerts on outages.
  metaDescription: Audit Dapr sidecar runtime availability, inspect component metadata, verify state store connectivity, and alert via Slack with Kestra orchestration.
  description: |
    Continuously audits Dapr (Distributed Application Runtime) sidecar availability, validates runtime metadata and registered components, checks state store connectivity, and dispatches actionable Slack incident notifications upon runtime degradation.

    ## How it works

    1. A recurrent `Schedule` trigger periodically initiates the sentinel workflow (configured every 2 hours by default, disabled initially for manual configuration).
    2. The `probe_sidecar_health` task issues a `GET` request to the Dapr sidecar `/v1.0/healthz` endpoint to confirm runtime readiness.
    3. The `probe_dapr_metadata` task fetches the active runtime metadata from `/v1.0/metadata` to verify registered components, actors, and pub/sub subscriptions.
    4. The `probe_state_store` task queries a canary state key against `/v1.0/state/{storeName}/{key}` to confirm read responsiveness of the backing datastore.
    5. The `evaluate_dapr_status` task uses native Pebble conditional expressions inside a `Switch` task to classify health into `COMPLIANT`, `SIDECAR_UNHEALTHY`, `METADATA_UNAVAILABLE`, or `STATE_STORE_ERROR`.
    6. If a failure state is detected, contextual incident notifications are sent via `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` with diagnostic HTTP codes, and a comprehensive audit trail is recorded in Kestra execution history.

    ## What you get

    - Proactive detection of uninitialized or crashed Dapr sidecar containers across microservice pods.
    - Continuous validation of backing state store connections (e.g., Redis, PostgreSQL, AWS DynamoDB, Azure Cosmos DB).
    - Rapid incident notifications in Slack channels with clear diagnostic status codes.
    - Pre-deployment gating capability to verify Dapr sidecar readiness prior to routing application traffic.
    - Centralized execution history providing an immutable operational audit trail.

    ## Who it's for

    - Platform Engineers and SREs operating Kubernetes clusters running Dapr-enabled microservices.
    - DevOps Teams governing distributed application components and state store configurations.
    - Cloud Architects designing resilient event-driven architectures with Dapr and Kestra.

    ## Why orchestrate this with Kestra

    - **Declarative Runtime Governance**: Maintain Dapr health policies, alert thresholds, and operational runbooks as revision-controlled YAML workflows.
    - **Native Secret Protection**: Secure Slack webhook endpoints using Kestra namespace secrets via `{{ secret(...) }}` without plaintext exposure.
    - **Resilient Multi-Path Routing**: Automatically distinguish between complete sidecar outages, metadata failures, and isolated state store connectivity drops.
    - **End-to-End Auditing**: Combine automated schedules, probe metrics, and diagnostic logs into searchable execution records.

    ## Prerequisites

    - A running Dapr sidecar or container runtime with HTTP port exposed (default port 3500).
    - Network reachability from the Kestra worker or runner environment to the Dapr HTTP endpoint.
    - A Slack Incoming Webhook URL configured with permission to post into your target operations channel.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used for routing operational alerts and incidents.

    ## Quick start

    1. Add the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    2. Import this blueprint into your Kestra instance (e.g., under namespace `company.platform`).
    3. Click **Execute** with default inputs or specify your custom `dapr_http_endpoint` and `target_state_store`.
    4. Review the execution output in the **Executions** tab to confirm that HTTP status codes return successfully.
    5. Activate the `scheduled_sentinel_audit` trigger to enforce recurrent automated health monitoring.

    ## How to extend

    - **Automated Pod Restart**: Extend the `SIDECAR_UNHEALTHY` case with a Kubernetes API task (`io.kestra.plugin.kubernetes.pods.Restart`) to restart stalled application pods automatically.
    - **Pub/Sub Topic Validation**: Add a canary publish task (`POST /v1.0/publish/{pubsubname}/{topic}`) to audit message broker availability alongside state storage.
    - **Multi-Store Matrix Sweep**: Wrap the state store probe in a `ForEach` task to evaluate multiple state stores (e.g., cache, document store, transactional database) in a single run.
    - **PagerDuty Escalation**: Route `SIDECAR_UNHEALTHY` alerts directly to PagerDuty or Opsgenie on-call escalation schedules.

    ## Links

    - [Dapr Documentation](https://docs.dapr.io/)
    - [Dapr GitHub Repository](https://github.com/dapr/dapr)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Notification Plugin Documentation](https://kestra.io/plugins/plugin-slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - CI/CD & Deployment
  ee: false
  verified: false
  demo: false
