id: customer-credit-limit-review
namespace: company.team

description: |
  Quarterly customer credit review: score every account from its own payment behaviour (days
  beyond terms, trend, broken promises, disputes), its exposure (open receivables plus open
  orders against the current limit), its financial strength (from the latest accounts or a
  bureau score) and its concentration in the book; map the score to a risk grade, propose a
  new limit with sensible caps on increases, route changes by size to the right approver,
  apply holds and releases, and keep the history of every limit decision.

inputs:
  - id: review_date
    type: STRING
    displayName: Review date
    defaults: "2026-09-30"
    validator: ^\d{4}-\d{2}-\d{2}$

  - id: scenario
    type: SELECT
    displayName: Demo scenario
    description: ISSUES adds an invoice for a customer missing from the customer master and a customer with no credit limit at all, which must stop the review.
    values:
      - CLEAN
      - ISSUES
    defaults: CLEAN

  - id: max_increase_pct
    type: FLOAT
    displayName: Maximum increase per review (%)
    defaults: 50.0

  - id: approvals
    type: JSON
    displayName: Approvals
    description: >-
      Limit changes approved by the credit manager or the CFO, keyed by customer,
      for example {"CUS-007": "CFO"}.
    defaults: "{}"

variables:
  state_key: credit_limits
  pack_dir: "credit-review/{{ inputs.review_date }}"

concurrency:
  limit: 1

tasks:
  - id: state
    type: io.kestra.plugin.core.output.OutputValues
    values:
      s: "{{ kv(vars.state_key, errorOnMissing=false) ?? {'last_review': '', 'limits': {}, 'base_limits': {}, 'history': []} | toJson }}"
      last: "{{ (kv(vars.state_key, errorOnMissing=false) ?? {'last_review': ''}) | jq('.last_review') | first }}"

  - id: order_gate
    type: io.kestra.plugin.core.flow.If
    description: The latest review can be rerun (for example with approvals); an older one cannot.
    condition: "{{ outputs.state.values.last != '' and inputs.review_date < outputs.state.values.last }}"
    then:
      - id: out_of_order
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "A review dated {{ outputs.state.values.last }} already exists; reviews move forward in time."

  - id: review
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: >
      One DuckDB session: customer master, invoices and payments, open orders, disputes,
      promises to pay and financial data (demo generator or your ERP, CRM and bureau), the
      behaviour and exposure metrics, the score, grade, proposed limit, approval routing,
      holds and the checks.
    outputFiles:
      - scorecard
      - changes
      - holds
      - blockers
    fetchType: FETCH_ONE
    sql: |
      SET VARIABLE d = DATE '{{ inputs.review_date }}';

      -- =======================================================================
      -- Customer master with the current limit. The first review uses the
      -- master; later reviews use the limits stored by the previous review, and
      -- a rerun of the same review starts again from the limits before it.
      -- =======================================================================
      CREATE TABLE customers AS
      SELECT 'CUS-' || lpad(i::VARCHAR, 3, '0') AS customer, 'Customer ' || i AS name, [30, 30, 45, 60][1 + i % 4] AS terms_days,
             round(20000 + (hash(i) % 180000)::INT, -3)::DOUBLE AS master_limit,
             -- Bureau-style financial score 0-100 and current ratio from the latest accounts.
             (35 + (hash(i || 'f') % 60)::INT) AS financial_score, 0.8 + (hash(i || 'c') % 120)::INT / 100.0 AS current_ratio
      FROM range(1, 61) t(i);
      -- The story: two customers deteriorating, one growing fast and paying well.
      UPDATE customers SET financial_score = 28, current_ratio = 0.7 WHERE customer = 'CUS-014';
      UPDATE customers SET financial_score = 90, current_ratio = 1.8 WHERE customer = 'CUS-022';
      {% if inputs.scenario == 'ISSUES' %}
      UPDATE customers SET master_limit = NULL WHERE customer = 'CUS-031';
      {% endif %}

      CREATE TABLE limits_now AS
      SELECT c.customer, coalesce(l.value::DOUBLE, c.master_limit) AS current_limit
      FROM customers c LEFT JOIN json_each('{{ outputs.state.values.s | jq(outputs.state.values.last == inputs.review_date ? ".base_limits" : ".limits") | first | toJson }}') l ON l.key = c.customer;

      -- =======================================================================
      -- Invoices of the last 12 months with their payment dates. Replace with
      -- your receivables history.
      -- =======================================================================
      CREATE TABLE invoices AS
      SELECT 'INV-' || c.customer || '-' || k AS invoice, c.customer, (getvariable('d') - 365 + (k * 15 + hash(c.customer) % 15)::INT)::DATE AS issued_on,
             round(c.master_limit * (0.08 + (hash(c.customer || k) % 12)::INT / 100.0) * CASE WHEN c.customer = 'CUS-022' THEN 1 + k * 0.08 ELSE 1 END, 2) AS amount,
             c.terms_days
      FROM customers c, range(0, 24) t(k);
      ALTER TABLE invoices ADD COLUMN paid_on DATE;
      UPDATE invoices SET paid_on = (issued_on + terms_days + CASE
          WHEN customer = 'CUS-014' THEN (5 + 3 * (date_diff('day', getvariable('d') - 365, issued_on) / 30))::INT
          WHEN customer IN ('CUS-009', 'CUS-041') THEN 28 + (hash(invoice) % 20)::INT
          WHEN customer = 'CUS-022' THEN -4
          ELSE (hash(invoice) % 14)::INT - 4 END)::DATE;
      -- Not yet paid at the review date.
      UPDATE invoices SET paid_on = NULL WHERE paid_on > getvariable('d');
      {% if inputs.scenario == 'ISSUES' %}
      INSERT INTO invoices VALUES ('INV-X', 'CUS-777', getvariable('d') - 20, 18000, 30, NULL);
      {% endif %}

      CREATE TABLE open_orders AS
      SELECT customer, round(current_limit * (0.05 + (hash(customer || 'o') % 25)::INT / 100.0), 2) AS amount
      FROM limits_now WHERE hash(customer || 'oo') % 3 = 0
      UNION ALL SELECT 'CUS-022', 95000;
      CREATE TABLE disputes AS SELECT 'CUS-009' AS customer, 2 AS open_disputes UNION ALL SELECT 'CUS-033', 1;
      CREATE TABLE broken_promises AS SELECT 'CUS-014' AS customer, 3 AS broken UNION ALL SELECT 'CUS-041', 1;

      -- =======================================================================
      -- Checks.
      -- =======================================================================
      CREATE TABLE blockers AS
      SELECT 'UNKNOWN_CUSTOMER' AS code, customer AS ref, 'Invoices for a customer not in the master (' || count(*) || ')' AS detail FROM invoices WHERE customer NOT IN (SELECT customer FROM customers) GROUP BY customer
      UNION ALL SELECT 'NO_CREDIT_LIMIT', customer, 'No credit limit in the customer master' FROM customers WHERE master_limit IS NULL;

      -- =======================================================================
      -- Metrics per customer.
      -- =======================================================================
      CREATE TABLE metrics AS
      WITH paid AS (
        SELECT customer, amount, date_diff('day', issued_on + terms_days, paid_on) AS dbt, issued_on FROM invoices WHERE paid_on IS NOT NULL
      ), dbt AS (
        SELECT customer,
               sum(amount * dbt) / sum(amount) AS dbt_12m,
               sum(amount * dbt) FILTER (WHERE issued_on >= getvariable('d') - 120) / nullif(sum(amount) FILTER (WHERE issued_on >= getvariable('d') - 120), 0) AS dbt_recent,
               sum(amount * dbt) FILTER (WHERE issued_on < getvariable('d') - 120) / nullif(sum(amount) FILTER (WHERE issued_on < getvariable('d') - 120), 0) AS dbt_earlier,
               sum(amount) / 12 AS monthly_sales
        FROM paid GROUP BY customer
      ), open_ar AS (
        SELECT customer, sum(amount) AS open_ar, sum(amount) FILTER (WHERE getvariable('d') > issued_on + terms_days + 30) AS over_30
        FROM invoices WHERE paid_on IS NULL GROUP BY customer
      )
      SELECT c.customer, c.name, c.terms_days, l.current_limit, c.financial_score, c.current_ratio,
             coalesce(d.dbt_12m, 0) AS dbt_12m, coalesce(d.dbt_recent - d.dbt_earlier, 0) AS dbt_trend, coalesce(d.monthly_sales, 0) AS monthly_sales,
             coalesce(a.open_ar, 0) AS open_ar, coalesce(a.over_30, 0) AS over_30, coalesce(o.orders, 0) AS open_orders,
             coalesce(a.open_ar, 0) + coalesce(o.orders, 0) AS exposure,
             coalesce(ds.open_disputes, 0) AS disputes, coalesce(bp.broken, 0) AS broken_promises
      FROM customers c JOIN limits_now l USING (customer) LEFT JOIN dbt d USING (customer) LEFT JOIN open_ar a USING (customer)
      LEFT JOIN (SELECT customer, sum(amount) AS orders FROM open_orders GROUP BY customer) o USING (customer)
      LEFT JOIN disputes ds USING (customer) LEFT JOIN broken_promises bp USING (customer)
      WHERE l.current_limit IS NOT NULL;

      -- =======================================================================
      -- Score (0-100, higher is better): payment 40, trend 15, financial 25,
      -- behaviour 10, utilisation 10. Each part is shown in the scorecard.
      -- =======================================================================
      CREATE TABLE scorecard AS
      SELECT m.*,
             round(greatest(0, 40 - 2 * greatest(m.dbt_12m, 0)), 1) AS s_payment,
             round(greatest(0, least(15, 10 - m.dbt_trend)), 1) AS s_trend,
             round(0.25 * m.financial_score + CASE WHEN m.current_ratio < 1 THEN -5 ELSE 0 END, 1) AS s_financial,
             greatest(0, 10 - 3 * m.broken_promises - 2 * m.disputes) AS s_behaviour,
             round(greatest(0, 10 - 10 * greatest(m.exposure / m.current_limit - 0.8, 0) / 0.4), 1) AS s_utilisation,
             m.exposure / (SELECT sum(exposure) FROM metrics) AS share_of_book
      FROM metrics m;
      ALTER TABLE scorecard ADD COLUMN score DOUBLE; ALTER TABLE scorecard ADD COLUMN grade VARCHAR;
      ALTER TABLE scorecard ADD COLUMN proposed_limit DOUBLE; ALTER TABLE scorecard ADD COLUMN approver VARCHAR; ALTER TABLE scorecard ADD COLUMN hold VARCHAR;
      UPDATE scorecard SET score = greatest(s_payment + s_trend + s_financial + s_behaviour + s_utilisation, 0);
      UPDATE scorecard SET grade = CASE WHEN score >= 80 THEN 'A' WHEN score >= 65 THEN 'B' WHEN score >= 50 THEN 'C' WHEN score >= 35 THEN 'D' ELSE 'E' END;

      -- Proposed limit: a multiple of monthly sales by grade, never above the
      -- maximum increase per review, rounded to 5,000. Grade E is reduced to the
      -- exposure already outstanding (no new credit).
      UPDATE scorecard SET proposed_limit = CASE grade
          WHEN 'E' THEN round(least(current_limit, open_ar) / 5000) * 5000
          WHEN 'D' THEN round(least(monthly_sales * 1.25, current_limit) / 5000) * 5000
          -- A to C: a multiple of monthly sales, never below 115% of the exposure the customer already has.
          ELSE ceil(least(greatest(monthly_sales * CASE grade WHEN 'A' THEN 3.0 WHEN 'B' THEN 2.5 ELSE 2.0 END, exposure * 1.15),
                          current_limit * (1 + {{ inputs.max_increase_pct }} / 100)) / 5000) * 5000 END;
      UPDATE scorecard SET proposed_limit = greatest(proposed_limit, 5000) WHERE grade <> 'E';
      -- Routing: decreases and small increases are automatic; larger increases need a person.
      UPDATE scorecard SET approver = CASE
          WHEN proposed_limit <= current_limit THEN 'AUTO'
          WHEN proposed_limit - current_limit <= 25000 THEN 'AUTO'
          WHEN proposed_limit <= 250000 THEN 'CREDIT_MANAGER'
          ELSE 'CFO' END;
      -- Holds on new orders.
      UPDATE scorecard SET hold = CASE
          WHEN grade = 'E' THEN 'HOLD: grade E'
          WHEN exposure > proposed_limit THEN 'HOLD: exposure above limit'
          WHEN over_30 > 0 AND broken_promises > 0 THEN 'HOLD: overdue with broken promises' END;

      -- Approvals given, and the decision that will be applied.
      CREATE TABLE given AS SELECT key AS customer, trim(value::VARCHAR, '"') AS approved_by FROM json_each('{{ inputs.approvals | toJson }}');
      CREATE TABLE changes AS
      SELECT s.customer, s.name, s.grade, round(s.score, 1) AS score, s.current_limit, s.proposed_limit, s.proposed_limit - s.current_limit AS change, s.approver, g.approved_by,
             CASE WHEN s.approver = 'AUTO' THEN s.proposed_limit
                  WHEN g.approved_by IS NOT NULL AND (s.approver = 'CREDIT_MANAGER' OR g.approved_by = 'CFO') THEN s.proposed_limit
                  ELSE s.current_limit END AS applied_limit,
             CASE WHEN s.approver = 'AUTO' THEN 'APPLIED'
                  WHEN g.approved_by IS NOT NULL AND (s.approver = 'CREDIT_MANAGER' OR g.approved_by = 'CFO') THEN 'APPROVED'
                  WHEN g.approved_by IS NOT NULL THEN 'WRONG_APPROVER'
                  ELSE 'PENDING_APPROVAL' END AS status
      FROM scorecard s LEFT JOIN given g USING (customer)
      WHERE s.proposed_limit <> s.current_limit;

      COPY (SELECT customer, name, grade, round(score, 1) AS score, s_payment, s_trend, s_financial, s_behaviour, s_utilisation, round(dbt_12m, 1) AS days_beyond_terms,
                   round(dbt_trend, 1) AS dbt_trend, round(monthly_sales) AS monthly_sales, round(open_ar) AS open_ar, round(over_30) AS over_30, round(open_orders) AS open_orders,
                   round(exposure) AS exposure, current_limit, proposed_limit, round(100 * exposure / current_limit, 1) AS utilisation_pct, round(100 * share_of_book, 2) AS share_of_book_pct, hold
            FROM scorecard ORDER BY score) TO '{{ outputFiles.scorecard }}' (HEADER, DELIMITER ',');
      COPY changes TO '{{ outputFiles.changes }}' (HEADER, DELIMITER ',');
      COPY (SELECT customer, name, grade, round(exposure) AS exposure, proposed_limit, hold FROM scorecard WHERE hold IS NOT NULL ORDER BY exposure DESC) TO '{{ outputFiles.holds }}' (HEADER, DELIMITER ',');
      COPY blockers TO '{{ outputFiles.blockers }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT count(*) FROM scorecard)::INT AS customers,
        (SELECT string_agg(grade || ' ' || n, ', ' ORDER BY grade) FROM (SELECT grade, count(*) AS n FROM scorecard GROUP BY grade)) AS grades,
        (SELECT round(sum(exposure)) FROM scorecard)::DOUBLE AS exposure,
        (SELECT round(sum(current_limit)) FROM scorecard)::DOUBLE AS limits_before,
        (SELECT round(sum(l)) FROM (SELECT applied_limit AS l FROM changes UNION ALL SELECT current_limit FROM scorecard WHERE customer NOT IN (SELECT customer FROM changes)))::DOUBLE AS limits_after,
        (SELECT string_agg(status || ' ' || n, ', ') FROM (SELECT status, count(*) AS n FROM changes GROUP BY status)) AS change_status,
        (SELECT coalesce(string_agg(customer || ' ' || current_limit::BIGINT || ' -> ' || proposed_limit::BIGINT || ' (' || approver || ')', '; ' ORDER BY abs(change) DESC), '') FROM changes WHERE status IN ('PENDING_APPROVAL', 'WRONG_APPROVER')) AS pending,
        (SELECT count(*) FROM changes WHERE status IN ('PENDING_APPROVAL', 'WRONG_APPROVER'))::INT AS pending_count,
        (SELECT coalesce(string_agg(customer || ' (' || hold || CASE WHEN grade <> 'E' THEN ', grade ' || grade ELSE '' END || ')', '; '), '') FROM scorecard WHERE hold IS NOT NULL) AS holds,
        (SELECT coalesce(string_agg(customer || ' ' || round(100 * share_of_book, 1) || '%', ', '), '') FROM scorecard WHERE share_of_book > 0.05) AS concentration,
        (SELECT json_group_object(customer, applied_limit) FROM (SELECT customer, applied_limit FROM changes UNION ALL SELECT customer, current_limit FROM scorecard WHERE customer NOT IN (SELECT customer FROM changes)))::VARCHAR AS new_limits,
        (SELECT json_group_array(json_object('date', '{{ inputs.review_date }}', 'customer', customer, 'from', current_limit, 'to', applied_limit, 'grade', grade, 'status', status, 'by', coalesce(approved_by, approver)))::VARCHAR FROM changes) AS history,
        (SELECT count(*) FROM blockers)::INT AS blockers,
        (SELECT coalesce(string_agg(code || ' ' || ref || ': ' || detail, '; ' ORDER BY code, ref), '') FROM blockers) AS blocker_detail;

  - id: result
    type: io.kestra.plugin.core.output.OutputValues
    values:
      r: "{{ (outputs.review.outputs | last).row | toJson }}"

  - id: log_review
    type: io.kestra.plugin.core.log.Log
    message: |
      Credit review {{ inputs.review_date }} ({{ inputs.scenario }}).
      {{ outputs.result.values.r | jq('"\(.customers) customers. Grades: \(.grades). Exposure \(.exposure) against limits \(.limits_before) -> \(.limits_after)."') | first }}
      {{ outputs.result.values.r | jq('"Changes: \(.change_status). Waiting for approval: \(.pending)."') | first }}
      {{ outputs.result.values.r | jq('"Order holds: \(.holds). Concentration above 5% of the book: \(.concentration)."') | first }}
      {{ outputs.result.values.r | jq('"Blockers: \(.blockers). \(.blocker_detail)"') | first }}

  - id: evidence
    type: io.kestra.plugin.core.namespace.UploadFiles
    namespace: "{{ flow.namespace }}"
    filesMap:
      "{{ render(vars.pack_dir) }}/scorecard.csv": "{{ outputs.review.outputFiles.scorecard }}"
      "{{ render(vars.pack_dir) }}/limit-changes.csv": "{{ outputs.review.outputFiles.changes }}"
      "{{ render(vars.pack_dir) }}/order-holds.csv": "{{ outputs.review.outputFiles.holds }}"
      "{{ render(vars.pack_dir) }}/blockers.csv": "{{ outputs.review.outputFiles.blockers }}"

  - id: gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.result.values.r | jq('.blockers > 0') | first }}"
    then:
      - id: blocked
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "The credit review cannot run: {{ outputs.result.values.r | jq('.blocker_detail') | first }}"

  - id: save
    type: io.kestra.plugin.core.kv.Set
    description: The applied limits (pending increases keep the current limit) and the decision history.
    key: "{{ vars.state_key }}"
    kvType: JSON
    value: >-
      {{ {'old': fromJson(outputs.state.values.s), 'r': fromJson(outputs.result.values.r), 'd': inputs.review_date}
         | jq('{last_review: .d, limits: (.r.new_limits | fromjson),
                base_limits: (if .old.last_review == .d then .old.base_limits else .old.limits end),
                history: (.d as $d | (.old.history | map(select(.date != $d))) + (.r.history | fromjson))}') | first | toJson }}

  - id: pending_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.result.values.r | jq('.pending_count > 0') | first }}"
    then:
      - id: pending
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: >-
          Review saved. {{ outputs.result.values.r | jq('.pending_count') | first }} increase(s) wait for the right approver and keep their current limit:
          {{ outputs.result.values.r | jq('.pending') | first }}. Rerun this review with approvals to apply them.

extend:
  title: Review customer credit limits from payment behaviour, exposure and financial strength
  metaTitle: Customer credit limit review with scoring, approvals and order holds in Kestra
  shortDescription: Score every customer on payment behaviour, trend, financials, promises and utilisation, grade them, propose new limits with caps, route increases to the right approver and set order holds.
  metaDescription: Quarterly customer credit review in Kestra and DuckDB. Payment scoring, risk grades, proposed limits, approval routing, order holds and history.
  description: |
    Credit limits are usually set once, when a customer is onboarded, and rarely looked at again. Meanwhile:
    - a customer's payments slip a few days later every month,
    - a fast-growing account runs into its limit and its orders get blocked,
    - one customer quietly becomes a tenth of the receivables book.

    This flow reviews every account each quarter from its own data. It proposes the new limit, routes increases to the person allowed to approve them, sets order holds, and keeps the history of every decision.

    It runs with no setup and no network. DuckDB generates 60 customers, a year of invoices and payments, open orders, disputes and broken payment promises, plus a bureau-style financial score and current ratio. Three stories are planted:
    - a customer whose payment delay grows every month, with weak financials and three broken promises;
    - two chronic late payers;
    - a fast-growing customer that pays early but has outgrown its limit.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Score (0-100) and grade

    | Part | Points | Measure |
    |---|---|---|
    | Payment | 40 | Amount-weighted days beyond terms over 12 months: -2 points per day |
    | Trend | 15 | Days beyond terms over the last 4 months against the 8 before: worsening costs points |
    | Financial | 25 | Bureau or financial score, -5 if the current ratio is below 1 |
    | Behaviour | 10 | -3 per broken promise to pay, -2 per open dispute |
    | Utilisation | 10 | Exposure (open receivables + open orders) above 80% of the limit costs points |

    The grades are A (80 and above), B (65), C (50), D (35) and E (below 35). Every part is in the scorecard, so a customer who asks why can be told.

    ## Limit, approval and holds

    - **Proposed limit:**
      - A to C: 3, 2.5 or 2 months of sales, and never less than 115% of current exposure;
      - D: 1.25 months, never above today's limit;
      - E: no new credit (the limit drops to what is already outstanding).
      - Increases are capped at `max_increase_pct` per review, and limits are rounded to 5,000.
    - **Routing:** decreases and increases up to 25,000 apply automatically. Larger increases need the credit manager, and limits above 250,000 need the CFO. An increase approved by the wrong person stays pending, and pending increases keep the current limit.
    - **Holds on new orders:** grade E, exposure above the new limit, or overdue invoices together with broken promises.
    - **Concentration:** customers above 5% of total exposure are listed.

    The review can be rerun on the same date with `approvals`. A rerun starts again from the limits before the review, so changes never stack. Reviews only move forward in time.

    ## How it works

    1. `state` loads the applied limits, the limits before the latest review, and the history. `order_gate` refuses an earlier date.
    2. `review` (`io.kestra.plugin.jdbc.duckdb.Queries`) holds the master, invoices, orders, disputes and promises. It computes the metrics, score, grade, proposed limit, routing and holds, applies the approvals, and runs the checks.
    3. `log_review` prints the result. `evidence` stores `scorecard.csv`, `limit-changes.csv`, `order-holds.csv` and `blockers.csv`.
    4. `gate` stops on data errors: invoices for an unknown customer, or a customer without a limit.
    5. `save` (`io.kestra.plugin.core.kv.Set`) stores the applied limits and appends to the history.
    6. `pending_gate` fails with the list of increases still waiting for approval.

    ## Tested end to end

    On Kestra 2.0.3 OSS.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | 2026-09-30 | 60 customers: A 26, B 31, D 1, E 2. The deteriorating customer (CUS-014, delay +13.8 days over the year, 3 broken promises) and a chronic late payer (35 days beyond terms) are graded E, and new orders are held. The fast grower CUS-022 (8.9% of the book) needs 149,000 → 225,000 approved by the credit manager. Saved as pending |
    | 2 | same date, approved by the credit manager | Applied |
    | 3 | 2026-06-30 | Refused: earlier than the last review |
    | 4 | 2026-12-31 `ISSUES` | Blocked: a customer without a limit, invoices for an unknown customer |
    | 5 | 2026-12-31, approved by the credit manager | CUS-022 now needs 310,000, a CFO decision, so the approval does not count and the increase stays pending |
    | 6 | same, approved by the CFO | Applied. The history has one entry per change per review date |

    I recomputed every customer's score, grade, payment points and proposed limit independently in Python from `scorecard.csv`. All 60 match.

    ## Problems found while testing

    - **Limits fell below what customers already owed.** The first rule set limits from months of sales only, which put six good customers on hold for exposure they were entitled to. Grades A to C now keep at least 115% of current exposure.
    - **The YAML example broke the flow again.** A JSON example with a colon in a plain description does not parse. It is a folded block now.

    ## Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `review_date` | `2026-09-30` | Date of the review |
    | `scenario` | `CLEAN` | Demo only |
    | `max_increase_pct` | `50.0` | Cap on increases per review |
    | `approvals` | `{}` | Approvals by customer |

    ## Use it with your data

    - Replace `customers`, `invoices`, `open_orders`, `disputes` and `broken_promises` with your ERP, CRM and collections data, and the financial score with your bureau feed.
    - Push the applied limits and holds back to the ERP from a task after `save`.

    ## Things to know

    - Credit insurance limits, group limits across related companies, and security such as guarantees and letters of credit are not modelled. Add them as caps on the proposed limit.
    - Reset by deleting the KV key `credit_limits`.

    ## Links

    - DuckDB plugin: https://kestra.io/plugins/plugin-jdbc-duckdb
  tags:
    - Business
    - Data
  subTags:
    - Policy & Compliance
    - Approval Gates
  ee: false
  demo: true
