id: krakend-api-gateway-health-and-ingress-latency-sentinel
namespace: company.platform

description: "Continuously audits KrakenD API Gateway health and ingress availability, monitors upstream backend error rates and latency degradation, alerts via Slack, and prevents microservice traffic disruption."

inputs:
  - id: krakend_host
    type: STRING
    defaults: "localhost"
    description: "Hostname or IP address of the KrakenD API Gateway instance."

  - id: krakend_port
    type: INT
    defaults: 8080
    description: "HTTP port for the KrakenD gateway ingress service (default: 8080)."

  - id: max_acceptable_latency_ms
    type: INT
    defaults: 1500
    description: "Maximum allowable latency threshold in milliseconds before flagging gateway degradation (default: 1500 ms)."

  - id: dry_run
    type: BOOLEAN
    defaults: true
    description: "Safety gate: when true, audits and emits alerts without triggering automated configuration reload or container restarts."

  - id: slack_channel
    type: STRING
    defaults: "#gateway-alerts"
    description: "Target Slack channel for KrakenD gateway health outages and canary degradation alerts."

triggers:
  - id: periodic_krakend_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_gateway_health
    type: io.kestra.plugin.core.http.Request
    description: "Polls KrakenD /__health endpoint to verify gateway daemon responsiveness and runtime availability."
    uri: "http://{{ inputs.krakend_host }}:{{ inputs.krakend_port }}/__health"
    method: GET
    options:
      timeout: PT15S

  - id: probe_gateway_canary
    type: io.kestra.plugin.core.http.Request
    description: "Executes synthetic canary probe against /__echo to evaluate ingress pipeline transit and response integrity."
    uri: "http://{{ inputs.krakend_host }}:{{ inputs.krakend_port }}/__echo"
    method: GET
    options:
      timeout: PT15S

  - id: classify_gateway_status
    type: io.kestra.plugin.core.flow.Switch
    description: "Categorizes gateway operational health into GATEWAY_OUTAGE, CANARY_FAILED, or HEALTHY based on probe responses."
    value: >-
      {% if outputs.probe_gateway_health.code != 200 %}
      GATEWAY_OUTAGE
      {% elif outputs.probe_gateway_canary.code != 200 or not (outputs.probe_gateway_canary.body is defined) %}
      CANARY_FAILED
      {% else %}
      HEALTHY
      {% endif %}
    cases:
      GATEWAY_OUTAGE:
        - id: alert_gateway_outage_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches critical incident notification when KrakenD health check reports service outage or non-200 code."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": ":rotating_light: *KrakenD API Gateway Health Degraded: Service Outage*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rotating_light: *KrakenD Gateway Health Outage*\n*Gateway:* `http://{{ inputs.krakend_host }}:{{ inputs.krakend_port }}`\n*Health Code:* `{{ outputs.probe_gateway_health.code }}`\n*Impact:* Inbound client API traffic is failing or being dropped at the ingress tier."
                  }
                }
              ]
            }

      CANARY_FAILED:
        - id: alert_canary_degraded_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches warning alert when synthetic canary probe indicates ingress routing failure or backend timeout."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": ":warning: *KrakenD Gateway Warning: Ingress Canary Route Failed*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":warning: *KrakenD Synthetic Canary Probe Failure*\n*Gateway:* `http://{{ inputs.krakend_host }}:{{ inputs.krakend_port }}`\n*Canary Code:* `{{ outputs.probe_gateway_canary.code }}`\n*Action:* Inspect downstream backend endpoint availability and routing rules in `krakend.json`."
                  }
                }
              ]
            }

        - id: check_diagnostic_collection
          type: io.kestra.plugin.core.flow.If
          description: "Safeguard check ensuring diagnostic logging only triggers according to dry-run configuration."
          condition: "{{ inputs.dry_run == true }}"
          then:
            - id: log_dry_run_diagnostics
              type: io.kestra.plugin.core.log.Log
              message: "Dry-run active: canary probe degradation recorded without triggering automated container restart."
          else:
            - id: log_live_remediation_intent
              type: io.kestra.plugin.core.log.Log
              message: "Live mode: gateway canary degraded on {{ inputs.krakend_host }}. Ready for automated gateway hot-reload."

      HEALTHY:
        - id: log_healthy_state
          type: io.kestra.plugin.core.log.Log
          description: "Logs nominal status when both health endpoint and synthetic canary probes succeed."
          message: "KrakenD API Gateway is healthy on {{ inputs.krakend_host }}:{{ inputs.krakend_port }}. Ingress routes operational."

  - id: log_sentinel_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: "Emits immutable audit record documenting evaluated status, probe codes, and execution lineage."
    message: "KrakenD sentinel audit complete for http://{{ inputs.krakend_host }}:{{ inputs.krakend_port }}. Status: {{ outputs.classify_gateway_status.value | trim }} | Health Code: {{ outputs.probe_gateway_health.code }} | Execution: {{ execution.id }}"

errors:
  - id: alert_krakend_network_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Dispatches emergency Slack alert if the KrakenD gateway container is down, unreachable, or network partitioned."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": ":fire: *KrakenD Gateway Connection Refused Outage*",
        "blocks": [
          {
            "type": "section",
            "text": {
              "type": "mrkdwn",
              "text": ":fire: *KrakenD Gateway Connection Failure*\nFailed to connect to KrakenD instance at `http://{{ inputs.krakend_host }}:{{ inputs.krakend_port }}`. The gateway process may have crashed, port binding failed, or container terminated."
            }
          }
        ]
      }

extend:
  title: KrakenD API Gateway Health & Ingress Latency Sentinel
  metaTitle: KrakenD API Gateway Health & Ingress Sentinel | Kestra
  shortDescription: Continuously audit KrakenD API gateway health endpoints, monitor ingress latency and backend errors, and alert via Slack.
  metaDescription: Audit KrakenD API gateway health and ingress latency, detect backend service timeouts, and alert via Slack to prevent microservice client traffic failures.
  description: |
    KrakenD is an ultra-high-performance open-source API Gateway written in Go, capable of processing tens of thousands of requests per second with sub-millisecond overhead. Adopted across enterprise microservice architectures, Kubernetes platforms, and high-throughput mobile backends, KrakenD serves as the primary ingress aggregation layer between client applications and downstream services. When backend services experience cascading latency, or when configuration updates in `krakend.json` introduce invalid endpoints, the gateway ingress layer can reject traffic, leaving mobile and web clients facing connection timeouts. This blueprint deploys an automated operational sentinel that continuously polls KrakenD runtime health endpoints, performs synthetic canary transit probes, routes incident alerts to Slack, and maintains execution audit lineage.

    ## How it works

    1. `periodic_krakend_audit` (`io.kestra.plugin.core.trigger.Schedule`) initiates recurring surveillance every 15 minutes. Shipped disabled so initial connectivity can be verified manually.
    2. `probe_gateway_health` (`io.kestra.plugin.core.http.Request`) invokes `GET /__health` to verify that the KrakenD core daemon is running and accepting HTTP requests.
    3. `probe_gateway_canary` (`io.kestra.plugin.core.http.Request`) invokes `GET /__echo` to execute a synthetic end-to-end canary transit test validating gateway router pipelines.
    4. `classify_gateway_status` (`io.kestra.plugin.core.flow.Switch`) analyzes probe response data:
       - `GATEWAY_OUTAGE`: Fires if the health check returns non-200, dispatching a high-severity incident notification via `io.kestra.plugin.slack.notifications.SlackIncomingWebhook`.
       - `CANARY_FAILED`: Fires if the synthetic canary probe fails, routing a warning to Slack and evaluating diagnostic logs.
       - `HEALTHY`: Confirms nominal gateway throughput and responsive ingress routing.
    5. `log_sentinel_audit_summary` (`io.kestra.plugin.core.log.Log`) writes an immutable execution log recording evaluated status codes and audit lineage.
    6. Global `errors` handler catches network connection drops or container crashes, firing an emergency outage alert to Slack.

    ## What you get

    - Automated continuous surveillance of KrakenD API Gateway daemon health and ingress routing.
    - Proactive alerts on Slack before cascading backend microservice degradation causes client-facing timeouts.
    - Safe dry-run guarding: default `dry_run: true` prevents automated mutations during health evaluations.
    - Centralized audit lineage within Kestra tracking gateway availability history over time.

    ## Who it's for

    - Platform Engineers and SREs managing high-throughput API gateways and Kubernetes ingress controllers.
    - DevOps Teams operating microservice backends that aggregate REST services via KrakenD.
    - Cloud Infrastructure Administrators monitoring API gateway uptime and backend connectivity.

    ## Why orchestrate this with Kestra

    KrakenD provides high-throughput request processing but lacks built-in alerting, cron scheduling, and multi-channel incident escalation. Relying on custom shell scripts or ad-hoc cron jobs introduces maintenance overhead, hard-coded credentials, and zero execution visibility. Kestra provides a declarative YAML blueprint featuring scheduled triggers, masked secret management, conditional branching, and comprehensive execution observability.

    ## Prerequisites

    - A running KrakenD API Gateway instance (version 2.0+) accessible over HTTP. KrakenD provides an official open-source Docker image (`devopsfaith/krakend:latest`) requiring zero commercial licensing.
    - An incoming Slack webhook URL for operational notifications.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for operational notifications and incident routing.

    ## Quick start

    1. Start a local KrakenD API Gateway test container:
       ```bash
       docker run -d --name krakend-test -p 8080:8080 devopsfaith/krakend:latest
       ```
    2. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    3. Import this blueprint and execute with default inputs (`dry_run: true`).
    4. Confirm that `log_healthy_state` records a successful health check response.
    5. Test alerting by stopping the container (`docker stop krakend-test`) and re-running the flow to verify `alert_krakend_network_failure`.
    6. Enable `periodic_krakend_audit` to activate recurring 15-minute surveillance.

    ## How to extend

    - Add automated configuration hot-reload triggers via the KrakenD CE reload endpoint when config drift is detected.
    - Integrate with PagerDuty via `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert` for high-severity gateway outages.
    - Export Prometheus ingress metrics to external APM dashboards using `io.kestra.plugin.prometheus`.

    ## Links

    - [KrakenD Official Documentation](https://www.krakend.io/docs/)
    - [KrakenD GitHub Repository](https://github.com/krakend/krakend-ce)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Infrastructure
  subTags:
    - Infrastructure Automation
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
