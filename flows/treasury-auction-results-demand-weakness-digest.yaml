id: treasury-auction-results-demand-weakness-digest
namespace: company.team

description: |
  Load US Treasury coupon auction results from TreasuryDirect, score each new auction's bid-to-cover, indirect
  and primary dealer shares against the trailing auctions of the same security, and post a digest that flags
  weak auctions and lists the announced auctions coming up.

inputs:
  - id: lookback_days
    type: INT
    defaults: 1095
    description: History to load. Three years give at least three prior auctions even for the 30-year TIPS, which is auctioned only twice a year.

  - id: trailing_auctions
    type: INT
    defaults: 6
    description: Each auction is compared with the average of this many previous auctions of the same security (original term, so reopenings count with new issues).

  - id: min_history
    type: INT
    defaults: 3
    description: Auctions with fewer prior auctions than this are reported but never scored as weak.

  - id: btc_drop
    type: FLOAT
    defaults: 0.15
    description: Signal when the bid-to-cover ratio is at least this much below the trailing average.

  - id: dealer_rise_pp
    type: FLOAT
    defaults: 5.0
    description: Signal when primary dealers take at least this many percentage points more of the competitive award than usual (dealers absorbing supply nobody else wanted).

  - id: indirect_drop_pp
    type: FLOAT
    defaults: 5.0
    description: Signal when indirect bidders (foreign and domestic investors bidding through dealers) take at least this many percentage points less than usual.

  - id: min_signals
    type: INT
    defaults: 2
    description: Number of the three signals needed to call an auction weak. One signal alone, usually indirect share, is common noise.

  - id: watch
    type: STRING
    defaults: ""
    description: Optional comma-separated series to restrict the digest to, for example `Note 10-Year, Bond 30-Year, TIPS 5-Year`. Empty means every coupon series. Unknown names are reported.

  - id: calendar_days
    type: INT
    defaults: 14
    description: Announced auctions up to this many days ahead are listed in the digest.

triggers:
  - id: weekday_after_results
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "15 14 * * 1-5"
    timezone: America/New_York
    description: Coupon auctions close at 1:00 pm New York time and results are posted within minutes.

tasks:
  - id: fetch
    type: io.kestra.plugin.core.flow.Parallel
    description: |
      The `search` endpoint filters on issue date, so the end date reaches past today to include auctions that are
      announced but not yet held (they come back with empty result fields). `securityType=Note` also returns FRNs and
      most TIPS, `securityType=Bond` returns the 20- and 30-year bonds and the 30-year TIPS. Bills are left out.
    tasks:
      - id: fetch_notes
        type: io.kestra.plugin.core.http.Download
        uri: "https://www.treasurydirect.gov/TA_WS/securities/search?format=json&securityType=Note&startDate={{ now() | dateAdd(-inputs.lookback_days, 'DAYS') | date('yyyy-MM-dd') }}&endDate={{ now() | dateAdd(inputs.calendar_days + 14, 'DAYS') | date('yyyy-MM-dd') }}"
        headers:
          User-Agent: kestra-blueprint-treasury-auctions
        retry:
          type: constant
          interval: PT1M
          maxAttempts: 3

      - id: fetch_bonds
        type: io.kestra.plugin.core.http.Download
        uri: "https://www.treasurydirect.gov/TA_WS/securities/search?format=json&securityType=Bond&startDate={{ now() | dateAdd(-inputs.lookback_days, 'DAYS') | date('yyyy-MM-dd') }}&endDate={{ now() | dateAdd(inputs.calendar_days + 14, 'DAYS') | date('yyyy-MM-dd') }}"
        headers:
          User-Agent: kestra-blueprint-treasury-auctions
        retry:
          type: constant
          interval: PT1M
          maxAttempts: 3

  - id: reported
    type: io.kestra.plugin.core.kv.Get
    key: treasury_auctions_reported
    errorOnMissing: false
    description: Auctions (CUSIP plus auction date) whose results were already reported. Missing on the first run, which is a BASELINE run that scores history but posts nothing.

  - id: analyse
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Groups auctions into series by type and original term, so a 9-year 10-month reopening counts as a 10-year note.
      Shares are computed on the competitive award only (indirect, direct, primary dealers), which is how the market
      reads them. A window over the previous N auctions of the series gives the baseline. An auction is new when it has
      results and its key is not in KV, so two auctions on the same day whose results land at different times are each
      reported once.
    url: "jdbc:duckdb:"
    timeZoneId: UTC
    fetchType: FETCH_ONE
    inputFiles:
      notes.json: "{{ outputs.fetch_notes.uri }}"
      bonds.json: "{{ outputs.fetch_bonds.uri }}"
    outputFiles:
      - results_csv
    parameters:
      reported: "{{ outputs.reported.value ?? '' }}"
      btc_drop: "{{ inputs.btc_drop }}"
      dealer_pp: "{{ inputs.dealer_rise_pp }}"
      ind_pp: "{{ inputs.indirect_drop_pp }}"
      min_history: "{{ inputs.min_history }}"
      min_signals: "{{ inputs.min_signals }}"
      watch: "{{ inputs.watch }}"
      calendar_days: "{{ inputs.calendar_days }}"
      today: "{{ now() | date('yyyy-MM-dd', timeZone='America/New_York') }}"
    sql: |
      CREATE TABLE raw AS SELECT * FROM read_json_auto(['notes.json', 'bonds.json'], union_by_name = true);

      CREATE TABLE auctions AS
      SELECT DISTINCT cusip, CAST(CAST(competitiveAuctionCloseDate AS TIMESTAMP) AS DATE) AS auction_date,
             "type" || ' ' || originalSecurityTerm AS series, securityTerm AS term, reopening = 'Yes' AS reopening,
             TRY_CAST(offeringAmount AS DOUBLE) / 1e9 AS offering_bn,
             TRY_CAST(nullif(bidToCoverRatio, '') AS DOUBLE) AS btc,
             CASE WHEN "type" = 'FRN' THEN 'DM ' || highDiscountMargin ELSE 'high ' || highYield || '%' END AS stop,
             coalesce(TRY_CAST(indirectBiddersCompetitiveParAwarded AS DOUBLE), 0) AS ind,
             coalesce(TRY_CAST(directBiddersCompetitiveParAwarded AS DOUBLE), 0) AS dir,
             coalesce(TRY_CAST(primaryDealersCompetitiveParAwarded AS DOUBLE), 0) AS pd
      FROM raw;

      CREATE TABLE watch AS
      SELECT DISTINCT trim(w) AS series FROM (SELECT unnest(string_split(:watch, ',')) AS w) WHERE trim(w) <> '';

      CREATE TABLE scored AS
      SELECT *,
             cusip || '_' || strftime(auction_date, '%Y%m%d') AS akey,
             round(btc - avg_btc, 2) AS btc_vs_avg,
             round(dealer_pct - avg_dealer, 1) AS dealer_vs_avg,
             round(indirect_pct - avg_ind, 1) AS indirect_vs_avg,
             CAST(btc <= avg_btc - CAST(:btc_drop AS DOUBLE) AS INTEGER)
               + CAST(dealer_pct >= avg_dealer + CAST(:dealer_pp AS DOUBLE) AS INTEGER)
               + CAST(indirect_pct <= avg_ind - CAST(:ind_pp AS DOUBLE) AS INTEGER) AS signals
      FROM (
        SELECT *, avg(btc) OVER w AS avg_btc, avg(indirect_pct) OVER w AS avg_ind, avg(dealer_pct) OVER w AS avg_dealer,
               count(*) OVER w AS n_prev
        FROM (SELECT *, round(100 * ind / nullif(ind + dir + pd, 0), 1) AS indirect_pct, round(100 * pd / nullif(ind + dir + pd, 0), 1) AS dealer_pct
              FROM auctions WHERE btc IS NOT NULL)
        WINDOW w AS (PARTITION BY series ORDER BY auction_date, cusip ROWS BETWEEN {{ inputs.trailing_auctions }} PRECEDING AND 1 PRECEDING));

      CREATE TABLE flagged AS
      SELECT *,
             n_prev >= CAST(:min_history AS INTEGER) AND signals >= CAST(:min_signals AS INTEGER) AS weak,
             :reported <> '' AND NOT list_contains(string_split(:reported, ','), akey) AS is_new,
             ((SELECT count(*) FROM watch) = 0 OR series IN (SELECT series FROM watch)) AS in_scope,
             strftime(auction_date, '%Y-%m-%d') || ' ' || series || CASE WHEN reopening THEN ' (reopening, ' || term || ')' ELSE '' END
               || ' | ' || stop || ' | btc ' || printf('%.2f', btc) || coalesce(' (' || CASE WHEN btc_vs_avg >= 0 THEN '+' ELSE '' END || printf('%.2f', btc_vs_avg) || ')', '')
               || ' | indirect ' || indirect_pct || '%' || coalesce(' (' || CASE WHEN indirect_vs_avg >= 0 THEN '+' ELSE '' END || indirect_vs_avg || 'pp)', '')
               || ' | dealers ' || dealer_pct || '%' || coalesce(' (' || CASE WHEN dealer_vs_avg >= 0 THEN '+' ELSE '' END || dealer_vs_avg || 'pp)', '')
               || CASE WHEN n_prev < CAST(:min_history AS INTEGER) THEN ' | only ' || n_prev || ' prior auctions, not scored' ELSE '' END AS line
      FROM scored;

      CREATE TABLE calendar AS
      SELECT a.*, (SELECT f.btc FROM flagged f WHERE f.series = a.series ORDER BY f.auction_date DESC LIMIT 1) AS last_btc
      FROM auctions a
      WHERE a.btc IS NULL AND ((SELECT count(*) FROM watch) = 0 OR a.series IN (SELECT series FROM watch))
        AND a.auction_date <= CAST(:today AS DATE) + CAST(:calendar_days AS INTEGER);

      COPY (SELECT auction_date, series, term, cusip, reopening, offering_bn, stop, btc, avg_btc, indirect_pct, avg_ind, dealer_pct, avg_dealer, n_prev, signals, weak, is_new
            FROM flagged WHERE in_scope ORDER BY auction_date DESC, series) TO '{{ outputFiles.results_csv }}' (HEADER, DELIMITER ',');

      SELECT *,
        'Treasury coupon auctions' || CASE WHEN new_weak > 0 THEN ', ' || new_weak || ' WEAK' ELSE '' END || chr(10)
          || CASE WHEN new_weak > 0 THEN 'Weak (' || :min_signals || ' or more signals)' || chr(10) || new_weak_lines || chr(10) ELSE '' END
          || CASE WHEN new_results > 0 THEN 'New results' || chr(10) || new_lines || chr(10) ELSE '' END
          || 'Coming up' || chr(10) || CASE WHEN calendar_lines = '' THEN 'nothing announced' ELSE calendar_lines END
          || CASE WHEN unknown_watch <> '' THEN chr(10) || 'Unknown watch series ' || unknown_watch END || chr(10) AS slack_text
      FROM (SELECT
        :reported = '' AS is_baseline,
        (SELECT count(*) FROM flagged) AS auctions_with_results,
        (SELECT count(DISTINCT series) FROM flagged) AS series_count,
        strftime((SELECT min(auction_date) FROM flagged), '%Y-%m-%d') AS first_auction,
        strftime((SELECT max(auction_date) FROM flagged), '%Y-%m-%d') AS last_auction,
        (SELECT count(*) FROM flagged WHERE in_scope AND weak) AS weak_in_window,
        (SELECT count(*) FROM flagged WHERE in_scope AND is_new) AS new_results,
        (SELECT count(*) FROM flagged WHERE in_scope AND is_new AND weak) AS new_weak,
        (SELECT coalesce(string_agg(line, chr(10) ORDER BY auction_date, series), '') FROM flagged WHERE in_scope AND is_new AND weak) AS new_weak_lines,
        (SELECT coalesce(string_agg(line, chr(10) ORDER BY auction_date, series), '') FROM flagged WHERE in_scope AND is_new AND NOT weak) AS new_lines,
        (SELECT coalesce(string_agg(line, chr(10) ORDER BY auction_date DESC), '') FROM (SELECT * FROM flagged WHERE in_scope AND weak ORDER BY auction_date DESC LIMIT 5)) AS recent_weak,
        (SELECT coalesce(string_agg(strftime(auction_date, '%Y-%m-%d') || ' ' || series || CASE WHEN reopening THEN ' reopening ' || term ELSE '' END
                 || ' USD ' || printf('%.0f', offering_bn) || 'bn' || coalesce(' (last btc ' || printf('%.2f', last_btc) || ')', '')
                 || CASE WHEN auction_date < CAST(:today AS DATE) THEN ' RESULTS NOT YET PUBLISHED' ELSE '' END, chr(10) ORDER BY auction_date, series), '') FROM calendar) AS calendar_lines,
        (SELECT coalesce(string_agg(series, ', '), '') FROM watch WHERE series NOT IN (SELECT series FROM auctions)) AS unknown_watch,
        (SELECT string_agg(akey, ',' ORDER BY akey) FROM flagged) AS all_keys);

  - id: save_reported
    type: io.kestra.plugin.core.kv.Set
    key: treasury_auctions_reported
    value: "{{ outputs.analyse.outputs[0].row.all_keys }}"
    description: Every auction with results in the window. Keys older than the window drop out together with their data.

  - id: digest_if_needed
    type: io.kestra.plugin.core.flow.If
    description: Posts when new results arrived for the watched series, or when the watch list names a series TreasuryDirect does not have.
    condition: "{{ outputs.analyse.outputs[0].row.new_results > 0 or outputs.analyse.outputs[0].row.unknown_watch != '' }}"
    then:
      - id: warn_weak
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.analyse.outputs[0].row.new_weak > 0 or outputs.analyse.outputs[0].row.unknown_watch != '' }}"
        then:
          - id: warn
            type: io.kestra.plugin.core.log.Log
            level: WARN
            message: |
              {{ outputs.analyse.outputs[0].row.new_weak }} weak auction(s). Unknown watch series: {{ outputs.analyse.outputs[0].row.unknown_watch is empty ? 'none' : outputs.analyse.outputs[0].row.unknown_watch }}
              {{ outputs.analyse.outputs[0].row.new_weak_lines }}
      - id: notify
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: allowFailure keeps the run green when the webhook is not configured.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": {{ ((outputs.analyse.outputs[0].row.new_weak > 0 ? ':warning: ' : ':bank: ') ~ outputs.analyse.outputs[0].row.slack_text ~ 'Execution ' ~ (kestra.url ?? '') ~ '/ui/executions/' ~ flow.namespace ~ '/' ~ flow.id ~ '/' ~ execution.id) | toJson }}
          }

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      {{ outputs.analyse.outputs[0].row.auctions_with_results }} coupon auctions in {{ outputs.analyse.outputs[0].row.series_count }} series, {{ outputs.analyse.outputs[0].row.first_auction }} to {{ outputs.analyse.outputs[0].row.last_auction }}{{ outputs.analyse.outputs[0].row.is_baseline ? ', BASELINE run (history scored, nothing posted)' : '' }}.
      Weak auctions in window: {{ outputs.analyse.outputs[0].row.weak_in_window }}. New results: {{ outputs.analyse.outputs[0].row.new_results }}, of which weak: {{ outputs.analyse.outputs[0].row.new_weak }}.
      Most recent weak auctions:
      {{ outputs.analyse.outputs[0].row.recent_weak }}
      Coming up:
      {{ outputs.analyse.outputs[0].row.calendar_lines is empty ? 'nothing announced' : outputs.analyse.outputs[0].row.calendar_lines }}

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.analyse.outputs[0].row }}"
  - id: results_csv
    type: FILE
    value: "{{ outputs.analyse.outputFiles.results_csv }}"

extend:
  title: Treasury Auction Results Demand Weakness Digest
  metaTitle: US Treasury Auction Demand Weakness Digest with DuckDB | Kestra
  shortDescription: Score every US Treasury coupon auction against the previous auctions of the same security on bid-to-cover, indirect and primary dealer shares, and post a digest of new results, weak auctions and the auctions coming up.
  metaDescription: Flag weak US Treasury note and bond auctions from TreasuryDirect results with bid-to-cover and bidder-share signals in DuckDB, with KV dedupe in Kestra.
  description: |
    A weak Treasury auction (low bid-to-cover, indirect bidders stepping back, primary dealers left holding the supply) moves rates within minutes, but each result only means something next to the previous auctions of the same security. This flow pulls the official results from TreasuryDirect, scores every note, bond, TIPS and FRN auction against its own history, and posts one digest per new batch of results. All data comes from the live TreasuryDirect API; no inputs are sample data.

    ## How it works

    1. A `Schedule` trigger runs at 14:15 New York time on weekdays, after the 1:00 pm coupon auctions close.
    2. `fetch` (Parallel) calls the TreasuryDirect `securities/search` endpoint twice, for `securityType=Note` (also returns FRNs and most TIPS) and `securityType=Bond`. The end date runs past today, so announced auctions come back with empty results and feed the calendar.
    3. `reported` reads the auctions already reported from KV. Without it the run is a `BASELINE`: history is scored, nothing is posted.
    4. `analyse` (DuckDB) groups auctions into series by type and original term, so a 9-year 10-month reopening counts as a 10-year note. Shares use the competitive award. A window over the previous `trailing_auctions` auctions gives the baseline, and three signals are checked: bid-to-cover down by `btc_drop`, dealer share up by `dealer_rise_pp`, indirect share down by `indirect_drop_pp`. An auction is weak when at least `min_signals` fire and it has `min_history` prior auctions. On three years of data, 2 signals flag 25 of 324 auctions; 1 signal flags 84, mostly indirect-share noise.
    5. `save_reported` stores the CUSIP and auction date of every auction with results, so same-day auctions whose results land at different times are each reported once.
    6. `digest_if_needed` (If) posts new results to Slack, weak auctions first with a WARN log, plus the auctions announced for the next `calendar_days`. It also warns on unknown `watch` series.

    ## What you get

    - One line per new auction: high yield (discount margin for FRNs), bid-to-cover, indirect and dealer shares, each with its gap to the trailing average.
    - The upcoming calendar with offering size and the last bid-to-cover of each series.
    - `results_csv` with every scored auction in the window, and a JSON summary output.

    ## Who it's for

    - Fixed-income desks, corporate treasury and ALM teams that watch primary-market demand.
    - Macro and rates analysts who want auction results in context without a terminal.

    ## Why orchestrate this with Kestra

    - Parallel downloads with retries, scoring in one reviewable SQL task.
    - KV state makes re-runs idempotent, so the trigger can move without duplicate posts.

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB plugin and the Slack plugin.
    - Outbound HTTPS to `www.treasurydirect.gov` (no API key).

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook (optional; without it the WARN log still records weak auctions).

    ## Quick start

    1. Execute with the defaults: a `BASELINE` run over about 320 auctions in 11 series, listing the most recent weak auctions and the calendar.
    2. Execute again: nothing new.
    3. Add the Slack secret, then set `watch` (for example `Note 10-Year, Bond 30-Year`) and tune the thresholds.

    ## How to extend

    - Add the when-issued yield from your market data feed to compute the tail, the signal desks quote first.
    - Add `securityType=Bill` for money-market teams, with a longer trailing window.
    - Start a hedge or funding flow with a Flow trigger when a weak auction is found.

    ## Links

    - [TreasuryDirect developer resources and web APIs](https://www.treasurydirect.gov/legal-information/developers/)
    - [Treasury auction results](https://www.treasurydirect.gov/auctions/auction-query/)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Parallel](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.parallel)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
