id: mongodb-asserts-msg-and-rollover-sentinel
namespace: company.data

inputs:
  - id: mongo_uri
    type: STRING
    defaults: "mongodb://mongodb.internal:27017"
    description: MongoDB connection string URI.
  - id: msg_asserts_threshold
    type: INT
    defaults: 0
    description: Maximum acceptable count of message assertion errors.

tasks:
  - id: query_server_asserts
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    dependencies:
      - pymongo==4.15.3
      - kestra==2.0.0
    script: |
      from pymongo import MongoClient
      import sys
      from kestra import Kestra

      mongo_uri = "{{ inputs.mongo_uri }}"
      try:
          client = MongoClient(mongo_uri, serverSelectionTimeoutMS=5000)
          db = client.admin
          status = db.command("serverStatus")
          asserts = status.get("asserts", {})

          msg_asserts = int(asserts.get("msg", 0))
          warning_asserts = int(asserts.get("warning", 0))
          rollovers = int(asserts.get("rollovers", 0))

          print(f"Message asserts: {msg_asserts}, warnings: {warning_asserts}, rollovers: {rollovers}")

          Kestra.outputs({
              "msg_asserts": msg_asserts,
              "warning_asserts": warning_asserts,
              "rollovers": rollovers
          })
      except Exception as e:
          print(f"Error querying MongoDB server asserts: {e}", file=sys.stderr)
          sys.exit(1)

  - id: evaluate_asserts
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_server_asserts.vars.msg_asserts | int > inputs.msg_asserts_threshold or outputs.query_server_asserts.vars.rollovers | int > 0 }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#mongodb-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 MongoDB Server Asserts Spike Alert",
                "text": "MongoDB node `{{ inputs.mongo_uri }}` recorded *{{ outputs.query_server_asserts.vars.msg_asserts }}* message assertions (*{{ outputs.query_server_asserts.vars.warning_asserts }}* warnings, *{{ outputs.query_server_asserts.vars.rollovers }}* rollovers)! Impact: Internal database assertion exceptions indicate software bugs, corrupted BSON data packets, or memory integrity violations.",
                "footer": "Kestra Database Sentinel • MongoDB"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#mongodb-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ MongoDB Server Asserts Spike and Rollover Sentinel Pipeline Failure",
            "text": "Failed to query MongoDB db.serverStatus().asserts. Verify network connectivity and permissions.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

outputs:
  - id: msg_asserts
    type: INT
    value: "{{ outputs.query_server_asserts.vars.msg_asserts }}"
  - id: warning_asserts
    type: INT
    value: "{{ outputs.query_server_asserts.vars.warning_asserts }}"
  - id: rollovers
    type: INT
    value: "{{ outputs.query_server_asserts.vars.rollovers }}"

extend:
  metaDescription: "Monitors MongoDB db.serverStatus().asserts to detect internal server assertion errors and counter rollovers."
  metaTitle: MongoDB Server Asserts Spike and Rollover Sentinel with Kestra
  title: MongoDB Server Asserts Spike and Rollover Sentinel
  shortDescription: Monitors MongoDB db.serverStatus().asserts to detect internal server assertion errors and counter rollovers.
  description: |
    ## How it works
    This workflow executes `db.serverStatus().asserts` via a Python task in Docker to inspect the internal assert counters (`regular`, `warning`, `msg`, `user`, `rollovers`). In MongoDB, `msg` assertions represent anomalous internal server exceptions logged with message strings, and `rollovers` indicate that 32-bit assert counters overflowed. Spikes in these counters reflect driver incompatibilities, malformed BSON commands, or storage engine faults. Slack is notified upon any anomaly.

    ## What you get
    - Immediate detection of internal MongoDB engine assertions.
    - Early warning of malformed driver payloads or memory bugs.
    - Full breakdown of message assertions, warnings, and rollovers.

    ## Who it's for
    - SREs and MongoDB Platform Engineers ensuring database tier reliability.
    - Application architects diagnosing cryptic database driver exceptions.

    ## Why orchestrate this with Kestra
    - **Deep Engine Visibility**: Track internal diagnostics not surfaced in simple ping healthchecks.
    - **Automated Triage**: Receive instant Slack alerts with actionable counts.
    - **Isolated Container Execution**: Clean Python script execution with strict failure reporting.

    ## Prerequisites
    - MongoDB instance accessible over network.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Configure `mongo_uri`.
    3. Run the workflow to inspect server asserts.

    ## How to extend
    - Automatically collect recent `mongod.log` log entries when message assertions spike.
    - Correlate asserts with WiredTiger transaction abort rates.

    ## Links
    - [MongoDB serverStatus Asserts Documentation](https://www.mongodb.com/docs/manual/reference/command/serverStatus/#asserts)
    - [Kestra Python Plugin](https://kestra.io/plugins/plugin-script-python)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
