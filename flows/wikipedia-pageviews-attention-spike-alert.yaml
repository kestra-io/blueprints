id: wikipedia-pageviews-attention-spike-alert
namespace: company.team

description: |
  Daily attention-spike alert for a watchlist of Wikipedia articles (your brand, competitors, executives,
  products). Pulls the daily human pageviews of each article from the Wikimedia Pageviews REST API, fills the
  days the API omits with zero, scores the last few days against a trailing baseline with DuckDB and posts
  each new spike to Slack once. Keyless.

inputs:
  - id: articles
    type: ARRAY
    itemType: STRING
    defaults:
      - Theranos
      - Databricks
      - Snowflake_Inc.
      - Apache_Airflow
      - duckDB
      - Kestra_(software)
    description: |
      Article titles as in the URL (spaces are turned into underscores, the first letter is upper-cased). Pageviews are
      counted per exact title, so use the target of a redirect, not the redirect. The defaults mix a company in the news,
      steady companies and tools, one title with a wrong first letter and one title that has no article.

  - id: project
    type: STRING
    defaults: en.wikipedia
    description: Wikimedia project, for example `en.wikipedia`, `de.wikipedia` or `fr.wikipedia`.

  - id: baseline_days
    type: INT
    defaults: 28
    min: 7
    max: 120
    description: Days in the trailing baseline, ending just before the scan window. Four full weeks keep the weekday/weekend cycle balanced.

  - id: scan_days
    type: INT
    defaults: 3
    min: 1
    max: 14
    description: Most recent days checked for a spike. More than one day covers missed runs and the API publishing a day late.

  - id: z_threshold
    type: FLOAT
    defaults: 3.0
    description: |
      Minimum robust z-score, (views - baseline median) / (1.4826 x median absolute deviation). Median and MAD ignore an
      earlier spike inside the baseline, which would inflate a mean and standard deviation. The spread is floored at the
      square root of the median so very quiet articles do not alert on a handful of views.

  - id: min_ratio
    type: FLOAT
    defaults: 2.0
    description: The spike day must also reach this multiple of the baseline median.

  - id: min_views
    type: INT
    defaults: 500
    description: Ignore days with fewer human views than this.

  - id: cooldown_days
    type: INT
    defaults: 7
    description: After an alert, the same article only alerts again once this many days have passed, or earlier if a later day reaches twice the alerted views.

  - id: state_key
    type: STRING
    defaults: wikipedia_pageviews_spikes
    description: KV key holding the last alert per article. Use one key per watchlist.

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * *"
    description: Daily pageviews for a UTC day are usually published within a few hours after midnight UTC.

tasks:
  - id: plan
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Normalises and deduplicates the titles, validates the project and builds one request per article. The fetch window
      covers baseline + scan days plus one spare day in case yesterday is not published yet.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    parameters:
      articles: "{{ inputs.articles | toJson }}"
      project: "{{ inputs.project }}"
      days: "{{ inputs.baseline_days + inputs.scan_days }}"
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE titles AS
      SELECT DISTINCT upper(left(t, 1)) || substr(t, 2) AS article
      FROM (SELECT regexp_replace(trim(a), '\s+', '_', 'g') AS t FROM unnest(from_json(:articles, '["VARCHAR"]')) AS x(a))
      WHERE t <> '';
      CREATE TABLE p AS SELECT CASE WHEN regexp_matches(:project, '^[a-z][a-z0-9-]*\.(wikipedia|wiktionary|wikiquote|wikisource|wikivoyage|wikibooks|wikinews|wikiversity)$')
                                    THEN :project ELSE error('Unknown Wikimedia project ' || :project || ', expected e.g. en.wikipedia') END AS project;
      SELECT count(*) AS articles,
             strftime(current_date - CAST(:days AS INTEGER) - 1, '%Y%m%d') AS start_day,
             strftime(current_date - 1, '%Y%m%d') AS end_day,
             CAST(json_group_array(json_object('article', article, 'project', (SELECT project FROM p),
                  'start', strftime(current_date - CAST(:days AS INTEGER) - 1, '%Y%m%d'), 'end', strftime(current_date - 1, '%Y%m%d'))) AS VARCHAR) AS items
      FROM titles;

  - id: fetch
    type: io.kestra.plugin.core.flow.Loop
    description: One request per article, two at a time. Each item carries the project and dates because Loop iterations run in their own context.
    values: "{{ outputs.plan.outputs[0].row.items }}"
    concurrencyLimit: 2
    tasks:
      - id: daily_views
        type: io.kestra.plugin.core.http.Download
        description: |
          Human (`agent=user`) views on all platforms. A 404 means the title had no views at all in the window, which in
          practice is a wrong title (case, redirect, missing article); it is landed as empty and reported. 429 and 5xx retry.
        uri: "https://wikimedia.org/api/rest_v1/metrics/pageviews/per-article/{{ fromJson(item.value).project }}/all-access/user/{{ fromJson(item.value).article | urlencode }}/daily/{{ fromJson(item.value).start }}/{{ fromJson(item.value).end }}"
        headers:
          User-Agent: "kestra-wikipedia-pageviews-attention-spike-alert/1.0 (https://kestra.io)"
          Accept: application/json
        options:
          allowedResponseCodes: [200, 404]
          retryOnStatusCodes: [429, 500, 502, 503, 504]
          retry:
            type: exponential
            interval: PT5S
            maxInterval: PT1M
            maxAttempts: 4
    outputs:
      - id: article
        type: STRING
        value: "{{ fromJson(item.value).article }}"
      - id: code
        type: INT
        value: "{{ outputs.daily_views.code }}"
      - id: uri
        type: STRING
        value: "{{ outputs.daily_views.uri }}"

  - id: collect
    type: io.kestra.plugin.core.storage.Concat
    files: "{{ outputs.fetch.outputs | jq('[.[].outputs.uri]') | first }}"
    separator: "\n"
    extension: .json

  - id: previous_alerts
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false
    description: JSON array of the last alert per article. Missing on the first run, which alerts on any spike in the scan window.

  - id: score
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Builds a day-by-day series per article up to the newest day the API has published, filling omitted days with 0
      views. Each scan day is compared with the baseline window just before the scan window (so a multi-day spike does
      not inflate its own baseline). The peak qualifying day per article alerts unless the article alerted within
      `cooldown_days` at less than half those views.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      pages.json: "{{ outputs.collect.uri }}"
    outputFiles:
      - report_csv
      - series_parquet
    parameters:
      fetched: "{{ outputs.fetch.outputs | jq('[.[].outputs | {article, code}]') | first | toJson }}"
      state: "{{ outputs.previous_alerts.value ?? '[]' }}"
      project: "{{ inputs.project }}"
      baseline_days: "{{ inputs.baseline_days }}"
      scan_days: "{{ inputs.scan_days }}"
      z_threshold: "{{ inputs.z_threshold }}"
      min_ratio: "{{ inputs.min_ratio }}"
      min_views: "{{ inputs.min_views }}"
      cooldown_days: "{{ inputs.cooldown_days }}"
      end_day: "{{ outputs.plan.outputs[0].row.end_day }}"
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE fetched AS
      SELECT json_extract_string(f, '$.article') AS article, CAST(json_extract_string(f, '$.code') AS INTEGER) AS code
      FROM (SELECT unnest(from_json(:fetched, '["JSON"]')) AS f);

      CREATE TABLE raw AS
      SELECT json_extract_string(i, '$.article') AS article,
             CAST(strptime(left(json_extract_string(i, '$.timestamp'), 8), '%Y%m%d') AS DATE) AS day,
             CAST(json_extract_string(i, '$.views') AS BIGINT) AS views
      FROM read_json_objects('pages.json', format = 'unstructured') AS d,
           unnest(from_json(json_extract(d.json, '$.items'), '["JSON"]')) AS t(i);

      CREATE TABLE w AS
      SELECT coalesce(max(day), CAST(strptime(:end_day, '%Y%m%d') AS DATE)) AS data_end FROM raw;
      CREATE TABLE win AS
      SELECT data_end, data_end - CAST(:scan_days AS INTEGER) + 1 AS scan_from,
             data_end - CAST(:scan_days AS INTEGER) - CAST(:baseline_days AS INTEGER) + 1 AS base_from FROM w;

      CREATE TABLE series AS
      SELECT f.article, CAST(g.d AS DATE) AS day, coalesce(r.views, 0) AS views, r.views IS NULL AS filled
      FROM fetched f
      CROSS JOIN win
      CROSS JOIN generate_series(CAST(win.base_from AS TIMESTAMP), CAST(win.data_end AS TIMESTAMP), INTERVAL 1 DAY) AS g(d)
      LEFT JOIN raw r ON r.article = f.article AND r.day = CAST(g.d AS DATE)
      WHERE f.code = 200;

      CREATE TABLE base AS
      SELECT article, mean, med, zero_days, (SELECT median(abs(s2.views - med)) FROM series s2, win WHERE s2.article = b0.article AND s2.day < win.scan_from) AS mad
      FROM (SELECT s.article, avg(views) AS mean, median(views) AS med, sum(CAST(filled AS INTEGER)) AS zero_days
            FROM series s, win WHERE s.day < win.scan_from GROUP BY s.article) AS b0;

      CREATE TABLE scored AS
      SELECT s.article, s.day, s.views, b.mean, b.med,
             (s.views - b.med) / greatest(1.4826 * b.mad, sqrt(greatest(b.med, 1))) AS z
      FROM series s JOIN base b USING (article), win WHERE s.day >= win.scan_from;

      CREATE TABLE peaks AS
      SELECT DISTINCT ON (article) article, day, views, z, views / greatest(med, 1) AS ratio
      FROM scored
      WHERE views >= CAST(:min_views AS BIGINT) AND z >= CAST(:z_threshold AS DOUBLE) AND views >= CAST(:min_ratio AS DOUBLE) * med
      ORDER BY article, views DESC;

      CREATE TABLE prev AS
      SELECT s.article, s.day, s.views
      FROM (SELECT unnest(from_json(:state, '[{"article":"VARCHAR","day":"DATE","views":"BIGINT"}]')) AS s);

      CREATE TABLE decided AS
      SELECT p.*, pr.day AS prev_day, pr.views AS prev_views,
             pr.article IS NULL OR (p.day > pr.day AND (p.day - pr.day > CAST(:cooldown_days AS INTEGER) OR p.views >= 2 * pr.views)) AS alert
      FROM peaks p LEFT JOIN prev pr USING (article);

      CREATE TABLE report AS
      SELECT f.article,
             CASE WHEN f.code <> 200 THEN 'NOT_FOUND' WHEN d.alert THEN 'SPIKE' WHEN d.article IS NOT NULL THEN 'SPIKE_ALREADY_ALERTED' ELSE 'NORMAL' END AS status,
             (SELECT views FROM series s, win WHERE s.article = f.article AND s.day = win.data_end) AS latest_views,
             round(b.mean, 1) AS baseline_mean, b.med AS baseline_median, b.zero_days AS baseline_zero_days,
             d.day AS spike_day, d.views AS spike_views, round(d.z, 1) AS z, round(d.ratio, 1) AS ratio, d.prev_day AS last_alert_day, d.prev_views AS last_alert_views,
             'https://' || :project || '.org/wiki/' || f.article AS article_url,
             'https://pageviews.wmcloud.org/?project=' || :project || '.org&pages=' || f.article || '&range=latest-60' AS chart_url
      FROM fetched f LEFT JOIN base b USING (article) LEFT JOIN decided d USING (article);

      COPY (SELECT * FROM report ORDER BY status DESC, z DESC NULLS LAST, article) TO '{{ outputFiles.report_csv }}' (HEADER, DELIMITER ',');
      COPY (SELECT * FROM series ORDER BY article, day) TO '{{ outputFiles.series_parquet }}' (FORMAT PARQUET);

      SELECT
        (SELECT strftime(data_end, '%Y-%m-%d') FROM win) AS data_end,
        (SELECT strftime(scan_from, '%Y-%m-%d') FROM win) AS scan_from,
        (SELECT strftime(base_from, '%Y-%m-%d') FROM win) AS base_from,
        (SELECT count(*) FROM report) AS articles,
        (SELECT count(*) FROM report WHERE status = 'SPIKE') AS new_spikes,
        (SELECT count(*) FROM report WHERE status = 'SPIKE_ALREADY_ALERTED') AS suppressed,
        (SELECT count(*) FROM report WHERE status = 'NORMAL') AS normal,
        (SELECT coalesce(string_agg(article, ', ' ORDER BY article), '') FROM report WHERE status = 'NOT_FOUND') AS not_found,
        (SELECT coalesce(string_agg(article || ' ' || latest_views || ' (baseline ' || baseline_mean || ')', ', ' ORDER BY article), '') FROM report WHERE status = 'NORMAL') AS normal_lines,
        (SELECT coalesce(string_agg(article || ' ' || spike_views || ' views on ' || strftime(spike_day, '%Y-%m-%d') || ', z ' || z || ', ' || ratio || 'x median ' || baseline_median
                    || CASE WHEN last_alert_day IS NOT NULL THEN ', again after ' || last_alert_views || ' views on ' || strftime(last_alert_day, '%Y-%m-%d') ELSE '' END, chr(10) ORDER BY z DESC), '')
           FROM report WHERE status = 'SPIKE') AS spike_lines,
        (SELECT CAST(json_group_array(json_object('article', article, 'day', strftime(day, '%Y-%m-%d'), 'views', views)) AS VARCHAR)
           FROM (SELECT article, day, views FROM prev WHERE article NOT IN (SELECT article FROM decided WHERE alert)
                 UNION ALL SELECT article, day, views FROM decided WHERE alert)) AS new_state,
        (SELECT CAST(json_object('text', '*Wikipedia attention spikes* (' || :project || ', ' || count(*) || ' new)' || chr(10)
              || string_agg('• <' || article_url || '|' || replace(article, '_', ' ') || '> ' || spike_views || ' views on ' || strftime(spike_day, '%Y-%m-%d')
                   || ' (z ' || z || ', ' || ratio || 'x the ' || baseline_median || ' median) <' || chart_url || '|chart>', chr(10) ORDER BY z DESC)) AS VARCHAR)
           FROM report WHERE status = 'SPIKE') AS slack_payload;

  - id: save_alerts
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.score.outputs[0].row.new_state }}"
    description: Saved only after a successful fetch and score, so a failed run never marks a spike as alerted.

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.score.outputs[0].row.new_spikes > 0 }}"
    then:
      - id: notify
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: One message per run. allowFailure keeps the flow green when the webhook secret is not set; the spikes are still logged.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: "{{ outputs.score.outputs[0].row.slack_payload }}"
      - id: log_spikes
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: |
          {{ outputs.score.outputs[0].row.new_spikes }} new attention spike(s):
          {{ outputs.score.outputs[0].row.spike_lines }}
    else:
      - id: no_spikes
        type: io.kestra.plugin.core.log.Log
        message: "No new spikes ({{ outputs.score.outputs[0].row.suppressed }} spike(s) already alerted within the cooldown)."

  - id: warn_not_found
    type: io.kestra.plugin.core.log.Log
    runIf: "{{ outputs.score.outputs[0].row.not_found is not empty }}"
    level: WARN
    message: "No pageviews at all for {{ outputs.score.outputs[0].row.not_found }} on {{ inputs.project }}. Check the spelling and case, and use the redirect target rather than the redirect."

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      Pageviews {{ inputs.project }}: baseline {{ outputs.score.outputs[0].row.base_from }} to the day before {{ outputs.score.outputs[0].row.scan_from }}, scan {{ outputs.score.outputs[0].row.scan_from }} to {{ outputs.score.outputs[0].row.data_end }} (newest published day).
      {{ outputs.score.outputs[0].row.articles }} articles: {{ outputs.score.outputs[0].row.new_spikes }} new spike(s), {{ outputs.score.outputs[0].row.suppressed }} already alerted, {{ outputs.score.outputs[0].row.normal }} normal, not found: {{ outputs.score.outputs[0].row.not_found is empty ? 'none' : outputs.score.outputs[0].row.not_found }}.
      Normal (latest day vs baseline mean): {{ outputs.score.outputs[0].row.normal_lines }}

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.score.outputs[0].row | jq('del(.slack_payload, .new_state)') | first }}"
  - id: report_csv
    type: FILE
    value: "{{ outputs.score.outputFiles.report_csv }}"
  - id: series_parquet
    type: FILE
    value: "{{ outputs.score.outputFiles.series_parquet }}"

extend:
  title: Alert on Wikipedia Pageview Spikes for Your Brand and Competitors with DuckDB and Slack
  metaTitle: Wikipedia Pageviews Attention Spike Alert with DuckDB and Slack | Kestra
  shortDescription: Pull daily human pageviews for a watchlist of Wikipedia articles from the Wikimedia REST API, score the last days against a robust trailing baseline in DuckDB and post each new attention spike to Slack once.
  metaDescription: Daily Wikipedia pageview spike alert for brands, competitors and people, with a robust median/MAD baseline in DuckDB, KV cooldown and Slack alerts.
  description: |
    A jump in Wikipedia pageviews is an early public signal that a company, product or person is in the news. The Wikimedia Pageviews REST API serves daily views per article without a key, but alerting on it has traps: titles are case- and redirect-sensitive, zero-view days are left out of the response, the newest day is published late, and an earlier spike inside the baseline hides the next one when you use a mean and standard deviation. This flow handles those and alerts once per spike.

    ## How it works

    1. A daily `Schedule` (06:00 UTC) starts the run. `plan` (DuckDB) normalises titles (underscores, upper-case first letter, no duplicates), rejects an unknown project and builds one request per article.
    2. `fetch` (Loop, two at a time) downloads `per-article/{project}/all-access/user/{title}/daily/{start}/{end}` with a URL-encoded title. A 404 means no views in the window (wrong title) and is reported; 429 and 5xx retry.
    3. `score` (DuckDB) zero-fills each series up to the newest published day, takes the median and MAD of the baseline window that ends before the scan window, and keeps each article's peak scan day that passes `z_threshold`, `min_ratio` x median and `min_views`.
    4. The last alert per article lives in KV: an article alerts again after `cooldown_days`, or earlier at twice the alerted views.
    5. `route` (If) posts one Slack message (`allowFailure`) and logs spikes at WARN; `warn_not_found` lists titles without views.

    ## What you get

    - A report CSV (status `SPIKE`, `SPIKE_ALREADY_ALERTED`, `NORMAL` or `NOT_FOUND`, baseline, z-score, ratio, links) and a Parquet daily series.
    - One alert per spike, plus a re-alert when a story keeps growing.
    - Typos and redirect titles reported instead of looking quiet.

    ## Who it's for

    - Comms, brand and product marketing teams watching their company, products and executives.
    - Competitive intelligence analysts, newsrooms and researchers.

    ## Why orchestrate this with Kestra

    - HTTP retries, allowed status codes and Loop concurrency replace hand-written request code.
    - The spike rule is readable SQL; KV state stops re-runs from alerting twice, one `state_key` per watchlist.
    - Secrets stay masked and a missing webhook does not stop the watch.

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB and Slack plugins, and HTTPS to `wikimedia.org`. No API key. Put your contact in the `User-Agent` header, as Wikimedia asks.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook (optional; without it the spikes are still logged and in the CSV).

    ## Quick start

    1. Import the flow and **Execute** with the defaults: a company in the news, steady companies and tools, `duckDB` (fixed to `DuckDB`) and `Kestra_(software)`, which has no article.
    2. Execute again: the same spike is suppressed by the cooldown.
    3. Put your watchlist in `articles`, add the secret and keep the schedule on.

    ## How to extend

    - Watch several language editions, or split `mobile-app` and `desktop` access.
    - Use a day-of-week baseline for articles with a strong weekly cycle.
    - Append the series Parquet to a warehouse to chart attention next to traffic or sales.

    ## Links

    - [HTTP Download](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download), [Loop](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop), [If](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if), [KV Set](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.set)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries) and [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [Wikimedia Pageviews API](https://doc.wikimedia.org/generated-data-platform/aqs/analytics-api/reference/page-views.html), [User-Agent policy](https://foundation.wikimedia.org/wiki/Policy:Wikimedia_Foundation_User-Agent_Policy), [Pageviews Analysis](https://pageviews.wmcloud.org/)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - ELT & Data Landing
  ee: false
  demo: false
