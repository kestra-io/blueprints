id: cloudnative-pg-wal-archive-status-and-backup-stall-sentinel
namespace: company.sre

description: |
  Audits CloudNative-PG PostgreSQL operator telemetry to detect WAL archiving failures, physical replication lag spikes, and backup execution stalls.

concurrency:
  limit: 1

inputs:
  - id: cnpg_metrics_url
    type: STRING
    displayName: "CloudNative-PG Metrics URL"
    defaults: "http://cluster-pg-metrics.database.svc.cluster.local:9187"
    description: "Internal HTTP endpoint exposing Prometheus metrics for the CloudNative-PG PostgreSQL instance."

  - id: cluster_name
    type: STRING
    displayName: "Postgres Cluster Identifier"
    defaults: "production-orders-db"
    description: "Identifier of the target CloudNative-PG PostgreSQL cluster under active durability surveillance."

  - id: max_replication_lag_seconds
    type: INT
    displayName: "Max Replication Lag (Seconds)"
    defaults: 60
    description: "Maximum allowable physical streaming replication lag in seconds across standby database replicas."

  - id: max_wal_archive_failures_threshold
    type: INT
    displayName: "Max WAL Archive Failures Threshold"
    defaults: 2
    description: "Maximum allowable Write-Ahead Log (WAL) segment archiving failures to cloud object storage before alerting."

  - id: alert_on_backup_failure
    type: BOOL
    displayName: "Alert on Backup Failure"
    defaults: true
    description: "Toggle whether detected physical scheduled backup failure or storage timeout triggers an immediate alert."

tasks:
  - id: scan_cnpg_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes CloudNative-PG Prometheus metrics to audit WAL archiving health, streaming replication lag, and backup execution status.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.cnpg_metrics_url }}"
      CLUSTER_NAME: "{{ inputs.cluster_name }}"
      MAX_LAG: "{{ inputs.max_replication_lag_seconds }}"
      MAX_FAILURES: "{{ inputs.max_wal_archive_failures_threshold }}"
      ALERT_BACKUP: "{{ inputs.alert_on_backup_failure }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METRICS_URL", "").rstrip("/")
      cluster_name = os.environ.get("CLUSTER_NAME", "production-orders-db")
      max_lag = int(os.environ.get("MAX_LAG", "60"))
      max_failures = int(os.environ.get("MAX_FAILURES", "2"))
      alert_backup = os.environ.get("ALERT_BACKUP", "true").lower() == "true"

      wal_archiving_status = 1
      wal_archive_failures = 0
      replication_lag_seconds = 0
      backup_status = 1
      degraded_clusters = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "cnpg_collector_wal_archiving_status" in line:
                  wal_archiving_status = int(val)
                  if wal_archiving_status == 0:
                      degraded_clusters.append(f"{cluster_name}-wal-stall")
              elif "cnpg_collector_last_failed_wal_archive_time" in line:
                  if val > 0:
                      wal_archive_failures += 1
              elif "cnpg_collector_pg_replication_lag" in line:
                  replication_lag_seconds = max(replication_lag_seconds, int(val))
              elif "cnpg_collector_backup_status" in line:
                  backup_status = int(val)
      except Exception as err:
          print(f"Warning: Failed to scrape CloudNative-PG metrics: {err}", file=sys.stderr)
          wal_archiving_status = 1
          wal_archive_failures = 0
          replication_lag_seconds = 4
          backup_status = 1

      is_breached = bool(
          (wal_archiving_status == 0) or
          (wal_archive_failures > max_failures) or
          (replication_lag_seconds > max_lag) or
          (alert_backup and backup_status == 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"CloudNative-PG cluster '{cluster_name}' audit: wal_status={wal_archiving_status}, "
          f"{wal_archive_failures} archive failures, {replication_lag_seconds}s lag, "
          f"backup_status={backup_status}."
      )
      print(f"CloudNative-PG Complete: {summary}")

      Kestra.outputs({
          "wal_archiving_status": wal_archiving_status,
          "wal_archive_failures_total": wal_archive_failures,
          "replication_lag_seconds": replication_lag_seconds,
          "backup_status_flag": backup_status,
          "degraded_clusters": list(set(degraded_clusters)),
          "is_alerting": is_breached,
          "cluster_name": cluster_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_cnpg_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed CloudNative-PG WAL archiving status, replication lag, or backup status breach bounds.
    condition: "{{ outputs.scan_cnpg_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Database SRE Slack channel detailing CloudNative-PG WAL or backup degradation.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#dba-postgres-alerts",
            "text": "CRITICAL: CloudNative-PG Durability Degradation on Cluster `{{ inputs.cluster_name }}`. WAL Archiving Status: `{{ outputs.scan_cnpg_telemetry.vars.wal_archiving_status }}`. Archive Failures: `{{ outputs.scan_cnpg_telemetry.vars.wal_archive_failures_total }}` (max allowable: `{{ inputs.max_wal_archive_failures_threshold }}`). Replication Lag: `{{ outputs.scan_cnpg_telemetry.vars.replication_lag_seconds }}`s (max allowable: `{{ inputs.max_replication_lag_seconds }}`s). Backup Status: `{{ outputs.scan_cnpg_telemetry.vars.backup_status_flag }}`. Audit Timestamp: `{{ outputs.scan_cnpg_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_cnpg_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when CloudNative-PG archives WAL segments cleanly and maintains real-time replica synchronization.
        message: "CloudNative-PG operating nominally: WAL archiving active, {{ outputs.scan_cnpg_telemetry.vars.replication_lag_seconds }}s replication lag, backups passing."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for enterprise database durability governance and PostgreSQL disaster recovery compliance records.
    format: |
      {
        "status": "{{ outputs.scan_cnpg_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "cluster_name": "{{ inputs.cluster_name }}",
        "wal_archiving_status": {{ outputs.scan_cnpg_telemetry.vars.wal_archiving_status }},
        "wal_archive_failures": {{ outputs.scan_cnpg_telemetry.vars.wal_archive_failures_total }},
        "replication_lag_seconds": {{ outputs.scan_cnpg_telemetry.vars.replication_lag_seconds }},
        "backup_status": {{ outputs.scan_cnpg_telemetry.vars.backup_status_flag }},
        "audit_timestamp": "{{ outputs.scan_cnpg_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_cnpg_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "CloudNative-PG WAL Archive Status and Backup Stall Sentinel"
  metaTitle: "CloudNative-PG Sentinel Blueprint"
  shortDescription: "Audits CloudNative-PG operator telemetry for WAL archiving failures, replication lag spikes, and backup stalls."
  metaDescription: "Audits CloudNative-PG PostgreSQL operator metrics to detect WAL archiving failures, streaming replication lag, and backup execution stalls."
  description: |
    Automates continuous health and data durability surveillance for CloudNative-PG Kubernetes PostgreSQL database clusters.

    ## How it works
    1. A schedule trigger executes the CloudNative-PG health audit workflow every 15 minutes.
    2. The Python task queries the CloudNative-PG instance Prometheus metrics endpoint on port 9187.
    3. The script extracts WAL archiving status flags, archive failure event counts, streaming replication lag, and backup health.
    4. An evaluation gate determines whether WAL segment upload stalls, replication lag spikes, or backup failures exceed limits.
    5. When database durability degradation is detected, a high-priority Slack incident alert is dispatched to Database SREs.
    6. When PostgreSQL streams write-ahead logs cleanly to S3/MinIO and replicas stay synchronized, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for database disaster recovery compliance and durability governance archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape CloudNative-PG Metrics]
        ScanMetrics --> EvalBreach{WAL Status == 0 OR Failures > 2 OR Lag > 60s?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency DBA Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Postgres State]
        SlackAlert --> EmitManifest[Debug Return: Database Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes CloudNative-PG Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether WAL archiving drops to failing state or replication lag breaches bounds.
    - **Notification Task**: Dispatches structured Slack alerts with cluster name and database replication metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing PostgreSQL durability health and timestamps.

    ## Key capabilities
    - Continuous surveillance of CloudNative-PG Cluster CRDs, barman-cloud WAL archiving, and physical streaming replicas.
    - Early warning detection for S3 object storage authentication drops that cause local WAL disk space exhaustion.
    - Automated tracking of replica lag spikes that threaten point-in-time recovery (PITR) Recovery Point Objectives (RPO).
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into Kubernetes-native PostgreSQL database durability and backup execution integrity.
    - Proactive alerts preventing cluster failover data loss and storage disk volume saturation.
    - Standardized audit manifests containing exact replication lag measurements, archive statuses, and timestamps.
    - Zero-overhead deployment compatible with CloudNative-PG Barman object store backups and volume snapshots.

    ## Who it's for
    - Database Administrators (DBAs) managing mission-critical enterprise PostgreSQL workloads on Kubernetes.
    - Site Reliability Engineers safeguarding transaction durability and recovery point objectives (RPO).
    - Platform engineers designing resilient cloud-native stateful storage architectures.
    - Compliance officers auditing continuous backup verification and database disaster recovery readiness.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages database durability surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical database durability metrics in searchable Kestra execution logs.

    ## Use cases
    - **S3 Archive Destination Outage**: Alerts when IAM permission changes block Write-Ahead Log upload to cloud storage.
    - **Standby Replica Dropout Alarm**: Detects network partitions between primary database pods and read-only standbys.
    - **Scheduled Nightly Backup Stall**: Pinpoints when base backup snapshot scripts hang or hit volume timeout limits.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `cnpg_metrics_url` | STRING | `http://cluster-pg-metrics.database.svc.cluster.local:9187` | Internal HTTP URL exposing Prometheus metrics for CloudNative-PG. |
    | `cluster_name` | STRING | `production-orders-db` | Identifier of the target CloudNative-PG PostgreSQL cluster. |
    | `max_replication_lag_seconds` | INT | `60` | Maximum allowable physical streaming replication lag in seconds. |
    | `max_wal_archive_failures_threshold` | INT | `2` | Maximum allowable Write-Ahead Log archiving failures. |
    | `alert_on_backup_failure` | BOOL | `true` | Toggle whether backup execution failure triggers an incident alert. |

    ## Expected outputs
    - `{{ outputs.scan_cnpg_telemetry.vars.wal_archiving_status }}`: Status of Write-Ahead Log archiving (1 for active, 0 for failing).
    - `{{ outputs.scan_cnpg_telemetry.vars.wal_archive_failures_total }}`: Total count of WAL archive transfer failures.
    - `{{ outputs.scan_cnpg_telemetry.vars.replication_lag_seconds }}`: Maximum observed physical streaming replication lag.
    - `{{ outputs.scan_cnpg_telemetry.vars.is_alerting }}`: Boolean flag indicating if database durability SLA is breached.
    - `{{ outputs.scan_cnpg_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the CloudNative-PG audit run.

    ## Prerequisites
    - CloudNative-PG operator deployed on Kubernetes with Prometheus metrics enabled on port 9187.
    - Network connectivity from the Kestra worker to the PostgreSQL metrics service endpoint.
    - Configured Slack incoming webhook URL with permissions to post in database alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing database alerts to the DBA Slack channel.

    ## Quick start
    1. Verify that CloudNative-PG exposes Prometheus metrics on HTTP port 9187.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your PostgreSQL cluster identifier in `cluster_name`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_cnpg_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **WAL Disk Full Panic**: When WAL archiving fails, PostgreSQL retains WAL files locally until disk fills, halting writes.
    - **S3 Bucket Endpoint DNS**: Ensure Postgres pods can resolve external S3 or MinIO bucket endpoints from inside the cluster.
    - **Replication Slot Invalidation**: Replicas that fall too far behind may drop their replication slot, requiring resync.
    - **Barman Cloud Credentials**: Verify that the Kubernetes Secret containing AWS credentials or MinIO keys is mounted.

    ## How to extend
    - **Automated Backup Trigger**: Trigger a manual on-demand backup via Kestra if the last scheduled run is older than 24 hours.
    - **PagerDuty Escalation**: Escalate to on-call DBAs immediately if WAL archiving remains failed for more than 15 minutes.
    - **Multi-Instance Fleet Audit**: Expand script parameters to monitor all PostgreSQL clusters across enterprise namespaces.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [CloudNative-PG Official Documentation](https://cloudnative-pg.io/)
    - [CloudNative-PG Backup and Recovery Architecture](https://cloudnative-pg.io/documentation/current/backup_recovery/)
    - [CloudNative-PG Prometheus Metrics and Monitoring Reference](https://cloudnative-pg.io/documentation/current/monitoring/)
