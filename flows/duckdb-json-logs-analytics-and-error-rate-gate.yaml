id: duckdb-json-logs-analytics-and-error-rate-gate
namespace: company.analytics

description: |
  Automated log intelligence pipeline that aggregates application JSON access logs
  using DuckDB SQL, calculates HTTP 5xx error rate percentages, and enforces
  quality-of-service SLA thresholds.

tasks:
  - id: generate_sample_access_logs
    type: io.kestra.plugin.scripts.shell.Commands
    description: Generate simulated JSON application server access logs
    commands:
      - |
        cat << 'EOF' > app_access_logs.json
        {"timestamp": "2026-10-22T10:00:00Z", "service": "payment-api", "endpoint": "/checkout", "status_code": 200, "response_time_ms": 120}
        {"timestamp": "2026-10-22T10:01:00Z", "service": "payment-api", "endpoint": "/checkout", "status_code": 200, "response_time_ms": 145}
        {"timestamp": "2026-10-22T10:02:00Z", "service": "payment-api", "endpoint": "/orders", "status_code": 200, "response_time_ms": 89}
        {"timestamp": "2026-10-22T10:03:00Z", "service": "payment-api", "endpoint": "/checkout", "status_code": 500, "response_time_ms": 520}
        {"timestamp": "2026-10-22T10:04:00Z", "service": "payment-api", "endpoint": "/checkout", "status_code": 200, "response_time_ms": 110}
        {"timestamp": "2026-10-22T10:05:00Z", "service": "payment-api", "endpoint": "/auth", "status_code": 401, "response_time_ms": 45}
        {"timestamp": "2026-10-22T10:06:00Z", "service": "payment-api", "endpoint": "/checkout", "status_code": 200, "response_time_ms": 130}
        {"timestamp": "2026-10-22T10:07:00Z", "service": "payment-api", "endpoint": "/checkout", "status_code": 200, "response_time_ms": 115}
        {"timestamp": "2026-10-22T10:08:00Z", "service": "payment-api", "endpoint": "/checkout", "status_code": 503, "response_time_ms": 450}
        {"timestamp": "2026-10-22T10:09:00Z", "service": "payment-api", "endpoint": "/orders", "status_code": 200, "response_time_ms": 95}
        EOF
    outputFiles:
      - app_access_logs.json

  - id: analyze_error_rates_duckdb
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: Parse JSON logs and compute SLA error metrics using DuckDB
    sql: |
      CREATE TABLE logs AS SELECT * FROM read_json_auto('{{ outputs.generate_sample_access_logs.outputFiles["app_access_logs.json"] }}');

      SELECT
        service,
        COUNT(*) AS total_requests,
        COUNT(CASE WHEN status_code >= 500 THEN 1 END) AS error_5xx_count,
        ROUND(AVG(response_time_ms), 2) AS avg_latency_ms,
        ROUND(
          (COUNT(CASE WHEN status_code >= 500 THEN 1 END)::DOUBLE / COUNT(*)::DOUBLE) * 100, 2
        ) AS error_rate_pct
      FROM logs
      GROUP BY service;
    fetchOne: true

  - id: evaluate_error_rate_threshold
    type: io.kestra.plugin.core.flow.If
    description: SLA gate checking if HTTP 5xx error rate is within acceptable limits (<= 5.0%)
    condition: "{{ outputs.analyze_error_rates_duckdb.row.error_rate_pct <= 5.0 }}"
    then:
      - id: log_sla_healthy
        type: io.kestra.plugin.core.log.Log
        message: >-
          Service SLA PASSED: Service '{{ outputs.analyze_error_rates_duckdb.row.service }}'
          operating within SLA. Error rate is
          {{ outputs.analyze_error_rates_duckdb.row.error_rate_pct }}%
          ({{ outputs.analyze_error_rates_duckdb.row.error_5xx_count }} errors across
          {{ outputs.analyze_error_rates_duckdb.row.total_requests }} requests,
          avg latency: {{ outputs.analyze_error_rates_duckdb.row.avg_latency_ms }} ms).
    else:
      - id: log_sla_breach_warning
        type: io.kestra.plugin.core.log.Log
        message: >-
          Service SLA BREACH: Service '{{ outputs.analyze_error_rates_duckdb.row.service }}'
          exceeded error threshold! Error rate is
          {{ outputs.analyze_error_rates_duckdb.row.error_rate_pct }}%
          ({{ outputs.analyze_error_rates_duckdb.row.error_5xx_count }} errors).

triggers:
  - id: hourly_sla_monitoring_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"

extend:
  title: JSON Access Log Intelligence and Error Rate SLA Gate with DuckDB
  metaTitle: JSON Access Log Intelligence & Error Rate SLA Gate with DuckDB | Kestra
  shortDescription: >-
    Parse JSON server access logs, calculate 5xx error rate percentages, and enforce
    SLA thresholds using in-process DuckDB.
  metaDescription: >-
    Automate JSON access log analytics and SLA error rate monitoring using DuckDB
    in Kestra, featuring conditional threshold gates and hourly scheduling.
  description: |
    Automated log monitoring workflow that queries semi-structured JSON access logs
    using embedded DuckDB SQL functions to calculate server error rates and enforce
    service-level reliability gates.

    ## How it works

    1. The flow runs automatically every hour via a `Schedule` trigger, or on-demand.
    2. An event ingestion task provides raw JSON log events recording HTTP status codes
       and response times.
    3. The `Query` task utilizes DuckDB's native `read_json_auto()` function to inspect
       the log payload, compute total request volume, calculate 5xx error counts, and
       determine average response latency without external ingest engines.
    4. An `If` conditional evaluation task tests whether the computed error rate remains
       within SLA tolerances (<= 5%), directing output to healthy log reports or breach
       warnings.

    ## What you get

    - Zero-infrastructure JSON log analytics using embedded DuckDB.
    - Automated percentage calculation for HTTP 5xx server failure rates.
    - Real-time SLA threshold evaluation with conditional workflow branch routing.
    - Hourly automated operational auditing and trend tracking.

    ## Who it's for

    - DevOps and Site Reliability Engineers tracking service error budgets.
    - Data Engineers aggregating semi-structured log streams without heavy OLAP clusters.
    - Platform teams establishing automated SLA breach alerting pipelines.

    ## Why orchestrate this with Kestra

    - Unified orchestration of log extraction, analytical aggregation, and alerting.
    - Serverless in-process DuckDB execution avoids running dedicated monitoring databases.
    - Clear state tracking, full audit logs, and instant reruns upon failure.

    ## Prerequisites

    - Basic understanding of SQL syntax and HTTP status codes.
    - Docker or container runtime enabled for task execution.

    ### Secrets

    - None required for local in-process execution.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Click **Execute** to run an immediate log analysis run.
    3. Inspect the `Outputs` tab to review calculated error percentages.
    4. Enable the `hourly_sla_monitoring_schedule` trigger for continuous monitoring.

    ## How to extend

    - Modify `read_json_auto()` to stream directly from Amazon S3, Google Cloud Storage,
      or MinIO buckets.
    - Insert a PagerDuty, Slack, or OpsGenie notification task inside the `else` branch
      to dispatch immediate on-call pages during outages.
    - Write aggregated hourly SLA metrics into ClickHouse or PostgreSQL for historical
      uptime reporting.

    ## Links

    - [Kestra DuckDB Plugin](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [Kestra Flow Control](https://kestra.io/docs/workflow-components/flow-control)
  tags:
    - Data
    - System
  subTags:
    - Data Warehouses
    - Monitoring & Alerting
  ee: false
  demo: false
