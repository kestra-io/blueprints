id: gitlab-pipeline-duration-regression-watchdog
namespace: company.devops

inputs:
  - id: gitlab_host
    type: STRING
    displayName: GitLab Host Base URL
    defaults: "https://gitlab.com"
    description: Base URL for your GitLab instance (e.g. 'https://gitlab.com' or self-hosted 'https://gitlab.mycompany.com').

  - id: gitlab_project_path
    type: STRING
    displayName: GitLab Project Full Path
    defaults: "gitlab-org/gitlab"
    description: Full path of the target GitLab project (e.g. 'group/subgroup/project' or 'owner/repo').

  - id: max_duration_seconds
    type: INT
    displayName: Maximum Pipeline Duration SLA (Seconds)
    defaults: 1800
    description: Maximum permissible pipeline runtime in seconds (e.g. 1800 for 30 minutes) before flagging as degraded.

  - id: pipeline_batch_limit
    type: INT
    displayName: Pipeline Evaluation Limit
    defaults: 15
    description: Number of recent successful pipelines to inspect per run.

triggers:
  - id: hourly_pipeline_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Hourly inspection to detect pipeline duration regressions and runner bottlenecks. Shipped disabled by default.
    cron: "0 * * * *"
    disabled: true

tasks:
  - id: fetch_recent_pipelines
    type: io.kestra.plugin.graphql.Request
    description: Query GitLab GraphQL API for recent successful pipelines, duration times, and commit refs.
    uri: "{{ inputs.gitlab_host }}/api/graphql"
    headers:
      Authorization: "Bearer {{ secret('GITLAB_API_TOKEN') }}"
      Content-Type: "application/json"
      User-Agent: "Kestra-GitLab-Duration-Watchdog/1.0"
    failOnGraphQLErrors: false
    allowFailed: true
    query: |
      query {
        project(fullPath: "{{ inputs.gitlab_project_path }}") {
          pipelines(first: {{ inputs.pipeline_batch_limit }}, status: SUCCESS) {
            nodes {
              id
              iid
              duration
              ref
              createdAt
              commit {
                title
              }
            }
          }
        }
      }

  - id: evaluate_pipeline_duration
    type: io.kestra.plugin.core.flow.If
    description: Check whether any completed pipelines exceed the configured duration SLA.
    condition: "{{ outputs.fetch_recent_pipelines.body is defined and outputs.fetch_recent_pipelines.body.project is defined and outputs.fetch_recent_pipelines.body.project.pipelines is defined and (((outputs.fetch_recent_pipelines.body.project.pipelines.nodes | jq('[.[] | select(.duration != null and (.duration > ' + (inputs.max_duration_seconds | tostring) + '))] | length') | first) | int) > 0) }}"
    then:
      - id: alert_slow_pipelines
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch Slack alert to DevOps channel itemizing pipelines exceeding the runtime duration threshold.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "⏳ *GITLAB CI LATENCY ALERT: Pipeline Duration Budget Exceeded* ⏳\n\n*Project:* `{{ inputs.gitlab_project_path }}`\n*SLA Threshold:* > {{ inputs.max_duration_seconds }} seconds ({{ (inputs.max_duration_seconds / 60) | int }} mins)\n*Slow Pipelines Count:* {{ outputs.fetch_recent_pipelines.body.project.pipelines.nodes | jq('[.[] | select(.duration != null and (.duration > ' + (inputs.max_duration_seconds | tostring) + '))] | length') | first }}\n\n*Pipelines Breaching Duration Budget:*\n{{ outputs.fetch_recent_pipelines.body.project.pipelines.nodes | jq('[.[] | select(.duration != null and (.duration > ' + (inputs.max_duration_seconds | tostring) + ')) | \"• *Pipeline #\" + .iid + \"*: \" + ((.duration / 60) | int | tostring) + \" mins (\" + (.duration | tostring) + \"s) on ref `\" + .ref + \"` - Commit: *\" + .commit.title + \"*\"] | join(\"\\n\")') | first }}\n\n*Execution ID:* {{ execution.id }}\n*Action Required:* DevOps and QA leads please inspect slow test stages, Docker caching, or runner saturation."
          }
    else:
      - id: log_duration_healthy
        type: io.kestra.plugin.core.log.Log
        description: Log clean operational status when all evaluated pipelines finish within duration budget.
        message: "HEALTHY: All recent pipelines in {{ inputs.gitlab_project_path }} completed within {{ inputs.max_duration_seconds }} seconds."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Record final audit metrics for CI execution speed.
    message: "GitLab pipeline duration audit completed for {{ inputs.gitlab_project_path }}. Evaluated pipelines: {{ outputs.fetch_recent_pipelines.body is defined and outputs.fetch_recent_pipelines.body.project is defined and outputs.fetch_recent_pipelines.body.project.pipelines is defined ? (outputs.fetch_recent_pipelines.body.project.pipelines.nodes | length) : 0 }}. Slow pipelines count: {{ outputs.fetch_recent_pipelines.body is defined and outputs.fetch_recent_pipelines.body.project is defined and outputs.fetch_recent_pipelines.body.project.pipelines is defined ? (outputs.fetch_recent_pipelines.body.project.pipelines.nodes | jq('[.[] | select(.duration != null and (.duration > ' + (inputs.max_duration_seconds | tostring) + '))] | length') | first) : 0 }}."

errors:
  - id: alert_on_gitlab_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert DevOps channel if GitLab GraphQL API returns network or authorization errors.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *GitLab Pipeline Sentinel Error*: Execution `{{ execution.id }}` failed to query project `{{ inputs.gitlab_project_path }}`. Check GITLAB_API_TOKEN permissions."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.fetch_recent_pipelines.body is defined and outputs.fetch_recent_pipelines.body.project is defined and outputs.fetch_recent_pipelines.body.project.pipelines is defined and (((outputs.fetch_recent_pipelines.body.project.pipelines.nodes | jq('[.[] | select(.duration != null and (.duration > ' + (inputs.max_duration_seconds | tostring) + '))] | length') | first) | int) > 0) ? 'DURATION_BUDGET_EXCEEDED' : 'HEALTHY' }}"
  - id: slow_pipelines_count
    type: INT
    value: "{{ outputs.fetch_recent_pipelines.body is defined and outputs.fetch_recent_pipelines.body.project is defined and outputs.fetch_recent_pipelines.body.project.pipelines is defined ? ((outputs.fetch_recent_pipelines.body.project.pipelines.nodes | jq('[.[] | select(.duration != null and (.duration > ' + (inputs.max_duration_seconds | tostring) + '))] | length') | first) | int) : 0 }}"

extend:
  title: GitLab CI pipeline duration regression and execution latency watchdog
  metaTitle: GitLab Pipeline Duration Watchdog | Kestra
  shortDescription: Automated DevOps watchdog that queries GitLab GraphQL API for pipelines exceeding runtime duration budgets, alerting CI teams to test regressions.
  metaDescription: Audit GitLab CI pipelines via GraphQL API for execution duration regressions and alert DevOps teams in Slack to prevent slow builds and runner cost spikes.
  description: |
    Prevent CI/CD pipelines from silently ballooning in duration, slowing engineering feedback loops and inflating cloud runner infrastructure bills. In active software engineering teams, additions of un-cached Docker builds, un-parallelized end-to-end integration tests, or saturated shared runner pools often cause pipeline execution times to gradually double or triple without anyone noticing until sprint velocity grinds to a halt. This blueprint runs an hourly audit via the GitLab GraphQL API (`io.kestra.plugin.graphql.Request`), inspects duration timings across recent successful pipelines, and dispatches a Slack alert whenever a pipeline breaches your maximum runtime budget.

    ## How it works
    1. A `Schedule` trigger executes an hourly audit across recent pipelines (shipped disabled by default).
    2. Task `fetch_recent_pipelines` queries `{{ inputs.gitlab_host }}/api/graphql` using a project or personal token (`GITLAB_API_TOKEN`). The GraphQL query fetches recent successful pipelines with their unique `iid`, execution `duration` (in seconds), Git branch `ref`, creation timestamp, and commit title.
    3. Task `evaluate_pipeline_duration` (`io.kestra.plugin.core.flow.If`) applies a jq filter to count pipelines whose runtime exceeded `inputs.max_duration_seconds`:
       - If any slow pipelines are detected: Task `alert_slow_pipelines` delivers an itemized Slack alert displaying pipeline identifiers, duration in minutes, branch refs, and commit messages.
       - If all pipelines finished within budget: Task `log_duration_healthy` logs that performance is healthy.
    4. Task `log_audit_summary` records total evaluated and slow pipeline counts.
    5. Top-level `errors` handler catches network drops or authentication issues.

    ## What you get
    - Continuous automated detection of CI/CD build and test runtime regressions in GitLab.
    - Faster developer feedback cycles by maintaining tight build duration budgets.
    - Proactive visibility into runner saturation and test suite flakiness.
    - Reduced compute spend on GitLab Shared and self-hosted CI runners.

    ## Who it's for
    - DevOps and Platform Engineers managing GitLab CI/CD infrastructure.
    - Quality Assurance (QA) Leads overseeing automated end-to-end test execution.
    - Engineering Managers maintaining developer experience and PR turnaround velocity.

    ## Why orchestrate this with Kestra
    Tracking pipeline duration trends natively in GitLab requires manually navigating analytics dashboards. Kestra provides automated, scheduled orchestration that queries GitLab's GraphQL API directly, evaluates duration metrics mathematically with jq expressions, and delivers alerts to Slack channels with zero custom bot maintenance.

    ## Prerequisites
    - A GitLab project (on gitlab.com or self-hosted GitLab).
    - A GitLab Personal Access Token or Project Access Token with `read_api` scope.
    - A Slack Incoming Webhook URL.

    ### Secrets
    - `GITLAB_API_TOKEN`: GitLab access token passed in the `Authorization: Bearer` header.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to post duration alerts.

    ## Quick start
    1. Generate a GitLab Project Access Token under **Project Settings > Access Tokens** with `read_api` scope.
    2. Store `GITLAB_API_TOKEN` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    3. Set `gitlab_project_path` to your repository path (e.g. `gitlab-org/gitlab`) and configure `max_duration_seconds` (e.g. `1800`).
    4. Execute the flow manually in Kestra to confirm that pipelines and durations are fetched.
    5. Enable the `hourly_pipeline_sweep` schedule to activate hourly duration monitoring.

    ## How to extend
    - Compare average pipeline durations week-over-week to produce automated engineering productivity digests.
    - Automatically profile which individual pipeline stage (e.g. `test`, `build`, `deploy`) contributed the most time.
    - Push duration metrics to Datadog or Prometheus to graph pipeline latency histograms.

    ## Links
    - [GitLab GraphQL API: Pipeline](https://docs.gitlab.com/ee/api/graphql/reference/#pipeline)
    - [Kestra GraphQL Plugin](https://kestra.io/plugins/plugin-graphql)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - CI/CD & Deployment
    - Monitoring & Alerting
  ee: false
  demo: false
