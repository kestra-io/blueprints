id: healthlake-fhir-import-job-health-gate
namespace: company.team

description: |
  React the moment an AWS HealthLake FHIR import job reaches a terminal state, fetch its real
  status and error message, classify the run HEALTHY, DEGRADED, FAILED or PROBE_FAILED, alert
  Slack with the actual error text, and log a final audit summary either way.

inputs:
  - id: job_type_label
    type: SELECT
    displayName: Job type this flow monitors
    description: Label only, for the log and alert text. Must match the jobType configured on the healthlake_job_terminal trigger below (IMPORT or EXPORT), this input does not change the trigger itself.
    values:
      - "IMPORT"
      - "EXPORT"
    defaults: "IMPORT"

  - id: partial_success_is_critical
    type: BOOL
    displayName: Treat partial success as failure
    description: When true, a COMPLETED_WITH_ERRORS job is classified FAILED instead of DEGRADED. Use this for datastores where a partially-landed batch, for example a regulatory submission, is not an acceptable outcome.
    defaults: false

  - id: error_message_truncate_length
    type: INT
    displayName: Error message truncate length
    description: Maximum characters of the job's own error message included in the Slack alert, since a failed FHIR bundle validation can return a very long message.
    defaults: 300

triggers:
  - id: healthlake_job_terminal
    type: io.kestra.plugin.aws.healthlake.Trigger
    description: Shipped disabled. Polls the datastore every 2 minutes and fires once the most recently submitted import job reaches a terminal state.
    disabled: true
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    region: "{{ secret('AWS_DEFAULT_REGION') }}"
    datastoreId: "{{ secret('HEALTHLAKE_DATASTORE_ID') }}"
    jobType: IMPORT
    interval: PT2M

tasks:
  - id: probe_job_detail
    type: io.kestra.plugin.aws.healthlake.DescribeImportJob
    description: Read-only. The trigger already knows the job reached a terminal state, this fetches the job's own error message, which the trigger's output does not carry.
    allowFailure: true
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    region: "{{ secret('AWS_DEFAULT_REGION') }}"
    datastoreId: "{{ secret('HEALTHLAKE_DATASTORE_ID') }}"
    jobId: "{{ trigger.jobId }}"

  - id: classify_job_outcome
    type: io.kestra.plugin.core.debug.Return
    description: PROBE_FAILED when the probe produced no output at all, HEALTHY on COMPLETED, CANCELLED on CANCEL_COMPLETED, DEGRADED on COMPLETED_WITH_ERRORS unless partial_success_is_critical, FAILED otherwise (FAILED or CANCEL_FAILED).
    format: "{{ outputs.probe_job_detail is not defined ? 'PROBE_FAILED' : (outputs.probe_job_detail.jobStatus == 'COMPLETED' ? 'HEALTHY' : (outputs.probe_job_detail.jobStatus == 'CANCEL_COMPLETED' ? 'CANCELLED' : ((outputs.probe_job_detail.jobStatus == 'COMPLETED_WITH_ERRORS' and not inputs.partial_success_is_critical) ? 'DEGRADED' : 'FAILED'))) }}"

  - id: route_by_job_outcome
    type: io.kestra.plugin.core.flow.Switch
    description: Branch A logs a clean completion or a deliberate cancellation. Branch B alerts Slack with the job's own error message when it failed, partially failed, or the probe itself failed.
    value: "{{ outputs.classify_job_outcome.value }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "HealthLake {{ inputs.job_type_label }} job {{ trigger.jobId }} completed cleanly."
      "CANCELLED":
        - id: log_cancelled
          type: io.kestra.plugin.core.log.Log
          message: "HealthLake {{ inputs.job_type_label }} job {{ trigger.jobId }} was cancelled (CANCEL_COMPLETED)."
      "DEGRADED":
        - id: alert_degraded
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {{ {"text": "HealthLake " ~ inputs.job_type_label ~ " job " ~ trigger.jobId ~ " completed WITH ERRORS. Some FHIR resources in this batch did not land. Message: " ~ ((outputs.probe_job_detail.message ?? "no message returned") | jq('.[0:' ~ inputs.error_message_truncate_length ~ ']') | first) ~ "."} | toJson }}
      "FAILED":
        - id: alert_failed
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {{ {"text": "HealthLake " ~ inputs.job_type_label ~ " job " ~ trigger.jobId ~ " " ~ outputs.probe_job_detail.jobStatus ~ ". No data from this batch landed. Message: " ~ ((outputs.probe_job_detail.message ?? "no message returned") | jq('.[0:' ~ inputs.error_message_truncate_length ~ ']') | first) ~ "."} | toJson }}
      "PROBE_FAILED":
        - id: alert_probe_failed
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {{ {"text": "HealthLake job detail probe for job " ~ trigger.jobId ~ " did not return a result. The trigger reported jobStatus=" ~ trigger.jobStatus ~ " but DescribeImportJob could not confirm it. Check AWS credentials and HEALTHLAKE_DATASTORE_ID."} | toJson }}
    defaults:
      - id: log_unhandled_outcome
        type: io.kestra.plugin.core.log.Log
        message: "Unhandled HealthLake job outcome: {{ outputs.classify_job_outcome.value }}"

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Final audit log confirming the gate ran, regardless of the branch taken above.
    message: "HealthLake job health gate completed. job={{ trigger.jobId }} status={{ outputs.classify_job_outcome.value }} partial_success_is_critical={{ inputs.partial_success_is_critical }}"

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {{ {"text": "HealthLake FHIR import job health gate flow failed (execution " ~ execution.id ~ "). Check the execution logs."} | toJson }}

extend:
  title: HealthLake FHIR Import Job Health Gate
  shortDescription: React to AWS HealthLake import job completion events, classify the outcome HEALTHY, DEGRADED, FAILED or PROBE_FAILED from the job's real status and error message, and alert Slack the moment FHIR data fails to land.
  metaTitle: HealthLake FHIR Import Job Health Gate with Kestra
  metaDescription: React to AWS HealthLake import job completions, classify the real outcome, and alert Slack with the exact error message on failure.
  description: |
    A failed HealthLake FHIR import is not a pipeline inconvenience, it is patient data that
    never landed in the clinical record the rest of the system now assumes is complete.
    HealthLake reports exactly what happened to every batch, `jobStatus`, `message`, timing,
    but by default nothing reads that report after the import call returns. This blueprint
    reacts to the job itself finishing, fetches the exact outcome, and alerts Slack with the
    job's own error message, never a guess, the moment a batch fails or partially lands.

    ## How it works

    1. `healthlake_job_terminal` (`io.kestra.plugin.aws.healthlake.Trigger`) polls the
       datastore named by `HEALTHLAKE_DATASTORE_ID` every `interval` and starts this flow the
       moment the most recently submitted job of `jobType` reaches a terminal state
       (`COMPLETED`, `COMPLETED_WITH_ERRORS`, `FAILED`, `CANCEL_COMPLETED`, or `CANCEL_FAILED`).
       It exposes `trigger.jobId` and `trigger.jobStatus` to every task below, and persists the
       last job ID it fired on in the namespace KV store so a job already handled is never
       re-fired on the next poll.
    2. `probe_job_detail` (`io.kestra.plugin.aws.healthlake.DescribeImportJob`) re-fetches the
       same job by `trigger.jobId`, with `allowFailure: true` so an API hiccup does not stop
       the flow before it can be classified as `PROBE_FAILED` below. The trigger already knows
       the terminal `jobStatus`, this step exists specifically to get the job's own `message`
       field, the actual error text, which the trigger's output does not carry.
    3. `classify_job_outcome` (`io.kestra.plugin.core.debug.Return`) returns `PROBE_FAILED`
       when `probe_job_detail` produced no output at all (guarded with `is not defined`),
       `HEALTHY` on `COMPLETED`, `CANCELLED` on `CANCEL_COMPLETED`, `DEGRADED` on
       `COMPLETED_WITH_ERRORS` unless `partial_success_is_critical` is true, in which case it
       is `FAILED`, and `FAILED` for anything else (`FAILED` or `CANCEL_FAILED`).
    4. `route_by_job_outcome` (`io.kestra.plugin.core.flow.Switch`) branches on that status:
       - **HEALTHY**, **CANCELLED**: `log_healthy` / `log_cancelled` log it.
       - **DEGRADED**, **FAILED**, **PROBE_FAILED**: a `SlackIncomingWebhook` task alerts with
         the job's own truncated `message`, never an invented explanation.
    5. `log_audit_summary` always runs last and logs the final classification.
    6. The `errors` block posts to Slack if the flow itself fails outside the gate logic above.

    ## What you get

    - A real-time reaction to a FHIR import failing or partially landing, instead of finding
      out from a downstream clinical system querying incomplete data.
    - A Slack alert carrying the job's own error message, truncated to a readable length,
      never an invented explanation of what went wrong.
    - A policy choice, `partial_success_is_critical`, for datastores where "mostly landed" is
      not an acceptable outcome, versus ones where a small error rate is tolerated and logged
      as `DEGRADED` instead of paging anyone.
    - Automatic deduplication: the trigger's own KV-backed state means a terminal job fires
      this flow exactly once, not on every poll until a new job is submitted.

    ## Who it's for

    - Healthcare data engineering and integration teams operating AWS HealthLake as a FHIR
      datastore, who need to know the moment a bulk import fails or partially lands, not at
      the next manual check.
    - Compliance and data governance teams who need an audit trail proving every import batch
      was checked, with the real outcome and error text attached to each execution.
    - Teams evaluating the HealthLake plugin who want a working example of its dedicated
      polling `Trigger`, paired with `DescribeImportJob` for the detail the trigger itself
      does not carry.

    ## Why orchestrate this with Kestra

    HealthLake's own `StartFHIRImportJob` API returns once the job is submitted and has no
    concept of a callback, a policy on partial success, or an alert built from the real error
    text. Kestra adds the event-driven reaction via the plugin's own `Trigger`, the
    classification policy, the Slack alert carrying HealthLake's own message, and a full
    execution history of every import outcome, all as one declarative YAML file you can
    version and review like code.

    ## Prerequisites

    - An AWS HealthLake FHIR data store that receives bulk imports via `StartImportJob`
      (elsewhere in your pipeline) or the AWS console or CLI.
    - An AWS credential with `healthlake:DescribeFHIRImportJob` and
      `healthlake:ListFHIRImportJobs` permission.
    - A Slack incoming webhook for alerts.
    - HealthLake is a managed AWS service with no self-hostable open-source emulator, there is
      no local container to start for HealthLake itself. This plugin calls the AWS SDK
      directly from the Kestra worker process, there is no sub-container `taskRunner` and no
      Docker network to join.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, `AWS_DEFAULT_REGION`: credentials used by
      the trigger and `probe_job_detail`.
    - `HEALTHLAKE_DATASTORE_ID`: the FHIR data store this flow monitors.
    - `SLACK_WEBHOOK`: Slack incoming webhook URL used by the alert tasks and the `errors`
      block.

      In Kestra OSS, set all five as base64-encoded environment variables:
      `SECRET_AWS_ACCESS_KEY_ID`, `SECRET_AWS_SECRET_ACCESS_KEY`, `SECRET_AWS_DEFAULT_REGION`,
      `SECRET_HEALTHLAKE_DATASTORE_ID`, `SECRET_SLACK_WEBHOOK`.

    ### Inputs

    Unlike a Schedule-triggered flow, the job identity and datastore here come from the
    trigger's own configuration and output (`trigger.jobId`, `trigger.jobStatus`), not from
    flow inputs, that is how every Kestra trigger works. The inputs below only tune the
    classification and alert text.

    | Input | Type | Default | Allowed values |
    |---|---|---|---|
    | `job_type_label` | SELECT | `IMPORT` | `IMPORT`, `EXPORT` |
    | `partial_success_is_critical` | BOOL | `false` | `true`, `false` |
    | `error_message_truncate_length` | INT | `300` | any non-negative integer |

    ### Outputs

    - `{{ trigger.jobId }}`: ID of the HealthLake import or export job that fired the trigger.
    - `{{ trigger.jobStatus }}`: Terminal job status detected by the polling trigger (`COMPLETED`, `COMPLETED_WITH_ERRORS`, `FAILED`, `CANCEL_COMPLETED`, or `CANCEL_FAILED`).
    - `{{ outputs.probe_job_detail.jobStatus }}`: Confirmed job status returned by `DescribeImportJob`.
    - `{{ outputs.probe_job_detail.message }}`: Service error or diagnostic message attached to the job.
    - `{{ outputs.classify_job_outcome.value }}`: Outcome classification evaluated by the gate (`HEALTHY`, `CANCELLED`, `DEGRADED`, `FAILED`, or `PROBE_FAILED`).

    ## Quick start

    1. Add the AWS, `HEALTHLAKE_DATASTORE_ID`, and `SLACK_WEBHOOK` secrets.
    2. Submit a test import with `StartImportJob` against a non-production datastore.
    3. Enable the `healthlake_job_terminal` trigger and confirm the execution fires once the
       test job reaches a terminal state, with the right classification in
       `log_audit_summary`.
    4. Set `partial_success_is_critical` to `true` on datastores where a partially-landed
       batch must always page someone.

    ## How to extend

    - Add `io.kestra.plugin.aws.healthlake.DescribeDatastore` as a second probe to also check
      the datastore's own `datastoreStatus` is `ACTIVE`, catching the rarer case where the
      datastore itself is degraded independently of any one job.
    - Duplicate the trigger with `jobType: EXPORT` and `job_type_label: "EXPORT"` as a second
      flow to monitor export jobs the same way, since one trigger only watches one job type.
    - Push `trigger.jobId` and the classification into a Kestra KV entry keyed by date, to
      build a rolling import success-rate report instead of only per-job alerts.

    ## Pitfalls

    - The trigger's own Javadoc is explicit that `listFhirImportJobs` with `maxResults(1)`
      returns the most recently submitted job but does not guarantee strict submit-time
      ordering. If two imports are submitted in quick succession, confirm which one actually
      fired by checking `trigger.jobId` against your own records, do not assume it is always
      the very last one you submitted.
    - One `Trigger` instance watches one `jobType` (`IMPORT` or `EXPORT`) and one datastore.
      Monitoring both job types, or more than one datastore, needs a separate trigger and flow
      per combination, not one flow with an input switch.
    - The trigger deduplicates by job ID in namespace KV, if you delete or rename the KV entry
      manually, the next poll can re-fire on a job this flow already alerted on.
    - `message` can be empty on some terminal states, this blueprint falls back to "no message
      returned" rather than rendering a blank alert.

    ## Links

    - [AWS plugin documentation](https://kestra.io/plugins/plugin-aws)
    - [AWS HealthLake FHIR bulk import and export](https://docs.aws.amazon.com/healthlake/latest/devguide/import-export-datastore.html)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Policy & Compliance
  ee: false
  demo: false
