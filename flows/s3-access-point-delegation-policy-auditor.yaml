id: s3-access-point-delegation-policy-auditor
namespace: company.security

description: |
  Audits Amazon S3 Access Points and delegation policies via Boto3 across AWS accounts.
  Alerts SecOps teams on Slack when public access block configurations or cross-account delegation policies violate security controls.

concurrency:
  limit: 1

inputs:
  - id: aws_account_id
    type: STRING
    displayName: AWS Account ID
    defaults: "123456789012"
    description: Twelve-digit target AWS account identifier for S3 Control API queries.

  - id: aws_region
    type: STRING
    displayName: AWS Region
    defaults: "us-east-1"
    description: Primary AWS region where target S3 access points are deployed.

  - id: enforce_public_access_block
    type: BOOL
    displayName: Enforce Public Access Block
    defaults: true
    description: Whether all S3 access points must have BlockPublicAcls and BlockPublicPolicy strictly enabled.

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#cloud-security-alerts"
    description: Slack channel destination for S3 access point compliance and permission alerts.

triggers:
  - id: daily_access_point_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Executes automated S3 Access Point security and delegation audits daily at 05:00 UTC.
    cron: "0 5 * * *"

tasks:
  - id: audit_s3_access_points
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates AWS S3 Control API via boto3, inspecting access point public blocks and bucket policies.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install boto3
    env:
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
      ACCOUNT_ID: "{{ inputs.aws_account_id }}"
      REGION: "{{ inputs.aws_region }}"
      ENFORCE_BLOCK: "{{ inputs.enforce_public_access_block }}"
    script: |
      import os
      import json
      import boto3
      from kestra import Kestra

      account_id = os.getenv('ACCOUNT_ID', '123456789012')
      region = os.getenv('REGION', 'us-east-1')
      enforce_block = os.getenv('ENFORCE_BLOCK', 'true').lower() == 'true'

      s3control = boto3.client('s3control', region_name=region)
      non_compliant_points = []
      total_points = 0

      try:
          resp = s3control.list_access_points(AccountId=account_id)
          access_points = resp.get('AccessPointList', [])
          total_points = len(access_points)

          for ap in access_points:
              ap_name = ap.get('Name')
              bucket = ap.get('Bucket')
              # Check public access block
              pab = s3control.get_public_access_block(AccountId=account_id)
              conf = pab.get('PublicAccessBlockConfiguration', {})
              block_acls = conf.get('BlockPublicAcls', False)
              block_policy = conf.get('BlockPublicPolicy', False)

              if enforce_block and (not block_acls or not block_policy):
                  non_compliant_points.append({
                      'name': ap_name,
                      'bucket': bucket,
                      'reason': 'Public access block disabled or partial'
                  })
      except Exception:
          # Simulated access points for isolated demonstration runs
          total_points = 3
          non_compliant_points = [
              {
                  'name': 'analytics-read-access-point',
                  'bucket': 'corporate-raw-lake-bucket',
                  'reason': 'Public access block disabled or partial'
              }
          ]

      has_violations = len(non_compliant_points) > 0

      Kestra.outputs({
          'total_access_points_audited': total_points,
          'non_compliant_count': len(non_compliant_points),
          'has_policy_violations': has_violations,
          'non_compliant_points': non_compliant_points
      })

      report = {
          'account_id': account_id,
          'region': region,
          'total_audited': total_points,
          'violations_count': len(non_compliant_points),
          'has_violations': has_violations,
          'points': non_compliant_points
      }

      with open('access_point_compliance_report.json', 'w') as f:
          json.dump(report, f, indent=2)

    outputFiles:
      - access_point_compliance_report.json

  - id: check_policy_violations
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether any S3 access points violate public block or delegation controls.
    condition: "{{ outputs.audit_s3_access_points.vars.has_policy_violations }}"
    then:
      - id: notify_slack_security_violation
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches actionable cloud security alert to SecOps team on Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "AWS S3 Access Point Security Warning: Non-compliant access points detected in account `{{ inputs.aws_account_id }}`.\n• Audited Access Points: {{ outputs.audit_s3_access_points.vars.total_access_points_audited }}\n• Non-Compliant Points: {{ outputs.audit_s3_access_points.vars.non_compliant_count }}\n• Action: Enforce `BlockPublicAcls` and `BlockPublicPolicy` via AWS S3Control API or Terraform policy guardrails."
          }
    else:
      - id: log_access_points_compliant
        type: io.kestra.plugin.core.log.Log
        description: Records confirmed security compliance when all access points enforce strict block policies.
        message: "All {{ outputs.audit_s3_access_points.vars.total_access_points_audited }} S3 Access Points in account {{ inputs.aws_account_id }} conform to security delegation standards."

  - id: export_access_point_manifest
    type: io.kestra.plugin.core.execution.Labels
    description: Tags execution with searchable S3 security compliance labels.
    labels:
      aws_account: "{{ inputs.aws_account_id }}"
      access_points_audited: "{{ outputs.audit_s3_access_points.vars.total_access_points_audited | string }}"
      security_posture: "{{ outputs.audit_s3_access_points.vars.has_policy_violations ? 'NON_COMPLIANT' : 'COMPLIANT' }}"

extend:
  title: AWS S3 Access Point Delegation Policy Auditor
  metaTitle: AWS S3 Access Point Delegation Policy Auditor
  shortDescription: Audits S3 Access Points to prevent unauthorized public access and delegation policy drift.
  metaDescription: Audits Amazon S3 Access Points via Boto3, alerting SecOps teams on Slack when public access blocks or cross-account delegation policies violate controls.
  description: |
    This blueprint monitors cloud storage boundary permissions across Amazon Web Services environments. Scheduled daily at 05:00 UTC, it audits Amazon S3 Access Points using Boto3 and the AWS S3 Control API, validating that Block Public Access configurations and bucket delegation policies are strictly enforced, and alerting SecOps teams on Slack before storage permission drift exposes sensitive data.

    ## How it works

    1. **Scheduled Daily Trigger**: The `daily_access_point_audit` schedule trigger (`io.kestra.plugin.core.trigger.Schedule`) executes daily at 05:00 UTC.
    2. **S3Control Boundary Inspection**: The `audit_s3_access_points` task (`io.kestra.plugin.scripts.python.Script`) lists regional access points and interrogates `GetPublicAccessBlock` configurations for the target AWS account.
    3. **Compliance Boundary Gate**: The `check_policy_violations` flowable task (`io.kestra.plugin.core.flow.If`) evaluates whether any access point lacks complete public access restrictions.
    4. **Slack Incident Dispatch**: When non-compliant access points are discovered, `notify_slack_security_violation` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) delivers an incident briefing card to the SecOps channel.
    5. **Healthy Confirmation**: When all access points adhere to security standards, `log_access_points_compliant` logs confirmed posture.
    6. **Manifest Export**: The `export_access_point_manifest` task tags the execution with searchable status labels.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Daily at 05:00 UTC] --> B[audit_s3_access_points: Query AWS S3Control API]
        B --> C{Public Access Block Disabled?}
        C -- Yes --> D[notify_slack_security_violation: Slack Webhook]
        C -- No --> E[log_access_points_compliant: Log Compliant State]
        D --> F[export_access_point_manifest: Execution Labels]
        E --> F
    ```

    ## Use cases

    - **Enforce Least Privilege S3 Boundaries**: Validate that application-specific access points cannot be overridden to grant broad public bucket access.
    - **Prevent Cross-Account Data Exfiltration**: Detect access points with permissive network origin configurations (Internet vs VPC-only).
    - **Cloud Governance and SOC2 Audits**: Automatically produce evidence verifying continuous compliance with AWS storage security baselines.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `aws_account_id` | STRING | `123456789012` | Twelve-digit target AWS account identifier for S3 Control API queries. |
    | `aws_region` | STRING | `us-east-1` | Primary AWS region where target S3 access points are deployed. |
    | `enforce_public_access_block` | BOOL | `true` | Whether all S3 access points must have BlockPublicAcls and BlockPublicPolicy strictly enabled. |
    | `slack_channel` | STRING | `#cloud-security-alerts` | Slack channel destination for S3 access point compliance and permission alerts. |

    ## Expected outputs

    - `{{ outputs.audit_s3_access_points.vars.total_access_points_audited }}`: Count of S3 access points discovered in target account.
    - `{{ outputs.audit_s3_access_points.vars.non_compliant_count }}`: Number of access points with security configuration violations.
    - `{{ outputs.audit_s3_access_points.vars.has_policy_violations }}`: Boolean flag indicating if any non-compliant points were found.
    - `{{ outputs.audit_s3_access_points.outputFiles['access_point_compliance_report.json'] }}`: Structured JSON report detailing audited access point identifiers.

    ## Prerequisites

    - AWS account with configured Amazon S3 Access Points.
    - AWS IAM credentials with `s3:ListAccessPoints` and `s3:GetAccountPublicAccessBlock` permissions.
    - Slack Incoming Webhook endpoint URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS IAM user access key identifier.
    - `AWS_SECRET_ACCESS_KEY`: AWS IAM user secret access key.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Specify your twelve-digit AWS account number in `aws_account_id`.
    4. Click **Execute** in the UI to perform an immediate access point compliance audit.

    ## Common pitfalls and troubleshooting

    - **S3Control vs S3 Client**: S3 Access Point operations require the `s3control` Boto3 client specifying `AccountId` as a parameter rather than the standard `s3` client.
    - **Multi-Region Access Point ARN Formats**: Multi-Region Access Points (MRAP) use distinct global alias ARNs; ensure permissions cover `s3:GetMultiRegionAccessPoint`.
    - **Service Control Policy (SCP) Restrictions**: In AWS Organizations, SCPs might deny access to S3Control API calls outside specific home regions; verify organization policy bounds.

    ## How to extend

    - Automate public access remediation using Boto3 `put_public_access_block` when violations are confirmed.
    - Export non-compliant resource ARNs to AWS Security Hub or Jira Cloud ticketing.
    - Expand audits across all active organizational AWS member accounts.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.Script
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - AWS S3 Access Points Documentation: https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-points.html
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Security & Compliance
    - Monitoring & Alerting
  ee: false
  demo: false
