id: stripe-dispute-deadline-sentinel
namespace: company.team
description: |
  Every few hours, read recent disputes from the Stripe API (read-only: no
  evidence is submitted and no dispute is closed) and classify them as
  HEALTHY, WARNING, CRITICAL or UNREACHABLE. Log quiet runs and alert
  Slack when a chargeback or inquiry needs a response, and page when the
  evidence deadline is close or has passed, so a dispute is never lost by
  default.

inputs:
  - id: urgent_hours
    type: INT
    defaults: 72
    displayName: "Urgent Window (hours)"
    description: "A dispute needing a response with its evidence deadline inside this many hours is classified CRITICAL."

triggers:
  - id: dispute_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check disputes every 6 hours. Shipped disabled; enable it once the Stripe secret is set and a manual run has been verified.
    cron: "10 */6 * * *"
    disabled: true

tasks:
  - id: list_disputes
    type: io.kestra.plugin.core.http.Request
    description: Read the 100 most recent disputes from the Stripe Disputes API with a restricted read-only key. This is a GET; no evidence is submitted and no dispute is closed.
    uri: "https://api.stripe.com/v1/disputes?limit=100"
    method: GET
    options:
      auth:
        type: BASIC
        username: "{{ secret('STRIPE_RESTRICTED_KEY') }}"
        password: ""
      allowFailed: true
      timeout:
        connectTimeout: PT10S
        readIdleTimeout: PT30S
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3
    allowFailure: true

  - id: summarize_disputes
    type: io.kestra.plugin.core.debug.Return
    description: Keep disputes that still need a response (needs_response and warning_needs_response), count those with a deadline inside the urgent window or already past due, add up the amount at stake per currency, name the most urgent one, and classify in one jq query. A missing or non-200 response becomes UNREACHABLE.
    format: >-
      {{ (outputs.list_disputes.code is not defined or outputs.list_disputes.code != 200)
      ? '{"status":"UNREACHABLE","needs_response":0,"urgent":0,"past_due":0,"at_stake":"none","most_urgent":"none"}'
      : (fromJson(outputs.list_disputes.body) | jq('
      [.data[] | select(.status == "needs_response" or .status == "warning_needs_response")] as $n
      | [$n[] | select(.evidence_details.past_due == true)] as $pd
      | [$n[] | select(.evidence_details.due_by != null and .evidence_details.due_by <= ' ~ (now() | dateAdd(inputs.urgent_hours, 'HOURS') | timestamp) ~ ')] as $u
      | {needs_response: ($n | length), urgent: ($u | length), past_due: ($pd | length),
      at_stake: (if ($n | length) == 0 then "none" else ($n | group_by(.currency) | map(((([.[].amount] | add) / 100) | tostring) + " " + .[0].currency) | join(", ")) end),
      most_urgent: (if ($n | length) == 0 then "none" else ($n | sort_by(.evidence_details.due_by) | first | (.id + " (" + .reason + ", " + ((.amount / 100) | tostring) + " " + .currency + ")")) end),
      status: (if ($pd | length) > 0 or ($u | length) > 0 then "CRITICAL" elif ($n | length) > 0 then "WARNING" else "HEALTHY" end)}
      ') | first | toJson) }}

  - id: route_by_dispute_state
    type: io.kestra.plugin.core.flow.Switch
    description: Route to a quiet log when no dispute needs a response, a Slack message when one does, or a Slack page when a deadline is inside the urgent window, already past, or Stripe could not be read.
    value: "{{ fromJson(outputs.summarize_disputes.value).status }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "Stripe disputes healthy: no dispute among the 100 most recent needs a response."
      "WARNING":
        - id: alert_warning_disputes
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Post a Slack message when disputes need a response but none is inside the urgent window.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Stripe disputes WARNING: {{ fromJson(outputs.summarize_disputes.value).needs_response }} dispute(s) need a response, at stake {{ fromJson(outputs.summarize_disputes.value).at_stake }}. Next due: {{ fromJson(outputs.summarize_disputes.value).most_urgent }}. Gather evidence in the Stripe Dashboard. Execution {{ execution.id }}."
            }
      "CRITICAL":
        - id: alert_critical_disputes
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when a dispute's evidence deadline is inside the urgent window or has passed; with no response the dispute is lost.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Stripe disputes CRITICAL: {{ fromJson(outputs.summarize_disputes.value).urgent }} dispute(s) due within {{ inputs.urgent_hours }} hours and {{ fromJson(outputs.summarize_disputes.value).past_due }} past due, at stake {{ fromJson(outputs.summarize_disputes.value).at_stake }}. Most urgent: {{ fromJson(outputs.summarize_disputes.value).most_urgent }}. Submit evidence now or the dispute is lost. Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable_api
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when the Disputes API could not be read, indicating an outage or a key without Disputes read permission.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Stripe dispute sentinel UNREACHABLE: the Disputes API did not return a usable response (HTTP {{ outputs.list_disputes.code ?? 'no response' }}). Check the restricted key and its Disputes read permission. Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        message: "Stripe dispute sentinel completed with an unexpected classification: {{ outputs.summarize_disputes.value }}."

  - id: log_audit_result
    type: io.kestra.plugin.core.log.Log
    description: Record one audit line for every run, whichever branch fired, so dispute history stays queryable even if Slack delivery fails.
    message: "Stripe dispute sentinel audit: http={{ outputs.list_disputes.code ?? 'n/a' }} summary={{ outputs.summarize_disputes.value }} execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack when the sentinel flow itself fails, so a broken check is never mistaken for no open disputes.
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "Stripe dispute sentinel flow {{ flow.id }} FAILED (execution {{ execution.id }}). Open disputes and their deadlines are now unknown; check the task logs and the Stripe Dashboard."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ fromJson(outputs.summarize_disputes.value).status }}"

extend:
  title: "Stripe Dispute Deadline Sentinel"
  shortDescription: Read recent Stripe disputes on a schedule and alert Slack when a chargeback needs a response, paging when its evidence deadline is near.
  metaTitle: Stripe Dispute Deadline Sentinel for Kestra
  metaDescription: "Read Stripe disputes every 6 hours, change nothing, and alert Slack when a chargeback needs evidence, paging when the deadline is close."
  description: |
    When a customer disputes a card payment, Stripe gives the business a fixed window to submit evidence, shown as `evidence_details.due_by`. If nobody responds in time, the dispute is lost by default, along with the amount and a dispute fee. Stripe emails the account owner, which is easy to miss in a busy inbox. This blueprint turns a scheduled, read-only call to the Stripe Disputes API into a deadline gate: `io.kestra.plugin.core.http.Request` reads recent disputes, one jq query finds the ones that still need a response and how close their deadlines are, and the result routes to a quiet log, a Slack note, or a Slack page.

    ## How it works

    1. `list_disputes` (`io.kestra.plugin.core.http.Request`) calls `GET /v1/disputes?limit=100` with HTTP basic auth, the restricted key as the username and an empty password, as Stripe documents. It is a read: no evidence is submitted and no dispute is closed. Retries cover short network blips, and `allowFailed` plus `allowFailure` keep an API error from aborting the flow so it can be reported instead.
    2. `summarize_disputes` (`io.kestra.plugin.core.debug.Return`) first guards for a missing or non-200 response (`UNREACHABLE`). Otherwise one jq query keeps disputes in `needs_response` or `warning_needs_response` (an inquiry), counts those with `evidence_details.due_by` inside `urgent_hours` and those already `past_due`, adds up the amount at stake per currency, and names the dispute due first with its reason and amount. Any urgent or past-due dispute is `CRITICAL`, any other dispute needing a response is `WARNING`, otherwise `HEALTHY`.
    3. `route_by_dispute_state` (`io.kestra.plugin.core.flow.Switch`) branches on that classification: `HEALTHY` logs quietly, `WARNING` posts a Slack note, `CRITICAL` and `UNREACHABLE` page Slack. A `defaults` fallback logs anything unexpected.
    4. `log_audit_result` (`io.kestra.plugin.core.log.Log`) writes one audit line per run with the HTTP status and the full summary.
    5. The flow-level `errors` block pages Slack if the flow itself fails, and the `dispute_check` trigger runs every 6 hours, shipped `disabled: true`.

    ## What you get

    - A read-only dispute deadline check with no custom scripting and no extra plugin to install.
    - A `status` output (`HEALTHY` / `WARNING` / `CRITICAL` / `UNREACHABLE`) other flows can gate on.
    - Slack messages with the amount at stake per currency and the dispute due first, with its reason, so the right person can gather evidence.
    - An audit line on every run, separate from Slack.

    ## Who it's for

    - Online businesses and SaaS companies taking card payments through Stripe.
    - Finance and support teams who own chargebacks and cannot afford to miss a deadline.
    - Teams that already run their payment data and alerting in Kestra.

    ## Why orchestrate this with Kestra

    Stripe's dispute emails go to one inbox and its Dashboard shows deadlines only when someone opens it. Kestra turns a plain, read-only API call into a scheduled, typed classification with retries, a failure path and an execution history, and the Switch branch is ready to grow into real actions (opening a ticket with the order details, collecting shipping proof from your own systems) without rewriting the check.

    ## Prerequisites

    - A Stripe account. Test mode is free and uses the same API.
    - A restricted API key with Read access to Disputes only (Developers > API keys > Create restricted key).
    - A Slack incoming webhook for the WARNING, CRITICAL, UNREACHABLE and flow-failure alerts.

    ### Secrets

    - `STRIPE_RESTRICTED_KEY`: a restricted key (`rk_test_...` or `rk_live_...`) with Disputes read access.
    - `SLACK_WEBHOOK`: Slack incoming webhook used for every alert branch and the flow-failure alert.

    In Kestra OSS, secrets are supplied as environment variables prefixed `SECRET_` and base64-encoded, for example `SECRET_STRIPE_RESTRICTED_KEY=$(echo -n 'rk_test_xxxxxxxx' | base64)`, and read back with `{{ secret('STRIPE_RESTRICTED_KEY') }}`. Use the Enterprise secrets backend for encryption at rest and access control.

    ## Quick start

    1. In Stripe test mode, create a restricted key with Disputes read access.
    2. Create a test dispute by paying with Stripe's dispute test card (`4000 0000 0000 0259`).
    3. Add `STRIPE_RESTRICTED_KEY` and `SLACK_WEBHOOK` as secrets and run the flow manually: `status` should be `CRITICAL` or `WARNING` depending on the test dispute's deadline.
    4. Switch to a live restricted key and enable `dispute_check`.

    ## How to extend

    - Page with `starting_after` if you can have more than 100 recent disputes.
    - For each urgent dispute, fetch the order and shipping proof from your own database and attach it to a ticket.
    - Add `warning_under_review` and `under_review` counts to report what is waiting on the card network.
    - Store the last status in a KV store and alert only when a new dispute appears.

    ## Inputs

    - `urgent_hours`: type INT, default `72`.

    ## Outputs

    - `status`: one of `HEALTHY`, `WARNING`, `CRITICAL`, `UNREACHABLE`.
    - Example path: `{{ fromJson(outputs.summarize_disputes.value).most_urgent }}` for the dispute due first.

    ## Links

    - [Stripe API: list all disputes](https://docs.stripe.com/api/disputes/list)
    - [Stripe: responding to disputes](https://docs.stripe.com/disputes/responding)
    - [Kestra HTTP Request task](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)

    ## Pitfalls

    - Only the 100 most recent disputes are read; a high-volume account needs paging with `starting_after`.
    - Amounts are divided by 100, which is correct for most currencies; zero-decimal currencies such as JPY are shown 100 times too small.
    - Use a restricted key with Disputes read access, not the full secret key, so the flow cannot change anything even if the key leaks.
    - This flow only reads; it never submits evidence, accepts or closes a dispute.
  tags:
    - Business
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
