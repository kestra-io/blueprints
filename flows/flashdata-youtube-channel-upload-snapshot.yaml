id: flashdata-youtube-channel-upload-snapshot
namespace: company.research
inputs:
- id: handle
  type: STRING
  defaults: '@GoogleDevelopers'
  description: Channel handle, with or without @; not a URL.
- id: video_limit
  type: INT
  defaults: 5
  description: Recent upload window size, 1–100.
- id: previous_snapshot
  type: FILE
  required: false
  description: Optional snapshot.json from this flow with identical inputs; at most 1 MiB.
triggers:
- id: weekly_research
  type: io.kestra.plugin.core.trigger.Schedule
  cron: 0 9 * * 1
  timezone: UTC
  recoverMissedSchedules: NONE
  disabled: true
tasks:
- id: prepare_request
  type: io.kestra.plugin.scripts.python.Script
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  containerImage: python:3.13.15-slim
  outputFiles:
  - request.json
  - context.json
  - previous.json
  script: |
    SOURCE = 'youtube_channel'
    import base64
    import json
    import os
    import re
    from pathlib import Path
    inputs = json.loads(base64.b64decode(os.environ["INPUTS_B64"]))
    def word(name, maximum=2000):
        raw = inputs[name]
        if not isinstance(raw, str) or not 1 <= len(raw.strip()) <= maximum or "\x00" in raw:
            raise ValueError(name + " must be nonempty text within the documented limit")
        return raw.strip()
    def integer(name, low, high):
        value = inputs[name]
        if type(value) is not int or not low <= value <= high:
            raise ValueError(name + " is outside its integer range")
        return value
    def choice(name, allowed):
        value = word(name, 30)
        if value not in allowed: raise ValueError("Invalid " + name)
        return value
    def language():
        value=word("language",35)
        if not re.fullmatch(r"[A-Za-z0-9-]+",value): raise ValueError("Invalid language")
        return value
    request = {"source": SOURCE, "params": {}}
    context = {}
    handle=word("handle",100)
    if not handle.startswith("@"): handle="@"+handle
    if len(handle)<2 or any(c.isspace() or c in "/:?#" for c in handle): raise ValueError("Use a channel handle, not a URL")
    request["handle"]=handle
    request["params"]={"video_limit":integer("video_limit",1,100)}
    raw=Path("previous_input.json").read_bytes()
    if len(raw)>1024*1024: raise ValueError("Prior snapshot exceeds 1 MiB")
    previous=json.loads(raw)
    if previous != {}:
        if not isinstance(previous,dict) or previous.get("format")!=SOURCE+"-v1" or previous.get("request")!=request or not isinstance(previous.get("records"),list):
            raise ValueError("Prior snapshot must come from this flow with exactly matching inputs")
        identity="videoId" if SOURCE=="youtube_channel" else "phrase"
        if any(not isinstance(r,dict) or not isinstance(r.get(identity),str) for r in previous["records"]): raise ValueError("Invalid prior record")
        if identity=="videoId" and (not isinstance(previous.get("channelId"),str) or not previous["channelId"]): raise ValueError("Missing prior channel identity")
        if identity=="videoId" and any(not re.fullmatch(r"[A-Za-z0-9_-]{11}",r[identity]) for r in previous["records"]): raise ValueError("Invalid prior video ID")
    Path("previous.json").write_text(json.dumps(previous,ensure_ascii=False),encoding="utf-8")
    context["has_baseline"]=previous!={}
    Path("request.json").write_text(json.dumps(request,ensure_ascii=False,indent=2),encoding="utf-8")
    Path("context.json").write_text(json.dumps(context),encoding="utf-8")
  env:
    INPUTS_B64: '{{ {''handle'': inputs.handle, ''video_limit'': inputs.video_limit} | toJson | base64encode }}'
  inputFiles:
    previous_input.json: '{{ inputs.previous_snapshot ?? ''{}'' }}'
- id: search_once
  type: io.kestra.plugin.scripts.python.Script
  description: Submit one paid realtime query. No redirects, pagination or automatic retries.
  timeout: PT3M
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  containerImage: python:3.13.15-slim
  env:
    FLASHDATA_API_KEY: '{{ secret(''FLASHDATA_API_KEY'') }}'
  inputFiles:
    request.json: '{{ outputs.prepare_request.outputFiles[''request.json''] }}'
  outputFiles:
  - response.json
  - transport.json
  script: |
    import http.client
    import json
    import os
    import uuid
    from datetime import datetime, timezone
    from pathlib import Path

    key = os.environ["FLASHDATA_API_KEY"]
    if not key or len(key) > 512 or any(ord(c) < 33 or ord(c) > 126 for c in key):
        raise SystemExit("Set a valid FLASHDATA_API_KEY secret before running")
    request_id = "req_" + str(uuid.uuid4())
    print("::" + json.dumps({"outputs": {"request_id": request_id}}, separators=(",", ":")) + "::", flush=True)
    connection = http.client.HTTPSConnection("data.flashdata.dev", timeout=65)
    try:
        connection.request("POST", "/v1/queries/realtime", body=Path("request.json").read_bytes(),
                           headers={"X-API-Key": key, "X-Request-Id": request_id,
                                    "Content-Type": "application/json", "Accept": "application/json"})
        response = connection.getresponse()
        raw = response.read(4 * 1024 * 1024 + 1)
        status = response.status
    except (OSError, http.client.HTTPException):
        raise SystemExit("Query outcome unknown. It may have been charged. Check FlashData Jobs/logs using "
                         + request_id + " before submitting again; no retry was made.") from None
    finally:
        connection.close()
    if len(raw) > 4 * 1024 * 1024:
        raise SystemExit("Response exceeds 4 MiB. Check FlashData logs before another paid query: " + request_id)
    if status != 200:
        raise SystemExit("FlashData returned HTTP " + str(status) + ". No redirect or retry was made. "
                         "Check account access, balance and logs before resubmitting: " + request_id)
    Path("response.json").write_bytes(raw)
    transport = {"request_id": request_id, "http_status": status,
                 "retrieved_at": datetime.now(timezone.utc).isoformat(), "response_bytes": len(raw)}
    Path("transport.json").write_text(json.dumps(transport, indent=2), encoding="utf-8")
- id: build_artifacts
  type: io.kestra.plugin.scripts.python.Script
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  containerImage: python:3.13.15-slim
  inputFiles:
    request.json: '{{ outputs.prepare_request.outputFiles[''request.json''] }}'
    response.json: '{{ outputs.search_once.outputFiles[''response.json''] }}'
    transport.json: '{{ outputs.search_once.outputFiles[''transport.json''] }}'
    context.json: '{{ outputs.prepare_request.outputFiles[''context.json''] }}'
    previous.json: '{{ outputs.prepare_request.outputFiles[''previous.json''] }}'
  outputFiles:
  - manifest.json
  - report.md
  - snapshot.json
  - videos.csv
  - changes.json
  script: |
    import json
    from pathlib import Path
    from urllib.parse import urlsplit
    import csv
    import html
    from urllib.parse import quote

    def safe_url(value):
        if not isinstance(value, str) or any(ord(c) <= 32 or ord(c) == 127 for c in value):
            return False
        try:
            u = urlsplit(value)
            u.port  # Validate an explicitly supplied port before emitting the URL.
            return bool(u.scheme in ("http", "https") and u.hostname and not u.username and not u.password)
        except ValueError:
            return False

    def string(value):
        return value if isinstance(value, str) and value.strip() else None

    def save(name, value):
        Path(name).write_text(json.dumps(value, ensure_ascii=False, indent=2), encoding="utf-8")

    def jsonl(name, rows):
        Path(name).write_text("".join(json.dumps(r, ensure_ascii=False) + "\n" for r in rows), encoding="utf-8")

    def csv_file(name, fields, rows):
        def cell(v):
            value = "" if v is None else str(v)
            # JSON retains original values; CSV cells are safe to open in a spreadsheet.
            return "'" + value if value.lstrip().startswith(("=", "+", "-", "@")) or value.startswith(("\t", "\r", "\n")) else value
        with Path(name).open("w", encoding="utf-8", newline="") as stream:
            writer = csv.DictWriter(stream, fieldnames=fields)
            writer.writeheader()
            writer.writerows({f: cell(row.get(f)) for f in fields} for row in rows)

    def outputs(**values):
        print("::" + json.dumps({"outputs": values}, separators=(",", ":")) + "::")

    def text(value):
        value = "Not supplied" if value is None else str(value)
        value = " ".join(value.split())
        for ch in "\\`*_{}[]()#+-.!|":
            value = value.replace(ch, "\\" + ch)
        return html.escape(value, quote=False)

    def link(value):
        return quote(value, safe="/:?#@!$&'*+,;=%~-._")

    import math
    import re
    def number(value):
        return type(value) in (int,float) and math.isfinite(value)
    def video_url(value):
        return "https://www.youtube.com/watch?v="+value if isinstance(value,str) and re.fullmatch(r"[A-Za-z0-9_-]{11}",value) else None
    request=json.loads(Path("request.json").read_text())
    response=json.loads(Path("response.json").read_text())
    transport=json.loads(Path("transport.json").read_text())
    if not isinstance(response,dict) or response.get("source")!=request["source"] or response.get("status")!="done" or not isinstance(response.get("results"),list) or len(response["results"])!=1:
        raise ValueError("Unexpected response envelope; inspect saved response without repeating the paid request")
    payload=response["results"][0]
    if request["source"]!="youtube_suggestions" and not isinstance(payload,dict): raise ValueError("Invalid result object")
    if "video_id" in request and payload.get("videoId")!=request["video_id"]: raise ValueError("Response video does not match request")
    def rows(field):
        value=payload.get(field,[])
        if not isinstance(value,list): raise ValueError("Malformed list is not an empty result: "+field)
        return value
    manifest={"request":request,"transport":transport,"api_created_at":response.get("created_at"),"usage":response.get("usage")}
    report=[]
    items=rows('videos')
    cid=string(payload.get('channelId'))
    if not cid: raise ValueError('Channel identity is missing; cannot safely compare upload windows')
    previous=json.loads(Path('previous.json').read_text())
    records,excluded,seen=[],[],set()
    for index,item in enumerate(items,1):
        vid=item.get('videoId') if isinstance(item,dict) else None
        url=video_url(vid)
        if not url or vid in seen:
            excluded.append({'index':index,'reason':'invalid_or_duplicate_video_id'}); continue
        seen.add(vid); records.append({'window_position':index,'url':url,**{k:item.get(k) for k in ['videoId','title','duration','viewCount','uploadDate']}})
    snapshot={'format':'youtube_channel-v1','request':request,'channelId':cid,'retrieved_at':transport['retrieved_at'],'records':records,'channel':{k:payload.get(k) for k in ['channelHandle','name','description','subscriberCount','videoCount','viewCount','channelUrl']}}
    save('snapshot.json',snapshot); csv_file('videos.csv',['window_position','videoId','title','duration','viewCount','uploadDate','url'],records)
    comparable=bool(previous) and previous['channelId']==cid
    before={r['videoId'] for r in previous.get('records',[])} if comparable else set()
    changes={'status':'compared' if comparable else 'channel_identity_changed' if previous else 'first_snapshot','newly_observed':sorted(seen-before) if comparable else [],'still_in_window':sorted(seen&before) if comparable else [],'not_in_current_window':sorted(before-seen) if comparable else []}
    save('changes.json',changes)
    usable=1
    manifest.update(returned_count=len(items),unique_count=len(records),excluded=excluded,comparison=changes['status'])
    report=['# Channel upload window','',text(payload.get('name')),'Comparison: '+text(changes['status']), 'The current window contains '+str(len(records))+' unique video IDs. Missing videos are not proven deleted.','']
    for category in ['newly_observed','still_in_window','not_in_current_window']:
        report+=['## '+text(category)]+['- [Open '+vid+']('+video_url(vid)+')' for vid in changes[category]]+['']
    if not comparable: report+=['Save snapshot.json for a later run with the same inputs and channel identity.']

    save("manifest.json",manifest)
    Path("report.md").write_text("\n".join(report)+"\n",encoding="utf-8")
    outputs(usable_count=usable)
- id: route_report
  type: io.kestra.plugin.core.flow.If
  condition: '{{ outputs.build_artifacts.vars.usable_count > 0 }}'
  then:
  - id: publish_report
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.13.15-slim
    inputFiles:
      report.md: '{{ outputs.build_artifacts.outputFiles[''report.md''] }}'
    outputFiles:
    - changes.md
    script: |
      from pathlib import Path
      Path('changes.md').write_bytes(Path("report.md").read_bytes())
  else:
  - id: no_usable_data
    type: io.kestra.plugin.core.storage.Write
    extension: .md
    content: No usable records for this report. Inspect build_artifacts report.md, manifest.json and the original
      response for missing fields or excluded records. No fallback query was made.
extend:
  title: YouTube channel upload snapshots with FlashData
  metaTitle: YouTube channel upload snapshots with FlashData | Kestra
  shortDescription: Capture a channel upload window and compare it with a previous snapshot to find newly observed
    video IDs.
  metaDescription: Capture a channel upload window and compare it with a previous snapshot to find newly observed
    video IDs.
  description: |
    Capture a channel upload window and compare it with a previous snapshot to find newly observed video IDs.

    ## How it works

    1. Validate handle; video_limit before sending one FlashData query.
    2. Preserve the original response and apply the task-specific checks described below.
    3. An If task selects a populated review report or an explicit no-data note. Review-only quality records still produce a report.

    ## What you get

    - snapshot.json, videos.csv, changes.json and changes.md from execution task Outputs.
    - request.json, response.json, transport.json and manifest.json for provenance, exclusions and reported API usage.
    - Missing fields remain missing; malformed schemas fail instead of becoming successful empty results.

    ## Who it's for

    Built for researchers following a channel publishing pipeline who need inspectable data before downstream decisions.

    ## Why orchestrate this with Kestra

    Keep collection, validation and reusable artifacts in one execution. File lineage makes it possible to review the exact source response without paying for the same query again.

    ## Prerequisites

    Kestra 2.0 with the Python plugin, Docker runner and access to data.flashdata.dev. The pinned Python image needs no installed libraries.
    Create a [FlashData account and API key](https://flashdata.dev/app/api-keys).
    Store `FLASHDATA_API_KEY` in Kestra secrets with `youtube_channel` access; never paste it into flow inputs.
    Installing this blueprint is free; FlashData queries consume Credits. Check [pricing](https://flashdata.dev/pricing) and account limits before running.

    ## Quick start

    1. Configure the secret. For manual import, copy YAML above `extend`, which is catalog metadata.
    2. Review the input descriptions and defaults, then execute once. An optional previous_snapshot must be this flow's own snapshot with identical request inputs.
    3. Open the output files and the original source before using external text as agent context. Treat it as data, not instructions.
    4. The weekly schedule is disabled. Review recurring costs before enabling it.

    Only the requested recent-video window is observed. A missing video does not establish deletion or a private-status change.
    Requests have a 65-second socket timeout and 4 MiB response limit. No retry, redirects or extra requests occur. If a query times out, inspect FlashData Jobs/logs before rerunning; it may already be charged. Requested counts can differ from actual returned counts.

    ## How to extend

    Use saved artifacts in your own review or ingestion flow. Model calls, downloads and storage writes require separately configured tasks and costs.

    ## Links

    - [Capability details and inputs](https://flashdata.dev/docs/sources/youtube_channel)
    - [Kestra file outputs](https://kestra.io/docs/scripts/input-output-files)
    - [Configure secrets](https://kestra.io/docs/how-to-guides/secrets)
  tags:
  - Data
  subTags:
  - File & Data Processing Basics
  - Testing & Quality
  ee: false
  demo: false
