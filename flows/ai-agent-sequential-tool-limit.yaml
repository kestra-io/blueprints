id: ai-agent-sequential-tool-limit
namespace: company.team
description: |
  Put the loop limit on the agent itself. The AIAgent task carries a real
  maxSequentialToolsInvocations cap, so the agent cannot chain more tool
  calls than the operator allows, instead of a watchdog noticing the loop
  after the calls already ran and the tokens are already spent. A
  pre-call task asserts the cap is a small positive number before the
  agent runs, and a post-call task proves the cap held by counting the
  real tool executions and failing the run if the count ever exceeds it.
  The agent is also given exactly one read-only tool, so an unauthorized
  action is impossible by construction, not merely caught afterwards.

inputs:
  - id: read_tool_namespace
    type: STRING
    displayName: Read tool namespace
    description: Namespace of the read-only Kestra flow the agent is allowed to call as its tool.
    defaults: company.team
  - id: read_tool_flow_id
    type: STRING
    displayName: Read tool flow id
    description: Id of the read-only Kestra flow the agent is allowed to call as its tool. This input has no default on purpose, so a run never silently authorizes a tool the operator did not name.
  - id: max_tool_calls
    type: INT
    displayName: Maximum sequential tool invocations
    description: Cap on how many tool calls the agent may chain within one run, set on the agent task itself as maxSequentialToolsInvocations. Must be between 1 and 10, enforced by the pre-call assert task, so the agent never runs with an unlimited or absurd cap.
    defaults: 3
  - id: agent_task
    type: STRING
    displayName: Agent task
    description: The task the agent must carry out with the read tool. The agent must call the read tool before answering.
    defaults: |
      Fetch the current operations note with the read tool, then draft a short on-call summary of what it returns.
  - id: fail_on_no_tool_calls
    type: BOOL
    displayName: Fail on no tool calls
    description: When true, a run where the agent made no tool calls fails instead of passing quietly, because no capped tool use was demonstrated. When false, such a run yields a warning in the log instead.
    defaults: true

tasks:
  - id: assert_tool_limit
    type: io.kestra.plugin.scripts.python.Script
    description: |
      Assert the agent-side cap before any agent call. The cap must be a
      whole number between 1 and 10. A missing, zero, negative, or
      oversized cap fails this task, so the agent never runs with an
      unlimited or absurd limit, and a misconfigured run fails here
      instead of burning tokens in an uncapped loop.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.12-slim
    env:
      MAX_TOOL_CALLS: "{{ inputs.max_tool_calls }}"
    script: |
      import json
      import os
      import sys


      def emit(outputs):
          print("::" + json.dumps({"outputs": outputs}) + "::")


      def main():
          raw = os.environ.get("MAX_TOOL_CALLS", "")
          try:
              cap = int(raw)
          except ValueError:
              print("max_tool_calls was not a whole number: %r" % raw, file=sys.stderr)
              raise SystemExit("agent-side tool cap is not a whole number, agent call refused")
          if cap < 1 or cap > 10:
              print("max_tool_calls out of range: %d" % cap, file=sys.stderr)
              raise SystemExit("agent-side tool cap must be between 1 and 10, agent call refused")
          emit({"cap": cap})


      main()

  - id: run_agent
    type: io.kestra.plugin.ai.agent.AIAgent
    description: |
      The agent call, with the loop limit set on the agent task itself.
      maxSequentialToolsInvocations is a documented property of this task
      (it defaults to unlimited when unset, which is exactly the hazard
      this flow removes), and it caps how many tool calls the agent may
      chain within one run. The agent is given exactly one tool, a
      read-only Kestra flow, so the only action it can ever take is
      reading that flow. This is the enforcement: no watchdog runs after
      the agent, the limit binds inside the agent run.
    provider:
      type: io.kestra.plugin.ai.provider.GoogleGemini
      modelName: gemini-3.5-flash-lite
      apiKey: "{{ secret('GEMINI_API_KEY') }}"
    systemMessage: |
      You are a concise on-call assistant. Call the read tool before answering, then summarize only what the tool returns. You have exactly one tool, a read-only flow, and a strict cap on sequential tool calls: make at most the allowed number of calls, and never attempt any state-changing action.
    prompt: "{{ inputs.agent_task }}"
    maxSequentialToolsInvocations: "{{ inputs.max_tool_calls }}"
    tools:
      - type: io.kestra.plugin.ai.tool.KestraFlow
        namespace: "{{ inputs.read_tool_namespace }}"
        flowId: "{{ inputs.read_tool_flow_id }}"
        description: Read-only operations-note flow. This is the only tool the agent may call, and the agent-side cap bounds how many times it may chain it.

  - id: verify_tool_call_count
    type: io.kestra.plugin.scripts.python.Script
    description: |
      Prove the agent-side cap held, from the live call's own
      toolExecutions output. The count of real tool calls must not exceed
      the cap asserted before the call. If it does, the run fails, which
      means the cap did not bind and the operator must know, not merely
      log, that fact. A run with no tool calls, or with an unparseable
      tool executions output, fails closed when fail_on_no_tool_calls is
      true, because a cap that was never exercised proves nothing.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.12-slim
    env:
      TOOL_EXECUTIONS: "{{ outputs.run_agent.toolExecutions | toJson }}"
      MAX_TOOL_CALLS: "{{ inputs.max_tool_calls }}"
      FAIL_ON_NO_TOOL_CALLS: "{{ inputs.fail_on_no_tool_calls }}"
    script: |
      import json
      import os
      import sys


      def emit(outputs):
          print("::" + json.dumps({"outputs": outputs}) + "::")


      def main():
          raw = os.environ.get("TOOL_EXECUTIONS", "")
          try:
              cap = int(os.environ.get("MAX_TOOL_CALLS", ""))
          except ValueError:
              print("max_tool_calls was not a whole number", file=sys.stderr)
              raise SystemExit("agent-side tool cap unreadable, verification refused")
          fail_no_calls = os.environ.get("FAIL_ON_NO_TOOL_CALLS", "true") == "true"
          try:
              executions = json.loads(raw) if raw.strip() else []
          except ValueError:
              executions = None
          if executions is None or not isinstance(executions, list):
              print("tool executions output could not be parsed", file=sys.stderr)
              raise SystemExit("tool executions output unparseable, cap compliance unproven")
          count = len(executions)
          if count == 0 and fail_no_calls:
              print("agent made no tool calls, so no capped tool use was demonstrated", file=sys.stderr)
              raise SystemExit("agent made no tool calls, capped tool use unproven")
          if count > cap:
              print("tool call count %d exceeded agent-side cap %d" % (count, cap), file=sys.stderr)
              raise SystemExit("agent-side tool cap did not hold: %d calls over cap %d" % (count, cap))
          emit({
              "verdict": "WITHIN_CAP",
              "tool_calls": count,
              "cap": cap,
          })


      main()

  - id: deliver
    type: io.kestra.plugin.core.debug.Return
    description: Report the cap, the real tool call count, and the compliance verdict together, so the execution history proves the agent-side limit bound the run.
    format: |
      AI agent sequential tool limit {{ outputs.verify_tool_call_count.vars.verdict }}: {{ outputs.verify_tool_call_count.vars.tool_calls }} tool calls against a cap of {{ outputs.verify_tool_call_count.vars.cap }}.

outputs:
  - id: verdict
    type: STRING
    description: WITHIN_CAP when the live call's tool executions numbered at or below the agent-side cap.
    value: "{{ outputs.verify_tool_call_count.vars.verdict }}"
  - id: tool_calls
    type: INT
    description: Number of real tool calls the agent made in the live call.
    value: "{{ outputs.verify_tool_call_count.vars.tool_calls }}"
  - id: cap
    type: INT
    description: Agent-side cap that bound the live call.
    value: "{{ outputs.verify_tool_call_count.vars.cap }}"

extend:
  shortDescription: Cap an agent's chained tool calls on the agent task itself instead of watching for loops afterwards
  title: AI Agent Sequential Tool Limit
  metaTitle: AI Agent Sequential Tool Limit | Kestra
  description: |
    ## What it does

    This flow puts the loop limit on the agent itself. The AIAgent task
    carries maxSequentialToolsInvocations, a documented property of that
    task which defaults to unlimited when unset, set here to a small
    operator-chosen cap (default 3). The agent therefore cannot chain
    more tool calls than allowed, instead of a watchdog noticing the
    loop after the calls already ran and the tokens are already spent. A
    pre-call task asserts the cap is a small positive number before the
    agent runs, and a post-call task proves the cap held by counting the
    real tool executions and failing the run if the count ever exceeds
    it. The agent is also given exactly one read-only tool, so an
    unauthorized action is impossible by construction, not merely caught
    afterwards. This answers both the loop-limit ask and the
    allowlist ask in one flow: the cap binds inside the agent run, and
    the single read-only tool is the allowlist.

    ## Prerequisites

    - A Kestra instance with the AI plugin and a `GEMINI_API_KEY` secret
      in the namespace this flow runs in.
    - A read-only Kestra flow for the agent to call as its tool. Name it
      explicitly in `read_tool_flow_id`, which has no default on purpose,
      so a run never silently authorizes a tool the operator did not
      name.
    - A caller that honours the verdict: the verify task already fails
      the run when the cap does not hold, so no downstream step needs to
      check.

    ## How it works

    1. `assert_tool_limit` (`io.kestra.plugin.scripts.python.Script`)
       asserts the cap is a whole number between 1 and 10 before any
       agent call, so the agent never runs with an unlimited or absurd
       limit.
    2. `run_agent` (`io.kestra.plugin.ai.agent.AIAgent`) runs with
       maxSequentialToolsInvocations set from `max_tool_calls` and
       exactly one tool, a read-only Kestra flow. The limit binds inside
       this task, not in any watchdog after it.
    3. `verify_tool_call_count` (`io.kestra.plugin.scripts.python.Script`)
       reads the live call's `toolExecutions` output and counts the real
       tool calls. A count above the cap fails the run, so a cap that did
       not bind is an error, not a log line. No tool calls, or an
       unparseable output, fails closed when `fail_on_no_tool_calls` is
       true.
    4. `deliver` (`io.kestra.plugin.core.debug.Return`) reports the cap,
       the real tool call count, and the compliance verdict together.

    ## How to adapt it

    - Set `max_tool_calls` per agent: an agent that legitimately needs
      several chained reads wants a higher cap, while an agent that
      should answer from one read wants the cap at 1. Never remove the
      pre-call assert when raising the cap, since it is what keeps an
      unlimited value from slipping back in.
    - Keep the tool list at exactly one read-only flow for agents that
      must not act. If an agent genuinely needs a second tool, add it
      deliberately and name it in the system message: every tool added
      here is a tool the cap now bounds, not a tool the agent may use
      freely.
    - Set `fail_on_no_tool_calls` to false only for agents that
      legitimately answer without tools, and read the resulting log line
      instead of treating a zero-call run as proof the cap bound
      anything.
    - Pair this flow with a spend gate for cost control: the tool cap
      bounds calls per run, while a spend gate bounds total spend across
      runs, and neither replaces the other.

  tags:
    - AI
  subTags:
    - Agents & Structured Output
  ee: false
  demo: false
  metaDescription: "Cap an agent's chained tool calls on the agent task itself with maxSequentialToolsInvocations, proven by counting the live call's tool executions."
