id: github-release-breaking-change-ai-advisor
namespace: company.devops

description: |
  Inspects upstream GitHub repository releases using AI to detect breaking API changes,
  extract actionable migration steps, calculate upgrade risk scores, and dispatch
  advisory briefs to Slack with stateful KV cursor tracking to prevent duplicate alerts.

inputs:
  - id: repository
    type: STRING
    defaults: "kestra-io/kestra"
    description: Target GitHub repository in owner/repo format to monitor for releases.

  - id: model_name
    type: STRING
    defaults: "gemini-3.5-flash"
    description: Google Gemini model used for changelog parsing and structured risk evaluation (e.g., gemini-3.5-flash or gemini-2.5-flash).

  - id: force_analysis
    type: BOOL
    defaults: false
    description: When true, re-analyzes the latest release tag even if already recorded in KV storage.

  - id: dry_run
    type: BOOL
    defaults: true
    description: When true, audits release and simulates advisory generation without updating KV cursor.

tasks:
  - id: fetch_latest_release
    type: io.kestra.plugin.core.http.Request
    description: Ingests the latest published release tag and changelog from GitHub REST API
    uri: "https://api.github.com/repos/{{ inputs.repository }}/releases/latest"
    method: GET
    contentType: application/json
    headers:
      Accept: "application/vnd.github+json"
      User-Agent: "Kestra-Release-Advisor"
      Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"

  - id: check_release_seen
    type: io.kestra.plugin.core.output.OutputValues
    description: Compares latest release tag against Kestra KV store cursor to detect new releases
    values:
      latest_tag: "{{ outputs.fetch_latest_release.body | jq('.tag_name') | first }}"
      release_url: "{{ outputs.fetch_latest_release.body | jq('.html_url') | first }}"
      release_body: "{{ outputs.fetch_latest_release.body | jq('.body') | first ?? 'No changelog body provided.' }}"
      last_seen_tag: "{{ kv('release_cursor_' ~ (inputs.repository | replace('/', '_')), errorOnMissing=false) }}"
      is_new_release: "{{ inputs.force_analysis or (outputs.fetch_latest_release.body | jq('.tag_name') | first != kv('release_cursor_' ~ (inputs.repository | replace('/', '_')), errorOnMissing=false)) }}"

  - id: evaluate_release_status
    type: io.kestra.plugin.core.flow.If
    description: Branches execution based on whether a new unanalyzed release was detected
    condition: "{{ outputs.check_release_seen.values.is_new_release }}"
    then:
      - id: analyze_release_with_ai
        type: io.kestra.plugin.ai.completion.ChatCompletion
        description: Analyzes raw changelog text with Google Gemini to extract breaking changes and migration steps
        provider:
          type: io.kestra.plugin.ai.provider.GoogleGemini
          apiKey: "{{ secret('GEMINI_API_KEY') }}"
          modelName: "{{ inputs.model_name }}"
        configuration:
          temperature: 0.1
          responseFormat:
            type: JSON
            jsonSchema:
              type: object
              properties:
                has_breaking_changes:
                  type: boolean
                breaking_changes:
                  type: array
                  items:
                    type: string
                has_security_fixes:
                  type: boolean
                security_fixes:
                  type: array
                  items:
                    type: string
                actionable_migration_steps:
                  type: array
                  items:
                    type: string
                upgrade_risk_score:
                  type: integer
                  minimum: 1
                  maximum: 10
                summary:
                  type: string
              required:
                - has_breaking_changes
                - breaking_changes
                - has_security_fixes
                - security_fixes
                - actionable_migration_steps
                - upgrade_risk_score
                - summary
        messages:
          - type: SYSTEM
            content: |
              You are a Principal Software Architect evaluating open-source dependency updates for an engineering team.
              Analyze the provided changelog markdown.
              Identify any breaking changes (deprecated APIs, signature modifications, removed flags, breaking schema alterations).
              Identify security patches or CVE remediations.
              Synthesize concrete, actionable migration instructions for developers upgrading from the preceding version.
              Assign an upgrade_risk_score from 1 (trivial patch, drop-in update) to 10 (high-risk breaking migration).
              Return strictly structured JSON matching the provided schema.
          - type: USER
            content: |
              Target Repository: {{ inputs.repository }}
              Release Version: {{ outputs.check_release_seen.values.latest_tag }}
              Changelog Body:
              {{ outputs.check_release_seen.values.release_body }}

      - id: evaluate_cursor_persistence
        type: io.kestra.plugin.core.flow.If
        description: Persists release tag cursor to KV store when not running in dry-run simulation
        condition: "{{ not inputs.dry_run }}"
        then:
          - id: record_kv_cursor
            type: io.kestra.plugin.core.kv.Set
            description: Saves latest analyzed release tag into namespace KV storage
            key: "release_cursor_{{ inputs.repository | replace('/', '_') }}"
            value: "{{ outputs.check_release_seen.values.latest_tag }}"
            kvType: STRING

      - id: notify_slack_advisory
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches structured release advisory card to Slack
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: |
          :package: *Upstream Release Advisory: {{ inputs.repository }} ({{ outputs.check_release_seen.values.latest_tag }})*
          *Upgrade Risk Score:* `{{ outputs.analyze_release_with_ai.jsonOutput.upgrade_risk_score }}/10`
          *Breaking Changes:* `{{ outputs.analyze_release_with_ai.jsonOutput.has_breaking_changes ? ':warning: YES' : ':white_check_mark: None' }}`
          *Security Fixes:* `{{ outputs.analyze_release_with_ai.jsonOutput.has_security_fixes ? ':shield: YES' : ':white_check_mark: None' }}`
          *Summary:* {{ outputs.analyze_release_with_ai.jsonOutput.summary }}

          *Actionable Migration Steps:*
          {% for step in outputs.analyze_release_with_ai.jsonOutput.actionable_migration_steps -%}
          • {{ step }}
          {% endfor %}
          <{{ outputs.check_release_seen.values.release_url }}|Open GitHub Release Notes>

    else:
      - id: log_up_to_date_status
        type: io.kestra.plugin.core.log.Log
        description: Records confirmation when latest release has already been analyzed
        message: "Repository {{ inputs.repository }} release {{ outputs.check_release_seen.values.latest_tag }} is up-to-date and was already analyzed (last cursor: {{ outputs.check_release_seen.values.last_seen_tag }})."

triggers:
  - id: daily_dependency_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Daily scheduled sweep of upstream dependency releases. Shipped disabled by default.
    cron: "0 8 * * *"
    disabled: true

  - id: github_release_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Event-driven webhook trigger to analyze releases immediately when GitHub dispatches a release event
    key: "{{ secret('WEBHOOK_KEY') }}"

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts on-call Slack channel if release analysis encounters an unexpected error
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: |
      :warning: *Release Advisor FAILED on execution {{ execution.id }}*
      *Repository:* `{{ inputs.repository }}`
      Please verify GitHub API rate limits and Gemini API key permissions.

extend:
  title: Analyze Upstream Release Breaking Changes with AI and Slack Alerts
  shortDescription: Inspect GitHub releases with AI to detect breaking changes, extract migration steps, and notify engineering teams on Slack.
  metaTitle: Analyze Upstream Release Breaking Changes with AI
  metaDescription: Analyze GitHub releases with AI. Detect breaking changes and security fixes, extract actionable migration steps, and dispatch alerts to Slack.
  description: |
    Modern software engineering teams depend on dozens of upstream open-source frameworks, database engines, and software development kits. When new versions are tagged, developers are often confronted with dense, multi-page changelogs containing hundreds of trivial commits alongside critical breaking API modifications or urgent security CVE patches. Manual changelog review is time-consuming and error-prone, frequently resulting in failed builds or production runtime regressions following routine dependency upgrades.

    This blueprint provides an automated release advisor that inspects newly published releases from GitHub repositories. It uses Kestra's unified AI plugin with Google Gemini to analyze raw changelogs, classify breaking changes, extract concrete code migration instructions, compute an upgrade risk score, and deliver structured advisory cards directly to Slack. Stateful cursor tracking in Kestra's Key-Value store ensures repositories are only analyzed when new release tags appear.

    ## How it works

    1. `fetch_latest_release` (`io.kestra.plugin.core.http.Request`) queries the GitHub REST API to retrieve the latest published release tag and changelog markdown for the target repository.
    2. `check_release_seen` (`io.kestra.plugin.core.output.OutputValues`) compares the release tag against Kestra's internal Key-Value store (`kv()`) to determine whether this tag has already been evaluated.
    3. `evaluate_release_status` (`io.kestra.plugin.core.flow.If`) routes execution:
       - If the tag is already recorded and `force_analysis: false`, `log_up_to_date_status` confirms the repository is up-to-date and exits cleanly.
       - If a new tag is detected, `analyze_release_with_ai` (`io.kestra.plugin.ai.completion.ChatCompletion`) passes the changelog to Google Gemini using a strict JSON schema contract.
    4. Google Gemini parses the changelog and returns a structured JSON payload containing boolean flags for breaking changes and security fixes, an itemized list of migration actions, and a 1–10 risk rating.
    5. `evaluate_cursor_persistence` (`io.kestra.plugin.core.flow.If`) saves the processed release tag to the KV store via `record_kv_cursor` (`io.kestra.plugin.core.kv.Set`) when `dry_run: false`.
    6. `notify_slack_advisory` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches a formatted advisory card to Slack highlighting the risk score, breaking changes, and migration checklist.

    ## What you get

    - Automated technical intelligence extracting breaking changes and security fixes from raw changelogs.
    - Actionable migration checklists delivered to engineering teams before initiating package upgrades.
    - Stateful idempotency through Kestra KV store, ensuring zero repetitive spam for previously processed releases.
    - Safe-by-default execution with `dry_run: true` to test analysis without mutating cursor state.
    - Pure declarative Kestra 2.0 architecture with zero custom container runners or Python dependencies.

    ## Who it's for

    - Software Architects and Tech Leads tracking critical upstream libraries and frameworks.
    - Platform and DevOps Engineers managing dependency updates across fleet microservices.
    - Site Reliability Engineers safeguarding production against unforeseen third-party API deprecations.

    ## Why orchestrate this with Kestra

    Building this with ad-hoc cron scripts requires managing state files, handling LLM retries, and configuring external storage. Kestra provides native HTTP client tasks, built-in AI completion with schema validation, native Key-Value storage, and enterprise secrets management in a single declarative YAML workflow.

    ## Pitfalls

    - **Token Rate Limits:** Unauthenticated GitHub API calls are capped at 60 requests per hour. Always configure `GITHUB_TOKEN` in Kestra secrets to benefit from 5,000 requests per hour.
    - **Massive Changelogs:** For repositories with massive release notes spanning thousands of lines, ensure model context limits are respected by using capable models like `gemini-3.5-flash`.
    - **Draft and Prereleases:** The GitHub `/releases/latest` endpoint automatically excludes drafts and prereleases, ensuring only official stable releases trigger advisories.

    ## Prerequisites

    - A GitHub Personal Access Token (`GITHUB_TOKEN`) with public repository read permissions.
    - A Google Gemini API key (`GEMINI_API_KEY`) for structured changelog analysis.
    - A Slack incoming webhook URL for team notifications.

    ### Secrets

    - `GITHUB_TOKEN`: GitHub personal access token for authenticated API requests.
    - `GEMINI_API_KEY`: API key for Google Gemini model inference.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for alert delivery.
    - `WEBHOOK_KEY`: Secret key for authenticated GitHub webhook event ingestion.

    ## Quick start

    1. Add `GITHUB_TOKEN`, `GEMINI_API_KEY`, `SLACK_WEBHOOK_URL`, and `WEBHOOK_KEY` to your Kestra namespace secrets.
    2. Deploy this flow and trigger a manual execution with `force_analysis: true` and `dry_run: true` to preview the AI analysis on your chosen repository.
    3. Once verified, set `dry_run: false` to allow the flow to maintain cursor state in the KV store.
    4. Enable the `daily_dependency_check` schedule trigger, or point a GitHub repository webhook to the `github_release_webhook` trigger for instant alerts on publish.

    ## How to extend

    - **Multi-Repository Fleet Tracking:** Wrap this workflow in a parent subflow using `io.kestra.plugin.core.flow.Loop` to iterate over an organization's entire dependency catalog.
    - **GitHub Issue Generation:** Add an `io.kestra.plugin.github.issues.Create` task to automatically open an upgrade planning issue in your core repository when risk scores exceed 7.
    - **Jira / Linear Ticketing:** Automatically create an engineering task in Jira or Linear when security CVE fixes are identified.

    ## Links

    - [GitHub Releases API Reference](https://docs.github.com/en/rest/releases/releases)
    - [Kestra AI Plugin Documentation](https://kestra.io/plugins/plugin-ai)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Notifications Documentation](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - AI
    - Infrastructure
    - Core
  subTags:
    - Agents & Structured Output
    - CI/CD & Deployment
  ee: false
  demo: false
