id: vercel-production-failure-rollback-approval
namespace: company.platform

inputs:
  - id: project_id
    type: STRING
    displayName: Vercel Project Name or ID
    description: Name or ID of the Vercel project to monitor (e.g. acme-web or prj_xxxx).
    defaults: my-vercel-project

  - id: target_deployment_id
    type: STRING
    displayName: Target Rollback Deployment ID
    description: Identifier (dpl_xxxx) of the verified healthy deployment to restore if production is failing.
    defaults: dpl_previous_healthy_build

  - id: slack_webhook_uri
    type: URI
    displayName: Slack Webhook URI
    description: Webhook endpoint used to alert operators and deliver the approval link.
    defaults: https://kestra.io/api/mock

tasks:
  - id: check_latest_production_deployment
    type: io.kestra.plugin.core.http.Request
    description: Query the Vercel Deployments API for the active production deployment status.
    uri: "https://api.vercel.com/v6/deployments?projectId={{ inputs.project_id }}&target=production&limit=1"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('VERCEL_API_TOKEN') }}"

  - id: evaluate_deployment_health
    type: io.kestra.plugin.core.flow.If
    description: Check whether the latest deployment is in an ERROR state.
    condition: "{{ (fromJson(outputs.check_latest_production_deployment.body).deployments[0].state ?? '') == 'ERROR' }}"
    then:
      - id: notify_operator_of_failure
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch a Slack notification alerting engineers of production downtime and providing the approval link.
        url: "{{ inputs.slack_webhook_uri }}"
        messageText: |
          :rotating_light: *Vercel Production Deployment Failure Detected*
          *Project:* `{{ inputs.project_id }}`
          *Failed Deployment:* `{{ fromJson(outputs.check_latest_production_deployment.body).deployments[0].uid ?? 'unknown' }}`
          *Target Rollback Candidate:* `{{ inputs.target_deployment_id }}`
          *Action Required:* Review the failure and authorize instant traffic rollback in Kestra UI:
          http://localhost:8080/ui/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}

      - id: pause_for_rollback_approval
        type: io.kestra.plugin.core.flow.Pause
        description: Pause flow execution to require human sign-off before executing production rollback.
        onResume:
          - id: approved
            type: BOOL
            description: Set to true to approve immediate traffic rollback.
            defaults: true
          - id: approval_reason
            type: STRING
            description: Operational context or incident ticket number for the rollback decision.
            defaults: "Approved production rollback after build failure"

      - id: execute_rollback_if_approved
        type: io.kestra.plugin.core.flow.If
        description: Execute the rollback if the operator provided approval.
        condition: "{{ outputs.pause_for_rollback_approval.onResume.approved ?? false }}"
        then:
          - id: trigger_vercel_rollback
            type: io.kestra.plugin.core.http.Request
            description: Trigger Vercel Rollback REST API to instantly redirect production traffic.
            uri: "https://api.vercel.com/v1/projects/{{ inputs.project_id }}/rollback/{{ inputs.target_deployment_id }}"
            method: POST
            headers:
              Authorization: "Bearer {{ secret('VERCEL_API_TOKEN') }}"
              Content-Type: "application/json"

          - id: log_rollback_success
            type: io.kestra.plugin.core.log.Log
            message: "Production rollback triggered successfully for project {{ inputs.project_id }} to deployment {{ inputs.target_deployment_id }}."
        else:
          - id: log_rollback_cancelled
            type: io.kestra.plugin.core.log.Log
            message: "Rollback rejected by operator during manual approval gate for project {{ inputs.project_id }}."
    else:
      - id: log_deployment_healthy
        type: io.kestra.plugin.core.log.Log
        message: "Latest production deployment for project {{ inputs.project_id }} is healthy (State: {{ fromJson(outputs.check_latest_production_deployment.body).deployments[0].state ?? 'OK' }})."

description: |
  Automate Vercel production deployment failure monitoring and safe rollback with human-in-the-loop approval.
  This workflow queries the Vercel Deployments API, detects failing production builds (`ERROR` state), alerts
  on-call operators via Slack, pauses for interactive authorization in the Kestra UI, and calls the Vercel
  Rollback API to restore a verified healthy build.

extend:
  title: "Vercel production failure check with human-in-the-loop rollback approval"
  metaTitle: Vercel Production Failure Check and Rollback Approval | Kestra
  shortDescription: Monitor Vercel production deployments for failures, alert Slack, pause for human approval, and trigger instant rollback.
  metaDescription: Detect Vercel build failures, alert Slack, pause for operator sign-off, and rollback to a healthy deployment with declarative Kestra orchestration.
  description: |
    Continuous deployment enables fast shipping, but broken production builds can cause immediate customer downtime.
    While automated rollbacks are fast, blindly redirecting production traffic without verification can cause schema
    mismatches or disrupt data consistency.

    This blueprint provides an autonomous production guard that bridges automated detection with interactive human
    authorization. Using native Kestra plugins, it eliminates custom scripts and offers a transparent, auditable
    remediation pipeline.

    ## How it works

    1. `check_latest_production_deployment` (`io.kestra.plugin.core.http.Request`) invokes Vercel's REST API (`GET /v6/deployments`) to inspect the active production deployment state.
    2. `evaluate_deployment_health` (`io.kestra.plugin.core.flow.If`) inspects the response to verify whether `readyState` is `ERROR`.
    3. `notify_operator_of_failure` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches a Slack alert with incident metadata and a direct URL to the execution.
    4. `pause_for_rollback_approval` (`io.kestra.plugin.core.flow.Pause`) holds execution until an on-call engineer reviews the failure and confirms the rollback decision.
    5. `execute_rollback_if_approved` (`io.kestra.plugin.core.flow.If`) checks the approval status.
    6. `trigger_vercel_rollback` (`io.kestra.plugin.core.http.Request`) invokes Vercel's Rollback API (`POST /v1/projects/{id}/rollback/{targetId}`) to redirect production traffic to the designated healthy deployment.
    7. `log_rollback_success` or `log_rollback_cancelled` (`io.kestra.plugin.core.log.Log`) records the full audit trail.

    ## What you get

    - Zero-glue-code automated production deployment surveillance using native HTTP and flow plugins.
    - Human-in-the-loop approval gate preventing accidental or unintended production rollbacks.
    - Instant incident notification in Slack with direct navigation to the execution approval modal.
    - Full audit logging of who authorized the rollback and the rationale recorded in execution state.

    ## Who it's for

    - Platform Engineers and DevOps teams managing mission-critical Vercel applications.
    - Site Reliability Engineers (SREs) establishing automated rollback guardrails with human sign-off.
    - Engineering Leads needing an auditable approval trail for production traffic diversions.

    ## Why orchestrate this with Kestra

    Building custom rollback scripts inside CI jobs or serverless functions often creates hidden failure modes, lacks
    native human-in-the-loop approval modals, and provides poor execution visibility. Kestra provides declarative flow
    control, built-in secret management, durable state pausing (`io.kestra.plugin.core.flow.Pause`), and unified execution
    tracking without managing custom webhook infrastructure.

    ## Prerequisites

    - A Vercel account with project admin privileges.
    - A configured Slack Incoming Webhook URL.

    ### Secrets

    - `VERCEL_API_TOKEN`: Vercel Personal Access Token or Team Token with deployment read and project write permissions.

    ## Quick start

    1. Add `VERCEL_API_TOKEN` to your Kestra namespace secrets.
    2. Configure `project_id` to match your Vercel project name or ID.
    3. Specify `target_deployment_id` with the ID of your last verified production deployment (`dpl_xxxx`).
    4. Set `slack_webhook_uri` to your team's Slack incoming webhook URL.
    5. Trigger the flow manually or attach a schedule trigger (`io.kestra.plugin.core.trigger.Schedule`) for recurring surveillance.

    ## How to extend

    - **Automated target discovery**: Prepend an API call to dynamically query and select the most recent deployment in `READY` state.
    - **PagerDuty escalation**: Pair Slack alerting with `io.kestra.plugin.pagerduty.Incident` to page on-call responders during high-severity outages.
    - **Multi-environment guard**: Parameterize the target environment to safeguard staging and preview deployments across diverse teams.

    ## Links

    - [Vercel Deployments REST API Documentation](https://vercel.com/docs/rest-api/deployments)
    - [Vercel Rollback REST API Documentation](https://vercel.com/docs/rest-api/projects#rollback-a-deployment)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Pause Task Documentation](https://kestra.io/plugins/plugin-core/tasks/flow/io.kestra.plugin.core.flow.pause)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - CI/CD & Deployment
    - Approval Gates
  ee: false
  verified: false
  demo: false
