id: clickhouse-distributed-table-queue-drain-and-unblock-guard
namespace: company.analytics

description: |
  Inspect ClickHouse Distributed engine table buffer queues across cluster nodes, detect
  blocked send threads and un-flushed asynchronous insert batches, track cross-run failure trends
  in Kestra KV, safely unblock sends and force-flush pending batches behind human approval,
  and verify post-action queue drain.

inputs:
  - id: clickhouse_url
    type: STRING
    displayName: ClickHouse JDBC URL
    description: JDBC connection string for ClickHouse server or cluster coordinator.
    defaults: "jdbc:clickhouse://localhost:8123/default"

  - id: use_secret_auth
    type: BOOL
    displayName: Use Secret Authentication
    description: When true, retrieves database credentials securely from CLICKHOUSE_USERNAME and CLICKHOUSE_PASSWORD secrets.
    defaults: true

  - id: clickhouse_username
    type: STRING
    displayName: ClickHouse Username
    description: Fallback username used only when use_secret_auth is false.
    defaults: "default"

  - id: clickhouse_password
    type: STRING
    displayName: ClickHouse Password
    description: Fallback password used only when use_secret_auth is false.
    defaults: ""

  - id: target_database
    type: STRING
    displayName: Target Database
    description: Specific database to audit for distributed table queues. Leave empty to audit all databases on the cluster node.
    defaults: ""

  - id: target_table
    type: STRING
    displayName: Target Table
    description: Specific distributed table name to audit. Leave empty to inspect all distributed tables.
    defaults: ""

  - id: error_count_threshold
    type: INT
    displayName: Send Error Count Threshold
    description: Minimum consecutive remote shard transmission failures before flagging a distributed queue as stalled.
    defaults: 3

  - id: min_data_files_threshold
    type: INT
    displayName: Minimum Data Files Threshold
    description: Minimum buffered .bin part files waiting in queue before escalating a failing or stagnant distributed queue.
    defaults: 5

  - id: critical_files_threshold
    type: INT
    displayName: Critical Backlog Files Threshold
    description: Critical queue size threshold of pending .bin files that flags immediate disk exhaustion or ingestion stall risk.
    defaults: 50

  - id: flush_timeout_seconds
    type: INT
    displayName: Flush Timeout Seconds
    description: Maximum execution timeout in seconds allocated for SYSTEM FLUSH DISTRIBUTED queries to drain pending data blocks to remote shards.
    defaults: 300

  - id: auto_remediate
    type: BOOL
    displayName: Auto Remediate
    description: When true and dry_run is false, unblocks send threads and triggers SYSTEM FLUSH DISTRIBUTED for stalled tables after approval.
    defaults: true

  - id: dry_run
    type: BOOL
    displayName: Dry Run Mode
    description: When true, analyzes queues, evaluates trends against KV state, and logs diagnostics without altering cluster queue states.
    defaults: true

triggers:
  - id: periodic_queue_guard
    type: io.kestra.plugin.core.trigger.Schedule
    description: Periodic scheduled audit scanning ClickHouse distributed table queues every 15 minutes. Shipped disabled.
    cron: "*/15 * * * *"
    disabled: true

  - id: on_demand_queue_guard_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated HTTP endpoint invoked by Prometheus Alertmanager, ClickHouse Keeper alert webhooks, or incident runbooks.
    key: "{{ secret('CLICKHOUSE_QUEUE_GUARD_WEBHOOK_KEY') }}"

tasks:
  - id: validate_inputs
    type: io.kestra.plugin.core.execution.Assert
    description: Assert operational inputs satisfy threshold, timeout, and sanity constraints.
    conditions:
      - "{{ inputs.error_count_threshold >= 1 }}"
      - "{{ inputs.min_data_files_threshold >= 1 }}"
      - "{{ inputs.critical_files_threshold >= inputs.min_data_files_threshold }}"
      - "{{ inputs.flush_timeout_seconds >= 10 }}"
    errorMessage: "Invalid configuration inputs. Ensure thresholds are positive and critical_files_threshold >= min_data_files_threshold."

  - id: query_distribution_queues
    type: io.kestra.plugin.jdbc.clickhouse.Query
    description: Query ClickHouse system.distribution_queue for tables with pending buffer files, blocked states, or remote delivery errors.
    url: "{{ inputs.clickhouse_url }}"
    username: "{{ inputs.use_secret_auth ? secret('CLICKHOUSE_USERNAME') : inputs.clickhouse_username }}"
    password: "{{ inputs.use_secret_auth ? secret('CLICKHOUSE_PASSWORD') : inputs.clickhouse_password }}"
    fetchType: FETCH
    sql: |
      SELECT
          database,
          table,
          count() AS shard_queues,
          toUInt64(sum(data_files)) AS total_data_files,
          toUInt64(sum(data_compressed_bytes)) AS total_compressed_bytes,
          toUInt64(sum(broken_data_files)) AS total_broken_files,
          toUInt8(max(is_blocked)) AS max_is_blocked,
          toUInt64(max(error_count)) AS max_error_count,
          argMax(last_exception, error_count) AS primary_last_exception
      FROM system.distribution_queue
      WHERE (data_files > 0 OR is_blocked = 1 OR error_count > 0)
        AND ('{{ inputs.target_database }}' = '' OR database = '{{ inputs.target_database }}')
        AND ('{{ inputs.target_table }}' = '' OR table = '{{ inputs.target_table }}')
      GROUP BY database, table
      ORDER BY total_data_files DESC, max_error_count DESC

  - id: triage_distribution_queues
    type: io.kestra.plugin.scripts.python.Script
    description: Parse distribution queue metrics, diff against historical KV state, detect stalled or blocked queues, and compile remediation commands.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    env:
      CLICKHOUSE_URL: "{{ inputs.clickhouse_url }}"
      ERROR_COUNT_THRESHOLD: "{{ inputs.error_count_threshold }}"
      MIN_DATA_FILES_THRESHOLD: "{{ inputs.min_data_files_threshold }}"
      CRITICAL_FILES_THRESHOLD: "{{ inputs.critical_files_threshold }}"
      FLUSH_TIMEOUT_SECONDS: "{{ inputs.flush_timeout_seconds }}"
      AUTO_REMEDIATE: "{{ inputs.auto_remediate }}"
      DRY_RUN: "{{ inputs.dry_run }}"
      EXECUTION_ID: "{{ execution.id }}"
      PREVIOUS_STATE_JSON: "{{ kv('clickhouse_dist_queue_tracker', errorOnMissing=false) ?? '{}' }}"
      QUEUES_DATA_JSON: "{{ (outputs.query_distribution_queues.rows ?? []) | toJson }}"
    script: |
      import os
      import sys
      import json
      from datetime import datetime, timezone

      try:
          from kestra import Kestra
      except ImportError:
          Kestra = None

      now_iso = datetime.now(timezone.utc).isoformat()
      clickhouse_url = os.environ.get("CLICKHOUSE_URL", "")
      error_threshold = int(os.environ.get("ERROR_COUNT_THRESHOLD", "3"))
      min_files_threshold = int(os.environ.get("MIN_DATA_FILES_THRESHOLD", "5"))
      critical_files_threshold = int(os.environ.get("CRITICAL_FILES_THRESHOLD", "50"))
      flush_timeout_seconds = int(os.environ.get("FLUSH_TIMEOUT_SECONDS", "300"))
      auto_remediate = os.environ.get("AUTO_REMEDIATE", "true").lower() == "true"
      dry_run = os.environ.get("DRY_RUN", "true").lower() == "true"
      execution_id = os.environ.get("EXECUTION_ID", "local-test")

      def format_bytes(num_bytes):
          for unit in ["B", "KB", "MB", "GB", "TB"]:
              if abs(num_bytes) < 1024.0:
                  return f"{num_bytes:.2f} {unit}"
              num_bytes /= 1024.0
          return f"{num_bytes:.2f} PB"

      queues_raw = os.environ.get("QUEUES_DATA_JSON", "[]")
      try:
          queues = json.loads(queues_raw) if queues_raw.strip() else []
      except Exception:
          queues = []

      prev_state_raw = os.environ.get("PREVIOUS_STATE_JSON", "{}")
      try:
          prev_state = json.loads(prev_state_raw) if prev_state_raw.strip() else {}
      except Exception:
          prev_state = {}

      stalled_tables = []
      new_state_snapshot = {}
      total_pending_files_all = 0
      total_pending_bytes_all = 0

      for row in queues:
          db = str(row.get("database") or "").strip()
          tbl = str(row.get("table") or "").strip()
          if not db or not tbl:
              continue

          key = f"{db}.{tbl}"
          data_files = int(row.get("total_data_files") or 0)
          data_bytes = int(row.get("total_compressed_bytes") or 0)
          broken_files = int(row.get("total_broken_files") or 0)
          is_blocked = int(row.get("max_is_blocked") or 0)
          error_count = int(row.get("max_error_count") or 0)
          last_exception = str(row.get("primary_last_exception") or "").strip()

          total_pending_files_all += data_files
          total_pending_bytes_all += data_bytes

          prev_entry = prev_state.get(key, {})
          prev_files = int(prev_entry.get("data_files", 0))
          prev_errors = int(prev_entry.get("error_count", 0))

          new_state_snapshot[key] = {
              "database": db,
              "table": tbl,
              "data_files": data_files,
              "data_compressed_bytes": data_bytes,
              "error_count": error_count,
              "is_blocked": is_blocked,
              "last_evaluated_at": now_iso
          }

          failure_reasons = []
          if is_blocked == 1:
              failure_reasons.append("SND_BLOCKED")
          if error_count >= error_threshold and data_files >= min_files_threshold:
              failure_reasons.append(f"ERR_FAILURES_{error_count}")
          if data_files >= critical_files_threshold:
              failure_reasons.append(f"BACKLOG_SURGE_{data_files}_FILES")
          if data_files > 0 and data_files >= prev_files and error_count > prev_errors:
              failure_reasons.append("STAGNANT_ESCALATING_ERRORS")
          if broken_files > 0:
              failure_reasons.append(f"BROKEN_FILES_{broken_files}")

          if failure_reasons:
              primary_reason = ", ".join(failure_reasons)
              start_sql = f"SYSTEM START DISTRIBUTED SENDS `{db}`.`{tbl}`"
              flush_sql = f"SYSTEM FLUSH DISTRIBUTED `{db}`.`{tbl}` SETTINGS max_execution_time = {flush_timeout_seconds}"

              stalled_tables.append({
                  "database": db,
                  "table": tbl,
                  "full_name": key,
                  "total_data_files": data_files,
                  "total_compressed_bytes": data_bytes,
                  "formatted_bytes": format_bytes(data_bytes),
                  "broken_files": broken_files,
                  "max_is_blocked": is_blocked,
                  "max_error_count": error_count,
                  "primary_last_exception": last_exception,
                  "failure_reason": primary_reason,
                  "start_sends_sql": start_sql,
                  "flush_sql": flush_sql
              })

      has_stalled = len(stalled_tables) > 0
      overall_status = "CRITICAL" if any(t["max_is_blocked"] == 1 or t["total_data_files"] >= critical_files_threshold for t in stalled_tables) else ("WARNING" if has_stalled else "HEALTHY")

      summary_lines = []
      for t in stalled_tables:
          summary_lines.append(f"- `{t['full_name']}`: {t['total_data_files']} file(s) ({t['formatted_bytes']}), error_count: {t['max_error_count']}, blocked: {t['max_is_blocked']}, reason: {t['failure_reason']}")

      summary_text = (
          f"ClickHouse Distributed Queue Guard: {overall_status} | "
          f"Audited {len(queues)} distributed queue(s). Stalled queues: {len(stalled_tables)}. "
          f"Total buffered files: {total_pending_files_all} ({format_bytes(total_pending_bytes_all)}). "
          f"Auto Remediate: {auto_remediate} (Dry Run: {dry_run})."
      )
      print(summary_text)

      audit_manifest = {
          "overall_status": overall_status,
          "has_stalled_queues": has_stalled,
          "stalled_tables_count": len(stalled_tables),
          "stalled_tables": stalled_tables,
          "total_pending_files": total_pending_files_all,
          "total_pending_bytes": total_pending_bytes_all,
          "auto_remediate": auto_remediate,
          "dry_run": dry_run,
          "execution_id": execution_id,
          "evaluated_at": now_iso,
          "summary": summary_text
      }

      output_data = {
          "has_stalled_queues": has_stalled,
          "stalled_tables_count": len(stalled_tables),
          "stalled_tables": stalled_tables,
          "overall_status": overall_status,
          "total_pending_files": total_pending_files_all,
          "total_pending_bytes": total_pending_bytes_all,
          "summary": summary_text,
          "summary_details": "\n".join(summary_lines) if summary_lines else "None",
          "kv_state_snapshot": new_state_snapshot,
          "audit_manifest": audit_manifest
      }

      if Kestra:
          Kestra.outputs(output_data)
      else:
          print("::" + json.dumps({"outputs": output_data}) + "::")

  - id: save_state_tracker_kv
    type: io.kestra.plugin.core.kv.Set
    description: Persist updated queue depth and error counts into Kestra KV store for cross-run differential trend tracking.
    key: "clickhouse_dist_queue_tracker"
    value: "{{ outputs.triage_distribution_queues.vars.kv_state_snapshot | toJson }}"
    kvType: JSON
    overwrite: true

  - id: evaluate_stalled_queues
    type: io.kestra.plugin.core.flow.If
    description: Branch execution based on whether stalled or blocked distributed table queues were identified.
    condition: "{{ outputs.triage_distribution_queues.vars.has_stalled_queues == true }}"
    then:
      - id: dispatch_slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Deliver prioritized incident notification to Slack detailing stalled tables, pending parts, and proposed remediation commands.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "attachments": [
              {
                "color": "{{ outputs.triage_distribution_queues.vars.overall_status == 'CRITICAL' ? 'danger' : 'warning' }}",
                "title": ":warning: ClickHouse Distributed Insert Queue Stagnation Alert",
                "text": "*Status:* `{{ outputs.triage_distribution_queues.vars.overall_status }}`\n*Stalled Tables:* {{ outputs.triage_distribution_queues.vars.stalled_tables_count }}\n*Pending Files:* {{ outputs.triage_distribution_queues.vars.total_pending_files }}\n*Mode:* auto_remediate={{ inputs.auto_remediate }}, dry_run={{ inputs.dry_run }}\n*Execution:* `{{ execution.id }}`\n\n*Affected Distributed Tables:*\n{{ outputs.triage_distribution_queues.vars.summary_details }}\n\n*Summary:* {{ outputs.triage_distribution_queues.vars.summary }}"
              }
            ]
          }

      - id: remediation_mode_gate
        type: io.kestra.plugin.core.flow.If
        description: Gate automated remediation execution behind auto_remediate and dry_run configuration flags.
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: pause_for_flush_approval
            type: io.kestra.plugin.core.flow.Pause
            description: Pause workflow execution for operator review before unblocking send threads and triggering forced cluster flush queries. Resume to proceed or kill to cancel.

          - id: remediate_stalled_tables
            type: io.kestra.plugin.core.flow.Loop
            description: Iterate sequentially over each stalled distributed table to unblock sends, force-flush pending blocks, and verify queue drain.
            values: "{{ outputs.triage_distribution_queues.vars.stalled_tables }}"
            concurrencyLimit: 1
            tasks:
              - id: start_distributed_sends
                type: io.kestra.plugin.jdbc.clickhouse.Query
                description: Resume background transmission of queued insert data to remote cluster shards if previously blocked or stopped.
                url: "{{ inputs.clickhouse_url }}"
                username: "{{ inputs.use_secret_auth ? secret('CLICKHOUSE_USERNAME') : inputs.clickhouse_username }}"
                password: "{{ inputs.use_secret_auth ? secret('CLICKHOUSE_PASSWORD') : inputs.clickhouse_password }}"
                sql: "{{ fromJson(item.value).start_sends_sql }}"

              - id: flush_distributed_queue
                type: io.kestra.plugin.jdbc.clickhouse.Query
                description: Force immediate transmission of all currently queued data chunks to remote shards without waiting for background intervals.
                url: "{{ inputs.clickhouse_url }}"
                username: "{{ inputs.use_secret_auth ? secret('CLICKHOUSE_USERNAME') : inputs.clickhouse_username }}"
                password: "{{ inputs.use_secret_auth ? secret('CLICKHOUSE_PASSWORD') : inputs.clickhouse_password }}"
                sql: "{{ fromJson(item.value).flush_sql }}"
                allowFailure: true

              - id: verify_queue_drain
                type: io.kestra.plugin.jdbc.clickhouse.Query
                description: Post-remediation verification re-querying system.distribution_queue to ensure buffered files drained and send threads are unblocked.
                url: "{{ inputs.clickhouse_url }}"
                username: "{{ inputs.use_secret_auth ? secret('CLICKHOUSE_USERNAME') : inputs.clickhouse_username }}"
                password: "{{ inputs.use_secret_auth ? secret('CLICKHOUSE_PASSWORD') : inputs.clickhouse_password }}"
                fetchType: FETCH_ONE
                sql: |
                  SELECT
                      toUInt64(sum(data_files)) AS remaining_data_files,
                      toUInt64(sum(data_compressed_bytes)) AS remaining_compressed_bytes,
                      toUInt8(max(is_blocked)) AS current_is_blocked,
                      toUInt64(max(error_count)) AS current_error_count
                  FROM system.distribution_queue
                  WHERE database = '{{ fromJson(item.value).database }}'
                    AND table = '{{ fromJson(item.value).table }}'

              - id: log_remediation_outcome
                type: io.kestra.plugin.core.log.Log
                description: Record post-flush verification results, remaining queue size, and unblock status.
                message: >-
                  Remediation pass completed for {{ fromJson(item.value).database }}.{{ fromJson(item.value).table }}. Initial files: {{ fromJson(item.value).total_data_files }}, Remaining files: {{ outputs.verify_queue_drain.row.remaining_data_files ?? 0 }}, Is Blocked: {{ outputs.verify_queue_drain.row.current_is_blocked ?? 0 }}.

        else:
          - id: log_dry_run_plan
            type: io.kestra.plugin.core.log.Log
            description: Log planned remediation commands when operating in dry_run or audit-only mode.
            message: >-
              Dry run active or auto_remediate disabled. No mutations applied. Planned remediation for {{ outputs.triage_distribution_queues.vars.stalled_tables_count }} table(s): {{ outputs.triage_distribution_queues.vars.stalled_tables | toJson }}.

      - id: save_recovery_audit_kv
        type: io.kestra.plugin.core.kv.Set
        description: Record comprehensive incident triage and recovery audit manifest in Kestra KV store.
        key: "clickhouse_dist_flush_audit_{{ execution.id }}"
        value: "{{ outputs.triage_distribution_queues.vars.audit_manifest | toJson }}"
        kvType: JSON
        overwrite: true

    else:
      - id: log_healthy_cluster
        type: io.kestra.plugin.core.log.Log
        description: Log confirmation when all inspected ClickHouse distributed table queues are draining normally without send blocks.
        message: "ClickHouse distributed table queue audit completed cleanly. No stalled, blocked, or erroring distribution queues detected."

errors:
  - id: alert_on_workflow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatch emergency alert to Slack if the ClickHouse distributed queue guard encounters an unhandled execution error.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "attachments": [
          {
            "color": "danger",
            "title": ":rotating_light: ClickHouse Distributed Queue Guard Execution Failed",
            "text": "Failed execution `{{ execution.id }}` while auditing ClickHouse server `{{ inputs.clickhouse_url }}`.\nVerify database network reachability, cluster credentials, or worker logs."
          }
        ]
      }

extend:
  title: Drain Stalled ClickHouse Distributed Insert Queue and Unblock Remote Shard Sends
  metaTitle: Drain Stalled ClickHouse Distributed Insert Queue & Unblock Sends | Kestra
  shortDescription: Audit ClickHouse distributed table buffer queues for stalled sends, track failure trends across runs in KV, unblock send threads, flush pending inserts, and verify queue drain.
  metaDescription: Detect stalled ClickHouse distributed insert queues, track errors across runs in KV, safely flush pending data to shards, and verify queue drain in Kestra.
  description: |
    Production ClickHouse clusters frequently utilize tables configured with the `Distributed`
    storage engine to fan out queries and route insert workloads across sharded cluster nodes.
    When asynchronous distributed inserts are enabled (`insert_distributed_sync = false`), ClickHouse
    buffers incoming insert batches locally as `.bin` part files on disk and delegates background
    threads to forward the chunks asynchronously to remote shard replicas.

    During transient network partitions, remote shard maintenance, ZooKeeper or ClickHouse Keeper
    re-elections, or remote host read-only transitions, background transmission fails repeatedly.
    ClickHouse records consecutive delivery errors in `system.distribution_queue`. When errors
    persist or transmission is paused, the table's sending thread can become marked as blocked
    (`is_blocked = 1`), leaving un-flushed `.bin` part files stranded on local disk. Local disk
    utilization climbs toward watermark exhaustion while downstream analytical queries against
    remote shards return stale, incomplete datasets without explicit client write errors.

    This blueprint provides an automated operational guard that audits `system.distribution_queue`
    across all distributed tables, correlates queue size and error counts with historical execution
    snapshots stored in Kestra KV, holds for human approval, executes `SYSTEM START DISTRIBUTED SENDS`
    and `SYSTEM FLUSH DISTRIBUTED` to unblock and drain stalled queues, and re-queries the system table
    to verify complete queue resolution.

    ## How it works

    1. **Pre-flight Input Assertion**: An Assert task validates that error thresholds, queue file limits, and flush timeouts satisfy sanity bounds before querying cluster metadata.
    2. **Distribution Queue Telemetry Collection**: `io.kestra.plugin.jdbc.clickhouse.Query` queries `system.distribution_queue`, aggregating pending file counts (`data_files`), compressed byte volume, broken part counts, block flags (`is_blocked`), error counts, and recent exception text grouped by database and table.
    3. **Differential Trend Analysis & Triage**: A containerized Python script compares current queue metrics against prior snapshots persisted in Kestra KV (`clickhouse_dist_queue_tracker`). Tables are flagged as stalled when transmission is blocked (`is_blocked = 1`), error counts exceed operational limits (`error_count >= threshold`), or queue files remain stagnant or growing across consecutive workflow runs.
    4. **State Persistence in KV**: The workflow updates `clickhouse_dist_queue_tracker` in Kestra KV with current file counts and error metrics for next-run differential trend evaluation.
    5. **Slack Incident Alerting**: If stalled queues are detected, an immediate diagnostic alert is dispatched to Slack highlighting affected tables, un-sent file counts, byte volume, and failure causes.
    6. **Human Approval Gate**: When automated remediation is enabled and `dry_run` is false, `io.kestra.plugin.core.flow.Pause` pauses execution, allowing database reliability engineers to inspect the remediation plan before altering cluster queue state.
    7. **Unblock Sends & Force Flush**: For each approved stalled table, the flow executes `SYSTEM START DISTRIBUTED SENDS` to ensure sending threads are active, followed by `SYSTEM FLUSH DISTRIBUTED` with a controlled `max_execution_time` setting to force immediate delivery of queued blocks.
    8. **Post-Remediation Verification**: The flow re-queries `system.distribution_queue` for each remediated table to verify that `data_files` has drained and `is_blocked` has cleared to 0, logging post-remediation evidence and archiving the recovery audit manifest in Kestra KV.

    ## What you get

    - Automated discovery of silent asynchronous insert backlog stalls across all ClickHouse distributed tables.
    - Historical trend diffing via Kestra KV to distinguish momentary ingestion bursts from deadlocked sending queues.
    - Human-gated remediation using native ClickHouse `SYSTEM START DISTRIBUTED SENDS` and `SYSTEM FLUSH DISTRIBUTED` commands.
    - Post-remediation verification confirming that buffer parts have successfully drained to remote cluster shards.
    - Zero data loss from silent background buffer disk exhaustion.

    ## Who it's for

    - ClickHouse Database Administrators (DBAs) managing distributed cluster topologies.
    - Site Reliability Engineers (SREs) maintaining high-throughput clickstream and telemetry ingestion pipelines.
    - Data Platform Engineers responsible for distributed analytical query data freshness and SLO compliance.

    ## Why orchestrate this with Kestra

    - **Cross-Run State Tracking**: Standalone cron scripts lack persistent execution context; Kestra KV maintains historical queue depth and error counts to detect stagnant queues across runs.
    - **Interactive Approval Gates**: Kestra's built-in `Pause` task allows automated detection with supervised remediation, ensuring production write flushes run only under operator consent.
    - **Native Declarative SQL & Container Orchestration**: Eliminates fragile ad-hoc shell wrappers by combining official ClickHouse JDBC driver execution with containerized Python triage.
    - **Complete Forensics & Audit Trails**: Every audit manifest and post-verification check is captured in execution outputs and persisted in Kestra KV for compliance review.

    ## Prerequisites

    - A running ClickHouse cluster (version 21.8 or higher) with one or more tables utilizing the `Distributed` table engine.
    - Network connectivity from the Kestra worker to the ClickHouse HTTP/JDBC port (default: 8123).
    - Database user privileges: `SELECT` on `system.distribution_queue`, plus `SYSTEM DISTRIBUTED SENDS` and `SYSTEM FLUSH` privileges for automated remediation.

    ### Secrets

    - `CLICKHOUSE_USERNAME`: ClickHouse database user credential with system table read and system maintenance privileges.
    - `CLICKHOUSE_PASSWORD`: ClickHouse database user password.
    - `CLICKHOUSE_QUEUE_GUARD_WEBHOOK_KEY`: Secret authentication key for the event-driven Webhook trigger.
    - `SLACK_WEBHOOK_URL`: Incoming Slack webhook endpoint URL for incident and remediation alerts.

    ## Quick start

    1. Configure `CLICKHOUSE_USERNAME`, `CLICKHOUSE_PASSWORD`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this blueprint into your Kestra instance.
    3. Run a manual execution with `dry_run: true` to audit distributed queues without altering table send states.
    4. Review execution outputs and verify the logged distribution queue metrics.
    5. Switch `dry_run: false` and enable the `periodic_queue_guard` schedule for continuous automated monitoring.

    ## How to extend

    - **Dead-Letter Shard Rerouting**: If a specific remote shard is permanently lost, extend the loop to query `system.clusters` and automatically update the underlying distributed table definition to bypass the decommissioned host.
    - **Disk Space Watermark Protection**: Add a pre-check querying `system.disks` to automatically lower `critical_files_threshold` if the partition hosting ClickHouse data directories drops below 20% free space.
    - **PagerDuty Escalation**: Replace or augment the Slack notification task with `io.kestra.plugin.pagerduty.PagerDutyAlert` when queues exceed `critical_files_threshold`.

