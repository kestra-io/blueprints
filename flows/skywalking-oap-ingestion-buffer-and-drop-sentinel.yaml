id: skywalking-oap-ingestion-buffer-and-drop-sentinel
namespace: company.infrastructure

inputs:
  - id: skywalking_oap_endpoint
    type: STRING
    displayName: SkyWalking OAP Metrics Endpoint
    description: Base URL of the Apache SkyWalking OAP server Prometheus metrics endpoint.
    defaults: "http://localhost:12800"

  - id: max_allowed_dropped_spans
    type: INT
    displayName: Maximum Allowed Dropped Spans
    description: Tolerance threshold for dropped trace segments before raising a critical incident alert.
    defaults: 0

  - id: send_slack_alert
    type: BOOL
    displayName: Dispatch Slack Incident Alert
    description: Whether to transmit real-time Slack notifications upon trace span loss or storage write failures.
    defaults: true

triggers:
  - id: skywalking_audit_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Recurring audit polling SkyWalking OAP server telemetry health every 15 minutes.
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_oap_metrics
    type: io.kestra.plugin.core.http.Request
    description: Query Apache SkyWalking OAP server Prometheus metrics endpoint for buffer and drop statistics.
    uri: "{{ inputs.skywalking_oap_endpoint }}/metrics"
    method: GET
    headers:
      Accept: "text/plain"
    options:
      allowFailed: true
      timeout:
        connectTimeout: PT10S
        readIdleTimeout: PT30S
    retry:
      type: constant
      interval: PT5S
      maxAttempts: 3
    allowFailure: true

  - id: evaluate_ingestion_health
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogate Prometheus metrics text, extract dropped spans and write errors, and classify ingestion status.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    inputFiles:
      metrics.txt: "{{ outputs.probe_oap_metrics.body }}"
    script: |
      import re
      import json

      max_allowed = int({{ inputs.max_allowed_dropped_spans }})

      try:
          with open("metrics.txt", "r") as f:
              raw = f.read()
      except Exception:
          raw = ""

      # Parse Prometheus metrics
      def extract_metric(pattern, default=0.0):
          matches = re.findall(pattern, raw)
          total = 0.0
          for m in matches:
              try:
                  total += float(m)
              except ValueError:
                  pass
          return total

      dropped_spans = extract_metric(r'skywalking_oap_instance_trace_buffer_drop_total(?:\{[^}]*\})?\s+([0-9\.]+)')
      write_errors = extract_metric(r'skywalking_oap_storage_write_errors_total(?:\{[^}]*\})?\s+([0-9\.]+)')
      queue_depth = extract_metric(r'skywalking_oap_instance_trace_buffer_queue_size(?:\{[^}]*\})?\s+([0-9\.]+)')

      # Evaluation and severity classification
      if dropped_spans == 0 and write_errors == 0:
          classification = "INGESTION_OPTIMAL"
      elif dropped_spans <= max_allowed and write_errors == 0:
          classification = "BUFFER_SATURATION_WARNING"
      else:
          classification = "CRITICAL_SPAN_LOSS"

      output_payload = {
          "outputs": {
              "dropped_spans_count": int(dropped_spans),
              "write_errors_count": int(write_errors),
              "buffer_queue_size": int(queue_depth),
              "classification": classification
          }
      }
      print(f"::{json.dumps(output_payload)}::")

  - id: classify_ingestion_status
    type: io.kestra.plugin.core.log.Log
    description: Log evaluated SkyWalking OAP server ingestion metrics and status classification.
    message: |
      SkyWalking Endpoint: {{ inputs.skywalking_oap_endpoint }}
      Dropped Spans: {{ outputs.evaluate_ingestion_health.vars.dropped_spans_count }}
      Storage Write Errors: {{ outputs.evaluate_ingestion_health.vars.write_errors_count }}
      Buffer Queue Depth: {{ outputs.evaluate_ingestion_health.vars.buffer_queue_size }}
      Classification: {{ outputs.evaluate_ingestion_health.vars.classification }}

  - id: route_ingestion_gate
    type: io.kestra.plugin.core.flow.Switch
    description: Route flow execution based on evaluated SkyWalking OAP ingestion health classification.
    value: "{{ outputs.evaluate_ingestion_health.vars.classification }}"
    cases:
      INGESTION_OPTIMAL:
        - id: log_optimal_state
          type: io.kestra.plugin.core.log.Log
          description: Log nominal verification confirming trace segments are processed without loss.
          message: "OPTIMAL: SkyWalking OAP server is operating nominally with zero dropped spans."

      BUFFER_SATURATION_WARNING:
        - id: log_buffer_advisory
          type: io.kestra.plugin.core.log.Log
          description: Log advisory warning for elevated queue depth or minor dropped span counts within tolerance.
          message: "WARNING: SkyWalking OAP buffer saturation detected. Dropped spans: {{ outputs.evaluate_ingestion_health.vars.dropped_spans_count }}."

      CRITICAL_SPAN_LOSS:
        - id: alert_slack_span_loss
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Dispatch urgent incident alert to observability engineering channel.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": ":rotating_light: *CRITICAL Apache SkyWalking OAP Span Loss Alert*\n*Endpoint:* `{{ inputs.skywalking_oap_endpoint }}`\n*Dropped Spans:* `{{ outputs.evaluate_ingestion_health.vars.dropped_spans_count }}`\n*Storage Errors:* `{{ outputs.evaluate_ingestion_health.vars.write_errors_count }}`\n*Queue Size:* `{{ outputs.evaluate_ingestion_health.vars.buffer_queue_size }}`\n*Execution:* <{{ flow.url }}|{{ execution.id }}>"
            }

        - id: remediation_halt_gate
          type: io.kestra.plugin.core.execution.Fail
          description: Fail execution to trigger alert escalation and protect telemetry pipeline integrity.

  - id: final_audit_log
    type: io.kestra.plugin.core.log.Log
    description: Record immutable audit log entry documenting SkyWalking OAP server health status.
    message: |
      [AUDIT] Apache SkyWalking OAP Ingestion Buffer and Dropped Span Sentinel completed.
      Endpoint: {{ inputs.skywalking_oap_endpoint }}
      Dropped Spans: {{ outputs.evaluate_ingestion_health.vars.dropped_spans_count }}
      Storage Errors: {{ outputs.evaluate_ingestion_health.vars.write_errors_count }}
      Verdict: {{ outputs.evaluate_ingestion_health.vars.classification }}

extend:
  title: Apache SkyWalking OAP Ingestion Buffer and Dropped Span Sentinel
  metaTitle: Apache SkyWalking OAP Ingestion Sentinel | Kestra
  shortDescription: Audit SkyWalking OAP buffer saturation and dropped trace spans, triggering Slack alerts on telemetry loss.
  metaDescription: Audit SkyWalking OAP server ingestion buffer and trace drops, classify telemetry loss severity, and dispatch Slack incident alerts on dropped spans.
  description: |
    Automated APM observability sentinel that polls Apache SkyWalking OAP server Prometheus metrics on a recurring schedule to audit trace segment ingestion buffer health, detect storage write failures, classify data drop severity, and dispatch Slack incident alerts when trace spans are lost.

    ## How it works

    1. A schedule trigger activates every fifteen minutes to audit the Apache SkyWalking OAP server.
    2. An HTTP request task probes the OAP server's `/metrics` Prometheus endpoint to gather real-time ingestion counters.
    3. An embedded Python script parses metric lines, extracting `skywalking_oap_instance_trace_buffer_drop_total`, `skywalking_oap_storage_write_errors_total`, and buffer queue depth.
    4. An informational log task records evaluated ingestion telemetry and current pipeline classification.
    5. A `Switch` flow control task branches execution according to the evaluated status:
       - `INGESTION_OPTIMAL`: Confirms zero telemetry loss and logs nominal pipeline performance.
       - `BUFFER_SATURATION_WARNING`: Emits a non-blocking advisory notification when buffer pressure is elevated.
       - `CRITICAL_SPAN_LOSS`: Dispatches a detailed Slack incident webhook with dropped span counts, storage error tallies, execution deep links, and halts execution via a failure gate.
    6. An immutable final audit log records the comprehensive health verdict and loss metrics in Kestra execution history.

    ## What you get

    - Real-time observability safeguards catching trace drops before critical APM visibility is lost during production incidents.
    - Automated buffer monitoring identifying OAP queue saturation and slow storage backend bottlenecks (Elasticsearch / BanyanDB).
    - Immediate Slack notifications alerting SRE and platform engineering teams to telemetry pipeline degradation.
    - Automated failure gates providing unambiguous signals for incident management and auto-scaling workflows.
    - Complete, immutable audit records tracking trace ingestion stability across clusters.

    ## Who it's for

    - Site Reliability Engineers (SREs) and Platform Engineers maintaining distributed tracing infrastructure.
    - Observability and DevOps Teams managing Apache SkyWalking OAP clusters and backend storage sinks.
    - Backend Architects relying on end-to-end distributed tracing for SLA monitoring and root-cause analysis.

    ## Why orchestrate this with Kestra

    - Declarative YAML orchestrates metrics harvesting, Prometheus text parsing, and incident dispatching without dedicated sidecar daemons.
    - Native secret masking ensures Slack webhook URLs and credentials remain secured throughout automated runs.
    - Built-in conditional branching enables granular escalation policies tailored to telemetry loss thresholds.
    - Centralized execution timelines provide instant diagnostic visibility into historical trace pipeline drop patterns.

    ## Prerequisites

    - Running Apache SkyWalking OAP server (standalone Docker container or Kubernetes deployment) with Prometheus metrics exporter enabled.
    - Network reachability between Kestra and the SkyWalking OAP metrics port (default `12800`).

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to transmit critical trace loss incident alerts.

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace or environment variables.
    2. Import this blueprint into your Kestra instance under `company.infrastructure`.
    3. Run a manual test execution pointing to your SkyWalking OAP endpoint to verify metric connectivity and parsing.
    4. Enable the `skywalking_audit_schedule` trigger to maintain continuous 15-minute ingestion monitoring.

    ## How to extend

    - Add an automated auto-scaling task in the remediation branch to dynamically scale SkyWalking OAP replica pods when queue pressure spikes.
    - Correlate dropped spans with underlying Elasticsearch or BanyanDB cluster disk latency metrics.
    - Route separate alerts to PagerDuty or Opsgenie when sustained trace drops exceed defined service level objectives (SLOs).

    ## Links

    - [Kestra HTTP Plugin Documentation](https://kestra.io/plugins/core/http/request)
    - [Apache SkyWalking OAP Documentation](https://skywalking.apache.org/docs/main/latest/readme/)
    - [Apache SkyWalking Metrics Exporter](https://skywalking.apache.org/docs/main/latest/en/setup/backend/backend-telemetry/)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  demo: false
