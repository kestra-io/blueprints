id: publicrecords-legistar-meetings-scraper
namespace: company.team

inputs:
  - id: max_items
    type: INT
    displayName: Max items
    defaults: 50

tasks:
  - id: run_actor
    type: io.kestra.plugin.apify.actor.Run
    actorId: publicrecords/legistar-meetings-scraper
    apiToken: "{{ secret('APIFY_API_TOKEN') }}"
    maxItems: "{{ inputs.max_items }}"
    maxTotalChargeUsd: 5
    input:
      clients: ["seattle", "boston"]
      resource: "events"
      maxItems: 50

  - id: get_dataset
    type: io.kestra.plugin.apify.dataset.Get
    apiToken: "{{ secret('APIFY_API_TOKEN') }}"
    datasetId: "{{ outputs.run_actor.defaultDatasetId }}"

extend:
  title: Pull Legistar city council meetings
  metaTitle: Pull Legistar city council meetings with Kestra
  shortDescription: Run publicrecords/legistar-meetings-scraper for selected cities and fetch meeting metadata.
  description: |
    Run the **Public Records** Apify Actor `legistar-meetings-scraper` on a schedule, using **your** Apify API token stored as the Kestra secret `APIFY_API_TOKEN`. Usage is billed to your Apify account (free tier available).

    Store page: https://apify.com/publicrecords/legistar-meetings-scraper

    Disclosure: Public Records maintains this Actor.
  tags:
    - Data
  subTags:
    - Public data
  ee: false
  demo: false
  metaDescription: Schedule the Public Records Legistar Apify Actor and fetch city council meeting metadata into Kestra.
