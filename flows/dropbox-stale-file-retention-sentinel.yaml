id: dropbox-stale-file-retention-sentinel
namespace: company.team

description: |
  List files under a Dropbox path, flag the ones whose last client-modified date is older than
  a retention threshold you set, alert Slack with the count and file paths when any are found,
  and log a governance audit trail either way. Read-only: this flow never deletes or modifies a
  file.

inputs:
  - id: dropbox_path
    type: STRING
    displayName: Dropbox path to scan
    description: Dropbox path to audit. Empty or / scans the root.
    defaults: ""

  - id: recursive_scan
    type: BOOL
    displayName: Scan sub-folders
    description: When true, traverses every sub-folder under dropbox_path instead of just the top level.
    defaults: true

  - id: retention_days
    type: INT
    displayName: Retention age in days
    description: A file whose clientModified date is older than this many days is reported stale.
    defaults: 180

  - id: max_stale_count
    type: INT
    displayName: Max stale count
    description: Alert when this many or more matching files are found.
    defaults: 1

tasks:
  - id: list_files
    type: io.kestra.plugin.dropbox.files.List
    description: Read-only. Lists every entry under dropbox_path; evaluate below filters to stale files since the Dropbox List API itself has no age-based filter.
    allowFailure: true
    accessToken: "{{ secret('DROPBOX_ACCESS_TOKEN') }}"
    path: "{{ inputs.dropbox_path }}"
    recursive: "{{ inputs.recursive_scan }}"
    fetchType: FETCH

  - id: evaluate
    type: io.kestra.plugin.core.output.OutputValues
    description: Compares each file's clientModified date against the retention_days cutoff, by date only, computed here so the comparison never depends on wall-clock time inside jq.
    values:
      stale_count: >-
        {{ outputs.list_files is not defined ? -1 : (({'rows': outputs.list_files.rows, 'cutoff': (now() | dateAdd(-inputs.retention_days, 'DAYS') | date('yyyy-MM-dd'))} | jq('.cutoff as $c | [(.rows // [])[] | select(.type == "file" and ((.clientModified // "")[0:10]) as $d | $d != "" and $d <= $c)] | length')) | first | number) }}
      stale_paths: >-
        {{ outputs.list_files is not defined ? '' : (({'rows': outputs.list_files.rows, 'cutoff': (now() | dateAdd(-inputs.retention_days, 'DAYS') | date('yyyy-MM-dd'))} | jq('.cutoff as $c | [(.rows // [])[] | select(.type == "file" and ((.clientModified // "")[0:10]) as $d | $d != "" and $d <= $c) | .path] | join("; ")')) | first) }}
      severity: >-
        {{ outputs.list_files is not defined ? 'CRITICAL' : (((({'rows': outputs.list_files.rows, 'cutoff': (now() | dateAdd(-inputs.retention_days, 'DAYS') | date('yyyy-MM-dd'))} | jq('.cutoff as $c | [(.rows // [])[] | select(.type == "file" and ((.clientModified // "")[0:10]) as $d | $d != "" and $d <= $c)] | length')) | first | number) >= inputs.max_stale_count) ? 'STALE_FILES_FOUND' : 'OK') }}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.evaluate.values.severity != 'OK' }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': outputs.evaluate.values.severity ~ ': ' ~ outputs.evaluate.values.stale_count ~ ' file(s) under Dropbox path ' ~ (inputs.dropbox_path == '' ? '/' : inputs.dropbox_path) ~ ' are older than ' ~ inputs.retention_days ~ ' day(s): ' ~ outputs.evaluate.values.stale_paths ~ '.'} | toJson }}
    else:
      - id: compliant
        type: io.kestra.plugin.core.log.Log
        message: "No file under Dropbox path {{ inputs.dropbox_path == '' ? '/' : inputs.dropbox_path }} is older than {{ inputs.retention_days }} day(s)."

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: "Dropbox stale file retention sentinel complete: {{ outputs.evaluate.values.stale_count }} stale file(s), severity {{ outputs.evaluate.values.severity }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Dropbox stale file retention sentinel failed (execution ' ~ execution.id ~ '). Check the logs.'} | toJson }}

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled. Enable once DROPBOX_ACCESS_TOKEN and SLACK_WEBHOOK_URL are set and dropbox_path points at a real folder.
    cron: "0 7 * * 1"
    disabled: true
    inputs:
      dropbox_path: ""
      recursive_scan: true
      retention_days: 180
      max_stale_count: 1

extend:
  title: Dropbox Stale File Retention Sentinel
  metaTitle: Dropbox Stale File Retention Sentinel with Kestra
  shortDescription: List Dropbox files past a retention threshold, alert Slack with the count and paths, and log a governance audit trail.
  metaDescription: List Dropbox files past a retention threshold, alert Slack with the stale paths, and log the result for platform teams.
  description: |
    A shared Dropbox folder accumulates exports, old reports, and one-off uploads nobody ever
    circles back to clean up. Dropbox has no scheduled, folder-wide retention sweep of its own,
    only a per-file view if someone opens it. This blueprint reads what is actually under a path,
    flags what has outlived its retention window by its own clientModified date, and reports the
    real file paths, not a guess.

    This blueprint was created by [Mohit Jeswani](https://github.com/mohitjeswani01).

    ## How it works

    1. `list_files` (`io.kestra.plugin.dropbox.files.List`) lists every entry under
       `dropbox_path`, recursively when `recursive_scan` is true. Read-only; nothing in Dropbox
       is changed. `allowFailure: true` covers an API or auth error without failing the flow
       outright.
    2. `evaluate` (`io.kestra.plugin.core.output.OutputValues`) filters to entries where `type`
       is `file` and `clientModified` is older than `retention_days`, with a `jq` filter, since
       the Dropbox List API itself has no age-based filter.
    3. `route` (`io.kestra.plugin.core.flow.If`):
       - **compliant:** logs that nothing is stale.
       - **alert:** posts the count and file paths to Slack.
    4. `summary` logs the count and severity, closing the governance cycle.
    5. `errors` alerts Slack if the flow itself fails, for example an expired access token.

    ## What you get

    - A real count and path list of what is actually past retention, not an estimate from
      folder size alone.
    - Folders correctly excluded from the stale count, since `clientModified` is null for a
      folder and this check only ever evaluates `type == "file"`.
    - A read-only check with zero risk of deleting a real file.

    ## Who it's for

    - Platform and IT teams who own a shared Dropbox folder and have no process catching old
      exports or reports nobody cleaned up.
    - Teams evaluating the Dropbox plugin who want a worked example of `files.List` used for a
      governance check, distinct from this repo's existing Dropbox blueprints, which handle
      intake, backup, and report distribution rather than retention auditing.

    ## Why orchestrate this with Kestra

    Dropbox shows a file's modified date one file at a time; it does not compare that date
    across a whole folder against a retention policy you declare, or notify anyone. Kestra keeps
    `retention_days` as a flow input, turns the scan into a Slack page naming the actual stale
    file paths, and keeps a full execution history of every run.

    ## Prerequisites

    - A Dropbox account or team folder with an access token scoped to read `dropbox_path`.
    - At least one file in the target path old enough to confirm the filter logic against.
    - A Slack incoming webhook URL.

    This flow calls the Dropbox API directly over HTTPS; there is no official local Dropbox
    emulator, so `list_files` cannot be exercised against a local Docker container.

    ### Secrets

    - `DROPBOX_ACCESS_TOKEN`: the Dropbox access token used by `list_files`. In Kestra OSS,
      provide it as the base64-encoded environment variable `SECRET_DROPBOX_ACCESS_TOKEN`.
    - `SLACK_WEBHOOK_URL`: used by `alert` and the `errors` block. In Kestra OSS, provide it as
      the base64-encoded environment variable `SECRET_SLACK_WEBHOOK_URL`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `dropbox_path` | `` (root) | Dropbox path to scan |
    | `recursive_scan` | `true` | Whether to traverse sub-folders |
    | `retention_days` | `180` | Age past which a file is reported stale |
    | `max_stale_count` | `1` | Matched-file count that triggers the Slack alert |

    ### Outputs

    - `{{ outputs.list_files.rows }}`: every scanned entry (`name`, `id`, `path`, `type`, `size`,
      `clientModified`).
    - `{{ outputs.evaluate.values.stale_count }}` / `.stale_paths`: how many files are stale and
      their display paths, semicolon-joined.
    - `{{ outputs.evaluate.values.severity }}`: `OK`, `STALE_FILES_FOUND`, or `CRITICAL`.

    ### Pitfalls

    - `clientModified` is the last time the file's content changed, set by the client that
      uploaded or edited it, not when Dropbox itself last touched the file internally; a file
      re-synced but not actually edited does not reset the staleness clock.
    - `limit` on `files.List` defaults to 2000 entries per call with no pagination handled here;
      a path with more entries than that is only partially scanned in one run.
    - `recursive_scan: false` only lists the top level of `dropbox_path`; a stale file several
      folders deep is invisible to this check unless recursion is enabled.

    ## Quick start

    1. Add the `DROPBOX_ACCESS_TOKEN` and `SLACK_WEBHOOK_URL` secrets.
    2. Set `dropbox_path` to a real folder.
    3. Run the flow manually and confirm `summary` logs a count.
    4. Raise `retention_days` above every scanned file's age, then lower it below a known old
       file's age, to confirm both `compliant` and `alert` fire correctly.
    5. Enable the `weekly` trigger once `retention_days` matches your actual retention policy.

    ## How to extend

    - Loop over several `dropbox_path` values with `io.kestra.plugin.core.flow.Loop` to cover
      more than one shared folder in a single scheduled run.
    - Chain `io.kestra.plugin.dropbox.files.Move` on each stale file to a "pending deletion"
      sub-folder instead of deleting outright, gated behind an explicit `confirm_move` input.
    - Sum `size` across stale entries in the evaluate step to report reclaimable bytes alongside
      the file count.

    ## Links

    - Dropbox plugin: https://kestra.io/plugins/plugin-dropbox
    - Dropbox API files/list_folder reference: https://www.dropbox.com/developers/documentation/http/documentation#files-list_folder
    - Slack incoming webhooks: https://api.slack.com/messaging/webhooks
  tags:
    - Business
  subTags:
    - Policy & Compliance
    - HR & Ops Automation
  ee: false
  demo: false
