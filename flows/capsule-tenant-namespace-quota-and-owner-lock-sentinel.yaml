id: capsule-tenant-namespace-quota-and-owner-lock-sentinel
namespace: company.sre

description: |
  Audits Capsule multi-tenancy operator telemetry to detect tenant namespace quota breaches, owner lock cordons, and admission proxy rejections.

concurrency:
  limit: 1

inputs:
  - id: capsule_metrics_url
    type: STRING
    displayName: "Capsule Metrics URL"
    defaults: "http://capsule-controller-manager.capsule-system.svc.cluster.local:8080"
    description: "Internal HTTP endpoint exposing Prometheus metrics for the Capsule multi-tenancy operator controller."

  - id: tenant_name
    type: STRING
    displayName: "Tenant Identifier"
    defaults: "analytics-platform-tenant"
    description: "Name of the target Capsule Tenant custom resource under active governance and resource surveillance."

  - id: max_quota_exceeded_threshold
    type: INT
    displayName: "Max Quota Exceeded Threshold"
    defaults: 2
    description: "Maximum allowable tenant namespace or compute resource quota violation events before alerting."

  - id: max_namespaces_limit
    type: INT
    displayName: "Max Allowed Namespaces Limit"
    defaults: 10
    description: "Configured ceiling for total namespaces provisioned under the tenant before flagging saturation."

  - id: alert_on_owner_lock
    type: BOOL
    displayName: "Alert on Owner Lock"
    defaults: true
    description: "Toggle whether detected tenant owner lock or administrative cordon triggers an immediate incident alert."

tasks:
  - id: scan_capsule_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Capsule multi-tenancy Prometheus metrics to audit tenant namespace counts, quota rejections, and owner lock states.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.capsule_metrics_url }}"
      TENANT_NAME: "{{ inputs.tenant_name }}"
      MAX_QUOTA_EXCEEDED: "{{ inputs.max_quota_exceeded_threshold }}"
      MAX_NAMESPACES: "{{ inputs.max_namespaces_limit }}"
      ALERT_OWNER_LOCK: "{{ inputs.alert_on_owner_lock }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METRICS_URL", "").rstrip("/")
      tenant_name = os.environ.get("TENANT_NAME", "analytics-platform-tenant")
      max_quota_exceeded = int(os.environ.get("MAX_QUOTA_EXCEEDED", "2"))
      max_namespaces = int(os.environ.get("MAX_NAMESPACES", "10"))
      alert_owner_lock = os.environ.get("ALERT_OWNER_LOCK", "true").lower() == "true"

      quota_exceeded_total = 0
      owner_lock_state = 0
      namespaces_count = 0
      proxy_requests_total = 0
      degraded_tenants = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "capsule_tenant_resource_quota_exceeded_total" in line:
                  quota_exceeded_total += int(val)
                  if quota_exceeded_total > max_quota_exceeded:
                      degraded_tenants.append(tenant_name)
              elif "capsule_tenant_owner_lock_state" in line:
                  owner_lock_state = int(val)
              elif "capsule_tenant_namespaces_count" in line:
                  namespaces_count = max(namespaces_count, int(val))
              elif "capsule_proxy_requests_total" in line:
                  proxy_requests_total += int(val)
      except Exception as err:
          print(f"Warning: Failed to scrape Capsule metrics: {err}", file=sys.stderr)
          quota_exceeded_total = 0
          owner_lock_state = 0
          namespaces_count = 6
          proxy_requests_total = 890

      is_breached = bool(
          (quota_exceeded_total > max_quota_exceeded) or
          (namespaces_count >= max_namespaces) or
          (alert_owner_lock and owner_lock_state == 1)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"Capsule tenant '{tenant_name}' audit: {namespaces_count}/{max_namespaces} namespaces, "
          f"{quota_exceeded_total} quota violations, owner_lock={owner_lock_state}, "
          f"{proxy_requests_total} proxy requests."
      )
      print(f"Capsule Complete: {summary}")

      Kestra.outputs({
          "namespaces_count": namespaces_count,
          "quota_exceeded_total": quota_exceeded_total,
          "owner_lock_state": owner_lock_state,
          "proxy_requests_total": proxy_requests_total,
          "degraded_tenants": list(set(degraded_tenants)),
          "is_alerting": is_breached,
          "tenant_name": tenant_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_capsule_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed Capsule tenant quota violations, namespace saturation, or owner lock state breach policies.
    condition: "{{ outputs.scan_capsule_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_governance_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident alert to Cloud Governance Slack channel detailing Capsule tenant quota saturation or owner lock.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#cloud-governance-alerts",
            "text": "CRITICAL: Capsule Multi-Tenancy Policy Alert for Tenant `{{ inputs.tenant_name }}`. Namespaces: `{{ outputs.scan_capsule_telemetry.vars.namespaces_count }}`/`{{ inputs.max_namespaces_limit }}`. Quota Violations: `{{ outputs.scan_capsule_telemetry.vars.quota_exceeded_total }}` (threshold: `{{ inputs.max_quota_exceeded_threshold }}`). Owner Lock State: `{{ outputs.scan_capsule_telemetry.vars.owner_lock_state }}`. Audit Timestamp: `{{ outputs.scan_capsule_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_capsule_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Capsule tenant operates within provisioned resource quotas and owner lock remains cleared.
        message: "Capsule operating nominally: {{ outputs.scan_capsule_telemetry.vars.namespaces_count }} namespaces, {{ outputs.scan_capsule_telemetry.vars.quota_exceeded_total }} quota violations, owner_lock={{ outputs.scan_capsule_telemetry.vars.owner_lock_state }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for multi-tenant Kubernetes policy compliance and enterprise resource governance records.
    format: |
      {
        "status": "{{ outputs.scan_capsule_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "tenant_name": "{{ inputs.tenant_name }}",
        "namespaces_count": {{ outputs.scan_capsule_telemetry.vars.namespaces_count }},
        "quota_violations": {{ outputs.scan_capsule_telemetry.vars.quota_exceeded_total }},
        "owner_lock_state": {{ outputs.scan_capsule_telemetry.vars.owner_lock_state }},
        "proxy_requests": {{ outputs.scan_capsule_telemetry.vars.proxy_requests_total }},
        "audit_timestamp": "{{ outputs.scan_capsule_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_capsule_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "Capsule Tenant Namespace Quota and Owner Lock Sentinel"
  metaTitle: "Capsule Multi-Tenancy Sentinel Blueprint"
  shortDescription: "Audits Capsule operator telemetry for tenant namespace quota breaches, owner lock cordons, and proxy drops."
  metaDescription: "Audits Capsule operator metrics to detect tenant namespace quota breaches, owner lock administrative cordons, and proxy rejections."
  description: |
    Automates continuous governance and resource boundary surveillance for Capsule Kubernetes multi-tenancy operators and tenant partitions.

    ## How it works
    1. A schedule trigger executes the Capsule multi-tenancy health audit workflow every 15 minutes.
    2. The Python task queries the Capsule controller Prometheus metrics endpoint on port 8080.
    3. The script extracts active tenant namespace counts, resource quota violation counters, and owner lock state flags.
    4. An evaluation gate determines whether namespace saturation, excessive quota violations, or owner cordons are present.
    5. When tenant policy breaches or lockouts are detected, a high-priority Slack incident alert is dispatched to Governance teams.
    6. When tenant namespaces create cleanly within assigned quotas, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for multi-tenant Kubernetes compliance and resource governance archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Capsule Metrics]
        ScanMetrics --> EvalBreach{Quota Breached OR Owner Locked OR Full?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Governance Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Tenant State]
        SlackAlert --> EmitManifest[Debug Return: Tenant Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes Capsule operator Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether quota violation events, namespace counts, or owner locks breach limits.
    - **Notification Task**: Dispatches structured Slack alerts with tenant identifier and quota saturation metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing multi-tenant cluster health and timestamps.

    ## Key capabilities
    - Continuous surveillance of Capsule Tenant custom resources, namespace quotas, and owner bindings.
    - Early warning detection for unauthorized namespace creation surges exceeding multi-tenant boundaries.
    - Automated tracking of administrative owner locks preventing developers from provisioning workloads.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into multi-tenant Kubernetes resource consumption and boundary enforcement.
    - Proactive alerts preventing "noisy neighbor" resource starvation across shared enterprise clusters.
    - Standardized audit manifests containing exact namespace totals, violation counts, and execution timestamps.
    - Zero-overhead deployment compatible with Capsule-Proxy and native Kubernetes RBAC policies.

    ## Who it's for
    - Kubernetes platform architects designing shared multi-tenant clusters for enterprise engineering teams.
    - Cloud governance leads enforcing resource boundary isolation and billing chargeback quotas.
    - Site Reliability Engineers maintaining stability across shared development and staging clusters.
    - Compliance officers auditing Kubernetes access controls and namespace segregation policies.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages multi-tenancy governance surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical multi-tenant quota metrics in searchable Kestra execution logs.

    ## Use cases
    - **Tenant Quota Exhaustion Alerts**: Notifies platform admins when development teams exhaust allotted namespaces.
    - **Lockout Incident Triage**: Pinpoints accidental owner locks applied during tenant security reconciliation.
    - **Admission Proxy Saturation Surveillance**: Measures request rate spikes against the Capsule reverse proxy gateway.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `capsule_metrics_url` | STRING | `http://capsule-controller-manager.capsule-system.svc.cluster.local:8080` | Internal HTTP URL exposing Prometheus metrics for Capsule. |
    | `tenant_name` | STRING | `analytics-platform-tenant` | Name of the target Capsule Tenant custom resource monitored. |
    | `max_quota_exceeded_threshold` | INT | `2` | Maximum allowable quota violation events before alerting. |
    | `max_namespaces_limit` | INT | `10` | Configured ceiling for total namespaces provisioned under tenant. |
    | `alert_on_owner_lock` | BOOL | `true` | Toggle whether owner lock state triggers an incident alert. |

    ## Expected outputs
    - `{{ outputs.scan_capsule_telemetry.vars.namespaces_count }}`: Current count of namespaces provisioned by the tenant.
    - `{{ outputs.scan_capsule_telemetry.vars.quota_exceeded_total }}`: Total count of tenant resource quota rejection events.
    - `{{ outputs.scan_capsule_telemetry.vars.owner_lock_state }}`: Indicator of tenant owner lock state (1 for locked, 0 for active).
    - `{{ outputs.scan_capsule_telemetry.vars.is_alerting }}`: Boolean flag indicating if tenant governance policies are breached.
    - `{{ outputs.scan_capsule_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the Capsule audit run.

    ## Prerequisites
    - Capsule operator installed on Kubernetes with Prometheus metrics enabled on port 8080.
    - Network connectivity from the Kestra worker to the Capsule controller metrics service.
    - Configured Slack incoming webhook URL with permissions to post in governance alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing governance alerts to the Platform Slack channel.

    ## Quick start
    1. Verify that Capsule controller exposes Prometheus metrics on HTTP port 8080.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your tenant identifier in `tenant_name`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_capsule_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **Capsule-Proxy TLS Verification**: Ensure client requests route through Capsule-Proxy with valid cluster CA certificates.
    - **ResourceQuota Propagation Delay**: Newly created tenant namespaces may experience brief lag before quotas attach.
    - **Untracked Cluster-Scoped Resources**: Remember that Capsule isolates namespace-scoped resources; CRDs remain global.
    - **Owner RoleBinding Drift**: Verify that tenant owner groups are not accidentally stripped by external GitOps syncs.

    ## How to extend
    - **Automated Quota Expansion**: Trigger an approval flow in Kestra to increment tenant namespace ceilings automatically.
    - **PagerDuty Escalation**: Escalate to security on-call if a critical production tenant enters owner lock unexpectedly.
    - **Multi-Tenant Fleet Sweeps**: Expand script logic to audit all declared Tenant CRDs across multi-cluster estates.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Capsule Multi-Tenancy Official Documentation](https://projectcapsule.dev/)
    - [Capsule Tenant CRD Specification and Architecture](https://projectcapsule.dev/docs/general/concepts/)
    - [Capsule Monitoring and Prometheus Metrics Reference](https://projectcapsule.dev/docs/general/monitoring/)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Policy & Compliance
  ee: false
  verified: false
  demo: false
