id: resend-transactional-email-dispatch-from-postgres
namespace: company.notifications

description: |
  Polls pending transactional emails from a PostgreSQL outbox queue, dispatches each via the Resend API,
  and updates delivery IDs and status codes back to PostgreSQL with rate-limit protection.

extend:
  title: Resend Transactional Email Dispatch Pipeline from PostgreSQL Outbox
  metaTitle: Resend Email Dispatch from PostgreSQL Outbox | Kestra
  shortDescription: Dispatches transactional emails from a PostgreSQL outbox queue via Resend API and records delivery IDs and statuses back to PostgreSQL.
  metaDescription: Poll pending emails from a PostgreSQL outbox table, send via Resend v1 API, and write delivery IDs and statuses back to PostgreSQL with Kestra.
  description: |
    Transactional notifications (welcome emails, password resets, order confirmations) are critical
    for user engagement. Directly sending emails inside synchronous web request threads introduces
    latency, risks lost messages during network blips, and easily trips API rate limits.

    The **Transactional Outbox Pattern** solves this by having application servers write notification
    jobs into an ACID-compliant PostgreSQL table. This blueprint acts as the decoupled delivery engine:
    it polls pending outbox rows in FIFO order, dispatches each message through the developer-first
    **Resend REST API**, captures Resend's unique delivery identifier, updates the database status,
    and handles retries and rate limiting gracefully.

    ## How it works

    1. **Queue Schema Initialization**: An `io.kestra.plugin.jdbc.postgresql.Query` task ensures the
       `email_outbox` table and performance index exist with proper status and retry columns.
    2. **Outbox Batch Fetch**: Queries up to `batch_size` pending rows (`status = 'PENDING'` and
       `retry_count < 3`) ordered by `created_at ASC` (FIFO).
    3. **Sequential Controlled Dispatch**: Uses `io.kestra.plugin.core.flow.EachSequential` to iterate
       over pending items, preventing API burst rate-limit errors (Resend enforces 2-10 requests/second
       based on plan tier).
    4. **Resend API Integration**: Sends an `io.kestra.plugin.core.http.Request` to `POST https://api.resend.com/emails`
       with the recipient, subject, HTML body, and tags.
    5. **Database State Writeback**: A conditional `io.kestra.plugin.core.flow.If` inspects the HTTP response.
       On HTTP 200/201, it updates `status = 'SENT'`, records `resend_id`, and sets `sent_at = NOW()`.
       On non-200 responses, it increments `retry_count` and logs the error payload.
    6. **Observability and Slack Digest**: An `io.kestra.plugin.slack.notifications.SlackIncomingWebhook`
       posts a run summary highlighting total dispatched, pending, and failed deliveries.

    ## What you get

    - **Zero Lost Emails**: Decouples web application commits from external third-party API availability.
    - **Auditability & Traceability**: Every email in PostgreSQL is tagged with Resend's delivery ID for webhook correlation.
    - **Rate Limit Compliance**: Controlled sequencing prevents 429 Too Many Requests errors.
    - **Automated Dead-Letter Handling**: Messages exceeding max retries are flagged for manual operator review.

    ## Who it's for

    - **Full-Stack & Backend Developers** building user notification systems in Next.js, Node.js, Python, or Go.
    - **DevOps & Platform Engineers** maintaining resilient transactional messaging pipelines.
    - **Growth & Marketing Ops** orchestrating automated lifecycle communication campaigns.

    ## Why orchestrate this with Kestra

    Instead of maintaining custom daemon workers with complex connection pooling, sleep loops, and restart logic,
    Kestra delivers:
    - **Declarative Scheduling & Triggers**: Run every minute, every 5 minutes, or on webhook events without infrastructure overhead.
    - **Transparent Execution History**: Inspect every dispatched payload, HTTP response code, and error trace in the visual UI.
    - **Built-in Secret Masking**: Resend API tokens and database credentials are fully secured and never exposed in execution logs.

    ## Prerequisites

    - A PostgreSQL 13+ database accessible from the Kestra worker.
    - A verified domain and API key from [Resend](https://resend.com).

    ### Secrets

    - `RESEND_API_KEY`: Resend API token with permission to send emails (`re_...`).
    - `POSTGRES_HOST`: PostgreSQL database hostname or IP address.
    - `POSTGRES_PORT`: PostgreSQL port (default: `5432`).
    - `POSTGRES_DB`: Target database name.
    - `POSTGRES_USER`: Database username.
    - `POSTGRES_PASSWORD`: Database password.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for batch dispatch reporting.

    ## Quick start

    1. Configure the database and Resend secrets in your Kestra namespace.
    2. Import this blueprint into Kestra.
    3. Click **Execute** to initialize the table schema and run an initial dispatch cycle.
    4. Verify that pending rows in `email_outbox` transition to `SENT` with valid `resend_id` values.
    5. Enable the 5-minute schedule trigger for automated background polling.

    ## How to extend

    - **Webhook Event Ingestion**: Add a Kestra Webhook trigger to receive Resend delivery, bounce, and click webhooks, updating your PostgreSQL `email_outbox` rows in real time.
    - **Dynamic Templates**: Store React Email templates in Git and render them dynamically before dispatch.
    - **Audience Segmentation**: Add query filters to dispatch targeted announcements based on user activity tiers.

    ## Links

    - [Resend REST API Documentation](https://resend.com/docs/api-reference/emails/send-email)
    - [Kestra PostgreSQL Plugin](https://kestra.io/plugins/plugin-jdbc-postgres/io.kestra.plugin.jdbc.postgresql.query)
    - [Kestra HTTP Plugin](https://kestra.io/plugins/core/io.kestra.plugin.core.http.request)
  tags:
    - Business
  subTags:
    - CRM & Marketing Ops
    - Reporting & Digests
  ee: false
  demo: false

inputs:
  - id: batch_size
    type: INT
    defaults: 25
    description: "Maximum number of pending email jobs to process per execution run."
  - id: sender_email
    type: STRING
    defaults: "notifications@updates.company.com"
    description: "Verified sender email address configured in Resend."

tasks:
  - id: prepare_outbox_table
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "jdbc:postgresql://{{ secret('POSTGRES_HOST') }}:{{ secret('POSTGRES_PORT') }}/{{ secret('POSTGRES_DB') }}"
    username: "{{ secret('POSTGRES_USER') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    sql: |
      CREATE TABLE IF NOT EXISTS email_outbox (
          id SERIAL PRIMARY KEY,
          recipient_email VARCHAR(255) NOT NULL,
          subject VARCHAR(500) NOT NULL,
          html_content TEXT NOT NULL,
          status VARCHAR(50) DEFAULT 'PENDING',
          retry_count INT DEFAULT 0,
          resend_id VARCHAR(100),
          error_message TEXT,
          created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
          sent_at TIMESTAMP WITH TIME ZONE
      );
      CREATE INDEX IF NOT EXISTS idx_email_outbox_status_created 
      ON email_outbox(status, created_at) WHERE status = 'PENDING';

  - id: fetch_pending_emails
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "jdbc:postgresql://{{ secret('POSTGRES_HOST') }}:{{ secret('POSTGRES_PORT') }}/{{ secret('POSTGRES_DB') }}"
    username: "{{ secret('POSTGRES_USER') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      SELECT id, recipient_email, subject, html_content
      FROM email_outbox
      WHERE status = 'PENDING' AND retry_count < 3
      ORDER BY created_at ASC
      LIMIT {{ inputs.batch_size }};

  - id: process_email_queue
    type: io.kestra.plugin.core.flow.EachSequential
    value: "{{ outputs.fetch_pending_emails.rows }}"
    tasks:
      - id: send_via_resend
        type: io.kestra.plugin.core.http.Request
        uri: "https://api.resend.com/emails"
        method: POST
        headers:
          Authorization: "Bearer {{ secret('RESEND_API_KEY') }}"
          Content-Type: "application/json"
        body: |
          {
            "from": "{{ inputs.sender_email }}",
            "to": ["{{ taskrun.value.recipient_email }}"],
            "subject": "{{ taskrun.value.subject }}",
            "html": "{{ taskrun.value.html_content | replace('"', '\\\"') }}"
          }
        allowFailed: true

      - id: evaluate_dispatch_outcome
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.send_via_resend[taskrun.value.id].code == 200 or outputs.send_via_resend[taskrun.value.id].code == 201 }}"
        then:
          - id: mark_as_sent
            type: io.kestra.plugin.jdbc.postgresql.Query
            url: "jdbc:postgresql://{{ secret('POSTGRES_HOST') }}:{{ secret('POSTGRES_PORT') }}/{{ secret('POSTGRES_DB') }}"
            username: "{{ secret('POSTGRES_USER') }}"
            password: "{{ secret('POSTGRES_PASSWORD') }}"
            sql: |
              UPDATE email_outbox
              SET status = 'SENT',
                  resend_id = '{{ outputs.send_via_resend[taskrun.value.id].body.id }}',
                  sent_at = NOW()
              WHERE id = {{ taskrun.value.id }};
        else:
          - id: mark_as_failed
            type: io.kestra.plugin.jdbc.postgresql.Query
            url: "jdbc:postgresql://{{ secret('POSTGRES_HOST') }}:{{ secret('POSTGRES_PORT') }}/{{ secret('POSTGRES_DB') }}"
            username: "{{ secret('POSTGRES_USER') }}"
            password: "{{ secret('POSTGRES_PASSWORD') }}"
            sql: |
              UPDATE email_outbox
              SET retry_count = retry_count + 1,
                  error_message = 'HTTP {{ outputs.send_via_resend[taskrun.value.id].code }}',
                  status = CASE WHEN retry_count + 1 >= 3 THEN 'EXHAUSTED' ELSE 'PENDING' END
              WHERE id = {{ taskrun.value.id }};

  - id: notify_slack_summary
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "📬 *Resend Outbox Dispatch Completed*",
        "blocks": [
          {
            "type": "section",
            "text": {
              "type": "mrkdwn",
              "text": "*Transactional Email Dispatch Run Summary*\n• *Batch Size Requested:* `{{ inputs.batch_size }}`\n• *Processed Queue Count:* `{{ outputs.fetch_pending_emails.size }}` emails\n• *Sender:* `{{ inputs.sender_email }}`\n• *Timestamp:* `{{ now() }}`"
            }
          }
        ]
      }

triggers:
  - id: poll_outbox_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true
