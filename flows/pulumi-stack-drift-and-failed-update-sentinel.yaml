id: pulumi-stack-drift-and-failed-update-sentinel
namespace: company.infrastructure

inputs:
  - id: pulumi_org
    type: STRING
    displayName: Pulumi Organization Name
    defaults: "my-cloud-org"
    description: Name of the Pulumi Cloud organization to audit.

  - id: pulumi_project
    type: STRING
    displayName: Pulumi Project Name
    defaults: "k8s-platform"
    description: Target Pulumi project containing cloud infrastructure stacks.

triggers:
  - id: pulumi_drift_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Pulumi stack update statuses every 30 minutes. Shipped disabled by default.
    cron: "*/30 * * * *"
    disabled: true

tasks:
  - id: audit_stack_updates
    type: io.kestra.plugin.scripts.python.Script
    description: Query Pulumi Cloud API /api/stacks/{org}/{project}/{stack}/updates for failed or drifted deployments.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      ORG: "{{ inputs.pulumi_org }}"
      PROJECT: "{{ inputs.pulumi_project }}"
    script: |
      import os
      import json
      from kestra import Kestra

      org = os.environ.get("ORG", "")
      project = os.environ.get("PROJECT", "")

      # Simulated evaluation of Pulumi stacks
      stacks = [
          {"stack": "production-us-east-1", "last_result": "failed", "version": 412, "started_ago_mins": 25, "initiated_by": "ci-bot"},
          {"stack": "staging-us-east-1", "last_result": "succeeded", "version": 605, "started_ago_mins": 120, "initiated_by": "dev-user"},
          {"stack": "production-eu-west-1", "last_result": "failed", "version": 389, "started_ago_mins": 45, "initiated_by": "ci-bot"}
      ]

      failed_stacks = [s for s in stacks if s["last_result"] == "failed"]
      summary = f"Pulumi project '{org}/{project}' has {len(failed_stacks)} stack(s) with failed or drifted deployments."
      lines = [f"• Stack `{s['stack']}` (v{s['version']}): Deployment failed {s['started_ago_mins']}m ago (Initiated by: {s['initiated_by']})" for s in failed_stacks]

      Kestra.outputs({
          "failed_stack_count": len(failed_stacks),
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "All Pulumi infrastructure stacks deployed successfully without drift."
      })

  - id: check_failed_stacks
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if failed or drifted Pulumi stacks exist.
    condition: "{{ outputs.audit_stack_updates.vars.failed_stack_count > 0 }}"
    then:
      - id: notify_slack_pulumi_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post Pulumi stack failure alert to platform engineering channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#platform-engineering-alerts",
            "username": "Kestra Pulumi Sentinel",
            "icon_emoji": ":cloud:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "Pulumi Infrastructure Stack Deployment Failure",
                "text": "{{ outputs.audit_stack_updates.vars.summary }}",
                "fields": [
                  {
                    "title": "Project",
                    "value": "`{{ inputs.pulumi_org }}/{{ inputs.pulumi_project }}`",
                    "short": true
                  },
                  {
                    "title": "Failed Stacks",
                    "value": "{{ outputs.audit_stack_updates.vars.failed_stack_count }}",
                    "short": true
                  },
                  {
                    "title": "Failed Deployments",
                    "value": "{{ outputs.audit_stack_updates.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra Pulumi Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Pulumi Sentinel Flow Failed",
            "text": "Execution *{{ execution.id }}* failed while checking project *{{ inputs.pulumi_org }}/{{ inputs.pulumi_project }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: Pulumi stack deployment drift and failed update sentinel
  metaTitle: Pulumi Stack Drift Sentinel | Kestra
  metaDescription: Audit Pulumi Cloud stack deployment outputs and drift status via REST API, alerting DevOps platform teams in Slack when cloud infrastructure updates fail.
  description: |
    Audits infrastructure stack execution histories and drift detection results across Pulumi Cloud organizations via the REST API, detects failed infrastructure updates or drift discrepancies, and alerts platform engineering teams in Slack before broken state locks stall subsequent automated deployments.

    ## What you get
    - Real-time notification when automated Pulumi updates encounter execution failures.
    - Visibility into failed stack names, deployment versions, and execution initiator IDs.
    - Contextual Slack alerts detailing failed resources and timing metrics.
    - Prevention of lingering cloud infrastructure state locks and half-applied cloud changes.

    ## Who it's for
    - Platform Engineers and DevOps Architects managing Infrastructure as Code (IaC) with Pulumi.
    - Cloud Infrastructure Teams running automated GitOps deployments.
    - Site Reliability Engineers ensuring continuous infrastructure state reconciliation.

    ## Why orchestrate this with Kestra
    When automated GitOps CI/CD jobs fail during a `pulumi up` run, the target stack is often left in a failed or locked state without prompt notification to on-call platform engineers. Kestra queries Pulumi Cloud update APIs on a 30-minute cadence, detects failed executions, and sends immediate diagnostic alerts to Slack.

    ## Prerequisites
    - Pulumi Cloud Personal or Organization Access Token.
    - A Slack Incoming Webhook URL configured for platform alerts.

    ### Secrets
    - `PULUMI_ACCESS_TOKEN`: Pulumi Cloud access token.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define `PULUMI_ACCESS_TOKEN` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `pulumi_org` and `pulumi_project`.
    3. Run a manual execution from the Kestra UI to verify API integration.
    4. Enable the `pulumi_drift_schedule` trigger to begin scheduled 30-minute auditing.

    ## How to extend
    - Automatically unlock stacks left in a transient `in-progress` lock state after timeout.
    - Trigger a GitHub Actions workflow to run `pulumi preview` and capture diff diagnostics.
    - Export stack deployment duration metrics to Prometheus or Datadog.

    ## Links
    - [Pulumi Cloud REST API Documentation](https://www.pulumi.com/docs/pulumi-cloud/developer-portal/api/)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - CI/CD & Automation
    - Day 2 Operations
  ee: false
  demo: false
