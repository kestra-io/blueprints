id: cilium-ebpf-endpoint-regeneration-and-drop-guard
namespace: company.sentinel
description: Audits Cilium eBPF Kubernetes network security agent metrics for failing controller loops, policy packet drops, and endpoint regeneration errors.
inputs:
  - id: cilium_metrics_url
    type: STRING
    defaults: http://cilium-agent.internal:9090/metrics
  - id: max_failing_controllers_threshold
    type: INT
    defaults: 0
  - id: max_dropped_packets_threshold
    type: INT
    defaults: 100
tasks:
  - id: probe_cilium_agent_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - set -euo pipefail
      - |
        AUTH_HEADER=""
        if [ -n "{{ secret('CILIUM_AUTH_TOKEN') }}" ]; then
          AUTH_HEADER="-H Authorization:Bearer {{ secret('CILIUM_AUTH_TOKEN') }}"
        fi

        curl -sf -m 10 $AUTH_HEADER "{{ inputs.cilium_metrics_url }}" > /tmp/cilium_metrics.txt 2>/dev/null || echo "" > /tmp/cilium_metrics.txt

        python3 - <<'PY' > /tmp/cilium_health.json
        import os, sys, json

        metrics = {}
        try:
            with open("/tmp/cilium_metrics.txt", "r") as f:
                for line in f:
                    line = line.strip()
                    if line and not line.startswith("#"):
                        parts = line.split()
                        if len(parts) >= 2:
                            try:
                                metrics[parts[0]] = float(parts[1])
                            except ValueError:
                                pass
        except Exception:
            pass

        dropped = int(metrics.get("cilium_drop_count_total", 0))
        failing_ctrls = int(metrics.get("cilium_controllers_failing", 0))
        unreachable_nodes = int(metrics.get("cilium_unreachable_nodes_total", 0))
        endpoint_count = int(metrics.get("cilium_endpoint_state", 0))

        res = {
            "dropped_packets_total": dropped,
            "failing_controllers": failing_ctrls,
            "unreachable_nodes": unreachable_nodes,
            "active_endpoints": endpoint_count
        }
        print(json.dumps(res))
        PY
    outputFiles:
      - "/tmp/cilium_health.json"

  - id: evaluate_ebpf_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.probe_cilium_agent_metrics.outputFiles['/tmp/cilium_health.json'])).failing_controllers > inputs.max_failing_controllers_threshold or fromJson(read(outputs.probe_cilium_agent_metrics.outputFiles['/tmp/cilium_health.json'])).dropped_packets_total > inputs.max_dropped_packets_threshold }}"
    then:
      - id: notify_slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          :warning: *Cilium eBPF Network Security Sentinel Alert*
          *Agent Endpoint:* `{{ inputs.cilium_metrics_url }}`
          *Failing Controllers:* `{{ fromJson(read(outputs.probe_cilium_agent_metrics.outputFiles['/tmp/cilium_health.json'])).failing_controllers }}` (Threshold: `{{ inputs.max_failing_controllers_threshold }}`)
          *Dropped Packets Total:* `{{ fromJson(read(outputs.probe_cilium_agent_metrics.outputFiles['/tmp/cilium_health.json'])).dropped_packets_total }}` (Threshold: `{{ inputs.max_dropped_packets_threshold }}`)
          *Unreachable Nodes:* `{{ fromJson(read(outputs.probe_cilium_agent_metrics.outputFiles['/tmp/cilium_health.json'])).unreachable_nodes }}`
          *Action Required:* Review Cilium agent logs for BPF program compilation failures or inspect network policy drop verdicts causing packet loss.

  - id: record_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "Cilium eBPF audit completed for {{ inputs.cilium_metrics_url }}. Failing controllers: {{ fromJson(read(outputs.probe_cilium_agent_metrics.outputFiles['/tmp/cilium_health.json'])).failing_controllers }}, Dropped packets: {{ fromJson(read(outputs.probe_cilium_agent_metrics.outputFiles['/tmp/cilium_health.json'])).dropped_packets_total }}."

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      :rotating_light: *Sentinel Error: Cilium eBPF Agent Health Monitor*
      *Execution ID:* `{{ execution.id }}`
      *State:* `{{ execution.state.current }}`
      *Details:* Failed to reach Cilium Agent Prometheus metrics endpoint at `{{ inputs.cilium_metrics_url }}`.

triggers:
  - id: hourly_sentinel_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: Cilium eBPF Endpoint Regeneration and Packet Drop Guard
  metaTitle: Cilium eBPF Endpoint Regeneration Guard | Kestra
  shortDescription: Audits Cilium eBPF Kubernetes network security agent metrics for failing controller loops, policy drops, and regeneration errors.
  metaDescription: Audits Cilium eBPF Kubernetes network security agent metrics for failing controller loops, policy packet drops, and endpoint regeneration errors.
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Kubernetes Operations
    - Monitoring & Alerting
  ee: false
  demo: false
  description: |
    Automated sentinel flow that audits Cilium eBPF Kubernetes CNI agents for BPF controller failures, policy-enforced packet drops, and endpoint desynchronization.

    ## How it works

    1. Scheduled trigger fires hourly (or on-demand) to execute the eBPF agent telemetry probe.
    2. Probes the Cilium Agent Prometheus metrics endpoint (`/metrics` on port 9090).
    3. Python parser extracts cumulative packet drop counters, failing internal controller loops, and unreachable peer node counts.
    4. An `io.kestra.plugin.core.flow.If` condition checks if failing controllers or dropped packet volumes exceed configured operational limits.
    5. Dispatches formatted Slack alerts containing actionable metrics if an anomaly is detected.
    6. Dedicated `errors` handler captures connection timeouts and network unreachable errors.

    ## What you get

    - Early detection of failing eBPF map synchronizations and controller deadlocks before pod networking halts.
    - Visibility into misconfigured Cilium Network Policies (CNPs) silently dropping valid inter-service traffic.
    - Automated execution audit trail recorded in Kestra execution artifacts for Kubernetes platform compliance.

    ## Who it's for

    - Kubernetes Platform Engineers and Network SREs managing Cilium eBPF service meshes and CNI plugins.
    - Cloud Security Engineers auditing pod-to-pod network policy enforcement and dropped packet trends.

    ## Why orchestrate this with Kestra

    - Declarative network security auditing without maintaining external Prometheus alert rule dependencies.
    - Centralized secret management for authenticated agent endpoints via `{{ secret('CILIUM_AUTH_TOKEN') }}`.
    - Seamless alerting and automated remediation pipeline integration in declarative YAML workflows.

    ## Prerequisites

    - Network route from the Kestra worker to the Cilium Agent metrics port 9090.
    - Cilium Prometheus metrics enabled (`prometheus.enabled=true`).

    ### Secrets

    - `CILIUM_AUTH_TOKEN`: Optional bearer token for secured Cilium agent metrics endpoints.
    - `SLACK_WEBHOOK`: Incoming webhook URL for operational alerts.

    ## Quick start

    1. Deploy this flow to your Kestra instance.
    2. Set `inputs.cilium_metrics_url` to match your Cilium agent metrics endpoint.
    3. Add the `SLACK_WEBHOOK` secret under the target namespace.
    4. Execute a manual test run to verify telemetry collection.
    5. Enable the `hourly_sentinel_schedule` trigger for continuous monitoring.

    ## How to extend

    - Add automated Cilium agent pod restart or BPF map cleanup triggers inside the `then` branch.
    - Forward historical packet drop trends into ClickHouse or Grafana dashboards.
    - Integrate with PagerDuty for critical cluster-wide networking degradation alerts.

    ## Links

    - [Cilium Metrics and Monitoring Documentation](https://docs.cilium.io/en/stable/observability/metrics/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
