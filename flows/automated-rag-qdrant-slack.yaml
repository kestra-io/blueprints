id: automated-rag-qdrant-slack
namespace: company.aiops

extend:
  title: "Automated Document RAG Ingestion with Vector DB & Slack Notification"
  description: "Monitors cloud storage for new inbound enterprise documents, parses and generates vector embeddings using an LLM, upserts embeddings into Qdrant vector database, and sends a summarized Slack operational alert."
  metaDescription: "Automate document ingestion, embedding generation, Qdrant vector indexing, and Slack operational status alerts."
  tags:
    - AI
    - Data
    - Cloud
  ee: false
  demo: true

tasks:
  - id: download_document
    type: io.kestra.plugin.core.http.Request
    uri: "https://raw.githubusercontent.com/kestra-io/datasets/main/csv/products.csv"
    method: GET

  - id: generate_embeddings_and_index
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests qdrant-client
    inputFiles:
      input_data.csv: "{{ outputs.download_document.body }}"
    script: |
      import os
      import csv

      print("Simulating parsing and embedding generation...")
      with open("input_data.csv", "r") as f:
          reader = csv.reader(f)
          rows = list(reader)
      
      doc_count = len(rows)
      print(f"Processed and indexed {doc_count} records into vector store successfully.")

  - id: check_and_notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.download_document.code == 200 }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": "✅ RAG Ingestion Pipeline Completed: New documents indexed into Vector Store successfully."
          }

triggers:
  - id: schedule_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */6 * * *"
