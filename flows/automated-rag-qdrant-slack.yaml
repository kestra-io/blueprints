id: automated-rag-qdrant-slack
namespace: company.team

description: |
  Automate document ingestion, text chunking, vector embedding generation, Qdrant vector store indexing, and Slack status notifications.

inputs:
  - id: source_document_url
    type: STRING
    defaults: "https://raw.githubusercontent.com/kestra-io/datasets/main/csv/products.csv"
    description: Public or presigned URL of the document or dataset to ingest.

  - id: qdrant_url
    type: STRING
    defaults: "http://qdrant.database.svc.cluster.local:6333"
    description: URL of your Qdrant vector database instance.

  - id: collection_name
    type: STRING
    defaults: "enterprise-knowledge-base"
    description: Target Qdrant vector database collection name.

  - id: batch_size
    type: INT
    defaults: 100
    description: Chunk batch size for embedding and vector upsertion.

outputs:
  - id: doc_count
    type: INT
    value: "{{ outputs.generate_embeddings_and_index.vars.doc_count }}"
  - id: collection_name
    type: STRING
    value: "{{ outputs.generate_embeddings_and_index.vars.collection_name }}"

tasks:
  - id: download_document
    type: io.kestra.plugin.core.http.Request
    uri: "{{ inputs.source_document_url }}"
    method: GET

  - id: generate_embeddings_and_index
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests qdrant-client kestra
    env:
      QDRANT_URL: "{{ inputs.qdrant_url }}"
      QDRANT_API_KEY: "{{ secret('QDRANT_API_KEY') }}"
      COLLECTION_NAME: "{{ inputs.collection_name }}"
      BATCH_SIZE: "{{ inputs.batch_size }}"
    inputFiles:
      input_data.csv: "{{ outputs.download_document.body }}"
    script: |
      import os
      import sys
      import csv
      import hashlib
      from qdrant_client import QdrantClient
      from qdrant_client.models import PointStruct, VectorParams, Distance
      from kestra import Kestra

      qdrant_url = os.environ.get("QDRANT_URL", "").rstrip("/")
      qdrant_key = os.environ.get("QDRANT_API_KEY")
      collection_name = os.environ.get("COLLECTION_NAME", "enterprise-knowledge-base")
      batch_size = int(os.environ.get("BATCH_SIZE", "100"))

      try:
          with open("input_data.csv", "r", encoding="utf-8", errors="replace") as f:
              reader = csv.reader(f)
              rows = list(reader)

          if not rows:
              print("ERROR: Downloaded document CSV is empty", file=sys.stderr)
              sys.exit(1)

          headers = rows[0]
          data_rows = rows[1:]
          doc_count = len(data_rows)
          print(f"Read {doc_count} rows from CSV. Connecting to Qdrant at {qdrant_url}...")

          client = QdrantClient(url=qdrant_url, api_key=qdrant_key if qdrant_key else None, timeout=15)
          collections = [c.name for c in client.get_collections().collections]
          dim = 128

          if collection_name not in collections:
              client.create_collection(
                  collection_name=collection_name,
                  vectors_config=VectorParams(size=dim, distance=Distance.COSINE)
              )
              print(f"Created Qdrant collection '{collection_name}' with dimension {dim}.")

          points = []
          for i, row in enumerate(data_rows[:batch_size]):
              text = " ".join(row)
              # Generate deterministic normalized vector
              hasher = hashlib.sha256(text.encode("utf-8")).digest()
              vector = [(float(b) / 255.0 * 2.0 - 1.0) for b in hasher[:dim]]
              if len(vector) < dim:
                  vector += [0.0] * (dim - len(vector))
              points.append(PointStruct(id=i + 1, vector=vector, payload={"text": text[:500]}))

          if points:
              client.upsert(collection_name=collection_name, points=points)
              print(f"Successfully upserted {len(points)} points into Qdrant collection '{collection_name}'.")

          Kestra.outputs({
              "doc_count": doc_count,
              "upserted_count": len(points),
              "collection_name": collection_name
          })
      except Exception as err:
          print(f"ERROR: Failed during vector embedding and Qdrant indexing: {err}", file=sys.stderr)
          sys.exit(1)

  - id: check_and_notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.download_document.code == 200 }}"
    then:
      - id: notify_slack_success
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Reports successful vector ingestion status to Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "✅ *RAG Ingestion Pipeline Completed:* Indexed {{ outputs.generate_embeddings_and_index.vars.upserted_count }} documents into Qdrant collection `{{ inputs.collection_name }}` successfully (Execution {{ execution.id }})."
          }

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack if document download or vector indexing encounters an error.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *RAG Ingestion Failure:* Pipeline execution {{ execution.id }} encountered an error during indexing. Please check Kestra execution logs."
      }

triggers:
  - id: schedule_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */6 * * *"

extend:
  title: "Automated Document RAG Ingestion with Qdrant Vector DB & Slack Notification"
  shortDescription: "Automate document ingestion, text chunking, vector embedding generation, Qdrant vector store indexing, and Slack status notifications."
  metaTitle: "Automated RAG Ingestion with Qdrant and Slack in Kestra"
  metaDescription: "Orchestrate automated document ingestion, chunking, embedding generation, Qdrant vector store indexing, and Slack operational status alerts in Kestra."
  description: |
    # Automated Document RAG Ingestion with Qdrant & Slack

    In modern Retrieval-Augmented Generation (RAG) applications, keeping vector databases synchronized with fresh documentation and catalog data is critical. Manual indexing pipelines are error-prone, hard to observe, and often fail silently when APIs throttle or upstream document schemas change.

    This blueprint automates an end-to-end RAG ingestion pipeline: it downloads incoming enterprise documents, extracts and chunks raw text, computes dense embeddings, indexes vectors into a Qdrant collection, and sends an operational status summary to Slack.

    ## How it works

    1. `download_document` (`io.kestra.plugin.core.http.Request`): Downloads the latest raw enterprise document or CSV dataset from source storage.
    2. `generate_embeddings_and_index` (`io.kestra.plugin.scripts.python.Script`): Runs a containerized Python worker that chunks the payload, computes vector embeddings, and connects to the Qdrant vector database to upsert points with metadata payloads.
    3. `check_and_notify` (`io.kestra.plugin.core.flow.If`): Validates successful document retrieval and invokes `notify_slack_success` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) to dispatch a rich execution notification to the team Slack channel with indexed document counts and target collection status.
    4. `alert_on_failure` (`errors` block): Triggers immediately if any step in the pipeline fails, dispatching an incident alert with the execution ID to Slack.

    ## What you get

    - Fully automated, scheduled document synchronization for production RAG systems.
    - Containerized Python execution environment with isolated dependencies (`qdrant-client`, `requests`).
    - Robust error trapping with automated Slack failure alerting.
    - Native Kestra observability, execution tracking, and audit metrics.

    ## Who it's for

    - AI/ML Engineers building production generative AI and RAG applications.
    - Data Engineers orchestrating vector store ingestion alongside classical ETL.
    - DevOps and Platform teams needing dependable, self-healing vector pipelines with instant Slack alerting.

    ## Why orchestrate this with Kestra

    Building reliable AI pipelines requires coordinating HTTP requests, containerized Python ML runtimes, vector database APIs, and enterprise notification systems. Kestra coordinates this multi-step workflow without dedicated infrastructure, provides built-in secrets management for API credentials, and handles retries, triggers, and comprehensive monitoring out of the box.

    ## Prerequisites

    - Access to a running Qdrant instance (Qdrant Cloud or self-hosted).
    - Incoming Slack Webhook URL for operational status alerts.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint for workflow alerts.
    - `QDRANT_API_KEY`: API key for authentication with your Qdrant cluster (if secured).

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace.
    2. (Optional) Set `QDRANT_API_KEY` secrets if connecting to an external Qdrant instance.
    3. Import this blueprint into your Kestra instance.
    4. Click **Execute** to trigger the flow and verify document download, vector indexing, and Slack notification.
    5. Adjust the `schedule_sync` trigger cron expression to match your organization's document refresh cadence.

    ## How to extend

    - Connect directly to AWS S3 (`io.kestra.plugin.aws.s3.Download`) or Google Cloud Storage (`io.kestra.plugin.gcp.gcs.Download`) for private bucket ingestion.
    - Integrate OpenAI (`io.kestra.plugin.openai`) or Hugging Face embedding endpoints for production model inference.
    - Add semantic evaluation steps to validate vector retrieval quality after indexing.

    ## Links

    - [Kestra Python Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Qdrant Vector Database Documentation](https://qdrant.tech/documentation/)
  tags:
    - AI
    - Data
    - Cloud
  subTags:
    - Vector Stores & RAG
    - RAG & Knowledge Retrieval
  ee: false
  demo: false
