id: http-redirect-chain-audit
namespace: company.team
description: |
  Follow an HTTP redirect chain, detect loops and excessive hops, and preserve
  the final destination and every intermediate URL for operations review.

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "30 6 * * *"
    disabled: true

inputs:
  - id: url
    type: STRING
    description: Starting URL to inspect.
    defaults: https://example.com
    required: true
  - id: max_hops
    type: INT
    description: Maximum permitted redirects.
    defaults: 3
    required: true
  - id: notify_slack
    type: BOOL
    description: Alert when the chain fails or exceeds max_hops.
    defaults: true

tasks:
  - id: inspect_redirects
    type: io.kestra.plugin.scripts.python.Script
    description: Follow redirects hop-by-hop without losing intermediate responses.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests
    env:
      URL: "{{ inputs.url }}"
      MAX_HOPS: "{{ inputs.max_hops }}"
    outputFiles:
      - redirect_chain_report.json
    script: |
      import os
      import sys
      import json
      import requests
      import urllib.parse
      from kestra import Kestra

      start_url = os.environ.get("URL", "https://example.com")
      max_hops = int(os.environ.get("MAX_HOPS", 3))

      session = requests.Session()
      chain = []
      seen = set()
      current = start_url
      error = None

      for hop in range(max_hops + 2):
          if current in seen:
              error = f"Redirect loop detected at: {current}"
              break
          seen.add(current)

          try:
              resp = session.get(current, allow_redirects=False, timeout=20, headers={"User-Agent": "kestra-redirect-chain-audit"})
              status = resp.status_code
              loc = resp.headers.get("Location")
              resolved_loc = urllib.parse.urljoin(current, loc) if loc else None
              chain.append({
                  "hop": hop,
                  "url": current,
                  "status": status,
                  "location": loc,
                  "resolved_location": resolved_loc
              })
              if status in (301, 302, 303, 307, 308) and resolved_loc:
                  current = resolved_loc
              else:
                  break
          except Exception as exc:
              error = f"Network/HTTP error at {current}: {exc}"
              break
      else:
          error = f"Redirect chain exceeded max_hops limit ({max_hops})"

      redirects = max(len(chain) - 1, 0)
      if redirects > max_hops and not error:
          error = f"Redirect count {redirects} exceeds maximum {max_hops}"

      report = {
          "start_url": start_url,
          "final_url": current,
          "redirects": redirects,
          "chain": chain,
          "error": error,
          "passed": error is None
      }

      with open("redirect_chain_report.json", "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)

      print(f"Redirect audit completed for {start_url}: {redirects} redirect(s), passed={error is None}")

      Kestra.outputs({
          "report": report,
          "failed_count": int(error is not None),
          "final_url": current,
          "redirects": redirects
      })

  - id: write_report
    type: io.kestra.plugin.core.storage.Write
    description: Persist the complete redirect chain.
    content: "{{ outputs.inspect_redirects.vars.report | toJson }}"
    extension: ".json"

  - id: alert_if_failed
    type: io.kestra.plugin.core.flow.If
    description: Alert when redirects loop, fail, or exceed the hop budget.
    condition: "{{ outputs.inspect_redirects.vars.failed_count > 0 and inputs.notify_slack }}"
    then:
      - id: alert_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🚨 *Redirect Audit Failed* for `{{ inputs.url }}`: {{ outputs.inspect_redirects.vars.report.error }}. Final URL: `{{ outputs.inspect_redirects.vars.final_url }}` (Hops: {{ outputs.inspect_redirects.vars.redirects }})."
          }

errors:
  - id: alert_flow_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *HTTP Redirect Chain Audit Pipeline Failure*: Execution {{ execution.id }} failed in flow {{ flow.id }}."
      }

outputs:
  - id: report
    type: URI
    value: "{{ outputs.write_report.uri }}"
  - id: final_url
    type: STRING
    value: "{{ outputs.inspect_redirects.vars.final_url }}"
  - id: redirects
    type: INT
    value: "{{ outputs.inspect_redirects.vars.redirects }}"

extend:
  title: HTTP Redirect Chain Audit
  shortDescription: Detect redirect loops and excessive hops while preserving the full chain.
  metaTitle: Automated HTTP Redirect Chain and Loop Audit
  metaDescription: Follow HTTP redirects, detect loops and excessive hops, save the chain, and alert Slack on failures.
  description: |
    Catch broken migrations and redirect regressions before search engines or
    customers encounter them. Configure a starting `url` and `max_hops`; the
    report records every intermediate URL and the final destination.

    Prerequisites: outbound HTTPS access and `SLACK_WEBHOOK_URL` for alerts.
    Run manually before enabling the daily schedule. A loop, network error, or
    chain longer than the configured budget fails the audit.

    Links: [Python Script](https://kestra.io/plugins/plugin-script-python),
    [Slack](https://kestra.io/plugins/plugin-notifications-slack). Created by [yashspidey](https://github.com/yashspidey).
  tags:
    - Infrastructure
    - Core
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
