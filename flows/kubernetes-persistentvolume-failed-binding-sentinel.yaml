id: kubernetes-persistentvolume-failed-binding-sentinel
namespace: company.sre

inputs:
  - id: kube_context
    type: STRING
    required: false
    description: Optional Kubernetes context name.
  - id: pending_threshold
    type: INT
    defaults: 0
    description: Maximum acceptable count of unfulfilled or failed binding PersistentVolumeClaims.

tasks:
  - id: audit_pvc_bindings
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: bitnami/kubectl:latest
    commands:
      - |
        CONTEXT_ARG=""
        if [ -n "{{ inputs.kube_context }}" ]; then
          CONTEXT_ARG="--context={{ inputs.kube_context }}"
        fi
        
        kubectl $CONTEXT_ARG get pvc -A -o json > /tmp/pvc_all.json
        
        UNBOUND_COUNT=$(jq '[.items[] | select(.status.phase != "Bound")] | length' /tmp/pvc_all.json)
        UNBOUND_DETAILS=$(jq '[.items[] | select(.status.phase != "Bound") | {namespace: .metadata.namespace, name: .metadata.name, phase: .status.phase, storage_class: .spec.storageClassName, requested_storage: .spec.resources.requests.storage}]' /tmp/pvc_all.json)
        
        echo "::set-output name=unbound_count::$UNBOUND_COUNT::"
        echo "::set-output name=unbound_details::$UNBOUND_DETAILS::"

  - id: evaluate_pvc_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_pvc_bindings.vars.unbound_count | int > inputs.pending_threshold }}"
    then:
      - id: notify_storage_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#infrastructure-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Kubernetes PersistentVolume Binding Failure Alert",
                "text": "Detected *{{ outputs.audit_pvc_bindings.vars.unbound_count }}* PersistentVolumeClaim(s) in non-Bound state exceeding threshold *{{ inputs.pending_threshold }}*. Unbound details: {{ outputs.audit_pvc_bindings.vars.unbound_details }}. Impact: Stateful application pods may fail to schedule or stay in ContainerCreating indefinitely.",
                "footer": "Kestra SRE Orchestrator • PVC Binding Sentinel"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#infrastructure-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ PVC Binding Sentinel Workflow Execution Failed",
            "text": "The Kubernetes PVC binding audit workflow failed unexpectedly. Please verify cluster RBAC, kubeconfig secrets, and API server reachability.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Kubernetes namespaces to detect unbound or provisioning-failed PersistentVolumeClaims preventing stateful pod scheduling."
  metaTitle: Kubernetes PersistentVolumeClaim Failed Binding and Volume Stalling Sentinel with Kestra
  title: Kubernetes PersistentVolumeClaim Failed Binding and Volume Stalling Sentinel
  shortDescription: Audits Kubernetes namespaces to detect unbound or provisioning-failed PersistentVolumeClaims preventing stateful pod scheduling.
  description: |
    ## How it works
    This workflow connects to the target Kubernetes cluster and audits all PersistentVolumeClaims across namespaces using the `kubectl` CLI. It inspects `.status.phase` and flags any claims that have failed to transition to the `Bound` status. If the number of unbound claims exceeds the configured threshold, a formatted Slack incident alert is immediately triggered with namespace and volume details.

    ## What you get
    - Cluster-wide visibility into unfulfilled storage claims and provisioning failures.
    - Early warning before developers report stuck deployments or scheduling timeouts.
    - Automated incident notification with exact namespace, PVC name, storage class, and requested capacity.

    ## Who it's for
    - Platform Engineers and Kubernetes Cluster Administrators managing dynamic volume provisioners (CSI drivers).
    - SREs maintaining production stateful workloads such as databases, message queues, and caching layers.

    ## Why orchestrate this with Kestra
    - **Native Scheduling**: Run regular, automated health audits without maintaining standalone cron runners.
    - **Flexible Extensibility**: Seamlessly extend the flow to trigger CSI driver pod restarts or automatically open Jira tickets.
    - **Centralized Alerting**: Integrate directly with Slack, PagerDuty, or Microsoft Teams with zero boilerplate code.

    ## Prerequisites
    - A Kubernetes service account or kubeconfig secret with `get` and `list` permissions for `persistentvolumeclaims` across all namespaces.
    - A Slack Incoming Webhook URL configured as secret `SLACK_WEBHOOK`.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Configure the `SLACK_WEBHOOK` secret.
    3. Run an execution or enable the scheduled trigger to start continuous storage volume auditing.

    ## How to extend
    - Add an automated remediation step using `kubectl describe pvc` to capture underlying CSI driver error events.
    - Filter alerts by specific business-critical namespaces (e.g., `production`, `databases`).

    ## Links
    - [Kubernetes Persistent Volumes Documentation](https://kubernetes.io/docs/concepts/storage/persistent-volumes/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Kubernetes Operations
    - Day 2 Operations
  ee: false
  demo: false
