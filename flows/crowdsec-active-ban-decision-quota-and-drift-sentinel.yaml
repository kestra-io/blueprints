id: crowdsec-active-ban-decision-quota-and-drift-sentinel
namespace: company.security

description: |
  Continuously audits CrowdSec Local API (LAPI) active remediation decisions and security alerts
  to detect firewall ban quota exhaustion, track attack scenarios, alert SecOps teams via Slack,
  and safely prune stale manual bans under explicit dry-run governance.

inputs:
  - id: crowdsec_lapi_host
    type: STRING
    displayName: CrowdSec LAPI host
    description: Hostname or IP address of the CrowdSec Local API (LAPI) service endpoint.
    defaults: "localhost"

  - id: crowdsec_lapi_port
    type: INT
    displayName: CrowdSec LAPI port
    description: TCP port number for the CrowdSec Local API service (default is 8080).
    defaults: 8080

  - id: max_active_bans_threshold
    type: INT
    displayName: Maximum active ban threshold
    description: Maximum acceptable count of active ban decisions before flagging firewall memory and ipset quota exhaustion.
    defaults: 100

  - id: confirm_prune_manual
    type: BOOL
    displayName: Confirm manual decision prune
    description: Authorizes this sentinel to prune stale manual decisions via the LAPI when the quota is exceeded. Stays false by default.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run mode
    description: When true, simulates remediation decisions and dispatches alerts without mutating or deleting active CrowdSec decisions.
    defaults: true

tasks:
  - id: probe_active_decisions
    type: io.kestra.plugin.core.http.Request
    description: Queries the CrowdSec Local API /v1/decisions endpoint to inspect all currently enforced ban and challenge decisions.
    uri: "http://{{ inputs.crowdsec_lapi_host }}:{{ inputs.crowdsec_lapi_port }}/v1/decisions"
    method: GET
    headers:
      X-Api-Key: "{{ secret('CROWDSEC_API_KEY') }}"
      Accept: application/json
    contentType: application/json
    timeout: PT30S

  - id: probe_recent_alerts
    type: io.kestra.plugin.core.http.Request
    description: Fetches recent security alert records from /v1/alerts to audit triggered intrusion scenarios and attack trends.
    uri: "http://{{ inputs.crowdsec_lapi_host }}:{{ inputs.crowdsec_lapi_port }}/v1/alerts?limit=25"
    method: GET
    headers:
      X-Api-Key: "{{ secret('CROWDSEC_API_KEY') }}"
      Accept: application/json
    contentType: application/json
    timeout: PT30S

  - id: evaluate
    type: io.kestra.plugin.core.output.OutputValues
    description: Counts active ban decisions, extracts offending IP ranges, and folds dry-run governance into a single routing status.
    values:
      total_decisions_count: >-
        {{ ({'decisions': outputs.probe_active_decisions.body} | jq('[(.decisions // [])[]] | length')) | first | number }}
      active_bans_count: >-
        {{ ({'decisions': outputs.probe_active_decisions.body} | jq('[(.decisions // [])[] | select(.type == "ban")] | length')) | first | number }}
      manual_decisions_count: >-
        {{ ({'decisions': outputs.probe_active_decisions.body} | jq('[(.decisions // [])[] | select(.origin == "manual" or .origin == "cscli")] | length')) | first | number }}
      offending_ips: >-
        {{ ({'decisions': outputs.probe_active_decisions.body} | jq('[(.decisions // [])[] | select(.type == "ban") | .value] | unique | join("; ")')) | first }}
      recent_alerts_count: >-
        {{ ({'alerts': outputs.probe_recent_alerts.body} | jq('[(.alerts // [])[]] | length')) | first | number }}
      status: >-
        {{ (((({'decisions': outputs.probe_active_decisions.body} | jq('[(.decisions // [])[] | select(.type == "ban")] | length')) | first | number) >= inputs.max_active_bans_threshold) ? ((inputs.confirm_prune_manual and not inputs.dry_run) ? 'QUOTA_AUTO_PRUNE' : 'QUOTA_NEEDS_HUMAN') : (((({'alerts': outputs.probe_recent_alerts.body} | jq('[(.alerts // [])[]] | length')) | first | number) > 0) ? 'THREATS_DETECTED' : 'NOMINAL')) }}

  - id: route
    type: io.kestra.plugin.core.flow.Switch
    description: Evaluates classified status to log nominal telemetry, dispatch SecOps alerts, or safely prune stale manual decisions.
    value: "{{ outputs.evaluate.values.status }}"
    cases:
      "NOMINAL":
        - id: log_nominal
          type: io.kestra.plugin.core.log.Log
          message: "CrowdSec LAPI decision pool nominal on {{ inputs.crowdsec_lapi_host }}:{{ inputs.crowdsec_lapi_port }}: {{ outputs.evaluate.values.active_bans_count }} active ban(s) below threshold {{ inputs.max_active_bans_threshold }}, 0 active threat alerts."

      "THREATS_DETECTED":
        - id: alert_security_threats
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': 'THREATS_DETECTED: CrowdSec on ' ~ inputs.crowdsec_lapi_host ~ ':' ~ inputs.crowdsec_lapi_port ~ ' recorded ' ~ outputs.evaluate.values.recent_alerts_count ~ ' recent attack alert(s) across ' ~ outputs.evaluate.values.active_bans_count ~ ' active ban(s). Top banned targets: ' ~ outputs.evaluate.values.offending_ips ~ '. Review LAPI metrics.'} | toJson }}

      "QUOTA_NEEDS_HUMAN":
        - id: alert_quota_breach
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': 'QUOTA_NEEDS_HUMAN: CrowdSec active bans count (' ~ outputs.evaluate.values.active_bans_count ~ ') met or exceeded threshold (' ~ inputs.max_active_bans_threshold ~ ') on ' ~ inputs.crowdsec_lapi_host ~ ':' ~ inputs.crowdsec_lapi_port ~ '. Manual decisions detected: ' ~ outputs.evaluate.values.manual_decisions_count ~ '. Dry-run is active or confirm_prune_manual is false; operator review required.'} | toJson }}

      "QUOTA_AUTO_PRUNE":
        - id: prune_manual_decisions
          type: io.kestra.plugin.core.http.Request
          description: Safely removes stale manual and CLI decisions to free firewall and ipset memory capacity while preserving automated community consensus blocklists.
          uri: "http://{{ inputs.crowdsec_lapi_host }}:{{ inputs.crowdsec_lapi_port }}/v1/decisions?origin=manual"
          method: DELETE
          headers:
            X-Api-Key: "{{ secret('CROWDSEC_API_KEY') }}"
            Accept: application/json
          timeout: PT30S
        - id: alert_prune_completed
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': 'QUOTA_AUTO_PRUNE: CrowdSec ban quota exceeded (' ~ outputs.evaluate.values.active_bans_count ~ ' >= ' ~ inputs.max_active_bans_threshold ~ '). Successfully pruned stale manual decisions on ' ~ inputs.crowdsec_lapi_host ~ ':' ~ inputs.crowdsec_lapi_port ~ ' to protect firewall ipset headroom.'} | toJson }}

  - id: log_sentinel_audit
    type: io.kestra.plugin.core.log.Log
    description: Records sentinel audit completion timestamp, target LAPI instance, and evaluated metrics for security compliance lineage.
    message: "CrowdSec decision sentinel completed for {{ inputs.crowdsec_lapi_host }}:{{ inputs.crowdsec_lapi_port }}: status {{ outputs.evaluate.values.status }}, active bans {{ outputs.evaluate.values.active_bans_count }} (threshold {{ inputs.max_active_bans_threshold }}), total decisions {{ outputs.evaluate.values.total_decisions_count }}."

errors:
  - id: alert_probe_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatches out-of-band notification if CrowdSec Local API is unreachable or returns a connection error.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'CrowdSec sentinel probe failed (execution ' ~ execution.id ~ ') on ' ~ inputs.crowdsec_lapi_host ~ ':' ~ inputs.crowdsec_lapi_port ~ '. Verify LAPI container status and CROWDSEC_API_KEY secret.'} | toJson }}

triggers:
  - id: hourly_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled. Enable once CROWDSEC_API_KEY and SLACK_WEBHOOK_URL secrets are populated; confirm_prune_manual and dry_run ensure no unintended mutations occur during scheduled runs.
    cron: "0 * * * *"
    disabled: true
    inputs:
      crowdsec_lapi_host: "localhost"
      crowdsec_lapi_port: 8080
      max_active_bans_threshold: 100
      confirm_prune_manual: false
      dry_run: true

extend:
  title: CrowdSec Active Ban Decision Quota & Stale Decision Sentinel
  metaTitle: CrowdSec Active Ban Decision Quota Sentinel | Kestra
  shortDescription: Audit CrowdSec LAPI active remediation decisions, detect firewall ban quota exhaustion, alert Slack, and safely prune stale manual bans.
  metaDescription: Audit CrowdSec active ban decisions, prevent firewall ipset bloat, alert via Slack, and prune stale manual remediation decisions with safety guards.
  description: |
    Continuously monitors CrowdSec Local API (LAPI) active remediation decisions and security
    alerts in Kubernetes clusters, edge gateways, and ingress routers to prevent firewall ipset
    and memory exhaustion, detect attack spikes, notify SecOps teams via Slack, and safely prune
    stale manual ban entries under strict dry-run governance.

    This blueprint was created by [Mohit Jeswani](https://github.com/mohitjeswani01).

    ## How it works

    1. `hourly_audit` (`io.kestra.plugin.core.trigger.Schedule`) initiates regular evaluations
       every hour. Shipped disabled by default so operators can perform manual verification first.
    2. `probe_active_decisions` (`io.kestra.plugin.core.http.Request`) invokes CrowdSec LAPI
       `GET /v1/decisions` using the authenticated `CROWDSEC_API_KEY` header to fetch all active
       remediation decisions (IP bans, captcha challenges).
    3. `probe_recent_alerts` (`io.kestra.plugin.core.http.Request`) queries `GET /v1/alerts` to
       retrieve recent security alert events, identifying triggered attack scenarios (such as HTTP
       probing, SSH brute force, or credential stuffing).
    4. `evaluate` (`io.kestra.plugin.core.output.OutputValues`) calculates total decision count,
       active ban count, manual ban count, extracts unique offending IPs, and classifies the state:
       - **NOMINAL:** Active bans remain below `max_active_bans_threshold` with no recent alerts.
       - **THREATS_DETECTED:** Active bans are within threshold but recent threat alerts require review.
       - **QUOTA_NEEDS_HUMAN:** Active bans meet or exceed the threshold while `dry_run` is true
         or `confirm_prune_manual` is false, flagging potential firewall memory risk for manual review.
       - **QUOTA_AUTO_PRUNE:** Ban quota is exceeded and operator has set `confirm_prune_manual: true`
         with `dry_run: false`, authorizing automated cleanup of stale manual entries.
    5. `route` (`io.kestra.plugin.core.flow.Switch`) directs actions:
       - **NOMINAL:** Logs nominal state telemetry via `io.kestra.plugin.core.log.Log`.
       - **THREATS_DETECTED:** Posts an alert to Slack naming recent attack counts and banned targets.
       - **QUOTA_NEEDS_HUMAN:** Posts a high-priority Slack warning detailing the quota breach and
         manual decision count, without mutating any decisions.
       - **QUOTA_AUTO_PRUNE:** Executes `DELETE /v1/decisions?origin=manual` (safe remediation: removes
         stale manual/CLI entries while preserving automated community consensus decisions), followed
         by a Slack confirmation notice.
    6. `log_sentinel_audit` records an immutable audit log entry containing evaluated metrics and final
       status for compliance history.
    7. Global `errors` block dispatches an out-of-band Slack notification if the CrowdSec LAPI is
       unreachable or returns an authentication failure.

    ## What you get

    - Early detection of firewall and ipset table exhaustion caused by unbounded ban decision growth
      in high-volume intrusion environments.
    - Automated threat situational awareness delivering offending IP ranges and scenario alerts directly
      to your SecOps Slack channel.
    - Safe non-destructive remediation: pruning targets only manual entries (`origin=manual`), leaving
      core automated detection scenarios and community blocklist feeds intact.
    - Dual safety guardrails: `dry_run` defaults to `true` and `confirm_prune_manual` defaults to `false`,
      guaranteeing zero unexpected decision deletions during initial rollout.

    ## Who it's for

    - Platform Engineers and SecOps Teams managing CrowdSec security engines across Kubernetes ingress
      controllers, Traefik/Nginx reverse proxies, or edge Linux hosts.
    - Site Reliability Engineers ensuring firewall ipset headroom and connection table limits do not cause
      packet drop or collateral degradation for legitimate user traffic.
    - Security Administrators requiring periodic audit trails of active bans and remediation lifecycle events.

    ## Why orchestrate this with Kestra

    CrowdSec provides efficient local intrusion detection and decision enforcement, but does not provide
    built-in quota threshold monitoring, Slack alert formatting, or scheduled governance over stale manual
    bans. Standalone cron scripts lack retry logic, execution histories, masked secret handling, and
    auditable state transitions. Kestra delivers declarative orchestration, secure secret injection,
    conditional branch visualization, and comprehensive operational lineage.

    ## Prerequisites

    - A running CrowdSec Security Engine instance (v1.5.0 or later) with the Local API (LAPI) enabled.
      CrowdSec publishes an official open-source Docker image (`crowdsecurity/crowdsec:latest`) requiring
      no paid subscription or proprietary license.
    - A CrowdSec bouncer or machine API key configured in LAPI.
    - A Slack incoming webhook URL for SecOps channel alerting.

    ### Secrets

    - `CROWDSEC_API_KEY`: API key for authenticating with the CrowdSec Local API. In Kestra OSS, provide
      it as the base64-encoded environment variable `SECRET_CROWDSEC_API_KEY`.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL used by alert tasks and the global `errors` block.
      In Kestra OSS, provide it as `SECRET_SLACK_WEBHOOK_URL`.

    ## Quick start

    1. Start a local CrowdSec container:
       ```bash
       docker run -d --name crowdsec-sentinel-test -p 8080:8080 -e COLLECTIONS="crowdsecurity/linux" crowdsecurity/crowdsec:latest
       ```
    2. Generate a machine API key:
       ```bash
       docker exec crowdsec-sentinel-test cscli bouncers add kestra-sentinel -k test-api-key-12345
       ```
    3. Configure `CROWDSEC_API_KEY` and `SLACK_WEBHOOK_URL` secrets in your Kestra namespace.
    4. Import this blueprint into Kestra and click **Execute** with default inputs (`dry_run: true`).
    5. Verify execution logs show `log_nominal` with healthy decision metrics.
    6. Add a manual ban to test threshold alerting:
       ```bash
       docker exec crowdsec-sentinel-test cscli decisions add -i 198.51.100.42 -r "test-probe" -d 4h
       ```
    7. Execute with `max_active_bans_threshold: 0` to observe `alert_quota_breach` firing to Slack.
    8. Enable the `hourly_audit` schedule once operational thresholds are aligned.

    ## How to extend

    - Add an alert integration with PagerDuty using `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert`
      for critical severity attack alerts.
    - Forward aggregated decision counts and ban velocity metrics to Prometheus via
      `io.kestra.plugin.prometheus.PushGateway` for long-term capacity trending.
    - Chain downstream firewall reload or cloud security group synchronization tasks when ban quotas exceed
      critical thresholds.

    ## Links

    - [CrowdSec Official Documentation](https://docs.crowdsec.net/)
    - [CrowdSec Local API (LAPI) Reference](https://crowdsecurity.github.io/api_specs/)
    - [CrowdSec Docker Hub Image](https://hub.docker.com/r/crowdsecurity/crowdsec)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
