id: sqlserver-datafile-space-exhaustion-guard
namespace: company.team

description: |
  Find SQL Server data files that are close to running out of space and heading
  for error 1105. The audit reads the used space, file size, MAXSIZE and growth
  increment for every ROWS data file in the connected database from
  sys.database_files and FILEPROPERTY, reads the volume free space from
  sys.dm_os_volume_stats, works out the real headroom, alerts Slack, then behind
  a safe by default gate and a human approval it raises MAXSIZE, pre-grows the
  file and sets a sane fixed FILEGROWTH with one ALTER DATABASE MODIFY FILE. It
  re-reads sys.database_files afterwards and fails the run if the real headroom
  is still below the floor. A file on a full volume cannot be grown, so it is
  reported rather than touched. Only ONLINE FULL or SIMPLE user databases are
  considered, never master, model, msdb or tempdb.

inputs:
  - id: url
    type: STRING
    displayName: JDBC URL
    description: Points at the database to check. Used space comes from the connected database, so include the database in the URL, for example jdbc:sqlserver://host:1433;databaseName=app.
    defaults: "jdbc:sqlserver://localhost:1433"

  - id: user
    type: STRING
    displayName: SQL Server login
    defaults: sa

  - id: password
    type: STRING
    displayName: SQL Server password
    description: Defaults to the SQLSERVER_PASSWORD secret. Override only for local testing.
    defaults: "{{ secret('SQLSERVER_PASSWORD') }}"

  - id: used_pct_threshold
    type: INT
    displayName: Used percentage threshold
    description: Flag a capped data file once its used space reaches this share of its MAXSIZE. Above it the file is close to the hard ceiling that produces error 1105.
    defaults: 80

  - id: min_headroom_mb
    type: INT
    displayName: Minimum headroom in MB
    description: Flag any data file with less real headroom than this. The run also fails if the headroom is still below it after the grow. Headroom is the free space in the file plus the smaller of the room left to MAXSIZE and the free space on the volume.
    defaults: 256

  - id: volume_free_floor_mb
    type: INT
    displayName: Volume free floor in MB
    description: Flag an unlimited growth data file whose volume has less free space than this. An unlimited file on a full volume is a disk problem, so it is reported, not grown.
    defaults: 2048

  - id: min_file_size_mb
    type: INT
    displayName: Minimum file size in MB
    description: Ignore data files smaller than this. A tiny file is noise and grows past the number before it threatens anything.
    defaults: 8

  - id: min_growth_mb
    type: INT
    displayName: Minimum healthy growth in MB
    description: A fixed FILEGROWTH under this is unsafe. Any percent growth is unsafe too. A file that cannot grow in sane steps reaches its ceiling in many tiny jumps.
    defaults: 16

  - id: target_maxsize_mb
    type: INT
    displayName: Target MAXSIZE in MB
    description: The MAXSIZE a grown file is raised to. The flow never sets a MAXSIZE below the new file size or the current MAXSIZE, so a large file is raised above its new size and a bigger existing cap is kept.
    defaults: 10240

  - id: filegrowth_mb
    type: INT
    displayName: Fixed FILEGROWTH in MB
    description: The fixed growth increment left on the file, so future growth adds space in sane steps instead of stalling or overshooting.
    defaults: 256

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    description: Allow the ALTER DATABASE MODIFY FILE statements to run.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, before any statement runs.
    defaults: true

variables:
  audit_sql: |
    WITH files AS (
      SELECT df.name AS logical_name, df.physical_name, df.file_id,
        CAST(df.size AS bigint) * 8 / 1024 AS size_mb,
        CASE WHEN df.max_size = -1 THEN -1 ELSE CAST(df.max_size AS bigint) * 8 / 1024 END AS max_size_mb,
        df.is_percent_growth,
        CASE WHEN df.is_percent_growth = 1 THEN CAST(df.growth AS bigint) ELSE CAST(df.growth AS bigint) * 8 / 1024 END AS growth_setting,
        CAST(FILEPROPERTY(df.name, 'SpaceUsed') AS bigint) * 8 / 1024 AS used_mb,
        vs.total_bytes / 1048576 AS volume_total_mb,
        vs.available_bytes / 1048576 AS volume_avail_mb
      FROM sys.database_files df
      CROSS APPLY sys.dm_os_volume_stats(DB_ID(), df.file_id) vs
      WHERE df.type_desc = 'ROWS' AND df.state_desc = 'ONLINE'
    ),
    scored AS (
      SELECT *,
        CASE WHEN max_size_mb = -1 THEN (size_mb - used_mb) + volume_avail_mb
             ELSE (size_mb - used_mb) + CASE WHEN (max_size_mb - size_mb) < volume_avail_mb THEN (max_size_mb - size_mb) ELSE volume_avail_mb END
        END AS headroom_mb,
        CASE WHEN max_size_mb = -1 THEN NULL ELSE CAST(100.0 * used_mb / NULLIF(max_size_mb, 0) AS DECIMAL(5, 1)) END AS used_pct,
        CASE WHEN is_percent_growth = 1 OR growth_setting = 0 OR (is_percent_growth = 0 AND growth_setting < {{ inputs.min_growth_mb }}) THEN 1 ELSE 0 END AS unsafe_growth,
        CASE WHEN size_mb > used_mb + {{ inputs.min_headroom_mb }} THEN size_mb ELSE used_mb + {{ inputs.min_headroom_mb }} END AS new_size_mb
      FROM files
      WHERE size_mb >= {{ inputs.min_file_size_mb }}
    ),
    sized AS (
      SELECT *,
        CASE WHEN {{ inputs.target_maxsize_mb }} > new_size_mb + {{ inputs.filegrowth_mb }} THEN {{ inputs.target_maxsize_mb }} ELSE new_size_mb + {{ inputs.filegrowth_mb }} END AS wanted_max_mb
      FROM scored
    ),
    planned AS (
      SELECT *, CASE WHEN wanted_max_mb > max_size_mb THEN wanted_max_mb ELSE max_size_mb END AS new_max_mb
      FROM sized
    )
    SELECT DB_NAME() AS database_name,
      CONVERT(nvarchar(60), DATABASEPROPERTYEX(DB_NAME(), 'Recovery')) AS recovery_model,
      logical_name, physical_name, file_id, size_mb, max_size_mb, is_percent_growth, growth_setting, used_mb,
      volume_total_mb, volume_avail_mb, headroom_mb, used_pct, unsafe_growth,
      CASE WHEN max_size_mb = -1 THEN 'REPORT_ONLY' ELSE 'GROW_FILE' END AS fix_action,
      CONCAT(CHAR(39), REPLACE(logical_name, CHAR(39), CHAR(39) + CHAR(39)), CHAR(39)) AS name_literal,
      CASE WHEN max_size_mb = -1 THEN ''
        ELSE CONCAT('ALTER DATABASE ', QUOTENAME(DB_NAME()), ' MODIFY FILE (NAME = ', QUOTENAME(logical_name),
          ', SIZE = ', CAST(new_size_mb AS varchar(20)), 'MB',
          ', MAXSIZE = ', CAST(new_max_mb AS varchar(20)), 'MB',
          ', FILEGROWTH = ', CAST({{ inputs.filegrowth_mb }} AS varchar(20)), 'MB)')
      END AS resize_sql
    FROM planned
    WHERE DB_ID() > 4
      AND DB_NAME() NOT IN ('master', 'model', 'msdb', 'tempdb')
      AND CONVERT(nvarchar(60), DATABASEPROPERTYEX(DB_NAME(), 'Recovery')) IN ('FULL', 'SIMPLE')
      AND (
        (max_size_mb <> -1 AND (used_pct >= {{ inputs.used_pct_threshold }} OR headroom_mb < {{ inputs.min_headroom_mb }} OR (unsafe_growth = 1 AND used_pct >= {{ inputs.used_pct_threshold }} / 2.0)))
        OR (max_size_mb = -1 AND (headroom_mb < {{ inputs.min_headroom_mb }} OR volume_avail_mb < {{ inputs.volume_free_floor_mb }}))
      )
    ORDER BY headroom_mb ASC

  measure_sql: |
    WITH files AS (
      SELECT df.name AS logical_name,
        CAST(df.size AS bigint) * 8 / 1024 AS size_mb,
        CASE WHEN df.max_size = -1 THEN -1 ELSE CAST(df.max_size AS bigint) * 8 / 1024 END AS max_size_mb,
        df.is_percent_growth,
        CASE WHEN df.is_percent_growth = 1 THEN CAST(df.growth AS bigint) ELSE CAST(df.growth AS bigint) * 8 / 1024 END AS growth_setting,
        CAST(FILEPROPERTY(df.name, 'SpaceUsed') AS bigint) * 8 / 1024 AS used_mb,
        vs.available_bytes / 1048576 AS volume_avail_mb
      FROM sys.database_files df
      CROSS APPLY sys.dm_os_volume_stats(DB_ID(), df.file_id) vs
      WHERE df.type_desc = 'ROWS' AND df.state_desc = 'ONLINE'
    ),
    scored AS (
      SELECT *,
        CASE WHEN max_size_mb = -1 THEN (size_mb - used_mb) + volume_avail_mb
             ELSE (size_mb - used_mb) + CASE WHEN (max_size_mb - size_mb) < volume_avail_mb THEN (max_size_mb - size_mb) ELSE volume_avail_mb END
        END AS headroom_mb,
        CASE WHEN max_size_mb = -1 THEN NULL ELSE CAST(100.0 * used_mb / NULLIF(max_size_mb, 0) AS DECIMAL(5, 1)) END AS used_pct
      FROM files
    )
    SELECT DB_NAME() AS database_name, logical_name, size_mb, max_size_mb, used_mb, growth_setting, is_percent_growth, headroom_mb, used_pct,
      CASE WHEN headroom_mb < {{ inputs.min_headroom_mb }} THEN 1 ELSE 0 END AS still_at_risk
    FROM scored
    WHERE logical_name IN ({{ outputs.targets.values.grow_files_literal }})
    ORDER BY headroom_mb ASC

tasks:
  - id: audit
    type: io.kestra.plugin.jdbc.sqlserver.Query
    description: Read-only. Reads every ROWS data file in the connected database, its size, MAXSIZE, growth and used space from sys.database_files and FILEPROPERTY plus the volume free space from sys.dm_os_volume_stats. It works out the real headroom and keeps the files near their MAXSIZE or on a near full volume. A system database or a database that is not FULL or SIMPLE recovery returns nothing.
    url: "{{ inputs.url }}"
    username: "{{ inputs.user }}"
    password: "{{ inputs.password }}"
    trustServerCertificate: true
    fetchType: FETCH
    sql: "{{ render(vars.audit_sql) }}"

  - id: targets
    type: io.kestra.plugin.core.output.OutputValues
    description: Split the findings. Capped files near their ceiling are the grow plan. Unlimited files on a full volume are report only. Each grow statement is built in T-SQL with QUOTENAME, so identifiers are quoted by the server.
    values:
      plan: "{{ outputs.audit.rows | jq('[.[] | select(.fix_action==\"GROW_FILE\") | {db: .database_name, logical: .logical_name, resize: .resize_sql, size: .size_mb, max: .max_size_mb, used: .used_mb, growth: .growth_setting, headroom: .headroom_mb, used_pct: .used_pct}]') | first | toJson }}"
      grow_count: "{{ outputs.audit.rows | jq('[.[] | select(.fix_action==\"GROW_FILE\")] | length') | first }}"
      report_count: "{{ outputs.audit.rows | jq('[.[] | select(.fix_action==\"REPORT_ONLY\")] | length') | first }}"
      grow_files_literal: "{{ outputs.audit.rows | jq('[.[] | select(.fix_action==\"GROW_FILE\") | .name_literal] | join(\",\")') | first }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      SQL Server data file audit on {{ inputs.url }}: {{ outputs.audit.size }} data file(s) at risk ({{ outputs.targets.values.grow_count }} growable, {{ outputs.targets.values.report_count }} disk level report only).
      {{ outputs.audit.rows | jq('map("\(.database_name)/\(.logical_name) used=\(.used_mb)MB size=\(.size_mb)MB max=\(if .max_size_mb == -1 then "unlimited" else "\(.max_size_mb)MB" end) headroom=\(.headroom_mb)MB growth=\(if .is_percent_growth == 1 then "\(.growth_setting)pct" else "\(.growth_setting)MB" end) [\(.fix_action)]") | join("; ")') | first }}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit.size > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'SQL Server ' ~ inputs.url ~ ': ' ~ outputs.audit.size ~ ' data file(s) at risk of error 1105: ' ~ (outputs.audit.rows | jq('map("\(.database_name)/\(.logical_name) used=\(.used_mb)MB max=\(if .max_size_mb == -1 then "unlimited" else "\(.max_size_mb)MB" end) headroom=\(.headroom_mb)MB [\(.fix_action)]") | join("; ")') | first) ~ '.' ~ (inputs.auto_remediate and not inputs.dry_run ? ' Waiting for approval to raise MAXSIZE and pre-grow the growable files.' : ' No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: approval_gate
            type: io.kestra.plugin.core.flow.Pause
            description: Hold the run until a human approves. Pre-growing a data file writes to the volume and briefly loads it, so the change never starts on its own.
            pauseDuration: PT2H
            behavior: FAIL
            onResume:
              - id: approved
                type: BOOL
                required: false
                description: Set true to raise MAXSIZE and pre-grow the listed files. Anything else leaves them alone.

          - id: apply
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.approval_gate.onResume.approved ?? false }}"
            then:
              - id: grow_branch
                type: io.kestra.plugin.core.flow.If
                condition: "{{ (outputs.targets.values.grow_count | number) > 0 }}"
                then:
                  - id: remediate
                    type: io.kestra.plugin.core.flow.Loop
                    description: Serial on purpose. concurrencyLimit 1 keeps two grows from writing to the same volume at once. Each statement runs as its own autocommitting Query because ALTER DATABASE cannot run inside an explicit transaction. allowFailure is set so a grow that the volume cannot satisfy routes to the re-read rather than crashing the run.
                    concurrencyLimit: 1
                    values: "{{ outputs.targets.values.plan }}"
                    tasks:
                      - id: resize_file
                        type: io.kestra.plugin.jdbc.sqlserver.Query
                        description: One ALTER DATABASE MODIFY FILE raises MAXSIZE, pre-grows the file to leave real headroom now and sets a sane fixed FILEGROWTH. The pre-grow writes to the volume, so it can fail if the disk is genuinely full. That failure is caught by the re-read, never reported as success.
                        url: "{{ inputs.url }}"
                        username: "{{ inputs.user }}"
                        password: "{{ inputs.password }}"
                        trustServerCertificate: true
                        fetchType: NONE
                        allowFailure: true
                        sql: "{{ fromJson(item.value).resize }}"

                  - id: after_state
                    type: io.kestra.plugin.jdbc.sqlserver.Query
                    description: Read the size, MAXSIZE, used space, growth and real headroom back for every file the grow touched, whatever the outcome.
                    url: "{{ inputs.url }}"
                    username: "{{ inputs.user }}"
                    password: "{{ inputs.password }}"
                    trustServerCertificate: true
                    fetchType: FETCH
                    sql: "{{ render(vars.measure_sql) }}"

                  - id: state_log
                    type: io.kestra.plugin.core.log.Log
                    message: >-
                      Before: {{ fromJson(outputs.targets.values.plan) | jq('map("\(.db)/\(.logical) used=\(.used)MB size=\(.size)MB max=\(if .max == -1 then "unlimited" else "\(.max)MB" end) headroom=\(.headroom)MB") | join("; ")') | first }}.
                      After: {{ outputs.after_state.rows | jq('map("\(.database_name)/\(.logical_name) used=\(.used_mb)MB size=\(.size_mb)MB max=\(if .max_size_mb == -1 then "unlimited" else "\(.max_size_mb)MB" end) headroom=\(.headroom_mb)MB growth=\(if .is_percent_growth == 1 then "\(.growth_setting)pct" else "\(.growth_setting)MB" end)") | join("; ")') | first }}.

                  - id: reverify
                    type: io.kestra.plugin.core.output.OutputValues
                    description: Count the touched files whose real headroom is still below the floor. This read trusts the actual volume free space, so a grow the disk could not satisfy can never report success.
                    values:
                      still_count: "{{ outputs.after_state.rows | jq('[.[] | select(.still_at_risk == 1)] | length') | first }}"
                      still_list: "{{ outputs.after_state.rows | jq('[.[] | select(.still_at_risk == 1) | \"\\(.database_name)/\\(.logical_name) headroom=\\(.headroom_mb)MB\"] | join(\", \")') | first }}"

                  - id: verify_result
                    type: io.kestra.plugin.core.flow.If
                    condition: "{{ (outputs.reverify.values.still_count | number) > 0 }}"
                    then:
                      - id: remediation_failed
                        type: io.kestra.plugin.core.execution.Fail
                        errorMessage: "Still short of headroom after the grow: {{ outputs.reverify.values.still_list }}. The ALTER DATABASE MODIFY FILE could not add space. Either the volume is full so the pre-grow failed or MAXSIZE is still below the size the file needs. Free space on the volume or move the file to a bigger disk, then run again."
                    else:
                      - id: remediated
                        type: io.kestra.plugin.core.log.Log
                        message: "Raised MAXSIZE and pre-grew: {{ fromJson(outputs.targets.values.plan) | jq('map(.logical) | join(\", \")') | first }}. Every touched data file now has at least {{ inputs.min_headroom_mb }} MB of real headroom and a fixed {{ inputs.filegrowth_mb }} MB growth increment."
                else:
                  - id: only_report
                    type: io.kestra.plugin.core.log.Log
                    message: "Nothing to grow. The {{ outputs.targets.values.report_count }} finding(s) are unlimited growth files on a near full volume, which is a disk problem a file grow cannot fix. Free space on the volume or move the files, then run again."
            else:
              - id: declined
                type: io.kestra.plugin.core.log.Log
                message: "Approval was not given, so no file was grown. The findings stand: {{ outputs.audit.rows | jq('map(\"\\(.database_name)/\\(.logical_name) headroom=\\(.headroom_mb)MB [\\(.fix_action)]\") | join(\", \")') | first }}."
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: >-
          Nothing matched on {{ inputs.url }}: no ONLINE FULL or SIMPLE user data file is within {{ inputs.min_headroom_mb }} MB of its ceiling, over {{ inputs.used_pct_threshold }} percent of its MAXSIZE or on a volume under {{ inputs.volume_free_floor_mb }} MB free. Nothing to grow or report.

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'SQL Server data file space exhaustion guard failed on ' ~ inputs.url ~ ' (execution ' ~ execution.id ~ '). The audit could not run, the grow was rejected or a touched file still has too little headroom. Check the logs.'} | toJson }}

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled. Always runs in safe mode (audit only).
    cron: "0 5 * * 0"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: SQL Server Data File Space Exhaustion Guard
  shortDescription: Find a SQL Server data file close to MAXSIZE or on a full volume, alert Slack, then raise MAXSIZE and pre-grow the file behind an approval and re-read to confirm the headroom came back.
  metaTitle: SQL Server Data File Space Exhaustion Guard with Kestra
  metaDescription: Read used space, MAXSIZE and growth per data file, alert Slack, then raise MAXSIZE and pre-grow the file behind an approval and re-read to confirm.
  description: |
    A data file that is almost full and cannot grow is one insert away from error
    1105. When a file reaches its MAXSIZE or sits on a volume with no free space,
    the next page allocation fails. Every INSERT and UPDATE that needs a new page
    fails with it and the database is effectively down for writes. A tiny or
    percent FILEGROWTH makes it worse, because the file crawls toward its ceiling
    in small steps and the last one lands in the middle of a busy day.

    The signals are in the catalog long before the wall. `sys.database_files`
    carries the file size, the MAXSIZE and the growth increment. `FILEPROPERTY`
    gives the real used space inside the file. `sys.dm_os_volume_stats` gives the
    free space on the volume underneath it. Put together they say how much a file
    can still absorb before it cannot grow.

    This blueprint reads all of that for every ROWS data file in the database you
    point it at, works out the real headroom and flags the files that are close
    to the wall. It splits them in two. A capped file near its MAXSIZE can be
    fixed, so it is grown. An unlimited file on a full volume cannot be fixed by
    growing, because growing needs disk the volume does not have, so it is
    reported instead. It alerts Slack. When you allow it and a human approves the
    run, it raises MAXSIZE, pre-grows the file so there is free space now and
    leaves a sane fixed FILEGROWTH, all in one `ALTER DATABASE ... MODIFY FILE`.
    Then it reads `sys.database_files` again and fails the run if the real
    headroom is still below the floor, because a grow that the disk could not
    satisfy must never be reported as a fix.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Safety

    - Only `ONLINE` FULL or SIMPLE **user** databases are acted on. The audit refuses `master`, `model`, `msdb` and `tempdb` by name and by `DB_ID() > 4`. It returns nothing when it is pointed at a system database or one that is not FULL or SIMPLE recovery.
    - Only `ROWS` data files are touched. Log files are out of scope for this guard.
    - Read-only by default. `dry_run` is `true` and `auto_remediate` is `false`, so a normal run only measures headroom and alerts.
    - A write happens only when `auto_remediate` is `true`, `dry_run` is `false` **and** a human resumes the `Pause` with `approved: true`. A pause resumed without an answer reads as a refusal.
    - A grow is a disk write and loads the volume while it zeroes the new space. Run it in a quiet window.
    - An unlimited growth file on a full volume is never grown. Growing it would need disk the volume does not have, so it is reported and left alone.
    - The remediation loop has `concurrencyLimit: 1`, so two grows never write to the same volume at once.
    - Each statement runs as its own autocommitting `io.kestra.plugin.jdbc.sqlserver.Query`. `ALTER DATABASE` cannot run inside an explicit transaction, so this is never a `Queries` task with `transaction: true`.
    - The re-read trusts the real volume free space. A grow the disk could not satisfy fails the run rather than reporting a fix.

    ## How it works

    1. `audit` (`io.kestra.plugin.jdbc.sqlserver.Query`, read-only) reads every ROWS data file in the connected database, its size, MAXSIZE, growth increment and used space from `sys.database_files` and `FILEPROPERTY` plus the volume free space from `sys.dm_os_volume_stats`. It works out the real headroom (free space in the file plus the smaller of the room left to MAXSIZE and the free space on the volume) and keeps the files over `used_pct_threshold` of their MAXSIZE, under `min_headroom_mb` of headroom or unlimited on a volume under `volume_free_floor_mb` free. Each capped row carries its own `ALTER DATABASE ... MODIFY FILE` statement, built in T-SQL with `QUOTENAME`.
    2. `targets` (`io.kestra.plugin.core.output.OutputValues`) splits the findings into the grow plan (capped files) and the report only count (unlimited files on a full volume) then builds the quoted file name list for the re-read. `summary` (`io.kestra.plugin.core.log.Log`) logs every file with its used space, size, MAXSIZE, headroom and growth.
    3. `route` (`io.kestra.plugin.core.flow.If`):
       - **clean:** logs that no data file is near its ceiling.
       - **findings:** `alert` posts the at risk files to Slack.
         - `remediate_gate` runs only when `auto_remediate` is `true` and `dry_run` is `false`.
         - `approval_gate` (`io.kestra.plugin.core.flow.Pause`) holds the run until a human resumes it.
         - `grow_branch` runs the grow only when there is a capped file to grow. If every finding is an unlimited file on a full volume, `only_report` logs that a file grow cannot fix a disk problem.
         - `remediate` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) runs one `ALTER DATABASE ... MODIFY FILE (SIZE, MAXSIZE, FILEGROWTH)` per file.
         - `after_state` reads the size, MAXSIZE, used space, growth and headroom back for every grown file and `state_log` logs the before and after side by side.
         - `reverify` counts the touched files whose real headroom is still below `min_headroom_mb`. `verify_result` fails the run through `io.kestra.plugin.core.execution.Fail` if there are any.
         - `declined` logs the findings untouched when the approval was refused.
    4. `errors` posts a Slack alert when the audit cannot run, a statement is rejected or the re-read fails the run.

    ## What you get

    - A real headroom number per data file, built from the used space, the MAXSIZE and the free space on the volume underneath. That is the number that decides error 1105. Normal disk and file size monitoring never shows it.
    - A clear split between a problem a file grow fixes (a capped file near MAXSIZE) and a problem it cannot (an unlimited file on a full volume), so you never run a grow that was always going to fail.
    - A fix that raises MAXSIZE, adds real free space now and leaves a fixed FILEGROWTH, so the file stops crawling toward its ceiling in tiny steps.
    - A second read of `sys.database_files` that fails the run when the headroom did not come back, so a grow blocked by a full disk is never reported as success.
    - A Slack alert on the findings and a separate alert on failure.

    ## Who it's for

    - DBAs who want to catch a filegroup running out of space before an insert returns 1105, not during the incident.
    - Platform teams who inherited databases with capped data files or the old 1 MB and 10 percent growth defaults and want to find the ones heading for the wall.
    - Teams running close to full volumes who need to tell a file that can be grown from a disk that has to be made bigger.
    - Anyone evaluating the SQL Server plugin who wants an example of file growth behind an approval.

    ## Why orchestrate this with Kestra

    Error 1105 is sudden and total. One moment writes work, the next every insert that needs a page fails. The warning signs are spread across three places and no single alert ties them together, so by the time anyone looks the file is already at the wall. Doing the check by hand across every database is slow. Growing a file blind on a schedule is how a grow lands on a busy afternoon or fails quietly on a full disk. Kestra reads the used space, the MAXSIZE and the volume free space first, works out the real headroom, gates the change behind two inputs and a human approval, grows one file at a time, then reads the catalog again and fails loudly if the headroom did not come back. The Slack alert says what was found and whether anything changed. The run history keeps every before and after.

    ## Tested end to end

    On Kestra 2.0.5 against SQL Server 2022 (16.0.4295.3) on Linux, with a local HTTP sink standing in for Slack. Three databases were seeded. `appdata` was created with a data file at `SIZE = 16MB, MAXSIZE = 32MB, FILEGROWTH = 1MB` and a table was filled until the file autogrew to its 32 MB ceiling and an insert returned error 1105, which is the state the guard exists to catch. `okdata` was left with a 64 MB data file capped at 4096 MB and almost empty, as a healthy control. `unldata` was created with an unlimited growth data file to exercise the disk level report only path. Every number below was read back with `sqlcmd` against `sys.database_files` and `FILEPROPERTY`, not from the flow log.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | defaults, on `appdata` | 1 file flagged `GROW_FILE`: 32 MB used of a 32 MB cap, headroom 0 MB, 1 MB growth. Slack said "No change applied" |
    | 2 | defaults, on `okdata` | 0 flagged, `clean` branch. The healthy 64 MB file capped at 4096 MB is never flagged |
    | 3 | `auto_remediate: true`, `dry_run: true`, on `appdata` | still 1 flagged, still "No change applied". The dry run blocked the write with `auto_remediate` on |
    | 4 | `auto_remediate: true`, `dry_run: false`, pause resumed `approved: false` | `declined` logged the finding. `sqlcmd` confirmed the file stayed at 32 MB of 32 MB |
    | 5 | same, resumed `approved: true` | one `ALTER DATABASE MODIFY FILE` ran. `sqlcmd`: size 32 MB to 288 MB, MAXSIZE 32 MB to 10240 MB, FILEGROWTH 1 MB to 256 MB, headroom 0 MB to 10208 MB. `reverify` returned 0 still at risk. An INSERT that had failed with 1105 then succeeded |
    | 6 | defaults on the grown `appdata` | 0 flagged, `clean` branch. The same file that was flagged reads clean after the fix |
    | 7 | `approved: true` as a login without `ALTER DATABASE` | the grow was rejected, the file stayed at 32 MB of 32 MB with 0 MB headroom, `reverify` found it still short and `remediation_failed` failed the run. The `errors` block posted to Slack. The same re-read catches a pre-grow the disk could not satisfy |
    | 8 | `volume_free_floor_mb: 50000` on `unldata`, `approved: true` | the unlimited growth file was classified `REPORT_ONLY`, `only_report` logged that a grow cannot fix a disk problem, nothing was written |
    | 9 | unreachable host | `audit` failed on the TCP connection and the `errors` block posted to Slack |

    Across every run `okdata` stayed at 2 MB used in a 64 MB file capped at 4096 MB and was never flagged, which shows the detector reports only the file that is actually near its ceiling.

    ## Prerequisites

    - A SQL Server instance you can reach over JDBC, with the target database named in the URL.
    - A login that can read `sys.database_files`, `sys.dm_os_volume_stats` and `FILEPROPERTY` in the database (`VIEW SERVER STATE` plus access to the database) or `sysadmin`. Remediation also needs `ALTER DATABASE` on the target, so `db_owner` is enough, as is `sysadmin`.
    - A Slack incoming webhook.

    ### Secrets

    - `SQLSERVER_PASSWORD`: password for the login in `user`. The `password` input defaults to this secret.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook, used by `alert` and the `errors` block.
    - In Kestra OSS, provide each one as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `url` | `jdbc:sqlserver://localhost:1433` | SQL Server instance and database to check |
    | `user` | `sa` | SQL Server login |
    | `password` | `{{ secret('SQLSERVER_PASSWORD') }}` | Password for the login |
    | `used_pct_threshold` | `80` | Flag a capped file at or over this percent of its MAXSIZE used |
    | `min_headroom_mb` | `256` | Flag a file with less real headroom. Also the floor the re-read checks |
    | `volume_free_floor_mb` | `2048` | Flag an unlimited file whose volume has less free space |
    | `min_file_size_mb` | `8` | Ignore files smaller than this |
    | `min_growth_mb` | `16` | A fixed growth under this or percent growth counts as unsafe |
    | `target_maxsize_mb` | `10240` | MAXSIZE a grown file is raised to, never below its new size or current MAXSIZE |
    | `filegrowth_mb` | `256` | Fixed `FILEGROWTH` left on the file |
    | `auto_remediate` | `false` | Allow the statements to run |
    | `dry_run` | `true` | Must be `false` for a statement to run |

    ## Quick start

    1. Add the `SQLSERVER_PASSWORD` and `SLACK_WEBHOOK_URL` secrets.
    2. Import the flow, set `url` to include the database (`jdbc:sqlserver://host:1433;databaseName=yourdb`), set `user`, then run it once with the defaults and read the headroom per file.
    3. Set `target_maxsize_mb` to the size the busiest file can reach on its volume. Set `filegrowth_mb` to a step that fits your write rate.
    4. Run with `auto_remediate: true` and `dry_run: false` and approve the pause.
    5. Enable the `weekly` trigger, which always runs in safe mode.

    ## How to extend

    - Run it once per database or wrap it in a parent flow that reads the user database list from `sys.databases` and loops, so one schedule covers a whole instance.
    - Size `target_maxsize_mb` per database from the volume size, instead of one number, by reading `sys.dm_os_volume_stats` in the audit.
    - Add filegroup awareness so a file is grown only when every other file in its filegroup is also near full, which is when 1105 actually fires.
    - Read `sys.dm_io_virtual_file_stats` in the audit and raise the priority of a near full file that is also under heavy write latency.
    - Post the before and after headroom to Slack so an on-call engineer sees the gain without opening the database.

