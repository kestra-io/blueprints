id: elasticsearch-unassigned-shards-recovery-sentinel
namespace: company.team

inputs:
  - id: es_host
    type: STRING
    defaults: elasticsearch.internal
  - id: unassigned_threshold
    type: INT
    defaults: 0

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: fetch_cluster_health
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    commands:
      - |
        curl -s -u elastic:{{ secret("ES_PASSWORD") }} \
          http://{{ inputs.es_host }}:9200/_cluster/health \
          | jq '{status: .status, unassigned_shards: .unassigned_shards, relocating_shards: .relocating_shards}' \
          > /tmp/cluster_health.json
        cat /tmp/cluster_health.json
        UNASSIGNED=$(jq '.unassigned_shards' /tmp/cluster_health.json)
        echo "unassigned_shards=$UNASSIGNED" >> /tmp/health_vars.env
    outputFiles:
      - /tmp/cluster_health.json
      - /tmp/health_vars.env

  - id: fetch_allocation_explain
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    commands:
      - |
        curl -s -u elastic:{{ secret("ES_PASSWORD") }} \
          http://{{ inputs.es_host }}:9200/_cluster/allocation/explain \
          | jq '{index: .index, shard: .shard, primary: .primary, current_state: .current_state, explanation: .allocate_explanation}' \
          > /tmp/allocation_explain.json || echo '{}' > /tmp/allocation_explain.json
        cat /tmp/allocation_explain.json
    outputFiles:
      - /tmp/allocation_explain.json

  - id: evaluate_unassigned_shards
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.fetch_cluster_health.vars.unassigned_shards | default(0) | int > inputs.unassigned_threshold }}"
    then:
      - id: alert_unassigned_shards
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret(\"SLACK_WEBHOOK\") }}"
        payload: |
          {
            "text": ":rotating_light: *Elasticsearch Unassigned Shards Alert*\n*Host:* {{ inputs.es_host }}\n*Unassigned Shards:* {{ outputs.fetch_cluster_health.vars.unassigned_shards }}\n*Threshold:* {{ inputs.unassigned_threshold }}\n*Cluster Status:* {{ outputs.fetch_cluster_health.vars.cluster_status | default('unknown') }}\nCheck `/_cluster/allocation/explain` for shard allocation details."
          }
    else:
      - id: log_healthy
        type: io.kestra.plugin.core.log.Log
        message: "Elasticsearch cluster healthy. Unassigned shards: {{ outputs.fetch_cluster_health.vars.unassigned_shards | default(0) }} — within threshold {{ inputs.unassigned_threshold }}."

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret(\"SLACK_WEBHOOK\") }}"
    payload: |
      {
        "text": ":x: *Elasticsearch Unassigned Shards Sentinel Failed*\n*Flow:* {{ flow.id }}\n*Execution:* {{ execution.id }}\n*Error:* {{ execution.error.message | default('Unknown error') }}\nCheck Kestra UI for details."
      }

extend:
  title: Elasticsearch Unassigned Shards Cluster Health Recovery Sentinel
  shortDescription: Monitor Elasticsearch for unassigned shards, fetch allocation explain details, and alert Slack when shard count exceeds threshold.
  metaTitle: Elasticsearch Unassigned Shards Recovery Sentinel — Kestra Blueprint
  metaDescription: Automatically detect Elasticsearch unassigned and relocating shards using the cluster health and allocation explain APIs. Alert your team on Slack and track recovery progress.
  description: |
    Unassigned shards in Elasticsearch indicate that one or more shard replicas cannot be placed on any node, which can degrade read throughput, block index creation, and—when primary shards are affected—cause data unavailability. This sentinel polls the cluster health API every 15 minutes, extracts the unassigned shard count, and immediately fetches the allocation explain output to surface the root cause alongside the alert.

    ## How it works

    1. The `fetch_cluster_health` task (`io.kestra.plugin.scripts.shell.Commands`) calls `/_cluster/health` with basic auth credentials sourced from the `ES_PASSWORD` secret and writes a JSON snapshot to `/tmp/cluster_health.json`. The unassigned shard count is captured as an environment variable.
    2. The `fetch_allocation_explain` task calls `/_cluster/allocation/explain` to retrieve the reason Elasticsearch cannot allocate the shard, including disk watermark breaches, node attribute mismatches, and replica placement conflicts.
    3. The `evaluate_unassigned_shards` task (`io.kestra.plugin.core.flow.If`) compares the observed count against `inputs.unassigned_threshold` (default `0`). A count strictly above the threshold triggers an immediate Slack alert via `io.kestra.plugin.slack.notifications.SlackIncomingWebhook`.
    4. The top-level `errors` block sends a separate Slack notification if the sentinel itself fails, ensuring the monitoring layer never silently breaks.

    ## What you get

    - Real-time visibility into unassigned and relocating shard counts sourced directly from the Elasticsearch cluster health API.
    - Allocation explanation surfaced alongside the alert so on-call engineers have actionable context without needing to manually run `curl`.
    - A configurable `unassigned_threshold` that allows a grace period for planned rolling restarts.
    - A Slack alert on sentinel failure so dead monitors do not go unnoticed.

    ## Who it's for

    - Platform and SRE teams operating self-managed or ECK-deployed Elasticsearch clusters.
    - Data engineers whose search-backed applications require consistent shard availability.
    - Operations teams that must meet SLAs for search query latency and index write throughput.

    ## Why orchestrate this with Kestra

    Elasticsearch's built-in alerting requires a Platinum license and is scoped to index-level watchers. Kestra provides a license-free, infrastructure-agnostic sentinel that integrates with any Slack workspace, stores full execution history, and can be extended to call remediation APIs or open PagerDuty incidents without any additional tooling. The declarative YAML makes the detection logic auditable and version-controlled.

    ## Prerequisites

    - A running Elasticsearch cluster reachable from the Kestra worker on port 9200.
    - The `curl` and `jq` binaries available on the Kestra worker host.
    - A Kestra secret named `ES_PASSWORD` containing the Elasticsearch `elastic` user password.
    - A Kestra secret named `SLACK_WEBHOOK` containing the Slack incoming webhook URL.

    ## Quick start

    1. Set the `ES_PASSWORD` secret in Kestra with your Elasticsearch password.
    2. Set the `SLACK_WEBHOOK` secret with your Slack incoming webhook URL.
    3. Override `es_host` if your cluster is not on `elasticsearch.internal`.
    4. Enable the schedule trigger and adjust the `unassigned_threshold` to match your operational tolerance (e.g., `0` for strict zero-tolerance, `2` to allow brief rolling-restart windows).
    5. Trigger a manual execution to verify connectivity and inspect the captured JSON outputs.

    ## How to extend

    - Add a remediation step using `curl -X POST '/_cluster/reroute'` to attempt automatic shard reassignment when the cause is a transient node disconnection.
    - Extend the `fetch_allocation_explain` task to iterate over all unassigned shards using `/_cat/shards?h=index,shard,prirep,state&s=state:desc`.
    - Route the allocation explain JSON to an S3 or GCS bucket for historical trending.
    - Replace the Slack webhook with `io.kestra.plugin.pagerduty.alerts.PagerDutyAlert` for PagerDuty incidents on critical clusters.

    ## Links

    - [Elasticsearch Cluster Health API](https://www.elastic.co/guide/en/elasticsearch/reference/current/cluster-health.html)
    - [Elasticsearch Cluster Allocation Explain API](https://www.elastic.co/guide/en/elasticsearch/reference/current/cluster-allocation-explain.html)
    - [Kestra Shell Commands plugin](https://kestra.io/plugins/plugin-script-shell)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  ee: false
  demo: false
