id: elasticsearch-unassigned-shards-recovery-sentinel
namespace: company.team

inputs:
  - id: es_host
    type: STRING
    defaults: "elasticsearch.internal"
    description: Hostname or IP of the Elasticsearch cluster endpoint.
  - id: es_port
    type: INT
    defaults: 9200
    description: Port of the Elasticsearch cluster endpoint.
  - id: es_user
    type: STRING
    defaults: "elastic"
    description: Elasticsearch username.
  - id: unassigned_threshold
    type: INT
    defaults: 0
    description: Maximum allowable unassigned shards before alerting.

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: fetch_cluster_health
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests
    env:
      ES_HOST: "{{ inputs.es_host }}"
      ES_PORT: "{{ inputs.es_port }}"
      ES_USER: "{{ inputs.es_user }}"
      ES_PASSWORD: "{{ secret('ES_PASSWORD') }}"
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      host = os.environ.get("ES_HOST", "elasticsearch.internal")
      port = os.environ.get("ES_PORT", "9200")
      user = os.environ.get("ES_USER", "elastic")
      password = os.environ.get("ES_PASSWORD", "")

      auth = (user, password) if user and password else None
      health_url = f"http://{host}:{port}/_cluster/health"
      explain_url = f"http://{host}:{port}/_cluster/allocation/explain"

      try:
          resp = requests.get(health_url, auth=auth, timeout=15)
          resp.raise_for_status()
          health_data = resp.json()
      except Exception as e:
          print(f"CRITICAL: Failed to query Elasticsearch cluster health at {health_url}: {e}", file=sys.stderr)
          sys.exit(1)

      status = health_data.get("status", "unknown")
      unassigned_shards = int(health_data.get("unassigned_shards", 0))
      relocating_shards = int(health_data.get("relocating_shards", 0))

      explain_data = {}
      if unassigned_shards > 0:
          try:
              exp_resp = requests.get(explain_url, auth=auth, timeout=15)
              if exp_resp.status_code == 200:
                  explain_data = exp_resp.json()
          except Exception as exp_err:
              print(f"Warning: Could not fetch allocation explain: {exp_err}")

      with open("cluster_health.json", "w") as f:
          json.dump(health_data, f, indent=2)

      with open("allocation_explain.json", "w") as f:
          json.dump(explain_data, f, indent=2)

      Kestra.outputs({
          "unassigned_shards": unassigned_shards,
          "cluster_status": status,
          "relocating_shards": relocating_shards
      })
      print(f"Cluster health: status={status}, unassigned_shards={unassigned_shards}")
    outputFiles:
      - cluster_health.json
      - allocation_explain.json

  - id: evaluate_unassigned_shards
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.fetch_cluster_health.vars.unassigned_shards | int > inputs.unassigned_threshold }}"
    then:
      - id: alert_unassigned_shards
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":rotating_light: *Elasticsearch Unassigned Shards Alert*\n*Host:* {{ inputs.es_host }}\n*Unassigned Shards:* {{ outputs.fetch_cluster_health.vars.unassigned_shards }}\n*Threshold:* {{ inputs.unassigned_threshold }}\n*Cluster Status:* {{ outputs.fetch_cluster_health.vars.cluster_status }}\nCheck `/_cluster/allocation/explain` for shard allocation details."
          }

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": ":warning: Elasticsearch Unassigned Shards Sentinel execution failed on {{ inputs.es_host }}. Execution ID: {{ execution.id }}."
      }

extend:
  title: Elasticsearch Unassigned Shards Recovery Sentinel
  metaTitle: Elasticsearch Unassigned Shards Recovery Sentinel Blueprint
  shortDescription: Audits Elasticsearch cluster health to detect unassigned shards and inspects allocation explanations.
  metaDescription: Audits Elasticsearch cluster health to detect unassigned shards and inspects allocation explanations.
  description: |
    ## How it works
    This workflow checks `GET /_cluster/health` on Elasticsearch to verify that all primary and replica shards are allocated. When nodes drop offline or disk watermarks prevent shard allocation, shards transition to an unassigned state. If unassigned shards are discovered, the sentinel inspects `/_cluster/allocation/explain` to diagnose root cause and notifies operations teams on Slack.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[schedule Schedule Trigger] --> B[fetch_cluster_health Python Script]
      B --> C{Unassigned Shards > Threshold?}
      C -- Yes --> D[alert_unassigned_shards Slack Webhook]
      C -- No --> E[All Shards Assigned]
    ```

    ## Prerequisites
    - Elasticsearch endpoint accessible via HTTP REST.
    - Secrets `ES_PASSWORD` and `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure cluster host and credentials.
    3. Run manually to check shard allocation.

    ## Links
    - [Elasticsearch Cluster Health API](https://www.elastic.co/guide/en/elasticsearch/reference/current/cluster-health.html)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
