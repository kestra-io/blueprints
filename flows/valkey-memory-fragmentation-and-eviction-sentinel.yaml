id: valkey-memory-fragmentation-and-eviction-sentinel
namespace: company.sre

description: |
  Monitors Valkey in-memory key-value cache memory fragmentation ratio and eviction velocity to prevent latency spikes, out-of-memory crashes, and unexpected cache drop-offs.

concurrency:
  limit: 1

inputs:
  - id: valkey_host
    type: STRING
    displayName: "Valkey Host"
    defaults: "valkey.internal"
    description: "DNS hostname or IP address of the Valkey cluster or standalone node."

  - id: valkey_port
    type: INT
    displayName: "Valkey Port"
    defaults: 6379
    description: "Port number exposed by the Valkey instance."

  - id: max_fragmentation_ratio
    type: FLOAT
    displayName: "Max Fragmentation Ratio"
    defaults: 1.5
    description: "Maximum allowable memory fragmentation ratio (used_memory_rss / used_memory) before flagging memory bloat."

  - id: max_evicted_keys_rate
    type: INT
    displayName: "Max Evicted Keys Threshold"
    defaults: 50
    description: "Maximum allowable evicted keys per inspection window indicating volatile-lru/allkeys-lru memory pressure."

triggers:
  - id: scheduled_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_valkey_memory_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: redis:7-alpine
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      VALKEY_HOST: "{{ inputs.valkey_host }}"
      VALKEY_PORT: "{{ inputs.valkey_port }}"
      VALKEY_AUTH: "{{ secret('VALKEY_PASSWORD') }}"
      MAX_FRAG: "{{ inputs.max_fragmentation_ratio }}"
      MAX_EVICT: "{{ inputs.max_evicted_keys_rate }}"
    commands:
      - |
        AUTH_ARGS=""
        if [ -n "$VALKEY_AUTH" ]; then
          AUTH_ARGS="-a $VALKEY_AUTH --no-auth-warning"
        fi

        INFO_OUTPUT=$(redis-cli -h "$VALKEY_HOST" -p "$VALKEY_PORT" $AUTH_ARGS INFO memory 2>/dev/null)
        STATS_OUTPUT=$(redis-cli -h "$VALKEY_HOST" -p "$VALKEY_PORT" $AUTH_ARGS INFO stats 2>/dev/null)

        if [ -z "$INFO_OUTPUT" ]; then
          echo "Failed to connect to Valkey node at $VALKEY_HOST:$VALKEY_PORT" >&2
          exit 1
        fi

        MEM_RSS=$(echo "$INFO_OUTPUT" | grep "used_memory_rss:" | tr -d '\r' | cut -d: -f2)
        MEM_USED=$(echo "$INFO_OUTPUT" | grep "used_memory:" | tr -d '\r' | cut -d: -f2)
        FRAG_RATIO=$(echo "$INFO_OUTPUT" | grep "mem_fragmentation_ratio:" | tr -d '\r' | cut -d: -f2)
        EVICTED_KEYS=$(echo "$STATS_OUTPUT" | grep "evicted_keys:" | tr -d '\r' | cut -d: -f2)

        FRAG_EXCEEDED=false
        EVICTION_EXCEEDED=false

        awk_check=$(awk -v frag="$FRAG_RATIO" -v max="$MAX_FRAG" 'BEGIN {print (frag > max) ? "true" : "false"}')
        if [ "$awk_check" = "true" ]; then
          FRAG_EXCEEDED=true
        fi

        if [ "$EVICTED_KEYS" -gt "$MAX_EVICT" ]; then
          EVICTION_EXCEEDED=true
        fi

        ALERT_REQUIRED=false
        if [ "$FRAG_EXCEEDED" = "true" ] || [ "$EVICTION_EXCEEDED" = "true" ]; then
          ALERT_REQUIRED=true
        fi

        cat <<EOF > output.json
        {
          "mem_rss_bytes": $MEM_RSS,
          "mem_used_bytes": $MEM_USED,
          "fragmentation_ratio": $FRAG_RATIO,
          "evicted_keys_count": $EVICTED_KEYS,
          "frag_exceeded": $FRAG_EXCEEDED,
          "eviction_exceeded": $EVICTION_EXCEEDED,
          "alert_required": $ALERT_REQUIRED
        }
        EOF

    outputFiles:
      - output.json

  - id: evaluate_alert_thresholds
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.probe_valkey_memory_metrics.outputFiles['output.json'])).alert_required }}"
    then:
      - id: notify_slack_memory_saturation
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#infrastructure-alerts",
            "text": "🚨 *Valkey Memory Pressure Alert: `{{ inputs.valkey_host }}`*\n- *Fragmentation Ratio*: `{{ json(read(outputs.probe_valkey_memory_metrics.outputFiles['output.json'])).fragmentation_ratio }}` (Threshold: {{ inputs.max_fragmentation_ratio }})\n- *Evicted Keys*: `{{ json(read(outputs.probe_valkey_memory_metrics.outputFiles['output.json'])).evicted_keys_count }}`\n- *Used Memory RSS*: `{{ json(read(outputs.probe_valkey_memory_metrics.outputFiles['output.json'])).mem_rss_bytes }} bytes`"
          }

errors:
  - id: notify_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#infrastructure-alerts",
        "text": "❌ *Valkey Sentinel Probe Execution Failed on `{{ inputs.valkey_host }}`*"
      }

extend:
  title: Valkey Memory Fragmentation and Eviction Velocity Sentinel
  shortDescription: Audits Valkey memory fragmentation ratio and key eviction velocity to safeguard against cache memory leaks and throughput drops.
  description: |
    Audits Valkey in-memory key-value cache memory fragmentation ratio and eviction velocity to prevent latency spikes, out-of-memory crashes, and unexpected cache drop-offs.

    ## How it works
    1. A scheduled trigger or manual invocation executes the sentinel probe against the designated Valkey node.
    2. The sentinel runs `redis-cli INFO memory` and `redis-cli INFO stats` via an isolated container runner to fetch active telemetry.
    3. Metrics including RSS memory allocation, used dataset memory, active memory fragmentation ratio, and cumulative key evictions are extracted.
    4. An automated conditional gate compares fragmentation and eviction velocity against specified operational thresholds.
    5. When thresholds are breached, an automated Slack alert is immediately broadcast with host metrics and remediation context.

    ## What you get
    - Real-time visibility into Valkey memory health and page allocator fragmentation.
    - Automated detection of key eviction spikes caused by memory saturation.
    - Zero external dependencies using standard protocol commands.
    - Direct integration with Slack webhooks for incident response teams.

    ## Who it's for
    - Site Reliability Engineers (SREs) monitoring in-memory databases and microservice caching tiers.
    - Platform Engineers responsible for Valkey and Redis distributed infrastructures.
    - Database Administrators optimizing memory footprint and maxmemory eviction policies.

    ## Why orchestrate this with Kestra
    - Provides centralized, scheduled polling without maintaining bespoke monitoring cron scripts.
    - Encrypts cluster passwords and webhook credentials using secure Kestra namespace secrets.
    - Provides full audit trail of past execution metrics and trends.
    - Extensible to trigger auto-remediation like active defragmentation or memory scale-up.

    ## Prerequisites
    - Valkey or Redis compatible instance accessible over the network.
    - `VALKEY_PASSWORD` stored in Kestra namespace secrets (if authentication is required).
    - `SLACK_WEBHOOK` secret configured for alert dispatches.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Define `VALKEY_PASSWORD` and `SLACK_WEBHOOK` in your namespace secrets.
    3. Set `valkey_host` to your internal Valkey host or service DNS.
    4. Run an ad-hoc execution to verify connectivity.
    5. Enable the schedule trigger for continuous automated surveillance.

    ## How to extend
    - Add a remediation step invoking `CONFIG SET activedefrag yes` when fragmentation exceeds 1.8.
    - Forward collected metrics to a long-term time-series database or Datadog.
    - Support cluster-wide multi-node sweeps using Kestra `ForEach` task looping over all cluster shard addresses.

    ## Links
    - [Valkey GitHub Repository](https://github.com/valkey-io/valkey)
    - [Valkey Memory Optimization Guide](https://valkey.io/topics/memory-optimization/)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
