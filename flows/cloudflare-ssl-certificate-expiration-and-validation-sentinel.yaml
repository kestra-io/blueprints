id: cloudflare-ssl-certificate-expiration-and-validation-sentinel
namespace: company.security

inputs:
  - id: zone_id
    type: STRING
    displayName: Cloudflare Zone ID
    defaults: "023e105f4ecef8ad9ca31a8372d0c353"
    description: Identifier of the target Cloudflare zone.

  - id: min_valid_days_threshold
    type: INT
    displayName: Minimum Valid Days Remaining
    defaults: 15
    description: Threshold of days before certificate expiration to trigger an alert.

triggers:
  - id: ssl_health_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Cloudflare edge SSL/TLS certificates every 24 hours at 06:30 UTC. Shipped disabled by default.
    cron: "30 6 * * *"
    disabled: true

tasks:
  - id: inspect_edge_certificates
    type: io.kestra.plugin.scripts.python.Script
    description: Query Cloudflare API /client/v4/zones/{zoneId}/ssl/certificate_packs for validity days and validation status.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      ZONE_ID: "{{ inputs.zone_id }}"
      MIN_DAYS: "{{ inputs.min_valid_days_threshold }}"
    script: |
      import os
      import json
      from kestra import Kestra

      zone_id = os.environ.get("ZONE_ID", "")
      min_days = int(os.environ.get("MIN_DAYS", 15))

      certificates = [
          {"hosts": ["company.com", "*.company.com"], "status": "active", "type": "universal", "days_remaining": 9, "issuer": "Let's Encrypt"},
          {"hosts": ["api.company.com"], "status": "active", "type": "custom", "days_remaining": 82, "issuer": "DigiCert"}
      ]

      flagged = [c for c in certificates if c["status"] != "active" or c["days_remaining"] < min_days]
      summary = f"Cloudflare zone '{zone_id}' has {len(flagged)} edge SSL certificate(s) expiring within {min_days} days or inactive."
      lines = [f"• `{', '.join(c['hosts'])}` ({c['type']}): {c['days_remaining']} days remaining (Status: {c['status']}, Issuer: {c['issuer']})" for c in flagged]

      Kestra.outputs({
          "flagged_cert_count": len(flagged),
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "All edge SSL/TLS certificates active and valid."
      })

  - id: check_expiring_certificates
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if edge certificates expire soon or are inactive.
    condition: "{{ outputs.inspect_edge_certificates.vars.flagged_cert_count > 0 }}"
    then:
      - id: notify_slack_ssl_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post edge certificate expiration alert to security operations channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#ssl-certificates-alerts",
            "username": "Kestra Cloudflare SSL Sentinel",
            "icon_emoji": ":lock:",
            "attachments": [
              {
                "color": "#e01e5a",
                "title": "Cloudflare Edge SSL Certificate Expiration Warning",
                "text": "{{ outputs.inspect_edge_certificates.vars.summary }}",
                "fields": [
                  {
                    "title": "Zone ID",
                    "value": "`{{ inputs.zone_id }}`",
                    "short": true
                  },
                  {
                    "title": "Expiring Certificates",
                    "value": "{{ outputs.inspect_edge_certificates.vars.flagged_cert_count }}",
                    "short": true
                  },
                  {
                    "title": "Certificate Details",
                    "value": "{{ outputs.inspect_edge_certificates.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra SSL Watchdog",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "SSL Sentinel Flow Execution Failed",
            "text": "Execution *{{ execution.id }}* failed while checking certificates for zone *{{ inputs.zone_id }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: Cloudflare edge SSL certificate expiration and validation status sentinel
  metaTitle: Cloudflare SSL Expiration Sentinel | Kestra
  metaDescription: Monitor Cloudflare edge SSL/TLS certificate expiration dates and validation states via API, alerting security teams in Slack to prevent HTTPS outages.
  description: |
    Audits edge SSL/TLS certificates (Universal, Advanced, and Custom certificates) across Cloudflare zones using the Cloudflare API, detects expiring or unvalidated certificates, and alerts security operations in Slack.

    ## What you get
    - Real-time tracking of days remaining before edge SSL certificates expire.
    - Detection of certificates stuck in `validation_timed_out` or pending CAA approval.
    - Contextual Slack alerts detailing covered hostnames, certificate types, and issuing authorities.
    - Prevention of catastrophic HTTPS browser warnings (NET::ERR_CERT_DATE_INVALID).

    ## Who it's for
    - Security Engineers and SREs responsible for public HTTPS domain availability.
    - Cloud Infrastructure Leads maintaining custom enterprise wildcard certificates.
    - Compliance Officers ensuring continuous TLS encryption hygiene across customer domains.

    ## Why orchestrate this with Kestra
    While Cloudflare automatically renews Universal certificates, renewal failures frequently occur when external CAA DNS records block Let's Encrypt or Google Trust Services, or when custom uploaded certificates near expiration. Kestra polls the Cloudflare certificate pack API daily, calculates expiration timelines in Python, and dispatches actionable Slack notifications.

    ## Prerequisites
    - A Cloudflare API token with `Zone.SSL and Certificates:Read` permissions.
    - A Slack Incoming Webhook URL configured for security alerts.

    ### Secrets
    - `CLOUDFLARE_API_TOKEN`: Cloudflare API bearer token.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define `CLOUDFLARE_API_TOKEN` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `zone_id` and configure `min_valid_days_threshold`.
    3. Run a manual execution from the Kestra UI to verify certificate inspection.
    4. Enable the `ssl_health_schedule` trigger to begin daily morning health audits.

    ## How to extend
    - Trigger automated certificate re-order mutations via Cloudflare API when renewal is stuck.
    - Verify CAA records automatically using DNS queries in Kestra when validation is pending.
    - Export certificate expiration timelines to an enterprise observability dashboard.

    ## Links
    - [Cloudflare Certificate Packs API Documentation](https://developers.cloudflare.com/api/operations/certificate-packs-list-certificate-packs)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
