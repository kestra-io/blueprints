    - [Serdes plugin](https://kestra.io/plugins/plugin-serdes)
    - [DuckDB plugin](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [Pause task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.pause)
    - [Webhook trigger](https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.webhook)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Approval Gates
    - Day 2 Operations
  ee: false
  demo: false
