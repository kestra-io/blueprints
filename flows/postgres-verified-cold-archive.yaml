id: postgres-verified-cold-archive
namespace: company.team

description: |
  Archive old rows of a hot Postgres table to Parquet in MinIO/S3, prove the archive by reading it back,
  then delete the rows only after a human types the table name to confirm.
  Nothing is deleted unless: archived rows == exported rows == rows still in Postgres at purge time.

concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: table
    type: STRING
    defaults: events
    validator: ^[a-z_][a-z0-9_]{0,62}$
    description: Unquoted lowercase table name (no schema prefix). Validated because it is interpolated into SQL.

  - id: date_column
    type: STRING
    defaults: created_at
    validator: ^[a-z_][a-z0-9_]{0,62}$
    description: Timestamp or date column used for the retention cutoff.

  - id: retention_days
    type: INT
    defaults: 365
    min: 30
    description: Rows older than this many days are archived, then purged.

  - id: bucket
    type: STRING
    defaults: cold-archive

  - id: notify_slack
    type: BOOL
    defaults: false
    description: Post the approval request to Slack (needs the SLACK_WEBHOOK_URL secret).

variables:
  cutoff: "{{ execution.startDate | dateAdd(inputs.retention_days * -1, 'DAYS') | date('yyyy-MM-dd') }}"
  object_key: "archive/{{ inputs.table }}/cutoff={{ execution.startDate | dateAdd(inputs.retention_days * -1, 'DAYS') | date('yyyy-MM-dd') }}/{{ execution.id }}.parquet"

tasks:
  - id: count_candidates
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "{{ secret('POSTGRES_URL') }}"
    username: "{{ secret('POSTGRES_USERNAME') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH_ONE
    sql: "SELECT count(*) AS n FROM {{ inputs.table }} WHERE {{ inputs.date_column }} < CAST(:cutoff AS date)"
    parameters:
      cutoff: "{{ render(vars.cutoff) }}"

  - id: has_rows
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.count_candidates.row.n > 0 }}"
    then:
      - id: export_rows
        type: io.kestra.plugin.jdbc.postgresql.Query
        url: "{{ secret('POSTGRES_URL') }}"
        username: "{{ secret('POSTGRES_USERNAME') }}"
        password: "{{ secret('POSTGRES_PASSWORD') }}"
        fetchType: STORE
        sql: "SELECT * FROM {{ inputs.table }} WHERE {{ inputs.date_column }} < CAST(:cutoff AS date)"
        parameters:
          cutoff: "{{ render(vars.cutoff) }}"

      - id: to_parquet
        type: io.kestra.plugin.serdes.parquet.IonToParquet
        from: "{{ outputs.export_rows.uri }}"
        inferAllFields: true

      - id: upload_archive
        type: io.kestra.plugin.minio.Upload
        endpoint: "{{ secret('MINIO_ENDPOINT') }}"
        accessKeyId: "{{ secret('MINIO_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('MINIO_SECRET_KEY_ID') }}"
        bucket: "{{ inputs.bucket }}"
        from: "{{ outputs.to_parquet.uri }}"
        key: "{{ render(vars.object_key) }}"

      - id: download_back
        type: io.kestra.plugin.minio.Download
        endpoint: "{{ secret('MINIO_ENDPOINT') }}"
        accessKeyId: "{{ secret('MINIO_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('MINIO_SECRET_KEY_ID') }}"
        bucket: "{{ inputs.bucket }}"
        key: "{{ render(vars.object_key) }}"

      - id: count_archive
        type: io.kestra.plugin.jdbc.duckdb.Query
        inputFiles:
          archive.parquet: "{{ outputs.download_back.uri }}"
        fetchType: FETCH_ONE
        sql: "SELECT count(*) AS n FROM read_parquet('archive.parquet')"

      - id: verify_archive
        type: io.kestra.plugin.core.execution.Assert
        conditions:
          - "{{ outputs.count_archive.row.n == outputs.to_parquet.size }}"
          - "{{ outputs.to_parquet.size == outputs.export_rows.size }}"
        errorMessage: Archive read back from the bucket does not match the exported rows. Nothing was deleted.

      - id: ask_slack
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.notify_slack }}"
        then:
          - id: notify_approval
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            messageText: "Archive verified: {{ outputs.count_archive.row.n }} rows of {{ inputs.table }} older than {{ render(vars.cutoff) }} are in s3://{{ inputs.bucket }}/{{ render(vars.object_key) }}. Resume execution {{ execution.id }} and type the table name to purge them."

      - id: approve_purge
        type: io.kestra.plugin.core.flow.Pause
        pauseDuration: P2D
        behavior: CANCEL
        onResume:
          - id: confirm_table
            type: STRING
            description: Type the table name to confirm deletion of the archived rows.

      - id: confirm_name
        type: io.kestra.plugin.core.execution.Assert
        conditions:
          - "{{ outputs.approve_purge.onResume.confirm_table == inputs.table }}"
        errorMessage: Confirmation did not match the table name. Nothing was deleted.

      - id: recount
        type: io.kestra.plugin.jdbc.postgresql.Query
        url: "{{ secret('POSTGRES_URL') }}"
        username: "{{ secret('POSTGRES_USERNAME') }}"
        password: "{{ secret('POSTGRES_PASSWORD') }}"
        fetchType: FETCH_ONE
        sql: "SELECT count(*) AS n FROM {{ inputs.table }} WHERE {{ inputs.date_column }} < CAST(:cutoff AS date)"
        parameters:
          cutoff: "{{ render(vars.cutoff) }}"

      - id: still_matches
        type: io.kestra.plugin.core.execution.Assert
        conditions:
          - "{{ outputs.recount.row.n == outputs.count_archive.row.n }}"
        errorMessage: Rows older than the cutoff changed while waiting for approval. Nothing was deleted; re-run to archive again.

      - id: purge
        type: io.kestra.plugin.jdbc.postgresql.Query
        url: "{{ secret('POSTGRES_URL') }}"
        username: "{{ secret('POSTGRES_USERNAME') }}"
        password: "{{ secret('POSTGRES_PASSWORD') }}"
        fetchType: FETCH_ONE
        sql: "WITH d AS (DELETE FROM {{ inputs.table }} WHERE {{ inputs.date_column }} < CAST(:cutoff AS date) RETURNING 1) SELECT count(*) AS deleted FROM d"
        parameters:
          cutoff: "{{ render(vars.cutoff) }}"

      - id: verify_purge
        type: io.kestra.plugin.core.execution.Assert
        conditions:
          - "{{ outputs.purge.row.deleted == outputs.count_archive.row.n }}"
        errorMessage: Deleted row count differs from the archived row count. Restore from the archive object and investigate.

      - id: log_done
        type: io.kestra.plugin.core.log.Log
        message: "Archived and purged {{ outputs.purge.row.deleted }} rows from {{ inputs.table }} (older than {{ render(vars.cutoff) }}). Archive: s3://{{ inputs.bucket }}/{{ render(vars.object_key) }}"
    else:
      - id: log_nothing
        type: io.kestra.plugin.core.log.Log
        message: "No rows in {{ inputs.table }} older than {{ render(vars.cutoff) }}. Nothing to archive."

errors:
  - id: log_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: "Cold archive of {{ inputs.table }} stopped before completion. Rows are only deleted by the purge task, after verification and approval; check its state in execution {{ execution.id }}."

triggers:
  - id: archive_request
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('ARCHIVE_WEBHOOK_KEY') }}"
    inputs:
      table: "{{ trigger.body.table ?? 'events' }}"
      date_column: "{{ trigger.body.date_column ?? 'created_at' }}"
      retention_days: "{{ trigger.body.retention_days ?? 365 }}"

extend:
  title: Archive old Postgres rows to Parquet, verify the archive, then purge after approval
  shortDescription: Export old Postgres rows to Parquet in MinIO/S3, read the object back to verify it, then delete the rows only after a human types the table name to confirm.
  metaTitle: Archive old Postgres rows to Parquet with verified read-back and approved purge in Kestra
  metaDescription: Archive old Postgres rows to Parquet in MinIO/S3, verify by read-back, and purge only after a typed human confirmation in Kestra.
  description: |
    Deleting old rows from a hot Postgres table is usually a manual "export, then `DELETE`" with no proof that the export is readable. One bad dump means permanent data loss, and nobody can say afterwards what was removed.

    This blueprint makes the proof and the approval part of the pipeline:
    - Exports every row older than `retention_days` to Parquet and uploads it to MinIO/S3.
    - Downloads the object back from the bucket and counts it with DuckDB, so it verifies what is actually stored, not what was sent.
    - Pauses for a human to type the table name before anything is deleted.
    - Re-checks that the source did not change while waiting, then purges and confirms the deleted count equals the archived count.

    Rows are deleted only if archived rows, exported rows and the rows still in Postgres at purge time all agree.

    ## How it works

    1. `archive_request` (`io.kestra.plugin.core.trigger.Webhook`) starts the flow; the body fields `table`, `date_column` and `retention_days` map onto the flow inputs.
    2. `count_candidates` (`io.kestra.plugin.jdbc.postgresql.Query`) counts rows older than the cutoff, and `has_rows` (`io.kestra.plugin.core.flow.If`) ends the run early when there is nothing to archive.
    3. `export_rows` (`io.kestra.plugin.jdbc.postgresql.Query`) streams the rows to internal storage, `to_parquet` (`io.kestra.plugin.serdes.parquet.IonToParquet`) converts them, and `upload_archive` (`io.kestra.plugin.minio.Upload`) writes the object to the bucket.
    4. `download_back` (`io.kestra.plugin.minio.Download`) reads the object back and `count_archive` (`io.kestra.plugin.jdbc.duckdb.Query`) counts its rows; `verify_archive` (`io.kestra.plugin.core.execution.Assert`) fails the run if the counts differ.
    5. `ask_slack` (`io.kestra.plugin.core.flow.If`) optionally sends the approval request through `notify_approval` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).
    6. `approve_purge` (`io.kestra.plugin.core.flow.Pause`) waits for a human to type the table name, up to two days. If nobody answers, the execution is cancelled and nothing is deleted.
    7. `confirm_name` and `still_matches` (`io.kestra.plugin.core.execution.Assert`) check the typed name and that a fresh `recount` still equals the archived count.
    8. `purge` (`io.kestra.plugin.jdbc.postgresql.Query`) deletes the rows and `verify_purge` checks the deleted count against the archived count.

    ## What you get

    - **Verified archives**: the Parquet object is read back from the bucket before any row is removed.
    - **A human gate on the destructive step**: a wrong table name fails the run and keeps every row.
    - **Safe on failure**: any failed check stops the flow before the `DELETE`, and the archive stays in the bucket.
    - **Reusable**: the table, date column, retention and bucket are inputs, so one flow serves several tables.

    ## Who it's for

    - Platform and data engineers who pay for storage on a hot OLTP table and need to trim it.
    - DBAs who want retention enforced with evidence instead of an ad hoc script.
    - Teams that need an auditable record of what was archived and who approved the purge.

    ## Why orchestrate this with Kestra

    A shell script can export and delete, but it cannot pause for approval, verify the stored object independently, or leave a per-run audit trail. Kestra gives the flow a webhook entry point, a `Pause` that survives restarts, assertions that stop the run on a mismatch, and a history of every execution with the exact counts at each step.

    ## Prerequisites

    - A PostgreSQL database with a table that has a timestamp or date column.
    - A MinIO or S3-compatible bucket (default name `cold-archive`) that already exists.
    - Optional: a Slack incoming webhook for the approval message.

    ### Secrets

    - `POSTGRES_URL`: JDBC URL of the source database, for example `jdbc:postgresql://host:5432/db`.
    - `POSTGRES_USERNAME`: database user with read and delete rights on the table.
    - `POSTGRES_PASSWORD`: password for that user.
    - `MINIO_ENDPOINT`: endpoint URL of the MinIO or S3-compatible store.
    - `MINIO_ACCESS_KEY_ID`: access key for the bucket.
    - `MINIO_SECRET_KEY_ID`: secret key for the bucket.
    - `ARCHIVE_WEBHOOK_KEY`: key segment that secures the webhook URL.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook, only needed when `notify_slack` is true.

    ### Inputs

    - `table` (STRING, default `events`): lowercase unquoted table name, regex-validated because it is interpolated into SQL.
    - `date_column` (STRING, default `created_at`): timestamp or date column used for the cutoff, same validation.
    - `retention_days` (INT, default `365`, minimum `30`): rows older than this are archived, then purged.
    - `bucket` (STRING, default `cold-archive`): destination bucket.
    - `notify_slack` (BOOL, default `false`): send the approval request to Slack.

    ## Quick start

    1. Add the secrets above to your Kestra namespace and create the bucket.
    2. Upload the flow and execute it from the UI, or call the webhook:
       ```bash
       curl -X POST "https://kestra.example.com/api/v1/main/executions/webhook/company.team/postgres-verified-cold-archive/<ARCHIVE_WEBHOOK_KEY>" \
         -H "Content-Type: application/json" \
         -d '{"table":"events","date_column":"created_at","retention_days":365}'
       ```
    3. Wait for the execution to pause at `approve_purge`, then resume it and type the table name.
    4. Check `log_done` for `Archived and purged N rows ...` and find the object at `s3://<bucket>/archive/<table>/cutoff=<date>/<execution id>.parquet`.

    A paused run holds the flow's concurrency slot until it is resumed or times out.

    ## How to extend

    - **Several tables**: wrap the logic in a `Subflow` and call it once per table.
    - **Cold storage lifecycle**: add a bucket lifecycle rule on `archive/` to expire old archives.
    - **Stricter verification**: compare a column checksum between the source and the archive before approving.
    - **Different object store**: swap `minio` for `aws.s3` or `gcp.gcs` uploads and downloads.

