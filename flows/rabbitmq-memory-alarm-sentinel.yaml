id: rabbitmq-memory-alarm-sentinel
namespace: company.messaging

inputs:
  - id: rabbitmq_management_host
    type: STRING
    defaults: rabbitmq.internal:15672
    description: Host and port of the RabbitMQ Management API.
  - id: rabbitmq_username
    type: STRING
    defaults: guest
    description: Username for RabbitMQ Management API.

tasks:
  - id: inspect_node_alarms
    type: io.kestra.plugin.scripts.python.Script
    description: Inspects RabbitMQ nodes for active memory or disk alarms.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      RMQ_HOST: "{{ inputs.rabbitmq_management_host }}"
      RMQ_USER: "{{ inputs.rabbitmq_username }}"
      RMQ_PASS: "{{ secret('RABBITMQ_PASSWORD') }}"
    script: |
      import os
      import sys
      import requests
      from requests.auth import HTTPBasicAuth
      from kestra import Kestra

      host = os.environ.get("RMQ_HOST", "").rstrip("/")
      user = os.environ.get("RMQ_USER", "")
      password = os.environ.get("RMQ_PASS", "")
      url = f"http://{host}/api/nodes"

      try:
          resp = requests.get(url, auth=HTTPBasicAuth(user, password), timeout=15)
          resp.raise_for_status()
          nodes = resp.json()
      except Exception as err:
          print(f"Error: Failed to query nodes at {url}: {err}", file=sys.stderr)
          sys.exit(1)

      alarmed_nodes = []
      for n in nodes:
          name = n.get("name", "")
          mem_alarm = n.get("mem_alarm", False)
          disk_alarm = n.get("disk_free_alarm", False)
          if mem_alarm or disk_alarm:
              alarmed_nodes.append({
                  "node": name,
                  "mem_alarm": mem_alarm,
                  "disk_alarm": disk_alarm,
                  "mem_used_mb": round(n.get("mem_used", 0) / 1048576.0, 1),
                  "disk_free_mb": round(n.get("disk_free", 0) / 1048576.0, 1)
              })

      alarmed_count = len(alarmed_nodes)
      alert_triggered = bool(alarmed_count > 0)
      print(f"Alarms audit: total={len(nodes)}, alarmed={alarmed_count}, alert={alert_triggered}")

      Kestra.outputs({
          "total_nodes": len(nodes),
          "alarmed_nodes_count": alarmed_count,
          "alert_triggered": alert_triggered
      })

  - id: evaluate_node_alarms
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_node_alarms.vars.alert_triggered }}"
    then:
      - id: alert_messaging_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":rotating_light: *RabbitMQ Resource Alarm Alert*: Active memory or disk alarm triggered on {{ inputs.rabbitmq_management_host }}. Producers are actively being blocked from publishing messages to prevent broker crashes."
          }

outputs:
  - id: total_nodes
    type: INT
    value: "{{ outputs.inspect_node_alarms.vars.total_nodes }}"
  - id: alarmed_nodes_count
    type: INT
    value: "{{ outputs.inspect_node_alarms.vars.alarmed_nodes_count }}"
  - id: alert_triggered
    type: BOOLEAN
    value: "{{ outputs.inspect_node_alarms.vars.alert_triggered }}"

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *RabbitMQ Sentinel Failure*: Failed to query alarm states on {{ inputs.rabbitmq_management_host }}."
      }

triggers:
  - id: scheduled_alarm_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true

extend:
  metaDescription: "Audits RabbitMQ cluster nodes to detect memory high-watermark and low-disk alarms that block message publishers."
  metaTitle: RabbitMQ Memory and Disk Free Alarm Sentinel with Kestra
  title: RabbitMQ Memory and Disk Free Alarm Sentinel
  shortDescription: Audits RabbitMQ cluster nodes to detect memory high-watermark and low-disk alarms that block message publishers.
  description: |
    ## How it works
    This sentinel contacts the RabbitMQ Management HTTP API `/api/nodes` endpoint across all cluster instances. It evaluates the `mem_alarm` and `disk_free_alarm` states on each node, alerting operators immediately when broker memory or disk thresholds trigger flow control, blocking client publisher connections.

    ## What you get
    - Instant visibility into active RabbitMQ publisher flow control and backpressure.
    - Early prevention of unhandled queue growth exhausting node disk partitions.
    - Automated Slack incident delivery indicating affected node names, memory used, and disk free MB.

    ## Who it's for
    - Distributed messaging platform engineers and SREs administering RabbitMQ.
    - Backend application teams debugging blocked publisher microservices.

    ## Why orchestrate this with Kestra
    Kestra automates distributed system observability, executing scheduled health checks with fine-grained error management and notification delivery.

    ## Prerequisites
    - RabbitMQ Management plugin enabled.
    - Secrets `RABBITMQ_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `rabbitmq_management_host` and credentials.
    3. Run manually to check current alarm states.

    ## How to extend
    - Automatically purge non-essential debug queues via management API calls in an emergency response.
    - Trigger auto-scaling of underlying disk volumes on AWS EBS or Google Persistent Disk.
    - Forward alarm events to PagerDuty.

    ## Links
    - [RabbitMQ Memory and Disk Alarms](https://www.rabbitmq.com/docs/alarms)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
