id: opa-gatekeeper-constraint-violations-sentinel
namespace: company.security
inputs:
- id: gatekeeper_metrics_url
  type: STRING
  defaults: http://gatekeeper-controller-manager.gatekeeper-system:8888/metrics
  description: Prometheus scrape endpoint for OPA Gatekeeper metrics.
tasks:
- id: scrape_gatekeeper_violations
  type: io.kestra.plugin.scripts.python.Script
  containerImage: python:3.11-slim
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  beforeCommands:
  - pip install requests kestra
  env:
    GATEKEEPER_METRICS_URL: '{{ inputs.gatekeeper_metrics_url }}'
  script: "import os\nimport sys\nimport requests\nfrom kestra import Kestra\n\nmetrics_url\
    \ = os.environ.get(\"GATEKEEPER_METRICS_URL\", \"http://gatekeeper-controller-manager.gatekeeper-system:8888/metrics\"\
    )\n\ntry:\n    resp = requests.get(metrics_url, timeout=10)\n    resp.raise_for_status()\n\
    except Exception as err:\n    sys.stderr.write(f\"Failed to query Gatekeeper metrics\
    \ from {metrics_url}: {err}\\n\")\n    sys.exit(1)\n\nviolations = 0\nfound =\
    \ False\n\nfor line in resp.text.splitlines():\n    line = line.strip()\n    if\
    \ line.startswith(\"#\") or not line:\n        continue\n    if line.startswith(\"\
    gatekeeper_violations\"):\n        parts = line.split()\n        if len(parts)\
    \ >= 2:\n            try:\n                violations += int(float(parts[-1]))\n\
    \                found = True\n            except ValueError:\n              \
    \  pass\n\nif not found:\n    sys.stderr.write(\"Metric 'gatekeeper_violations'\
    \ not found in Prometheus scrape output.\\n\")\n    sys.exit(1)\n\nKestra.outputs({\n\
    \    \"violations\": violations\n})\n"
- id: evaluate_policy_compliance
  type: io.kestra.plugin.core.flow.If
  condition: '{{ outputs.scrape_gatekeeper_violations.vars.violations > 0 }}'
  then:
  - id: notify_governance_team
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: '{{ secret(''SLACK_WEBHOOK'') }}'
    payload: "{\n  \"channel\": \"#k8s-security\",\n  \"attachments\": [\n    {\n\
      \      \"color\": \"danger\",\n      \"title\": \"\U0001F6A8 OPA Gatekeeper\
      \ Constraint Violations Alert\",\n      \"text\": \"Gatekeeper controller detected\
      \ *{{ outputs.scrape_gatekeeper_violations.vars.violations }} active policy\
      \ constraint violations*! Non-compliant workloads exist in cluster namespaces.\"\
      ,\n      \"footer\": \"Kestra Governance Sentinel \u2022 OPA Gatekeeper\"\n\
      \    }\n  ]\n}"
errors:
- id: alert_pipeline_failure
  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
  url: '{{ secret(''SLACK_WEBHOOK'') }}'
  payload: "{\n  \"channel\": \"#k8s-security\",\n  \"attachments\": [\n    {\n  \
    \    \"color\": \"danger\",\n      \"title\": \"\u26A0\uFE0F Gatekeeper Sentinel\
    \ Failure\",\n      \"text\": \"Failed to scrape OPA Gatekeeper metrics endpoint.\
    \ Verify controller manager reachability.\",\n      \"footer\": \"Kestra Workflow\
    \ Failure Sentinel\"\n    }\n  ]\n}\n"
triggers:
- id: periodic_schedule
  type: io.kestra.plugin.core.trigger.Schedule
  cron: 0 * * * *
  disabled: true
extend:
  metaDescription: Audits OPA Gatekeeper for policy violations and non-compliant Kubernetes
    resources across cluster namespaces.
  metaTitle: Open Policy Agent (OPA) Gatekeeper Audit Constraint Violations Sentinel
    with Kestra
  title: Open Policy Agent (OPA) Gatekeeper Audit Constraint Violations Sentinel
  shortDescription: Audits OPA Gatekeeper for policy violations and non-compliant
    Kubernetes resources across cluster namespaces.
  description: '## How it works

    This workflow queries the Prometheus metrics endpoint of the OPA Gatekeeper controller
    manager (port `8888`) to audit the `gatekeeper_violations` gauge. Gatekeeper enforces
    admission control and audits existing Kubernetes resources against Rego constraint
    templates (such as requiring non-root user execution, forbidding privileged containers,
    and mandating resource limits). When non-compliant resources exist in the cluster,
    `gatekeeper_violations` increments. This workflow tracks violations and immediately
    escalates policy drift to Kubernetes governance teams.


    ## What you get

    - Real-time detection of non-compliant Kubernetes resources.

    - Prevents privilege escalation and container security violations.

    - Clear quantitative metrics on total cluster policy violations.


    ## Who it''s for

    - Kubernetes Security Architects and Compliance Officers.

    - Platform Engineers enforcing cluster hardening standards.


    ## Why orchestrate this with Kestra

    - **Continuous Compliance Verification**: Automates cluster governance audits
    without extra overhead.

    - **External Alert Channel**: Delivers notifications independently to compliance
    Slack channels.

    - **Zero Infrastructure Footprint**: Uses simple HTTP metrics scraping.


    ## Prerequisites

    - OPA Gatekeeper deployed with Prometheus metrics enabled.

    - Secret `SLACK_WEBHOOK` configured in Kestra.


    ## Quick start

    1. Import the blueprint.

    2. Input Gatekeeper metrics URL.

    3. Run the workflow to inspect current violation counts.


    ## How to extend

    - Query `gatekeeper_constraints{enforcementAction="deny"}` for specific failing
    constraints.

    - Automatically create Jira tickets for offending development teams.


    ## Links

    - [OPA Gatekeeper Documentation](https://open-policy-agent.github.io/gatekeeper/website/docs/)

    - [Kestra Documentation](https://kestra.io/docs)

    '
  tags:
  - Infrastructure
  - Cloud
  subTags:
  - Day 2 Operations
  - Infrastructure Automation
  ee: false
  demo: false
outputs:
- id: violations
  type: INT
  value: '{{ outputs.scrape_gatekeeper_violations.vars.violations }}'
