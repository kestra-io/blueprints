id: opa-gatekeeper-constraint-violations-sentinel
namespace: company.security

inputs:
  - id: gatekeeper_metrics_url
    type: STRING
    defaults: "http://gatekeeper-controller-manager.gatekeeper-system:8888/metrics"
    description: Prometheus scrape endpoint for OPA Gatekeeper metrics.

tasks:
  - id: scrape_gatekeeper_violations
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        curl -s -f "{{ inputs.gatekeeper_metrics_url }}" > /tmp/gatekeeper_telemetry.txt
        
        # Scrape gatekeeper_violations metric across all constraint templates
        VIOLATIONS=$(grep -E "^gatekeeper_violations" /tmp/gatekeeper_telemetry.txt | awk '{sum+=$2} END {print sum+0}')
        echo "::set-output name=violations::$VIOLATIONS::"

  - id: evaluate_policy_compliance
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.scrape_gatekeeper_violations.vars.violations | int > 0 }}"
    then:
      - id: notify_governance_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#k8s-security",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 OPA Gatekeeper Constraint Violations Alert",
                "text": "Gatekeeper controller detected *{{ outputs.scrape_gatekeeper_violations.vars.violations }} active policy constraint violations*! Non-compliant workloads (privileged pods, missing security contexts, hostpath mounts) exist in cluster namespaces.",
                "footer": "Kestra Governance Sentinel • OPA Gatekeeper"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#k8s-security",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Gatekeeper Sentinel Failure",
            "text": "Failed to scrape OPA Gatekeeper metrics endpoint. Verify controller manager reachability.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: Open Policy Agent (OPA) Gatekeeper Audit Constraint Violations Sentinel
  shortDescription: Audits OPA Gatekeeper for policy violations and non-compliant Kubernetes resources across cluster namespaces.
  description: |
    ## How it works
    This workflow queries the Prometheus metrics endpoint of the OPA Gatekeeper controller manager (port `8888`) to audit the `gatekeeper_violations` gauge. Gatekeeper enforces admission control and audits existing Kubernetes resources against Rego constraint templates (such as requiring non-root user execution, forbidding privileged containers, and mandating resource limits). When non-compliant resources exist in the cluster, `gatekeeper_violations` increments. This workflow tracks violations and immediately escalates policy drift to Kubernetes governance teams.

    ## What you get
    - Real-time detection of non-compliant Kubernetes resources.
    - Prevents privilege escalation and container security violations.
    - Clear quantitative metrics on total cluster policy violations.

    ## Who it's for
    - Kubernetes Security Architects and Compliance Officers.
    - Platform Engineers enforcing cluster hardening standards.

    ## Why orchestrate this with Kestra
    - **Continuous Compliance Verification**: Automates cluster governance audits without extra overhead.
    - **External Alert Channel**: Delivers notifications independently to compliance Slack channels.
    - **Zero Infrastructure Footprint**: Uses simple HTTP metrics scraping.

    ## Prerequisites
    - OPA Gatekeeper deployed with Prometheus metrics enabled.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input Gatekeeper metrics URL.
    3. Run the workflow to inspect current violation counts.

    ## How to extend
    - Query `gatekeeper_constraints{enforcementAction="deny"}` for specific failing constraints.
    - Automatically create Jira tickets for offending development teams.

    ## Links
    - [OPA Gatekeeper Documentation](https://open-policy-agent.github.io/gatekeeper/website/docs/)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Infrastructure
    - Cloud
  ee: false
  demo: false
