id: turso-database-ephemeral-branch-cleanup-and-storage-guard
namespace: company.database

tasks:
  - id: list_database_branches
    type: io.kestra.plugin.fs.http.Request
    uri: "https://api.turso.tech/v1/organizations/{{ secret('TURSO_ORG_SLUG') }}/databases/{{ secret('TURSO_DB_NAME') }}/branches"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('TURSO_API_TOKEN') }}"
      Content-Type: "application/json"

  - id: evaluate_branches
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.12-slim
    script: |
      import json
      import sys
      from datetime import datetime, timezone, timedelta
      from kestra import Kestra

      # Ingest Turso branches list directly without synthetic fallbacks
      payload = {{ outputs.list_database_branches.body }}

      if not isinstance(payload, dict) or "branches" not in payload:
          raise ValueError(f"Turso API returned unexpected response. Expected JSON object with 'branches' key, got: {type(payload)}.")

      branches = payload.get("branches", [])
      if not isinstance(branches, list):
          raise ValueError("Malformed branches payload received from Turso Platform API.")

      retention_cutoff = datetime.now(timezone.utc) - timedelta(days=3)
      stale_branches = []
      total_count = len(branches)

      for branch in branches:
          name = branch.get("name", "")
          # Protect primary production and main branches
          if name in ["main", "primary", "production", "prod"]:
              continue

          created_at_str = branch.get("created_at") or branch.get("createdAt")
          if created_at_str:
              try:
                  created_at = datetime.fromisoformat(str(created_at_str).replace("Z", "+00:00"))
                  if created_at < retention_cutoff:
                      stale_branches.append(name)
              except Exception:
                  pass

      cleanup_needed = len(stale_branches) > 0

      print(f"Turso Database '{ { secret('TURSO_DB_NAME') } }' Branch Scan:")
      print(f"  Total branches found: {total_count}")
      print(f"  Stale ephemeral branches to prune: {len(stale_branches)}")
      print(f"  Cleanup execution required: {cleanup_needed}")

      Kestra.outputs({
          "total_branches": total_count,
          "stale_branches": stale_branches,
          "stale_count": len(stale_branches),
          "cleanup_required": cleanup_needed
      })

  - id: branch_pruning_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.evaluate_branches.vars.cleanup_required }}"
    then:
      - id: prune_stale_branches
        type: io.kestra.plugin.core.flow.ForEach
        values: "{{ outputs.evaluate_branches.vars.stale_branches }}"
        tasks:
          - id: delete_branch
            type: io.kestra.plugin.fs.http.Request
            uri: "https://api.turso.tech/v1/organizations/{{ secret('TURSO_ORG_SLUG') }}/databases/{{ secret('TURSO_DB_NAME') }}/branches/{{ taskrun.value }}"
            method: DELETE
            headers:
              Authorization: "Bearer {{ secret('TURSO_API_TOKEN') }}"

      - id: notify_slack_cleanup_summary
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":wastebasket: *Turso Ephemeral Database Branches Pruned*\nDatabase: `{{ secret('TURSO_DB_NAME') }}`\nOrganization: `{{ secret('TURSO_ORG_SLUG') }}`\nPruned Branches Count: `{{ outputs.evaluate_branches.vars.stale_count }}`\nPruned Branches: `{{ outputs.evaluate_branches.vars.stale_branches }}`\nBranch storage hygiene completed."
          }

  - id: log_operational_summary
    type: io.kestra.plugin.core.log.Log
    message: "Turso branch audit completed for database '{{ secret('TURSO_DB_NAME') }}'. Total branches: {{ outputs.evaluate_branches.vars.total_branches }}, Pruned: {{ outputs.evaluate_branches.vars.stale_count }}"

triggers:
  - id: daily_cleanup_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 3 * * *"

extend:
  title: Turso Database Ephemeral Branch Cleanup and Storage Guard
  metaTitle: Turso Ephemeral Branch Cleanup Sentinel | Kestra
  shortDescription: Automated lifecycle auditing and pruning of stale developer and preview branches in Turso databases.
  metaDescription: Automate Turso database ephemeral branch discovery, prune stale preview branches, and alert via Slack to prevent storage quota exhaustion with Kestra.
  description: |
    Automated lifecycle maintenance sentinel for Turso (libSQL) databases that continuously discovers stale preview and developer branches and actively deletes them to enforce database hygiene.

    ## How it works

    1. A daily schedule trigger initiates the database audit at 03:00 UTC.
    2. The HTTP request task queries the Turso Platform API for all active database branches across the organization.
    3. An inline Python task parses creation timestamps, identifies ephemeral branches older than 72 hours, and protects primary production branches from deletion.
    4. The task fails loudly with explicit exceptions if the Turso API returns invalid authentication or malformed payloads.
    5. A conditional flow gate checks if stale ephemeral branches require decommissioning.
    6. When cleanup is required, a ForEach loop iterates over candidate branches and actively invokes Turso's delete API endpoint.
    7. An informative Slack notification is dispatched reporting pruned branch identifiers and count.
    8. A structured log task records the operational summary for observability.

    ## What you get

    - Active lifecycle automation that prevents ephemeral preview branches from exhausting organization storage quotas.
    - Protected branch safeguarding ensuring `main`, `primary`, and `production` branches are never deleted.
    - Zero silent failures: strictly verifies real API responses and fails loudly on unauthorized tokens.

    ## Who it's for

    - Platform Engineers and DevOps teams running preview environments backed by Turso database branching.
    - Full-stack engineers utilizing ephemeral libSQL databases in automated CI/CD test pipelines.
    - Database Administrators centralizing multi-tenant edge database hygiene.

    ## Why orchestrate this with Kestra

    - Declarative YAML definition version-controlled alongside application infrastructure.
    - Built-in credential masking keeping Turso Platform API tokens protected in logs.
    - Native support for flowable iteration and conditional execution without external shell scripting.

    ## Prerequisites

    - A Turso account with an active organization and database.
    - A Turso Platform API Token with database write and delete permissions.
    - A Slack Incoming Webhook URL for cleanup notifications.

    ### Secrets

    - `TURSO_API_TOKEN`: Turso Platform API token with administrative database permissions.
    - `TURSO_ORG_SLUG`: Turso organization slug identifier.
    - `TURSO_DB_NAME`: Target Turso database name hosting ephemeral branches.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for operational alert notifications.

    ## Quick start

    1. Generate an API token from your Turso dashboard (`turso auth api-tokens mint`).
    2. Store your `TURSO_API_TOKEN`, `TURSO_ORG_SLUG`, `TURSO_DB_NAME`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    3. Run a manual test execution to verify API connectivity and inspect discovered branches.
    4. Enable the daily schedule trigger for continuous automated supervision.

    ## How to extend

    - Add webhook integration to trigger immediate branch deletion upon GitHub pull request merge or close events.
    - Incorporate automated database point-in-time backup creation prior to bulk branch deletions.
    - Extend branch filtering to query GitHub API for merged PR branch names.

    ## Links

    - [Turso Platform API Reference](https://docs.turso.tech/api-reference)
    - [Turso Database Branching Documentation](https://docs.turso.tech/features/branching)
    - [Kestra HTTP Request Plugin](https://kestra.io/plugins/plugin-fs/tasks/http/io.kestra.plugin.fs.http.request)
    - [Kestra Slack Notifications Plugin](https://kestra.io/plugins/plugin-notifications/tasks/slack/io.kestra.plugin.notifications.slack.slackincomingwebhook)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - "Infrastructure Automation"
    - "FinOps & Cost Management"
    - "Day 2 Operations"
  ee: false
  demo: false
