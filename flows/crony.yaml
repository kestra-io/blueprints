id: crony
namespace: company.team

description: |
  Crony keeps an eye on your Kubernetes CronJobs. Every day it checks
  whether each CronJob ran on schedule and whether its recent runs
  succeeded. If one missed its run or failed, it pings Slack.
  If everything is healthy, it stays quiet.

inputs:
  - id: namespace
    type: STRING
    displayName: "Namespace"
    description: the namespace whose CronJobs to watch
    defaults: default
  - id: slack_webhook
    type: STRING
    displayName: "Slack Webhook URL"
    description: Incoming webhook URL of the Slack channel for the alerts

tasks:
  - id: list_cronjobs
    type: io.kestra.plugin.scripts.shell.Commands
    description: lists all the CronJobs in the namespace
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      user: "0"
    containerImage: bitnami/kubectl
    inputFiles:
      client.crt: "{{ secret('CLIENT_CRT') }}"
      client.key: "{{ secret('CLIENT_KEY') }}"
    outputFiles:
      - cronjobs.json
    commands:
      - kubectl get cronjobs -n {{ inputs.namespace }} -o json --client-certificate=client.crt --client-key=client.key --server={{ secret('MASTERURL') }} --insecure-skip-tls-verify=true > cronjobs.json

  - id: list_jobs
    type: io.kestra.plugin.scripts.shell.Commands
    description: lists all the Jobs in the namespace, so we can see which runs failed
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      user: "0"
    containerImage: bitnami/kubectl
    inputFiles:
      client.crt: "{{ secret('CLIENT_CRT') }}"
      client.key: "{{ secret('CLIENT_KEY') }}"
    outputFiles:
      - jobs.json
    commands:
      - kubectl get jobs -n {{ inputs.namespace }} -o json --client-certificate=client.crt --client-key=client.key --server={{ secret('MASTERURL') }} --insecure-skip-tls-verify=true > jobs.json

  - id: find_trouble
    type: io.kestra.plugin.scripts.python.Script
    description: checks every CronJob for missed and failed runs, drops the ones we already alerted on
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      user: "0"
    containerImage: python:3.11
    dependencies:
      - kestra
    script: |
      import json
      from datetime import datetime, timezone
      from kestra import Kestra


      def parse_time(s):
          # "2026-10-06T12:00:00Z" -> datetime
          return datetime.fromisoformat(s.replace('Z', '+00:00'))


      def interval_minutes(schedule):
          # guess how often a CronJob should run from its schedule,
          # only handles the common shapes, good enough for a missed check
          parts = schedule.split()
          if len(parts) != 5:
              return None
          minute, hour, dom, month, dow = parts
          if minute.startswith('*/'):
              try:
                  return int(minute[2:])
              except ValueError:
                  return None
          if minute == '*':
              return 1
          if hour == '*':
              return 60
          if dom == '*' and month == '*' and dow == '*':
              return 24 * 60
          if dom == '*' and month == '*':
              return 7 * 24 * 60
          return 30 * 24 * 60


      def job_failed(job):
          # a Job failed if Kubernetes says so
          status = job.get('status', {})
          if status.get('failed', 0) > 0:
              return True
          for cond in status.get('conditions', []):
              if cond.get('type') == 'Failed' and cond.get('status') == 'True':
                  return True
          return False


      namespace = """{{ inputs.namespace }}"""
      now = datetime.now(timezone.utc)

      with open("""{{ outputs.list_cronjobs.outputFiles['cronjobs.json'] }}""") as f:
          cronjobs = json.load(f)['items']
      with open("""{{ outputs.list_jobs.outputFiles['jobs.json'] }}""") as f:
          jobs = json.load(f)['items']

      # group Jobs under the CronJob that created them
      jobs_by_owner = {}
      for job in jobs:
          owners = job.get('metadata', {}).get('ownerReferences', [])
          for owner in owners:
              if owner.get('kind') == 'CronJob':
                  jobs_by_owner.setdefault(owner['uid'], []).append(job)

      # names we already alerted on, from the KV store (null on first run -> empty)
      raw_state = """{{ kv('crony-state-' ~ inputs.namespace, errorOnMissing=false) }}"""
      already = set(json.loads(raw_state) if raw_state.strip() else [])

      troubled = []
      for cj in cronjobs:
          meta = cj.get('metadata', {})
          spec = cj.get('spec', {})
          status = cj.get('status', {})
          name = meta['name']
          if spec.get('suspend'):
              continue  # paused on purpose, not our problem
          reasons = []
          # missed: last schedule is older than twice the expected interval
          interval = interval_minutes(spec.get('schedule', ''))
          last = status.get('lastScheduleTime')
          if last:
              age_min = (now - parse_time(last)).total_seconds() / 60
              if interval and age_min > 2 * interval:
                  reasons.append(f"missed: last run {age_min / 60:.1f}h ago, expected every {interval}m")
          else:
              age_min = (now - parse_time(meta['creationTimestamp'])).total_seconds() / 60
              if interval and age_min > 2 * interval:
                  reasons.append("missed: never ran")
          # failed: any owned Job failed
          owned = jobs_by_owner.get(meta.get('uid'), [])
          failed = [j for j in owned if job_failed(j)]
          if failed:
              reasons.append(f"failed: {len(failed)} failed run(s)")
          if reasons:
              troubled.append({'name': name, 'reasons': reasons})

      troubled_names = set(t['name'] for t in troubled)
      new_trouble = [t for t in troubled if t['name'] not in already]
      # the new state is simply who is troubled right now;
      # recovered names drop out on their own, so a future failure alerts again

      lines = [f"*Crony - troubled CronJobs in '{namespace}'*", ""]
      for t in new_trouble:
          lines.append(f"- *{t['name']}*: " + "; ".join(t['reasons']))
          lines.append(f"  inspect: `kubectl describe cronjob {t['name']} -n {namespace}`")
      lines.append("")
      alert_text = "\n".join(lines)

      Kestra.outputs({
          'troubled': new_trouble,
          'count': len(new_trouble),
          'new_state_json': json.dumps(sorted(troubled_names)),
          'alert_text': alert_text,
      })

  - id: maybe_alert
    type: io.kestra.plugin.core.flow.If
    description: only pings Slack when there is something new to report
    condition: "{{ outputs.find_trouble.vars.count > 0 }}"
    then:
      - id: send_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: sends the troubled CronJobs to Slack
        url: "{{ inputs.slack_webhook }}"
        messageText: "{{ outputs.find_trouble.vars.alert_text }}"

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    description: remembers who is troubled now, so recovered ones alert again next time
    key: "crony-state-{{ inputs.namespace }}"
    value: "{{ outputs.find_trouble.vars.new_state_json }}"
    overwrite: true

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * *"
    timezone: UTC
    inputs:
      namespace: default
      slack_webhook: "{{ secret('SLACK_WEBHOOK') }}"

extend:
  title: Crony
  shortDescription: Watch Kubernetes CronJobs and get a Slack alert when one misses its run or fails.
  metaTitle: "Crony: Kubernetes CronJob Health Alerts in Kestra"
  metaDescription: Check the CronJobs in a namespace on a schedule and ping Slack when one misses its run or fails. Skips suspended jobs and never repeats an alert.
  description: |
    Kubernetes CronJobs fail silently. A backup job that never ran or a cleanup job that kept failing can go unnoticed for days because nothing pages when a schedule is missed. This blueprint watches the CronJobs in a namespace every day and pings Slack when one misses its run or fails, and stays quiet when everything is healthy.

    ## How it works

    1. `list_cronjobs` (`io.kestra.plugin.scripts.shell.Commands`) runs `kubectl get cronjobs` in the namespace through a bitnami/kubectl container and saves the JSON.
    2. `list_jobs` (`io.kestra.plugin.scripts.shell.Commands`) runs `kubectl get jobs` the same way, so the flow can see which runs failed.
    3. `find_trouble` (`io.kestra.plugin.scripts.python.Script`) reads the single JSON list of CronJobs we already alerted on from the KV store (empty on the first run), then goes through every CronJob and checks two things. Missed: the last schedule time is older than twice the expected interval, or it never ran at all. Failed: any Job owned by the CronJob failed. Suspended CronJobs are skipped because pausing one is a choice, not a problem. Anything already alerted on is dropped.
    4. `maybe_alert` (`io.kestra.plugin.core.flow.If`) runs only when there is something new to report, and `send_alert` posts the troubled CronJobs to Slack with the reason and a kubectl command to inspect each one.
    5. `save_state` (`io.kestra.plugin.core.kv.Set`) writes back the new list of troubled names. Recovered names drop out on their own, so a future failure alerts again.

    ## What you get

    - A daily check that every CronJob in the namespace actually ran on schedule.
    - One Slack alert listing the missed and failed CronJobs, with reasons and inspect commands.
    - A quiet run when everything is healthy, and no repeated alerts for the same problem.

    ## Who it's for

    - Teams running scheduled jobs on Kubernetes (backups, cleanups, reports) with no watcher on the schedules themselves.
    - On-call engineers who want to know about a missed backup before the restore is needed.
    - Anyone who has discovered a CronJob was silently suspended or failing for weeks.

    ## Why orchestrate this with Kestra

    Kubernetes will retry a failed Job and eventually give up, but it never tells anyone the schedule itself is broken. Kestra keeps the whole check in one visible flow: the schedule, the kubectl reads, the missed and failed detection, the duplicate-alert guard, and the Slack call are all one auditable execution history. The KV-backed memory means the alert logic survives restarts without an external database.

    ## Prerequisites

    - A Kubernetes cluster Kestra can reach with kubectl.
    - A Kestra instance with Docker, because the kubectl and Python steps run in containers.

    ### Secrets

    - `CLIENT_CRT`: client certificate for the Kubernetes API.
    - `CLIENT_KEY`: client key for the Kubernetes API.
    - `MASTERURL`: Kubernetes API server URL.
    - `SLACK_WEBHOOK`: Slack incoming webhook for the alerts. In Kestra OSS, secrets are supplied as environment variables prefixed `SECRET_`, base64-encoded, and read back with `{{ secret('NAME') }}`, for example `SECRET_SLACK_WEBHOOK=$(echo -n 'https://hooks.slack.com/services/<placeholder>' | base64)`.

    ## Quick start

    1. Save the cluster details as `CLIENT_CRT`, `CLIENT_KEY` and `MASTERURL` secrets, and the webhook as `SLACK_WEBHOOK` (base64-encoded, see above).
    2. Import the flow and hit Execute. Type the namespace when it asks; it defaults to `default`.
    3. Check the execution: if any CronJob missed its run or failed, the Slack alert lists them.
    4. The daily schedule takes care of the rest.

    ## How to extend

    - Deploy one copy of the flow per namespace you want to watch, changing only the `namespace` input.
    - Add a `label_selector` input and pass `-l` to the kubectl commands to watch a subset.
    - Tune the missed-run sensitivity by changing the `2 * interval` factor in the Python step.

    ## Inputs

    - `namespace`: the namespace whose CronJobs to watch (defaults to `default`).
    - `slack_webhook`: Incoming webhook URL of the Slack channel for the alerts.

    ## Links

    - [Kestra Kubernetes plugins](https://kestra.io/plugins/plugin-kubernetes)
    - [Kubernetes CronJob docs](https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/)

    ## Pitfalls

    - The missed-run check guesses the expected interval from common cron shapes; exotic schedules fall back to a 30-day interval, so a rarely-run job may alert as missed later than you expect.
    - The flow only sees Jobs Kubernetes still keeps; if `successfulJobsHistoryLimit` is very low, old successes age out of the check.
  tags:
    - Infrastructure
    - Core
  subTags:
    - Scheduling
  ee: false
  demo: false
