id: guardduty-enabler
namespace: company.security

description: |
  Audits GuardDuty detector coverage across your AWS regions, optionally enables
  it where missing, and posts a Slack coverage report.

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1", "us-west-2", "eu-west-1"]
    description: AWS regions to audit for GuardDuty detector coverage.
  - id: auto_enable
    type: BOOLEAN
    defaults: false
    description: When true, create and enable a GuardDuty detector in every audited region that lacks one.

variables:
  slack_webhook_url: "{{ secret('SLACK_WEBHOOK_URL') }}"

tasks:
  - id: audit_regions
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit each region for a GuardDuty detector, in parallel.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: List GuardDuty detectors in this region and record coverage status.
        commands:
          - |
            export REGION="{{ taskrun.value }}"
            aws guardduty list-detectors --region "$REGION" --output json > "/tmp/gd_list_${REGION}.json"
            python3 << 'PYEOF'
            import json, os
            region = os.environ["REGION"]
            with open(f"/tmp/gd_list_{region}.json") as f:
                data = json.load(f)
            ids = data.get("DetectorIds", [])
            detector_id = ids[0] if ids else ""
            status = {
                "region": region,
                "detector_id": detector_id,
                "enabled": bool(ids),
                "auto_enabled": False,
            }
            with open(f"/tmp/guardduty_{region}.json", "w") as f:
                json.dump(status, f)
            print(f"DETECTOR_ID={detector_id}")
            print(f"NO_DETECTOR={'true' if not ids else 'false'}")
            PYEOF
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ taskrun.value }}"
        outputFiles:
          - "/tmp/guardduty_*.json"

      - id: enable_region
        type: io.kestra.plugin.core.flow.If
        description: Enable GuardDuty in this region when missing and auto_enable is on.
        condition: "{{ outputs.audit_region.vars.NO_DETECTOR == 'true' and inputs.auto_enable == true }}"
        then:
          - id: create_detector
            type: io.kestra.plugin.aws.cli.AwsCLI
            description: Create and enable a GuardDuty detector in this region.
            commands:
              - |
                export REGION="{{ taskrun.value }}"
                DETECTOR_ID=$(aws guardduty create-detector --enable --region "$REGION" --output json | python3 -c "import json,sys; print(json.load(sys.stdin).get('DetectorId',''))")
                export DETECTOR_ID
                python3 << 'PYEOF'
                import json, os
                region = os.environ["REGION"]
                detector_id = os.environ.get("DETECTOR_ID", "")
                status = {
                    "region": region,
                    "detector_id": detector_id,
                    "enabled": bool(detector_id),
                    "auto_enabled": bool(detector_id),
                }
                with open(f"/tmp/guardduty_{region}.json", "w") as f:
                    json.dump(status, f)
                print(f"NEW_DETECTOR_ID={detector_id}")
                PYEOF
            env:
              AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
              AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
              AWS_DEFAULT_REGION: "{{ taskrun.value }}"
            outputFiles:
              - "/tmp/guardduty_*.json"

  - id: aggregate
    type: io.kestra.plugin.aws.cli.AwsCLI
    description: Combine per-region results into coverage vars for the report.
    commands:
      - |
        python3 << 'PYEOF'
        import json, glob
        regions = []
        for path in sorted(glob.glob("/tmp/guardduty_*.json")):
            with open(path) as f:
                regions.append(json.load(f))
        total = len(regions)
        covered = [r for r in regions if r["enabled"]]
        missing = [r["region"] for r in regions if not r["enabled"]]
        auto = [r["region"] for r in regions if r.get("auto_enabled")]
        print(f"TOTAL_REGIONS={total}")
        print(f"COVERED_COUNT={len(covered)}")
        print(f"MISSING_REGIONS={','.join(missing) if missing else 'none'}")
        print(f"AUTO_ENABLED={','.join(auto) if auto else 'none'}")
        print(f"HAS_FINDINGS={'true' if (missing or auto) else 'false'}")
        print("REPORT<<EOF")
        for r in regions:
            mark = "[OK] " if r["enabled"] else "[MISS]"
            auto_mark = " (auto-enabled this run)" if r.get("auto_enabled") else ""
            print(f"{mark} {r['region']}: {'enabled' if r['enabled'] else 'NO DETECTOR'}{auto_mark}")
        print("EOF")
        PYEOF

  - id: notify
    type: io.kestra.plugin.core.flow.If
    description: Post the coverage report to Slack when there are gaps or auto-enables.
    condition: "{{ outputs.aggregate.vars.HAS_FINDINGS == 'true' }}"
    then:
      - id: slack_report
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ vars.slack_webhook_url }}"
        payload: |
          {
            "text": ":shield: *GuardDuty coverage report*\nAudited {{ outputs.aggregate.vars.TOTAL_REGIONS }} regions — {{ outputs.aggregate.vars.COVERED_COUNT }} have GuardDuty enabled.\nMissing: {{ outputs.aggregate.vars.MISSING_REGIONS }}\nAuto-enabled this run: {{ outputs.aggregate.vars.AUTO_ENABLED }}"
          }
    else:
      - id: log_clean
        type: io.kestra.plugin.core.log.Log
        message: "GuardDuty is enabled in all {{ outputs.aggregate.vars.TOTAL_REGIONS }} audited regions. No gaps to report."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    disabled: true
    cron: "0 9 * * MON"
    description: Weekly on Monday at 09:00 UTC — coverage drift is slow, a weekly audit is enough.

extend:
  title: GuardDuty Coverage Enabler
  metaTitle: Audit & Enable AWS GuardDuty Across Regions | Kestra
  shortDescription: Audit GuardDuty detector coverage across your AWS regions, optionally auto-enable missing detectors, and get a weekly Slack coverage report.
  metaDescription: Find the regions where GuardDuty is silently off, enable it in one run, and get a weekly Slack coverage report.
  description: |
    GuardDuty is region-scoped, which means most accounts enable it in us-east-1 and silently leave the other regions unprotected. This blueprint audits every region you care about, optionally enables GuardDuty where it is missing, and reports the coverage gaps to Slack — so a threat actor can't just pivot to a region you forgot.

    ## How it works

    1. A Schedule trigger fires weekly on Monday at 09:00 UTC (shipped disabled).
    2. A `ForEach` iterates your `aws_regions` input and runs `aws guardduty list-detectors` per region, recording each region's coverage status to a JSON file.
    3. An `If` task gates the remediation: when a region has no detector and `auto_enable` is true, it runs `aws guardduty create-detector --enable` for that region.
    4. An aggregation task combines the per-region files into coverage counts, and a final `If` posts a Slack report when there are gaps or auto-enables — otherwise it just logs that coverage is clean.

    ## What you get

    - A real per-region inventory of GuardDuty detector coverage — no guessing.
    - Optional one-click remediation: flip `auto_enable` to true and the gaps close themselves.
    - A Slack report naming exactly which regions lack GuardDuty and which were auto-enabled this run.
    - Silence on clean weeks: no alert fatigue when everything is covered.

    ## Who it's for

    Security engineers, platform teams, and anyone responsible for AWS threat detection who suspects "we enabled GuardDuty" really means "we enabled it in one region".

    ## Why orchestrate this with Kestra

    A shell script in someone's laptop crontab is invisible and un-auditable. As a Kestra flow the region list is an input anyone can extend, every enable action is logged with its detector ID, and the Slack report keeps the whole team honest — all in versioned YAML, not tribal knowledge.

    ## Prerequisites

    - AWS credentials with `guardduty:ListDetectors` permission (plus `guardduty:CreateDetector` if you use `auto_enable`).
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the GuardDuty API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the GuardDuty API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the coverage report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Run manually once with `auto_enable: false` to see your current coverage gaps.
    3. Re-run with `auto_enable: true` to close the gaps, or keep it report-only for change control.
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Add S3 protection / EKS audit log / malware protection toggles per region after enabling the detector.
    - Route the Slack report to a security channel and @mention the on-call when gaps appear.
    - Feed the per-region JSON into a dashboard to trend coverage over time.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [GuardDuty list-detectors API](https://docs.aws.amazon.com/cli/latest/reference/guardduty/list-detectors.html)
    - [GuardDuty create-detector API](https://docs.aws.amazon.com/cli/latest/reference/guardduty/create-detector.html)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
