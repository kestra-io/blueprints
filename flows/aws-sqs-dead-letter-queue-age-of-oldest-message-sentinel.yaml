id: aws-sqs-dead-letter-queue-age-of-oldest-message-sentinel
namespace: company.team

inputs:
  - id: aws_region
    type: STRING
    defaults: "us-east-1"
    description: AWS region where the SQS queue is hosted.
  - id: queue_url
    type: STRING
    description: AWS SQS Dead Letter Queue URL to audit.
  - id: max_age_seconds_threshold
    type: INT
    defaults: 86400
    description: "Maximum acceptable age of oldest DLQ message in seconds (default 24 hours)."

tasks:
  - id: query_sqs_dlq_attributes
    type: io.kestra.plugin.aws.cli.AwsCLI
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        set -euo pipefail
        aws sqs get-queue-attributes \
          --queue-url "{{ inputs.queue_url }}" \
          --attribute-names ApproximateAgeOfOldestMessage ApproximateNumberOfMessages \
          --output json > sqs_attrs.json

        python3 -c "
        import json
        with open('sqs_attrs.json') as f:
            attrs = json.load(f).get('Attributes', {})
        age = int(attrs.get('ApproximateAgeOfOldestMessage', 0))
        count = int(attrs.get('ApproximateNumberOfMessages', 0))
        result = {
            'queue_url': '{{ inputs.queue_url }}',
            'age_seconds': age,
            'msg_count': count,
            'alert_triggered': age >= {{ inputs.max_age_seconds_threshold }} and count > 0
        }
        with open('sqs_summary.json', 'w') as out:
            json.dump(result, out)
        print('SQS DLQ metrics:', result)
        "
    outputFiles:
      - sqs_summary.json

  - id: evaluate_dlq_message_age
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.query_sqs_dlq_attributes.outputFiles['sqs_summary.json'])).alert_triggered }}"
    then:
      - id: notify_messaging_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#aws-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": ":rotating_light: AWS SQS DLQ Message Expiration Risk Alert",
                "text": "SQS DLQ `{{ inputs.queue_url }}` has *{{ fromJson(read(outputs.query_sqs_dlq_attributes.outputFiles['sqs_summary.json'])).msg_count }}* messages pending! Oldest message age is *{{ fromJson(read(outputs.query_sqs_dlq_attributes.outputFiles['sqs_summary.json'])).age_seconds }} seconds* (Threshold: {{ inputs.max_age_seconds_threshold }}s). Impact: SQS enforces a maximum message retention limit (typically 4-14 days), after which unprocessed DLQ messages are permanently purged from the queue.",
                "footer": "Kestra Cloud Sentinel • AWS SQS"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#aws-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": ":warning: AWS SQS Dead Letter Queue (DLQ) Oldest Message Age Sentinel Pipeline Failure",
            "text": "Failed to query SQS queue attributes via AWS CLI. Verify queue URL and IAM permissions.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Monitors AWS SQS DLQ ApproximateAgeOfOldestMessage to detect unhandled messages facing permanent message expiry."
  metaTitle: AWS SQS Dead Letter Queue (DLQ) Oldest Message Age Sentinel with Kestra
  title: AWS SQS Dead Letter Queue (DLQ) Oldest Message Age Sentinel
  shortDescription: Monitors AWS SQS DLQ ApproximateAgeOfOldestMessage to detect unhandled messages facing permanent message expiry.
  description: |
    ## How it works
    This workflow calls AWS SQS `GetQueueAttributes` via the official AWS CLI to inspect `ApproximateAgeOfOldestMessage` and `ApproximateNumberOfMessages`. When downstream workers crash or poison-pill messages fail parsing, messages accumulate in the DLQ. If messages linger beyond the age threshold, they risk reaching the queue's `MessageRetentionPeriod` (e.g. 4 or 14 days), resulting in unrecoverable message deletion. Slack is alerted immediately upon breach.

    ## What you get
    - Early detection of unhandled messages approaching SQS permanent expiration limits.
    - Prevents irreversible customer data loss in asynchronous event processing.
    - Real-time reporting on pending message count and oldest message age.

    ## Who it's for
    - SREs and Backend Engineers maintaining asynchronous SQS/SNS microservice architectures.
    - Cloud Operations teams enforcing message lifecycle SLAs.

    ## Why orchestrate this with Kestra
    - **Official AWS CLI Task**: Native authentication via AWS credentials without custom SDK code.
    - **Multi-Region Support**: Easily audit queues across any AWS region.
    - **Automated Incident Triage**: Fast, reliable alerting before messages purge.

    ## Prerequisites
    - AWS IAM credentials with `sqs:GetQueueAttributes` permissions.
    - Secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import blueprint into Kestra.
    2. Provide queue URL and target region.
    3. Run the workflow to inspect oldest DLQ message age.

    ## How to extend
    - Automatically initiate an SQS redrive task via `aws sqs start-message-move-task`.
    - Route critical breaches to PagerDuty or an incident response webhook.

    ## Links
    - [AWS SQS Dead Letter Queue Documentation](https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-dead-letter-queues.html)
    - [Kestra AWS CLI Plugin](https://kestra.io/plugins/plugin-aws/io.kestra.plugin.aws.cli.awscli)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Realtime & Streaming
    - AWS Services
  ee: false
  demo: false
