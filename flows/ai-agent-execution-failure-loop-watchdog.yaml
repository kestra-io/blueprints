id: ai-agent-execution-failure-loop-watchdog
namespace: company.team
description: |
  Stop trusting an AI agent flow that keeps failing the same way. Once a day
  this flow reads the real recent executions of one configured agent flow from
  the Kestra executions API, looks for a genuine failure loop (several failed
  runs in a row, the same task failing across several runs, or a failure rate
  above the configured cap), and fails its own execution when a loop is found,
  so a looping agent is never signed off by a green run. Nothing here is
  sample data: every execution, state, and failed task comes from the live
  Kestra instance in the lookback window, and a run that cannot read the API
  fails closed instead of reporting a clean bill of health.

triggers:
  - id: daily_agent_history_watch
    type: io.kestra.plugin.core.trigger.Schedule
    description: Daily sweep of the configured agent flow's real execution history. Repoint kestra_url, namespace, and agent_flow_id at your own Kestra instance and agent flow before relying on the defaults, which point at a local Kestra instance as a runnable example.
    cron: "0 6 * * *"

inputs:
  - id: kestra_url
    type: STRING
    displayName: Kestra URL
    description: Base URL of the Kestra instance whose executions API is read, with no trailing slash.
    defaults: http://localhost:8080
  - id: namespace
    type: STRING
    displayName: Agent flow namespace
    description: Namespace that holds the agent flow. Matched exactly.
    defaults: company.team
  - id: agent_flow_id
    type: STRING
    displayName: Agent flow id
    description: Id of the AI agent flow whose real execution history is watched. This input has no default on purpose, so a watchdog pointed at the wrong flow never blesses the wrong history. Name the agent flow explicitly.
  - id: lookback_hours
    type: INT
    displayName: Lookback window in hours
    description: How far back the watchdog reaches into the execution history.
    defaults: 24
  - id: max_consecutive_failures
    type: INT
    displayName: Maximum consecutive failures
    description: A run of this many FAILED executions in a row, ending at the most recent execution, counts as a failure loop and blocks the run.
    defaults: 3
  - id: max_repeated_task_failures
    type: INT
    displayName: Maximum repeated task failures
    description: The same task failing in this many distinct executions of the agent flow counts as a failure loop and blocks the run, even when successful runs sit between the failures.
    defaults: 3
  - id: max_failure_percent
    type: INT
    displayName: Maximum failure percent
    description: Failure percent above this cap blocks the run, once the minimum execution count below is met. Set to 100 to disable the rate rule and rely on the loop rules only.
    defaults: 50
  - id: min_executions_for_rate
    type: INT
    displayName: Minimum executions for the rate rule
    description: The rate rule only fires once at least this many executions of the agent flow exist in the window, so two failures out of three runs cannot trip a percent cap on a tiny sample.
    defaults: 5
  - id: fail_on_inconclusive
    type: BOOL
    displayName: Fail on inconclusive reads
    description: When true, a run that cannot read the executions API, or reads a response it cannot parse, fails instead of passing quietly. The watchdog must not report a clean bill of health for a history it could not read.
    defaults: true

tasks:
  - id: check_agent_history
    type: io.kestra.plugin.scripts.python.Script
    description: Read the real recent executions of the configured agent flow from the Kestra executions API, and test them against three loop signatures, namely consecutive FAILED runs, the same task failing across several runs, and failure percent above the cap. Nothing in this task is sample data. The executions, states, and failed tasks all come from the live Kestra instance in the lookback window, and an empty window yields a REVIEW verdict, never a PASS for a flow with no history to judge.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.12-slim
    env:
      KESTRA_URL: "{{ inputs.kestra_url }}"
      NAMESPACE: "{{ inputs.namespace }}"
      AGENT_FLOW_ID: "{{ inputs.agent_flow_id }}"
      LOOKBACK_HOURS: "{{ inputs.lookback_hours }}"
      MAX_CONSECUTIVE_FAILURES: "{{ inputs.max_consecutive_failures }}"
      MAX_REPEATED_TASK_FAILURES: "{{ inputs.max_repeated_task_failures }}"
      MAX_FAILURE_PERCENT: "{{ inputs.max_failure_percent }}"
      MIN_EXECUTIONS_FOR_RATE: "{{ inputs.min_executions_for_rate }}"
      FAIL_ON_INCONCLUSIVE: "{{ inputs.fail_on_inconclusive }}"
      KESTRA_API_TOKEN: "{{ secret('KESTRA_API_TOKEN') }}"
    script: |
      import json
      import os
      import urllib.error
      import urllib.parse
      import urllib.request
      from datetime import datetime, timedelta, timezone


      def http_get(url, token):
          headers = {
              "Accept": "application/json",
              "User-Agent": "kestra-ai-agent-execution-failure-loop-watchdog",
          }
          if token:
              headers["Authorization"] = "Bearer " + token
          request = urllib.request.Request(url, method="GET", headers=headers)
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.status, response.read().decode("utf-8", "replace"), None
          except urllib.error.HTTPError as err:
              return err.code, err.read().decode("utf-8", "replace"), None
          except Exception as err:  # noqa: BLE001 - any transport failure is inconclusive
              return None, "", str(err)


      def state_of(obj):
          state = obj.get("state", "") if isinstance(obj, dict) else ""
          if isinstance(state, dict):
              return state.get("current", "")
          return state or ""


      def parse_date(value, fallback):
          if not isinstance(value, str) or not value:
              return fallback
          try:
              return datetime.fromisoformat(value.replace("Z", "+00:00"))
          except ValueError:
              return fallback


      def emit(outputs):
          print("::" + json.dumps({"outputs": outputs}) + "::")


      def main():
          now = datetime.now(timezone.utc)
          base = os.environ.get("KESTRA_URL", "").rstrip("/")
          namespace = os.environ.get("NAMESPACE", "")
          flow_id = os.environ.get("AGENT_FLOW_ID", "")
          lookback = int(os.environ.get("LOOKBACK_HOURS", "24"))
          max_consecutive = int(os.environ.get("MAX_CONSECUTIVE_FAILURES", "3"))
          max_repeated = int(os.environ.get("MAX_REPEATED_TASK_FAILURES", "3"))
          max_percent = int(os.environ.get("MAX_FAILURE_PERCENT", "50"))
          min_for_rate = int(os.environ.get("MIN_EXECUTIONS_FOR_RATE", "5"))
          fail_on_inconclusive = os.environ.get("FAIL_ON_INCONCLUSIVE", "true") == "true"
          token = os.environ.get("KESTRA_API_TOKEN", "")
          window_start = now - timedelta(hours=lookback)
          params = urllib.parse.urlencode({
              "filters[namespace][EQUALS]": namespace,
              "size": "100",
          })
          url = base + "/api/v1/executions/search?" + params
          status, body, error = http_get(url, token)
          if status != 200:
              detail = error or body[:300]
              verdict = "BLOCKED" if fail_on_inconclusive else "REVIEW"
              emit({
                  "verdict": verdict,
                  "executions_checked": 0,
                  "failed_count": 0,
                  "consecutive_failures": 0,
                  "repeated_task_failures": 0,
                  "failure_percent": 0,
                  "inconclusive_count": 1,
                  "evidence": [{"error": "could not read executions API: %s" % detail}],
              })
              return
          try:
              payload = json.loads(body)
          except ValueError:
              verdict = "BLOCKED" if fail_on_inconclusive else "REVIEW"
              emit({
                  "verdict": verdict,
                  "executions_checked": 0,
                  "failed_count": 0,
                  "consecutive_failures": 0,
                  "repeated_task_failures": 0,
                  "failure_percent": 0,
                  "inconclusive_count": 1,
                  "evidence": [{"error": "executions API response was not valid JSON"}],
              })
              return
          if isinstance(payload, dict):
              results = payload.get("results", payload.get("executions", []))
              total = payload.get("total", len(results))
          else:
              results = payload
              total = len(results)
          if not isinstance(results, list):
              results = []
          watched = []
          for execution in results:
              if not isinstance(execution, dict):
                  continue
              if execution.get("flowId", "") != flow_id:
                  continue
              started = parse_date(execution.get("startDate", ""), now)
              if started < window_start:
                  continue
              failed_tasks = []
              task_runs = execution.get("taskRunList", [])
              if isinstance(task_runs, list):
                  for task_run in task_runs:
                      if isinstance(task_run, dict) and state_of(task_run) == "FAILED":
                          failed_tasks.append(task_run.get("taskId", ""))
              watched.append({
                  "id": execution.get("id", ""),
                  "startDate": execution.get("startDate", ""),
                  "started": started,
                  "failed": state_of(execution) == "FAILED",
                  "failed_tasks": failed_tasks,
              })
          watched.sort(key=lambda item: item["started"])
          checked = len(watched)
          failed_count = len([item for item in watched if item["failed"]])
          consecutive = 0
          for item in reversed(watched):
              if item["failed"]:
                  consecutive += 1
              else:
                  break
          task_failure_counts = {}
          for item in watched:
              if not item["failed"]:
                  continue
              for task_id in set(item["failed_tasks"]):
                  task_failure_counts[task_id] = task_failure_counts.get(task_id, 0) + 1
          repeated = max(task_failure_counts.values()) if task_failure_counts else 0
          repeated_task = ""
          for task_id, count in task_failure_counts.items():
              if count == repeated:
                  repeated_task = task_id
                  break
          failure_percent = (failed_count * 100 // checked) if checked else 0
          reasons = []
          if checked == 0:
              verdict = "REVIEW"
              reasons.append("no executions of the agent flow in the window")
          elif consecutive >= max_consecutive:
              verdict = "BLOCKED"
              reasons.append("%d consecutive FAILED executions" % consecutive)
          elif repeated >= max_repeated:
              verdict = "BLOCKED"
              reasons.append(
                  "task %s failed in %d distinct executions" % (repeated_task, repeated)
              )
          elif checked >= min_for_rate and failure_percent > max_percent:
              verdict = "BLOCKED"
              reasons.append(
                  "failure percent %d above the %d cap" % (failure_percent, max_percent)
              )
          else:
              verdict = "PASS"
          evidence = []
          for item in watched:
              if item["failed"]:
                  evidence.append({
                      "id": item["id"],
                      "startDate": item["startDate"],
                      "failed_tasks": item["failed_tasks"],
                  })
          evidence = evidence[:20]
          if isinstance(total, int) and total > len(results):
              evidence.append({
                  "note": "executions search returned %d of %d total results; narrow the namespace or window if runs truncate often" % (len(results), total),
              })
          print("flow=%s verdict=%s checked=%d failed=%d consecutive=%d repeated=%d percent=%d reasons=%s" % (
              flow_id, verdict, checked, failed_count, consecutive, repeated, failure_percent, "; ".join(reasons),
          ))
          emit({
              "verdict": verdict,
              "executions_checked": checked,
              "failed_count": failed_count,
              "consecutive_failures": consecutive,
              "repeated_task_failures": repeated,
              "failure_percent": failure_percent,
              "inconclusive_count": 0,
              "reasons": reasons,
              "evidence": evidence,
          })


      main()

  - id: gate_on_verdict
    type: io.kestra.plugin.core.flow.If
    description: Fail the execution when the real history shows a failure loop, so a looping agent flow is never signed off by a green run. A PASS or REVIEW verdict only logs the result, and REVIEW still names the reason in the execution history instead of passing silently.
    condition: "{{ outputs.check_agent_history.vars.verdict == 'BLOCKED' }}"
    then:
      - id: fail_on_loop
        type: io.kestra.plugin.core.execution.Fail
        description: Fail the execution so a looping agent flow cannot be treated as healthy. The message names the actual counts behind the verdict, so the operator can see which loop signature fired without reopening the history.
        errorMessage: "AI agent execution failure loop BLOCKED for {{ inputs.agent_flow_id }}: {{ outputs.check_agent_history.vars.failed_count }} failed of {{ outputs.check_agent_history.vars.executions_checked }} executions in the last {{ inputs.lookback_hours }}h, {{ outputs.check_agent_history.vars.consecutive_failures }} consecutive failures, worst repeated task failure count {{ outputs.check_agent_history.vars.repeated_task_failures }}, failure percent {{ outputs.check_agent_history.vars.failure_percent }}. Investigate the agent flow before trusting its next run."
    else:
      - id: log_history_clear
        type: io.kestra.plugin.core.log.Log
        description: Record the verdict and the real counts, so the execution history proves the agent flow history was actually read and what it showed.
        message: "AI agent execution failure loop watchdog {{ outputs.check_agent_history.vars.verdict }} for {{ inputs.agent_flow_id }}: {{ outputs.check_agent_history.vars.executions_checked }} executions checked, {{ outputs.check_agent_history.vars.failed_count }} failed, {{ outputs.check_agent_history.vars.consecutive_failures }} consecutive failures, worst repeated task failure count {{ outputs.check_agent_history.vars.repeated_task_failures }}, failure percent {{ outputs.check_agent_history.vars.failure_percent }}. Reasons: {{ outputs.check_agent_history.vars.reasons | toJson }}."

outputs:
  - id: verdict
    type: STRING
    description: PASS when the agent flow history shows no failure loop, BLOCKED when a loop signature fires, REVIEW when the flow has no executions in the window or the history could not be read and fail_on_inconclusive is off.
    value: "{{ outputs.check_agent_history.vars.verdict }}"
  - id: executions_checked
    type: INT
    description: Number of real executions of the agent flow found in the lookback window.
    value: "{{ outputs.check_agent_history.vars.executions_checked }}"
  - id: failed_count
    type: INT
    description: Number of those executions in FAILED state.
    value: "{{ outputs.check_agent_history.vars.failed_count }}"
  - id: consecutive_failures
    type: INT
    description: Trailing run of FAILED executions ending at the most recent execution.
    value: "{{ outputs.check_agent_history.vars.consecutive_failures }}"

extend:
  shortDescription: Fail a run when an AI agent flow's own real execution history shows a failure loop
  title: AI Agent Execution Failure Loop Watchdog
  metaTitle: AI Agent Execution Failure Loop Watchdog | Kestra
  description: |
    ## What it does

    An AI agent flow that fails once is an incident. An agent flow that fails
    the same way, run after run, is a loop, and every new run it starts burns
    tokens, calls tools, and can take side effects while nobody notices the
    pattern. This blueprint watches one agent flow's own real execution
    history through the Kestra executions API and fails its own run when
    that history shows a loop: several FAILED executions in a row, the same
    task failing across several distinct executions, or a failure percent
    above the configured cap on a large enough sample. A clean history
    passes, a loop blocks, and a history that cannot be read fails closed
    instead of reporting a clean bill of health.

    This is not a count of failures in a namespace, and it is not an alert
    that leaves the loop running. It is scoped to a single agent flow, it
    tests three distinct loop signatures instead of one raw count, and the
    BLOCKED verdict fails the watchdog execution itself, so the loop is a
    failing run that demands attention rather than a message that can be
    ignored.

    ## Prerequisites

    - A running Kestra instance reachable at the `kestra_url` input, with
      executions in the namespace that holds the agent flow.
    - The id of the AI agent flow to watch, passed as `agent_flow_id`. The
      input has no default on purpose: a watchdog pointed at the wrong flow
      would bless the wrong history.
    - A Kestra worker with Docker access, since the history check runs in
      `python:3.12-slim` with only the standard library.
    - A Kestra API token with read access to executions, for instances that
      require authentication. A local instance without authentication needs
      no token.

    ### Secrets

    - `KESTRA_API_TOKEN`: API token used to read executions from the Kestra
      executions API (optional on instances without authentication).

    ## How it works

    1. `daily_agent_history_watch` (`io.kestra.plugin.core.trigger.Schedule`,
       cron `0 6 * * *`) runs the watchdog once a day.
    2. `check_agent_history` (`io.kestra.plugin.scripts.python.Script` on
       `python:3.12-slim`, standard library only) calls
       `GET /api/v1/executions/search` on the configured Kestra instance,
       filters the returned executions to the configured namespace and
       `agent_flow_id`, and keeps only executions that started inside the
       `lookback_hours` window. Every execution, state, and failed task in
       the verdict comes from that live response, never from bundled data.
    3. The script tests three loop signatures in order: a trailing run of
       FAILED executions at or above `max_consecutive_failures`; the same
       task failing in at least `max_repeated_task_failures` distinct
       executions; and a failure percent above `max_failure_percent`, which
       only fires once `min_executions_for_rate` executions exist in the
       window, so a tiny sample cannot trip a percent cap. Zero executions
       in the window yields REVIEW, not PASS, because a flow with no history
       has nothing to clear it.
    4. A read that fails (network error, non-200 response, or unparseable
       JSON) yields BLOCKED when `fail_on_inconclusive` is true and REVIEW
       when it is false. The watchdog never reports PASS for a history it
       could not read.
    5. `gate_on_verdict` (`io.kestra.plugin.core.flow.If`) fails the
       execution itself (`io.kestra.plugin.core.execution.Fail`) on a
       BLOCKED verdict, naming the real failed count, consecutive count,
       repeated task count, and failure percent. On PASS or REVIEW it logs
       the same counts, so the execution history proves the check ran.
    6. Flow outputs `verdict`, `executions_checked`, `failed_count`, and
       `consecutive_failures` let a downstream release or operations gate
       branch on the result: promotion requires verdict PASS.

    ## Quick start

    1. Add the `KESTRA_API_TOKEN` secret to your Kestra namespace if your
       instance requires authentication.
    2. Import this blueprint and run it once with `agent_flow_id` set to
       your agent flow and `kestra_url` pointing at your instance, then
       confirm `executions_checked` is above zero and the verdict matches
       what the executions page shows for that flow.
    3. Re-run against a flow you know has failed three times in a row and
       confirm the run fails with the real consecutive count in the error
       message. That is the enforcement path, exercised on live history.
    4. Leave the daily schedule enabled so the watchdog keeps running, and
       wire a downstream operations gate to the `verdict` output.

    ## How to adapt it

    - Tighten `max_consecutive_failures` to 2 for agent flows whose side
      effects make even a short loop expensive, or raise it for flows that
      legitimately retry against flaky tools.
    - Point the watchdog at a different agent flow per deployment by
      changing only `agent_flow_id`, keeping the same loop signatures, so
      one blueprint covers every agent flow in the namespace.
    - Add a notification task on the failing branch (Slack, PagerDuty, or
      email) that carries the `evidence` output, so the loop pages the
      owning team as well as failing the run.
    - Record every BLOCKED verdict in a table or KV store for a per-flow
      loop history dashboard: the evidence output already holds the failed
      execution ids, start times, and failed tasks.

  tags:
    - AI
  subTags:
    - Agents & Structured Output
  ee: false
  demo: false
  metaDescription: "Fail a run when an AI agent flow's own real execution history shows a failure loop: consecutive failures, a repeatedly failing task, or a failure rate above cap."
