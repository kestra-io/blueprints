id: iam-unused-keys-rotator
namespace: company.security

description: |
  Finds and optionally deactivates stale IAM access keys. Keys older than
  `key_age_days` or unused for `unused_days` are a top credential-leak vector:
  this flow audits every IAM user's active keys, posts a Slack report with the
  evidence, and deactivates stale keys only when `deactivate_stale` is
  explicitly set to true (report-only by default).

inputs:
  - id: key_age_days
    type: INT
    defaults: 90
    description: Flag keys older than this many days, even if recently used.
  - id: unused_days
    type: INT
    defaults: 90
    description: Flag keys with no recorded use in this many days.
  - id: deactivate_stale
    type: BOOLEAN
    defaults: false
    description: When true, stale keys are deactivated (status Inactive). Default false = report-only mode.

tasks:
  - id: fetch_users
    type: io.kestra.plugin.aws.cli.AwsCLI
    description: List every IAM user name in the account.
    commands:
      - |
        python3 << 'EOF'
        import json, subprocess
        p = subprocess.run(
            ["aws", "iam", "list-users", "--query", "Users[].UserName", "--output", "json"],
            capture_output=True, text=True,
        )
        users = json.loads(p.stdout.strip() or "[]")
        print("USER_LIST=" + " ".join(users))
        print("USER_COUNT=%d" % len(users))
        print("Listed %d IAM user(s)" % len(users))
        EOF
    env:
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
      AWS_DEFAULT_REGION: us-east-1

  - id: audit_keys
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit each user's active access keys for age and last-used date.
    values: "{{ outputs.fetch_users.vars.USER_LIST | split(' ') }}"
    tasks:
      - id: audit_user
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: Check one user's keys against the staleness thresholds.
        commands:
          - |
            python3 << 'EOF'
            import json, subprocess, datetime

            def aws(*args):
                p = subprocess.run(["aws"] + list(args), capture_output=True, text=True)
                return p.stdout.strip()

            user = "{{ taskrun.value }}"
            key_age_days = {{ inputs.key_age_days }}
            unused_days = {{ inputs.unused_days }}
            now = datetime.datetime.now(datetime.timezone.utc)

            if not user:
                print("AUDITED_USER=")
                print("KEY_COUNT=0")
                print("HAS_STALE=false")
                print("STALE_COUNT=0")
                print("STALE_KEY_IDS=")
                print("STALE_SUMMARY=")
                raise SystemExit

            keys = json.loads(aws(
                "iam", "list-access-keys", "--user-name", user,
                "--query", "AccessKeyMetadata[?Status=='Active']", "--output", "json",
            ) or "[]")

            stale = []
            for k in keys:
                key_id = k["AccessKeyId"]
                created = datetime.datetime.fromisoformat(k["CreateDate"])
                age_days = (now - created).days
                last_used_raw = aws(
                    "iam", "get-access-key-last-used", "--access-key-id", key_id,
                    "--query", "AccessKeyLastUsed.LastUsedDate", "--output", "text",
                )
                if last_used_raw and last_used_raw != "None":
                    last_used = datetime.datetime.fromisoformat(last_used_raw)
                    unused_for = (now - last_used).days
                    is_stale = age_days >= key_age_days or unused_for >= unused_days
                    evidence = "age %dd, last used %dd ago" % (age_days, unused_for)
                else:
                    is_stale = age_days >= key_age_days or age_days >= unused_days
                    evidence = "age %dd, never used" % age_days
                if is_stale:
                    stale.append((key_id, evidence))

            print("AUDITED_USER=" + user)
            print("KEY_COUNT=%d" % len(keys))
            print("HAS_STALE=" + ("true" if stale else "false"))
            print("STALE_COUNT=%d" % len(stale))
            print("STALE_KEY_IDS=" + " ".join(s for s, _ in stale))
            # literal \n sequences become real newlines inside the Slack JSON payload
            print("STALE_SUMMARY=" + "\\n".join("%s:%s (%s)" % (user, s, e) for s, e in stale))
            EOF
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: us-east-1

      - id: notify
        type: io.kestra.plugin.core.flow.If
        description: Report stale keys to Slack; stay quiet for clean users.
        condition: "{{ outputs.audit_user.vars.HAS_STALE == 'true' }}"
        then:
          - id: slack_stale_keys
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":key: *Stale IAM access keys* — user `{{ outputs.audit_user.vars.AUDITED_USER }}` has *{{ outputs.audit_user.vars.STALE_COUNT }}* stale key(s) out of {{ outputs.audit_user.vars.KEY_COUNT }} active.\n{{ outputs.audit_user.vars.STALE_SUMMARY }}\nAuto-deactivate is `{{ inputs.deactivate_stale }}` — rotate these keys in the IAM console while in report-only mode."
              }
        else:
          - id: log_clean_user
            type: io.kestra.plugin.core.log.Log
            message: "User {{ outputs.audit_user.vars.AUDITED_USER }}: all {{ outputs.audit_user.vars.KEY_COUNT }} active key(s) within thresholds."

      - id: deactivate
        type: io.kestra.plugin.core.flow.If
        description: Deactivate stale keys, but only when explicitly opted in.
        condition: "{{ inputs.deactivate_stale == true and outputs.audit_user.vars.HAS_STALE == 'true' }}"
        then:
          - id: deactivate_keys
            type: io.kestra.plugin.aws.cli.AwsCLI
            description: Set each stale key to Inactive for this user.
            commands:
              - |
                USER="{{ taskrun.value }}"
                IDS="{{ outputs.audit_user.vars.STALE_KEY_IDS }}"
                if [ -z "$IDS" ]; then echo "nothing to deactivate"; exit 0; fi
                for KEY_ID in $IDS; do
                  echo "Deactivating access key $KEY_ID for user $USER"
                  aws iam update-access-key --user-name "$USER" --access-key-id "$KEY_ID" --status Inactive
                done
                echo "DEACTIVATED_USER=$USER"
                echo "DEACTIVATED_COUNT=$(echo "$IDS" | wc -w | tr -d ' ')"
            env:
              AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
              AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
              AWS_DEFAULT_REGION: us-east-1

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Monday at 03:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 3 * * 1"
    disabled: true

extend:
  title: IAM Unused Keys Rotator
  metaTitle: Find and Deactivate Stale IAM Access Keys | Kestra
  shortDescription: Audit every IAM user's access keys for age and last-used date, get a Slack report of the stale ones, and optionally deactivate them automatically.
  metaDescription: Audit every IAM user for access keys older than 90 days or unused for 90 days, get a Slack report, and optionally deactivate the stale keys automatically.
  description: |
    Long-lived IAM access keys are one of the most common ways AWS accounts get compromised: a key created for a one-off task three years ago, committed to a repo or left in a CI secret, still works today. AWS recommends rotating keys every 90 days, but almost nobody audits for it. This blueprint does the audit for you — and, only if you opt in, the deactivation too.

    ## How it works

    1. A Schedule trigger fires weekly on Monday at 03:00 UTC (shipped disabled).
    2. `fetch_users` lists every IAM user in the account via `aws iam list-users`.
    3. A ForEach loop audits each user: `aws iam list-access-keys` plus `aws iam get-access-key-last-used` per key, computing key age and days-since-last-used.
    4. Keys older than `key_age_days` (default 90) or unused for `unused_days` (default 90) are flagged stale.
    5. An `If` task posts a Slack report per affected user with the evidence — quiet for clean users.
    6. A second `If` task runs `aws iam update-access-key --status Inactive` on the stale keys, but ONLY when `deactivate_stale` is explicitly true. Default is report-only.

    ## What you get

    - A weekly, per-user report of stale access keys with age and last-used evidence.
    - An explicit opt-in gate for deactivation — nothing is mutated unless you say so.
    - Silence on clean weeks: Slack only fires for users who actually have stale keys.

    ## Who it's for

    Platform and security engineers responsible for AWS account hygiene, and anyone who has ever found a three-year-old key in a `.env` file.

    ## Why orchestrate this with Kestra

    A manual key audit is a spreadsheet nobody updates. As a scheduled Kestra flow the audit runs itself, the thresholds are inputs anyone can tune, every run is logged for your auditors, and the deactivate gate means the same flow serves both report-only compliance teams and teams that want auto-remediation.

    ## Prerequisites

    - AWS credentials with `iam:ListUsers`, `iam:ListAccessKeys`, `iam:GetAccessKeyLastUsed`, and (only if you enable it) `iam:UpdateAccessKey`.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the IAM API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the IAM API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the stale-key report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Run manually once and review the Slack report (report-only by default).
    3. When you trust the findings, re-run with `deactivate_stale: true` — or enable the weekly schedule.

    ## How to extend

    - Delete (instead of deactivate) keys that have been inactive twice as long, after a second confirmation window.
    - Notify the key owner directly by mapping IAM users to Slack handles via tags.
    - Add keys found in a secrets-scanner feed as an extra input list to force-rotate.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [AWS: managing access keys best practices](https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html)
    - [get-access-key-last-used API](https://docs.aws.amazon.com/cli/latest/reference/iam/get-access-key-last-used.html)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
