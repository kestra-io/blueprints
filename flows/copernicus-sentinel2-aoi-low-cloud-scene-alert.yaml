id: copernicus-sentinel2-aoi-low-cloud-scene-alert
namespace: company.team

description: |
  Daily, one keyless Copernicus Data Space STAC search finds the Sentinel-2 L2A tiles over your AOIs
  (fields, mine pits, construction sites). DuckDB merges the tiles of each satellite pass, measures how
  much of each AOI the low-cloud tiles cover, and Slack gets each new usable pass once, per AOI.

inputs:
  - id: aois
    type: JSON
    displayName: Areas of interest
    description: JSON array of `name` (unique, half of the dedupe key) and `bbox` as [west, south, east, north] in decimal degrees (WGS84), at most 2 degrees wide or tall.
    defaults: |
      [
        {"name": "Fresno County almond blocks, California", "bbox": [-120.42, 36.55, -120.30, 36.65]},
        {"name": "Finney County wheat fields, Kansas", "bbox": [-100.95, 37.90, -100.80, 38.00]},
        {"name": "Flevoland arable parcels, Netherlands", "bbox": [5.40, 52.45, 5.55, 52.55]},
        {"name": "Oyu Tolgoi open pit, Mongolia", "bbox": [106.82, 42.98, 106.90, 43.04]},
        {"name": "King Salman Park construction, Riyadh", "bbox": [46.69, 24.71, 46.76, 24.77]}
      ]

  - id: max_cloud_pct
    type: FLOAT
    defaults: 20.0
    description: Highest tile-level `eo:cloud_cover` (percent) a tile may have to count as usable.

  - id: min_coverage_pct
    type: FLOAT
    defaults: 90.0
    description: Share of the AOI (sampled on a 6 x 6 grid) that the usable tiles of one pass must cover before it is alerted.

  - id: lookback_days
    type: INT
    defaults: 10
    description: Sensing window searched on every run. L2A products appear 2 to 24 hours after sensing, so keep it at 3 or more for a daily schedule.

  - id: state_key
    type: STRING
    defaults: sentinel2_aoi_clear_scene_state
    description: KV key holding the passes already alerted. Use a different key per AOI list.

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: 07:30 UTC, after the European and American overnight L2A production has been published.
    cron: "30 7 * * *"

tasks:
  - id: previous_state
    type: io.kestra.plugin.core.kv.Get
    description: Passes already alerted (AOI and datatake). Missing on the first run, so every usable pass in the window alerts once.
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: prepare
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Validates the AOIs and builds one CQL2 `or` of `s_intersects` polygons so every AOI goes into a single search request. A CQL2 `bbox` literal silently matches nothing on this catalogue, so closed polygons are used.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      aois.json: "{{ inputs.aois | toJson }}"
    sql: |
      CREATE TABLE aoi_input AS
      SELECT trim(a ->> 'name') AS name, TRY_CAST(a -> 'bbox' AS DOUBLE[]) AS bbox, row_number() OVER () AS ord
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS a FROM read_text('aois.json'));

      CREATE TABLE aoi_check AS
      SELECT *, CASE
          WHEN name IS NULL OR name = '' THEN 'missing name'
          WHEN bbox IS NULL OR len(bbox) <> 4 OR list_aggregate(bbox, 'count') <> 4 THEN 'bbox must be [west, south, east, north]'
          WHEN abs(bbox[1]) > 180 OR abs(bbox[3]) > 180 OR abs(bbox[2]) > 90 OR abs(bbox[4]) > 90 THEN 'coordinates out of range'
          WHEN bbox[1] >= bbox[3] OR bbox[2] >= bbox[4] THEN 'west must be below east and south below north (split AOIs that cross the antimeridian)'
          WHEN bbox[3] - bbox[1] > 2 OR bbox[4] - bbox[2] > 2 THEN 'larger than 2 degrees, split it'
          WHEN row_number() OVER (PARTITION BY name ORDER BY ord) > 1 THEN 'duplicate name'
        END AS problem
      FROM aoi_input;

      SELECT
        (SELECT count(*) FROM aoi_check WHERE problem IS NULL) AS valid_aois,
        (SELECT count(*) FROM aoi_check WHERE problem IS NOT NULL) AS invalid_aois,
        (SELECT coalesce(string_agg('row ' || ord || ' ' || coalesce(name, '(no name)') || ' - ' || problem, '; ' ORDER BY ord), '') FROM aoi_check WHERE problem IS NOT NULL) AS invalid_list,
        (SELECT coalesce(CAST(to_json(list({'name': name, 'bbox': bbox} ORDER BY ord)) AS VARCHAR), '[]') FROM aoi_check WHERE problem IS NULL) AS aoi_json,
        (SELECT coalesce(CAST(to_json(list({'op': 's_intersects', 'args': [
            to_json({'property': 'geometry'}),
            to_json({'type': 'Polygon', 'coordinates': [[[bbox[1], bbox[2]], [bbox[3], bbox[2]], [bbox[3], bbox[4]], [bbox[1], bbox[4]], [bbox[1], bbox[2]]]]})]} ORDER BY ord)) AS VARCHAR), '[]')
         FROM aoi_check WHERE problem IS NULL) AS filter_args;

  - id: warn_invalid_aois
    type: io.kestra.plugin.core.log.Log
    runIf: "{{ outputs.prepare.outputs[0].row.invalid_aois > 0 }}"
    level: WARN
    message: "Skipped invalid AOI(s): {{ outputs.prepare.outputs[0].row.invalid_list }}"

  - id: no_valid_aoi
    type: io.kestra.plugin.core.execution.Fail
    condition: "{{ outputs.prepare.outputs[0].row.valid_aois == 0 }}"
    errorMessage: "No valid AOI in the input: {{ outputs.prepare.outputs[0].row.invalid_list }}"

  - id: search
    type: io.kestra.plugin.core.http.Download
    description: |
      One POST to the STAC item search for all AOIs. `fields` keeps only the footprint, sensing time, cloud cover,
      MGRS tile, datatake and quicklook, which turns about 70 KB per item into under 1 KB. The retry covers the
      occasional 5xx or dropped connection from the catalogue.
    uri: https://stac.dataspace.copernicus.eu/v1/search
    method: POST
    contentType: application/json
    headers:
      Accept: application/geo+json
      User-Agent: kestra-copernicus-sentinel2-aoi-low-cloud-scene-alert/1.0 (https://kestra.io)
    body: |
      {
        "collections": ["sentinel-2-l2a"],
        "datetime": "{{ execution.startDate | dateAdd(-inputs.lookback_days, 'DAYS') | date("yyyy-MM-dd'T'HH:mm:ss'Z'", timeZone='UTC') }}/..",
        "limit": 500,
        "fields": {
          "include": ["id", "geometry", "properties.datetime", "properties.eo:cloud_cover", "properties.grid:code",
                      "properties.platform", "properties.eopf:datatake_id", "properties.processing:datetime", "assets.thumbnail.href"],
          "exclude": ["links"]
        },
        "filter-lang": "cql2-json",
        "filter": {"op": "or", "args": {{ outputs.prepare.outputs[0].row.filter_args }}},
        "sortby": [{"field": "properties.datetime", "direction": "desc"}]
      }
    options:
      timeout:
        readIdleTimeout: PT2M
    retry:
      type: exponential
      interval: PT20S
      maxInterval: PT5M
      maxAttempts: 4

  - id: evaluate
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Keeps the newest processing of each tile and sensing time, groups tiles by datatake (one satellite pass), and
      ray-casts a 6 x 6 grid of AOI points against the footprints of the tiles under `max_cloud_pct`. A pass is CLEAR
      when those tiles cover at least `min_coverage_pct` of the AOI, PARTIAL when they cover less (swath edge or a
      cloudy neighbour tile) and CLOUDY when none qualifies. CLEAR passes not in the KV state are NEW.
    url: "jdbc:duckdb:"
    timeZoneId: UTC
    fetchType: FETCH_ONE
    inputFiles:
      search.json: "{{ outputs.search.uri }}"
      aois.json: "{{ outputs.prepare.outputs[0].row.aoi_json }}"
      state.json: "{{ (outputs.previous_state.value ?? []) | toJson }}"
    outputFiles:
      - manifest_csv
      - state_json
    parameters:
      max_cloud: "{{ inputs.max_cloud_pct }}"
      min_cov: "{{ inputs.min_coverage_pct }}"
      keep_after: "{{ execution.startDate | dateAdd(-inputs.lookback_days - 1, 'DAYS') | date(\"yyyy-MM-dd'T'HH:mm:ss'Z'\", timeZone='UTC') }}"
    sql: |
      SET TimeZone = 'UTC';

      CREATE TABLE aois AS
      SELECT a ->> 'name' AS aoi, CAST(a -> 'bbox' AS DOUBLE[]) AS bbox
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS a FROM read_text('aois.json'));

      CREATE TABLE response AS SELECT CAST(content AS JSON) AS j FROM read_text('search.json');

      -- Property names contain a colon, which the JDBC layer would read as a parameter, so they are built with chr(58).
      CREATE TABLE items AS
      SELECT f ->> 'id' AS item_id,
             CAST(json_extract_string(f, '$.properties.datetime') AS TIMESTAMPTZ) AS sensed,
             CAST(json_extract_string(f, '$.properties."eo' || chr(58) || 'cloud_cover"') AS DOUBLE) AS cloud,
             replace(json_extract_string(f, '$.properties."grid' || chr(58) || 'code"'), 'MGRS-', '') AS tile,
             upper(replace(json_extract_string(f, '$.properties.platform'), 'sentinel-', 'S')) AS platform,
             coalesce(regexp_replace(json_extract_string(f, '$.properties."eopf' || chr(58) || 'datatake_id"'), '_N[0-9.]+$', ''),
                      json_extract_string(f, '$.properties.platform') || '_' || json_extract_string(f, '$.properties.datetime')) AS datatake,
             json_extract_string(f, '$.assets.thumbnail.href') AS quicklook,
             f -> 'geometry' AS geometry
      FROM (SELECT unnest(from_json(json_extract(j, '$.features'), '["JSON"]')) AS f FROM response)
      QUALIFY row_number() OVER (PARTITION BY tile, sensed
                                 ORDER BY json_extract_string(f, '$.properties."processing' || chr(58) || 'datetime"') DESC) = 1;

      -- Outer ring of every polygon of the footprint (Polygon or MultiPolygon), as edges.
      CREATE TABLE edges AS
      WITH rings AS (
        SELECT item_id, unnest(CASE geometry ->> 'type'
                 WHEN 'Polygon' THEN [from_json(geometry -> '$.coordinates[0]', '[["DOUBLE"]]')]
                 ELSE list_transform(from_json(geometry -> '$.coordinates', '[[[["DOUBLE"]]]]'), p -> p[1]) END) AS ring
        FROM items
      ), pts AS (
        SELECT item_id, ring, unnest(range(1, len(ring))) AS k FROM rings
      )
      SELECT item_id, ring[k][1] AS x1, ring[k][2] AS y1, ring[k + 1][1] AS x2, ring[k + 1][2] AS y2 FROM pts;

      CREATE TABLE grid AS
      SELECT aoi, i * 6 + jj AS pt,
             bbox[1] + (i + 0.5) * (bbox[3] - bbox[1]) / 6 AS lon,
             bbox[2] + (jj + 0.5) * (bbox[4] - bbox[2]) / 6 AS lat
      FROM aois, range(6) AS r(i), range(6) AS s(jj);

      -- Ray casting: a point is inside a footprint when a ray to the east crosses an odd number of edges.
      CREATE TABLE covered AS
      SELECT g.aoi, g.pt, e.item_id
      FROM grid g JOIN edges e ON (e.y1 > g.lat) <> (e.y2 > g.lat)
      WHERE g.lon < (e.x2 - e.x1) * (g.lat - e.y1) / (e.y2 - e.y1) + e.x1
      GROUP BY ALL HAVING count(*) % 2 = 1;

      CREATE TABLE passes AS
      SELECT c.aoi, i.datatake, min(i.sensed) AS sensed, any_value(i.platform) AS platform,
             round(100.0 * count(DISTINCT c.pt) FILTER (WHERE i.cloud <= :max_cloud) / 36, 1) AS clear_coverage_pct,
             round(100.0 * count(DISTINCT c.pt) / 36, 1) AS footprint_coverage_pct,
             string_agg(DISTINCT i.tile || ' ' || i.cloud || '%', ', ') AS tiles,
             string_agg(DISTINCT i.tile || ' ' || i.cloud || '%', ', ') FILTER (WHERE i.cloud <= :max_cloud) AS clear_tiles,
             string_agg(DISTINCT i.item_id, ' ') AS item_ids,
             arg_min(i.quicklook, i.cloud) AS quicklook, arg_min(i.item_id, i.cloud) AS best_item
      FROM covered c JOIN items i USING (item_id)
      GROUP BY c.aoi, i.datatake;

      CREATE TABLE state AS
      SELECT s ->> 'aoi' AS aoi, s ->> 'datatake' AS datatake, s ->> 'sensed' AS sensed
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS s FROM read_text('state.json'));

      CREATE TABLE judged AS
      SELECT p.*,
             CASE WHEN p.clear_coverage_pct >= :min_cov THEN 'CLEAR' WHEN p.clear_coverage_pct > 0 THEN 'PARTIAL' ELSE 'CLOUDY' END AS status,
             s.datatake IS NOT NULL AS already_alerted
      FROM passes p LEFT JOIN state s ON s.aoi = p.aoi AND s.datatake = p.datatake;

      COPY (
        SELECT aoi, strftime(sensed, '%Y-%m-%dT%H:%M:%SZ') AS sensed_utc, platform, datatake, status,
               CASE WHEN status <> 'CLEAR' THEN '' WHEN already_alerted THEN 'ALREADY_ALERTED' ELSE 'NEW' END AS alert_status,
               clear_coverage_pct, footprint_coverage_pct, tiles, quicklook,
               'https://stac.dataspace.copernicus.eu/v1/collections/sentinel-2-l2a/items/' || best_item AS stac_item, item_ids
        FROM judged ORDER BY aoi, sensed DESC
      ) TO '{{ outputFiles.manifest_csv }}' (HEADER true, DELIMITER ',');

      COPY (
        SELECT aoi, datatake, strftime(sensed, '%Y-%m-%dT%H:%M:%SZ') AS sensed FROM judged WHERE status = 'CLEAR' AND NOT already_alerted
        UNION ALL
        SELECT * FROM state WHERE CAST(sensed AS TIMESTAMPTZ) >= CAST(:keep_after AS TIMESTAMPTZ)
        ORDER BY sensed, aoi
      ) TO '{{ outputFiles.state_json }}' (FORMAT JSON, ARRAY true);

      WITH per_aoi AS (
        SELECT a.aoi,
               count(j.datatake) AS passes,
               count(*) FILTER (WHERE j.status = 'CLEAR') AS clear,
               count(*) FILTER (WHERE j.status = 'CLEAR' AND NOT j.already_alerted) AS new_clear,
               max(j.sensed) FILTER (WHERE j.status = 'CLEAR') AS last_clear,
               string_agg('- ' || strftime(j.sensed, '%Y-%m-%d %H:%M UTC') || ' ' || j.platform || ': *' || j.clear_coverage_pct
                          || '% of the AOI clear*, tile cloud ' || j.clear_tiles || ', <' || j.quicklook || '|quicklook>, <https://stac.dataspace.copernicus.eu/v1/collections/sentinel-2-l2a/items/'
                          || j.best_item || '|STAC item>', chr(10) ORDER BY j.sensed DESC)
                 FILTER (WHERE j.status = 'CLEAR' AND NOT j.already_alerted) AS lines
        FROM aois a LEFT JOIN judged j USING (aoi) GROUP BY a.aoi
      )
      SELECT
        (SELECT count(*) FROM (SELECT unnest(from_json(json_extract(j, '$.features'), '["JSON"]')) FROM response)) AS items_returned,
        (SELECT count(*) FROM items) AS items_kept,
        (SELECT count(*) FROM response WHERE json_extract_string(j, '$.links') LIKE '%"next"%') > 0 AS truncated,
        (SELECT count(*) FROM state) = 0 AS is_first_run,
        (SELECT count(*) FROM judged) AS passes,
        (SELECT count(*) FROM judged WHERE status = 'CLEAR') AS clear_passes,
        (SELECT count(*) FROM judged WHERE status = 'PARTIAL') AS partial_passes,
        (SELECT count(*) FROM judged WHERE status = 'CLEAR' AND NOT already_alerted) AS new_clear_passes,
        (SELECT string_agg(aoi || ' ' || passes || ' passes, ' || clear || ' clear, last clear ' || coalesce(strftime(last_clear, '%Y-%m-%d'), 'none in window'), '; ' ORDER BY aoi) FROM per_aoi) AS per_aoi_summary,
        (SELECT coalesce(CAST(json_group_array(json_object('aoi', aoi, 'new_clear', new_clear,
             'message', left('*' || aoi || '*: ' || new_clear || ' new low-cloud Sentinel-2 pass(es)' || chr(10) || lines, 2900))) AS VARCHAR), '[]')
           FROM per_aoi WHERE new_clear > 0) AS alert_aois;

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    description: Alerted passes, pruned once they fall out of the search window.
    key: "{{ inputs.state_key }}"
    kvType: JSON
    value: "{{ read(outputs.evaluate.outputFiles.state_json) }}"

  - id: warn_truncated
    type: io.kestra.plugin.core.log.Log
    runIf: "{{ outputs.evaluate.outputs[0].row.truncated }}"
    level: WARN
    message: The search returned a next page (more than 500 tiles). Shorten `lookback_days` or split the AOI list; older tiles were not evaluated.

  - id: alert_new_passes
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.evaluate.outputs[0].row.new_clear_passes > 0 }}"
    then:
      - id: log_alerts
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "{% for a in fromJson(outputs.evaluate.outputs[0].row.alert_aois) %}{{ a.message }}\n{% endfor %}"

      - id: each_aoi
        type: io.kestra.plugin.core.flow.Loop
        description: One Slack message per AOI with new clear passes, so each field or site owner sees only their area.
        values: "{{ outputs.evaluate.outputs[0].row.alert_aois }}"
        concurrencyLimit: 1
        tasks:
          - id: slack_alert
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: allowFailure keeps the run green when `SLACK_WEBHOOK_URL` is not set; the same passes are in the manifest CSV.
            allowFailure: true
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": {{ (':satellite: ' ~ fromJson(item.value).new_clear ~ ' new clear Sentinel-2 pass(es) over ' ~ fromJson(item.value).aoi) | toJson }},
                "blocks": [
                  {"type": "section", "text": {"type": "mrkdwn", "text": {{ fromJson(item.value).message | toJson }}}},
                  {"type": "context", "elements": [{"type": "mrkdwn", "text": {{ ('Copernicus Data Space STAC via Kestra ' ~ flow.namespace ~ '.' ~ flow.id ~ ', tile cloud cover at most ' ~ inputs.max_cloud_pct ~ '%') | toJson }}}]}
                ]
              }
    else:
      - id: nothing_new
        type: io.kestra.plugin.core.log.Log
        message: "No new clear pass. {{ outputs.evaluate.outputs[0].row.clear_passes }} clear pass(es) in the window were alerted by an earlier run."

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      STAC returned {{ outputs.evaluate.outputs[0].row.items_returned }} L2A tiles ({{ outputs.evaluate.outputs[0].row.items_kept }} after dropping older processings) in the last {{ inputs.lookback_days }} days, grouped into {{ outputs.evaluate.outputs[0].row.passes }} AOI passes: {{ outputs.evaluate.outputs[0].row.clear_passes }} clear, {{ outputs.evaluate.outputs[0].row.partial_passes }} partial, {{ outputs.evaluate.outputs[0].row.new_clear_passes }} new{{ outputs.evaluate.outputs[0].row.is_first_run ? ' (first run: every clear pass alerts once)' : '' }}.
      Per AOI: {{ outputs.evaluate.outputs[0].row.per_aoi_summary }}
      Manifest: {{ outputs.evaluate.outputFiles.manifest_csv }}

outputs:
  - id: manifest_csv
    type: FILE
    value: "{{ outputs.evaluate.outputFiles.manifest_csv }}"
  - id: run_summary
    type: JSON
    value: "{{ outputs.evaluate.outputs[0].row }}"

extend:
  title: Alert on New Low-Cloud Sentinel-2 Scenes over Your AOIs with the Copernicus STAC Catalogue
  metaTitle: Sentinel-2 Low-Cloud Scene Alerts for Fields, Mines and Sites | Kestra
  shortDescription: Search the keyless Copernicus Data Space STAC catalogue every day for Sentinel-2 L2A passes over your fields, mines or construction sites, check in DuckDB that low-cloud tiles really cover each AOI, and post each new usable pass to Slack once with quicklook links and a CSV manifest.
  metaDescription: Daily Copernicus STAC search for low-cloud Sentinel-2 L2A passes over your AOIs, with DuckDB coverage checks, KV dedupe and Slack quicklook alerts.
  description: |
    Field, mine and construction teams wait for a cloud-free Sentinel-2 image before running NDVI, stockpile or progress analysis. The tile cloud figure alone misleads: an AOI on a swath edge can be half outside the image, and one on an MGRS tile overlap appears in two products with different cloud figures. This flow searches the keyless Copernicus Data Space STAC catalogue daily for all your AOIs and posts only usable, new passes.

    ## How it works

    1. `daily` (Schedule) runs at 07:30 UTC. `aois` is a JSON array of `name` and `bbox` ([west, south, east, north]).
    2. `prepare` (DuckDB) validates the AOIs and builds one CQL2 `or` of `s_intersects` polygons; `warn_invalid_aois` logs skipped rows and `no_valid_aoi` fails the run when none is left.
    3. `search` (HTTP Download) sends one POST to `/v1/search` for `sentinel-2-l2a` over `lookback_days`, with `fields` so a tile is under 1 KB instead of about 70 KB.
    4. `evaluate` (DuckDB) keeps the newest processing of each tile, groups tiles by datatake (one satellite pass) and ray-casts a 6 x 6 grid of AOI points against footprints of tiles under `max_cloud_pct`. A pass is `CLEAR` at `min_coverage_pct` or more, `PARTIAL` below, `CLOUDY` with no usable tile. CLEAR passes missing from the KV state are `NEW`.
    5. `save_state` (KV Set) stores alerted passes and prunes those older than the window.
    6. `alert_new_passes` (If) logs the alerts at WARN and `each_aoi` (Loop) posts one Slack message per AOI; `summary` logs counts and the last clear date per AOI.

    ## What you get

    - One Slack message per AOI with sensing time, satellite, AOI coverage, tile cloud cover, quicklook and STAC links.
    - A manifest CSV of every pass in the window with status, coverage, tiles and item ids.
    - Each pass posted once, even if published hours after sensing or reprocessed.
    - No API key, no container, no GIS extension.

    ## Who it's for

    - Agronomy and precision-farming teams.
    - Mining, quarry and stockpile surveyors.
    - Construction and infrastructure monitoring teams.

    ## Why orchestrate this with Kestra

    - Schedule, retry, KV state and Slack fan-out live in one YAML file.
    - DuckDB reads the STAC response and the KV state directly, so the coverage logic is plain SQL.
    - `If` and `Loop` keep Slack quiet on cloudy days.

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB and Slack plugins.
    - Outbound HTTPS to `stac.dataspace.copernicus.eu`. Search is public; downloading products needs a free Copernicus Data Space account.
    - `eo:cloud_cover` covers the whole 110 km tile, not your AOI. Default AOIs are sample locations; the scenes come from the live catalogue.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the alerts (optional; without it they are in the WARN log and the CSV).

    ## Quick start

    1. Optionally add the `SLACK_WEBHOOK_URL` secret.
    2. Click **Execute** with the five sample AOIs. When tested, four had clear passes, two also had partial swath-edge passes and Flevoland was cloudy all ten days.
    3. Execute again: nothing new is posted.
    4. Replace `aois` with your own areas and enable the `daily` trigger.

    ## How to extend

    - Start an openEO or Sentinel Hub NDVI job on each new clear pass.
    - Add `sentinel-1-grd` for radar passes when the optical view stays cloudy.
    - Add a webhook field per AOI to route alerts to each owner.

    ## Links

    - [Copernicus Data Space STAC catalogue](https://documentation.dataspace.copernicus.eu/APIs/STAC.html)
    - [HTTP Download](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [KV Set](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.set), [If](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if) and [Loop](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - ELT & Data Landing
  ee: false
  demo: false
