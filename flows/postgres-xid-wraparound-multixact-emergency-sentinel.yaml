id: postgres-xid-wraparound-multixact-emergency-sentinel
namespace: company.data
description: Audits PostgreSQL database age(datfrozenxid) to prevent catastrophic emergency shutdowns into single-user read-only mode.

inputs:
  - id: pg_host
    type: STRING
    defaults: "postgres.internal"
    description: PostgreSQL server hostname or IP address.
  - id: pg_port
    type: INT
    defaults: 5432
    description: PostgreSQL port.
  - id: pg_user
    type: STRING
    defaults: "postgres"
    description: PostgreSQL username.
  - id: xid_consumption_threshold_pct
    type: INT
    defaults: 75
    description: Maximum acceptable percentage of 2-billion transaction ID space consumed before emergency alert.

tasks:
  - id: query_xid_age
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "jdbc:postgresql://{{ inputs.pg_host }}:{{ inputs.pg_port }}/postgres"
    username: "{{ inputs.pg_user }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    sql: |
      SELECT 
          datname AS db_name, 
          age(datfrozenxid) AS max_age, 
          ROUND(100.0 * age(datfrozenxid) / 2000000000, 2) AS consumed_pct 
      FROM pg_database 
      WHERE datallowconn 
      ORDER BY 2 DESC 
      LIMIT 1;
    fetchType: FETCH_ONE

  - id: evaluate_xid_wraparound_risk
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_xid_age.row is defined and outputs.query_xid_age.row != null and outputs.query_xid_age.row.consumed_pct >= inputs.xid_consumption_threshold_pct }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#postgresql-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 CRITICAL: PostgreSQL Transaction ID Wraparound Risk",
                "text": "Database `{{ outputs.query_xid_age.row.db_name }}` on `{{ inputs.pg_host }}` has reached *{{ outputs.query_xid_age.row.consumed_pct }}%* of the 2-billion transaction ID wraparound limit (Age: *{{ outputs.query_xid_age.row.max_age }}* transactions)! EMERGENCY: When age reaches 2 billion, PostgreSQL halts write operations and shuts down into single-user read-only mode to prevent data corruption. Immediate `VACUUM FREEZE` is required.",
                "footer": "Kestra Database Sentinel • PostgreSQL"
              }
            ]
          }

outputs:
  - id: db_name
    type: STRING
    value: "{{ outputs.query_xid_age.row ? outputs.query_xid_age.row.db_name : '' }}"
  - id: max_age
    type: INT
    value: "{{ outputs.query_xid_age.row ? outputs.query_xid_age.row.max_age : 0 }}"
  - id: consumed_pct
    type: FLOAT
    value: "{{ outputs.query_xid_age.row ? outputs.query_xid_age.row.consumed_pct : 0.0 }}"

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#postgresql-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ PostgreSQL Transaction ID (XID) Wraparound Emergency Sentinel Pipeline Failure",
            "text": "Failed to query PostgreSQL pg_database for transaction ID age. Check connection parameters.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: Audits PostgreSQL database age(datfrozenxid) to prevent catastrophic emergency shutdowns into single-user read-only mode.
  metaTitle: PostgreSQL Transaction ID (XID) Wraparound Emergency Sentinel with Kestra
  title: PostgreSQL Transaction ID (XID) Wraparound Emergency Sentinel
  shortDescription: Audits PostgreSQL database age(datfrozenxid) to prevent catastrophic emergency shutdowns into single-user read-only mode.
  description: |
    ## How it works
    This workflow executes `SELECT datname, age(datfrozenxid) FROM pg_database` to calculate the oldest unfrozen transaction ID relative to PostgreSQL's 2-billion transaction horizon. If autovacuum cannot freeze old tuples due to long-running transactions, abandoned replication slots, or improper `autovacuum_freeze_max_age` tuning, the database approaches wraparound. If consumption exceeds the safety threshold, an emergency alert is dispatched to Slack.

    ## What you get
    - Continuous audit of transaction ID space consumption across all cluster databases.
    - Prevents catastrophic unplanned database shutdowns into single-user read-only mode.
    - Actionable warnings with exact transaction age and percentage consumed.

    ## Who it's for
    - Principal Database Administrators (DBAs) and SREs guarding PostgreSQL production uptime.
    - Data Platform Engineers running multi-terabyte transactional databases.

    ## Why orchestrate this with Kestra
    - **Mission-Critical Prevention**: Protect against one of PostgreSQL's most severe operational failure modes.
    - **Zero-Footprint Querying**: Uses native JDBC execution with official PostgreSQL plugin.
    - **Emergency Escalation**: Immediate multi-channel alerting before autovacuum panic modes kick in.

    ## Prerequisites
    - PostgreSQL instance with network connectivity from Kestra.
    - Secrets `POSTGRES_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import blueprint into Kestra.
    2. Configure PostgreSQL host coordinates.
    3. Run the workflow to inspect transaction ID age.

    ## Links
    - [PostgreSQL Transaction ID Wraparound Failures](https://www.postgresql.org/docs/current/routine-vacuuming.html#VACUUM-FOR-WRAPAROUND)
    - [Kestra PostgreSQL Plugin](https://kestra.io/plugins/plugin-jdbc-postgres)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
