id: phpipam-orphan-vlan-cleanup-guard
namespace: company.team

concurrency:
  limit: 1
  behavior: QUEUE

description: |
  Find phpIPAM VLANs that no subnet is bound to, are older than a grace window and sit inside a
  declared number range, then delete them behind an approval gate. phpIPAM unlinks subnets from a
  VLAN it deletes instead of refusing, so every binding is read across every section first and
  phpIPAM is re-read afterwards to prove the cleanup landed and that no live subnet was unlinked.

inputs:
  - id: base_url
    type: STRING
    displayName: phpIPAM base URL
    description: Root URL of the phpIPAM instance. Maps to every phpIPAM task's baseUrl field.
    defaults: "http://localhost"

  - id: app_id
    type: STRING
    displayName: Application ID
    description: API application identifier configured in phpIPAM under Administration, API. Maps to every phpIPAM task's appId field.
    defaults: "myapp"

  - id: app_token
    type: STRING
    displayName: phpIPAM API token
    description: >-
      API token for that application. The default reads the PHPIPAM_APP_TOKEN secret. Kestra
      renders an input default lazily, so a run that passes a literal token never touches the
      secret store. Use an App token rather than username plus password: phpIPAM applies per
      user section permissions to a session token, so a hidden section would hide a binding.
    defaults: "{{ secret('PHPIPAM_APP_TOKEN') }}"

  - id: target_number_min
    type: INT
    displayName: Lowest VLAN number the cleanup may touch
    description: >-
      Start of the declared cleanup range. A VLAN whose number sits outside this range is
      reported and never deleted, which keeps the sweep inside the pool your team hands out.
    defaults: 300

  - id: target_number_max
    type: INT
    displayName: Highest VLAN number the cleanup may touch
    description: End of the declared cleanup range, inclusive.
    defaults: 399

  - id: grace_days
    type: INT
    displayName: Grace window in days
    description: >-
      A VLAN is only a candidate when its phpIPAM editDate is older than this many days. A VLAN
      with no editDate at all is reported as AGE_UNKNOWN and never deleted, because an unknown
      age is not evidence of an abandoned VLAN.
    defaults: 90

  - id: protected_vlan_numbers
    type: STRING
    displayName: Protected VLAN numbers
    description: Comma separated VLAN numbers that are reported when they look orphaned but never deleted. Use it for reserved management or infrastructure numbers.
    defaults: ""

  - id: protected_vlan_ids
    type: STRING
    displayName: Protected VLAN IDs
    description: Comma separated phpIPAM VLAN IDs that are never deleted, whatever their number or age.
    defaults: ""

  - id: max_deletes_per_run
    type: INT
    displayName: Per-run delete ceiling
    description: >-
      The run refuses when more VLANs look orphaned than this. A sudden crowd of candidates
      usually means a section read is incomplete or a project was just torn down in bulk, so the
      flow stops and asks rather than emptying the VLAN table.
    defaults: 5

  - id: dry_run
    type: BOOL
    displayName: Report only
    description: True reports the candidates without deleting anything in phpIPAM.
    defaults: true

  - id: auto_remediate
    type: BOOL
    displayName: Allow deletes
    description: Must be true, with dry_run false, before any phpIPAM delete is even offered for approval.
    defaults: false

  - id: insecure_tls
    type: BOOL
    displayName: Disable TLS certificate validation
    description: Set true only for a local or internal instance with a self-signed certificate.
    defaults: false

tasks:
  - id: read_sections
    type: io.kestra.plugin.phpipam.ipam.section.List
    description: Lists every section. A VLAN is bound by a subnet in any section, so the section list is what makes the binding read complete rather than a sample.
    baseUrl: "{{ inputs.base_url }}"
    appId: "{{ inputs.app_id }}"
    auth:
      appToken: "{{ inputs.app_token }}"
    insecureTls: "{{ inputs.insecure_tls }}"
    fetchType: FETCH

  - id: read_vlans_before
    type: io.kestra.plugin.phpipam.ipam.vlan.List
    description: Reads every VLAN with its number plus editDate. This is the before picture the whole run is judged against.
    baseUrl: "{{ inputs.base_url }}"
    appId: "{{ inputs.app_id }}"
    auth:
      appToken: "{{ inputs.app_token }}"
    insecureTls: "{{ inputs.insecure_tls }}"
    fetchType: FETCH

  - id: read_bindings_before
    type: io.kestra.plugin.core.flow.Loop
    description: >-
      One subnet read per section, serialised, aggregated back through the loop's own outputs.
      phpIPAM answers 404 No subnets found for a section that holds none, so section.Get runs
      first in the same iteration: it proves the URL, the token, TLS plus the section id are
      good, which is what lets a failed subnet read count as zero subnets instead of a blind spot.
    concurrencyLimit: 1
    fetchType: FETCH
    values: "{{ outputs.read_sections.sections | toJson | jq('[.[].id | tostring]') | first }}"
    outputs:
      - id: section_id
        type: STRING
        value: "{{ item.value }}"
      - id: section_name
        type: STRING
        value: "{{ outputs.probe_section_before.section.name }}"
      - id: subnets_read
        type: INT
        value: "{{ outputs.read_subnets_before.total ?? -1 }}"
      - id: bound_vlan_ids
        type: JSON
        value: "{{ (outputs.read_subnets_before.subnets ?? []) | toJson | jq('[.[] | select((.vlanId // \"0\") != \"0\") | (.vlanId | tostring)] | unique') | first }}"
      - id: subnet_bindings
        type: JSON
        value: "{{ (outputs.read_subnets_before.subnets ?? []) | toJson | jq('[.[] | {id: (.id | tostring), vlanId: ((.vlanId // \"0\") | tostring)}]') | first }}"
    tasks:
      - id: probe_section_before
        type: io.kestra.plugin.phpipam.ipam.section.Get
        description: Reads the section itself. A credential, TLS or URL fault fails here and fails the run, so no run can mistake an unreachable phpIPAM for an empty one.
        baseUrl: "{{ inputs.base_url }}"
        appId: "{{ inputs.app_id }}"
        auth:
          appToken: "{{ inputs.app_token }}"
        insecureTls: "{{ inputs.insecure_tls }}"
        sectionId: "{{ item.value }}"
      - id: read_subnets_before
        type: io.kestra.plugin.phpipam.ipam.subnet.List
        description: Every subnet in this section, nested children included, with the vlanId each one is bound to.
        baseUrl: "{{ inputs.base_url }}"
        appId: "{{ inputs.app_id }}"
        auth:
          appToken: "{{ inputs.app_token }}"
        insecureTls: "{{ inputs.insecure_tls }}"
        sectionId: "{{ item.value }}"
        fetchType: FETCH
        allowFailure: true

  - id: refuse_incomplete_coverage
    type: io.kestra.plugin.core.execution.Fail
    description: >-
      Refuses when the binding read did not cover every section phpIPAM returned. It also refuses
      when a section came back without a name. Deleting a VLAN on a partial binding read is how a
      live trunk loses its subnets.
    condition: >-
      {{ (outputs.read_sections.sections | toJson | jq('[.[].id | tostring] | unique | join(",")') | first) != (outputs.read_bindings_before.outputs | toJson | jq('[.[].outputs.section_id | tostring] | unique | join(",")') | first) or ((outputs.read_bindings_before.outputs | toJson | jq('[.[].outputs | select((.section_name // "") == "")] | length') | first) > 0) }}
    errorMessage: >-
      Refusing to continue. The per-section binding read does not cover every section phpIPAM
      listed, so a VLAN that looks unbound may still carry a subnet in a section that was not
      read. Check the API token's read permission, then retry.

  - id: select_targets
    type: io.kestra.plugin.core.debug.Return
    description: >-
      Classifies every VLAN phpIPAM returned into exactly one status. BOUND wins over every
      other reason, then PROTECTED_ID, PROTECTED_NUMBER, NUMBER_UNREADABLE, OUT_OF_WINDOW,
      AGE_UNKNOWN then WITHIN_GRACE. Only what survives all of them is an ORPHAN. Each row
      carries the name, number plus description needed to recreate the VLAN if it is deleted.
    format: >-
      {{ {'v': (outputs.read_vlans_before.vlans | toJson), 'b': (outputs.read_bindings_before.outputs | toJson | jq('[.[].outputs.bound_vlan_ids[] | tostring] | unique') | first | toJson), 'pn': inputs.protected_vlan_numbers, 'pi': inputs.protected_vlan_ids, 'cut': (now(timeZone='UTC') | dateAdd(-1 * inputs.grace_days, 'DAYS') | date('yyyy-MM-dd HH:mm:ss', timeZone='UTC')), 'lo': inputs.target_number_min, 'hi': inputs.target_number_max} | toJson | jq('
      def trim: sub("^ +";"") | sub(" +$";"");
      ((.v | fromjson) // []) as $vl |
      ((.b | fromjson) // []) as $bound |
      [ ((.pn // "") | split(","))[] | trim | select(length > 0) ] as $pnum |
      [ ((.pi // "") | split(","))[] | trim | select(length > 0) ] as $pid |
      (.cut | tostring) as $cut | (.lo) as $lo | (.hi) as $hi |
      [ $vl[]
        | ((.vlanId // .id) | tostring) as $id
        | ((.number // "") | tostring) as $num
        | ((.editDate // "") | tostring) as $ed
        | (if $num == "" then -1 else ($num | tonumber) end) as $n
        | { vlanId: $id, name: ((.name // "") | tostring), number: $num, description: ((.description // "") | tostring), domainId: ((.domainId // "") | tostring), editDate: $ed,
            status: (if ($bound | index($id)) != null then "BOUND"
                     elif ($pid | index($id)) != null then "PROTECTED_ID"
                     elif ($pnum | index($num)) != null then "PROTECTED_NUMBER"
                     elif $n < 0 then "NUMBER_UNREADABLE"
                     elif ($n < $lo or $n > $hi) then "OUT_OF_WINDOW"
                     elif ($ed == "" or $ed == "null") then "AGE_UNKNOWN"
                     elif ($ed >= $cut) then "WITHIN_GRACE"
                     else "ORPHAN" end) } ]
      ') | first | toJson }}

  - id: log_cleanup_plan
    type: io.kestra.plugin.core.log.Log
    description: >-
      The report, plus the restore data. Task outputs are not in the execution payload, so the
      candidate rows go to the log where an operator can read them and, if a delete turns out
      wrong, recreate the VLAN from name, number plus description with ipam.vlan.Create.
    message: >-
      phpIPAM orphan VLAN cleanup plan.
      vlans_read={{ outputs.read_vlans_before.total }}
      sections_read={{ outputs.read_sections.total }}
      subnets_read={{ outputs.read_bindings_before.outputs | toJson | jq('[.[].outputs.subnets_read | select(. > 0)] | add // 0') | first }}
      empty_sections={{ outputs.read_bindings_before.outputs | toJson | jq('[.[].outputs | select(.subnets_read == -1) | .section_id] | join(",")') | first }}
      bound_vlan_ids={{ outputs.read_bindings_before.outputs | toJson | jq('[.[].outputs.bound_vlan_ids[] | tostring] | unique | join(",")') | first }}
      window={{ inputs.target_number_min }}-{{ inputs.target_number_max }} grace_days={{ inputs.grace_days }}
      orphans={{ outputs.select_targets.value | jq('[.[] | select(.status == "ORPHAN")] | length') | first }}
      bound={{ outputs.select_targets.value | jq('[.[] | select(.status == "BOUND")] | length') | first }}
      protected={{ outputs.select_targets.value | jq('[.[] | select(.status == "PROTECTED_ID" or .status == "PROTECTED_NUMBER")] | length') | first }}
      out_of_window={{ outputs.select_targets.value | jq('[.[] | select(.status == "OUT_OF_WINDOW" or .status == "NUMBER_UNREADABLE")] | length') | first }}
      within_grace={{ outputs.select_targets.value | jq('[.[] | select(.status == "WITHIN_GRACE")] | length') | first }}
      age_unknown={{ outputs.select_targets.value | jq('[.[] | select(.status == "AGE_UNKNOWN")] | length') | first }}
      restore_data={{ outputs.select_targets.value | jq('[.[] | select(.status == "ORPHAN") | {vlanId, name, number, description, domainId, editDate}]') | first }}
      spared={{ outputs.select_targets.value | jq('[.[] | select(.status != "ORPHAN") | {vlanId, number, name, status}]') | first }}

  - id: refuse_over_ceiling
    type: io.kestra.plugin.core.execution.Fail
    description: Refuses once more VLANs look orphaned than the per-run ceiling allows. The report above is already written, so an operator sees exactly what tripped it.
    condition: >-
      {{ (outputs.select_targets.value | jq('[.[] | select(.status == "ORPHAN")] | length') | first) > inputs.max_deletes_per_run }}
    errorMessage: >-
      Refusing to delete. The number of orphan VLAN candidates is above
      inputs.max_deletes_per_run. Read log_cleanup_plan, confirm the candidates really are
      abandoned, then raise the ceiling deliberately.

  - id: remediation_gate
    type: io.kestra.plugin.core.flow.If
    description: The only path that writes. It needs auto_remediate true, dry_run false plus at least one ORPHAN candidate, which is why the shipped defaults report then stop.
    condition: >-
      {{ inputs.auto_remediate and (inputs.dry_run == false) and ((outputs.select_targets.value | jq('[.[] | select(.status == "ORPHAN")] | length') | first) > 0) }}
    then:
      - id: confirm_cleanup
        type: io.kestra.plugin.core.flow.Pause
        description: Holds the run until an operator answers. A VLAN delete is not reversible through the API and phpIPAM unlinks any subnet still bound to it, so a human reads the candidate list first.
        onResume:
          - id: approved
            type: BOOL
            displayName: Delete these orphan VLANs
            description: Set true to delete the VLANs listed in the report. Resuming without setting it leaves phpIPAM untouched.
            defaults: false

      - id: approved_gate
        type: io.kestra.plugin.core.flow.If
        description: A resume that does not answer true leaves phpIPAM alone, so an accidental resume cannot approve a delete.
        condition: "{{ outputs.confirm_cleanup.onResume.approved ?? false }}"
        then:
          - id: reread_sections
            type: io.kestra.plugin.phpipam.ipam.section.List
            description: The approval is a snapshot of whatever was true when the Pause opened. Eligibility is read again here, after the answer, before any delete.
            baseUrl: "{{ inputs.base_url }}"
            appId: "{{ inputs.app_id }}"
            auth:
              appToken: "{{ inputs.app_token }}"
            insecureTls: "{{ inputs.insecure_tls }}"
            fetchType: FETCH

          - id: reread_vlans
            type: io.kestra.plugin.phpipam.ipam.vlan.List
            baseUrl: "{{ inputs.base_url }}"
            appId: "{{ inputs.app_id }}"
            auth:
              appToken: "{{ inputs.app_token }}"
            insecureTls: "{{ inputs.insecure_tls }}"
            fetchType: FETCH

          - id: reread_bindings
            type: io.kestra.plugin.core.flow.Loop
            description: A fresh binding read over every section. A subnet bound to a candidate while the Pause was open shows up here and takes that candidate out of the plan.
            concurrencyLimit: 1
            fetchType: FETCH
            values: "{{ outputs.reread_sections.sections | toJson | jq('[.[].id | tostring]') | first }}"
            outputs:
              - id: section_id
                type: STRING
                value: "{{ item.value }}"
              - id: section_name
                type: STRING
                value: "{{ outputs.probe_section_fresh.section.name }}"
              - id: subnets_read
                type: INT
                value: "{{ outputs.read_subnets_fresh.total ?? -1 }}"
              - id: bound_vlan_ids
                type: JSON
                value: "{{ (outputs.read_subnets_fresh.subnets ?? []) | toJson | jq('[.[] | select((.vlanId // \"0\") != \"0\") | (.vlanId | tostring)] | unique') | first }}"
            tasks:
              - id: probe_section_fresh
                type: io.kestra.plugin.phpipam.ipam.section.Get
                baseUrl: "{{ inputs.base_url }}"
                appId: "{{ inputs.app_id }}"
                auth:
                  appToken: "{{ inputs.app_token }}"
                insecureTls: "{{ inputs.insecure_tls }}"
                sectionId: "{{ item.value }}"
              - id: read_subnets_fresh
                type: io.kestra.plugin.phpipam.ipam.subnet.List
                baseUrl: "{{ inputs.base_url }}"
                appId: "{{ inputs.app_id }}"
                auth:
                  appToken: "{{ inputs.app_token }}"
                insecureTls: "{{ inputs.insecure_tls }}"
                sectionId: "{{ item.value }}"
                fetchType: FETCH
                allowFailure: true

          - id: recheck_targets
            type: io.kestra.plugin.core.debug.Return
            description: Re-runs the same classification against the fresh reads, so the comparison below is plan against present state rather than plan against itself.
            format: >-
              {{ {'v': (outputs.reread_vlans.vlans | toJson), 'b': (outputs.reread_bindings.outputs | toJson | jq('[.[].outputs.bound_vlan_ids[] | tostring] | unique') | first | toJson), 'pn': inputs.protected_vlan_numbers, 'pi': inputs.protected_vlan_ids, 'cut': (now(timeZone='UTC') | dateAdd(-1 * inputs.grace_days, 'DAYS') | date('yyyy-MM-dd HH:mm:ss', timeZone='UTC')), 'lo': inputs.target_number_min, 'hi': inputs.target_number_max} | toJson | jq('
              def trim: sub("^ +";"") | sub(" +$";"");
              ((.v | fromjson) // []) as $vl |
              ((.b | fromjson) // []) as $bound |
              [ ((.pn // "") | split(","))[] | trim | select(length > 0) ] as $pnum |
              [ ((.pi // "") | split(","))[] | trim | select(length > 0) ] as $pid |
              (.cut | tostring) as $cut | (.lo) as $lo | (.hi) as $hi |
              [ $vl[]
                | ((.vlanId // .id) | tostring) as $id
                | ((.number // "") | tostring) as $num
                | ((.editDate // "") | tostring) as $ed
                | (if $num == "" then -1 else ($num | tonumber) end) as $n
                | { vlanId: $id, name: ((.name // "") | tostring), number: $num, description: ((.description // "") | tostring), domainId: ((.domainId // "") | tostring), editDate: $ed,
                    status: (if ($bound | index($id)) != null then "BOUND"
                             elif ($pid | index($id)) != null then "PROTECTED_ID"
                             elif ($pnum | index($num)) != null then "PROTECTED_NUMBER"
                             elif $n < 0 then "NUMBER_UNREADABLE"
                             elif ($n < $lo or $n > $hi) then "OUT_OF_WINDOW"
                             elif ($ed == "" or $ed == "null") then "AGE_UNKNOWN"
                             elif ($ed >= $cut) then "WITHIN_GRACE"
                             else "ORPHAN" end) } ]
              ') | first | toJson }}

          - id: compare_plan_to_present
            type: io.kestra.plugin.core.debug.Return
            description: >-
              Matches the approved plan against the fresh ORPHAN set on vlanId plus name plus
              number. Anything that moved is listed with the status it holds now, which is what
              the refusal below reports.
            format: >-
              {{ {'p': outputs.select_targets.value, 'f': outputs.recheck_targets.value} | toJson | jq('
              ((.p | fromjson) // []) as $plan | ((.f | fromjson) // []) as $fresh |
              [ $plan[] | select(.status == "ORPHAN") ] as $approved |
              [ $approved[] | .vlanId as $id | (($fresh | map(select(.vlanId == $id)) | first) // null) as $now |
                { vlanId: $id, name: .name, number: .number,
                  now_status: (if $now == null then "GONE" else $now.status end),
                  now_name: (if $now == null then "" else $now.name end),
                  now_number: (if $now == null then "" else $now.number end),
                  stale: (if $now == null then true elif $now.status != "ORPHAN" then true elif $now.name != .name then true elif $now.number != .number then true else false end) } ]
              ') | first | toJson }}

          - id: log_fresh_plan
            type: io.kestra.plugin.core.log.Log
            description: The post-approval picture, so the decision the deletes act on is in the log next to the one the operator saw.
            message: >-
              phpIPAM orphan VLAN cleanup re-check after approval.
              approved={{ outputs.compare_plan_to_present.value | jq('length') | first }}
              stale={{ outputs.compare_plan_to_present.value | jq('[.[] | select(.stale)] | length') | first }}
              fresh_orphans={{ outputs.recheck_targets.value | jq('[.[] | select(.status == "ORPHAN") | .vlanId] | join(",")') | first }}
              details={{ outputs.compare_plan_to_present.value }}

          - id: refuse_stale_plan
            type: io.kestra.plugin.core.execution.Fail
            description: >-
              Refuses the whole batch when an approved VLAN stopped being an orphan, took a
              different name or number or vanished. A subnet bound during the approval lands here.
              The answer is to stop plus re-run rather than act on the old list.
            condition: >-
              {{ (outputs.compare_plan_to_present.value | jq('[.[] | select(.stale)] | length') | first) > 0 }}
            errorMessage: >-
              Refusing to delete. At least one approved VLAN changed between the approval plus
              the write: it is bound, protected, renamed, renumbered or already gone. Read
              log_fresh_plan, then run the flow again so the approval covers current state.

          - id: delete_orphans
            type: io.kestra.plugin.core.flow.Loop
            description: >-
              One phpIPAM delete per orphan VLAN, serialised so two iterations cannot race on the
              VLAN table. Each iteration re-reads the VLAN by its own id first and refuses on any
              identity drift, so a recycled id cannot be deleted in place of the approved one.
            concurrencyLimit: 1
            values: >-
              {{ outputs.compare_plan_to_present.value | jq('[.[] | {vlanId, name, number} | tojson]') | first }}
            tasks:
              - id: confirm_target_identity
                type: io.kestra.plugin.phpipam.ipam.vlan.Get
                description: Reads this one VLAN by id immediately before the delete. phpIPAM answers 404 Vlan not found if it went away, which fails this iteration instead of deleting whatever now holds the id.
                baseUrl: "{{ inputs.base_url }}"
                appId: "{{ inputs.app_id }}"
                auth:
                  appToken: "{{ inputs.app_token }}"
                insecureTls: "{{ inputs.insecure_tls }}"
                vlanId: "{{ item.value | jq('.vlanId') | first }}"

              - id: refuse_identity_drift
                type: io.kestra.plugin.core.execution.Fail
                description: Stops this iteration when the id no longer carries the approved name plus number.
                condition: >-
                  {{ (outputs.confirm_target_identity.vlan.name ?? '') != (item.value | jq('.name') | first) or ((outputs.confirm_target_identity.vlan.number ?? '') | string) != ((item.value | jq('.number') | first) | string) }}
                errorMessage: >-
                  Refusing to delete this VLAN. The id no longer carries the name plus number
                  that were approved, so phpIPAM is holding something else under that id.

              - id: delete_vlan
                type: io.kestra.plugin.phpipam.ipam.vlan.Delete
                description: The write. phpIPAM deletes the VLAN and unlinks any subnet still pointing at it, which is why the fresh binding read above has to come back empty for this id first.
                baseUrl: "{{ inputs.base_url }}"
                appId: "{{ inputs.app_id }}"
                auth:
                  appToken: "{{ inputs.app_token }}"
                insecureTls: "{{ inputs.insecure_tls }}"
                vlanId: "{{ item.value | jq('.vlanId') | first }}"

          - id: record_write_attempt
            type: io.kestra.plugin.core.debug.Return
            description: Marks that the approved delete path ran. The verification below only fails the run for leftovers when this exists, so a report-only run is never failed for candidates it deliberately left alone.
            format: applied

  - id: read_vlans_after
    type: io.kestra.plugin.phpipam.ipam.vlan.List
    description: Reads the VLAN table again from phpIPAM. It runs on every path, so a report-only or declined run produces a before plus after pair that has to be identical.
    baseUrl: "{{ inputs.base_url }}"
    appId: "{{ inputs.app_id }}"
    auth:
      appToken: "{{ inputs.app_token }}"
    insecureTls: "{{ inputs.insecure_tls }}"
    fetchType: FETCH

  - id: read_sections_after
    type: io.kestra.plugin.phpipam.ipam.section.List
    baseUrl: "{{ inputs.base_url }}"
    appId: "{{ inputs.app_id }}"
    auth:
      appToken: "{{ inputs.app_token }}"
    insecureTls: "{{ inputs.insecure_tls }}"
    fetchType: FETCH

  - id: read_bindings_after
    type: io.kestra.plugin.core.flow.Loop
    description: The subnets again, section by section. This is what proves no live subnet lost its VLAN binding while the orphans were removed.
    concurrencyLimit: 1
    fetchType: FETCH
    values: "{{ outputs.read_sections_after.sections | toJson | jq('[.[].id | tostring]') | first }}"
    outputs:
      - id: section_id
        type: STRING
        value: "{{ item.value }}"
      - id: subnets_read
        type: INT
        value: "{{ outputs.read_subnets_after.total ?? -1 }}"
      - id: subnet_bindings
        type: JSON
        value: "{{ (outputs.read_subnets_after.subnets ?? []) | toJson | jq('[.[] | {id: (.id | tostring), vlanId: ((.vlanId // \"0\") | tostring)}]') | first }}"
    tasks:
      - id: probe_section_after
        type: io.kestra.plugin.phpipam.ipam.section.Get
        baseUrl: "{{ inputs.base_url }}"
        appId: "{{ inputs.app_id }}"
        auth:
          appToken: "{{ inputs.app_token }}"
        insecureTls: "{{ inputs.insecure_tls }}"
        sectionId: "{{ item.value }}"
      - id: read_subnets_after
        type: io.kestra.plugin.phpipam.ipam.subnet.List
        baseUrl: "{{ inputs.base_url }}"
        appId: "{{ inputs.app_id }}"
        auth:
          appToken: "{{ inputs.app_token }}"
        insecureTls: "{{ inputs.insecure_tls }}"
        sectionId: "{{ item.value }}"
        fetchType: FETCH
        allowFailure: true

  - id: verify_vlan_table
    type: io.kestra.plugin.core.debug.Return
    description: >-
      Compares the VLAN table before against after. It reports which planned VLANs are gone, which
      are still there plus anything that disappeared without being planned, which is the collateral
      check the failure below acts on.
    format: >-
      {{ {'p': outputs.select_targets.value, 'vb': (outputs.read_vlans_before.vlans | toJson), 'va': (outputs.read_vlans_after.vlans | toJson)} | toJson | jq('
      ((.p | fromjson) // []) as $plan | ((.vb | fromjson) // []) as $vb | ((.va | fromjson) // []) as $va |
      [ $plan[] | select(.status == "ORPHAN") | .vlanId ] as $t |
      [ $vb[] | (.vlanId | tostring) ] as $bi |
      [ $va[] | (.vlanId | tostring) ] as $ai |
      { targets: $t,
        targets_removed: [ $t[] | . as $x | select(($ai | index($x)) == null) ],
        targets_remaining: [ $t[] | . as $x | select(($ai | index($x)) != null) ],
        collateral_removed: [ $bi[] | . as $x | select(($ai | index($x)) == null) | select(($t | index($x)) == null) ],
        vlans_before: ($bi | length), vlans_after: ($ai | length) }
      ') | first | toJson }}

  - id: verify_subnets_conserved
    type: io.kestra.plugin.core.debug.Return
    description: >-
      The conserved data check. phpIPAM unlinks subnets from a VLAN it deletes, so every subnet
      read before has to still exist afterwards and still point at the same VLAN. A single
      rebound or missing subnet is a failure, not a rounding error.
    format: >-
      {{ {'sb': (outputs.read_bindings_before.outputs | toJson | jq('[.[].outputs.subnet_bindings[]]') | first | toJson), 'sa': (outputs.read_bindings_after.outputs | toJson | jq('[.[].outputs.subnet_bindings[]]') | first | toJson)} | toJson | jq('
      ((.sb | fromjson) // []) as $sb | ((.sa | fromjson) // []) as $sa |
      [ $sa[] | .id ] as $sa_ids |
      { subnets_before: ($sb | length), subnets_after: ($sa | length),
        lost_subnets: [ $sb[] | .id | . as $x | select(($sa_ids | index($x)) == null) ],
        rebound_subnets: [ $sb[] | . as $old | (($sa | map(select(.id == $old.id)) | first) // null) as $new | select($new != null) | select($new.vlanId != $old.vlanId) | {id: $old.id, from: $old.vlanId, to: $new.vlanId} ] }
      ') | first | toJson }}

  - id: measure_number_ambiguity
    type: io.kestra.plugin.core.debug.Return
    description: >-
      The operational payoff, measured rather than asserted: VLAN numbers inside the declared
      window that more than one phpIPAM VLAN record claims. phpIPAM accepts duplicate numbers
      happily, so every abandoned VLAN leaves a number that a planner cannot resolve.
    format: >-
      {{ {'vb': (outputs.read_vlans_before.vlans | toJson), 'va': (outputs.read_vlans_after.vlans | toJson), 'lo': inputs.target_number_min, 'hi': inputs.target_number_max} | toJson | jq('
      ((.vb | fromjson) // []) as $vb | ((.va | fromjson) // []) as $va | (.lo) as $lo | (.hi) as $hi |
      ([ $vb[] | ((.number // "") | tostring) | select(. != "") | select((. | tonumber) >= $lo and (. | tonumber) <= $hi) ] | group_by(.) | [ .[] | select(length > 1) | .[0] ]) as $ab |
      ([ $va[] | ((.number // "") | tostring) | select(. != "") | select((. | tonumber) >= $lo and (. | tonumber) <= $hi) ] | group_by(.) | [ .[] | select(length > 1) | .[0] ]) as $aa |
      ([ $vb[] | ((.number // "") | tostring) | select(. != "") | select((. | tonumber) >= $lo and (. | tonumber) <= $hi) ] | unique | length) as $ub |
      ([ $va[] | ((.number // "") | tostring) | select(. != "") | select((. | tonumber) >= $lo and (. | tonumber) <= $hi) ] | unique | length) as $ua |
      { ambiguous_numbers_before: $ab, ambiguous_numbers_after: $aa,
        occupied_numbers_before: $ub, occupied_numbers_after: $ua }
      ') | first | toJson }}

  - id: log_verification
    type: io.kestra.plugin.core.log.Log
    description: The after picture, read back from phpIPAM rather than assumed from the delete tasks going green, with the VLAN number ambiguity the cleanup was supposed to clear.
    message: >-
      phpIPAM orphan VLAN cleanup verification.
      write_attempted={{ outputs.record_write_attempt is defined ? 'yes' : 'no' }}
      targets={{ outputs.verify_vlan_table.value | jq('.targets | join(",")') | first }}
      removed={{ outputs.verify_vlan_table.value | jq('.targets_removed | join(",")') | first }}
      remaining={{ outputs.verify_vlan_table.value | jq('.targets_remaining | join(",")') | first }}
      collateral_removed={{ outputs.verify_vlan_table.value | jq('.collateral_removed | join(",")') | first }}
      vlans={{ outputs.verify_vlan_table.value | jq('.vlans_before') | first }}->{{ outputs.verify_vlan_table.value | jq('.vlans_after') | first }}
      subnets={{ outputs.verify_subnets_conserved.value | jq('.subnets_before') | first }}->{{ outputs.verify_subnets_conserved.value | jq('.subnets_after') | first }}
      rebound_subnets={{ outputs.verify_subnets_conserved.value | jq('.rebound_subnets') | first }}
      lost_subnets={{ outputs.verify_subnets_conserved.value | jq('.lost_subnets | join(",")') | first }}
      ambiguous_numbers={{ outputs.measure_number_ambiguity.value | jq('.ambiguous_numbers_before | join(",")') | first }}->{{ outputs.measure_number_ambiguity.value | jq('.ambiguous_numbers_after | join(",")') | first }}
      occupied_numbers_in_window={{ outputs.measure_number_ambiguity.value | jq('.occupied_numbers_before') | first }}->{{ outputs.measure_number_ambiguity.value | jq('.occupied_numbers_after') | first }}

  - id: fail_if_cleanup_incomplete
    type: io.kestra.plugin.core.execution.Fail
    description: >-
      Fails the run when a delete was approved yet a target is still there, when something that
      was not a target disappeared or when any subnet lost or changed its VLAN binding. phpIPAM
      answers 200 to a delete it did not apply, so this second read is the only thing that can
      tell the two apart.
    condition: >-
      {{ (outputs.record_write_attempt is defined) and ((outputs.verify_vlan_table.value | jq('.targets_remaining | length') | first) > 0 or (outputs.verify_vlan_table.value | jq('.collateral_removed | length') | first) > 0 or (outputs.verify_subnets_conserved.value | jq('.rebound_subnets | length') | first) > 0 or (outputs.verify_subnets_conserved.value | jq('.lost_subnets | length') | first) > 0) }}
    errorMessage: >-
      The cleanup did not land cleanly. Either an approved VLAN is still present, a VLAN that was
      not a target is gone or a subnet lost or changed its VLAN binding. Read log_verification,
      then check the API token's write permission plus the restore data in log_cleanup_plan.

  - id: fail_if_untouched_run_changed_phpipam
    type: io.kestra.plugin.core.execution.Fail
    description: >-
      Fails a report-only or declined run that nevertheless sees VLANs or subnets change between
      its two reads. Nothing in this flow wrote, so that is either someone else working in phpIPAM
      or a read that cannot be trusted. Either way the report is not evidence.
    condition: >-
      {{ (outputs.record_write_attempt is not defined) and ((outputs.verify_vlan_table.value | jq('.vlans_before') | first) != (outputs.verify_vlan_table.value | jq('.vlans_after') | first) or (outputs.verify_subnets_conserved.value | jq('.subnets_before') | first) != (outputs.verify_subnets_conserved.value | jq('.subnets_after') | first) or (outputs.verify_subnets_conserved.value | jq('.rebound_subnets | length') | first) > 0) }}
    errorMessage: >-
      This run did not write to phpIPAM, yet the VLAN or subnet set changed between its two
      reads. Someone or something else is changing phpIPAM right now. Read log_verification and
      re-run the report before acting on it.

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: >-
      Posts the failure to Slack. The refusals above arrive here too, because a refused cleanup
      is something an operator has to see.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: >-
      {{ {"text": "phpIPAM orphan VLAN cleanup guard failed. Execution " ~ execution.id ~ ". Read log_cleanup_plan plus log_verification before retrying; the candidate rows in log_cleanup_plan carry the data to recreate a VLAN."} | toJson }}

triggers:
  - id: weekly_orphan_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Disabled on purpose. Set the number window plus the protected numbers for your estate first, then enable it. Its inputs pin the run to report only.
    disabled: true
    cron: "0 6 * * 1"
    inputs:
      dry_run: true
      auto_remediate: false

extend:
  title: Delete orphan phpIPAM VLANs that no subnet uses
  shortDescription: Find phpIPAM VLANs with no subnet bound, past a grace window and inside a declared number range, delete them behind an approval gate then re-read phpIPAM.
  metaTitle: phpIPAM orphan VLAN cleanup guard with Kestra
  metaDescription: Detect phpIPAM VLANs no subnet is bound to, delete them behind an approval gate then re-read phpIPAM to prove no live subnet was unlinked.
  tags:
    - Infrastructure
  subTags:
    - Infrastructure Automation
    - Day 2 Operations
    - Approval Gates
  ee: false
  demo: false
  description: |
    ## Safety

    A phpIPAM VLAN delete is not a refusal you can rely on. `Vlans::DELETE` in phpIPAM 1.7.3 runs
    `remove_object_references("subnets", "vlanId", id)` right after the row is removed, so deleting
    a VLAN that is still in use succeeds and silently sets `vlanId` to 0 on every subnet bound to
    it. The IPAM record of which L2 a live range sits on is gone, nothing warns you plus the API
    returns 200. phpIPAM also accepts duplicate VLAN numbers, so the wrong VLAN is easy to pick.
    That is why this flow refuses by default and why each guard is load bearing:

    | Guard | What it stops |
    | --- | --- |
    | Binding read unioned over every section from `section.List` | Calling a VLAN unbound because only one section was looked at |
    | `section.Get` beside every `subnet.List` in the same iteration | Reading an unreachable or unauthorised phpIPAM as an empty one |
    | `refuse_incomplete_coverage` | Acting on a per-section read that silently skipped a section |
    | Declared number window `target_number_min` to `target_number_max` | Reaching a VLAN outside the pool your team hands out |
    | `protected_vlan_numbers` plus `protected_vlan_ids` | Deleting a reserved management or infrastructure VLAN that looks idle |
    | `grace_days` against phpIPAM `editDate` | Deleting a VLAN created for next week's change |
    | `AGE_UNKNOWN` for a VLAN with no `editDate` | Treating an unknown age as an abandoned VLAN |
    | `max_deletes_per_run` | Emptying the VLAN table when the detector is wrong |
    | `auto_remediate` false plus `dry_run` true plus `Pause` approval | Any unattended delete |
    | Fresh eligibility read after the approval plus `refuse_stale_plan` | Deleting a VLAN that someone bound while the approval sat open |
    | `vlan.Get` plus `refuse_identity_drift` in front of each delete | Deleting whatever now holds a recycled id |
    | `verify_subnets_conserved` | Finishing green after a subnet lost or changed its VLAN binding |

    ## How it works

    1. `read_sections` (`io.kestra.plugin.phpipam.ipam.section.List`) plus `read_vlans_before`
       (`io.kestra.plugin.phpipam.ipam.vlan.List`) read the two tables the decision needs. The VLAN
       list carries `vlanId`, `name`, `number` plus `editDate`.
    2. `read_bindings_before` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) walks every
       section id. In each iteration `probe_section_before`
       (`io.kestra.plugin.phpipam.ipam.section.Get`) proves the base URL, token, TLS plus the section
       id are good, then `read_subnets_before` (`io.kestra.plugin.phpipam.ipam.subnet.List`) reads
       every subnet in that section, nested children included. The loop declares `fetchType: FETCH`
       plus an `outputs:` list, which is how the per-section results are aggregated back into one
       binding set. phpIPAM answers `404 No subnets found` for a section that holds none, so that
       read is allowed to fail and counts as zero subnets only because the section read beside it
       succeeded.
    3. `refuse_incomplete_coverage` (`io.kestra.plugin.core.execution.Fail`) stops the run when the
       aggregated section ids do not match the section list or when a section came back nameless.
    4. `select_targets` (`io.kestra.plugin.core.debug.Return`) classifies every VLAN into exactly one
       status: `BOUND`, `PROTECTED_ID`, `PROTECTED_NUMBER`, `NUMBER_UNREADABLE`, `OUT_OF_WINDOW`,
       `AGE_UNKNOWN`, `WITHIN_GRACE` or `ORPHAN`. `BOUND` wins over every other reason, so a bound
       VLAN is never a candidate however old it looks.
    5. `log_cleanup_plan` (`io.kestra.plugin.core.log.Log`) prints the counts, the spared VLANs with
       the reason each was spared plus `restore_data`: the id, name, number, description, domainId
       plus editDate of every candidate, which is what `ipam.vlan.Create` needs to put one back.
    6. `refuse_over_ceiling` fails the run when the candidate count is above `max_deletes_per_run`.
    7. `remediation_gate` (`io.kestra.plugin.core.flow.If`) requires `auto_remediate` true,
       `dry_run` false plus at least one candidate. `confirm_cleanup`
       (`io.kestra.plugin.core.flow.Pause`) then waits for a human. `approved_gate` reads
       `onResume.approved ?? false`, so a resume that answers nothing is a refusal.
    8. After the approval, `reread_sections`, `reread_vlans` plus `reread_bindings` read phpIPAM
       again, `recheck_targets` re-runs the same classification against those fresh reads plus
       `compare_plan_to_present` matches the approved rows against the fresh `ORPHAN` set on id,
       name plus number. `refuse_stale_plan` fails the whole batch when any approved VLAN is now
       bound, protected, renamed, renumbered or gone.
    9. `delete_orphans` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) deletes one VLAN
       at a time. Each iteration re-reads that id with `confirm_target_identity`
       (`io.kestra.plugin.phpipam.ipam.vlan.Get`), `refuse_identity_drift` stops it on any name or
       number mismatch, then `delete_vlan` (`io.kestra.plugin.phpipam.ipam.vlan.Delete`) writes.
    10. `read_vlans_after`, `read_sections_after` plus `read_bindings_after` run on every path, so
        even a report-only run produces a before plus after pair. `verify_vlan_table`,
        `verify_subnets_conserved` plus `measure_number_ambiguity` turn those reads into numbers,
        `log_verification` prints them plus `fail_if_cleanup_incomplete` fails the run when a target
        survived, something unplanned disappeared or any subnet lost or changed its binding.
        `fail_if_untouched_run_changed_phpipam` fails a report-only or declined run whose two reads
        disagree, because then the report is not evidence.

    The outputs worth reading afterwards: `{{ outputs.select_targets.value }}` is the full
    classification with one status per VLAN, `{{ outputs.compare_plan_to_present.value }}` is the
    post-approval comparison, `{{ outputs.verify_vlan_table.value }}` holds `targets_removed`,
    `targets_remaining` plus `collateral_removed`, `{{ outputs.verify_subnets_conserved.value }}`
    holds `rebound_subnets` plus `lost_subnets` and
    `{{ outputs.measure_number_ambiguity.value }}` holds the VLAN numbers more than one record
    claimed before plus after the run.

    ## What you get

    - The VLAN number pool back. Numbers still claimed by a decommissioned project read as taken,
      and when an orphan shares a number with a live trunk a planner cannot tell which record is
      the real one.
    - A delete that is justified in writing: zero bound subnets across every section, an age past
      the grace window plus a number inside the declared range, with the spared VLANs listed next
      to the reason each was spared.
    - Restore data in the log before the write, so a wrong delete can be undone with
      `ipam.vlan.Create`.
    - A run that fails rather than reporting success when phpIPAM quietly unlinked a live subnet.

    ## Who it's for

    Network and platform teams whose phpIPAM is the source of truth for VLAN numbering, where
    project teardowns leave VLAN records behind plus the next change has to guess which numbers are
    really free.

    ## Why orchestrate this with Kestra

    The manual version is a VLAN list sorted by name, a few `/vlans/<id>/subnets/` checks in a
    browser tab plus a delete button that does not warn you about the subnets it is about to
    unlink. As a flow the read is complete across sections, the decision is written down with a
    reason per VLAN, the credentials stay in secrets, the approval is recorded against the
    execution, the write is serialised at `concurrencyLimit: 1` under a flow level
    `concurrency: limit 1` and the second read makes a silent unlink impossible to miss. The Pause
    task is what makes an irreversible delete safe to automate: detection, report, approval plus
    verification are one audited unit with a human in the middle.

    ## Tested end to end

    Kestra 2.0.5, plugin-phpipam 1.0.8, phpIPAM 1.7.3 (`phpipam/phpipam-www:v1.7.3`) with
    MariaDB 11.4.4 behind an nginx 1.27.0 TLS terminator, App token authentication. Every number
    below was read from phpIPAM's own API, not from a task output: `GET /vlans/`,
    `GET /sections/<id>/subnets/` plus `GET /vlans/search/<number>/`.

    The fixture holds 11 VLANs across 5 sections, including a bound live trunk that shares number
    320 with an abandoned VLAN, a VLAN bound only from a second section, a VLAN bound only by a
    nested child subnet, a reserved number 42, a VLAN created two days ago, a VLAN with no
    `editDate` at all, a section with no subnets plus the stock phpIPAM VLANs.

    | Case | Execution | Result |
    | --- | --- | --- |
    | Healthy estate, report only | 5rVHR41NxN0Hu6wwU8vfJj | 9 VLANs read, 0 candidates, 9 VLANs plus 10 subnets untouched |
    | Two orphans, report only | 1jEEkF0Qa0EvCkuCH9Bku7 | 2 `ORPHAN`, spared 4 `BOUND`, 1 `PROTECTED_NUMBER`, 1 `OUT_OF_WINDOW`, 2 `WITHIN_GRACE`, 1 `AGE_UNKNOWN`, no write |
    | Number window boundary, max 319 | 1HHpBlCuYgBtUKI7XuS41o | VLAN 320 moves to `OUT_OF_WINDOW`, 1 candidate left |
    | Grace boundary, 421 days | 6OwZCRUGizSrQ98KNpRHYb | the 420 day VLAN moves to `WITHIN_GRACE`, 1 candidate left |
    | Protected ids cover both candidates | 1MRlTDN0JzAM4QMt8u7wz | 0 candidates, 3 protected, no write |
    | Ceiling of 1 with 2 candidates | 2y7pyxvWVwiQUZA0suCkZN | FAILED at `refuse_over_ceiling`, 11 VLANs intact |
    | Wrong API token | 6qM0d7dVtTs7OaUbdifWRX | FAILED on the first read with HTTP 401, nothing read as empty |
    | Approval declined | 174oHmiVed7Okw6wumMIjQ | `write_attempted=no`, both candidates still present |
    | Subnet bound during the approval | 4HVGnAI9kbwZAw993bsQf6 | FAILED at `refuse_stale_plan`, candidate now `BOUND`, no delete, subnets 10 to 11 from the fixture change only |
    | Read only token, write refused | 6U91HEzbdkeyjIyO5qQacw | FAILED, phpIPAM answered `HTTP 401 invalid permissions`, 11 VLANs intact |
    | Approved cleanup | 7GRXeW5V56TEnVxxmptP5U | VLANs 11 to 9, subnets 10 to 10 with identical bindings, number 320 ambiguity cleared, `GET /vlans/search/320/` 2 rows to 1 (the live trunk id 5), `search/311/` 1 row to 0 |
    | Second identical run | 6pQdGyElMk7sI7FiOV8ajf | 0 candidates, Pause never opened, no write |
    | Killed between the two deletes | 1Tjy9SIKt61O7UHz8pFaCf | KILLED after the first delete, phpIPAM at 10 VLANs with one candidate still there |
    | Next run after the kill | 7RsdaPhnVntfMWz344aSAM | the queued iteration had settled the batch, 0 candidates, no duplicate delete |
    | Partial pass, window 300 to 315 | 6s09eygzyRaGESQ5D71SGG | deletes only the in-window orphan, VLANs 11 to 10, the other candidate untouched |
    | Reconcile after the partial pass | 2ub873QTdSveoPu6Jd4pUN | deletes exactly the residual orphan, VLANs 10 to 9, completed work left alone |

    Both defensive refusals were exercised against the real instance rather than left unproven: a
    probe flow whose section loop deliberately skipped one section tripped
    `refuse_incomplete_coverage` (execution CYJ8X9LVE7IHTpxZrMK41), plus a probe of the per-write
    identity check passed on a matching name (72AWpoNp4NQwAfqVCvYjaT) and failed on a mismatched one
    (79WO7aAoDlS51Jq8OjNY5i).

    ## Prerequisites

    - A reachable phpIPAM 1.7.x instance with the API enabled under Administration, API.
    - An API application whose permissions allow read for every section plus write for VLANs. The
      read only token case above shows what a read only application does: the run fails at the
      delete instead of reporting success.
    - Minimum permissions: `GET /sections/`, `GET /sections/<id>/`, `GET /sections/<id>/subnets/`,
      `GET /vlans/`, `GET /vlans/<id>/` plus `DELETE /vlans/<id>/`. Nothing else is called. Prefer
      App token authentication: phpIPAM applies per user section permissions to a session token, so
      a user who cannot see a section would hide the subnet that makes a VLAN ineligible.
    - A Slack incoming webhook for the failure alert.

    ### Secrets

    | Secret | Used for |
    | --- | --- |
    | `PHPIPAM_APP_TOKEN` | Default for the `app_token` input, sent as the phpIPAM `token` header |
    | `SLACK_WEBHOOK_URL` | Failure alert in the `errors` block |

    ### Inputs

    | Input | Type | Default | Purpose |
    | --- | --- | --- | --- |
    | `base_url` | STRING | `http://localhost` | phpIPAM root URL |
    | `app_id` | STRING | `myapp` | API application id in the `/api/{appId}/` path |
    | `app_token` | STRING | `{{ secret('PHPIPAM_APP_TOKEN') }}` | App token for that application |
    | `target_number_min` | INT | 300 | Lowest VLAN number the cleanup may touch |
    | `target_number_max` | INT | 399 | Highest VLAN number, inclusive |
    | `grace_days` | INT | 90 | A candidate's `editDate` must be older than this |
    | `protected_vlan_numbers` | STRING | empty | Comma separated numbers that are reported, never deleted |
    | `protected_vlan_ids` | STRING | empty | Comma separated phpIPAM VLAN ids that are never deleted |
    | `max_deletes_per_run` | INT | 5 | The run refuses above this many candidates |
    | `dry_run` | BOOL | true | Report only |
    | `auto_remediate` | BOOL | false | Must be true, with `dry_run` false, before a delete is offered |
    | `insecure_tls` | BOOL | false | Trust a self-signed certificate, internal use only |

    ## Quick start

    1. Create an API application in phpIPAM under Administration, API with an App code, then store
       that code as the `PHPIPAM_APP_TOKEN` secret plus store your Slack webhook as
       `SLACK_WEBHOOK_URL`.
    2. Run with `base_url`, `app_id` plus the shipped defaults. The run reports and writes nothing.
    3. Read `log_cleanup_plan`. Check the `spared` list first: every `BOUND`, `WITHIN_GRACE` plus
       `PROTECTED_NUMBER` entry is a VLAN the flow refused to touch, which is where a wrong window
       or grace value shows up.
    4. Set `target_number_min` plus `target_number_max` to the pool your team hands out, list your
       reserved numbers in `protected_vlan_numbers` plus run the report again.
    5. When the candidate list is right, run with `auto_remediate: true` plus `dry_run: false`,
       read the candidate rows in the Pause, then resume with `approved: true`. Keep the
       `restore_data` line from `log_cleanup_plan` until you are satisfied.
    6. Read `log_verification`. `removed` must list every target, `rebound_subnets` plus
       `lost_subnets` must be empty and `ambiguous_numbers` should shrink.
    7. Enable `weekly_orphan_sweep` only after the report has been right for a few weeks. Its
       inputs pin it to report only.

    ## How to extend

    - Swap the delete for `ipam.vlan.Update` to park a candidate under a renamed, clearly dated
      name on the first pass plus delete it on a second pass a month later, which gives the owning
      team a chance to notice.
    - Add `ipam.vrf.List` plus treat a VLAN referenced by a VRF route target as `BOUND` too, if
      your estate models VRFs in phpIPAM.
    - Read the protected numbers out of Git with `io.kestra.plugin.git.Clone` instead of an input,
      so the reserved ranges are reviewed the way code is.
    - Post the plan to the network team's channel on every run, not only on failure, by adding a
      `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` task beside `log_cleanup_plan`.
    - Run one L2 domain per execution by filtering `select_targets` on `domainId`, which the VLAN
      rows already carry.

    Limits: a VLAN is judged unbound by subnet bindings only. phpIPAM devices, circuits plus
    customer links are not read, so a VLAN referenced only by one of those still looks orphaned,
    which is why the number window plus the protected lists are the real safety boundary. The age
    test uses phpIPAM's `editDate`, which any edit refreshes, so a renamed abandoned VLAN looks
    young; a VLAN with no `editDate` is never a candidate. phpIPAM has no conditional delete or
    entity version, so after the fresh post-approval read each delete is preceded by a `vlan.Get`
    identity check and the run still fails if the conserved subnet check finds a binding moved. A
    subnet bound in the seconds between that fresh read and the delete would be unlinked. The flow
    reports that as a failure with the restore data rather than silently succeeding. phpIPAM
    accepts duplicate VLAN numbers, so the payoff measured here is number ambiguity cleared, not a
    create that phpIPAM would have rejected. The empty section handling rests on phpIPAM answering
    `404 No subnets found` only when a section really holds no subnets, which is why
    `section.Get` runs beside every subnet read and a credential fault fails the run.

