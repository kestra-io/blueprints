id: spegel-stateless-registry-p2p-mirror-latency-sentinel
namespace: company.sre

description: |
  Audits CNCF Spegel stateless P2P registry mirror metrics to detect peer layer download stalls, DHT routing table collapse, and image pull fallbacks.

concurrency:
  limit: 1

inputs:
  - id: spegel_metrics_url
    type: STRING
    displayName: "Spegel Metrics URL"
    defaults: "http://spegel.spegel.svc.cluster.local:9090"
    description: "Internal Kubernetes HTTP endpoint exposing Prometheus metrics from the Spegel stateless P2P registry mirror daemon."

  - id: cluster_name
    type: STRING
    displayName: "Kubernetes Cluster Identifier"
    defaults: "k8s-prod-us-central"
    description: "Identifier of the target Kubernetes cluster utilizing Spegel for peer-to-peer container image distribution."

  - id: max_mirror_request_duration_seconds
    type: INT
    displayName: "Max Mirror Request Duration Seconds"
    defaults: 5
    description: "Maximum allowable latency in seconds for peer container layer download requests before alerting on P2P network stalls."

  - id: max_resolve_errors_threshold
    type: INT
    displayName: "Max Resolve Errors Threshold"
    defaults: 10
    description: "Maximum allowable threshold for peer discovery and DHT resolution errors before flagging registry mirror degradation."

  - id: min_peer_routing_table_size
    type: INT
    displayName: "Min Peer Routing Table Size"
    defaults: 3
    description: "Minimum acceptable peer routing table size per node to ensure adequate cluster P2P mesh connectivity."

  - id: alert_on_routing_isolation
    type: BOOL
    displayName: "Alert on Routing Isolation"
    defaults: true
    description: "Toggle whether isolated nodes with zero peer connections immediately trigger high-priority platform alerts."

tasks:
  - id: scan_spegel_mirror_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Spegel Prometheus metrics to audit peer-to-peer OCI mirror download latencies, DHT resolve errors, and routing table density.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.spegel_metrics_url }}"
      CLUSTER_NAME: "{{ inputs.cluster_name }}"
      MAX_DURATION_S: "{{ inputs.max_mirror_request_duration_seconds }}"
      MAX_RESOLVE_ERRORS: "{{ inputs.max_resolve_errors_threshold }}"
      MIN_ROUTING_PEERS: "{{ inputs.min_peer_routing_table_size }}"
      ALERT_ISOLATION: "{{ inputs.alert_on_routing_isolation }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METRICS_URL", "").rstrip("/")
      cluster_name = os.environ.get("CLUSTER_NAME", "k8s-prod-us-central")
      max_duration_s = float(os.environ.get("MAX_DURATION_S", "5"))
      max_resolve_errors = float(os.environ.get("MAX_RESOLVE_ERRORS", "10"))
      min_routing_peers = int(os.environ.get("MIN_ROUTING_PEERS", "3"))
      alert_isolation = os.environ.get("ALERT_ISOLATION", "true").lower() == "true"

      max_observed_duration_s = 0.0
      worst_endpoint = "none"
      resolve_errors_count = 0.0
      routing_table_size = 0
      advertised_images_count = 0
      total_requests_sampled = 0
      stalled_requests_count = 0

      metrics_endpoint = f"{base_url}/metrics"
      try:
          resp = requests.get(metrics_endpoint, timeout=12)
          resp.raise_for_status()
          raw_lines = resp.text.splitlines()
      except Exception as err:
          print(f"Error: Unable to connect to Spegel metrics endpoint at {metrics_endpoint}: {err}", file=sys.stderr)
          sys.exit(1)

      for line in raw_lines:
          line = line.strip()
          if not line or line.startswith("#"):
              continue
          match = re.search(r'([0-9.eE+-]+)\s*$', line)
          if not match:
              continue
          val = float(match.group(1))

          if "spegel_mirror_request_duration_seconds" in line:
              total_requests_sampled += 1
              handler_match = re.search(r'handler="([^"]+)"', line)
              handler_name = handler_match.group(1) if handler_match else "mirror-handler"
              if val > max_observed_duration_s:
                  max_observed_duration_s, worst_endpoint = val, handler_name
              if val > max_duration_s:
                  stalled_requests_count += 1
          elif "spegel_resolve_errors_total" in line:
              resolve_errors_count += val
          elif "spegel_routing_table_size" in line or "spegel_peer_connections" in line:
              routing_table_size = int(val)
          elif "spegel_advertised_images" in line or "spegel_advertised_keys" in line:
              advertised_images_count = int(val)

      is_isolated = (routing_table_size < min_routing_peers)
      is_breached = bool((max_observed_duration_s > max_duration_s) or (resolve_errors_count > max_resolve_errors) or (alert_isolation and is_isolated))
      now_iso = datetime.now(timezone.utc).isoformat()
      print(f"Spegel Audit: cluster={cluster_name}, worst_handler={worst_endpoint}:{max_observed_duration_s:.2f}s, resolve_errors={resolve_errors_count}, routing_peers={routing_table_size}, advertised_images={advertised_images_count}, breached={is_breached}")

      Kestra.outputs({
          "peak_request_duration_seconds": round(max_observed_duration_s, 2),
          "worst_handler_endpoint": worst_endpoint,
          "resolve_errors_count": round(resolve_errors_count, 0),
          "routing_table_size": routing_table_size,
          "advertised_images_count": advertised_images_count,
          "total_requests_sampled": total_requests_sampled,
          "stalled_requests_count": stalled_requests_count,
          "is_alerting": is_breached,
          "audit_timestamp": now_iso
      })

  - id: evaluate_spegel_mirror_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether P2P mirror request latencies, DHT resolve errors, or peer routing table sizes breach cluster distribution SLAs.
    condition: "{{ outputs.scan_spegel_mirror_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_spegel_mirror_degraded
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency Slack notification when Spegel peer layer distribution stalls or peer isolation occurs.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#platform-infra-alerts",
            "text": "CRITICAL: Spegel P2P Registry Mirror Degradation on Cluster `{{ inputs.cluster_name }}`. Worst Handler: `{{ outputs.scan_spegel_mirror_telemetry.vars.worst_handler_endpoint }}` at `{{ outputs.scan_spegel_mirror_telemetry.vars.peak_request_duration_seconds }}` s (limit: `{{ inputs.max_mirror_request_duration_seconds }}` s). Resolve Errors: `{{ outputs.scan_spegel_mirror_telemetry.vars.resolve_errors_count }}` (limit: `{{ inputs.max_resolve_errors_threshold }}`). Routing Table Size: `{{ outputs.scan_spegel_mirror_telemetry.vars.routing_table_size }}` peers (min: `{{ inputs.min_peer_routing_table_size }}`). Advertised Images: `{{ outputs.scan_spegel_mirror_telemetry.vars.advertised_images_count }}`. Audit Timestamp: `{{ outputs.scan_spegel_mirror_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_spegel_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when stateless P2P registry mirror peer distribution and DHT routing remain healthy.
        message: "Spegel P2P registry mirror nominal for {{ inputs.cluster_name }}: Peak duration is {{ outputs.scan_spegel_mirror_telemetry.vars.peak_request_duration_seconds }} s, peer routing size {{ outputs.scan_spegel_mirror_telemetry.vars.routing_table_size }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for container runtime telemetry, P2P network governance, and image distribution observability.
    format: |
      {
        "status": "{{ outputs.scan_spegel_mirror_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "cluster_name": "{{ inputs.cluster_name }}",
        "peak_request_duration_seconds": {{ outputs.scan_spegel_mirror_telemetry.vars.peak_request_duration_seconds }},
        "worst_handler_endpoint": "{{ outputs.scan_spegel_mirror_telemetry.vars.worst_handler_endpoint }}",
        "resolve_errors_count": {{ outputs.scan_spegel_mirror_telemetry.vars.resolve_errors_count }},
        "routing_table_size": {{ outputs.scan_spegel_mirror_telemetry.vars.routing_table_size }},
        "advertised_images_count": {{ outputs.scan_spegel_mirror_telemetry.vars.advertised_images_count }},
        "total_requests_sampled": {{ outputs.scan_spegel_mirror_telemetry.vars.total_requests_sampled }},
        "stalled_requests_count": {{ outputs.scan_spegel_mirror_telemetry.vars.stalled_requests_count }},
        "audit_timestamp": "{{ outputs.scan_spegel_mirror_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_spegel_mirror_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "CNCF Spegel Stateless Registry P2P Mirror Latency Sentinel"
  metaTitle: "Spegel P2P Registry Mirror Latency Sentinel Blueprint"
  shortDescription: "Audits CNCF Spegel P2P registry mirror metrics to detect layer download stalls and peer routing drops."
  metaDescription: "Audits CNCF Spegel stateless P2P registry mirror metrics to detect peer layer download stalls, DHT routing table collapse, and image pull fallbacks."
  description: |
    Automates continuous health, latency, and peer connectivity surveillance for CNCF Spegel stateless peer-to-peer OCI container registry mirrors in Kubernetes.

    ## How it works
    1. A schedule trigger executes the Spegel P2P registry health audit workflow every 15 minutes.
    2. The Python task queries the Spegel Prometheus metrics endpoint exposed by the cluster DaemonSet pods.
    3. The script extracts peer layer request durations, DHT key resolution error counters, and routing table peer counts.
    4. An evaluation gate determines whether image layer download latency exceeds thresholds or nodes suffer from peer isolation.
    5. When P2P mirror degradation or peer routing collapse is detected, a high-urgency Slack incident alert is dispatched.
    6. When peer image distribution operates normally across the cluster mesh, nominal status is logged.
    7. A structured JSON audit manifest is emitted for container runtime telemetry and cluster egress cost tracking.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Spegel Daemon Metrics]
        ScanMetrics --> EvalBreach{Duration > 5s OR Resolve Errors > 10 OR Routing Peers < 3?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency P2P Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal P2P Performance]
        SlackAlert --> EmitManifest[Debug Return: P2P Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes Spegel Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether peer layer download latencies or DHT resolution errors violate distribution SLAs.
    - **Notification Task**: Dispatches structured Slack alerts with cluster name, offending handler, and peer routing table metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing download duration metrics, error totals, and timestamps.

    ## Key capabilities
    - Real-time peer-to-peer container image distribution surveillance without requiring central external mirror infrastructure.
    - Early warning detection for DHT routing table partitions, node isolation, and layer resolve timeouts.
    - Automated tracking of advertised container images and peer download durations across Kubernetes worker nodes.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Proactive detection of container image pull bottlenecks before scaling events fail or trigger upstream registry rate limits.
    - Immediate alerts preventing worker node isolation from the cluster P2P peer mesh during large node rollout waves.
    - Standardized audit manifests containing exact download duration metrics, advertised image counts, and routing stats.
    - Actionable operational alerts routed directly to Platform and SRE channels with complete diagnostic context.

    ## Who it's for
    - Platform engineers managing high-density Kubernetes clusters with rapid autoscaling requirements.
    - Site Reliability Engineers eliminating external container registry egress costs and upstream Docker Hub/ECR rate limits.
    - Cloud Infrastructure architects deploying stateless P2P registry mirrors across bare-metal and edge Kubernetes environments.
    - DevOps engineers diagnosing slow pod cold starts and container image layer download latencies.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages cluster P2P registry surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical peer distribution metrics in searchable Kestra execution logs.

    ## Use cases
    - **Autoscaling Image Pull Stall Alarm**: Detects peer layer transfer bottlenecks during high-concurrency pod scale-out events.
    - **Peer Mesh Partition Warning**: Identifies network policy misconfigurations blocking node-to-node Libp2p gossip on port 9090.
    - **Registry Egress Cost Protection**: Flags sudden surges in fallback pulls to external cloud registries when peer lookups fail.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `spegel_metrics_url` | STRING | `http://spegel.spegel.svc.cluster.local:9090` | Internal Kubernetes HTTP endpoint exposing Prometheus metrics from Spegel. |
    | `cluster_name` | STRING | `k8s-prod-us-central` | Identifier of the target Kubernetes cluster monitored for P2P mirror health. |
    | `max_mirror_request_duration_seconds` | INT | `5` | Maximum allowable latency in seconds for peer container layer download requests. |
    | `max_resolve_errors_threshold` | INT | `10` | Maximum allowable threshold for peer discovery and DHT resolution errors. |
    | `min_peer_routing_table_size` | INT | `3` | Minimum acceptable peer routing table size per node to ensure adequate mesh density. |
    | `alert_on_routing_isolation` | BOOL | `true` | Toggle whether isolated nodes with insufficient peers trigger an operational alert. |

    ## Expected outputs
    - `{{ outputs.scan_spegel_mirror_telemetry.vars.peak_request_duration_seconds }}`: Peak observed peer layer download duration in seconds.
    - `{{ outputs.scan_spegel_mirror_telemetry.vars.worst_handler_endpoint }}`: Name of the Spegel handler endpoint exhibiting highest latency.
    - `{{ outputs.scan_spegel_mirror_telemetry.vars.resolve_errors_count }}`: Cumulative count of DHT image layer resolution errors.
    - `{{ outputs.scan_spegel_mirror_telemetry.vars.routing_table_size }}`: Current number of active peer nodes in the local routing table.
    - `{{ outputs.scan_spegel_mirror_telemetry.vars.advertised_images_count }}`: Total number of container images advertised to the cluster mesh.
    - `{{ outputs.scan_spegel_mirror_telemetry.vars.is_alerting }}`: Boolean flag indicating if P2P mirror performance limits were breached.
    - `{{ outputs.scan_spegel_mirror_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the Spegel audit execution.

    ## Prerequisites
    - Spegel deployed as a DaemonSet across target Kubernetes worker nodes with metrics enabled on port 9090.
    - Network connectivity from the Kestra worker to the Spegel metrics service endpoint.
    - Configured Slack incoming webhook URL with permissions to post in platform infrastructure alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing P2P mirror degradation alerts to the Platform Slack channel.

    ## Quick start
    1. Confirm that Spegel DaemonSet pods are actively running and exposing metrics on port 9090.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your cluster identifier in `cluster_name`.
    4. Run a manual flow execution via the Kestra UI to validate metric scraping.
    5. Enable the `periodic_spegel_mirror_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **Containerd Mirror Configuration**: Ensure containerd hosts.toml is correctly configured to route registry requests to Spegel.
    - **Node Firewall Rules**: Spegel requires open communication between worker nodes on the configured Libp2p peer port.
    - **DaemonSet Scraping Scope**: The service endpoint typically round-robins across nodes; use Prometheus aggregation for cluster-wide totals.
    - **Stateless Cache Churn**: Nodes advertise layers stored in local containerd; small root disks can cause frequent image garbage collection.

    ## How to extend
    - **Automated containerd Health Probing**: Trigger automated node cordoning if a node's local containerd mirror socket stops responding.
    - **Dynamic P2P Peer Mesh Scaling**: Automatically tune Kademlia DHT alpha concurrency values during massive cluster scale-up events.
    - **Registry Fallback Cost Auditing**: Correlate resolve error spikes with external cloud registry data transfer billing metrics.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [CNCF Spegel Official Documentation](https://spegel.dev/)
    - [Spegel Architecture and Design Reference](https://github.com/spegel-org/spegel)
    - [Containerd Registry Configuration Guide](https://github.com/containerd/containerd/blob/main/docs/hosts.md)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Kubernetes Operations
  ee: false
  demo: false
