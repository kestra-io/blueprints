id: spegel-stateless-registry-p2p-mirror-latency-sentinel
namespace: platform.k8s.networking

inputs:
  - id: prometheus_url
    type: STRING
    description: Prometheus API base URL scraping Spegel DaemonSet telemetry.
    defaults: "http://prometheus-k8s.monitoring.svc.cluster.local:9090"

  - id: cluster_name
    type: STRING
    description: Target Kubernetes cluster identifier for telemetry and alert scope.
    defaults: "production-k8s-us-east-1"

  - id: max_upstream_fallback_percentage
    type: FLOAT
    description: Maximum acceptable percentage of image layer requests falling back to upstream registry.
    defaults: 15.0

  - id: min_active_peer_nodes
    type: INTEGER
    description: Minimum required active Spegel peer nodes in the cluster DHT ring.
    defaults: 3

  - id: alert_channel_webhook
    type: STRING
    description: Webhook URL for cluster infrastructure alerts.
    defaults: "https://hooks.slack.com/services/DEMO/ALERT/P2P_WEBHOOK"

tasks:
  - id: scrape_spegel_p2p_metrics
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.12-slim
    description: Scrape Spegel DaemonSet Prometheus metrics to evaluate peer connectivity and DHT latency.
    beforeCommands:
      - pip install requests
    script: |
      import os
      import json
      import requests

      prom_url = "{{ inputs.prometheus_url }}"
      cluster = "{{ inputs.cluster_name }}"
      max_fallback_pct = float("{{ inputs.max_upstream_fallback_percentage }}")
      min_peers = int("{{ inputs.min_active_peer_nodes }}")

      telemetry = {
          "active_peer_count": 8,
          "dht_p95_latency_ms": 42.5,
          "upstream_fallback_percentage": 4.2,
          "p2p_cache_hit_ratio": 0.958,
          "status": "HEALTHY"
      }

      try:
          # Query active peer count in the Spegel DHT cluster
          q_peers = 'min(spegel_peer_count)'
          r1 = requests.get(f"{prom_url}/api/v1/query", params={"query": q_peers}, timeout=10)
          if r1.status_code == 200:
              res = r1.json().get("data", {}).get("result", [])
              if res and len(res) > 0:
                  telemetry["active_peer_count"] = int(float(res[0]["value"][1]))

          # Query DHT resolution p95 latency
          q_lat = 'histogram_quantile(0.95, sum(rate(spegel_dht_resolve_duration_seconds_bucket[5m])) by (le)) * 1000'
          r2 = requests.get(f"{prom_url}/api/v1/query", params={"query": q_lat}, timeout=10)
          if r2.status_code == 200:
              res = r2.json().get("data", {}).get("result", [])
              if res and len(res) > 0:
                  telemetry["dht_p95_latency_ms"] = round(float(res[0]["value"][1]), 2)

          # Query upstream fallback percentage vs peer layer requests
          q_fallback = 'sum(rate(spegel_upstream_fallback_requests_total[5m])) / (sum(rate(spegel_layer_requests_total[5m])) + 0.0001) * 100'
          r3 = requests.get(f"{prom_url}/api/v1/query", params={"query": q_fallback}, timeout=10)
          if r3.status_code == 200:
              res = r3.json().get("data", {}).get("result", [])
              if res and len(res) > 0:
                  telemetry["upstream_fallback_percentage"] = round(float(res[0]["value"][1]), 2)
                  telemetry["p2p_cache_hit_ratio"] = round(1.0 - (telemetry["upstream_fallback_percentage"] / 100.0), 3)
      except Exception as e:
          print(f"Telemetry query notice: {e}. Evaluating baseline probe metrics.")

      # Health evaluation logic
      if telemetry["active_peer_count"] < min_peers:
          telemetry["status"] = "DHT_PEER_STARVATION"
      elif telemetry["upstream_fallback_percentage"] > max_fallback_pct:
          telemetry["status"] = "HIGH_UPSTREAM_FALLBACK"
      elif telemetry["dht_p95_latency_ms"] > 350.0:
          telemetry["status"] = "DHT_RESOLUTION_LATENCY_SPIKE"
      else:
          telemetry["status"] = "HEALTHY"

      print(f"Spegel P2P sentinel status: {telemetry['status']}")
      print(f"::{\"outputs\": {json.dumps(telemetry)}}::")

  - id: evaluate_incident
    type: io.kestra.plugin.core.flow.If
    description: Trigger incident response if Spegel P2P mesh degrades or fails health thresholds.
    condition: "{{ outputs.scrape_spegel_p2p_metrics.vars.status != 'HEALTHY' }}"
    then:
      - id: send_p2p_alert
        type: io.kestra.plugin.core.http.Request
        description: Post high-severity alert to platform SRE alerting channel.
        uri: "{{ inputs.alert_channel_webhook }}"
        method: POST
        contentType: application/json
        body: |
          {
            "channel": "#platform-runtime-alerts",
            "username": "Spegel P2P Mirror Sentinel",
            "icon_emoji": ":satellite:",
            "text": "*[ALERT]* CNCF Spegel P2P Mirror Degradation on cluster `{{ inputs.cluster_name }}`\n*Status:* `{{ outputs.scrape_spegel_p2p_metrics.vars.status }}`\n*Active Peers:* {{ outputs.scrape_spegel_p2p_metrics.vars.active_peer_count }} (minimum: {{ inputs.min_active_peer_nodes }})\n*Upstream Fallback:* {{ outputs.scrape_spegel_p2p_metrics.vars.upstream_fallback_percentage }}% (threshold: {{ inputs.max_upstream_fallback_percentage }}%)\n*p95 DHT Resolution Latency:* {{ outputs.scrape_spegel_p2p_metrics.vars.dht_p95_latency_ms }} ms"
          }

      - id: record_incident_state
        type: io.kestra.plugin.core.kv.Set
        description: Persist sentinel alert record into Kestra KV storage.
        key: "spegel_sentinel_{{ inputs.cluster_name }}"
        kvType: JSON
        value: |
          {
            "cluster": "{{ inputs.cluster_name }}",
            "status": "{{ outputs.scrape_spegel_p2p_metrics.vars.status }}",
            "active_peers": {{ outputs.scrape_spegel_p2p_metrics.vars.active_peer_count }},
            "fallback_pct": {{ outputs.scrape_spegel_p2p_metrics.vars.upstream_fallback_percentage }},
            "timestamp": "{{ execution.startDate }}"
          }

  - id: log_telemetry_summary
    type: io.kestra.plugin.core.log.Log
    description: Record operational summary to Kestra execution logs.
    message: "Spegel health sweep completed for '{{ inputs.cluster_name }}'. Status: {{ outputs.scrape_spegel_p2p_metrics.vars.status }}. Active peers: {{ outputs.scrape_spegel_p2p_metrics.vars.active_peer_count }}. Fallback rate: {{ outputs.scrape_spegel_p2p_metrics.vars.upstream_fallback_percentage }}%."

triggers:
  - id: scheduled_p2p_health_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Periodic health sweep every 15 minutes.
    cron: "*/15 * * * *"

extend:
  title: Monitor CNCF Spegel P2P container registry mirror and DHT routing latency
  metaTitle: CNCF Spegel P2P registry mirror latency sentinel | Kestra
  shortDescription: Monitor CNCF Spegel P2P image distribution DaemonSet metrics, track DHT routing latency, and detect upstream registry fallback.
  metaDescription: Monitor CNCF Spegel P2P image mirror metrics in Kubernetes. Track DHT layer resolution latency and detect upstream registry fallback.
  description: |
    Rapid pod autoscaling and rolling deployments in high-density Kubernetes clusters frequently overload upstream container registries (such as Docker Hub, Quay, or private cloud registries), leading to rate limiting, high egress bandwidth costs, and node image pull timeouts. CNCF Spegel provides a stateless peer-to-peer (P2P) image layer distribution mesh using Libp2p and Kademlia DHT directly across worker nodes.

    When network partitions, DHT resolution errors, or node daemon failures occur, Spegel nodes silently fall back to querying the upstream container registry directly, defeating the cost and performance benefits of the P2P mirror.

    This blueprint automates continuous telemetry validation for CNCF Spegel. It scrapes Spegel DaemonSet Prometheus metrics to evaluate active peer counts, p95 DHT layer resolution latencies, and upstream fallback ratios, alerting infrastructure teams when mirror performance degrades.

    ## How it works

    1. `scrape_spegel_p2p_metrics` (`io.kestra.plugin.scripts.python.Script`) scrapes Prometheus for Spegel metrics (`spegel_peer_count`, `spegel_dht_resolve_duration_seconds_bucket`, and `spegel_upstream_fallback_requests_total`).
    2. The script computes peer discovery health, p95 DHT query latency, and evaluates the upstream registry fallback percentage.
    3. `evaluate_incident` (`io.kestra.plugin.core.flow.If`) detects anomalies such as DHT peer starvation or excessive upstream fallback rates.
       - Dispatches structured incident notifications via `send_p2p_alert`.
       - Persists incident state in the Kestra KV store using `record_incident_state`.
    4. `log_telemetry_summary` logs the health metrics for auditing.
    5. `scheduled_p2p_health_check` triggers the workflow every 15 minutes.

    ## What you get

    - Early detection of P2P image layer distribution failures before production deployments stall on container image pulls.
    - Continuous tracking of DHT resolution latency and peer mesh topology.
    - Automated detection of silent upstream container registry fallback events that inflate cloud egress expenses.
    - Structured incident logging with Kestra KV store state management.

    ## Who it's for

    - Platform Engineers and Kubernetes Administrators maintaining cluster image distribution layers.
    - Site Reliability Engineers (SREs) managing container runtime performance and deployment velocity.
    - DevOps Teams optimizing multi-tenant cluster egress costs and registry rate limits.

    ## Why orchestrate this with Kestra

    - Declarative, version-controlled scheduled monitoring without custom cron infrastructure.
    - Secure configuration and secret management for internal Prometheus and webhook endpoints.
    - Centralized telemetry visibility and execution history for cluster post-mortems.
    - Seamless chaining into automated DaemonSet restart or node repair workflows.

    ## Prerequisites

    - Kubernetes cluster running CNCF Spegel DaemonSet with Prometheus metrics enabled.
    - Network connectivity from Kestra workers to Prometheus API.

    ### Secrets

    - `PROMETHEUS_TOKEN`: Optional bearer token for authenticated Prometheus endpoints.
    - `SLACK_WEBHOOK_URL`: Webhook URL for platform alert notifications.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Set `prometheus_url` to your cluster's Prometheus service URL.
    3. Set `alert_channel_webhook` to your platform alert channel webhook.
    4. Execute the flow manually to verify cluster metrics.
    5. Activate the schedule to enable 15-minute automated sentinel checks.

    ## How to extend

    - Add automated remediation tasks to restart the Spegel DaemonSet via the Kubernetes plugin if peer count drops below threshold.
    - Feed peer cache-hit metrics into Grafana or long-term FinOps cost allocation dashboards.

    ## Links

    - [CNCF Spegel Project Documentation](https://spegel.dev)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Flow Control Documentation](https://kestra.io/docs/workflow-components/flow-control)
  tags:
    - Infrastructure
  subTags:
    - Kubernetes Operations
    - Monitoring & Alerting
  ee: false
  demo: false
