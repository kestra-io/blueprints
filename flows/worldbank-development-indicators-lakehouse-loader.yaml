id: worldbank-development-indicators-lakehouse-loader
namespace: company.analytics
description: Ingests macroeconomic development indicators, country demographics, and economic metrics from the World Bank API into Parquet lakehouse storage via DuckDB, tracking metric drifts in Kestra KV store.

inputs:
  - id: indicator_code
    type: STRING
    description: World Bank economic or demographic indicator series code.
    defaults: NY.GDP.MKTP.CD

  - id: target_year
    type: STRING
    description: Reporting fiscal or calendar year.
    defaults: "2023"

  - id: significant_value_threshold
    type: FLOAT
    description: Minimum value threshold to highlight major national reporting entities.
    defaults: 1000000000000.0

  - id: state_key
    type: STRING
    description: Kestra KV store key tracking previous indicator values per country code.
    defaults: worldbank_monitored_indicator_state

variables:
  default_state: "{}"

triggers:
  - id: quarterly_worldbank_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 5 1 */3 *"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_indicators
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            state = json.loads(raw_state) if raw_state else {}
        except Exception:
            state = {}

        indicator = "{{ inputs.indicator_code }}"
        year = "{{ inputs.target_year }}"
        threshold = float("{{ inputs.significant_value_threshold }}")

        url = f"https://api.worldbank.org/v2/country/all/indicator/{indicator}?format=json&date={year}&per_page=300"
        headers = {"User-Agent": "KestraWorldBankLakehouse/1.0 (economics-ops@kestra.io)"}

        records = []
        major_economies = []
        new_state = dict(state)

        try:
            resp = requests.get(url, headers=headers, timeout=25)
            if resp.status_code == 200:
                data = resp.json()
                if len(data) > 1 and isinstance(data[1], list):
                    items = data[1]
                    for entry in items:
                        val = entry.get("value")
                        if val is None:
                            continue
                        val = float(val)

                        country_obj = entry.get("country", {})
                        country_id = country_obj.get("id", "")
                        country_name = country_obj.get("value", "")
                        indicator_obj = entry.get("indicator", {})
                        indicator_id = indicator_obj.get("id", indicator)
                        indicator_name = indicator_obj.get("value", "")
                        date_val = entry.get("date", year)

                        is_major = val >= threshold
                        prior_val = state.get(country_id, val)
                        drift = val - prior_val

                        records.append({
                            "country_id": country_id,
                            "country_name": country_name,
                            "indicator_id": indicator_id,
                            "indicator_name": indicator_name,
                            "reporting_year": date_val,
                            "indicator_value": val,
                            "is_major_entity": is_major,
                            "value_drift": drift,
                            "harvest_time": datetime.utcnow().isoformat()
                        })

                        if is_major:
                            major_economies.append({"country": country_name, "value": val})

                        new_state[country_id] = val
        except Exception as e:
            print(f"Error fetching World Bank indicators: {e}")

        with open("worldbank_indicators.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("CREATE TABLE worldbank AS SELECT * FROM read_json_auto('worldbank_indicators.json')")
            con.execute("COPY worldbank TO 'worldbank_indicators.parquet' (FORMAT PARQUET)")
            con.execute("COPY worldbank TO 'worldbank_indicators.csv' (HEADER, DELIMITER ',')")
        else:
            con.execute("""
                CREATE TABLE worldbank (
                    country_id VARCHAR,
                    country_name VARCHAR,
                    indicator_id VARCHAR,
                    indicator_name VARCHAR,
                    reporting_year VARCHAR,
                    indicator_value DOUBLE,
                    is_major_entity BOOLEAN,
                    value_drift DOUBLE,
                    harvest_time VARCHAR
                )
            """)
            con.execute("COPY worldbank TO 'worldbank_indicators.parquet' (FORMAT PARQUET)")
            con.execute("COPY worldbank TO 'worldbank_indicators.csv' (HEADER, DELIMITER ',')")

        summary = {
            "reported_countries_count": len(records),
            "major_entities_count": len(major_economies),
            "major_entities": major_economies[:5],
            "updated_state": new_state
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - worldbank_indicators.parquet
      - worldbank_indicators.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_indicators.vars.updated_state | toJson }}"

  - id: check_major_entities
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_indicators.vars.major_entities_count > 0 }}"
    then:
      - id: notify_major_economies
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "📈 World Bank Indicator Sync: Identified {{ outputs.ingest_and_transform_indicators.vars.major_entities_count }} country entities exceeding threshold {{ inputs.significant_value_threshold }} for {{ inputs.indicator_code }}."

outputs:
  - id: reported_countries
    type: INT
    value: "{{ outputs.ingest_and_transform_indicators.vars.reported_countries_count }}"
  - id: major_entities_count
    type: INT
    value: "{{ outputs.ingest_and_transform_indicators.vars.major_entities_count }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_indicators.outputFiles['worldbank_indicators.parquet'] }}"

extend:
  title: World Bank Development Indicators Lakehouse Loader with DuckDB
  metaTitle: World Bank Indicators Lakehouse Loader | Kestra
  shortDescription: Ingests macroeconomic development indicators, country demographics, and economic metrics from the World Bank API into Parquet lakehouse storage via DuckDB.
  metaDescription: Poll World Bank API for global economic indicators, convert macroeconomic series into Parquet via DuckDB, and track state in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Automate the collection, macroeconomic harmonization, and analytical persistence of global development indicators,
    national accounts, and demographic time-series from the official World Bank API into Parquet using DuckDB.

    ## How it works

    1. **State Recovery**: Queries the Kestra KV store (`worldbank_monitored_indicator_state`) for previous indicator benchmarks per country code.
    2. **World Bank Ingestion**: Queries the official World Bank API (`api.worldbank.org/v2/country/all/indicator/{indicator}`) for cross-sectional annual figures.
    3. **DuckDB Economic Normalization**: Unpacks reporting countries, indicator names, reporting years, and numerical series into a relational schema inside Docker.
    4. **Analytical Lake Export**: Exports normalized economic indicators into columnar Parquet and CSV files for econometric modeling and international development research.
    5. **Threshold Evaluation & State Commitment**: Evaluates major national economies, highlights top-tier entities, and commits values to Kestra KV store.

    ## What you get

    - Automated, scheduled collection of institutional-grade global macroeconomic indicators.
    - Columnar Parquet datasets queryable with DuckDB, Trino, Snowflake, or ClickHouse.
    - Built-in KV state management providing idempotent execution and zero database requirements.

    ## Who it's for

    - Macroeconomists and ESG Research Analysts building global benchmarking indexes.
    - Policy Analysts tracking multilateral international development progress.
    - Analytics Engineers building reproducible multi-cloud lakehouse pipelines.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains historical indicator snapshots across runs without external infrastructure.
    - Ephemeral Docker execution guarantees reproducible, clean Python and DuckDB runtimes.
    - Declarative scheduled execution with automated error recovery and conditional logging.

    ## Prerequisites

    - Docker runner configured on the Kestra worker.
    - Outbound internet access to `api.worldbank.org`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for alerting teams on macroeconomic releases.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Choose an indicator series (default `NY.GDP.MKTP.CD` for nominal GDP in USD).
    3. Click **Execute** to run an immediate harvest and generate the Parquet table.
    4. Enable the `quarterly_worldbank_sync` schedule for automated quarterly updates.

    ## How to extend

    - Add an S3 or Google Cloud Storage step to partition quarterly macroeconomic snapshots.
    - Connect a dbt task downstream to compute year-over-year percentage growth rates.

    ## Links

    - [World Bank API Developer Documentation](https://datahelpdesk.worldbank.org/knowledgebase/articles/889392-about-the-indicators-api-documentation)
    - [DuckDB Documentation](https://duckdb.org/)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
