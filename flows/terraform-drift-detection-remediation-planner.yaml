    - [Terraform CLI Plugin Documentation](https://kestra.io/plugins/plugin-terraform)
    - [Slack Notification Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Terraform Refresh-Only Planning Docs](https://developer.hashicorp.com/terraform/cli/commands/plan#refresh-only)
