id: pinecone-index-staleness-and-vector-drift-sentinel
namespace: company.ai

inputs:
  - id: pinecone_host
    type: STRING
    displayName: Pinecone Index Host
    required: true
    defaults: "https://knowledge-base-idx-123456.svc.aped-4627-b74a.pinecone.io"
    description: "The HTTPS index host URL found in your Pinecone Console."

  - id: expected_min_vector_count
    type: INT
    displayName: Minimum Expected Vector Count
    required: true
    defaults: 50000
    description: "Expected vector count threshold below which a potential silent index truncation or drop is flagged."

  - id: max_staleness_hours
    type: INT
    displayName: Max Staleness Window (Hours)
    required: true
    defaults: 24
    description: "Maximum allowable window without new embeddings before alerting ML data ingestion teams."

tasks:
  - id: log_sentinel_commencement
    type: io.kestra.plugin.core.log.Log
    message: "🌲 Starting Pinecone vector index health audit on host: {{ inputs.pinecone_host }}"

  - id: query_index_stats
    type: io.kestra.plugin.core.http.Request
    description: "Query Pinecone Vector Database /describe_index_stats endpoint"
    uri: "{{ inputs.pinecone_host }}/describe_index_stats"
    method: POST
    headers:
      Api-Key: "{{ secret('PINECONE_API_KEY') }}"
      Content-Type: "application/json"
    body: "{}"
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3

  - id: evaluate_vector_health
    type: io.kestra.plugin.scripts.python.Script
    description: "Parse index statistics and evaluate vector count health and namespace density"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    dependencies:
      - kestra
    inputFiles:
      stats.json: "{{ outputs.query_index_stats.body }}"
    script: |
      import json
      from kestra import Kestra

      with open("stats.json") as f:
          data = json.load(f)

      total_vector_count = data.get("totalVectorCount", 0)
      dimension = data.get("dimension", 1536)
      index_fullness = data.get("indexFullness", 0.0)
      namespaces = data.get("namespaces", {})

      min_expected = {{ inputs.expected_min_vector_count }}
      is_underpopulated = total_vector_count < min_expected

      Kestra.outputs({
          "total_vector_count": total_vector_count,
          "dimension": dimension,
          "index_fullness": round(index_fullness * 100, 2),
          "namespace_count": len(namespaces),
          "is_underpopulated": is_underpopulated
      })

  - id: check_vector_staleness_gate
    type: io.kestra.plugin.core.flow.If
    description: "Evaluate if vector count dropped below expected thresholds indicating silent drop or truncation"
    condition: "{{ outputs.evaluate_vector_health.vars.is_underpopulated == true }}"
    then:
      - id: alert_pinecone_underpopulated
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Post critical alert to AI platform channel about vector volume drop"
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "🚨 Pinecone Vector Count Degradation Alert",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Current Count:* `{{ outputs.evaluate_vector_health.vars.total_vector_count }}`"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Expected Minimum:* `{{ inputs.expected_min_vector_count }}`"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Dimension:* `{{ outputs.evaluate_vector_health.vars.dimension }}`"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Index Fullness:* `{{ outputs.evaluate_vector_health.vars.index_fullness }}%`"
                  }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "⚠️ *Warning:* Vector count is significantly below operational expectations. Check upstream embedding ingestion pipelines, batch upsert cron jobs, or inadvertent namespace deletes."
                }
              }
            ]
          }

    else:
      - id: log_index_healthy
        type: io.kestra.plugin.core.log.Log
        description: "Log healthy vector index metrics"
        message: "✅ Pinecone index is healthy. Total vectors: {{ outputs.evaluate_vector_health.vars.total_vector_count }}, Fullness: {{ outputs.evaluate_vector_health.vars.index_fullness }}%, Namespaces: {{ outputs.evaluate_vector_health.vars.namespace_count }}."

errors:
  - id: alert_sentinel_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Dead-letter alert if Pinecone sentinel query fails"
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *Pinecone Health Sentinel Failed!* Execution `{{ execution.id }}` failed to reach Pinecone host `{{ inputs.pinecone_host }}`."
      }

triggers:
  - id: hourly_vector_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "30 * * * *"
    disabled: true

extend:
  title: Pinecone Vector Index Health and Embedding Staleness Sentinel
  metaTitle: Pinecone Vector Index Staleness Sentinel with Slack Alerts | Kestra
  shortDescription: Audit Pinecone vector database index statistics and alert Slack on silent index drops and embedding pipeline degradation.
  metaDescription: Monitor Pinecone vector index stats, detect unexpected vector count drops, and broadcast automated health alerts to Slack channels.
  description: |
    Production Retrieval-Augmented Generation (RAG) and semantic search systems depend on Pinecone vector indexes staying synchronized with application data. Silent ingestion failures, failed embedding batches, or accidental namespace purges can degrade search relevance without throwing explicit runtime errors. This blueprint calls the Pinecone `/describe_index_stats` API, evaluates total vector density and dimension integrity, and alerts AI platform engineers on Slack when vector counts breach operational thresholds.

    ## How it works

    1. **Inputs & Endpoints**: Accepts the Pinecone index host URL and expected minimum vector volume threshold.
    2. **Index Stats Query**: The `query_index_stats` task (`io.kestra.plugin.core.http.Request`) invokes Pinecone's vector statistics endpoint using HTTPS Bearer authentication with automated retries.
    3. **Metric Calculation**: The `evaluate_vector_health` task (`io.kestra.plugin.scripts.python.Script`) extracts total vector count, embedding dimension, and index fullness percentage, publishing typed variables via `Kestra.outputs()`.
    4. **Underpopulation Gate**: The `check_vector_staleness_gate` task (`io.kestra.plugin.core.flow.If`) evaluates whether current vector counts fall below expected minimums.
    5. **Slack Alert Broadcast**: If underpopulated, `alert_pinecone_underpopulated` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) immediately broadcasts an alert card to the AI team with exact density metrics.
    6. **Pipeline Resilience**: An `errors` handler guarantees dead-letter notifications if API keys expire or cluster endpoints become unreachable.

    ## What you get

    - Automated vector database observability without third-party APM overhead.
    - Early detection of silent RAG data corruption or upstream embedding pipeline halts.
    - Real-time Slack notifications highlighting vector counts, dimensions, and fullness.
    - Pre-configured hourly audit schedule ready to enable.

    ## Who it's for

    - AI Platform Engineers and MLOps teams supporting production RAG applications.
    - SREs maintaining mission-critical vector search infrastructure.
    - Data Engineers orchestrating scheduled embedding generation pipelines.

    ## Why orchestrate this with Kestra

    Kestra coordinates authenticated HTTP API calls, containerized metric evaluation, secret masking, and conditional alerts in declarative YAML with full audit logging and zero server maintenance.

    ## Prerequisites

    - A Pinecone account and an active serverless or pod-based index.
    - A Pinecone API Key.
    - A Slack Incoming Webhook URL.

    ### Secrets

    - `PINECONE_API_KEY`: API Key for Pinecone vector database authentication.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for AI operations alerts.

    ## Quick start

    1. Configure `PINECONE_API_KEY` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Run this flow with your Pinecone index host URL.
    3. Verify execution logs to inspect total vector counts and fullness.
    4. Enable the `hourly_vector_audit` schedule for automated continuous monitoring.

    ## How to extend

    - Add an automated re-trigger task to kick off upstream document ingestion pipelines if the index is underpopulated.
    - Integrate PagerDuty alerting for high-severity vector outages in tier-1 customer search.
    - Export index density metrics to Prometheus or Datadog for long-term vector growth forecasting.

    ## Links

    - [Pinecone Describe Index Stats API](https://docs.pinecone.io/reference/api/2024-07/data-plane/describe_index_stats)
    - [Kestra HTTP Plugin](https://kestra.io/plugins/plugin-core/io.kestra.plugin.core.http.request)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - AI
    - Cloud
  subTags:
    - Vector Databases & Embeddings
    - Monitoring & Alerting
  ee: false
  demo: false
