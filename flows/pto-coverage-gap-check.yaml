id: pto-coverage-gap-check
namespace: company.team
description: |
  Catch the week when overlapping time off leaves an on-call role with nobody
  available, before the rota is published. A keyed webhook or the disabled
  Friday planning schedule starts the run, the flow writes a roster and a PTO
  snapshot into one working directory, and a python pass builds per-day,
  per-role availability for the seven days of the requested week. Every day and
  role below the minimum coverage threshold becomes a gap entry, each gap is
  posted to Slack, and one rollup GitHub issue carries the rebalancing work
  while a clean week is logged as fully covered. The execution ends with the
  verdict, the gap list, the number of covered days, and the lowest availability
  seen published as outputs.

triggers:
  - id: on_demand_coverage_check
    type: io.kestra.plugin.core.trigger.Webhook
    description: POST here to check a week on demand, for example after a swap request, a late PTO approval, or an HR export refresh.
    key: "{{ secret('PTO_WEBHOOK_KEY') }}"
  - id: friday_planning_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Friday 15:00 UTC planning run that reviews the coming week before the rota is published - shipped disabled until an operator switches it on.
    cron: "0 15 * * 5"
    disabled: true

inputs:
  - id: week_start
    type: STRING
    defaults: 2026-10-19
    description: ISO date such as 2026-10-19 that the seven-day coverage window opens on. The webhook request may override it for the week under review, and the disabled schedule falls back to this default.
  - id: min_coverage
    type: INT
    defaults: 1
    description: Minimum number of roster members who must stay available per role on every day of the window. Each day and role that drops below this number becomes a gap entry.

tasks:
  # --- 1. roster and PTO fixtures ---
  - id: coverage_workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One shared directory so the fixture writer, the coverage calculator, and the rollup issue all read the same roster and time off files.
    tasks:
      - id: write_roster_fixtures
        type: io.kestra.plugin.scripts.shell.Commands
        description: Write team.csv with role and person rows and pto.csv with person, start, and end rows through heredocs, giving the check a deterministic snapshot that an HR export can replace without touching the logic.
        commands:
          - |
            set -eu
            cat > team.csv <<'CSV'
            role,person
            on-call,alice
            on-call,bob
            sre,carol
            sre,dave
            dba,erin
            dba,frank
            CSV
            cat > pto.csv <<'CSV'
            person,start,end
            alice,2026-10-19,2026-10-21
            bob,2026-10-20,2026-10-20
            carol,2026-10-20,2026-10-21
            erin,2026-10-23,2026-10-24
            CSV
            echo "team rows $(($(wc -l < team.csv) - 1)), pto rows $(($(wc -l < pto.csv) - 1))"

      - id: compute_coverage
        type: io.kestra.plugin.scripts.python.Script
        description: Read team.csv and pto.csv, build the available headcount for each role on each of the seven days from week_start, and emit verdict, gap_days, covered_days, and min_available through the outputs protocol.
        env:
          WEEK_START: "{{ inputs.week_start }}"
          MIN_COVERAGE: "{{ inputs.min_coverage }}"
        script: |
          import csv
          import json
          import os
          from datetime import datetime, timedelta

          WEEK_START = os.environ.get("WEEK_START", "").strip()
          try:
              MIN_COVERAGE = int(os.environ.get("MIN_COVERAGE", "1").strip())
          except ValueError:
              MIN_COVERAGE = 1
          if MIN_COVERAGE < 1:
              MIN_COVERAGE = 1

          SYNTHETIC = "unverified-coverage"


          def parse_day(text):
              try:
                  return datetime.strptime((text or "").strip(), "%Y-%m-%d").date()
              except ValueError:
                  return None


          def read_rows(path):
              try:
                  with open(path, newline="") as handle:
                      return list(csv.DictReader(handle))
              except OSError:
                  return None


          def build():
              week_start = parse_day(WEEK_START)
              if week_start is None:
                  return ("error", [{"date": WEEK_START or "unknown", "role": SYNTHETIC, "available": 0}],
                          0, 0, "week_start %r is not an ISO YYYY-MM-DD date" % WEEK_START)

              team_rows = read_rows("team.csv")
              if not team_rows:
                  return ("error", [{"date": WEEK_START, "role": SYNTHETIC, "available": 0}],
                          0, 0, "team.csv is missing or carries no usable rows")

              roster = {}
              for row in team_rows:
                  role = (row.get("role") or "").strip()
                  person = (row.get("person") or "").strip()
                  if role and person:
                      members = roster.setdefault(role, [])
                      if person not in members:
                          members.append(person)
              if not roster:
                  return ("error", [{"date": WEEK_START, "role": SYNTHETIC, "available": 0}],
                          0, 0, "team.csv rows carry no role,person pair")

              pto_rows = read_rows("pto.csv")
              if pto_rows is None:
                  return ("error", [{"date": WEEK_START, "role": SYNTHETIC, "available": 0}],
                          0, 0, "pto.csv is missing")

              absences = []
              skipped = 0
              for row in pto_rows:
                  person = (row.get("person") or "").strip()
                  start = parse_day(row.get("start"))
                  end = parse_day(row.get("end"))
                  known = any(person in members for members in roster.values())
                  if person and start and end and start <= end and known:
                      absences.append((person, start, end))
                  else:
                      skipped += 1

              days = [week_start + timedelta(days=i) for i in range(7)]
              gap_days = []
              covered_days = 0
              min_available = None
              for day in days:
                  gaps_today = 0
                  for role, members in roster.items():
                      available = sum(
                          1 for member in members
                          if not any(who == member and start <= day <= end
                                     for who, start, end in absences)
                      )
                      if min_available is None or available < min_available:
                          min_available = available
                      if available < MIN_COVERAGE:
                          gap_days.append({"date": day.isoformat(), "role": role, "available": available})
                          gaps_today += 1
                  if gaps_today == 0:
                      covered_days += 1

              verdict = "gap" if gap_days else "covered"
              summary = ("week=%s roles=%d absences=%d skipped=%d gaps=%d covered_days=%d "
                         "min_available=%d verdict=%s") % (
                             week_start.isoformat(), len(roster), len(absences), skipped,
                             len(gap_days), covered_days,
                             min_available if min_available is not None else 0, verdict)
              return (verdict, gap_days, covered_days,
                      min_available if min_available is not None else 0, summary)


          verdict, gap_days, covered_days, min_available, summary = build()
          print(summary)
          print("::" + json.dumps({"outputs": {
              "verdict": verdict,
              "gap_days": gap_days,
              "covered_days": covered_days,
              "min_available": min_available,
          }}) + "::")

  # --- 2. gap gate and escalation ---
  - id: check_gaps
    type: io.kestra.plugin.core.flow.If
    description: Branch on the gap list so a week with missing coverage escalates one alert per gap plus a rollup issue, while a fully covered week is recorded without waking anyone.
    condition: "{{ (outputs.compute_coverage.vars.gap_days | length) > 0 }}"
    then:
      - id: notify_each_gap
        type: io.kestra.plugin.core.flow.ForEach
        description: Walk the gap entries one at a time so every uncovered day and role gets its own alert instead of one crowded message.
        concurrencyLimit: 1
        values: "{{ outputs.compute_coverage.vars.gap_days }}"
        tasks:
          - id: alert_gap_slack
            type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
            description: Post the date, the role, and the remaining headcount for the current gap so the manager can rebalance before the week starts.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": "PTO coverage gap for {{ item.role }} on {{ item.date }} - only {{ item.available }} available against the minimum of {{ inputs.min_coverage }} for the week of {{ inputs.week_start }}. Rebalance before the week starts. Execution {{ execution.id }}."
              }
      - id: open_rollup_issue
        type: io.kestra.plugin.github.issues.Create
        description: Open one rollup issue listing every gap day and role, so the whole week of rebalancing is tracked as a single ticket.
        jwtToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: your-org/oncall-schedules
        title: "PTO coverage gaps for the week of {{ inputs.week_start }}"
        body: |
          ## PTO coverage gap rollup

          Week starting **{{ inputs.week_start }}** has **{{ outputs.compute_coverage.vars.gap_days | length }}** day and role combination(s) below the minimum of {{ inputs.min_coverage }}.

          {% for gap in outputs.compute_coverage.vars.gap_days %}
          - {{ gap.date }} - {{ gap.role }} - {{ gap.available }} available
          {% endfor %}

          Covered days {{ outputs.compute_coverage.vars.covered_days }} of 7, lowest availability {{ outputs.compute_coverage.vars.min_available }}, verdict **{{ outputs.compute_coverage.vars.verdict }}**.

          Execution {{ execution.id }}

          Move a covering person onto each line above, or move the absence, then re-run the check for this week.
        labels:
          - on-call
          - coverage
    else:
      - id: log_fully_covered
        type: io.kestra.plugin.core.log.Log
        description: Record the all-clear for the week in execution history so a quiet run still leaves evidence that the check ran.
        message: "Fully covered for the week of {{ inputs.week_start }} - {{ outputs.compute_coverage.vars.covered_days }} of 7 days meet the minimum of {{ inputs.min_coverage }}, lowest availability {{ outputs.compute_coverage.vars.min_available }}."

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Escalate any failure to the ops channel with the execution url.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "FAILED: {{ flow.id }} {{ execution.id }}"}

outputs:
  - id: verdict
    type: STRING
    description: Verdict for the week, one of gap, covered, or error when the window or the roster cannot be read.
    value: "{{ outputs.compute_coverage.vars.verdict }}"
  - id: gap_days
    type: ARRAY
    description: 'One entry per uncovered cell, for example [{"date": "2026-10-20", "role": "on-call", "available": 0}].'
    value: "{{ outputs.compute_coverage.vars.gap_days | toJson }}"
  - id: covered_days
    type: INT
    description: Number of the seven days where every role met the minimum, from 0 to 7.
    value: "{{ outputs.compute_coverage.vars.covered_days }}"
  - id: min_available
    type: INT
    description: Lowest per-role headcount seen on any day of the window, 0 when a role had nobody available.
    value: "{{ outputs.compute_coverage.vars.min_available }}"

extend:
  title: Catch On-Call Coverage Gaps Before the Week Starts
  metaTitle: Weekly PTO and On-Call Coverage Gap Checks
  shortDescription: Build per-day, per-role availability from roster and PTO CSVs, alert Slack on every gap below the minimum, and roll the week up into one GitHub issue.
  metaDescription: Check a week of on-call coverage against PTO overlaps, flag every day and role below your minimum, alert Slack per gap, and open a rollup GitHub issue.
  description: |
    ## How it works

    1. `on_demand_coverage_check` (`io.kestra.plugin.core.trigger.Webhook`, keyed) accepts a check for the coming week from an HR sync, a swap request, or a laptop; `week_start` and `min_coverage` travel with the request or fall back to the flow inputs.
    2. `friday_planning_check` (`io.kestra.plugin.core.trigger.Schedule`, cron `0 15 * * 5`) is the Friday planning net that reviews the week before the rota is published. It ships `disabled: true` until the snapshot matches the real rota.
    3. `coverage_workspace` (`io.kestra.plugin.core.flow.WorkingDirectory`) gives the whole run one directory, so the fixtures written by the shell task are the exact files the calculator reads.
    4. `write_roster_fixtures` (`io.kestra.plugin.scripts.shell.Commands`) writes `team.csv` with `role,person` rows and `pto.csv` with `person,start,end` rows through heredocs. The snapshot is deterministic, and an HR export can replace it without touching any logic.
    5. `compute_coverage` (`io.kestra.plugin.scripts.python.Script`) parses the seven dates that start at `week_start`, counts how many members of each role are off on each day, and appends one `{date, role, available}` entry to `gap_days` for every day and role below `min_coverage`. It also counts `covered_days`, finds `min_available`, picks `verdict`, and prints the repo-standard `::` plus json outputs plus `::` payload for the tasks downstream. An unreadable window or an empty roster emits `error` with a synthetic unverified entry, so a broken check escalates instead of reading as an all-clear.
    6. `check_gaps` (`io.kestra.plugin.core.flow.If`) branches on `gap_days` being non-empty. With gaps, `notify_each_gap` (`io.kestra.plugin.core.flow.ForEach`) walks them one at a time, `alert_gap_slack` (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) posts the date, the role, and the remaining headcount, then `open_rollup_issue` (`io.kestra.plugin.github.issues.Create`) files one rollup issue listing the whole week. Without gaps, `log_fully_covered` (`io.kestra.plugin.core.log.Log`) records the all-clear with the covered day count.
    7. The `errors` block posts to Slack whenever the fixtures or the calculation break, because a crashed check must never look like a covered week.

    ## What you get

    - A per-day, per-role availability table for the seven days of `week_start`, reduced to the entries that fall below `min_coverage`.
    - One Slack message per gap naming the date, the role, and how many people are left, so the rebalance conversation starts with facts instead of a hunch.
    - One rollup GitHub issue carrying every gap of the week, so the manager works a single ticket instead of chasing scattered alerts.
    - `verdict`, `gap_days`, `covered_days`, and `min_available` as typed outputs any downstream flow, dashboard, or audit query can branch on.
    - An execution history that keeps the roster snapshot and the verdict together as evidence of what was planned and when.

    ## Who it's for

    - Engineering managers and SRE leads who publish an on-call rota and need to see PTO collisions before the week starts.
    - Workforce and IT operations teams that staff a role with a minimum headcount and must show the minimum was respected.
    - Anyone replacing a spreadsheet ritual with a scheduled check that files its own follow-up work.

    ## Why orchestrate this with Kestra

    A coverage check that lives in a spreadsheet formula only runs when somebody remembers to open it, and the answer disappears the moment the file is closed. Kestra turns the check into a versioned workflow with a disabled-by-default Friday schedule as the safety net, a keyed webhook for the did-we-miss-anything moments, the roster snapshot stored beside the execution, a branch that separates escalation from the all-clear, and routing into Slack and GitHub from one declarative file. A cron entry on someone's laptop gives you a log nobody reads and no ticket to close.

    ## Prerequisites

    - Python 3 and a shell on the Kestra worker, the calculation uses only the standard library modules `csv`, `json`, and `datetime`.
    - A Slack incoming webhook for per-gap alerts and for failure alerts.
    - A GitHub token that can open issues in `your-org/oncall-schedules`, with classic PAT scope `repo` or fine-grained **Issues: write**.
    - `team.csv` and `pto.csv` content for your organisation; the fixtures ship inline and can be swapped for an export step.

    ### Secrets

    - `PTO_WEBHOOK_KEY`: key segment guarding the webhook URL, anyone holding it can run the check.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for gap alerts and failure alerts.
    - `GITHUB_TOKEN`: token used to open the rollup issue.

    ## Quick start

    1. Add the three secrets to your Kestra namespace and set `week_start` to the Monday of the week you are planning.
    2. Run with the default inputs. The bundled snapshot overlaps Alice and Bob on 2026-10-20, so the run reports `verdict: gap`, posts one Slack message, and opens the rollup issue.
    3. Re-run with `min_coverage` at 2 to watch the same week expand into every day where a role falls below two people.
    4. Clear the overlap in `pto.csv` inside `write_roster_fixtures` and run again to see `verdict: covered` recorded by `log_fully_covered`.
    5. Trigger `on_demand_coverage_check` at `/api/v1/{tenant}/executions/webhook/{namespace}/pto-coverage-gap-check/{PTO_WEBHOOK_KEY}`, or enable `friday_planning_check` once the snapshot matches the real rota.

    ## How to extend

    - Replace the heredoc fixtures with a `io.kestra.plugin.git.Clone` or an HR API call that drops fresh `team.csv` and `pto.csv` files into the same working directory.
    - Add a second threshold input for the most absences a single role may absorb in one week, and raise a separate gap type when it is breached.
    - Fan the rollup out per role with a second `ForEach` when each role owns its own board and wants its own ticket.
    - Fail the execution with `io.kestra.plugin.core.execution.Fail` under the gate when a week with zero coverage on a critical role must block the rota from publishing.
    - Persist `gap_days` for trend reporting with `io.kestra.plugin.jdbc.postgresql.Queries` or ship the snapshot to `io.kestra.plugin.aws.s3.Upload`.

    ## Links

    - [Kestra workflow triggers](https://kestra.io/docs/workflow-triggers)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)
    - [Kestra GitHub plugin](https://kestra.io/plugins/plugin-github)
    - [Python csv module](https://docs.python.org/3/library/csv.html)
  tags:
    - Business
  subTags:
    - on-call
    - scheduling
    - coverage
    - alerts
  ee: false
  demo: false
