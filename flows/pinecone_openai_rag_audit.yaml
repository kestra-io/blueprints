id: pinecone_openai_rag_audit
namespace: company.ai

triggers:
  - id: daily_rag_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 0 * * *"

tasks:
  - id: generate_embedding
    type: io.kestra.plugin.openai.embeddings.Create
    apiKey: "{{ secret('OPENAI_API_KEY') }}"
    model: text-embedding-3-small
    input: "System integrity check and vector index health probe"

  - id: query_vector_health
    type: io.kestra.plugin.pinecone.Query
    apiKey: "{{ secret('PINECONE_API_KEY') }}"
    indexName: "knowledge-base"
    vector: "{{ outputs.generate_embedding.embedding }}"
    topK: 10

  - id: analyze_vector_density
    type: io.kestra.plugin.scripts.python.Script
    inputFiles:
      matches.json: "{{ outputs.query_vector_health.uri }}"
    script: |
      import json, sys
      with open('matches.json') as f:
          data = json.load(f)
      
      matches = data.get('matches', [])
      low_score_count = sum(1 for m in matches if m.get('score', 0) < 0.70)
      status = "ANOMALY" if low_score_count > 3 else "HEALTHY"
      
      import io.kestra.Kestra as Kestra
      Kestra.outputs({"status": status, "low_score_count": low_score_count})

  - id: evaluate_audit_status
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.analyze_vector_density.vars.status == 'ANOMALY' }}"
    then:
      - id: notify_ai_team
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "⚠️ *Pinecone RAG Vector Drift Detected!*\nLow relevance matches: {{ outputs.analyze_vector_density.vars.low_score_count }}\n👉 Review & re-index in Kestra UI"
          }

      - id: pause_for_reindex_approval
        type: io.kestra.plugin.core.flow.Pause
        description: "Pause flow execution to wait for AI engineer approval before triggering vector re-indexing."
        onResume:
          - id: approve_reindex
            type: BOOLEAN
            description: "Approve re-indexing trigger?"
            defaults: true

      - id: trigger_reindex_branch
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.pause_for_reindex_approval.onResume.approve_reindex == true }}"
        then:
          - id: log_reindex_started
            type: io.kestra.plugin.core.log.Log
            message: "Re-indexing sequence approved and initialized."
    else:
      - id: log_healthy_status
        type: io.kestra.plugin.core.log.Log
        message: "Vector store index health is within optimal range."

extend:
  title: Pinecone Vector Database RAG Index Audit & Human Approval Flow
  metaTitle: Pinecone & OpenAI RAG Vector Index Audit | Kestra Blueprints
  shortDescription: Audits OpenAI vector embeddings in Pinecone, detects similarity score anomalies, and gates re-indexing on human approval.
  metaDescription: Automated Pinecone vector database RAG index audit with OpenAI embeddings and Kestra Pause task human approval gates.
  description: |
    Automated health monitoring and quality evaluation workflow for Retrieval-Augmented Generation (RAG) vector stores using OpenAI and Pinecone.
    
    ## How it works
    1. Scheduled daily execution generates a test vector embedding using OpenAI `text-embedding-3-small`.
    2. Queries Pinecone index `knowledge-base` to evaluate similarity scores.
    3. Python task measures match density and flags embedding drift anomalies.
    4. Conditional `If` task alerts the team via Slack and pauses for human approval before triggering vector re-indexing.
    
    ## What you get
    - Continuous vector embedding quality monitoring.
    - Automated Slack alerting for RAG performance degradation.
    - Human-in-the-loop governance for costly re-indexing pipelines.
    
    ## Who it's for
    - AI Engineers & LLM Developers
    - MLOps Engineers
    - Data Platform Teams
    
    ## Why orchestrate this with Kestra
    - Native OpenAI and Pinecone task integration.
    - Safe execution control using `Pause` tasks.
    - Declarative YAML configuration.
    
    ## Prerequisites
    - OpenAI API Key.
    - Pinecone account and active vector index.
    - Slack incoming webhook endpoint.
    
    ### Secrets
    `OPENAI_API_KEY`: OpenAI API Key.
    `PINECONE_API_KEY`: Pinecone API key.
    `SLACK_WEBHOOK_URL`: Slack webhook endpoint.
    
    ## Quick start
    1. Configure `OPENAI_API_KEY`, `PINECONE_API_KEY`, and `SLACK_WEBHOOK_URL` in your Kestra secrets.
    2. Import this blueprint and click **Execute**.
    
    ## Links
    - [Kestra OpenAI Plugin Docs](https://kestra.io/plugins/plugin-openai)
    - [Kestra Pinecone Plugin Docs](https://kestra.io/plugins/plugin-pinecone)
  tags:
    - AI
  subTags:
    - Vector Databases & RAG
  ee: false
  demo: false