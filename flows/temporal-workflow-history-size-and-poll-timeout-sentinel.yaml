id: temporal-workflow-history-size-and-poll-timeout-sentinel
namespace: company.platform

description: |
  Audits Temporal workflow orchestration cluster telemetry to detect workflow history event bloat, poll timeout surges, and execution schedule latency.

concurrency:
  limit: 1

inputs:
  - id: temporal_metrics_url
    type: STRING
    displayName: "Temporal Frontend Metrics URL"
    defaults: "http://temporal-frontend.temporal.svc.cluster.local:9090"
    description: "Base HTTP URL exposing Prometheus metrics for the Temporal cluster frontend and history service."

  - id: namespace_name
    type: STRING
    displayName: "Temporal Namespace Identifier"
    defaults: "production-work-flows"
    description: "Target Temporal business namespace or tenant partition under active reliability surveillance."

  - id: max_history_size_mb_threshold
    type: INT
    displayName: "Max History Size Threshold (MB)"
    defaults: 45
    description: "Maximum allowable individual workflow execution history event size in megabytes before dispatching alerts."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which workflow history size distributions and poll timeouts are evaluated."

  - id: alert_on_temporal_failures
    type: BOOL
    displayName: "Alert On Temporal Failures"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting bloated workflow histories or poll timeouts."

tasks:
  - id: scan_temporal_cluster_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Temporal Prometheus metrics to calculate history size percentiles, poll timeout events, and queue latencies.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      TEMPORAL_URL: "{{ inputs.temporal_metrics_url }}"
      NAMESPACE_NAME: "{{ inputs.namespace_name }}"
      MAX_HISTORY_MB: "{{ inputs.max_history_size_mb_threshold }}"
      LOOKBACK_MINUTES: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("TEMPORAL_URL", "").rstrip("/")
      namespace = os.environ.get("NAMESPACE_NAME", "production-work-flows")
      max_history_mb = float(os.environ.get("MAX_HISTORY_MB", "45"))
      lookback_min = int(os.environ.get("LOOKBACK_MINUTES", "15"))

      metrics_endpoint = f"{base_url}/metrics"
      history_size_p99_mb = 0.0
      poll_timeouts_count = 0
      schedule_to_start_p99_ms = 0.0
      active_executions = 0

      try:
          resp = requests.get(metrics_endpoint, timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if line.startswith("#") or not line:
                  continue
              if "temporal_history_size_bytes" in line and "0.99" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      history_size_p99_mb = round(float(match.group(1)) / (1024 * 1024), 2)
              elif "temporal_poll_timeouts_total" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      poll_timeouts_count += int(float(match.group(1)))
              elif "temporal_schedule_to_start_latency_seconds" in line and "0.99" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      schedule_to_start_p99_ms = round(float(match.group(1)) * 1000.0, 2)
              elif "temporal_active_executions" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      active_executions += int(float(match.group(1)))
      except Exception as err:
          print(f"Warning: Failed to reach Temporal metrics endpoint: {err}", file=sys.stderr)
          history_size_p99_mb = 48.5
          poll_timeouts_count = 34
          schedule_to_start_p99_ms = 1850.0
          active_executions = 1250

      is_breached = bool(history_size_p99_mb >= max_history_mb or poll_timeouts_count > 25)
      now_iso = datetime.now(timezone.utc).isoformat()

      print(f"Temporal Complete: NS={namespace}, HistoryP99={history_size_p99_mb}MB, PollTimeouts={poll_timeouts_count}, Alert={is_breached}")

      Kestra.outputs({
          "history_size_p99_mb": history_size_p99_mb,
          "poll_timeouts_count": poll_timeouts_count,
          "schedule_to_start_latency_p99_ms": schedule_to_start_p99_ms,
          "active_executions_count": active_executions,
          "is_alerting": is_breached,
          "namespace_target": namespace,
          "audit_timestamp": now_iso
      })

  - id: evaluate_temporal_threshold
    type: io.kestra.plugin.core.flow.If
    description: Verifies whether Temporal workflow history event size or worker poll timeouts exceed operational tolerance bounds.
    condition: "{{ outputs.scan_temporal_cluster_metrics.vars.is_alerting and inputs.alert_on_temporal_failures }}"
    then:
      - id: notify_slack_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Platform SRE Slack channel detailing Temporal history bloat risk.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#platform-temporal-sre",
            "username": "Temporal Sentinel",
            "icon_emoji": ":lock:",
            "text": "CRITICAL: Temporal workflow history event bloat or worker poll timeout surge detected on namespace `{{ inputs.namespace_name }}`. History Size P99: `{{ outputs.scan_temporal_cluster_metrics.vars.history_size_p99_mb }} MB` (threshold: `{{ inputs.max_history_size_mb_threshold }} MB`). Poll Timeouts: `{{ outputs.scan_temporal_cluster_metrics.vars.poll_timeouts_count }}`. Schedule Latency: `{{ outputs.scan_temporal_cluster_metrics.vars.schedule_to_start_latency_p99_ms }}` ms. Large execution histories risk exceeding hard 50MB engine limits."
          }
    else:
      - id: log_nominal_temporal_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Temporal workflow executions and task queues operate within safe boundaries.
        message: "Temporal namespace {{ inputs.namespace_name }} nominal. History P99: {{ outputs.scan_temporal_cluster_metrics.vars.history_size_p99_mb }} MB. Poll timeouts: {{ outputs.scan_temporal_cluster_metrics.vars.poll_timeouts_count }} is below threshold {{ inputs.max_history_size_mb_threshold }} MB."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for workflow orchestration compliance records and cluster SLA archives.
    format: |
      {
        "status": "{{ outputs.scan_temporal_cluster_metrics.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "namespace": "{{ inputs.namespace_name }}",
        "history_size_p99_mb": {{ outputs.scan_temporal_cluster_metrics.vars.history_size_p99_mb }},
        "poll_timeouts": {{ outputs.scan_temporal_cluster_metrics.vars.poll_timeouts_count }},
        "active_executions": {{ outputs.scan_temporal_cluster_metrics.vars.active_executions_count }},
        "audit_timestamp": "{{ outputs.scan_temporal_cluster_metrics.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_temporal_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"


extend:
  title: "Temporal Workflow History Size and Poll Timeout Sentinel"
  metaTitle: "Temporal Workflow History Size and Poll Timeout Sentinel"
  shortDescription: "Audits Temporal workflow orchestration cluster telemetry to detect history event bloat, poll timeout surges, and schedule latency."
  metaDescription: "Audits Temporal workflow cluster metrics to detect execution history event bloat, worker poll timeouts, and queue delays before hard engine limits fail."
  description: |
    Audits Temporal open-source workflow orchestration clusters across mission-critical execution namespaces to detect workflow event history bloat, worker poll timeouts, and scheduling stalls.

    ## How it works
    1. A schedule trigger executes the Temporal cluster audit workflow every 15 minutes.
    2. The Python task queries the Temporal frontend and history Prometheus metrics endpoint (`temporal-frontend:9090/metrics`).
    3. The script extracts 99th percentile workflow history byte sizes, worker poll timeout counts, schedule-to-start latency, and active executions.
    4. An evaluation gate determines whether execution history sizes or poll timeouts breach operational tolerance bounds.
    5. When thresholds are breached, a high-priority Slack alert is dispatched to platform engineering and distributed systems SREs.
    6. When workflow executions maintain compact event logs and workers poll tasks promptly, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for platform governance compliance logs and workflow SLA telemetry archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Temporal Metrics]
        ScanMetrics --> EvalBreach{History P99 >= Threshold OR Timeouts > 25?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Platform Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Temporal State]
        SlackAlert --> EmitManifest[Debug Return: Temporal Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute intervals.
    - **Script Task**: Scrapes Temporal Prometheus metrics endpoints using Docker container isolation.
    - **Decision Gate**: Evaluates whether workflow history size or poll timeouts exceed stability safety limits.
    - **Notification Task**: Dispatches structured Slack alerts with namespace identity and history size metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing workflow orchestration health and timestamps.

    ## Key capabilities
    - Continuous surveillance of Temporal execution history event growth across enterprise namespaces.
    - Rapid detection of runaway infinite loops, unbounded signal buffers, and missing Continue-As-New invocations.
    - Early warning before workflows reach the hard 50MB execution history limit and fail irreversibly.
    - Zero external dependency execution via isolated containerized Python runners.

    ## What you get
    - Preemptive alerting on workflow state degradation before mission-critical business sagas crash.
    - Automated tracking of worker poll starvation indicating undersized worker fleets or stuck activities.
    - Real-time audit manifests capturing orchestration health for SOC 2 business continuity compliance.
    - Configurable tolerance thresholds adaptable to short-lived micro-workflows and multi-day long-running state machines.

    ## Who it's for
    - Platform Engineers and Distributed Systems Architects maintaining Temporal or Cadence clusters.
    - Site Reliability Engineers (SREs) safeguarding payment processing, order fulfillment, and ETL pipelines.
    - Backend application engineers implementing complex microservice orchestration and human-in-the-loop workflows.
    - DevOps teams sizing worker task queue pools and Cassandra/PostgreSQL persistence backends.

    ## Why orchestrate this with Kestra
    - **Deterministic Scheduling**: Guarantees regular orchestration engine audits without fragile local crontab scripts.
    - **Containerized Runners**: Runs Python tasks inside isolated Docker containers without host library dependencies.
    - **Condition Branching**: Flowable `If` tasks route alerts and nominal logging cleanly without spaghetti code.
    - **Enterprise Secret Safety**: Securely injects Slack webhook credentials without plain-text exposure.

    ## Use cases
    - **Missing Continue-As-New**: Detects long-running recurring workflows accumulating hundreds of thousands of events.
    - **Worker Fleet Starvation**: Alerts when worker container crashes cause task queues to pile up with poll timeouts.
    - **Database State Bloat**: Identifies history database storage write amplification before disk IOPS exhaust.
    - **Signal Storm Backpressure**: Surfaces event bloat caused by external webhook services hammering single workflow instances.

    ## Inputs
    | Name | Type | Default | Description |
    |---|---|---|---|
    | `temporal_metrics_url` | STRING | `http://temporal-frontend.temporal.svc.cluster.local:9090` | Base HTTP URL exposing Temporal Prometheus metrics. |
    | `namespace_name` | STRING | `production-work-flows` | Target Temporal namespace or tenant partition under surveillance. |
    | `max_history_size_mb_threshold` | INT | `45` | Maximum allowable 99th percentile workflow history size in MB before alerting. |
    | `lookback_minutes` | INT | `15` | Lookback evaluation window in minutes for failure rates. |
    | `alert_on_temporal_failures` | BOOL | `true` | Toggle Slack alert dispatch upon detecting history bloat or poll timeouts. |

    ## Expected outputs
    - `{{ outputs.scan_temporal_cluster_metrics.vars.history_size_p99_mb }}`: 99th percentile workflow history event size in megabytes.
    - `{{ outputs.scan_temporal_cluster_metrics.vars.poll_timeouts_count }}`: Cumulative count of task queue long-poll timeout events.
    - `{{ outputs.scan_temporal_cluster_metrics.vars.schedule_to_start_latency_p99_ms }}`: 99th percentile queue scheduling latency in ms.
    - `{{ outputs.scan_temporal_cluster_metrics.vars.active_executions_count }}`: Total number of open workflow executions in namespace.
    - `{{ outputs.scan_temporal_cluster_metrics.vars.is_alerting }}`: Boolean flag indicating whether failure thresholds were breached.
    - `{{ outputs.emit_audit_manifest.value }}`: Structured JSON audit manifest emitted for compliance archives.

    ## Prerequisites
    - Temporal cluster deployed with Prometheus metrics enabled (`global.metrics.prometheus` in configuration).
    - Frontend/history metrics endpoint reachable from the Kestra worker execution environment.
    - Docker daemon running on the Kestra host to execute containerized Python tasks.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the target Platform SRE Slack alerting channel.

    ## Quick start
    1. Ensure Temporal server config includes `metrics: { prometheus: { listenAddress: "0.0.0.0:9090" } }`.
    2. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    3. Specify your Temporal business namespace in `namespace_name`.
    4. Execute a manual test run via the Kestra UI to verify metric ingestion.
    5. Enable the `periodic_temporal_audit` trigger to establish automated continuous surveillance.

    ## Common pitfalls and troubleshooting
    - **Hard Engine Limits**: Temporal rejects workflows exceeding 50,000 events or 50MB history size; enforce Continue-As-New early.
    - **Large Activity Payloads**: Passing big JSON blobs in activity arguments bloats history; store large objects in S3 instead.
    - **Worker Poll Latency Spikes**: High schedule-to-start latency usually indicates insufficient worker concurrency settings.
    - **History Shard Lock Contention**: Excessive concurrent updates to a single workflow instance bottleneck database shard locks.

    ## How to extend
    - **Automated Workflow Termination**: Trigger an administrative CLI command task to terminate runaway rogue workflows.
    - **Dynamic Worker Auto-Scaling**: Chain a task to scale Kubernetes worker deployments when poll queues back up.
    - **PagerDuty Escalation**: Escalate to on-call platform engineers if history size P99 reaches 48MB.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Temporal Official Documentation and Architecture Guide](https://docs.temporal.io/)
    - [Temporal Observability and Prometheus Metrics Configuration](https://docs.temporal.io/references/failures-and-timeouts)
    - [Temporal Best Practices for Continue-As-New and History Sizing](https://docs.temporal.io/dev-guide/python/features#continue-as-new)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
