id: camunda-bpmn-deploy-smoke-gate
namespace: company.team
description: Deploy a bounded staging canary BPMN model, drive one uniquely correlated message and prove its exact process
  instance completed.
concurrency:
  limit: 1
  behavior: QUEUE
inputs:
- id: runner_network
  type: STRING
  defaults: ''
  description: Optional Docker runner network for private staging endpoints. Empty uses the worker default.
- id: camunda_rest_address
  type: STRING
  defaults: '{{ secret(''CAMUNDA_REST_ADDRESS'') }}'
  description: Dedicated staging Camunda 8 cluster REST API. Never point at a production process cluster.
- id: camunda_username
  type: STRING
  defaults: '{{ secret(''CAMUNDA_USERNAME'') }}'
- id: camunda_password
  type: STRING
  defaults: '{{ secret(''CAMUNDA_PASSWORD'') }}'
- id: canary_process_id
  type: STRING
  defaults: canary_smoke
  description: Exact dedicated canary_ BPMN process ID. Restricts side effects and deployment scope.
- id: bpmn_content
  type: STRING
  defaults: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<definitions xmlns=\"http://www.omg.org/spec/BPMN/20100524/MODEL\"\
    \ xmlns:zeebe=\"http://camunda.org/schema/zeebe/1.0\" targetNamespace=\"http://example.org/canary\">\n  <message id=\"\
    smoke_message\" name=\"canary_smoke_continue\"><extensionElements><zeebe:subscription correlationKey=\"=canaryCorrelationKey\"\
    \ /></extensionElements></message>\n  <process id=\"canary_smoke\" isExecutable=\"true\">\n    <startEvent id=\"start\"\
    ><outgoing>flow1</outgoing></startEvent>\n    <intermediateCatchEvent id=\"wait\"><incoming>flow1</incoming><outgoing>flow2</outgoing><messageEventDefinition\
    \ messageRef=\"smoke_message\" /></intermediateCatchEvent>\n    <endEvent id=\"end\"><incoming>flow2</incoming></endEvent>\n\
    \    <sequenceFlow id=\"flow1\" sourceRef=\"start\" targetRef=\"wait\" />\n    <sequenceFlow id=\"flow2\" sourceRef=\"\
    wait\" targetRef=\"end\" />\n  </process>\n</definitions>"
  description: At most 64 KiB. One plain start, one message catch and one end. Task, call, timer, signal and script elements
    are refused.
- id: message_name
  type: STRING
  defaults: canary_smoke_continue
  description: Expected catch message name. Must match the staged BPMN.
- id: receipt_key
  type: STRING
  defaults: camunda_canary_smoke
  description: Stable dedicated KV receipt key for this cluster/process. Change it only to force a reviewed new test.
- id: verify_seconds
  type: INT
  defaults: 30
  min: 10
  max: 60
- id: dry_run
  type: BOOL
  defaults: true
- id: auto_remediate
  type: BOOL
  defaults: false
- id: slack_webhook_url
  type: STRING
  defaults: "{{ secret('SLACK_WEBHOOK_URL') }}"
variables:
  reader_script: "import base64,hashlib,json,os,pathlib,time,urllib.request,urllib.parse,xml.etree.ElementTree as ET\nROOT=pathlib.Path('.')\n\
    BASE=os.environ['BASE'].rstrip('/')\nUSER=os.environ['USER'];PASSWORD=os.environ['PASSWORD']\nHEADERS={'Content-Type':'application/json'}\n\
    if USER or PASSWORD:\n    if not USER or not PASSWORD: raise RuntimeError('Both basic authentication fields are required')\n\
    \    HEADERS['Authorization']='Basic '+base64.b64encode((USER+':'+PASSWORD).encode()).decode()\ndef api(path,body=None):\n\
    \    req=urllib.request.Request(BASE+path,data=(json.dumps(body).encode() if body is not None else None),headers=HEADERS)\n\
    \    with urllib.request.urlopen(req,timeout=10) as r: return json.load(r)\ndef save(name,data): (ROOT/name).write_text(json.dumps(data,sort_keys=True))\n\
    def marker(data):print('::'+json.dumps({'outputs':data})+'::',flush=True)\ndef definitions(pid):\n    d=api('/v2/process-definitions/search',{'filter':{'processDefinitionId':pid},'page':{'limit':51}})\n\
    \    if d['page'].get('hasMoreTotalItems') or len(d['items'])>50:raise RuntimeError('Canary has more than 50 retained\
    \ versions. Retire versions through reviewed engine operations')\n    return sorted([{'key':x['processDefinitionKey'],'version':x['version'],'state':x['state']}\
    \ for x in d['items']],key=lambda x:x['version'])\nmode=os.environ['MODE']\nif mode in ['plan','recheck']:\n    raw=(ROOT/'model.bpmn').read_bytes()\n\
    \    if len(raw)>65536:raise RuntimeError('BPMN exceeds 64 KiB limit')\n    tree=ET.fromstring(raw)\n    B='{http://www.omg.org/spec/BPMN/20100524/MODEL}'\n\
    \    process=tree.findall(B+'process')\n    if len(process)!=1 or process[0].get('isExecutable')!='true':raise RuntimeError('Exactly\
    \ one executable process is required')\n    pid=process[0].get('id','')\n    if pid!=os.environ['PROCESS_ID'] or not pid.startswith('canary_'):raise\
    \ RuntimeError('Only the exact canary_ process ID is allowed')\n    allowed={'definitions','process','message','extensionElements','subscription','sequenceFlow','startEvent','intermediateCatchEvent','messageEventDefinition','endEvent','incoming','outgoing','documentation'}\n\
    \    for node in tree.iter():\n        if node.tag.split('}')[-1] not in allowed:raise RuntimeError('Unsupported side-effect-capable\
    \ BPMN element: '+node.tag)\n    starts=process[0].findall(B+'startEvent');ends=process[0].findall(B+'endEvent');waits=process[0].findall(B+'intermediateCatchEvent')\n\
    \    if len(starts)!=1 or len(ends)!=1 or len(waits)!=1 or list(starts[0])!=[starts[0].find(B+'outgoing')]:raise RuntimeError('Canary\
    \ needs one plain start, one message catch and one end')\n    if waits[0].find(B+'messageEventDefinition') is None:raise\
    \ RuntimeError('Canary catch must be a message')\n    messages=tree.findall(B+'message')\n    flows=process[0].findall(B+'sequenceFlow')\n\
    \    if len(messages)!=1 or len(flows)!=2:raise RuntimeError('Canary needs exactly one message and two sequence flows')\n\
    \    edges={(x.get('sourceRef'),x.get('targetRef')) for x in flows}\n    if edges!={(starts[0].get('id'),waits[0].get('id')),(waits[0].get('id'),ends[0].get('id'))}:raise\
    \ RuntimeError('Canary must follow one linear start-message-end path')\n    if any(x.tag.split('}')[-1].endswith('EventDefinition')\
    \ for x in starts[0]):raise RuntimeError('Only a plain start is allowed')\n    topology=api('/v2/topology')\n    if not\
    \ topology.get('clusterId'):raise RuntimeError('Camunda cluster ID is required')\n    result={'cluster_id':topology['clusterId'],'process_id':pid,'bpmn_sha256':hashlib.sha256(raw).hexdigest(),'definitions':definitions(pid),'endpoint':BASE}\n\
    \    if mode=='recheck':\n        original=json.loads((ROOT/'approved-plan.json').read_text())\n        if original!=result:raise\
    \ RuntimeError('Approved cluster, BPMN or canary definition versions changed')\n        fresh=(ROOT/'active.json').read_text().strip()\n\
    \        approved=(ROOT/'approved-active.json').read_text().strip()\n        if fresh!=approved:raise RuntimeError('Residual\
    \ canary key changed during approval. Re-plan instead of writing')\n        if fresh:\n            held=json.loads(fresh)\n\
    \            still=api('/v2/process-instances/search',{'filter':{'processInstanceKey':str(held['instance_key'])},'page':{'limit':2}})\n\
    \            if len(still['items'])!=1 or still['items'][0]['state'] not in ['COMPLETED','TERMINATED']:raise RuntimeError('Residual\
    \ canary became active during approval')\n    save('plan.json',result);marker(result)\n\
    elif mode=='receipt':\n    plan=json.loads((ROOT/'approved-plan.json').read_text())\n    receipt_raw=(ROOT/'receipt.json').read_text().strip()\n\
    \    active_raw=(ROOT/'active.json').read_text().strip()\n    receipt=json.loads(receipt_raw) if receipt_raw else {}\n\
    \    active=json.loads(active_raw) if active_raw else {}\n    if active:\n        if active.get('cluster_id')!=plan['cluster_id']:raise\
    \ RuntimeError('Residual canary receipt belongs to another cluster. Inspect it before replacement')\n        previous=api('/v2/process-instances/search',{'filter':{'processInstanceKey':str(active['instance_key'])},'page':{'limit':2}})\n\
    \        if len(previous['items'])!=1 or previous['items'][0]['state'] not in ['COMPLETED','TERMINATED']:\n            raise\
    \ RuntimeError('Residual created canary is still active or unknown. Reconcile its saved key before creating another')\n\
    \        if str(previous['items'][0]['processDefinitionKey'])!=str(active['definition_key']):raise RuntimeError('Residual\
    \ instance identity mismatch')\n    matching=bool(receipt and receipt.get('cluster_id')==plan['cluster_id'] and receipt.get('bpmn_sha256')==plan['bpmn_sha256']\
    \ and receipt.get('process_id')==plan['process_id'] and receipt.get('message_name')==os.environ['MESSAGE_NAME'])\n   \
    \ if matching:\n        previous=api('/v2/process-instances/search',{'filter':{'processInstanceKey':str(receipt['instance_key'])},'page':{'limit':2}})\n\
    \        definitions_now=api('/v2/process-definitions/search',{'filter':{'processDefinitionKey':str(receipt['definition_key'])},'page':{'limit':2}})\n\
    \        correlations=api('/v2/correlated-message-subscriptions/search',{'filter':{'processInstanceKey':str(receipt['instance_key'])},'page':{'limit':2}})\n\
    \        matching=bool(len(previous['items'])==1 and previous['items'][0]['state']=='COMPLETED' and str(previous['items'][0]['processDefinitionKey'])==str(receipt['definition_key'])\
    \ and len(definitions_now['items'])==1 and definitions_now['items'][0]['state']=='ACTIVE' and any(str(x['messageKey'])==str(receipt['message_key'])\
    \ and x['correlationKey']==receipt['execution_id'] for x in correlations['items']))\n        save('receipt-check.json',{'receipt':receipt,'instances':previous,'definitions':definitions_now,'correlations':correlations,'matching':matching})\n\
    \    marker({'needs_test':not matching,'residual_terminal':bool(active)})\nelif mode in ['subscription','outcome','cleanup_inspect','cleanup_verify']:\n\
    \    key=os.environ['INSTANCE'];definition=os.environ['DEFINITION'];correlation=os.environ['CORRELATION']\n    if not\
    \ key or not definition:raise RuntimeError('Owned instance and definition keys required')\n    deadline=time.monotonic()+int(os.environ['VERIFY_SECONDS'])\n\
    \    while True:\n        d=api('/v2/process-instances/search',{'filter':{'processInstanceKey':key},'page':{'limit':2}})\n\
    \        if len(d['items'])>1:raise RuntimeError('Instance key returned multiple instances')\n        instance=d['items'][0]\
    \ if d['items'] else None\n        if instance and (str(instance['processDefinitionKey'])!=definition or instance['processDefinitionId']!=os.environ['PROCESS_ID']):raise\
    \ RuntimeError('Owned instance identity changed')\n        if mode=='subscription':\n            subs=api('/v2/message-subscriptions/search',{'filter':{'processInstanceKey':key},'page':{'limit':2}})\n\
    \            good=[x for x in subs['items'] if str(x['processDefinitionKey'])==definition and x['correlationKey']==correlation\
    \ and x['messageName']==os.environ['MESSAGE_NAME'] and x['messageSubscriptionState']=='CREATED']\n            if len(good)==1\
    \ and instance and instance['state']=='ACTIVE':\n                save('subscription.json',{'instance':instance,'subscriptions':subs});marker({'subscription_ready':True});break\n\
    \        elif mode=='outcome':\n            correlations=api('/v2/correlated-message-subscriptions/search',{'filter':{'processInstanceKey':key},'page':{'limit':2}})\n\
    \            good=[x for x in correlations['items'] if str(x['processDefinitionKey'])==definition and x['correlationKey']==correlation\
    \ and x['messageName']==os.environ['MESSAGE_NAME'] and str(x['messageKey'])==os.environ['MESSAGE_KEY']]\n            result={'instance':instance,'correlations':correlations}\n\
    \            if instance and instance['state']=='COMPLETED' and not instance['hasIncident'] and len(good)==1:\n      \
    \          save('outcome.json',result);marker({'completed':True,'instance_key':key,'definition_key':definition});break\n\
    \        elif mode=='cleanup_inspect':\n            result={'instance':instance,'should_cancel':bool(instance and instance['state']=='ACTIVE')}\n\
    \            save('cleanup.json',result);marker({'should_cancel':result['should_cancel']});break\n        else:\n    \
    \        if instance and instance['state']=='TERMINATED':save('cleanup.json',{'instance':instance});marker({'terminated':True});break\n\
    \        if time.monotonic()>=deadline:\n            save('unresolved.json',{'instance':instance,'subscriptions':subs\
    \ if mode=='subscription' else None,'correlations':correlations if mode=='outcome' else None})\n            raise RuntimeError('Owned\
    \ canary did not reach required '+mode+' state within bound')\n        time.sleep(2)\nelse:raise RuntimeError('Unknown\
    \ read mode')\n"
tasks:
- id: plan
  type: io.kestra.plugin.scripts.python.Script
  containerImage: python:3.12-slim
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
    networkMode: '{{ inputs.runner_network }}'
  timeout: PT90S
  env:
    BASE: '{{ inputs.camunda_rest_address }}'
    USER: '{{ inputs.camunda_username }}'
    PASSWORD: '{{ inputs.camunda_password }}'
    MODE: plan
    MESSAGE_NAME: '{{ inputs.message_name }}'
    PROCESS_ID: '{{ inputs.canary_process_id }}'
    VERIFY_SECONDS: '{{ inputs.verify_seconds }}'
  script: '{{ vars.reader_script }}'
  outputFiles:
  - '*.json'
  inputFiles:
    model.bpmn: '{{ inputs.bpmn_content }}'
- id: read_receipt
  type: io.kestra.plugin.core.kv.Get
  key: '{{ inputs.receipt_key }}'
  errorOnMissing: false
- id: read_active
  type: io.kestra.plugin.core.kv.Get
  key: '{{ inputs.receipt_key }}_active'
  errorOnMissing: false
- id: receipt_check
  type: io.kestra.plugin.scripts.python.Script
  containerImage: python:3.12-slim
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
    networkMode: '{{ inputs.runner_network }}'
  timeout: PT90S
  env:
    BASE: '{{ inputs.camunda_rest_address }}'
    USER: '{{ inputs.camunda_username }}'
    PASSWORD: '{{ inputs.camunda_password }}'
    MODE: receipt
    MESSAGE_NAME: '{{ inputs.message_name }}'
    PROCESS_ID: '{{ inputs.canary_process_id }}'
    VERIFY_SECONDS: '{{ inputs.verify_seconds }}'
  script: '{{ vars.reader_script }}'
  outputFiles:
  - '*.json'
  inputFiles:
    approved-plan.json: '{{ read(outputs.plan.outputFiles["plan.json"]) }}'
    receipt.json: '{{ outputs.read_receipt.value ?? '''' }}'
    active.json: '{{ outputs.read_active.value ?? '''' }}'
- id: needs_test
  type: io.kestra.plugin.core.flow.If
  condition: '{{ outputs.receipt_check.vars.needs_test }}'
  then:
  - id: report
    type: io.kestra.plugin.core.log.Log
    message: New or changed staging canary requires smoke proof. Planned cluster {{ outputs.plan.vars.cluster_id }} model
      SHA {{ outputs.plan.vars.bpmn_sha256 }}. Existing versions {{ outputs.plan.vars.definitions | toJson }}.
  - id: mode
    type: io.kestra.plugin.core.flow.If
    condition: '{{ inputs.auto_remediate and not inputs.dry_run }}'
    then:
    - id: approval
      type: io.kestra.plugin.core.flow.Pause
      pauseDuration: PT30M
      behavior: FAIL
      description: Deploy one retained staging canary version and create one isolated message-driven canary. Completed history
        and deployment remain. Approve only after reading model and exact staging endpoint.
      onResume:
      - id: approved
        type: BOOL
        required: false
    - id: approved
      type: io.kestra.plugin.core.flow.If
      condition: '{{ outputs.approval.onResume.approved ?? false }}'
      then:
      - id: reread_active
        type: io.kestra.plugin.core.kv.Get
        key: '{{ inputs.receipt_key }}_active'
        errorOnMissing: false
      - id: recheck
        type: io.kestra.plugin.scripts.python.Script
        containerImage: python:3.12-slim
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          networkMode: '{{ inputs.runner_network }}'
        timeout: PT90S
        env:
          BASE: '{{ inputs.camunda_rest_address }}'
          USER: '{{ inputs.camunda_username }}'
          PASSWORD: '{{ inputs.camunda_password }}'
          MODE: recheck
          MESSAGE_NAME: '{{ inputs.message_name }}'
          PROCESS_ID: '{{ inputs.canary_process_id }}'
          VERIFY_SECONDS: '{{ inputs.verify_seconds }}'
        script: '{{ vars.reader_script }}'
        outputFiles:
        - '*.json'
        inputFiles:
          model.bpmn: '{{ inputs.bpmn_content }}'
          approved-plan.json: '{{ read(outputs.plan.outputFiles["plan.json"]) }}'
          active.json: '{{ outputs.reread_active.value ?? '''' }}'
          approved-active.json: '{{ outputs.read_active.value ?? '''' }}'
      - id: deploy
        type: io.kestra.plugin.camunda.Deploy
        restAddress: '{{ inputs.camunda_rest_address }}'
        username: '{{ inputs.camunda_username }}'
        password: '{{ inputs.camunda_password }}'
        timeout: PT30S
        resources:
          canary.bpmn: '{{ inputs.bpmn_content }}'
      - id: deployed_scope
        type: io.kestra.plugin.core.execution.Assert
        conditions:
        - '{{ (outputs.deploy.processes | length) == 1 and outputs.deploy.processes[0].bpmnProcessId == inputs.canary_process_id
          }}'
        errorMessage: Native deployment did not return the exact single canary process.
      - id: start_canary
        type: io.kestra.plugin.camunda.CreateProcessInstance
        restAddress: '{{ inputs.camunda_rest_address }}'
        username: '{{ inputs.camunda_username }}'
        password: '{{ inputs.camunda_password }}'
        timeout: PT30S
        processDefinitionKey: '{{ outputs.deploy.processes[0].processDefinitionKey }}'
        awaitCompletion: false
        requestTimeout: PT10S
        variables:
          canaryCorrelationKey: '{{ execution.id }}'
          kestraExecutionId: '{{ execution.id }}'
      - id: save_instance
        type: io.kestra.plugin.core.kv.Set
        key: '{{ inputs.receipt_key }}_active'
        value: '{{ {''instance_key'': outputs.start_canary.processInstanceKey, ''definition_key'': outputs.deploy.processes[0].processDefinitionKey,
          ''execution_id'': execution.id, ''cluster_id'': outputs.plan.vars.cluster_id} | toJson }}'
      - id: waiting_subscription
        type: io.kestra.plugin.scripts.python.Script
        containerImage: python:3.12-slim
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          networkMode: '{{ inputs.runner_network }}'
        timeout: PT90S
        env:
          BASE: '{{ inputs.camunda_rest_address }}'
          USER: '{{ inputs.camunda_username }}'
          PASSWORD: '{{ inputs.camunda_password }}'
          MODE: subscription
          MESSAGE_NAME: '{{ inputs.message_name }}'
          PROCESS_ID: '{{ inputs.canary_process_id }}'
          VERIFY_SECONDS: '{{ inputs.verify_seconds }}'
          INSTANCE: '{{ outputs.start_canary.processInstanceKey }}'
          DEFINITION: '{{ outputs.deploy.processes[0].processDefinitionKey }}'
          CORRELATION: '{{ execution.id }}'
          MESSAGE_KEY: '{{ outputs.publish.messageKey ?? '''' }}'
        script: '{{ vars.reader_script }}'
        outputFiles:
        - '*.json'
      - id: publish
        type: io.kestra.plugin.camunda.PublishMessage
        restAddress: '{{ inputs.camunda_rest_address }}'
        username: '{{ inputs.camunda_username }}'
        password: '{{ inputs.camunda_password }}'
        timeout: PT30S
        messageName: '{{ inputs.message_name }}'
        correlationKey: '{{ execution.id }}'
        messageId: '{{ execution.id }}'
        timeToLive: PT0S
        variables:
          canaryDeliveredBy: '{{ execution.id }}'
      - id: prove_completion
        type: io.kestra.plugin.scripts.python.Script
        containerImage: python:3.12-slim
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          networkMode: '{{ inputs.runner_network }}'
        timeout: PT90S
        env:
          BASE: '{{ inputs.camunda_rest_address }}'
          USER: '{{ inputs.camunda_username }}'
          PASSWORD: '{{ inputs.camunda_password }}'
          MODE: outcome
          MESSAGE_NAME: '{{ inputs.message_name }}'
          PROCESS_ID: '{{ inputs.canary_process_id }}'
          VERIFY_SECONDS: '{{ inputs.verify_seconds }}'
          INSTANCE: '{{ outputs.start_canary.processInstanceKey }}'
          DEFINITION: '{{ outputs.deploy.processes[0].processDefinitionKey }}'
          CORRELATION: '{{ execution.id }}'
          MESSAGE_KEY: '{{ outputs.publish.messageKey ?? '''' }}'
        script: '{{ vars.reader_script }}'
        outputFiles:
        - '*.json'
      - id: save_receipt
        type: io.kestra.plugin.core.kv.Set
        key: '{{ inputs.receipt_key }}'
        value: '{{ {''cluster_id'': outputs.plan.vars.cluster_id, ''bpmn_sha256'': outputs.plan.vars.bpmn_sha256, ''process_id'':
          inputs.canary_process_id, ''message_name'': inputs.message_name, ''instance_key'': outputs.start_canary.processInstanceKey,
          ''definition_key'': outputs.deploy.processes[0].processDefinitionKey, ''execution_id'': execution.id, ''message_key'':
          outputs.publish.messageKey, ''completed'': true} | toJson }}'
      - id: clear_active
        type: io.kestra.plugin.core.kv.Delete
        key: '{{ inputs.receipt_key }}_active'
      - id: completed
        type: io.kestra.plugin.core.log.Log
        message: Exact staging canary {{ outputs.start_canary.processInstanceKey }} completed after message {{ outputs.publish.messageKey
          }} on deployed definition {{ outputs.deploy.processes[0].processDefinitionKey }}. Deployment and completed history
          remain.
      else:
      - id: declined
        type: io.kestra.plugin.core.log.Log
        message: Approval declined. No BPMN deployment, process instance or message was created.
    else:
    - id: dry_run
      type: io.kestra.plugin.core.log.Log
      message: Read-only plan. No deployment, instance or message created.
  else:
  - id: healthy_receipt
    type: io.kestra.plugin.core.log.Log
    message: Matching completed smoke receipt exists. No duplicate deployment or canary was created.
errors:
- id: cleanup_owned
  type: io.kestra.plugin.core.flow.If
  condition: '{{ outputs.start_canary.processInstanceKey is defined }}'
  then:
  - id: inspect_owned
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: '{{ inputs.runner_network }}'
    timeout: PT90S
    env:
      BASE: '{{ inputs.camunda_rest_address }}'
      USER: '{{ inputs.camunda_username }}'
      PASSWORD: '{{ inputs.camunda_password }}'
      MODE: cleanup_inspect
      MESSAGE_NAME: '{{ inputs.message_name }}'
      PROCESS_ID: '{{ inputs.canary_process_id }}'
      VERIFY_SECONDS: '{{ inputs.verify_seconds }}'
      INSTANCE: '{{ outputs.start_canary.processInstanceKey }}'
      DEFINITION: '{{ outputs.deploy.processes[0].processDefinitionKey }}'
      CORRELATION: '{{ execution.id }}'
      MESSAGE_KEY: '{{ outputs.publish.messageKey ?? '''' }}'
    script: '{{ vars.reader_script }}'
    outputFiles:
    - '*.json'
  - id: cancel_if_active
    type: io.kestra.plugin.core.flow.If
    condition: '{{ outputs.inspect_owned.vars.should_cancel ?? false }}'
    then:
    - id: cancel_canary
      type: io.kestra.plugin.camunda.CancelProcessInstance
      restAddress: '{{ inputs.camunda_rest_address }}'
      username: '{{ inputs.camunda_username }}'
      password: '{{ inputs.camunda_password }}'
      timeout: PT30S
      processInstanceKey: '{{ outputs.start_canary.processInstanceKey }}'
    - id: verify_cleanup
      type: io.kestra.plugin.scripts.python.Script
      containerImage: python:3.12-slim
      taskRunner:
        type: io.kestra.plugin.scripts.runner.docker.Docker
        networkMode: '{{ inputs.runner_network }}'
      timeout: PT90S
      env:
        BASE: '{{ inputs.camunda_rest_address }}'
        USER: '{{ inputs.camunda_username }}'
        PASSWORD: '{{ inputs.camunda_password }}'
        MODE: cleanup_verify
        MESSAGE_NAME: '{{ inputs.message_name }}'
        PROCESS_ID: '{{ inputs.canary_process_id }}'
        VERIFY_SECONDS: '{{ inputs.verify_seconds }}'
        INSTANCE: '{{ outputs.start_canary.processInstanceKey }}'
        DEFINITION: '{{ outputs.deploy.processes[0].processDefinitionKey }}'
        CORRELATION: '{{ execution.id }}'
        MESSAGE_KEY: '{{ outputs.publish.messageKey ?? '''' }}'
      script: '{{ vars.reader_script }}'
      outputFiles:
      - '*.json'
- id: failure_alert
  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
  url: '{{ inputs.slack_webhook_url }}'
  messageText: Camunda staging deployment smoke failed in {{ execution.id }}. Inspect native keys and cleanup evidence. Retained
    canary deployments are not rolled back. A timed-out create can leave an instance whose key was not returned; investigate
    the unique execution correlation before retrying.
triggers:
- id: staging_smoke_plan
  type: io.kestra.plugin.core.trigger.Schedule
  cron: 0 7 * * *
  disabled: true
  inputs:
    dry_run: true
    auto_remediate: false
extend:
  title: Smoke test a Camunda BPMN deployment before you trust it
  shortDescription: Deploy one staging canary BPMN version, pin the definition key the engine returned and prove its message-driven
    instance completed.
  metaTitle: Camunda staging BPMN deployment smoke gate
  metaDescription: Gate a staged Camunda BPMN deployment with approval, a pinned definition key, unique message correlation
    and proof the canary instance completed.
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Approval Gates
  ee: false
  verified: false
  demo: false
  description: |
    ## Safety

    Deploying a BPMN model is a write that keeps writing. Camunda retains every version you deploy, routes new instances to
    the latest one and cannot delete a version through its public API. Creating an instance can start real work: a service
    task calls a system, a call activity starts another process, a timer fires later. A smoke test that deploys the wrong
    model or one that starts an instance of a model carrying real tasks leaves work running that nobody asked for and a version
    history nobody can clean up. That is why this flow refuses by default and why every guard below is load bearing. Each one
    was proven by its own run against a real Camunda 8.9.19 engine.

    | Guard | What it stops |
    | --- | --- |
    | One exact `canary_` process ID, compared with the ID inside the model | deploying a model whose process ID is not the dedicated canary |
    | Element allowlist: start, message catch, end, two flows, one message | a service task, call activity, script, timer or signal reaching the engine |
    | Shape check on the parsed XML | a model that branches into work nobody reviewed |
    | 65536 byte model ceiling | a large unreviewed model arriving through a smoke job input |
    | `auto_remediate` false, `dry_run` true, `Pause` | three separate gates before one deployment |
    | Recheck of cluster ID, model SHA-256 and the retained version list after the Pause | deploying against a plan that went stale while the approval waited |
    | Recheck of the residual `_active` key after the Pause | creating a canary while a previous one is still unaccounted for |
    | 50 retained version ceiling | a smoke job that quietly accumulates versions forever |
    | `processDefinitionKey` pinned from the deployment response | driving or verifying a different version than the one just deployed |
    | `execution.id` as correlation key and message ID | correlating with somebody else's message or delivering twice |
    | Completion proof: COMPLETED, no incident, the exact correlated `messageKey` | a deployment that returned success being reported as proven |
    | `errors` block acts only on the instance key this run created | cleanup cancelling a canary or a production instance it does not own |
    | `concurrency: limit 1` with `QUEUE` | two executions deploying and correlating at the same time |

    ## How it works

    1. `plan` (`io.kestra.plugin.scripts.python.Script`) parses the BPMN with `xml.etree`. It refuses a model over 65536
       bytes, a process ID that is not the exact `canary_` input, any element outside the allowlist, anything other than one
       plain start plus one message catch plus one end. It also refuses a start event carrying an event definition. It then reads
       `/v2/topology` for the cluster ID and `/v2/process-definitions/search` for the versions already retained, failing above
       50. The model SHA-256, cluster ID and version list become the approved plan.
    2. `read_receipt` and `read_active` (`io.kestra.plugin.core.kv.Get`) load the last proven receipt and any residual
       instance key left by an earlier pass that did not finish.
    3. `receipt_check` (`Script`) decides whether a test is needed. A receipt counts only if the cluster ID, model SHA-256,
       process ID and message name all still match and the engine still shows that exact instance COMPLETED on that exact
       definition with that exact correlated message. A residual `_active` key must point at an instance the engine reports
       COMPLETED or TERMINATED, on the definition it was saved with, before the run may create another.
    4. `needs_test` (`io.kestra.plugin.core.flow.If`) either logs `healthy_receipt` or runs `report`, which names the planned
       cluster, the model SHA-256 and every retained version.
    5. `mode` (`If`) continues only with `auto_remediate: true` and `dry_run: false`. Otherwise the run ends at `dry_run`
       as a report.
    6. `approval` (`io.kestra.plugin.core.flow.Pause`, `behavior: FAIL`, `PT30M`) waits for a person. `approved` (`If`) reads
       `outputs.approval.onResume.approved ?? false`, so a resume that answers nothing is a refusal.
    7. `reread_active` (`kv.Get`) and `recheck` (`Script`) treat the approval as a stale snapshot. `recheck` re-parses the
       model, re-reads the cluster and version list, then fails unless they are byte identical to the approved plan. It fails
       if the residual key changed during the Pause. It fails again if the residual instance became active.
    8. `deploy` (`io.kestra.plugin.camunda.Deploy`) deploys the single resource. `deployed_scope`
       (`io.kestra.plugin.core.execution.Assert`) fails unless the engine returned exactly one process whose
       `bpmnProcessId` is the canary ID.
    9. `start_canary` (`io.kestra.plugin.camunda.CreateProcessInstance`) creates one instance of the returned
       `processDefinitionKey`, never of the process ID, with the Kestra execution ID as `canaryCorrelationKey`.
       `save_instance` (`kv.Set`) records that key before anything else can fail.
    10. `waiting_subscription` (`Script`) polls `/v2/message-subscriptions/search` until exactly one CREATED subscription
        exists for the owned instance, the pinned definition, the expected message name and this execution's correlation key.
        `publish` (`io.kestra.plugin.camunda.PublishMessage`) then publishes once with `messageId` set to the execution ID,
        so a retry cannot deliver twice.
    11. `prove_completion` (`Script`) polls until the owned instance is COMPLETED with no incident and
        `/v2/correlated-message-subscriptions/search` returns exactly the published `messageKey` against this execution's
        correlation key. `save_receipt` (`kv.Set`) stores the proof, `clear_active` (`kv.Delete`) releases the residual key
        and `completed` logs the keys.
    12. On any failure the `errors` block runs `cleanup_owned`, `inspect_owned`, `cancel_if_active`, `cancel_canary`
        (`io.kestra.plugin.camunda.CancelProcessInstance`) and `verify_cleanup`, all keyed on the one instance key this run
        created, then `failure_alert` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) posts the failure.

    A `Schedule` trigger ships `disabled: true` and forces `dry_run: true` with `auto_remediate: false`, so enabling it
    cannot deploy anything.

    ## What you get

    - A deployment key, a pinned process definition key, one isolated instance key and one message key, all read back from
      the engine rather than taken from the deployment response.
    - Proof that the version you just deployed can actually be driven through its message catch to COMPLETED, not just that
      the deployment call returned 200.
    - A receipt that stops the next run deploying and correlating again for a model that is already proven.
    - A failed run that cancels the canary it created, leaves every other instance alone, keeps the residual key and lets the
      next run reconcile it.

    ## Who it's for

    Platform and process automation teams who deploy Camunda 8 BPMN models through a pipeline and want the message wiring
    checked in a dedicated staging cluster before the model reaches anything that matters.

    ## Why orchestrate this with Kestra

    Three parts of this are orchestration, not engine work. A deployment that must not happen without a person needs a
    durable Pause and a re-read of eligibility afterwards, because the cluster can change while the approval waits. A canary
    that was created but never completed needs its key remembered across runs, which is what the KV receipt and residual key
    do. Proving the model works needs the deployment response, the subscription, the message key and the final instance state
    held together in one record. Camunda does the deployment, the correlation and the state itself.

    ## Tested end to end

    Kestra 2.0.5, Camunda 8.9.19
    (`camunda/camunda@sha256:174f43860c96f25e259785b0d65bc245fbcb20e3d8ff39eef8ff01ae888813ed`, single broker, one partition,
    RDBMS secondary storage), plugin-camunda 1.0.3, plugin-slack 2.1.0, plugin-script-python 1.14.0. Validate was clean:
    no constraints, warnings, infos or deprecations. Every state below was read from the engine's own REST v2 API on its
    published port, never from the flow's own output.

    The fixture before the final suite, read from `/v2/process-definitions/search` and `/v2/process-instances/search`:

    ```
    process definition        version  instances            note
    canary_smoke              1        3 COMPLETED          earlier proven canaries
                                       1 TERMINATED         earlier cancelled canary
    order_fulfilment_prod     1        1 ACTIVE             protected production control
    cluster b198d5c8-cf49-4ad9-945e-1390c6f823c9, gateway 8.9.19
    ```

    | Case | Execution | Result |
    | --- | --- | --- |
    | Healthy | `5diMlUPUCo0KKZDe7mFbcf` | SUCCESS. Matching receipt verified against the engine. No deployment, instance or message |
    | Dry run | `6nuEVlTF4qvek3BVfwMsYw` | SUCCESS. Model and cluster reported, the Pause never reached, nothing created |
    | Declined approval | `6UjJGoe57REPquvKlJSvbC` | SUCCESS. Resume carried no approval. No deployment, instance or message |
    | Remediation | `77Jr3hEskeZy1FxncOu1VP` | SUCCESS. Instance `2251799813685439` COMPLETED on pinned definition `2251799813685320` after message `2251799813685448`, correlation key equal to the execution ID, 1.345 s from start to completion. Completed canaries 3 to 4 |
    | Repeat | `6UFTFAYaXNKMqRInenlfJL` | SUCCESS. Same write mode inputs, receipt matched, zero deployments or instances |
    | Ineffective write | `69sHu8YflCSPrGBQUMRabg` | FAILED as intended. Expected message name did not match the model, so instance `2251799813685454` got 0 correlated subscriptions. The errors block cancelled it to TERMINATED and no receipt was written |
    | Stale plan during the Pause | `2bifymnt40ssaqXsEj03aE` | FAILED as intended. A third party deployed `canary_smoke` version 2 while the approval waited. `recheck` refused before `deploy`. Completed and terminated counts unchanged |
    | Re-plan after that version | `5JNGGPxRJl4yinBR5ijmhW` | SUCCESS. Fresh plan over versions 1 and 2, deployed version 3, instance `2251799813685469` COMPLETED |
    | Residual key changed during the Pause | `2vuM6VVmBSpmJtGtH4zv3O` | FAILED as intended. The `_active` key was rewritten to another owner during the approval. `recheck` refused before `deploy` |
    | Lookalike with a service task | `7NBaheEjB5GKOc5bO4HDln` | FAILED as intended. Model declared the exact canary ID but carried `serviceTask`. Nothing deployed |
    | Oversize model | `61Ei4I0azpaaixoRiJLL87` | FAILED as intended. 72206 bytes against the 65536 byte ceiling. Nothing deployed |
    | Protected production process | `2eJLB56UCUzEhvzckvWdFk` | SUCCESS. Canary completed while `order_fulfilment_prod` version 1 and its ACTIVE instance `2251799813685389` stayed untouched with no incident |
    | Queued second execution | `3QWSgRU58n2gl1VOmpuGCA` | SUCCESS. Launched while another execution held the slot, recorded QUEUED, then ran report only |
    | Interrupted pass | `3jV5AcWl2ymx3cBy8WvU80` | FAILED as intended. Instance `2251799813685502` was created, never completed, cancelled to TERMINATED by the errors block. Residual key kept, no receipt |
    | Reconciled next run | `4UWSPmT21XphBk2NARdJK8` | SUCCESS. Read the residual key from the interrupted execution, confirmed that instance terminal, created `2251799813685517`, proved COMPLETED, cleared the key. No duplicate version |

    Repeated on a second fresh Camunda container with its own volume: healthy, remediation and the stale plan refusal gave
    the same results. Slack was a local HTTP sink.

    ## Prerequisites

    - A dedicated Camunda 8 staging cluster with searchable secondary storage, so `/v2/process-instances/search` and the
      message subscription endpoints answer. Tested on 8.9.19 only.
    - Kestra 2.0.5 with the Camunda, Slack and Python script plugins plus a Docker task runner that can reach the cluster.
    - Minimum permissions on the cluster: create deployment, create process instance, publish message, cancel process
      instance, plus read access to process definitions, process instances and message subscriptions. Nothing else is used.
    - Never point this at a production process cluster. Deployed versions cannot be removed through the public API.

    ### Secrets

    - `CAMUNDA_REST_ADDRESS`: base URL of the staging cluster REST API.
    - `CAMUNDA_USERNAME`, `CAMUNDA_PASSWORD`: basic authentication for that cluster. Supply both or neither.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for failures.

    ### Inputs

    | Input | Default | Purpose |
    | --- | --- | --- |
    | `camunda_rest_address` | `secret('CAMUNDA_REST_ADDRESS')` | Staging cluster REST API |
    | `canary_process_id` | `canary_smoke` | The exact `canary_` process ID allowed in the model |
    | `bpmn_content` | a minimal start, message catch, end model | The model to stage. At most 65536 bytes |
    | `message_name` | `canary_smoke_continue` | Catch message the model declares |
    | `receipt_key` | `camunda_canary_smoke` | KV receipt key. One per cluster and process |
    | `verify_seconds` | `30` | Bound on each engine wait, 10 to 60 |
    | `runner_network` | empty | Docker network for the script runner when the cluster is private |
    | `dry_run` | `true` | Report only |
    | `auto_remediate` | `false` | Ask for approval before deploying |

    ## Quick start

    1. Add the four secrets. Point `camunda_rest_address` at a staging cluster you own.
    2. Execute with the defaults. Read `report`: the cluster ID, the model SHA-256 and every version already retained.
    3. Check that `canary_process_id` and `message_name` match your model, then execute with `dry_run: false` and
       `auto_remediate: true`.
    4. Read the Pause description. It names the cluster and the model. Approve only if both are the staging ones.
    5. Read `completed`: the instance key, the message key and the definition key. The receipt is now stored.
    6. Run again. It should log `healthy_receipt` and write nothing.
    7. Enable the Schedule for a daily read-only report once you trust the model allowlist.

    ## How to extend

    - Point `receipt_key` at a new value to force a reviewed retest after a model change the SHA-256 does not catch, for
      example a change of cluster.
    - Widen the element allowlist in `vars.reader_script` only together with a plan for the side effects those elements
      cause plus how a failed run cancels them.
    - Pair the receipt with your pipeline so a deployment to the next environment reads the proven definition key rather
      than the process ID.
    - Send `failure_alert` to a ticket instead of Slack so every failed smoke test has an owner.

    Limits: this proves one linear message-catch model on one staging cluster. It does not prove a model with tasks, gateways
    or timers. It is not a promotion path to production. There is exactly one write target per run, so the flow uses the
    flow level `concurrency: limit 1` with `QUEUE` instead of a `Loop` with `concurrencyLimit: 1`. Retained versions are never
    rolled back, because Camunda offers no public delete. The residual key handles an instance whose key came back; a create
    that times out before the engine returns a key leaves an instance that only the execution correlation variable can
    identify, which is why `failure_alert` says so. If the engine's history is purged, a residual key whose instance the
    engine no longer knows blocks the next run until somebody clears it, which is deliberate. Receipt verification covers
    identity and completion, not model semantics. The connection fields are inputs defaulting to `secret(...)`, so the
    rendered value is stored with the execution: treat execution inputs as sensitive.

