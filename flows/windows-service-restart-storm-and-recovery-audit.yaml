id: windows-service-restart-storm-and-recovery-audit
namespace: company.team
description: |
  Audit the Windows System event log for services that terminate unexpectedly in
  bursts, resolve each culprit to its service name, check whether recovery actions
  are configured, and alert Slack only when a restart storm is confirmed.

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run every morning so overnight restart storms are visible at the start of the shift.
    cron: "0 6 * * *"

inputs:
  - id: windowHours
    type: INT
    description: How many hours back into the System log the audit looks.
    defaults: 24
  - id: stormThreshold
    type: INT
    description: Terminations of the same service inside the window that count as a restart storm.
    defaults: 3
  - id: includeUnexpectedShutdowns
    type: BOOL
    description: Also collect event 6008 unexpected shutdown records for correlation.
    defaults: true

tasks:
  - id: collect_and_score
    type: io.kestra.plugin.scripts.powershell.Script
    description: Pull System log events 7031, 7034, 7000 and optionally 6008, parse the service names, resolve display names to service names, score restart storms, and audit recovery actions for every storm service.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    outputFiles:
      - service_events.json
    env:
      WINDOW_HOURS: "{{ inputs.windowHours }}"
      STORM_THRESHOLD: "{{ inputs.stormThreshold }}"
      INCLUDE_SHUTDOWNS: "{{ inputs.includeUnexpectedShutdowns }}"
    script: |
      $windowHours = [int]$env:WINDOW_HOURS
      $threshold = [int]$env:STORM_THRESHOLD
      $includeShutdowns = $env:INCLUDE_SHUTDOWNS -eq 'true'

      $since = (Get-Date).ToUniversalTime().AddHours(-$windowHours)
      $ids = @(7031, 7034, 7000)
      if ($includeShutdowns) { $ids += 6008 }

      $events = Get-WinEvent -FilterHashtable @{ LogName = 'System'; StartTime = $since; Id = $ids } -ErrorAction SilentlyContinue

      $records = @()
      foreach ($e in $events) {
        $msg = ($e.Message -replace '\s+', ' ').Trim()
        $svc = $null
        $kind = 'unknown'
        if ($e.Id -in 7031, 7034) {
          $kind = 'service-terminated'
          if ($msg -match '^The (.+?) service terminated') { $svc = $Matches[1] }
        } elseif ($e.Id -eq 7000) {
          $kind = 'service-start-failed'
          if ($msg -match '^The (.+?) service failed to start') { $svc = $Matches[1] }
        } elseif ($e.Id -eq 6008) {
          $kind = 'unexpected-shutdown'
        }
        $records += [pscustomobject]@{
          timeUtc = $e.TimeCreated.ToUniversalTime().ToString('o')
          eventId = $e.Id
          kind    = $kind
          service = $svc
          machine = $env:COMPUTERNAME
          message = $msg.Substring(0, [Math]::Min(240, $msg.Length))
        }
      }

      $svcMap = @{}
      Get-CimInstance Win32_Service -ErrorAction SilentlyContinue | ForEach-Object {
        if ($_.DisplayName) { $svcMap[$_.DisplayName] = $_.Name }
        if ($_.Name) { $svcMap[$_.Name] = $_.Name }
      }

      $terminated = @($records | Where-Object { $_.kind -eq 'service-terminated' -and $_.service })
      $shutdowns = @($records | Where-Object { $_.kind -eq 'unexpected-shutdown' })
      $groups = $terminated | Group-Object service | Sort-Object Count -Descending

      $stormServices = @()
      $recoveryGaps = @()
      $worst = ''
      $worstCount = 0
      foreach ($g in $groups) {
        if ($g.Count -ge $threshold) {
          $stormServices += $g.Name
          if ($worstCount -eq 0) { $worst = $g.Name; $worstCount = $g.Count }
          $scName = if ($svcMap.ContainsKey($g.Name)) { $svcMap[$g.Name] } else { $g.Name }
          $qf = & sc.exe qfailure $scName 2>$null | Out-String
          $hasCmd = $qf -match 'COMMAND_LINE\s*:\s*\S'
          if (-not $hasCmd) { $recoveryGaps += $g.Name }
        }
      }

      $verdict = if ($stormServices.Count -gt 0) { 'STORM' } else { 'CLEAR' }

      $report = [pscustomobject]@{
        machine        = $env:COMPUTERNAME
        windowHours    = $windowHours
        threshold      = $threshold
        collectedAtUtc = (Get-Date).ToUniversalTime().ToString('o')
        events         = $records
        stormServices  = $stormServices
        recoveryGaps   = $recoveryGaps
      }
      $reportPath = Join-Path '{{ outputDir }}' 'service_events.json'
      $report | ConvertTo-Json -Depth 6 | Set-Content -Path $reportPath -Force

      $payload = @{
        outputs = @{
          verdict          = $verdict
          storm_detected   = ($stormServices.Count -gt 0)
          events_total     = $records.Count
          terminated_total = $terminated.Count
          shutdowns_total  = $shutdowns.Count
          storm_count      = $stormServices.Count
          worst_service    = $worst
          worst_count      = $worstCount
          storm_services   = $stormServices
          recovery_gaps    = $recoveryGaps
          machine          = $env:COMPUTERNAME
          window_hours     = $windowHours
          collected_at     = (Get-Date).ToUniversalTime().ToString('o')
        }
      }
      Write-Output ('::' + ($payload | ConvertTo-Json -Compress -Depth 5) + '::')

  - id: per_service_recovery_audit
    type: io.kestra.plugin.core.flow.Loop
    description: Re-check every storm service with sc.exe and log its current state, start mode, and whether a recovery command line is configured.
    values: "{{ outputs.collect_and_score.vars.storm_services }}"
    concurrencyLimit: 1
    tasks:
      - id: audit_service_recovery
        type: io.kestra.plugin.scripts.powershell.Script
        description: Resolve one storm service, read its recovery configuration, and emit the result.
        allowFailure: true
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          SERVICE_DISPLAY: "{{ item }}"
        script: |
          $display = $env:SERVICE_DISPLAY
          $svc = Get-CimInstance Win32_Service -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -eq $display -or $_.Name -eq $display } | Select-Object -First 1
          $name = if ($svc) { $svc.Name } else { $display }
          $state = if ($svc) { (Get-Service -Name $name -ErrorAction SilentlyContinue).Status.ToString() } else { 'NOT_FOUND' }
          $startup = if ($svc) { $svc.StartMode } else { 'UNKNOWN' }
          $qf = & sc.exe qfailure $name 2>$null | Out-String
          $hasCmd = $qf -match 'COMMAND_LINE\s*:\s*\S'
          $payload = @{
            outputs = @{
              service_display    = $display
              service_name       = $name
              current_state      = $state
              startup_type       = $startup
              recovery_actions   = [bool]$hasCmd
            }
          }
          Write-Output ('::' + ($payload | ConvertTo-Json -Compress -Depth 4) + '::')
          Write-Output ('recovery audit: ' + $display + ' (service ' + $name + ') state=' + $state + ' startup=' + $startup + ' recovery_actions=' + $hasCmd)

  - id: alert_if_storm
    type: io.kestra.plugin.core.flow.If
    description: Alert only when at least one service crossed the restart threshold, otherwise record a clean result.
    condition: "{{ outputs.collect_and_score.vars.storm_detected }}"
    then:
      - id: alert_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post the storm summary, the worst offender and the services missing recovery actions to the ops channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": "Windows restart storm on {{ outputs.collect_and_score.vars.machine }}: {{ outputs.collect_and_score.vars.storm_count }} service(s) crossed {{ inputs.stormThreshold }} termination(s) in {{ inputs.windowHours }}h. Worst offender {{ outputs.collect_and_score.vars.worst_service }} with {{ outputs.collect_and_score.vars.worst_count }} termination(s). No recovery command line configured on {{ outputs.collect_and_score.vars.recovery_gaps }}. Events audited {{ outputs.collect_and_score.vars.events_total }}. Execution {{ execution.id }}."}
      - id: log_storm_summary
        type: io.kestra.plugin.core.log.Log
        description: Record the storm verdict in the execution log for the shift handover.
        message: "Restart storm verdict STORM on {{ outputs.collect_and_score.vars.machine }}: {{ outputs.collect_and_score.vars.storm_count }} storm service(s), worst {{ outputs.collect_and_score.vars.worst_service }} at {{ outputs.collect_and_score.vars.worst_count }} termination(s), recovery gaps {{ outputs.collect_and_score.vars.recovery_gaps }}, {{ outputs.collect_and_score.vars.terminated_total }} termination(s) and {{ outputs.collect_and_score.vars.shutdowns_total }} unexpected shutdown(s) in the last {{ inputs.windowHours }}h."
    else:
      - id: log_all_clear
        type: io.kestra.plugin.core.log.Log
        description: Record that no service crossed the threshold in the audited window.
        message: "Restart storm verdict CLEAR on {{ outputs.collect_and_score.vars.machine }}: {{ outputs.collect_and_score.vars.events_total }} event(s) audited over {{ inputs.windowHours }}h, no service reached {{ inputs.stormThreshold }} termination(s)."

errors:
  - id: alert_slack_on_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Ping the on-call channel when the audit itself fails so a broken collector never stays silent.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    allowFailure: true
    payload: |
      {"text": "Windows restart storm audit failed on {{ outputs.collect_and_score.vars.machine ?? execution.id }}: {{ errorLogs() }}. Execution {{ execution.id }}."}

outputs:
  - id: verdict
    type: STRING
    value: "{{ outputs.collect_and_score.vars.verdict }}"
  - id: storm_detected
    type: BOOL
    value: "{{ outputs.collect_and_score.vars.storm_detected }}"
  - id: events_total
    type: INT
    value: "{{ outputs.collect_and_score.vars.events_total }}"
  - id: worst_service
    type: STRING
    value: "{{ outputs.collect_and_score.vars.worst_service }}"
  - id: storm_services
    type: JSON
    value: "{{ outputs.collect_and_score.vars.storm_services }}"
  - id: machine
    type: STRING
    value: "{{ outputs.collect_and_score.vars.machine }}"

extend:
  shortDescription: Audit the Windows System event log for services that terminate unexpectedly in bursts, score restart storms against a threshold, check recovery actions, and alert Slack only when a storm is confirmed.
  title: Windows Service Restart Storm and Recovery Action Audit
  metaTitle: Windows Service Restart Storm Audit with Recovery Action Checks and Slack Alerts
  metaDescription: Audit Windows System log for services that terminate unexpectedly in bursts, score restart storms, check recovery actions, and alert Slack.
  description: |
    Windows services that crash at three in the morning and restart themselves four times before anyone notices are one of the most under-monitored failure modes on a server fleet. The System event log already knows about every one of them - Service Control Manager writes event 7031 and 7034 each time a service terminates, and event 7000 each time one fails to start - but nobody reads that log until a user complains. This blueprint turns those records into a scored daily audit: it collects the termination events over a configurable window, groups them per service, flags any service that crossed the storm threshold, resolves every culprit to its real service name, checks whether a recovery action is actually configured, and posts a single Slack alert only when a storm is confirmed.

    ## How it works
    1. The `daily` trigger (`io.kestra.plugin.core.trigger.Schedule`) runs the audit every morning at 06:00 so overnight storms are on the desk at shift start. Manual runs accept `windowHours`, `stormThreshold` and `includeUnexpectedShutdowns` as inputs.
    2. The `collect_and_score` task (`io.kestra.plugin.scripts.powershell.Script` on the Process task runner so it reads the host's own event log) pulls System events 7031, 7034, 7000 and optionally 6008 with `Get-WinEvent`, parses the service name out of each message, maps display names to service names through `Win32_Service`, groups terminations per service, and scores every service that reached the threshold. For each storm service it also runs `sc.exe qfailure` and records whether a recovery command line is configured. The full event list is written to `service_events.json` as an output file and the verdict is emitted as task variables.
    3. The `per_service_recovery_audit` task (`io.kestra.plugin.core.flow.Loop`) walks the storm services one at a time, re-reads each service's current state, start mode and recovery configuration, and logs a one-line audit trail per service that survives in the execution history.
    4. The `alert_if_storm` task (`io.kestra.plugin.core.flow.If`) branches on the scored verdict: a confirmed storm posts one Slack message with the machine, the storm count, the worst offender and the services missing recovery actions; a clean window writes a single all-clear log line instead.
    5. The `errors` handler posts a Slack notice with `allowFailure: true`, so a broken collector or an unreadable event log escalates instead of failing silently.

    ## What you get
    - A daily, scored verdict per machine: `STORM` or `CLEAR`, with the event total, the worst offending service and the services that lack recovery actions.
    - A `service_events.json` artifact attached to every execution with the full event list, ready for trend analysis or compliance evidence.
    - One Slack alert per storm instead of one alert per crash, with the recovery-action gap called out so the fix is obvious.
    - A per-service recovery audit trail in the execution history that shows state and start mode at the time of the run.

    ## Who it's for
    - Windows fleet operators who suspect services are crash-looping overnight but have no alerting on the System log.
    - Site reliability teams standardising restart-storm thresholds across branch, edge or virtualisation hosts.
    - Administrators proving to a vendor that a service is terminating repeatedly and has no recovery action configured.

    ## Why orchestrate this with Kestra
    Get-WinEvent and sc.exe are one-liners on a single box, but a fleet needs the collection, the threshold scoring, the recovery-action audit and the escalation to live in one place with a schedule, inputs, an execution history and a guaranteed error path. Kestra gives the audit a schedule and typed inputs, keeps every run's JSON artifact and per-service audit trail, and puts the Slack escalation behind a conditional so quiet nights stay quiet. Running it as a flow also means the same definition can be pointed at many machines through a Loop over a CMDB list instead of a scheduled task on each host.

    ## Prerequisites
    - A Windows Kestra worker with the Process task runner available, since the audit must read the host's own System log and the default Docker runner cannot see it.
    - PowerShell 5.1 or pwsh and read access to the System event log, plus permission to run `sc.exe`.
    - A Slack incoming webhook stored as the `SLACK_WEBHOOK_URL` secret.
    - The service-name parser reads English Service Control Manager messages; on non-English Windows adjust the two regex patterns in `collect_and_score` to the local message format.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by the storm alert and by the on-error handler.

    ## Quick start
    1. Add the `SLACK_WEBHOOK_URL` secret to the namespace and deploy the flow on a Windows worker.
    2. Run it manually with the default 24 hour window and threshold of 3; inspect `service_events.json` and the emitted verdict in the outputs tab.
    3. Lower `stormThreshold` to 1 once to see the Slack alert path fire end to end.
    4. Leave the schedule at 06:00 or align it with your shift handover, then extend the `collect_and_score` script to fan out over a host list with a Loop.

    ## How to extend
    - Fan the audit out over a fleet by wrapping the collector in `io.kestra.plugin.core.flow.Loop` over a host list and passing `-ComputerName` to `Get-WinEvent` over WinRM.
    - Add event 6037, 6009 or provider-specific crash events to the id list to widen the failure picture.
    - Enrich the Slack alert with the dump file path by parsing the matching Windows Error Reporting event and attaching it to the execution.
    - Persist `service_events.json` to S3 or a database for multi-week trend lines on the same service.
    - Escalate a repeated storm to ServiceNow or Jira with the existing plugin tasks instead of Slack.

    ## Links
    - PowerShell script task: https://kestra.io/plugins/plugin-script-powershell
    - Get-WinEvent documentation: https://learn.microsoft.com/windows-server/administration/windows-commands/get-winevent
    - sc.exe failure actions: https://learn.microsoft.com/windows-server/administration/windows-commands/sc-qfailure
    - Schedule trigger: https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.schedule
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
