id: energinet-hourly-scope2-emissions-calculator
namespace: company.team

description: |
  Monthly location-based Scope 2 calculation for Danish sites with hourly matching: Energinet's 5-minute
  CO2 intensity for DK1 and DK2 is averaged to hours and joined to each site's hourly meter data in DuckDB,
  next to the flat monthly-average method, so you see how much the timing of your load changes the number.
  Results per period are kept in KV, so a re-run only reports when the figures were restated.

inputs:
  - id: period
    type: STRING
    required: false
    validator: "^[0-9]{4}-(0[1-9]|1[0-2])$"
    displayName: Reporting month (yyyy-MM)
    description: Calendar month to calculate, in UTC. Empty means the previous month, which is what the schedule uses.

  - id: meter_file
    type: FILE
    required: false
    displayName: Meter data (CSV)
    description: >-
      Header `site_id,price_area,timestamp,kwh`. `price_area` is DK1 (west of the Great Belt) or DK2 (east).
      `timestamp` is ISO 8601; values without an offset are read as UTC, values with an offset (for example
      `+02:00`) are converted. 15-minute readings are summed to the hour. Leave empty to use the built-in
      sample profile (sample data, not real meters).

  - id: restatement_threshold_pct
    type: FLOAT
    defaults: 0.5
    description: On a re-run of a month already reported, post again only if the hourly-matched total moved by more than this percentage.

triggers:
  - id: monthly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 7 3 * *"
    description: The 3rd of each month at 07:00 UTC, for the previous month.

tasks:
  - id: period
    type: io.kestra.plugin.core.debug.Return
    description: Reporting month; the previous month (in UTC) when no input is given.
    format: "{{ inputs.period ?? ((trigger.date ?? execution.startDate) | dateAdd(-1, 'MONTHS') | date('yyyy-MM', timeZone='UTC')) }}"

  - id: fetch_intensity
    type: io.kestra.plugin.core.http.Download
    description: |
      One request for both price areas and the whole month: `timezone=UTC` makes `start`/`end` UTC
      (the default is Danish local time), `columns` trims the payload and `limit=0` returns every row
      (the default is 100). About 17,000 rows and 1.4 MB for a 30-day month.
    uri: "https://api.energidataservice.dk/dataset/CO2Emis?start={{ outputs.period.value }}-01T00:00&end={{ (outputs.period.value ~ '-01T00:00:00Z') | dateAdd(1, 'MONTHS') | date('yyyy-MM-dd', timeZone='UTC') }}T00:00&timezone=UTC&filter={{ '{\"PriceArea\":[\"DK1\",\"DK2\"]}' | urlencode }}&columns=Minutes5UTC,PriceArea,CO2Emission&sort=Minutes5UTC%20asc&limit=0"
    headers:
      Accept: application/json
      User-Agent: kestra-energinet-hourly-scope2/1.0
    retry:
      type: constant
      interval: PT30S
      maxAttempts: 3

  - id: use_sample_profile
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.meter_file is null }}"
    then:
      - id: sample_meter_profile
        type: io.kestra.plugin.jdbc.duckdb.Queries
        description: |
          SAMPLE DATA, not real meters: a flat 24/7 data centre in Aarhus (DK1), a weekday office in
          Copenhagen (DK2, 08-18 local time), an EV depot charging overnight (DK2, 22-06 local time) and a
          warehouse in Malmo (SE4) that Energinet does not cover, to show how unknown price areas are reported.
        url: "jdbc:duckdb:"
        outputFiles:
          - meter_csv
        sql: |
          SET TimeZone = 'UTC';
          COPY (
            WITH hours AS (
              SELECT ts, timezone('Europe/Copenhagen', ts) AS local_ts
              FROM generate_series(CAST('{{ outputs.period.value }}-01' AS TIMESTAMPTZ),
                                   CAST('{{ outputs.period.value }}-01' AS TIMESTAMPTZ) + INTERVAL 1 MONTH - INTERVAL 1 HOUR,
                                   INTERVAL 1 HOUR) AS t(ts)
            )
            SELECT 'AAR-DC' AS site_id, 'DK1' AS price_area, ts AS timestamp, round(380 + 20 * sin(hour(local_ts) / 24.0 * 2 * pi()), 1) AS kwh FROM hours
            UNION ALL
            SELECT 'CPH-HQ', 'DK2', ts,
                   CASE WHEN isodow(local_ts) <= 5 AND hour(local_ts) BETWEEN 8 AND 17 THEN 210 ELSE 35 END FROM hours
            UNION ALL
            SELECT 'CPH-EV', 'DK2', ts,
                   CASE WHEN hour(local_ts) >= 22 OR hour(local_ts) < 6 THEN 300 ELSE 12 END FROM hours
            UNION ALL
            SELECT 'MAL-WH', 'SE4', ts, 90 FROM hours
          ) TO '{{ outputFiles.meter_csv }}' (HEADER, DELIMITER ',');

  - id: previous_result
    type: io.kestra.plugin.core.kv.Get
    key: "scope2_hourly_{{ outputs.period.value | replace({'-': '_'}) }}"
    errorOnMissing: false
    description: Totals from an earlier run for the same month; missing the first time a month is calculated.

  - id: calculate
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      5-minute intensities are averaged per hour and area (an hour with fewer than 12 intervals is still used,
      and its coverage is reported; an hour with none falls back to the area's monthly mean and is flagged).
      Meter rows are normalised to UTC hours, duplicate timestamps are counted once, rows outside the month
      are dropped and counted, and sites outside DK1/DK2 get status NO_FACTOR instead of a silent zero.
    url: "jdbc:duckdb:"
    fetchType: FETCH
    inputFiles:
      co2.json: "{{ outputs.fetch_intensity.uri }}"
      meter.csv: "{{ inputs.meter_file ?? outputs.sample_meter_profile.outputFiles.meter_csv }}"
      previous.json: "{{ outputs.previous_result.value ?? '{}' }}"
    outputFiles:
      - hourly_parquet
      - sites_csv
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE bounds AS
      SELECT CAST('{{ outputs.period.value }}-01' AS TIMESTAMPTZ) AS p_start,
             CAST('{{ outputs.period.value }}-01' AS TIMESTAMPTZ) + INTERVAL 1 MONTH AS p_end;
      CREATE TABLE intensity AS
      SELECT date_trunc('hour', CAST(CAST(r.Minutes5UTC AS VARCHAR) AS TIMESTAMPTZ)) AS hour_utc, CAST(r.PriceArea AS VARCHAR) AS price_area,
             avg(CAST(r.CO2Emission AS DOUBLE)) AS g_per_kwh, count(r.CO2Emission) AS intervals
      FROM (SELECT unnest(records) AS r FROM read_json('co2.json', maximum_object_size = 67108864))
      GROUP BY ALL;
      CREATE TABLE area_month AS
      SELECT price_area, avg(g_per_kwh) AS avg_g_per_kwh, count(*) AS hours_with_data
      FROM intensity GROUP BY price_area;
      CREATE TABLE raw AS
      SELECT trim(site_id) AS site_id, upper(trim(price_area)) AS price_area,
             CAST(timestamp AS TIMESTAMPTZ) AS ts, CAST(kwh AS DOUBLE) AS kwh
      FROM read_csv('meter.csv', header = true, all_varchar = true);
      CREATE TABLE meter AS
      SELECT site_id, price_area, date_trunc('hour', ts) AS hour_utc, sum(kwh) AS kwh
      FROM (SELECT DISTINCT ON (site_id, ts) * FROM raw ORDER BY site_id, ts)
      WHERE ts >= (SELECT p_start FROM bounds) AND ts < (SELECT p_end FROM bounds)
      GROUP BY ALL;
      CREATE TABLE hourly AS
      SELECT m.site_id, m.price_area, m.hour_utc, m.kwh,
             coalesce(i.g_per_kwh, a.avg_g_per_kwh) AS g_per_kwh,
             coalesce(i.intervals, 0) AS intervals,
             i.g_per_kwh IS NULL AS fallback,
             m.kwh * coalesce(i.g_per_kwh, a.avg_g_per_kwh) / 1000 AS kg_hourly,
             m.kwh * a.avg_g_per_kwh / 1000 AS kg_average
      FROM meter m
      LEFT JOIN area_month a USING (price_area)
      LEFT JOIN intensity i ON i.price_area = m.price_area AND i.hour_utc = m.hour_utc;
      COPY (SELECT * FROM hourly WHERE g_per_kwh IS NOT NULL ORDER BY site_id, hour_utc) TO '{{ outputFiles.hourly_parquet }}' (FORMAT PARQUET);
      CREATE TABLE sites AS
      SELECT site_id, price_area,
             CASE WHEN max(g_per_kwh) IS NULL THEN 'NO_FACTOR' ELSE 'OK' END AS status,
             count(*) AS hours, round(sum(kwh), 1) AS kwh,
             round(sum(kg_hourly) / 1000, 3) AS t_co2_hourly,
             round(sum(kg_average) / 1000, 3) AS t_co2_average,
             round(100 * (sum(kg_hourly) - sum(kg_average)) / nullif(sum(kg_average), 0), 1) AS diff_pct,
             round(sum(kg_hourly) * 1000 / nullif(sum(kwh), 0), 1) AS effective_g_per_kwh,
             count(*) FILTER (WHERE fallback AND g_per_kwh IS NOT NULL) AS fallback_hours
      FROM hourly GROUP BY site_id, price_area;
      COPY (SELECT * FROM sites ORDER BY status, site_id) TO '{{ outputFiles.sites_csv }}' (HEADER, DELIMITER ',');
      CREATE TABLE summary AS
      SELECT (SELECT count(*) FROM intensity) AS intensity_hours,
             (SELECT min(intervals) FROM intensity) AS min_intervals_per_hour,
             (SELECT CAST(2 * datediff('hour', p_start, p_end) AS INTEGER) FROM bounds) AS expected_area_hours,
             (SELECT count(*) FROM raw) AS meter_rows,
             (SELECT count(*) FROM raw) - (SELECT count(DISTINCT (site_id, ts)) FROM raw) AS duplicate_rows,
             (SELECT count(*) FROM raw WHERE ts < (SELECT p_start FROM bounds) OR ts >= (SELECT p_end FROM bounds)) AS out_of_period_rows,
             (SELECT count(*) FROM sites WHERE status = 'OK') AS sites_ok,
             (SELECT coalesce(string_agg(site_id || ' (' || price_area || ')', ', '), '') FROM sites WHERE status = 'NO_FACTOR') AS no_factor_sites,
             (SELECT CAST(coalesce(sum(fallback_hours), 0) AS INTEGER) FROM sites) AS fallback_hours,
             (SELECT round(sum(t_co2_hourly), 3) FROM sites WHERE status = 'OK') AS t_co2_hourly,
             (SELECT CAST(json_extract(content, '$.t_co2_hourly') AS DOUBLE) FROM read_text('previous.json')) AS previous_t_co2_hourly,
             (SELECT round(sum(t_co2_average), 3) FROM sites WHERE status = 'OK') AS t_co2_average,
             (SELECT string_agg(price_area || ' ' || round(avg_g_per_kwh, 1) || ' g/kWh', ', ' ORDER BY price_area) FROM area_month) AS area_averages,
             (SELECT string_agg(site_id || ' ' || t_co2_hourly || ' t vs ' || t_co2_average || ' t (' || CASE WHEN diff_pct > 0 THEN '+' ELSE '' END || diff_pct || '%)', chr(10) ORDER BY site_id) FROM sites WHERE status = 'OK') AS site_lines;
      SELECT *, previous_t_co2_hourly IS NOT NULL AS is_rerun,
             previous_t_co2_hourly IS NULL OR previous_t_co2_hourly = 0
               OR abs(t_co2_hourly - previous_t_co2_hourly) / previous_t_co2_hourly * 100 > {{ inputs.restatement_threshold_pct }} AS should_post,
             concat_ws(chr(10),
               '*Scope 2, location-based and hourly-matched, {{ outputs.period.value }}*'
                 || CASE WHEN previous_t_co2_hourly IS NOT NULL THEN ' (RESTATED, previously ' || previous_t_co2_hourly || ' t)' ELSE '' END,
               'Total ' || t_co2_hourly || ' t CO2 hourly-matched vs ' || t_co2_average || ' t with the monthly average (' || area_averages || ')',
               site_lines,
               CASE WHEN no_factor_sites <> '' THEN 'No Energinet factor (not in DK1/DK2) for ' || no_factor_sites END,
               CASE WHEN fallback_hours > 0 THEN fallback_hours || ' site-hours used the monthly average because Energinet had no value' END,
               CASE WHEN {{ inputs.meter_file is null }} THEN '_Meter data is the built-in SAMPLE profile_' END) AS slack_text
      FROM summary;

  - id: fail_without_data
    type: io.kestra.plugin.core.execution.Fail
    runIf: "{{ outputs.calculate.outputs[0].rows[0].intensity_hours == 0 }}"
    errorMessage: "Energinet returned no CO2Emis rows for {{ outputs.period.value }} (a future month, or the API is behind). Nothing was calculated."

  - id: report
    type: io.kestra.plugin.core.flow.If
    description: Post for a newly calculated month, or for a re-run whose total moved more than the threshold (late or corrected Energinet data, or a corrected meter file).
    condition: "{{ outputs.calculate.outputs[0].rows[0].should_post }}"
    then:
      - id: save_result
        type: io.kestra.plugin.core.kv.Set
        key: "scope2_hourly_{{ outputs.period.value | replace({'-': '_'}) }}"
        value: "{{ outputs.calculate.outputs[0].rows[0] | toJson }}"
        description: The figures as reported, so later runs of the same month compare against what was last posted.
      - id: slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: allowFailure keeps the calculation green when the webhook secret is not set.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {"text": outputs.calculate.outputs[0].rows[0].slack_text} | toJson }}
    else:
      - id: unchanged
        type: io.kestra.plugin.core.log.Log
        message: "{{ outputs.period.value }} was already reported at {{ outputs.calculate.outputs[0].rows[0].previous_t_co2_hourly }} t CO2; now {{ outputs.calculate.outputs[0].rows[0].t_co2_hourly }} t, within {{ inputs.restatement_threshold_pct }}%. No new post."

  - id: summary
    type: io.kestra.plugin.core.log.Log
    level: "{{ outputs.calculate.outputs[0].rows[0].no_factor_sites is empty and outputs.calculate.outputs[0].rows[0].fallback_hours == 0 ? 'INFO' : 'WARN' }}"
    message: |
      {{ outputs.period.value }}: {{ outputs.calculate.outputs[0].rows[0].intensity_hours }} of {{ outputs.calculate.outputs[0].rows[0].expected_area_hours }} area-hours of Energinet intensity for DK1+DK2 (min {{ outputs.calculate.outputs[0].rows[0].min_intervals_per_hour }} of 12 five-minute values per hour), area averages {{ outputs.calculate.outputs[0].rows[0].area_averages }}.
      Meter rows {{ outputs.calculate.outputs[0].rows[0].meter_rows }} ({{ inputs.meter_file is null ? 'SAMPLE profile' : 'uploaded file' }}), duplicates {{ outputs.calculate.outputs[0].rows[0].duplicate_rows }}, outside the month {{ outputs.calculate.outputs[0].rows[0].out_of_period_rows }}, hours on fallback factor {{ outputs.calculate.outputs[0].rows[0].fallback_hours }}.
      Total {{ outputs.calculate.outputs[0].rows[0].t_co2_hourly }} t CO2 hourly-matched vs {{ outputs.calculate.outputs[0].rows[0].t_co2_average }} t monthly-average, sites calculated {{ outputs.calculate.outputs[0].rows[0].sites_ok }}:
      {{ outputs.calculate.outputs[0].rows[0].site_lines }}
      {{ outputs.calculate.outputs[0].rows[0].no_factor_sites is empty ? '' : 'Not calculated (no Energinet factor): ' ~ outputs.calculate.outputs[0].rows[0].no_factor_sites }}

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.calculate.outputs[0].rows[0] }}"
  - id: sites_csv
    type: FILE
    value: "{{ outputs.calculate.outputFiles.sites_csv }}"
  - id: hourly_parquet
    type: FILE
    value: "{{ outputs.calculate.outputFiles.hourly_parquet }}"

extend:
  title: Hourly-Matched Scope 2 Emissions for Danish Sites with Energinet CO2 Data
  metaTitle: Energinet Hourly Scope 2 Emissions Calculator with DuckDB | Kestra
  shortDescription: Each month, fetch Energinet's 5-minute CO2 intensity for DK1 and DK2, join it hour by hour to your site meter data in DuckDB, and compare hourly-matched location-based Scope 2 emissions with the flat monthly-average method.
  metaDescription: Monthly Scope 2 for Danish sites from Energinet CO2 intensity, matched hour by hour to meter data in DuckDB, with Parquet, CSV and Slack summaries.
  description: |
    Location-based Scope 2 usually uses one average grid factor, so a kWh on a windy night counts the same as a kWh at the evening peak. In September 2026 Danish hourly intensity ranged from 8 to 234 g/kWh in DK1 and 16 to 181 g/kWh in DK2. This flow does the hourly-matched calculation after the month ends: Energinet's 5-minute CO2 intensity for both price areas is matched hour by hour to each site's meter data and reported next to the flat monthly-average method. It is accounting, not job scheduling.

    ## How it works

    1. A `Schedule` trigger runs on the 3rd at 07:00 UTC; `period` resolves to the previous month, or to the `period` input (`yyyy-MM`, validated).
    2. `fetch_intensity` (HTTP Download) makes one `CO2Emis` request for DK1 and DK2 with `timezone=UTC` (the default is Danish time), `columns` and `limit=0` (the default page is 100 rows): 17,280 rows, 1.4 MB for 30 days.
    3. `use_sample_profile` (If) generates a sample meter CSV when no `meter_file` is uploaded, and `previous_result` (KV Get) reads the figures last reported for the month.
    4. `calculate` (DuckDB) averages 5-minute values per hour and area, converts meter timestamps (with or without offset) to UTC hours, sums 15-minute readings, counts duplicates once and drops rows outside the month. It computes kg CO2 per site-hour with the hourly factor and with the monthly mean. Hours without an Energinet value use the mean and are counted as fallback hours; sites outside DK1/DK2 get `NO_FACTOR`.
    5. `fail_without_data` stops the run when Energinet returns no rows (a future month).
    6. `report` (If) saves the figures to KV and posts to Slack for a new month, or when a re-run moves the total by more than `restatement_threshold_pct`; otherwise it logs that nothing changed.

    ## What you get

    - Per site: kWh, tonnes CO2 hourly-matched and monthly-average, the difference in percent, effective g/kWh and fallback hours.
    - An hourly Parquet file you can audit or load into a carbon accounting tool.
    - Data quality counts: duplicates, rows outside the month, fallback hours, unknown price areas.
    - One Slack post per month, plus a RESTATED post only when the result changes.

    ## Who it's for

    - ESG reporting teams and energy managers with sites in Denmark.
    - Data engineers building auditable Scope 2 pipelines.

    ## Why orchestrate this with Kestra

    - Monthly schedule, retries on the API call, and `period` as an input for backfills.
    - KV state makes re-runs safe, and the hourly file is kept as an execution output for audit.

    ## Prerequisites

    - Kestra with the JDBC DuckDB and Slack plugins.
    - Outbound HTTPS to `api.energidataservice.dk`; no API key.
    - Meter data as CSV `site_id,price_area,timestamp,kwh`. The default meter data is sample data (four synthetic sites); the CO2 intensity always comes from the live API.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the monthly summary (optional; without it the `slack` task warns and the run still finishes).

    ## Quick start

    1. Click **Execute**. The sample profile has a 24/7 data centre (DK1), a weekday office and an overnight EV depot (DK2), and a Swedish warehouse reported as `NO_FACTOR`.
    2. Execute again: the month is already reported, so nothing is posted.
    3. Upload your own `meter_file`, add the secret and leave the schedule on.

    ## How to extend

    - Use the `DeclarationGridEmission` dataset (hourly, settled, with CH4 and N2O) for final annual figures; `CO2Emis` is the near real-time CO2-only series.
    - Read meter data from a database or utility portal, and write the hourly table to your warehouse.

    ## Links

    - [Energi Data Service CO2Emis dataset](https://www.energidataservice.dk/tso-electricity/CO2Emis)
    - [GHG Protocol Scope 2 Guidance](https://ghgprotocol.org/scope-2-guidance)
    - [DuckDB Queries task](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Slack Incoming Webhook task](https://kestra.io/plugins/plugin-slack/slack-notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Data
  subTags:
    - ELT & Data Landing
    - Monitoring & Alerting
  ee: false
  demo: false
