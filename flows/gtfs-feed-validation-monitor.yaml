id: gtfs-feed-validation-monitor
namespace: company.team

inputs:
  - id: feed_url
    type: STRING
    displayName: GTFS feed URL
    description: Public URL of a static GTFS zip. The default is the Redding Area Bus Authority feed, so the flow runs with no setup.
    defaults: https://rabagtfs.z5.web.core.windows.net/rabagtfs.zip

  - id: force_validation
    type: BOOL
    displayName: Validate even if unchanged
    description: Run the validator even when the feed is identical to the one checked last time.
    defaults: false

  - id: fail_on_errors
    type: BOOL
    displayName: Fail on validation errors
    description: End the run as FAILED when the validator reports at least one ERROR notice.
    defaults: false

  - id: notify_slack
    type: BOOL
    displayName: Notify Slack
    description: Post the result to Slack when the feed has errors. Needs the SLACK_WEBHOOK_URL secret.
    defaults: false

triggers:
  - id: daily_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check the feed every morning. Agencies usually publish a new feed without notice.
    cron: "0 6 * * *"

tasks:
  - id: download
    type: io.kestra.plugin.core.http.Download
    description: Download the current feed.
    uri: "{{ inputs.feed_url }}"

  - id: fingerprint
    type: io.kestra.plugin.scripts.python.Script
    description: Hash the downloaded zip, so an unchanged feed is not validated twice.
    dependencies:
      - kestra
    inputFiles:
      feed.zip: "{{ outputs.download.uri }}"
    script: |
      import hashlib
      from kestra import Kestra

      with open("feed.zip", "rb") as f:
          Kestra.outputs({"sha256": hashlib.sha256(f.read()).hexdigest()})

  - id: previous_hash
    type: io.kestra.plugin.core.kv.Get
    description: Read the hash of the last feed that was validated. Empty on the first run.
    key: "{{ flow.id }}_last_sha256"
    errorOnMissing: false

  - id: feed_changed
    type: io.kestra.plugin.core.flow.If
    description: Validate only a new feed, unless force_validation is set.
    condition: "{{ inputs.force_validation or (outputs.previous_hash.value ?? '') != outputs.fingerprint.vars.sha256 }}"
    then:
      - id: validate
        type: io.kestra.plugin.scripts.shell.Commands
        description: >
          Run the canonical MobilityData GTFS validator on the feed. It writes
          report.json and report.html. --skip_validator_update stops it from
          checking GitHub for a newer release on every run.
        containerImage: ghcr.io/mobilitydata/gtfs-validator:8.0.1
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          entryPoint: []
        inputFiles:
          feed.zip: "{{ outputs.download.uri }}"
        commands:
          - java -jar /gtfs-validator-cli.jar --input feed.zip --output_base report --skip_validator_update 2>&1
        outputFiles:
          - report/report.json
          - report/report.html

      - id: summarize
        type: io.kestra.plugin.scripts.python.Script
        description: Count the notices by severity and keep the error codes with the most notices.
        dependencies:
          - kestra
        inputFiles:
          report.json: "{{ outputs.validate.outputFiles['report/report.json'] }}"
        script: |
          import json
          from kestra import Kestra

          with open("report.json") as f:
              notices = json.load(f)["notices"]

          counts = {"ERROR": 0, "WARNING": 0, "INFO": 0}
          for notice in notices:
              counts[notice["severity"]] = counts.get(notice["severity"], 0) + notice["totalNotices"]

          errors = sorted(
              (n for n in notices if n["severity"] == "ERROR"),
              key=lambda n: n["totalNotices"],
              reverse=True,
          )
          top_errors = ", ".join(f"{n['code']} ({n['totalNotices']})" for n in errors[:5])

          Kestra.outputs({
              "errors": counts["ERROR"],
              "warnings": counts["WARNING"],
              "infos": counts["INFO"],
              "top_errors": top_errors or "none",
          })

      - id: remember_hash
        type: io.kestra.plugin.core.kv.Set
        description: Store the hash, so the next run skips this feed unless it changes.
        key: "{{ flow.id }}_last_sha256"
        value: "{{ outputs.fingerprint.vars.sha256 }}"

      - id: errors_found
        type: io.kestra.plugin.core.flow.If
        description: Alert, and optionally fail, when the feed has ERROR notices.
        condition: "{{ outputs.summarize.vars.errors > 0 }}"
        then:
          - id: notify_errors
            type: io.kestra.plugin.core.flow.If
            condition: "{{ inputs.notify_slack }}"
            then:
              - id: slack_errors
                type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                payload: |
                  {
                    "text": "GTFS feed {{ inputs.feed_url }} has {{ outputs.summarize.vars.errors }} validation errors and {{ outputs.summarize.vars.warnings }} warnings. Top errors: {{ outputs.summarize.vars.top_errors }}. Execution {{ execution.id }}."
                  }

          - id: fail_gate
            type: io.kestra.plugin.core.flow.If
            condition: "{{ inputs.fail_on_errors }}"
            then:
              - id: fail_run
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: "GTFS feed has {{ outputs.summarize.vars.errors }} validation errors: {{ outputs.summarize.vars.top_errors }}"
        else:
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            message: "No validation errors. {{ outputs.summarize.vars.warnings }} warnings and {{ outputs.summarize.vars.infos }} info notices, see report.html."
    else:
      - id: log_unchanged
        type: io.kestra.plugin.core.log.Log
        message: "Feed unchanged since the last validated run (sha256 {{ outputs.fingerprint.vars.sha256 }}). Skipping validation."

extend:
  title: Validate a transit agency's GTFS feed whenever it changes
  metaTitle: GTFS feed validation and change monitoring with Kestra
  shortDescription: Download a GTFS feed every day, run the MobilityData validator only when the feed changed, and alert on validation errors.
  metaDescription: Check a GTFS transit feed daily, run the official MobilityData validator when it changes, and alert or fail on errors. Runs with no setup.
  description: |
    Transit agencies publish their schedules as GTFS feeds, and apps such as Google Maps, OneBusAway and trip planners read them. A broken feed means wrong or missing departures for riders, and agencies often republish without notice. This flow downloads a feed every day, validates it with the canonical [MobilityData GTFS validator](https://github.com/MobilityData/gtfs-validator) only when it changed since the last check, and reports the result.

    It runs with no setup. The default feed is the Redding Area Bus Authority, Slack is off and errors do not fail the run.

    ## How it works

    1. `download` (`io.kestra.plugin.core.http.Download`) fetches the zip from `feed_url`.
    2. `fingerprint` (`io.kestra.plugin.scripts.python.Script`) hashes the zip with SHA-256.
    3. `previous_hash` (`io.kestra.plugin.core.kv.Get`) reads the hash stored by the last validated run from the KV store. It is empty on the first run.
    4. `feed_changed` (`io.kestra.plugin.core.flow.If`) validates only when the hash differs, or when `force_validation` is `true`. Otherwise the run ends with a log line.
    5. `validate` runs the validator image `ghcr.io/mobilitydata/gtfs-validator:8.0.1` on the feed and exports `report.json` and `report.html`.
    6. `summarize` (`io.kestra.plugin.scripts.python.Script`) counts ERROR, WARNING and INFO notices and lists the five error codes with the most notices.
    7. `remember_hash` (`io.kestra.plugin.core.kv.Set`) stores the new hash.
    8. `errors_found` posts to Slack when `notify_slack` is `true`, and ends the run as `FAILED` when `fail_on_errors` is `true`. A clean feed gets a log line with the warning and info counts.

    ## Inputs

    - `feed_url` (STRING, default the Redding Area Bus Authority feed): the static GTFS zip to check.
    - `force_validation` (BOOL, default `false`): validate even when the feed is unchanged.
    - `fail_on_errors` (BOOL, default `false`): end the run as `FAILED` when the feed has ERROR notices.
    - `notify_slack` (BOOL, default `false`): post feeds with errors to Slack.

    ## Prerequisites

    - A Kestra worker that can run Docker containers, for the validator and Python images.
    - Network access to the feed URL.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook. Only needed when `notify_slack` is `true`.

    ## Quick start

    1. Save the flow and run it with the defaults. The first run always validates, and the log shows the notice counts.
    2. Run it again. The feed has not changed, so `log_unchanged` skips validation.
    3. Run it with `force_validation` set to `true` to validate the same feed again.
    4. Point `feed_url` at your own agency's feed. The [Mobility Database](https://mobilitydatabase.org) lists thousands of public feeds.
    5. Leave the `daily_check` schedule on to check the feed every morning.

    ## Expected outputs

    - `outputs.validate.outputFiles['report/report.html']`: the full validation report to open in a browser.
    - `outputs.validate.outputFiles['report/report.json']`: the same report as JSON.
    - `outputs.summarize.vars.errors`, `warnings`, `infos`: notice counts by severity.
    - `outputs.summarize.vars.top_errors`: up to five error codes with their notice counts.

    ## Links

    - [GTFS Schedule reference](https://gtfs.org/documentation/schedule/reference/)
    - [MobilityData GTFS validator rules](https://gtfs-validator.mobilitydata.org/rules.html)
    - [Kestra Python Script task](https://kestra.io/plugins/plugin-script-python)
    - [Kestra Slack incoming webhook task](https://kestra.io/plugins/plugin-slack)
    - This blueprint has been created by [omlahore](https://github.com/omlahore)
  tags:
    - Data
  subTags:
    - Testing & Quality
    - Monitoring & Alerting
  ee: false
  demo: true
