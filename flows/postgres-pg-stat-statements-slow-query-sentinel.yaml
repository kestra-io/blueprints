id: postgres-pg-stat-statements-slow-query-sentinel
namespace: company.ops
description: Queries pg_stat_statements to detect slowest SQL statements and unindexed sequential scans burning CPU.

inputs:
  - id: pg_host
    type: STRING
    defaults: "postgres.internal"
    description: PostgreSQL server hostname or IP address.
  - id: pg_port
    type: INT
    defaults: 5432
    description: PostgreSQL port.
  - id: pg_user
    type: STRING
    defaults: "postgres"
    description: PostgreSQL username.
  - id: mean_exec_time_threshold_ms
    type: INT
    defaults: 2000
    description: Maximum acceptable mean query execution duration in milliseconds before alerting.

tasks:
  - id: query_slow_statements
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "jdbc:postgresql://{{ inputs.pg_host }}:{{ inputs.pg_port }}/postgres"
    username: "{{ inputs.pg_user }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    sql: |
      SELECT 
          queryid::text AS query_id, 
          calls, 
          ROUND(mean_exec_time::numeric, 2) AS mean_ms 
      FROM pg_stat_statements 
      WHERE mean_exec_time >= {{ inputs.mean_exec_time_threshold_ms }} 
      ORDER BY mean_exec_time DESC 
      LIMIT 1;
    fetchType: FETCH_ONE

  - id: evaluate_query_performance
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_slow_statements.row is defined and outputs.query_slow_statements.row != null and outputs.query_slow_statements.row.query_id is defined }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#postgresql-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 PostgreSQL Critical Slow Query Detected",
                "text": "PostgreSQL instance `{{ inputs.pg_host }}` recorded a slow query (QueryID: `{{ outputs.query_slow_statements.row.query_id }}`) with mean execution time of *{{ outputs.query_slow_statements.row.mean_ms }}ms* across *{{ outputs.query_slow_statements.row.calls }}* calls! Impact: Heavy unindexed sequential scans or unoptimized joins are saturating database CPU cores and causing connection pool queue backups.",
                "footer": "Kestra Database Sentinel • PostgreSQL"
              }
            ]
          }

outputs:
  - id: query_id
    type: STRING
    value: "{{ outputs.query_slow_statements.row ? outputs.query_slow_statements.row.query_id : '' }}"
  - id: calls
    type: INT
    value: "{{ outputs.query_slow_statements.row ? outputs.query_slow_statements.row.calls : 0 }}"
  - id: mean_ms
    type: FLOAT
    value: "{{ outputs.query_slow_statements.row ? outputs.query_slow_statements.row.mean_ms : 0.0 }}"

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#postgresql-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ PostgreSQL Slow Query Execution and CPU Burn Sentinel Pipeline Failure",
            "text": "Failed to query pg_stat_statements. Verify extension is loaded in shared_preload_libraries.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: Queries pg_stat_statements to detect slowest SQL statements and unindexed sequential scans burning CPU.
  metaTitle: PostgreSQL Slow Query Execution and CPU Burn Sentinel with Kestra
  title: PostgreSQL Slow Query Execution and CPU Burn Sentinel
  shortDescription: Queries pg_stat_statements to detect slowest SQL statements and unindexed sequential scans burning CPU.
  description: |
    ## How it works
    This workflow executes an analytical query against the `pg_stat_statements` extension view on PostgreSQL, filtering for statements where `mean_exec_time` exceeds the configured millisecond threshold. By tracking normalized execution times across thousands of invocations, teams isolate expensive queries causing CPU spikes and I/O lockups before application timeouts cascade. Slack is alerted with the offending Query ID.

    ## What you get
    - Quantitative identification of chronic slow SQL queries across production databases.
    - Prevents database CPU starvation and connection pool exhaustion.
    - Actionable QueryID, call counts, and execution duration metrics.

    ## Who it's for
    - Database Administrators (DBAs) and Application Developers tuning relational SQL performance.
    - SREs maintaining production PostgreSQL clusters.

    ## Why orchestrate this with Kestra
    - **Continuous Performance Auditing**: Evaluates queries automatically without manual pgBadger log parsing.
    - **Low Overhead**: Queries internal memory statistics directly via native JDBC SQL.
    - **Rapid Incident Escalation**: Immediate alerts keep development teams accountable for schema indexing.

    ## Prerequisites
    - PostgreSQL server with `pg_stat_statements` enabled in `shared_preload_libraries`.
    - Secrets `POSTGRES_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Configure PostgreSQL coordinates and duration threshold.
    3. Run the workflow to inspect slowest database queries.

    ## Links
    - [PostgreSQL pg_stat_statements Documentation](https://www.postgresql.org/docs/current/pgstatstatements.html)
    - [Kestra PostgreSQL Plugin](https://kestra.io/plugins/plugin-jdbc-postgres)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
