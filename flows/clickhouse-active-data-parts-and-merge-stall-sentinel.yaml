id: clickhouse-active-data-parts-and-merge-stall-sentinel
namespace: company.sre

description: |
  Audits ClickHouse tables for high active part counts and stalled background merges to prevent 'Too many parts in all data parts in table' errors.

concurrency:
  limit: 1

inputs:
  - id: clickhouse_host
    type: STRING
    displayName: "ClickHouse Host"
    defaults: "clickhouse.internal"
    description: "Host for ClickHouse server."
  - id: clickhouse_port
    type: INT
    displayName: "ClickHouse Port"
    defaults: 9000
    description: "TCP native client port."

triggers:
  - id: scheduled_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: clickhouse/clickhouse-server:24.3-alpine
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      CH_HOST: "{{ inputs.clickhouse_host }}"
      CH_PORT: "{{ inputs.clickhouse_port }}"
      CH_USER: "default"
      CH_PASS: "{{ secret('CLICKHOUSE_PASSWORD') }}"
    commands:
      - |
        PARTS_INFO=$(clickhouse-client --host "$CH_HOST" --port "$CH_PORT" --user "$CH_USER" --password "$CH_PASS" --query "
        SELECT database, table, count() as active_parts
        FROM system.parts
        WHERE active = 1 AND database NOT IN ('system', 'information_schema')
        GROUP BY database, table
        ORDER BY active_parts DESC LIMIT 1
        FORMAT JSON
        " 2>/dev/null)
        if [ -z "$PARTS_INFO" ]; then echo "ClickHouse query failed" >&2; exit 1; fi
        echo "$PARTS_INFO" | jq '{data: .data[0], is_alert: ((.data[0].active_parts // 0) > 300)}' > output.json
    outputFiles:
      - output.json

  - id: evaluate_threshold
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.probe_metrics.outputFiles['output.json'])).is_alert }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#infrastructure-alerts",
            "text": "🚨 *ClickHouse Part Count Alert: `{{ inputs.clickhouse_host }}`*\n- *Table*: `{{ json(read(outputs.probe_metrics.outputFiles['output.json'])).data.database }}.{{ json(read(outputs.probe_metrics.outputFiles['output.json'])).data.table }}`\n- *Active Parts*: `{{ json(read(outputs.probe_metrics.outputFiles['output.json'])).data.active_parts }}`"
          }

errors:
  - id: notify_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#infrastructure-alerts",
        "text": "❌ *Sentinel probe execution failed for clickhouse-active-data-parts-and-merge-stall-sentinel*"
      }

extend:
  title: Clickhouse active data parts and mutation stall sentinel
  shortDescription: Audits ClickHouse tables for high active part counts and stalled background merges to prevent 'Too many parts in all data parts in table' errors.
  description: |
    Audits ClickHouse tables for high active part counts and stalled background merges to prevent 'Too many parts in all data parts in table' errors.

    ## How it works
    1. A schedule trigger or manual execution connects to the target infrastructure service endpoint.
    2. Runs diagnostic status queries inside an isolated container runner to extract health telemetry.
    3. Evaluates health metrics against defined thresholds to flag operational anomalies.
    4. Dispatches actionable alerts to Slack with resource metrics and remediation guidance.

    ## What you get
    - Proactive infrastructure monitoring without managing external monitoring agents.
    - Automated detection of system degradation before outages impact production services.
    - Actionable Slack notifications equipped with diagnostic metrics.

    ## Who it's for
    - Site Reliability Engineers (SREs) and DevOps engineers maintaining high availability.
    - Platform Engineers and Database Administrators operating distributed infrastructure.
    - Operations teams requiring automated incident alerting.

    ## Why orchestrate this with Kestra
    - Runs declarative probes directly with native plugins and container tasks.
    - Securely stores sensitive connection credentials in Kestra namespace secrets.
    - Maintains a complete historical audit log of every health check execution.

    ## Prerequisites
    - Network connectivity to the target service from Kestra worker pods.
    - Service credentials and `SLACK_WEBHOOK` secret configured in the Kestra namespace.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Configure the required namespace secrets.
    3. Run a manual execution to test connectivity.
    4. Enable the schedule trigger for continuous background monitoring.

    ## How to extend
    - Add automated remediation tasks (e.g. restart service, failover replica, purge queues).
    - Route critical alerts to PagerDuty or OpsGenie.
    - Forward historical telemetry to long-term data warehouses.

    ## Links
    - [Kestra Documentation](https://kestra.io/docs)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Databases
  ee: false
  demo: false
