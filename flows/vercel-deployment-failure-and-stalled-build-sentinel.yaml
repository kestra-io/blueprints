id: vercel-deployment-failure-and-stalled-build-sentinel
namespace: company.platform

description: |
  Audit Vercel team deployments across projects for failed builds and stalled pipelines.
  Dispatches real-time Slack alerts containing direct inspector links, author details,
  branch names, and commit summaries, tagging execution telemetry for operational observability.

inputs:
  - id: vercel_api_token
    type: STRING
    displayName: Vercel API Token
    description: >-
      Vercel Personal or Team Access Token with deployment read permissions.
      Leave blank to automatically use the VERCEL_API_TOKEN secret.
    defaults: ""

  - id: team_id
    type: STRING
    displayName: Vercel Team ID or Slug
    description: Optional Vercel Team ID or slug (e.g. team_xxxx) to audit team-scoped projects. Leave blank for personal accounts.
    defaults: ""

  - id: project_id
    type: STRING
    displayName: Vercel Project ID or Name
    description: Optional Vercel project ID or name to filter the audit. Leave blank to audit all projects in the account or team.
    defaults: ""

  - id: lookback_window_minutes
    type: INT
    displayName: Lookback Window (Minutes)
    description: Lookback duration in minutes to detect recent failed deployments (state ERROR).
    defaults: 60

  - id: stalled_threshold_minutes
    type: INT
    displayName: Stalled Build Threshold (Minutes)
    description: Duration in minutes after which an active deployment in BUILDING, INITIALIZING, or QUEUED state is flagged as stalled.
    defaults: 15

  - id: max_deployments
    type: INT
    displayName: Max Deployments to Audit
    description: Maximum number of recent deployments to fetch from the Vercel REST API (up to 100).
    defaults: 50

  - id: fail_on_incident
    type: BOOL
    displayName: Fail Flow on Detected Incidents
    description: When true, marks the Kestra execution as failed if any deployment failure or stalled build is detected.
    defaults: false

triggers:
  - id: hourly_vercel_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled hourly sentinel surveillance for Vercel deployment health. Shipped disabled by default.
    cron: "0 * * * *"
    disabled: true

tasks:
  - id: audit_vercel_deployments
    type: io.kestra.plugin.scripts.python.Script
    description: Queries the Vercel v6 Deployments API, inspects deployment states against lookback and stall thresholds, and produces structured incident telemetry.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    script: |
      import os
      import json
      import time
      import urllib.request
      import urllib.error
      import urllib.parse
      from datetime import datetime, timezone

      try:
          from kestra import Kestra
      except ImportError:
          Kestra = None

      token = "{{ inputs.vercel_api_token != '' ? inputs.vercel_api_token : secret('VERCEL_API_TOKEN') }}"
      team_id = "{{ inputs.team_id }}".strip()
      project_id = "{{ inputs.project_id }}".strip()
      lookback_window_minutes = int("{{ inputs.lookback_window_minutes }}")
      stalled_threshold_minutes = int("{{ inputs.stalled_threshold_minutes }}")
      max_deployments = int("{{ inputs.max_deployments }}")

      now_ms = int(time.time() * 1000)
      lookback_ms = lookback_window_minutes * 60 * 1000
      stalled_threshold_ms = stalled_threshold_minutes * 60 * 1000

      params = {"limit": str(max(1, min(max_deployments, 100)))}
      if team_id:
          params["teamId"] = team_id
      if project_id:
          params["app"] = project_id

      query_string = urllib.parse.urlencode(params)
      api_url = f"https://api.vercel.com/v6/deployments?{query_string}"

      headers = {
          "Authorization": f"Bearer {token}",
          "Content-Type": "application/json",
          "User-Agent": "kestra-vercel-sentinel/1.0"
      }

      req = urllib.request.Request(api_url, headers=headers, method="GET")

      try:
          with urllib.request.urlopen(req, timeout=30) as response:
              raw_body = response.read().decode("utf-8")
              payload = json.loads(raw_body)
      except urllib.error.HTTPError as e:
          err_msg = e.read().decode("utf-8") if e.fp else str(e)
          print(f"HTTPError {e.code} contacting Vercel API: {err_msg}")
          raise RuntimeError(f"Vercel API returned HTTP {e.code}: {err_msg}")
      except Exception as e:
          print(f"Error querying Vercel deployments: {e}")
          raise

      deployments = payload.get("deployments", [])
      print(f"Retrieved {len(deployments)} recent deployments from Vercel API.")

      incidents = []
      failed_count = 0
      stalled_count = 0

      for d in deployments:
          uid = d.get("uid") or d.get("id") or "unknown"
          name = d.get("name", "unknown")
          url = d.get("url", "")
          if url and not url.startswith("http"):
              url = f"https://{url}"

          state = str(d.get("state") or d.get("readyState") or "UNKNOWN").upper()
          created = int(d.get("created") or d.get("createdAt") or 0)
          target = d.get("target") or "preview"

          meta = d.get("meta") or {}
          commit_ref = (
              meta.get("githubCommitRef")
              or meta.get("gitlabCommitRef")
              or meta.get("bitbucketCommitRef")
              or meta.get("branch")
              or "unknown"
          )
          commit_sha = (meta.get("githubCommitSha") or meta.get("commitSha") or "")[:8]
          author = (
              meta.get("githubCommitAuthorName")
              or (d.get("creator") or {}).get("username")
              or (d.get("creator") or {}).get("email")
              or "unknown"
          )
          commit_msg = (meta.get("githubCommitMessage") or "").split("\n")[0][:80]

          creator_name = (d.get("creator") or {}).get("username") or team_id or "team"
          inspector_url = f"https://vercel.com/{creator_name}/{name}/{uid}"

          age_ms = now_ms - created if created > 0 else 0
          age_minutes = int(round(age_ms / 60000.0))

          if state == "ERROR":
              if age_ms <= lookback_ms:
                  failed_count += 1
                  incidents.append({
                      "incident_type": "FAILED_DEPLOYMENT",
                      "severity": "CRITICAL" if target == "production" else "HIGH",
                      "deployment_id": uid,
                      "project_name": name,
                      "environment": target,
                      "state": state,
                      "branch": commit_ref,
                      "commit_sha": commit_sha,
                      "author": author,
                      "commit_message": commit_msg,
                      "age_minutes": age_minutes,
                      "url": url,
                      "inspector_url": inspector_url
                  })
          elif state in ("BUILDING", "INITIALIZING", "QUEUED"):
              if age_ms >= stalled_threshold_ms:
                  stalled_count += 1
                  incidents.append({
                      "incident_type": "STALLED_BUILD",
                      "severity": "CRITICAL" if target == "production" else "MEDIUM",
                      "deployment_id": uid,
                      "project_name": name,
                      "environment": target,
                      "state": state,
                      "branch": commit_ref,
                      "commit_sha": commit_sha,
                      "author": author,
                      "commit_message": commit_msg,
                      "age_minutes": age_minutes,
                      "url": url,
                      "inspector_url": inspector_url
                  })

      total_audited = len(deployments)
      total_incidents = len(incidents)
      has_incidents = total_incidents > 0

      summary_lines = []
      if has_incidents:
          summary_lines.append(f"*{total_incidents} anomaly(ies) detected* ({failed_count} build failure(s), {stalled_count} stalled build(s)) across {total_audited} inspected deployments.\n")
          for inc in incidents:
              icon = "🔴" if inc["incident_type"] == "FAILED_DEPLOYMENT" else "⏳"
              summary_lines.append(
                  f"{icon} *[{inc['severity']}] {inc['project_name']}* (`{inc['environment']}`) — State: `{inc['state']}` ({inc['age_minutes']}m elapsed)\n"
                  f"   • Branch: `{inc['branch']}` @ `{inc['commit_sha']}` by *{inc['author']}*\n"
                  f"   • Message: _{inc['commit_message']}_\n"
                  f"   • Dashboard: <{inc['inspector_url']}|Inspect on Vercel>"
              )
      else:
          summary_lines.append(f"All {total_audited} audited deployments are healthy. Zero build failures or stalled pipelines detected.")

      summary_text = "\n".join(summary_lines)
      print(summary_text)

      if Kestra:
          Kestra.outputs({
              "total_audited": total_audited,
              "failed_count": failed_count,
              "stalled_count": stalled_count,
              "total_incidents": total_incidents,
              "has_incidents": has_incidents,
              "incidents": incidents,
              "summary_text": summary_text
          })

  - id: label_execution
    type: io.kestra.plugin.core.execution.Labels
    description: Tags the execution with incident status and counts for filtering in the Kestra UI.
    labels:
      has_incidents: "{{ outputs.audit_vercel_deployments.vars.has_incidents }}"
      failed_count: "{{ outputs.audit_vercel_deployments.vars.failed_count }}"
      stalled_count: "{{ outputs.audit_vercel_deployments.vars.stalled_count }}"

  - id: gate_incident_response
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether any deployment failures or stalled builds were detected and triggers incident notifications.
    condition: "{{ outputs.audit_vercel_deployments.vars.has_incidents }}"
    then:
      - id: notify_slack_incidents
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches an incident alert to Slack detailing failed deployments and stalled builds with direct inspector links.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🚨 *Vercel Deployment Sentinel Alert*\n{{ outputs.audit_vercel_deployments.vars.summary_text }}"
          }

      - id: log_incident_summary
        type: io.kestra.plugin.core.log.Log
        description: Logs an itemized warning with all detected deployment anomalies.
        message: >-
          ⚠️ Vercel Sentinel Alert: {{ outputs.audit_vercel_deployments.vars.total_incidents }} incident(s) detected.
          Failed builds: {{ outputs.audit_vercel_deployments.vars.failed_count }} | Stalled builds: {{ outputs.audit_vercel_deployments.vars.stalled_count }} out of {{ outputs.audit_vercel_deployments.vars.total_audited }} inspected deployments.

      - id: evaluate_fail_condition
        type: io.kestra.plugin.core.flow.If
        description: Checks if fail_on_incident input is enabled to terminate the execution with failure.
        condition: "{{ inputs.fail_on_incident }}"
        then:
          - id: fail_execution
            type: io.kestra.plugin.core.execution.Fail
            description: Fails the execution to trigger on-call escalation or downstream failure gates.
    else:
      - id: log_sentinel_healthy
        type: io.kestra.plugin.core.log.Log
        description: Logs confirmation that all audited Vercel deployments are healthy and within SLA.
        message: >-
          ✅ Vercel Sentinel: All {{ outputs.audit_vercel_deployments.vars.total_audited }} deployments verified healthy.
          Zero build errors or stalled pipelines detected across inspected projects.

errors:
  - id: alert_sentinel_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Notifies on-call engineers if the sentinel flow encounters an unhandled API or network failure.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "❌ *Vercel Deployment Sentinel Execution Failed*\nFlow `{{ flow.id }}` in namespace `{{ flow.namespace }}` failed (execution `{{ execution.id }}`). Check Kestra execution logs for connection or API error details."
      }

extend:
  title: Vercel Deployment Failure and Stalled Build Sentinel
  metaTitle: Vercel Deployment Failure and Stalled Build Sentinel | Kestra
  shortDescription: Audit Vercel team deployments for failed builds and stalled pipelines, dispatching actionable Slack alerts with direct inspector links and commit metadata.
  metaDescription: Audit Vercel deployments for failed builds and stalled pipelines, alerting platform teams on Slack with direct build links and commit details.
  description: |
    Modern web applications deployed on Vercel frequently trigger automated builds on every pull request and production merge. However, broken package dependencies, TypeScript compiler errors, memory exhaustion during Server-Side Generation (SSG), or wedged build scripts often cause deployments to either crash with an `ERROR` state or hang indefinitely in `BUILDING` or `QUEUED` states. When developers switch context after pushing code, these broken builds remain undetected until end users or QA engineers report outdated preview links or blocked production releases. Furthermore, hung builds consume limited team build concurrency slots, stalling subsequent deployments across the entire engineering organization.

    This blueprint provides an autonomous, production-ready sentinel for Vercel deployment observability. It queries Vercel's REST API (`GET https://api.vercel.com/v6/deployments`) to inspect recent deployments across all projects or specific applications, identifies failed builds within a configurable lookback window, detects stalled builds exceeding SLA thresholds, dispatches rich incident alerts to Slack with direct Vercel inspection links and Git metadata, and publishes structured execution telemetry for operational reporting.

    ## How it works

    1. `hourly_vercel_audit` (`io.kestra.plugin.core.trigger.Schedule`) triggers the flow on a recurring hourly schedule (shipped disabled by default for on-demand or scheduled operation).
    2. `audit_vercel_deployments` (`io.kestra.plugin.scripts.python.Script`) queries Vercel's REST API using Python's standard library `urllib`, passing authentication credentials, team ID, and project filters. It cross-references deployment states against `lookback_window_minutes` and `stalled_threshold_minutes`, categorizing incidents by severity (`CRITICAL` for production, `HIGH`/`MEDIUM` for preview environments), extracts author, branch, and commit details, and emits structured metrics via Kestra outputs.
    3. `label_execution` (`io.kestra.plugin.core.execution.Labels`) attaches `has_incidents`, `failed_count`, and `stalled_count` labels to the execution for quick visual filtering and dashboard queries in the Kestra UI.
    4. `gate_incident_response` (`io.kestra.plugin.core.flow.If`) evaluates whether any failed or stalled builds were detected:
       - If incidents are found, `notify_slack_incidents` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) broadcasts an actionable incident alert to Slack containing direct links to Vercel inspector dashboards, and `log_incident_summary` logs the breakdown.
       - If `fail_on_incident` is enabled, `fail_execution` (`io.kestra.plugin.core.execution.Fail`) fails the execution to trigger PagerDuty alerts or parent workflow failure handlers.
       - If all deployments are healthy, `log_sentinel_healthy` confirms zero anomalies.
    5. The global `errors` block intercepts API failures, token invalidations, or network disruptions, alerting on-call staff immediately to guarantee sentinel reliability.

    ## What you get

    - **Automated Deployment Health Surveillance**: Proactively audits active and recent Vercel builds across teams and projects without relying on developers manually checking preview URLs.
    - **Dual-Mode Incident Detection**: Flags both hard build failures (`ERROR`) and silent build stalls (`BUILDING`/`QUEUED` exceeding SLA thresholds) that block deployment concurrency.
    - **Context-Rich Slack Notifications**: Dispatches incident messages including project names, target environments, Git commit hashes, author usernames, commit messages, and direct Vercel inspector links.
    - **Execution Telemetry & Tagging**: Emits typed outputs (`total_audited`, `failed_count`, `stalled_count`, `incidents`) and dynamic Kestra labels for monitoring and audit logging.
    - **Configurable Enforcement**: Supports non-disruptive surveillance mode (`fail_on_incident: false`) or strict CI/CD gate mode (`fail_on_incident: true`).

    ## Who it's for

    - **Frontend & Full-Stack Engineers**: Ensuring PR preview deployments and production releases complete reliably without silent build stalls.
    - **Platform & DevOps Engineers**: Managing Vercel team concurrency and preventing orphaned or runaway build processes from blocking shared build slots.
    - **Site Reliability Engineers (SREs)**: Automating continuous deployment health surveillance and mean-time-to-detection (MTTD) alerting.

    ## Why orchestrate this with Kestra

    Monitoring Vercel deployments across dozens of micro-frontends and monorepo workspaces via custom shell scripts or cron jobs suffers from credential exposure, lack of error handling, and fragmented log storage. Kestra provides a declarative, production-grade orchestration engine: managing encrypted Vercel access tokens, executing containerized or process-isolated audit scripts, tagging executions with operational metrics, dynamically routing alerts via Slack plugins, and safeguarding the sentinel itself with automated failure handling.

    ## Prerequisites

    - A Vercel account with Personal Access Token or Team Token configured with deployment read permissions (`Deployments: Read`).
    - A Slack incoming webhook URL for operational alerting.

    ### Secrets

    - `VERCEL_API_TOKEN`: Vercel Personal Access Token or Team Token used to authenticate against `https://api.vercel.com/v6/deployments`.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL to receive deployment incident notifications and execution failure alerts.

    ## Quick start

    1. Add `VERCEL_API_TOKEN` and `SLACK_WEBHOOK_URL` to your Kestra namespace secrets.
    2. Execute the flow manually with default inputs to verify connectivity and audit recent deployments.
    3. Review the execution output variables, labels, and Slack notification to verify monitored project health.
    4. Enable the `hourly_vercel_audit` schedule trigger to activate autonomous hourly surveillance.

    ## How to extend

    - **Auto-Cancellation of Stalled Builds**: Integrate `io.kestra.plugin.core.http.Request` to issue `POST https://api.vercel.com/v12/deployments/{id}/cancel` to automatically terminate stalled builds and unblock team build concurrency.
    - **Linear or Jira Ticket Creation**: Add Jira or GitHub issue creation tasks to automatically create bug tickets for production deployment failures.
    - **Multi-Team Fan-Out**: Wrap the sentinel in an outer `ForEach` loop iterating over multiple Vercel team IDs or client workspaces.
    - **Historical Build SLA Trending**: Persist deployment durations and failure counts to DuckDB, Snowflake, or ClickHouse using Kestra storage plugins to track team deployment reliability over time.

    ## Links

    - [Kestra Python Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Vercel Deployments API Reference](https://vercel.com/docs/rest-api/endpoints/deployments)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - CI/CD & Deployment
    - Monitoring & Alerting
    - Incident Response
  ee: false
  demo: false
