id: website-uptime-ssl-monitor
namespace: company.team

description: |
  Stateful website uptime and SSL expiry monitor. The flow checks every site
  on your list for HTTP availability, measures response time, and reads each
  HTTPS certificate's expiry date, then compares against the previous run
  stored in the KV Store and alerts you on Slack only when something
  actually changed: a site went down, a certificate newly entered the
  warning window, or a site recovered.

inputs:
  - id: sites
    type: ARRAY
    itemType: STRING
    displayName: Websites to monitor
    description: Full URLs to check, one per entry. HTTPS sites also get an SSL expiry check.
    defaults:
      - https://kestra.io
      - https://example.com
  - id: ssl_warning_days
    type: INT
    displayName: SSL warning threshold (days)
    description: Alert when a certificate expires within this many days.
    defaults: 14
  - id: timeout_seconds
    type: INT
    displayName: Request timeout (seconds)
    description: How long to wait for each site before marking it down.
    defaults: 10
  - id: slack_webhook
    type: STRING
    displayName: Slack webhook URL (optional)
    description: Incoming webhook for downtime and SSL alerts. Leave empty to skip Slack alerts.
    defaults: ""

tasks:
  - id: check_sites
    type: io.kestra.plugin.scripts.python.Script
    description: Check every site for HTTP status, response time, and SSL certificate expiry date. Failures are captured per site, never fatal to the flow.
    outputFiles:
      - results.json
    script: |
      import json
      import socket
      import ssl
      import time
      import urllib.request
      import urllib.error
      from datetime import datetime, timezone
      from urllib.parse import urlparse

      results = []
      for site in {{ inputs.sites | toJson }}:
          row = {"site": site, "status": "unknown", "http_status": None, "response_ms": None, "ssl_days_left": None, "ssl_expires_on": None, "error": None}
          started = time.time()
          try:
              req = urllib.request.Request(site, headers={"User-Agent": "Kestra-Uptime-Monitor/1.0"})
              with urllib.request.urlopen(req, timeout={{ inputs.timeout_seconds }}) as resp:
                  row["http_status"] = resp.status
                  row["status"] = "up" if resp.status < 400 else "down"
          except urllib.error.HTTPError as e:
              row["http_status"] = e.code
              row["status"] = "down"
              row["error"] = f"HTTP {e.code}"
          except Exception as e:
              row["status"] = "down"
              row["error"] = str(e)[:200]
          row["response_ms"] = round((time.time() - started) * 1000)

          parsed = urlparse(site)
          if parsed.scheme == "https":
              try:
                  ctx = ssl.create_default_context()
                  with socket.create_connection((parsed.hostname, parsed.port or 443), timeout={{ inputs.timeout_seconds }}) as sock:
                      with ctx.wrap_socket(sock, server_hostname=parsed.hostname) as ssock:
                          cert = ssock.getpeercert()
                  expiry = datetime.strptime(cert["notAfter"], "%b %d %H:%M:%S %Y %Z").replace(tzinfo=timezone.utc)
                  row["ssl_days_left"] = (expiry - datetime.now(timezone.utc)).days
                  row["ssl_expires_on"] = expiry.strftime("%Y-%m-%d")
              except Exception as e:
                  row["error"] = (row["error"] or "") + f" | SSL check failed: {str(e)[:120]}"

          results.append(row)

      with open("results.json", "w") as f:
          json.dump(results, f, indent=2)

      for row in results:
          ssl_note = f", SSL expires {row['ssl_expires_on']} ({row['ssl_days_left']}d)" if row["ssl_expires_on"] else ""
          print(f"{row['site']} -> {row['status'].upper()} (HTTP {row['http_status']}, {row['response_ms']}ms{ssl_note})")

  - id: previous_state
    type: io.kestra.plugin.core.kv.Get
    description: Load the previous run's results from the KV Store. Missing on the first run, which is fine.
    key: website-monitor-last-state
    errorOnMissing: false

  - id: detect_changes
    type: io.kestra.plugin.scripts.python.Script
    description: Compare current results against the previous run. Only genuine state changes produce alerts, so a site that stays down does not spam Slack every run.
    outputFiles:
      - changes.json
    script: |
      import json

      current = json.load(open("{{ outputs.check_sites.files['results.json'] }}"))
      previous_raw = """{{ outputs.previous_state.value | default('[]') }}"""
      try:
          previous = json.loads(previous_raw) if previous_raw.strip() else []
      except json.JSONDecodeError:
          previous = []
      prev_by_site = {r["site"]: r for r in previous if isinstance(r, dict) and "site" in r}

      threshold = {{ inputs.ssl_warning_days }}
      changes = {"newly_down": [], "newly_expiring": [], "recovered": []}
      for row in current:
          site = row["site"]
          prev = prev_by_site.get(site, {})
          prev_status = prev.get("status")
          prev_ssl = prev.get("ssl_days_left")

          if row["status"] == "down" and prev_status != "down":
              changes["newly_down"].append(row)
          if row["status"] == "up" and prev_status == "down":
              changes["recovered"].append(row)
          if row["ssl_days_left"] is not None and row["ssl_days_left"] < threshold and (prev_ssl is None or prev_ssl >= threshold):
              changes["newly_expiring"].append(row)

      with open("changes.json", "w") as f:
          json.dump(changes, f, indent=2)

      print(f"Changes: {len(changes['newly_down'])} newly down, {len(changes['newly_expiring'])} newly expiring, {len(changes['recovered'])} recovered")

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    description: Persist the current results as the baseline for the next run's comparison.
    key: website-monitor-last-state
    value: "{{ read(outputs.check_sites.files['results.json']) }}"
    kvType: JSON

  - id: report
    type: io.kestra.plugin.core.log.Log
    description: Print the full status report in the execution logs.
    message: |
      ## Website status report ({{ inputs.sites | length }} sites)

      {% for row in outputs.check_sites.files['results.json'] | fromJson %}
      - **{{ row.site }}** — {{ row.status | upper }}{% if row.http_status %} (HTTP {{ row.http_status }}){% endif %}{% if row.response_ms %} — {{ row.response_ms }}ms{% endif %}{% if row.ssl_expires_on %} — SSL expires {{ row.ssl_expires_on }} ({{ row.ssl_days_left }} days){% endif %}{% if row.error %} — {{ row.error }}{% endif %}
      {% endfor %}

  - id: needs_alert
    type: io.kestra.plugin.core.flow.If
    description: Alert only on genuine state changes, never on a repeat of the same problem.
    condition: "{{ (outputs.detect_changes.files['changes.json'] | fromJson).newly_down | length > 0 or (outputs.detect_changes.files['changes.json'] | fromJson).newly_expiring | length > 0 or (outputs.detect_changes.files['changes.json'] | fromJson).recovered | length > 0 }}"
    tasks:
      - id: slack_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Send state-change alerts to Slack, with exact SSL expiry dates.
        url: "{{ inputs.slack_webhook }}"
        payload: |
          {
            "text": ":rotating_light: Website monitor: state changed (execution {{ execution.id }})",
            "blocks": [
              {"type": "section", "text": {"type": "mrkdwn", "text": "{% set c = outputs.detect_changes.files['changes.json'] | fromJson %}{% if c.newly_down | length > 0 %}*Down:*\n{% for row in c.newly_down %}• {{ row.site }} (HTTP {{ row.http_status }})\n{% endfor %}{% endif %}{% if c.newly_expiring | length > 0 %}*SSL expiring soon:*\n{% for row in c.newly_expiring %}• {{ row.site }} — expires {{ row.ssl_expires_on }} ({{ row.ssl_days_left }} days left)\n{% endfor %}{% endif %}{% if c.recovered | length > 0 %}*Recovered:*\n{% for row in c.recovered %}• {{ row.site }} is back up\n{% endfor %}{% endif %}"}}
            ]
          }

extend:
  title: Website Uptime and SSL Expiry Monitor
  metaTitle: Website Uptime and SSL Monitor with Kestra
  shortDescription: Check a list of websites for uptime, response time, and SSL certificate expiry, track state in the KV Store, and get a Slack alert only when something actually changes.
  description: |
    Every website goes down eventually, and expired SSL certificates are one of the most embarrassing ways to do it. This blueprint watches both, but unlike a naive monitor it is stateful: it keeps the last run's results in Kestra's KV Store and alerts only when something actually changes, so a site that stays down for a weekend sends one alert, not ninety-six.

    ## How it works

    1. The `check_sites` task (`io.kestra.plugin.scripts.python.Script`) loops over your `sites` list using only the Python standard library, so there are no extra dependencies to install. For each site it records the HTTP status code, response time in milliseconds, and, for HTTPS sites, the certificate's exact expiry date plus days remaining. A failure on one site is captured in that site's row and never kills the whole run.
    2. The `previous_state` task (`io.kestra.plugin.core.kv.Get`) loads the last run's results from the KV Store, tolerating a missing key on the first run.
    3. The `detect_changes` task compares current results against the previous run and classifies each site: newly down, newly within the SSL warning window, or recovered. A site that was already down or already expiring soon produces no alert.
    4. The `save_state` task (`io.kestra.plugin.core.kv.Set`) persists the current results as the baseline for the next run.
    5. The `report` task (`io.kestra.plugin.core.log.Log`) renders the full status table in the execution logs.
    6. The `needs_alert` task (`io.kestra.plugin.core.flow.If`) fires only when there is at least one genuine state change, and `slack_alert` sends the details to your Slack webhook, including each certificate's exact expiry date.

    ## Who it's for

    - Small teams and solo founders who run client websites and can't afford a paid uptime service for every domain.
    - Anyone managing several domains who has been bitten by an expired certificate before.
    - Platform teams who want a self-hosted, no-vendor status check they can schedule and extend.

    ## Prerequisites

    - A running Kestra instance with the Python script plugin available.
    - Outbound network access from the worker to the sites you monitor.
    - A Slack incoming webhook URL if you want alerts (optional; leave it empty to skip).

    ## Quick start

    1. Create the flow from this blueprint.
    2. Edit the `sites` input to your domains.
    3. Set `ssl_warning_days` to how much lead time you want before a cert expires (14 by default).
    4. Optionally paste a Slack webhook URL.
    5. Put the flow on a schedule (for example every 15 minutes) and you have a free uptime monitor. The first run establishes the baseline; from the second run on, alerts fire only on changes.

    ## How to extend

    - Store each run's results in a database and chart uptime over time.
    - Add a second alert channel (email, PagerDuty, Discord) alongside Slack.
    - Check page content for a keyword, so you catch the "200 OK but showing an error page" case too.

    ## Links

    - [Python script plugin docs](https://kestra.io/plugins/plugin-scripts-python)
    - [Slack notifications plugin docs](https://kestra.io/plugins/plugin-notifications)
    - [KV Store docs](https://kestra.io/docs/concepts/kv-store)
  tags:
    - Monitoring
  subTags:
    - Uptime & Alerts
  ee: false
  demo: false
  metaDescription: Stateful website uptime and SSL monitor with Kestra. KV Store tracks last state so Slack alerts fire only on changes, with exact cert expiry dates.
