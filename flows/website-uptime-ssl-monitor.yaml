id: website-uptime-ssl-monitor
namespace: company.team

description: |
  Website uptime and SSL expiry monitor. The flow checks every site on your
  list for HTTP availability, measures response time, and reads each HTTPS
  certificate's expiry date, then logs a status report and alerts you on
  Slack when a site is down or a certificate is about to expire.

inputs:
  - id: sites
    type: ARRAY
    itemType: STRING
    displayName: Websites to monitor
    description: Full URLs to check, one per entry. HTTPS sites also get an SSL expiry check.
    defaults:
      - https://kestra.io
      - https://example.com
  - id: ssl_warning_days
    type: INT
    displayName: SSL warning threshold (days)
    description: Alert when a certificate expires within this many days.
    defaults: 14
  - id: timeout_seconds
    type: INT
    displayName: Request timeout (seconds)
    description: How long to wait for each site before marking it down.
    defaults: 10
  - id: slack_webhook
    type: STRING
    displayName: Slack webhook URL (optional)
    description: Incoming webhook for downtime and SSL alerts. Leave empty to skip Slack alerts.
    defaults: ""

tasks:
  - id: check_sites
    type: io.kestra.plugin.scripts.python.Script
    description: Check every site for HTTP status, response time, and SSL certificate expiry. Failures are captured per site, never fatal to the flow.
    outputFiles:
      - results.json
    script: |
      import json
      import socket
      import ssl
      import time
      import urllib.request
      import urllib.error
      from datetime import datetime, timezone
      from urllib.parse import urlparse

      results = []
      for site in {{ inputs.sites | toJson }}:
          row = {"site": site, "status": "unknown", "http_status": None, "response_ms": None, "ssl_days_left": None, "error": None}
          started = time.time()
          try:
              req = urllib.request.Request(site, headers={"User-Agent": "Kestra-Uptime-Monitor/1.0"})
              with urllib.request.urlopen(req, timeout={{ inputs.timeout_seconds }}) as resp:
                  row["http_status"] = resp.status
                  row["status"] = "up" if resp.status < 400 else "down"
          except urllib.error.HTTPError as e:
              row["http_status"] = e.code
              row["status"] = "down"
              row["error"] = f"HTTP {e.code}"
          except Exception as e:
              row["status"] = "down"
              row["error"] = str(e)[:200]
          row["response_ms"] = round((time.time() - started) * 1000)

          parsed = urlparse(site)
          if parsed.scheme == "https":
              try:
                  ctx = ssl.create_default_context()
                  with socket.create_connection((parsed.hostname, parsed.port or 443), timeout={{ inputs.timeout_seconds }}) as sock:
                      with ctx.wrap_socket(sock, server_hostname=parsed.hostname) as ssock:
                          cert = ssock.getpeercert()
                  expiry = datetime.strptime(cert["notAfter"], "%b %d %H:%M:%S %Y %Z").replace(tzinfo=timezone.utc)
                  row["ssl_days_left"] = (expiry - datetime.now(timezone.utc)).days
              except Exception as e:
                  row["error"] = (row["error"] or "") + f" | SSL check failed: {str(e)[:120]}"

          results.append(row)

      with open("results.json", "w") as f:
          json.dump(results, f, indent=2)

      for row in results:
          ssl_note = f", SSL expires in {row['ssl_days_left']}d" if row["ssl_days_left"] is not None else ""
          print(f"{row['site']} -> {row['status'].upper()} (HTTP {row['http_status']}, {row['response_ms']}ms{ssl_note})")

  - id: report
    type: io.kestra.plugin.core.log.Log
    description: Print the full status report in the execution logs.
    message: |
      ## Website status report ({{ inputs.sites | length }} sites)

      {% for row in outputs.check_sites.files['results.json'] | fromJson %}
      - **{{ row.site }}** — {{ row.status | upper }}{% if row.http_status %} (HTTP {{ row.http_status }}){% endif %}{% if row.response_ms %} — {{ row.response_ms }}ms{% endif %}{% if row.ssl_days_left is not none %} — SSL expires in {{ row.ssl_days_left }} days{% endif %}{% if row.error %} — {{ row.error }}{% endif %}
      {% endfor %}

  - id: needs_alert
    type: io.kestra.plugin.core.flow.If
    description: Alert only when something is actually wrong, so a clean run stays quiet.
    condition: "{{ (outputs.check_sites.files['results.json'] | fromJson | selectattr('status', 'equalto', 'down') | list | length > 0) or (outputs.check_sites.files['results.json'] | fromJson | selectattr('ssl_days_left', 'defined') | selectattr('ssl_days_left', 'lt', inputs.ssl_warning_days) | list | length > 0) }}"
    tasks:
      - id: slack_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Send downtime and SSL expiry alerts to Slack.
        url: "{{ inputs.slack_webhook }}"
        payload: |
          {
            "text": ":rotating_light: Website monitor alert (execution {{ execution.id }})",
            "blocks": [
              {"type": "section", "text": {"type": "mrkdwn", "text": "*Sites down or SSL expiring soon:*\n{% for row in outputs.check_sites.files['results.json'] | fromJson %}{% if row.status == 'down' or (row.ssl_days_left is not none and row.ssl_days_left < inputs.ssl_warning_days) %}• {{ row.site }} — {{ row.status | upper }}{% if row.ssl_days_left is not none %} (SSL: {{ row.ssl_days_left }} days left){% endif %}\n{% endif %}{% endfor %}"}}
            ]
          }

extend:
  title: Website Uptime and SSL Expiry Monitor
  metaTitle: Website Uptime and SSL Monitor with Kestra
  shortDescription: Check a list of websites for uptime, response time, and SSL certificate expiry, log a status report, and get a Slack alert when something breaks or a cert is about to expire.
  description: |
    Every website goes down eventually, and expired SSL certificates are one of the most embarrassing ways to do it. This blueprint watches both: it checks every site on your list for HTTP availability and response time, reads each HTTPS certificate's expiry date, logs a clean status report, and alerts you on Slack only when something is actually wrong.

    ## How it works

    1. The `check_sites` task (`io.kestra.plugin.scripts.python.Script`) loops over your `sites` list using only the Python standard library, so there are no extra dependencies to install. For each site it records the HTTP status code, response time in milliseconds, and, for HTTPS sites, the number of days until the certificate expires. A failure on one site is captured in that site's row and never kills the whole run.
    2. The `report` task (`io.kestra.plugin.core.log.Log`) renders the full status table in the execution logs.
    3. The `needs_alert` task (`io.kestra.plugin.core.flow.If`) fires only when a site is down or a certificate expires within your `ssl_warning_days` threshold, and the `slack_alert` task sends the details to your Slack webhook. Clean runs stay quiet.

    ## Who it's for

    - Small teams and solo founders who run client websites and can't afford a paid uptime service for every domain.
    - Anyone managing several domains who has been bitten by an expired certificate before.
    - Platform teams who want a self-hosted, no-vendor status check they can schedule and extend.

    ## Prerequisites

    - A running Kestra instance with the Python script plugin available.
    - Outbound network access from the worker to the sites you monitor.
    - A Slack incoming webhook URL if you want alerts (optional; leave it empty to skip).

    ## Quick start

    1. Create the flow from this blueprint.
    2. Edit the `sites` input to your domains.
    3. Set `ssl_warning_days` to how much lead time you want before a cert expires (14 by default).
    4. Optionally paste a Slack webhook URL.
    5. Put the flow on a schedule (for example every 15 minutes) and you have a free uptime monitor.

    ## How to extend

    - Store each run's results in a database and chart uptime over time.
    - Add a second alert channel (email, PagerDuty, Discord) alongside Slack.
    - Check page content for a keyword, so you catch the "200 OK but showing an error page" case too.

    ## Links

    - [Python script plugin docs](https://kestra.io/plugins/plugin-scripts-python)
    - [Slack notifications plugin docs](https://kestra.io/plugins/plugin-notifications)
  tags:
    - Monitoring
  subTags:
    - Uptime & Alerts
  ee: false
  demo: false
  metaDescription: Monitor website uptime, response time, and SSL expiry with Kestra. Status report in logs plus Slack alerts when a site is down or a cert nears expiry.
