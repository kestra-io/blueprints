id: dynamodb-autoscaling-audit
namespace: company.finops

description: |
  Audits DynamoDB tables on provisioned capacity without auto-scaling and flags
  them as over-provisioning risks. A provisioned table without scaling either
  wastes RCU/WCU money or throttles under load — both are worth knowing about.

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to audit DynamoDB tables in.

tasks:
  - id: check_tables
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit DynamoDB tables region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: Find provisioned tables missing auto-scaling targets.
        commands:
          - |
            REGION="{{ taskrun.value }}"
            echo "Auditing DynamoDB tables in $REGION"
            aws dynamodb list-tables --region "$REGION" \
              --query 'TableNames' --output text | tr '\t' '\n' | grep -v '^$' > /tmp/tables.txt || true
            aws application-autoscaling describe-scalable-targets --region "$REGION" \
              --service-namespace dynamodb \
              --query 'ScalableTargets[].ResourceId' --output text | tr '\t' '\n' | grep -v '^$' > /tmp/scaled.txt || true
            RISK_COUNT=0
            RISK_LIST=""
            while read -r TABLE; do
              [ -z "$TABLE" ] && continue
              MODE=$(aws dynamodb describe-table --region "$REGION" --table-name "$TABLE" \
                --query 'Table.BillingModeSummary.BillingMode' --output text 2>/dev/null)
              if [ "$MODE" = "PROVISIONED" ]; then
                RID="table/$TABLE"
                if ! grep -qx "$RID" /tmp/scaled.txt 2>/dev/null; then
                  RCU=$(aws dynamodb describe-table --region "$REGION" --table-name "$TABLE" \
                    --query 'Table.ProvisionedThroughput.ReadCapacityUnits' --output text 2>/dev/null)
                  WCU=$(aws dynamodb describe-table --region "$REGION" --table-name "$TABLE" \
                    --query 'Table.ProvisionedThroughput.WriteCapacityUnits' --output text 2>/dev/null)
                  echo "table $TABLE: PROVISIONED without auto-scaling (${RCU} RCU / ${WCU} WCU)"
                  RISK_LIST="${RISK_LIST}${TABLE} (${RCU} RCU/${WCU} WCU, no scaling), "
                  RISK_COUNT=$((RISK_COUNT + 1))
                else
                  echo "table $TABLE: PROVISIONED with auto-scaling - ok"
                fi
              else
                echo "table $TABLE: $MODE - ok"
              fi
            done < /tmp/tables.txt
            if [ "$RISK_COUNT" -gt 0 ]; then HAS_RISK=true; else HAS_RISK=false; fi
            echo "HAS_RISK=$HAS_RISK"
            echo "RISK_COUNT=$RISK_COUNT"
            echo "RISK_TABLES=$RISK_LIST"
            echo "REGION_DONE=$REGION"
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ taskrun.value }}"
      - id: notify_region
        type: io.kestra.plugin.core.flow.If
        description: Alert on risky tables, stay quiet when everything scales or is on-demand.
        condition: "{{ outputs.audit_region.vars.HAS_RISK == 'true' }}"
        then:
          - id: slack_risk
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":warning: DynamoDB audit `{{ outputs.audit_region.vars.REGION_DONE }}` — *{{ outputs.audit_region.vars.RISK_COUNT }}* table(s) on PROVISIONED capacity without auto-scaling (over-provisioning / throttling risk).\n`{{ outputs.audit_region.vars.RISK_TABLES }}`\nEnable auto-scaling or switch steady tables to on-demand."
              }
        else:
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            message: "DynamoDB looks healthy in {{ outputs.audit_region.vars.REGION_DONE }} — every provisioned table has auto-scaling or is on-demand."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Sunday at 04:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 4 * * 0"
    disabled: true

extend:
  title: DynamoDB Auto-Scaling Audit
  metaTitle: Audit DynamoDB Tables Missing Auto-Scaling | Kestra
  shortDescription: Find DynamoDB tables on provisioned capacity without auto-scaling targets and get a Slack report of the over-provisioning and throttling risks.
  metaDescription: Provisioned DynamoDB tables without auto-scaling waste money or throttle. This flow audits them weekly.
  description: |
    A DynamoDB table on provisioned capacity without auto-scaling is a problem in both directions: set the throughput too high and you pay for RCU/WCU you never use; set it too low and the table throttles under load. Auto-scaling (or on-demand) removes the guessing. This blueprint finds the tables still guessing.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 04:00 UTC (shipped disabled).
    2. A ForEach loop audits each region in `aws_regions`.
    3. Per region, the flow lists DynamoDB tables and describes each one to find `PROVISIONED` billing mode.
    4. Each provisioned table is checked against Application Auto Scaling targets for the `dynamodb` service namespace.
    5. Provisioned tables with no scaling target are flagged, with their RCU/WCU settings as evidence.
    6. An `If` task posts a Slack report listing the risky tables.

    ## What you get

    - A weekly list of provisioned DynamoDB tables missing auto-scaling, with their configured throughput.
    - Clear next actions per table: enable auto-scaling or move steady low-traffic tables to on-demand.
    - Multi-region coverage in one run.
    - Silence when every table scales or is on-demand.

    ## Who it's for

    Backend teams running DynamoDB who want capacity misconfigurations surfaced before they become throttling incidents or waste.

    ## Why orchestrate this with Kestra

    This audit joins three AWS APIs (DynamoDB, Application Auto Scaling) across regions on a schedule — the kind of cross-service check that rots in a wiki runbook. As a Kestra flow it runs weekly, every run is logged, and the findings land in Slack.

    ## Prerequisites

    - AWS credentials with `dynamodb:ListTables`, `dynamodb:DescribeTable`, and `application-autoscaling:DescribeScalableTargets` permissions.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the DynamoDB and Auto Scaling API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the DynamoDB and Auto Scaling API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the audit report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` to the regions where you run DynamoDB.
    3. Run manually once and review the risky tables.
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Also audit GSI-level provisioned throughput, which has its own scaling targets.
    - Register missing scaling targets automatically with `register-scalable-target` + `put-scaling-policy`.
    - Pull `ConsumedReadCapacityUnits` from CloudWatch to quantify the actual over-provisioning in dollars.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [DynamoDB auto scaling](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/AutoScaling.html)
    - [DynamoDB pricing](https://aws.amazon.com/dynamodb/pricing/)
  tags:
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Day 2 Operations
  ee: false
  demo: false
