id: postgres-unique-constraint-install-over-existing-duplicates-with-fk-repoint
namespace: company.platform

description: |
  Add a UNIQUE constraint to a PostgreSQL table that already contains duplicate keys. Stage a loser-to-survivor map,
  show the operator how many rows and child rows are affected, then (after approval) quarantine the losers, re-point
  every referencing foreign key to the survivor, delete the losers, build the index concurrently, verify it is valid and
  attach it as a constraint. A later run drops the quarantine tables once the retention period has passed.

concurrency:
  limit: 1
  behavior: FAIL

inputs:
  - id: jdbc_url
    type: STRING
    displayName: JDBC URL
    defaults: "jdbc:postgresql://localhost:5432/app"

  - id: schema_name
    type: STRING
    defaults: "public"

  - id: table_name
    type: STRING
    defaults: "customers"

  - id: key_columns
    type: STRING
    description: Comma-separated columns that must become unique. Rows where any of them is NULL are ignored, as UNIQUE ignores them too.
    defaults: "email"

  - id: pk_column
    type: STRING
    description: Single-column primary key that foreign keys reference.
    defaults: "id"

  - id: order_column
    type: STRING
    description: Column deciding which row of a duplicate group survives, together with keep_policy.
    defaults: "updated_at"

  - id: keep_policy
    type: SELECT
    values:
      - NEWEST
      - OLDEST
    defaults: NEWEST

  - id: constraint_name
    type: STRING
    defaults: "customers_email_key"

  - id: max_losers
    type: INT
    description: Refuse to run, before asking for approval, when more rows than this would be removed.
    defaults: 50000

  - id: retain_days
    type: INT
    description: How long the quarantine and map tables are kept after the constraint is installed.
    defaults: 14

  - id: approval_timeout
    type: DURATION
    defaults: PT12H

triggers:
  - id: daily_run
    type: io.kestra.plugin.core.trigger.Schedule
    description: Safe to repeat. A finished install only checks whether the quarantine retention has expired.
    cron: "30 2 * * *"
    disabled: true

tasks:
  - id: validate_inputs
    type: io.kestra.plugin.core.execution.Fail
    description: Everything below is interpolated into SQL, so accept only plain identifiers and a plain column list.
    condition: "{{ not (inputs.schema_name matches '^[A-Za-z_][A-Za-z0-9_]*$') or not (inputs.table_name matches '^[A-Za-z_][A-Za-z0-9_]*$') or not (inputs.pk_column matches '^[A-Za-z_][A-Za-z0-9_]*$') or not (inputs.order_column matches '^[A-Za-z_][A-Za-z0-9_]*$') or not (inputs.constraint_name matches '^[A-Za-z_][A-Za-z0-9_]*$') or not (inputs.key_columns matches '^[A-Za-z_][A-Za-z0-9_]*(, ?[A-Za-z_][A-Za-z0-9_]*)*$') or inputs.max_losers < 1 or inputs.retain_days < 0 }}"
    errorMessage: "Rejected inputs: identifiers must match [A-Za-z_][A-Za-z0-9_]*, key_columns must be a comma-separated list of them, max_losers at least 1 and retain_days at least 0."

  - id: server_facts
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "{{ inputs.jdbc_url }}"
    username: "{{ secret('POSTGRES_USERNAME') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH_ONE
    sql: "SELECT current_database()::text AS db_name"

  - id: read_journal
    type: io.kestra.plugin.core.kv.Get
    description: Record left by the last successful install of this constraint. It starts the retention clock for the quarantine tables.
    key: "pg_unique_install_{{ outputs.server_facts.row.db_name }}_{{ inputs.schema_name }}_{{ inputs.table_name }}"
    errorOnMissing: false

  - id: inspect
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: What already exists on the table, so every run resumes where the previous one stopped.
    url: "{{ inputs.jdbc_url }}"
    username: "{{ secret('POSTGRES_USERNAME') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH_ONE
    sql: |
      WITH j AS (
        SELECT $kv${{ outputs.read_journal.value ?? '{}' }}$kv$::jsonb AS j
      ), t AS (
        SELECT to_regclass(format('%I.%I', '{{ inputs.schema_name }}', '{{ inputs.table_name }}')) AS oid
      )
      SELECT (t.oid IS NOT NULL) AS table_exists,
             EXISTS (SELECT 1 FROM pg_constraint c WHERE c.conrelid = t.oid AND c.conname = '{{ inputs.constraint_name }}' AND c.contype = 'u') AS constraint_exists,
             EXISTS (SELECT 1 FROM pg_index i JOIN pg_class ic ON ic.oid = i.indexrelid
                      WHERE i.indrelid = t.oid AND ic.relname = '{{ inputs.constraint_name }}' AND NOT i.indisvalid) AS invalid_leftover,
             EXISTS (SELECT 1 FROM pg_index i JOIN pg_class ic ON ic.oid = i.indexrelid
                      WHERE i.indrelid = t.oid AND ic.relname = '{{ inputs.constraint_name }}' AND i.indisvalid AND i.indisunique) AS valid_index,
             (SELECT count(*) FROM pg_constraint c
               WHERE c.contype = 'f' AND c.confrelid = t.oid
                 AND NOT (cardinality(c.conkey) = 1 AND c.confkey[1] = (SELECT a.attnum FROM pg_attribute a WHERE a.attrelid = t.oid AND a.attname = '{{ inputs.pk_column }}')))::int AS unsupported_fks,
             coalesce((j.j ->> 'installed_at')::timestamptz + {{ inputs.retain_days }} * interval '1 day' < now(), false) AS cleanup_due
        FROM t, j

  - id: require_supported_table
    type: io.kestra.plugin.core.execution.Fail
    condition: "{{ ((outputs.inspect.row.table_exists ~ '') != 'true') or ((outputs.inspect.row.unsupported_fks | number) > 0) }}"
    errorMessage: "Table {{ inputs.schema_name }}.{{ inputs.table_name }} exists: {{ outputs.inspect.row.table_exists }}. Foreign keys that do not reference only {{ inputs.pk_column }} through a single column: {{ outputs.inspect.row.unsupported_fks }}. Those cannot be re-pointed safely by this flow."

  - id: install_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (outputs.inspect.row.constraint_exists ~ '') == 'true' }}"
    then:
      - id: cleanup_gate
        type: io.kestra.plugin.core.flow.If
        description: The constraint is installed. The only remaining work is dropping the quarantine tables once retention has passed.
        condition: "{{ (outputs.inspect.row.cleanup_due ~ '') == 'true' }}"
        then:
          - id: request_cleanup_approval
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {"text": "Quarantine retention of {{ inputs.retain_days }} days has passed for {{ inputs.schema_name }}.{{ inputs.table_name }}. Approve execution {{ execution.id }} to drop {{ inputs.table_name }}__dedupe_quarantine and {{ inputs.table_name }}__dedupe_map for good."}

          - id: cleanup_approval
            type: io.kestra.plugin.core.flow.Pause
            pauseDuration: "{{ inputs.approval_timeout }}"
            behavior: FAIL
            onResume:
              - id: approved
                type: BOOL
                description: Permanently drop the quarantined duplicate rows and the loser-to-survivor map.
                defaults: false

          - id: cleanup_apply_gate
            type: io.kestra.plugin.core.flow.If
            condition: "{{ (outputs.cleanup_approval.onResume.approved ~ '') == 'true' }}"
            then:
              - id: drop_quarantine
                type: io.kestra.plugin.jdbc.postgresql.Query
                url: "{{ inputs.jdbc_url }}"
                username: "{{ secret('POSTGRES_USERNAME') }}"
                password: "{{ secret('POSTGRES_PASSWORD') }}"
                sql: "DROP TABLE IF EXISTS {{ inputs.schema_name }}.{{ inputs.table_name }}__dedupe_quarantine"

              - id: drop_map
                type: io.kestra.plugin.jdbc.postgresql.Query
                url: "{{ inputs.jdbc_url }}"
                username: "{{ secret('POSTGRES_USERNAME') }}"
                password: "{{ secret('POSTGRES_PASSWORD') }}"
                sql: "DROP TABLE IF EXISTS {{ inputs.schema_name }}.{{ inputs.table_name }}__dedupe_map"

              - id: verify_helper_tables_gone
                type: io.kestra.plugin.jdbc.postgresql.Query
                url: "{{ inputs.jdbc_url }}"
                username: "{{ secret('POSTGRES_USERNAME') }}"
                password: "{{ secret('POSTGRES_PASSWORD') }}"
                fetchType: FETCH_ONE
                sql: "SELECT (to_regclass('{{ inputs.schema_name }}.{{ inputs.table_name }}__dedupe_quarantine') IS NOT NULL OR to_regclass('{{ inputs.schema_name }}.{{ inputs.table_name }}__dedupe_map') IS NOT NULL) AS still_there"

              - id: fail_if_helper_tables_remain
                type: io.kestra.plugin.core.execution.Fail
                condition: "{{ (outputs.verify_helper_tables_gone.row.still_there ~ '') == 'true' }}"
                errorMessage: "Quarantine or map table still exists after DROP TABLE. The journal was kept."

              - id: clear_journal
                type: io.kestra.plugin.core.kv.Delete
                key: "pg_unique_install_{{ outputs.server_facts.row.db_name }}_{{ inputs.schema_name }}_{{ inputs.table_name }}"
        else:
          - id: log_installed
            type: io.kestra.plugin.core.log.Log
            message: "Constraint {{ inputs.constraint_name }} is already installed on {{ inputs.schema_name }}.{{ inputs.table_name }} and quarantine retention has not expired. Nothing to do."
    else:
      - id: drop_stale_map
        type: io.kestra.plugin.jdbc.postgresql.Query
        description: The map is rebuilt on every run, because new duplicates may have arrived since the last one.
        url: "{{ inputs.jdbc_url }}"
        username: "{{ secret('POSTGRES_USERNAME') }}"
        password: "{{ secret('POSTGRES_PASSWORD') }}"
        sql: "DROP TABLE IF EXISTS {{ inputs.schema_name }}.{{ inputs.table_name }}__dedupe_map"

      - id: create_map
        type: io.kestra.plugin.jdbc.postgresql.Query
        description: Rank every group of rows sharing the key. The first row per keep_policy survives, all others map to it. Rows with a NULL in any key column are not duplicates for UNIQUE and are left alone.
        url: "{{ inputs.jdbc_url }}"
        username: "{{ secret('POSTGRES_USERNAME') }}"
        password: "{{ secret('POSTGRES_PASSWORD') }}"
        sql: |
          CREATE TABLE {{ inputs.schema_name }}.{{ inputs.table_name }}__dedupe_map AS
          SELECT r.pk AS loser_pk, r.survivor AS survivor_pk
            FROM (
              SELECT {{ inputs.pk_column }} AS pk,
                     row_number() OVER w AS rn,
                     first_value({{ inputs.pk_column }}) OVER w AS survivor
                FROM {{ inputs.schema_name }}.{{ inputs.table_name }}
               WHERE ROW({{ inputs.key_columns }}) IS NOT NULL
              WINDOW w AS (PARTITION BY {{ inputs.key_columns }}
                           ORDER BY {{ inputs.order_column }} {{ inputs.keep_policy == 'NEWEST' ? 'DESC' : 'ASC' }} NULLS LAST,
                                    {{ inputs.pk_column }} {{ inputs.keep_policy == 'NEWEST' ? 'DESC' : 'ASC' }})
            ) r
           WHERE r.rn > 1

      - id: plan
        type: io.kestra.plugin.jdbc.postgresql.Query
        description: Size the change. Child rows are counted per referencing foreign key straight from the catalog, and the exact UPDATE for each key is generated with format(%I) so identifiers are quoted by PostgreSQL itself.
        url: "{{ inputs.jdbc_url }}"
        username: "{{ secret('POSTGRES_USERNAME') }}"
        password: "{{ secret('POSTGRES_PASSWORD') }}"
        fetchType: FETCH_ONE
        sql: |
          WITH f AS (
            SELECT con.conname::text AS fk,
                   cn.nspname || '.' || cc.relname AS child,
                   att.attname::text AS child_column,
                   (xpath('/row/c/text()', query_to_xml(
                     format('SELECT count(*) AS c FROM %I.%I WHERE %I IN (SELECT loser_pk FROM %I.%I)',
                            cn.nspname, cc.relname, att.attname, '{{ inputs.schema_name }}', '{{ inputs.table_name }}__dedupe_map'),
                     false, true, '')))[1]::text::bigint AS child_rows,
                   format('UPDATE %I.%I c SET %I = m.survivor_pk FROM %I.%I m WHERE c.%I = m.loser_pk',
                          cn.nspname, cc.relname, att.attname, '{{ inputs.schema_name }}', '{{ inputs.table_name }}__dedupe_map', att.attname) AS update_sql
              FROM pg_constraint con
              JOIN pg_class cc ON cc.oid = con.conrelid
              JOIN pg_namespace cn ON cn.oid = cc.relnamespace
              JOIN pg_attribute att ON att.attrelid = con.conrelid AND att.attnum = con.conkey[1]
             WHERE con.contype = 'f' AND con.confrelid = to_regclass(format('%I.%I', '{{ inputs.schema_name }}', '{{ inputs.table_name }}'))
          )
          SELECT (SELECT count(*) FROM {{ inputs.schema_name }}.{{ inputs.table_name }}__dedupe_map)::int AS losers,
                 (SELECT count(DISTINCT survivor_pk) FROM {{ inputs.schema_name }}.{{ inputs.table_name }}__dedupe_map)::int AS dup_groups,
                 (SELECT coalesce(sum(child_rows), 0) FROM f)::bigint AS repoint_total,
                 (SELECT coalesce(jsonb_agg(to_jsonb(f)), '[]'::jsonb) FROM f)::text AS fks

      - id: fail_over_cap
        type: io.kestra.plugin.core.execution.Fail
        condition: "{{ (outputs.plan.row.losers | number) > inputs.max_losers }}"
        errorMessage: "{{ outputs.plan.row.losers }} rows would be removed, above max_losers={{ inputs.max_losers }}. Check key_columns and keep_policy before raising the cap."

      - id: dedupe_gate
        type: io.kestra.plugin.core.flow.If
        description: Without duplicates there is nothing to approve and the run goes straight to the index build.
        condition: "{{ (outputs.plan.row.losers | number) > 0 }}"
        then:
          - id: request_approval
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {"text": "UNIQUE({{ inputs.key_columns }}) on {{ inputs.schema_name }}.{{ inputs.table_name }} needs {{ outputs.plan.row.losers }} duplicate rows removed in {{ outputs.plan.row.dup_groups }} groups (keeping the {{ inputs.keep_policy }} by {{ inputs.order_column }}). {{ outputs.plan.row.repoint_total }} child rows will be re-pointed to the survivor:\n{% for f in fromJson(outputs.plan.row.fks) %}{{ f.child }}.{{ f.child_column }} ({{ f.fk }}): {{ f.child_rows }} rows\n{% endfor %}Removed rows are copied to {{ inputs.table_name }}__dedupe_quarantine first. Execution {{ execution.id }} expires in {{ inputs.approval_timeout }}."}

          - id: approval
            type: io.kestra.plugin.core.flow.Pause
            description: Hold the data change. FAIL on timeout, so an unanswered request deletes nothing.
            pauseDuration: "{{ inputs.approval_timeout }}"
            behavior: FAIL
            onResume:
              - id: approved
                type: BOOL
                description: Quarantine and delete the duplicate rows and re-point their children.
                defaults: false
              - id: note
                type: STRING
                defaults: ""

          - id: apply_gate
            type: io.kestra.plugin.core.flow.If
            condition: "{{ (outputs.approval.onResume.approved ~ '') == 'true' }}"
            then:
              - id: create_quarantine
                type: io.kestra.plugin.jdbc.postgresql.Query
                description: Same columns as the table, no constraints, so every removed row can be restored as it was.
                url: "{{ inputs.jdbc_url }}"
                username: "{{ secret('POSTGRES_USERNAME') }}"
                password: "{{ secret('POSTGRES_PASSWORD') }}"
                sql: "CREATE TABLE IF NOT EXISTS {{ inputs.schema_name }}.{{ inputs.table_name }}__dedupe_quarantine (LIKE {{ inputs.schema_name }}.{{ inputs.table_name }})"

              - id: quarantine_losers
                type: io.kestra.plugin.jdbc.postgresql.Query
                description: Skips rows already quarantined by an interrupted earlier attempt.
                url: "{{ inputs.jdbc_url }}"
                username: "{{ secret('POSTGRES_USERNAME') }}"
                password: "{{ secret('POSTGRES_PASSWORD') }}"
                sql: |
                  INSERT INTO {{ inputs.schema_name }}.{{ inputs.table_name }}__dedupe_quarantine
                  SELECT t.* FROM {{ inputs.schema_name }}.{{ inputs.table_name }} t
                    JOIN {{ inputs.schema_name }}.{{ inputs.table_name }}__dedupe_map m ON t.{{ inputs.pk_column }} = m.loser_pk
                   WHERE NOT EXISTS (SELECT 1 FROM {{ inputs.schema_name }}.{{ inputs.table_name }}__dedupe_quarantine q WHERE q.{{ inputs.pk_column }} = t.{{ inputs.pk_column }})

              - id: repoint_children
                type: io.kestra.plugin.core.flow.Loop
                description: One UPDATE per referencing foreign key found at runtime, so no child row is left pointing at a row that is about to be deleted.
                values: "{{ outputs.plan.row.fks }}"
                parseValues: true
                concurrencyLimit: 1
                tasks:
                  - id: repoint_fk
                    type: io.kestra.plugin.jdbc.postgresql.Query
                    url: "{{ inputs.jdbc_url }}"
                    username: "{{ secret('POSTGRES_USERNAME') }}"
                    password: "{{ secret('POSTGRES_PASSWORD') }}"
                    sql: "{{ item.value.update_sql }}"

              - id: delete_losers
                type: io.kestra.plugin.jdbc.postgresql.Query
                url: "{{ inputs.jdbc_url }}"
                username: "{{ secret('POSTGRES_USERNAME') }}"
                password: "{{ secret('POSTGRES_PASSWORD') }}"
                sql: |
                  DELETE FROM {{ inputs.schema_name }}.{{ inputs.table_name }} t
                   USING {{ inputs.schema_name }}.{{ inputs.table_name }}__dedupe_map m
                   WHERE t.{{ inputs.pk_column }} = m.loser_pk

              - id: recheck_duplicates
                type: io.kestra.plugin.jdbc.postgresql.Query
                description: The application may have inserted new duplicates while the approval was pending.
                url: "{{ inputs.jdbc_url }}"
                username: "{{ secret('POSTGRES_USERNAME') }}"
                password: "{{ secret('POSTGRES_PASSWORD') }}"
                fetchType: FETCH_ONE
                sql: |
                  SELECT count(*)::int AS dup_groups FROM (
                    SELECT 1 FROM {{ inputs.schema_name }}.{{ inputs.table_name }}
                     WHERE ROW({{ inputs.key_columns }}) IS NOT NULL
                     GROUP BY {{ inputs.key_columns }} HAVING count(*) > 1) d

              - id: fail_if_duplicates_remain
                type: io.kestra.plugin.core.execution.Fail
                condition: "{{ (outputs.recheck_duplicates.row.dup_groups | number) > 0 }}"
                errorMessage: "{{ outputs.recheck_duplicates.row.dup_groups }} duplicate groups appeared after the map was built. Run the flow again to quarantine them too."
            else:
              - id: log_declined
                type: io.kestra.plugin.core.log.Log
                message: "Dedupe declined for {{ inputs.schema_name }}.{{ inputs.table_name }}. Note: {{ outputs.approval.onResume.note ?? '' }}. No row was changed and no index was built."

      - id: decide_proceed
        type: io.kestra.plugin.core.output.OutputValues
        description: Build the index only when there were no duplicates or the approved dedupe has been verified.
        values:
          proceed: "{{ ((outputs.plan.row.losers | number) == 0) or (outputs.approval is defined and ((outputs.approval.onResume.approved ~ '') == 'true')) }}"

      - id: index_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ (outputs.decide_proceed.values.proceed ~ '') == 'true' }}"
        then:
          - id: drop_invalid_gate
            type: io.kestra.plugin.core.flow.If
            description: A failed CREATE UNIQUE INDEX CONCURRENTLY leaves an INVALID index with the same name behind. Drop it before building again.
            condition: "{{ (outputs.inspect.row.invalid_leftover ~ '') == 'true' }}"
            then:
              - id: drop_invalid_index
                type: io.kestra.plugin.jdbc.postgresql.Query
                url: "{{ inputs.jdbc_url }}"
                username: "{{ secret('POSTGRES_USERNAME') }}"
                password: "{{ secret('POSTGRES_PASSWORD') }}"
                sql: "DROP INDEX CONCURRENTLY IF EXISTS {{ inputs.schema_name }}.{{ inputs.constraint_name }}"

          - id: build_gate
            type: io.kestra.plugin.core.flow.If
            description: Skip the build when a previous run already left a valid unique index waiting to be attached.
            condition: "{{ (outputs.inspect.row.valid_index ~ '') != 'true' }}"
            then:
              - id: create_unique_index
                type: io.kestra.plugin.jdbc.postgresql.Query
                description: Takes no long write lock. It runs outside a transaction, which is how the Query task executes a single statement.
                url: "{{ inputs.jdbc_url }}"
                username: "{{ secret('POSTGRES_USERNAME') }}"
                password: "{{ secret('POSTGRES_PASSWORD') }}"
                sql: "CREATE UNIQUE INDEX CONCURRENTLY {{ inputs.constraint_name }} ON {{ inputs.schema_name }}.{{ inputs.table_name }} ({{ inputs.key_columns }})"

          - id: verify_index
            type: io.kestra.plugin.jdbc.postgresql.Query
            description: A build that raced with an insert can leave an INVALID index, so read pg_index instead of trusting the statement alone.
            url: "{{ inputs.jdbc_url }}"
            username: "{{ secret('POSTGRES_USERNAME') }}"
            password: "{{ secret('POSTGRES_PASSWORD') }}"
            fetchType: FETCH_ONE
            sql: |
              SELECT coalesce(bool_and(i.indisvalid AND i.indisunique), false) AS ok
                FROM pg_index i JOIN pg_class ic ON ic.oid = i.indexrelid
               WHERE i.indrelid = to_regclass(format('%I.%I', '{{ inputs.schema_name }}', '{{ inputs.table_name }}'))
                 AND ic.relname = '{{ inputs.constraint_name }}'

          - id: fail_if_index_invalid
            type: io.kestra.plugin.core.execution.Fail
            condition: "{{ (outputs.verify_index.row.ok ~ '') != 'true' }}"
            errorMessage: "Index {{ inputs.constraint_name }} is missing or INVALID, so a duplicate arrived during the build. Run the flow again: it drops the leftover, quarantines the new duplicates and rebuilds."

          - id: attach_constraint
            type: io.kestra.plugin.jdbc.postgresql.Query
            description: Promote the valid index to a real constraint. This is a catalog change that needs a brief ACCESS EXCLUSIVE lock.
            url: "{{ inputs.jdbc_url }}"
            username: "{{ secret('POSTGRES_USERNAME') }}"
            password: "{{ secret('POSTGRES_PASSWORD') }}"
            sql: "ALTER TABLE {{ inputs.schema_name }}.{{ inputs.table_name }} ADD CONSTRAINT {{ inputs.constraint_name }} UNIQUE USING INDEX {{ inputs.constraint_name }}"

          - id: verify_constraint
            type: io.kestra.plugin.jdbc.postgresql.Query
            url: "{{ inputs.jdbc_url }}"
            username: "{{ secret('POSTGRES_USERNAME') }}"
            password: "{{ secret('POSTGRES_PASSWORD') }}"
            fetchType: FETCH_ONE
            sql: |
              SELECT count(*)::int AS n FROM pg_constraint
               WHERE conrelid = to_regclass(format('%I.%I', '{{ inputs.schema_name }}', '{{ inputs.table_name }}'))
                 AND conname = '{{ inputs.constraint_name }}' AND contype = 'u' AND convalidated

          - id: fail_if_constraint_missing
            type: io.kestra.plugin.core.execution.Fail
            condition: "{{ (outputs.verify_constraint.row.n | number) != 1 }}"
            errorMessage: "Constraint {{ inputs.constraint_name }} was not found as a validated unique constraint after ADD CONSTRAINT."

          - id: save_journal
            type: io.kestra.plugin.core.kv.Set
            description: Starts the quarantine retention clock. The next scheduled run drops the helper tables after approval once retain_days have passed.
            key: "pg_unique_install_{{ outputs.server_facts.row.db_name }}_{{ inputs.schema_name }}_{{ inputs.table_name }}"
            kvType: STRING
            value: "{{ { 'constraint': inputs.constraint_name, 'key_columns': inputs.key_columns, 'removed_rows': outputs.plan.row.losers, 'duplicate_groups': outputs.plan.row.dup_groups, 'repointed_child_rows': outputs.plan.row.repoint_total, 'installed_at': now(), 'execution': execution.id } | toJson }}"

          - id: notify_installed
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {"text": "UNIQUE constraint {{ inputs.constraint_name }} installed on {{ inputs.schema_name }}.{{ inputs.table_name }} ({{ inputs.key_columns }}). Removed {{ outputs.plan.row.losers }} duplicate rows, re-pointed {{ outputs.plan.row.repoint_total }} child rows. Removed rows stay in {{ inputs.table_name }}__dedupe_quarantine for {{ inputs.retain_days }} days. Execution {{ execution.id }}."}

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "UNIQUE install on {{ inputs.schema_name }}.{{ inputs.table_name }} failed (execution {{ execution.id }}). The flow is safe to rerun: it reuses the quarantine table, drops an INVALID leftover index and rebuilds the map."}

extend:
  title: Add a UNIQUE constraint to a PostgreSQL table that already has duplicates, re-pointing foreign keys first
  metaTitle: PostgreSQL UNIQUE Constraint Over Existing Duplicates | Kestra
  shortDescription: Quarantine duplicate rows, re-point every referencing foreign key to the survivor after approval, build the unique index concurrently, verify it and attach the constraint.
  metaDescription: Install a PostgreSQL UNIQUE constraint over existing duplicates by quarantining losers, re-pointing foreign keys, building and verifying the index.
  description: |
    CREATE UNIQUE INDEX fails on a table that already holds duplicates, and deleting the extra rows is unsafe when other tables reference them. This blueprint maps each duplicate to a survivor, shows the operator exactly what will change, moves the losers to a quarantine table, re-points every foreign key and only then builds the index.

    ## How it works

    1. `inspect` reads the catalog to see what a previous run left behind (valid or INVALID index, installed constraint) and whether the retention period in the KV journal has expired. `require_supported_table` stops on foreign keys that do not reference the single-column primary key.
    2. `create_map` ranks rows sharing the key and writes the loser-to-survivor pairs. `plan` counts the child rows of each referencing foreign key and generates one quoted UPDATE per key.
    3. `request_approval` and the `approval` Pause present the numbers. Timeout fails the run.
    4. After approval, `quarantine_losers` copies the rows aside, the `repoint_children` Loop runs one UPDATE per foreign key, `delete_losers` removes them and `recheck_duplicates` proves no duplicate remains.
    5. `create_unique_index` builds the index concurrently, `verify_index` reads `pg_index` for `indisvalid`, and `attach_constraint` promotes it. `verify_constraint` confirms the constraint, and `save_journal` starts the quarantine retention clock.
    6. A later run finds the constraint installed and, after `retain_days`, drops the quarantine and map tables through `cleanup_approval`.

    ## What you get

    - No child row left pointing at a deleted parent, and every removed row recoverable until the retention period ends.
    - An INVALID index left by a raced build is detected and rebuilt on the next run, instead of looking like success.
    - Safe reruns after any failure.

    ## Who it's for

    - Application and platform engineers adding missing uniqueness to a live PostgreSQL schema.

    ## Why orchestrate this with Kestra

    The job spans several runs and a human decision: stage, ask, change, verify, wait out the retention, clean up. Kestra keeps the journal in KV and holds the approval without a worker.

    ## Prerequisites

    - PostgreSQL 12+ and a role that owns the table. The `postgres` Docker image is enough for a local test.
    - Foreign keys must be single-column and reference the primary key.

    ### Secrets

    - `POSTGRES_USERNAME`: role that owns the table.
    - `POSTGRES_PASSWORD`: its password.
    - `SLACK_WEBHOOK_URL`: approval requests and results.

    ## Quick start

    1. Create the secrets and set `table_name`, `key_columns` and `constraint_name`.
    2. Execute once and read the plan in Slack. Resume the Pause with `approved` set.
    3. After `retain_days`, execute again to approve the cleanup, then enable the trigger if you want it automatic.

    ## How to extend

    - Add a pre-check that stops the run while an application deploy is in progress.
    - Also normalise the key (for example `lower(email)`) by building the index on an expression.

