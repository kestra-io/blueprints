id: caddy-reverse-proxy-upstream-health-sentinel
namespace: company.infrastructure

inputs:
  - id: caddy_admin_endpoint
    type: STRING
    displayName: Caddy Admin API Endpoint
    description: Base URL of the Caddy server admin API endpoint.
    defaults: "http://localhost:2019"

  - id: max_unhealthy_threshold_percent
    type: INT
    displayName: Maximum Unhealthy Upstream Threshold Percent
    description: Percentage of unhealthy upstream backends allowed before triggering a critical incident alert.
    defaults: 20

  - id: send_slack_alert
    type: BOOLEAN
    displayName: Dispatch Slack Incident Alert
    description: Whether to transmit real-time Slack notifications upon reverse proxy upstream backend degradation.
    defaults: true

triggers:
  - id: caddy_health_audit_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Recurring audit polling Caddy reverse proxy upstream health every 5 minutes.
    cron: "*/5 * * * *"
    disabled: true

tasks:
  - id: probe_caddy_upstreams
    type: io.kestra.plugin.core.http.Request
    description: Query Caddy Admin API reverse proxy upstream pool status.
    uri: "{{ inputs.caddy_admin_endpoint }}/reverse_proxy/upstreams"
    method: GET
    headers:
      Accept: "application/json"
    options:
      allowFailed: true
      timeout:
        connectTimeout: PT10S
        readIdleTimeout: PT30S
    retry:
      type: constant
      interval: PT5S
      maxAttempts: 3
    allowFailure: true

  - id: evaluate_upstream_health
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogate upstream pool JSON response, calculate degradation percentage, and classify health status.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    inputFiles:
      upstreams.json: "{{ outputs.probe_caddy_upstreams.body }}"
    script: |
      import json

      max_unhealthy_pct = float({{ inputs.max_unhealthy_threshold_percent }})

      try:
          with open("upstreams.json", "r") as f:
              raw = f.read().strip()
              data = json.loads(raw) if raw else []
      except Exception as e:
          data = [{"address": "CADDY_API_UNREACHABLE", "status": "unhealthy", "fails": 1}]

      if not isinstance(data, list):
          data = []

      total_upstreams = len(data)
      unhealthy_hosts = []

      for item in data:
          status = str(item.get("status", "healthy")).lower()
          fails = int(item.get("fails", 0))
          if status == "unhealthy" or fails > 0:
              unhealthy_hosts.append(item.get("address", "unknown"))

      unhealthy_count = len(unhealthy_hosts)
      unhealthy_pct = (unhealthy_count / total_upstreams * 100.0) if total_upstreams > 0 else 0.0

      if total_upstreams == 0 or unhealthy_count == 0:
          classification = "ALL_UPSTREAMS_HEALTHY"
      elif unhealthy_pct <= max_unhealthy_pct:
          classification = "PARTIAL_BACKEND_DEGRADATION"
      else:
          classification = "CRITICAL_UPSTREAM_OUTAGE"

      unhealthy_summary = ", ".join(unhealthy_hosts[:5]) if unhealthy_hosts else "none"

      output_payload = {
          "outputs": {
              "total_upstreams": total_upstreams,
              "unhealthy_count": unhealthy_count,
              "unhealthy_percent": round(unhealthy_pct, 2),
              "unhealthy_hosts": unhealthy_summary,
              "classification": classification
          }
      }
      print(f"::{json.dumps(output_payload)}::")

  - id: classify_pool_status
    type: io.kestra.plugin.core.log.Log
    description: Log evaluated Caddy reverse proxy upstream pool metrics and status classification.
    message: |
      Caddy Endpoint: {{ inputs.caddy_admin_endpoint }}
      Total Upstreams: {{ outputs.evaluate_upstream_health.vars.total_upstreams }}
      Unhealthy Upstreams: {{ outputs.evaluate_upstream_health.vars.unhealthy_count }} ({{ outputs.evaluate_upstream_health.vars.unhealthy_percent }}%)
      Failing Hosts: {{ outputs.evaluate_upstream_health.vars.unhealthy_hosts }}
      Classification: {{ outputs.evaluate_upstream_health.vars.classification }}

  - id: route_upstream_gate
    type: io.kestra.plugin.core.flow.Switch
    description: Route flow execution based on Caddy upstream pool health classification.
    value: "{{ outputs.evaluate_upstream_health.vars.classification }}"
    cases:
      ALL_UPSTREAMS_HEALTHY:
        - id: log_nominal_pool
          type: io.kestra.plugin.core.log.Log
          description: Log nominal verification confirming all reverse proxy backends are healthy.
          message: "HEALTHY: All {{ outputs.evaluate_upstream_health.vars.total_upstreams }} Caddy reverse proxy upstream hosts are responsive."

      PARTIAL_BACKEND_DEGRADATION:
        - id: log_degradation_advisory
          type: io.kestra.plugin.core.log.Log
          description: Log advisory warning when backend degradation is within acceptable threshold limits.
          message: "WARNING: Caddy upstream degradation detected. Unhealthy hosts: {{ outputs.evaluate_upstream_health.vars.unhealthy_hosts }} ({{ outputs.evaluate_upstream_health.vars.unhealthy_percent }}%)."

      CRITICAL_UPSTREAM_OUTAGE:
        - id: alert_slack_upstream_outage
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Dispatch urgent incident alert to infrastructure engineering channel.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": ":rotating_light: *CRITICAL Caddy Reverse Proxy Upstream Outage Alert*\n*Endpoint:* `{{ inputs.caddy_admin_endpoint }}`\n*Total Upstreams:* `{{ outputs.evaluate_upstream_health.vars.total_upstreams }}`\n*Unhealthy Count:* `{{ outputs.evaluate_upstream_health.vars.unhealthy_count }}` (`{{ outputs.evaluate_upstream_health.vars.unhealthy_percent }}%`)\n*Failing Hosts:* `{{ outputs.evaluate_upstream_health.vars.unhealthy_hosts }}`\n*Execution:* <{{ flow.url }}|{{ execution.id }}>"
            }

        - id: remediation_outage_gate
          type: io.kestra.plugin.core.execution.Fail
          description: Fail execution to trigger incident escalation and prevent cascading gateway failure.

  - id: final_audit_log
    type: io.kestra.plugin.core.log.Log
    description: Record immutable audit log entry documenting Caddy upstream pool health verification.
    message: |
      [AUDIT] Caddy Reverse Proxy Upstream Health Sentinel completed.
      Endpoint: {{ inputs.caddy_admin_endpoint }}
      Total: {{ outputs.evaluate_upstream_health.vars.total_upstreams }}
      Unhealthy: {{ outputs.evaluate_upstream_health.vars.unhealthy_count }}
      Verdict: {{ outputs.evaluate_upstream_health.vars.classification }}

extend:
  title: Caddy Reverse Proxy Upstream Health and Error Rate Sentinel
  metaTitle: Caddy Reverse Proxy Upstream Sentinel | Kestra
  shortDescription: Audit Caddy reverse proxy upstream pool health via Admin API, triggering Slack alerts on backend failures.
  metaDescription: Audit Caddy reverse proxy upstream health via Admin API, classify backend degradation severity, and dispatch Slack incident alerts to prevent 502 outages.
  description: |
    Automated reverse proxy reliability sentinel that polls the Caddy Web Server Admin API on a recurring schedule to audit backend upstream pool health, detect failing or flapping origin servers, classify degradation severity, and dispatch Slack incident alerts before cascading 502 Bad Gateway outages impact end users.

    ## How it works

    1. A schedule trigger activates every five minutes to probe the Caddy server's administrative interface.
    2. An HTTP request task queries Caddy's `/reverse_proxy/upstreams` administrative endpoint to retrieve live health and request failure metrics across all backend hosts.
    3. An embedded Python script processes the upstream host records, counting active and unhealthy nodes, calculating the pool degradation percentage, and identifying specific failing addresses.
    4. An informational log task records the evaluated pool metrics and current health classification.
    5. A `Switch` flow control task branches execution according to the evaluated status:
       - `ALL_UPSTREAMS_HEALTHY`: Confirms all origin nodes are responsive and logs nominal operational telemetry.
       - `PARTIAL_BACKEND_DEGRADATION`: Emits a non-blocking advisory notification when failing nodes fall within allowable thresholds.
       - `CRITICAL_UPSTREAM_OUTAGE`: Dispatches a detailed Slack incident webhook with failing host addresses, pool failure percentages, execution deep links, and halts execution via a failure gate.
    6. An immutable final audit log records the comprehensive health verdict and upstream metrics in Kestra execution history.

    ## What you get

    - Proactive reverse proxy health monitoring catching origin server degradation before full service outages occur.
    - Automated detection of failing microservice pods, crashed web backends, and network partition timeouts.
    - Rich Slack notifications delivering immediate diagnostic context, including specific failing host addresses.
    - Automated execution failure gates that halt dependent deployment rollouts when ingress proxies detect unhealthy upstreams.
    - Complete, immutable audit records tracking edge proxy upstream stability across deployment windows.

    ## Who it's for

    - Platform Engineers and Site Reliability Engineers (SREs) managing Caddy edge ingress controllers and reverse proxies.
    - DevOps Teams operating microservice backends behind dynamic Caddy routing tiers.
    - Infrastructure Architects seeking automated circuit breaking and health auditing without third-party agent dependencies.

    ## Why orchestrate this with Kestra

    - Declarative YAML orchestrates API health polling, JSON array evaluation, and incident dispatching without dedicated external monitoring daemons.
    - Native secret masking ensures Slack webhook URLs and administrative credentials remain confidential during automated runs.
    - Built-in conditional branching enables granular escalation policies tailored to infrastructure failure thresholds.
    - Centralized execution timelines provide instant diagnostic visibility into historical reverse proxy failure patterns.

    ## Prerequisites

    - Running Caddy Web Server (standalone Docker container or host binary) with the Admin API enabled (default port `2019`).
    - Network reachability between Kestra and the Caddy admin endpoint.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to transmit critical upstream outage incident alerts.

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace or environment variables.
    2. Import this blueprint into your Kestra instance under `company.infrastructure`.
    3. Run a manual test execution pointing to your Caddy admin endpoint to verify connectivity and clean upstream parsing.
    4. Enable the `caddy_health_audit_schedule` trigger to maintain continuous 5-minute upstream monitoring.

    ## How to extend

    - Add an automated dynamic backend reload task in the remediation branch to evict unresponsive upstream nodes via Caddy's `/config/` API.
    - Correlate upstream failures with Prometheus metrics (`caddy_reverse_proxy_upstreams_healthy`) for time-series trend analysis.
    - Route separate alerts to PagerDuty or Opsgenie when more than 50% of the upstream server pool fails health checks.

    ## Links

    - [Kestra HTTP Plugin Documentation](https://kestra.io/plugins/core/http/request)
    - [Caddy Reverse Proxy Documentation](https://caddyserver.com/docs/caddyfile/directives/reverse_proxy)
    - [Caddy Admin API Reference](https://caddyserver.com/docs/api)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  demo: false
