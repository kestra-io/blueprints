id: kafka-consumer-group-rebalance-rate-sentinel
namespace: company.team
description: |
  Queries Kafka consumer group coordinator metrics via JMX Prometheus exporter
  to detect excessive group rebalance cycles and consumer flapping.

inputs:
  - id: kafka_exporter_url
    type: STRING
    defaults: "http://kafka-exporter.internal:9308/metrics"
  - id: consumer_group
    type: STRING
    defaults: "order-processing-group"
  - id: max_rebalances_threshold
    type: INT
    defaults: 10

triggers:
  - id: scheduled_monitor
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: audit_kafka
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Kafka exporter metrics endpoint for consumer group rebalance and membership counters.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests
    env:
      EXPORTER_URL: "{{ inputs.kafka_exporter_url }}"
      GROUP: "{{ inputs.consumer_group }}"
    outputFiles:
      - kafka_rebalance_health.json
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      exporter_url = os.environ.get("EXPORTER_URL", "http://kafka-exporter.internal:9308/metrics")
      group = os.environ.get("GROUP", "order-processing-group")

      print(f"Scraping Kafka exporter metrics from {exporter_url}...")
      try:
          resp = requests.get(exporter_url, timeout=20)
          resp.raise_for_status()
          lines = resp.text.splitlines()
      except Exception as exc:
          print(f"ERROR: Failed to scrape Kafka exporter metrics: {exc}", file=sys.stderr)
          sys.exit(1)

      rebalances = 0
      members = 0

      for line in lines:
          if line.startswith("#"):
              continue
          if "kafka_consumergroup_rebalance_total" in line and group in line:
              parts = line.strip().split()
              if len(parts) >= 2:
                  rebalances = int(float(parts[-1]))
          elif "kafka_consumergroup_members" in line and group in line:
              parts = line.strip().split()
              if len(parts) >= 2:
                  members = int(float(parts[-1]))

      result = {
          "rebalances": rebalances,
          "members": members,
          "consumer_group": group
      }

      with open("kafka_rebalance_health.json", "w", encoding="utf-8") as f:
          json.dump(result, f, indent=2)

      print(f"Rebalance audit complete: group={group}, rebalances={rebalances}, members={members}")
      Kestra.outputs(result)

  - id: evaluate_and_alert
    type: io.kestra.plugin.core.flow.If
    description: Alerts Slack when rebalances exceed threshold.
    condition: "{{ outputs.audit_kafka.vars.rebalances > inputs.max_rebalances_threshold }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": "⚠️ *Kafka Consumer Group Rebalance Churn Detected*\n*Exporter:* `{{ inputs.kafka_exporter_url }}`\n*Consumer Group:* `{{ inputs.consumer_group }}`\n*Rebalance Events:* {{ outputs.audit_kafka.vars.rebalances }}\n*Active Members:* {{ outputs.audit_kafka.vars.members }}\n*Impact:* Stop-the-world partition reassignments stalling pipeline throughput."
          }

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "🚨 *Execution Failure: Apache Kafka Consumer Group High Rebalance Churn Sentinel*\n*Execution ID:* `{{ execution.id }}`\n*Flow:* `{{ flow.id }}`."
      }

outputs:
  - id: rebalances
    type: INT
    value: "{{ outputs.audit_kafka.vars.rebalances }}"
  - id: members
    type: INT
    value: "{{ outputs.audit_kafka.vars.members }}"

extend:
  title: Apache Kafka Consumer Group High Rebalance Churn Sentinel
  shortDescription: Queries Kafka consumer group coordinator metrics via JMX Prometheus exporter to detect excessive group rebalance cycles and consumer flapping.
  metaTitle: Apache Kafka Consumer Group High Rebalance Churn Sentinel with Kestra
  metaDescription: Queries Kafka consumer group coordinator metrics via JMX Prometheus exporter to detect excessive group rebalance cycles and consumer flapping.
  description: |
    Queries Kafka consumer group coordinator metrics via JMX Prometheus exporter to detect excessive group rebalance cycles and consumer flapping.
  tags:
    - Data
    - Infrastructure
  subTags:
    - Realtime & Streaming
  ee: false
  demo: false
