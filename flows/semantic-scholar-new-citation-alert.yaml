id: semantic-scholar-new-citation-alert
namespace: company.team

description: |
  Weekly alert when new papers cite the publications you watch. The watchlist (DOIs, arXiv ids,
  Semantic Scholar ids or their URLs) is resolved in one Semantic Scholar batch request. Only
  papers whose citation count went up are paged through `/citations`, newest first, and paging
  stops once it reaches citing papers already seen in the KV store. Influential citations are
  highlighted, each new citation carries one context sentence from the citing paper, and the run
  produces a CSV of new citations and a Slack digest.

inputs:
  - id: papers
    type: STRING
    defaults: "649def34f8be52c8b66281af98ae884c09aef38b; DOI:10.18653/v1/2020.acl-main.447; ARXIV:2301.10140; DOI:10.1145/3383583.3398540"
    description: |
      Watched papers separated by semicolons or new lines. Accepted forms are `DOI:10.x/y`, a bare `10.x/y`,
      `https://doi.org/...`, `ARXIV:2301.10140` (a version suffix such as `v2` is dropped), `arxiv.org/abs/...`,
      `CorpusId:123`, a 40-character Semantic Scholar paperId or a semanticscholar.org paper URL.
      The defaults are three active Semantic Scholar papers and one with a single citation.

  - id: baseline_lookback_days
    type: INT
    defaults: 30
    description: The first time a paper is seen, citing papers published in the last N days are reported as new and everything older is only recorded. Set 0 for a silent baseline.

  - id: max_pages_per_paper
    type: INT
    defaults: 5
    description: Upper bound of `/citations` pages (100 citations each) per watched paper and run. A paper that hits it is reported as TRUNCATED.

  - id: use_api_key
    type: BOOL
    defaults: false
    description: Send the `S2_API_KEY` secret as `x-api-key`. Without a key the flow uses the shared keyless pool, which answers 429 often, so requests are paced at 3 s and backed off.

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 7 * * 1"
    description: Semantic Scholar ingests new papers continuously; a Monday digest of last week's citations is the usual cadence for a lab or research office.

tasks:
  - id: load_state
    type: io.kestra.plugin.core.kv.Get
    key: s2_citation_watch_state
    errorOnMissing: false
    description: JSON object keyed by Semantic Scholar paperId, holding the last citation count and the citing paperIds already seen (newest first). Missing on the first run.

  - id: collect_citations
    type: io.kestra.plugin.scripts.python.Script
    description: |
      Resolves the watchlist with one `POST /paper/batch` (500 ids per request), maps inputs that resolve to the
      same paperId onto one paper, and only for papers whose `citationCount` grew pages
      `GET /paper/{id}/citations` (100 per page, newest first), deduplicating citing papers by paperId and stopping
      once a page reaches citing papers already seen and the growth is accounted for. A paper new to the state gets
      a baseline instead: citing papers published inside `baseline_lookback_days` are reported, the rest recorded.
      Requests are paced (1.1 s with a key, 3 s without) and 429/5xx answers are retried with `Retry-After` or
      exponential backoff. If Semantic Scholar keeps refusing, the remaining papers are marked RATE_LIMITED and
      keep their old state, so the next run picks them up. Standard library only.
    containerImage: python:3.13-slim
    timeout: PT30M
    inputFiles:
      state.json: "{{ outputs.load_state.value ?? '{}' }}"
    outputFiles:
      - new_citations.csv
      - papers.csv
      - state.json
    env:
      WATCHED: "{{ inputs.papers }}"
      LOOKBACK_DAYS: "{{ inputs.baseline_lookback_days }}"
      MAX_PAGES: "{{ inputs.max_pages_per_paper }}"
      S2_API_KEY: "{{ inputs.use_api_key ? secret('S2_API_KEY') : '' }}"
      RUN_DATE: "{{ execution.startDate | date('yyyy-MM-dd', timeZone='UTC') }}"
      EXECUTION_URL: "{{ kestra.url ?? '' }}/ui/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"
      PYTHONIOENCODING: utf-8
    script: |
      import csv, json, os, re, time, urllib.error, urllib.request
      from datetime import date, timedelta

      API = "https://api.semanticscholar.org/graph/v1"
      CITATION_FIELDS = "title,year,venue,authors,externalIds,isInfluential,contexts,publicationDate"
      PAGE_SIZE, SEEN_CAP, SHOWN_PER_PAPER = 100, 1000, 5
      key = os.environ.get("S2_API_KEY", "").strip()
      pace = 1.1 if key else 3.0
      lookback = max(0, int(os.environ["LOOKBACK_DAYS"]))
      max_pages = max(1, int(os.environ["MAX_PAGES"]))
      cutoff = (date.fromisoformat(os.environ["RUN_DATE"]) - timedelta(days=lookback)).isoformat()
      headers = {"Accept": "application/json", "User-Agent": "kestra-semantic-scholar-new-citation-alert/1.0 (+https://kestra.io)"}
      if key:
          headers["x-api-key"] = key
      stats = {"requests": 0, "retries": 0, "waited_s": 0.0}
      last_call = [0.0]

      class GaveUp(Exception):
          pass

      def call(url, body=None):
          data = json.dumps(body).encode() if body is not None else None
          hdrs = dict(headers, **({"Content-Type": "application/json"} if data else {}))
          for attempt in range(7):
              gap = pace - (time.monotonic() - last_call[0])
              if gap > 0:
                  time.sleep(gap)
              last_call[0] = time.monotonic()
              stats["requests"] += 1
              retry_after = None
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, data=data, headers=hdrs), timeout=60) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      return None
                  if e.code not in (429, 500, 502, 503, 504):
                      raise
                  retry_after = e.headers.get("Retry-After")
              except (urllib.error.URLError, TimeoutError):
                  pass
              delay = float(retry_after) if retry_after and retry_after.isdigit() else min(60, 5 * 2 ** attempt)
              stats["retries"] += 1
              stats["waited_s"] += delay
              time.sleep(delay)
          raise GaveUp(url)

      def normalise(raw):
          s = raw.strip().rstrip("/")
          if m := re.match(r"(?i)^https?://(dx\.)?doi\.org/(.+)$", s):
              s = "DOI:" + m[2]
          if m := re.match(r"(?i)^https?://(www\.|export\.)?arxiv\.org/(abs|pdf)/(.+?)(\.pdf)?$", s):
              s = "ARXIV:" + m[3]
          if m := re.match(r"(?i)^https?://(www\.)?semanticscholar\.org/paper/(.+/)?([0-9a-f]{40})$", s):
              s = m[3]
          if re.fullmatch(r"10\.\d{4,9}/\S+", s):
              s = "DOI:" + s
          if m := re.fullmatch(r"(?i)doi:\s*(10\.\d{4,9}/\S+)", s):
              return "DOI:" + m[1]
          if re.fullmatch(r"\d{4}\.\d{4,5}(v\d+)?", s):
              s = "ARXIV:" + s
          if m := re.fullmatch(r"(?i)arxiv:\s*(\S+?)(v\d+)?", s):
              return "ARXIV:" + m[1]
          if m := re.fullmatch(r"(?i)corpus(id)?:\s*(\d+)", s):
              return "CorpusId:" + m[2]
          if re.fullmatch(r"(?i)[0-9a-f]{40}", s):
              return s.lower()
          return None

      def citation_row(row):
          cp = row["citingPaper"]
          authors = [a.get("name") for a in cp.get("authors") or [] if a.get("name")]
          ext = cp.get("externalIds") or {}
          context = next((" ".join(c.split()) for c in row.get("contexts") or [] if c and c.strip()), "")
          if len(context) > 240:
              context = context[:237].rsplit(" ", 1)[0] + "..."
          return {"citing_paper_id": cp["paperId"], "citing_title": (cp.get("title") or "").strip(),
                  "venue": cp.get("venue") or "", "publication_date": cp.get("publicationDate") or "",
                  "year": cp.get("year") or "", "authors": authors[0] + (" et al." if len(authors) > 1 else "") if authors else "",
                  "is_influential": bool(row.get("isInfluential")), "doi": ext.get("DOI") or "", "arxiv": ext.get("ArXiv") or "",
                  "context": context, "url": "https://www.semanticscholar.org/paper/" + cp["paperId"]}

      def page_citations(pid, seen, baseline, growth):
          new, fetched, unidentified, offset, pages = [], [], 0, 0, 0
          while True:
              if pages >= max_pages:
                  return new, fetched, unidentified, pages, True
              data = call(f"{API}/paper/{pid}/citations?fields={CITATION_FIELDS}&limit={PAGE_SIZE}&offset={offset}") or {}
              pages += 1
              hit_seen = older = page_new = 0
              for row in data.get("data") or []:
                  cid = (row.get("citingPaper") or {}).get("paperId")
                  if not cid:
                      unidentified += 1
                      continue
                  if cid in fetched:
                      continue
                  fetched.append(cid)
                  if cid in seen:
                      hit_seen += 1
                      continue
                  published = row["citingPaper"].get("publicationDate")
                  if baseline and (not published or published < cutoff):
                      older += published is not None
                      continue
                  new.append(citation_row(row))
                  page_new += 1
              done = older > 0 if baseline else hit_seen > 0 and (len(new) >= growth or page_new == 0)
              if done or "next" not in data:
                  return new, fetched, unidentified, pages, False
              offset = data["next"]

      with open("state.json", encoding="utf-8") as f:
          raw_state = f.read().strip()
      state = json.loads(raw_state) if raw_state.startswith("{") else {}
      known = state.setdefault("papers", {})

      inputs = [p.strip() for p in re.split(r"[;\n]", os.environ["WATCHED"]) if p.strip()]
      not_found, ids = [], {}
      for raw in inputs:
          norm = normalise(raw)
          if norm is None:
              not_found.append(f"{raw} (unrecognised id format)")
          else:
              ids.setdefault(norm, raw)
      batch_ids = list(ids)
      resolved = {}
      for i in range(0, len(batch_ids), 500):
          chunk = batch_ids[i:i + 500]
          answer = call(f"{API}/paper/batch?fields=title,year,citationCount,externalIds", {"ids": chunk}) or []
          for norm, paper in zip(chunk, answer):
              if not paper or not paper.get("paperId"):
                  not_found.append(ids[norm])
                  continue
              entry = resolved.setdefault(paper["paperId"], dict(paper, watched_as=[]))
              entry["watched_as"].append(ids[norm])

      papers, citations, gave_up = [], [], False
      for pid, p in resolved.items():
          count = p.get("citationCount") or 0
          prev = known.get(pid)
          before = prev["citation_count"] if prev else None
          rec = {"watched_as": " | ".join(p["watched_as"]), "paper_id": pid, "title": p.get("title") or "", "year": p.get("year") or "",
                 "citation_count": count, "previous_count": "" if before is None else before,
                 "new_citations": 0, "influential_new": 0, "pages": 0, "baseline": prev is None, "status": ""}
          if prev is not None and count <= before:
              rec["status"] = "NO_CHANGE" if count == before else "COUNT_DROPPED"
              prev["citation_count"] = count
          elif gave_up:
              rec["status"] = "RATE_LIMITED"
          else:
              try:
                  new, fetched, unidentified, pages, truncated = page_citations(
                      pid, set(prev["seen"]) if prev else set(), prev is None, count - (before or 0))
              except GaveUp:
                  gave_up, rec["status"] = True, "RATE_LIMITED"
              else:
                  new.sort(key=lambda c: c["publication_date"], reverse=True)
                  new.sort(key=lambda c: not c["is_influential"])
                  for c in new:
                      c.update(watched_paper_id=pid, watched_title=rec["title"], baseline=prev is None)
                  citations += new
                  old_seen = prev["seen"] if prev else []
                  fetched_set = set(fetched)
                  merged = fetched + [s for s in old_seen if s not in fetched_set]
                  known[pid] = {"title": rec["title"], "citation_count": count, "seen": merged[:SEEN_CAP], "updated": os.environ["RUN_DATE"]}
                  rec.update(new_citations=len(new), influential_new=sum(c["is_influential"] for c in new), pages=pages,
                             status="TRUNCATED" if truncated else "BASELINE" if prev is None else "NEW_CITATIONS" if new else "GREW_NOTHING_LISTED")
                  if unidentified:
                      print(f"{pid}: {unidentified} citing records without a paperId were skipped")
          papers.append(rec)
          print(f"{rec['status']:<19} {pid} cites {before}->{count} new {rec['new_citations']} "
                f"(influential {rec['influential_new']}) pages {rec['pages']} :: {rec['title'][:80]}")

      def esc(text):
          return str(text).replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")

      influential = sum(c["is_influential"] for c in citations)
      with_new = [r for r in papers if r["new_citations"]]
      lines = [f"*Semantic Scholar: {len(citations)} new citations of {len(with_new)} watched papers* ({influential} influential)"]
      for r in with_new:
          mine = [c for c in citations if c["watched_paper_id"] == r["paper_id"]]
          note = f"first run for this paper, published since {cutoff}" if r["baseline"] else f"{r['previous_count']} -> {r['citation_count']} citations"
          lines.append(f"\n*<https://www.semanticscholar.org/paper/{r['paper_id']}|{esc(r['title'])}>* +{len(mine)} ({note})")
          for c in mine[:SHOWN_PER_PAPER]:
              star = ":star: *influential* " if c["is_influential"] else ""
              meta = ", ".join(x for x in (c["authors"], c["venue"], c["publication_date"] or str(c["year"])) if x)
              lines.append(f"- {star}<{c['url']}|{esc(c['citing_title'])}> ({esc(meta)})")
              if c["context"]:
                  lines.append(f"> _{esc(c['context'])}_")
          if len(mine) > SHOWN_PER_PAPER:
              lines.append(f"_...and {len(mine) - SHOWN_PER_PAPER} more in the CSV_")
      if not_found:
          lines.append("\nNOT_FOUND: " + esc("; ".join(not_found)))
      if os.environ.get("EXECUTION_URL", "").startswith("http"):
          lines.append(f"<{os.environ['EXECUTION_URL']}|Kestra execution>")

      columns = ["watched_paper_id", "watched_title", "citing_paper_id", "citing_title", "authors", "venue", "publication_date",
                 "year", "is_influential", "baseline", "doi", "arxiv", "context", "url"]
      with open("new_citations.csv", "w", newline="", encoding="utf-8") as f:
          w = csv.DictWriter(f, fieldnames=columns, extrasaction="ignore")
          w.writeheader()
          w.writerows(citations)
      with open("papers.csv", "w", newline="", encoding="utf-8") as f:
          w = csv.DictWriter(f, fieldnames=list(papers[0]) if papers else ["watched_as", "status"])
          w.writeheader()
          w.writerows(papers + [{"watched_as": n, "status": "NOT_FOUND"} for n in not_found])
      with open("state.json", "w", encoding="utf-8") as f:
          json.dump(state, f, separators=(",", ":"))

      summary = {"watched_inputs": len(inputs), "resolved_papers": len(resolved), "not_found": len(not_found),
                 "not_found_ids": "; ".join(not_found), "papers_with_new": len(with_new), "new_citations": len(citations),
                 "influential_new": influential, "baseline_papers": sum(r["status"] == "BASELINE" for r in papers),
                 "truncated": sum(r["status"] == "TRUNCATED" for r in papers),
                 "rate_limited": sum(r["status"] == "RATE_LIMITED" for r in papers),
                 "requests": stats["requests"], "retries": stats["retries"], "waited_s": round(stats["waited_s"]),
                 "digest": "\n".join(lines)}
      print("::" + json.dumps({"outputs": summary}) + "::")

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    description: Stores the updated counts and seen citing paperIds (capped at the newest 1,000 per watched paper). Papers dropped from the watchlist keep their entry, so adding them back does not alert again.
    key: s2_citation_watch_state
    value: "{{ read(outputs.collect_citations.outputFiles['state.json']) }}"

  - id: route_digest
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.collect_citations.vars.new_citations > 0 }}"
    then:
      - id: slack_digest
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: One message for the whole run, influential citations first with a context snippet each. allowFailure keeps the run green without the webhook; the CSV and the log still carry everything.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": {{ outputs.collect_citations.vars.digest | toJson }}}

      - id: log_digest
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "{{ outputs.collect_citations.vars.digest }}"
    else:
      - id: nothing_new
        type: io.kestra.plugin.core.log.Log
        message: "No new citing papers for {{ outputs.collect_citations.vars.resolved_papers }} watched papers ({{ outputs.collect_citations.vars.requests }} API requests)."

  - id: warn_not_found
    type: io.kestra.plugin.core.log.Log
    runIf: "{{ outputs.collect_citations.vars.not_found > 0 }}"
    level: WARN
    message: "Semantic Scholar could not resolve: {{ outputs.collect_citations.vars.not_found_ids }}"

  - id: warn_rate_limited
    type: io.kestra.plugin.core.log.Log
    runIf: "{{ outputs.collect_citations.vars.rate_limited > 0 }}"
    level: WARN
    message: "{{ outputs.collect_citations.vars.rate_limited }} papers were skipped after repeated 429 answers and keep their previous state; they are retried on the next run. Consider `use_api_key`."

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      {{ outputs.collect_citations.vars.watched_inputs }} watched ids resolved to {{ outputs.collect_citations.vars.resolved_papers }} papers ({{ outputs.collect_citations.vars.not_found }} not found, {{ outputs.collect_citations.vars.baseline_papers }} baselined this run).
      New citing papers: {{ outputs.collect_citations.vars.new_citations }} for {{ outputs.collect_citations.vars.papers_with_new }} papers, {{ outputs.collect_citations.vars.influential_new }} influential, {{ outputs.collect_citations.vars.truncated }} truncated, {{ outputs.collect_citations.vars.rate_limited }} rate limited.
      API: {{ outputs.collect_citations.vars.requests }} requests, {{ outputs.collect_citations.vars.retries }} retries, {{ outputs.collect_citations.vars.waited_s }} s backoff.

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.collect_citations.vars }}"
  - id: new_citations_csv
    type: FILE
    value: "{{ outputs.collect_citations.outputFiles['new_citations.csv'] }}"
  - id: papers_csv
    type: FILE
    value: "{{ outputs.collect_citations.outputFiles['papers.csv'] }}"

extend:
  title: Alert on New Citations of Watched Papers with the Semantic Scholar Graph API
  metaTitle: Semantic Scholar New Citation Alert with Python, KV Store and Slack | Kestra
  shortDescription: Resolve a watchlist of DOIs, arXiv ids and Semantic Scholar ids in one batch request, page forward citations only for papers whose citation count grew, stop at citing papers already seen, and send a weekly Slack digest and CSV that highlight influential citations with a context snippet.
  metaDescription: Weekly Semantic Scholar check of watched papers for new citing papers, paged only to the last seen one, with influential highlights, CSV and Slack digest.
  description: |
    Citation alerts usually arrive per author, by email, without context. Semantic Scholar already knows which papers cite yours, which of those citations it rates as influential, and the sentence in which each citing paper mentions yours. This flow turns that into a weekly digest for a list of papers, paging forward citations only for papers that gained some and only back to the last citing paper already reported.

    ## How it works

    1. A weekly `Schedule` trigger (Monday 07:00 UTC) starts the run. `papers` takes DOIs, arXiv ids, `CorpusId:` ids, Semantic Scholar paperIds or their URLs.
    2. `load_state` (KV Get) reads the state: per watched paperId, the last citation count and the citing paperIds already seen, newest first.
    3. `collect_citations` (Python, standard library only) normalises the ids and resolves all of them with one `POST /paper/batch?fields=title,year,citationCount,externalIds`. Unknown ids and strings that are not ids are reported as `NOT_FOUND`. Two inputs that resolve to the same paper (a DOI and the arXiv preprint, for example) become one watched paper.
    4. Only papers whose `citationCount` is higher than in the state are paged with `GET /paper/{id}/citations` (100 per page, `fields=title,year,venue,authors,externalIds,isInfluential,contexts,publicationDate`). Citing papers come newest first; they are deduplicated by paperId (pages shift while papers are indexed) and paging stops once a page reaches already-seen ones and the count growth is accounted for. A paper that is new to the state gets a baseline instead: citing papers published inside `baseline_lookback_days` are reported, everything older is only recorded. A count that went down (merged duplicate records) is `COUNT_DROPPED`, with no request.
    5. Requests are paced (3 s keyless, 1.1 s with a key) and 429/5xx answers retried with `Retry-After` or exponential backoff. If it keeps refusing, the remaining papers are `RATE_LIMITED` and keep their old state, so the next run catches up.
    6. `save_state` (KV Set) stores the new counts and seen ids, capped at the newest 1,000 citing papers per watched paper.
    7. `route_digest` (If) sends one Slack message when there is something new: influential citations first with a star, then by publication date, each with one context sentence from the citing paper, at most five per watched paper. The webhook has `allowFailure`; the digest is also logged at WARN. Otherwise `nothing_new` logs a one-liner.
    8. `warn_not_found` and `warn_rate_limited` (`runIf`) surface bad ids and throttled papers; `summary` logs counts, requests and backoff time.

    ## What you get

    - `new_citations_csv`: one row per new citing paper with title, first author, venue, date, `is_influential`, DOI, context sentence and link.
    - `papers_csv`: one row per watched paper with the inputs that map to it, citation count before and after, new and influential counts, pages fetched and a status (`BASELINE`, `NEW_CITATIONS`, `NO_CHANGE`, `COUNT_DROPPED`, `GREW_NOTHING_LISTED`, `TRUNCATED`, `RATE_LIMITED`, `NOT_FOUND`).
    - A Slack digest that leads with influential citations and shows why each paper cited yours.
    - A quiet week costs one batch call for the whole list.

    ## Who it's for

    - Researchers and labs who want to know who builds on their work.
    - Research-impact, library and grant offices that report on citations of funded outputs.
    - Software and dataset maintainers tracking papers that cite their work.

    ## Why orchestrate this with Kestra

    - The KV store keeps the seen set between runs, so "report once" needs no database, and a paper added later gets its own baseline.
    - The `S2_API_KEY` secret is opt-in through an input and masked in logs; the same flow works keyless.
    - `If` and `allowFailure` keep the run green without a webhook while the CSV outputs stay downloadable from the execution.

    ## Prerequisites

    - Kestra 2.0 with the Python script plugin and the Slack plugin. The script uses `python:3.13-slim` on the default Docker task runner; switch to the Process runner if the worker has Python 3.9+.
    - Outbound HTTPS to `api.semanticscholar.org`. A key is optional; the keyless pool is shared by everyone and 429 answers are routine, which the backoff handles.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the digest (optional; without it the Slack task warns and the run succeeds).
    - `S2_API_KEY`: Semantic Scholar API key, used only when `use_api_key` is true.

    ## Quick start

    1. Import the flow and click **Execute** with the defaults: three Semantic Scholar papers and one with a single citation. The first run is a baseline that reports the citing papers of the last 30 days.
    2. Execute again: every paper is `NO_CHANGE`, one request is made and `nothing_new` runs.
    3. Add `DOI:10.9999/not-a-real-paper` and the arXiv id of a paper already in the list: the first shows as `NOT_FOUND`, the second is merged into the existing paper.
    4. Put your own papers in `papers`, set `baseline_lookback_days` to 0 for a silent start, add `SLACK_WEBHOOK_URL` and keep the weekly schedule.

    ## How to extend

    - Read the watchlist from a namespace file or from an author's paper list (`GET /author/{id}/papers`) instead of an input.
    - Feed `new_citations_csv` into a warehouse table to chart citations per paper over time.
    - Route influential citations to a separate channel.
    - Raise `max_pages_per_paper` with an API key for very highly cited papers.

    ## Links

    - [Python Script](https://kestra.io/plugins/plugin-script-python/io.kestra.plugin.scripts.python.script)
    - [KV Get](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.get) and [KV Set](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.set)
    - [If](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [Semantic Scholar Academic Graph API](https://api.semanticscholar.org/api-docs/graph) and [API overview and keys](https://www.semanticscholar.org/product/api)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
