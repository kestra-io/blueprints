id: vale-docs-style-gate
namespace: company.team
description: |
  On every push to a documentation repository, lint the Markdown with Vale,
  compare the alerts with the accepted baseline of the base branch kept in the
  KV store, and block the merge when the push adds new error-level alerts. New
  warnings are logged, and a clean run on the base branch becomes the new
  baseline.

inputs:
  - id: repository_url
    type: STRING
    defaults: "https://github.com/acme/docs.git"
    displayName: "Repository URL"
    description: "Git repository of the documentation. It must contain a `.vale.ini`."
  - id: branch
    type: STRING
    defaults: "main"
    displayName: "Branch"
    description: "Branch that was pushed."
  - id: base_branch
    type: STRING
    defaults: "main"
    displayName: "Base Branch"
    description: "Branch whose accepted alerts form the baseline. Only clean runs on this branch update it."
  - id: docs_path
    type: STRING
    defaults: "docs"
    displayName: "Docs Path"
    description: "Folder (or file) to lint, relative to the repository root."

variables:
  baseline_key: "{{ ('vale-baseline-' ~ inputs.repository_url ~ '-' ~ inputs.base_branch) | slugify }}"
  history_key: "{{ ('vale-history-' ~ inputs.repository_url ~ '-' ~ inputs.base_branch) | slugify }}"

triggers:
  - id: on_push
    type: io.kestra.plugin.core.trigger.Webhook
    description: Point the docs repository's GitHub push webhook (JSON) at this trigger. Branch deletions and non-branch refs are ignored. Shipped disabled.
    disabled: true
    key: "{{ secret('VALE_GATE_WEBHOOK_KEY') }}"
    when: "{{ (trigger.body.ref ?? '') contains 'refs/heads/' and not (trigger.body.deleted ?? false) }}"
    inputs:
      repository_url: "{{ trigger.body.repository.clone_url }}"
      branch: "{{ trigger.body.ref | replace({'refs/heads/': ''}) }}"
      base_branch: "{{ trigger.body.repository.default_branch }}"

tasks:
  - id: lint
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: Clone the pushed branch, lint it with Vale and compare the alerts with the baseline, in one working directory.
    tasks:
      - id: clone
        type: io.kestra.plugin.git.Clone
        description: Shallow clone of the pushed branch. For a private repository add `username` and `password` from a secret.
        url: "{{ inputs.repository_url }}"
        branch: "{{ inputs.branch }}"
        depth: 1

      - id: vale
        type: io.kestra.plugin.scripts.shell.Commands
        description: Run Vale 3.24.0 (official image) with the repository's own `.vale.ini` and styles. `vale sync` installs the packages the config lists; `--no-exit` keeps alerts from failing the task, so only a broken config does.
        containerImage: jdkato/vale:v3.24.0
        commands:
          - vale --version
          - vale sync
          - rc=0; vale --output=JSON --no-exit {{ inputs.docs_path }} > vale.json || rc=$?; if [ $rc -ne 0 ]; then cat vale.json; exit $rc; fi
        timeout: PT10M

      - id: compare_with_baseline
        type: io.kestra.plugin.scripts.python.Script
        description: Fingerprint every alert (rule, file, message; no line numbers, so edits elsewhere in a file do not count as new), count them by severity, compare the counts with the baseline, and prepare the next point of the base branch's alert history. With no baseline yet, a run on the base branch adopts the current alerts.
        containerImage: python:3.12-slim
        inputFiles:
          baseline.json: "{{ kv(render(vars.baseline_key), errorOnMissing=false) | toJson }}"
          history.json: "{{ kv(render(vars.history_key), errorOnMissing=false) | toJson }}"
        outputFiles:
          - vale.json
          - baseline.json
          - history.json
        script: |
          import collections, datetime, json

          on_base = "{{ inputs.branch }}" == "{{ inputs.base_branch }}"
          report = json.load(open("vale.json", encoding="utf-8")) or {}
          stored = json.load(open("baseline.json", encoding="utf-8"))

          current, severity, places = collections.Counter(), {}, collections.defaultdict(list)
          by_severity = collections.Counter()
          for path, alerts in report.items():
              path = path.replace("\\", "/")
              for a in alerts:
                  fp = f"{a['Check']}|{path}|{a['Message']}"
                  current[fp] += 1
                  severity[fp] = a["Severity"]
                  by_severity[a["Severity"]] += 1
                  places[fp].append(f"{path}:{a['Line']}")

          adopted = stored is None and on_base
          accepted = collections.Counter(current if adopted else (stored or {}))
          new = {fp: n - accepted[fp] for fp, n in current.items() if n > accepted[fp]}
          fixed = sum(n - current[fp] for fp, n in accepted.items() if n > current[fp])

          def lines(level):
              out = []
              for fp, n in sorted(new.items()):
                  if severity[fp] == level:
                      check, path, message = fp.split("|", 2)
                      out.append(f"{', '.join(places[fp])}: {message} ({check}, {n} new)")
              return out

          new_errors, new_warnings = lines("error"), lines("warning")
          json.dump(dict(current), open("baseline.json", "w", encoding="utf-8"), indent=1, sort_keys=True)

          history = json.load(open("history.json", encoding="utf-8")) or []
          point = {"at": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"), "branch": "{{ inputs.branch }}",
                   "error": by_severity["error"], "warning": by_severity["warning"], "suggestion": by_severity["suggestion"]}
          json.dump((history + [point])[-30:], open("history.json", "w", encoding="utf-8"))
          recent = (history + [point])[-6:]
          trend = ", ".join(f"{level}s " + " -> ".join(str(p[level]) for p in recent) for level in ("error", "warning"))
          print("::" + json.dumps({"outputs": {
              "total": sum(current.values()), "by_severity": dict(by_severity),
              "accepted": sum(min(n, accepted[fp]) for fp, n in current.items()),
              "new_errors": sum(new[fp] for fp in new if severity[fp] == "error"),
              "new_warnings": sum(new[fp] for fp in new if severity[fp] == "warning"),
              "new_suggestions": sum(new[fp] for fp in new if severity[fp] == "suggestion"),
              "fixed": fixed, "had_baseline": stored is not None, "adopted": adopted, "on_base_branch": on_base,
              "error_lines": new_errors[:25], "warning_lines": new_warnings[:25],
              "trend": trend, "history_points": len(history),
          }}) + "::")

  - id: log_summary
    type: io.kestra.plugin.core.log.Log
    description: Log the totals against the baseline.
    message: "Vale on {{ inputs.branch }} ({{ inputs.docs_path }}): {{ outputs.compare_with_baseline.vars.total }} alert(s) {{ outputs.compare_with_baseline.vars.by_severity }}, {{ outputs.compare_with_baseline.vars.accepted }} accepted in the {{ inputs.base_branch }} baseline{{ outputs.compare_with_baseline.vars.adopted ? ' (adopted on this first run)' : '' }}, new: {{ outputs.compare_with_baseline.vars.new_errors }} error(s), {{ outputs.compare_with_baseline.vars.new_warnings }} warning(s), {{ outputs.compare_with_baseline.vars.new_suggestions }} suggestion(s); {{ outputs.compare_with_baseline.vars.fixed }} accepted alert(s) fixed."

  - id: report_new_warnings
    type: io.kestra.plugin.core.flow.If
    description: New warnings do not block the merge, but they are listed for the author.
    condition: "{{ outputs.compare_with_baseline.vars.new_warnings > 0 }}"
    then:
      - id: log_new_warnings
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: |-
          {{ outputs.compare_with_baseline.vars.new_warnings }} new Vale warning(s) on {{ inputs.branch }}:{% for line in outputs.compare_with_baseline.vars.warning_lines %}
          - {{ line }}{% endfor %}

  - id: gate
    type: io.kestra.plugin.core.flow.If
    description: Block the merge on new error-level alerts. On a clean run, the base branch's baseline is replaced with the current alerts, so fixed alerts drop out and accepted warnings stop being reported.
    condition: "{{ outputs.compare_with_baseline.vars.new_errors > 0 }}"
    then:
      - id: block_merge
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: |-
          Merge blocked: {{ outputs.compare_with_baseline.vars.new_errors }} new Vale error(s) on {{ inputs.branch }}{{ outputs.compare_with_baseline.vars.had_baseline ? '' : ' (no baseline for ' ~ inputs.base_branch ~ ' yet, run the gate on it first)' }}:{% for line in outputs.compare_with_baseline.vars.error_lines %}
          - {{ line }}{% endfor %}
    else:
      - id: update_baseline
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.compare_with_baseline.vars.on_base_branch }}"
        then:
          - id: save_baseline
            type: io.kestra.plugin.core.kv.Set
            description: Store the current alert counts as the accepted baseline of the base branch.
            key: "{{ render(vars.baseline_key) }}"
            value: "{{ read(outputs.compare_with_baseline.outputFiles['baseline.json']) }}"
            kvType: JSON
          - id: log_baseline_saved
            type: io.kestra.plugin.core.log.Log
            message: "Vale gate passed on {{ inputs.base_branch }}; baseline {{ render(vars.baseline_key) }} now holds {{ outputs.compare_with_baseline.vars.total }} accepted alert(s). Trend over the last base-branch runs: {{ outputs.compare_with_baseline.vars.trend }}."
          - id: save_history
            type: io.kestra.plugin.core.kv.Set
            description: Append this run's totals to the base branch's alert history (last 30 runs), so the trend over time stays visible.
            key: "{{ render(vars.history_key) }}"
            value: "{{ read(outputs.compare_with_baseline.outputFiles['history.json']) }}"
            kvType: JSON
        else:
          - id: log_passed
            type: io.kestra.plugin.core.log.Log
            message: "Vale gate passed on {{ inputs.branch }}: no new error compared with the {{ inputs.base_branch }} baseline. The baseline changes only after the merge."

outputs:
  - id: new_errors
    type: INT
    value: "{{ outputs.compare_with_baseline.vars.new_errors }}"
  - id: report
    type: FILE
    value: "{{ outputs.compare_with_baseline.outputFiles['vale.json'] }}"

extend:
  title: "Vale Docs Style Gate with an Accepted-Alert Baseline"
  shortDescription: Lint every push to a docs repository with Vale, compare the alerts with the base branch's accepted baseline in the KV store, and block the merge only on new errors.
  metaTitle: Vale Docs Style Gate with KV Baseline | Kestra
  metaDescription: "Lint every docs push with Vale, compare alerts with an accepted baseline in the KV store, block merges on new errors and log new warnings."
  description: |
    Adding a prose linter to an existing documentation repository usually fails on day one: [Vale](https://vale.sh) reports hundreds of old alerts, the check is red on every pull request, and the team turns it off. This blueprint makes Vale enforceable from the first run. It lints every push with the repository's own `.vale.ini` and styles, compares the alerts with an accepted baseline of the base branch kept in the KV store, blocks the merge only when the push adds new error-level alerts, lists new warnings for the author, and moves the baseline forward on every clean run of the base branch, so fixed alerts can never come back unnoticed.

    ## How it works

    1. `on_push` (`io.kestra.plugin.core.trigger.Webhook`) receives the repository's push webhook, ignores branch deletions and non-branch refs, and passes the repository URL, branch and default branch as inputs. It ships `disabled: true`.
    2. `lint` (`io.kestra.plugin.core.flow.WorkingDirectory`) keeps the steps in one working directory: `clone` (`io.kestra.plugin.git.Clone`) checks out the branch, and `vale` (`io.kestra.plugin.scripts.shell.Commands`) runs the official `jdkato/vale:v3.24.0` image with `vale sync` and `vale --output=JSON --no-exit`, so alerts never crash the task and a broken config does.
    3. `compare_with_baseline` (`io.kestra.plugin.scripts.python.Script`) fingerprints each alert by rule, file and message (no line numbers, so editing a paragraph above an old alert does not make it new), counts them by severity, and compares the counts with the baseline read with `kv()`. A fingerprint whose count grows counts as new too. On the first run of the base branch the current alerts are adopted as the baseline.
    4. `log_summary` logs totals, accepted, new and fixed alerts; `report_new_warnings` lists new warnings at WARN level without blocking.
    5. `gate` (`io.kestra.plugin.core.flow.If`) runs `block_merge` (`io.kestra.plugin.core.execution.Fail`) with each new error and its file and line. A clean run on the base branch stores the current counts as the new baseline and appends its totals to the alert history (last 30 runs) with `io.kestra.plugin.core.kv.Set`, and logs the trend (for example `errors 1 -> 0, warnings 1 -> 1`); a clean run on another branch leaves both untouched until the merge.

    ## What you get

    - A style gate that can be switched on for a repository with years of existing alerts.
    - Merges blocked only for errors the push introduced, with file, line, rule and message in the failure.
    - New warnings reported to the author on every push without blocking.
    - A baseline per repository and base branch that shrinks as old alerts are fixed, so a fixed alert that comes back on an older branch blocks the merge again.
    - An alert history per base branch in the KV store, with the error and warning trend logged on every clean run, plus the full Vale JSON report on every execution.

    ## Who it's for

    - Documentation and developer-experience teams that maintain a Vale style guide.
    - Platform teams that want the same docs gate on many repositories without a CI job in each.

    ## Why orchestrate this with Kestra

    The difficult part of a linter gate is the state: what is already accepted, on which branch, when it may change, and whether the docs are getting better over time. Kestra keeps that state in the KV store per repository and base branch, starts the gate from the push webhook with a condition, runs Vale in its official container next to the comparison in one working directory, and turns the result into a pass, a warning or a blocked merge with `If` and `Fail`, with the report and the decision recorded on every execution.

    ## Prerequisites

    - A documentation repository with a `.vale.ini` at its root and its styles (or `Packages` that `vale sync` can download).
    - A Kestra worker that can run containers (Docker or Kubernetes task runner) and pull `jdkato/vale:v3.24.0` and `python:3.12-slim`.

    ### Secrets

    - `VALE_GATE_WEBHOOK_KEY`: a long random key that becomes part of the webhook URL.
    - For a private repository, a Git token used as `password` in `clone`.

    ## Quick start

    1. Execute the flow on the base branch (`branch` = `base_branch` = `main`) to adopt the current alerts as the baseline.
    2. Execute it on a branch that adds an error, for example a product name that one of your styles swaps, and check that `block_merge` names the file and line.
    3. Execute it on the base branch again: the accepted alerts no longer block, only new ones do.
    4. Add a push webhook in the docs repository pointing at `/api/v1/main/executions/webhook/company.team/vale-docs-style-gate/<key>` (JSON content type) and enable `on_push`.

    ## How to extend

    - Post the result as a commit status or a pull-request comment with an HTTP request to the Git host's API.
    - Block on new warnings too, for repositories that have reached zero warnings.
    - Lint only the files changed by the push, taken from the webhook payload, for very large repositories.
    - Share one style package across repositories with `Packages` in `.vale.ini`; `vale sync` installs it on every run.

    ## Links

    - [Vale documentation](https://vale.sh/docs)
    - [Vale styles and rules](https://vale.sh/docs/styles)
    - [Kestra KV store](https://kestra.io/docs/concepts/kv-store)
    - [Kestra Webhook trigger](https://kestra.io/plugins/core/triggers/io.kestra.plugin.core.trigger.webhook)
    - [Kestra Git Clone task](https://kestra.io/plugins/plugin-git/io.kestra.plugin.git.clone)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Testing & Quality
  ee: false
  demo: false
