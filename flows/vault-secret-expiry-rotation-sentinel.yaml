id: vault-secret-expiry-rotation-sentinel
namespace: company.team
description: |
  Scan HashiCorp Vault KV metadata for aging secrets, flag entries past their
  rotation window, and alert owners on Slack before credentials go stale.

triggers:
  - id: daily_scan
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scan secret age every weekday morning
    cron: "0 7 * * MON-FRI"

  - id: on_demand_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: On-demand scan before audits or rotations
    key: "{{ secret('WEBHOOK_KEY') }}"

inputs:
  - id: vault_addr
    type: STRING
    displayName: Vault address
    description: Base URL of the Vault cluster
    defaults: "https://vault.example.com:8200"
  - id: mount_paths
    type: ARRAY
    itemType: STRING
    displayName: KV paths to scan
    description: Secret paths (without secret/ prefix) to check
    defaults:
      - "apps/api/database"
      - "apps/worker/stripe"
  - id: max_age_days
    type: INT
    displayName: Max secret age (days)
    description: Flag secrets older than this window
    defaults: 90

tasks:
  - id: scan_secrets
    type: io.kestra.plugin.core.flow.Loop
    description: Fan out secret-age checks with bounded concurrency
    values: "{{ inputs.mount_paths }}"
    concurrencyLimit: 4
    tasks:
      - id: fetch_metadata
        type: io.kestra.plugin.core.http.Request
        description: Read KV v2 metadata (versions, timestamps) from Vault
        uri: "{{ inputs.vault_addr }}/v1/secret/metadata/{{ parents[0].value }}"
        method: GET
        headers:
          X-Vault-Token: "{{ secret('VAULT_TOKEN') }}"
        options:
          allowFailed: true

      - id: evaluate_age
        type: io.kestra.plugin.scripts.python.Script
        description: Compute secret age from metadata timestamps vs rotation window
        containerImage: python:3.11
        dependencies:
          - kestra
        script: |
          from kestra import Kestra
          from datetime import datetime, timezone

          path = """{{ parents[0].value }}"""
          max_age = {{ inputs.max_age_days }}
          try:
              body = {{ outputs.fetch_metadata.body | json }}
          except Exception:
              body = {}
          data = (body or {}).get("data", {}) or {}
          versions = data.get("versions", {}) or {}

          latest_ts = None
          for v in versions.values():
              ts = v.get("created_time")
              if ts and (latest_ts is None or ts > latest_ts):
                  latest_ts = ts

          age_days, stale = -1, False
          if latest_ts:
              try:
                  created = datetime.fromisoformat(latest_ts.replace("Z", "+00:00"))
                  age_days = (datetime.now(timezone.utc) - created).days
                  stale = age_days > max_age
              except Exception as e:
                  Kestra.logger().warning(f"Unparseable timestamp {latest_ts}: {e}")

          Kestra.logger().info(f"{path}: age {age_days}d, stale={stale}")
          Kestra.outputs({
              "path": path, "age_days": age_days,
              "stale": stale, "latest": latest_ts or "unknown",
          })

      - id: alert_on_stale
        type: io.kestra.plugin.core.flow.If
        description: Notify Slack only when a secret exceeds its rotation window
        condition: "{{ outputs.evaluate_age.vars.stale }}"
        then:
          - id: notify_slack
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Post stale-secret alert with path and age
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            messageText: |
              :key: *Stale Vault Secret*
              Path: `secret/{{ outputs.evaluate_age.vars.path }}`
              Age: {{ outputs.evaluate_age.vars.age_days }}d vs {{ inputs.max_age_days }}d policy
              Last version: {{ outputs.evaluate_age.vars.latest }}
              Execution: `{{ execution.id }}`
              Rotate the credential and update dependent apps.

  - id: emit_rotation_metrics
    type: io.kestra.plugin.core.output.OutputValues
    description: Export scan coverage for compliance audit history
    values:
      paths_scanned: "{{ inputs.mount_paths | length }}"
      max_age_days: "{{ inputs.max_age_days }}"
      scanned_at: "{{ now() }}"

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert on-call if the sentinel itself fails
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: |
      :warning: *Vault Rotation Sentinel FAILED*
      Flow: `{{ flow.id }}` execution `{{ execution.id }}`
      Check VAULT_TOKEN validity and worker logs.

extend:
  title: Detect Stale Vault Secrets Past Their Rotation Window
  metaTitle: Vault Secret Expiry Rotation Sentinel
  shortDescription: Scan Vault KV metadata daily, flag secrets older than policy, and alert Slack.
  metaDescription: Watch Vault secret age with Kestra. Detect stale credentials past rotation policy and alert Slack.
  description: |
    Static credentials are a breach waiting to happen. This blueprint scans configurable Vault KV v2 paths every weekday morning, reads each entry's version metadata to compute credential age, and posts a Slack alert only when a secret exceeds its rotation window (default 90 days). A webhook trigger enables on-demand scans before audits.

    ## How it works

    1. `daily_scan` (`io.kestra.plugin.core.trigger.Schedule`, cron `0 7 * * MON-FRI`) launches the run; `on_demand_webhook` allows ad-hoc scans.
    2. `scan_secrets` (`io.kestra.plugin.core.flow.Loop`, concurrency 4) fans out across `inputs.mount_paths`.
    3. `fetch_metadata` (`io.kestra.plugin.core.http.Request`) reads KV v2 metadata with `allowFailed: true`.
    4. `evaluate_age` (`io.kestra.plugin.scripts.python.Script`) parses `created_time` stamps and sets `stale`.
    5. `alert_on_stale` (`io.kestra.plugin.core.flow.If`) posts to Slack (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) only for stale secrets.
    6. `emit_rotation_metrics` (`io.kestra.plugin.core.output.OutputValues`) exports coverage for compliance history.

    ## What you get

    - Daily age report across any number of secret paths.
    - Rotation-window gate (default 90 days) with Slack alerts.
    - Path, age, and last-version details per offender.
    - Failure alert if the sentinel itself errors.

    ## Who it's for

    - Security engineers enforcing credential rotation policy.
    - Platform teams owning Vault and secret lifecycle.
    - Compliance teams evidencing rotation before audits.

    ## Prerequisites

    - A Vault cluster with KV v2 mounted at `secret/`.
    - A token with metadata read on the scanned paths.

    ### Secrets

    - `VAULT_TOKEN`: token used to read KV metadata.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook for stale and failure alerts.
    - `WEBHOOK_KEY`: auth key for the on-demand webhook trigger.

    ## Quick start

    1. Set `VAULT_TOKEN`, `SLACK_WEBHOOK_URL`, and `WEBHOOK_KEY` secrets.
    2. Edit `vault_addr`, `mount_paths`, and `max_age_days` inputs.
    3. Run once manually to verify Vault access.
    4. Enable the `daily_scan` schedule.

    ## How to extend

    - Auto-trigger rotation workflows per stale path.
    - Persist age history to Postgres for MTTR-style rotation metrics.
    - Open Jira tickets per stale secret with path and owner.

    ## Links

    - Vault KV metadata API: https://developer.hashicorp.com/vault/api-docs/secret/kv/kv-v2
    - Slack plugin: https://kestra.io/plugins/plugin-slack
    - This blueprint has been created by [yashspidey](https://github.com/yashspidey)

    ## Inputs

    - `vault_addr` (STRING): base URL of the Vault cluster.
    - `mount_paths` (ARRAY of STRING): KV paths to scan.
    - `max_age_days` (INT, default 90): rotation window in days.

    ## Outputs

    - `emit_rotation_metrics.values.paths_scanned`: number of paths scanned.
    - `emit_rotation_metrics.values.scanned_at`: run timestamp for audit reports.
  tags:
    - Security
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
