id: woodpecker-ci-pipeline-failure-sentinel
namespace: company.devops

inputs:
  - id: woodpecker_server_url
    type: STRING
    defaults: "https://woodpecker.internal"
    description: Base URL of the Woodpecker CI server.
  - id: repo_owner
    type: STRING
    description: Repository owner or organization name in Woodpecker.
  - id: repo_name
    type: STRING
    description: Repository name in Woodpecker.
  - id: failure_threshold
    type: INT
    defaults: 2
    description: "Number of consecutive build pipeline failures to trigger alert (default 2)."

tasks:
  - id: check_build_history
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query Woodpecker CI API for recent pipeline builds
        curl -s -H "Authorization: Bearer {{ secret('WOODPECKER_API_TOKEN') }}" \
          "{{ inputs.woodpecker_server_url }}/api/repos/{{ inputs.repo_owner }}/{{ inputs.repo_name }}/builds?page=1&perPage=10" > /tmp/woodpecker_builds.json

        python3 -c "
        import json
        try:
            with open('/tmp/woodpecker_builds.json') as f:
                builds = json.load(f)
            failures = 0
            for b in builds:
                status = b.get('status', '')
                if status in ['failure', 'error', 'killed']:
                    failures += 1
                elif status == 'success':
                    break
            is_breach = 1 if failures >= {{ inputs.failure_threshold }} else 0
            print(f'{is_breach}|{failures}')
        except Exception:
            print('0|0')
        " > /tmp/woodpecker_summary.txt

        IS_BREACH=$(cut -d '|' -f 1 /tmp/woodpecker_summary.txt)
        FAILURE_COUNT=$(cut -d '|' -f 2 /tmp/woodpecker_summary.txt)
        
        echo "::set-output name=is_breach::${IS_BREACH:-0}::"
        echo "::set-output name=failure_count::$FAILURE_COUNT::"

  - id: evaluate_ci_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.check_build_history.vars.is_breach | int == 1 }}"
    then:
      - id: notify_devops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#devops-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Woodpecker CI Pipeline Failure Alert",
                "text": "Repository {{ inputs.repo_owner }}/{{ inputs.repo_name }} has failed {{ outputs.check_build_history.vars.failure_count }} consecutive builds (threshold {{ inputs.failure_threshold }}). CI/CD deployment pipelines are blocked.",
                "footer": "Kestra CI/CD Sentinel • Woodpecker"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Woodpecker Sentinel Failure",
            "text": "Failed to communicate with Woodpecker CI server at {{ inputs.woodpecker_server_url }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      repo_owner: replace-with-your-repo-owner
      repo_name: replace-with-your-repo-name

extend:
  metaDescription: "Audits Woodpecker CI build pipelines for recurring test and deployment failures."
  metaTitle: Woodpecker CI Pipeline Consecutive Failure Sentinel with Kestra
  ee: false
  verified: false
  demo: false
  title: Woodpecker CI Pipeline Consecutive Failure Sentinel
  shortDescription: Audits Woodpecker CI build pipelines for recurring test and deployment failures.
  description: |
    ## How it works
    This workflow connects to the Woodpecker CI REST API (`/api/repos/{owner}/{name}/builds`) to audit recent pipeline build execution statuses. In modern continuous integration pipelines, consecutive build failures on primary branches indicate broken merge commits, test environment degradation, or docker registry pull authentication issues. This sentinel queries the build history, tallies consecutive non-success executions (`failure`, `error`, `killed`), and dispatches an incident notification to development teams when failures meet or exceed the alert threshold.

    ## What you get
    - Real-time continuous integration pipeline health monitoring.
    - Early detection of broken master/main branches across git repositories.
    - Automated Slack incident notifications with consecutive failure counts.

    ## Who it's for
    - DevOps and Platform Engineers operating self-hosted Woodpecker CI instances.
    - Software Engineering Leads maintaining continuous delivery quality gates.
    - Release Managers ensuring smooth deployment cadence.

    ## Why orchestrate this with Kestra
    - **Centralized DevOps Telemetry**: Integrates CI/CD monitoring into standard enterprise dashboards.
    - **Automated Workflow Orchestration**: Can trigger rollback flows or re-run failed stages automatically.
    - **Encrypted Credential Security**: Secures Woodpecker personal access tokens inside Kestra secrets.

    ## Prerequisites
    - Woodpecker CI server accessible over HTTPS.
    - Personal access token configured in `WOODPECKER_API_TOKEN` secret.
    - Slack incoming webhook configured in `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Add `WOODPECKER_API_TOKEN` and `SLACK_WEBHOOK` secrets.
    3. Specify `woodpecker_server_url`, `repo_owner`, and `repo_name`.
    4. Enable the schedule trigger to activate automatic CI pipeline surveillance.

    ## How to extend
    - Trigger an automatic pipeline restart via `POST /api/repos/{owner}/{name}/builds/{number}`.
    - Extract failed pipeline step names from `/api/repos/{owner}/{name}/builds/{number}`.
    - Route notifications to specific development squad Slack channels based on repository tags.

    ## Links
    - [Woodpecker CI API Documentation](https://woodpecker-ci.org/docs/api)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Infrastructure Automation
    - Day 2 Operations
