id: tdengine-iot-future-timestamp-drift-and-table-quota-gate
namespace: company.iot

description: |
  Audits TDengine time series databases to detect IoT sensor clock drift and future timestamp
  anomalies, enforce child table inventory quotas across super tables, and dispatch actionable
  operational alerts to data platform teams via Slack to prevent vnode buffer invalidation.

inputs:
  - id: tdengine_url
    type: STRING
    displayName: TDengine REST Endpoint
    description: Host URL of the TDengine taosAdapter REST API endpoint.
    defaults: "http://localhost:6041"

  - id: database
    type: STRING
    displayName: Target Database
    description: Name of the TDengine database containing IoT telemetry tables.
    defaults: "power_grid"

  - id: super_table
    type: STRING
    displayName: Target Super Table (STable)
    description: Name of the super table aggregating sensor child tables.
    defaults: "meters"

  - id: max_future_timestamp_skew_seconds
    type: INT
    displayName: Maximum Allowable Future Skew (Seconds)
    description: Tolerance window in seconds to accommodate minor network latency and clock jitter.
    defaults: 60

  - id: max_future_records_threshold
    type: INT
    displayName: Future Records Threshold
    description: Maximum allowable future timestamp records before flagging edge device NTP desynchronization.
    defaults: 10

  - id: max_child_tables_quota
    type: INT
    displayName: Maximum Child Tables Quota
    description: Upper limit on registered child tables in the database to prevent metadata sprawl.
    defaults: 5000

  - id: dry_run
    type: BOOL
    displayName: Dry Run Mode
    description: When true, audits telemetry compliance and dispatches Slack notifications without applying remediation actions.
    defaults: true

tasks:
  - id: query_future_timestamps
    type: io.kestra.plugin.core.http.Request
    description: Queries TDengine taosAdapter REST API to count sensor readings written with timestamps ahead of server time.
    uri: "{{ inputs.tdengine_url }}/rest/sql"
    method: POST
    headers:
      Authorization: "Basic {{ secret('TDENGINE_AUTH') }}"
      Content-Type: text/plain
    body: "SELECT count(*) FROM {{ inputs.database }}.{{ inputs.super_table }} WHERE ts > NOW + {{ inputs.max_future_timestamp_skew_seconds }}s"
    timeout: PT30S

  - id: query_table_inventory
    type: io.kestra.plugin.core.http.Request
    description: Queries TDengine information_schema to retrieve the total count of registered child tables.
    uri: "{{ inputs.tdengine_url }}/rest/sql"
    method: POST
    headers:
      Authorization: "Basic {{ secret('TDENGINE_AUTH') }}"
      Content-Type: text/plain
    body: "SELECT count(*) FROM information_schema.ins_tables WHERE db_name = '{{ inputs.database }}'"
    timeout: PT30S

  - id: evaluate_ingestion_quality
    type: io.kestra.plugin.core.output.OutputValues
    description: Evaluates future timestamp anomalies and child table inventory against operational thresholds.
    values:
      future_records: >-
        {{ ({'res': outputs.query_future_timestamps.body} | jq('.res.data[0][0] // 0')) | first | number }}
      child_tables: >-
        {{ ({'res': outputs.query_table_inventory.body} | jq('.res.data[0][0] // 0')) | first | number }}
      status: >-
        {{
          ((({'res': outputs.query_future_timestamps.body} | jq('.res.data[0][0] // 0')) | first | number) > inputs.max_future_records_threshold and
           ((({'res': outputs.query_table_inventory.body} | jq('.res.data[0][0] // 0')) | first | number) > inputs.max_child_tables_quota)) ? 'CRITICAL_MULTIPLE_FAILURES' :
          (((({'res': outputs.query_future_timestamps.body} | jq('.res.data[0][0] // 0')) | first | number) > inputs.max_future_records_threshold)) ? 'FUTURE_TIMESTAMP_DRIFT' :
          (((({'res': outputs.query_table_inventory.body} | jq('.res.data[0][0] // 0')) | first | number) > inputs.max_child_tables_quota)) ? 'TABLE_QUOTA_BREACH' :
          'COMPLIANT'
        }}

  - id: route_governance_action
    type: io.kestra.plugin.core.flow.Switch
    description: Directs notification and remediation flows based on evaluated TDengine ingestion quality state.
    value: "{{ outputs.evaluate_ingestion_quality.values.status }}"
    cases:
      "COMPLIANT":
        - id: log_compliant_ingestion
          type: io.kestra.plugin.core.log.Log
          message: "TDengine database {{ inputs.database }} is compliant: {{ outputs.evaluate_ingestion_quality.values.future_records }} future timestamp record(s), {{ outputs.evaluate_ingestion_quality.values.child_tables }}/{{ inputs.max_child_tables_quota }} child tables registered."

      "FUTURE_TIMESTAMP_DRIFT":
        - id: alert_future_timestamps
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': 'FUTURE_TIMESTAMP_DRIFT: TDengine super table `' ~ inputs.database ~ '.' ~ inputs.super_table ~ '` contains ' ~ outputs.evaluate_ingestion_quality.values.future_records ~ ' records with timestamps skewed > ' ~ inputs.max_future_timestamp_skew_seconds ~ 's into the future (threshold ' ~ inputs.max_future_records_threshold ~ '). Edge devices or sensor gateways likely have desynchronized NTP clocks.'} | toJson }}

      "TABLE_QUOTA_BREACH":
        - id: alert_table_quota
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': 'TABLE_QUOTA_BREACH: TDengine database `' ~ inputs.database ~ '` has ' ~ outputs.evaluate_ingestion_quality.values.child_tables ~ ' child tables, exceeding quota limit of ' ~ inputs.max_child_tables_quota ~ '. Review dynamic sensor table provisioning to prevent vnode memory bloat.'} | toJson }}

      "CRITICAL_MULTIPLE_FAILURES":
        - id: alert_multiple_failures
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': 'CRITICAL_MULTIPLE_FAILURES: TDengine database `' ~ inputs.database ~ '` has breached both future timestamp limits (' ~ outputs.evaluate_ingestion_quality.values.future_records ~ ' future records) and child table quotas (' ~ outputs.evaluate_ingestion_quality.values.child_tables ~ ' tables). Urgent IoT pipeline review required.'} | toJson }}

  - id: log_governance_audit
    type: io.kestra.plugin.core.log.Log
    description: Persists immutable audit log with evaluated time series metrics and operational compliance status.
    message: "TDengine ingestion quality audit completed for {{ inputs.database }}.{{ inputs.super_table }}: status {{ outputs.evaluate_ingestion_quality.values.status }}, future records {{ outputs.evaluate_ingestion_quality.values.future_records }}, child tables {{ outputs.evaluate_ingestion_quality.values.child_tables }}."

errors:
  - id: alert_tdengine_unreachable
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatches urgent Slack alert if TDengine REST API (taosAdapter) is unreachable or query execution fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'TDengine REST probe failed for database `' ~ inputs.database ~ '` (execution ' ~ execution.id ~ ') on `' ~ inputs.tdengine_url ~ '`. Check taosAdapter container status and TDENGINE_AUTH secret.'} | toJson }}

triggers:
  - id: hourly_ingestion_quality_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Runs scheduled TDengine IoT telemetry quality audit hourly. Shipped disabled by default.
    cron: "0 * * * *"
    disabled: true
    inputs:
      tdengine_url: "http://localhost:6041"
      database: "power_grid"
      super_table: "meters"
      max_future_timestamp_skew_seconds: 60
      max_future_records_threshold: 10
      max_child_tables_quota: 5000
      dry_run: true

extend:
  title: TDengine IoT Telemetry Future Timestamp Drift & Table Quota Gate
  metaTitle: TDengine IoT Timestamp Drift & Table Quota Gate | Kestra
  shortDescription: Audit TDengine time series databases for IoT future timestamp clock skew, child table sprawl, and alert via Slack.
  metaDescription: Audit TDengine time series databases for IoT future timestamp clock skew, enforce child table quotas, alert via Slack, and prevent vnode ingestion stalls.
  description: |
    Continuously audits TDengine high-performance time series database deployments to detect IoT sensor
    clock drift, isolate future timestamp anomalies that distort continuous aggregation windows, enforce
    child table inventory quotas, and dispatch structured operational alerts via Slack.

    This blueprint was created by [Mohit Jeswani](https://github.com/mohitjeswani01).

    ## How it works

    1. `hourly_ingestion_quality_audit` (`io.kestra.plugin.core.trigger.Schedule`) initiates the audit
       hourly. It is shipped disabled by default so operators can verify database credentials and table
       names in dry-run mode before enabling automated execution.
    2. `query_future_timestamps` (`io.kestra.plugin.core.http.Request`) invokes the TDengine taosAdapter
       REST API endpoint `POST /rest/sql` with authenticated credentials to query for sensor readings
       written with timestamps skewed beyond `max_future_timestamp_skew_seconds` into the future.
    3. `query_table_inventory` (`io.kestra.plugin.core.http.Request`) queries the `information_schema.ins_tables`
       system view to count active child tables provisioned under the target database.
    4. `evaluate_ingestion_quality` (`io.kestra.plugin.core.output.OutputValues`) extracts metric tallies
       from both query results and evaluates operational status:
       - **COMPLIANT:** Future timestamp records remain within tolerance and child table count is below quota.
       - **FUTURE_TIMESTAMP_DRIFT:** Records with future timestamps exceed `max_future_records_threshold`,
         indicating sensor edge gateway NTP clock desynchronization.
       - **TABLE_QUOTA_BREACH:** Child tables exceed `max_child_tables_quota`, signaling runaway dynamic
         sensor provisioning that risks vnode memory exhaustion.
       - **CRITICAL_MULTIPLE_FAILURES:** Both timestamp drift and table quota thresholds are simultaneously breached.
    5. `route_governance_action` (`io.kestra.plugin.core.flow.Switch`) directs execution:
       - **COMPLIANT:** Logs nominal telemetry to execution history via `io.kestra.plugin.core.log.Log`.
       - **FUTURE_TIMESTAMP_DRIFT:** Dispatches a detailed alert to Slack identifying the super table and
         future record count to trigger edge NTP remediation.
       - **TABLE_QUOTA_BREACH:** Sends a warning to Slack requesting table lifecycle and retention review.
       - **CRITICAL_MULTIPLE_FAILURES:** Emits a high-severity incident notification to Slack.
    6. `log_governance_audit` logs an immutable audit entry recording database name, super table,
       future timestamp count, child table inventory, and final compliance state.
    7. Global `errors` block dispatches an out-of-band notification to Slack if taosAdapter is unreachable
       or returns a SQL syntax error code.

    ## What you get

    - Early detection of edge sensor clock skew before out-of-order future timestamps distort downstream
      continuous aggregation queries (`INTERVAL`) and degrade vnode write performance.
    - Continuous inventory monitoring across dynamic child tables to prevent uncontrolled metadata sprawl
      in large IoT and smart metering deployments.
    - Automated Slack alerting directing IoT platform engineers straight to root-cause data anomalies.
    - Safe non-destructive operational telemetry: defaults to read-only queries with zero mutations.

    ## Who it's for

    - IoT Platform Engineers and Industrial Data Architects managing large-scale sensor telemetry in TDengine.
    - SRE and Database Administrators responsible for TDengine cluster stability and vnode memory headroom.
    - Data Quality teams validating time series accuracy before running analytical aggregations and ML models.

    ## Why orchestrate this with Kestra

    TDengine excels at massive time series ingestion and compression, but it does not natively alert teams
    when edge gateways write corrupted future timestamps or when child tables proliferate beyond planned
    capacity. Handcrafted cron scripts lack declarative visibility, secret masking, retry policies, and
    centralized execution history. Kestra provides clean YAML-based orchestration, secure secret injection,
    and reliable Slack alerting.

    ## Prerequisites

    - A running TDengine instance with the `taosAdapter` REST service enabled (listening on port 6041).
      TDengine provides an official open-source Docker image (`tdengine/tdengine:latest`) requiring no paid license.
    - A database and super table created in TDengine.
    - Basic authentication credentials (`username:password`) or a Taos token for REST API access.
    - A Slack incoming webhook URL for operational notifications.

    ### Secrets

    - `TDENGINE_AUTH`: Base64-encoded `username:password` string (e.g. `root:taosdata`) for Basic HTTP authentication.
      In Kestra OSS, configure as `SECRET_TDENGINE_AUTH`.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL used by alert tasks and the global `errors` block.
      In Kestra OSS, configure as `SECRET_SLACK_WEBHOOK_URL`.

    ## Quick start

    1. Start a local TDengine container:
       ```bash
       docker run -d --name tdengine-test -p 6041:6041 tdengine/tdengine:latest
       ```
    2. Configure `TDENGINE_AUTH` (default `cm9vdDp0YW9zZGF0YQ==` for `root:taosdata`) and `SLACK_WEBHOOK_URL`
       secrets in your Kestra namespace.
    3. Import this blueprint into Kestra and trigger an execution with default inputs in dry-run mode.
    4. Review execution logs to observe future timestamp inspection and table count evaluation.
    5. Test alerting by setting `max_future_records_threshold: 0` to observe `alert_future_timestamps` firing to Slack.
    6. Enable `hourly_ingestion_quality_audit` once operational parameters are aligned.

    ## How to extend

    - Add downstream remediation tasks to trigger `ALTER DATABASE` or table drop scripts for expired child tables.
    - Integrate with IoT device management platforms (e.g. ThingsBoard or AWS IoT Device Management)
      to trigger edge device NTP resets when clock skew is detected.
    - Export evaluated time series ingestion metrics to Prometheus via `io.kestra.plugin.prometheus.PushGateway`.

    ## Links

    - [TDengine Official Website](https://tdengine.com/)
    - [TDengine REST API Documentation](https://docs.tdengine.com/reference/taosadapter/)
    - [TDengine Docker Hub Image](https://hub.docker.com/r/tdengine/tdengine)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Data
  subTags:
    - Realtime & Streaming
    - Testing & Quality
    - Monitoring & Alerting
  ee: false
  demo: false
