id: clickhouse-mutation-and-parts-watchdog
namespace: company.team
description: |
  Audit ClickHouse system health by monitoring active table mutations (system.mutations),
  detecting partition parts explosion (system.parts), calculating merge pressure,
  and dispatching operational diagnostics to Slack before query performance degrades.

triggers:
  - id: scheduled_watchdog
    type: io.kestra.plugin.core.trigger.Schedule
    description: Periodic off-peak cluster health and partition watchdog check. Shipped disabled by default.
    cron: "*/30 * * * *"
    disabled: true

  - id: manual_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated webhook trigger for on-demand cluster audits from CI/CD, incident response drills, or ChatOps.
    key: "{{ secret('WEBHOOK_KEY') }}"

inputs:
  - id: clickhouse_url
    type: STRING
    displayName: ClickHouse JDBC URL
    description: JDBC connection URL for target ClickHouse database instance.
    defaults: "jdbc:clickhouse://clickhouse:8123/default"

  - id: max_mutation_age_minutes
    type: INT
    displayName: Max Mutation Age (Minutes)
    description: Age threshold in minutes for in-progress mutations before raising a stuck mutation alert.
    defaults: 60

  - id: max_active_parts_threshold
    type: INT
    displayName: Max Active Parts Threshold
    description: Maximum active parts per table partition before flagging excessive parts explosion and "too many parts" risk.
    defaults: 150

tasks:
  - id: check_stuck_mutations
    type: io.kestra.plugin.jdbc.clickhouse.Query
    description: Query system.mutations to detect in-progress table mutations exceeding the runtime age threshold.
    url: "{{ inputs.clickhouse_url }}"
    username: "{{ secret('CLICKHOUSE_USERNAME') }}"
    password: "{{ secret('CLICKHOUSE_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      SELECT
        database,
        table,
        mutation_id,
        command,
        create_time,
        parts_to_do,
        is_done,
        latest_fail_reason,
        dateDiff('minute', create_time, now()) AS age_minutes
      FROM system.mutations
      WHERE is_done = 0
        AND dateDiff('minute', create_time, now()) >= {{ inputs.max_mutation_age_minutes }}
      ORDER BY create_time ASC;

  - id: check_partition_parts_explosion
    type: io.kestra.plugin.jdbc.clickhouse.Query
    description: Query system.parts to detect partition-level parts explosion exceeding operational merge limits.
    url: "{{ inputs.clickhouse_url }}"
    username: "{{ secret('CLICKHOUSE_USERNAME') }}"
    password: "{{ secret('CLICKHOUSE_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      SELECT
        database,
        table,
        partition,
        count() AS active_parts_count,
        round(sum(bytes_on_disk) / (1024 * 1024), 2) AS total_size_mb,
        max(modification_time) AS latest_part_time
      FROM system.parts
      WHERE active = 1
        AND database NOT IN ('system', 'information_schema')
      GROUP BY database, table, partition
      HAVING count() >= {{ inputs.max_active_parts_threshold }}
      ORDER BY active_parts_count DESC
      LIMIT 20;

  - id: emit_cluster_health_metrics
    type: io.kestra.plugin.core.output.OutputValues
    description: Export calculated cluster health diagnostics into execution outputs.
    values:
      stuck_mutations_count: "{{ outputs.check_stuck_mutations.size }}"
      exploded_partitions_count: "{{ outputs.check_partition_parts_explosion.size }}"
      cluster_url: "{{ inputs.clickhouse_url }}"
      inspected_at: "{{ now() }}"

  - id: evaluate_cluster_health
    type: io.kestra.plugin.core.flow.If
    description: Check if any stuck mutations or partition parts count breached warning thresholds.
    condition: "{{ outputs.check_stuck_mutations.size > 0 or outputs.check_partition_parts_explosion.size > 0 }}"
    then:
      - id: notify_cluster_alert_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch high-priority Slack diagnostic alert detailing flagged mutations and partition bloat.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: |
          :warning: *ClickHouse Cluster Health Watchdog Alert*
          *Target URL:* `{{ inputs.clickhouse_url }}`
          *Execution:* `{{ execution.id }}`
          *Stuck Mutations:* `{{ outputs.check_stuck_mutations.size }}` (age >= {{ inputs.max_mutation_age_minutes }}m)
          *Partitions with Parts Explosion:* `{{ outputs.check_partition_parts_explosion.size }}` (parts >= {{ inputs.max_active_parts_threshold }})

          {% if outputs.check_stuck_mutations.size > 0 %}*Top Stuck Mutations:*
          {% for m in outputs.check_stuck_mutations.rows %}• `{{ m.database }}.{{ m.table }}` | ID: `{{ m.mutation_id }}` | Age: {{ m.age_minutes }}m | Parts to do: {{ m.parts_to_do }} | Reason: {{ m.latest_fail_reason | default('In progress', true) }}
          {% endfor %}{% endif %}
          {% if outputs.check_partition_parts_explosion.size > 0 %}*Top High-Part Partitions:*
          {% for p in outputs.check_partition_parts_explosion.rows %}• `{{ p.database }}.{{ p.table }}` [Partition: `{{ p.partition }}`] | Active Parts: {{ p.active_parts_count }} | Size: {{ p.total_size_mb }} MB
          {% endfor %}{% endif %}
          *Recommended Action:* Check `system.merges` for disk/CPU saturation or run `OPTIMIZE TABLE ... [PARTITION ...]` during maintenance windows.
    else:
      - id: log_cluster_healthy
        type: io.kestra.plugin.core.log.Log
        description: Log healthy cluster verification status.
        message: "ClickHouse cluster health verified on {{ inputs.clickhouse_url }}: 0 stuck mutations and 0 partitions exceeding active parts threshold ({{ inputs.max_active_parts_threshold }} parts)."

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert on-call data engineers if the health check query or watchdog flow encounters an unhandled failure.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: |
      :rotating_light: *ClickHouse Health Watchdog FAILED*
      Flow `{{ flow.id }}` in namespace `{{ flow.namespace }}` failed during execution `{{ execution.id }}`.
      Please check ClickHouse endpoint availability and credentials.

extend:
  title: ClickHouse Mutation and Partition Parts Watchdog Sentinel
  shortDescription: Monitor ClickHouse system.mutations and system.parts, detect stuck async mutations and partition parts explosion, and alert DBAs via Slack.
  metaTitle: ClickHouse Mutation and Parts Watchdog with Kestra
  metaDescription: Orchestrate ClickHouse cluster health monitoring with Kestra. Detect long-running table mutations and active partition parts bloat before query slowdowns occur.
  description: |
    ClickHouse relies on asynchronous background processes for table mutations (`ALTER ... UPDATE / DELETE`) and continuous part merges. Under heavy ingestion bursts, frequent single-row updates, or hardware resource constraints, two dangerous failure modes often emerge:

    1. **Stuck Table Mutations:** Unfinished mutations in `system.mutations` consume CPU and disk I/O, hold table metadata locks, and can stall subsequent schema operations indefinitely if a part fails to rewrite.
    2. **Partition Parts Explosion:** Ingestion without batching or stalled background merges produces hundreds of active parts per partition in `system.parts`, eventually triggering ClickHouse's defensive `"Too many parts in all data parts in table"` error and rejecting further writes.

    This blueprint provides an automated, non-invasive health watchdog for ClickHouse clusters. It audits `system.mutations` for long-running mutations, analyzes `system.parts` for partition bloat exceeding operational thresholds, exports diagnostic metrics, and alerts database administrators and platform engineers on Slack with contextual remediation steps.

    ## Use Cases

    - **Proactive Cluster Observability:** Detect stalled asynchronous updates before they cascade into cluster-wide write rejection errors.
    - **Merge Bottleneck Triage:** Identify tables experiencing merge lag or unoptimized partitions across high-frequency time-series datasets.
    - **Incident Prevention:** Alert SRE and data engineering teams before `TOO_MANY_PARTS` exceptions interrupt real-time streaming ingestion pipelines.
    - **Audit Compliance:** Maintain a traceable execution log of database mutation lifetimes and partition density over time.

    ## How It Works

    1. `check_stuck_mutations` (`io.kestra.plugin.jdbc.clickhouse.Query`) queries `system.mutations` with `fetchType: FETCH` to find incomplete mutations (`is_done = 0`) that have been executing longer than `inputs.max_mutation_age_minutes`.
    2. `check_partition_parts_explosion` (`io.kestra.plugin.jdbc.clickhouse.Query`) scans `system.parts` for active data parts (`active = 1`) grouped by database, table, and partition, identifying partitions that exceed `inputs.max_active_parts_threshold`.
    3. `emit_cluster_health_metrics` (`io.kestra.plugin.core.output.OutputValues`) exports structured count metrics and cluster metadata into execution outputs.
    4. `evaluate_cluster_health` (`io.kestra.plugin.core.flow.If`) evaluates whether any stuck mutations or overloaded partitions were detected:
       - If anomalies exist, `notify_cluster_alert_slack` dispatches a Slack notification with the offending table names, mutation IDs, part counts, failure reasons, and suggested operational commands.
       - If all metrics are within safe boundaries, `log_cluster_healthy` records a success log.
    5. `alert_on_failure` in the `errors` block alerts on-call responders if network connectivity or authentication to ClickHouse fails.

    ## Prerequisites

    - A running ClickHouse instance or cluster (Cloud or self-hosted) accessible via HTTP interface (port 8123 by default).
    - Database user credentials with `SELECT` permissions on `system.mutations` and `system.parts`.
    - A Slack Incoming Webhook URL configured for channel alerting.

    ### Secrets

    Configure the following secrets in your Kestra namespace:

    - `CLICKHOUSE_USERNAME`: ClickHouse database user (e.g. `default` or `sentinel_user`).
    - `CLICKHOUSE_PASSWORD`: Password for the ClickHouse user.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for diagnostic alerts.
    - `WEBHOOK_KEY`: Authentication secret for manual on-demand execution via webhook.

    ### Configuration

    Adjust the flow inputs to match your cluster's operational profile:

    - `clickhouse_url`: ClickHouse JDBC connection URL (default: `jdbc:clickhouse://clickhouse:8123/default`).
    - `max_mutation_age_minutes`: Maximum allowed execution age in minutes before a mutation is flagged as stuck (default: `60`).
    - `max_active_parts_threshold`: Maximum active parts per partition before parts explosion is flagged (default: `150`).

    ## Step-by-Step

    ```
    ┌──────────────────────────────┐
    │  Schedule / Webhook Trigger  │
    └──────────────┬───────────────┘
                   │
                   ▼
    ┌──────────────────────────────┐
    │ Check system.mutations       │
    └──────────────┬───────────────┘
                   │
                   ▼
    ┌──────────────────────────────┐
    │ Check system.parts (Active)  │
    └──────────────┬───────────────┘
                   │
                   ▼
    ┌──────────────────────────────┐
    │ Emit Health Metrics          │
    └──────────────┬───────────────┘
                   │
         [Any Anomaly Detected?]
               /                     YES         NO
             /                         ▼               ▼
    ┌───────────────┐ ┌───────────────┐
    │ Dispatch      │ │ Log Verified  │
    │ Slack Alert   │ │ Clean Health  │
    └───────────────┘ └───────────────┘
    ```

    ## Expected Output

    - **Clean Cluster Run:** An execution summary with `stuck_mutations_count: 0`, `exploded_partitions_count: 0`, and a confirmation log.
    - **Alert Run:** A formatted Slack notification identifying offending databases, tables, partition identifiers, active part counts, and mutation error details.

    ## Customization

    - **Automated Partition Optimization:** Add an `io.kestra.plugin.jdbc.clickhouse.Queries` task to run targeted `OPTIMIZE TABLE ... PARTITION ... FINAL` commands during off-peak hours for non-critical tables.
    - **System Merges Correlation:** Extend the inspection to join with `system.merges` to surface current background merge speed, disk read/write rates, and remaining merge durations.
    - **Multi-Node Cluster Support:** Query `clusterAllReplicas(...)` table functions to inspect mutations and parts across all distributed nodes simultaneously.

    ## Links

    - [ClickHouse Documentation on Mutations](https://clickhouse.com/docs/en/sql-reference/statements/alter/update)
    - [ClickHouse System Tables: system.parts](https://clickhouse.com/docs/en/operations/system-tables/parts)
    - [Kestra ClickHouse Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-clickhouse)
    - [This blueprint was created by Vedant817](https://github.com/Vedant817).
  tags:
    - Data
    - Infrastructure
  subTags:
    - Database Monitoring
    - Maintenance & Optimization
  ee: false
  demo: false
