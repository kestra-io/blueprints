id: servicenow-webhook-powershell-healthcheck
namespace: company.team
description: |
  A webhook receives a VM healthcheck request, Python validates and enriches
  the payload, PowerShell gathers disk metrics, and the results are filed as
  a ServiceNow incident. Failures open a critical incident and ping Slack.

inputs:
  - id: defaultWebhookPayload
    type: JSON
    defaults: |
      { "requestId": "c0271c3c-a256-4e6a-8a63-2a60a2c1b1de", "storeId": "VA-014", "vmName": "retail-edge-va014", "checks": [ "disk" ], "priority": "normal", "requestedBy": "maya.smith@acme-retail.com" }

triggers:
  - id: webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: POST a healthcheck request payload here to start a run.
    key: "{{ secret('HEALTHCHECK_WEBHOOK_KEY') }}"

tasks:
  - id: validate_payload
    type: io.kestra.plugin.scripts.python.Script
    description: Parse, validate, and enrich the incoming webhook JSON payload.
    dependencies:
      - kestra
    script: |
      from kestra import Kestra
      import json
      from datetime import datetime, timezone

      ALLOWED_CHECKS = {"disk"}
      PRIORITY_TO_SEV = {"low": 4, "normal": 3, "high": 2}

      logger = Kestra.logger()

      def fail(msg):
          logger.error(msg)
          raise RuntimeError(msg)

      def main():
          raw = '''{{ trigger.body ?? '' }}'''
          if not raw:
              logger.warning("Missing trigger payload, using the default payload")
              raw = '''{{ inputs.defaultWebhookPayload }}'''
          try:
              payload = json.loads(raw)
          except Exception:
              fail("Invalid payload JSON")

          for f in ["requestId", "storeId", "vmName", "checks", "priority", "requestedBy"]:
              if f not in payload:
                  fail(f"missing_field:{f}")

          payload["storeId"] = str(payload["storeId"]).strip().upper()

          if not isinstance(payload["checks"], list) or not payload["checks"]:
              fail("checks_must_be_nonempty_list")

          bad = [c for c in payload["checks"] if c not in ALLOWED_CHECKS]
          if bad:
              fail(f"unsupported_checks:{bad}")

          pr = str(payload["priority"]).lower()
          if pr not in PRIORITY_TO_SEV:
              fail("invalid_priority")
          payload["sev"] = PRIORITY_TO_SEV[pr]

          if "@" not in str(payload["requestedBy"]):
              fail("invalid_requestedBy_email")

          payload["receivedAt"] = datetime.now(timezone.utc).isoformat()

          logger.info(f"Validated payload: {payload}")
          Kestra.outputs(payload)

      main()

  - id: run_powershell_commands
    type: io.kestra.plugin.scripts.powershell.Script
    description: Gather cross-platform disk capacity metrics and write a JSON report.
    outputFiles:
      - healthcheck_report.json
    script: |
      param(
        [Parameter(Mandatory=$false)]
        [string]$PayloadJson = '{{ outputs.validate_payload | json }}'
      )

      try {
        $payload = $PayloadJson | ConvertFrom-Json
      } catch {
        $err = [pscustomobject]@{
          ok = $false
          error = "invalid_json"
          detail = $_.Exception.Message
        }
        $err | ConvertTo-Json -Compress
        exit 0
      }

      $doDisk = $true
      if ($payload.PSObject.Properties.Name -contains 'checks') {
        $doDisk = ($payload.checks -contains 'disk')
      }

      $diskMetrics = @()
      if ($doDisk) {
        $drives = [System.IO.DriveInfo]::GetDrives() | Where-Object { $_.IsReady -and ($_.DriveType.ToString() -eq 'Fixed') }
        foreach ($d in $drives) {
          $total = [double]$d.TotalSize
          $free  = [double]$d.AvailableFreeSpace
          $sizeGB = if ($total -gt 0) { [math]::Round($total / 1GB, 2) } else { 0 }
          $freeGB = if ($total -gt 0) { [math]::Round($free  / 1GB, 2) } else { 0 }
          $pctFree = if ($total -gt 0) { [math]::Round(100 * $free / $total, 2) } else { 0 }

          $diskMetrics += [pscustomobject]@{
            drive   = ($d.Name.TrimEnd('\','/'))
            sizeGB  = $sizeGB
            freeGB  = $freeGB
            pctFree = $pctFree
          }
        }
      }

      $advice = if (($diskMetrics | Where-Object { $_.pctFree -lt 15 }).Count -gt 0) {
        "Low free space detected on one or more volumes. Consider cleanup."
      } else {
        "Disk capacity within acceptable thresholds."
      }

      $result = [pscustomobject]@{
        ok         = $true
        kind       = "healthcheck"
        checks     = if ($payload.checks) { $payload.checks } else { @("disk") }
        metrics    = @{ disk = $diskMetrics }
        advice     = $advice
        measuredAt = (Get-Date).ToUniversalTime().ToString("o")
      }
      $jsonOutput = $result | ConvertTo-Json -Depth 6 -Compress

      $jsonOutput | Out-File -FilePath "healthcheck_report.json" -Force

  - id: create_servicenow_incident
    type: io.kestra.plugin.servicenow.Post
    description: File the healthcheck results as a ServiceNow incident.
    domain: "{{ vars.serviceNowInstance }}"
    username: "{{ secret('SERVICENOW_USERNAME') }}"
    password: "{{ secret('SERVICENOW_PASSWORD') }}"
    table: incident
    data:
      short_description: "VM Healthcheck Report for {{ outputs.validate_payload.vars.vmName }}"
      description: |
        Healthcheck performed at {{ outputs.validate_payload.vars.receivedAt }}.
        VM Name: {{ outputs.validate_payload.vars.vmName }}
        Store ID: {{ outputs.validate_payload.vars.storeId }}
        Request ID: {{ outputs.validate_payload.vars.requestId }}

        Advice: {{ outputs.run_powershell_commands.vars }}
      caller_id: "{{ outputs.validate_payload.vars.requestedBy }}"
      priority: "{{ outputs.validate_payload.vars.sev }}"
      category: "Hardware"
      subcategory: "Server"
      contact_type: "Automated Tool"

errors:
  - id: create_servicenow_incident_on_error
    type: io.kestra.plugin.servicenow.Post
    description: Open a critical ServiceNow incident when the flow itself fails.
    domain: "{{ vars.serviceNowInstance }}"
    username: "{{ secret('SERVICENOW_USERNAME') }}"
    password: "{{ secret('SERVICENOW_PASSWORD') }}"
    table: incident
    data:
      short_description: "Kestra Flow Error: {{ flow.id }} (Execution: {{ execution.id }})"
      description: |
        Kestra Flow `{{ flow.namespace }}.{{ flow.id }}` failed.
        Execution ID: `{{ execution.id }}`
        Status: `{{ execution.state }}`
        Error Message: `{{ errorLogs() }}`
        View execution: {{ kestra.url ?? 'http://localhost:8080' }}/ui/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}
      caller_id: "kestra-automation@example.com"
      priority: "1"
      category: "Software"
      subcategory: "Application Error"
      contact_type: "Automated Tool"

  - id: send_slack_notification_on_error
    type: io.kestra.plugin.slack.SlackExecution
    description: Ping the on-call channel when the flow fails.
    url: "{{ secret('SLACK_WEBHOOK') }}"
    messageText: |
      Kestra Flow Error
      Flow: `{{ flow.namespace }}.{{ flow.id }}`
      Execution ID: `{{ execution.id }}`
      Status: `{{ execution.state }}`
      Error Message: `{{ errorLogs() }}`
      View execution: {{ kestra.url ?? 'http://localhost:8080' }}/ui/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}
    allowFailure: true

variables:
  serviceNowInstance: your-instance

extend:
  shortDescription: Validate a webhook payload with Python, run a PowerShell disk healthcheck, and file the results as a ServiceNow incident.
  title: Webhook to PowerShell Healthcheck to ServiceNow Incident
  metaTitle: Webhook-Triggered PowerShell Healthcheck with ServiceNow Ticketing
  metaDescription: Kestra flow that validates a webhook payload in Python, runs a PowerShell VM healthcheck, creates a ServiceNow incident with the results, and escalates failures.
  description: |
    Give edge and retail operations teams a self-service healthcheck endpoint that always ends in a ticket. This Kestra blueprint exposes a secured webhook: callers POST a small JSON request describing a VM and the checks they want, Python validates and enriches the payload, PowerShell collects disk capacity metrics, and the results land as a properly categorized ServiceNow incident assigned back to the requester. If anything in the pipeline breaks, the `errors` branch opens a priority 1 incident and notifies Slack, so a failed healthcheck can never disappear silently.

    ## How it works
    1. The `webhook` trigger (`io.kestra.plugin.core.trigger.Webhook`) accepts a POST secured by `HEALTHCHECK_WEBHOOK_KEY`. Manual executions fall back to `inputs.defaultWebhookPayload` so you can test without a caller.
    2. The `validate_payload` task (`io.kestra.plugin.scripts.python.Script`) enforces required fields, whitelists the requested checks, maps `priority` to a ServiceNow severity via `PRIORITY_TO_SEV`, sanity-checks the requester email, stamps `receivedAt`, and publishes everything with `Kestra.outputs()`.
    3. The `run_powershell_commands` task (`io.kestra.plugin.scripts.powershell.Script`) reads the validated payload, enumerates fixed drives with `System.IO.DriveInfo` (works on Windows and Linux), computes size, free space, and percent free per volume, derives an advice string when any volume drops under 15 percent free, and writes `healthcheck_report.json` as an output file.
    4. The `create_servicenow_incident` task (`io.kestra.plugin.servicenow.Post`) files an incident on the `incident` table with the VM name, store id, request id, advice, the requester as `caller_id`, and the mapped priority.
    5. Two `errors` tasks handle failure: `create_servicenow_incident_on_error` (`io.kestra.plugin.servicenow.Post`) opens a priority 1 incident with `errorLogs()` and a deep link to the execution, and `send_slack_notification_on_error` (`io.kestra.plugin.slack.SlackExecution`) pings the on-call channel with `allowFailure: true` so a Slack outage never masks the original error.

    ## What you get
    - A secured, self-service HTTP endpoint for on-demand VM healthchecks.
    - Strict payload validation so garbage requests fail fast with a clear reason.
    - A machine-readable `healthcheck_report.json` artifact stored with the execution.
    - Every healthcheck and every failure recorded as a ServiceNow incident with correct priority mapping.

    ## Who it's for
    - IT operations teams running fleets of edge or branch VMs behind ServiceNow.
    - Windows-heavy shops that want PowerShell diagnostics orchestrated, not scattered in scheduled tasks.
    - Service desk owners who need requester-attributed tickets from automated tooling.

    ## Why orchestrate this with Kestra
    Wiring a webhook receiver, a script host, and the ServiceNow API together normally means custom middleware with its own auth, logging, and failure handling. Kestra collapses that into one declarative flow: the webhook trigger handles ingress with a secret key, Python and PowerShell run as first-class script tasks with dependency management and output files, and the `errors` branch gives you guaranteed escalation. Every request is an execution with full logs, so when a store manager asks what happened to their healthcheck, the answer is one click away.

    ## Prerequisites
    - A ServiceNow instance with API access to create records on the `incident` table.
    - A Kestra worker with Python and PowerShell script execution available.
    - Set the `serviceNowInstance` variable to your instance name.
    - A Slack incoming webhook for error notifications.

    ### Secrets
    - `HEALTHCHECK_WEBHOOK_KEY`: shared secret guarding the `Webhook` trigger.
    - `SERVICENOW_USERNAME`, `SERVICENOW_PASSWORD`: credentials used by both `Post` tasks.
    - `SLACK_WEBHOOK`: Slack incoming webhook URL for the on-error notification.

    ## Quick start
    1. Add the four secrets to your Kestra namespace and set `serviceNowInstance`.
    2. Deploy the flow and run it manually; the default payload exercises the whole pipeline.
    3. Check ServiceNow for the created incident and the execution for `healthcheck_report.json`.
    4. POST a real payload to the webhook URL with your key to go live.
    5. Point your monitoring tool, portal, or chatbot at the webhook.

    ## How to extend
    - Add more checks (memory, services, certificates) to `ALLOWED_CHECKS` and the PowerShell script.
    - Attach `healthcheck_report.json` to the incident or store it in S3 for trend analysis.
    - Auto-close the incident when all metrics are healthy and only leave low-disk tickets open.
    - Fan out to many VMs with `io.kestra.plugin.core.flow.ForEach` over a CMDB query.
    - Swap ServiceNow for Jira with `io.kestra.plugin.jira.issues.CreateIssue`.

    ## Links
    - ServiceNow plugin docs: https://kestra.io/plugins/plugin-servicenow
    - PowerShell script task: https://kestra.io/plugins/plugin-script-powershell
    - Webhook trigger: https://kestra.io/plugins/core/triggers/io.kestra.plugin.core.trigger.webhook
  tags:
    - Business
  subTags:
    - ServiceNow & ITSM
    - Monitoring & Alerting
    - Customer Success
  ee: false
  demo: false
