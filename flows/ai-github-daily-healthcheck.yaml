id: ai-github-daily-healthcheck
namespace: company.team
description: |
  Pull issues, pull requests, and workflow runs from a GitHub repo in
  parallel, compute KPIs in Python, summarize with an AI agent, and post
  the daily brief to Slack, with retries, an SLA, and failure alerting.

inputs:
  - id: github_repo
    type: STRING
    defaults: kestra-io/kestra
    required: true
  - id: window_hours
    type: INT
    defaults: 24
    required: true

tasks:
  - id: run_parallel
    type: io.kestra.plugin.core.flow.Parallel
    description: Call the three GitHub API endpoints concurrently.
    allowFailure: true
    tasks:
      - id: github_issues
        type: io.kestra.plugin.core.http.Request
        uri: "https://api.github.com/repos/{{ inputs.github_repo }}/issues?per_page=20&state=all&sort=updated&direction=desc"

      - id: github_prs
        type: io.kestra.plugin.core.http.Request
        uri: "https://api.github.com/repos/{{ inputs.github_repo }}/pulls?per_page=20&state=all&sort=updated&direction=desc"
        method: GET

      - id: github_actions
        type: io.kestra.plugin.core.http.Request
        uri: "https://api.github.com/repos/{{ inputs.github_repo }}/actions/runs?per_page=20"
        method: GET

  - id: concatenate_data
    type: io.kestra.plugin.core.storage.Write
    description: Merge the three API responses into one JSON file in internal storage.
    content: |
      {
        "issues": {{ outputs.github_issues.body ?? '[]' }},
        "prs": {{ outputs.github_prs.body ?? '[]' }},
        "actions": {{ outputs.github_actions.body ?? '[]' }}
      }
    extension: ".json"

  - id: filter_prep_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Filter activity to the time window and compute repo KPIs.
    dependencies:
      - kestra
    script: |
      import json
      import datetime as dt
      from kestra import Kestra

      def within_window(iso, since):
        try:
            t = dt.datetime.fromisoformat(iso.replace("Z", "+00:00"))
            return t >= since
        except Exception:
            return False

      hours = int("{{ inputs.window_hours }}")
      since = dt.datetime.now(dt.timezone.utc) - dt.timedelta(hours=hours)
      issues, prs, actions = [], [], []
      logger = Kestra.logger()
      with open("{{ outputs.concatenate_data.uri }}") as f:
        payload = json.load(f)
        issues = payload.get('issues', [])
        prs = payload.get('prs', [])
        actions = payload.get('actions', [])
        logger.info(f"issues: {len(issues)}, prs: {len(prs)}, actions: {len(actions)}")

      select_fields = ('title', 'body', 'created_at', 'user', 'state', 'html_url', 'reactions', 'pull_request', 'merged_at', 'updated_at')
      issues = [{k: (v if k != 'user' else v['login']) for k, v in x.items() if k in select_fields} for x in issues if within_window(x.get('created_at', ''), since)]
      prs = [{k: (v if k != 'user' else v['login']) for k, v in x.items() if k in select_fields} for x in prs if within_window(x.get('created_at', ''), since)]
      actions = [{
        "run_number": item.get("run_number"),
        "name": item.get("name") or item.get("display_title"),
        "event": item.get("event"),
        "status": item.get("status"),
        "conclusion": item.get("conclusion"),
        "started_at": item.get("run_started_at") or item.get("created_at"),
        "actor": (item.get("actor") or {}).get("login"),
        "url": item.get("html_url"),
        "pr_numbers": [pr.get("number") for pr in item.get("pull_requests", []) if isinstance(pr, dict)],
        "commit_message": (item.get("head_commit", {}) or {}).get("message", "").splitlines()[0] if item.get("head_commit") else None,
      } for item in actions.get('workflow_runs', []) if within_window(item.get('updated_at', ''), since)]

      new_issues = [i for i in issues if 'pull_request' not in i and i.get('state') == 'open']
      closed_issues = [i for i in issues if 'pull_request' not in i and i.get('state') == 'closed']
      opened_prs = [p for p in prs if p.get('state') in ('open', 'closed')]
      merged_prs = [p for p in prs if p.get('merged_at')]
      failed_runs = [r for r in actions if r.get('conclusion') in ('failure', 'cancelled', 'timed_out')]
      Kestra.outputs(
        {
          "new_issues": new_issues,
          "closed_issues": closed_issues,
          "opened_prs": opened_prs,
          "merged_prs": merged_prs,
          "failed_runs": failed_runs,
        }
      )

  - id: ai_day_brief
    type: io.kestra.plugin.ai.agent.AIAgent
    description: Turn the KPIs into a short, prioritized daily brief.
    systemMessage: |
      You are a concise assistant.
      Use the provided JSON to write a short, friendly daily summary of GitHub repo activity.
      - Include only the MOST pressing items.
      - Keep it to 15 items.
      - Include GitHub issue or PR ids.
      - Include a concise and short snippet of the underlying data.
      - Format the response in markdown.
      - Include the following heading sections: new issues, closed issues, open prs, merged prs, failed runs.
      - Produce nicely readable output.

      After the summary, propose a quick plan of attack for our dev team under a section heading "Plan of Attack".
    prompt: |
      Repo: {{ inputs.github_repo }}
      Time window: last {{ inputs.window_hours }} hours

      new issues: {{ outputs.filter_prep_metrics.vars['new_issues'] ?? 'None' }}
      ---
      closed issues: {{ outputs.filter_prep_metrics.vars['closed_issues'] ?? 'None' }}
      ---
      opened prs: {{ outputs.filter_prep_metrics.vars['opened_prs'] ?? 'None' }}
      ---
      merged prs: {{ outputs.filter_prep_metrics.vars['merged_prs'] ?? 'None' }}
      ---
      failed runs: {{ outputs.filter_prep_metrics.vars['failed_runs'] ?? 'None' }}

  - id: log_output
    type: io.kestra.plugin.core.log.Log
    description: Keep the brief in the execution logs.
    message: |
      {{ outputs.ai_day_brief.textOutput }}

  - id: post_to_slack
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Deliver the daily brief to the team channel.
    url: "{{ secret('SLACK_WEBHOOK') }}"
    messageText: "{{ outputs.ai_day_brief.textOutput }}"

triggers:
  - id: every_morning
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run the healthcheck each morning before standup.
    cron: "0 8 * * *"

errors:
  - id: slack_fail
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert the channel if the healthcheck itself fails.
    url: "{{ secret('SLACK_WEBHOOK') }}"
    messageText: ":rotating_light: Flow {{ flow.id }} - Error: {{ error.message }}"

sla:
  - id: must_finish_fast
    type: MAX_DURATION
    duration: PT10M
    behavior: CANCEL
    labels:
      sla: miss
      reason: "Exceeded allowed execution time"

outputs:
  - id: brief
    type: STRING
    value: "{{ outputs.ai_day_brief.textOutput }}"

pluginDefaults:
  - type: io.kestra.plugin.ai.agent.AIAgent
    values:
      provider:
        type: io.kestra.plugin.ai.provider.GoogleGemini
        modelName: gemini-2.5-flash
        apiKey: "{{ secret('GEMINI_API_KEY') }}"
      allowFailure: true
      configuration:
        chatConfiguration:
          logRequests: true
      retry:
        type: constant
        interval: PT2S
        maxAttempts: 2

  - type: io.kestra.plugin.core.http.Request
    values:
      headers:
        Accept: "application/json"
      allowFailure: true
      retry:
        type: exponential
        interval: PT1S
        maxInterval: PT10S
        maxAttempts: 3

extend:
  shortDescription: Fetch GitHub issues, PRs, and workflow runs in parallel, compute KPIs in Python, and post an AI-written daily repo brief to Slack.
  title: AI Daily GitHub Repo Healthcheck to Slack
  metaTitle: GitHub Repo Daily Healthcheck with AI Agent in Kestra
  metaDescription: Scheduled pipeline that pulls GitHub issues, PRs, and Actions runs in parallel, filters KPIs in Python, and posts a Gemini-written daily brief to Slack.
  description: |
    Start every morning knowing exactly what happened in your repository. This Kestra blueprint calls three GitHub REST endpoints in parallel, merges the responses in internal storage, filters activity to a configurable time window with Python, and computes KPIs: new issues, closed issues, opened and merged pull requests, and failed workflow runs. An AI agent then turns those raw lists into a short, prioritized markdown brief with a "Plan of Attack" for the team, delivered to Slack before standup. The whole run is protected by retries on flaky HTTP calls, an execution SLA, and a Slack failure alert.

    ## How it works
    1. The `every_morning` trigger (`io.kestra.plugin.core.trigger.Schedule`) runs the flow daily at 08:00.
    2. The `run_parallel` task (`io.kestra.plugin.core.flow.Parallel`) fires three `io.kestra.plugin.core.http.Request` calls at once: recent issues, pull requests, and Actions workflow runs for `inputs.github_repo`. Each request retries exponentially up to 3 attempts and is allowed to fail without killing the run.
    3. The `concatenate_data` task (`io.kestra.plugin.core.storage.Write`) merges the three response bodies into one JSON document in internal storage, defaulting any failed call to an empty array.
    4. The `filter_prep_metrics` task (`io.kestra.plugin.scripts.python.Script`) loads that file, keeps only items created or updated within `inputs.window_hours`, projects noisy API objects down to useful fields, and emits five KPI lists via `Kestra.outputs`.
    5. The `ai_day_brief` task (`io.kestra.plugin.ai.agent.AIAgent`) prompts `gemini-2.5-flash` to write a markdown summary limited to the most pressing items, always citing issue and PR ids, followed by a proposed plan of attack.
    6. `log_output` records the brief and `post_to_slack` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) delivers it. An `errors` branch alerts Slack on any failure, and a `MAX_DURATION` SLA cancels runs exceeding 10 minutes.

    ## What you get
    - A daily, prioritized repo digest with concrete issue and PR references, not a raw activity dump.
    - Parallel API fan-out with per-request retries and graceful degradation when an endpoint fails.
    - Python-computed KPIs you can reuse in dashboards via flow outputs.
    - Built-in operational guardrails: SLA cancellation, failure alerting, and full logs of the model prompt.

    ## Who it's for
    - Engineering leads who want a morning summary of open source or internal repo activity.
    - DevOps teams tracking CI health through failed workflow run trends.
    - Developer productivity teams piloting AI summaries on top of existing GitHub data.

    ## Why orchestrate this with Kestra
    A cron script hitting the GitHub API has no retry policy, no partial-failure story, and no place to put the AI step. Kestra composes the pipeline declaratively: `Parallel` fans out the HTTP calls, `pluginDefaults` applies a single retry and header policy to every request, internal storage passes the merged JSON to Python without temp-file hacks, and the `AIAgent` task makes the LLM call observable and retryable like any other task. SLA and `errors` handling turn a best-effort script into a monitored daily service.

    ## Prerequisites
    - A public GitHub repository, or a token added to the request headers for private repos and higher rate limits.
    - A Slack incoming webhook URL for the destination channel.
    - A Google AI Studio API key with access to Gemini models.

    ### Secrets
    - `GEMINI_API_KEY`: Google Gemini API key used by the `AIAgent` task.
    - `SLACK_WEBHOOK`: Slack incoming webhook URL for the brief and failure alerts.

    ## Quick start
    1. Add the secrets above to your Kestra namespace.
    2. Set `github_repo` to your repository and adjust `window_hours` to your reporting window.
    3. Run the flow manually once and review the brief in the logs and in Slack.
    4. Leave the `every_morning` schedule on, or change the cron to match your standup time.

    ## How to extend
    - Add an `Authorization: Bearer` header via `pluginDefaults` to raise GitHub rate limits and cover private repos.
    - Loop over multiple repositories with `io.kestra.plugin.core.flow.ForEach` and merge briefs into one org-wide digest.
    - Push the KPI lists to a warehouse table for trend dashboards alongside the Slack post.
    - Open a Jira or Linear ticket automatically when `failed_runs` exceeds a threshold.
    - Swap Gemini for OpenAI or Anthropic by changing the `AIAgent` provider block.

    ## Links
    - Kestra AI plugin docs: https://kestra.io/plugins/plugin-ai
    - Python script plugin docs: https://kestra.io/plugins/plugin-script-python
  tags:
    - AI
  subtags:
    - Reporting & Digests
    - Scheduling
    - Customer Success
  ee: false
  demo: false
