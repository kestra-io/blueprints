id: azure-ml-data-asset-version-sprawl-sentinel
namespace: company.team

description: |
  List every registered version of an Azure Machine Learning data asset, alert Slack when the
  version count crosses a threshold you set, and log a governance audit trail either way.
  Read-only: this flow never registers, deletes, or modifies a data asset version.

inputs:
  - id: resource_group_name
    type: STRING
    displayName: Resource group name
    description: Azure resource group containing the Machine Learning workspace.
    defaults: "<your-resource-group>"

  - id: workspace_name
    type: STRING
    displayName: Workspace name
    description: Name of the Azure Machine Learning workspace.
    defaults: "<your-ml-workspace>"

  - id: data_name
    type: STRING
    displayName: Data asset name
    description: The data asset to audit for version sprawl.
    defaults: "<your-data-asset-name>"

  - id: max_version_count
    type: INT
    displayName: Max version count
    description: Alert when the data asset has this many or more registered versions.
    defaults: 20

tasks:
  - id: list_data_versions
    type: io.kestra.plugin.azure.ml.ListDataVersions
    description: Read-only. Lists every registered version of data_name, most recent first.
    allowFailure: true
    tenantId: "{{ secret('AZURE_TENANT_ID') }}"
    clientId: "{{ secret('AZURE_CLIENT_ID') }}"
    clientSecret: "{{ secret('AZURE_CLIENT_SECRET') }}"
    subscriptionId: "{{ secret('AZURE_SUBSCRIPTION_ID') }}"
    resourceGroupName: "{{ inputs.resource_group_name }}"
    workspaceName: "{{ inputs.workspace_name }}"
    dataName: "{{ inputs.data_name }}"

  - id: evaluate
    type: io.kestra.plugin.core.output.OutputValues
    description: Counts the registered versions and reads the newest one, already sorted most-recent-first by the task itself.
    values:
      version_count: >-
        {{ outputs.list_data_versions is not defined ? -1 : (({'versions': outputs.list_data_versions.versions} | jq('(.versions // []) | length')) | first | number) }}
      latest_version: >-
        {{ outputs.list_data_versions is not defined ? '' : (({'versions': outputs.list_data_versions.versions} | jq('(.versions // []) | first // {} | .version // ""')) | first) }}
      severity: >-
        {{ outputs.list_data_versions is not defined ? 'CRITICAL' : (((({'versions': outputs.list_data_versions.versions} | jq('(.versions // []) | length')) | first | number) >= inputs.max_version_count) ? 'VERSION_SPRAWL' : 'OK') }}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.evaluate.values.severity != 'OK' }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': outputs.evaluate.values.severity ~ ': Azure ML data asset ' ~ inputs.data_name ~ ' has ' ~ outputs.evaluate.values.version_count ~ ' registered version(s), at or above the ' ~ inputs.max_version_count ~ ' threshold. Latest version: ' ~ outputs.evaluate.values.latest_version ~ '.'} | toJson }}
    else:
      - id: compliant
        type: io.kestra.plugin.core.log.Log
        message: "Azure ML data asset {{ inputs.data_name }} has {{ outputs.evaluate.values.version_count }} registered version(s), below the {{ inputs.max_version_count }} threshold."

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: "Azure ML data asset version sprawl sentinel complete for {{ inputs.data_name }}: {{ outputs.evaluate.values.version_count }} version(s), severity {{ outputs.evaluate.values.severity }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Azure ML data asset version sprawl sentinel failed (execution ' ~ execution.id ~ '). Check the logs.'} | toJson }}

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled. Enable once AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_SUBSCRIPTION_ID, and SLACK_WEBHOOK_URL are set and the inputs point at a real workspace.
    cron: "0 7 * * 1"
    disabled: true
    inputs:
      resource_group_name: "<your-resource-group>"
      workspace_name: "<your-ml-workspace>"
      data_name: "<your-data-asset-name>"
      max_version_count: 20

extend:
  title: Azure ML Data Asset Version Sprawl Sentinel
  metaTitle: Azure ML Data Asset Version Sprawl Sentinel with Kestra
  shortDescription: List every registered version of an Azure Machine Learning data asset, alert Slack when the version count crosses a threshold, and log a governance audit trail.
  metaDescription: Audit Azure ML data asset version counts, alert Slack when they sprawl past a threshold, and log the result for AI platform teams.
  description: |
    Every retrain of a model that registers its training data as a new Azure Machine Learning
    data asset version adds one more entry nobody ever prunes; a data asset can accumulate
    hundreds of versions with no policy enforcing which ones still matter. Azure ML's own studio
    shows a version list if someone opens it; it does not compare the count against a limit you
    declare or notify anyone when it sprawls.

    This blueprint was created by [Mohit Jeswani](https://github.com/mohitjeswani01).

    ## How it works

    1. `list_data_versions` (`io.kestra.plugin.azure.ml.ListDataVersions`) lists every
       registered version of `data_name`, most recent first. Read-only; nothing in Azure ML is
       changed. `allowFailure: true` covers a missing data asset or an auth error without
       failing the flow outright.
    2. `evaluate` (`io.kestra.plugin.core.output.OutputValues`) counts the versions and reads
       the newest one with a `jq` filter.
    3. `route` (`io.kestra.plugin.core.flow.If`):
       - **compliant:** logs the version count, below threshold.
       - **alert:** posts the count and latest version to Slack.
    4. `summary` logs the count and severity, closing the governance cycle.
    5. `errors` alerts Slack if the flow itself fails, for example an expired service principal
       secret.

    ## What you get

    - A real registered-version count straight from the Azure ML workspace, not an estimate
      from a dashboard someone has to remember to open.
    - The latest version name in the Slack alert, so whoever responds knows the current state
      without a separate lookup.
    - A read-only check with zero risk of registering, deleting, or modifying a real version.

    ## Who it's for

    - AI platform and ML ops teams running Azure Machine Learning who want data asset version
      sprawl caught on a schedule, not discovered when workspace storage costs spike.
    - Teams evaluating the Azure plugin who want a worked example of `ml.ListDataVersions` used
      as a standing resource quota check, the first blueprint in this repo to use the `ml`
      sub-package of the Azure plugin at all.

    ## Why orchestrate this with Kestra

    Azure ML lists a data asset's versions on request; it does not keep a schedule, compare the
    count against a tolerance you declare, or notify a Slack channel when it sprawls. Kestra
    keeps `max_version_count` as a flow input, turns the list into a Slack page naming the real
    count and latest version, and keeps a full execution history of every run.

    ## Prerequisites

    - An Azure Machine Learning workspace with a data asset that has at least one registered
      version.
    - An Azure Entra ID service principal with read access to that workspace.
    - A Slack incoming webhook URL.

    This flow calls the Azure Resource Manager API directly over HTTPS; there is no official
    local Azure ML emulator, so `list_data_versions` cannot be exercised against a local Docker
    container.

    ### Secrets

    - `AZURE_TENANT_ID` / `AZURE_CLIENT_ID` / `AZURE_CLIENT_SECRET` / `AZURE_SUBSCRIPTION_ID`:
      the Entra ID service principal credentials used by `list_data_versions`. In Kestra OSS,
      provide them as the base64-encoded environment variables `SECRET_AZURE_TENANT_ID`,
      `SECRET_AZURE_CLIENT_ID`, `SECRET_AZURE_CLIENT_SECRET`, and
      `SECRET_AZURE_SUBSCRIPTION_ID`.
    - `SLACK_WEBHOOK_URL`: used by `alert` and the `errors` block. In Kestra OSS, provide it as
      the base64-encoded environment variable `SECRET_SLACK_WEBHOOK_URL`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `data_name` | `<your-data-asset-name>` | Data asset to audit |
    | `max_version_count` | `20` | Registered-version count at or above which the alert fires |

    ### Outputs

    - `{{ outputs.list_data_versions.versions }}`: every registered version (`version`, `uri`),
      most recent first.
    - `{{ outputs.evaluate.values.version_count }}` / `.latest_version`: how many versions exist
      and the newest version name.
    - `{{ outputs.evaluate.values.severity }}`: `OK`, `VERSION_SPRAWL`, or `CRITICAL`.

    ### Pitfalls

    - `ListDataVersions` throws if `data_name` does not exist in the workspace at all; a typo
      in the name surfaces via `allowFailure` as `CRITICAL`, not a silently empty version list.
    - The task's own output does not expose each version's creation timestamp, only its name and
      storage URI; this check can enforce a count ceiling but not an age-based retention policy
      on its own.
    - A version count below `max_version_count` does not mean the versions are all still in use;
      this is a volume check, not a usage audit.

    ## Quick start

    1. Add the four Azure secrets and `SLACK_WEBHOOK_URL`.
    2. Set `resource_group_name`, `workspace_name`, and `data_name` to a real data asset.
    3. Run the flow manually and confirm `summary` logs a count.
    4. Lower `max_version_count` below the real current count to confirm `alert` fires.
    5. Restore a real threshold and enable the `weekly` trigger.

    ## How to extend

    - Loop over several `data_name` values with `io.kestra.plugin.core.flow.Loop` to audit every
      data asset in a workspace in one scheduled run.
    - Chain a task that deletes the oldest versions beyond a retention count, gated behind an
      explicit `confirm_prune` input, since this plugin has no delete-version task of its own to
      call directly.
    - Add `io.kestra.plugin.azure.ml.ListDataVersions` results from multiple data assets into one
      combined sprawl report instead of auditing one asset per run.

    ## Links

    - Azure plugin: https://kestra.io/plugins/plugin-azure
    - Azure ML data asset versioning reference: https://learn.microsoft.com/en-us/azure/machine-learning/how-to-manage-models-mlflow
    - Slack incoming webhooks: https://api.slack.com/messaging/webhooks
  tags:
    - AI
  subTags:
    - Monitoring & Alerting
    - Testing & Quality
  ee: false
  demo: false
