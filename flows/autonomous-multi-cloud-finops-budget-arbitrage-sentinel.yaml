id: autonomous-multi-cloud-finops-budget-arbitrage-sentinel
namespace: company.finops.arbitrage

description: |
  Enterprise-grade multi-cloud FinOps budget arbitrage and spot interruption sentinel. 
  Concurrently probes AWS, GCP, and Azure spot pricing feeds, aggregates workload cost arbitrage 
  models using DuckDB, and safely coordinates automated cross-cloud failover and FinOps alerts.

labels:
  domain: finops
  subsystem: multi-cloud-arbitrage
  criticality: operational

inputs:
  - id: target_cluster_environment
    type: STRING
    defaults: "production-global-analytics"
  - id: monthly_cloud_spend_cap_usd
    type: FLOAT
    defaults: 25000.00
  - id: observed_projected_spend_usd
    type: FLOAT
    defaults: 29450.50
  - id: spot_interruption_risk_threshold_pct
    type: FLOAT
    defaults: 15.0
  - id: observed_spot_risk_percentage
    type: FLOAT
    defaults: 22.5
  - id: automated_cross_cloud_failover_enabled
    type: BOOL
    defaults: true

triggers:
  - id: hourly_finops_arbitrage_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"

  - id: manual_finops_arbitrage_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "finops-arbitrage-webhook-token"

tasks:
  - id: init_finops_arbitrage_session
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: |
      [FINOPS SENTINEL] Starting multi-cloud budget arbitrage analysis for environment {{ inputs.target_cluster_environment }}.
      Projected Spend: ${{ inputs.observed_projected_spend_usd }} (Cap:${{ inputs.monthly_cloud_spend_cap_usd }})
      Observed Spot Interruption Risk: {{ inputs.observed_spot_risk_percentage }}% (Threshold: {{ inputs.spot_interruption_risk_threshold_pct }}%)

  - id: parallel_multi_cloud_pricing_probes
    type: io.kestra.plugin.core.flow.Parallel
    description: "Concurrently query spot capacity pools and reserved instance pricing across AWS, GCP, and Azure"
    tasks:
      - id: probe_aws_ec2_spot_pools
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "AWS us-east-1 spot probe: c6i.4xlarge capacity pool availability stable; interruption rate trending at 8.2%."

      - id: probe_gcp_preemptible_instances
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "GCP us-central1 preemptible probe: n2-standard-16 spot inventory exhibiting pricing volatility (+14%)."

      - id: probe_azure_spot_virtual_machines
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Azure EastUS spot probe: Standard_D16s_v5 capacity constrained; high eviction probability flagged."

  - id: aggregate_arbitrage_models_duckdb
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: "Aggregate multi-cloud workload cost efficiency and spot arbitrage opportunities using DuckDB in-memory engine"
    sql: |
      WITH multi_cloud_spot_pricing AS (
        SELECT 'AWS' AS provider, 'us-east-1' AS region, 'c6i.4xlarge' AS instance_type, 0.282 AS hourly_rate_usd, 8.2 AS interruption_pct
        UNION ALL
        SELECT 'GCP' AS provider, 'us-central1' AS region, 'n2-standard-16' AS instance_type, 0.254 AS hourly_rate_usd, 22.5 AS interruption_pct
        UNION ALL
        SELECT 'Azure' AS provider, 'eastus' AS region, 'Standard_D16s_v5' AS instance_type, 0.298 AS hourly_rate_usd, 19.1 AS interruption_pct
      )
      SELECT
        provider,
        region,
        instance_type,
        hourly_rate_usd,
        interruption_pct,
        CASE WHEN interruption_pct > 15.0 THEN 'HIGH_EVICTION_RISK' ELSE 'OPTIMAL_ARBITRAGE' END AS arbitrage_recommendation
      FROM multi_cloud_spot_pricing
      ORDER BY hourly_rate_usd ASC;
    fetchType: FETCH

  - id: evaluate_budget_and_risk_matrices
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: |
      Multi-cloud arbitrage model evaluation completed. Projected spend breach = {{ inputs.observed_projected_spend_usd > inputs.monthly_cloud_spend_cap_usd }} | 
      Spot risk breach = {{ inputs.observed_spot_risk_percentage > inputs.spot_interruption_risk_threshold_pct }}.

  - id: sequential_finops_coordination_pipeline
    type: io.kestra.plugin.core.flow.Sequential
    description: "Sequentially dispatch financial audit summaries to FinOps Slack and register Datadog budget markers"
    tasks:
      - id: notify_slack_finops_command
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Dispatched multi-cloud arbitrage cost breakdown report to #finops-command Slack channel."

      - id: register_datadog_finops_event
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Registered cloud spend variance event marker in Datadog APM financial dashboard."

  - id: route_arbitrage_remediation_action
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.observed_projected_spend_usd > inputs.monthly_cloud_spend_cap_usd or inputs.observed_spot_risk_percentage > inputs.spot_interruption_risk_threshold_pct }}"
    then:
      - id: execute_cross_cloud_migration_pipeline
        type: io.kestra.plugin.core.flow.Parallel
        description: "Execute safe workload evacuation and multi-cloud rerouting"
        tasks:
          - id: migrate_workloads_to_stable_cloud
            type: io.kestra.plugin.core.log.Log
            level: WARN
            message: "ARBITRAGE ACTION: Migrating stateful batch workloads from volatile GCP spot pools to stable AWS reserved capacity."

          - id: apply_kubernetes_hpa_spending_cap
            type: io.kestra.plugin.core.log.Log
            level: WARN
            message: "ARBITRAGE ACTION: Enforcing strict Horizontal Pod Autoscaler scaling limits to suppress non-critical batch replica counts."
    else:
      - id: log_optimal_finops_state
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Cloud spend and spot interruption risks remain strictly within budgeted parameters. No arbitrage migration required."

  - id: finalize_finops_arbitrage_execution
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: "Completed autonomous multi-cloud FinOps budget arbitrage sentinel execution ID: {{ execution.id }}"