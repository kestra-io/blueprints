id: trello-release-checklist-builder
namespace: company.team
description: |
  Build the same release checklist on the board for every release. A ForEach
  loop creates one Trello card per checklist item in the release list, and
  Discord reports how many cards were created, so no release starts with a
  half-remembered checklist.

inputs:
  - id: release_list_id
    type: STRING
    defaults: replace-with-your-release-list-id
    description: Trello list id of the column where the release checklist cards are created.

  - id: checklist_items
    type: ARRAY
    itemType: STRING
    defaults:
      - Tag the release and push the tag
      - Update the changelog
      - Run the smoke test suite
      - Publish the release notes
      - Announce the release in the community channel
    description: One card is created per item, in order. Edit the defaults to match your release process.

tasks:
  - id: build_checklist
    type: io.kestra.plugin.core.flow.ForEach
    description: Create one card per checklist item so every release starts from the same complete checklist.
    values: "{{ inputs.checklist_items }}"
    tasks:
      - id: create_item
        type: io.kestra.plugin.trello.cards.Create
        description: Create the card for the current checklist item at the bottom of the release list to preserve the checklist order.
        apiKey: "{{ secret('TRELLO_API_KEY') }}"
        apiToken: "{{ secret('TRELLO_API_TOKEN') }}"
        listId: "{{ inputs.release_list_id }}"
        name: "{{ taskrun.value }}"
        desc: |
          Release checklist item created by Kestra flow {{ flow.id }} (execution {{ execution.id }}).
          Move this card to done once the step is verified, not merely started.
        pos: bottom

  - id: notify
    type: io.kestra.plugin.discord.DiscordIncomingWebhook
    description: Report the number of checklist cards created so the release owner can confirm the board is ready at a glance.
    url: "{{ secret('DISCORD_WEBHOOK_URL') }}"
    payload: |
      {
        "content": "Release checklist ready. {{ inputs.checklist_items | length }} cards were created in the release list (execution {{ execution.id }})."
      }

errors:
  - id: alert_failure
    type: io.kestra.plugin.discord.DiscordIncomingWebhook
    description: Alert Discord when checklist creation fails so nobody starts a release from a partially built board.
    url: "{{ secret('DISCORD_WEBHOOK_URL') }}"
    payload: |
      {
        "content": "Release checklist build FAILED in flow {{ flow.id }} (execution {{ execution.id }}). The board may hold a partial checklist; check the task logs before starting the release."
      }

extend:
  title: Build Repeatable Trello Release Checklists with One Card per Item
  shortDescription: A ForEach loop creates one Trello card per checklist item in a release list and reports the created count to Discord, one identical checklist per release.
  metaTitle: Trello Release Checklist Builder with Kestra
  metaDescription: Build repeatable Trello release checklists with Kestra. A ForEach loop creates one card per checklist item and reports the count to Discord.
  description: |
    The most dangerous release checklist is the one rebuilt from memory. This blueprint makes the checklist a versioned artifact: an array input holds the item names, `io.kestra.plugin.core.flow.ForEach` loops over them, and `io.kestra.plugin.trello.cards.Create` produces one card per item at the bottom of the release list, preserving order. Discord reports the created count, so the release owner can confirm the board is complete before the first step starts.

    ## How it works

    1. The `checklist_items` array input defines the checklist. The defaults cover a typical software release; edit them once and every future run uses the same list.
    2. `build_checklist` (`io.kestra.plugin.core.flow.ForEach`) iterates over the items in order.
    3. `create_item` (`io.kestra.plugin.trello.cards.Create`) creates each card with `{{ taskrun.value }}` as the name and `pos: bottom`, so the column reads top to bottom in checklist order. The description stamps the creating flow and execution for traceability.
    4. `notify` posts the count, computed with `{{ inputs.checklist_items | length }}`, to Discord.
    5. The `errors` block posts a distinct Discord alert on failure, because a partially built checklist is worse than none, it looks complete.

    ## What you get

    - An identical, ordered checklist on the board for every release, built in seconds.
    - The checklist definition living in flow inputs, reviewable and versionable like code.
    - A created-card count in Discord as a completeness check.
    - Cards stamped with the execution that created them, for auditability.

    ## Who it's for

    - Release managers who rebuild the same column of cards before every ship.
    - Small teams that run releases from a Trello board instead of a release tool.
    - Anyone standardizing a repeatable process, releases, onboarding, or event prep, as board cards.

    ## Why orchestrate this with Kestra

    Trello stores the cards, but recreating a checklist by hand invites drift, skipped items, and reordered steps. Kestra turns the checklist into data: a loop, an input array, secret management for the API credentials, and an execution history showing exactly which cards each release run created.

    ## Prerequisites

    - A Trello board with a release list, and that list's id for the `release_list_id` input.
    - A Trello API key and token from https://trello.com/power-ups/admin.
    - A Discord incoming webhook for the summary and failure alerts.

    ### Secrets

    - `TRELLO_API_KEY`: Trello API key.
    - `TRELLO_API_TOKEN`: Trello API token.
    - `DISCORD_WEBHOOK_URL`: Discord incoming webhook URL.

    ## Quick start

    1. Add the three secrets to your Kestra namespace and set `release_list_id` to your release column.
    2. Adjust the `checklist_items` defaults to your release process.
    3. Execute the flow and confirm the cards appear in order, then check the count in Discord.

    ## How to extend

    - Add per-item due dates by switching the input to structured entries and passing `due` on the create task.
    - Kick the flow off from CI by adding a `Webhook` trigger, so cutting a release branch builds the board.
    - Name the checklist per release by adding a version input and prefixing `name` with it.
    - Pair with the deploy pipeline mover blueprint so the same board also tracks the deploy stages.

    ## Links

    - [Trello plugin documentation](https://kestra.io/plugins/plugin-trello)
    - [Trello REST API documentation](https://developer.atlassian.com/cloud/trello/rest/)
  tags:
    - Business
  subTags:
    - CI/CD & Deployment
    - HR & Ops Automation
  ee: false
  demo: false
