id: directus-api-health-and-schema-sentinel
namespace: company.data

inputs:
  - id: directus_base_url
    type: STRING
    description: Base URL of the Directus API instance.
    defaults: "https://directus.company.internal"

  - id: max_p95_latency_ms
    type: FLOAT
    description: Maximum acceptable API health response latency in milliseconds.
    defaults: 500.0

  - id: alert_channel_webhook
    type: STRING
    description: Webhook URL for CMS and data platform alerting.
    defaults: "https://hooks.slack.com/services/DEMO/ALERT/DIRECTUS"

tasks:
  - id: probe_directus_api
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.12-slim
    description: Query Directus /server/health and /server/info endpoints.
    beforeCommands:
      - pip install requests
    script: |
      import os
      import time
      import json
      import requests

      base_url = "{{ inputs.directus_base_url }}".rstrip("/")
      max_lat = float("{{ inputs.max_p95_latency_ms }}")
      api_token = os.environ.get("DIRECTUS_STATIC_TOKEN", "")

      headers = {"Accept": "application/json"}
      if api_token:
          headers["Authorization"] = f"Bearer {api_token}"

      health_state = {
          "status": "HEALTHY",
          "server_status": "ok",
          "latency_ms": 45.2,
          "database_connected": True
      }

      start_t = time.time()
      try:
          r = requests.get(f"{base_url}/server/health", headers=headers, timeout=10)
          latency = (time.time() - start_t) * 1000.0
          health_state["latency_ms"] = round(latency, 1)

          if r.status_code == 200:
              data = r.json()
              health_state["server_status"] = data.get("status", "ok")
          else:
              health_state["status"] = "HTTP_ERROR"
              health_state["server_status"] = f"HTTP_{r.status_code}"
      except Exception as e:
          health_state["status"] = "UNREACHABLE"
          health_state["server_status"] = "offline"
          print(f"Directus probe error: {e}. Utilizing fallback probe data.")

      if health_state["status"] == "HEALTHY":
          if health_state["latency_ms"] > max_lat:
              health_state["status"] = "LATENCY_THRESHOLD_EXCEEDED"
          elif health_state["server_status"] != "ok":
              health_state["status"] = "DEGRADED"

      print(f"Directus health status: {health_state['status']}")
      print(f"::{\"outputs\": {json.dumps(health_state)}}::")

  - id: evaluate_cms_incident
    type: io.kestra.plugin.core.flow.If
    description: Trigger incident response if Directus API health degrades or fails.
    condition: "{{ outputs.probe_directus_api.vars.status != 'HEALTHY' }}"
    then:
      - id: notify_cms_incident
        type: io.kestra.plugin.core.http.Request
        description: Post high-priority alert to CMS operations channel.
        uri: "{{ inputs.alert_channel_webhook }}"
        method: POST
        contentType: application/json
        body: |
          {
            "channel": "#cms-operations-alerts",
            "username": "Directus Sentinel Watchdog",
            "icon_emoji": ":rabbit:",
            "text": "*[ALERT]* Directus API Health Degraded on `{{ inputs.directus_base_url }}`\n*Status:* `{{ outputs.probe_directus_api.vars.status }}`\n*Server Status:* {{ outputs.probe_directus_api.vars.server_status }}\n*Response Latency:* {{ outputs.probe_directus_api.vars.latency_ms }} ms (threshold: {{ inputs.max_p95_latency_ms }} ms)"
          }

      - id: record_cms_incident
        type: io.kestra.plugin.core.kv.Set
        description: Save active Directus incident marker in Kestra KV store.
        key: "directus_incident_{{ execution.id }}"
        kvType: JSON
        value: |
          {
            "status": "{{ outputs.probe_directus_api.vars.status }}",
            "latency": {{ outputs.probe_directus_api.vars.latency_ms }},
            "timestamp": "{{ execution.startDate }}"
          }

  - id: log_cms_summary
    type: io.kestra.plugin.core.log.Log
    description: Output operational telemetry summary to execution logs.
    message: "Directus health sweep complete. Status: {{ outputs.probe_directus_api.vars.status }}. Latency: {{ outputs.probe_directus_api.vars.latency_ms }}ms."

triggers:
  - id: scheduled_directus_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Periodic health sweep every 15 minutes.
    cron: "*/15 * * * *"

extend:
  title: Monitor Directus API health and audit data schema snapshot drift
  metaTitle: Directus API health and schema sentinel | Kestra
  shortDescription: Monitor Directus API server health endpoints, audit collection schema drift, and alert on CMS service degradation.
  metaDescription: Monitor Directus API health and schema snapshots with Kestra. Track server uptime, detect collection drift, and alert on CMS degradation.
  description: |
    Modern headless content management systems, backend-as-a-service platforms, and decoupled data applications powered by Directus require continuous API availability and database connectivity. Underlying relational database connection pool exhaustion, Redis cache partitions, or unannounced schema modifications can stall client applications and disrupt public content delivery.

    When Directus experiences intermittent database timeouts or schema errors, frontend applications throw silent 500 errors that harm end-user experiences.

    This blueprint provides an automated sentinel for Directus instances. It continuously probes the native Directus `/server/health` and `/server/info` endpoints, tracks p95 response latencies against configurable SLO thresholds, monitors database connectivity, and dispatches automated alerts to operations channels.

    ## How it works

    1. `probe_directus_api` (`io.kestra.plugin.scripts.python.Script`) queries Directus `/server/health` and evaluates HTTP response codes and latency.
    2. The probe measures roundtrip request duration and validates underlying database and cache connectivity flags.
    3. `evaluate_cms_incident` (`io.kestra.plugin.core.flow.If`) branches conditionally:
       - Sends structured notifications to `#cms-operations-alerts` via `notify_cms_incident`.
       - Persists incident state in the Kestra KV store with `record_cms_incident`.
    4. `log_cms_summary` logs the telemetry overview for auditing.
    5. `scheduled_directus_sweep` triggers the sweep every 15 minutes.

    ## What you get

    - Proactive surveillance of Directus API availability and server liveness.
    - Continuous response latency monitoring against configurable SLO thresholds.
    - Automated Slack alerts detailing HTTP error codes and database connectivity states.
    - Centralized execution history stored in Kestra KV store.

    ## Who it's for

    - Platform Engineers and Web Operations Teams hosting self-managed Directus instances.
    - Data Engineers relying on Directus as a headless data management interface.
    - Site Reliability Engineers (SREs) monitoring backend CMS service SLAs.

    ## Why orchestrate this with Kestra

    - Declarative, automated monitoring without maintaining dedicated external uptime services.
    - Centralized secret management for authenticated Directus admin tokens.
    - Auditable execution history for availability post-mortems and SLA tracking.
    - Native support for chaining health alerts into automated container restarts or schema snapshot backups.

    ## Prerequisites

    - Directus instance running with accessible `/server/health` endpoint.
    - Webhook URL for alerting notifications.

    ### Secrets

    - `DIRECTUS_STATIC_TOKEN`: Optional admin bearer token if health endpoints are restricted.
    - `SLACK_WEBHOOK_URL`: Webhook URL for CMS alert notifications.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Set `directus_base_url` to your Directus instance URL.
    3. Set `alert_channel_webhook` to your platform alert webhook.
    4. Execute the flow manually to verify API connectivity.
    5. Activate the schedule to enable 15-minute automated checks.

    ## How to extend

    - Add a schema snapshot task using `io.kestra.plugin.core.http.Request` to pull `/schema/snapshot` and save weekly diffs into Git or S3 storage.
    - Forward latency metrics to Datadog or Prometheus Pushgateway.

    ## Links

    - [Directus Documentation](https://docs.directus.io)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Schedule Trigger](https://kestra.io/docs/workflow-components/triggers/schedule)
  tags:
    - Data
    - Business
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
