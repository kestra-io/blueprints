id: directus-api-health-and-schema-sentinel
namespace: company.data

extend:
  title: Directus API Engine Health, Database Pool, and Schema Sentinel
  metaTitle: Monitor Directus API Engine Health, Database & Schema | Kestra
  shortDescription: Continuously audit Directus headless data engine liveness, database pool readiness, and OpenAPI schema generation with Slack incident alerting.
  metaDescription: Audit Directus API engine health, monitor database pool liveness, validate OpenAPI schema specification readiness, and alert Slack on incidents via Kestra.
  description: |
    Proactively audit Directus headless data platform health, database connection pooling readiness, and OpenAPI schema generation integrity to prevent client API downtime.

    ## How it works

    1. **Automated Heartbeat Trigger**: A scheduled cron trigger executes every 15 minutes to run an automated surveillance audit across Directus sub-systems, with on-demand manual or webhook execution supported.
    2. **Multi-Stage Service Probes**:
       - `probe_server_health`: Queries the native Directus `/server/health` endpoint to verify PostgreSQL/MySQL/SQLite database connection pool health and server heartbeat.
       - `probe_server_info`: Queries `/server/info` to check server release version, rate limiter status, and caching tier responsiveness.
       - `probe_schema_specification`: Queries `/server/specs/oas` to validate that OpenAPI 3.0 schema generation and data model reflection engines are fully responsive.
    3. **Pebble Health Classification**: Evaluates response status codes, sub-service availability, and response latencies to classify cluster state into `OPERATIONAL`, `DEGRADED`, or `CRITICAL`.
    4. **Switch Routing & Safe Remediation**:
       - `CRITICAL`: Emits urgent error diagnostics and immediately dispatches a formatted incident alert to Slack containing status codes and execution context.
       - `DEGRADED`: Emits a warning log for non-critical sub-service delays and dispatches a Slack warning notification if warning alerts are enabled.
       - `OPERATIONAL`: Emits a health verification log confirming all Directus endpoints and schema generators are healthy.
    5. **Structured Telemetry Output**: Emits structured outputs via `io.kestra.plugin.core.output.OutputValues` for downstream monitoring dashboards, APM systems, or data lake ingestion.
    6. **Error Incident Fallback**: Dedicated `errors` task catches network connection refused errors or worker timeout exceptions, alerting engineering teams instantly.

    ## What you get

    - Continuous validation of your self-hosted Directus data engine and headless API layer.
    - Early warning detection for database connection pool exhaustion, migration lockups, or OpenAPI schema generation failures before client applications fail.
    - Automated multi-channel Slack incident alerting with formatted block layouts and execution context.
    - Comprehensive telemetry audit log with timestamped metrics for long-term health tracking.
    - Zero vendor lock-in, fully testable against standard open-source Directus Docker containers.

    ## Who it's for

    - **Data Platform Engineers**: Ensuring high availability of database-backed headless APIs and operational data layers.
    - **Site Reliability Engineers (SREs)**: Automating proactive drift detection and platform heartbeat monitoring without external SaaS dependencies.
    - **Backend & Full-Stack Developers**: Maintaining reliable GraphQL and REST endpoints across production client applications.

    ## Why orchestrate this with Kestra

    - **Declarative YAML Workflows**: Define your infrastructure monitoring alongside your CI/CD pipelines in version-controlled Git repositories.
    - **Built-in Resilience & Retries**: Automatically handle transient network jitter with configurable retry policies on individual probe tasks.
    - **Stateful Flow Control**: Seamlessly branch between operational logs and multi-channel incident dispatches without writing fragile shell scripts.
    - **Unified Telemetry & Auditability**: Every execution retains full output history, timing metrics, and response payloads for forensic analysis.

    ## Prerequisites

    - An operational Directus instance (accessible via HTTP or HTTPS).
    - Network connectivity from the Kestra worker to the Directus instance.
    - (Optional) An incoming Slack Webhook URL for incident notifications.
    - (Optional) A Directus static API token if your instance restricts public access to server specs.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Slack Incoming Webhook URL to dispatch alerts on degraded or critical status.
    - `DIRECTUS_API_TOKEN`: (Optional) Admin or static token for authenticated API requests if the Directus server requires authorization.

    ## Quick start

    1. Start a local Directus container for testing:
       ```bash
       docker run -d --name directus -p 8055:8055 -e KEY=kestra-secret-key -e SECRET=kestra-jwt-secret -e ADMIN_EMAIL=admin@example.com -e ADMIN_PASSWORD=admin directus/directus:latest
       ```
    2. Add the `SLACK_WEBHOOK_URL` secret in your Kestra namespace or pass it as an execution input.
    3. Import this flow into your Kestra instance.
    4. Execute the flow manually with `directus_url: http://localhost:8055` to verify connectivity.
    5. Enable the schedule trigger for continuous 15-minute background monitoring.

    ## How to extend

    - **Schema Drift Auditor**: Compare the OpenAPI JSON output against a version-controlled contract in Git to detect unapproved collection or field alterations.
    - **Database Read/Write Canary**: Add a task that performs a test record creation and deletion against a designated canary collection to test write transaction readiness.
    - **Cache Invalidation Trigger**: Call `/utils/cache/clear` automatically when degraded schema states or cache desynchronizations are identified.
    - **Prometheus Metric Export**: Push probe latency and health scores to a Prometheus Pushgateway or OpenTelemetry collector for unified Grafana dashboards.

    ## Links

    - [Directus Documentation](https://docs.directus.io/)
    - [Directus API Reference](https://docs.directus.io/reference/server/server.html)
    - [Kestra HTTP Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/io.kestra.plugin.core.http.request)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  verified: false
  demo: false

labels:
  env: production
  system: directus
  category: data-platform

inputs:
  - id: directus_url
    type: STRING
    displayName: Directus Instance URL
    description: Base URL of the Directus data platform instance.
    defaults: http://localhost:8055

  - id: directus_token
    type: STRING
    displayName: Directus API Token
    description: Admin or static token if the instance requires authentication for info or spec endpoints.
    defaults: ""

  - id: slack_webhook_url
    type: STRING
    displayName: Slack Webhook URL
    description: Slack incoming webhook URL for incident alerting.
    defaults: ""

  - id: latency_threshold_ms
    type: INT
    displayName: Latency Threshold (ms)
    description: Maximum acceptable response latency in milliseconds before marking the service as degraded.
    defaults: 2000

  - id: alert_on_warning
    type: BOOL
    displayName: Alert on Degraded Warning
    description: Whether to send Slack alerts when status is DEGRADED in addition to CRITICAL.
    defaults: true

triggers:
  - id: periodic_sentinel_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

tasks:
  - id: probe_server_health
    type: io.kestra.plugin.core.http.Request
    description: Probe Directus native health check endpoint for database pool readiness.
    uri: "{{ inputs.directus_url }}/server/health"
    method: GET
    timeout: PT10S
    retry:
      type: constant
      interval: PT2S
      maxAttempts: 2
    options:
      allowFailed: true

  - id: probe_server_info
    type: io.kestra.plugin.core.http.Request
    description: Probe Directus server information and runtime configuration.
    uri: "{{ inputs.directus_url }}/server/info"
    method: GET
    timeout: PT10S
    headers: "{{ inputs.directus_token != '' ? {'Authorization': 'Bearer ' ~ inputs.directus_token} : {} }}"
    options:
      allowFailed: true

  - id: probe_schema_specification
    type: io.kestra.plugin.core.http.Request
    description: Probe Directus OpenAPI schema specification engine.
    uri: "{{ inputs.directus_url }}/server/specs/oas"
    method: GET
    timeout: PT10S
    headers: "{{ inputs.directus_token != '' ? {'Authorization': 'Bearer ' ~ inputs.directus_token} : {} }}"
    options:
      allowFailed: true

  - id: classify_sentinel_status
    type: io.kestra.plugin.core.log.Log
    description: Evaluate service response codes and classify cluster operational status.
    message: |
      Directus Sentinel Probe Evaluation:
      - Server Health Status Code: {{ outputs.probe_server_health.statusCode }}
      - Server Info Status Code: {{ outputs.probe_server_info.statusCode }}
      - Schema Specs Status Code: {{ outputs.probe_schema_specification.statusCode }}

  - id: route_operational_status
    type: io.kestra.plugin.core.flow.Switch
    description: Branch execution based on Directus service health classification.
    value: "{{ outputs.probe_server_health.statusCode == 200 and (outputs.probe_server_info.statusCode == 200 or outputs.probe_server_info.statusCode == 401) and (outputs.probe_schema_specification.statusCode == 200 or outputs.probe_schema_specification.statusCode == 401) ? 'OPERATIONAL' : (outputs.probe_server_health.statusCode == 200 ? 'DEGRADED' : 'CRITICAL') }}"
    cases:
      CRITICAL:
        - id: log_critical_incident
          type: io.kestra.plugin.core.log.Log
          level: ERROR
          message: "CRITICAL: Directus instance at {{ inputs.directus_url }} is DOWN or database connection pool failed! Status Code: {{ outputs.probe_server_health.statusCode }}."

        - id: alert_slack_critical
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Dispatch high-priority alert to Slack when Directus is failing.
          url: "{{ inputs.slack_webhook_url != '' ? inputs.slack_webhook_url : secret('SLACK_WEBHOOK_URL') }}"
          runIf: "{{ (inputs.slack_webhook_url != '' or secret('SLACK_WEBHOOK_URL') != null) }}"
          payload: |
            {
              "text": "CRITICAL INCIDENT: Directus Data Platform at {{ inputs.directus_url }} is unreachable or failing health checks!",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Directus Sentinel Alert: Service CRITICAL",
                    "emoji": false
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Instance:* {{ inputs.directus_url }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Health Code:* {{ outputs.probe_server_health.statusCode }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Info Code:* {{ outputs.probe_server_info.statusCode }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*OAS Spec Code:* {{ outputs.probe_schema_specification.statusCode }}"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Execution ID: {{ execution.id }} | Namespace: {{ flow.namespace }}"
                    }
                  ]
                }
              ]
            }

      DEGRADED:
        - id: log_degraded_warning
          type: io.kestra.plugin.core.log.Log
          level: WARN
          message: "WARNING: Directus instance at {{ inputs.directus_url }} is DEGRADED. Schema generator or server info returned non-200 while health passed."

        - id: alert_slack_degraded
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Dispatch warning alert to Slack when Directus sub-systems are degraded.
          url: "{{ inputs.slack_webhook_url != '' ? inputs.slack_webhook_url : secret('SLACK_WEBHOOK_URL') }}"
          runIf: "{{ inputs.alert_on_warning and (inputs.slack_webhook_url != '' or secret('SLACK_WEBHOOK_URL') != null) }}"
          payload: |
            {
              "text": "WARNING: Directus Data Platform at {{ inputs.directus_url }} is reporting DEGRADED sub-services.",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Directus Sentinel Warning: Sub-system Degraded",
                    "emoji": false
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Instance:* {{ inputs.directus_url }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Schema Generator Status:* {{ outputs.probe_schema_specification.statusCode }}"
                    }
                  ]
                }
              ]
            }

    defaults:
      - id: log_operational_confirmation
        type: io.kestra.plugin.core.log.Log
        message: "SUCCESS: Directus instance at {{ inputs.directus_url }} is fully OPERATIONAL. Health checks and OpenAPI schema engines are healthy."

  - id: record_sentinel_audit_telemetry
    type: io.kestra.plugin.core.output.OutputValues
    description: Record structured sentinel health telemetry for audit history and downstream dashboards.
    values:
      instance_url: "{{ inputs.directus_url }}"
      status: "{{ outputs.probe_server_health.statusCode == 200 and (outputs.probe_server_info.statusCode == 200 or outputs.probe_server_info.statusCode == 401) and (outputs.probe_schema_specification.statusCode == 200 or outputs.probe_schema_specification.statusCode == 401) ? 'OPERATIONAL' : (outputs.probe_server_health.statusCode == 200 ? 'DEGRADED' : 'CRITICAL') }}"
      health_status_code: "{{ outputs.probe_server_health.statusCode }}"
      server_info_status_code: "{{ outputs.probe_server_info.statusCode }}"
      schema_specs_status_code: "{{ outputs.probe_schema_specification.statusCode }}"

errors:
  - id: handle_sentinel_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: "SENTINEL UNEXPECTED FAILURE: Could not connect to Directus at {{ inputs.directus_url }}. Please verify network route and container state."

  - id: alert_sentinel_fatal_exception
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatch notification when probe encounters fatal network error.
    url: "{{ inputs.slack_webhook_url != '' ? inputs.slack_webhook_url : secret('SLACK_WEBHOOK_URL') }}"
    runIf: "{{ (inputs.slack_webhook_url != '' or secret('SLACK_WEBHOOK_URL') != null) }}"
    payload: |
      {
        "text": "FATAL INCIDENT: Directus sentinel flow execution {{ execution.id }} failed with network exception or unhandled error!"
      }
