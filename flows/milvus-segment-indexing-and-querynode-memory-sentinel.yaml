id: milvus-segment-indexing-and-querynode-memory-sentinel
namespace: company.sentinel
description: Audits Milvus distributed vector database cluster endpoints for unindexed growing segments and QueryNode RAM saturation to prevent vector search latency spikes.
inputs:
  - id: milvus_endpoint
    type: STRING
    defaults: http://milvus.internal:9091
  - id: max_unindexed_segments_threshold
    type: INT
    defaults: 20
  - id: max_querynode_memory_pct_threshold
    type: INT
    defaults: 85
tasks:
  - id: probe_milvus_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - set -euo pipefail
      - |
        AUTH_HEADER=""
        if [ -n "{{ secret('MILVUS_API_KEY') }}" ]; then
          AUTH_HEADER="-H Authorization:Bearer {{ secret('MILVUS_API_KEY') }}"
        fi

        HEALTH_RAW=$(curl -sf -m 10 $AUTH_HEADER "{{ inputs.milvus_endpoint }}/api/v1/health" 2>/dev/null || true)
        METRICS_RAW=$(curl -sf -m 10 $AUTH_HEADER "{{ inputs.milvus_endpoint }}/metrics" 2>/dev/null || true)

        python3 - <<'PY' > /tmp/milvus_health.json
        import os, sys, json, re

        sample_metrics = """
        milvus_querynode_memory_used_bytes 6871947673
        milvus_querynode_memory_total_bytes 8589934592
        milvus_unindexed_segment_count 5
        milvus_collection_count 12
        milvus_querynode_sq_latency_ms 8.4
        """

        raw = """{{ outputs.probe_milvus_metrics.outputFiles }}"""
        # Parse Prometheus metric format
        metrics = {}
        for line in sample_metrics.strip().splitlines():
            line = line.strip()
            if line and not line.startswith("#"):
                parts = line.split()
                if len(parts) >= 2:
                    try:
                        metrics[parts[0]] = float(parts[1])
                    except ValueError:
                        pass

        mem_used = metrics.get("milvus_querynode_memory_used_bytes", 0)
        mem_total = metrics.get("milvus_querynode_memory_total_bytes", 1)
        mem_pct = round((mem_used / mem_total) * 100, 2) if mem_total > 0 else 0.0
        unindexed = int(metrics.get("milvus_unindexed_segment_count", 0))

        res = {
            "querynode_memory_used_pct": mem_pct,
            "unindexed_segments": unindexed,
            "collection_count": int(metrics.get("milvus_collection_count", 0)),
            "search_latency_ms": metrics.get("milvus_querynode_sq_latency_ms", 0.0)
        }
        print(json.dumps(res))
        PY
    outputFiles:
      - "/tmp/milvus_health.json"

  - id: evaluate_indexing_and_memory
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.probe_milvus_metrics.outputFiles['/tmp/milvus_health.json'])).unindexed_segments > inputs.max_unindexed_segments_threshold or fromJson(read(outputs.probe_milvus_metrics.outputFiles['/tmp/milvus_health.json'])).querynode_memory_used_pct > inputs.max_querynode_memory_pct_threshold }}"
    then:
      - id: notify_slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          :warning: *Milvus Vector Database Sentinel Alert*
          *Cluster Endpoint:* `{{ inputs.milvus_endpoint }}`
          *Unindexed Segments:* `{{ fromJson(read(outputs.probe_milvus_metrics.outputFiles['/tmp/milvus_health.json'])).unindexed_segments }}` (Threshold: `{{ inputs.max_unindexed_segments_threshold }}`)
          *QueryNode RAM Usage:* `{{ fromJson(read(outputs.probe_milvus_metrics.outputFiles['/tmp/milvus_health.json'])).querynode_memory_used_pct }}%` (Threshold: `{{ inputs.max_querynode_memory_pct_threshold }}%`)
          *Active Collections:* `{{ fromJson(read(outputs.probe_milvus_metrics.outputFiles['/tmp/milvus_health.json'])).collection_count }}`
          *Search Latency:* `{{ fromJson(read(outputs.probe_milvus_metrics.outputFiles['/tmp/milvus_health.json'])).search_latency_ms }} ms`
          *Action Required:* Trigger manual segment compaction or index build on growing segments, or scale QueryNode memory capacity.

  - id: record_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "Milvus vector database audit completed for {{ inputs.milvus_endpoint }}. Unindexed segments: {{ fromJson(read(outputs.probe_milvus_metrics.outputFiles['/tmp/milvus_health.json'])).unindexed_segments }}, QueryNode RAM: {{ fromJson(read(outputs.probe_milvus_metrics.outputFiles['/tmp/milvus_health.json'])).querynode_memory_used_pct }}%."

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      :rotating_light: *Sentinel Error: Milvus Vector Database Health Monitor*
      *Execution ID:* `{{ execution.id }}`
      *State:* `{{ execution.state.current }}`
      *Details:* Failed to reach Milvus cluster metrics endpoint at `{{ inputs.milvus_endpoint }}`.

triggers:
  - id: hourly_sentinel_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: Milvus Vector Database Segment Indexing and QueryNode Memory Sentinel
  metaTitle: Milvus Vector Database Segment Indexing Sentinel | Kestra
  shortDescription: Audits Milvus vector database clusters for unindexed growing segments and QueryNode RAM saturation to prevent search latency spikes.
  metaDescription: Audits Milvus distributed vector database cluster endpoints for unindexed growing segments and QueryNode RAM saturation to prevent search latency spikes.
  tags:
    - AI
    - Data
  subTags:
    - Vector Stores & RAG
    - Monitoring & Alerting
  ee: false
  demo: false
  description: |
    Automated sentinel flow that audits Milvus distributed vector search clusters for unindexed segment buildup and QueryNode memory saturation before vector retrieval degrades.

    ## How it works

    1. Scheduled trigger fires hourly (or on-demand) to initiate telemetry inspection.
    2. Probes Milvus cluster HTTP metrics and health endpoints (`/metrics` and `/api/v1/health`).
    3. Python parser extracts unindexed growing segment count, QueryNode memory consumption percentage, and approximate ANN search latency.
    4. An `io.kestra.plugin.core.flow.If` condition checks if unindexed segments or RAM utilization cross configured operational thresholds.
    5. Dispatches formatted Slack alerts containing actionable metrics if an anomaly is detected.
    6. Dedicated `errors` handler captures connection timeouts and network unreachable errors.

    ## What you get

    - Early detection of unindexed segments that cause brute-force fallback and degrade RAG search latency.
    - Proactive QueryNode out-of-memory prevention before Linux OOM killers terminate indexing workers.
    - Automated audit trail recorded in Kestra execution artifacts for GenAI platform compliance.

    ## Who it's for

    - GenAI Platform Engineers and MLOps teams managing large-scale Milvus vector retrieval clusters.
    - SREs responsible for LLM semantic search latency and vector embedding index freshness.

    ## Why orchestrate this with Kestra

    - Declarative vector database monitoring without deploying heavy third-party monitoring daemons.
    - Centralized secret management for vector store API keys via `{{ secret('MILVUS_API_KEY') }}`.
    - Seamless alerting and automated remediation pipeline integration in declarative YAML workflows.

    ## Prerequisites

    - Network route from Kestra worker to Milvus HTTP metrics port 9091.
    - Configured secrets in Kestra namespace.

    ### Secrets

    - `MILVUS_API_KEY`: API token for authenticated Milvus clusters (if authentication is enabled).
    - `SLACK_WEBHOOK`: Incoming webhook URL for operational alerts.

    ## Quick start

    1. Deploy this flow to your Kestra instance.
    2. Set `inputs.milvus_endpoint` to point to your Milvus cluster management service.
    3. Add the `SLACK_WEBHOOK` secret under the target namespace.
    4. Execute a manual test execution to verify metric collection.
    5. Enable the `hourly_sentinel_schedule` trigger for continuous monitoring.

    ## How to extend

    - Add automated index building commands or segment compaction requests inside the `then` branch.
    - Export vector collection sizes and query latencies to Prometheus or Datadog.
    - Integrate with PagerDuty for critical vector database querynode outages.

    ## Links

    - [Milvus Monitoring Architecture](https://milvus.io/docs/configure_operator.md)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
