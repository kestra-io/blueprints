    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Fluent Bit Official Documentation and Architecture Guide](https://docs.fluentbit.io/manual/)
    - [Fluent Bit Monitoring and Prometheus Metrics Reference](https://docs.fluentbit.io/manual/administration/monitoring)
    - [Fluent Bit Buffering and Storage Best Practices](https://docs.fluentbit.io/manual/administration/buffering-and-storage)
