id: sec-edgar-company-filings-delta-loader
namespace: company.data

description: |
  Ingest regulatory disclosure filings from the Securities and Exchange Commission (SEC) EDGAR
  REST submissions API across public enterprise entities, parse 10-K, 10-Q, 8-K, and insider Form 4
  filings into columnar Parquet using DuckDB, track accession cursor state in Kestra KV store,
  and trigger high-priority alerts on material Form 8-K unscheduled corporate events.

inputs:
  - id: companies
    type: JSON
    description: List of target enterprise Central Index Key (CIK) identifiers and company names to track.
    defaults: |
      [
        {"cik": "0000320193", "name": "Apple Inc."},
        {"cik": "0001018724", "name": "Amazon.com Inc."},
        {"cik": "0000789019", "name": "Microsoft Corp."},
        {"cik": "0001652044", "name": "Alphabet Inc."}
      ]

  - id: state_key
    type: STRING
    defaults: sec_edgar_latest_accession_state
    description: Kestra KV store key maintaining the latest accession number processed per CIK.

concurrency:
  limit: 1
  behavior: CANCEL

triggers:
  - id: scheduled_sec_harvest
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 21 * * 1-5"
    description: Ingest newly filed disclosures on weekday evenings after market close at 21:00 UTC.

tasks:
  - id: fetch_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_filings
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install duckdb requests
    env:
      COMPANIES: "{{ inputs.companies }}"
      LAST_STATE: "{{ outputs.fetch_state.value ?? '{}' }}"
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import requests
        import duckdb

        companies = json.loads(os.environ.get("COMPANIES", "[]"))
        state = json.loads(os.environ.get("LAST_STATE", "{}"))

        headers = {"User-Agent": "EnterpriseResearchLab contact@company.internal"}
        filings = []
        new_state = dict(state)

        for c in companies:
            cik = c.get("cik", "").zfill(10)
            cname = c.get("name", cik)
            url = f"https://data.sec.gov/submissions/CIK{cik}.json"
            try:
                resp = requests.get(url, headers=headers, timeout=25)
                if resp.status_code == 200:
                    data = resp.json()
                    recent = data.get("filings", {}).get("recent", {})
                    forms = recent.get("form", [])
                    dates = recent.get("filingDate", [])
                    accessions = recent.get("accessionNumber", [])
                    descriptions = recent.get("primaryDocDescription", [])
                    primary_docs = recent.get("primaryDocument", [])

                    n_items = min(20, len(forms))
                    last_seen_acc = state.get(cik, "")

                    for i in range(n_items):
                        acc = accessions[i]
                        if acc == last_seen_acc:
                            break
                        filings.append({
                            "cik": cik,
                            "company_name": cname,
                            "accession_number": acc,
                            "form_type": forms[i],
                            "filing_date": dates[i],
                            "primary_document": primary_docs[i] if i < len(primary_docs) else "",
                            "document_description": descriptions[i] if i < len(descriptions) else forms[i]
                        })

                    if accessions:
                        new_state[cik] = accessions[0]
            except Exception as e:
                print(f"Warning: Failed to fetch filings for CIK {cik}: {e}")

        with open("filings.json", "w", encoding="utf-8") as f:
            json.dump(filings, f)

        con = duckdb.connect()
        if filings:
            con.execute("CREATE TABLE sec_filings AS SELECT * FROM read_json_auto('filings.json')")
            con.execute("COPY sec_filings TO 'sec_filings.parquet' (FORMAT PARQUET)")
            con.execute("COPY sec_filings TO 'sec_filings.csv' (HEADER, DELIMITER ',')")

            material_8k = con.execute("""
                SELECT cik, company_name, form_type, filing_date, document_description
                FROM sec_filings
                WHERE form_type = '8-K'
            """).df().to_dict(orient="records")
        else:
            con.execute("""
                CREATE TABLE sec_filings (
                    cik VARCHAR,
                    company_name VARCHAR,
                    accession_number VARCHAR,
                    form_type VARCHAR,
                    filing_date VARCHAR,
                    primary_document VARCHAR,
                    document_description VARCHAR
                )
            """)
            con.execute("COPY sec_filings TO 'sec_filings.parquet' (FORMAT PARQUET)")
            con.execute("COPY sec_filings TO 'sec_filings.csv' (HEADER, DELIMITER ',')")
            material_8k = []

        summary = {
            "total_filings_ingested": len(filings),
            "material_8k_disclosures": len(material_8k),
            "material_disclosures": material_8k,
            "updated_state": new_state
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - sec_filings.parquet
      - sec_filings.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_filings.vars.updated_state | toJson }}"

  - id: check_material_events
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_filings.vars.material_8k_disclosures > 0 }}"
    then:
      - id: notify_material_events
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "📢 Material Corporate Event: Ingested {{ outputs.ingest_and_transform_filings.vars.material_8k_disclosures }} Form 8-K unscheduled disclosure(s) from SEC EDGAR."

outputs:
  - id: filings_count
    type: INT
    value: "{{ outputs.ingest_and_transform_filings.vars.total_filings_ingested }}"
  - id: material_8k_count
    type: INT
    value: "{{ outputs.ingest_and_transform_filings.vars.material_8k_disclosures }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_filings.outputFiles['sec_filings.parquet'] }}"

extend:
  title: SEC EDGAR Corporate Filings Delta Loader with DuckDB
  metaTitle: SEC EDGAR Filings Delta Loader | Kestra
  shortDescription: Ingests SEC EDGAR regulatory disclosure filings (10-K, 10-Q, 8-K) into analytical Parquet format via DuckDB with material event alerts.
  metaDescription: Ingest SEC EDGAR corporate disclosures, normalize filing metadata into Parquet with DuckDB, maintain KV state, and alert on Form 8-K events.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Orchestrate automated, reliable synchronization of United States Securities and Exchange Commission (SEC)
    corporate regulatory filings directly from the official EDGAR REST API into analytical Parquet storage using DuckDB.

    ## How it works

    1. **State Recovery**: Retrieves the latest processed accession number per company from Kestra KV store (`sec_edgar_latest_accession_state`) to eliminate redundant filing imports.
    2. **EDGAR Submission Ingestion**: Queries the SEC EDGAR REST endpoint (`data.sec.gov/submissions/CIK{cik}.json`) across configured public enterprise CIK entities.
    3. **DuckDB Lakehouse Modeling**: Formats raw disclosure metadata (form types, filing dates, accession codes, document descriptions) into relational schemas inside an isolated Docker container.
    4. **Analytical Lake Export**: Exports normalized filing records to columnar Parquet and CSV dataset files ready for quantitative financial research.
    5. **Material Event Triage**: Flags unscheduled Form 8-K corporate event disclosures and commits the newest accession numbers to Kestra KV store.

    ## What you get

    - Automated recurring ingestion of federal regulatory filings directly from the official EDGAR public data API.
    - Columnar Parquet datasets structured for equity research, competitor tracking, and compliance audits.
    - Built-in KV state management guaranteeing idempotent incremental execution without external databases.

    ## Who it's for

    - Financial quantitative analysts and hedge fund data engineers tracking corporate filing timing.
    - Corporate legal, governance, and compliance teams monitoring partner and competitor disclosures.
    - Analytics Engineers building regulatory lakehouses.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains cursor state across runs without external database infrastructure.
    - Ephemeral Docker runner keeps ingestion dependencies completely isolated and reproducible.
    - Declarative flow control provides transparent logging, automated error handling, and weekday scheduling.

    ## Prerequisites

    - Docker runtime configured for Kestra task runners.
    - Outbound internet access to `data.sec.gov`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for forwarding material 8-K corporate filing notifications.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Provide your target company CIK codes in the `companies` input JSON.
    3. Click **Execute** to run an on-demand regulatory harvest.
    4. Enable the `scheduled_sec_harvest` trigger for automated weekday post-market synchronization.

    ## How to extend

    - Add an S3, Google Cloud Storage, or Snowflake upload task to store historical filing datasets.
    - Connect an LLM summarization task to analyze Item 1.01 or Item 2.01 sections of incoming Form 8-Ks.

    ## Links

    - [SEC EDGAR API Developer Guide](https://www.sec.gov/edgar/sec-api-documentation)
    - [DuckDB Parquet Export Documentation](https://duckdb.org/docs/data/parquet/overview.html)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
