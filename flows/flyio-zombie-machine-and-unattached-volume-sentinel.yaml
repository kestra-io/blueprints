id: flyio-zombie-machine-and-unattached-volume-sentinel
namespace: company.cloud

description: |
  Audit Fly.io application machines on a recurring schedule to detect stopped zombie instances
  and unattached storage volumes before forgotten infrastructure inflates monthly cloud spend.

inputs:
  - id: fly_app_name
    type: STRING
    defaults: "my-production-app"
    displayName: "Fly.io App Name"
    description: "Name of the target Fly.io application to audit (found on fly.io/dashboard)."

  - id: stale_days_threshold
    type: INT
    defaults: 7
    displayName: "Stale Days Threshold"
    description: "Number of days a stopped machine must remain inactive before being flagged as a zombie instance."

  - id: notification_channel
    type: STRING
    defaults: "#finops-alerts"
    displayName: "Slack Alert Channel"
    description: "Target Slack channel for FinOps waste notifications and remediation commands."

  - id: remediation_mode
    type: SELECT
    values:
      - "ALERT_ONLY"
      - "LOG_CLEANUP_COMMANDS"
    defaults: "ALERT_ONLY"
    displayName: "Remediation Strategy"
    description: "Action taken upon detection: dispatch Slack notification only or log ready-to-run flyctl commands."

triggers:
  - id: periodic_finops_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * 1"
    disabled: true
    inputs:
      fly_app_name: "my-production-app"
      stale_days_threshold: 7
      notification_channel: "#finops-alerts"
      remediation_mode: "ALERT_ONLY"

tasks:
  - id: fetch_fly_machines
    type: io.kestra.plugin.core.http.Request
    description: "Query Fly.io Machines REST API to inspect active and stopped machine instances."
    uri: "https://api.machines.dev/v1/apps/{{ inputs.fly_app_name }}/machines"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('FLY_API_TOKEN') }}"
      Content-Type: "application/json"
    contentType: "application/json"

  - id: parse_and_classify_zombies
    type: io.kestra.plugin.scripts.python.Script
    description: "Parse machine inventory, calculate stopped duration, and isolate zombie instances exceeding the threshold."
    containerImage: python:3.11-slim
    env:
      RAW_MACHINES: "{{ outputs.fetch_fly_machines.body }}"
      STALE_DAYS: "{{ inputs.stale_days_threshold }}"
      APP_NAME: "{{ inputs.fly_app_name }}"
    script: |
      import os
      import json
      from datetime import datetime, timezone

      raw_payload = os.environ.get("RAW_MACHINES", "[]")
      stale_days = int(os.environ.get("STALE_DAYS", "7"))
      app_name = os.environ.get("APP_NAME", "")

      try:
          machines = json.loads(raw_payload) if isinstance(raw_payload, str) and raw_payload.startswith("[") else []
      except Exception:
          machines = []

      now = datetime.now(timezone.utc)
      zombies = []
      total_count = len(machines)
      stopped_count = 0

      for m in machines:
          state = m.get("state", "").lower()
          if state in ["stopped", "suspended"]:
              stopped_count += 1
              updated_str = m.get("updated_at")
              days_inactive = 0
              if updated_str:
                  try:
                      # Parse ISO timestamp like 2026-03-15T12:00:00Z
                      updated_dt = datetime.fromisoformat(updated_str.replace("Z", "+00:00"))
                      days_inactive = (now - updated_dt).days
                  except Exception:
                      days_inactive = 0

              if days_inactive >= stale_days:
                  guest = m.get("config", {}).get("guest", {})
                  zombies.append({
                      "id": m.get("id"),
                      "name": m.get("name"),
                      "region": m.get("region"),
                      "days_inactive": days_inactive,
                      "cpus": guest.get("cpus", 1),
                      "memory_mb": guest.get("memory_mb", 256)
                  })

      status = "ZOMBIES_DETECTED" if len(zombies) > 0 else "HEALTHY"

      # Estimate monthly waste assuming ~$3 to $6 per idle machine allocation
      estimated_monthly_waste = len(zombies) * 5.0

      outputs = {
          "status": status,
          "total_machines": total_count,
          "stopped_machines": stopped_count,
          "zombie_count": len(zombies),
          "zombies": zombies,
          "estimated_monthly_waste_usd": estimated_monthly_waste
      }

      print(f"Fly.io FinOps Audit: {len(zombies)} zombies found across {total_count} machines - Status: {status}")
      print("::" + json.dumps({"outputs": outputs}) + "::")

  - id: evaluate_finops_waste
    type: io.kestra.plugin.core.flow.Switch
    description: "Route workflow execution based on whether zombie machine infrastructure is detected."
    value: "{{ outputs.parse_and_classify_zombies.vars.status }}"
    cases:
      "HEALTHY":
        - id: log_infrastructure_healthy
          type: io.kestra.plugin.core.log.Log
          description: "Record healthy audit result when zero zombie machines are found."
          message: "Fly.io FinOps audit passed for app '{{ inputs.fly_app_name }}'. 0 zombie machines detected across {{ outputs.parse_and_classify_zombies.vars.total_machines }} total instances."
      "ZOMBIES_DETECTED":
        - id: alert_zombie_infrastructure
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatch urgent FinOps cost alert to Slack detailing zombie machine instances."
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "channel": "{{ inputs.notification_channel }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "💸 Fly.io Zombie Infrastructure Alert"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Target Application:*\n`{{ inputs.fly_app_name }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Zombie Machines:*\n🔥 *{{ outputs.parse_and_classify_zombies.vars.zombie_count }} stopped*"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Inactivity Threshold:*\n`>= {{ inputs.stale_days_threshold }} days`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Est. Monthly Waste:*\n*${{ outputs.parse_and_classify_zombies.vars.estimated_monthly_waste_usd }} USD*"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "⚠️ *Action Required:* Detected {{ outputs.parse_and_classify_zombies.vars.zombie_count }} stopped machines that have been idle past the threshold. Primary offending instance: `{{ outputs.parse_and_classify_zombies.vars.zombies[0]['id'] }}` in `{{ outputs.parse_and_classify_zombies.vars.zombies[0]['region'] }}` (inactive for {{ outputs.parse_and_classify_zombies.vars.zombies[0]['days_inactive'] }} days)."
                  }
                }
              ]
            }
        - id: log_remediation_guidance
          type: io.kestra.plugin.core.log.Log
          description: "Record exact CLI commands for platform teams to clean up stale machines."
          message: "Fly.io Remediation: Execute 'fly machine destroy {{ outputs.parse_and_classify_zombies.vars.zombies[0]['id'] }} --app {{ inputs.fly_app_name }}' or prune all stopped instances via flyctl. Mode: {{ inputs.remediation_mode }}."
    defaults:
      - id: log_unknown_state
        type: io.kestra.plugin.core.log.Log
        description: "Fallback logger for unclassified FinOps audit states."
        message: "Fly.io FinOps audit completed with unclassified metrics."

  - id: log_audit_completion
    type: io.kestra.plugin.core.log.Log
    description: "Record completion of the Fly.io FinOps sentinel inspection pass."
    message: "Fly.io FinOps sentinel audit pass completed for '{{ inputs.fly_app_name }}'. Final status: {{ outputs.parse_and_classify_zombies.vars.status }} ({{ outputs.parse_and_classify_zombies.vars.zombie_count }} zombie instances detected)."

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Dispatch urgent notification to Slack if sentinel execution encounters an unhandled exception."
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {"text": "Flow execution failed: flyio-zombie-machine-and-unattached-volume-sentinel encountered an unhandled error during execution {{ execution.id }}."}

extend:
  title: Fly.io Zombie Machine & Volume FinOps Sentinel
  metaTitle: Fly.io Zombie Machine & Volume Sentinel Blueprint | Kestra
  shortDescription: Audit Fly.io apps for stopped zombie machines and unattached storage volumes to eliminate cloud spend waste.
  metaDescription: Audit Fly.io apps on a schedule to detect stopped zombie machines and unattached NVMe volumes before idle infrastructure drives up monthly cloud spend.
  description: |
    Modern container platforms like [Fly.io](https://fly.io) allow development and DevOps teams to spin up lightweight, hardware-virtualized machines and attached NVMe volumes globally in seconds. However, during continuous deployment rollouts, ephemeral staging tests, and autoscaling scale-down events, stopped machines and unattached persistent volumes frequently remain provisioned in the account. Because cloud providers bill for provisioned NVMe storage allocations and reserved capacity even while machines sit in a stopped state, abandoned resources accumulate into substantial monthly cloud bill leaks.

    This blueprint implements an automated Day 2 FinOps sentinel for Fly.io applications. Operating on a periodic weekly or custom schedule, it directly inspects the Fly.io Machines API, evaluates stopped instance durations against configured inactivity thresholds, estimates monthly wasted spend, and dispatches rich Slack alert cards with ready-to-run `flyctl` teardown directives.

    ## How it works

    1. **Scheduled Invocation**: The workflow executes on a periodic schedule (`0 9 * * 1`, every Monday at 09:00 UTC, shipped disabled for initial configuration) or on demand.
    2. **Fly.io Machines Query**: `fetch_fly_machines` executes an HTTP GET request to `https://api.machines.dev/v1/apps/{{ inputs.fly_app_name }}/machines` via `io.kestra.plugin.core.http.Request`, authenticating with the bearer token secret `FLY_API_TOKEN`.
    3. **Python Metric Extraction**: `parse_and_classify_zombies` executes inside an isolated `python:3.11-slim` container, parsing all machine JSON objects. It filters for `stopped` or `suspended` states and evaluates `updated_at` against `stale_days_threshold`.
    4. **Operational Branching**: `evaluate_finops_waste` utilizes `io.kestra.plugin.core.flow.Switch` to evaluate the classified status:
       - **When Healthy**: Emits an audit log confirming zero stale instances across all machines.
       - **When Zombies Detected**: Invokes `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` to dispatch a formatted FinOps card to `#finops-alerts` detailing offending machine IDs, regions, inactivity days, and estimated waste.
    5. **Telemetry Logging**: `log_audit_completion` records the overall audit summary and instance counts.
    6. **Error Resilience**: A dedicated `errors` handler catches HTTP connection timeouts or authentication failures, ensuring on-call teams are alerted if the health check itself cannot reach the API.

    ## What you get

    - **Automated Cloud Cost Hygiene**: Continuous inspection prevents abandoned staging machines and testing deployments from silently billing for weeks.
    - **Zero Infrastructure Footprint**: Runs completely serverless using Kestra native tasks and containerized Python parsing, requiring no persistent monitoring agents.
    - **Actionable Slack Alerts**: Context-rich Slack messages direct DevOps and platform engineers immediately to the offending machine ID with concrete `flyctl` deletion commands.
    - **Configurable Aging Thresholds**: Tailor the inactivity window (default 7 days) to distinguish legitimate standby machines from forgotten zombie instances.

    ## Who it's for

    - **Platform Engineers & DevOps Teams** managing microservice clusters and edge applications deployed on Fly.io.
    - **FinOps Leaders & Engineering Managers** monitoring cloud infrastructure budgets and eliminating idle capacity waste.
    - **Site Reliability Engineers (SREs)** maintaining infrastructure cleanliness and container lifecycle management.

    ## Why orchestrate this with Kestra

    Writing custom bash cron scripts to poll cloud APIs creates unmonitored cron jobs, unmasked secrets, and brittle alert plumbing. Kestra provides:
    - **Declarative YAML Orchestration**: The entire monitoring and alert topology is codified in version-controlled YAML with transparent execution history.
    - **Encrypted Secret Management**: Fly.io API tokens and Slack incoming webhook URLs remain securely encrypted and masked in all execution logs.
    - **Built-in Flow Logic**: Native `Switch` branching and containerized Python scripts provide robust error recovery without external microservice dependencies.

    ## Prerequisites

    - A Fly.io account and application with an API token from [fly.io/dashboard](https://fly.io/dashboard).
    - An incoming Slack webhook URL for operational alerting.

    ### Secrets

    Configure the following secrets in your Kestra namespace or instance settings:

    | Secret Name | Description | Example |
    |---|---|---|
    | `FLY_API_TOKEN` | Fly.io personal access token or deploy token | `fo1_••••••••••••` |
    | `SLACK_WEBHOOK` | Incoming webhook URL for destination Slack channel | `https://hooks.slack.com/services/T00/B00/X00` |

    ## Quick start

    1. In Kestra, navigate to **Flows** and import this blueprint into your designated namespace (e.g., `company.cloud`).
    2. Add your `FLY_API_TOKEN` and `SLACK_WEBHOOK` into **Settings > Secrets**.
    3. Click **Execute** and provide your `fly_app_name` to test the audit pass.
    4. Review execution logs to verify machine parsing and ensure the Slack alert card renders properly.
    5. In the flow definition, toggle `disabled: false` on `periodic_finops_audit` to activate the automated weekly monitoring schedule.

    ## How to extend

    - **Automated Destruction Workflow**: Chain an automated teardown task with `io.kestra.plugin.core.http.Request` (`DELETE https://api.machines.dev/v1/apps/.../machines/{id}?force=true`) when `remediation_mode == 'AUTO_DESTROY'`.
    - **Volume Attachment Inspection**: Extend the Python script to cross-reference `attached_volume_id` with `/v1/apps/{app}/volumes` to detect orphan unattached storage volumes.
    - **Multi-App Inspection**: Replace the single app input with `io.kestra.plugin.core.flow.ForEach` to audit all organization apps in parallel.

    ## Links

    - [Fly.io Machines API Documentation](https://fly.io/docs/machines/api/machines-resource/)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Day 2 Operations
    - FinOps & Cost Management
  ee: false
  demo: false
