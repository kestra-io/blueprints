id: helm-release-unhealthy-status-sentinel
namespace: company.team
description: Audits Kubernetes namespaces for failed, stuck, or drifted Helm chart releases.

inputs:
  - id: target_namespace
    type: STRING
    defaults: "default"
    description: Kubernetes namespace to audit for failed Helm releases.

  - id: kubeconfig_secret_name
    type: STRING
    defaults: "KUBECONFIG_DATA"
    description: Secret containing base64-encoded Kubeconfig credentials.

tasks:
  - id: inspect_helm_releases
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    description: Connect to Kubernetes cluster and check Helm releases in target namespace
    env:
      KUBECONFIG_DATA: "{{ secret(inputs.kubeconfig_secret_name) }}"
      TARGET_NAMESPACE: "{{ inputs.target_namespace }}"
    commands:
      - |
        mkdir -p ~/.kube
        echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config
        helm list -n "$TARGET_NAMESPACE" -o json > helm_releases.json
        jq '[.[] | select(.status | test("failed|pending-install|pending-upgrade|pending-rollback|uninstalling"))] | {is_breach: (length > 0), failed_count: length, failed_names: ([.[].name] | join(", "))}' helm_releases.json > helm_summary.json
    outputFiles:
      - helm_summary.json

  - id: evaluate_release_health
    type: io.kestra.plugin.core.flow.If
    description: Alert platform team if any unhealthy Helm releases are detected
    condition: "{{ fromJson(read(outputs.inspect_helm_releases.outputFiles['helm_summary.json'])).is_breach == true }}"
    then:
      - id: notify_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#k8s-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Helm Release Failure Alert",
                "text": "Detected {{ fromJson(read(outputs.inspect_helm_releases.outputFiles['helm_summary.json'])).failed_count }} unhealthy Helm release(s) in namespace {{ inputs.target_namespace }}. Affected Releases: {{ fromJson(read(outputs.inspect_helm_releases.outputFiles['helm_summary.json'])).failed_names }}.",
                "footer": "Kestra Kubernetes Sentinel • Helm"
              }
            ]
          }

outputs:
  - id: is_breach
    type: BOOLEAN
    value: "{{ fromJson(read(outputs.inspect_helm_releases.outputFiles['helm_summary.json'])).is_breach }}"
  - id: failed_count
    type: INT
    value: "{{ fromJson(read(outputs.inspect_helm_releases.outputFiles['helm_summary.json'])).failed_count }}"
  - id: failed_names
    type: STRING
    value: "{{ fromJson(read(outputs.inspect_helm_releases.outputFiles['helm_summary.json'])).failed_names }}"

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#k8s-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Helm Sentinel Failure",
            "text": "Failed to inspect Helm releases in namespace {{ inputs.target_namespace }} on execution `{{ execution.id }}`.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: Audits Kubernetes namespaces for failed, stuck, or drifted Helm chart releases.
  metaTitle: Helm Release Unhealthy Status and Upgrade Drift Sentinel with Kestra
  title: Helm Release Unhealthy Status and Upgrade Drift Sentinel
  shortDescription: Audits Kubernetes namespaces for failed, stuck, or drifted Helm chart releases.
  description: |
    ## How it works
    This workflow connects to a Kubernetes cluster using configured Kubeconfig credentials and executes `helm list -o json` to inspect the release status of all deployed charts in a designated namespace. When deployment hooks fail, manifest schemas are rejected by the API server, or readiness probes time out during rolling upgrades, Helm marks the release status as `failed`, `pending-install`, or `pending-upgrade`. In this state, subsequent Helm deployments are blocked. This sentinel audits release statuses and alerts platform teams before manual rollback windows expire.

    ## What you get
    - Real-time detection of failed and stuck Helm deployments.
    - Protection against blocked CI/CD continuous deployment queues.
    - Actionable Slack notifications detailing failing release names and status.

    ## Who it's for
    - Kubernetes Platform Engineers managing Helm-based software packaging.
    - DevOps Teams operating continuous delivery pipelines.
    - Site Reliability Engineers ensuring application rollout reliability.

    ## Prerequisites
    - Base64-encoded Kubeconfig stored in secret `KUBECONFIG_DATA`.
    - Slack incoming webhook configured in `SLACK_WEBHOOK_URL` secret.
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Infrastructure Automation
  ee: false
  demo: false
