id: production_sre_command_center
title: Production SRE & Data Pipeline Incident Command Center
description: Centralized executive operations dashboard tracking cluster-wide workflow SLAs, success ratios, duration spikes, error log surges, and hanging in-progress executions.

timeWindow:
  default: P14D
  max: P365D

charts:
  - id: kpi_success_percentage
    type: io.kestra.plugin.core.dashboard.chart.KPI
    chartOptions:
      displayName: Success Ratio
      description: Percentage of all flow executions completing in SUCCESS state across the cluster.
      numberType: PERCENTAGE
      width: 4
    data:
      type: io.kestra.plugin.core.dashboard.data.ExecutionsKPI
      columns:
        field: FLOW_ID
        agg: COUNT
      numerator:
        - field: STATE
          type: IN
          values:
            - SUCCESS

  - id: kpi_failure_percentage
    type: io.kestra.plugin.core.dashboard.chart.KPI
    chartOptions:
      displayName: Incident Ratio
      description: Percentage of executions terminating in FAILED or KILLED state requiring SRE triage.
      numberType: PERCENTAGE
      width: 4
    data:
      type: io.kestra.plugin.core.dashboard.data.ExecutionsKPI
      columns:
        field: FLOW_ID
        agg: COUNT
      numerator:
        - field: STATE
          type: IN
          values:
            - FAILED
            - KILLED

  - id: kpi_active_workflows
    type: io.kestra.plugin.core.dashboard.chart.KPI
    chartOptions:
      displayName: Active Concurrency
      description: Number of executions currently running or queued in worker queues.
      width: 4
    data:
      type: io.kestra.plugin.core.dashboard.data.ExecutionsKPI
      columns:
        field: FLOW_ID
        agg: COUNT
      numerator:
        - field: STATE
          type: IN
          values:
            - RUNNING
            - RETRYING
            - QUEUED

  - id: executions_timeseries_durations
    type: io.kestra.plugin.core.dashboard.chart.TimeSeries
    chartOptions:
      displayName: Workflow Execution Volume & Duration Trends
      description: Daily execution throughput breakdown by state alongside cumulative execution duration.
      legend:
        enabled: true
      column: date
      colorByColumn: state
    data:
      type: io.kestra.plugin.core.dashboard.data.Executions
      columns:
        date:
          field: START_DATE
          displayName: Execution Date
        state:
          field: STATE
        total:
          displayName: Executions Count
          agg: COUNT
          graphStyle: BARS
        duration:
          displayName: Cumulative Duration (Seconds)
          field: DURATION
          agg: SUM
          graphStyle: LINES

  - id: error_and_warning_logs_timeseries
    type: io.kestra.plugin.core.dashboard.chart.TimeSeries
    chartOptions:
      displayName: Error & Warning Log Anomaly Storms
      description: Real-time volume of ERROR and WARN log events emitted across all tasks to isolate failure bursts.
      legend:
        enabled: true
      column: date
      colorByColumn: level
    data:
      type: io.kestra.plugin.core.dashboard.data.Logs
      columns:
        date:
          field: DATE
          displayName: Log Timestamp
        level:
          field: LEVEL
        total:
          displayName: Total Log Events
          agg: COUNT
          graphStyle: BARS
      where:
        - field: LEVEL
          type: IN
          values:
            - ERROR
            - WARN

  - id: active_long_running_executions_table
    type: io.kestra.plugin.core.dashboard.chart.Table
    chartOptions:
      displayName: Long-Running & Zombie In-Flight Executions
      description: Live inventory of in-progress tasks sorted by longest elapsed duration to catch stuck workloads.
    data:
      type: io.kestra.plugin.core.dashboard.data.Executions
      columns:
        id:
          field: ID
          displayName: Execution ID
        namespace:
          field: NAMESPACE
          displayName: Namespace
        flowId:
          field: FLOW_ID
          displayName: Flow Name
        duration:
          field: DURATION
          displayName: Duration (s)
        state:
          field: STATE
          displayName: Status
      where:
        - field: STATE
          type: IN
          values:
            - RUNNING
            - PAUSED
            - RESTARTED
            - KILLING
            - QUEUED
            - RETRYING
      orderBy:
        - column: duration
          order: DESC

  - id: executions_by_namespace_bar
    type: io.kestra.plugin.core.dashboard.chart.Bar
    chartOptions:
      displayName: Execution Volume & Health by Namespace
      description: Total workload distribution across business domains and teams.
      legend:
        enabled: true
      column: namespace
    data:
      type: io.kestra.plugin.core.dashboard.data.Executions
      columns:
        namespace:
          field: NAMESPACE
        state:
          field: STATE
        total:
          displayName: Total Runs
          agg: COUNT

  - id: terminal_state_distribution_donut
    type: io.kestra.plugin.core.dashboard.chart.Pie
    chartOptions:
      graphStyle: DONUT
      displayName: Overall Execution State Breakdown
      description: Proportional distribution of workflow completion states across the cluster.
      legend:
        enabled: true
      colorByColumn: state
    data:
      type: io.kestra.plugin.core.dashboard.data.Executions
      columns:
        state:
          field: STATE
        total:
          agg: COUNT

extend:
  title: Production SRE & Data Pipeline Incident Command Center Dashboard
  metaTitle: Production SRE & Data Pipeline Dashboard Blueprint
  shortDescription: Executive operations dashboard tracking workflow SLAs, failure ratios, log spikes, and hanging executions.
  metaDescription: Executive operations dashboard tracking cluster-wide workflow SLAs, success ratios, duration spikes, error log surges, and hanging in-progress executions.
  description: |
    Orchestrates a comprehensive, real-time Site Reliability Engineering (SRE) and Data Operations Command Center dashboard as code using Kestra 2.0. Aggregates cluster-wide execution throughput, success/failure ratios, task duration trends, error log anomaly bursts, and in-flight hanging executions across all namespaces into a single pane of glass.

    ## Key capabilities
    - **Executive Health KPIs**: Real-time tiles displaying cluster-wide Success Ratio, Incident Failure Percentage, and Active Running Concurrency.
    - **Throughput & Latency Dual-Axis Trends**: TimeSeries visual combining daily execution volumes (bars) with cumulative duration metrics (lines) to spot silent pipeline slow-downs.
    - **Log Storm Surge Detector**: Filtered log timeseries highlighting sudden spikes in `ERROR` and `WARN` severity events to isolate transient infrastructure outages.
    - **Stuck & Zombie Workflow Catcher**: Live, duration-sorted table displaying tasks running longer than SLA ceilings (`RUNNING`, `QUEUED`, `RETRYING`, `PAUSED`).
    - **Domain Breakdown**: Cross-namespace workload distribution bars enabling platform teams to identify which department or team drives the highest failure rate.

    ## Architecture & Data Sources
    - **Executions KPI Data Source (`ExecutionsKPI`)**: Computes real-time numerator/denominator percentage ratios for cluster health.
    - **Executions TimeSeries Data Source (`Executions`)**: Aggregates execution timestamps, states, and duration metrics.
    - **Logs Data Source (`Logs`)**: Real-time log level filtering to surface error storms before user-facing impacts occur.

    ## Who it's for
    - Platform Engineers and SREs monitoring cluster stability across thousands of daily workflows.
    - Data Platform Leads tracking batch ingestion SLAs (dbt, Airbyte, Kafka, ClickHouse).
    - Incident Response Teams triaging cluster outages and runaway workloads.

    ## Why define Dashboards as Code in Kestra
    - **GitOps Versioning**: Store monitoring views alongside workflow definitions in version control with code reviews and history.
    - **Zero External Overhead**: Eliminates the cost and maintenance burden of external Grafana, Datadog, or Looker licenses for orchestration metrics.
    - **Sub-Second Native Latency**: Direct internal querying of Kestra metadata catalogs without network roundtrips.
    - **Multi-Tenant Scoping**: Easily duplicated or parameterized per department, client tenant, or environment.

  tags:
    - Infrastructure
    - System
  subTags:
    - Monitoring & Alerting
    - Observability
  ee: false
  demo: false
