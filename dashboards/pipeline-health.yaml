id: pipeline_health
title: Pipeline health
description: Executions over time with per-service splits, success and failure KPIs, per-environment tables, and log counts for company.team - pairs with the dashboard-sample-data-seeder flow.
timeWindow:
  default: P7D
  max: P365D

charts:
  - id: executions_timeseries
    type: io.kestra.plugin.core.dashboard.chart.TimeSeries
    chartOptions:
      displayName: Executions over time
      description: Sample executions per service, colored by state
      tooltip: ALL
      legend:
        enabled: true
      column: date
      colorByColumn: state
    data:
      type: io.kestra.plugin.core.dashboard.data.Executions
      columns:
        date:
          field: START_DATE
          displayName: Date
        service:
          field: LABELS
          labelKey: service
        state:
          field: STATE
        duration:
          displayName: Duration
          field: DURATION
          agg: SUM
          graphStyle: LINES
        total:
          displayName: Executions
          agg: COUNT
          graphStyle: BARS
      where:
        - field: NAMESPACE
          type: EQUAL_TO
          value: company.team

  - id: kpi_success_percentage
    type: io.kestra.plugin.core.dashboard.chart.KPI
    chartOptions:
      displayName: Success Ratio
      numberType: PERCENTAGE
      width: 3
    data:
      type: io.kestra.plugin.core.dashboard.data.ExecutionsKPI
      columns:
        field: FLOW_ID
        agg: COUNT
      numerator:
        - field: STATE
          type: IN
          values:
            - SUCCESS
      where:
        - field: NAMESPACE
          type: EQUAL_TO
          value: company.team

  - id: kpi_failure_percentage
    type: io.kestra.plugin.core.dashboard.chart.KPI
    chartOptions:
      displayName: Failure Ratio
      numberType: PERCENTAGE
      width: 3
    data:
      type: io.kestra.plugin.core.dashboard.data.ExecutionsKPI
      columns:
        field: FLOW_ID
        agg: COUNT
      numerator:
        - field: STATE
          type: IN
          values:
            - FAILED
      where:
        - field: NAMESPACE
          type: EQUAL_TO
          value: company.team

  - id: table_samples
    type: io.kestra.plugin.core.dashboard.chart.Table
    chartOptions:
      displayName: Seeded executions per service, environment and state
    data:
      type: io.kestra.plugin.core.dashboard.data.Executions
      columns:
        date:
          field: START_DATE
          displayName: Date
        service:
          field: LABELS
          labelKey: service
        environment:
          field: LABELS
          labelKey: environment
        state:
          field: STATE
        duration:
          displayName: Duration
          field: DURATION
          agg: SUM
        total:
          displayName: Executions
          agg: COUNT
      where:
        - field: NAMESPACE
          type: EQUAL_TO
          value: company.team
      orderBy:
        - column: date
          order: DESC

  - id: table_logs
    type: io.kestra.plugin.core.dashboard.chart.Table
    chartOptions:
      displayName: Log count by level
    data:
      type: io.kestra.plugin.core.dashboard.data.Logs
      columns:
        level:
          field: LEVEL
        count:
          agg: COUNT
      where:
        - field: NAMESPACE
          type: EQUAL_TO
          value: company.team

extend:
  shortDescription: "Pipeline health dashboard: executions over time per service, success and failure KPIs, per-environment tables, and log counts - pairs with the sample data seeder flow."
  title: Pipeline Health Dashboard with Per-Service Splits and State KPIs
  description: |
    A dashboard blueprint is only as convincing as the data behind it. This
    pipeline-health dashboard charts executions over time split by the
    `service` execution label and colored by state, shows success and
    failure percentage KPIs, lists seeded executions per service and
    environment with durations, and counts log lines by level - all scoped
    to the `company.team` namespace.

    **How to populate it:** deploy it together with the
    `dashboard-sample-data-seeder` flow (see `flows/`), execute the seeder
    once, and the charts light up with a realistic mix of passing and
    failing sample executions labeled `service` and `environment`. Every
    chart's `where` clause is a namespace filter you can point at your own
    tree, and each chart follows the same `Executions` / `ExecutionsKPI` /
    `Logs` data-source pattern used by the built-in dashboard blueprints,
    so extending it is copy-and-edit work.

    This blueprint has been created by [RudraMalvankar](https://github.com/RudraMalvankar)
  tags:
    - Getting Started
  ee: false
  demo: false
  metaDescription: "Kestra pipeline health dashboard: executions per service over time, success and failure KPIs, per-environment tables, and log counts."
