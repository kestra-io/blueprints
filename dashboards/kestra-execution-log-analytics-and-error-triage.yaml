id: execution_log_analytics_and_error_triage
title: Execution Log Analytics & Error Triage
description: Real-time monitoring of execution log severity distributions, error density ratios, top noisy flows, and live incident triage streams
timeWindow:
  default: P7D
  max: P365D

charts:
  - id: kpi_error_log_density
    type: io.kestra.plugin.core.dashboard.chart.KPI
    chartOptions:
      displayName: Error Log Density
      description: Percentage of all emitted log events that are at ERROR severity. Compare against your own baseline to detect anomalous error spikes.
      numberType: PERCENTAGE
      width: 6
    data:
      type: io.kestra.plugin.core.dashboard.data.LogsKPI
      columns:
        field: LEVEL
        agg: COUNT
      numerator:
        - field: LEVEL
          type: EQUAL_TO
          value: ERROR

  - id: kpi_warn_log_density
    type: io.kestra.plugin.core.dashboard.chart.KPI
    chartOptions:
      displayName: Warning Log Density
      description: Percentage of log events at WARN severity. Compare against your own baseline to monitor potential degradation before hard pipeline failures occur.
      numberType: PERCENTAGE
      width: 6
    data:
      type: io.kestra.plugin.core.dashboard.data.LogsKPI
      columns:
        field: LEVEL
        agg: COUNT
      numerator:
        - field: LEVEL
          type: EQUAL_TO
          value: WARN

  - id: errors_over_time_by_flow
    type: io.kestra.plugin.core.dashboard.chart.TimeSeries
    chartOptions:
      displayName: Error and Warning Incidents Over Time
      description: Chronological volume of ERROR and WARN logs broken down by flow. Compare against your own baseline to identify when incidents started and which flows were impacted.
      legend:
        enabled: true
      column: date
      colorByColumn: flowId
    data:
      type: io.kestra.plugin.core.dashboard.data.Logs
      columns:
        date:
          field: DATE
          displayName: Timestamp
        flowId:
          field: FLOW_ID
          displayName: Flow
        total:
          displayName: Incident Logs
          agg: COUNT
          graphStyle: BARS
      where:
        - field: LEVEL
          type: IN
          values:
            - ERROR
            - WARN

  - id: errors_by_flow_bar
    type: io.kestra.plugin.core.dashboard.chart.Bar
    chartOptions:
      displayName: Error Log Count by Flow
      description: Ranking of flows generating the highest count of ERROR log lines. Compare against your own baseline to isolate flows driving platform instability.
      legend:
        enabled: false
      column: flowId
    data:
      type: io.kestra.plugin.core.dashboard.data.Logs
      columns:
        flowId:
          field: FLOW_ID
          displayName: Flow ID
        total:
          field: LEVEL
          displayName: Error Count
          agg: COUNT
      where:
        - field: LEVEL
          type: EQUAL_TO
          value: ERROR
      orderBy:
        - column: total
          order: DESC

  - id: top_noisy_flows_bar
    type: io.kestra.plugin.core.dashboard.chart.Bar
    chartOptions:
      displayName: Top Noisy Flows (Total Log Volume)
      description: Flows generating the highest aggregate volume of log lines across all severities. Compare against your own baseline to detect runaway verbosity or tight polling loops.
      legend:
        enabled: true
      column: flowId
      colorByColumn: level
    data:
      type: io.kestra.plugin.core.dashboard.data.Logs
      columns:
        flowId:
          field: FLOW_ID
          displayName: Flow ID
        level:
          field: LEVEL
        total:
          displayName: Log Entries
          agg: COUNT
      orderBy:
        - column: total
          order: DESC

  - id: recent_error_warn_logs_table
    type: io.kestra.plugin.core.dashboard.chart.Table
    chartOptions:
      displayName: Recent Incident Triage Log Stream
      description: Real-time stream of latest ERROR and WARN log entries across all namespaces. Inspect message, task, and flow details for active incident triage.
    data:
      type: io.kestra.plugin.core.dashboard.data.Logs
      columns:
        date:
          field: DATE
          displayName: Timestamp
        level:
          field: LEVEL
          displayName: Severity
        namespace:
          field: NAMESPACE
          displayName: Namespace
        flowId:
          field: FLOW_ID
          displayName: Flow
        taskId:
          field: TASK_ID
          displayName: Task
        message:
          field: MESSAGE
          displayName: Message
      where:
        - field: LEVEL
          type: IN
          values:
            - ERROR
            - WARN
      orderBy:
        - column: date
          order: DESC

extend:
  title: Execution Log Analytics and Error Triage Dashboard
  metaTitle: Kestra Execution Log Analytics and Error Triage Dashboard
  shortDescription: Real-time dashboard for log severity trends, error density KPIs, noisy flow detection, and incident triage
  description: |
    Comprehensive log-centric operational dashboard for platform engineers, SREs, and workflow authors. 
    Unlike default execution-state dashboards, this dashboard is purpose-built around Kestra's `Logs` and `LogsKPI` 
    telemetry data sources to provide deep visibility into runtime logging behavior.

    Key capabilities:
    - **Error & Warning Density KPIs**: Monitor the proportion of problematic log events relative to overall cluster throughput using `io.kestra.plugin.core.dashboard.data.LogsKPI`.
    - **Incident Timeline**: Track chronological bursts of ERROR and WARN logs per flow with `io.kestra.plugin.core.dashboard.chart.TimeSeries`.
    - **Top Error Generators**: Isolate which workflows emit the most failure events using ranked Bar charts.
    - **Noisy Flow Detection**: Identify flows with excessive verbosity or tight polling loops causing storage bloat.
    - **Live Incident Triage Stream**: Inspect real-time error and warning log messages, task IDs, and namespaces in a consolidated Table.

    Prerequisites:
      - None. Runs out-of-the-box on open-source Kestra without external databases or services.
    Quick start:
      1. Add this dashboard YAML to your Kestra instance under the Dashboards menu.
      2. Set your desired time window (defaults to past 7 days).
      3. Drill down into specific namespaces or flows using the built-in filters.

    Warning:
      The incident triage table displays raw log messages emitted by task executions, which may contain sensitive runtime details. Ensure workflows do not output unredacted credentials or confidential payloads into logs.
  tags:
    - Core
    - System
  ee: false
  demo: false
  metaDescription: Real-time Kestra dashboard for execution log analytics, error density KPIs, noisy flow detection, and incident triage.
