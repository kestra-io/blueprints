id: upstash-vector-index-dimension-and-capacity-sentinel
namespace: company.dataops

extend:
  title: Upstash Vector Serverless Index Dimension & Capacity Sentinel
  metaTitle: Upstash Vector Index Dimension & Capacity Sentinel
  shortDescription: Monitor Upstash Vector serverless index dimension, vector count, and daily read/write rate limit quotas with Slack and dead-letter alerting.
  metaDescription: Monitor Upstash Vector serverless index dimension, vector count, and daily request rate limit quotas with Slack notifications and fallback error handling.
  description: |
    ## How it works
    1. **Fetch Index Metadata**: Queries Upstash Vector REST API `/info` endpoint using `io.kestra.plugin.core.http.Request` with exponential retry policies.
    2. **Evaluate Capacity and Dimensions**: Parses vector count, pending vectors, dimension size, and index similarity metric.
    3. **Threshold Gate**: Evaluates whether active vector count or pending vector backlog exceeds defined operational thresholds using `io.kestra.plugin.core.flow.If`.
    4. **Slack Notification**: Posts rich Slack markdown diagnostic messages with metric breakdowns when thresholds are breached.
    5. **Dual-Layer Error Handling**: Flow-level `errors` block catches network partitions, unauthorized tokens, or API downtime and routes emergency alerts.

    ## What you get
    - Real-time observability for serverless vector indexes powering LLM semantic search.
    - Early warnings before reaching vector tier limits or experiencing vector indexing lag.
    - Zero-downtime integration without maintaining custom cron worker daemons.

    ## Who it's for
    - AI engineers building LLM RAG pipelines on Upstash Serverless Vector.
    - SRE and platform teams enforcing vector database capacity bounds.
    - FinOps teams monitoring serverless API quotas.

    ## Why orchestrate this with Kestra
    Kestra provides a schedule-driven, declarative framework with built-in retry backoffs and flow-level dead-letter error handling. It eliminates the need for separate monitoring daemons and ensures vector infrastructure remains resilient.

    ## Prerequisites
    - An Upstash Vector index with REST API URL and Read-Only or Full-Access Token.
    - Slack Incoming Webhook for operational notifications.

    ### Secrets
    Configure the following secrets in your Kestra instance:
    - `UPSTASH_VECTOR_REST_URL`: Upstash Vector REST API base URL (e.g. `https://your-index-1234.upstash.io`).
    - `UPSTASH_VECTOR_REST_TOKEN`: Upstash Vector REST authentication bearer token.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL.

    ## Quick start
    1. Create an index in the Upstash Console.
    2. Copy the REST URL and Bearer token into your Kestra secrets.
    3. Execute or schedule the flow to monitor index health.

    ## How to extend
    - Add automated index resizing or automated webhook triggers to snapshot vectors into AWS S3 or Google Cloud Storage.
    - Integrate with PagerDuty for critical severity escalation.

    ## Links
    - [Upstash Vector Documentation](https://upstash.com/docs/vector/overall/whatisvector)
    - [Upstash Vector REST API](https://upstash.com/docs/vector/api/endpoints/info)
    - [Kestra HTTP Plugin](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
  tags:
    - AI
    - Database
    - Alert
  subTags:
    - Vector Database
    - Upstash
    - Slack
  ee: false
  demo: false

inputs:
  - id: max_vector_threshold
    type: INT
    defaults: 100000
    description: Maximum permissible vector count before dispatching capacity warning.

  - id: max_pending_threshold
    type: INT
    defaults: 500
    description: Maximum pending unindexed vectors before alerting on indexing lag.

tasks:
  - id: get_index_info
    type: io.kestra.plugin.core.http.Request
    uri: "{{ secret('UPSTASH_VECTOR_REST_URL') }}/info"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('UPSTASH_VECTOR_REST_TOKEN') }}"
      Accept: "application/json"
    contentType: application/json
    retry:
      type: constant
      interval: PT5S
      maxAttempt: 3

  - id: evaluate_vector_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(outputs.get_index_info.body).result.vectorCount > inputs.max_vector_threshold or json(outputs.get_index_info.body).result.pendingVectorCount > inputs.max_pending_threshold }}"
    then:
      - id: notify_capacity_breach
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#ai-ops-alerts",
            "username": "Upstash Vector Sentinel",
            "icon_emoji": ":warning:",
            "text": ":warning: *Upstash Vector Index Capacity Warning*\n• *Vector Count:* `{{ json(outputs.get_index_info.body).result.vectorCount }}` (Threshold: `{{ inputs.max_vector_threshold }}`)\n• *Pending Vectors:* `{{ json(outputs.get_index_info.body).result.pendingVectorCount }}` (Threshold: `{{ inputs.max_pending_threshold }}`)\n• *Dimension:* `{{ json(outputs.get_index_info.body).result.dimension }}`\n• *Similarity Metric:* `{{ json(outputs.get_index_info.body).result.similarityFunction }}`\n• *Execution ID:* `{{ flow.executionId }}`"
          }
        retry:
          type: constant
          interval: PT5S
          maxAttempt: 3
    else:
      - id: log_healthy_status
        type: io.kestra.plugin.core.log.Log
        message: "Upstash Vector Index is healthy. Current count: {{ json(outputs.get_index_info.body).result.vectorCount }} vectors, {{ json(outputs.get_index_info.body).result.pendingVectorCount }} pending vectors (dimension: {{ json(outputs.get_index_info.body).result.dimension }})."

errors:
  - id: dead_letter_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#ai-ops-alerts",
        "username": "Upstash Vector Sentinel - Failure",
        "icon_emoji": ":rotating_light:",
        "text": ":rotating_light: *CRITICAL: Upstash Vector Sentinel Execution Failed*\nFlow `{{ flow.id }}` in namespace `{{ flow.namespace }}` failed to query or parse index telemetry.\n• *Execution ID:* `{{ flow.executionId }}`\n• *Failed Task:* `{{ task.id }}`"
      }
