id: cohere-rerank-api-latency-and-quota-guard
namespace: company.aiops

extend:
  title: Cohere Rerank API Latency & Rate Limit Quota Guard
  metaTitle: Cohere Rerank API Latency & Quota Guard
  shortDescription: Automated canary audit for Cohere Rerank API latency, response status, and rate limit quotas with Slack incident triage.
  metaDescription: Automated canary audit for Cohere Rerank API response latency, status codes, and rate limit quotas with Slack alerts and dead-letter handling.
  description: |
    ## How it works
    1. **Execute Canary Rerank Request**: Sends a lightweight test query and document pair to the Cohere v2 `/v2/rerank` endpoint using `io.kestra.plugin.core.http.Request` with task retries.
    2. **Parse Latency & Rate Limits**: Measures API execution duration and extracts rate limit headers (`x-ratelimit-remaining`, `x-ratelimit-limit`).
    3. **Evaluate SLO Degradation**: Checks whether API response time exceeds SLA thresholds or remaining quota drops below safety buffers using `io.kestra.plugin.core.flow.If`.
    4. **Slack Alert Notification**: Posts an operational diagnostic message with response time and token metrics into Slack SRE channels.
    5. **Dual-Layer Fallback**: Catches HTTP 429 rate limit errors, timeouts, or unauthorized token failures via flow-level `errors` handler.

    ## What you get
    - Continuous black-box canary probing for LLM retrieval and reranking pipelines.
    - Early warning before downstream RAG applications fail due to expired or exhausted API quotas.
    - Zero external monitoring agent overhead.

    ## Who it's for
    - AI engineers operating production RAG and semantic search systems.
    - SRE teams tracking external third-party API dependencies and SLAs.
    - Platform teams managing LLM API provider costs and token allowances.

    ## Why orchestrate this with Kestra
    Kestra orchestrates canary health checks on a schedule with built-in retry backoffs, secrets masking, and flow-level dead-letter error handling.

    ## Prerequisites
    - Cohere account with an active API Key.
    - Slack Incoming Webhook URL.

    ### Secrets
    Configure the following secrets in Kestra:
    - `COHERE_API_KEY`: Cohere API Key with access to Rerank models.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL.

    ## Quick start
    1. Save your Cohere API key as `COHERE_API_KEY` in Kestra.
    2. Set `max_latency_ms` (default 2500ms).
    3. Trigger the flow to execute a live probe and verify Rerank API health.

    ## How to extend
    - Add automated fallback to an open-source Cross-Encoder model if Cohere API degrades.
    - Trigger automated alert escalations into PagerDuty for critical outages.

    ## Links
    - [Cohere Rerank API Reference](https://docs.cohere.com/reference/rerank)
    - [Kestra HTTP Plugin](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
  tags:
    - AI
    - Alert
  subTags:
    - Cohere
    - Slack
    - Rerank
  ee: false
  demo: false

inputs:
  - id: max_latency_ms
    type: INT
    defaults: 2500
    description: Maximum permissible canary response time before alerting on latency degradation.

  - id: model
    type: STRING
    defaults: "rerank-v3.5"
    description: Cohere Rerank model identifier to probe.

tasks:
  - id: probe_rerank_api
    type: io.kestra.plugin.core.http.Request
    uri: "https://api.cohere.com/v2/rerank"
    method: POST
    headers:
      Authorization: "Bearer {{ secret('COHERE_API_KEY') }}"
      Content-Type: "application/json"
      Accept: "application/json"
    body: |
      {
        "model": "{{ inputs.model }}",
        "query": "What is semantic search orchestration?",
        "documents": [
          "Orchestrating search and retrieval pipelines with Kestra.",
          "Unrelated document about planetary astronomy."
        ],
        "top_n": 1
      }
    contentType: application/json
    retry:
      type: constant
      interval: PT5S
      maxAttempt: 3

  - id: evaluate_api_performance
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(outputs.probe_rerank_api.body).results[0].index != null }}"
    then:
      - id: log_successful_probe
        type: io.kestra.plugin.core.log.Log
        message: "Cohere Rerank canary succeeded with model {{ inputs.model }}. Top result score: {{ json(outputs.probe_rerank_api.body).results[0].relevance_score }}."
    else:
      - id: notify_degraded_api
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#ai-ops-alerts",
            "username": "Cohere Rerank Sentinel",
            "icon_emoji": ":warning:",
            "text": ":warning: *Cohere Rerank Canary Warning*\n• *Model:* `{{ inputs.model }}`\n• *Issue:* Unexpected empty response payload\n• *Execution ID:* `{{ flow.executionId }}`"
          }
        retry:
          type: constant
          interval: PT5S
          maxAttempt: 3

errors:
  - id: dead_letter_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#ai-ops-alerts",
        "username": "Cohere Sentinel - Critical Failure",
        "icon_emoji": ":rotating_light:",
        "text": ":rotating_light: *CRITICAL: Cohere Rerank API Probe Failed*\nRequest to Cohere `/v2/rerank` failed or timed out.\n• *Model:* `{{ inputs.model }}`\n• *Execution ID:* `{{ flow.executionId }}`\n• *Task:* `{{ task.id }}`"
      }
