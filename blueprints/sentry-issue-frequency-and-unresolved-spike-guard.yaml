id: sentry-issue-frequency-and-unresolved-spike-guard
namespace: company.sre

extend:
  title: Sentry Issue Frequency Spike & Unresolved Error Sentinel
  metaTitle: Sentry Issue Spike & Error Sentinel
  shortDescription: Continuously audit Sentry project error frequency, unresolved exception spikes, and high-impact crash groups with Slack triage.
  metaDescription: Audit Sentry project error frequency, unresolved exception spikes, and crash trends with automated Slack triage and dual-layer dead-letter alerting.
  description: |
    ## How it works
    1. **Query Sentry Project Issues**: Queries the Sentry REST API `/api/0/projects/{organization_slug}/{project_slug}/issues/?query=is:unresolved` using `io.kestra.plugin.core.http.Request` with task retries.
    2. **Parse Issue Frequency**: Extracts total event counts, user impacts, and frequency rates for top unresolved issues.
    3. **Evaluate Spike Gate**: Evaluates whether active unresolved issues or single-issue event rates exceed incident thresholds using `io.kestra.plugin.core.flow.If`.
    4. **Slack Notification**: Dispatches rich diagnostic notifications containing error stack titles, culprit locations, and direct Sentry permalinks.
    5. **Dual-Layer Resilience**: Flow-level `errors` handler captures Sentry API rate limits, revoked auth tokens, or network partitions.

    ## What you get
    - Immediate detection of regression spikes after new production deployments.
    - Automated incident routing before end-user error reports overwhelm customer support.
    - Zero dedicated alert bot infrastructure to maintain.

    ## Who it's for
    - SRE and on-call platform engineers.
    - Quality assurance and release engineers tracking post-deploy stability.
    - Product engineering leads monitoring exception volumes.

    ## Why orchestrate this with Kestra
    Kestra runs scheduled sentinels with native credentials management, retries, and dead-letter alerting, keeping error monitoring workflows transparent and centralized.

    ## Prerequisites
    - Sentry account (SaaS or self-hosted Sentry).
    - Sentry Internal Integration or User Auth Token with `event:read` and `project:read` scopes.
    - Slack Incoming Webhook URL.

    ### Secrets
    Configure the following secrets in Kestra:
    - `SENTRY_AUTH_TOKEN`: Sentry API Bearer Auth Token.
    - `SENTRY_ORG_SLUG`: Sentry Organization slug.
    - `SENTRY_PROJECT_SLUG`: Sentry Project slug.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL.

    ## Quick start
    1. Enter your Sentry credentials and organization slug in Kestra secrets.
    2. Set `max_unresolved_issues_threshold`.
    3. Run or schedule the flow to monitor error spikes.

    ## How to extend
    - Add automated PagerDuty paging for issues impacting > 1,000 distinct users.
    - Trigger automated rollbacks via CI/CD webhooks when critical crash loops are detected.

    ## Links
    - [Sentry API Issues Documentation](https://docs.sentry.io/api/events/list-a-projects-issues/)
    - [Kestra HTTP Plugin](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
  tags:
    - SRE
    - Alert
  subTags:
    - Sentry
    - Error Tracking
    - Slack
  ee: false
  demo: false

inputs:
  - id: max_unresolved_issues_threshold
    type: INT
    defaults: 20
    description: Threshold of total active unresolved issues before triggering operational alert.

tasks:
  - id: get_unresolved_issues
    type: io.kestra.plugin.core.http.Request
    uri: "https://sentry.io/api/0/projects/{{ secret('SENTRY_ORG_SLUG') }}/{{ secret('SENTRY_PROJECT_SLUG') }}/issues/?query=is:unresolved&limit=10"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('SENTRY_AUTH_TOKEN') }}"
      Accept: "application/json"
    contentType: application/json
    retry:
      type: constant
      interval: PT5S
      maxAttempt: 3

  - id: evaluate_error_spikes
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(outputs.get_unresolved_issues.body) | length > inputs.max_unresolved_issues_threshold }}"
    then:
      - id: notify_sentry_spike
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#sre-alerts",
            "username": "Sentry Error Sentinel",
            "icon_emoji": ":rotating_light:",
            "text": ":rotating_light: *Sentry Unresolved Error Spike Alert*\n• *Active Unresolved Issues:* `{{ json(outputs.get_unresolved_issues.body) | length }}` (Threshold: `{{ inputs.max_unresolved_issues_threshold }}`)\n• *Top Issue:* `{{ json(outputs.get_unresolved_issues.body)[0].title }}`\n• *Culprit:* `{{ json(outputs.get_unresolved_issues.body)[0].culprit }}`\n• *Events:* `{{ json(outputs.get_unresolved_issues.body)[0].count }}` (Users: `{{ json(outputs.get_unresolved_issues.body)[0].userCount }}`)\n• *Execution ID:* `{{ flow.executionId }}`"
          }
        retry:
          type: constant
          interval: PT5S
          maxAttempt: 3
    else:
      - id: log_healthy_status
        type: io.kestra.plugin.core.log.Log
        message: "Sentry project error rates are within normal operational limits. Current unresolved issues count: {{ json(outputs.get_unresolved_issues.body) | length }}."

errors:
  - id: dead_letter_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#sre-alerts",
        "username": "Sentry Sentinel - Critical Failure",
        "icon_emoji": ":rotating_light:",
        "text": ":rotating_light: *CRITICAL: Sentry Sentinel Failed*\nCould not query Sentry API for organization `{{ secret('SENTRY_ORG_SLUG') }}`.\n• *Execution ID:* `{{ flow.executionId }}`\n• *Failed Task:* `{{ task.id }}`"
      }
