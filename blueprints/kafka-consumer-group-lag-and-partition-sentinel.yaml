id: kafka-consumer-group-lag-and-partition-sentinel
namespace: company.dataops

extend:
  title: Apache Kafka Consumer Group Lag & Partition Sentinel
  metaTitle: Kafka Consumer Group Lag Sentinel
  shortDescription: Monitor Apache Kafka consumer group lag and uncommitted partition offsets with automated Slack triage and dead-letter alerting.
  metaDescription: Monitor Apache Kafka consumer group lag, active partitions, and processing delays with automated Slack triage and dual-layer dead-letter alerting.
  description: |
    ## How it works
    1. **Query Consumer Group Offsets**: Uses `io.kestra.plugin.kafka.AdminClient` or Python Kafka admin library to inspect consumer group commit offsets and partition end offsets.
    2. **Calculate Total & Per-Partition Lag**: Calculates the delta between the latest topic high watermark and current consumer offsets.
    3. **Evaluate Lag Threshold**: Checks whether lag on critical event topics exceeds SLO thresholds using `io.kestra.plugin.core.flow.If`.
    4. **Slack Alert Notification**: Posts an alert with consumer group ID, impacted partitions, and total lag metrics into Slack SRE channels.
    5. **Dual-Layer Error Handling**: Flow-level `errors` handler captures broker connection drops, SASL authentication failures, or SSL handshake timeouts.

    ## What you get
    - Real-time protection against silent streaming pipeline backpressure.
    - Visibility into partition imbalances causing delayed microservice processing.
    - Zero need for standing Prometheus Burrow or third-party daemon deployments.

    ## Who it's for
    - Event-driven architects and streaming data engineers.
    - SRE and platform teams operating Kafka, Confluent Cloud, or Redpanda clusters.
    - Application teams consuming high-volume real-time event feeds.

    ## Why orchestrate this with Kestra
    Kestra runs scheduled streaming lag sentinels with native credentials management, retries, and dead-letter alerting.

    ## Prerequisites
    - Apache Kafka, Confluent Cloud, or Redpanda cluster.
    - SASL/SCRAM, SSL, or plaintext client connection credentials.
    - Slack Incoming Webhook URL.

    ### Secrets
    Configure the following secrets in Kestra:
    - `KAFKA_BOOTSTRAP_SERVERS`: Comma-separated list of Kafka broker addresses (e.g. `broker1.example.com:9092`).
    - `KAFKA_SASL_USERNAME`: SASL client username.
    - `KAFKA_SASL_PASSWORD`: SASL client password.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL.

    ## Quick start
    1. Set up your Kafka broker URL and credentials in Kestra secrets.
    2. Configure `consumer_group` and `max_lag_threshold`.
    3. Execute the flow to check consumer lag.

    ## How to extend
    - Add automated consumer horizontal pod autoscaling via Kubernetes API.
    - Route critical partition stall alerts to PagerDuty.

    ## Links
    - [Apache Kafka Documentation](https://kafka.apache.org/documentation/)
    - [Kestra Python Scripts](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Event-Driven
    - Alert
  subTags:
    - Kafka
    - Streaming
    - Slack
  ee: false
  demo: false

inputs:
  - id: consumer_group
    type: STRING
    defaults: "order-processing-consumer-group"
    description: Target Kafka consumer group identifier to audit.

  - id: max_lag_threshold
    type: INT
    defaults: 5000
    description: Maximum permissible message lag across partitions before alerting.

tasks:
  - id: check_consumer_lag
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install kafka-python-ng
    env:
      BOOTSTRAP_SERVERS: "{{ secret('KAFKA_BOOTSTRAP_SERVERS') }}"
      SASL_USERNAME: "{{ secret('KAFKA_SASL_USERNAME') }}"
      SASL_PASSWORD: "{{ secret('KAFKA_SASL_PASSWORD') }}"
      GROUP_ID: "{{ inputs.consumer_group }}"
    script: |
      import os, ssl
      from kafka import KafkaAdminClient, KafkaConsumer, TopicPartition
      from kestra import Kestra

      bootstrap_servers = os.environ["BOOTSTRAP_SERVERS"].split(",")
      group_id = os.environ["GROUP_ID"]
      sasl_user = os.environ.get("SASL_USERNAME")
      sasl_pass = os.environ.get("SASL_PASSWORD")

      client_kwargs = {
          "bootstrap_servers": bootstrap_servers,
          "request_timeout_ms": 10000,
          "connections_max_idle_ms": 30000
      }

      if sasl_user and sasl_pass:
          client_kwargs.update({
              "security_protocol": "SASL_SSL",
              "sasl_mechanism": "PLAIN",
              "sasl_plain_username": sasl_user,
              "sasl_plain_password": sasl_pass
          })

      admin = KafkaAdminClient(**client_kwargs)
      consumer = KafkaConsumer(group_id=group_id, **client_kwargs)

      committed_offsets = admin.list_consumer_group_offsets(group_id)
      topic_partitions = list(committed_offsets.keys())

      end_offsets = consumer.end_offsets(topic_partitions) if topic_partitions else {}

      total_lag = 0
      lagged_partitions = 0

      for tp, offset_and_metadata in committed_offsets.items():
          committed = offset_and_metadata.offset if offset_and_metadata else 0
          latest = end_offsets.get(tp, committed)
          partition_lag = max(0, latest - committed)
          total_lag += partition_lag
          if partition_lag > 0:
              lagged_partitions += 1

      consumer.close()
      admin.close()

      Kestra.outputs({
          "group_id": group_id,
          "total_lag": total_lag,
          "partitions_lagged": lagged_partitions
      })

    retry:
      type: constant
      interval: PT5S
      maxAttempt: 3

  - id: evaluate_lag
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.check_consumer_lag.vars.total_lag > inputs.max_lag_threshold }}"
    then:
      - id: notify_lag_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#streaming-ops-alerts",
            "username": "Kafka Lag Sentinel",
            "icon_emoji": ":warning:",
            "text": ":warning: *Kafka Consumer Group Lag Warning*\n• *Consumer Group:* `{{ outputs.check_consumer_lag.vars.group_id }}`\n• *Total Lag:* `{{ outputs.check_consumer_lag.vars.total_lag }}` messages (Threshold: `{{ inputs.max_lag_threshold }}`)\n• *Lagged Partitions:* `{{ outputs.check_consumer_lag.vars.partitions_lagged }}`\n• *Execution ID:* `{{ flow.executionId }}`"
          }
        retry:
          type: constant
          interval: PT5S
          maxAttempt: 3
    else:
      - id: log_healthy_lag
        type: io.kestra.plugin.core.log.Log
        message: "Kafka consumer group {{ outputs.check_consumer_lag.vars.group_id }} is healthy. Current lag: {{ outputs.check_consumer_lag.vars.total_lag }} messages."

errors:
  - id: dead_letter_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#streaming-ops-alerts",
        "username": "Kafka Sentinel - Critical Failure",
        "icon_emoji": ":rotating_light:",
        "text": ":rotating_light: *CRITICAL: Kafka Lag Sentinel Failed*\nCould not query consumer group offsets from `{{ secret('KAFKA_BOOTSTRAP_SERVERS') }}`.\n• *Execution ID:* `{{ flow.executionId }}`\n• *Failed Task:* `{{ task.id }}`"
      }
