id: redis-memory-fragmentation-and-eviction-guard
namespace: company.dataops

extend:
  title: Redis Memory Fragmentation & Evicted Keys Sentinel
  metaTitle: Redis Memory Fragmentation & Eviction Sentinel
  shortDescription: Continuously audit Redis memory fragmentation ratio and eviction rates using INFO memory and stats with Slack alerting.
  metaDescription: Audit Redis memory fragmentation ratio, peak memory saturation, and key eviction rates with automated Slack alerting and dead-letter failure handling.
  description: |
    ## How it works
    1. **Query Redis INFO Memory & Stats**: Gathers operational telemetry from Redis using `io.kestra.plugin.redis.rediscli.RedisCLI` or Python socket commands with retries.
    2. **Parse Key Saturation Metrics**: Extracts `mem_fragmentation_ratio`, `used_memory_rss_human`, and `evicted_keys`.
    3. **Evaluate Saturation Gate**: Uses `io.kestra.plugin.core.flow.If` to determine whether memory fragmentation or evicted keys exceed safe operational thresholds.
    4. **Slack Notification**: Posts an actionable incident notification to Slack if memory fragmentation threatens node stability.
    5. **Dual-Layer Error Handling**: Flow-level `errors` handler captures connection timeouts, unreachable endpoints, or authentication rejections.

    ## What you get
    - Real-time protection against silent key evictions and out-of-memory kernel kills in Redis cache clusters.
    - Automated visibility into memory fragmentation spikes.
    - Zero external monitoring agent overhead.

    ## Who it's for
    - SRE and DevOps engineers managing Redis clusters.
    - Backend engineers maintaining caching and pub/sub message brokers.
    - Platform architects managing memory costs on AWS ElastiCache, GCP Memorystore, or self-hosted Redis.

    ## Why orchestrate this with Kestra
    Kestra runs recurring health checks on schedules with built-in retries, secure secret masking, and dead-letter alerting.

    ## Prerequisites
    - Running Redis instance (Standalone or Cluster).
    - Redis connection string and password.
    - Slack Incoming Webhook URL.

    ### Secrets
    Configure the following secrets in Kestra:
    - `REDIS_HOST`: Redis host address (e.g. `redis.internal.example.com`).
    - `REDIS_PORT`: Redis port (default `6379`).
    - `REDIS_PASSWORD`: Redis authentication password.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL.

    ## Quick start
    1. Set up your Redis connection parameters in Kestra secrets.
    2. Run or schedule the flow to monitor fragmentation and eviction metrics.

    ## How to extend
    - Add automated `MEMORY PURGE` command execution if fragmentation ratio exceeds critical limits.
    - Escalate directly to PagerDuty if eviction rates impact production session stores.

    ## Links
    - [Redis INFO Command Documentation](https://redis.io/docs/latest/commands/info/)
    - [Kestra Python Scripts](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Database
    - Alert
  subTags:
    - Redis
    - Cache
    - Slack
  ee: false
  demo: false

inputs:
  - id: max_fragmentation_ratio
    type: FLOAT
    defaults: 1.5
    description: Maximum permissible Redis memory fragmentation ratio before alerting.

  - id: max_evicted_keys_threshold
    type: INT
    defaults: 100
    description: Maximum permissible evicted keys count before alerting on cache capacity pressure.

tasks:
  - id: audit_redis_metrics
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install redis
    env:
      REDIS_HOST: "{{ secret('REDIS_HOST') }}"
      REDIS_PORT: "{{ secret('REDIS_PORT') }}"
      REDIS_PASSWORD: "{{ secret('REDIS_PASSWORD') }}"
    script: |
      import os, redis, json
      from kestra import Kestra

      client = redis.Redis(
          host=os.environ["REDIS_HOST"],
          port=int(os.environ.get("REDIS_PORT", 6379)),
          password=os.environ.get("REDIS_PASSWORD"),
          socket_timeout=10
      )

      info_mem = client.info("memory")
      info_stats = client.info("stats")

      frag_ratio = float(info_mem.get("mem_fragmentation_ratio", 1.0))
      used_mem_human = str(info_mem.get("used_memory_human", "0B"))
      rss_mem_human = str(info_mem.get("used_memory_rss_human", "0B"))
      evicted_keys = int(info_stats.get("evicted_keys", 0))

      Kestra.outputs({
          "frag_ratio": frag_ratio,
          "used_mem_human": used_mem_human,
          "rss_mem_human": rss_mem_human,
          "evicted_keys": evicted_keys
      })
    retry:
      type: constant
      interval: PT5S
      maxAttempt: 3

  - id: evaluate_saturation
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_redis_metrics.vars.frag_ratio > inputs.max_fragmentation_ratio or outputs.audit_redis_metrics.vars.evicted_keys > inputs.max_evicted_keys_threshold }}"
    then:
      - id: notify_redis_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#cache-ops-alerts",
            "username": "Redis Memory Sentinel",
            "icon_emoji": ":warning:",
            "text": ":warning: *Redis Memory Saturation Warning*\n• *Fragmentation Ratio:* `{{ outputs.audit_redis_metrics.vars.frag_ratio }}` (Threshold: `{{ inputs.max_fragmentation_ratio }}`)\n• *Used Memory:* `{{ outputs.audit_redis_metrics.vars.used_mem_human }}` (RSS: `{{ outputs.audit_redis_metrics.vars.rss_mem_human }}`)\n• *Evicted Keys:* `{{ outputs.audit_redis_metrics.vars.evicted_keys }}` (Threshold: `{{ inputs.max_evicted_keys_threshold }}`)\n• *Execution ID:* `{{ flow.executionId }}`"
          }
        retry:
          type: constant
          interval: PT5S
          maxAttempt: 3
    else:
      - id: log_healthy_metrics
        type: io.kestra.plugin.core.log.Log
        message: "Redis memory profile is optimal. Fragmentation ratio: {{ outputs.audit_redis_metrics.vars.frag_ratio }}, Evicted keys: {{ outputs.audit_redis_metrics.vars.evicted_keys }}."

errors:
  - id: dead_letter_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#cache-ops-alerts",
        "username": "Redis Sentinel - Critical Failure",
        "icon_emoji": ":rotating_light:",
        "text": ":rotating_light: *CRITICAL: Redis Memory Sentinel Failed*\nCould not retrieve INFO memory stats from `{{ secret('REDIS_HOST') }}`.\n• *Execution ID:* `{{ flow.executionId }}`\n• *Task:* `{{ task.id }}`"
      }
