id: pgvector-hnsw-index-health-sentinel
namespace: company.ai

inputs:
  - id: postgres_host
    type: STRING
    displayName: PostgreSQL Host
    required: true
    defaults: "pgvector-primary.internal.net"
    description: "Hostname of the PostgreSQL database running the pgvector extension."

  - id: postgres_port
    type: INT
    displayName: Database Port
    required: true
    defaults: 5432
    description: "PostgreSQL port number (default 5432)."

  - id: database_name
    type: STRING
    displayName: Database Name
    required: true
    defaults: "vector_store"
    description: "Target database containing pgvector embedding tables."

  - id: table_name
    type: STRING
    displayName: Embedding Table Name
    required: true
    defaults: "document_embeddings"
    description: "Table containing the vector column and HNSW/IVFFlat index."

  - id: bloat_ratio_threshold
    type: FLOAT
    displayName: Maximum Index Bloat Ratio
    required: true
    defaults: 2.5
    description: "Maximum allowable ratio of dead index tuples indicating need for REINDEX CONCURRENTLY."

tasks:
  - id: log_audit_commencement
    type: io.kestra.plugin.core.log.Log
    message: "🔍 Starting pgvector HNSW index health and bloat audit on table '{{ inputs.table_name }}' in {{ inputs.database_name }}"

  - id: query_vector_index_stats
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: "Query pg_stat_user_indexes and pg_class to evaluate HNSW index scan efficiency and dead tuple bloat"
    url: "jdbc:postgresql://{{ inputs.postgres_host }}:{{ inputs.postgres_port }}/{{ inputs.database_name }}"
    username: "{{ secret('POSTGRES_USER') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH_ONE
    sql: |
      SELECT
          relname AS table_name,
          indexrelname AS index_name,
          idx_scan AS total_index_scans,
          idx_tup_read AS total_tuples_read,
          idx_tup_fetch AS total_tuples_fetched,
          round(pg_relation_size(indexrelid) / (1024 * 1024)::numeric, 2) AS index_size_mb,
          round(pg_relation_size(relid) / (1024 * 1024)::numeric, 2) AS table_size_mb,
          round((pg_relation_size(indexrelid)::numeric / nullif(pg_relation_size(relid), 0)), 2) AS index_to_table_ratio
      FROM pg_stat_user_indexes
      WHERE relname = '{{ inputs.table_name }}'
      ORDER BY pg_relation_size(indexrelid) DESC
      LIMIT 1;
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3

  - id: evaluate_index_efficiency
    type: io.kestra.plugin.core.flow.If
    description: "Evaluate if HNSW index size ratio exceeds healthy thresholds or indicates severe write bloat"
    condition: "{{ outputs.query_vector_index_stats.row.index_to_table_ratio >= inputs.bloat_ratio_threshold }}"
    then:
      - id: alert_hnsw_bloat_detected
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Post critical database alert warning of degraded approximate nearest neighbor (ANN) latency"
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "🚨 pgvector HNSW Index Bloat Alert",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Table:* `{{ inputs.table_name }}`"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Index:* `{{ outputs.query_vector_index_stats.row.index_name }}`"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Index Size:* `{{ outputs.query_vector_index_stats.row.index_size_mb }} MB`"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Table Size:* `{{ outputs.query_vector_index_stats.row.table_size_mb }} MB`"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Index/Table Ratio:* `{{ outputs.query_vector_index_stats.row.index_to_table_ratio }}` (Threshold: {{ inputs.bloat_ratio_threshold }})"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Index Scans:* `{{ outputs.query_vector_index_stats.row.total_index_scans }}`"
                  }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "⚠️ *Action Required:* HNSW vector index is severely bloated relative to table size. Heavy vector updates or deletes leave orphaned index graphs. Run `REINDEX INDEX CONCURRENTLY {{ outputs.query_vector_index_stats.row.index_name }};` to recover RAM and restore sub-millisecond vector similarity search speed."
                }
              }
            ]
          }

    else:
      - id: log_index_healthy
        type: io.kestra.plugin.core.log.Log
        description: "Log healthy vector index telemetry"
        message: "✅ pgvector HNSW index {{ outputs.query_vector_index_stats.row.index_name }} is healthy. Size: {{ outputs.query_vector_index_stats.row.index_size_mb }} MB (Ratio: {{ outputs.query_vector_index_stats.row.index_to_table_ratio }})."

errors:
  - id: alert_sentinel_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Dead-letter alert if pgvector query audit fails"
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *pgvector Sentinel Failed:* Execution `{{ execution.id }}` failed to connect to PostgreSQL host `{{ inputs.postgres_host }}`."
      }

triggers:
  - id: nightly_hnsw_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "45 2 * * *"
    disabled: true

extend:
  title: pgvector HNSW Vector Index Bloat and Query Efficiency Sentinel
  metaTitle: pgvector HNSW Index Health & Bloat Sentinel with Slack Alerts | Kestra
  shortDescription: Audit PostgreSQL pgvector HNSW index size ratios and scan metrics to prevent ANN search degradation with Slack alerts.
  metaDescription: Monitor PostgreSQL pgvector HNSW index bloat ratios, audit scan metrics, and trigger automated Slack alerts before vector search queries degrade.
  description: |
    PostgreSQL's `pgvector` extension allows storing and querying high-dimensional embeddings using Hierarchical Navigable Small World (HNSW) graphs. However, frequent vector updates, upserts, and deletes cause HNSW graphs to bloat significantly, consuming excessive shared buffers and degrading approximate nearest neighbor (ANN) search latency. This blueprint queries PostgreSQL system statistics, calculates index-to-table size ratios, and alerts AI infrastructure teams on Slack when reindexing is required.

    ## How it works

    1. **Inputs & Connection**: Accepts the PostgreSQL database endpoint, database name, target vector table, and index bloat tolerance ratio.
    2. **Index Stats Query**: The `query_vector_index_stats` task (`io.kestra.plugin.jdbc.postgresql.Query`) queries `pg_stat_user_indexes` and `pg_class` with retries to compute exact index size in MB, table size, total scans, and the index-to-table size ratio.
    3. **Bloat Threshold Gate**: The `evaluate_index_efficiency` task (`io.kestra.plugin.core.flow.If`) evaluates whether the index ratio exceeds the configured bloat limit.
    4. **Slack Alert Dispatch**: If bloated, `alert_hnsw_bloat_detected` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) broadcasts an operational alert card with concrete `REINDEX INDEX CONCURRENTLY` mitigation steps.
    5. **Pipeline Resilience**: An `errors` handler guarantees dead-letter notifications if database credentials expire or network timeouts occur.

    ## What you get

    - Automated health monitoring for production PostgreSQL pgvector indexes.
    - Zero glue-code telemetry inspection using native PostgreSQL JDBC drivers.
    - Proactive prevention of vector search latency spikes and memory starvation.
    - Pre-configured nightly audit schedule ready to enable.

    ## Who it's for

    - AI Platform Engineers and Database Administrators managing pgvector in production.
    - SRE and Platform teams supporting enterprise RAG and semantic search backends.
    - Software Engineers deploying high-write vector embeddings on PostgreSQL.

    ## Why orchestrate this with Kestra

    Kestra coordinates JDBC connectivity, secret masking, retry backoffs, conditional routing, and multi-channel messaging into a clean declarative YAML DAG that runs natively with full execution history.

    ## Prerequisites

    - A running PostgreSQL instance (v15+) with the `vector` extension enabled.
    - A Slack Incoming Webhook URL.

    ### Secrets

    - `POSTGRES_USER`: PostgreSQL database username.
    - `POSTGRES_PASSWORD`: PostgreSQL database password.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for database operational alerts.

    ## Quick start

    1. Configure `POSTGRES_USER`, `POSTGRES_PASSWORD`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Execute this flow with your PostgreSQL connection parameters and vector table name.
    3. Review the execution output to verify HNSW index size and scan metrics.
    4. Enable the `nightly_hnsw_audit` trigger for automated nightly auditing.

    ## How to extend

    - Add an automated `REINDEX INDEX CONCURRENTLY` task inside an approved branch for staging environments.
    - Integrate PagerDuty alerting if vector search degradation threatens customer-facing SLAs.
    - Export index growth metrics to Prometheus or Datadog for storage capacity planning.

    ## Links

    - [pgvector Documentation](https://github.com/pgvector/pgvector)
    - [Kestra PostgreSQL Plugin](https://kestra.io/plugins/plugin-jdbc-postgresql)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - AI
    - Database
  subTags:
    - Postgres
    - Vector Databases & Embeddings
  ee: false
  demo: false
