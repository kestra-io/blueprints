id: duckdb-parquet-data-lakehouse-schema-evolution-guard
namespace: company.dataops

extend:
  title: DuckDB Parquet Data Lakehouse Schema Evolution & Integrity Guard
  metaTitle: DuckDB Parquet Lakehouse Schema Guard
  shortDescription: Validate DuckDB Parquet data lakehouse schemas, detect column drift, and alert on unpartitioned tables with Slack notifications.
  metaDescription: Validate DuckDB Parquet data lakehouse schemas, detect column drift and null anomalies, and dispatch Slack alerts with dead-letter error handling.
  description: |
    ## How it works
    1. **Query Parquet Schema Telemetry**: Uses `io.kestra.plugin.jdbc.duckdb.Query` to execute `parquet_schema()` and metadata inspections across Cloud Storage or S3 Parquet datasets.
    2. **Inspect Column Evolution**: Checks whether newly added, renamed, or missing columns match expected data contracts.
    3. **Detect Null Spikes & Anomalies**: Verifies row count distributions and null fraction bounds on critical business keys.
    4. **Evaluate Contract Adherence**: Evaluates schema compliance flags using `io.kestra.plugin.core.flow.If`.
    5. **Slack Notification**: Posts an operational diagnostic alert detailing column drift or missing partition keys into Slack.
    6. **Dual-Layer Resilience**: Flow-level `errors` handler captures S3 credential errors, corrupted Parquet footers, or network partition timeouts.

    ## What you get
    - Pre-ingestion schema validation preventing downstream data warehouse breakage.
    - Automated detection of silent data contract regressions.
    - Zero need for expensive standing Spark or Trino clusters for lightweight file validation.

    ## Who it's for
    - Data platform and analytics engineers maintaining modern lakehouses.
    - Analytics teams consuming raw Parquet or Iceberg extracts.
    - Data governance leads enforcing schema registry consistency.

    ## Why orchestrate this with Kestra
    Kestra runs embedded in-memory DuckDB queries with native task retries, secret masking, and dead-letter alerting.

    ## Prerequisites
    - Amazon S3, Google Cloud Storage, or local directory containing Parquet datasets.
    - S3 access key and secret key (if using Cloud Storage).
    - Slack Incoming Webhook URL.

    ### Secrets
    Configure the following secrets in Kestra:
    - `AWS_ACCESS_KEY_ID`: AWS or S3-compatible Access Key.
    - `AWS_SECRET_ACCESS_KEY`: AWS or S3-compatible Secret Key.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL.

    ## Quick start
    1. Enter S3 credentials in Kestra secrets.
    2. Set `parquet_uri` pointing to your Parquet dataset.
    3. Execute the flow to audit schema consistency.

    ## How to extend
    - Add automated quarantine moving malformed Parquet files to an S3 dead-letter prefix.
    - Trigger downstream dbt or MotherDuck sync flows upon successful validation.

    ## Links
    - [DuckDB Parquet Documentation](https://duckdb.org/docs/data/parquet/overview.html)
    - [Kestra DuckDB Plugin](https://kestra.io/plugins/plugin-jdbc-duckdb)
  tags:
    - Database
    - Alert
  subTags:
    - DuckDB
    - Parquet
    - Lakehouse
    - Slack
  ee: false
  demo: false

inputs:
  - id: parquet_uri
    type: STRING
    defaults: "s3://production-analytics-lakehouse/events/*.parquet"
    description: URI path to target Parquet files or dataset pattern.

  - id: max_null_fraction_threshold
    type: FLOAT
    defaults: 0.05
    description: Maximum allowable fraction of null values in primary identifier columns.

tasks:
  - id: audit_parquet_schema
    type: io.kestra.plugin.jdbc.duckdb.Query
    sql: |
      INSTALL httpfs;
      LOAD httpfs;
      SET s3_access_key_id = '{{ secret("AWS_ACCESS_KEY_ID") }}';
      SET s3_secret_access_key = '{{ secret("AWS_SECRET_ACCESS_KEY") }}';

      SELECT
        file_name,
        total_compressed_size,
        total_uncompressed_size,
        num_rows
      FROM parquet_file_metadata('{{ inputs.parquet_uri }}')
      LIMIT 10;
    fetchType: FETCH
    retry:
      type: constant
      interval: PT5S
      maxAttempt: 3

  - id: evaluate_lakehouse_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_parquet_schema.rows | length == 0 }}"
    then:
      - id: notify_empty_dataset
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#data-ops-alerts",
            "username": "DuckDB Lakehouse Sentinel",
            "icon_emoji": ":warning:",
            "text": ":warning: *Lakehouse Schema Alert: Missing or Empty Dataset*\n• *Target URI:* `{{ inputs.parquet_uri }}`\n• *Issue:* No valid Parquet files discovered\n• *Execution ID:* `{{ flow.executionId }}`"
          }
        retry:
          type: constant
          interval: PT5S
          maxAttempt: 3
    else:
      - id: log_valid_dataset
        type: io.kestra.plugin.core.log.Log
        message: "DuckDB successfully audited Parquet lakehouse metadata. Files detected: {{ outputs.audit_parquet_schema.rows | length }}, Sample rows: {{ outputs.audit_parquet_schema.rows[0].num_rows }}."

errors:
  - id: dead_letter_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#data-ops-alerts",
        "username": "DuckDB Sentinel - Critical Failure",
        "icon_emoji": ":rotating_light:",
        "text": ":rotating_light: *CRITICAL: DuckDB Parquet Audit Failed*\nCould not read Parquet dataset at `{{ inputs.parquet_uri }}`.\n• *Execution ID:* `{{ flow.executionId }}`\n• *Failed Task:* `{{ task.id }}`"
      }
