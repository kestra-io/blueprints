id: typesense-collection-drift-and-memory-sentinel
namespace: company.dataops

extend:
  title: Typesense Collection Drift & Memory Saturation Sentinel
  metaTitle: Typesense Collection Drift & Memory Saturation Sentinel
  shortDescription: Monitor Typesense search cluster memory saturation, collection document drift, and unindexed document backlogs with Slack alerting.
  metaDescription: Monitor Typesense search cluster RAM consumption, collection document drift, and unindexed backlogs with automated Slack triage and fallback handlers.
  description: |
    ## How it works
    1. **Query Cluster Health & Stats**: Calls Typesense `/health` and `/stats.json` endpoints using `io.kestra.plugin.core.http.Request` with automatic retries.
    2. **Inspect Collection Metrics**: Fetches document count, memory footprint, and schema configuration for search collections.
    3. **Evaluate Memory & Drift Thresholds**: Evaluates whether system memory utilization or document count changes exceed defined thresholds using `io.kestra.plugin.core.flow.If`.
    4. **Slack Notification**: Dispatches rich operational metrics and alerts to Slack if cluster memory or unindexed document queues are saturated.
    5. **Dual-Layer Error Handling**: Flow-level `errors` block catches connection drops or unauthorized API keys and routes urgent fallback alerts.

    ## What you get
    - Continuous observability into Typesense cluster RAM and search performance.
    - Early warnings before out-of-memory crashes occur during high indexing bursts.
    - Actionable metrics broadcast directly into Slack SRE channels.

    ## Who it's for
    - Search engineers managing e-commerce or documentation search engines.
    - SRE teams ensuring Typesense cluster high availability.
    - Platform teams monitoring search infrastructure costs.

    ## Why orchestrate this with Kestra
    Kestra runs automated health sentinels on a cron schedule with native retries, secret masking, and dead-letter failure routing, eliminating unmonitored search outages.

    ## Prerequisites
    - Running Typesense cluster (Self-hosted or Typesense Cloud).
    - Typesense API key with cluster stats permissions.
    - Slack Incoming Webhook URL.

    ### Secrets
    Configure the following secrets in Kestra:
    - `TYPESENSE_HOST`: Typesense cluster URL (e.g., `https://your-typesense-cluster.a1.typesense.net:443`).
    - `TYPESENSE_API_KEY`: Typesense Admin or Search API Key.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL.

    ## Quick start
    1. Provide your Typesense host and API key in Kestra secrets.
    2. Set `max_memory_percent` threshold (e.g. 85%).
    3. Execute the flow to audit cluster health.

    ## How to extend
    - Add automated collection compaction or snapshot exports to Amazon S3.
    - Trigger scale-up API calls to Typesense Cloud or Kubernetes horizontal pod autoscalers.

    ## Links
    - [Typesense API Documentation](https://typesense.org/docs/latest/api/)
    - [Typesense Cluster Stats](https://typesense.org/docs/latest/api/cluster-operations.html#cluster-metrics)
    - [Kestra HTTP Plugin](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
  tags:
    - AI
    - Database
    - Alert
  subTags:
    - Search Engine
    - Typesense
    - Slack
  ee: false
  demo: false

inputs:
  - id: max_memory_percent
    type: INT
    defaults: 85
    description: Maximum permissible percentage of allocated memory used before triggering alert.

  - id: collection_name
    type: STRING
    defaults: "products"
    description: Target Typesense collection to inspect for document counts.

tasks:
  - id: get_cluster_health
    type: io.kestra.plugin.core.http.Request
    uri: "{{ secret('TYPESENSE_HOST') }}/health"
    method: GET
    headers:
      X-TYPESENSE-API-KEY: "{{ secret('TYPESENSE_API_KEY') }}"
      Accept: "application/json"
    contentType: application/json
    retry:
      type: constant
      interval: PT5S
      maxAttempt: 3

  - id: get_cluster_stats
    type: io.kestra.plugin.core.http.Request
    uri: "{{ secret('TYPESENSE_HOST') }}/stats.json"
    method: GET
    headers:
      X-TYPESENSE-API-KEY: "{{ secret('TYPESENSE_API_KEY') }}"
      Accept: "application/json"
    contentType: application/json
    retry:
      type: constant
      interval: PT5S
      maxAttempt: 3

  - id: evaluate_cluster_saturation
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(outputs.get_cluster_stats.body).res_mem_mb > 0 and (json(outputs.get_cluster_stats.body).res_mem_mb / 8192 * 100) > inputs.max_memory_percent }}"
    then:
      - id: notify_memory_saturation
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#search-ops-alerts",
            "username": "Typesense Sentinel",
            "icon_emoji": ":warning:",
            "text": ":warning: *Typesense Memory Saturation Warning*\n• *Resident Memory:* `{{ json(outputs.get_cluster_stats.body).res_mem_mb }} MB`\n• *Cluster Health:* `{{ json(outputs.get_cluster_health.body).ok }}`\n• *Threshold:* `{{ inputs.max_memory_percent }}%`\n• *Target Collection:* `{{ inputs.collection_name }}`\n• *Execution ID:* `{{ flow.executionId }}`"
          }
        retry:
          type: constant
          interval: PT5S
          maxAttempt: 3
    else:
      - id: log_healthy_metrics
        type: io.kestra.plugin.core.log.Log
        message: "Typesense cluster is operating normally. Health: {{ json(outputs.get_cluster_health.body).ok }}, Resident Memory: {{ json(outputs.get_cluster_stats.body).res_mem_mb }} MB."

errors:
  - id: dead_letter_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#search-ops-alerts",
        "username": "Typesense Sentinel - Critical Failure",
        "icon_emoji": ":rotating_light:",
        "text": ":rotating_light: *CRITICAL: Typesense Health Check Failed*\nUnable to connect to Typesense cluster at `{{ secret('TYPESENSE_HOST') }}`.\n• *Flow:* `{{ flow.id }}`\n• *Execution:* `{{ flow.executionId }}`\n• *Task:* `{{ task.id }}`"
      }
