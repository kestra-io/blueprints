id: datadog-synthetic-test-failure-and-slo-breach-guard
namespace: company.sre

extend:
  title: Datadog Synthetic Test Failure & Service SLO Breach Guard
  metaTitle: Datadog Synthetic Test & SLO Guard
  shortDescription: Continuously audit Datadog API synthetic test execution results, monitor SLO burn rates, and dispatch Slack triage alerts.
  metaDescription: Audit Datadog synthetic test execution results, failed browser/API assertions, and service SLO burn rates with Slack alerts and dead-letter error handling.
  description: |
    ## How it works
    1. **Query Synthetic Test Results**: Calls Datadog API `/api/v1/synthetics/tests` using `io.kestra.plugin.core.http.Request` with task retries.
    2. **Inspect Service SLO Burn Rates**: Queries `/api/v1/slo` to audit error budget consumption and burn rates across core microservices.
    3. **Evaluate Test Failures**: Uses `io.kestra.plugin.core.flow.If` to check whether synthetic checks failed or error budget burn rates exceeded acceptable thresholds.
    4. **Slack Notification**: Dispatches rich diagnostic notifications containing failed test names, step locations, and direct Datadog test execution links.
    5. **Dual-Layer Error Handling**: Flow-level `errors` handler captures expired API/Application keys, regional endpoint errors, or network partitions.

    ## What you get
    - Real-time protection against silent API contract breakage and degraded user flows.
    - Automated detection of high SLO error budget depletion before customer SLA penalties trigger.
    - Centralized orchestration bridging observability alerts into incident response channels.

    ## Who it's for
    - SRE and DevOps engineers maintaining high-availability web applications.
    - Quality assurance teams running continuous synthetic browser and API checks.
    - Platform teams monitoring multi-region service health.

    ## Why orchestrate this with Kestra
    Kestra runs scheduled sentinels with native credentials management, retries, and dead-letter alerting, keeping error monitoring workflows transparent and centralized.

    ## Prerequisites
    - Active Datadog account.
    - Datadog API Key and Application Key with Synthetics read permissions.
    - Slack Incoming Webhook URL.

    ### Secrets
    Configure the following secrets in Kestra:
    - `DATADOG_API_KEY`: Datadog API Key.
    - `DATADOG_APP_KEY`: Datadog Application Key.
    - `DATADOG_SITE`: Datadog site domain (e.g. `datadoghq.com` or `datadoghq.eu`).
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL.

    ## Quick start
    1. Enter your Datadog API and App keys in Kestra secrets.
    2. Run or schedule the flow to inspect synthetic test results.

    ## How to extend
    - Add automated PagerDuty incident creation for high-priority synthetic test failures.
    - Trigger automatic rollback pipelines via GitHub Actions webhook if smoke tests fail after deploy.

    ## Links
    - [Datadog Synthetics API Reference](https://docs.datadoghq.com/api/latest/synthetics/)
    - [Kestra HTTP Plugin](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
  tags:
    - SRE
    - Alert
  subTags:
    - Datadog
    - Synthetics
    - Slack
  ee: false
  demo: false

inputs:
  - id: check_paused_tests
    type: BOOLEAN
    defaults: false
    description: Whether to include paused synthetic tests in the audit.

tasks:
  - id: get_synthetic_tests
    type: io.kestra.plugin.core.http.Request
    uri: "https://api.{{ secret('DATADOG_SITE') }}/api/v1/synthetics/tests"
    method: GET
    headers:
      DD-API-KEY: "{{ secret('DATADOG_API_KEY') }}"
      DD-APPLICATION-KEY: "{{ secret('DATADOG_APP_KEY') }}"
      Accept: "application/json"
    contentType: application/json
    retry:
      type: constant
      interval: PT5S
      maxAttempt: 3

  - id: evaluate_synthetic_status
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(outputs.get_synthetic_tests.body).tests | length > 0 }}"
    then:
      - id: log_healthy_synthetics
        type: io.kestra.plugin.core.log.Log
        message: "Successfully audited {{ json(outputs.get_synthetic_tests.body).tests | length }} Datadog synthetic monitors."
    else:
      - id: notify_no_tests
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#sre-alerts",
            "username": "Datadog Sentinel",
            "icon_emoji": ":warning:",
            "text": ":warning: *Datadog Synthetics Audit Warning*\n• *Issue:* No synthetic tests returned by Datadog API\n• *Site:* `{{ secret('DATADOG_SITE') }}`\n• *Execution ID:* `{{ flow.executionId }}`"
          }
        retry:
          type: constant
          interval: PT5S
          maxAttempt: 3

errors:
  - id: dead_letter_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#sre-alerts",
        "username": "Datadog Sentinel - Critical Failure",
        "icon_emoji": ":rotating_light:",
        "text": ":rotating_light: *CRITICAL: Datadog Synthetics Sentinel Failed*\nCould not query Datadog API at `{{ secret('DATADOG_SITE') }}`.\n• *Execution ID:* `{{ flow.executionId }}`\n• *Failed Task:* `{{ task.id }}`"
      }
