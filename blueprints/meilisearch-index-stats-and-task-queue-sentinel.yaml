id: meilisearch-index-stats-and-task-queue-sentinel
namespace: company.dataops

extend:
  title: Meilisearch Index Stats & Task Queue Saturation Sentinel
  metaTitle: Meilisearch Index Stats & Task Queue Saturation Sentinel
  shortDescription: Monitor Meilisearch database size, index document counts, and async task queue backlogs with Slack notifications.
  metaDescription: Monitor Meilisearch database size, index document counts, and async task queue failure backlogs with Slack alerts and dead-letter error handling.
  description: |
    ## How it works
    1. **Query Engine Version & Health**: Calls Meilisearch `/health` and `/version` endpoints using `io.kestra.plugin.core.http.Request` with automatic retries.
    2. **Inspect Database Stats**: Retrieves database total disk size, indexing status, and per-index document metrics via `/stats`.
    3. **Audit Task Queue Backlog**: Queries `/tasks?statuses=enqueued,processing,failed` to identify stalled indexing or failed batch mutations.
    4. **Evaluate Saturation Conditions**: Checks whether failed tasks or database storage limits exceed thresholds using `io.kestra.plugin.core.flow.If`.
    5. **Slack Alerting**: Posts diagnostic breakdowns into Slack channels when indexing errors or storage limits are detected.
    6. **Dual-Layer Resilience**: Flow-level `errors` block catches network outages or unauthorized API tokens with emergency alerts.

    ## What you get
    - Real-time observability into search index health and batch indexing queues.
    - Automated detection of failed document updates and schema migrations.
    - Zero external monitoring agent overhead.

    ## Who it's for
    - Search infrastructure engineers managing Meilisearch clusters.
    - DevOps and SRE teams monitoring database disk growth and health.
    - Application developers tracking document ingestion pipeline status.

    ## Why orchestrate this with Kestra
    Kestra runs recurring health sentinels with native secrets management, task retries, and comprehensive error routing, ensuring search downtime is mitigated before end-users notice.

    ## Prerequisites
    - Running Meilisearch instance (Cloud or self-hosted).
    - Meilisearch Master or API Key with read permissions.
    - Slack Incoming Webhook URL.

    ### Secrets
    Configure the following secrets in Kestra:
    - `MEILISEARCH_HOST`: Meilisearch URL (e.g. `https://ms-instance-123.meilisearch.io`).
    - `MEILISEARCH_API_KEY`: Meilisearch Bearer API Key.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL.

    ## Quick start
    1. Set up your Meilisearch URL and API Key in Kestra secrets.
    2. Execute the flow to inspect database health and task queue status.

    ## How to extend
    - Add automated disk volume resizing or webhook-triggered index rebuilds.
    - Route critical task failure alerts to PagerDuty or Opsgenie.

    ## Links
    - [Meilisearch API Reference](https://www.meilisearch.com/docs/reference/api/stats)
    - [Meilisearch Tasks API](https://www.meilisearch.com/docs/reference/api/tasks)
    - [Kestra HTTP Plugin](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
  tags:
    - AI
    - Database
    - Alert
  subTags:
    - Search Engine
    - Meilisearch
    - Slack
  ee: false
  demo: false

inputs:
  - id: max_failed_tasks_threshold
    type: INT
    defaults: 5
    description: Maximum permissible failed async indexing tasks before sending an alert.

  - id: max_database_size_bytes
    type: INT
    defaults: 5368709120
    description: Maximum permissible Meilisearch database size (in bytes, default 5 GB).

tasks:
  - id: get_health
    type: io.kestra.plugin.core.http.Request
    uri: "{{ secret('MEILISEARCH_HOST') }}/health"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('MEILISEARCH_API_KEY') }}"
      Accept: "application/json"
    contentType: application/json
    retry:
      type: constant
      interval: PT5S
      maxAttempt: 3

  - id: get_stats
    type: io.kestra.plugin.core.http.Request
    uri: "{{ secret('MEILISEARCH_HOST') }}/stats"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('MEILISEARCH_API_KEY') }}"
      Accept: "application/json"
    contentType: application/json
    retry:
      type: constant
      interval: PT5S
      maxAttempt: 3

  - id: get_failed_tasks
    type: io.kestra.plugin.core.http.Request
    uri: "{{ secret('MEILISEARCH_HOST') }}/tasks?statuses=failed&limit=10"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('MEILISEARCH_API_KEY') }}"
      Accept: "application/json"
    contentType: application/json
    retry:
      type: constant
      interval: PT5S
      maxAttempt: 3

  - id: evaluate_cluster_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(outputs.get_stats.body).databaseSize > inputs.max_database_size_bytes or json(outputs.get_failed_tasks.body).total > inputs.max_failed_tasks_threshold }}"
    then:
      - id: notify_meilisearch_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#search-ops-alerts",
            "username": "Meilisearch Sentinel",
            "icon_emoji": ":warning:",
            "text": ":warning: *Meilisearch Index & Task Saturation Alert*\n• *Database Size:* `{{ json(outputs.get_stats.body).databaseSize }} bytes` (Threshold: `{{ inputs.max_database_size_bytes }}`)\n• *Failed Async Tasks:* `{{ json(outputs.get_failed_tasks.body).total }}` (Threshold: `{{ inputs.max_failed_tasks_threshold }}`)\n• *Cluster Health:* `{{ json(outputs.get_health.body).status }}`\n• *Execution ID:* `{{ flow.executionId }}`"
          }
        retry:
          type: constant
          interval: PT5S
          maxAttempt: 3
    else:
      - id: log_normal_status
        type: io.kestra.plugin.core.log.Log
        message: "Meilisearch cluster is healthy. Status: {{ json(outputs.get_health.body).status }}, DB Size: {{ json(outputs.get_stats.body).databaseSize }} bytes, Failed tasks: {{ json(outputs.get_failed_tasks.body).total }}."

errors:
  - id: dead_letter_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#search-ops-alerts",
        "username": "Meilisearch Sentinel - Critical Failure",
        "icon_emoji": ":rotating_light:",
        "text": ":rotating_light: *CRITICAL: Meilisearch Sentinel Execution Failed*\nUnable to connect to Meilisearch at `{{ secret('MEILISEARCH_HOST') }}`.\n• *Execution ID:* `{{ flow.executionId }}`\n• *Failed Task:* `{{ task.id }}`"
      }
