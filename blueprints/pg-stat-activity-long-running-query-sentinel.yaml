id: pg-stat-activity-long-running-query-sentinel
namespace: company.dataops

extend:
  title: PostgreSQL Long-Running Query & Lock Contention Sentinel
  metaTitle: PostgreSQL Long-Running Query & Lock Sentinel
  shortDescription: Identify and terminate unindexed long-running queries and transaction locks in PostgreSQL using pg_stat_activity with Slack alerting.
  metaDescription: Detect and alert on long-running queries, transaction locks, and idle-in-transaction states in PostgreSQL using pg_stat_activity and Slack webhook triage.
  description: |
    ## How it works
    1. **Query Active Connections**: Queries `pg_stat_activity` via `io.kestra.plugin.jdbc.postgresql.Query` for sessions executing longer than a defined threshold or stuck in `idle in transaction`.
    2. **Audit Lock Contention**: Identifies blocking queries holding row or table locks preventing concurrent writes.
    3. **Evaluate Critical Threshold**: Uses `io.kestra.plugin.core.flow.If` to check if slow queries were detected.
    4. **Slack Notification**: Dispatches actionable Slack alerts containing Process IDs (PIDs), offending query SQL snippets, and execution duration.
    5. **Dual-Layer Error Handling**: Flow-level `errors` handler captures connection pool failures or database timeouts with emergency alerting.

    ## What you get
    - Real-time protection against connection pool exhaustion and database CPU starvation.
    - Visibility into slow analytics queries blocking transactional tables.
    - Zero need for heavy APM daemons on lightweight PostgreSQL instances.

    ## Who it's for
    - Database administrators (DBAs) and SREs managing PostgreSQL clusters.
    - Backend engineers debugging transaction deadlocks.
    - Platform teams monitoring multi-tenant database saturation.

    ## Why orchestrate this with Kestra
    Kestra runs scheduled SQL sentinels with connection pooling, retries, and dead-letter alerting, providing automated operational guardrails.

    ## Prerequisites
    - PostgreSQL database (v12+).
    - Database user with `pg_read_all_stats` or administrative permissions.
    - Slack Incoming Webhook URL.

    ### Secrets
    Configure the following secrets in Kestra:
    - `POSTGRES_JDBC_URL`: PostgreSQL JDBC connection string (e.g. `jdbc:postgresql://db.example.com:5432/production`).
    - `POSTGRES_USERNAME`: Database username.
    - `POSTGRES_PASSWORD`: Database password.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL.

    ## Quick start
    1. Provide PostgreSQL JDBC credentials in Kestra secrets.
    2. Set `max_query_duration_seconds` (default: 300s).
    3. Run or schedule the flow to monitor query runtimes.

    ## How to extend
    - Add an automated `pg_cancel_backend(pid)` task for rogue queries exceeding critical timeouts (e.g., > 1 hour).
    - Route alerts to PagerDuty when blocking locks affect primary transactional tables.

    ## Links
    - [PostgreSQL pg_stat_activity Documentation](https://www.postgresql.org/docs/current/monitoring-stats.html#MONITORING-PG-STAT-ACTIVITY-VIEW)
    - [Kestra PostgreSQL Plugin](https://kestra.io/plugins/plugin-jdbc-postgres)
  tags:
    - Database
    - Alert
  subTags:
    - PostgreSQL
    - Slack
    - SRE
  ee: false
  demo: false

inputs:
  - id: max_query_duration_seconds
    type: INT
    defaults: 300
    description: Threshold in seconds beyond which an active query is flagged as slow or stalled.

tasks:
  - id: find_slow_queries
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "{{ secret('POSTGRES_JDBC_URL') }}"
    username: "{{ secret('POSTGRES_USERNAME') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    sql: |
      SELECT
        pid,
        usename,
        client_addr,
        state,
        ROUND(EXTRACT(EPOCH FROM (clock_timestamp() - query_start))::numeric, 2) AS duration_seconds,
        LEFT(query, 180) AS query_snippet
      FROM pg_stat_activity
      WHERE state != 'idle'
        AND query NOT ILIKE '%pg_stat_activity%'
        AND (clock_timestamp() - query_start) > (interval '1 second' * {{ inputs.max_query_duration_seconds }})
      ORDER BY duration_seconds DESC
      LIMIT 10;
    fetchType: FETCH
    retry:
      type: constant
      interval: PT5S
      maxAttempt: 3

  - id: evaluate_slow_queries
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.find_slow_queries.rows | length > 0 }}"
    then:
      - id: notify_slow_queries
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#db-ops-alerts",
            "username": "PostgreSQL Query Sentinel",
            "icon_emoji": ":hourglass_flowing_sand:",
            "text": ":warning: *PostgreSQL Long-Running Query Alert*\n• *Detected Queries Exceeding {{ inputs.max_query_duration_seconds }}s:* `{{ outputs.find_slow_queries.rows | length }}`\n• *Top Offending PID:* `{{ outputs.find_slow_queries.rows[0].pid }}` (User: `{{ outputs.find_slow_queries.rows[0].usename }}`)\n• *Duration:* `{{ outputs.find_slow_queries.rows[0].duration_seconds }}s`\n• *Query Snippet:* `{{ outputs.find_slow_queries.rows[0].query_snippet }}`\n• *Execution ID:* `{{ flow.executionId }}`"
          }
        retry:
          type: constant
          interval: PT5S
          maxAttempt: 3
    else:
      - id: log_clean_pool
        type: io.kestra.plugin.core.log.Log
        message: "PostgreSQL query pool is healthy. No active queries exceeded {{ inputs.max_query_duration_seconds }} seconds."

errors:
  - id: dead_letter_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#db-ops-alerts",
        "username": "PostgreSQL Sentinel - Critical Failure",
        "icon_emoji": ":rotating_light:",
        "text": ":rotating_light: *CRITICAL: PostgreSQL Sentinel Execution Failed*\nUnable to query `pg_stat_activity` on target database.\n• *Execution ID:* `{{ flow.executionId }}`\n• *Failed Task:* `{{ task.id }}`"
      }
