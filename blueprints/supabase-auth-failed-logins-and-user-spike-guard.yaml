id: supabase-auth-failed-logins-and-user-spike-guard
namespace: company.security

extend:
  title: Supabase Auth Rate-Limiting & Suspicious Logins Sentinel
  metaTitle: Supabase Auth Rate-Limiting & Security Sentinel
  shortDescription: Continuously audit Supabase authentication logs, detect brute-force login spikes, and trigger Slack security triage alerts.
  metaDescription: Audit Supabase Auth logs, detect failed login spikes, and dispatch security incident alerts to Slack with dual-layer dead-letter error handling.
  description: |
    ## How it works
    1. **Query Supabase Auth Logs**: Calls the Supabase Management API `/v1/projects/{ref}/analytics/endpoints/logs.all` using `io.kestra.plugin.core.http.Request` with task retries.
    2. **Filter Authentication Anomalies**: Audits event statuses for HTTP 429 rate limit breaches and repeated HTTP 400 invalid credential bursts.
    3. **Evaluate Security Threshold**: Checks if suspicious login failures exceed the configured threshold within the audit window using `io.kestra.plugin.core.flow.If`.
    4. **Slack Security Alert**: Dispatches rich incident details including client IP distribution, error counts, and direct project audit links to Slack.
    5. **Dual-Layer Error Handling**: Flow-level `errors` handler captures expired Management API tokens, invalid project reference keys, or network drops.

    ## What you get
    - Automated detection of credential stuffing and brute-force attacks against Supabase Auth.
    - Visibility into rate-limited authentication traffic impacting legitimate users.
    - Zero external SIEM or agent installation required.

    ## Who it's for
    - Security engineers defending modern JAMstack and mobile apps.
    - SRE and platform teams operating production Supabase workloads.
    - Developers managing Supabase authentication infrastructure.

    ## Why orchestrate this with Kestra
    Kestra runs scheduled security checks with native secret masking, automated retries, and comprehensive error handling.

    ## Prerequisites
    - Active Supabase project.
    - Supabase Personal Access Token (PAT) with Analytics read permissions.
    - Slack Incoming Webhook URL.

    ### Secrets
    Configure the following secrets in Kestra:
    - `SUPABASE_ACCESS_TOKEN`: Supabase Personal Access Token (`sbp_...`).
    - `SUPABASE_PROJECT_REF`: Supabase project reference id (e.g. `abcdefghijklmnopqrst`).
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL.

    ## Quick start
    1. Configure your Supabase project ref and access token in Kestra secrets.
    2. Set `max_failed_logins_threshold` (default 25).
    3. Run or schedule the flow to monitor login security.

    ## How to extend
    - Add automated IP blocking or Cloudflare WAF rule creation for repeat offending IPs.
    - Escalate critical security anomalies to PagerDuty.

    ## Links
    - [Supabase Management API Documentation](https://supabase.com/docs/reference/api/introduction)
    - [Kestra HTTP Plugin](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
  tags:
    - Security
    - Alert
  subTags:
    - Supabase
    - Authentication
    - Slack
  ee: false
  demo: false

inputs:
  - id: max_failed_logins_threshold
    type: INT
    defaults: 25
    description: Threshold of failed or rate-limited auth requests before triggering security alert.

tasks:
  - id: get_auth_logs
    type: io.kestra.plugin.core.http.Request
    uri: "https://api.supabase.com/v1/projects/{{ secret('SUPABASE_PROJECT_REF') }}/analytics/endpoints/logs.all?sql=select+timestamp%2C+event_message%2C+metadata+from+edge_logs+where+metadata.request.path+like+%27%2Fauth%2Fv1%25%27+and+metadata.response.status_code+in+%28400%2C+429%29+order+by+timestamp+desc+limit+50"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('SUPABASE_ACCESS_TOKEN') }}"
      Accept: "application/json"
    contentType: application/json
    retry:
      type: constant
      interval: PT5S
      maxAttempt: 3

  - id: evaluate_security_risk
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(outputs.get_auth_logs.body).data | length > inputs.max_failed_logins_threshold }}"
    then:
      - id: notify_security_team
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#sec-ops-alerts",
            "username": "Supabase Security Sentinel",
            "icon_emoji": ":shield:",
            "text": ":shield: *Supabase Authentication Security Alert*\n• *Suspicious Login Failures:* `{{ json(outputs.get_auth_logs.body).data | length }}` (Threshold: `{{ inputs.max_failed_logins_threshold }}`)\n• *Project Ref:* `{{ secret('SUPABASE_PROJECT_REF') }}`\n• *Execution ID:* `{{ flow.executionId }}`"
          }
        retry:
          type: constant
          interval: PT5S
          maxAttempt: 3
    else:
      - id: log_clean_auth
        type: io.kestra.plugin.core.log.Log
        message: "Supabase authentication traffic is normal. Failed attempts: {{ json(outputs.get_auth_logs.body).data | length }}."

errors:
  - id: dead_letter_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#sec-ops-alerts",
        "username": "Supabase Sentinel - Critical Failure",
        "icon_emoji": ":rotating_light:",
        "text": ":rotating_light: *CRITICAL: Supabase Security Sentinel Failed*\nCould not query logs for project `{{ secret('SUPABASE_PROJECT_REF') }}`.\n• *Execution ID:* `{{ flow.executionId }}`\n• *Failed Task:* `{{ task.id }}`"
      }
