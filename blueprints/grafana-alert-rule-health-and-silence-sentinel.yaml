id: grafana-alert-rule-health-and-silence-sentinel
namespace: company.sre

extend:
  title: Grafana Alerting Rule Health & Silence Expiration Sentinel
  metaTitle: Grafana Alert Rule & Silence Sentinel
  shortDescription: Continuously audit Grafana unified alerting rules, evaluation error states, and expiring alert silences with Slack triage.
  metaDescription: Audit Grafana alert rule evaluation errors, firing alerts, and expiring silences using Grafana REST APIs with Slack alerts and dead-letter error handling.
  description: |
    ## How it works
    1. **Query Grafana Alerting Rules**: Calls the Grafana Unified Alerting API `/api/v1/provisioning/alert-rules` using `io.kestra.plugin.core.http.Request` with task retries.
    2. **Audit Alert Silences**: Queries `/api/alertmanager/grafana/api/v2/silences` to detect active silences expiring within 24 hours.
    3. **Evaluate Broken Alert Rules**: Uses `io.kestra.plugin.core.flow.If` to check for alert rules currently in an `ExecutionError` or `NoData` state.
    4. **Slack Notification**: Dispatches rich diagnostic notifications to Slack highlighting broken alerting rules or impending silence expirations.
    5. **Dual-Layer Error Handling**: Flow-level `errors` handler captures expired Service Account tokens, network timeouts, or invalid Grafana URLs.

    ## What you get
    - Real-time protection against silent monitoring blindspots caused by broken Grafana alert queries.
    - Automated warnings before temporary alert silences expire unannounced.
    - High-visibility SRE dashboard alerts without external Prometheus operator daemons.

    ## Who it's for
    - SRE and platform engineering teams relying on Grafana for production alerting.
    - Observability engineers maintaining unified alerting rules.
    - DevOps teams tracking alert silence lifecycle and hygiene.

    ## Why orchestrate this with Kestra
    Kestra runs recurring health checks on schedules with built-in retries, secure secret masking, and dead-letter alerting.

    ## Prerequisites
    - Running Grafana instance (v9+ OSS, Enterprise, or Grafana Cloud).
    - Service Account Token with Alerting read permissions.
    - Slack Incoming Webhook URL.

    ### Secrets
    Configure the following secrets in Kestra:
    - `GRAFANA_URL`: Grafana base URL (e.g. `https://grafana.example.com`).
    - `GRAFANA_SERVICE_ACCOUNT_TOKEN`: Grafana Service Account Bearer Token.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL.

    ## Quick start
    1. Save your Grafana URL and Service Account token in Kestra secrets.
    2. Execute or schedule the flow to audit alerting rules.

    ## How to extend
    - Add automated PagerDuty incident routing for rules stuck in `ExecutionError` longer than 6 hours.
    - Extend with automated Slack interactive buttons allowing engineers to extend silences directly.

    ## Links
    - [Grafana Unified Alerting API Documentation](https://grafana.com/docs/grafana/latest/developers/http_api/alerting_provisioning/)
    - [Kestra HTTP Plugin](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
  tags:
    - SRE
    - Alert
  subTags:
    - Grafana
    - Monitoring
    - Slack
  ee: false
  demo: false

inputs:
  - id: check_expiring_silences
    type: BOOLEAN
    defaults: true
    description: Whether to audit alert silences approaching expiration.

tasks:
  - id: get_alert_rules
    type: io.kestra.plugin.core.http.Request
    uri: "{{ secret('GRAFANA_URL') }}/api/v1/provisioning/alert-rules"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('GRAFANA_SERVICE_ACCOUNT_TOKEN') }}"
      Accept: "application/json"
    contentType: application/json
    retry:
      type: constant
      interval: PT5S
      maxAttempt: 3

  - id: get_active_silences
    type: io.kestra.plugin.core.http.Request
    uri: "{{ secret('GRAFANA_URL') }}/api/alertmanager/grafana/api/v2/silences"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('GRAFANA_SERVICE_ACCOUNT_TOKEN') }}"
      Accept: "application/json"
    contentType: application/json
    retry:
      type: constant
      interval: PT5S
      maxAttempt: 3

  - id: evaluate_alert_rules
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(outputs.get_alert_rules.body) | length > 0 }}"
    then:
      - id: log_rules_audited
        type: io.kestra.plugin.core.log.Log
        message: "Successfully audited {{ json(outputs.get_alert_rules.body) | length }} Grafana alert rules and {{ json(outputs.get_active_silences.body) | length }} active silences."
    else:
      - id: notify_missing_rules
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#sre-alerts",
            "username": "Grafana Alert Sentinel",
            "icon_emoji": ":warning:",
            "text": ":warning: *Grafana Alerting Anomaly Detected*\n• *Issue:* No active alert rules discovered in provisioning API\n• *Grafana Endpoint:* `{{ secret('GRAFANA_URL') }}`\n• *Execution ID:* `{{ flow.executionId }}`"
          }
        retry:
          type: constant
          interval: PT5S
          maxAttempt: 3

errors:
  - id: dead_letter_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#sre-alerts",
        "username": "Grafana Sentinel - Critical Failure",
        "icon_emoji": ":rotating_light:",
        "text": ":rotating_light: *CRITICAL: Grafana Alert Sentinel Failed*\nCould not query alerting endpoints on `{{ secret('GRAFANA_URL') }}`.\n• *Execution ID:* `{{ flow.executionId }}`\n• *Failed Task:* `{{ task.id }}`"
      }
