id: database_migration_console
type: io.kestra.plugin.ee.apps.Execution
displayName: Database migration console
namespace: company.team
flowId: run_migration
access:
  type: PRIVATE

layout:
  - "on": OPEN
    blocks:
      - type: io.kestra.plugin.ee.apps.core.blocks.Markdown
        content: |
          ## Database migration console

          Plan a schema migration, review the estimated rows touched and lock time,
          then approve the apply — all from one screen. The migration flow first
          produces a dry-run plan and pauses for your approval before touching
          production tables.
      - type: io.kestra.plugin.ee.apps.execution.blocks.CreateExecutionForm
      - type: io.kestra.plugin.ee.apps.execution.blocks.CreateExecutionButton
        text: Generate migration plan
        style: DEFAULT

  - "on": CREATED
    blocks:
      - type: io.kestra.plugin.ee.apps.core.blocks.Markdown
        content: |
          ### Planning started
          The migration flow is generating a dry-run plan. This screen refreshes
          automatically.
      - type: io.kestra.plugin.ee.apps.core.blocks.AutoRefresh

  - "on": RUNNING
    blocks:
      - type: io.kestra.plugin.ee.apps.core.blocks.Markdown
        content: |
          ### Migration in progress
          Watch the log below. Cancelling during the apply phase stops the job
          where it safely can — never assume a cancel rolls back applied statements.
      - type: io.kestra.plugin.ee.apps.core.blocks.Loading
      - type: io.kestra.plugin.ee.apps.execution.blocks.Logs
      - type: io.kestra.plugin.ee.apps.execution.blocks.CancelExecutionButton
        text: Abort migration
        style: WARNING

  - "on": PAUSE
    blocks:
      - type: io.kestra.plugin.ee.apps.core.blocks.Alert
        style: WARNING
        showIcon: true
        content: |
          Review the plan carefully — approving applies the migration to production
          and may hold table locks for the estimated duration below.
      - type: io.kestra.plugin.ee.apps.core.blocks.Markdown
        content: |
          ## Migration plan ready

          | Detail | Value |
          | --- | --- |
          | Migration | `{{ inputs.migration_id }}` |
          | Target | `{{ inputs.target_table }}` |
          | Estimated rows touched | `{{ outputs.plan_migration.vars.estimated_rows }}` |
          | Estimated lock time | `{{ outputs.plan_migration.vars.estimated_lock_seconds }}s` |
          | Statement type | `{{ outputs.plan_migration.vars.statement_type }}` |
      - type: io.kestra.plugin.ee.apps.execution.blocks.Inputs
      - type: io.kestra.plugin.ee.apps.core.blocks.Markdown
        content: |
          ### Approve or abort?
          Approve to apply the migration. The form lets you record who approved
          and any change-ticket reference.
      - type: io.kestra.plugin.ee.apps.execution.blocks.ResumeExecutionForm
      - type: io.kestra.plugin.ee.apps.execution.blocks.ResumeExecutionButton
        text: Approve and apply
        style: SUCCESS
      - type: io.kestra.plugin.ee.apps.execution.blocks.CancelExecutionButton
        text: Abort — do not apply
        style: DANGER
      - type: io.kestra.plugin.ee.apps.core.blocks.AutoRefresh

  - "on": RESUME
    blocks:
      - type: io.kestra.plugin.ee.apps.core.blocks.Markdown
        content: |
          ### Approval recorded — applying the migration
          This screen refreshes automatically while the apply runs.
      - type: io.kestra.plugin.ee.apps.core.blocks.AutoRefresh

  - "on": SUCCESS
    blocks:
      - type: io.kestra.plugin.ee.apps.core.blocks.Markdown
        content: |
          ### Migration applied successfully
          Review the summary below, then keep the change ticket link with your
          deployment records.
      - type: io.kestra.plugin.ee.apps.execution.blocks.Inputs
      - type: io.kestra.plugin.ee.apps.execution.blocks.Outputs
      - type: io.kestra.plugin.ee.apps.core.blocks.Markdown
        content: |
          Applied migration `{{ inputs.migration_id }}` on `{{ inputs.target_table }}`.
      - type: io.kestra.plugin.ee.apps.core.blocks.Button
        text: Run another migration
        url: "{{ app.url }}"
        style: DEFAULT

  - "on": FAILURE
    blocks:
      - type: io.kestra.plugin.ee.apps.core.blocks.Markdown
        content: |
          ### Migration failed
      - type: io.kestra.plugin.ee.apps.core.blocks.Alert
        style: WARNING
        showIcon: true
        content: |
          The apply did not complete. Check the log for the statement that failed,
          verify whether partial changes were applied, and run your database's
          rollback procedure before retrying.
      - type: io.kestra.plugin.ee.apps.execution.blocks.Logs
      - type: io.kestra.plugin.ee.apps.core.blocks.Button
        text: Start a new migration plan
        url: "{{ app.url }}"
        style: DEFAULT
      - type: io.kestra.plugin.ee.apps.core.blocks.Button
        text: Ask for help
        url: https://kestra.io/slack
        style: INFO

  - "on": FALLBACK
    blocks:
      - type: io.kestra.plugin.ee.apps.core.blocks.Markdown
        content: This state has no dedicated view. Check the execution history for details.

description: |
  This Kestra App turns a schema migration into a reviewable, two-step operation:
  plan first, apply second. A data or platform engineer opens the console, submits
  the migration id and target table, and the underlying flow produces a dry-run
  plan — estimated rows touched, estimated lock time, statement type — then pauses.

  The App guides the user through every stage:
    - **OPEN**: Form to submit the migration id and target table.
    - **CREATED**: Confirmation while the dry-run plan is generated.
    - **RUNNING**: Live log and an abort action during planning or applying.
    - **PAUSE**: Plan preview with a lock warning, approver form, approve or abort.
    - **RESUME**: Acknowledgement while the approved apply runs.
    - **SUCCESS**: Inputs, outputs, and a one-click restart for the next migration.
    - **FAILURE**: Rollback guidance, the failing log, and recovery actions.
    - **FALLBACK**: Pointer to the execution history for unexpected states.

  The plan-before-apply pattern keeps the human gate where it matters — between
  "here is what will happen" and "make it happen" — with full visibility either way.

extend:
  shortDescription: "Plan-before-apply console for database migrations: dry-run preview with lock estimates, human approval, and full apply visibility."
  title: Database migration plan-and-approve App
  description: |
    Schema migrations are the changes most worth slowing down for: a lock held too
    long takes a production database with it. This App makes the pause ergonomic.
    The underlying flow produces a dry-run plan — rows touched, lock estimate,
    statement type — and the console shows that plan next to the approve button,
    with the approver and ticket reference captured on the resume form. After the
    apply, the same screen shows inputs, outputs, and the execution log, so the
    console is also the record of what happened.

    **How it works**
      - An engineer submits the migration id and target table from the OPEN form
      - The flow generates a dry-run plan and pauses (`flowId: run_migration`)
      - The PAUSE view renders the plan, lock warning, and approver form side by side
      - Approve resumes the flow to apply; abort cancels it before any statement runs
      - SUCCESS shows inputs and outputs; FAILURE surfaces rollback guidance and the log

    **Configuration:**
      - Point `flowId` at your migration flow — it must expose plan variables
        (`estimated_rows`, `estimated_lock_seconds`, `statement_type`) and pause
        for resume before the apply task
      - Adjust the plan table rows if your flow names the variables differently
      - Set access to PUBLIC if the whole engineering org should self-serve
      - Tighten the warning copy for your database engine's locking semantics

    This App brings the review step of a change-management process into the same
    interface that runs it — no ticket screenshots, no copy-pasted plan output.

    This blueprint has been created by [RudraMalvankar](https://github.com/RudraMalvankar)
  tags:
    - Getting Started
  ee: true
  demo: false
  metaDescription: |
    Kestra App for database migrations: preview the dry-run plan and lock
    estimate, approve or abort with an audit trail, then watch the apply.
