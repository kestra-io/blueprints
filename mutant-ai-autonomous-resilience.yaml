        \    \"RECLAIM_EPHEMERAL_RESOURCE\": \"RECLAIM_EPHEMERAL_RESOURCE\",

        \    \"RESTORE_BASELINE_STATE\": \"RESTORE_BASELINE_STATE\",

        }

        action = strategy_actions.get(strategy, \"RESTORE_BASELINE_STATE\")


        patch_source = \"\\n\".join([

        \    \"def apply_healing_patch(state):\",

