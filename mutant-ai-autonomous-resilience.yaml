        \    \"reversible\": reversible,

        \    \"risk_approved\": risk_approved,

        \    \"prior_recovery_verified\": verification.get(\"verified\") is True,

        \    \"external_infrastructure_access\": False,

        \    \"patch_file\": \"healing_patch_candidate.py\",

        \    \"dependency_recovery_passed\": dependency_recovery.get(\"dependency_recovery_passed\") is True,

        \    \"requires_step_14_validation\": True,

        \    \"generation_allowed\": (

        \        sandbox_scope

        \        and reversible

        \        and risk_approved

        \        and dependency_recovery.get(\"dependency_recovery_passed\") is True

        \    ),

        }


