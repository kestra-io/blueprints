        )


        isolated_recovery = False

        dependency_resolved = False

        validation_passed = False

        recovery_error = None


        if recovery_authorized:

        \    try:

        \        with tempfile.TemporaryDirectory(prefix=\"mutant_ai_dependency_recovery_\") as tmp:

        \            recovery_dir = Path(tmp)

        \            manifest = recovery_dir / \"dependency_manifest.json\"

        \            manifest.write_text(json.dumps({

        \                \"dependency\": dependency,

        \                \"source\": \"LOCAL_SANDBOX_FIXTURE\",

        \                \"strategy\": strategy,

        \                \"network_access\": False,

        \            }, indent=2))

        \            isolated_recovery = recovery_dir.exists()

        \            dependency_resolved = manifest.exists() and manifest.read_text() != \"\"

        \            validation_passed = dependency_resolved and isolated_recovery

        \    except Exception as exc:

