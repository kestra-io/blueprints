        \    hashes[name] = hashlib.sha256(path.read_bytes()).hexdigest()


        canonical_manifest = json.dumps(

        \    hashes, sort_keys=True, separators=(\",\", \":\")

        ).encode(\"utf-8\")

        manifest_hash = hashlib.sha256(canonical_manifest).hexdigest()


        accountability = {

        \    \"controller\": \"STEP_19_CRYPTOGRAPHIC_ACCOUNTABILITY_CHECK\",

        \    \"created_at_epoch\": int(time.time()),

        \    \"algorithm\": \"SHA-256\",

        \    \"scope\": \"MISSION_EVIDENCE_ARTIFACTS\",

        \    \"files_hashed\": len(hashes),

        \    \"expected_files\": len(files),

        \    \"missing_files\": missing,

        \    \"artifact_hashes\": hashes,

        \    \"manifest_hash\": manifest_hash,

        \    \"integrity_check_passed\": len(missing) == 0 and len(hashes) == len(files),

        \    \"external_infrastructure_access\": False,

        \    \"cryptographic_signature\": False,

        \    \"signature_note\": \"Integrity hashing only; no private-key signing is performed.\",

        }


        Path(\"cryptographic_accountability.json\").write_text(

        \    json.dumps(accountability, indent=2)

        )


        print(\"============================================\")

        print(\" CRYPTOGRAPHIC ACCOUNTABILITY — STEP 19 \")

        print(\"============================================\")

        print(\"Algorithm:\", accountability[\"algorithm\"])

        print(\"Files hashed:\", accountability[\"files_hashed\"], \"/\", accountability[\"expected_files\"])

        print(\"Missing files:\", accountability[\"missing_files\"])

        print(\"Manifest SHA-256:\", accountability[\"manifest_hash\"])

        print(\"Integrity check passed:\", accountability[\"integrity_check_passed\"])

        print(\"External infrastructure access:\", False)

        print(\"Private-key signature:\", False)

        PY\n"
    outputFiles:
      - cryptographic_accountability.json
  - id: compliance_metadata_update
    type: io.kestra.plugin.scripts.shell.Commands
    description: Generate compliance metadata from verified mission artifacts; this is evidence metadata, not external certification.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    inputFiles:
      mission_plan.json: '{{ outputs.mission_commander.outputFiles[''mission_plan.json''] }}'
      risk.json: '{{ outputs.risk_agent.outputFiles[''risk.json''] }}'
      recovery_exit.json: '{{ outputs.verified_recovery_exit.outputFiles[''recovery_exit.json''] }}'
      infrastructure_validation.json: '{{ outputs.automated_infrastructure_validation.outputFiles[''infrastructure_validation.json''] }}'
      artifact_cleanup.json: '{{ outputs.ephemeral_artifact_cleanup.outputFiles[''artifact_cleanup.json''] }}'
      cryptographic_accountability.json: '{{ outputs.cryptographic_accountability_check.outputFiles[''cryptographic_accountability.json''] }}'
    commands:
      - "set -eu

        python3 - <<'PY'

        import json, os, time

        from pathlib import Path


        def read(name):

        \    return json.loads(Path(name).read_text())


        plan = read('mission_plan.json')

        risk = read('risk.json')

        recovery_exit = read('recovery_exit.json')

        infra = read('infrastructure_validation.json')

        cleanup = read('artifact_cleanup.json')

        crypto = read('cryptographic_accountability.json')


        checks = {

        \    'mission_policy_approved': plan.get('policy') == 'APPROVED',

        \    'risk_approved': risk.get('approved') is True,

        \    'sandbox_scope_enforced': risk.get('sandbox_scope') is True,

        \    'external_infrastructure_access_disabled': risk.get('external_infrastructure_access') is False,

        \    'verified_recovery_exit': recovery_exit.get('exit_code') == 0,

        \    'infrastructure_validation_passed': infra.get('validation_passed') is True,

        \    'artifact_cleanup_passed': cleanup.get('artifact_cleanup_passed') is True,

        \    'evidence_integrity_passed': crypto.get('integrity_check_passed') is True,

        \    'no_missing_evidence_files': not crypto.get('missing_files'),

        }

        failures = [name for name, passed in checks.items() if not passed]

        metadata = {

        \    'controller': 'STEP_9_COMPLIANCE_METADATA_UPDATE',

        \    'created_at_epoch': int(time.time()),

        \    'mission_id': 'mutant_ai_autonomous_resilience',

        \    'execution_id': os.environ.get('KESTRA_EXECUTION_ID', 'available-in-kestra-execution-context'),

        \    'selected_mutation': plan.get('selected_mutation'),

        \    'policy_mode': plan.get('safety_mode', 'strict'),

        \    'metadata_schema_version': '1.0',

        \    'compliance_profile': 'MUTANT_AI_SANDBOX_SAFETY_PROFILE',

        \    'checks': checks,

        \    'checks_passed': sum(1 for passed in checks.values() if passed),

        \    'checks_total': len(checks),

        \    'failed_checks': failures,

        \    'compliance_status': 'PASS' if not failures else 'FAIL',

        \    'infrastructure_validation_manifest_hash': crypto.get('manifest_hash'),

        \    'evidence_integrity_algorithm': crypto.get('algorithm'),

        \    'evidence_integrity_passed': crypto.get('integrity_check_passed') is True,

        \    'sandbox_scope': True,

        \    'external_infrastructure_access': False,

        \    'is_external_certification': False,

        \    'notice': 'Workflow-generated compliance metadata; not a legal, regulatory, or third-party certification.'

        }

        Path('compliance_metadata.json').write_text(json.dumps(metadata, indent=2))

        print('=== COMPLIANCE METADATA UPDATE — STEP 9 ===')

        print('Checks passed:', metadata['checks_passed'], '/', metadata['checks_total'])

        print('Failed checks:', metadata['failed_checks'])

        print('Compliance status:', metadata['compliance_status'])

        print('Evidence integrity passed:', metadata['evidence_integrity_passed'])

        print('Sandbox scope:', metadata['sandbox_scope'])

        print('External infrastructure access:', metadata['external_infrastructure_access'])

        print('External certification:', metadata['is_external_certification'])

        PY\n"
    outputFiles:
      - compliance_metadata.json
  - id: cryptographic_open_source_signoff
    type: io.kestra.plugin.scripts.shell.Commands
    description: Create an evidence-based open-source readiness attestation. This is not a private-key digital signature or official Kestra approval.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    inputFiles:
      mission_plan.json: '{{ outputs.mission_commander.outputFiles[''mission_plan.json''] }}'
      cryptographic_accountability.json: '{{ outputs.cryptographic_accountability_check.outputFiles[''cryptographic_accountability.json''] }}'
      compliance_metadata.json: '{{ outputs.compliance_metadata_update.outputFiles[''compliance_metadata.json''] }}'
      infrastructure_validation.json: '{{ outputs.automated_infrastructure_validation.outputFiles[''infrastructure_validation.json''] }}'
      recovery_exit.json: '{{ outputs.verified_recovery_exit.outputFiles[''recovery_exit.json''] }}'
      artifact_cleanup.json: '{{ outputs.ephemeral_artifact_cleanup.outputFiles[''artifact_cleanup.json''] }}'
      patch_activation.json: '{{ outputs.closed_loop_patch_activation.outputFiles[''patch_activation.json''] }}'
      dependency_recovery.json: '{{ outputs.automated_dependency_recovery.outputFiles[''dependency_recovery.json''] }}'
    commands:
      - "set -eu

        python3 - <<'PY'

        import hashlib

        import json

        import os

        import time

        from pathlib import Path


        def read(name):

        \    return json.loads(Path(name).read_text())


        plan = read('mission_plan.json')

        crypto = read('cryptographic_accountability.json')

        compliance = read('compliance_metadata.json')

        infrastructure = read('infrastructure_validation.json')

        recovery_exit = read('recovery_exit.json')

        cleanup = read('artifact_cleanup.json')

        activation = read('patch_activation.json')

        dependency = read('dependency_recovery.json')


        checks = {

        \    'mission_policy_approved': plan.get('policy') == 'APPROVED',

        \    'evidence_integrity_passed': crypto.get('integrity_check_passed') is True,

        \    'no_missing_evidence_files': not crypto.get('missing_files'),

        \    'compliance_metadata_passed': compliance.get('compliance_status') == 'PASS',

        \    'infrastructure_validation_passed': infrastructure.get('validation_passed') is True,

        \    'verified_recovery_exit': recovery_exit.get('exit_code') == 0,

        \    'artifact_cleanup_passed': cleanup.get('artifact_cleanup_passed') is True,

        \    'patch_activation_passed': activation.get('activation_passed') is True,

        \    'dependency_recovery_passed': dependency.get('dependency_recovery_passed') is True,

        \    'sandbox_scope_enforced': plan.get('safety_mode', 'strict') == 'strict',

        }

        failed = [name for name, passed in checks.items() if not passed]

        source_revision = os.environ.get('GIT_COMMIT') or os.environ.get('SOURCE_REVISION') or 'NOT_PROVIDED_AT_RUNTIME'


        payload = {

        \    'controller': 'STEP_10_CRYPTOGRAPHIC_OPEN_SOURCE_SIGNOFF',

        \    'created_at_epoch': int(time.time()),

        \    'mission_id': 'mutant_ai_autonomous_resilience',

        \    'selected_mutation': plan.get('selected_mutation'),

        \    'source_revision': source_revision,

        \    'source_revision_verified': source_revision != 'NOT_PROVIDED_AT_RUNTIME',

        \    'compliance_status': compliance.get('compliance_status'),

        \    'infrastructure_validation_passed': infrastructure.get('validation_passed') is True,

        \    'evidence_manifest_algorithm': crypto.get('algorithm'),

        \    'evidence_manifest_hash': crypto.get('manifest_hash'),

        \    'checks': checks,

        \    'checks_passed': sum(1 for passed in checks.values() if passed),

        \    'checks_total': len(checks),

        \    'failed_checks': failed,

        \    'signoff_status': 'READY_FOR_OPEN_SOURCE_REVIEW' if not failed else 'BLOCKED',

        \    'official_kestra_approval': False,

        \    'private_key_digital_signature': False,

        \    'sandbox_scope': True,

        \    'external_infrastructure_access': False,

        \    'notice': 'This is a workflow-generated readiness attestation, not a private-key digital signature, third-party certification, or official Kestra approval.'

        }

        canonical = json.dumps(payload, sort_keys=True, separators=(',', ':')).encode('utf-8')

        payload['signoff_record_sha256'] = hashlib.sha256(canonical).hexdigest()

        Path('open_source_signoff.json').write_text(json.dumps(payload, indent=2))

        print('=== CRYPTOGRAPHIC OPEN-SOURCE SIGN-OFF — STEP 10 ===')

        print('Checks passed:', payload['checks_passed'], '/', payload['checks_total'])

        print('Failed checks:', payload['failed_checks'])

        print('Evidence manifest SHA-256:', payload['evidence_manifest_hash'])

        print('Sign-off record SHA-256:', payload['signoff_record_sha256'])

        print('Source revision:', payload['source_revision'])

        print('Sign-off status:', payload['signoff_status'])

        print('Private-key digital signature:', payload['private_key_digital_signature'])

        print('Official Kestra approval:', payload['official_kestra_approval'])

        PY"
    outputFiles:
      - open_source_signoff.json
  - id: mission_score
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    inputFiles:
      verification.json: '{{ outputs.verification_agent.outputFiles[''verification.json''] }}'
      recovery_exit.json: '{{ outputs.verified_recovery_exit.outputFiles[''recovery_exit.json''] }}'
      recovery_result.json: '{{ outputs.autonomous_recovery.outputFiles[''recovery_result.json''] }}'
      risk.json: '{{ outputs.risk_agent.outputFiles[''risk.json''] }}'
      micro_chaos_validation.json: '{{ outputs.micro_chaos_validation.outputFiles[''micro_chaos_validation.json''] }}'
      patch_activation.json: '{{ outputs.closed_loop_patch_activation.outputFiles[''patch_activation.json''] }}'
      patch_validation.json: '{{ outputs.rapid_patch_validation.outputFiles[''patch_validation.json''] }}'
      dependency_recovery.json: '{{ outputs.automated_dependency_recovery.outputFiles[''dependency_recovery.json''] }}'
      artifact_cleanup.json: '{{ outputs.ephemeral_artifact_cleanup.outputFiles[''artifact_cleanup.json''] }}'
      drift_interception.json: '{{ outputs.continuous_drift_interception.outputFiles[''drift_interception.json''] }}'
      state_delta_verification.json: '{{ outputs.real_time_state_delta_verification.outputFiles[''state_delta_verification.json''] }}'
      infrastructure_validation.json: '{{ outputs.automated_infrastructure_validation.outputFiles[''infrastructure_validation.json''] }}'
      compliance_metadata.json: '{{ outputs.compliance_metadata_update.outputFiles[''compliance_metadata.json''] }}'
      open_source_signoff.json: '{{ outputs.cryptographic_open_source_signoff.outputFiles[''open_source_signoff.json''] }}'
    commands:
      - "

        set -e


        python3 - <<'PY'


        import json


        from pathlib import Path


        verification = json.loads(


        \    Path(\"verification.json\").read_text()


        )


        recovery_exit = json.loads(


        \    Path(\"recovery_exit.json\").read_text()


        )


        recovery = json.loads(


        \    Path(\"recovery_result.json\").read_text()


        )


        risk = json.loads(


        \    Path(\"risk.json\").read_text()


        )


        micro_chaos = json.loads(


        \    Path(\"micro_chaos_validation.json\").read_text()


        )


        patch_validation = json.loads(


        \    Path(\"patch_validation.json\").read_text()


        )


        patch_activation = json.loads(


        \    Path(\"patch_activation.json\").read_text()


        )


        dependency_recovery = json.loads(Path(\"dependency_recovery.json\").read_text())

        artifact_cleanup = json.loads(Path(\"artifact_cleanup.json\").read_text())

        drift_interception = json.loads(Path(\"drift_interception.json\").read_text())

        state_delta_verification = json.loads(Path(\"state_delta_verification.json\").read_text())

        infrastructure_validation = json.loads(Path(\"infrastructure_validation.json\").read_text()); compliance_metadata = json.loads(Path(\"compliance_metadata.json\").read_text())

        open_source_signoff = json.loads(Path(\"open_source_signoff.json\").read_text())


        score = 100


        attempts = recovery[\"attempts_used\"]


        if attempts > 1:


        \    score -= (attempts - 1) * 3


        if recovery[\"rollback_triggered\"]:


        \    score -= 2


        if not verification[\"verified\"]:


        \    score -= 30


        if not risk[\"approved\"]:


        \    score -= 40


        if not patch_activation.get(\"activation_passed\"):


        \    score -= 25


        if not infrastructure_validation.get(\"validation_passed\"):


        \    score -= 20


        if open_source_signoff.get(\"signoff_status\") != \"READY_FOR_OPEN_SOURCE_REVIEW\":


        \    score -= 20


        score = max(0, score)


        if score >= 90:


        \    rating = \"EXCELLENT\"


        elif score >= 75:


        \    rating = \"STRONG\"


        elif score >= 60:


        \    rating = \"DEVELOPING\"


        else:


        \    rating = \"FAILED\"


        result = {


        \    \"resilience_score\": score,


        \    \"rating\": rating,


        \    \"detection\": 20,


        \    \"diagnosis\": 15,


        \    \"safety\": 20,


        \    \"recovery\": 20,


        \    \"verification\": 15,


        \    \"cleanup\": 10,


        \    \"recovery_attempts\": attempts,


        \    \"rollback_triggered\": recovery[\"rollback_triggered\"],


        \    \"verified\": verification[\"verified\"],


        \    \"verified_recovery_exit\": recovery_exit[\"exit_code\"] == 0,


        \    \"micro_chaos_validation\": micro_chaos[\"validation_passed\"],


        \    \"dynamic_patch_validation\": patch_validation[\"validation_passed\"],

        \    \"dependency_recovery\": dependency_recovery[\"dependency_recovery_passed\"],


        \    \"ephemeral_artifact_cleanup\": artifact_cleanup[\"artifact_cleanup_passed\"],

        \    \"continuous_drift_interception\": drift_interception[\"interception_passed\"],

        \    \"real_time_state_delta_verification\": state_delta_verification[\"verification_passed\"],

        \    \"state_delta_count\": state_delta_verification[\"delta_count\"],

        \    \"unexpected_drift_detected\": drift_interception[\"unexpected_drift_detected\"],


        \    \"micro_chaos_scenarios\": micro_chaos[\"scenarios_tested\"],


        \    \"compliance_metadata_passed\": compliance_metadata.get(\"compliance_status\") == \"PASS\",

        \    \"compliance_failed_checks\": compliance_metadata.get(\"failed_checks\", []),


        \    \"open_source_signoff_status\": open_source_signoff.get(\"signoff_status\"),


        \    \"open_source_signoff_passed\": open_source_signoff.get(\"signoff_status\") == \"READY_FOR_OPEN_SOURCE_REVIEW\",


        \    \"open_source_signoff_hash\": open_source_signoff.get(\"signoff_record_sha256\"),

        \    \"exit_code\": recovery_exit[\"exit_code\"]


        }


        Path(\"mission_score.json\").write_text(


        \    json.dumps(result, indent=2)


        )


        print(\"=== MISSION SCORE ===\")


        print(\"Resilience Score:\", score, \"/100\")


        print(\"Rating:\", rating)


        print(\"Recovery Attempts:\", attempts)


        print(\"Rollback Triggered:\", recovery[\"rollback_triggered\"])


        print(\"Verified:\", verification[\"verified\"])


        print(\"Verified Recovery Exit:\", recovery_exit[\"exit_code\"])


        PY\n"
    outputFiles:
      - mission_score.json
