        risk = json.loads(Path(\"risk.json\").read_text())

        generation = json.loads(Path(\"patch_generation.json\").read_text())


        candidate = Path(\"healing_patch_candidate.py\")

        compile_passed = True

        compile_error = None

        try:

        \    py_compile.compile(str(candidate), doraise=True)

        except Exception as exc:

        \    compile_passed = False

        \    compile_error = str(exc)


        behavior_passed = False

        generated_action = None

        if compile_passed:

        \    namespace = {}

        \    exec(compile(candidate.read_text(), candidate.name, \"exec\"), namespace)

        \    source_state = dict(state)

        \    source_state[\"health\"] = \"UNHEALTHY\"

        \    source_state[\"mutation_active\"] = True

        \    patched_state = namespace[\"apply_healing_patch\"](source_state)

        \    generated_action = patched_state.get(\"healing_action\")

        \    behavior_passed = (

        \        patched_state.get(\"health\") == \"HEALTHY\"

        \        and patched_state.get(\"mutation_active\") is False

        \        and source_state.get(\"health\") == \"UNHEALTHY\"

        \        and generated_action == generation.get(\"generated_action\")

        \    )


        sandbox_only = (

        \    risk.get(\"approved\") is True

        \    and diagnosis.get(\"bounded_scope\") == \"EPHEMERAL_SANDBOX\"

        \    and generation.get(\"external_infrastructure_access\") is False

