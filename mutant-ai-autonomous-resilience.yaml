        \    \"sandbox_scope\": True,

        \    \"dependency_identified\": dependency,

        \    \"source\": \"LOCAL_SANDBOX_FIXTURE\",

        \    \"recovery_authorized\": recovery_authorized,

        \    \"isolated_recovery_environment\": isolated_recovery,

        \    \"dependency_resolved\": dependency_resolved,

        \    \"validation_passed\": validation_passed,

        \    \"network_access\": False,

        \    \"external_infrastructure_access\": False,

        \    \"reversible\": diagnosis.get(\"reversible\") is True,

