        \            health = \"DEGRADED\"


        \            verified = False


        \            result = \"ALTERNATE_RECOVERY_INSUFFICIENT\"


        \        else:


        \            health = \"HEALTHY\"


        \            verified = True


        \            result = \"ALTERNATE_RECOVERY_SUCCESS\"


        \    else:


        \        strategy = \"ROLLBACK_TO_BASELINE\"


        \        health = \"HEALTHY\"


        \        verified = True


        \        rollback_triggered = True


        \        result = \"ROLLBACK_SUCCESS\"


        \    record = {


        \        \"attempt\": attempt,


        \        \"strategy\": strategy,


        \        \"result\": result,


        \        \"health\": health,


        \        \"verified\": verified


