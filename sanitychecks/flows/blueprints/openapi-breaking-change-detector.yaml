id: openapi-breaking-change-detector-sanitycheck
namespace: sanitycheck.blueprints
description: |
  Self-contained deterministic sanity check for the OpenAPI breaking change detector.
  Uses inline baseline and candidate specifications to verify that oasdiff detects
  exactly 2 expected breaking changes without requiring external network access or credentials.

tasks:
  - id: test_contract_drift
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: Isolated workspace containing synthetic baseline and candidate specifications.
    inputFiles:
      base.yaml: |
        openapi: 3.0.0
        info:
          title: Items API
          version: 1.0.0
        paths:
          /items:
            get:
              summary: Get items
              responses:
                '200':
                  description: OK
                  content:
                    application/json:
                      schema:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                          required:
                            - id
                            - name

      candidate.yaml: |
        openapi: 3.0.0
        info:
          title: Items API
          version: 1.0.1
        paths:
          /items:
            get:
              summary: Get items
              responses:
                '200':
                  description: OK
                  content:
                    application/json:
                      schema:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                          required:
                            - id

    tasks:
      - id: run_oasdiff
        type: io.kestra.plugin.scripts.shell.Commands
        description: Execute oasdiff breaking check.
        containerImage: tufin/oasdiff:v1.33.0
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        outputFiles:
          - breaking.json
        commands:
          - oasdiff breaking base.yaml candidate.yaml -f json > breaking.json

      - id: assert_verdict
        type: io.kestra.plugin.scripts.python.Script
        description: Verify that exactly 2 breaking changes are identified.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        script: |
          import json
          import os

          with open("breaking.json", "r", encoding="utf-8") as f:
              breaking_data = json.load(f)

          breaking_changes = [x for x in breaking_data if x.get("level", 3) >= 3]
          breaking_count = len(breaking_changes)

          # Expected:
          # 1. response-property-type-changed (id: integer -> string)
          # 2. response-required-property-removed (name removed)
          assert breaking_count == 2, f"Expected 2 breaking changes, got {breaking_count}: {breaking_changes}"
          change_ids = sorted([x["id"] for x in breaking_changes])
          assert change_ids == ["response-property-type-changed", "response-required-property-removed"], f"Unexpected change IDs: {change_ids}"

          print("SANITY CHECK PASSED: Detected exactly 2 expected breaking changes.")
